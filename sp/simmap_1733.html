<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Around The Galaxy [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.959, "c": "種", "n": "Around The Galaxy [A]  n=3217 cos1.00 難-0.96", "s": 0.885, "f": 0}, {"x": 0.87, "y": -0.894, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3539 cos0.87 難-0.89", "s": 0.973, "f": 0}, {"x": 0.919, "y": -1.228, "c": "近傍", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [A]  n=3367 cos0.92 難-1.23", "s": 0.926, "f": 0}, {"x": 0.821, "y": -0.945, "c": "近傍", "n": "Show Me All Your Love [A]  n=1140 cos0.82 難-0.95", "s": 0.314, "f": 0}, {"x": 0.833, "y": -0.833, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3267 cos0.83 難-0.83", "s": 0.899, "f": 0}, {"x": 0.949, "y": -0.651, "c": "近傍", "n": "ウツシミウツシ [A]  n=2323 cos0.95 難-0.65", "s": 0.639, "f": 0}, {"x": 0.842, "y": -1.12, "c": "近傍", "n": "Synergy For Angels [A]  n=3472 cos0.84 難-1.12", "s": 0.955, "f": 0}, {"x": 0.832, "y": -0.827, "c": "近傍", "n": "ANDROMEDA [A]  n=3477 cos0.83 難-0.83", "s": 0.956, "f": 0}, {"x": 0.958, "y": -1.285, "c": "近傍", "n": "無意識のフィロソフィア [A]  n=2434 cos0.96 難-1.29", "s": 0.669, "f": 0}, {"x": 0.84, "y": -0.77, "c": "近傍", "n": "INORI [A]  n=3389 cos0.84 難-0.77", "s": 0.932, "f": 0}, {"x": 0.974, "y": -0.621, "c": "近傍", "n": "Kung-fu Empire [A]  n=3451 cos0.97 難-0.62", "s": 0.949, "f": 0}, {"x": 0.821, "y": -0.804, "c": "近傍", "n": "the trigger of innocence [L]  n=2058 cos0.82 難-0.80", "s": 0.566, "f": 0}, {"x": 0.807, "y": -0.866, "c": "近傍", "n": "Constellation [A]  n=1120 cos0.81 難-0.87", "s": 0.308, "f": 0}, {"x": 0.816, "y": -1.137, "c": "近傍", "n": "X-ray binary [A]  n=2507 cos0.82 難-1.14", "s": 0.689, "f": 0}, {"x": 0.807, "y": -0.809, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3636 cos0.81 難-0.81", "s": 1.0, "f": 0}, {"x": 0.896, "y": -1.283, "c": "近傍", "n": "Danza Aestas [A]  n=2296 cos0.90 難-1.28", "s": 0.631, "f": 0}, {"x": 0.829, "y": -0.74, "c": "近傍", "n": "Moving on [A]  n=2999 cos0.83 難-0.74", "s": 0.825, "f": 0}, {"x": 0.787, "y": -0.985, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3406 cos0.79 難-0.98", "s": 0.937, "f": 0}, {"x": 0.798, "y": -1.122, "c": "近傍", "n": "夢縁 [A]  n=1894 cos0.80 難-1.12", "s": 0.521, "f": 0}, {"x": 0.817, "y": -1.2, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [A]  n=1878 cos0.82 難-1.20", "s": 0.517, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.3009150622266249}, {"a": 0, "b": 2, "w": 0.4439415128845322}, {"a": 0, "b": 3, "w": 0.23025131860313464}, {"a": 0, "b": 4, "w": 0.1961912718704707}, {"a": 0, "b": 5, "w": 0.43168389241509864}, {"a": 0, "b": 6, "w": 0.2700520385039161}, {"a": 0, "b": 7, "w": 0.17988593832238575}, {"a": 0, "b": 8, "w": 0.5845969522187974}, {"a": 0, "b": 9, "w": 0.10434797276594587}, {"a": 0, "b": 10, "w": 0.47827861982079845}, {"a": 0, "b": 11, "w": 0.03230963360024175}, {"a": 0, "b": 12, "w": 0.20490624201739738}, {"a": 0, "b": 13, "w": 0.2142770809639667}, {"a": 0, "b": 14, "w": 5.150693205280277e-10}, {"a": 0, "b": 15, "w": 0.38781927879934874}, {"a": 0, "b": 16, "w": 0.23616845644053774}, {"a": 0, "b": 17, "w": 0.16779808134846663}, {"a": 0, "b": 18, "w": 0.1888350272988608}, {"a": 0, "b": 19, "w": 0.19520769115719205}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.770,hiX=1.017,loY=-1.339,hiY=-0.567;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
