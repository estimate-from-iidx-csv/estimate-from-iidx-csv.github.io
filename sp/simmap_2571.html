<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}

 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

 <div id="legend"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.575, "c": "種", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [A]  n=2932 cos1.00 難1.58", "s": 0.959, "f": 0}, {"x": 0.924, "y": 1.704, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1136 cos0.92 難1.70", "s": 0.371, "f": 0}, {"x": 0.936, "y": 1.722, "c": "近傍", "n": "IX [A]  n=2714 cos0.94 難1.72", "s": 0.888, "f": 0}, {"x": 0.858, "y": 1.521, "c": "近傍", "n": "GuNGNiR [A]  n=3058 cos0.86 難1.52", "s": 1.0, "f": 0}, {"x": 0.863, "y": 1.497, "c": "近傍", "n": "voltississimo [A]  n=2570 cos0.86 難1.50", "s": 0.84, "f": 0}, {"x": 0.85, "y": 1.605, "c": "近傍", "n": "Sigmund [A]  n=3021 cos0.85 難1.60", "s": 0.988, "f": 0}, {"x": 0.863, "y": 1.669, "c": "近傍", "n": "≡+≡ [L]  n=729 cos0.86 難1.67", "s": 0.238, "f": 0}, {"x": 0.837, "y": 1.656, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2955 cos0.84 難1.66", "s": 0.966, "f": 0}, {"x": 0.861, "y": 1.712, "c": "近傍", "n": "Confiserie [A]  n=2891 cos0.86 難1.71", "s": 0.945, "f": 0}, {"x": 0.827, "y": 1.622, "c": "近傍", "n": "BroGamer [L]  n=1952 cos0.83 難1.62", "s": 0.638, "f": 0}, {"x": 0.827, "y": 1.624, "c": "近傍", "n": "嘆きの樹 [A]  n=3004 cos0.83 難1.62", "s": 0.982, "f": 0}, {"x": 0.828, "y": 1.501, "c": "近傍", "n": "シムルグの目醒め [A]  n=2825 cos0.83 難1.50", "s": 0.924, "f": 0}, {"x": 0.849, "y": 1.439, "c": "近傍", "n": "Ancient Scapes [L]  n=2611 cos0.85 難1.44", "s": 0.854, "f": 0}, {"x": 0.846, "y": 1.722, "c": "近傍", "n": "色を喪った街 [A]  n=606 cos0.85 難1.72", "s": 0.198, "f": 0}, {"x": 0.884, "y": 1.379, "c": "近傍", "n": "CADENZA [A]  n=1348 cos0.88 難1.38", "s": 0.441, "f": 0}, {"x": 0.807, "y": 1.586, "c": "近傍", "n": "Amor∞Fati [A]  n=542 cos0.81 難1.59", "s": 0.177, "f": 0}, {"x": 0.8, "y": 1.591, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2324 cos0.80 難1.59", "s": 0.76, "f": 0}, {"x": 0.87, "y": 1.775, "c": "近傍", "n": "Feel The Beat [L]  n=2727 cos0.87 難1.78", "s": 0.892, "f": 0}, {"x": 0.888, "y": 1.795, "c": "近傍", "n": "Elemental Creation [A]  n=2822 cos0.89 難1.80", "s": 0.923, "f": 0}, {"x": 0.792, "y": 1.588, "c": "近傍", "n": "Vulnerability [A]  n=1134 cos0.79 難1.59", "s": 0.371, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.5520764963408615}, {"a": 0, "b": 2, "w": 0.5169214817768992}, {"a": 0, "b": 3, "w": 0.3670531304622122}, {"a": 0, "b": 4, "w": 0.4109530521618021}, {"a": 0, "b": 5, "w": 0.3835227651315628}, {"a": 0, "b": 6, "w": 2.4741075854706196e-10}, {"a": 0, "b": 7, "w": 0.35985953622349354}, {"a": 0, "b": 8, "w": 0.40653905201317675}, {"a": 0, "b": 9, "w": 0.007653362293967292}, {"a": 0, "b": 10, "w": 0.3080673603981475}, {"a": 0, "b": 11, "w": 0.27079629865904287}, {"a": 0, "b": 12, "w": 0.38312587706699075}, {"a": 0, "b": 13, "w": 0.2568454582161419}, {"a": 0, "b": 14, "w": 0.41197936506840693}, {"a": 0, "b": 15, "w": 0.29883697185967784}, {"a": 0, "b": 16, "w": 0.25199573853506807}, {"a": 0, "b": 17, "w": 0.33662986996309774}, {"a": 0, "b": 18, "w": 0.3216700115553731}, {"a": 0, "b": 19, "w": 0.262921335307327}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.775,hiX=1.017,loY=1.346,hiY=1.828;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
