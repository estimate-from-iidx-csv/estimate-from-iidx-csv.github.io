<style>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.124, "c": "種", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3373 cos1.00 難0.12", "s": 0.958, "f": 0}, {"x": 0.866, "y": 0.356, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2494 cos0.87 難0.36", "s": 0.709, "f": 0}, {"x": 0.811, "y": 0.312, "c": "近傍", "n": "新宝島 [L]  n=1361 cos0.81 難0.31", "s": 0.387, "f": 0}, {"x": 0.822, "y": 0.411, "c": "近傍", "n": "Triple Cross [A]  n=2531 cos0.82 難0.41", "s": 0.719, "f": 0}, {"x": 0.757, "y": 0.111, "c": "近傍", "n": "Ou Legends [A]  n=1985 cos0.76 難0.11", "s": 0.564, "f": 0}, {"x": 0.804, "y": -0.27, "c": "近傍", "n": "POODLE [L]  n=2543 cos0.80 難-0.27", "s": 0.722, "f": 0}, {"x": 0.687, "y": 0.148, "c": "近傍", "n": "海神 [A]  n=3520 cos0.69 難0.15", "s": 1.0, "f": 0}, {"x": 0.703, "y": -0.151, "c": "近傍", "n": "神のシナリオ [A]  n=2032 cos0.70 難-0.15", "s": 0.577, "f": 0}, {"x": 0.681, "y": 0.278, "c": "近傍", "n": "Million Dollar [A]  n=1546 cos0.68 難0.28", "s": 0.439, "f": 0}, {"x": 0.749, "y": 0.603, "c": "近傍", "n": "Vitrum [A]  n=2526 cos0.75 難0.60", "s": 0.718, "f": 0}, {"x": 0.661, "y": 0.18, "c": "近傍", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [L]  n=1805 cos0.66 難0.18", "s": 0.513, "f": 0}, {"x": 0.775, "y": 0.677, "c": "近傍", "n": "深淵に捧ぐレクイエム [A]  n=2923 cos0.77 難0.68", "s": 0.83, "f": 0}, {"x": 0.678, "y": 0.433, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3360 cos0.68 難0.43", "s": 0.955, "f": 0}, {"x": 0.75, "y": 0.663, "c": "近傍", "n": "Visterhv [A]  n=2965 cos0.75 難0.66", "s": 0.842, "f": 0}, {"x": 0.657, "y": 0.348, "c": "近傍", "n": "Ember Lights [L]  n=777 cos0.66 難0.35", "s": 0.221, "f": 0}, {"x": 0.639, "y": 0.073, "c": "近傍", "n": "禊 [A]  n=2594 cos0.64 難0.07", "s": 0.737, "f": 0}, {"x": 0.749, "y": 0.677, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3328 cos0.75 難0.68", "s": 0.945, "f": 0}, {"x": 0.655, "y": -0.119, "c": "近傍", "n": "Aqvion [A]  n=1134 cos0.66 難-0.12", "s": 0.322, "f": 0}, {"x": 0.636, "y": 0.072, "c": "近傍", "n": "Umbral [L]  n=2045 cos0.64 難0.07", "s": 0.581, "f": 0}, {"x": 0.634, "y": 0.328, "c": "近傍", "n": "entelecheia [A]  n=3408 cos0.63 難0.33", "s": 0.968, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.6505600372662703}, {"a": 0, "b": 2, "w": 2.9201063789230375e-10}, {"a": 0, "b": 3, "w": 0.595528294709663}, {"a": 0, "b": 4, "w": 0.5224404359855599}, {"a": 0, "b": 5, "w": 0.5932492000209668}, {"a": 0, "b": 6, "w": 0.5032551349528431}, {"a": 0, "b": 7, "w": 0.03963177187449274}, {"a": 0, "b": 8, "w": 0.48652087894860263}, {"a": 0, "b": 9, "w": 0.5439981986151513}, {"a": 0, "b": 10, "w": 0.162561544379073}, {"a": 0, "b": 11, "w": 0.10461190082948824}, {"a": 0, "b": 12, "w": 0.4167296627561272}, {"a": 0, "b": 13, "w": 0.18672156353970837}, {"a": 0, "b": 14, "w": 0.3690591228600757}, {"a": 0, "b": 15, "w": 0.4522525512721842}, {"a": 0, "b": 16, "w": 0.316134136867546}, {"a": 0, "b": 17, "w": 0.48357071662175655}, {"a": 0, "b": 18, "w": 0.41910786952052903}, {"a": 0, "b": 19, "w": 0.18915189819401346}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.605,hiX=1.029,loY=-0.346,hiY=0.753;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
