<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">灼熱Beach Side Bunny (かめりあ's "Summertime D'n'B" Remix) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.2, "c": "種", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1557 cos1.00 難1.20", "s": 0.437, "f": 0}, {"x": 0.856, "y": 1.333, "c": "近傍", "n": "Be quiet [L]  n=2098 cos0.86 難1.33", "s": 0.589, "f": 0}, {"x": 0.856, "y": 1.04, "c": "近傍", "n": "Peaktime Booster [A]  n=1902 cos0.86 難1.04", "s": 0.534, "f": 0}, {"x": 0.839, "y": 1.082, "c": "近傍", "n": "Snake Stick [A]  n=3354 cos0.84 難1.08", "s": 0.942, "f": 0}, {"x": 0.803, "y": 1.296, "c": "近傍", "n": "Cult Invitation [A]  n=1250 cos0.80 難1.30", "s": 0.351, "f": 0}, {"x": 0.804, "y": 1.051, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2744 cos0.80 難1.05", "s": 0.771, "f": 0}, {"x": 0.805, "y": 1.411, "c": "近傍", "n": "Level 3 [A]  n=2151 cos0.81 難1.41", "s": 0.604, "f": 0}, {"x": 0.803, "y": 1.418, "c": "近傍", "n": "Don't believe the hype [A]  n=2199 cos0.80 難1.42", "s": 0.618, "f": 0}, {"x": 0.761, "y": 1.319, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3133 cos0.76 難1.32", "s": 0.88, "f": 0}, {"x": 0.81, "y": 0.892, "c": "近傍", "n": "Red. by Full Metal Jacket [A]  n=3561 cos0.81 難0.89", "s": 1.0, "f": 0}, {"x": 0.776, "y": 1.464, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3287 cos0.78 難1.46", "s": 0.923, "f": 0}, {"x": 0.793, "y": 1.521, "c": "近傍", "n": "The Chase [A]  n=3105 cos0.79 難1.52", "s": 0.872, "f": 0}, {"x": 0.724, "y": 1.192, "c": "近傍", "n": "Macho Monky [A]  n=2716 cos0.72 難1.19", "s": 0.763, "f": 0}, {"x": 0.772, "y": 0.861, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2484 cos0.77 難0.86", "s": 0.698, "f": 0}, {"x": 0.794, "y": 0.815, "c": "近傍", "n": "199024club -Re:BounceKiller- [A]  n=3329 cos0.79 難0.82", "s": 0.935, "f": 0}, {"x": 0.766, "y": 1.535, "c": "近傍", "n": "HEROES [A]  n=557 cos0.77 難1.53", "s": 0.156, "f": 0}, {"x": 0.833, "y": 0.742, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3461 cos0.83 難0.74", "s": 0.972, "f": 0}, {"x": 0.775, "y": 0.834, "c": "近傍", "n": "MAD ATTACK [L]  n=1381 cos0.78 難0.83", "s": 0.388, "f": 0}, {"x": 0.815, "y": 0.727, "c": "近傍", "n": "Xperanza [A]  n=3328 cos0.81 難0.73", "s": 0.935, "f": 0}, {"x": 0.807, "y": 0.732, "c": "近傍", "n": "Level 2 [A]  n=2866 cos0.81 難0.73", "s": 0.805, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.36199293968692303}, {"a": 0, "b": 2, "w": 0.4033394519092314}, {"a": 0, "b": 3, "w": 0.3050770906243786}, {"a": 0, "b": 4, "w": 0.31388797983284555}, {"a": 0, "b": 5, "w": 0.3069159135370346}, {"a": 0, "b": 6, "w": 0.20698363093911187}, {"a": 0, "b": 7, "w": 0.26885026117311206}, {"a": 0, "b": 8, "w": 0.25431567375309294}, {"a": 0, "b": 9, "w": 0.10684151872366165}, {"a": 0, "b": 10, "w": 2.355459161051954e-10}, {"a": 0, "b": 11, "w": 0.11713173581708047}, {"a": 0, "b": 12, "w": 0.19967503357534022}, {"a": 0, "b": 13, "w": 0.2427599558655107}, {"a": 0, "b": 14, "w": 0.13117107528360816}, {"a": 0, "b": 15, "w": 0.25635989283312366}, {"a": 0, "b": 16, "w": 0.28503755034598843}, {"a": 0, "b": 17, "w": 0.07957590415322391}, {"a": 0, "b": 18, "w": 0.3266825928362217}, {"a": 0, "b": 19, "w": 0.32033990400931256}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.702,hiX=1.022,loY=0.663,hiY=1.600;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
