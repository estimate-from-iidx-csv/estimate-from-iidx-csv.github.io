<style>

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.504, "c": "種", "n": "eRAseRmOToRpHAntOM [A]  n=3157 cos1.00 難0.50", "s": 0.925, "f": 0}, {"x": 0.716, "y": 1.127, "c": "近傍", "n": "DropZ-Line- [A]  n=2725 cos0.72 難1.13", "s": 0.798, "f": 0}, {"x": 0.57, "y": 0.156, "c": "近傍", "n": "m1dy Deluxe [A]  n=3321 cos0.57 難0.16", "s": 0.973, "f": 0}, {"x": 0.555, "y": 0.518, "c": "近傍", "n": "FANTASTIC THREE [A]  n=3309 cos0.55 難0.52", "s": 0.969, "f": 0}, {"x": 0.551, "y": 0.658, "c": "近傍", "n": "SISYPHUS [A]  n=819 cos0.55 難0.66", "s": 0.24, "f": 0}, {"x": 0.488, "y": 0.632, "c": "近傍", "n": "桜 [A]  n=3288 cos0.49 難0.63", "s": 0.963, "f": 0}, {"x": 0.466, "y": 0.441, "c": "近傍", "n": "Mid-Corner (Magic Maker) [A]  n=1188 cos0.47 難0.44", "s": 0.348, "f": 0}, {"x": 0.486, "y": 1.072, "c": "近傍", "n": "ra'am [A]  n=3103 cos0.49 難1.07", "s": 0.909, "f": 0}, {"x": 0.458, "y": 0.349, "c": "近傍", "n": "最小三倍完全数 [A]  n=2908 cos0.46 難0.35", "s": 0.852, "f": 0}, {"x": 0.458, "y": 0.272, "c": "近傍", "n": "BRAINSTORM [A]  n=3399 cos0.46 難0.27", "s": 0.996, "f": 0}, {"x": 0.45, "y": 0.311, "c": "近傍", "n": "Caterpillar [A]  n=3414 cos0.45 難0.31", "s": 1.0, "f": 0}, {"x": 0.449, "y": 0.691, "c": "近傍", "n": "Theory [A]  n=2904 cos0.45 難0.69", "s": 0.851, "f": 0}, {"x": 0.588, "y": -0.947, "c": "近傍", "n": "apo:llioth [A]  n=2651 cos0.59 難-0.95", "s": 0.777, "f": 0}, {"x": 0.425, "y": 0.627, "c": "近傍", "n": "SABER WING [A]  n=3413 cos0.43 難0.63", "s": 1.0, "f": 0}, {"x": 0.416, "y": 0.414, "c": "近傍", "n": "D [A]  n=3211 cos0.42 難0.41", "s": 0.941, "f": 0}, {"x": 0.434, "y": -0.06, "c": "近傍", "n": "EMERALDAS [H]  n=3124 cos0.43 難-0.06", "s": 0.915, "f": 0}, {"x": 0.424, "y": 0.053, "c": "近傍", "n": "Beat Juggling Mix [A]  n=3199 cos0.42 難0.05", "s": 0.937, "f": 0}, {"x": 0.433, "y": -0.115, "c": "近傍", "n": "dica dica [A]  n=2087 cos0.43 難-0.12", "s": 0.611, "f": 0}, {"x": 0.408, "y": 0.57, "c": "近傍", "n": "ruin of opals [A]  n=2743 cos0.41 難0.57", "s": 0.803, "f": 0}, {"x": 0.429, "y": -0.141, "c": "近傍", "n": "Ah Hah Yeah [A]  n=2575 cos0.43 難-0.14", "s": 0.754, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.5243085239254045}, {"a": 0, "b": 2, "w": 0.29691861812821796}, {"a": 0, "b": 3, "w": 0.41848707028722454}, {"a": 0, "b": 4, "w": 0.22514734253311186}, {"a": 0, "b": 5, "w": 2.02510785918264e-10}, {"a": 0, "b": 6, "w": 0.49434762460746384}, {"a": 0, "b": 7, "w": 0.11400318831597878}, {"a": 0, "b": 8, "w": 0.49793263159629975}, {"a": 0, "b": 9, "w": 0.4098950579606635}, {"a": 0, "b": 10, "w": 0.27919513498700377}, {"a": 0, "b": 11, "w": 0.16073863377703723}, {"a": 0, "b": 12, "w": 0.4537944808465809}, {"a": 0, "b": 13, "w": 0.1587375241467328}, {"a": 0, "b": 14, "w": 0.1520392147817986}, {"a": 0, "b": 15, "w": 0.20095003480083506}, {"a": 0, "b": 16, "w": 0.14296371948289077}, {"a": 0, "b": 17, "w": 0.4448263892147065}, {"a": 0, "b": 18, "w": 0.3029598219017915}, {"a": 0, "b": 19, "w": 0.12000645290929923}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.361,hiX=1.047,loY=-1.113,hiY=1.293;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
