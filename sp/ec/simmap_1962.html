<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}

 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.11, "c": "種", "n": "Light and Cyber… [A]  n=3242 cos1.00 難-0.11", "s": 0.866, "f": 0}, {"x": 0.782, "y": 0.051, "c": "近傍", "n": "ΕΛΠΙΣ [A]  n=3744 cos0.78 難0.05", "s": 1.0, "f": 0}, {"x": 0.726, "y": -0.264, "c": "近傍", "n": "24th Century BOY [A]  n=3334 cos0.73 難-0.26", "s": 0.89, "f": 0}, {"x": 0.825, "y": -0.65, "c": "近傍", "n": "State Of The Art [A]  n=2935 cos0.82 難-0.65", "s": 0.784, "f": 0}, {"x": 0.684, "y": -0.012, "c": "近傍", "n": "Overslept [A]  n=2548 cos0.68 難-0.01", "s": 0.681, "f": 0}, {"x": 0.678, "y": -0.092, "c": "近傍", "n": "ZERO-ONE [L]  n=1124 cos0.68 難-0.09", "s": 0.3, "f": 0}, {"x": 0.774, "y": 0.457, "c": "近傍", "n": "oratio [A]  n=3433 cos0.77 難0.46", "s": 0.917, "f": 0}, {"x": 0.676, "y": -0.347, "c": "近傍", "n": "龍と少女とデコヒーレンス [A]  n=3653 cos0.68 難-0.35", "s": 0.976, "f": 0}, {"x": 0.755, "y": 0.456, "c": "近傍", "n": "未完成ノ蒸氣驅動乙女 [A]  n=1397 cos0.75 難0.46", "s": 0.373, "f": 0}, {"x": 0.668, "y": -0.318, "c": "近傍", "n": "20XX [A]  n=1752 cos0.67 難-0.32", "s": 0.468, "f": 0}, {"x": 0.774, "y": 0.527, "c": "近傍", "n": "Nightmare before oversleep [A]  n=3444 cos0.77 難0.53", "s": 0.92, "f": 0}, {"x": 0.653, "y": -0.278, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3092 cos0.65 難-0.28", "s": 0.826, "f": 0}, {"x": 0.653, "y": 0.098, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3224 cos0.65 難0.10", "s": 0.861, "f": 0}, {"x": 0.658, "y": 0.189, "c": "近傍", "n": "Mukade [A]  n=1850 cos0.66 難0.19", "s": 0.494, "f": 0}, {"x": 0.662, "y": 0.221, "c": "近傍", "n": "Scripted Connection⇒ H mix [L]  n=1402 cos0.66 難0.22", "s": 0.374, "f": 0}, {"x": 0.649, "y": -0.383, "c": "近傍", "n": "Take My Life [A]  n=3345 cos0.65 難-0.38", "s": 0.893, "f": 0}, {"x": 0.634, "y": -0.234, "c": "近傍", "n": "THE BLACK KNIGHT [A]  n=3315 cos0.63 難-0.23", "s": 0.885, "f": 0}, {"x": 0.731, "y": -0.721, "c": "近傍", "n": "Arabian Rave Night [A]  n=3440 cos0.73 難-0.72", "s": 0.919, "f": 0}, {"x": 0.667, "y": -0.533, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2925 cos0.67 難-0.53", "s": 0.781, "f": 0}, {"x": 0.653, "y": -0.476, "c": "近傍", "n": "rumrum triplets [A]  n=3291 cos0.65 難-0.48", "s": 0.879, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.2405329739243326}, {"a": 0, "b": 2, "w": 0.2646410656978052}, {"a": 0, "b": 3, "w": 0.27301926625614836}, {"a": 0, "b": 4, "w": 0.13354133102743027}, {"a": 0, "b": 5, "w": 5.227752675196484e-10}, {"a": 0, "b": 6, "w": 0.3920485011306717}, {"a": 0, "b": 7, "w": 0.18057573605720434}, {"a": 0, "b": 8, "w": 0.12238039924651567}, {"a": 0, "b": 9, "w": 0.14501469700740965}, {"a": 0, "b": 10, "w": 0.39555163015236394}, {"a": 0, "b": 11, "w": 0.1498071350080158}, {"a": 0, "b": 12, "w": 0.23287310352271517}, {"a": 0, "b": 13, "w": 0.26411738733169854}, {"a": 0, "b": 14, "w": 0.1703309684953499}, {"a": 0, "b": 15, "w": 0.11216162917641137}, {"a": 0, "b": 16, "w": 0.010602275414893891}, {"a": 0, "b": 17, "w": 0.29291625063246873}, {"a": 0, "b": 18, "w": 0.26005780163936953}, {"a": 0, "b": 19, "w": 0.24362491235490158}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.605,hiX=1.029,loY=-0.821,hiY=0.627;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
