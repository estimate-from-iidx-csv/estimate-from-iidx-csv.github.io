<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">X-ray binary [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.592, "c": "種", "n": "X-ray binary [A]  n=2509 cos1.00 難-0.59", "s": 0.674, "f": 0}, {"x": 0.935, "y": -0.603, "c": "近傍", "n": "Show Me All Your Love [A]  n=1141 cos0.93 難-0.60", "s": 0.306, "f": 0}, {"x": 0.896, "y": -0.576, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3408 cos0.90 難-0.58", "s": 0.915, "f": 0}, {"x": 0.895, "y": -0.578, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3638 cos0.89 難-0.58", "s": 0.977, "f": 0}, {"x": 0.909, "y": -0.502, "c": "近傍", "n": "Constellation [A]  n=1122 cos0.91 難-0.50", "s": 0.301, "f": 0}, {"x": 0.939, "y": -0.448, "c": "近傍", "n": "MINT [A]  n=3417 cos0.94 難-0.45", "s": 0.918, "f": 0}, {"x": 0.862, "y": -0.565, "c": "近傍", "n": "I Love You [A]  n=3117 cos0.86 難-0.56", "s": 0.837, "f": 0}, {"x": 0.864, "y": -0.69, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3455 cos0.86 難-0.69", "s": 0.928, "f": 0}, {"x": 0.87, "y": -0.717, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1801 cos0.87 難-0.72", "s": 0.484, "f": 0}, {"x": 0.849, "y": -0.652, "c": "近傍", "n": "AsiaN distractive [A]  n=3171 cos0.85 難-0.65", "s": 0.852, "f": 0}, {"x": 0.906, "y": -0.389, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2418 cos0.91 難-0.39", "s": 0.649, "f": 0}, {"x": 0.836, "y": -0.536, "c": "近傍", "n": "Programmed World [A]  n=3456 cos0.84 難-0.54", "s": 0.928, "f": 0}, {"x": 0.832, "y": -0.632, "c": "近傍", "n": "無意識のフィロソフィア [A]  n=2436 cos0.83 難-0.63", "s": 0.654, "f": 0}, {"x": 0.844, "y": -0.476, "c": "近傍", "n": "rumrum triplets [A]  n=3291 cos0.84 難-0.48", "s": 0.884, "f": 0}, {"x": 0.823, "y": -0.568, "c": "近傍", "n": "xenon [A]  n=3533 cos0.82 難-0.57", "s": 0.949, "f": 0}, {"x": 0.817, "y": -0.585, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3682 cos0.82 難-0.58", "s": 0.989, "f": 0}, {"x": 0.91, "y": -0.85, "c": "近傍", "n": "Shadow World [A]  n=2309 cos0.91 難-0.85", "s": 0.62, "f": 0}, {"x": 0.816, "y": -0.503, "c": "近傍", "n": "Around The Galaxy [A]  n=3219 cos0.82 難-0.50", "s": 0.864, "f": 0}, {"x": 0.87, "y": -0.363, "c": "近傍", "n": "2 tribe 4 K [A]  n=3246 cos0.87 難-0.36", "s": 0.872, "f": 0}, {"x": 0.799, "y": -0.662, "c": "近傍", "n": "Blue Rain [A]  n=3724 cos0.80 難-0.66", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.5278114666855451}, {"a": 0, "b": 2, "w": 0.41460435751205194}, {"a": 0, "b": 3, "w": 0.14798208006783042}, {"a": 0, "b": 4, "w": 0.4582259521221739}, {"a": 0, "b": 5, "w": 0.3513419972819619}, {"a": 0, "b": 6, "w": 0.2810814037480093}, {"a": 0, "b": 7, "w": 0.2824391947572372}, {"a": 0, "b": 8, "w": 0.3668596177956833}, {"a": 0, "b": 9, "w": 0.3099902637998839}, {"a": 0, "b": 10, "w": 0.45438710407445504}, {"a": 0, "b": 11, "w": 0.2310869414909752}, {"a": 0, "b": 12, "w": 0.27854146781529676}, {"a": 0, "b": 13, "w": 0.27992535320639766}, {"a": 0, "b": 14, "w": 0.21382559782910449}, {"a": 0, "b": 15, "w": 0.2219246302106237}, {"a": 0, "b": 16, "w": 0.3572100072056027}, {"a": 0, "b": 17, "w": 0.17391476398439554}, {"a": 0, "b": 18, "w": 0.3575637152232698}, {"a": 0, "b": 19, "w": 5.419317217203456e-10}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.783,hiX=1.016,loY=-0.889,hiY=-0.324;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
