<style>

 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">perditus†paradisus [H] 近傍マップ</h2>
 <div id="legend"></div>

 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.282, "c": "種", "n": "perditus†paradisus [H]  n=3622 cos1.00 難0.28", "s": 0.998, "f": 0}, {"x": 0.775, "y": 0.126, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1348 cos0.77 難0.13", "s": 0.371, "f": 0}, {"x": 0.818, "y": -0.075, "c": "近傍", "n": "voice of echo. [A]  n=793 cos0.82 難-0.07", "s": 0.219, "f": 0}, {"x": 0.683, "y": 0.374, "c": "近傍", "n": "Adularia [A]  n=3575 cos0.68 難0.37", "s": 0.985, "f": 0}, {"x": 0.68, "y": 0.214, "c": "近傍", "n": "Beastie Starter [A]  n=3250 cos0.68 難0.21", "s": 0.896, "f": 0}, {"x": 0.698, "y": 0.064, "c": "近傍", "n": "Necroxis Girl [A]  n=2951 cos0.70 難0.06", "s": 0.813, "f": 0}, {"x": 0.706, "y": 0.532, "c": "近傍", "n": "24h Endurance Race [A]  n=1698 cos0.71 難0.53", "s": 0.468, "f": 0}, {"x": 0.671, "y": 0.456, "c": "近傍", "n": "未完成ノ蒸氣驅動乙女 [A]  n=1397 cos0.67 難0.46", "s": 0.385, "f": 0}, {"x": 0.665, "y": 0.481, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [A]  n=3277 cos0.66 難0.48", "s": 0.903, "f": 0}, {"x": 0.668, "y": 0.054, "c": "近傍", "n": "FAKE TIME [H]  n=3035 cos0.67 難0.05", "s": 0.836, "f": 0}, {"x": 0.703, "y": 0.631, "c": "近傍", "n": "RIZING-GAMERS. [A]  n=513 cos0.70 難0.63", "s": 0.141, "f": 0}, {"x": 0.665, "y": 0.042, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3313 cos0.66 難0.04", "s": 0.913, "f": 0}, {"x": 0.64, "y": 0.179, "c": "近傍", "n": "Out of Control [A]  n=1743 cos0.64 難0.18", "s": 0.48, "f": 0}, {"x": 0.722, "y": -0.136, "c": "近傍", "n": "i-ii [A]  n=1388 cos0.72 難-0.14", "s": 0.382, "f": 0}, {"x": 0.812, "y": -0.297, "c": "近傍", "n": "Almagest [H]  n=3629 cos0.81 難-0.30", "s": 1.0, "f": 0}, {"x": 0.649, "y": 0.006, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3539 cos0.65 難0.01", "s": 0.975, "f": 0}, {"x": 0.637, "y": 0.049, "c": "近傍", "n": "ROCK女 feat. 大山愛未， Ken [A]  n=3072 cos0.64 難0.05", "s": 0.847, "f": 0}, {"x": 0.611, "y": 0.371, "c": "近傍", "n": "GHOST [A]  n=2235 cos0.61 難0.37", "s": 0.616, "f": 0}, {"x": 0.618, "y": 0.101, "c": "近傍", "n": "RUGGED ASH [L]  n=2748 cos0.62 難0.10", "s": 0.757, "f": 0}, {"x": 0.646, "y": 0.607, "c": "近傍", "n": "DUE TOMORROW [A]  n=3237 cos0.65 難0.61", "s": 0.892, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.08156380192147772}, {"a": 0, "b": 2, "w": 0.3140298101159287}, {"a": 0, "b": 3, "w": 0.14229034479395752}, {"a": 0, "b": 4, "w": 0.14301874895527134}, {"a": 0, "b": 5, "w": 0.10692427180405095}, {"a": 0, "b": 6, "w": 0.17802683055046176}, {"a": 0, "b": 7, "w": 0.1485715815960421}, {"a": 0, "b": 8, "w": 0.11722015359275773}, {"a": 0, "b": 9, "w": 2.953888245116332e-10}, {"a": 0, "b": 10, "w": 0.17049680469894068}, {"a": 0, "b": 11, "w": 0.14017772178146504}, {"a": 0, "b": 12, "w": 0.04363648577807788}, {"a": 0, "b": 13, "w": 0.16619778579579914}, {"a": 0, "b": 14, "w": 0.2643742618319449}, {"a": 0, "b": 15, "w": 0.09636723923170498}, {"a": 0, "b": 16, "w": 0.11115192755565118}, {"a": 0, "b": 17, "w": 0.07261550425003405}, {"a": 0, "b": 18, "w": 0.09565374085580891}, {"a": 0, "b": 19, "w": 0.00820529028067929}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.579,hiX=1.031,loY=-0.371,hiY=0.706;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
