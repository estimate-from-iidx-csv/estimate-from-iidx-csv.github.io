<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SnapSkipSpark [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.823, "c": "種", "n": "SnapSkipSpark [A]  n=1072 cos1.00 難-0.82", "s": 0.291, "f": 0}, {"x": 0.879, "y": -0.576, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3408 cos0.88 難-0.58", "s": 0.926, "f": 0}, {"x": 0.835, "y": -1.009, "c": "近傍", "n": "rainbow guitar weeps [A]  n=3332 cos0.83 難-1.01", "s": 0.905, "f": 0}, {"x": 0.773, "y": -0.848, "c": "近傍", "n": "BLUST OF WIND [L]  n=1612 cos0.77 難-0.85", "s": 0.438, "f": 0}, {"x": 0.767, "y": -0.988, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3269 cos0.77 難-0.99", "s": 0.888, "f": 0}, {"x": 0.758, "y": -0.961, "c": "近傍", "n": "仮想空間の旅人たち [A]  n=3667 cos0.76 難-0.96", "s": 0.996, "f": 0}, {"x": 0.747, "y": -0.876, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3395 cos0.75 難-0.88", "s": 0.922, "f": 0}, {"x": 0.838, "y": -0.459, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3541 cos0.84 難-0.46", "s": 0.962, "f": 0}, {"x": 0.823, "y": -0.476, "c": "近傍", "n": "rumrum triplets [A]  n=3291 cos0.82 難-0.48", "s": 0.894, "f": 0}, {"x": 0.734, "y": -0.846, "c": "近傍", "n": "Beyond The Seven [A]  n=3539 cos0.73 難-0.85", "s": 0.961, "f": 0}, {"x": 0.81, "y": -0.469, "c": "近傍", "n": "凛として咲く花の如く [L]  n=3531 cos0.81 難-0.47", "s": 0.959, "f": 0}, {"x": 0.737, "y": -0.69, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3455 cos0.74 難-0.69", "s": 0.938, "f": 0}, {"x": 0.72, "y": -0.85, "c": "近傍", "n": "Shadow World [A]  n=2309 cos0.72 難-0.85", "s": 0.627, "f": 0}, {"x": 0.782, "y": -1.153, "c": "近傍", "n": "恋は白帯、サンシロー [L]  n=3231 cos0.78 難-1.15", "s": 0.878, "f": 0}, {"x": 0.822, "y": -1.228, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3153 cos0.82 難-1.23", "s": 0.856, "f": 0}, {"x": 0.743, "y": -0.585, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3682 cos0.74 難-0.58", "s": 1.0, "f": 0}, {"x": 0.725, "y": -0.982, "c": "近傍", "n": "ランカーキラーガール [A]  n=3129 cos0.73 難-0.98", "s": 0.85, "f": 0}, {"x": 0.724, "y": -0.65, "c": "近傍", "n": "State Of The Art [A]  n=2935 cos0.72 難-0.65", "s": 0.797, "f": 0}, {"x": 0.856, "y": -1.29, "c": "近傍", "n": "バッドエンド・シンドローム [A]  n=2742 cos0.86 難-1.29", "s": 0.745, "f": 0}, {"x": 0.71, "y": -0.888, "c": "近傍", "n": "輪廻の鴉 [A]  n=1941 cos0.71 難-0.89", "s": 0.527, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.5500347660607372}, {"a": 0, "b": 2, "w": 0.31383124659532113}, {"a": 0, "b": 3, "w": 0.20355196288090283}, {"a": 0, "b": 4, "w": 0.4499533800055483}, {"a": 0, "b": 5, "w": 0.10740110888616516}, {"a": 0, "b": 6, "w": 0.15513150826231192}, {"a": 0, "b": 7, "w": 0.49739151867763487}, {"a": 0, "b": 8, "w": 0.5146509243850665}, {"a": 0, "b": 9, "w": 0.2543744960924701}, {"a": 0, "b": 10, "w": 0.22790437247022655}, {"a": 0, "b": 11, "w": 0.10070264813740881}, {"a": 0, "b": 12, "w": 5.003683023474537e-10}, {"a": 0, "b": 13, "w": 0.4217483326992345}, {"a": 0, "b": 14, "w": 0.2900685479477948}, {"a": 0, "b": 15, "w": 0.4342404625911145}, {"a": 0, "b": 16, "w": 0.3578055509182382}, {"a": 0, "b": 17, "w": 0.15648881027872585}, {"a": 0, "b": 18, "w": 0.37335297895361563}, {"a": 0, "b": 19, "w": 0.34420438883667204}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.686,hiX=1.023,loY=-1.356,hiY=-0.393;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
