<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}

 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.137, "c": "種", "n": "Amor∞Fati [A]  n=543 cos1.00 難1.14", "s": 0.168, "f": 0}, {"x": 0.946, "y": 1.126, "c": "近傍", "n": "共鳴遊戯の華 [A]  n=2978 cos0.95 難1.13", "s": 0.92, "f": 0}, {"x": 0.896, "y": 1.14, "c": "近傍", "n": "[ ]DENTITY [A]  n=1815 cos0.90 難1.14", "s": 0.561, "f": 0}, {"x": 0.879, "y": 1.158, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [A]  n=795 cos0.88 難1.16", "s": 0.246, "f": 0}, {"x": 0.93, "y": 1.288, "c": "近傍", "n": "perditus†paradisus [A]  n=2866 cos0.93 難1.29", "s": 0.886, "f": 0}, {"x": 0.961, "y": 0.955, "c": "近傍", "n": "Artist [A]  n=2448 cos0.96 難0.95", "s": 0.756, "f": 0}, {"x": 0.864, "y": 1.108, "c": "近傍", "n": "Ancient Scapes [L]  n=2612 cos0.86 難1.11", "s": 0.807, "f": 0}, {"x": 0.863, "y": 1.087, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2462 cos0.86 難1.09", "s": 0.761, "f": 0}, {"x": 0.886, "y": 1.273, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1154 cos0.89 難1.27", "s": 0.357, "f": 0}, {"x": 0.881, "y": 1.009, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=719 cos0.88 難1.01", "s": 0.222, "f": 0}, {"x": 0.94, "y": 0.904, "c": "近傍", "n": "DORNWALD ～Junge～ [A]  n=3056 cos0.94 難0.90", "s": 0.944, "f": 0}, {"x": 0.83, "y": 1.093, "c": "近傍", "n": "ChaserXX [L]  n=687 cos0.83 難1.09", "s": 0.212, "f": 0}, {"x": 0.826, "y": 1.157, "c": "近傍", "n": "-65℃ [A]  n=2200 cos0.83 難1.16", "s": 0.68, "f": 0}, {"x": 0.814, "y": 1.152, "c": "近傍", "n": "色を喪った街 [A]  n=607 cos0.81 難1.15", "s": 0.188, "f": 0}, {"x": 0.837, "y": 1.27, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [A]  n=1040 cos0.84 難1.27", "s": 0.321, "f": 0}, {"x": 0.894, "y": 1.371, "c": "近傍", "n": "Illegal Function Call [L]  n=1229 cos0.89 難1.37", "s": 0.38, "f": 0}, {"x": 0.84, "y": 1.293, "c": "近傍", "n": "Carmina [A]  n=2507 cos0.84 難1.29", "s": 0.775, "f": 0}, {"x": 0.807, "y": 1.089, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [A]  n=2933 cos0.81 難1.09", "s": 0.906, "f": 0}, {"x": 0.792, "y": 1.166, "c": "近傍", "n": "PERFECT GREAT!! [A]  n=535 cos0.79 難1.17", "s": 0.165, "f": 0}, {"x": 0.806, "y": 1.001, "c": "近傍", "n": "天空の夜明け [A]  n=3236 cos0.81 難1.00", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.481823709876224}, {"a": 0, "b": 2, "w": 0.3970930728213915}, {"a": 0, "b": 3, "w": 0.31193649957571434}, {"a": 0, "b": 4, "w": 0.4060089761175114}, {"a": 0, "b": 5, "w": 0.27435295322069186}, {"a": 0, "b": 6, "w": 0.33248420101339915}, {"a": 0, "b": 7, "w": 0.29300340396082647}, {"a": 0, "b": 8, "w": 0.14856055802788903}, {"a": 0, "b": 9, "w": 0.30189573787393675}, {"a": 0, "b": 10, "w": 0.3587736476775195}, {"a": 0, "b": 11, "w": 0.16199251606865128}, {"a": 0, "b": 12, "w": 0.2470774553538636}, {"a": 0, "b": 13, "w": 3.0537028461452564e-10}, {"a": 0, "b": 14, "w": 0.0066197251378044}, {"a": 0, "b": 15, "w": 0.382419458946477}, {"a": 0, "b": 16, "w": 0.23228592225454814}, {"a": 0, "b": 17, "w": 0.135084955716669}, {"a": 0, "b": 18, "w": 0.1804423467787022}, {"a": 0, "b": 19, "w": 0.19563526323611424}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.776,hiX=1.017,loY=0.867,hiY=1.408;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
