<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Anisakis -somatic mutation type"Forza"- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.585, "c": "種", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3682 cos1.00 難-0.58", "s": 0.989, "f": 0}, {"x": 0.915, "y": -0.603, "c": "近傍", "n": "Show Me All Your Love [A]  n=1141 cos0.92 難-0.60", "s": 0.306, "f": 0}, {"x": 0.866, "y": -0.578, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3638 cos0.87 難-0.58", "s": 0.977, "f": 0}, {"x": 0.861, "y": -0.565, "c": "近傍", "n": "I Love You [A]  n=3117 cos0.86 難-0.56", "s": 0.837, "f": 0}, {"x": 0.867, "y": -0.502, "c": "近傍", "n": "Constellation [A]  n=1122 cos0.87 難-0.50", "s": 0.301, "f": 0}, {"x": 0.854, "y": -0.638, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1120 cos0.85 難-0.64", "s": 0.301, "f": 0}, {"x": 0.857, "y": -0.662, "c": "近傍", "n": "Blue Rain [A]  n=3724 cos0.86 難-0.66", "s": 1.0, "f": 0}, {"x": 0.846, "y": -0.576, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3408 cos0.85 難-0.58", "s": 0.915, "f": 0}, {"x": 0.839, "y": -0.617, "c": "近傍", "n": "yamabiko (SINOBUZ Edition) [A]  n=3136 cos0.84 難-0.62", "s": 0.842, "f": 0}, {"x": 0.833, "y": -0.581, "c": "近傍", "n": "Little Little Princess [A]  n=3431 cos0.83 難-0.58", "s": 0.921, "f": 0}, {"x": 0.856, "y": -0.716, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1919 cos0.86 難-0.72", "s": 0.515, "f": 0}, {"x": 0.837, "y": -0.7, "c": "近傍", "n": "Programmed Genom [A]  n=2243 cos0.84 難-0.70", "s": 0.602, "f": 0}, {"x": 0.817, "y": -0.592, "c": "近傍", "n": "X-ray binary [A]  n=2509 cos0.82 難-0.59", "s": 0.674, "f": 0}, {"x": 0.838, "y": -0.733, "c": "近傍", "n": "Be A Star [A]  n=3341 cos0.84 難-0.73", "s": 0.897, "f": 0}, {"x": 0.821, "y": -0.69, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3455 cos0.82 難-0.69", "s": 0.928, "f": 0}, {"x": 0.805, "y": -0.58, "c": "近傍", "n": "winkle 2 winkle [A]  n=1655 cos0.81 難-0.58", "s": 0.444, "f": 0}, {"x": 0.819, "y": -0.476, "c": "近傍", "n": "rumrum triplets [A]  n=3291 cos0.82 難-0.48", "s": 0.884, "f": 0}, {"x": 0.841, "y": -0.76, "c": "近傍", "n": "Ruler or Loser [A]  n=2193 cos0.84 難-0.76", "s": 0.589, "f": 0}, {"x": 0.82, "y": -0.742, "c": "近傍", "n": "朧 [L]  n=3642 cos0.82 難-0.74", "s": 0.978, "f": 0}, {"x": 0.791, "y": -0.57, "c": "近傍", "n": "少年リップルズ [A]  n=1792 cos0.79 難-0.57", "s": 0.481, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.5927353324200316}, {"a": 0, "b": 2, "w": 4.710266621188453e-10}, {"a": 0, "b": 3, "w": 0.2843068799860444}, {"a": 0, "b": 4, "w": 0.5162750477266298}, {"a": 0, "b": 5, "w": 0.5898678448959197}, {"a": 0, "b": 6, "w": 0.08348875328862937}, {"a": 0, "b": 7, "w": 0.5239228084737959}, {"a": 0, "b": 8, "w": 0.5181179187579888}, {"a": 0, "b": 9, "w": 0.44669187408085487}, {"a": 0, "b": 10, "w": 0.49954990550760603}, {"a": 0, "b": 11, "w": 0.16766837626370357}, {"a": 0, "b": 12, "w": 0.3237261837195029}, {"a": 0, "b": 13, "w": 0.5417839321295514}, {"a": 0, "b": 14, "w": 0.22992724025296452}, {"a": 0, "b": 15, "w": 0.37442492811980843}, {"a": 0, "b": 16, "w": 0.5551660235769416}, {"a": 0, "b": 17, "w": 0.33044082254691964}, {"a": 0, "b": 18, "w": 0.2353801486738366}, {"a": 0, "b": 19, "w": 0.18257961067675832}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.775,hiX=1.017,loY=-0.783,hiY=-0.453;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
