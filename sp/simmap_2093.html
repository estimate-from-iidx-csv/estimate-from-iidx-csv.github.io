<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ruler or Loser [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.943, "c": "種", "n": "Ruler or Loser [A]  n=2191 cos1.00 難-0.94", "s": 0.589, "f": 0}, {"x": 0.939, "y": -0.809, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3636 cos0.94 難-0.81", "s": 0.977, "f": 0}, {"x": 0.882, "y": -1.013, "c": "近傍", "n": "Harmony and Lovely [A]  n=3524 cos0.88 難-1.01", "s": 0.947, "f": 0}, {"x": 0.877, "y": -0.866, "c": "近傍", "n": "Constellation [A]  n=1120 cos0.88 難-0.87", "s": 0.301, "f": 0}, {"x": 0.917, "y": -1.1, "c": "近傍", "n": "Nasty Techniques [A]  n=2959 cos0.92 難-1.10", "s": 0.795, "f": 0}, {"x": 0.853, "y": -0.927, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1238 cos0.85 難-0.93", "s": 0.333, "f": 0}, {"x": 0.848, "y": -0.945, "c": "近傍", "n": "Show Me All Your Love [A]  n=1140 cos0.85 難-0.95", "s": 0.306, "f": 0}, {"x": 0.848, "y": -0.934, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3453 cos0.85 難-0.93", "s": 0.928, "f": 0}, {"x": 0.855, "y": -1.018, "c": "近傍", "n": "Ember Lights [A]  n=3397 cos0.86 難-1.02", "s": 0.913, "f": 0}, {"x": 0.907, "y": -1.157, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3293 cos0.91 難-1.16", "s": 0.885, "f": 0}, {"x": 0.92, "y": -1.169, "c": "近傍", "n": "Blue Rain [A]  n=3722 cos0.92 難-1.17", "s": 1.0, "f": 0}, {"x": 0.827, "y": -0.86, "c": "近傍", "n": "I Love You [A]  n=3115 cos0.83 難-0.86", "s": 0.837, "f": 0}, {"x": 0.834, "y": -0.827, "c": "近傍", "n": "ANDROMEDA [A]  n=3477 cos0.83 難-0.83", "s": 0.934, "f": 0}, {"x": 0.819, "y": -1.027, "c": "近傍", "n": "Broadbanded [A]  n=3229 cos0.82 難-1.03", "s": 0.868, "f": 0}, {"x": 0.807, "y": -0.958, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2839 cos0.81 難-0.96", "s": 0.763, "f": 0}, {"x": 0.84, "y": -1.119, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3680 cos0.84 難-1.12", "s": 0.989, "f": 0}, {"x": 0.804, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3238 cos0.80 難-0.84", "s": 0.87, "f": 0}, {"x": 0.8, "y": -1.032, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2205 cos0.80 難-1.03", "s": 0.592, "f": 0}, {"x": 0.792, "y": -0.908, "c": "近傍", "n": "HYPERION [A]  n=3333 cos0.79 難-0.91", "s": 0.895, "f": 0}, {"x": 0.793, "y": -0.849, "c": "近傍", "n": "KAMAITACHI [A]  n=3663 cos0.79 難-0.85", "s": 0.984, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.4865986747613401}, {"a": 0, "b": 2, "w": 0.2602440801210929}, {"a": 0, "b": 3, "w": 0.539371831383527}, {"a": 0, "b": 4, "w": 0.5870969754040939}, {"a": 0, "b": 5, "w": 0.5001693339195126}, {"a": 0, "b": 6, "w": 0.4941974366497949}, {"a": 0, "b": 7, "w": 0.44842024132157854}, {"a": 0, "b": 8, "w": 0.45056582630005415}, {"a": 0, "b": 9, "w": 0.45824237380775634}, {"a": 0, "b": 10, "w": 0.5034174907125553}, {"a": 0, "b": 11, "w": 0.41530483565947174}, {"a": 0, "b": 12, "w": 0.3862686920195043}, {"a": 0, "b": 13, "w": 3.930222813863793e-10}, {"a": 0, "b": 14, "w": 0.29033417931901606}, {"a": 0, "b": 15, "w": 0.4409700300282007}, {"a": 0, "b": 16, "w": 0.4327972652942693}, {"a": 0, "b": 17, "w": 0.4275987800979325}, {"a": 0, "b": 18, "w": 0.31635570807692937}, {"a": 0, "b": 19, "w": 0.39014777088318187}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.775,hiX=1.017,loY=-1.198,hiY=-0.780;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
