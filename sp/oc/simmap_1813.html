<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">COSMIC CYBER [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.234, "c": "種", "n": "COSMIC CYBER [A]  n=2555 cos1.00 難-0.23", "s": 0.692, "f": 0}, {"x": 0.715, "y": -0.068, "c": "近傍", "n": "Matt Silver [A]  n=3073 cos0.71 難-0.07", "s": 0.832, "f": 0}, {"x": 0.673, "y": -0.419, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3081 cos0.67 難-0.42", "s": 0.834, "f": 0}, {"x": 0.659, "y": -0.291, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1763 cos0.66 難-0.29", "s": 0.477, "f": 0}, {"x": 0.607, "y": -0.618, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2659 cos0.61 難-0.62", "s": 0.72, "f": 0}, {"x": 0.587, "y": 0.038, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1055 cos0.59 難0.04", "s": 0.286, "f": 0}, {"x": 0.618, "y": -0.801, "c": "近傍", "n": "rainbow rainbow [A]  n=3300 cos0.62 難-0.80", "s": 0.893, "f": 0}, {"x": 0.628, "y": 0.479, "c": "近傍", "n": "Mid-Corner (Magic Maker) [A]  n=1189 cos0.63 難0.48", "s": 0.322, "f": 0}, {"x": 0.573, "y": -0.616, "c": "近傍", "n": "No.13 [A]  n=3451 cos0.57 難-0.62", "s": 0.934, "f": 0}, {"x": 0.553, "y": -0.308, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3694 cos0.55 難-0.31", "s": 1.0, "f": 0}, {"x": 0.581, "y": 0.23, "c": "近傍", "n": "Funny shuffle [A]  n=3249 cos0.58 難0.23", "s": 0.88, "f": 0}, {"x": 0.646, "y": -1.078, "c": "近傍", "n": "Vulkan [A]  n=3503 cos0.65 難-1.08", "s": 0.948, "f": 0}, {"x": 0.559, "y": -0.608, "c": "近傍", "n": "Unicorn tail [A]  n=3480 cos0.56 難-0.61", "s": 0.942, "f": 0}, {"x": 0.541, "y": -0.145, "c": "近傍", "n": "Selfish Sweet [L]  n=831 cos0.54 難-0.15", "s": 0.225, "f": 0}, {"x": 0.524, "y": -0.07, "c": "近傍", "n": "moon_child [A]  n=3559 cos0.52 難-0.07", "s": 0.963, "f": 0}, {"x": 0.605, "y": -1.031, "c": "近傍", "n": "SnapSkipSpark [A]  n=1072 cos0.60 難-1.03", "s": 0.29, "f": 0}, {"x": 0.518, "y": -0.361, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3224 cos0.52 難-0.36", "s": 0.873, "f": 0}, {"x": 0.538, "y": -0.687, "c": "近傍", "n": "waxing and wanding [A]  n=3661 cos0.54 難-0.69", "s": 0.991, "f": 0}, {"x": 0.526, "y": -0.596, "c": "近傍", "n": "Neo Heritage [A]  n=2288 cos0.53 難-0.60", "s": 0.619, "f": 0}, {"x": 0.53, "y": 0.171, "c": "近傍", "n": "Nightmare before oversleep [A]  n=3444 cos0.53 難0.17", "s": 0.932, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.30775645525115225}, {"a": 0, "b": 2, "w": 0.277021794339428}, {"a": 0, "b": 3, "w": 0.4500270445072394}, {"a": 0, "b": 4, "w": 0.33333089698357}, {"a": 0, "b": 5, "w": 0.41354093303120265}, {"a": 0, "b": 6, "w": 0.23070725933441638}, {"a": 0, "b": 7, "w": 0.16489841320422072}, {"a": 0, "b": 8, "w": 0.3353206553165322}, {"a": 0, "b": 9, "w": 0.36245759850502035}, {"a": 0, "b": 10, "w": 4.757175764424915e-10}, {"a": 0, "b": 11, "w": 0.23214905899225413}, {"a": 0, "b": 12, "w": 0.22608575210190662}, {"a": 0, "b": 13, "w": 0.05958279488556106}, {"a": 0, "b": 14, "w": 0.2966387965004075}, {"a": 0, "b": 15, "w": 0.3298193360089725}, {"a": 0, "b": 16, "w": 0.24879875550590025}, {"a": 0, "b": 17, "w": 0.0732474473864364}, {"a": 0, "b": 18, "w": 0.17612425681231836}, {"a": 0, "b": 19, "w": 0.31554716639895475}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.480,hiX=1.039,loY=-1.203,hiY=0.603;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
