<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vermilion Carol [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.642, "c": "種", "n": "Vermilion Carol [A]  n=1637 cos1.00 難0.64", "s": 0.472, "f": 0}, {"x": 0.804, "y": 0.66, "c": "近傍", "n": "DUAL STRIKER [A]  n=2390 cos0.80 難0.66", "s": 0.689, "f": 0}, {"x": 0.797, "y": 0.629, "c": "近傍", "n": "I [A]  n=2078 cos0.80 難0.63", "s": 0.599, "f": 0}, {"x": 0.782, "y": 0.691, "c": "近傍", "n": "THE DAY OF JUBILATIONS [A]  n=3043 cos0.78 難0.69", "s": 0.877, "f": 0}, {"x": 0.78, "y": 0.566, "c": "近傍", "n": "Xb10r [A]  n=1434 cos0.78 難0.57", "s": 0.413, "f": 0}, {"x": 0.844, "y": 0.897, "c": "近傍", "n": "2 Be Continued [A]  n=938 cos0.84 難0.90", "s": 0.27, "f": 0}, {"x": 0.769, "y": 0.589, "c": "近傍", "n": "BIGWAVERS [A]  n=1768 cos0.77 難0.59", "s": 0.51, "f": 0}, {"x": 0.731, "y": 0.629, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3344 cos0.73 難0.63", "s": 0.964, "f": 0}, {"x": 0.729, "y": 0.663, "c": "近傍", "n": "Vitrum [A]  n=2527 cos0.73 難0.66", "s": 0.728, "f": 0}, {"x": 0.719, "y": 0.571, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [A]  n=3470 cos0.72 難0.57", "s": 1.0, "f": 0}, {"x": 0.716, "y": 0.698, "c": "近傍", "n": "Regina vespaE [A]  n=923 cos0.72 難0.70", "s": 0.266, "f": 0}, {"x": 0.739, "y": 0.833, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [A]  n=2184 cos0.74 難0.83", "s": 0.629, "f": 0}, {"x": 0.817, "y": 0.987, "c": "近傍", "n": "ANCHOR [A]  n=2982 cos0.82 難0.99", "s": 0.859, "f": 0}, {"x": 0.736, "y": 0.885, "c": "近傍", "n": "逆月 [A]  n=2270 cos0.74 難0.89", "s": 0.654, "f": 0}, {"x": 0.752, "y": 0.933, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3169 cos0.75 難0.93", "s": 0.913, "f": 0}, {"x": 0.708, "y": 0.455, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3439 cos0.71 難0.46", "s": 0.991, "f": 0}, {"x": 0.732, "y": 0.91, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [A]  n=1822 cos0.73 難0.91", "s": 0.525, "f": 0}, {"x": 0.681, "y": 0.687, "c": "近傍", "n": "THE DEEP STRIKER [L]  n=2915 cos0.68 難0.69", "s": 0.84, "f": 0}, {"x": 0.669, "y": 0.634, "c": "近傍", "n": "KILL EACH OTHER [A]  n=3040 cos0.67 難0.63", "s": 0.876, "f": 0}, {"x": 0.681, "y": 0.489, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3361 cos0.68 難0.49", "s": 0.969, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.4808141139259149}, {"a": 0, "b": 2, "w": 0.4333932024146874}, {"a": 0, "b": 3, "w": 0.5010494785150612}, {"a": 0, "b": 4, "w": 0.48348617457314824}, {"a": 0, "b": 5, "w": 0.5541811735438076}, {"a": 0, "b": 6, "w": 0.4430248642118608}, {"a": 0, "b": 7, "w": 0.3494646052284013}, {"a": 0, "b": 8, "w": 0.4466848713261833}, {"a": 0, "b": 9, "w": 0.23362788870535545}, {"a": 0, "b": 10, "w": 0.4164248262023451}, {"a": 0, "b": 11, "w": 3.2168201435922583e-10}, {"a": 0, "b": 12, "w": 0.530141827413281}, {"a": 0, "b": 13, "w": 0.19840606512533954}, {"a": 0, "b": 14, "w": 0.4641023147678146}, {"a": 0, "b": 15, "w": 0.43094893524001954}, {"a": 0, "b": 16, "w": 0.4309836640482252}, {"a": 0, "b": 17, "w": 0.3508456834048608}, {"a": 0, "b": 18, "w": 0.3627557801936585}, {"a": 0, "b": 19, "w": 0.3452304871217684}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.642,hiX=1.027,loY=0.413,hiY=1.030;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
