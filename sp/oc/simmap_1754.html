<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Beat Juggling Mix [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.051, "c": "種", "n": "Beat Juggling Mix [A]  n=3201 cos1.00 難0.05", "s": 0.848, "f": 0}, {"x": 0.879, "y": 0.108, "c": "近傍", "n": "Bling-Bang-Bang-Born [L]  n=865 cos0.88 難0.11", "s": 0.229, "f": 0}, {"x": 0.851, "y": 0.052, "c": "近傍", "n": "CHECKING YOU OUT [A]  n=3251 cos0.85 難0.05", "s": 0.861, "f": 0}, {"x": 0.821, "y": 0.165, "c": "近傍", "n": "Just a Little Smile [A]  n=3381 cos0.82 難0.17", "s": 0.895, "f": 0}, {"x": 0.804, "y": -0.025, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1735 cos0.80 難-0.02", "s": 0.459, "f": 0}, {"x": 0.816, "y": -0.104, "c": "近傍", "n": "ラクエン [A]  n=2984 cos0.82 難-0.10", "s": 0.79, "f": 0}, {"x": 0.784, "y": 0.018, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2156 cos0.78 難0.02", "s": 0.571, "f": 0}, {"x": 0.816, "y": -0.194, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [H]  n=3776 cos0.82 難-0.19", "s": 1.0, "f": 0}, {"x": 0.873, "y": -0.309, "c": "近傍", "n": "Uh-Oh [A]  n=3493 cos0.87 難-0.31", "s": 0.925, "f": 0}, {"x": 0.776, "y": 0.192, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3230 cos0.78 難0.19", "s": 0.855, "f": 0}, {"x": 0.787, "y": 0.318, "c": "近傍", "n": "SAMURAI-Scramble [A]  n=3606 cos0.79 難0.32", "s": 0.955, "f": 0}, {"x": 0.762, "y": 0.23, "c": "近傍", "n": "Funny shuffle [A]  n=3249 cos0.76 難0.23", "s": 0.86, "f": 0}, {"x": 0.773, "y": -0.173, "c": "近傍", "n": "Game Changers [A]  n=1970 cos0.77 難-0.17", "s": 0.522, "f": 0}, {"x": 0.762, "y": 0.296, "c": "近傍", "n": "Do it!! Do it!! [A]  n=3345 cos0.76 難0.30", "s": 0.886, "f": 0}, {"x": 0.758, "y": 0.298, "c": "近傍", "n": "BRAINSTORM [A]  n=3401 cos0.76 難0.30", "s": 0.901, "f": 0}, {"x": 0.871, "y": -0.417, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3723 cos0.87 難-0.42", "s": 0.986, "f": 0}, {"x": 0.733, "y": -0.141, "c": "近傍", "n": "rough percussionythm [A]  n=2819 cos0.73 難-0.14", "s": 0.747, "f": 0}, {"x": 0.731, "y": -0.129, "c": "近傍", "n": "カジノファイヤーことみちゃん [A]  n=3412 cos0.73 難-0.13", "s": 0.904, "f": 0}, {"x": 0.796, "y": -0.324, "c": "近傍", "n": "With You [A]  n=2126 cos0.80 難-0.32", "s": 0.563, "f": 0}, {"x": 0.707, "y": 0.077, "c": "近傍", "n": "Routing [A]  n=3436 cos0.71 難0.08", "s": 0.91, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.36767169091481333}, {"a": 0, "b": 2, "w": 2.2467783189483725e-10}, {"a": 0, "b": 3, "w": 0.4063507858094907}, {"a": 0, "b": 4, "w": 0.2762745052302862}, {"a": 0, "b": 5, "w": 0.2760593840648511}, {"a": 0, "b": 6, "w": 0.34660808342741023}, {"a": 0, "b": 7, "w": 0.17682938348481814}, {"a": 0, "b": 8, "w": 0.47642138132732015}, {"a": 0, "b": 9, "w": 0.2404098633945354}, {"a": 0, "b": 10, "w": 0.2164561285175749}, {"a": 0, "b": 11, "w": 0.2941901531459584}, {"a": 0, "b": 12, "w": 0.31654581650725533}, {"a": 0, "b": 13, "w": 0.3267604081244452}, {"a": 0, "b": 14, "w": 0.3125861694480915}, {"a": 0, "b": 15, "w": 0.3915270868640479}, {"a": 0, "b": 16, "w": 0.20103777034490133}, {"a": 0, "b": 17, "w": 0.2895439785485575}, {"a": 0, "b": 18, "w": 0.36381604562101566}, {"a": 0, "b": 19, "w": 0.2636622229645139}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.683,hiX=1.023,loY=-0.476,hiY=0.376;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
