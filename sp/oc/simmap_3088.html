<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}

 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

 <div id="legend"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.217, "c": "種", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [L]  n=770 cos1.00 難1.22", "s": 0.237, "f": 0}, {"x": 0.891, "y": 1.17, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [A]  n=2310 cos0.89 難1.17", "s": 0.712, "f": 0}, {"x": 0.89, "y": 1.317, "c": "近傍", "n": "POLKAMANIA [L]  n=798 cos0.89 難1.32", "s": 0.246, "f": 0}, {"x": 0.867, "y": 1.275, "c": "近傍", "n": "SOLID WYVERN [L]  n=1036 cos0.87 難1.27", "s": 0.319, "f": 0}, {"x": 0.86, "y": 1.306, "c": "近傍", "n": "Satellite Burst [A]  n=1266 cos0.86 難1.31", "s": 0.39, "f": 0}, {"x": 0.897, "y": 1.053, "c": "近傍", "n": "O/D*20 [L]  n=1292 cos0.90 難1.05", "s": 0.398, "f": 0}, {"x": 0.877, "y": 1.358, "c": "近傍", "n": "MENDES [A]  n=3224 cos0.88 難1.36", "s": 0.993, "f": 0}, {"x": 0.895, "y": 1.385, "c": "近傍", "n": "≡+≡ [L]  n=730 cos0.90 難1.39", "s": 0.225, "f": 0}, {"x": 0.844, "y": 1.133, "c": "近傍", "n": "†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [A]  n=3246 cos0.84 難1.13", "s": 1.0, "f": 0}, {"x": 0.874, "y": 1.363, "c": "近傍", "n": "#The_Relentless [L]  n=669 cos0.87 難1.36", "s": 0.206, "f": 0}, {"x": 0.859, "y": 1.349, "c": "近傍", "n": "Lisa-RICCIA [L]  n=621 cos0.86 難1.35", "s": 0.191, "f": 0}, {"x": 0.836, "y": 1.311, "c": "近傍", "n": "Artist [A]  n=2448 cos0.84 難1.31", "s": 0.754, "f": 0}, {"x": 0.858, "y": 1.371, "c": "近傍", "n": "CADENZA [A]  n=1349 cos0.86 難1.37", "s": 0.416, "f": 0}, {"x": 0.814, "y": 1.275, "c": "近傍", "n": "waxing and wanding [L]  n=2806 cos0.81 難1.27", "s": 0.864, "f": 0}, {"x": 0.906, "y": 1.432, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2844 cos0.91 難1.43", "s": 0.876, "f": 0}, {"x": 0.858, "y": 1.043, "c": "近傍", "n": "ぞうしょく！？マイデンティティ [A]  n=1632 cos0.86 難1.04", "s": 0.503, "f": 0}, {"x": 0.803, "y": 1.251, "c": "近傍", "n": "VOLAQUAS [A]  n=1718 cos0.80 難1.25", "s": 0.529, "f": 0}, {"x": 0.805, "y": 1.273, "c": "近傍", "n": "PERFECT GREAT!! [A]  n=535 cos0.80 難1.27", "s": 0.165, "f": 0}, {"x": 0.841, "y": 1.377, "c": "近傍", "n": "God Mind [A]  n=1008 cos0.84 難1.38", "s": 0.311, "f": 0}, {"x": 0.812, "y": 1.082, "c": "近傍", "n": "G59 [A]  n=3094 cos0.81 難1.08", "s": 0.953, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.2632776579227274}, {"a": 0, "b": 2, "w": 0.132675511223593}, {"a": 0, "b": 3, "w": 0.21458201792904463}, {"a": 0, "b": 4, "w": 0.09884285474376386}, {"a": 0, "b": 5, "w": 0.17113366404393626}, {"a": 0, "b": 6, "w": 0.16436452901387688}, {"a": 0, "b": 7, "w": 0.42177035049865763}, {"a": 0, "b": 8, "w": 0.14563141585217965}, {"a": 0, "b": 9, "w": 0.3198827218248885}, {"a": 0, "b": 10, "w": 0.33578950016404074}, {"a": 0, "b": 11, "w": 0.0015790934012198665}, {"a": 0, "b": 12, "w": 0.29821067955170066}, {"a": 0, "b": 13, "w": 0.2523415869618634}, {"a": 0, "b": 14, "w": 0.22653595810961313}, {"a": 0, "b": 15, "w": 1.6933476842950768e-10}, {"a": 0, "b": 16, "w": 0.080439353922234}, {"a": 0, "b": 17, "w": 0.08120475839298902}, {"a": 0, "b": 18, "w": 0.3021649762171448}, {"a": 0, "b": 19, "w": 0.15304185241224977}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.787,hiX=1.016,loY=1.012,hiY=1.463;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
