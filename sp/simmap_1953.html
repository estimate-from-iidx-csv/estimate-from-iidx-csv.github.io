<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">kors k's Let's make an Image Song! [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β1.4·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.896, "c": "種", "n": "kors k's Let's make an Image Song! [A]  n=973 cos1.00 難-0.90", "s": 0.285, "f": 0}, {"x": 0.882, "y": -0.902, "c": "近傍", "n": "MOCHIMOCHI DREAMIN!! [A]  n=1076 cos0.88 難-0.90", "s": 0.315, "f": 0}, {"x": 0.875, "y": -0.95, "c": "近傍", "n": "ROTTERDAM SHOGUN [A]  n=3416 cos0.88 難-0.95", "s": 1.0, "f": 0}, {"x": 0.858, "y": -0.769, "c": "近傍", "n": "AGEHA [L]  n=2362 cos0.86 難-0.77", "s": 0.691, "f": 0}, {"x": 0.831, "y": -0.89, "c": "近傍", "n": "Chronos [A]  n=3384 cos0.83 難-0.89", "s": 0.991, "f": 0}, {"x": 0.843, "y": -0.787, "c": "近傍", "n": "Temple of Anubis [A]  n=3244 cos0.84 難-0.79", "s": 0.95, "f": 0}, {"x": 0.818, "y": -0.826, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3100 cos0.82 難-0.83", "s": 0.907, "f": 0}, {"x": 0.814, "y": -0.988, "c": "近傍", "n": "GIGA RAID [A]  n=2778 cos0.81 難-0.99", "s": 0.813, "f": 0}, {"x": 0.803, "y": -0.888, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2867 cos0.80 難-0.89", "s": 0.839, "f": 0}, {"x": 0.883, "y": -1.162, "c": "近傍", "n": "Space In Time [A]  n=1351 cos0.88 難-1.16", "s": 0.395, "f": 0}, {"x": 0.771, "y": -0.882, "c": "近傍", "n": "Chemical Colours [A]  n=1780 cos0.77 難-0.88", "s": 0.521, "f": 0}, {"x": 0.761, "y": -0.856, "c": "近傍", "n": "GIGA THRASH [A]  n=3142 cos0.76 難-0.86", "s": 0.92, "f": 0}, {"x": 0.763, "y": -0.813, "c": "近傍", "n": "ハイテックトキオ [A]  n=2620 cos0.76 難-0.81", "s": 0.767, "f": 0}, {"x": 0.758, "y": -0.806, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2515 cos0.76 難-0.81", "s": 0.736, "f": 0}, {"x": 0.739, "y": -0.879, "c": "近傍", "n": "Victory Of Ravers [A]  n=2452 cos0.74 難-0.88", "s": 0.718, "f": 0}, {"x": 0.785, "y": -1.135, "c": "近傍", "n": "MA・TSU・RI [A]  n=2096 cos0.79 難-1.13", "s": 0.614, "f": 0}, {"x": 0.745, "y": -0.763, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1750 cos0.74 難-0.76", "s": 0.512, "f": 0}, {"x": 0.824, "y": -1.21, "c": "近傍", "n": "Volcanic Dragon [A]  n=3166 cos0.82 難-1.21", "s": 0.927, "f": 0}, {"x": 0.742, "y": -1.022, "c": "近傍", "n": "Urban Constellations [A]  n=3155 cos0.74 難-1.02", "s": 0.924, "f": 0}, {"x": 0.723, "y": -0.923, "c": "近傍", "n": "See You Again [A]  n=1058 cos0.72 難-0.92", "s": 0.31, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 19}], E=[{"a": 0, "b": 1, "w": 0.3868620781393516}, {"a": 0, "b": 2, "w": 0.4662884861863561}, {"a": 0, "b": 3, "w": 0.4329545272517731}, {"a": 0, "b": 4, "w": 0.3628290091100679}, {"a": 0, "b": 5, "w": 0.39815530905737684}, {"a": 0, "b": 6, "w": 0.36284908418968265}, {"a": 0, "b": 7, "w": 0.3558047049360765}, {"a": 0, "b": 8, "w": 0.29005367148153693}, {"a": 0, "b": 9, "w": 0.11616142105393967}, {"a": 0, "b": 10, "w": 0.2893828322549987}, {"a": 0, "b": 11, "w": 0.24109038778296576}, {"a": 0, "b": 12, "w": 0.26251364323544457}, {"a": 0, "b": 13, "w": 0.21900542125847988}, {"a": 0, "b": 14, "w": 0.2585196862345176}, {"a": 0, "b": 15, "w": 0.31225782010160485}, {"a": 0, "b": 16, "w": 3.3083613626416764e-10}, {"a": 0, "b": 17, "w": 0.36869812817192615}, {"a": 0, "b": 18, "w": 0.23116791156735805}, {"a": 0, "b": 19, "w": 0.2385556370975258}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.701,hiX=1.022,loY=-1.246,hiY=-0.727;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
