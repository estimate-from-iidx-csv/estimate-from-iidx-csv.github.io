<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 5 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.608, "c": "種", "n": "Level 5 [H]  n=961 cos1.00 難-0.61", "s": 0.276, "f": 0}, {"x": 0.991, "y": -0.696, "c": "近傍", "n": "GAME ON [H]  n=1321 cos0.99 難-0.70", "s": 0.379, "f": 0}, {"x": 0.991, "y": -0.471, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.99 難-0.47", "s": 0.657, "f": 0}, {"x": 0.989, "y": -0.556, "c": "近傍", "n": "Macho Monky [H]  n=1760 cos0.99 難-0.56", "s": 0.505, "f": 0}, {"x": 0.991, "y": -0.822, "c": "近傍", "n": "TOMAHAWK [H]  n=1306 cos0.99 難-0.82", "s": 0.375, "f": 0}, {"x": 0.988, "y": -0.576, "c": "近傍", "n": "Xperanza [H]  n=2619 cos0.99 難-0.58", "s": 0.752, "f": 0}, {"x": 0.988, "y": -0.479, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [H]  n=1812 cos0.99 難-0.48", "s": 0.52, "f": 0}, {"x": 0.988, "y": -0.752, "c": "近傍", "n": "hard-wired [H]  n=1151 cos0.99 難-0.75", "s": 0.33, "f": 0}, {"x": 0.986, "y": -0.571, "c": "近傍", "n": "Level One [H]  n=2810 cos0.99 難-0.57", "s": 0.807, "f": 0}, {"x": 0.99, "y": -0.339, "c": "近傍", "n": "Watermelon Explosion [A]  n=775 cos0.99 難-0.34", "s": 0.223, "f": 0}, {"x": 0.987, "y": -0.474, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.99 難-0.47", "s": 0.822, "f": 0}, {"x": 0.986, "y": -0.763, "c": "近傍", "n": "SOLAR ECLIPSE [H]  n=1479 cos0.99 難-0.76", "s": 0.425, "f": 0}, {"x": 0.991, "y": -0.292, "c": "近傍", "n": "Dynamite [H]  n=3348 cos0.99 難-0.29", "s": 0.961, "f": 0}, {"x": 0.988, "y": -0.905, "c": "近傍", "n": "1116 [H]  n=662 cos0.99 難-0.91", "s": 0.19, "f": 0}, {"x": 0.987, "y": -0.337, "c": "近傍", "n": "Plan 8 [H]  n=3483 cos0.99 難-0.34", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.295, "c": "近傍", "n": "Tropical April [H]  n=2580 cos0.99 難-0.29", "s": 0.741, "f": 0}, {"x": 0.984, "y": -0.856, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [H]  n=1098 cos0.98 難-0.86", "s": 0.315, "f": 0}, {"x": 0.982, "y": -0.746, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.98 難-0.75", "s": 0.723, "f": 0}, {"x": 0.985, "y": -0.312, "c": "近傍", "n": "Time to Air [H]  n=3133 cos0.98 難-0.31", "s": 0.9, "f": 0}, {"x": 0.985, "y": -0.305, "c": "近傍", "n": "PIT A PAT [A]  n=1538 cos0.98 難-0.30", "s": 0.442, "f": 0}, {"x": 0.984, "y": -0.904, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.98 難-0.90", "s": 0.465, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4214145793343138}, {"a": 0, "b": 2, "w": 0.18749517716928976}, {"a": 0, "b": 3, "w": 0.401930354744089}, {"a": 0, "b": 4, "w": 0.47898053073189106}, {"a": 0, "b": 5, "w": 0.2835210590531394}, {"a": 0, "b": 6, "w": 0.37687444483802457}, {"a": 0, "b": 7, "w": 0.37317639158123317}, {"a": 0, "b": 8, "w": 0.31013683801750414}, {"a": 0, "b": 9, "w": 0.3536104758205828}, {"a": 0, "b": 10, "w": 3.2105318403807814e-11}, {"a": 0, "b": 11, "w": 0.3387727383561897}, {"a": 0, "b": 12, "w": 0.44873742863053745}, {"a": 0, "b": 13, "w": 0.19579889946000428}, {"a": 0, "b": 14, "w": 0.345698574405794}, {"a": 0, "b": 15, "w": 0.2268454725091622}, {"a": 0, "b": 16, "w": 0.16193055448825555}, {"a": 0, "b": 17, "w": 0.11470334672211413}, {"a": 0, "b": 18, "w": 0.10963976946774345}, {"a": 0, "b": 19, "w": 0.2492867623446915}, {"a": 0, "b": 20, "w": 0.1392791452068176}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-0.954,hiY=-0.243;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
