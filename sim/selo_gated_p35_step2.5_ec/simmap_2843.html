<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SPECIAL SUMMER CAMPAIGN! [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.318, "c": "種", "n": "SPECIAL SUMMER CAMPAIGN! [A]  n=3787 cos1.00 難0.32", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.439, "c": "近傍", "n": "紅牡丹 [A]  n=3745 cos1.00 難0.44", "s": 0.989, "f": 0}, {"x": 0.993, "y": 0.225, "c": "近傍", "n": "CHAOTIC SUNBIRD [A]  n=1484 cos0.99 難0.22", "s": 0.392, "f": 0}, {"x": 0.991, "y": 0.377, "c": "近傍", "n": "Chronos [L]  n=2094 cos0.99 難0.38", "s": 0.553, "f": 0}, {"x": 0.994, "y": 0.131, "c": "近傍", "n": "blue anthem [A]  n=514 cos0.99 難0.13", "s": 0.136, "f": 0}, {"x": 0.993, "y": 0.144, "c": "近傍", "n": "儚き恋の華 [A]  n=2559 cos0.99 難0.14", "s": 0.676, "f": 0}, {"x": 0.992, "y": 0.465, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3374 cos0.99 難0.47", "s": 0.891, "f": 0}, {"x": 0.992, "y": 0.439, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2693 cos0.99 難0.44", "s": 0.711, "f": 0}, {"x": 0.99, "y": 0.318, "c": "近傍", "n": "Night! Night! Night! [A]  n=2921 cos0.99 難0.32", "s": 0.771, "f": 0}, {"x": 0.992, "y": 0.459, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [A]  n=3569 cos0.99 難0.46", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.548, "c": "近傍", "n": "ベンガル vs. アムール Battle [A]  n=744 cos0.99 難0.55", "s": 0.196, "f": 0}, {"x": 0.989, "y": 0.309, "c": "近傍", "n": "bloomin' feeling [A]  n=3657 cos0.99 難0.31", "s": 0.966, "f": 0}, {"x": 0.991, "y": 0.472, "c": "近傍", "n": "Pollinosis [A]  n=3354 cos0.99 難0.47", "s": 0.886, "f": 0}, {"x": 0.992, "y": 0.111, "c": "近傍", "n": "GOLD RUSH [A]  n=3698 cos0.99 難0.11", "s": 0.976, "f": 0}, {"x": 0.989, "y": 0.358, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [A]  n=2881 cos0.99 難0.36", "s": 0.761, "f": 0}, {"x": 0.988, "y": 0.311, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.99 難0.31", "s": 0.622, "f": 0}, {"x": 0.995, "y": 0.58, "c": "近傍", "n": "RED ZONE [L]  n=3559 cos0.99 難0.58", "s": 0.94, "f": 0}, {"x": 0.988, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos0.99 難0.30", "s": 0.473, "f": 0}, {"x": 0.989, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos0.99 難0.45", "s": 0.469, "f": 0}, {"x": 0.989, "y": 0.407, "c": "近傍", "n": "THE DEEP STRIKER [A]  n=3383 cos0.99 難0.41", "s": 0.893, "f": 0}, {"x": 0.988, "y": 0.213, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [L]  n=3272 cos0.99 難0.21", "s": 0.864, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5981712233014469}, {"a": 0, "b": 2, "w": 0.41951430103978626}, {"a": 0, "b": 3, "w": 0.2780701145292137}, {"a": 0, "b": 4, "w": 0.41553948096392945}, {"a": 0, "b": 5, "w": 0.3602681129930163}, {"a": 0, "b": 6, "w": 0.30528495757868856}, {"a": 0, "b": 7, "w": 0.08402939404044785}, {"a": 0, "b": 8, "w": 0.23590514127977336}, {"a": 0, "b": 9, "w": 0.3740338562575758}, {"a": 0, "b": 10, "w": 0.3195943562129634}, {"a": 0, "b": 11, "w": 0.23929250473763253}, {"a": 0, "b": 12, "w": 0.09248122493727717}, {"a": 0, "b": 13, "w": 0.14194054669845813}, {"a": 0, "b": 14, "w": 0.2327663207774191}, {"a": 0, "b": 15, "w": 3.404176940335901e-11}, {"a": 0, "b": 16, "w": 0.5086855148662928}, {"a": 0, "b": 17, "w": 0.21544021890910747}, {"a": 0, "b": 18, "w": 0.3018918492301502}, {"a": 0, "b": 19, "w": 0.22503587212364118}, {"a": 0, "b": 20, "w": 0.08310238412548476}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.073,hiY=0.618;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
