<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">NEO GENERATOR SEVEN [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.997, "c": "種", "n": "NEO GENERATOR SEVEN [H]  n=1629 cos1.00 難-1.00", "s": 0.68, "f": 0}, {"x": 0.993, "y": -0.97, "c": "近傍", "n": "No Tears [H]  n=1729 cos0.99 難-0.97", "s": 0.722, "f": 0}, {"x": 0.992, "y": -1.077, "c": "近傍", "n": "RIZING YOU UP [H]  n=1821 cos0.99 難-1.08", "s": 0.76, "f": 0}, {"x": 0.996, "y": -1.217, "c": "近傍", "n": "Vulkan [H]  n=1929 cos1.00 難-1.22", "s": 0.805, "f": 0}, {"x": 0.99, "y": -0.873, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1828 cos0.99 難-0.87", "s": 0.763, "f": 0}, {"x": 0.991, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.99 難-0.83", "s": 0.655, "f": 0}, {"x": 0.994, "y": -0.751, "c": "近傍", "n": "Boundary [H]  n=1742 cos0.99 難-0.75", "s": 0.727, "f": 0}, {"x": 0.987, "y": -0.993, "c": "近傍", "n": "examination leave [H]  n=1911 cos0.99 難-0.99", "s": 0.798, "f": 0}, {"x": 0.989, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.69, "f": 0}, {"x": 0.991, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.733, "f": 0}, {"x": 0.987, "y": -1.112, "c": "近傍", "n": "glacia [H]  n=1069 cos0.99 難-1.11", "s": 0.446, "f": 0}, {"x": 0.987, "y": -1.115, "c": "近傍", "n": "TRIP MACHINE PhoeniX [H]  n=640 cos0.99 難-1.11", "s": 0.267, "f": 0}, {"x": 0.986, "y": -1.075, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.08", "s": 0.308, "f": 0}, {"x": 0.986, "y": -0.991, "c": "近傍", "n": "Rave Patroller [H]  n=1627 cos0.99 難-0.99", "s": 0.679, "f": 0}, {"x": 0.986, "y": -0.925, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos0.99 難-0.92", "s": 0.937, "f": 0}, {"x": 0.989, "y": -0.791, "c": "近傍", "n": "HEISEI [H]  n=2018 cos0.99 難-0.79", "s": 0.843, "f": 0}, {"x": 0.987, "y": -0.837, "c": "近傍", "n": "rottel-the-Mercury [H]  n=1966 cos0.99 難-0.84", "s": 0.821, "f": 0}, {"x": 0.987, "y": -0.836, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos0.99 難-0.84", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.683, "c": "近傍", "n": "HIGH [H]  n=1620 cos0.99 難-0.68", "s": 0.676, "f": 0}, {"x": 0.986, "y": -0.856, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [H]  n=2279 cos0.99 難-0.86", "s": 0.952, "f": 0}, {"x": 0.991, "y": -1.27, "c": "近傍", "n": "≡+≡ [H]  n=1324 cos0.99 難-1.27", "s": 0.553, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33115610396562345}, {"a": 0, "b": 2, "w": 0.20265476731646725}, {"a": 0, "b": 3, "w": 0.484786382105471}, {"a": 0, "b": 4, "w": 0.1617945469240012}, {"a": 0, "b": 5, "w": 0.17359308050535716}, {"a": 0, "b": 6, "w": 0.3088406239129423}, {"a": 0, "b": 7, "w": 0.04722221627326406}, {"a": 0, "b": 8, "w": 0.0489041585176645}, {"a": 0, "b": 9, "w": 0.21934390489035382}, {"a": 0, "b": 10, "w": 0.0058790830350146095}, {"a": 0, "b": 11, "w": 0.029178287581937856}, {"a": 0, "b": 12, "w": 0.003067951293454496}, {"a": 0, "b": 13, "w": 0.008108849774023708}, {"a": 0, "b": 14, "w": 6.31450447485804e-11}, {"a": 0, "b": 15, "w": 0.09524668084885379}, {"a": 0, "b": 16, "w": 0.01656014961844965}, {"a": 0, "b": 17, "w": 0.06611705311715266}, {"a": 0, "b": 18, "w": 0.3402219204603236}, {"a": 0, "b": 19, "w": 0.043843840586063054}, {"a": 0, "b": 20, "w": 0.08146300484472235}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.317,hiY=-0.636;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
