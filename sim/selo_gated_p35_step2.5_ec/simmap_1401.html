<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">King of Tribe [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.793, "c": "種", "n": "King of Tribe [H]  n=272 cos1.00 難-0.79", "s": 0.105, "f": 0}, {"x": 0.997, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos1.00 難-0.81", "s": 0.638, "f": 0}, {"x": 0.996, "y": -0.904, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos1.00 難-0.90", "s": 0.624, "f": 0}, {"x": 0.994, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.677, "f": 0}, {"x": 0.994, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.99 難-0.83", "s": 0.605, "f": 0}, {"x": 0.995, "y": -0.905, "c": "近傍", "n": "1116 [H]  n=662 cos1.00 難-0.91", "s": 0.255, "f": 0}, {"x": 0.993, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.84", "s": 0.771, "f": 0}, {"x": 0.993, "y": -0.856, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [H]  n=1098 cos0.99 難-0.86", "s": 0.424, "f": 0}, {"x": 0.993, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.72", "s": 0.783, "f": 0}, {"x": 0.994, "y": -0.644, "c": "近傍", "n": "金野火織の金色提言 [H]  n=2553 cos0.99 難-0.64", "s": 0.985, "f": 0}, {"x": 0.993, "y": -0.683, "c": "近傍", "n": "DARK LEGACY [H]  n=2282 cos0.99 難-0.68", "s": 0.88, "f": 0}, {"x": 0.993, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.70", "s": 0.693, "f": 0}, {"x": 0.991, "y": -0.741, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.99 難-0.74", "s": 0.818, "f": 0}, {"x": 0.991, "y": -0.811, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1683 cos0.99 難-0.81", "s": 0.649, "f": 0}, {"x": 0.991, "y": -0.836, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos0.99 難-0.84", "s": 0.924, "f": 0}, {"x": 0.991, "y": -0.746, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.99 難-0.75", "s": 0.972, "f": 0}, {"x": 0.991, "y": -0.683, "c": "近傍", "n": "HIGH [H]  n=1620 cos0.99 難-0.68", "s": 0.625, "f": 0}, {"x": 0.995, "y": -1.043, "c": "近傍", "n": "invoker [H]  n=1886 cos1.00 難-1.04", "s": 0.728, "f": 0}, {"x": 0.993, "y": -0.98, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1192 cos0.99 難-0.98", "s": 0.46, "f": 0}, {"x": 0.99, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.72, "f": 0}, {"x": 0.994, "y": -0.556, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.56", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5233035859714427}, {"a": 0, "b": 2, "w": 0.35203349238797066}, {"a": 0, "b": 3, "w": 0.29983823920920205}, {"a": 0, "b": 4, "w": 0.3435318703457767}, {"a": 0, "b": 5, "w": 0.29117818744450197}, {"a": 0, "b": 6, "w": 0.26989676534639384}, {"a": 0, "b": 7, "w": 0.13867563757456047}, {"a": 0, "b": 8, "w": 0.14046519007818825}, {"a": 0, "b": 9, "w": 0.1278018274000785}, {"a": 0, "b": 10, "w": 0.09666513118649467}, {"a": 0, "b": 11, "w": 0.0005298247093161734}, {"a": 0, "b": 12, "w": 0.13137402551636346}, {"a": 0, "b": 13, "w": 0.08611101805958898}, {"a": 0, "b": 14, "w": 0.09702053213907669}, {"a": 0, "b": 15, "w": 0.08477436248130499}, {"a": 0, "b": 16, "w": 0.2082023337633956}, {"a": 0, "b": 17, "w": 0.37672150525610204}, {"a": 0, "b": 18, "w": 0.11105962428528027}, {"a": 0, "b": 19, "w": 6.226485993465758e-11}, {"a": 0, "b": 20, "w": 0.3327398222155892}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-1.082,hiY=-0.518;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
