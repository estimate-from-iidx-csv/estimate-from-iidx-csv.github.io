<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ganymede [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.824, "c": "種", "n": "Ganymede [L]  n=1991 cos1.00 難1.82", "s": 0.606, "f": 0}, {"x": 0.976, "y": 2.022, "c": "近傍", "n": "uen [A]  n=840 cos0.98 難2.02", "s": 0.255, "f": 0}, {"x": 0.958, "y": 1.741, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.96 難1.74", "s": 0.222, "f": 0}, {"x": 0.948, "y": 1.862, "c": "近傍", "n": "華麗なる大犬円舞曲 [A]  n=2636 cos0.95 難1.86", "s": 0.802, "f": 0}, {"x": 0.946, "y": 1.845, "c": "近傍", "n": "The Clown of 24stairs [A]  n=1704 cos0.95 難1.85", "s": 0.518, "f": 0}, {"x": 0.958, "y": 2.037, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2354 cos0.96 難2.04", "s": 0.716, "f": 0}, {"x": 0.947, "y": 1.959, "c": "近傍", "n": "Cross Fire [A]  n=948 cos0.95 難1.96", "s": 0.288, "f": 0}, {"x": 0.942, "y": 1.795, "c": "近傍", "n": "Life Is A Game ft.DD\"ナカタ\"Metal [A]  n=2805 cos0.94 難1.80", "s": 0.853, "f": 0}, {"x": 0.94, "y": 1.869, "c": "近傍", "n": "シムルグの目醒め [A]  n=2840 cos0.94 難1.87", "s": 0.864, "f": 0}, {"x": 0.955, "y": 1.579, "c": "近傍", "n": "Inferno of Fomalhaut [A]  n=2584 cos0.96 難1.58", "s": 0.786, "f": 0}, {"x": 0.939, "y": 1.796, "c": "近傍", "n": "Quakes [A]  n=2875 cos0.94 難1.80", "s": 0.874, "f": 0}, {"x": 0.942, "y": 1.7, "c": "近傍", "n": "GuNGNiR [A]  n=3073 cos0.94 難1.70", "s": 0.935, "f": 0}, {"x": 0.946, "y": 1.648, "c": "近傍", "n": "VOLAQUAS [A]  n=1729 cos0.95 難1.65", "s": 0.526, "f": 0}, {"x": 0.953, "y": 2.063, "c": "近傍", "n": "COSMIC RAY [A]  n=1985 cos0.95 難2.06", "s": 0.604, "f": 0}, {"x": 0.943, "y": 1.649, "c": "近傍", "n": "GRAVITON [A]  n=1936 cos0.94 難1.65", "s": 0.589, "f": 0}, {"x": 0.935, "y": 1.883, "c": "近傍", "n": "PARADISE LOST [A]  n=2879 cos0.93 難1.88", "s": 0.876, "f": 0}, {"x": 0.94, "y": 1.998, "c": "近傍", "n": "four pieces of heaven [L]  n=1299 cos0.94 難2.00", "s": 0.395, "f": 0}, {"x": 0.935, "y": 1.731, "c": "近傍", "n": "冥 [A]  n=3288 cos0.93 難1.73", "s": 1.0, "f": 0}, {"x": 0.936, "y": 1.679, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [A]  n=2324 cos0.94 難1.68", "s": 0.707, "f": 0}, {"x": 0.935, "y": 1.703, "c": "近傍", "n": "NZM [A]  n=2975 cos0.93 難1.70", "s": 0.905, "f": 0}, {"x": 0.932, "y": 1.911, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1790 cos0.93 難1.91", "s": 0.544, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5967696638825984}, {"a": 0, "b": 2, "w": 0.42933570452194025}, {"a": 0, "b": 3, "w": 0.2798828354637902}, {"a": 0, "b": 4, "w": 0.17289300738651114}, {"a": 0, "b": 5, "w": 0.48386916375647804}, {"a": 0, "b": 6, "w": 0.3503734283250656}, {"a": 0, "b": 7, "w": 0.18871865979887348}, {"a": 0, "b": 8, "w": 0.2854907879455374}, {"a": 0, "b": 9, "w": 0.2787553807590508}, {"a": 0, "b": 10, "w": 0.2684950173166929}, {"a": 0, "b": 11, "w": 0.20050092430951882}, {"a": 0, "b": 12, "w": 0.244885180380627}, {"a": 0, "b": 13, "w": 0.42338435476043734}, {"a": 0, "b": 14, "w": 0.3716709759296227}, {"a": 0, "b": 15, "w": 0.27091466105739215}, {"a": 0, "b": 16, "w": 0.31989298990896486}, {"a": 0, "b": 17, "w": 1.3165801782122344e-11}, {"a": 0, "b": 18, "w": 0.19261246413332334}, {"a": 0, "b": 19, "w": 0.19017686393019373}, {"a": 0, "b": 20, "w": 0.23895237412970816}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.927,hiX=1.005,loY=1.540,hiY=2.101;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
