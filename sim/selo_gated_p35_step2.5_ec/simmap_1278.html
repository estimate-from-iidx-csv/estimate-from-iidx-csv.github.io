<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BLUE MIRAGE [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.583, "c": "種", "n": "BLUE MIRAGE [H]  n=2390 cos1.00 難-0.58", "s": 0.741, "f": 0}, {"x": 0.995, "y": -0.605, "c": "近傍", "n": "Xlo [H]  n=2314 cos1.00 難-0.60", "s": 0.717, "f": 0}, {"x": 0.994, "y": -0.59, "c": "近傍", "n": "DIAVOLO [H]  n=3226 cos0.99 難-0.59", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.709, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos1.00 難-0.71", "s": 0.576, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.68", "s": 0.438, "f": 0}, {"x": 0.994, "y": -0.631, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2363 cos0.99 難-0.63", "s": 0.732, "f": 0}, {"x": 0.993, "y": -0.639, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.64", "s": 0.931, "f": 0}, {"x": 0.993, "y": -0.563, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1934 cos0.99 難-0.56", "s": 0.6, "f": 0}, {"x": 0.997, "y": -0.77, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos1.00 難-0.77", "s": 0.692, "f": 0}, {"x": 0.996, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos1.00 難-0.76", "s": 0.777, "f": 0}, {"x": 0.997, "y": -0.386, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos1.00 難-0.39", "s": 0.745, "f": 0}, {"x": 0.992, "y": -0.632, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.63", "s": 0.758, "f": 0}, {"x": 0.992, "y": -0.658, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.66", "s": 0.488, "f": 0}, {"x": 0.992, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.99 難-0.57", "s": 0.708, "f": 0}, {"x": 0.998, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos1.00 難-0.81", "s": 0.294, "f": 0}, {"x": 0.992, "y": -0.666, "c": "近傍", "n": "LAB [H]  n=1742 cos0.99 難-0.67", "s": 0.54, "f": 0}, {"x": 0.991, "y": -0.569, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.57", "s": 0.805, "f": 0}, {"x": 0.992, "y": -0.689, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2334 cos0.99 難-0.69", "s": 0.723, "f": 0}, {"x": 0.993, "y": -0.752, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.75", "s": 0.488, "f": 0}, {"x": 0.994, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.683, "f": 0}, {"x": 0.991, "y": -0.572, "c": "近傍", "n": "VOID [H]  n=878 cos0.99 難-0.57", "s": 0.272, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33553656666486265}, {"a": 0, "b": 2, "w": 0.12488235556447969}, {"a": 0, "b": 3, "w": 0.4515441946068903}, {"a": 0, "b": 4, "w": 0.12313716614718939}, {"a": 0, "b": 5, "w": 0.2511834409283096}, {"a": 0, "b": 6, "w": 0.13039170393068633}, {"a": 0, "b": 7, "w": 0.25077662439613724}, {"a": 0, "b": 8, "w": 0.47952108240569413}, {"a": 0, "b": 9, "w": 0.37486230972283296}, {"a": 0, "b": 10, "w": 0.5357821826870537}, {"a": 0, "b": 11, "w": 0.26193888671238996}, {"a": 0, "b": 12, "w": 0.2646570633500658}, {"a": 0, "b": 13, "w": 5.5778937024797415e-11}, {"a": 0, "b": 14, "w": 0.5400027864139842}, {"a": 0, "b": 15, "w": 0.17500458254510265}, {"a": 0, "b": 16, "w": 0.1385253402660369}, {"a": 0, "b": 17, "w": 0.19792766551337337}, {"a": 0, "b": 18, "w": 0.3013322495315337}, {"a": 0, "b": 19, "w": 0.3433050561284494}, {"a": 0, "b": 20, "w": 0.07615538985961323}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.846,hiY=-0.352;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
