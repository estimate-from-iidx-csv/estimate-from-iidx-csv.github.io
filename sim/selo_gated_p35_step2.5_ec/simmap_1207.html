<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">水無月の雫 ft. 小林まな [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.147, "c": "種", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos1.00 難-0.15", "s": 0.711, "f": 0}, {"x": 0.997, "y": -0.163, "c": "近傍", "n": "■□模様 [A]  n=1388 cos1.00 難-0.16", "s": 0.383, "f": 0}, {"x": 0.997, "y": -0.257, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos1.00 難-0.26", "s": 0.665, "f": 0}, {"x": 0.996, "y": -0.195, "c": "近傍", "n": "夏の匂い。キミの残像。 ft. Kanae Asaba [A]  n=3233 cos1.00 難-0.20", "s": 0.893, "f": 0}, {"x": 0.996, "y": -0.021, "c": "近傍", "n": "SigSig [A]  n=3612 cos1.00 難-0.02", "s": 0.998, "f": 0}, {"x": 0.997, "y": -0.298, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2122 cos1.00 難-0.30", "s": 0.586, "f": 0}, {"x": 0.996, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.04", "s": 0.769, "f": 0}, {"x": 0.994, "y": -0.193, "c": "近傍", "n": "Mel [L]  n=613 cos0.99 難-0.19", "s": 0.169, "f": 0}, {"x": 0.995, "y": -0.236, "c": "近傍", "n": "FERMI PARADOX [A]  n=1461 cos0.99 難-0.24", "s": 0.403, "f": 0}, {"x": 0.994, "y": -0.197, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos0.99 難-0.20", "s": 0.951, "f": 0}, {"x": 0.995, "y": -0.028, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos1.00 難-0.03", "s": 0.854, "f": 0}, {"x": 0.994, "y": -0.223, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos0.99 難-0.22", "s": 0.704, "f": 0}, {"x": 0.996, "y": -0.31, "c": "近傍", "n": "アイドル [A]  n=2110 cos1.00 難-0.31", "s": 0.583, "f": 0}, {"x": 0.994, "y": -0.109, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos0.99 難-0.11", "s": 0.858, "f": 0}, {"x": 0.995, "y": -0.256, "c": "近傍", "n": "Drive Me Crazy [A]  n=3472 cos0.99 難-0.26", "s": 0.959, "f": 0}, {"x": 0.995, "y": -0.285, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.28", "s": 0.837, "f": 0}, {"x": 0.994, "y": -0.27, "c": "近傍", "n": "AGETEKE ONDO [A]  n=1013 cos0.99 難-0.27", "s": 0.28, "f": 0}, {"x": 0.996, "y": -0.318, "c": "近傍", "n": "ゲシュタルト [A]  n=1500 cos1.00 難-0.32", "s": 0.414, "f": 0}, {"x": 0.993, "y": -0.136, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.14", "s": 0.869, "f": 0}, {"x": 0.995, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos1.00 難0.03", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.027, "c": "近傍", "n": "Damage Per Second [L]  n=2954 cos0.99 難-0.03", "s": 0.816, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5642875815709449}, {"a": 0, "b": 2, "w": 0.5303294544320099}, {"a": 0, "b": 3, "w": 0.4967587225526623}, {"a": 0, "b": 4, "w": 0.45697558769082647}, {"a": 0, "b": 5, "w": 0.572224837982126}, {"a": 0, "b": 6, "w": 0.4826765512249934}, {"a": 0, "b": 7, "w": 5.36458655275851e-11}, {"a": 0, "b": 8, "w": 0.24261723700030546}, {"a": 0, "b": 9, "w": 0.40503019867420365}, {"a": 0, "b": 10, "w": 0.40901871207102913}, {"a": 0, "b": 11, "w": 0.1816155019659429}, {"a": 0, "b": 12, "w": 0.5012099818963689}, {"a": 0, "b": 13, "w": 0.3971239947282389}, {"a": 0, "b": 14, "w": 0.4076282183319232}, {"a": 0, "b": 15, "w": 0.426633795042611}, {"a": 0, "b": 16, "w": 0.2853273998130186}, {"a": 0, "b": 17, "w": 0.48000619097054453}, {"a": 0, "b": 18, "w": 0.34769544562282273}, {"a": 0, "b": 19, "w": 0.4590842745910382}, {"a": 0, "b": 20, "w": 0.3773981341406467}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.346,hiY=0.056;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
