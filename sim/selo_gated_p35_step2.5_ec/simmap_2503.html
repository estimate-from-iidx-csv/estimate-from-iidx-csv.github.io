<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ambivalent Vermilia [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.389, "c": "種", "n": "Ambivalent Vermilia [A]  n=1151 cos1.00 難2.39", "s": 0.38, "f": 0}, {"x": 0.994, "y": 2.434, "c": "近傍", "n": "Override [L]  n=1612 cos0.99 難2.43", "s": 0.532, "f": 0}, {"x": 0.993, "y": 2.435, "c": "近傍", "n": "IX [A]  n=2727 cos0.99 難2.43", "s": 0.899, "f": 0}, {"x": 0.996, "y": 2.317, "c": "近傍", "n": "Confiserie [A]  n=2903 cos1.00 難2.32", "s": 0.957, "f": 0}, {"x": 0.981, "y": 2.381, "c": "近傍", "n": "LIGHTNING STRIKES [L]  n=1109 cos0.98 難2.38", "s": 0.366, "f": 0}, {"x": 0.979, "y": 2.372, "c": "近傍", "n": "Binary Black Hole [A]  n=1876 cos0.98 難2.37", "s": 0.619, "f": 0}, {"x": 0.983, "y": 2.318, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.98 難2.32", "s": 0.756, "f": 0}, {"x": 0.978, "y": 2.381, "c": "近傍", "n": "VANESSA [L]  n=2321 cos0.98 難2.38", "s": 0.766, "f": 0}, {"x": 0.98, "y": 2.452, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.98 難2.45", "s": 0.693, "f": 0}, {"x": 0.976, "y": 2.386, "c": "近傍", "n": "EMERALDAS [A]  n=2713 cos0.98 難2.39", "s": 0.895, "f": 0}, {"x": 0.98, "y": 2.304, "c": "近傍", "n": "CONTRACT [L]  n=2438 cos0.98 難2.30", "s": 0.804, "f": 0}, {"x": 0.974, "y": 2.427, "c": "近傍", "n": "VOID [A]  n=1272 cos0.97 難2.43", "s": 0.42, "f": 0}, {"x": 0.973, "y": 2.342, "c": "近傍", "n": "Everlasting Message [A]  n=2265 cos0.97 難2.34", "s": 0.747, "f": 0}, {"x": 0.977, "y": 2.494, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [A]  n=1055 cos0.98 難2.49", "s": 0.348, "f": 0}, {"x": 0.974, "y": 2.309, "c": "近傍", "n": "HYENA [L]  n=760 cos0.97 難2.31", "s": 0.251, "f": 0}, {"x": 0.983, "y": 2.254, "c": "近傍", "n": "THE F∀UST [A]  n=2481 cos0.98 難2.25", "s": 0.818, "f": 0}, {"x": 0.978, "y": 2.273, "c": "近傍", "n": "Sigmund [A]  n=3032 cos0.98 難2.27", "s": 1.0, "f": 0}, {"x": 0.985, "y": 2.236, "c": "近傍", "n": "Vulnerability [A]  n=1145 cos0.99 難2.24", "s": 0.378, "f": 0}, {"x": 0.986, "y": 2.552, "c": "近傍", "n": "Elemental Creation [A]  n=2833 cos0.99 難2.55", "s": 0.934, "f": 0}, {"x": 0.979, "y": 2.531, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [A]  n=2908 cos0.98 難2.53", "s": 0.959, "f": 0}, {"x": 0.984, "y": 2.223, "c": "近傍", "n": "≡+≡ [L]  n=746 cos0.98 難2.22", "s": 0.246, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.551490810877788}, {"a": 0, "b": 2, "w": 0.5209615490279824}, {"a": 0, "b": 3, "w": 0.6033166102244136}, {"a": 0, "b": 4, "w": 0.21581265508146052}, {"a": 0, "b": 5, "w": 0.17815970867870579}, {"a": 0, "b": 6, "w": 0.26489423207257023}, {"a": 0, "b": 7, "w": 0.1605032723807327}, {"a": 0, "b": 8, "w": 0.19733076507474845}, {"a": 0, "b": 9, "w": 0.09882007404419113}, {"a": 0, "b": 10, "w": 2.2678081634808223e-11}, {"a": 0, "b": 11, "w": 0.0651044892160959}, {"a": 0, "b": 12, "w": 0.0317449698708675}, {"a": 0, "b": 13, "w": 0.1278723194564222}, {"a": 0, "b": 14, "w": 0.07739581486826597}, {"a": 0, "b": 15, "w": 0.22709645402135825}, {"a": 0, "b": 16, "w": 0.1631616159855538}, {"a": 0, "b": 17, "w": 0.25375747188780917}, {"a": 0, "b": 18, "w": 0.2139501125817571}, {"a": 0, "b": 19, "w": 0.16055960174833672}, {"a": 0, "b": 20, "w": 0.04262934085990522}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=2.197,hiY=2.578;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
