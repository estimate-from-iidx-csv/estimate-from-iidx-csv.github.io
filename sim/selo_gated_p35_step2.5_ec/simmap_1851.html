<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Elektrick U-Phoria [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.2, "c": "種", "n": "Elektrick U-Phoria [A]  n=3481 cos1.00 難0.20", "s": 0.942, "f": 0}, {"x": 0.998, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.18", "s": 0.442, "f": 0}, {"x": 0.997, "y": 0.19, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos1.00 難0.19", "s": 0.931, "f": 0}, {"x": 0.998, "y": 0.257, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos1.00 難0.26", "s": 0.452, "f": 0}, {"x": 0.998, "y": 0.132, "c": "近傍", "n": "Override [A]  n=3124 cos1.00 難0.13", "s": 0.845, "f": 0}, {"x": 0.998, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos1.00 難0.13", "s": 1.0, "f": 0}, {"x": 0.998, "y": 0.111, "c": "近傍", "n": "アイドル [L]  n=1439 cos1.00 難0.11", "s": 0.389, "f": 0}, {"x": 0.997, "y": 0.121, "c": "近傍", "n": "Swing My Wonderland [A]  n=1629 cos1.00 難0.12", "s": 0.441, "f": 0}, {"x": 0.998, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos1.00 難0.30", "s": 0.485, "f": 0}, {"x": 0.996, "y": 0.213, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [L]  n=3272 cos1.00 難0.21", "s": 0.885, "f": 0}, {"x": 0.996, "y": 0.183, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos1.00 難0.18", "s": 0.913, "f": 0}, {"x": 0.996, "y": 0.121, "c": "近傍", "n": "DEEP ROAR [A]  n=1658 cos1.00 難0.12", "s": 0.448, "f": 0}, {"x": 0.996, "y": 0.125, "c": "近傍", "n": "夢縁 [A]  n=1910 cos1.00 難0.12", "s": 0.517, "f": 0}, {"x": 0.996, "y": 0.275, "c": "近傍", "n": "yamabiko (SINOBUZ Edition) [A]  n=3150 cos1.00 難0.27", "s": 0.852, "f": 0}, {"x": 0.995, "y": 0.144, "c": "近傍", "n": "儚き恋の華 [A]  n=2559 cos1.00 難0.14", "s": 0.692, "f": 0}, {"x": 0.995, "y": 0.218, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2290 cos0.99 難0.22", "s": 0.619, "f": 0}, {"x": 0.995, "y": 0.18, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.18", "s": 0.519, "f": 0}, {"x": 0.995, "y": 0.165, "c": "近傍", "n": "Fashion Fruit [A]  n=1057 cos0.99 難0.17", "s": 0.286, "f": 0}, {"x": 0.995, "y": 0.099, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos1.00 難0.10", "s": 0.288, "f": 0}, {"x": 0.994, "y": 0.173, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos0.99 難0.17", "s": 0.477, "f": 0}, {"x": 0.994, "y": 0.237, "c": "近傍", "n": "UNITE THE HEART [A]  n=2852 cos0.99 難0.24", "s": 0.771, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3008064019071952}, {"a": 0, "b": 2, "w": 0.30881795282006963}, {"a": 0, "b": 3, "w": 0.17165975830301505}, {"a": 0, "b": 4, "w": 0.45889635169791754}, {"a": 0, "b": 5, "w": 0.4423566427002371}, {"a": 0, "b": 6, "w": 0.4936404883621197}, {"a": 0, "b": 7, "w": 0.3507512053086552}, {"a": 0, "b": 8, "w": 0.46705486734743584}, {"a": 0, "b": 9, "w": 0.18918409851250995}, {"a": 0, "b": 10, "w": 0.2133415280099955}, {"a": 0, "b": 11, "w": 0.142446016723221}, {"a": 0, "b": 12, "w": 0.16575372401159072}, {"a": 0, "b": 13, "w": 0.06632177023705232}, {"a": 0, "b": 14, "w": 0.2457974295700016}, {"a": 0, "b": 15, "w": 0.1866746107350188}, {"a": 0, "b": 16, "w": 0.07069986857588595}, {"a": 0, "b": 17, "w": 0.1390529428663746}, {"a": 0, "b": 18, "w": 5.891687138159796e-11}, {"a": 0, "b": 19, "w": 0.1237188829291822}, {"a": 0, "b": 20, "w": 0.14373832666387998}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.083,hiY=0.312;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
