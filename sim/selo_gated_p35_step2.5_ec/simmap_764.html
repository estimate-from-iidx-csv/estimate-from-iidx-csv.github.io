<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Backyard Stars [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.015, "c": "種", "n": "Backyard Stars [A]  n=2698 cos1.00 難0.02", "s": 0.799, "f": 0}, {"x": 0.998, "y": -0.13, "c": "近傍", "n": "Devilz Staircase [H]  n=2866 cos1.00 難-0.13", "s": 0.849, "f": 0}, {"x": 0.994, "y": 0.044, "c": "近傍", "n": "Hard Breaker [A]  n=1314 cos0.99 難0.04", "s": 0.389, "f": 0}, {"x": 0.996, "y": 0.272, "c": "近傍", "n": "君のハートにロックオン [A]  n=3377 cos1.00 難0.27", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "子供の落書き帳 [H]  n=2786 cos0.99 難-0.19", "s": 0.825, "f": 0}, {"x": 0.992, "y": 0.069, "c": "近傍", "n": "Praludium [A]  n=2983 cos0.99 難0.07", "s": 0.883, "f": 0}, {"x": 0.992, "y": 0.138, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.14", "s": 0.668, "f": 0}, {"x": 0.995, "y": -0.267, "c": "近傍", "n": "煉獄のエルフェリア [H]  n=3107 cos0.99 難-0.27", "s": 0.92, "f": 0}, {"x": 0.992, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos0.99 難0.12", "s": 0.768, "f": 0}, {"x": 0.992, "y": 0.093, "c": "近傍", "n": "Amethyst [A]  n=1480 cos0.99 難0.09", "s": 0.438, "f": 0}, {"x": 0.992, "y": -0.178, "c": "近傍", "n": "Vermilion [A]  n=3040 cos0.99 難-0.18", "s": 0.9, "f": 0}, {"x": 0.992, "y": 0.225, "c": "近傍", "n": "Nasty Techniques [A]  n=2976 cos0.99 難0.22", "s": 0.881, "f": 0}, {"x": 0.993, "y": 0.258, "c": "近傍", "n": "rainbow flyer [A]  n=3359 cos0.99 難0.26", "s": 0.995, "f": 0}, {"x": 0.991, "y": -0.067, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1359 cos0.99 難-0.07", "s": 0.402, "f": 0}, {"x": 0.991, "y": 0.107, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos0.99 難0.11", "s": 0.333, "f": 0}, {"x": 0.991, "y": -0.081, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2907 cos0.99 難-0.08", "s": 0.861, "f": 0}, {"x": 0.991, "y": 0.175, "c": "近傍", "n": "LASER CRUSTER [H]  n=3204 cos0.99 難0.18", "s": 0.949, "f": 0}, {"x": 0.991, "y": 0.077, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2617 cos0.99 難0.08", "s": 0.775, "f": 0}, {"x": 0.991, "y": 0.213, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.21", "s": 0.986, "f": 0}, {"x": 0.991, "y": 0.238, "c": "近傍", "n": "HYPERION [A]  n=3347 cos0.99 難0.24", "s": 0.991, "f": 0}, {"x": 0.991, "y": -0.178, "c": "近傍", "n": "Violet Pulse [A]  n=2914 cos0.99 難-0.18", "s": 0.863, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6781739048810873}, {"a": 0, "b": 2, "w": 0.2598369965928963}, {"a": 0, "b": 3, "w": 0.5304135553032014}, {"a": 0, "b": 4, "w": 0.5046610573603254}, {"a": 0, "b": 5, "w": 0.45225540316777857}, {"a": 0, "b": 6, "w": 0.41313486100118946}, {"a": 0, "b": 7, "w": 0.4826969274164701}, {"a": 0, "b": 8, "w": 0.43345831017342373}, {"a": 0, "b": 9, "w": 0.28022048356948537}, {"a": 0, "b": 10, "w": 0.45329972809075914}, {"a": 0, "b": 11, "w": 0.15670152514186897}, {"a": 0, "b": 12, "w": 0.4709099482374183}, {"a": 0, "b": 13, "w": 0.39337994552115074}, {"a": 0, "b": 14, "w": 4.21193080413218e-11}, {"a": 0, "b": 15, "w": 0.40227437415721057}, {"a": 0, "b": 16, "w": 0.39222048086480843}, {"a": 0, "b": 17, "w": 0.394636847241998}, {"a": 0, "b": 18, "w": 0.36205320134496166}, {"a": 0, "b": 19, "w": 0.38437104141855316}, {"a": 0, "b": 20, "w": 0.4032519208658234}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.311,hiY=0.315;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
