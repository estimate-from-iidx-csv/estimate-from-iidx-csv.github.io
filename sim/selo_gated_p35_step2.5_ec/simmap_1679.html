<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LUV CAN SAVE U [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.109, "c": "種", "n": "LUV CAN SAVE U [L]  n=2988 cos1.00 難-0.11", "s": 0.797, "f": 0}, {"x": 0.996, "y": -0.231, "c": "近傍", "n": "Secret Rouge [A]  n=1564 cos1.00 難-0.23", "s": 0.417, "f": 0}, {"x": 0.996, "y": 0.005, "c": "近傍", "n": "OOO [L]  n=863 cos1.00 難0.00", "s": 0.23, "f": 0}, {"x": 0.995, "y": -0.164, "c": "近傍", "n": "The Sky of Sadness [A]  n=2249 cos0.99 難-0.16", "s": 0.6, "f": 0}, {"x": 0.994, "y": -0.193, "c": "近傍", "n": "8bit Princess [A]  n=3429 cos0.99 難-0.19", "s": 0.915, "f": 0}, {"x": 0.994, "y": -0.194, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos0.99 難-0.19", "s": 0.35, "f": 0}, {"x": 0.993, "y": -0.187, "c": "近傍", "n": "Eleanor [A]  n=1367 cos0.99 難-0.19", "s": 0.365, "f": 0}, {"x": 0.992, "y": -0.168, "c": "近傍", "n": "可愛くてごめん [L]  n=1106 cos0.99 難-0.17", "s": 0.295, "f": 0}, {"x": 0.992, "y": -0.196, "c": "近傍", "n": "LESSON 5 [A]  n=2304 cos0.99 難-0.20", "s": 0.615, "f": 0}, {"x": 0.994, "y": 0.081, "c": "近傍", "n": "n'pa pa BBQ [A]  n=3524 cos0.99 難0.08", "s": 0.94, "f": 0}, {"x": 0.995, "y": 0.11, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos0.99 難0.11", "s": 0.636, "f": 0}, {"x": 0.992, "y": -0.032, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos0.99 難-0.03", "s": 0.864, "f": 0}, {"x": 0.992, "y": -0.196, "c": "近傍", "n": "Last Burning [A]  n=3170 cos0.99 難-0.20", "s": 0.846, "f": 0}, {"x": 0.992, "y": 0.005, "c": "近傍", "n": "Line 4 Ruin [A]  n=3747 cos0.99 難0.00", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.018, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos0.99 難0.02", "s": 0.968, "f": 0}, {"x": 0.994, "y": 0.105, "c": "近傍", "n": "朧 [L]  n=3664 cos0.99 難0.10", "s": 0.978, "f": 0}, {"x": 0.992, "y": -0.248, "c": "近傍", "n": "Dreaming Dream [A]  n=1434 cos0.99 難-0.25", "s": 0.383, "f": 0}, {"x": 0.995, "y": 0.129, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos0.99 難0.13", "s": 0.949, "f": 0}, {"x": 0.991, "y": -0.182, "c": "近傍", "n": "消極的セツナイズム [A]  n=1234 cos0.99 難-0.18", "s": 0.329, "f": 0}, {"x": 0.991, "y": -0.045, "c": "近傍", "n": "ラビットホール [A]  n=1777 cos0.99 難-0.05", "s": 0.474, "f": 0}, {"x": 0.994, "y": 0.131, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos0.99 難0.13", "s": 0.485, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3245240663594018}, {"a": 0, "b": 2, "w": 0.5367269633312752}, {"a": 0, "b": 3, "w": 0.3912843610875172}, {"a": 0, "b": 4, "w": 0.3410204915846199}, {"a": 0, "b": 5, "w": 0.2883278077925421}, {"a": 0, "b": 6, "w": 0.37029526033986015}, {"a": 0, "b": 7, "w": 0.34966857307184296}, {"a": 0, "b": 8, "w": 0.30530258077185135}, {"a": 0, "b": 9, "w": 0.3675205115224929}, {"a": 0, "b": 10, "w": 0.4652874324267092}, {"a": 0, "b": 11, "w": 0.3276494932034757}, {"a": 0, "b": 12, "w": 4.444766776856568e-11}, {"a": 0, "b": 13, "w": 0.3590382045280269}, {"a": 0, "b": 14, "w": 0.3478802210583368}, {"a": 0, "b": 15, "w": 0.4090492123671349}, {"a": 0, "b": 16, "w": 0.2706772233008009}, {"a": 0, "b": 17, "w": 0.4740433930893212}, {"a": 0, "b": 18, "w": 0.1140745092797052}, {"a": 0, "b": 19, "w": 0.3023507972000168}, {"a": 0, "b": 20, "w": 0.38178529115418325}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.278,hiY=0.161;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
