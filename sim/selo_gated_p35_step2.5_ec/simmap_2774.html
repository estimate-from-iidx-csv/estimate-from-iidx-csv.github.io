<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Primitive Vibes [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.295, "c": "種", "n": "Primitive Vibes [A]  n=3448 cos1.00 難0.30", "s": 0.986, "f": 0}, {"x": 0.996, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.26", "s": 0.294, "f": 0}, {"x": 0.995, "y": 0.312, "c": "近傍", "n": "LAST DAY [A]  n=2629 cos1.00 難0.31", "s": 0.752, "f": 0}, {"x": 0.995, "y": 0.36, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1132 cos1.00 難0.36", "s": 0.324, "f": 0}, {"x": 0.994, "y": 0.257, "c": "近傍", "n": "Explorer feat. ぷにぷに電機 [L]  n=1405 cos0.99 難0.26", "s": 0.402, "f": 0}, {"x": 0.995, "y": 0.405, "c": "近傍", "n": "Secrets [A]  n=3366 cos0.99 難0.40", "s": 0.963, "f": 0}, {"x": 0.994, "y": 0.33, "c": "近傍", "n": "2 tribe 4 K [A]  n=3259 cos0.99 難0.33", "s": 0.932, "f": 0}, {"x": 0.994, "y": 0.363, "c": "近傍", "n": "Moving on [A]  n=3017 cos0.99 難0.36", "s": 0.863, "f": 0}, {"x": 0.993, "y": 0.293, "c": "近傍", "n": "Advent Infamous [A]  n=2555 cos0.99 難0.29", "s": 0.731, "f": 0}, {"x": 0.996, "y": 0.474, "c": "近傍", "n": "ユミル [A]  n=3395 cos1.00 難0.47", "s": 0.971, "f": 0}, {"x": 0.995, "y": 0.131, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos1.00 難0.13", "s": 0.52, "f": 0}, {"x": 0.995, "y": 0.127, "c": "近傍", "n": "ミッドナイト堕天使 [A]  n=3398 cos1.00 難0.13", "s": 0.972, "f": 0}, {"x": 0.993, "y": 0.376, "c": "近傍", "n": "& Intelligence [A]  n=2938 cos0.99 難0.38", "s": 0.84, "f": 0}, {"x": 0.993, "y": 0.18, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.18", "s": 0.549, "f": 0}, {"x": 0.993, "y": 0.228, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos0.99 難0.23", "s": 0.824, "f": 0}, {"x": 0.992, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos0.99 難0.27", "s": 0.979, "f": 0}, {"x": 0.992, "y": 0.245, "c": "近傍", "n": "Divine Heaven [A]  n=1989 cos0.99 難0.24", "s": 0.569, "f": 0}, {"x": 0.992, "y": 0.295, "c": "近傍", "n": "ウツシミウツシ [A]  n=2337 cos0.99 難0.30", "s": 0.668, "f": 0}, {"x": 0.993, "y": 0.439, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.44", "s": 0.569, "f": 0}, {"x": 0.992, "y": 0.173, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos0.99 難0.17", "s": 0.505, "f": 0}, {"x": 0.991, "y": 0.359, "c": "近傍", "n": "VEGA [A]  n=3496 cos0.99 難0.36", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.10110872315534003}, {"a": 0, "b": 2, "w": 0.31179344195847747}, {"a": 0, "b": 3, "w": 0.24921474984510572}, {"a": 0, "b": 4, "w": 0.012987593193239055}, {"a": 0, "b": 5, "w": 0.3216591122113249}, {"a": 0, "b": 6, "w": 0.0776850636696419}, {"a": 0, "b": 7, "w": 0.04840104360398545}, {"a": 0, "b": 8, "w": 0.21006359784954143}, {"a": 0, "b": 9, "w": 0.3350117601425684}, {"a": 0, "b": 10, "w": 0.23820622562610028}, {"a": 0, "b": 11, "w": 5.084566101487553e-11}, {"a": 0, "b": 12, "w": 0.19038534472655533}, {"a": 0, "b": 13, "w": 0.1305585028571442}, {"a": 0, "b": 14, "w": 0.07958733670905582}, {"a": 0, "b": 15, "w": 0.0679867711856128}, {"a": 0, "b": 16, "w": 0.16143915488456695}, {"a": 0, "b": 17, "w": 0.14580018402059036}, {"a": 0, "b": 18, "w": 0.17016823780471757}, {"a": 0, "b": 19, "w": 0.14583248659864412}, {"a": 0, "b": 20, "w": 0.06103991471441572}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.099,hiY=0.501;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
