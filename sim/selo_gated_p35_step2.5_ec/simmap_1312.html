<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DIAMOND CROSSING [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.408, "c": "種", "n": "DIAMOND CROSSING [H]  n=3069 cos1.00 難-0.41", "s": 0.95, "f": 0}, {"x": 0.986, "y": -0.438, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2752 cos0.99 難-0.44", "s": 0.852, "f": 0}, {"x": 0.987, "y": -0.188, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.99 難-0.19", "s": 0.385, "f": 0}, {"x": 0.983, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.98 難-0.37", "s": 0.291, "f": 0}, {"x": 0.994, "y": -0.808, "c": "近傍", "n": "栄冠のカンパネラ [H]  n=1245 cos0.99 難-0.81", "s": 0.385, "f": 0}, {"x": 0.981, "y": -0.241, "c": "近傍", "n": "Golden Palms [A]  n=3230 cos0.98 難-0.24", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.806, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2823 cos0.99 難-0.81", "s": 0.874, "f": 0}, {"x": 0.978, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.98 難-0.41", "s": 0.965, "f": 0}, {"x": 0.978, "y": -0.479, "c": "近傍", "n": "真夏の花・真夏の夢 [A]  n=2783 cos0.98 難-0.48", "s": 0.862, "f": 0}, {"x": 0.978, "y": -0.414, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2947 cos0.98 難-0.41", "s": 0.912, "f": 0}, {"x": 0.986, "y": -0.822, "c": "近傍", "n": "EROICA [H]  n=2238 cos0.99 難-0.82", "s": 0.693, "f": 0}, {"x": 0.978, "y": -0.248, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.98 難-0.25", "s": 0.778, "f": 0}, {"x": 0.976, "y": -0.248, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2165 cos0.98 難-0.25", "s": 0.67, "f": 0}, {"x": 0.979, "y": -0.714, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.98 難-0.71", "s": 0.941, "f": 0}, {"x": 0.993, "y": 0.151, "c": "近傍", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2956 cos0.99 難0.15", "s": 0.915, "f": 0}, {"x": 0.972, "y": -0.425, "c": "近傍", "n": "REcorrection [A]  n=689 cos0.97 難-0.43", "s": 0.213, "f": 0}, {"x": 0.972, "y": -0.242, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2857 cos0.97 難-0.24", "s": 0.885, "f": 0}, {"x": 0.971, "y": -0.415, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.97 難-0.42", "s": 0.93, "f": 0}, {"x": 0.973, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.97 難-0.72", "s": 0.997, "f": 0}, {"x": 0.971, "y": -0.61, "c": "近傍", "n": "Signs and Wonders [A]  n=603 cos0.97 難-0.61", "s": 0.187, "f": 0}, {"x": 0.976, "y": -0.809, "c": "近傍", "n": "Scharfrichter [H]  n=2653 cos0.98 難-0.81", "s": 0.821, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2319394278657475}, {"a": 0, "b": 2, "w": 0.43679014314427766}, {"a": 0, "b": 3, "w": 0.25299663671425554}, {"a": 0, "b": 4, "w": 0.6195458612613003}, {"a": 0, "b": 5, "w": 0.3314463300587306}, {"a": 0, "b": 6, "w": 0.39896701480408436}, {"a": 0, "b": 7, "w": 0.2373171510067057}, {"a": 0, "b": 8, "w": 0.09536613900768642}, {"a": 0, "b": 9, "w": 0.08769700739156905}, {"a": 0, "b": 10, "w": 0.45548643557456336}, {"a": 0, "b": 11, "w": 0.30314882337423477}, {"a": 0, "b": 12, "w": 0.24179985900871492}, {"a": 0, "b": 13, "w": 0.09134001484952348}, {"a": 0, "b": 14, "w": 0.6076223517009136}, {"a": 0, "b": 15, "w": 0.11952225625613833}, {"a": 0, "b": 16, "w": 0.1690556538384016}, {"a": 0, "b": 17, "w": 0.19497513775166786}, {"a": 0, "b": 18, "w": 3.015876437473253e-11}, {"a": 0, "b": 19, "w": 0.12350268603500758}, {"a": 0, "b": 20, "w": 0.011149501324869915}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.900,hiY=0.229;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
