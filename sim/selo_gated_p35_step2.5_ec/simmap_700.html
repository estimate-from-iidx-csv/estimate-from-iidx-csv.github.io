<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">爆ゼニ☆がってんワーカー [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.542, "c": "種", "n": "爆ゼニ☆がってんワーカー [H]  n=1136 cos1.00 難-1.54", "s": 0.691, "f": 0}, {"x": 0.993, "y": -1.547, "c": "近傍", "n": "ZENDEGI DANCE [H]  n=1083 cos0.99 難-1.55", "s": 0.659, "f": 0}, {"x": 0.992, "y": -1.509, "c": "近傍", "n": "ZEPHYRANTHES [H]  n=1643 cos0.99 難-1.51", "s": 1.0, "f": 0}, {"x": 0.984, "y": -1.519, "c": "近傍", "n": "ONE AND ONLY [H]  n=844 cos0.98 難-1.52", "s": 0.514, "f": 0}, {"x": 0.989, "y": -1.631, "c": "近傍", "n": "winkle 2 winkle [H]  n=514 cos0.99 難-1.63", "s": 0.313, "f": 0}, {"x": 0.987, "y": -1.452, "c": "近傍", "n": "I Love You [H]  n=1154 cos0.99 難-1.45", "s": 0.702, "f": 0}, {"x": 0.992, "y": -1.657, "c": "近傍", "n": "Like+it! [H]  n=1124 cos0.99 難-1.66", "s": 0.684, "f": 0}, {"x": 0.983, "y": -1.606, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [H]  n=1408 cos0.98 難-1.61", "s": 0.857, "f": 0}, {"x": 0.99, "y": -1.663, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [H]  n=831 cos0.99 難-1.66", "s": 0.506, "f": 0}, {"x": 0.988, "y": -1.428, "c": "近傍", "n": "天邪鬼 [H]  n=1289 cos0.99 難-1.43", "s": 0.785, "f": 0}, {"x": 0.981, "y": -1.5, "c": "近傍", "n": "XINOBIKILL [H]  n=1497 cos0.98 難-1.50", "s": 0.911, "f": 0}, {"x": 0.98, "y": -1.508, "c": "近傍", "n": "禍根 [H]  n=1595 cos0.98 難-1.51", "s": 0.971, "f": 0}, {"x": 0.981, "y": -1.615, "c": "近傍", "n": "SPEED ROCKER [H]  n=1120 cos0.98 難-1.61", "s": 0.682, "f": 0}, {"x": 0.981, "y": -1.466, "c": "近傍", "n": "ROCK女 feat. 大山愛未， Ken [H]  n=1191 cos0.98 難-1.47", "s": 0.725, "f": 0}, {"x": 0.979, "y": -1.602, "c": "近傍", "n": "ChaserXX [H]  n=1407 cos0.98 難-1.60", "s": 0.856, "f": 0}, {"x": 0.984, "y": -1.661, "c": "近傍", "n": "Battleground [H]  n=1215 cos0.98 難-1.66", "s": 0.74, "f": 0}, {"x": 0.978, "y": -1.475, "c": "近傍", "n": "HARD BRAIN [H]  n=1255 cos0.98 難-1.48", "s": 0.764, "f": 0}, {"x": 0.982, "y": -1.653, "c": "近傍", "n": "GIGA THRASH [H]  n=1177 cos0.98 難-1.65", "s": 0.716, "f": 0}, {"x": 0.978, "y": -1.464, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.98 難-1.46", "s": 0.635, "f": 0}, {"x": 0.979, "y": -1.451, "c": "近傍", "n": "Necroxis Girl [H]  n=936 cos0.98 難-1.45", "s": 0.57, "f": 0}, {"x": 0.987, "y": -1.39, "c": "近傍", "n": "Apocalypse [H]  n=1206 cos0.99 難-1.39", "s": 0.734, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3579928294810313}, {"a": 0, "b": 2, "w": 0.43877920910885704}, {"a": 0, "b": 3, "w": 0.2821403702938653}, {"a": 0, "b": 4, "w": 0.37057797404709003}, {"a": 0, "b": 5, "w": 0.2801572401214123}, {"a": 0, "b": 6, "w": 0.44613144481497047}, {"a": 0, "b": 7, "w": 0.2636166810103048}, {"a": 0, "b": 8, "w": 0.44103217504144754}, {"a": 0, "b": 9, "w": 0.16543311580967457}, {"a": 0, "b": 10, "w": 0.1655762184102575}, {"a": 0, "b": 11, "w": 3.833700024102882e-11}, {"a": 0, "b": 12, "w": 0.03443090799235238}, {"a": 0, "b": 13, "w": 0.2107578915874304}, {"a": 0, "b": 14, "w": 0.06964563087918474}, {"a": 0, "b": 15, "w": 0.267293302641018}, {"a": 0, "b": 16, "w": 0.06302348574648198}, {"a": 0, "b": 17, "w": 0.19217931948975242}, {"a": 0, "b": 18, "w": 0.16583713291445812}, {"a": 0, "b": 19, "w": 0.17696645211554574}, {"a": 0, "b": 20, "w": 0.2610654773582787}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=-1.685,hiY=-1.368;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
