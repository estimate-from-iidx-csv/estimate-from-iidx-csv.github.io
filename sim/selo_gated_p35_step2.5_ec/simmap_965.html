<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">OUTER PLANETS [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.248, "c": "種", "n": "OUTER PLANETS [A]  n=2513 cos1.00 難-0.25", "s": 0.725, "f": 0}, {"x": 0.996, "y": -0.069, "c": "近傍", "n": "Donkey Donk [A]  n=3466 cos1.00 難-0.07", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.186, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.19", "s": 0.509, "f": 0}, {"x": 0.994, "y": -0.411, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.99 難-0.41", "s": 0.323, "f": 0}, {"x": 0.99, "y": -0.065, "c": "近傍", "n": "Do Back Burn [A]  n=1891 cos0.99 難-0.06", "s": 0.546, "f": 0}, {"x": 0.989, "y": -0.309, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.99 難-0.31", "s": 0.908, "f": 0}, {"x": 0.988, "y": -0.181, "c": "近傍", "n": "Virus Funk [A]  n=3044 cos0.99 難-0.18", "s": 0.878, "f": 0}, {"x": 0.989, "y": -0.411, "c": "近傍", "n": "海神 [H]  n=3063 cos0.99 難-0.41", "s": 0.884, "f": 0}, {"x": 0.987, "y": -0.242, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2857 cos0.99 難-0.24", "s": 0.824, "f": 0}, {"x": 0.99, "y": -0.473, "c": "近傍", "n": "TOGAKUSHI [H]  n=2630 cos0.99 難-0.47", "s": 0.759, "f": 0}, {"x": 0.988, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.99 難-0.37", "s": 0.271, "f": 0}, {"x": 0.987, "y": -0.264, "c": "近傍", "n": "アクマフカ [A]  n=1847 cos0.99 難-0.26", "s": 0.533, "f": 0}, {"x": 0.987, "y": -0.146, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.99 難-0.15", "s": 0.359, "f": 0}, {"x": 0.989, "y": -0.019, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.99 難-0.02", "s": 0.972, "f": 0}, {"x": 0.989, "y": -0.005, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.99 難-0.00", "s": 0.824, "f": 0}, {"x": 0.986, "y": -0.343, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.99 難-0.34", "s": 0.715, "f": 0}, {"x": 0.985, "y": -0.238, "c": "近傍", "n": "Infinity Mirror [A]  n=3000 cos0.99 難-0.24", "s": 0.866, "f": 0}, {"x": 0.986, "y": -0.417, "c": "近傍", "n": "Show Time [A]  n=659 cos0.99 難-0.42", "s": 0.19, "f": 0}, {"x": 0.987, "y": -0.032, "c": "近傍", "n": "Galaxy Collapse [A]  n=792 cos0.99 難-0.03", "s": 0.229, "f": 0}, {"x": 0.986, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.99 難-0.41", "s": 0.899, "f": 0}, {"x": 0.988, "y": 0.066, "c": "近傍", "n": "The Best of Both Worlds [A]  n=2647 cos0.99 難0.07", "s": 0.764, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.393801552942614}, {"a": 0, "b": 2, "w": 0.3421352780932685}, {"a": 0, "b": 3, "w": 0.2752643111419305}, {"a": 0, "b": 4, "w": 0.33870664259026073}, {"a": 0, "b": 5, "w": 0.21672232373320188}, {"a": 0, "b": 6, "w": 0.25411053267558015}, {"a": 0, "b": 7, "w": 0.23924067772346636}, {"a": 0, "b": 8, "w": 0.16811497105513762}, {"a": 0, "b": 9, "w": 0.3160972216925484}, {"a": 0, "b": 10, "w": 4.367506356572903e-11}, {"a": 0, "b": 11, "w": 0.19927795498171197}, {"a": 0, "b": 12, "w": 0.22794413043270512}, {"a": 0, "b": 13, "w": 0.2573582724834773}, {"a": 0, "b": 14, "w": 0.23888626895077758}, {"a": 0, "b": 15, "w": 0.20488969139724822}, {"a": 0, "b": 16, "w": 0.16630126858137906}, {"a": 0, "b": 17, "w": 0.1961837501005449}, {"a": 0, "b": 18, "w": 0.2113399069892763}, {"a": 0, "b": 19, "w": 0.03590901882931252}, {"a": 0, "b": 20, "w": 0.2621328231428577}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.516,hiY=0.109;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
