<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Empire State Glory [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.75, "c": "種", "n": "Empire State Glory [H]  n=2288 cos1.00 難-0.75", "s": 0.71, "f": 0}, {"x": 0.99, "y": -0.801, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.99 難-0.80", "s": 0.638, "f": 0}, {"x": 0.989, "y": -0.829, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.99 難-0.83", "s": 0.697, "f": 0}, {"x": 0.987, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.58, "f": 0}, {"x": 0.988, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.65", "s": 0.705, "f": 0}, {"x": 0.986, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.72", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.98 難-0.72", "s": 0.63, "f": 0}, {"x": 0.982, "y": -0.71, "c": "近傍", "n": "ONIGOROSHI [H]  n=1805 cos0.98 難-0.71", "s": 0.56, "f": 0}, {"x": 0.987, "y": -0.954, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2186 cos0.99 難-0.95", "s": 0.679, "f": 0}, {"x": 0.981, "y": -0.79, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.98 難-0.79", "s": 0.713, "f": 0}, {"x": 0.985, "y": -0.547, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.99 難-0.55", "s": 0.762, "f": 0}, {"x": 0.986, "y": -0.975, "c": "近傍", "n": "Elektrick U-Phoria [H]  n=2155 cos0.99 難-0.97", "s": 0.669, "f": 0}, {"x": 0.989, "y": -1.03, "c": "近傍", "n": "L.F.O [H]  n=1705 cos0.99 難-1.03", "s": 0.529, "f": 0}, {"x": 0.983, "y": -0.935, "c": "近傍", "n": "Cult Invitation [H]  n=759 cos0.98 難-0.93", "s": 0.236, "f": 0}, {"x": 0.98, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.98 難-0.84", "s": 0.62, "f": 0}, {"x": 0.978, "y": -0.825, "c": "近傍", "n": "Antigravity [H]  n=2035 cos0.98 難-0.82", "s": 0.632, "f": 0}, {"x": 0.978, "y": -0.796, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.98 難-0.80", "s": 0.707, "f": 0}, {"x": 0.977, "y": -0.75, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.98 難-0.75", "s": 0.574, "f": 0}, {"x": 0.995, "y": -1.125, "c": "近傍", "n": "Night sky [H]  n=2107 cos1.00 難-1.13", "s": 0.654, "f": 0}, {"x": 0.982, "y": -0.988, "c": "近傍", "n": "Boomy and The Boost [H]  n=2209 cos0.98 難-0.99", "s": 0.686, "f": 0}, {"x": 0.984, "y": -0.466, "c": "近傍", "n": "BRAINSTORM [H]  n=2556 cos0.98 難-0.47", "s": 0.794, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5336809142949133}, {"a": 0, "b": 2, "w": 0.5329284608495602}, {"a": 0, "b": 3, "w": 0.47193395686240414}, {"a": 0, "b": 4, "w": 0.4364395500797418}, {"a": 0, "b": 5, "w": 0.46514904642913035}, {"a": 0, "b": 6, "w": 0.40048898264662913}, {"a": 0, "b": 7, "w": 3.736577713908673e-11}, {"a": 0, "b": 8, "w": 0.3311760450855905}, {"a": 0, "b": 9, "w": 0.39124737711301294}, {"a": 0, "b": 10, "w": 0.45406918020118514}, {"a": 0, "b": 11, "w": 0.4531702439146018}, {"a": 0, "b": 12, "w": 0.49652169342765906}, {"a": 0, "b": 13, "w": 0.25657566267864396}, {"a": 0, "b": 14, "w": 0.2856752978395316}, {"a": 0, "b": 15, "w": 0.19295920109165932}, {"a": 0, "b": 16, "w": 0.32267797606480597}, {"a": 0, "b": 17, "w": 0.3347167150988296}, {"a": 0, "b": 18, "w": 0.611096170901767}, {"a": 0, "b": 19, "w": 0.37363098069534717}, {"a": 0, "b": 20, "w": 0.26476074546201966}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.178,hiY=-0.413;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
