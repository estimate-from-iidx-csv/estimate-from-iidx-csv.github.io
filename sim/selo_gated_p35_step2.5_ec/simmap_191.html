<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">255 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.114, "c": "種", "n": "255 [H]  n=1429 cos1.00 難-1.11", "s": 0.592, "f": 0}, {"x": 0.987, "y": -1.124, "c": "近傍", "n": "Level 2 [H]  n=1490 cos0.99 難-1.12", "s": 0.617, "f": 0}, {"x": 0.987, "y": -1.183, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.99 難-1.18", "s": 0.808, "f": 0}, {"x": 0.985, "y": -1.172, "c": "近傍", "n": "Invitation from Mr.C [H]  n=1787 cos0.99 難-1.17", "s": 0.741, "f": 0}, {"x": 0.984, "y": -1.091, "c": "近傍", "n": "HADES [H]  n=2413 cos0.98 難-1.09", "s": 1.0, "f": 0}, {"x": 0.984, "y": -1.177, "c": "近傍", "n": "Y&Co. is dead or alive [H]  n=1174 cos0.98 難-1.18", "s": 0.487, "f": 0}, {"x": 0.982, "y": -1.089, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.98 難-1.09", "s": 0.56, "f": 0}, {"x": 0.986, "y": -0.99, "c": "近傍", "n": "電光 [H]  n=857 cos0.99 難-0.99", "s": 0.355, "f": 0}, {"x": 0.983, "y": -1.027, "c": "近傍", "n": "Double Dribble [H]  n=1638 cos0.98 難-1.03", "s": 0.679, "f": 0}, {"x": 0.986, "y": -1.253, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.99 難-1.25", "s": 0.638, "f": 0}, {"x": 0.981, "y": -1.165, "c": "近傍", "n": "BIGソムタム [H]  n=1909 cos0.98 難-1.17", "s": 0.791, "f": 0}, {"x": 0.984, "y": -0.986, "c": "近傍", "n": "Vulnerability [H]  n=664 cos0.98 難-0.99", "s": 0.275, "f": 0}, {"x": 0.98, "y": -1.043, "c": "近傍", "n": "invoker [H]  n=1886 cos0.98 難-1.04", "s": 0.782, "f": 0}, {"x": 0.979, "y": -1.071, "c": "近傍", "n": "Cosmic Cat [H]  n=1851 cos0.98 難-1.07", "s": 0.767, "f": 0}, {"x": 0.982, "y": -1.002, "c": "近傍", "n": "& Intelligence [H]  n=1407 cos0.98 難-1.00", "s": 0.583, "f": 0}, {"x": 0.986, "y": -0.919, "c": "近傍", "n": "FlyAway [H]  n=630 cos0.99 難-0.92", "s": 0.261, "f": 0}, {"x": 0.977, "y": -1.122, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.98 難-1.12", "s": 0.667, "f": 0}, {"x": 0.98, "y": -0.99, "c": "近傍", "n": "m1dy Deluxe [H]  n=2329 cos0.98 難-0.99", "s": 0.965, "f": 0}, {"x": 0.976, "y": -1.105, "c": "近傍", "n": "Bring The Fire [H]  n=669 cos0.98 難-1.10", "s": 0.277, "f": 0}, {"x": 0.977, "y": -1.181, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.98 難-1.18", "s": 0.425, "f": 0}, {"x": 0.977, "y": -1.18, "c": "近傍", "n": "From Human Blood [H]  n=621 cos0.98 難-1.18", "s": 0.257, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.10234392304925477}, {"a": 0, "b": 2, "w": 0.4242298918463324}, {"a": 0, "b": 3, "w": 0.3273651547073281}, {"a": 0, "b": 4, "w": 0.32055780851688365}, {"a": 0, "b": 5, "w": 0.30059822138444503}, {"a": 0, "b": 6, "w": 0.3092582737539026}, {"a": 0, "b": 7, "w": 0.14907950912090018}, {"a": 0, "b": 8, "w": 0.1976870233510808}, {"a": 0, "b": 9, "w": 0.3979198834194929}, {"a": 0, "b": 10, "w": 0.27858317480592754}, {"a": 0, "b": 11, "w": 3.900124667666205e-11}, {"a": 0, "b": 12, "w": 0.2745675479281908}, {"a": 0, "b": 13, "w": 0.23910756991594895}, {"a": 0, "b": 14, "w": 0.15353972258155768}, {"a": 0, "b": 15, "w": 0.1281449639457185}, {"a": 0, "b": 16, "w": 0.20864538946245703}, {"a": 0, "b": 17, "w": 0.25679978481921617}, {"a": 0, "b": 18, "w": 0.20429122656504373}, {"a": 0, "b": 19, "w": 0.21875422623804763}, {"a": 0, "b": 20, "w": 0.09246131845000083}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-1.280,hiY=-0.893;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
