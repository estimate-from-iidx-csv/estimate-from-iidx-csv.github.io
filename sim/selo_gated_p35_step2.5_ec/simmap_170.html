<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">未来のプリズム [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.348, "c": "種", "n": "未来のプリズム [A]  n=2668 cos1.00 難-0.35", "s": 0.849, "f": 0}, {"x": 0.996, "y": -0.386, "c": "近傍", "n": "Double Loving Heart [A]  n=2702 cos1.00 難-0.39", "s": 0.86, "f": 0}, {"x": 0.997, "y": -0.451, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos1.00 難-0.45", "s": 0.502, "f": 0}, {"x": 0.994, "y": -0.39, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2680 cos0.99 難-0.39", "s": 0.853, "f": 0}, {"x": 0.993, "y": -0.411, "c": "近傍", "n": "Dreamship [A]  n=1395 cos0.99 難-0.41", "s": 0.444, "f": 0}, {"x": 0.994, "y": -0.486, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=996 cos0.99 難-0.49", "s": 0.317, "f": 0}, {"x": 0.992, "y": -0.278, "c": "近傍", "n": "Attitude [A]  n=2384 cos0.99 難-0.28", "s": 0.759, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "Frozen Ray (original mix) [A]  n=2582 cos0.99 難-0.19", "s": 0.822, "f": 0}, {"x": 0.992, "y": -0.312, "c": "近傍", "n": "セカンドピアス [A]  n=2576 cos0.99 難-0.31", "s": 0.82, "f": 0}, {"x": 0.991, "y": -0.295, "c": "近傍", "n": "Shining World [A]  n=3141 cos0.99 難-0.29", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.351, "c": "近傍", "n": "I know You know [A]  n=2736 cos0.99 難-0.35", "s": 0.871, "f": 0}, {"x": 0.99, "y": -0.328, "c": "近傍", "n": "Selfish Sweet [A]  n=2782 cos0.99 難-0.33", "s": 0.886, "f": 0}, {"x": 0.991, "y": -0.476, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos0.99 難-0.48", "s": 0.55, "f": 0}, {"x": 0.989, "y": -0.294, "c": "近傍", "n": "Sugar Drippin' [A]  n=2161 cos0.99 難-0.29", "s": 0.688, "f": 0}, {"x": 0.989, "y": -0.438, "c": "近傍", "n": "虹色 [A]  n=3051 cos0.99 難-0.44", "s": 0.971, "f": 0}, {"x": 0.99, "y": -0.203, "c": "近傍", "n": "beatonic nation [A]  n=2335 cos0.99 難-0.20", "s": 0.743, "f": 0}, {"x": 0.99, "y": -0.486, "c": "近傍", "n": "翼 [A]  n=3054 cos0.99 難-0.49", "s": 0.972, "f": 0}, {"x": 0.994, "y": -0.604, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.60", "s": 0.593, "f": 0}, {"x": 0.988, "y": -0.415, "c": "近傍", "n": "satfinal [A]  n=2973 cos0.99 難-0.42", "s": 0.947, "f": 0}, {"x": 0.988, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.918, "f": 0}, {"x": 0.988, "y": -0.408, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.41", "s": 0.398, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5120917056053973}, {"a": 0, "b": 2, "w": 0.5922363356182316}, {"a": 0, "b": 3, "w": 0.3980127065335197}, {"a": 0, "b": 4, "w": 0.392744172292264}, {"a": 0, "b": 5, "w": 0.18488576939397183}, {"a": 0, "b": 6, "w": 0.3592653601751804}, {"a": 0, "b": 7, "w": 0.4039301239377241}, {"a": 0, "b": 8, "w": 0.28311608538908617}, {"a": 0, "b": 9, "w": 0.3031062717183646}, {"a": 0, "b": 10, "w": 0.28694696397216257}, {"a": 0, "b": 11, "w": 0.24385643256501044}, {"a": 0, "b": 12, "w": 0.2966722903935659}, {"a": 0, "b": 13, "w": 0.2394002947371351}, {"a": 0, "b": 14, "w": 0.23094176204025918}, {"a": 0, "b": 15, "w": 0.18064333789393006}, {"a": 0, "b": 16, "w": 0.24410220253512904}, {"a": 0, "b": 17, "w": 0.3927855769925055}, {"a": 0, "b": 18, "w": 0.2189477743582795}, {"a": 0, "b": 19, "w": 5.958100679492873e-11}, {"a": 0, "b": 20, "w": 0.16454596265319343}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.637,hiY=-0.162;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
