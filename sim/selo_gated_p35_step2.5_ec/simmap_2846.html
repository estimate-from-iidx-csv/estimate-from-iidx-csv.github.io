<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Steel Edge [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.348, "c": "種", "n": "Steel Edge [A]  n=3746 cos1.00 難0.35", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.275, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos0.99 難0.27", "s": 0.334, "f": 0}, {"x": 0.994, "y": 0.112, "c": "近傍", "n": "Daily Lunch Special [A]  n=3535 cos0.99 難0.11", "s": 0.944, "f": 0}, {"x": 0.99, "y": 0.231, "c": "近傍", "n": "Scharfrichter [A]  n=3415 cos0.99 難0.23", "s": 0.912, "f": 0}, {"x": 0.988, "y": 0.275, "c": "近傍", "n": "きみのせかい [A]  n=1145 cos0.99 難0.28", "s": 0.306, "f": 0}, {"x": 0.988, "y": 0.385, "c": "近傍", "n": "VALLIS-NERIA [A]  n=3498 cos0.99 難0.39", "s": 0.934, "f": 0}, {"x": 0.99, "y": 0.136, "c": "近傍", "n": "Pout [A]  n=2136 cos0.99 難0.14", "s": 0.57, "f": 0}, {"x": 0.987, "y": 0.427, "c": "近傍", "n": "ADAMANT [A]  n=1507 cos0.99 難0.43", "s": 0.402, "f": 0}, {"x": 0.989, "y": 0.138, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3310 cos0.99 難0.14", "s": 0.884, "f": 0}, {"x": 0.987, "y": 0.186, "c": "近傍", "n": "Scars of FAUNA [A]  n=3552 cos0.99 難0.19", "s": 0.948, "f": 0}, {"x": 0.987, "y": 0.487, "c": "近傍", "n": "BIGソムタム [A]  n=3093 cos0.99 難0.49", "s": 0.826, "f": 0}, {"x": 0.99, "y": 0.076, "c": "近傍", "n": "Shadow World [A]  n=2323 cos0.99 難0.08", "s": 0.62, "f": 0}, {"x": 0.986, "y": 0.17, "c": "近傍", "n": "恋は白帯、サンシロー [L]  n=3246 cos0.99 難0.17", "s": 0.867, "f": 0}, {"x": 0.987, "y": 0.137, "c": "近傍", "n": "Element of SPADA [L]  n=1863 cos0.99 難0.14", "s": 0.497, "f": 0}, {"x": 0.984, "y": 0.373, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3114 cos0.98 難0.37", "s": 0.831, "f": 0}, {"x": 0.984, "y": 0.398, "c": "近傍", "n": "ここからよろしく大作戦143 [L]  n=874 cos0.98 難0.40", "s": 0.233, "f": 0}, {"x": 0.986, "y": 0.116, "c": "近傍", "n": "ハオ [A]  n=1364 cos0.99 難0.12", "s": 0.364, "f": 0}, {"x": 0.987, "y": 0.076, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難0.08", "s": 0.634, "f": 0}, {"x": 0.983, "y": 0.281, "c": "近傍", "n": "AsiaN distractive [A]  n=3185 cos0.98 難0.28", "s": 0.85, "f": 0}, {"x": 0.984, "y": 0.15, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos0.98 難0.15", "s": 0.928, "f": 0}, {"x": 0.983, "y": 0.271, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3281 cos0.98 難0.27", "s": 0.876, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24548069325994237}, {"a": 0, "b": 2, "w": 0.45934826091764414}, {"a": 0, "b": 3, "w": 0.33692450724430634}, {"a": 0, "b": 4, "w": 0.26275041014917166}, {"a": 0, "b": 5, "w": 0.19224546686471533}, {"a": 0, "b": 6, "w": 0.2399805917557042}, {"a": 0, "b": 7, "w": 0.263696072209195}, {"a": 0, "b": 8, "w": 0.045293882481825753}, {"a": 0, "b": 9, "w": 0.25940216990719056}, {"a": 0, "b": 10, "w": 0.02775036947188958}, {"a": 0, "b": 11, "w": 0.07897735943015893}, {"a": 0, "b": 12, "w": 0.14231553869881297}, {"a": 0, "b": 13, "w": 0.2389429361773917}, {"a": 0, "b": 14, "w": 0.15017470954023626}, {"a": 0, "b": 15, "w": 0.16791646887638623}, {"a": 0, "b": 16, "w": 0.08371350308388414}, {"a": 0, "b": 17, "w": 3.6407876713440146e-11}, {"a": 0, "b": 18, "w": 0.08118052618849159}, {"a": 0, "b": 19, "w": 0.15634711473419072}, {"a": 0, "b": 20, "w": 0.14721386406053927}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.043,hiY=0.520;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
