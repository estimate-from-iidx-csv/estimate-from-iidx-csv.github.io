<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">TIEFSEE [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.92, "c": "種", "n": "TIEFSEE [H]  n=2156 cos1.00 難-0.92", "s": 0.801, "f": 0}, {"x": 0.996, "y": -0.93, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [H]  n=2504 cos1.00 難-0.93", "s": 0.93, "f": 0}, {"x": 0.996, "y": -0.91, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos1.00 難-0.91", "s": 0.81, "f": 0}, {"x": 0.995, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos1.00 難-0.90", "s": 0.926, "f": 0}, {"x": 0.995, "y": -0.919, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2234 cos0.99 難-0.92", "s": 0.83, "f": 0}, {"x": 0.997, "y": -0.987, "c": "近傍", "n": "Satellite Burst [H]  n=905 cos1.00 難-0.99", "s": 0.336, "f": 0}, {"x": 0.996, "y": -0.988, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos1.00 難-0.99", "s": 0.534, "f": 0}, {"x": 0.996, "y": -0.826, "c": "近傍", "n": "Tiempo Loco [H]  n=1744 cos1.00 難-0.83", "s": 0.648, "f": 0}, {"x": 0.995, "y": -0.998, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [H]  n=605 cos0.99 難-1.00", "s": 0.225, "f": 0}, {"x": 0.995, "y": -0.835, "c": "近傍", "n": "Let The Track Flow [H]  n=1749 cos0.99 難-0.83", "s": 0.65, "f": 0}, {"x": 0.993, "y": -0.991, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.99 難-0.99", "s": 0.613, "f": 0}, {"x": 0.993, "y": -0.996, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1326 cos0.99 難-1.00", "s": 0.493, "f": 0}, {"x": 0.992, "y": -0.856, "c": "近傍", "n": "UMMU [H]  n=2418 cos0.99 難-0.86", "s": 0.898, "f": 0}, {"x": 0.991, "y": -0.855, "c": "近傍", "n": "destination [H]  n=822 cos0.99 難-0.85", "s": 0.305, "f": 0}, {"x": 0.995, "y": -0.795, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.80", "s": 0.73, "f": 0}, {"x": 0.991, "y": -0.994, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos0.99 難-0.99", "s": 0.26, "f": 0}, {"x": 0.99, "y": -0.987, "c": "近傍", "n": "Fegrix [H]  n=1718 cos0.99 難-0.99", "s": 0.638, "f": 0}, {"x": 0.994, "y": -0.791, "c": "近傍", "n": "Giudecca [H]  n=1656 cos0.99 難-0.79", "s": 0.615, "f": 0}, {"x": 0.99, "y": -0.852, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos0.99 難-0.85", "s": 0.227, "f": 0}, {"x": 0.991, "y": -0.836, "c": "近傍", "n": "Grand Chariot [H]  n=2692 cos0.99 難-0.84", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.912, "c": "近傍", "n": "Inferno of Fomalhaut [H]  n=1774 cos0.99 難-0.91", "s": 0.659, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5852797458596247}, {"a": 0, "b": 2, "w": 0.6032492667203027}, {"a": 0, "b": 3, "w": 0.5095778341369488}, {"a": 0, "b": 4, "w": 0.5768970857003698}, {"a": 0, "b": 5, "w": 0.5428822734572775}, {"a": 0, "b": 6, "w": 0.6182597381476342}, {"a": 0, "b": 7, "w": 0.5889310898108671}, {"a": 0, "b": 8, "w": 0.503912735933155}, {"a": 0, "b": 9, "w": 0.6076161444616783}, {"a": 0, "b": 10, "w": 0.4417906574466368}, {"a": 0, "b": 11, "w": 0.3947082935820806}, {"a": 0, "b": 12, "w": 0.28481344484622273}, {"a": 0, "b": 13, "w": 0.44237551523580343}, {"a": 0, "b": 14, "w": 0.6119850400020099}, {"a": 0, "b": 15, "w": 0.35689295130766985}, {"a": 0, "b": 16, "w": 0.2756819157810173}, {"a": 0, "b": 17, "w": 0.588510668897112}, {"a": 0, "b": 18, "w": 4.106226469957619e-11}, {"a": 0, "b": 19, "w": 0.2916865471252833}, {"a": 0, "b": 20, "w": 0.3784188998026854}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.015,hiY=-0.774;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
