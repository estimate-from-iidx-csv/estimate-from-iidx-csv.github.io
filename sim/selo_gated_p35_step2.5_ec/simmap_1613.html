<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ピアノ独奏無言歌 "灰燼" [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.741, "c": "種", "n": "ピアノ独奏無言歌 \"灰燼\" [H]  n=1531 cos1.00 難-0.74", "s": 0.468, "f": 0}, {"x": 0.99, "y": -0.855, "c": "近傍", "n": "destination [H]  n=822 cos0.99 難-0.85", "s": 0.251, "f": 0}, {"x": 0.987, "y": -0.743, "c": "近傍", "n": "DORNWALD ～Junge～ [H]  n=2391 cos0.99 難-0.74", "s": 0.73, "f": 0}, {"x": 0.985, "y": -0.644, "c": "近傍", "n": "SOLITON BEAM [H]  n=1733 cos0.99 難-0.64", "s": 0.529, "f": 0}, {"x": 0.983, "y": -0.717, "c": "近傍", "n": "∀ [H]  n=2296 cos0.98 難-0.72", "s": 0.701, "f": 0}, {"x": 0.983, "y": -0.736, "c": "近傍", "n": "dAuntl3ss [H]  n=1995 cos0.98 難-0.74", "s": 0.609, "f": 0}, {"x": 0.986, "y": -0.93, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [H]  n=2504 cos0.99 難-0.93", "s": 0.765, "f": 0}, {"x": 0.985, "y": -0.923, "c": "近傍", "n": "SEQUENCE CAT [H]  n=2133 cos0.99 難-0.92", "s": 0.651, "f": 0}, {"x": 0.984, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.98 難-0.61", "s": 0.553, "f": 0}, {"x": 0.986, "y": -0.526, "c": "近傍", "n": "Verflucht [H]  n=3274 cos0.99 難-0.53", "s": 1.0, "f": 0}, {"x": 0.982, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.98 難-0.81", "s": 0.236, "f": 0}, {"x": 0.982, "y": -0.645, "c": "近傍", "n": "神謳 -RESONANCE- [H]  n=2734 cos0.98 難-0.65", "s": 0.835, "f": 0}, {"x": 0.981, "y": -0.74, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.98 難-0.74", "s": 0.226, "f": 0}, {"x": 0.981, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.98 難-0.68", "s": 0.962, "f": 0}, {"x": 0.981, "y": -0.647, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.98 難-0.65", "s": 0.526, "f": 0}, {"x": 0.983, "y": -0.576, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.98 難-0.58", "s": 0.779, "f": 0}, {"x": 0.985, "y": -0.497, "c": "近傍", "n": "TOXIC VIBRATION [H]  n=2913 cos0.99 難-0.50", "s": 0.89, "f": 0}, {"x": 0.984, "y": -0.97, "c": "近傍", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [H]  n=2222 cos0.98 難-0.97", "s": 0.679, "f": 0}, {"x": 0.982, "y": -0.92, "c": "近傍", "n": "TIEFSEE [H]  n=2156 cos0.98 難-0.92", "s": 0.659, "f": 0}, {"x": 0.982, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos0.98 難-0.90", "s": 0.761, "f": 0}, {"x": 0.98, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.98 難-0.73", "s": 0.618, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36109894528493325}, {"a": 0, "b": 2, "w": 0.3105203020919002}, {"a": 0, "b": 3, "w": 0.17355455364225114}, {"a": 0, "b": 4, "w": 0.24999626142638454}, {"a": 0, "b": 5, "w": 0.12730451618399086}, {"a": 0, "b": 6, "w": 3.9110936711495015e-11}, {"a": 0, "b": 7, "w": 0.18772015907649509}, {"a": 0, "b": 8, "w": 0.20077899550544265}, {"a": 0, "b": 9, "w": 0.26204173256291763}, {"a": 0, "b": 10, "w": 0.20615097014618178}, {"a": 0, "b": 11, "w": 0.22176021656902123}, {"a": 0, "b": 12, "w": 0.17814908081371672}, {"a": 0, "b": 13, "w": 0.08343113435116101}, {"a": 0, "b": 14, "w": 0.13571767598830353}, {"a": 0, "b": 15, "w": 0.0647381255393853}, {"a": 0, "b": 16, "w": 0.2679016681513017}, {"a": 0, "b": 17, "w": 0.16254988913873614}, {"a": 0, "b": 18, "w": 0.10594078299462595}, {"a": 0, "b": 19, "w": 0.1983810358713599}, {"a": 0, "b": 20, "w": 0.09597805548242966}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=-1.008,hiY=-0.459;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
