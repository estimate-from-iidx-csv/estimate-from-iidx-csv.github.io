<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">fixer [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.791, "c": "種", "n": "fixer [H]  n=304 cos1.00 難-0.79", "s": 0.116, "f": 0}, {"x": 0.993, "y": -0.838, "c": "近傍", "n": "君のハートにロックオン [H]  n=2145 cos0.99 難-0.84", "s": 0.816, "f": 0}, {"x": 0.993, "y": -0.791, "c": "近傍", "n": "Giudecca [H]  n=1656 cos0.99 難-0.79", "s": 0.63, "f": 0}, {"x": 0.993, "y": -0.723, "c": "近傍", "n": "INAZUMA [H]  n=2055 cos0.99 難-0.72", "s": 0.782, "f": 0}, {"x": 0.992, "y": -0.809, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [H]  n=1588 cos0.99 難-0.81", "s": 0.604, "f": 0}, {"x": 0.994, "y": -0.684, "c": "近傍", "n": "Votum stellarum [H]  n=1929 cos0.99 難-0.68", "s": 0.734, "f": 0}, {"x": 0.991, "y": -0.717, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1989 cos0.99 難-0.72", "s": 0.757, "f": 0}, {"x": 0.99, "y": -0.752, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos0.99 難-0.75", "s": 0.925, "f": 0}, {"x": 0.99, "y": -0.727, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos0.99 難-0.73", "s": 0.684, "f": 0}, {"x": 0.99, "y": -0.728, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.73", "s": 0.625, "f": 0}, {"x": 0.989, "y": -0.795, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.80", "s": 0.748, "f": 0}, {"x": 0.989, "y": -0.856, "c": "近傍", "n": "UMMU [H]  n=2418 cos0.99 難-0.86", "s": 0.92, "f": 0}, {"x": 0.988, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.72", "s": 0.725, "f": 0}, {"x": 0.987, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.816, "f": 0}, {"x": 0.99, "y": -0.658, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.66", "s": 0.599, "f": 0}, {"x": 0.987, "y": -0.752, "c": "近傍", "n": "GHOST REVIVAL [H]  n=1611 cos0.99 難-0.75", "s": 0.613, "f": 0}, {"x": 0.991, "y": -0.644, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos0.99 難-0.64", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.912, "c": "近傍", "n": "Inferno of Fomalhaut [H]  n=1774 cos0.99 難-0.91", "s": 0.675, "f": 0}, {"x": 0.989, "y": -0.679, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos0.99 難-0.68", "s": 0.704, "f": 0}, {"x": 0.987, "y": -0.827, "c": "近傍", "n": "B.O.D.Y. [H]  n=1306 cos0.99 難-0.83", "s": 0.497, "f": 0}, {"x": 0.987, "y": -0.727, "c": "近傍", "n": "BROKEN EDEN [H]  n=2059 cos0.99 難-0.73", "s": 0.783, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 4.040612289202272e-11}, {"a": 0, "b": 2, "w": 0.2623426820481629}, {"a": 0, "b": 3, "w": 0.21335716333833976}, {"a": 0, "b": 4, "w": 0.3478989285453681}, {"a": 0, "b": 5, "w": 0.14089643165360277}, {"a": 0, "b": 6, "w": 0.2826315198678946}, {"a": 0, "b": 7, "w": 0.29569389409105973}, {"a": 0, "b": 8, "w": 0.06632947314732107}, {"a": 0, "b": 9, "w": 0.33232484133833307}, {"a": 0, "b": 10, "w": 0.15747905563376008}, {"a": 0, "b": 11, "w": 0.3743368603670688}, {"a": 0, "b": 12, "w": 0.14879619974688907}, {"a": 0, "b": 13, "w": 0.27528761298553384}, {"a": 0, "b": 14, "w": 0.39641561985036156}, {"a": 0, "b": 15, "w": 0.17088619262024596}, {"a": 0, "b": 16, "w": 0.24490474030957132}, {"a": 0, "b": 17, "w": 0.3334007496099429}, {"a": 0, "b": 18, "w": 0.22537548795634976}, {"a": 0, "b": 19, "w": 0.3087691128575062}, {"a": 0, "b": 20, "w": 0.16598918246936223}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.933,hiY=-0.623;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
