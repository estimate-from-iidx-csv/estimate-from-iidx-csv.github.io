<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>

const D=[{"x": 1.0, "y": 0.558, "c": "種", "n": "FAKE TIME [H]  n=3046 cos1.00 難0.56", "s": 0.812, "f": 0}, {"x": 0.989, "y": 0.203, "c": "近傍", "n": "泰東ノ翠霞 [A]  n=2903 cos0.99 難0.20", "s": 0.774, "f": 0}, {"x": 0.981, "y": 0.401, "c": "近傍", "n": "Ganymede [A]  n=3335 cos0.98 難0.40", "s": 0.889, "f": 0}, {"x": 0.987, "y": 0.08, "c": "近傍", "n": "Mare Nectaris [H]  n=3472 cos0.99 難0.08", "s": 0.925, "f": 0}, {"x": 0.98, "y": 0.263, "c": "近傍", "n": "忍恋花 [A]  n=3299 cos0.98 難0.26", "s": 0.879, "f": 0}, {"x": 0.982, "y": 0.13, "c": "近傍", "n": "R5 [A]  n=3704 cos0.98 難0.13", "s": 0.987, "f": 0}, {"x": 0.976, "y": 0.587, "c": "近傍", "n": "gigadelic [H]  n=3753 cos0.98 難0.59", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.067, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [H]  n=2290 cos0.99 難-0.07", "s": 0.61, "f": 0}, {"x": 0.982, "y": 0.041, "c": "近傍", "n": "Karma [A]  n=2668 cos0.98 難0.04", "s": 0.711, "f": 0}, {"x": 0.976, "y": 0.264, "c": "近傍", "n": "オールトの雲 [A]  n=2473 cos0.98 難0.26", "s": 0.659, "f": 0}, {"x": 0.983, "y": -0.018, "c": "近傍", "n": "THANK YOU FOR PLAYING [A]  n=3157 cos0.98 難-0.02", "s": 0.841, "f": 0}, {"x": 0.985, "y": -0.088, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1141 cos0.99 難-0.09", "s": 0.304, "f": 0}, {"x": 0.991, "y": -0.181, "c": "近傍", "n": "Narcissus At Oasis [H]  n=2414 cos0.99 難-0.18", "s": 0.643, "f": 0}, {"x": 0.975, "y": 0.183, "c": "近傍", "n": "TRIP MACHINE PhoeniX [A]  n=1787 cos0.98 難0.18", "s": 0.476, "f": 0}, {"x": 0.981, "y": -0.022, "c": "近傍", "n": "memories [A]  n=2210 cos0.98 難-0.02", "s": 0.589, "f": 0}, {"x": 0.982, "y": -0.078, "c": "近傍", "n": "ALFARSHEAR 双神威に廻る夢 [A]  n=3248 cos0.98 難-0.08", "s": 0.865, "f": 0}, {"x": 0.972, "y": 0.505, "c": "近傍", "n": "朝焼けから始まるボクらの小さな旅 [A]  n=3074 cos0.97 難0.50", "s": 0.819, "f": 0}, {"x": 0.971, "y": 0.438, "c": "近傍", "n": "STEEL NEEDLE [A]  n=3349 cos0.97 難0.44", "s": 0.892, "f": 0}, {"x": 0.971, "y": 0.574, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [A]  n=3059 cos0.97 難0.57", "s": 0.815, "f": 0}, {"x": 0.973, "y": 0.208, "c": "近傍", "n": "覚悟せよ！エンタンメ～ン ～より身の切り売り自暴自棄版～ [A]  n=1132 cos0.97 難0.21", "s": 0.302, "f": 0}, {"x": 0.972, "y": 0.217, "c": "近傍", "n": "Yum Yum Jelly [A]  n=3333 cos0.97 難0.22", "s": 0.888, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5715018069638163}, {"a": 0, "b": 2, "w": 0.4350275876436088}, {"a": 0, "b": 3, "w": 0.5349545531210163}, {"a": 0, "b": 4, "w": 0.3600192677364171}, {"a": 0, "b": 5, "w": 0.4602371537636789}, {"a": 0, "b": 6, "w": 0.3148228818773944}, {"a": 0, "b": 7, "w": 0.5141234673153744}, {"a": 0, "b": 8, "w": 0.45742162268382613}, {"a": 0, "b": 9, "w": 0.14538149580515014}, {"a": 0, "b": 10, "w": 0.3619744020344492}, {"a": 0, "b": 11, "w": 0.5145140577605434}, {"a": 0, "b": 12, "w": 0.5022482766922531}, {"a": 0, "b": 13, "w": 0.3603077811909007}, {"a": 0, "b": 14, "w": 0.43557540052008203}, {"a": 0, "b": 15, "w": 0.4644164311795915}, {"a": 0, "b": 16, "w": 2.8073321445276633e-11}, {"a": 0, "b": 17, "w": 0.20892474238238146}, {"a": 0, "b": 18, "w": 0.24349093577863345}, {"a": 0, "b": 19, "w": 0.07324391326720403}, {"a": 0, "b": 20, "w": 0.17668654462379974}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.243,hiY=0.649;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
