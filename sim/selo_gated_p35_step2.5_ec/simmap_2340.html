<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">涙のテ・エストラーニョ・ムーチョ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.232, "c": "種", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2640 cos1.00 難0.23", "s": 0.706, "f": 0}, {"x": 0.996, "y": 0.125, "c": "近傍", "n": "voice of echo. [A]  n=814 cos1.00 難0.13", "s": 0.218, "f": 0}, {"x": 0.995, "y": 0.298, "c": "近傍", "n": "Dawn Saga [A]  n=2733 cos0.99 難0.30", "s": 0.731, "f": 0}, {"x": 0.996, "y": 0.356, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos1.00 難0.36", "s": 0.732, "f": 0}, {"x": 0.994, "y": 0.189, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.19", "s": 0.939, "f": 0}, {"x": 0.994, "y": 0.332, "c": "近傍", "n": "I Love You [A]  n=3131 cos0.99 難0.33", "s": 0.837, "f": 0}, {"x": 0.995, "y": 0.073, "c": "近傍", "n": "ZERO-ONE [A]  n=2950 cos0.99 難0.07", "s": 0.789, "f": 0}, {"x": 0.993, "y": 0.174, "c": "近傍", "n": "end of world [A]  n=3010 cos0.99 難0.17", "s": 0.805, "f": 0}, {"x": 0.992, "y": 0.265, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.26", "s": 0.82, "f": 0}, {"x": 0.994, "y": 0.057, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos0.99 難0.06", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.124, "c": "近傍", "n": "GREEN EYES [A]  n=1810 cos0.99 難0.12", "s": 0.484, "f": 0}, {"x": 0.993, "y": 0.099, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos0.99 難0.10", "s": 0.284, "f": 0}, {"x": 0.992, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.32", "s": 0.875, "f": 0}, {"x": 0.998, "y": -0.06, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1102 cos1.00 難-0.06", "s": 0.295, "f": 0}, {"x": 0.992, "y": 0.146, "c": "近傍", "n": "SOLID WYVERN [A]  n=2530 cos0.99 難0.15", "s": 0.676, "f": 0}, {"x": 0.992, "y": 0.076, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [A]  n=2938 cos0.99 難0.08", "s": 0.786, "f": 0}, {"x": 0.991, "y": 0.257, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos0.99 難0.26", "s": 0.447, "f": 0}, {"x": 0.992, "y": 0.407, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.41", "s": 0.888, "f": 0}, {"x": 0.992, "y": 0.112, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3582 cos0.99 難0.11", "s": 0.958, "f": 0}, {"x": 0.991, "y": 0.181, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3160 cos0.99 難0.18", "s": 0.845, "f": 0}, {"x": 0.991, "y": 0.328, "c": "近傍", "n": "SUPER HEROINE!! [A]  n=1032 cos0.99 難0.33", "s": 0.276, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5256997580663785}, {"a": 0, "b": 2, "w": 0.45842886882656597}, {"a": 0, "b": 3, "w": 0.5036008140342798}, {"a": 0, "b": 4, "w": 0.3710942783886506}, {"a": 0, "b": 5, "w": 0.31737422802170845}, {"a": 0, "b": 6, "w": 4.1324610400295114e-11}, {"a": 0, "b": 7, "w": 0.1811013223863298}, {"a": 0, "b": 8, "w": 0.34486569423529}, {"a": 0, "b": 9, "w": 0.21027001275029067}, {"a": 0, "b": 10, "w": 0.027173249127317778}, {"a": 0, "b": 11, "w": 0.35460782732152596}, {"a": 0, "b": 12, "w": 0.04330781164545894}, {"a": 0, "b": 13, "w": 0.33250032874407165}, {"a": 0, "b": 14, "w": 0.3165343580078488}, {"a": 0, "b": 15, "w": 0.35450609068053873}, {"a": 0, "b": 16, "w": 0.30705712035122357}, {"a": 0, "b": 17, "w": 0.14510619520208812}, {"a": 0, "b": 18, "w": 0.18424717500790155}, {"a": 0, "b": 19, "w": 0.30981390344927295}, {"a": 0, "b": 20, "w": 0.32542597990657673}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.097,hiY=0.444;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
