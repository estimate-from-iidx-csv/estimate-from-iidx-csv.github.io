<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">爆ゼニ☆がってんワーカー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.363, "c": "種", "n": "爆ゼニ☆がってんワーカー [A]  n=2937 cos1.00 難0.36", "s": 0.812, "f": 0}, {"x": 0.998, "y": 0.324, "c": "近傍", "n": "rumrum triplets [A]  n=3302 cos1.00 難0.32", "s": 0.912, "f": 0}, {"x": 0.997, "y": 0.313, "c": "近傍", "n": "20XX [A]  n=1765 cos1.00 難0.31", "s": 0.488, "f": 0}, {"x": 0.997, "y": 0.257, "c": "近傍", "n": "ZED [A]  n=3488 cos1.00 難0.26", "s": 0.964, "f": 0}, {"x": 0.997, "y": 0.245, "c": "近傍", "n": "CONCEPTUAL [A]  n=3292 cos1.00 難0.25", "s": 0.91, "f": 0}, {"x": 0.995, "y": 0.265, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos1.00 難0.26", "s": 0.847, "f": 0}, {"x": 0.994, "y": 0.366, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos0.99 難0.37", "s": 0.902, "f": 0}, {"x": 0.997, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos1.00 難0.20", "s": 0.955, "f": 0}, {"x": 0.995, "y": 0.242, "c": "近傍", "n": "Take My Life [A]  n=3360 cos1.00 難0.24", "s": 0.928, "f": 0}, {"x": 0.994, "y": 0.409, "c": "近傍", "n": "Light and Cyber… [A]  n=3255 cos0.99 難0.41", "s": 0.899, "f": 0}, {"x": 0.993, "y": 0.429, "c": "近傍", "n": "Overslept [A]  n=2562 cos0.99 難0.43", "s": 0.708, "f": 0}, {"x": 0.997, "y": 0.186, "c": "近傍", "n": "405nm (Ryu☆mix) [A]  n=3619 cos1.00 難0.19", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.478, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.99 難0.48", "s": 0.861, "f": 0}, {"x": 0.993, "y": 0.409, "c": "近傍", "n": "532nm [A]  n=3527 cos0.99 難0.41", "s": 0.975, "f": 0}, {"x": 0.992, "y": 0.357, "c": "近傍", "n": "GloriosA [A]  n=1782 cos0.99 難0.36", "s": 0.492, "f": 0}, {"x": 0.993, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos0.99 難0.27", "s": 0.946, "f": 0}, {"x": 0.995, "y": 0.207, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3470 cos0.99 難0.21", "s": 0.959, "f": 0}, {"x": 0.993, "y": 0.302, "c": "近傍", "n": "Angelic Jelly [A]  n=3400 cos0.99 難0.30", "s": 0.939, "f": 0}, {"x": 0.992, "y": 0.376, "c": "近傍", "n": "Bow shock!! [A]  n=2972 cos0.99 難0.38", "s": 0.821, "f": 0}, {"x": 0.993, "y": 0.465, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3374 cos0.99 難0.47", "s": 0.932, "f": 0}, {"x": 0.994, "y": 0.52, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.99 難0.52", "s": 0.919, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.53520268913504}, {"a": 0, "b": 2, "w": 0.3835224340654403}, {"a": 0, "b": 3, "w": 0.3629595821583578}, {"a": 0, "b": 4, "w": 0.5015676577399633}, {"a": 0, "b": 5, "w": 0.1787106026106291}, {"a": 0, "b": 6, "w": 0.18347676462081042}, {"a": 0, "b": 7, "w": 0.504777395686077}, {"a": 0, "b": 8, "w": 0.26474077931201223}, {"a": 0, "b": 9, "w": 0.21649457980602882}, {"a": 0, "b": 10, "w": 0.1441427144042614}, {"a": 0, "b": 11, "w": 0.23723560607069094}, {"a": 0, "b": 12, "w": 5.140776693224325e-11}, {"a": 0, "b": 13, "w": 0.20360355694630805}, {"a": 0, "b": 14, "w": 0.187793920301922}, {"a": 0, "b": 15, "w": 0.1413174542583564}, {"a": 0, "b": 16, "w": 0.15700491677472805}, {"a": 0, "b": 17, "w": 0.1385794806245132}, {"a": 0, "b": 18, "w": 0.16991943639185692}, {"a": 0, "b": 19, "w": 0.2088658787688612}, {"a": 0, "b": 20, "w": 0.15659863895204607}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.159,hiY=0.547;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
