<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BREAK OVER [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.471, "c": "種", "n": "BREAK OVER [A]  n=3009 cos1.00 難0.47", "s": 0.82, "f": 0}, {"x": 0.994, "y": 0.275, "c": "近傍", "n": "Temple of Anubis [A]  n=3259 cos0.99 難0.28", "s": 0.888, "f": 0}, {"x": 0.994, "y": 0.245, "c": "近傍", "n": "S!ck [A]  n=3668 cos0.99 難0.24", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.299, "c": "近傍", "n": "Insane Techniques [A]  n=3376 cos0.99 難0.30", "s": 0.92, "f": 0}, {"x": 0.991, "y": 0.385, "c": "近傍", "n": "Neo Heritage [A]  n=2299 cos0.99 難0.39", "s": 0.627, "f": 0}, {"x": 0.994, "y": 0.179, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [A]  n=3420 cos0.99 難0.18", "s": 0.932, "f": 0}, {"x": 0.991, "y": 0.346, "c": "近傍", "n": "Around the Future [A]  n=3149 cos0.99 難0.35", "s": 0.859, "f": 0}, {"x": 0.991, "y": 0.453, "c": "近傍", "n": "diagram [A]  n=3166 cos0.99 難0.45", "s": 0.863, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.14", "s": 0.615, "f": 0}, {"x": 0.992, "y": 0.23, "c": "近傍", "n": "GIGA THRASH [A]  n=3158 cos0.99 難0.23", "s": 0.861, "f": 0}, {"x": 0.99, "y": 0.468, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.47", "s": 0.884, "f": 0}, {"x": 0.992, "y": 0.213, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.21", "s": 0.908, "f": 0}, {"x": 0.99, "y": 0.503, "c": "近傍", "n": "Funny shuffle [A]  n=3261 cos0.99 難0.50", "s": 0.889, "f": 0}, {"x": 0.99, "y": 0.36, "c": "近傍", "n": "Aublia [A]  n=3096 cos0.99 難0.36", "s": 0.844, "f": 0}, {"x": 0.99, "y": 0.269, "c": "近傍", "n": "BattleRoyal [A]  n=1038 cos0.99 難0.27", "s": 0.283, "f": 0}, {"x": 0.988, "y": 0.471, "c": "近傍", "n": "BRAINSTORM [A]  n=3418 cos0.99 難0.47", "s": 0.932, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "Musik LoverZ [A]  n=3119 cos0.99 難0.01", "s": 0.85, "f": 0}, {"x": 0.989, "y": 0.255, "c": "近傍", "n": "IN BETWEEN [A]  n=1026 cos0.99 難0.25", "s": 0.28, "f": 0}, {"x": 0.988, "y": 0.536, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.99 難0.54", "s": 0.919, "f": 0}, {"x": 0.991, "y": 0.117, "c": "近傍", "n": "RAVE SYNDROME [A]  n=1568 cos0.99 難0.12", "s": 0.427, "f": 0}, {"x": 0.989, "y": 0.228, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos0.99 難0.23", "s": 0.786, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5110674180296737}, {"a": 0, "b": 2, "w": 0.3254633359688959}, {"a": 0, "b": 3, "w": 0.5023783550528449}, {"a": 0, "b": 4, "w": 0.23109015219256512}, {"a": 0, "b": 5, "w": 0.46077256050765636}, {"a": 0, "b": 6, "w": 0.41535216754382853}, {"a": 0, "b": 7, "w": 0.2214389749122957}, {"a": 0, "b": 8, "w": 0.5813599739440571}, {"a": 0, "b": 9, "w": 0.3639967928737631}, {"a": 0, "b": 10, "w": 0.23157000330372335}, {"a": 0, "b": 11, "w": 0.4956951951312194}, {"a": 0, "b": 12, "w": 0.15381116992467947}, {"a": 0, "b": 13, "w": 0.41871228853328113}, {"a": 0, "b": 14, "w": 0.3142129565706855}, {"a": 0, "b": 15, "w": 0.0026049352493101585}, {"a": 0, "b": 16, "w": 0.6077421237947271}, {"a": 0, "b": 17, "w": 0.42577623642935636}, {"a": 0, "b": 18, "w": 3.484323940483591e-11}, {"a": 0, "b": 19, "w": 0.4003760743784732}, {"a": 0, "b": 20, "w": 0.3562648926068218}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.033,hiY=0.578;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
