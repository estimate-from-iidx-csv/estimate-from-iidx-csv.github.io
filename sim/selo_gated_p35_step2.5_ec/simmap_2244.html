<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Zenith [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.311, "c": "種", "n": "Zenith [A]  n=2366 cos1.00 難0.31", "s": 0.628, "f": 0}, {"x": 0.99, "y": -0.019, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.99 難-0.02", "s": 0.894, "f": 0}, {"x": 0.981, "y": 0.324, "c": "近傍", "n": "Kailua [A]  n=3546 cos0.98 難0.32", "s": 0.941, "f": 0}, {"x": 0.978, "y": 0.265, "c": "近傍", "n": "Souhait bleu [A]  n=2368 cos0.98 難0.26", "s": 0.628, "f": 0}, {"x": 0.978, "y": 0.156, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1763 cos0.98 難0.16", "s": 0.468, "f": 0}, {"x": 0.99, "y": -0.242, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2857 cos0.99 難-0.24", "s": 0.758, "f": 0}, {"x": 0.979, "y": 0.072, "c": "近傍", "n": "Elisha [A]  n=3769 cos0.98 難0.07", "s": 1.0, "f": 0}, {"x": 0.977, "y": 0.151, "c": "近傍", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2956 cos0.98 難0.15", "s": 0.784, "f": 0}, {"x": 0.975, "y": 0.147, "c": "近傍", "n": "Clione [L]  n=3199 cos0.98 難0.15", "s": 0.849, "f": 0}, {"x": 0.975, "y": 0.107, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.98 難0.11", "s": 0.419, "f": 0}, {"x": 0.974, "y": 0.291, "c": "近傍", "n": "Acid Pumper [A]  n=3568 cos0.97 難0.29", "s": 0.947, "f": 0}, {"x": 0.975, "y": -0.0, "c": "近傍", "n": "Deep Sea Mystery [A]  n=1856 cos0.97 難-0.00", "s": 0.492, "f": 0}, {"x": 0.98, "y": -0.238, "c": "近傍", "n": "Infinity Mirror [A]  n=3000 cos0.98 難-0.24", "s": 0.796, "f": 0}, {"x": 0.978, "y": -0.248, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.98 難-0.25", "s": 0.667, "f": 0}, {"x": 0.971, "y": 0.592, "c": "近傍", "n": "Star Trail [L]  n=1143 cos0.97 難0.59", "s": 0.303, "f": 0}, {"x": 0.974, "y": -0.188, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.97 難-0.19", "s": 0.33, "f": 0}, {"x": 0.97, "y": 0.674, "c": "近傍", "n": "TOGAKUSHI [A]  n=3552 cos0.97 難0.67", "s": 0.942, "f": 0}, {"x": 0.969, "y": -0.005, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.97 難-0.00", "s": 0.758, "f": 0}, {"x": 0.97, "y": -0.069, "c": "近傍", "n": "Donkey Donk [A]  n=3466 cos0.97 難-0.07", "s": 0.92, "f": 0}, {"x": 0.971, "y": -0.146, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.97 難-0.15", "s": 0.33, "f": 0}, {"x": 0.966, "y": 0.156, "c": "近傍", "n": "Urban Constellations [A]  n=3173 cos0.97 難0.16", "s": 0.842, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.41240754607177277}, {"a": 0, "b": 2, "w": 0.009411244318847212}, {"a": 0, "b": 3, "w": 0.2872519457742829}, {"a": 0, "b": 4, "w": 0.30504938116610514}, {"a": 0, "b": 5, "w": 0.5363476224367565}, {"a": 0, "b": 6, "w": 0.3148412112376707}, {"a": 0, "b": 7, "w": 0.2767475450584892}, {"a": 0, "b": 8, "w": 0.27068758816567384}, {"a": 0, "b": 9, "w": 0.2715793015056741}, {"a": 0, "b": 10, "w": 0.15747169889717294}, {"a": 0, "b": 11, "w": 0.25031621743591537}, {"a": 0, "b": 12, "w": 0.2598796054612943}, {"a": 0, "b": 13, "w": 0.2964039423415311}, {"a": 0, "b": 14, "w": 0.15566445180029342}, {"a": 0, "b": 15, "w": 0.1765026087354995}, {"a": 0, "b": 16, "w": 2.8122282280662603e-11}, {"a": 0, "b": 17, "w": 0.12156250889965547}, {"a": 0, "b": 18, "w": 0.1856085586035625}, {"a": 0, "b": 19, "w": 0.18278233008809086}, {"a": 0, "b": 20, "w": 0.13514514133490974}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.963,hiX=1.003,loY=-0.322,hiY=0.748;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
