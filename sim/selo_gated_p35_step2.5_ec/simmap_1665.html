<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">雪上断火 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.908, "c": "種", "n": "雪上断火 [H]  n=1286 cos1.00 難-0.91", "s": 0.412, "f": 0}, {"x": 0.989, "y": -1.115, "c": "近傍", "n": "Beat Juggling Mix [H]  n=1503 cos0.99 難-1.12", "s": 0.481, "f": 0}, {"x": 0.984, "y": -0.839, "c": "近傍", "n": "Rave*it!! Rave*it!! [H]  n=2659 cos0.98 難-0.84", "s": 0.851, "f": 0}, {"x": 0.985, "y": -0.684, "c": "近傍", "n": "naughty girl@Queen's Palace [H]  n=2762 cos0.99 難-0.68", "s": 0.884, "f": 0}, {"x": 0.981, "y": -0.768, "c": "近傍", "n": "†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [H]  n=3123 cos0.98 難-0.77", "s": 1.0, "f": 0}, {"x": 0.982, "y": -0.696, "c": "近傍", "n": "GAME ON [H]  n=1321 cos0.98 難-0.70", "s": 0.423, "f": 0}, {"x": 0.98, "y": -0.741, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.98 難-0.74", "s": 0.679, "f": 0}, {"x": 0.978, "y": -0.997, "c": "近傍", "n": "Super Rush [H]  n=2278 cos0.98 難-1.00", "s": 0.729, "f": 0}, {"x": 0.989, "y": -1.273, "c": "近傍", "n": "One for All [H]  n=957 cos0.99 難-1.27", "s": 0.306, "f": 0}, {"x": 0.976, "y": -0.907, "c": "近傍", "n": "New Lights [H]  n=1942 cos0.98 難-0.91", "s": 0.622, "f": 0}, {"x": 0.977, "y": -1.043, "c": "近傍", "n": "invoker [H]  n=1886 cos0.98 難-1.04", "s": 0.604, "f": 0}, {"x": 0.976, "y": -0.905, "c": "近傍", "n": "1116 [H]  n=662 cos0.98 難-0.91", "s": 0.212, "f": 0}, {"x": 0.975, "y": -1.0, "c": "近傍", "n": "Hello Happiness [H]  n=2032 cos0.98 難-1.00", "s": 0.651, "f": 0}, {"x": 0.975, "y": -0.79, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.97 難-0.79", "s": 0.736, "f": 0}, {"x": 0.973, "y": -1.024, "c": "近傍", "n": "MAXIMUM CHEAT GIRL [H]  n=845 cos0.97 難-1.02", "s": 0.271, "f": 0}, {"x": 0.972, "y": -0.972, "c": "近傍", "n": "Unicorn tail [H]  n=2345 cos0.97 難-0.97", "s": 0.751, "f": 0}, {"x": 0.974, "y": -0.744, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.97 難-0.74", "s": 0.685, "f": 0}, {"x": 0.974, "y": -0.725, "c": "近傍", "n": "LOVE SHINE [H]  n=2275 cos0.97 難-0.73", "s": 0.728, "f": 0}, {"x": 0.976, "y": -1.165, "c": "近傍", "n": "BIGソムタム [H]  n=1909 cos0.98 難-1.17", "s": 0.611, "f": 0}, {"x": 0.971, "y": -0.904, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.97 難-0.90", "s": 0.518, "f": 0}, {"x": 0.977, "y": -0.607, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2052 cos0.98 難-0.61", "s": 0.657, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4033685686434104}, {"a": 0, "b": 2, "w": 0.3167261955604789}, {"a": 0, "b": 3, "w": 0.35760887580023126}, {"a": 0, "b": 4, "w": 0.22018589873969208}, {"a": 0, "b": 5, "w": 0.16241763077600913}, {"a": 0, "b": 6, "w": 0.1714976327458646}, {"a": 0, "b": 7, "w": 0.1722628183361904}, {"a": 0, "b": 8, "w": 0.44684534579809243}, {"a": 0, "b": 9, "w": 0.150488415345008}, {"a": 0, "b": 10, "w": 0.16893388993241132}, {"a": 0, "b": 11, "w": 0.1677192630097306}, {"a": 0, "b": 12, "w": 0.16992166788323682}, {"a": 0, "b": 13, "w": 3.703815032451985e-11}, {"a": 0, "b": 14, "w": 0.14252633959834216}, {"a": 0, "b": 15, "w": 0.06876220697925384}, {"a": 0, "b": 16, "w": 0.09109058773452416}, {"a": 0, "b": 17, "w": 0.10518501862247209}, {"a": 0, "b": 18, "w": 0.1736799261390748}, {"a": 0, "b": 19, "w": 0.10211481696384117}, {"a": 0, "b": 20, "w": 0.143653332726985}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.969,hiX=1.002,loY=-1.326,hiY=-0.554;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
