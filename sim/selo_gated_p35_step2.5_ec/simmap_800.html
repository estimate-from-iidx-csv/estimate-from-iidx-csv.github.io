<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Chemical Cookie [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.095, "c": "種", "n": "Chemical Cookie [A]  n=3322 cos1.00 難-0.10", "s": 0.892, "f": 0}, {"x": 0.998, "y": -0.06, "c": "近傍", "n": "Ascalon [A]  n=3050 cos1.00 難-0.06", "s": 0.819, "f": 0}, {"x": 0.996, "y": -0.173, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos1.00 難-0.17", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.102, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3406 cos1.00 難-0.10", "s": 0.914, "f": 0}, {"x": 0.996, "y": -0.109, "c": "近傍", "n": "TROOPERS [H]  n=2633 cos1.00 難-0.11", "s": 0.707, "f": 0}, {"x": 0.996, "y": -0.008, "c": "近傍", "n": "Agnus Dei [A]  n=2682 cos1.00 難-0.01", "s": 0.72, "f": 0}, {"x": 0.995, "y": -0.097, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.10", "s": 0.8, "f": 0}, {"x": 0.996, "y": 0.015, "c": "近傍", "n": "Erosion Mark [A]  n=3619 cos1.00 難0.02", "s": 0.971, "f": 0}, {"x": 0.995, "y": -0.101, "c": "近傍", "n": "ビューティフルレシート [A]  n=3314 cos0.99 難-0.10", "s": 0.889, "f": 0}, {"x": 0.996, "y": -0.248, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3355 cos1.00 難-0.25", "s": 0.9, "f": 0}, {"x": 0.994, "y": -0.123, "c": "近傍", "n": "HIGH [A]  n=2329 cos0.99 難-0.12", "s": 0.625, "f": 0}, {"x": 0.994, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.04", "s": 0.747, "f": 0}, {"x": 0.994, "y": -0.179, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos0.99 難-0.18", "s": 0.825, "f": 0}, {"x": 0.996, "y": -0.295, "c": "近傍", "n": "Tropical April [H]  n=2580 cos1.00 難-0.29", "s": 0.692, "f": 0}, {"x": 0.994, "y": -0.197, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos0.99 難-0.20", "s": 0.924, "f": 0}, {"x": 0.993, "y": -0.006, "c": "近傍", "n": "LUV DRIVE [A]  n=2839 cos0.99 難-0.01", "s": 0.762, "f": 0}, {"x": 0.993, "y": -0.021, "c": "近傍", "n": "SigSig [A]  n=3612 cos0.99 難-0.02", "s": 0.969, "f": 0}, {"x": 0.995, "y": 0.083, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難0.08", "s": 0.835, "f": 0}, {"x": 0.994, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難0.03", "s": 0.972, "f": 0}, {"x": 0.993, "y": -0.125, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2073 cos0.99 難-0.12", "s": 0.556, "f": 0}, {"x": 0.993, "y": -0.184, "c": "近傍", "n": "ヒマワリ [A]  n=3298 cos0.99 難-0.18", "s": 0.885, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5397274870472659}, {"a": 0, "b": 2, "w": 0.3155839105363365}, {"a": 0, "b": 3, "w": 0.3533785517219086}, {"a": 0, "b": 4, "w": 0.21145238050163484}, {"a": 0, "b": 5, "w": 0.31552898816698205}, {"a": 0, "b": 6, "w": 0.30265407233493935}, {"a": 0, "b": 7, "w": 0.1977955526638937}, {"a": 0, "b": 8, "w": 0.27192289668370917}, {"a": 0, "b": 9, "w": 0.28393227188395065}, {"a": 0, "b": 10, "w": 0.20850884453764207}, {"a": 0, "b": 11, "w": 0.22679777782370325}, {"a": 0, "b": 12, "w": 0.17012674724012333}, {"a": 0, "b": 13, "w": 0.36540039478945463}, {"a": 0, "b": 14, "w": 0.1751896917649114}, {"a": 0, "b": 15, "w": 0.17849971476558713}, {"a": 0, "b": 16, "w": 0.15003674156716307}, {"a": 0, "b": 17, "w": 0.28903785966185525}, {"a": 0, "b": 18, "w": 0.18529818115224017}, {"a": 0, "b": 19, "w": 0.05722597191005019}, {"a": 0, "b": 20, "w": 6.759837134495683e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.325,hiY=0.113;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
