<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">GuNGNiR [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.005, "c": "種", "n": "GuNGNiR [H]  n=3425 cos1.00 難0.00", "s": 0.985, "f": 0}, {"x": 0.995, "y": -0.244, "c": "近傍", "n": "共鳴遊戯の華 [H]  n=2742 cos0.99 難-0.24", "s": 0.789, "f": 0}, {"x": 0.987, "y": 0.105, "c": "近傍", "n": "IX [H]  n=3477 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.174, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos0.99 難-0.17", "s": 0.885, "f": 0}, {"x": 0.991, "y": 0.272, "c": "近傍", "n": "バンブーソード・ガール [A]  n=3442 cos0.99 難0.27", "s": 0.99, "f": 0}, {"x": 0.983, "y": 0.127, "c": "近傍", "n": "M.D.Injection [A]  n=2859 cos0.98 難0.13", "s": 0.822, "f": 0}, {"x": 0.983, "y": 0.114, "c": "近傍", "n": "KHAMEN BREAK [A]  n=3465 cos0.98 難0.11", "s": 0.997, "f": 0}, {"x": 0.984, "y": -0.173, "c": "近傍", "n": "少年A [H]  n=2696 cos0.98 難-0.17", "s": 0.775, "f": 0}, {"x": 0.986, "y": -0.239, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.24", "s": 0.708, "f": 0}, {"x": 0.984, "y": -0.179, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.98 難-0.18", "s": 0.951, "f": 0}, {"x": 0.982, "y": 0.121, "c": "近傍", "n": "FINALLY BLAZE [A]  n=2536 cos0.98 難0.12", "s": 0.729, "f": 0}, {"x": 0.982, "y": -0.126, "c": "近傍", "n": "電人、暁に斃れる。 [H]  n=2681 cos0.98 難-0.13", "s": 0.771, "f": 0}, {"x": 0.982, "y": -0.181, "c": "近傍", "n": "1st Samurai [H]  n=2308 cos0.98 難-0.18", "s": 0.664, "f": 0}, {"x": 0.984, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.98 難-0.26", "s": 0.753, "f": 0}, {"x": 0.98, "y": 0.099, "c": "近傍", "n": "惑星鉄道 [H]  n=1281 cos0.98 難0.10", "s": 0.368, "f": 0}, {"x": 0.98, "y": -0.147, "c": "近傍", "n": "Candy Galy [H]  n=2910 cos0.98 難-0.15", "s": 0.837, "f": 0}, {"x": 0.981, "y": -0.165, "c": "近傍", "n": "EXUSIA [H]  n=2983 cos0.98 難-0.17", "s": 0.858, "f": 0}, {"x": 0.982, "y": -0.239, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.98 難-0.24", "s": 0.937, "f": 0}, {"x": 0.983, "y": -0.258, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.98 難-0.26", "s": 0.898, "f": 0}, {"x": 0.978, "y": 0.15, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3379 cos0.98 難0.15", "s": 0.972, "f": 0}, {"x": 0.977, "y": -0.019, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.98 難-0.02", "s": 0.82, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42641274448130984}, {"a": 0, "b": 2, "w": 0.3492985536605394}, {"a": 0, "b": 3, "w": 0.3050237183804332}, {"a": 0, "b": 4, "w": 0.40714483028611015}, {"a": 0, "b": 5, "w": 0.2620448323396559}, {"a": 0, "b": 6, "w": 0.23616486238389578}, {"a": 0, "b": 7, "w": 0.12634449179727603}, {"a": 0, "b": 8, "w": 0.09884621362182844}, {"a": 0, "b": 9, "w": 0.09832783368103792}, {"a": 0, "b": 10, "w": 0.22380338910634268}, {"a": 0, "b": 11, "w": 0.09088062372250572}, {"a": 0, "b": 12, "w": 0.08393937422480269}, {"a": 0, "b": 13, "w": 0.20036200955741634}, {"a": 0, "b": 14, "w": 0.1469728645521683}, {"a": 0, "b": 15, "w": 0.1950856754504101}, {"a": 0, "b": 16, "w": 0.19584466586358584}, {"a": 0, "b": 17, "w": 0.12409518275218001}, {"a": 0, "b": 18, "w": 0.10187289472831984}, {"a": 0, "b": 19, "w": 0.13865128014491335}, {"a": 0, "b": 20, "w": 3.3768765561603686e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-0.300,hiY=0.314;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
