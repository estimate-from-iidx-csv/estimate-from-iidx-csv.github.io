<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 2 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.998, "c": "種", "n": "Level 2 [A]  n=2883 cos1.00 難1.00", "s": 0.825, "f": 0}, {"x": 0.996, "y": 0.922, "c": "近傍", "n": "火影 [A]  n=3399 cos1.00 難0.92", "s": 0.972, "f": 0}, {"x": 0.991, "y": 1.072, "c": "近傍", "n": "Snake Stick [A]  n=3368 cos0.99 難1.07", "s": 0.963, "f": 0}, {"x": 0.993, "y": 0.802, "c": "近傍", "n": "SAY BAY [A]  n=3496 cos0.99 難0.80", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.815, "c": "近傍", "n": "GAME ON [A]  n=1839 cos0.99 難0.81", "s": 0.526, "f": 0}, {"x": 0.985, "y": 0.917, "c": "近傍", "n": "Xperanza [A]  n=3345 cos0.99 難0.92", "s": 0.957, "f": 0}, {"x": 0.989, "y": 0.78, "c": "近傍", "n": "Caterpillar [A]  n=3428 cos0.99 難0.78", "s": 0.981, "f": 0}, {"x": 0.99, "y": 1.237, "c": "近傍", "n": "Peaktime Booster [A]  n=1914 cos0.99 難1.24", "s": 0.547, "f": 0}, {"x": 0.982, "y": 0.976, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3478 cos0.98 難0.98", "s": 0.995, "f": 0}, {"x": 0.982, "y": 1.113, "c": "近傍", "n": "MAD ATTACK [L]  n=1394 cos0.98 難1.11", "s": 0.399, "f": 0}, {"x": 0.981, "y": 1.083, "c": "近傍", "n": "UNDO THE NIGHT [A]  n=648 cos0.98 難1.08", "s": 0.185, "f": 0}, {"x": 0.979, "y": 1.041, "c": "近傍", "n": "Papilio ulysses [A]  n=3228 cos0.98 難1.04", "s": 0.923, "f": 0}, {"x": 0.98, "y": 1.115, "c": "近傍", "n": "199024club -Re:BounceKiller- [A]  n=3344 cos0.98 難1.11", "s": 0.957, "f": 0}, {"x": 0.979, "y": 0.919, "c": "近傍", "n": "花冠 feat.Aikapin [A]  n=3174 cos0.98 難0.92", "s": 0.908, "f": 0}, {"x": 0.994, "y": 0.669, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2172 cos0.99 難0.67", "s": 0.621, "f": 0}, {"x": 0.991, "y": 0.68, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3286 cos0.99 難0.68", "s": 0.94, "f": 0}, {"x": 0.98, "y": 0.873, "c": "近傍", "n": "FANTASTIC THREE [A]  n=3323 cos0.98 難0.87", "s": 0.951, "f": 0}, {"x": 0.989, "y": 1.307, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3148 cos0.99 難1.31", "s": 0.9, "f": 0}, {"x": 0.989, "y": 0.689, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1748 cos0.99 難0.69", "s": 0.5, "f": 0}, {"x": 0.982, "y": 1.198, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.98 難1.20", "s": 0.276, "f": 0}, {"x": 0.982, "y": 0.791, "c": "近傍", "n": "電光 [A]  n=1713 cos0.98 難0.79", "s": 0.49, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5639671772424741}, {"a": 0, "b": 2, "w": 0.40285660934681333}, {"a": 0, "b": 3, "w": 0.46304820458721063}, {"a": 0, "b": 4, "w": 0.3426635422575566}, {"a": 0, "b": 5, "w": 0.2208260856984262}, {"a": 0, "b": 6, "w": 0.32367053726449835}, {"a": 0, "b": 7, "w": 0.3427886171013027}, {"a": 0, "b": 8, "w": 0.09325613808472522}, {"a": 0, "b": 9, "w": 0.07192603418258514}, {"a": 0, "b": 10, "w": 3.1042612924636614e-11}, {"a": 0, "b": 11, "w": 0.06295457247060687}, {"a": 0, "b": 12, "w": 0.07826357566834574}, {"a": 0, "b": 13, "w": 0.08497324737014578}, {"a": 0, "b": 14, "w": 0.3749474772535538}, {"a": 0, "b": 15, "w": 0.3172264704366329}, {"a": 0, "b": 16, "w": 0.02566557465553021}, {"a": 0, "b": 17, "w": 0.2473957613320128}, {"a": 0, "b": 18, "w": 0.21874232031981367}, {"a": 0, "b": 19, "w": 0.13959778402383738}, {"a": 0, "b": 20, "w": 0.14265084950000217}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=0.618,hiY=1.358;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
