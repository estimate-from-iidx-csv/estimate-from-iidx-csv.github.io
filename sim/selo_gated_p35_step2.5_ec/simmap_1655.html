<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">聖人の塔 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.167, "c": "種", "n": "聖人の塔 [H]  n=2717 cos1.00 難-0.17", "s": 0.726, "f": 0}, {"x": 0.989, "y": -0.168, "c": "近傍", "n": "era (nostalmix) [A]  n=2930 cos0.99 難-0.17", "s": 0.783, "f": 0}, {"x": 0.987, "y": -0.173, "c": "近傍", "n": "少年A [H]  n=2696 cos0.99 難-0.17", "s": 0.72, "f": 0}, {"x": 0.987, "y": -0.016, "c": "近傍", "n": "SA.YO.NA.RA. SUPER STAR [A]  n=2911 cos0.99 難-0.02", "s": 0.778, "f": 0}, {"x": 0.989, "y": 0.07, "c": "近傍", "n": "era (step mix) [A]  n=2782 cos0.99 難0.07", "s": 0.743, "f": 0}, {"x": 0.984, "y": -0.321, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.98 難-0.32", "s": 0.712, "f": 0}, {"x": 0.988, "y": 0.099, "c": "近傍", "n": "惑星鉄道 [H]  n=1281 cos0.99 難0.10", "s": 0.342, "f": 0}, {"x": 0.983, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.98 難-0.26", "s": 0.7, "f": 0}, {"x": 0.982, "y": -0.357, "c": "近傍", "n": "冥 [H]  n=3743 cos0.98 難-0.36", "s": 1.0, "f": 0}, {"x": 0.981, "y": -0.346, "c": "近傍", "n": "JOMANDA [H]  n=2984 cos0.98 難-0.35", "s": 0.797, "f": 0}, {"x": 0.977, "y": -0.198, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.98 難-0.20", "s": 0.618, "f": 0}, {"x": 0.977, "y": -0.235, "c": "近傍", "n": "A [H]  n=3015 cos0.98 難-0.23", "s": 0.806, "f": 0}, {"x": 0.98, "y": 0.119, "c": "近傍", "n": "mind the gap [A]  n=1074 cos0.98 難0.12", "s": 0.287, "f": 0}, {"x": 0.975, "y": -0.195, "c": "近傍", "n": "DAY DREAM [H]  n=2662 cos0.97 難-0.20", "s": 0.711, "f": 0}, {"x": 0.988, "y": -0.647, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.99 難-0.65", "s": 0.46, "f": 0}, {"x": 0.972, "y": -0.146, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.97 難-0.15", "s": 0.83, "f": 0}, {"x": 0.972, "y": -0.181, "c": "近傍", "n": "1st Samurai [H]  n=2308 cos0.97 難-0.18", "s": 0.617, "f": 0}, {"x": 0.973, "y": 0.023, "c": "近傍", "n": "Golden Horn [A]  n=1924 cos0.97 難0.02", "s": 0.514, "f": 0}, {"x": 0.972, "y": -0.193, "c": "近傍", "n": "HYPER BOUNDARY GATE [A]  n=1598 cos0.97 難-0.19", "s": 0.427, "f": 0}, {"x": 0.972, "y": -0.258, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.97 難-0.26", "s": 0.835, "f": 0}, {"x": 0.971, "y": -0.194, "c": "近傍", "n": "oratio [H]  n=2403 cos0.97 難-0.19", "s": 0.642, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4474548568000858}, {"a": 0, "b": 2, "w": 0.4129523922069672}, {"a": 0, "b": 3, "w": 0.42608907190643486}, {"a": 0, "b": 4, "w": 0.4089801850536203}, {"a": 0, "b": 5, "w": 0.38850845578595683}, {"a": 0, "b": 6, "w": 0.27308056096527844}, {"a": 0, "b": 7, "w": 0.3646509535070779}, {"a": 0, "b": 8, "w": 0.3531643024442176}, {"a": 0, "b": 9, "w": 0.27811987107671987}, {"a": 0, "b": 10, "w": 0.2690423279282158}, {"a": 0, "b": 11, "w": 0.27376394613494204}, {"a": 0, "b": 12, "w": 0.27162062683507504}, {"a": 0, "b": 13, "w": 0.23204007192576837}, {"a": 0, "b": 14, "w": 0.46677569555527865}, {"a": 0, "b": 15, "w": 0.1189865755810029}, {"a": 0, "b": 16, "w": 0.1856646982987149}, {"a": 0, "b": 17, "w": 3.044120511219717e-11}, {"a": 0, "b": 18, "w": 0.027407348272969423}, {"a": 0, "b": 19, "w": 0.18548021860984631}, {"a": 0, "b": 20, "w": 0.12615082816882905}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.969,hiX=1.002,loY=-0.709,hiY=0.181;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
