<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level One [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.571, "c": "種", "n": "Level One [H]  n=2810 cos1.00 難-0.57", "s": 0.981, "f": 0}, {"x": 0.993, "y": -0.466, "c": "近傍", "n": "BRAINSTORM [H]  n=2556 cos0.99 難-0.47", "s": 0.893, "f": 0}, {"x": 0.989, "y": -0.556, "c": "近傍", "n": "Macho Monky [H]  n=1760 cos0.99 難-0.56", "s": 0.615, "f": 0}, {"x": 0.992, "y": -0.342, "c": "近傍", "n": "Driver [A]  n=1865 cos0.99 難-0.34", "s": 0.651, "f": 0}, {"x": 0.99, "y": -0.763, "c": "近傍", "n": "SOLAR ECLIPSE [H]  n=1479 cos0.99 難-0.76", "s": 0.517, "f": 0}, {"x": 0.986, "y": -0.608, "c": "近傍", "n": "Level 5 [H]  n=961 cos0.99 難-0.61", "s": 0.336, "f": 0}, {"x": 0.987, "y": -0.479, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [H]  n=1812 cos0.99 難-0.48", "s": 0.633, "f": 0}, {"x": 0.986, "y": -0.471, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.99 難-0.47", "s": 0.8, "f": 0}, {"x": 0.985, "y": -0.71, "c": "近傍", "n": "ONIGOROSHI [H]  n=1805 cos0.99 難-0.71", "s": 0.63, "f": 0}, {"x": 0.988, "y": -0.307, "c": "近傍", "n": "HEARTACHE [A]  n=2644 cos0.99 難-0.31", "s": 0.924, "f": 0}, {"x": 0.985, "y": -0.717, "c": "近傍", "n": "WHA [H]  n=1441 cos0.99 難-0.72", "s": 0.503, "f": 0}, {"x": 0.991, "y": -0.935, "c": "近傍", "n": "Cult Invitation [H]  n=759 cos0.99 難-0.93", "s": 0.265, "f": 0}, {"x": 0.984, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.98 難-0.72", "s": 0.709, "f": 0}, {"x": 0.983, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.98 難-0.65", "s": 0.794, "f": 0}, {"x": 0.983, "y": -0.474, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.98 難-0.47", "s": 1.0, "f": 0}, {"x": 0.982, "y": -0.576, "c": "近傍", "n": "Xperanza [H]  n=2619 cos0.98 難-0.58", "s": 0.915, "f": 0}, {"x": 0.988, "y": -0.905, "c": "近傍", "n": "1116 [H]  n=662 cos0.99 難-0.91", "s": 0.231, "f": 0}, {"x": 0.982, "y": -0.571, "c": "近傍", "n": "Don't believe the hype [H]  n=1893 cos0.98 難-0.57", "s": 0.661, "f": 0}, {"x": 0.984, "y": -0.339, "c": "近傍", "n": "Watermelon Explosion [A]  n=775 cos0.98 難-0.34", "s": 0.271, "f": 0}, {"x": 0.983, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.98 難-0.74", "s": 0.652, "f": 0}, {"x": 0.987, "y": -0.216, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.22", "s": 0.783, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.37276803942230186}, {"a": 0, "b": 2, "w": 0.4285538590309287}, {"a": 0, "b": 3, "w": 0.37332356526304955}, {"a": 0, "b": 4, "w": 0.4584398708293892}, {"a": 0, "b": 5, "w": 0.28113013119416974}, {"a": 0, "b": 6, "w": 0.37997630622761736}, {"a": 0, "b": 7, "w": 0.31748185674963714}, {"a": 0, "b": 8, "w": 0.3594373602277383}, {"a": 0, "b": 9, "w": 0.4224552277367366}, {"a": 0, "b": 10, "w": 0.3675277054419194}, {"a": 0, "b": 11, "w": 0.3303373362072516}, {"a": 0, "b": 12, "w": 0.04583050576364478}, {"a": 0, "b": 13, "w": 0.10039164714174864}, {"a": 0, "b": 14, "w": 0.17857072721141132}, {"a": 0, "b": 15, "w": 0.309884201966628}, {"a": 0, "b": 16, "w": 0.39673369019128935}, {"a": 0, "b": 17, "w": 0.2654807826299316}, {"a": 0, "b": 18, "w": 0.3448670204914446}, {"a": 0, "b": 19, "w": 3.345523857944954e-11}, {"a": 0, "b": 20, "w": 0.41608796677452287}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-0.992,hiY=-0.159;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
