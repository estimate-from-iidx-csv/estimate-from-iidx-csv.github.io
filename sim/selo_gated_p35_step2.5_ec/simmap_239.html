<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Believe In Me [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.763, "c": "種", "n": "Believe In Me [H]  n=1756 cos1.00 難-0.76", "s": 0.677, "f": 0}, {"x": 0.999, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos1.00 難-0.84", "s": 0.771, "f": 0}, {"x": 0.996, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos1.00 難-0.83", "s": 0.605, "f": 0}, {"x": 0.995, "y": -0.744, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.99 難-0.74", "s": 0.825, "f": 0}, {"x": 0.995, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.72, "f": 0}, {"x": 0.995, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.638, "f": 0}, {"x": 0.994, "y": -0.796, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.80", "s": 0.878, "f": 0}, {"x": 0.993, "y": -0.789, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.99 難-0.79", "s": 0.642, "f": 0}, {"x": 0.993, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.72", "s": 0.783, "f": 0}, {"x": 0.995, "y": -0.925, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos1.00 難-0.92", "s": 0.866, "f": 0}, {"x": 0.992, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.70", "s": 0.693, "f": 0}, {"x": 0.992, "y": -0.681, "c": "近傍", "n": "MOON [H]  n=1890 cos0.99 難-0.68", "s": 0.729, "f": 0}, {"x": 0.992, "y": -0.804, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2287 cos0.99 難-0.80", "s": 0.882, "f": 0}, {"x": 0.991, "y": -0.75, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.75", "s": 0.714, "f": 0}, {"x": 0.994, "y": -0.607, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.61", "s": 0.976, "f": 0}, {"x": 0.991, "y": -0.801, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.99 難-0.80", "s": 0.792, "f": 0}, {"x": 0.995, "y": -0.556, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos1.00 難-0.56", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.939, "c": "近傍", "n": "Venom [H]  n=1708 cos0.99 難-0.94", "s": 0.659, "f": 0}, {"x": 0.992, "y": -0.907, "c": "近傍", "n": "New Lights [H]  n=1942 cos0.99 難-0.91", "s": 0.749, "f": 0}, {"x": 0.993, "y": -0.604, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.60", "s": 0.718, "f": 0}, {"x": 0.99, "y": -0.741, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.99 難-0.74", "s": 0.818, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.760790382829796}, {"a": 0, "b": 2, "w": 0.5341524351692091}, {"a": 0, "b": 3, "w": 0.5209852692873459}, {"a": 0, "b": 4, "w": 0.4795689522975415}, {"a": 0, "b": 5, "w": 0.40772067143859425}, {"a": 0, "b": 6, "w": 0.4562383731853268}, {"a": 0, "b": 7, "w": 0.30340489293172135}, {"a": 0, "b": 8, "w": 0.4299162435313948}, {"a": 0, "b": 9, "w": 0.49613409569168443}, {"a": 0, "b": 10, "w": 5.057276819542267e-11}, {"a": 0, "b": 11, "w": 0.43060248913394505}, {"a": 0, "b": 12, "w": 0.3362394007109448}, {"a": 0, "b": 13, "w": 0.2551691366254698}, {"a": 0, "b": 14, "w": 0.4564589747139388}, {"a": 0, "b": 15, "w": 0.36494807179401445}, {"a": 0, "b": 16, "w": 0.5188985901905876}, {"a": 0, "b": 17, "w": 0.39485458143148566}, {"a": 0, "b": 18, "w": 0.4217667191527319}, {"a": 0, "b": 19, "w": 0.32187880296221827}, {"a": 0, "b": 20, "w": 0.35297370588172494}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.969,hiY=-0.526;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
