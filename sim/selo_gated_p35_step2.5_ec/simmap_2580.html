<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">dica dica [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.653, "c": "種", "n": "dica dica [A]  n=2105 cos1.00 難0.65", "s": 0.562, "f": 0}, {"x": 0.995, "y": 0.493, "c": "近傍", "n": "THE SHINING POLARIS(kors k mix) [A]  n=1527 cos1.00 難0.49", "s": 0.408, "f": 0}, {"x": 0.994, "y": 0.471, "c": "近傍", "n": "BRAINSTORM [A]  n=3418 cos0.99 難0.47", "s": 0.913, "f": 0}, {"x": 0.99, "y": 0.679, "c": "近傍", "n": "Fegrix [A]  n=2634 cos0.99 難0.68", "s": 0.704, "f": 0}, {"x": 0.997, "y": 0.407, "c": "近傍", "n": "Modular Technology [A]  n=3023 cos1.00 難0.41", "s": 0.808, "f": 0}, {"x": 0.989, "y": 0.662, "c": "近傍", "n": "THUNDERSTRIKE [A]  n=550 cos0.99 難0.66", "s": 0.147, "f": 0}, {"x": 0.991, "y": 0.873, "c": "近傍", "n": "FANTASTIC THREE [A]  n=3323 cos0.99 難0.87", "s": 0.888, "f": 0}, {"x": 0.989, "y": 0.48, "c": "近傍", "n": "3V0 [A]  n=2201 cos0.99 難0.48", "s": 0.588, "f": 0}, {"x": 0.989, "y": 0.423, "c": "近傍", "n": "Crazy Jackpot [A]  n=2701 cos0.99 難0.42", "s": 0.722, "f": 0}, {"x": 0.986, "y": 0.78, "c": "近傍", "n": "Caterpillar [A]  n=3428 cos0.99 難0.78", "s": 0.916, "f": 0}, {"x": 0.988, "y": 0.453, "c": "近傍", "n": "diagram [A]  n=3166 cos0.99 難0.45", "s": 0.846, "f": 0}, {"x": 0.987, "y": 0.821, "c": "近傍", "n": "FlyAway [A]  n=1232 cos0.99 難0.82", "s": 0.329, "f": 0}, {"x": 0.986, "y": 0.802, "c": "近傍", "n": "SAY BAY [A]  n=3496 cos0.99 難0.80", "s": 0.934, "f": 0}, {"x": 0.991, "y": 0.346, "c": "近傍", "n": "Around the Future [A]  n=3149 cos0.99 難0.35", "s": 0.841, "f": 0}, {"x": 0.989, "y": 0.385, "c": "近傍", "n": "Neo Heritage [A]  n=2299 cos0.99 難0.39", "s": 0.614, "f": 0}, {"x": 0.985, "y": 0.531, "c": "近傍", "n": "The Sampling Paradise [A]  n=3743 cos0.98 難0.53", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.376, "c": "近傍", "n": "& Intelligence [A]  n=2938 cos0.99 難0.38", "s": 0.785, "f": 0}, {"x": 0.983, "y": 0.669, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2172 cos0.98 難0.67", "s": 0.58, "f": 0}, {"x": 0.984, "y": 0.536, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.98 難0.54", "s": 0.901, "f": 0}, {"x": 0.985, "y": 0.446, "c": "近傍", "n": "Carry Me Away [A]  n=3350 cos0.99 難0.45", "s": 0.895, "f": 0}, {"x": 0.982, "y": 0.503, "c": "近傍", "n": "Funny shuffle [A]  n=3261 cos0.98 難0.50", "s": 0.871, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40256834875671177}, {"a": 0, "b": 2, "w": 0.4040908738135597}, {"a": 0, "b": 3, "w": 0.26077414767325713}, {"a": 0, "b": 4, "w": 0.3978402373154333}, {"a": 0, "b": 5, "w": 0.16145038873908268}, {"a": 0, "b": 6, "w": 0.10036997195982089}, {"a": 0, "b": 7, "w": 0.242278852680466}, {"a": 0, "b": 8, "w": 0.06030313945478516}, {"a": 0, "b": 9, "w": 0.058261143383027236}, {"a": 0, "b": 10, "w": 0.11380372530004734}, {"a": 0, "b": 11, "w": 0.09726275284519448}, {"a": 0, "b": 12, "w": 0.07373270494749129}, {"a": 0, "b": 13, "w": 0.033815071820450626}, {"a": 0, "b": 14, "w": 0.15481125390842754}, {"a": 0, "b": 15, "w": 0.09151991316729224}, {"a": 0, "b": 16, "w": 0.18517990532451767}, {"a": 0, "b": 17, "w": 0.047676326221284704}, {"a": 0, "b": 18, "w": 0.07458100436267923}, {"a": 0, "b": 19, "w": 0.12808741804408375}, {"a": 0, "b": 20, "w": 3.6859737484462585e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=0.304,hiY=0.915;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
