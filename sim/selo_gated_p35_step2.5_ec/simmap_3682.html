<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">寝起きヤシの木 [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.137, "c": "種", "n": "寝起きヤシの木 [L]  n=318 cos1.00 難1.14", "s": 0.095, "f": 0}, {"x": 0.993, "y": 1.139, "c": "近傍", "n": "garden [L]  n=977 cos0.99 難1.14", "s": 0.293, "f": 0}, {"x": 0.992, "y": 1.083, "c": "近傍", "n": "UNDO THE NIGHT [A]  n=648 cos0.99 難1.08", "s": 0.194, "f": 0}, {"x": 0.995, "y": 1.045, "c": "近傍", "n": "Amazing Mirage [L]  n=3185 cos1.00 難1.05", "s": 0.954, "f": 0}, {"x": 0.99, "y": 1.113, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2239 cos0.99 難1.11", "s": 0.671, "f": 0}, {"x": 0.993, "y": 1.239, "c": "近傍", "n": "BIGWAVERS [A]  n=1782 cos0.99 難1.24", "s": 0.534, "f": 0}, {"x": 0.994, "y": 1.034, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2198 cos0.99 難1.03", "s": 0.658, "f": 0}, {"x": 0.988, "y": 1.146, "c": "近傍", "n": "Cosmic Cat [L]  n=3126 cos0.99 難1.15", "s": 0.936, "f": 0}, {"x": 0.993, "y": 1.247, "c": "近傍", "n": "†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [A]  n=3264 cos0.99 難1.25", "s": 0.978, "f": 0}, {"x": 0.989, "y": 1.198, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.99 難1.20", "s": 0.289, "f": 0}, {"x": 0.992, "y": 1.032, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos0.99 難1.03", "s": 0.394, "f": 0}, {"x": 0.988, "y": 1.178, "c": "近傍", "n": "Smalt #28598F [A]  n=2172 cos0.99 難1.18", "s": 0.651, "f": 0}, {"x": 0.988, "y": 1.073, "c": "近傍", "n": "THE DAY OF JUBILATIONS [A]  n=3058 cos0.99 難1.07", "s": 0.916, "f": 0}, {"x": 0.992, "y": 1.021, "c": "近傍", "n": "MARLIN [A]  n=1133 cos0.99 難1.02", "s": 0.339, "f": 0}, {"x": 0.986, "y": 1.121, "c": "近傍", "n": "Drop Syndicate [A]  n=1341 cos0.99 難1.12", "s": 0.402, "f": 0}, {"x": 0.992, "y": 1.261, "c": "近傍", "n": "電腦都市 [A]  n=1375 cos0.99 難1.26", "s": 0.412, "f": 0}, {"x": 0.988, "y": 1.234, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3030 cos0.99 難1.23", "s": 0.908, "f": 0}, {"x": 0.99, "y": 1.257, "c": "近傍", "n": "Grand Chariot [A]  n=3155 cos0.99 難1.26", "s": 0.945, "f": 0}, {"x": 0.99, "y": 1.016, "c": "近傍", "n": "NEO GENERATOR SEVEN [A]  n=3253 cos0.99 難1.02", "s": 0.975, "f": 0}, {"x": 0.993, "y": 0.99, "c": "近傍", "n": "Angel's Ladder [A]  n=2498 cos0.99 難0.99", "s": 0.748, "f": 0}, {"x": 0.985, "y": 1.159, "c": "近傍", "n": "Sense 2007 [A]  n=3338 cos0.98 難1.16", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.266580810759963}, {"a": 0, "b": 2, "w": 0.34413693701377757}, {"a": 0, "b": 3, "w": 0.4974761674586242}, {"a": 0, "b": 4, "w": 0.28936268075552374}, {"a": 0, "b": 5, "w": 0.40442582523823745}, {"a": 0, "b": 6, "w": 0.4358280223416401}, {"a": 0, "b": 7, "w": 0.21918347778927383}, {"a": 0, "b": 8, "w": 0.30316364063651946}, {"a": 0, "b": 9, "w": 0.22277760616111608}, {"a": 0, "b": 10, "w": 0.34410685814654673}, {"a": 0, "b": 11, "w": 0.18838007563102}, {"a": 0, "b": 12, "w": 0.2493102023335183}, {"a": 0, "b": 13, "w": 0.38987916942006573}, {"a": 0, "b": 14, "w": 3.2330471633201796e-11}, {"a": 0, "b": 15, "w": 0.37489627939946857}, {"a": 0, "b": 16, "w": 0.23673007885780906}, {"a": 0, "b": 17, "w": 0.3118956481694116}, {"a": 0, "b": 18, "w": 0.28776925280926}, {"a": 0, "b": 19, "w": 0.35749964943785095}, {"a": 0, "b": 20, "w": 0.07756642248657675}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=0.968,hiY=1.283;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
