<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Fly Above (Vicissitude Remix) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.242, "c": "種", "n": "Fly Above (Vicissitude Remix) [A]  n=2511 cos1.00 難-0.24", "s": 0.683, "f": 0}, {"x": 0.997, "y": -0.193, "c": "近傍", "n": "Mel [L]  n=613 cos1.00 難-0.19", "s": 0.167, "f": 0}, {"x": 0.994, "y": -0.284, "c": "近傍", "n": "Chewingood!!! [A]  n=3073 cos0.99 難-0.28", "s": 0.836, "f": 0}, {"x": 0.993, "y": -0.217, "c": "近傍", "n": "突撃!ガラスのニーソ姫! [A]  n=3529 cos0.99 難-0.22", "s": 0.96, "f": 0}, {"x": 0.993, "y": -0.285, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.28", "s": 0.824, "f": 0}, {"x": 0.993, "y": -0.223, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos0.99 難-0.22", "s": 0.693, "f": 0}, {"x": 0.993, "y": -0.179, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos0.99 難-0.18", "s": 0.837, "f": 0}, {"x": 0.993, "y": -0.197, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos0.99 難-0.20", "s": 0.937, "f": 0}, {"x": 0.994, "y": -0.416, "c": "近傍", "n": "Skywalking [A]  n=620 cos0.99 難-0.42", "s": 0.169, "f": 0}, {"x": 0.995, "y": -0.464, "c": "近傍", "n": "恋愛観測 [A]  n=636 cos1.00 難-0.46", "s": 0.173, "f": 0}, {"x": 0.992, "y": -0.147, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos0.99 難-0.15", "s": 0.701, "f": 0}, {"x": 0.996, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos1.00 難0.03", "s": 0.985, "f": 0}, {"x": 0.993, "y": -0.394, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2661 cos0.99 難-0.39", "s": 0.724, "f": 0}, {"x": 0.992, "y": -0.257, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos0.99 難-0.26", "s": 0.655, "f": 0}, {"x": 0.993, "y": -0.101, "c": "近傍", "n": "AO-∞ [A]  n=2934 cos0.99 難-0.10", "s": 0.798, "f": 0}, {"x": 0.992, "y": -0.31, "c": "近傍", "n": "アイドル [A]  n=2110 cos0.99 難-0.31", "s": 0.574, "f": 0}, {"x": 0.993, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.04", "s": 0.757, "f": 0}, {"x": 0.992, "y": -0.412, "c": "近傍", "n": "in the Sky [H]  n=2364 cos0.99 難-0.41", "s": 0.643, "f": 0}, {"x": 0.993, "y": -0.047, "c": "近傍", "n": "QQQ [A]  n=2895 cos0.99 難-0.05", "s": 0.788, "f": 0}, {"x": 0.991, "y": -0.202, "c": "近傍", "n": "Express Emotion [A]  n=3445 cos0.99 難-0.20", "s": 0.937, "f": 0}, {"x": 0.991, "y": -0.255, "c": "近傍", "n": "3y3s [H]  n=3676 cos0.99 難-0.25", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2688662365000133}, {"a": 0, "b": 2, "w": 0.2408833800496919}, {"a": 0, "b": 3, "w": 0.2897843363455619}, {"a": 0, "b": 4, "w": 0.14085036685836128}, {"a": 0, "b": 5, "w": 0.20362429882809086}, {"a": 0, "b": 6, "w": 0.1253978131133412}, {"a": 0, "b": 7, "w": 0.1398461792789022}, {"a": 0, "b": 8, "w": 0.3191345746673846}, {"a": 0, "b": 9, "w": 0.3814758028414901}, {"a": 0, "b": 10, "w": 0.20065116351688317}, {"a": 0, "b": 11, "w": 0.2938830031251969}, {"a": 0, "b": 12, "w": 0.18687811061267035}, {"a": 0, "b": 13, "w": 0.21976011954874963}, {"a": 0, "b": 14, "w": 0.20957685423072547}, {"a": 0, "b": 15, "w": 0.21045876586225054}, {"a": 0, "b": 16, "w": 0.1943892433285569}, {"a": 0, "b": 17, "w": 0.21572920557206965}, {"a": 0, "b": 18, "w": 0.11836393167736625}, {"a": 0, "b": 19, "w": 0.13069725530294407}, {"a": 0, "b": 20, "w": 5.7690741073201934e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.504,hiY=0.068;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
