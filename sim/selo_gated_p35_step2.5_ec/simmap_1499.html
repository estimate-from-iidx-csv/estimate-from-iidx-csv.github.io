<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Sigmund [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.467, "c": "種", "n": "Sigmund [H]  n=2989 cos1.00 難-0.47", "s": 0.913, "f": 0}, {"x": 0.993, "y": -0.497, "c": "近傍", "n": "TOXIC VIBRATION [H]  n=2913 cos0.99 難-0.50", "s": 0.89, "f": 0}, {"x": 0.992, "y": -0.526, "c": "近傍", "n": "Verflucht [H]  n=3274 cos0.99 難-0.53", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.56, "c": "近傍", "n": "シムルグの目醒め [H]  n=2325 cos0.99 難-0.56", "s": 0.71, "f": 0}, {"x": 0.993, "y": -0.581, "c": "近傍", "n": "Carmina [H]  n=2220 cos0.99 難-0.58", "s": 0.678, "f": 0}, {"x": 0.991, "y": -0.404, "c": "近傍", "n": "AA -rebuild- [H]  n=3002 cos0.99 難-0.40", "s": 0.917, "f": 0}, {"x": 0.997, "y": -0.244, "c": "近傍", "n": "共鳴遊戯の華 [H]  n=2742 cos1.00 難-0.24", "s": 0.838, "f": 0}, {"x": 0.989, "y": -0.437, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.44", "s": 0.761, "f": 0}, {"x": 0.989, "y": -0.418, "c": "近傍", "n": "疾風迅雷 [H]  n=2797 cos0.99 難-0.42", "s": 0.854, "f": 0}, {"x": 0.988, "y": -0.392, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3252 cos0.99 難-0.39", "s": 0.993, "f": 0}, {"x": 0.987, "y": -0.56, "c": "近傍", "n": "StrayedCatz [H]  n=2624 cos0.99 難-0.56", "s": 0.801, "f": 0}, {"x": 0.989, "y": -0.647, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.99 難-0.65", "s": 0.526, "f": 0}, {"x": 0.986, "y": -0.558, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos0.99 難-0.56", "s": 0.647, "f": 0}, {"x": 0.986, "y": -0.573, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.57", "s": 0.726, "f": 0}, {"x": 0.989, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.99 難-0.26", "s": 0.8, "f": 0}, {"x": 0.992, "y": -0.74, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.99 難-0.74", "s": 0.226, "f": 0}, {"x": 0.993, "y": -0.173, "c": "近傍", "n": "少年A [H]  n=2696 cos0.99 難-0.17", "s": 0.823, "f": 0}, {"x": 0.989, "y": -0.239, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.24", "s": 0.752, "f": 0}, {"x": 0.985, "y": -0.576, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.99 難-0.58", "s": 0.779, "f": 0}, {"x": 0.988, "y": -0.258, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.26", "s": 0.954, "f": 0}, {"x": 0.986, "y": -0.605, "c": "近傍", "n": "トリカゴノ鳳凰 [H]  n=2598 cos0.99 難-0.61", "s": 0.794, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.502425844284214}, {"a": 0, "b": 2, "w": 0.3176928511631588}, {"a": 0, "b": 3, "w": 0.4673964563108475}, {"a": 0, "b": 4, "w": 0.28044341688147134}, {"a": 0, "b": 5, "w": 0.3623682272323818}, {"a": 0, "b": 6, "w": 0.6634450358728822}, {"a": 0, "b": 7, "w": 0.3523568612359004}, {"a": 0, "b": 8, "w": 0.3362112278555013}, {"a": 0, "b": 9, "w": 0.2568141683048103}, {"a": 0, "b": 10, "w": 0.2072184576495455}, {"a": 0, "b": 11, "w": 0.3202780057415482}, {"a": 0, "b": 12, "w": 0.1690346234145338}, {"a": 0, "b": 13, "w": 0.05569721114088788}, {"a": 0, "b": 14, "w": 0.35306465403750575}, {"a": 0, "b": 15, "w": 0.44368072609588927}, {"a": 0, "b": 16, "w": 0.4782155479353506}, {"a": 0, "b": 17, "w": 0.3178971791862786}, {"a": 0, "b": 18, "w": 3.9969805243345036e-11}, {"a": 0, "b": 19, "w": 0.3188865772555012}, {"a": 0, "b": 20, "w": 0.2060053507813756}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.785,hiY=-0.128;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
