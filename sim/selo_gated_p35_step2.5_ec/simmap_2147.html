<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">State Of The Art [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.283, "c": "種", "n": "State Of The Art [A]  n=2947 cos1.00 難0.28", "s": 0.803, "f": 0}, {"x": 0.996, "y": 0.195, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.19", "s": 0.766, "f": 0}, {"x": 0.995, "y": 0.265, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.26", "s": 0.836, "f": 0}, {"x": 0.997, "y": 0.163, "c": "近傍", "n": "Xepher [A]  n=3669 cos1.00 難0.16", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos1.00 難0.20", "s": 0.942, "f": 0}, {"x": 0.994, "y": 0.218, "c": "近傍", "n": "xenon [A]  n=3549 cos0.99 難0.22", "s": 0.967, "f": 0}, {"x": 0.996, "y": 0.409, "c": "近傍", "n": "Light and Cyber… [A]  n=3255 cos1.00 難0.41", "s": 0.887, "f": 0}, {"x": 0.993, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos0.99 難0.27", "s": 0.933, "f": 0}, {"x": 0.994, "y": 0.384, "c": "近傍", "n": "明鏡止水 [A]  n=3157 cos0.99 難0.38", "s": 0.86, "f": 0}, {"x": 0.995, "y": 0.143, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos0.99 難0.14", "s": 0.961, "f": 0}, {"x": 0.993, "y": 0.283, "c": "近傍", "n": "Kung-fu Empire [A]  n=3465 cos0.99 難0.28", "s": 0.944, "f": 0}, {"x": 0.994, "y": 0.4, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3025 cos0.99 難0.40", "s": 0.824, "f": 0}, {"x": 0.993, "y": 0.363, "c": "近傍", "n": "Moving on [A]  n=3017 cos0.99 難0.36", "s": 0.822, "f": 0}, {"x": 0.993, "y": 0.366, "c": "近傍", "n": "INAZUMA [A]  n=3450 cos0.99 難0.37", "s": 0.94, "f": 0}, {"x": 0.993, "y": 0.173, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos0.99 難0.17", "s": 0.481, "f": 0}, {"x": 0.993, "y": 0.194, "c": "近傍", "n": "Countdown to Heaven or Hell [A]  n=1126 cos0.99 難0.19", "s": 0.307, "f": 0}, {"x": 0.992, "y": 0.242, "c": "近傍", "n": "Take My Life [A]  n=3360 cos0.99 難0.24", "s": 0.916, "f": 0}, {"x": 0.992, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos0.99 難0.26", "s": 0.28, "f": 0}, {"x": 0.992, "y": 0.358, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [A]  n=2881 cos0.99 難0.36", "s": 0.785, "f": 0}, {"x": 0.997, "y": 0.495, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3105 cos1.00 難0.49", "s": 0.846, "f": 0}, {"x": 0.993, "y": 0.376, "c": "近傍", "n": "Bow shock!! [A]  n=2972 cos0.99 難0.38", "s": 0.81, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4422925144688815}, {"a": 0, "b": 2, "w": 0.38654383410523807}, {"a": 0, "b": 3, "w": 0.43113779746805236}, {"a": 0, "b": 4, "w": 0.2590366996378428}, {"a": 0, "b": 5, "w": 0.345514289325095}, {"a": 0, "b": 6, "w": 0.06826522498916365}, {"a": 0, "b": 7, "w": 0.30843578561276896}, {"a": 0, "b": 8, "w": 0.36358078242601777}, {"a": 0, "b": 9, "w": 0.3945082968907653}, {"a": 0, "b": 10, "w": 0.17245492995485034}, {"a": 0, "b": 11, "w": 0.3067374659425701}, {"a": 0, "b": 12, "w": 0.31274190506340027}, {"a": 0, "b": 13, "w": 0.2094387161797635}, {"a": 0, "b": 14, "w": 0.2549969845084985}, {"a": 0, "b": 15, "w": 0.06120744329653505}, {"a": 0, "b": 16, "w": 0.23965336704187112}, {"a": 0, "b": 17, "w": 0.2601037307301546}, {"a": 0, "b": 18, "w": 5.0065618317773897e-11}, {"a": 0, "b": 19, "w": 0.42835416329654374}, {"a": 0, "b": 20, "w": 0.1632395008576959}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.115,hiY=0.523;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
