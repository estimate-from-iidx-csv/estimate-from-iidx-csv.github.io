<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dawn Saga [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.298, "c": "種", "n": "Dawn Saga [A]  n=2733 cos1.00 難0.30", "s": 0.772, "f": 0}, {"x": 0.995, "y": 0.231, "c": "近傍", "n": "鬼天 [A]  n=3356 cos1.00 難0.23", "s": 0.948, "f": 0}, {"x": 0.995, "y": 0.232, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2640 cos0.99 難0.23", "s": 0.746, "f": 0}, {"x": 0.996, "y": 0.125, "c": "近傍", "n": "voice of echo. [A]  n=814 cos1.00 難0.13", "s": 0.23, "f": 0}, {"x": 0.993, "y": 0.385, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2466 cos0.99 難0.39", "s": 0.697, "f": 0}, {"x": 0.992, "y": 0.356, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.36", "s": 0.773, "f": 0}, {"x": 0.993, "y": 0.081, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2858 cos0.99 難0.08", "s": 0.807, "f": 0}, {"x": 0.99, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.32", "s": 0.924, "f": 0}, {"x": 0.99, "y": 0.265, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.26", "s": 0.866, "f": 0}, {"x": 0.99, "y": 0.174, "c": "近傍", "n": "end of world [A]  n=3010 cos0.99 難0.17", "s": 0.85, "f": 0}, {"x": 0.99, "y": 0.407, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.41", "s": 0.938, "f": 0}, {"x": 0.99, "y": 0.236, "c": "近傍", "n": "HEISEI [A]  n=3350 cos0.99 難0.24", "s": 0.946, "f": 0}, {"x": 0.991, "y": 0.085, "c": "近傍", "n": "Energy Drive [A]  n=3461 cos0.99 難0.08", "s": 0.978, "f": 0}, {"x": 0.989, "y": 0.189, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.19", "s": 0.992, "f": 0}, {"x": 0.989, "y": 0.4, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3025 cos0.99 難0.40", "s": 0.855, "f": 0}, {"x": 0.991, "y": 0.073, "c": "近傍", "n": "ZERO-ONE [A]  n=2950 cos0.99 難0.07", "s": 0.833, "f": 0}, {"x": 0.99, "y": 0.107, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos0.99 難0.11", "s": 0.318, "f": 0}, {"x": 0.989, "y": 0.121, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.12", "s": 0.966, "f": 0}, {"x": 0.99, "y": 0.107, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos0.99 難0.11", "s": 0.991, "f": 0}, {"x": 0.988, "y": 0.216, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.99 難0.22", "s": 0.714, "f": 0}, {"x": 0.989, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.11", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5329086665863411}, {"a": 0, "b": 2, "w": 0.5361955019820331}, {"a": 0, "b": 3, "w": 0.5959310265444704}, {"a": 0, "b": 4, "w": 0.4601262754294164}, {"a": 0, "b": 5, "w": 0.3998617810499703}, {"a": 0, "b": 6, "w": 0.429321524289314}, {"a": 0, "b": 7, "w": 0.08114579281347334}, {"a": 0, "b": 8, "w": 0.3333496550193229}, {"a": 0, "b": 9, "w": 0.1767740256955992}, {"a": 0, "b": 10, "w": 0.15728045153419223}, {"a": 0, "b": 11, "w": 0.28833103392108295}, {"a": 0, "b": 12, "w": 0.33139574050318354}, {"a": 0, "b": 13, "w": 0.3331095122310226}, {"a": 0, "b": 14, "w": 0.34278717997317176}, {"a": 0, "b": 15, "w": 3.539069037827858e-11}, {"a": 0, "b": 16, "w": 0.3666902996668172}, {"a": 0, "b": 17, "w": 0.047277835094130305}, {"a": 0, "b": 18, "w": 0.21945108462870844}, {"a": 0, "b": 19, "w": 0.32441790430620276}, {"a": 0, "b": 20, "w": 0.05582011162005984}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.047,hiY=0.434;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
