<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">NEMESIS [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.459, "c": "種", "n": "NEMESIS [A]  n=3214 cos1.00 難0.46", "s": 0.888, "f": 0}, {"x": 0.994, "y": 0.258, "c": "近傍", "n": "rainbow flyer [A]  n=3359 cos0.99 難0.26", "s": 0.928, "f": 0}, {"x": 0.991, "y": 0.459, "c": "近傍", "n": "GOBBLE [A]  n=3141 cos0.99 難0.46", "s": 0.868, "f": 0}, {"x": 0.989, "y": 0.404, "c": "近傍", "n": "ALL MY TURN -このターンに、オレの全てを賭ける- [A]  n=3262 cos0.99 難0.40", "s": 0.901, "f": 0}, {"x": 0.989, "y": 0.385, "c": "近傍", "n": "GENOCIDE [A]  n=3260 cos0.99 難0.39", "s": 0.901, "f": 0}, {"x": 0.989, "y": 0.297, "c": "近傍", "n": "Blame [A]  n=3294 cos0.99 難0.30", "s": 0.91, "f": 0}, {"x": 0.988, "y": 0.407, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.41", "s": 0.917, "f": 0}, {"x": 0.989, "y": 0.295, "c": "近傍", "n": "GUILTY [A]  n=1451 cos0.99 難0.29", "s": 0.401, "f": 0}, {"x": 0.988, "y": 0.468, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.47", "s": 0.896, "f": 0}, {"x": 0.988, "y": 0.52, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.99 難0.52", "s": 0.919, "f": 0}, {"x": 0.992, "y": 0.129, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [H]  n=3620 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.324, "c": "近傍", "n": "Lighting Shower [A]  n=3194 cos0.99 難0.32", "s": 0.882, "f": 0}, {"x": 0.988, "y": 0.426, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3248 cos0.99 難0.43", "s": 0.897, "f": 0}, {"x": 0.987, "y": 0.458, "c": "近傍", "n": "stoic [A]  n=3319 cos0.99 難0.46", "s": 0.917, "f": 0}, {"x": 0.991, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos0.99 難0.12", "s": 0.716, "f": 0}, {"x": 0.991, "y": 0.121, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.12", "s": 0.944, "f": 0}, {"x": 0.988, "y": 0.225, "c": "近傍", "n": "SNOW [A]  n=2759 cos0.99 難0.22", "s": 0.762, "f": 0}, {"x": 0.987, "y": 0.386, "c": "近傍", "n": "Castle on the Moon [A]  n=3392 cos0.99 難0.39", "s": 0.937, "f": 0}, {"x": 0.99, "y": 0.139, "c": "近傍", "n": "Sakura Mirage [A]  n=3464 cos0.99 難0.14", "s": 0.957, "f": 0}, {"x": 0.989, "y": 0.122, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos0.99 難0.12", "s": 0.676, "f": 0}, {"x": 0.989, "y": 0.115, "c": "近傍", "n": "Good Looking [A]  n=761 cos0.99 難0.12", "s": 0.21, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5619320503864963}, {"a": 0, "b": 2, "w": 0.45070839234156035}, {"a": 0, "b": 3, "w": 0.09836391471268968}, {"a": 0, "b": 4, "w": 0.2570896085007265}, {"a": 0, "b": 5, "w": 0.4061550482753348}, {"a": 0, "b": 6, "w": 0.375981792622069}, {"a": 0, "b": 7, "w": 0.3978798038042324}, {"a": 0, "b": 8, "w": 0.28831702509369905}, {"a": 0, "b": 9, "w": 0.17792314116413488}, {"a": 0, "b": 10, "w": 0.35614216665255627}, {"a": 0, "b": 11, "w": 0.3285333914259493}, {"a": 0, "b": 12, "w": 0.34488672916853913}, {"a": 0, "b": 13, "w": 0.30552845563369224}, {"a": 0, "b": 14, "w": 0.459069452690006}, {"a": 0, "b": 15, "w": 0.4567825080894645}, {"a": 0, "b": 16, "w": 0.3784705202557138}, {"a": 0, "b": 17, "w": 3.819722316222851e-11}, {"a": 0, "b": 18, "w": 0.12625298354613956}, {"a": 0, "b": 19, "w": 0.3639019665463844}, {"a": 0, "b": 20, "w": 0.37873936065939706}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.083,hiY=0.553;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
