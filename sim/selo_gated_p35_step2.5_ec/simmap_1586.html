<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Xerulean [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.833, "c": "種", "n": "Xerulean [H]  n=981 cos1.00 難-0.83", "s": 0.29, "f": 0}, {"x": 0.988, "y": -0.987, "c": "近傍", "n": "Dahlia [H]  n=1112 cos0.99 難-0.99", "s": 0.329, "f": 0}, {"x": 0.987, "y": -0.989, "c": "近傍", "n": "Bad Encryption [H]  n=1504 cos0.99 難-0.99", "s": 0.444, "f": 0}, {"x": 0.985, "y": -0.723, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos0.99 難-0.72", "s": 0.501, "f": 0}, {"x": 0.986, "y": -0.971, "c": "近傍", "n": "LOCUS OF THE TRAVEL [H]  n=1281 cos0.99 難-0.97", "s": 0.379, "f": 0}, {"x": 0.986, "y": -0.995, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=575 cos0.99 難-1.00", "s": 0.17, "f": 0}, {"x": 0.982, "y": -0.751, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [H]  n=2428 cos0.98 難-0.75", "s": 0.717, "f": 0}, {"x": 0.984, "y": -0.583, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.98 難-0.58", "s": 0.706, "f": 0}, {"x": 0.982, "y": -0.986, "c": "近傍", "n": "Vulnerability [H]  n=664 cos0.98 難-0.99", "s": 0.196, "f": 0}, {"x": 0.983, "y": -0.572, "c": "近傍", "n": "VOID [H]  n=878 cos0.98 難-0.57", "s": 0.259, "f": 0}, {"x": 0.98, "y": -0.809, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=610 cos0.98 難-0.81", "s": 0.18, "f": 0}, {"x": 0.98, "y": -0.934, "c": "近傍", "n": "GiGaGaHell [H]  n=1621 cos0.98 難-0.93", "s": 0.479, "f": 0}, {"x": 0.981, "y": -0.683, "c": "近傍", "n": "GENE [H]  n=2179 cos0.98 難-0.68", "s": 0.644, "f": 0}, {"x": 0.979, "y": -0.77, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos0.98 難-0.77", "s": 0.659, "f": 0}, {"x": 0.981, "y": -0.605, "c": "近傍", "n": "Xlo [H]  n=2314 cos0.98 難-0.60", "s": 0.684, "f": 0}, {"x": 0.978, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.98 難-0.81", "s": 0.28, "f": 0}, {"x": 0.979, "y": -0.658, "c": "近傍", "n": "Level 4 [H]  n=1523 cos0.98 難-0.66", "s": 0.45, "f": 0}, {"x": 0.983, "y": -1.18, "c": "近傍", "n": "From Human Blood [H]  n=621 cos0.98 難-1.18", "s": 0.184, "f": 0}, {"x": 0.978, "y": -0.964, "c": "近傍", "n": "終焔のClaudia [H]  n=803 cos0.98 難-0.96", "s": 0.237, "f": 0}, {"x": 0.977, "y": -0.795, "c": "近傍", "n": "PUNISHER [H]  n=2323 cos0.98 難-0.79", "s": 0.686, "f": 0}, {"x": 0.988, "y": -0.346, "c": "近傍", "n": "O/D*20 [A]  n=3384 cos0.99 難-0.35", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3303536151055637}, {"a": 0, "b": 2, "w": 0.2721692097208084}, {"a": 0, "b": 3, "w": 0.021837622111118726}, {"a": 0, "b": 4, "w": 0.1304693750346554}, {"a": 0, "b": 5, "w": 0.12319769337141873}, {"a": 0, "b": 6, "w": 0.1402042273081705}, {"a": 0, "b": 7, "w": 0.15968330870464198}, {"a": 0, "b": 8, "w": 0.17006083404359218}, {"a": 0, "b": 9, "w": 0.20825287776882395}, {"a": 0, "b": 10, "w": 0.13897633153416378}, {"a": 0, "b": 11, "w": 0.03516071844630886}, {"a": 0, "b": 12, "w": 0.040406886797921815}, {"a": 0, "b": 13, "w": 3.6434300021426225e-11}, {"a": 0, "b": 14, "w": 0.15953983535918248}, {"a": 0, "b": 15, "w": 0.0829910681028655}, {"a": 0, "b": 16, "w": 0.07155710943486682}, {"a": 0, "b": 17, "w": 0.06871075972433593}, {"a": 0, "b": 18, "w": 0.0551632079599248}, {"a": 0, "b": 19, "w": 0.0003461713118461107}, {"a": 0, "b": 20, "w": 0.24895439975652633}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-1.247,hiY=-0.279;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
