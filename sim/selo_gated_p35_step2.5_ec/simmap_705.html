<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">童話回廊 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.298, "c": "種", "n": "童話回廊 [H]  n=1035 cos1.00 難-1.30", "s": 0.453, "f": 0}, {"x": 0.993, "y": -1.253, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.99 難-1.25", "s": 0.674, "f": 0}, {"x": 0.99, "y": -1.251, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.99 難-1.25", "s": 0.689, "f": 0}, {"x": 0.989, "y": -1.277, "c": "近傍", "n": "夢縁 [H]  n=1042 cos0.99 難-1.28", "s": 0.456, "f": 0}, {"x": 0.988, "y": -1.337, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.34", "s": 0.813, "f": 0}, {"x": 0.989, "y": -1.356, "c": "近傍", "n": "Push on Beats!～音ゲの国のeX-ストリーマー～ [H]  n=783 cos0.99 難-1.36", "s": 0.343, "f": 0}, {"x": 0.994, "y": -1.451, "c": "近傍", "n": "Necroxis Girl [H]  n=936 cos0.99 難-1.45", "s": 0.41, "f": 0}, {"x": 0.985, "y": -1.342, "c": "近傍", "n": "Arca [H]  n=1546 cos0.99 難-1.34", "s": 0.677, "f": 0}, {"x": 0.987, "y": -1.184, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [H]  n=1582 cos0.99 難-1.18", "s": 0.693, "f": 0}, {"x": 0.983, "y": -1.244, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos0.98 難-1.24", "s": 0.721, "f": 0}, {"x": 0.984, "y": -1.38, "c": "近傍", "n": "Inner Spirit [H]  n=1473 cos0.98 難-1.38", "s": 0.645, "f": 0}, {"x": 0.983, "y": -1.267, "c": "近傍", "n": "Sirius [H]  n=512 cos0.98 難-1.27", "s": 0.224, "f": 0}, {"x": 0.983, "y": -1.368, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.98 難-1.37", "s": 0.652, "f": 0}, {"x": 0.984, "y": -1.396, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.98 難-1.40", "s": 0.662, "f": 0}, {"x": 0.983, "y": -1.239, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos0.98 難-1.24", "s": 0.631, "f": 0}, {"x": 0.983, "y": -1.226, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.98 難-1.23", "s": 0.717, "f": 0}, {"x": 0.982, "y": -1.324, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.98 難-1.32", "s": 0.444, "f": 0}, {"x": 0.982, "y": -1.279, "c": "近傍", "n": "量子の海のリントヴルム [H]  n=2284 cos0.98 難-1.28", "s": 1.0, "f": 0}, {"x": 0.981, "y": -1.317, "c": "近傍", "n": "朝焼けから始まるボクらの小さな旅 [H]  n=1459 cos0.98 難-1.32", "s": 0.639, "f": 0}, {"x": 0.985, "y": -1.172, "c": "近傍", "n": "Realize Maze [H]  n=1574 cos0.98 難-1.17", "s": 0.689, "f": 0}, {"x": 0.981, "y": -1.318, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.98 難-1.32", "s": 0.705, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4088301543077203}, {"a": 0, "b": 2, "w": 0.28357100665588686}, {"a": 0, "b": 3, "w": 0.18917871035262224}, {"a": 0, "b": 4, "w": 0.2825275868538921}, {"a": 0, "b": 5, "w": 5.1957105284827776e-11}, {"a": 0, "b": 6, "w": 0.31374950448017147}, {"a": 0, "b": 7, "w": 0.19558865817927606}, {"a": 0, "b": 8, "w": 0.24920892550767593}, {"a": 0, "b": 9, "w": 0.1401095583503883}, {"a": 0, "b": 10, "w": 0.07720634411728866}, {"a": 0, "b": 11, "w": 0.0816201083484478}, {"a": 0, "b": 12, "w": 0.12197916335464487}, {"a": 0, "b": 13, "w": 0.16348836833398295}, {"a": 0, "b": 14, "w": 0.12322803109445002}, {"a": 0, "b": 15, "w": 0.07974411058834685}, {"a": 0, "b": 16, "w": 0.041210784797571676}, {"a": 0, "b": 17, "w": 0.09836674922361066}, {"a": 0, "b": 18, "w": 0.09294090624186024}, {"a": 0, "b": 19, "w": 0.17364080728077647}, {"a": 0, "b": 20, "w": 0.08585577961377766}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=-1.473,hiY=-1.150;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
