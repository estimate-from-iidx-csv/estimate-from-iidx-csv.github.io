<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DRUNK MONKY [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.712, "c": "種", "n": "DRUNK MONKY [H]  n=1662 cos1.00 難-0.71", "s": 0.628, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "Sphere [H]  n=1980 cos0.99 難-0.81", "s": 0.748, "f": 0}, {"x": 0.992, "y": -0.656, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.66", "s": 0.784, "f": 0}, {"x": 0.992, "y": -0.679, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.68", "s": 0.57, "f": 0}, {"x": 0.991, "y": -0.714, "c": "近傍", "n": "Make A Difference [H]  n=1366 cos0.99 難-0.71", "s": 0.516, "f": 0}, {"x": 0.994, "y": -0.508, "c": "近傍", "n": "IMPLANTATION [H]  n=2233 cos0.99 難-0.51", "s": 0.844, "f": 0}, {"x": 0.991, "y": -0.683, "c": "近傍", "n": "GENE [H]  n=2179 cos0.99 難-0.68", "s": 0.823, "f": 0}, {"x": 0.99, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.68", "s": 0.534, "f": 0}, {"x": 0.99, "y": -0.647, "c": "近傍", "n": "Broken Sword [H]  n=2592 cos0.99 難-0.65", "s": 0.979, "f": 0}, {"x": 0.989, "y": -0.634, "c": "近傍", "n": "switch [H]  n=1803 cos0.99 難-0.63", "s": 0.681, "f": 0}, {"x": 0.989, "y": -0.683, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.68", "s": 0.966, "f": 0}, {"x": 0.988, "y": -0.752, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.75", "s": 0.686, "f": 0}, {"x": 0.989, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.99 難-0.56", "s": 0.999, "f": 0}, {"x": 0.989, "y": -0.584, "c": "近傍", "n": "NEMESIS [H]  n=1853 cos0.99 難-0.58", "s": 0.7, "f": 0}, {"x": 0.987, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos0.99 難-0.74", "s": 0.733, "f": 0}, {"x": 0.989, "y": -0.878, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.99 難-0.88", "s": 0.839, "f": 0}, {"x": 0.987, "y": -0.723, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos0.99 難-0.72", "s": 0.64, "f": 0}, {"x": 0.989, "y": -0.509, "c": "近傍", "n": "WAKE UP NOW [A]  n=2296 cos0.99 難-0.51", "s": 0.867, "f": 0}, {"x": 0.987, "y": -0.648, "c": "近傍", "n": "rainbow flyer [H]  n=1908 cos0.99 難-0.65", "s": 0.721, "f": 0}, {"x": 0.987, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.81, "f": 0}, {"x": 0.99, "y": -0.437, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.44", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1971179040612665}, {"a": 0, "b": 2, "w": 0.23778356617804275}, {"a": 0, "b": 3, "w": 0.21496890165571747}, {"a": 0, "b": 4, "w": 0.18414740581991007}, {"a": 0, "b": 5, "w": 0.34349623166055643}, {"a": 0, "b": 6, "w": 0.014243414028111134}, {"a": 0, "b": 7, "w": 0.15764520621372258}, {"a": 0, "b": 8, "w": 0.08117038281201394}, {"a": 0, "b": 9, "w": 0.12498690084912256}, {"a": 0, "b": 10, "w": 0.10425917997319234}, {"a": 0, "b": 11, "w": 0.09284649437522596}, {"a": 0, "b": 12, "w": 0.10093524151604516}, {"a": 0, "b": 13, "w": 0.10255411104044865}, {"a": 0, "b": 14, "w": 6.243217054446859e-11}, {"a": 0, "b": 15, "w": 0.0459223333700679}, {"a": 0, "b": 16, "w": 0.004765907251977786}, {"a": 0, "b": 17, "w": 0.1185885262006715}, {"a": 0, "b": 18, "w": 0.044860883888750425}, {"a": 0, "b": 19, "w": 0.03423851153921498}, {"a": 0, "b": 20, "w": 0.16028070968375396}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.913,hiY=-0.402;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
