<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">駅猫のワルツ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.161, "c": "種", "n": "駅猫のワルツ [A]  n=2793 cos1.00 難2.16", "s": 0.922, "f": 0}, {"x": 0.984, "y": 1.914, "c": "近傍", "n": "Thor's Hammer [A]  n=2895 cos0.98 難1.91", "s": 0.956, "f": 0}, {"x": 0.979, "y": 2.472, "c": "近傍", "n": "DIAVOLO [A]  n=3028 cos0.98 難2.47", "s": 1.0, "f": 0}, {"x": 0.964, "y": 2.049, "c": "近傍", "n": "ιgniЯRuina [A]  n=840 cos0.96 難2.05", "s": 0.277, "f": 0}, {"x": 0.953, "y": 2.07, "c": "近傍", "n": "色を喪った街 [A]  n=619 cos0.95 難2.07", "s": 0.204, "f": 0}, {"x": 0.953, "y": 2.098, "c": "近傍", "n": "ChaserXX [L]  n=700 cos0.95 難2.10", "s": 0.231, "f": 0}, {"x": 0.951, "y": 2.068, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2217 cos0.95 難2.07", "s": 0.732, "f": 0}, {"x": 0.953, "y": 1.959, "c": "近傍", "n": "Cross Fire [A]  n=948 cos0.95 難1.96", "s": 0.313, "f": 0}, {"x": 0.949, "y": 2.028, "c": "近傍", "n": "君のハートにロックオン [L]  n=1867 cos0.95 難2.03", "s": 0.617, "f": 0}, {"x": 0.949, "y": 2.041, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1606 cos0.95 難2.04", "s": 0.53, "f": 0}, {"x": 0.955, "y": 1.864, "c": "近傍", "n": "二人ノ廃城幽踊宴 [A]  n=1946 cos0.96 難1.86", "s": 0.643, "f": 0}, {"x": 0.953, "y": 1.869, "c": "近傍", "n": "シムルグの目醒め [A]  n=2840 cos0.95 難1.87", "s": 0.938, "f": 0}, {"x": 0.946, "y": 2.117, "c": "近傍", "n": "PERFECT GREAT!! [A]  n=553 cos0.95 難2.12", "s": 0.183, "f": 0}, {"x": 0.946, "y": 2.087, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [A]  n=809 cos0.95 難2.09", "s": 0.267, "f": 0}, {"x": 0.948, "y": 1.96, "c": "近傍", "n": "invoker [L]  n=2635 cos0.95 難1.96", "s": 0.87, "f": 0}, {"x": 0.954, "y": 1.845, "c": "近傍", "n": "The Clown of 24stairs [A]  n=1704 cos0.95 難1.85", "s": 0.563, "f": 0}, {"x": 0.954, "y": 1.794, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.95 難1.79", "s": 0.898, "f": 0}, {"x": 0.946, "y": 1.862, "c": "近傍", "n": "華麗なる大犬円舞曲 [A]  n=2636 cos0.95 難1.86", "s": 0.871, "f": 0}, {"x": 0.957, "y": 1.701, "c": "近傍", "n": "God Mind [A]  n=1021 cos0.96 難1.70", "s": 0.337, "f": 0}, {"x": 0.94, "y": 2.014, "c": "近傍", "n": "Blue Spring Express [A]  n=2855 cos0.94 難2.01", "s": 0.943, "f": 0}, {"x": 0.938, "y": 2.094, "c": "近傍", "n": "Marie Antoinette [L]  n=1729 cos0.94 難2.09", "s": 0.571, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3711107868647626}, {"a": 0, "b": 2, "w": 0.3738833359894199}, {"a": 0, "b": 3, "w": 0.294259238920339}, {"a": 0, "b": 4, "w": 0.06202123935750248}, {"a": 0, "b": 5, "w": 0.17179204007075377}, {"a": 0, "b": 6, "w": 0.20307648322124594}, {"a": 0, "b": 7, "w": 0.2666917679129466}, {"a": 0, "b": 8, "w": 0.2686177160231539}, {"a": 0, "b": 9, "w": 0.20304070174689914}, {"a": 0, "b": 10, "w": 0.2896684413321159}, {"a": 0, "b": 11, "w": 0.24943507735680304}, {"a": 0, "b": 12, "w": 0.17355505431167373}, {"a": 0, "b": 13, "w": 0.14389440987324642}, {"a": 0, "b": 14, "w": 0.1943936452195043}, {"a": 0, "b": 15, "w": 0.1143547695195718}, {"a": 0, "b": 16, "w": 0.28626404548328976}, {"a": 0, "b": 17, "w": 0.14814112762142218}, {"a": 0, "b": 18, "w": 1.5934698005537484e-11}, {"a": 0, "b": 19, "w": 0.16582393606453116}, {"a": 0, "b": 20, "w": 0.19565859561651588}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.933,hiX=1.005,loY=1.639,hiY=2.534;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
