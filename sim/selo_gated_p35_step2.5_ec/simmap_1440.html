<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">New Castle Legions [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.572, "c": "種", "n": "New Castle Legions [H]  n=1402 cos1.00 難-0.57", "s": 0.435, "f": 0}, {"x": 0.991, "y": -0.512, "c": "近傍", "n": "Journey [A]  n=2721 cos0.99 難-0.51", "s": 0.845, "f": 0}, {"x": 0.991, "y": -0.683, "c": "近傍", "n": "EDEN [H]  n=3027 cos0.99 難-0.68", "s": 0.94, "f": 0}, {"x": 0.99, "y": -0.645, "c": "近傍", "n": "abstract [H]  n=1826 cos0.99 難-0.64", "s": 0.567, "f": 0}, {"x": 0.99, "y": -0.631, "c": "近傍", "n": "Programmed Sun [H]  n=2098 cos0.99 難-0.63", "s": 0.651, "f": 0}, {"x": 0.99, "y": -0.5, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2537 cos0.99 難-0.50", "s": 0.788, "f": 0}, {"x": 0.989, "y": -0.469, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.47", "s": 0.705, "f": 0}, {"x": 0.99, "y": -0.411, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.99 難-0.41", "s": 0.348, "f": 0}, {"x": 0.988, "y": -0.584, "c": "近傍", "n": "唱 [A]  n=1534 cos0.99 難-0.58", "s": 0.476, "f": 0}, {"x": 0.988, "y": -0.534, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.99 難-0.53", "s": 0.786, "f": 0}, {"x": 0.99, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.99 難-0.37", "s": 0.292, "f": 0}, {"x": 0.988, "y": -0.439, "c": "近傍", "n": "真夜中のバベル [A]  n=1944 cos0.99 難-0.44", "s": 0.604, "f": 0}, {"x": 0.992, "y": -0.825, "c": "近傍", "n": "Antigravity [H]  n=2035 cos0.99 難-0.82", "s": 0.632, "f": 0}, {"x": 0.988, "y": -0.704, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.504, "f": 0}, {"x": 0.99, "y": -0.35, "c": "近傍", "n": "ビビデバ [A]  n=1667 cos0.99 難-0.35", "s": 0.518, "f": 0}, {"x": 0.987, "y": -0.56, "c": "近傍", "n": "Thunderbolt [H]  n=2738 cos0.99 難-0.56", "s": 0.85, "f": 0}, {"x": 0.989, "y": -0.389, "c": "近傍", "n": "Liquid Crystal Girl feat. echo [A]  n=2466 cos0.99 難-0.39", "s": 0.766, "f": 0}, {"x": 0.988, "y": -0.752, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1602 cos0.99 難-0.75", "s": 0.497, "f": 0}, {"x": 0.987, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.72", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.524, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos0.99 難-0.52", "s": 0.709, "f": 0}, {"x": 0.986, "y": -0.532, "c": "近傍", "n": "Spica [H]  n=1923 cos0.99 難-0.53", "s": 0.597, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.05034789296780107}, {"a": 0, "b": 2, "w": 0.07945482653650116}, {"a": 0, "b": 3, "w": 0.11329451804444435}, {"a": 0, "b": 4, "w": 0.25213375235522895}, {"a": 0, "b": 5, "w": 0.12090827029563622}, {"a": 0, "b": 6, "w": 0.0196222862483032}, {"a": 0, "b": 7, "w": 0.26874474729530007}, {"a": 0, "b": 8, "w": 0.18799991000112615}, {"a": 0, "b": 9, "w": 0.10024222779840164}, {"a": 0, "b": 10, "w": 0.260562756897485}, {"a": 0, "b": 11, "w": 0.2045462510869055}, {"a": 0, "b": 12, "w": 0.3334626382722181}, {"a": 0, "b": 13, "w": 0.021729529964254923}, {"a": 0, "b": 14, "w": 0.18873019937516644}, {"a": 0, "b": 15, "w": 0.038687266481924776}, {"a": 0, "b": 16, "w": 0.1031670803103234}, {"a": 0, "b": 17, "w": 0.1997561418309931}, {"a": 0, "b": 18, "w": 5.3830051527370415e-11}, {"a": 0, "b": 19, "w": 0.10595449923738476}, {"a": 0, "b": 20, "w": 0.037672543398307945}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.863,hiY=-0.312;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
