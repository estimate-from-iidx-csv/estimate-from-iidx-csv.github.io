<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SHOOTING STAR [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.174, "c": "種", "n": "SHOOTING STAR [A]  n=2343 cos1.00 難-0.17", "s": 0.664, "f": 0}, {"x": 0.998, "y": -0.209, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos1.00 難-0.21", "s": 0.793, "f": 0}, {"x": 0.997, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3210 cos1.00 難-0.18", "s": 0.91, "f": 0}, {"x": 0.997, "y": -0.196, "c": "近傍", "n": "Last Burning [A]  n=3170 cos1.00 難-0.20", "s": 0.898, "f": 0}, {"x": 0.998, "y": -0.258, "c": "近傍", "n": "Summerblue [A]  n=2192 cos1.00 難-0.26", "s": 0.621, "f": 0}, {"x": 0.997, "y": -0.113, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3177 cos1.00 難-0.11", "s": 0.9, "f": 0}, {"x": 0.997, "y": -0.188, "c": "近傍", "n": "深愛のリグレット [A]  n=2677 cos1.00 難-0.19", "s": 0.759, "f": 0}, {"x": 0.996, "y": -0.196, "c": "近傍", "n": "LESSON 5 [A]  n=2304 cos1.00 難-0.20", "s": 0.653, "f": 0}, {"x": 0.997, "y": -0.09, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2956 cos1.00 難-0.09", "s": 0.838, "f": 0}, {"x": 0.997, "y": -0.251, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.25", "s": 0.673, "f": 0}, {"x": 0.997, "y": -0.283, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3309 cos1.00 難-0.28", "s": 0.938, "f": 0}, {"x": 0.996, "y": -0.195, "c": "近傍", "n": "Power of Love [A]  n=2905 cos1.00 難-0.20", "s": 0.823, "f": 0}, {"x": 0.996, "y": -0.082, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos1.00 難-0.08", "s": 0.916, "f": 0}, {"x": 0.997, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos1.00 難-0.32", "s": 0.957, "f": 0}, {"x": 0.996, "y": -0.194, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos1.00 難-0.19", "s": 0.371, "f": 0}, {"x": 0.996, "y": -0.23, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos1.00 難-0.23", "s": 0.91, "f": 0}, {"x": 0.996, "y": -0.137, "c": "近傍", "n": "Hold My Hand [A]  n=2574 cos1.00 難-0.14", "s": 0.729, "f": 0}, {"x": 0.996, "y": -0.233, "c": "近傍", "n": "Follow Tomorrow [A]  n=3529 cos1.00 難-0.23", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.182, "c": "近傍", "n": "消極的セツナイズム [A]  n=1234 cos0.99 難-0.18", "s": 0.35, "f": 0}, {"x": 0.995, "y": -0.038, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2950 cos1.00 難-0.04", "s": 0.836, "f": 0}, {"x": 0.994, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos0.99 難-0.11", "s": 0.881, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5661672141001928}, {"a": 0, "b": 2, "w": 0.4203954542843107}, {"a": 0, "b": 3, "w": 0.43342770505150996}, {"a": 0, "b": 4, "w": 0.4486964953514936}, {"a": 0, "b": 5, "w": 0.13609769316598963}, {"a": 0, "b": 6, "w": 0.27297825143317545}, {"a": 0, "b": 7, "w": 7.531097967472533e-11}, {"a": 0, "b": 8, "w": 0.30897188386053365}, {"a": 0, "b": 9, "w": 0.35890408732838175}, {"a": 0, "b": 10, "w": 0.4293426423634581}, {"a": 0, "b": 11, "w": 0.15872121584216858}, {"a": 0, "b": 12, "w": 0.3186504618610546}, {"a": 0, "b": 13, "w": 0.4347606608958975}, {"a": 0, "b": 14, "w": 0.12044147954693729}, {"a": 0, "b": 15, "w": 0.17964198969389666}, {"a": 0, "b": 16, "w": 0.02230769887180417}, {"a": 0, "b": 17, "w": 0.1619564785646863}, {"a": 0, "b": 18, "w": 0.1806798804244495}, {"a": 0, "b": 19, "w": 0.05315534690186696}, {"a": 0, "b": 20, "w": 0.07534653710477313}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.344,hiY=-0.015;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
