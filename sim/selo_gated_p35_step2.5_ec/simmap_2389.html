<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PARANOiA ～HADES～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.506, "c": "種", "n": "PARANOiA ～HADES～ [H]  n=3128 cos1.00 難0.51", "s": 0.906, "f": 0}, {"x": 0.994, "y": 0.375, "c": "近傍", "n": "GRADIUS -FULL SPEED- [A]  n=2775 cos0.99 難0.37", "s": 0.804, "f": 0}, {"x": 0.989, "y": 0.468, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.47", "s": 0.939, "f": 0}, {"x": 0.989, "y": 0.399, "c": "近傍", "n": "Secret of Love [A]  n=3058 cos0.99 難0.40", "s": 0.886, "f": 0}, {"x": 0.988, "y": 0.444, "c": "近傍", "n": "PARANOIA survivor MAX [A]  n=1116 cos0.99 難0.44", "s": 0.323, "f": 0}, {"x": 0.987, "y": 0.493, "c": "近傍", "n": "fun [A]  n=1291 cos0.99 難0.49", "s": 0.374, "f": 0}, {"x": 0.986, "y": 0.512, "c": "近傍", "n": "Monkey Business [A]  n=1419 cos0.99 難0.51", "s": 0.411, "f": 0}, {"x": 0.985, "y": 0.349, "c": "近傍", "n": "RESONATE 1794 [A]  n=3171 cos0.99 難0.35", "s": 0.919, "f": 0}, {"x": 0.989, "y": 0.119, "c": "近傍", "n": "mind the gap [A]  n=1074 cos0.99 難0.12", "s": 0.311, "f": 0}, {"x": 0.993, "y": 0.024, "c": "近傍", "n": "She is my wife [A]  n=3098 cos0.99 難0.02", "s": 0.897, "f": 0}, {"x": 0.989, "y": 0.121, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.12", "s": 0.99, "f": 0}, {"x": 0.983, "y": 0.531, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.98 難0.53", "s": 1.0, "f": 0}, {"x": 0.983, "y": 0.276, "c": "近傍", "n": "合体せよ！ストロングイェーガー！！ (Ryu☆ remix) [A]  n=3327 cos0.98 難0.28", "s": 0.964, "f": 0}, {"x": 0.986, "y": 0.122, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos0.99 難0.12", "s": 0.709, "f": 0}, {"x": 0.987, "y": 0.059, "c": "近傍", "n": "HYPER EUROBEAT (2DX style) [A]  n=2545 cos0.99 難0.06", "s": 0.737, "f": 0}, {"x": 0.981, "y": 0.459, "c": "近傍", "n": "NEMESIS [A]  n=3214 cos0.98 難0.46", "s": 0.931, "f": 0}, {"x": 0.982, "y": 0.297, "c": "近傍", "n": "Blame [A]  n=3294 cos0.98 難0.30", "s": 0.954, "f": 0}, {"x": 0.99, "y": -0.016, "c": "近傍", "n": "Silly Love [A]  n=2738 cos0.99 難-0.02", "s": 0.793, "f": 0}, {"x": 0.985, "y": 0.094, "c": "近傍", "n": "Narcissus At Oasis [A]  n=2841 cos0.99 難0.09", "s": 0.823, "f": 0}, {"x": 0.981, "y": 0.672, "c": "近傍", "n": "FUTURE is Dead [A]  n=3214 cos0.98 難0.67", "s": 0.931, "f": 0}, {"x": 0.982, "y": 0.295, "c": "近傍", "n": "GUILTY [A]  n=1451 cos0.98 難0.29", "s": 0.42, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5973858447493796}, {"a": 0, "b": 2, "w": 0.4447475497370932}, {"a": 0, "b": 3, "w": 0.47130094795099364}, {"a": 0, "b": 4, "w": 0.2881624665696402}, {"a": 0, "b": 5, "w": 0.36367150126823455}, {"a": 0, "b": 6, "w": 0.04172710545657721}, {"a": 0, "b": 7, "w": 0.4071392140372667}, {"a": 0, "b": 8, "w": 0.5000301647000875}, {"a": 0, "b": 9, "w": 0.5375660950616309}, {"a": 0, "b": 10, "w": 0.4787704508810524}, {"a": 0, "b": 11, "w": 3.345734800319633e-11}, {"a": 0, "b": 12, "w": 0.3149886864275332}, {"a": 0, "b": 13, "w": 0.42139845485843996}, {"a": 0, "b": 14, "w": 0.44781412587507763}, {"a": 0, "b": 15, "w": 0.3157336462234127}, {"a": 0, "b": 16, "w": 0.34403893980448275}, {"a": 0, "b": 17, "w": 0.4974703176389429}, {"a": 0, "b": 18, "w": 0.4120745082094531}, {"a": 0, "b": 19, "w": 0.2636505171080401}, {"a": 0, "b": 20, "w": 0.3418505153330196}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=-0.071,hiY=0.727;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
