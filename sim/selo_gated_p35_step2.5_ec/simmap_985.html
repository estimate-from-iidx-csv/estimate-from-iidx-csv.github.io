<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Punch Love 仮面 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.026, "c": "種", "n": "Punch Love 仮面 [A]  n=2991 cos1.00 難-0.03", "s": 0.801, "f": 0}, {"x": 0.995, "y": -0.019, "c": "近傍", "n": "Romanticが止まらない [A]  n=2942 cos1.00 難-0.02", "s": 0.788, "f": 0}, {"x": 0.994, "y": -0.038, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2950 cos0.99 難-0.04", "s": 0.79, "f": 0}, {"x": 0.994, "y": -0.166, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.99 難-0.17", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.127, "c": "近傍", "n": "Quickening [A]  n=2769 cos0.99 難0.13", "s": 0.742, "f": 0}, {"x": 0.992, "y": 0.063, "c": "近傍", "n": "NΦ CRIME [L]  n=1725 cos0.99 難0.06", "s": 0.462, "f": 0}, {"x": 0.992, "y": 0.111, "c": "近傍", "n": "GOLD RUSH [A]  n=3698 cos0.99 難0.11", "s": 0.991, "f": 0}, {"x": 0.993, "y": -0.196, "c": "近傍", "n": "LESSON 5 [A]  n=2304 cos0.99 難-0.20", "s": 0.617, "f": 0}, {"x": 0.991, "y": 0.02, "c": "近傍", "n": "refractive index [A]  n=3629 cos0.99 難0.02", "s": 0.972, "f": 0}, {"x": 0.991, "y": -0.124, "c": "近傍", "n": "共犯ヘヴンズコード [A]  n=2781 cos0.99 難-0.12", "s": 0.745, "f": 0}, {"x": 0.992, "y": 0.157, "c": "近傍", "n": "響花水月 [A]  n=2146 cos0.99 難0.16", "s": 0.575, "f": 0}, {"x": 0.991, "y": -0.158, "c": "近傍", "n": "CUE CUE RESCUE [A]  n=2427 cos0.99 難-0.16", "s": 0.65, "f": 0}, {"x": 0.991, "y": 0.129, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos0.99 難0.13", "s": 0.952, "f": 0}, {"x": 0.99, "y": -0.025, "c": "近傍", "n": "ANDROMEDA II [A]  n=3026 cos0.99 難-0.02", "s": 0.811, "f": 0}, {"x": 0.99, "y": 0.121, "c": "近傍", "n": "DEEP ROAR [A]  n=1658 cos0.99 難0.12", "s": 0.444, "f": 0}, {"x": 0.996, "y": 0.309, "c": "近傍", "n": "bloomin' feeling [A]  n=3657 cos1.00 難0.31", "s": 0.98, "f": 0}, {"x": 0.988, "y": -0.065, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos0.99 難-0.06", "s": 0.258, "f": 0}, {"x": 0.988, "y": -0.11, "c": "近傍", "n": "Nemophila [A]  n=684 cos0.99 難-0.11", "s": 0.183, "f": 0}, {"x": 0.988, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos0.99 難-0.11", "s": 0.833, "f": 0}, {"x": 0.989, "y": 0.143, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos0.99 難0.14", "s": 0.944, "f": 0}, {"x": 0.988, "y": 0.018, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos0.99 難0.02", "s": 0.971, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.37284705183182665}, {"a": 0, "b": 2, "w": 0.23340777080331832}, {"a": 0, "b": 3, "w": 0.25624853668859504}, {"a": 0, "b": 4, "w": 0.23434137481506334}, {"a": 0, "b": 5, "w": 0.2583440763652649}, {"a": 0, "b": 6, "w": 0.23598697733401885}, {"a": 0, "b": 7, "w": 0.24315014321269435}, {"a": 0, "b": 8, "w": 0.21698248072807935}, {"a": 0, "b": 9, "w": 0.18577957132160638}, {"a": 0, "b": 10, "w": 0.10892751209477747}, {"a": 0, "b": 11, "w": 0.22932066230886272}, {"a": 0, "b": 12, "w": 0.22638292482651123}, {"a": 0, "b": 13, "w": 0.04338971986523121}, {"a": 0, "b": 14, "w": 0.1698669113410609}, {"a": 0, "b": 15, "w": 0.09339448411112972}, {"a": 0, "b": 16, "w": 0.12062826425220086}, {"a": 0, "b": 17, "w": 0.11711211850677228}, {"a": 0, "b": 18, "w": 4.9581339034432403e-11}, {"a": 0, "b": 19, "w": 0.16329543105223077}, {"a": 0, "b": 20, "w": 0.09725572183627951}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.236,hiY=0.350;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
