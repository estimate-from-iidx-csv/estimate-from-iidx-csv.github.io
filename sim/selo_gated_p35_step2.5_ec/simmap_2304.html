<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ラビットホール [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.045, "c": "種", "n": "ラビットホール [A]  n=1777 cos1.00 難-0.05", "s": 0.476, "f": 0}, {"x": 0.998, "y": -0.039, "c": "近傍", "n": "ちょえちょえまぎか [A]  n=2194 cos1.00 難-0.04", "s": 0.588, "f": 0}, {"x": 0.997, "y": -0.111, "c": "近傍", "n": "フォニイ [A]  n=2053 cos1.00 難-0.11", "s": 0.55, "f": 0}, {"x": 0.997, "y": 0.113, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos1.00 難0.11", "s": 0.849, "f": 0}, {"x": 0.996, "y": -0.203, "c": "近傍", "n": "XANADU OF TWO [A]  n=3389 cos1.00 難-0.20", "s": 0.908, "f": 0}, {"x": 0.996, "y": -0.193, "c": "近傍", "n": "8bit Princess [A]  n=3429 cos1.00 難-0.19", "s": 0.919, "f": 0}, {"x": 0.994, "y": 0.018, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos0.99 難0.02", "s": 0.972, "f": 0}, {"x": 0.993, "y": -0.036, "c": "近傍", "n": "Calvados Queen [A]  n=2628 cos0.99 難-0.04", "s": 0.704, "f": 0}, {"x": 0.993, "y": -0.02, "c": "近傍", "n": "V2 [H]  n=3347 cos0.99 難-0.02", "s": 0.897, "f": 0}, {"x": 0.993, "y": -0.123, "c": "近傍", "n": "planarian [A]  n=2948 cos0.99 難-0.12", "s": 0.79, "f": 0}, {"x": 0.994, "y": 0.059, "c": "近傍", "n": "Danza Aestas [A]  n=2310 cos0.99 難0.06", "s": 0.619, "f": 0}, {"x": 0.993, "y": -0.032, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos0.99 難-0.03", "s": 0.867, "f": 0}, {"x": 0.995, "y": -0.201, "c": "近傍", "n": "凛として咲く花の如く [A]  n=3732 cos0.99 難-0.20", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.121, "c": "近傍", "n": "DEEP ROAR [A]  n=1658 cos0.99 難0.12", "s": 0.444, "f": 0}, {"x": 0.995, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos0.99 難0.13", "s": 0.991, "f": 0}, {"x": 0.992, "y": -0.032, "c": "近傍", "n": "PopなEDEN [A]  n=1556 cos0.99 難-0.03", "s": 0.417, "f": 0}, {"x": 0.994, "y": 0.111, "c": "近傍", "n": "アイドル [L]  n=1439 cos0.99 難0.11", "s": 0.386, "f": 0}, {"x": 0.994, "y": 0.112, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos0.99 難0.11", "s": 0.934, "f": 0}, {"x": 0.993, "y": -0.168, "c": "近傍", "n": "可愛くてごめん [L]  n=1106 cos0.99 難-0.17", "s": 0.296, "f": 0}, {"x": 0.992, "y": -0.065, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos0.99 難-0.06", "s": 0.258, "f": 0}, {"x": 0.992, "y": -0.055, "c": "近傍", "n": "Hat Surprise [A]  n=2365 cos0.99 難-0.05", "s": 0.634, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5522190740484426}, {"a": 0, "b": 2, "w": 0.5021256682319657}, {"a": 0, "b": 3, "w": 0.5119727098051564}, {"a": 0, "b": 4, "w": 0.35829164692412574}, {"a": 0, "b": 5, "w": 0.19656382987369914}, {"a": 0, "b": 6, "w": 0.2973241693547962}, {"a": 0, "b": 7, "w": 0.1565535463786285}, {"a": 0, "b": 8, "w": 0.24379441422401227}, {"a": 0, "b": 9, "w": 0.15469104863316652}, {"a": 0, "b": 10, "w": 0.246414290659419}, {"a": 0, "b": 11, "w": 0.17006468508173544}, {"a": 0, "b": 12, "w": 0.3420957299851817}, {"a": 0, "b": 13, "w": 0.35730550666434224}, {"a": 0, "b": 14, "w": 0.23188014561492087}, {"a": 0, "b": 15, "w": 5.3085091877846935e-11}, {"a": 0, "b": 16, "w": 0.13673878804330908}, {"a": 0, "b": 17, "w": 0.29132665605982677}, {"a": 0, "b": 18, "w": 0.2521084337729348}, {"a": 0, "b": 19, "w": 0.14088883256612927}, {"a": 0, "b": 20, "w": 0.18815735897333274}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.230,hiY=0.155;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
