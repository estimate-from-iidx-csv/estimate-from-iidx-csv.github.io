<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Roar of Chronos [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.994, "c": "種", "n": "Roar of Chronos [H]  n=700 cos1.00 難-0.99", "s": 0.281, "f": 0}, {"x": 0.998, "y": -0.996, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1326 cos1.00 難-1.00", "s": 0.532, "f": 0}, {"x": 0.997, "y": -0.987, "c": "近傍", "n": "Fegrix [H]  n=1718 cos1.00 難-0.99", "s": 0.689, "f": 0}, {"x": 0.997, "y": -0.958, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos1.00 難-0.96", "s": 0.25, "f": 0}, {"x": 0.997, "y": -1.041, "c": "近傍", "n": "#The_Relentless [H]  n=2019 cos1.00 難-1.04", "s": 0.81, "f": 0}, {"x": 0.996, "y": -0.987, "c": "近傍", "n": "Satellite Burst [H]  n=905 cos1.00 難-0.99", "s": 0.363, "f": 0}, {"x": 0.996, "y": -1.028, "c": "近傍", "n": "Out of Control [H]  n=848 cos1.00 難-1.03", "s": 0.34, "f": 0}, {"x": 0.997, "y": -1.051, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos1.00 難-1.05", "s": 0.256, "f": 0}, {"x": 0.995, "y": -0.995, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=575 cos0.99 難-1.00", "s": 0.231, "f": 0}, {"x": 0.998, "y": -1.072, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos1.00 難-1.07", "s": 0.486, "f": 0}, {"x": 0.995, "y": -1.022, "c": "近傍", "n": "ιgniЯRuina [H]  n=658 cos0.99 難-1.02", "s": 0.264, "f": 0}, {"x": 0.993, "y": -0.988, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos0.99 難-0.99", "s": 0.576, "f": 0}, {"x": 0.993, "y": -0.989, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos0.99 難-0.99", "s": 0.462, "f": 0}, {"x": 0.996, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos1.00 難-0.90", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.998, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [H]  n=605 cos0.99 難-1.00", "s": 0.243, "f": 0}, {"x": 0.993, "y": -0.989, "c": "近傍", "n": "Bad Encryption [H]  n=1504 cos0.99 難-0.99", "s": 0.603, "f": 0}, {"x": 0.993, "y": -0.991, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.99 難-0.99", "s": 0.661, "f": 0}, {"x": 0.993, "y": -1.047, "c": "近傍", "n": "Million Dollar [H]  n=723 cos0.99 難-1.05", "s": 0.29, "f": 0}, {"x": 0.995, "y": -0.91, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos0.99 難-0.91", "s": 0.875, "f": 0}, {"x": 0.992, "y": -0.997, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.00", "s": 0.537, "f": 0}, {"x": 0.993, "y": -0.93, "c": "近傍", "n": "Xb10r [H]  n=803 cos0.99 難-0.93", "s": 0.322, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.578366218168977}, {"a": 0, "b": 2, "w": 0.5005217780465341}, {"a": 0, "b": 3, "w": 0.517216173364528}, {"a": 0, "b": 4, "w": 0.4999126162664632}, {"a": 0, "b": 5, "w": 0.4544406187714406}, {"a": 0, "b": 6, "w": 0.1816075610674851}, {"a": 0, "b": 7, "w": 0.43744312863880974}, {"a": 0, "b": 8, "w": 0.3531967075608985}, {"a": 0, "b": 9, "w": 0.5385599317736622}, {"a": 0, "b": 10, "w": 0.36291969462553475}, {"a": 0, "b": 11, "w": 0.25001334831560784}, {"a": 0, "b": 12, "w": 0.18774544249251868}, {"a": 0, "b": 13, "w": 0.47535532757319177}, {"a": 0, "b": 14, "w": 0.26491979402824484}, {"a": 0, "b": 15, "w": 5.994382767937623e-11}, {"a": 0, "b": 16, "w": 0.260921509517977}, {"a": 0, "b": 17, "w": 0.20907961103537442}, {"a": 0, "b": 18, "w": 0.3286115162147567}, {"a": 0, "b": 19, "w": 0.013973300024650692}, {"a": 0, "b": 20, "w": 0.09280153595156726}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-1.085,hiY=-0.888;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
