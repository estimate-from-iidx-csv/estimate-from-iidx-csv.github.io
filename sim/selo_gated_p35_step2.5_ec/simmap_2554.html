<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Colorful Cookie [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.045, "c": "種", "n": "Colorful Cookie [A]  n=3547 cos1.00 難1.05", "s": 1.0, "f": 0}, {"x": 0.997, "y": 1.042, "c": "近傍", "n": "Ypsilon [L]  n=2342 cos1.00 難1.04", "s": 0.66, "f": 0}, {"x": 0.997, "y": 1.072, "c": "近傍", "n": "DUAL STRIKER [A]  n=2410 cos1.00 難1.07", "s": 0.679, "f": 0}, {"x": 0.994, "y": 1.02, "c": "近傍", "n": "Vinculum stellarum [A]  n=2772 cos0.99 難1.02", "s": 0.782, "f": 0}, {"x": 0.993, "y": 1.068, "c": "近傍", "n": "Proof of the existence [A]  n=3391 cos0.99 難1.07", "s": 0.956, "f": 0}, {"x": 0.992, "y": 1.032, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos0.99 難1.03", "s": 0.371, "f": 0}, {"x": 0.995, "y": 1.104, "c": "近傍", "n": "不沈艦CANDY [A]  n=3417 cos1.00 難1.10", "s": 0.963, "f": 0}, {"x": 0.997, "y": 1.115, "c": "近傍", "n": "Viridian [A]  n=2633 cos1.00 難1.12", "s": 0.742, "f": 0}, {"x": 0.992, "y": 1.084, "c": "近傍", "n": "Candy Galy [A]  n=3383 cos0.99 難1.08", "s": 0.954, "f": 0}, {"x": 0.991, "y": 1.016, "c": "近傍", "n": "innocent revolver [A]  n=2544 cos0.99 難1.02", "s": 0.717, "f": 0}, {"x": 0.991, "y": 1.006, "c": "近傍", "n": "EBONY & IVORY [A]  n=3388 cos0.99 難1.01", "s": 0.955, "f": 0}, {"x": 0.993, "y": 1.107, "c": "近傍", "n": "GENE [A]  n=3138 cos0.99 難1.11", "s": 0.885, "f": 0}, {"x": 0.99, "y": 1.034, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2198 cos0.99 難1.03", "s": 0.62, "f": 0}, {"x": 0.989, "y": 1.068, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.99 難1.07", "s": 0.905, "f": 0}, {"x": 0.99, "y": 1.004, "c": "近傍", "n": "From Human Blood [A]  n=984 cos0.99 難1.00", "s": 0.277, "f": 0}, {"x": 0.989, "y": 1.021, "c": "近傍", "n": "MARLIN [A]  n=1133 cos0.99 難1.02", "s": 0.319, "f": 0}, {"x": 0.992, "y": 1.115, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3274 cos0.99 難1.12", "s": 0.923, "f": 0}, {"x": 0.988, "y": 1.027, "c": "近傍", "n": "Last Dance [A]  n=3340 cos0.99 難1.03", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.951, "c": "近傍", "n": "dAuntl3ss [A]  n=3300 cos1.00 難0.95", "s": 0.93, "f": 0}, {"x": 0.991, "y": 1.118, "c": "近傍", "n": "クレッシェンド [A]  n=717 cos0.99 難1.12", "s": 0.202, "f": 0}, {"x": 0.99, "y": 0.988, "c": "近傍", "n": "トリカゴノ鳳凰 [A]  n=3395 cos0.99 難0.99", "s": 0.957, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4875075992645056}, {"a": 0, "b": 2, "w": 0.43009419062337684}, {"a": 0, "b": 3, "w": 0.301719834730133}, {"a": 0, "b": 4, "w": 0.19318042289634163}, {"a": 0, "b": 5, "w": 0.17574394055434717}, {"a": 0, "b": 6, "w": 0.37618324348243193}, {"a": 0, "b": 7, "w": 0.47974344609116104}, {"a": 0, "b": 8, "w": 0.21324446290274446}, {"a": 0, "b": 9, "w": 0.1782722096681839}, {"a": 0, "b": 10, "w": 0.18182551287827886}, {"a": 0, "b": 11, "w": 0.15982392702291792}, {"a": 0, "b": 12, "w": 0.08803632195415734}, {"a": 0, "b": 13, "w": 0.02844276388112399}, {"a": 0, "b": 14, "w": 0.12892986670150675}, {"a": 0, "b": 15, "w": 0.07061412419623347}, {"a": 0, "b": 16, "w": 0.148659845917959}, {"a": 0, "b": 17, "w": 4.130196185059276e-11}, {"a": 0, "b": 18, "w": 0.2302749074039857}, {"a": 0, "b": 19, "w": 0.16004050925424707}, {"a": 0, "b": 20, "w": 0.10333869537858742}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.938,hiY=1.131;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
