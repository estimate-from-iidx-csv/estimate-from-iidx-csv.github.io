<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ゲシュタルト [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.143, "c": "種", "n": "ゲシュタルト [L]  n=888 cos1.00 難0.14", "s": 0.234, "f": 0}, {"x": 0.991, "y": 0.178, "c": "近傍", "n": "凛として咲く花の如く [L]  n=3547 cos0.99 難0.18", "s": 0.934, "f": 0}, {"x": 0.991, "y": 0.005, "c": "近傍", "n": "OOO [L]  n=863 cos0.99 難0.00", "s": 0.227, "f": 0}, {"x": 0.989, "y": 0.224, "c": "近傍", "n": "Time To Empress [L]  n=635 cos0.99 難0.22", "s": 0.167, "f": 0}, {"x": 0.993, "y": 0.354, "c": "近傍", "n": "XANADU OF TWO [L]  n=734 cos0.99 難0.35", "s": 0.193, "f": 0}, {"x": 0.986, "y": 0.131, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos0.99 難0.13", "s": 0.479, "f": 0}, {"x": 0.986, "y": 0.129, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos0.99 難0.13", "s": 0.936, "f": 0}, {"x": 0.991, "y": 0.395, "c": "近傍", "n": "WISE UP! [L]  n=1833 cos0.99 難0.40", "s": 0.483, "f": 0}, {"x": 0.987, "y": -0.019, "c": "近傍", "n": "Romanticが止まらない [A]  n=2942 cos0.99 難-0.02", "s": 0.775, "f": 0}, {"x": 0.992, "y": 0.426, "c": "近傍", "n": "千年ノ理 [A]  n=3797 cos0.99 難0.43", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.393, "c": "近傍", "n": "EDEN [L]  n=1743 cos0.99 難0.39", "s": 0.459, "f": 0}, {"x": 0.987, "y": 0.33, "c": "近傍", "n": "2 tribe 4 K [A]  n=3259 cos0.99 難0.33", "s": 0.858, "f": 0}, {"x": 0.984, "y": 0.152, "c": "近傍", "n": "KEY [A]  n=3461 cos0.98 難0.15", "s": 0.912, "f": 0}, {"x": 0.993, "y": 0.459, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [A]  n=1660 cos0.99 難0.46", "s": 0.437, "f": 0}, {"x": 0.984, "y": 0.289, "c": "近傍", "n": "ANTHEM LANDING [A]  n=3586 cos0.98 難0.29", "s": 0.944, "f": 0}, {"x": 0.992, "y": 0.473, "c": "近傍", "n": "Raspberry Railgun [A]  n=3614 cos0.99 難0.47", "s": 0.952, "f": 0}, {"x": 0.983, "y": 0.217, "c": "近傍", "n": "Cookie Bouquets [A]  n=3623 cos0.98 難0.22", "s": 0.954, "f": 0}, {"x": 0.984, "y": 0.318, "c": "近傍", "n": "SPECIAL SUMMER CAMPAIGN! [A]  n=3787 cos0.98 難0.32", "s": 0.997, "f": 0}, {"x": 0.982, "y": 0.155, "c": "近傍", "n": "Ambush Ace [A]  n=1736 cos0.98 難0.16", "s": 0.457, "f": 0}, {"x": 0.983, "y": 0.295, "c": "近傍", "n": "Primitive Vibes [A]  n=3448 cos0.98 難0.30", "s": 0.908, "f": 0}, {"x": 0.983, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos0.98 難0.27", "s": 0.901, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3722748708945709}, {"a": 0, "b": 2, "w": 0.08941529391455372}, {"a": 0, "b": 3, "w": 0.3261315482159155}, {"a": 0, "b": 4, "w": 0.4797629735923927}, {"a": 0, "b": 5, "w": 0.15976658379804798}, {"a": 0, "b": 6, "w": 0.03320747949419667}, {"a": 0, "b": 7, "w": 0.2498813160353216}, {"a": 0, "b": 8, "w": 0.16896684065059941}, {"a": 0, "b": 9, "w": 0.42016297832873817}, {"a": 0, "b": 10, "w": 0.36484934057773966}, {"a": 0, "b": 11, "w": 0.1128937511359569}, {"a": 0, "b": 12, "w": 3.157329953040744e-11}, {"a": 0, "b": 13, "w": 0.4953121217305473}, {"a": 0, "b": 14, "w": 0.10279000330616483}, {"a": 0, "b": 15, "w": 0.4332856793847337}, {"a": 0, "b": 16, "w": 0.1819584998381828}, {"a": 0, "b": 17, "w": 0.2161598041640852}, {"a": 0, "b": 18, "w": 0.12333371246073033}, {"a": 0, "b": 19, "w": 0.19463242818578186}, {"a": 0, "b": 20, "w": 0.07196359040752665}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-0.059,hiY=0.512;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
