<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Time Distortion pt.2(IIDX Edit) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.98, "c": "種", "n": "Time Distortion pt.2(IIDX Edit) [H]  n=483 cos1.00 難-1.98", "s": 0.454, "f": 0}, {"x": 0.998, "y": -1.981, "c": "近傍", "n": "Mukade [H]  n=508 cos1.00 難-1.98", "s": 0.477, "f": 0}, {"x": 0.997, "y": -1.996, "c": "近傍", "n": "X-ray binary [H]  n=795 cos1.00 難-2.00", "s": 0.746, "f": 0}, {"x": 0.995, "y": -2.012, "c": "近傍", "n": "Tail Lights [H]  n=770 cos1.00 難-2.01", "s": 0.723, "f": 0}, {"x": 0.994, "y": -1.995, "c": "近傍", "n": "SOLID WYVERN [H]  n=700 cos0.99 難-1.99", "s": 0.657, "f": 0}, {"x": 0.998, "y": -1.933, "c": "近傍", "n": "GIGA RAID [H]  n=900 cos1.00 難-1.93", "s": 0.845, "f": 0}, {"x": 0.993, "y": -1.978, "c": "近傍", "n": "《GRANDMASTER》 [H]  n=690 cos0.99 難-1.98", "s": 0.648, "f": 0}, {"x": 0.992, "y": -1.977, "c": "近傍", "n": "Neo Heritage [H]  n=804 cos0.99 難-1.98", "s": 0.755, "f": 0}, {"x": 0.992, "y": -1.98, "c": "近傍", "n": "Lovely Howdy Cowboy!! [H]  n=780 cos0.99 難-1.98", "s": 0.732, "f": 0}, {"x": 0.995, "y": -1.912, "c": "近傍", "n": "無意識のフィロソフィア [H]  n=757 cos1.00 難-1.91", "s": 0.711, "f": 0}, {"x": 0.994, "y": -1.918, "c": "近傍", "n": "Nocturnal 2097 [H]  n=720 cos0.99 難-1.92", "s": 0.676, "f": 0}, {"x": 0.992, "y": -1.937, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [H]  n=984 cos0.99 難-1.94", "s": 0.924, "f": 0}, {"x": 0.99, "y": -1.975, "c": "近傍", "n": "狂水一華 [H]  n=1018 cos0.99 難-1.98", "s": 0.956, "f": 0}, {"x": 0.992, "y": -1.923, "c": "近傍", "n": "乱膳の舞姫 [H]  n=771 cos0.99 難-1.92", "s": 0.724, "f": 0}, {"x": 0.992, "y": -1.919, "c": "近傍", "n": "Ypsilon [H]  n=1065 cos0.99 難-1.92", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.953, "c": "近傍", "n": "MA・TSU・RI [H]  n=527 cos0.99 難-1.95", "s": 0.495, "f": 0}, {"x": 0.996, "y": -1.879, "c": "近傍", "n": "Divine Heaven [H]  n=662 cos1.00 難-1.88", "s": 0.622, "f": 0}, {"x": 0.992, "y": -1.889, "c": "近傍", "n": "Rosa azuL [H]  n=628 cos0.99 難-1.89", "s": 0.59, "f": 0}, {"x": 0.989, "y": -2.061, "c": "近傍", "n": "THE TIME MACHINE [H]  n=708 cos0.99 難-2.06", "s": 0.665, "f": 0}, {"x": 0.986, "y": -2.026, "c": "近傍", "n": "Ergosphere [H]  n=542 cos0.99 難-2.03", "s": 0.509, "f": 0}, {"x": 0.985, "y": -1.946, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.99 難-1.95", "s": 0.565, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6266976736143997}, {"a": 0, "b": 2, "w": 0.5844719155990836}, {"a": 0, "b": 3, "w": 0.48386248286908895}, {"a": 0, "b": 4, "w": 0.3439689029290415}, {"a": 0, "b": 5, "w": 0.6638605231989196}, {"a": 0, "b": 6, "w": 0.3666800500981745}, {"a": 0, "b": 7, "w": 0.3651679559827282}, {"a": 0, "b": 8, "w": 0.09850319792000128}, {"a": 0, "b": 9, "w": 0.4975089938024334}, {"a": 0, "b": 10, "w": 0.3651928242449397}, {"a": 0, "b": 11, "w": 0.33562629958746526}, {"a": 0, "b": 12, "w": 0.2788025926729458}, {"a": 0, "b": 13, "w": 0.30499123788222593}, {"a": 0, "b": 14, "w": 0.38085584046549525}, {"a": 0, "b": 15, "w": 0.25968740135388835}, {"a": 0, "b": 16, "w": 0.4362803576359825}, {"a": 0, "b": 17, "w": 0.3375793046937623}, {"a": 0, "b": 18, "w": 0.23321326235538598}, {"a": 0, "b": 19, "w": 5.4972137952802314e-11}, {"a": 0, "b": 20, "w": 0.13114142850739197}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-2.075,hiY=-1.864;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
