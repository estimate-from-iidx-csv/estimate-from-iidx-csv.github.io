<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Chaotoxin [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.929, "c": "種", "n": "Chaotoxin [A]  n=1947 cos1.00 難0.93", "s": 0.556, "f": 0}, {"x": 0.998, "y": 0.951, "c": "近傍", "n": "Seven Times Four [A]  n=1333 cos1.00 難0.95", "s": 0.381, "f": 0}, {"x": 0.997, "y": 0.959, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3358 cos1.00 難0.96", "s": 0.959, "f": 0}, {"x": 0.996, "y": 0.951, "c": "近傍", "n": "dAuntl3ss [A]  n=3300 cos1.00 難0.95", "s": 0.943, "f": 0}, {"x": 0.997, "y": 0.873, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3455 cos1.00 難0.87", "s": 0.987, "f": 0}, {"x": 0.994, "y": 0.964, "c": "近傍", "n": "u gotta beat [A]  n=1438 cos0.99 難0.96", "s": 0.411, "f": 0}, {"x": 0.995, "y": 0.864, "c": "近傍", "n": "Always We Trust In You [A]  n=1763 cos1.00 難0.86", "s": 0.504, "f": 0}, {"x": 0.992, "y": 0.909, "c": "近傍", "n": "Gravigazer [A]  n=3406 cos0.99 難0.91", "s": 0.973, "f": 0}, {"x": 0.992, "y": 0.937, "c": "近傍", "n": "Sounds Of Summer [A]  n=3419 cos0.99 難0.94", "s": 0.977, "f": 0}, {"x": 0.993, "y": 0.873, "c": "近傍", "n": "oratio [A]  n=3448 cos0.99 難0.87", "s": 0.985, "f": 0}, {"x": 0.994, "y": 1.004, "c": "近傍", "n": "From Human Blood [A]  n=984 cos0.99 難1.00", "s": 0.281, "f": 0}, {"x": 0.991, "y": 0.928, "c": "近傍", "n": "WONDER WALKER [A]  n=3501 cos0.99 難0.93", "s": 1.0, "f": 0}, {"x": 0.994, "y": 1.006, "c": "近傍", "n": "EBONY & IVORY [A]  n=3388 cos0.99 難1.01", "s": 0.968, "f": 0}, {"x": 0.996, "y": 1.021, "c": "近傍", "n": "MARLIN [A]  n=1133 cos1.00 難1.02", "s": 0.324, "f": 0}, {"x": 0.997, "y": 1.034, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2198 cos1.00 難1.03", "s": 0.628, "f": 0}, {"x": 0.996, "y": 1.032, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos1.00 難1.03", "s": 0.376, "f": 0}, {"x": 0.99, "y": 0.9, "c": "近傍", "n": "FUZIN RIZIN [A]  n=3386 cos0.99 難0.90", "s": 0.967, "f": 0}, {"x": 0.992, "y": 0.996, "c": "近傍", "n": "The Last Apocalypse [A]  n=1425 cos0.99 難1.00", "s": 0.407, "f": 0}, {"x": 0.989, "y": 0.939, "c": "近傍", "n": "Nothing but Theory [L]  n=1124 cos0.99 難0.94", "s": 0.321, "f": 0}, {"x": 0.991, "y": 0.99, "c": "近傍", "n": "Angel's Ladder [A]  n=2498 cos0.99 難0.99", "s": 0.714, "f": 0}, {"x": 0.99, "y": 0.889, "c": "近傍", "n": "シュレーディンガーの猫 [A]  n=3495 cos0.99 難0.89", "s": 0.998, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6293616937500941}, {"a": 0, "b": 2, "w": 0.16372559805311548}, {"a": 0, "b": 3, "w": 0.40269033901835094}, {"a": 0, "b": 4, "w": 0.4068798180871679}, {"a": 0, "b": 5, "w": 0.11974525584321394}, {"a": 0, "b": 6, "w": 0.38761382169864367}, {"a": 0, "b": 7, "w": 0.20639833568631938}, {"a": 0, "b": 8, "w": 0.2340807746371666}, {"a": 0, "b": 9, "w": 0.04364285768245746}, {"a": 0, "b": 10, "w": 0.29171394085744584}, {"a": 0, "b": 11, "w": 0.1751020904988203}, {"a": 0, "b": 12, "w": 0.28779824848701485}, {"a": 0, "b": 13, "w": 0.36411595587809853}, {"a": 0, "b": 14, "w": 0.31897295687151517}, {"a": 0, "b": 15, "w": 0.25575447894680925}, {"a": 0, "b": 16, "w": 4.1747938439584686e-11}, {"a": 0, "b": 17, "w": 0.18557752601978028}, {"a": 0, "b": 18, "w": 0.09708046216127808}, {"a": 0, "b": 19, "w": 0.18715729809612913}, {"a": 0, "b": 20, "w": 0.11005338387089691}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.851,hiY=1.047;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
