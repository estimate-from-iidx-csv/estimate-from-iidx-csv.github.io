<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Realize Maze [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.172, "c": "種", "n": "Realize Maze [H]  n=1574 cos1.00 難-1.17", "s": 0.91, "f": 0}, {"x": 0.997, "y": -1.239, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos1.00 難-1.24", "s": 0.834, "f": 0}, {"x": 0.993, "y": -1.226, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.99 難-1.23", "s": 0.947, "f": 0}, {"x": 0.992, "y": -1.244, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos0.99 難-1.24", "s": 0.952, "f": 0}, {"x": 0.992, "y": -1.094, "c": "近傍", "n": "No Border [H]  n=1432 cos0.99 難-1.09", "s": 0.828, "f": 0}, {"x": 0.991, "y": -1.11, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.99 難-1.11", "s": 0.906, "f": 0}, {"x": 0.99, "y": -1.218, "c": "近傍", "n": "Disco Killer Music Lover [H]  n=555 cos0.99 難-1.22", "s": 0.321, "f": 0}, {"x": 0.993, "y": -1.277, "c": "近傍", "n": "夢縁 [H]  n=1042 cos0.99 難-1.28", "s": 0.603, "f": 0}, {"x": 0.993, "y": -1.072, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos0.99 難-1.07", "s": 0.7, "f": 0}, {"x": 0.994, "y": -1.29, "c": "近傍", "n": "Begin [H]  n=613 cos0.99 難-1.29", "s": 0.355, "f": 0}, {"x": 0.99, "y": -1.122, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.99 難-1.12", "s": 0.931, "f": 0}, {"x": 0.991, "y": -1.268, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=811 cos0.99 難-1.27", "s": 0.469, "f": 0}, {"x": 0.989, "y": -1.246, "c": "近傍", "n": "〆 [H]  n=1729 cos0.99 難-1.25", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.263, "c": "近傍", "n": "未完成ノ蒸氣驅動乙女 [H]  n=695 cos0.99 難-1.26", "s": 0.402, "f": 0}, {"x": 0.988, "y": -1.17, "c": "近傍", "n": "Hat Surprise (Season 3) [H]  n=662 cos0.99 難-1.17", "s": 0.383, "f": 0}, {"x": 0.988, "y": -1.193, "c": "近傍", "n": "dica dica [H]  n=1133 cos0.99 難-1.19", "s": 0.655, "f": 0}, {"x": 0.988, "y": -1.12, "c": "近傍", "n": "frequent [H]  n=1106 cos0.99 難-1.12", "s": 0.64, "f": 0}, {"x": 0.988, "y": -1.116, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=993 cos0.99 難-1.12", "s": 0.574, "f": 0}, {"x": 0.987, "y": -1.175, "c": "近傍", "n": "ACT0 [H]  n=762 cos0.99 難-1.17", "s": 0.441, "f": 0}, {"x": 0.996, "y": -1.342, "c": "近傍", "n": "Arca [H]  n=1546 cos1.00 難-1.34", "s": 0.894, "f": 0}, {"x": 0.986, "y": -1.16, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1670 cos0.99 難-1.16", "s": 0.966, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6802150858981404}, {"a": 0, "b": 2, "w": 0.5045663981278048}, {"a": 0, "b": 3, "w": 0.4756481770055264}, {"a": 0, "b": 4, "w": 0.5060326087596905}, {"a": 0, "b": 5, "w": 0.3876481829539893}, {"a": 0, "b": 6, "w": 0.42492529083488084}, {"a": 0, "b": 7, "w": 0.4579514547244752}, {"a": 0, "b": 8, "w": 0.24510357250116033}, {"a": 0, "b": 9, "w": 0.5179599766021261}, {"a": 0, "b": 10, "w": 0.39845772890058684}, {"a": 0, "b": 11, "w": 0.35047977335792047}, {"a": 0, "b": 12, "w": 0.215429789805763}, {"a": 0, "b": 13, "w": 0.37744544688983894}, {"a": 0, "b": 14, "w": 0.17066743387063654}, {"a": 0, "b": 15, "w": 0.221619435111288}, {"a": 0, "b": 16, "w": 0.22391233174707703}, {"a": 0, "b": 17, "w": 0.05135841167602839}, {"a": 0, "b": 18, "w": 4.3326120469089346e-11}, {"a": 0, "b": 19, "w": 0.6085276365167105}, {"a": 0, "b": 20, "w": 0.17548052614106224}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.364,hiY=-1.050;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
