<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SINOBUZ Fantasy [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.414, "c": "種", "n": "SINOBUZ Fantasy [H]  n=1321 cos1.00 難-1.41", "s": 0.696, "f": 0}, {"x": 0.993, "y": -1.465, "c": "近傍", "n": "encounter [H]  n=1624 cos0.99 難-1.47", "s": 0.856, "f": 0}, {"x": 0.995, "y": -1.5, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos0.99 難-1.50", "s": 0.744, "f": 0}, {"x": 0.99, "y": -1.342, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1721 cos0.99 難-1.34", "s": 0.907, "f": 0}, {"x": 0.987, "y": -1.424, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.42", "s": 0.73, "f": 0}, {"x": 0.988, "y": -1.352, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.99 難-1.35", "s": 0.739, "f": 0}, {"x": 0.993, "y": -1.513, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.51", "s": 0.359, "f": 0}, {"x": 0.994, "y": -1.52, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1767 cos0.99 難-1.52", "s": 0.931, "f": 0}, {"x": 0.991, "y": -1.296, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [H]  n=1241 cos0.99 難-1.30", "s": 0.654, "f": 0}, {"x": 0.987, "y": -1.324, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.32", "s": 0.641, "f": 0}, {"x": 0.983, "y": -1.446, "c": "近傍", "n": "BREAK OVER [H]  n=1213 cos0.98 難-1.45", "s": 0.639, "f": 0}, {"x": 0.983, "y": -1.443, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1677 cos0.98 難-1.44", "s": 0.884, "f": 0}, {"x": 0.982, "y": -1.38, "c": "近傍", "n": "Always We Trust In You [H]  n=505 cos0.98 難-1.38", "s": 0.266, "f": 0}, {"x": 0.985, "y": -1.538, "c": "近傍", "n": "Cyber True Color [H]  n=899 cos0.99 難-1.54", "s": 0.474, "f": 0}, {"x": 0.978, "y": -1.46, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.98 難-1.46", "s": 0.511, "f": 0}, {"x": 0.996, "y": -1.592, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos1.00 難-1.59", "s": 0.718, "f": 0}, {"x": 0.977, "y": -1.375, "c": "近傍", "n": "Routing [H]  n=1898 cos0.98 難-1.37", "s": 1.0, "f": 0}, {"x": 0.983, "y": -1.288, "c": "近傍", "n": "水鏡の異界 [H]  n=1253 cos0.98 難-1.29", "s": 0.66, "f": 0}, {"x": 0.979, "y": -1.5, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.98 難-1.50", "s": 0.575, "f": 0}, {"x": 0.98, "y": -1.318, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.98 難-1.32", "s": 0.849, "f": 0}, {"x": 0.979, "y": -1.507, "c": "近傍", "n": "27th style [H]  n=1336 cos0.98 難-1.51", "s": 0.704, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5210683052007037}, {"a": 0, "b": 2, "w": 0.5826872052243974}, {"a": 0, "b": 3, "w": 0.43949740163868833}, {"a": 0, "b": 4, "w": 0.3116022118605898}, {"a": 0, "b": 5, "w": 0.39193269236158934}, {"a": 0, "b": 6, "w": 0.5180829597410801}, {"a": 0, "b": 7, "w": 0.5452769027813822}, {"a": 0, "b": 8, "w": 0.4665568881749306}, {"a": 0, "b": 9, "w": 0.341538479146663}, {"a": 0, "b": 10, "w": 0.26464944508562727}, {"a": 0, "b": 11, "w": 0.27311344983261177}, {"a": 0, "b": 12, "w": 0.06039393603563381}, {"a": 0, "b": 13, "w": 0.31652854766723115}, {"a": 0, "b": 14, "w": 0.17357785314225116}, {"a": 0, "b": 15, "w": 0.6045706377580542}, {"a": 0, "b": 16, "w": 4.569178368996063e-11}, {"a": 0, "b": 17, "w": 0.19497337468569909}, {"a": 0, "b": 18, "w": 0.18729192255284022}, {"a": 0, "b": 19, "w": 0.19797394787026856}, {"a": 0, "b": 20, "w": 0.13247010516124869}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.616,hiY=-1.264;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
