<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Castle on the Moon [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.796, "c": "種", "n": "Castle on the Moon [H]  n=2277 cos1.00 難-0.80", "s": 0.773, "f": 0}, {"x": 0.995, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos1.00 難-0.84", "s": 0.678, "f": 0}, {"x": 0.995, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.634, "f": 0}, {"x": 0.994, "y": -0.825, "c": "近傍", "n": "Antigravity [H]  n=2035 cos0.99 難-0.82", "s": 0.691, "f": 0}, {"x": 0.994, "y": -0.744, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.99 難-0.74", "s": 0.726, "f": 0}, {"x": 0.994, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.596, "f": 0}, {"x": 0.993, "y": -0.829, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.99 難-0.83", "s": 0.762, "f": 0}, {"x": 0.994, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.72", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.99 難-0.83", "s": 0.532, "f": 0}, {"x": 0.993, "y": -0.907, "c": "近傍", "n": "New Lights [H]  n=1942 cos0.99 難-0.91", "s": 0.659, "f": 0}, {"x": 0.995, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.65", "s": 0.771, "f": 0}, {"x": 0.991, "y": -0.79, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.99 難-0.79", "s": 0.78, "f": 0}, {"x": 0.991, "y": -0.704, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.551, "f": 0}, {"x": 0.99, "y": -0.741, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.99 難-0.74", "s": 0.72, "f": 0}, {"x": 0.99, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.561, "f": 0}, {"x": 0.993, "y": -0.626, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.99 難-0.63", "s": 0.774, "f": 0}, {"x": 0.991, "y": -0.673, "c": "近傍", "n": "GOLD RUSH [H]  n=2945 cos0.99 難-0.67", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.954, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2186 cos0.99 難-0.95", "s": 0.742, "f": 0}, {"x": 0.989, "y": -0.801, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.99 難-0.80", "s": 0.697, "f": 0}, {"x": 0.988, "y": -0.789, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.99 難-0.79", "s": 0.565, "f": 0}, {"x": 0.988, "y": -0.75, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.75", "s": 0.628, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46783604572007564}, {"a": 0, "b": 2, "w": 0.5196004046008107}, {"a": 0, "b": 3, "w": 0.302215279447136}, {"a": 0, "b": 4, "w": 0.4687241221066858}, {"a": 0, "b": 5, "w": 0.4222127355927726}, {"a": 0, "b": 6, "w": 0.43162801331312417}, {"a": 0, "b": 7, "w": 0.46511834520653816}, {"a": 0, "b": 8, "w": 0.2703491305194793}, {"a": 0, "b": 9, "w": 0.3687202925083586}, {"a": 0, "b": 10, "w": 0.48104650649202607}, {"a": 0, "b": 11, "w": 0.3568464410090425}, {"a": 0, "b": 12, "w": 0.3763047989344803}, {"a": 0, "b": 13, "w": 0.3223060780838227}, {"a": 0, "b": 14, "w": 0.08010946742582359}, {"a": 0, "b": 15, "w": 0.41501693586013744}, {"a": 0, "b": 16, "w": 0.3656959844518469}, {"a": 0, "b": 17, "w": 0.24476040705069346}, {"a": 0, "b": 18, "w": 0.29291940459340515}, {"a": 0, "b": 19, "w": 5.373723688251175e-11}, {"a": 0, "b": 20, "w": 0.25919131624915703}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.981,hiY=-0.600;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
