<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LIVE DRIVING!! feat. 花たん [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.99, "c": "種", "n": "LIVE DRIVING!! feat. 花たん [H]  n=1707 cos1.00 難-0.99", "s": 0.678, "f": 0}, {"x": 0.996, "y": -0.975, "c": "近傍", "n": "UNITE THE HEART [H]  n=1714 cos1.00 難-0.98", "s": 0.68, "f": 0}, {"x": 0.994, "y": -0.991, "c": "近傍", "n": "Rave Patroller [H]  n=1627 cos0.99 難-0.99", "s": 0.646, "f": 0}, {"x": 0.993, "y": -1.126, "c": "近傍", "n": "RINNE [H]  n=1082 cos0.99 難-1.13", "s": 0.43, "f": 0}, {"x": 0.992, "y": -0.856, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [H]  n=1098 cos0.99 難-0.86", "s": 0.436, "f": 0}, {"x": 0.99, "y": -0.971, "c": "近傍", "n": "Dans la nuit de l'eternite [H]  n=1507 cos0.99 難-0.97", "s": 0.598, "f": 0}, {"x": 0.99, "y": -0.98, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1192 cos0.99 難-0.98", "s": 0.473, "f": 0}, {"x": 0.99, "y": -0.88, "c": "近傍", "n": "スキッテイエェエエェ!!!! [H]  n=682 cos0.99 難-0.88", "s": 0.271, "f": 0}, {"x": 0.99, "y": -0.898, "c": "近傍", "n": "AKASHIC BREAK [H]  n=1721 cos0.99 難-0.90", "s": 0.683, "f": 0}, {"x": 0.989, "y": -1.077, "c": "近傍", "n": "RIZING YOU UP [H]  n=1821 cos0.99 難-1.08", "s": 0.723, "f": 0}, {"x": 0.989, "y": -0.904, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.99 難-0.90", "s": 0.642, "f": 0}, {"x": 0.994, "y": -0.746, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.99 難-0.75", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.147, "c": "近傍", "n": "電腦都市 [H]  n=649 cos0.99 難-1.15", "s": 0.258, "f": 0}, {"x": 0.989, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.656, "f": 0}, {"x": 0.989, "y": -0.811, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1683 cos0.99 難-0.81", "s": 0.668, "f": 0}, {"x": 0.987, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.99 難-0.83", "s": 0.622, "f": 0}, {"x": 0.993, "y": -0.683, "c": "近傍", "n": "DARK LEGACY [H]  n=2282 cos0.99 難-0.68", "s": 0.906, "f": 0}, {"x": 0.985, "y": -1.075, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.08", "s": 0.293, "f": 0}, {"x": 0.985, "y": -0.873, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1828 cos0.99 難-0.87", "s": 0.726, "f": 0}, {"x": 0.986, "y": -1.152, "c": "近傍", "n": "Aftermath [H]  n=1341 cos0.99 難-1.15", "s": 0.532, "f": 0}, {"x": 0.986, "y": -1.131, "c": "近傍", "n": "スーパー戦湯ババンバーン [H]  n=1258 cos0.99 難-1.13", "s": 0.499, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5774766605135903}, {"a": 0, "b": 2, "w": 0.30470462056758996}, {"a": 0, "b": 3, "w": 0.4676172946873379}, {"a": 0, "b": 4, "w": 0.43007502747395165}, {"a": 0, "b": 5, "w": 0.3418847419165114}, {"a": 0, "b": 6, "w": 0.34146909666715597}, {"a": 0, "b": 7, "w": 0.32719362589006984}, {"a": 0, "b": 8, "w": 0.2957144140013859}, {"a": 0, "b": 9, "w": 0.24297518881708402}, {"a": 0, "b": 10, "w": 0.3264058045498657}, {"a": 0, "b": 11, "w": 0.5068890455821387}, {"a": 0, "b": 12, "w": 0.30830381899249537}, {"a": 0, "b": 13, "w": 0.28390200333367877}, {"a": 0, "b": 14, "w": 0.3229974354529984}, {"a": 0, "b": 15, "w": 0.1715258403904828}, {"a": 0, "b": 16, "w": 0.475754376080066}, {"a": 0, "b": 17, "w": 0.12658289954261848}, {"a": 0, "b": 18, "w": 4.375477757889712e-11}, {"a": 0, "b": 19, "w": 0.22446001806120708}, {"a": 0, "b": 20, "w": 0.04449693840936564}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.190,hiY=-0.645;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
