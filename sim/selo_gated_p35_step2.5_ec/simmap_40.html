<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Driver [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.342, "c": "種", "n": "Driver [A]  n=1865 cos1.00 難-0.34", "s": 0.558, "f": 0}, {"x": 0.991, "y": -0.466, "c": "近傍", "n": "BRAINSTORM [H]  n=2556 cos0.99 難-0.47", "s": 0.764, "f": 0}, {"x": 0.989, "y": -0.307, "c": "近傍", "n": "HEARTACHE [A]  n=2644 cos0.99 難-0.31", "s": 0.79, "f": 0}, {"x": 0.992, "y": -0.571, "c": "近傍", "n": "Level One [H]  n=2810 cos0.99 難-0.57", "s": 0.84, "f": 0}, {"x": 0.985, "y": -0.245, "c": "近傍", "n": "FIRE FIRE [H]  n=3345 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.216, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.22", "s": 0.671, "f": 0}, {"x": 0.984, "y": -0.195, "c": "近傍", "n": "SAMSARA [A]  n=3305 cos0.98 難-0.19", "s": 0.988, "f": 0}, {"x": 0.984, "y": -0.471, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.98 難-0.47", "s": 0.684, "f": 0}, {"x": 0.982, "y": -0.35, "c": "近傍", "n": "ビビデバ [A]  n=1667 cos0.98 難-0.35", "s": 0.498, "f": 0}, {"x": 0.988, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.65", "s": 0.679, "f": 0}, {"x": 0.982, "y": -0.339, "c": "近傍", "n": "Watermelon Explosion [A]  n=775 cos0.98 難-0.34", "s": 0.232, "f": 0}, {"x": 0.982, "y": -0.21, "c": "近傍", "n": "SCREAM SQUAD [H]  n=2627 cos0.98 難-0.21", "s": 0.785, "f": 0}, {"x": 0.983, "y": -0.556, "c": "近傍", "n": "Macho Monky [H]  n=1760 cos0.98 難-0.56", "s": 0.526, "f": 0}, {"x": 0.98, "y": -0.25, "c": "近傍", "n": "シンデレラ [A]  n=1872 cos0.98 難-0.25", "s": 0.56, "f": 0}, {"x": 0.98, "y": -0.367, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos0.98 難-0.37", "s": 0.824, "f": 0}, {"x": 0.981, "y": -0.505, "c": "近傍", "n": "焔極OVERKILL [H]  n=2631 cos0.98 難-0.50", "s": 0.787, "f": 0}, {"x": 0.98, "y": -0.474, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.98 難-0.47", "s": 0.856, "f": 0}, {"x": 0.981, "y": -0.534, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.98 難-0.53", "s": 0.757, "f": 0}, {"x": 0.988, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.558, "f": 0}, {"x": 0.979, "y": -0.351, "c": "近傍", "n": "I know You know [A]  n=2736 cos0.98 難-0.35", "s": 0.818, "f": 0}, {"x": 0.98, "y": -0.173, "c": "近傍", "n": "ACT [A]  n=2300 cos0.98 難-0.17", "s": 0.688, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49052514575995076}, {"a": 0, "b": 2, "w": 0.32769657954984577}, {"a": 0, "b": 3, "w": 0.26150628652745944}, {"a": 0, "b": 4, "w": 0.33416162919342207}, {"a": 0, "b": 5, "w": 0.17560590637646312}, {"a": 0, "b": 6, "w": 0.2548355734382235}, {"a": 0, "b": 7, "w": 0.2948844505029682}, {"a": 0, "b": 8, "w": 0.246620111980274}, {"a": 0, "b": 9, "w": 0.3809912658223563}, {"a": 0, "b": 10, "w": 0.10942982181003003}, {"a": 0, "b": 11, "w": 0.2729211099285238}, {"a": 0, "b": 12, "w": 3.942457471595162e-11}, {"a": 0, "b": 13, "w": 0.24761414869569165}, {"a": 0, "b": 14, "w": 0.20278520552985901}, {"a": 0, "b": 15, "w": 0.030572387001179813}, {"a": 0, "b": 16, "w": 0.2472257087459624}, {"a": 0, "b": 17, "w": 0.20854826302735685}, {"a": 0, "b": 18, "w": 0.31395551177868664}, {"a": 0, "b": 19, "w": 0.1731301199415186}, {"a": 0, "b": 20, "w": 0.18127954980331984}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=-0.783,hiY=-0.128;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
