<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">《PL|RAYER》 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.498, "c": "種", "n": "《PL|RAYER》 [H]  n=603 cos1.00 難-1.50", "s": 0.34, "f": 0}, {"x": 0.992, "y": -1.5, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.50", "s": 0.615, "f": 0}, {"x": 0.992, "y": -1.465, "c": "近傍", "n": "encounter [H]  n=1624 cos0.99 難-1.47", "s": 0.915, "f": 0}, {"x": 0.991, "y": -1.443, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1677 cos0.99 難-1.44", "s": 0.945, "f": 0}, {"x": 0.992, "y": -1.408, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.99 難-1.41", "s": 0.773, "f": 0}, {"x": 0.993, "y": -1.604, "c": "近傍", "n": "最小三倍完全数 [H]  n=1145 cos0.99 難-1.60", "s": 0.645, "f": 0}, {"x": 0.987, "y": -1.513, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.51", "s": 0.384, "f": 0}, {"x": 0.99, "y": -1.613, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1156 cos0.99 難-1.61", "s": 0.651, "f": 0}, {"x": 0.988, "y": -1.59, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.99 難-1.59", "s": 1.0, "f": 0}, {"x": 0.987, "y": -1.423, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.99 難-1.42", "s": 0.966, "f": 0}, {"x": 0.994, "y": -1.352, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.99 難-1.35", "s": 0.79, "f": 0}, {"x": 0.995, "y": -1.341, "c": "近傍", "n": "NANAIRO [H]  n=1415 cos1.00 難-1.34", "s": 0.797, "f": 0}, {"x": 0.988, "y": -1.402, "c": "近傍", "n": "Be A Star [H]  n=1614 cos0.99 難-1.40", "s": 0.909, "f": 0}, {"x": 0.985, "y": -1.508, "c": "近傍", "n": "Angelic Jelly [H]  n=1599 cos0.98 難-1.51", "s": 0.901, "f": 0}, {"x": 0.985, "y": -1.46, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.99 難-1.46", "s": 0.546, "f": 0}, {"x": 0.987, "y": -1.592, "c": "近傍", "n": "Jungle Eater [H]  n=1104 cos0.99 難-1.59", "s": 0.622, "f": 0}, {"x": 0.99, "y": -1.367, "c": "近傍", "n": "Lethal Weapon [H]  n=1417 cos0.99 難-1.37", "s": 0.798, "f": 0}, {"x": 0.985, "y": -1.554, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.98 難-1.55", "s": 0.6, "f": 0}, {"x": 0.985, "y": -1.424, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.42", "s": 0.781, "f": 0}, {"x": 0.987, "y": -1.606, "c": "近傍", "n": "Hat Surprise (Season 2) [H]  n=706 cos0.99 難-1.61", "s": 0.398, "f": 0}, {"x": 0.984, "y": -1.5, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos0.98 難-1.50", "s": 0.795, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2880272586954197}, {"a": 0, "b": 2, "w": 0.27756120054750455}, {"a": 0, "b": 3, "w": 0.15273985583250915}, {"a": 0, "b": 4, "w": 0.28093269680826183}, {"a": 0, "b": 5, "w": 0.346989850022294}, {"a": 0, "b": 6, "w": 0.05017117229322454}, {"a": 0, "b": 7, "w": 0.20474004367000598}, {"a": 0, "b": 8, "w": 0.06875693266592209}, {"a": 0, "b": 9, "w": 0.10585508485981365}, {"a": 0, "b": 10, "w": 0.3309792770673403}, {"a": 0, "b": 11, "w": 0.47619712273044124}, {"a": 0, "b": 12, "w": 0.06875230850212222}, {"a": 0, "b": 13, "w": 0.04506242768673774}, {"a": 0, "b": 14, "w": 0.033952276782409085}, {"a": 0, "b": 15, "w": 0.11468601171916093}, {"a": 0, "b": 16, "w": 0.20669090034904025}, {"a": 0, "b": 17, "w": 0.04199549689771964}, {"a": 0, "b": 18, "w": 0.06912099336618205}, {"a": 0, "b": 19, "w": 0.028270111591510605}, {"a": 0, "b": 20, "w": 5.948785908316268e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.635,hiY=-1.320;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
