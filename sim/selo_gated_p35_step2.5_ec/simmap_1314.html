<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Distress [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.096, "c": "種", "n": "Distress [H]  n=2464 cos1.00 難-0.10", "s": 0.682, "f": 0}, {"x": 0.99, "y": -0.194, "c": "近傍", "n": "AVE DE RAPINA [A]  n=2062 cos0.99 難-0.19", "s": 0.571, "f": 0}, {"x": 0.989, "y": 0.136, "c": "近傍", "n": "Be quiet [A]  n=3611 cos0.99 難0.14", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.276, "c": "近傍", "n": "合体せよ！ストロングイェーガー！！ (Ryu☆ remix) [A]  n=3327 cos0.99 難0.28", "s": 0.921, "f": 0}, {"x": 0.986, "y": -0.072, "c": "近傍", "n": "STILL IN MY HEART [A]  n=2479 cos0.99 難-0.07", "s": 0.687, "f": 0}, {"x": 0.986, "y": -0.047, "c": "近傍", "n": "madrugada [A]  n=2180 cos0.99 難-0.05", "s": 0.604, "f": 0}, {"x": 0.986, "y": -0.173, "c": "近傍", "n": "one or eight [H]  n=2549 cos0.99 難-0.17", "s": 0.706, "f": 0}, {"x": 0.984, "y": -0.179, "c": "近傍", "n": "HAT TRICK [A]  n=3216 cos0.98 難-0.18", "s": 0.891, "f": 0}, {"x": 0.984, "y": -0.01, "c": "近傍", "n": "Regulus [A]  n=2456 cos0.98 難-0.01", "s": 0.68, "f": 0}, {"x": 0.985, "y": -0.414, "c": "近傍", "n": "neu [H]  n=2801 cos0.99 難-0.41", "s": 0.776, "f": 0}, {"x": 0.983, "y": 0.041, "c": "近傍", "n": "Karma [A]  n=2668 cos0.98 難0.04", "s": 0.739, "f": 0}, {"x": 0.982, "y": -0.012, "c": "近傍", "n": "Votum stellarum [A]  n=2865 cos0.98 難-0.01", "s": 0.793, "f": 0}, {"x": 0.983, "y": 0.079, "c": "近傍", "n": "alla turca con passione [A]  n=2818 cos0.98 難0.08", "s": 0.78, "f": 0}, {"x": 0.982, "y": -0.037, "c": "近傍", "n": "2hot2eat [A]  n=1063 cos0.98 難-0.04", "s": 0.294, "f": 0}, {"x": 0.982, "y": -0.033, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.98 難-0.03", "s": 0.859, "f": 0}, {"x": 0.982, "y": -0.248, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3355 cos0.98 難-0.25", "s": 0.929, "f": 0}, {"x": 0.981, "y": -0.195, "c": "近傍", "n": "Hitch Hiker2 [L]  n=1874 cos0.98 難-0.20", "s": 0.519, "f": 0}, {"x": 0.982, "y": 0.059, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2689 cos0.98 難0.06", "s": 0.745, "f": 0}, {"x": 0.982, "y": -0.349, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1733 cos0.98 難-0.35", "s": 0.48, "f": 0}, {"x": 0.981, "y": -0.08, "c": "近傍", "n": "Freeway Shuffle [A]  n=2925 cos0.98 難-0.08", "s": 0.81, "f": 0}, {"x": 0.981, "y": -0.022, "c": "近傍", "n": "memories [A]  n=2210 cos0.98 難-0.02", "s": 0.612, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.15159860027875516}, {"a": 0, "b": 2, "w": 0.10498981649631944}, {"a": 0, "b": 3, "w": 0.24277815722121265}, {"a": 0, "b": 4, "w": 0.12233188247409188}, {"a": 0, "b": 5, "w": 0.061639229838515774}, {"a": 0, "b": 6, "w": 0.062245287931511295}, {"a": 0, "b": 7, "w": 0.04656991654202891}, {"a": 0, "b": 8, "w": 0.07785559862796254}, {"a": 0, "b": 9, "w": 0.1452221059482064}, {"a": 0, "b": 10, "w": 0.041864168923874345}, {"a": 0, "b": 11, "w": 0.0809142788515127}, {"a": 0, "b": 12, "w": 0.09083672730162551}, {"a": 0, "b": 13, "w": 0.04219145762296039}, {"a": 0, "b": 14, "w": 0.044797708612030696}, {"a": 0, "b": 15, "w": 0.03615431228455246}, {"a": 0, "b": 16, "w": 0.05402712392795461}, {"a": 0, "b": 17, "w": 0.03478981303647599}, {"a": 0, "b": 18, "w": 0.0645231022949756}, {"a": 0, "b": 19, "w": 4.64743799000189e-11}, {"a": 0, "b": 20, "w": 0.03818130296282973}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.469,hiY=0.331;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
