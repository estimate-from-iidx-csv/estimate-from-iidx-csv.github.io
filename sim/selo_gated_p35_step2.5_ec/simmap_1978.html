<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lucy [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.272, "c": "種", "n": "Lucy [A]  n=3437 cos1.00 難0.27", "s": 0.916, "f": 0}, {"x": 0.991, "y": 0.228, "c": "近傍", "n": "Take It Easy [A]  n=3281 cos0.99 難0.23", "s": 0.875, "f": 0}, {"x": 0.992, "y": 0.003, "c": "近傍", "n": "Blind Justice ～Torn souls， Hurt Faiths ～ [A]  n=3751 cos0.99 難0.00", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.14, "c": "近傍", "n": "Second Heaven [A]  n=3741 cos0.99 難0.14", "s": 0.997, "f": 0}, {"x": 0.989, "y": 0.052, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos0.99 難0.05", "s": 0.799, "f": 0}, {"x": 0.987, "y": 0.226, "c": "近傍", "n": "Marie Antoinette [A]  n=1920 cos0.99 難0.23", "s": 0.512, "f": 0}, {"x": 0.987, "y": 0.401, "c": "近傍", "n": "Ganymede [A]  n=3335 cos0.99 難0.40", "s": 0.889, "f": 0}, {"x": 0.988, "y": 0.074, "c": "近傍", "n": "Love Magic [A]  n=2554 cos0.99 難0.07", "s": 0.681, "f": 0}, {"x": 0.986, "y": 0.183, "c": "近傍", "n": "TRIP MACHINE PhoeniX [A]  n=1787 cos0.99 難0.18", "s": 0.476, "f": 0}, {"x": 0.986, "y": 0.162, "c": "近傍", "n": "Linus [A]  n=3392 cos0.99 難0.16", "s": 0.904, "f": 0}, {"x": 0.99, "y": -0.047, "c": "近傍", "n": "QQQ [A]  n=2895 cos0.99 難-0.05", "s": 0.772, "f": 0}, {"x": 0.989, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.04", "s": 0.742, "f": 0}, {"x": 0.989, "y": -0.028, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.03", "s": 0.825, "f": 0}, {"x": 0.988, "y": 0.024, "c": "近傍", "n": "PHOTONGENIC [A]  n=2864 cos0.99 難0.02", "s": 0.764, "f": 0}, {"x": 0.986, "y": 0.385, "c": "近傍", "n": "VALLIS-NERIA [A]  n=3498 cos0.99 難0.39", "s": 0.933, "f": 0}, {"x": 0.985, "y": 0.215, "c": "近傍", "n": "FEEL IT [A]  n=2996 cos0.99 難0.21", "s": 0.799, "f": 0}, {"x": 0.987, "y": 0.052, "c": "近傍", "n": "ToyCube Pf.(RX-Ver.S.P.L.) [A]  n=1927 cos0.99 難0.05", "s": 0.514, "f": 0}, {"x": 0.987, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難0.03", "s": 0.965, "f": 0}, {"x": 0.987, "y": 0.02, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [A]  n=3192 cos0.99 難0.02", "s": 0.851, "f": 0}, {"x": 0.987, "y": 0.04, "c": "近傍", "n": "Abyss -The Heavens Remix- [A]  n=3140 cos0.99 難0.04", "s": 0.837, "f": 0}, {"x": 0.989, "y": -0.095, "c": "近傍", "n": "オルタネイトβ [A]  n=3292 cos0.99 難-0.09", "s": 0.878, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6144610629147451}, {"a": 0, "b": 2, "w": 0.6294596459632018}, {"a": 0, "b": 3, "w": 0.5509734299712966}, {"a": 0, "b": 4, "w": 0.5747502098270612}, {"a": 0, "b": 5, "w": 0.5073650224054691}, {"a": 0, "b": 6, "w": 0.552000784249883}, {"a": 0, "b": 7, "w": 0.4991808825673858}, {"a": 0, "b": 8, "w": 0.5387211252773032}, {"a": 0, "b": 9, "w": 0.5295287645957844}, {"a": 0, "b": 10, "w": 0.575808361522407}, {"a": 0, "b": 11, "w": 0.5817715712278819}, {"a": 0, "b": 12, "w": 0.5721328037155221}, {"a": 0, "b": 13, "w": 0.5294190086144364}, {"a": 0, "b": 14, "w": 2.7038149497116137e-11}, {"a": 0, "b": 15, "w": 0.46737784197727217}, {"a": 0, "b": 16, "w": 0.514872254189551}, {"a": 0, "b": 17, "w": 0.5372146265452507}, {"a": 0, "b": 18, "w": 0.547431538375898}, {"a": 0, "b": 19, "w": 0.5326018998803228}, {"a": 0, "b": 20, "w": 0.5320084829361602}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.135,hiY=0.441;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
