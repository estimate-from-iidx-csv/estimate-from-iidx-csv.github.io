<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Power of Love [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.195, "c": "種", "n": "Power of Love [A]  n=2905 cos1.00 難-0.20", "s": 0.778, "f": 0}, {"x": 0.997, "y": -0.203, "c": "近傍", "n": "PLASMA [A]  n=2454 cos1.00 難-0.20", "s": 0.657, "f": 0}, {"x": 0.998, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos1.00 難-0.32", "s": 0.905, "f": 0}, {"x": 0.996, "y": -0.209, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos1.00 難-0.21", "s": 0.75, "f": 0}, {"x": 0.996, "y": -0.174, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos1.00 難-0.17", "s": 0.628, "f": 0}, {"x": 0.996, "y": -0.258, "c": "近傍", "n": "Summerblue [A]  n=2192 cos1.00 難-0.26", "s": 0.587, "f": 0}, {"x": 0.997, "y": -0.057, "c": "近傍", "n": "Rise'n Beauty [A]  n=2870 cos1.00 難-0.06", "s": 0.769, "f": 0}, {"x": 0.997, "y": -0.059, "c": "近傍", "n": "Back Into The Light [A]  n=3045 cos1.00 難-0.06", "s": 0.816, "f": 0}, {"x": 0.995, "y": -0.177, "c": "近傍", "n": "REPLAY [A]  n=2245 cos0.99 難-0.18", "s": 0.601, "f": 0}, {"x": 0.997, "y": -0.016, "c": "近傍", "n": "Silly Love [A]  n=2738 cos1.00 難-0.02", "s": 0.733, "f": 0}, {"x": 0.995, "y": -0.077, "c": "近傍", "n": "e-motion 2003  -romantic extra- [A]  n=2824 cos1.00 難-0.08", "s": 0.756, "f": 0}, {"x": 0.994, "y": -0.221, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.22", "s": 0.684, "f": 0}, {"x": 0.995, "y": -0.31, "c": "近傍", "n": "thunder [A]  n=2861 cos1.00 難-0.31", "s": 0.766, "f": 0}, {"x": 0.994, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3210 cos0.99 難-0.18", "s": 0.86, "f": 0}, {"x": 0.994, "y": -0.283, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3309 cos0.99 難-0.28", "s": 0.886, "f": 0}, {"x": 0.994, "y": -0.29, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos0.99 難-0.29", "s": 0.272, "f": 0}, {"x": 0.993, "y": -0.166, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.99 難-0.17", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.248, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos0.99 難-0.25", "s": 0.555, "f": 0}, {"x": 0.993, "y": -0.251, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos0.99 難-0.25", "s": 0.636, "f": 0}, {"x": 0.993, "y": -0.167, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos0.99 難-0.17", "s": 0.198, "f": 0}, {"x": 0.994, "y": -0.373, "c": "近傍", "n": "Saturn [H]  n=2300 cos0.99 難-0.37", "s": 0.616, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5867620780568759}, {"a": 0, "b": 2, "w": 0.5293361494856905}, {"a": 0, "b": 3, "w": 0.3911759309968196}, {"a": 0, "b": 4, "w": 0.4152441007306512}, {"a": 0, "b": 5, "w": 0.3150106789698863}, {"a": 0, "b": 6, "w": 0.6306012264165294}, {"a": 0, "b": 7, "w": 0.6109005944617727}, {"a": 0, "b": 8, "w": 0.5061797167606005}, {"a": 0, "b": 9, "w": 0.391298290462617}, {"a": 0, "b": 10, "w": 0.5418109195919385}, {"a": 0, "b": 11, "w": 0.4446069323049717}, {"a": 0, "b": 12, "w": 0.524745294018448}, {"a": 0, "b": 13, "w": 0.27030751481961934}, {"a": 0, "b": 14, "w": 0.2941854511194325}, {"a": 0, "b": 15, "w": 0.43459243639976064}, {"a": 0, "b": 16, "w": 5.2347126633378593e-11}, {"a": 0, "b": 17, "w": 0.4107359449111937}, {"a": 0, "b": 18, "w": 0.195563377558149}, {"a": 0, "b": 19, "w": 0.3006576602793253}, {"a": 0, "b": 20, "w": 0.26469468435010335}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.402,hiY=0.012;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
