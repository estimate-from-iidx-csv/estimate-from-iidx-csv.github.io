<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">STEEL NEEDLE [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.253, "c": "種", "n": "STEEL NEEDLE [H]  n=2604 cos1.00 難-0.25", "s": 0.756, "f": 0}, {"x": 0.997, "y": -0.398, "c": "近傍", "n": "Elemental Creation [H]  n=3340 cos1.00 難-0.40", "s": 0.97, "f": 0}, {"x": 0.995, "y": -0.308, "c": "近傍", "n": "Little Little Princess [H]  n=2749 cos0.99 難-0.31", "s": 0.798, "f": 0}, {"x": 0.994, "y": -0.296, "c": "近傍", "n": "Harmonia [A]  n=2407 cos0.99 難-0.30", "s": 0.699, "f": 0}, {"x": 0.994, "y": -0.284, "c": "近傍", "n": "NNRT [H]  n=2898 cos0.99 難-0.28", "s": 0.841, "f": 0}, {"x": 0.994, "y": -0.325, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3011 cos0.99 難-0.32", "s": 0.874, "f": 0}, {"x": 0.994, "y": -0.353, "c": "近傍", "n": "AGEHA [A]  n=3020 cos0.99 難-0.35", "s": 0.877, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "CaptivAte～裁き～ [A]  n=2980 cos0.99 難-0.23", "s": 0.865, "f": 0}, {"x": 0.993, "y": -0.372, "c": "近傍", "n": "Iris [A]  n=2038 cos0.99 難-0.37", "s": 0.592, "f": 0}, {"x": 0.992, "y": -0.273, "c": "近傍", "n": "HAERETICUS [H]  n=2683 cos0.99 難-0.27", "s": 0.779, "f": 0}, {"x": 0.992, "y": -0.326, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3122 cos0.99 難-0.33", "s": 0.906, "f": 0}, {"x": 0.992, "y": -0.202, "c": "近傍", "n": "Express Emotion [A]  n=3445 cos0.99 難-0.20", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.179, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos0.99 難-0.18", "s": 0.893, "f": 0}, {"x": 0.992, "y": -0.431, "c": "近傍", "n": "OTENAMI Hurricane [H]  n=2536 cos0.99 難-0.43", "s": 0.736, "f": 0}, {"x": 0.992, "y": -0.088, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1141 cos0.99 難-0.09", "s": 0.331, "f": 0}, {"x": 0.991, "y": -0.244, "c": "近傍", "n": "狂イ咲ケ焔ノ華 [H]  n=3065 cos0.99 難-0.24", "s": 0.89, "f": 0}, {"x": 0.992, "y": -0.404, "c": "近傍", "n": "シル・ヴ・プレジデント [A]  n=2829 cos0.99 難-0.40", "s": 0.821, "f": 0}, {"x": 0.991, "y": -0.412, "c": "近傍", "n": "in the Sky [H]  n=2364 cos0.99 難-0.41", "s": 0.686, "f": 0}, {"x": 0.991, "y": -0.29, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.29", "s": 0.326, "f": 0}, {"x": 0.99, "y": -0.261, "c": "近傍", "n": "The Limbo [H]  n=2860 cos0.99 難-0.26", "s": 0.83, "f": 0}, {"x": 0.99, "y": -0.285, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.28", "s": 0.879, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4804288802001566}, {"a": 0, "b": 2, "w": 0.1632517759631854}, {"a": 0, "b": 3, "w": 0.2714865671063659}, {"a": 0, "b": 4, "w": 0.1748162883891069}, {"a": 0, "b": 5, "w": 0.19391268777803006}, {"a": 0, "b": 6, "w": 0.17052033804249445}, {"a": 0, "b": 7, "w": 5.99409410995122e-11}, {"a": 0, "b": 8, "w": 0.12462604465990645}, {"a": 0, "b": 9, "w": 0.21872049037757235}, {"a": 0, "b": 10, "w": 0.21186188848536214}, {"a": 0, "b": 11, "w": 0.20700811007810238}, {"a": 0, "b": 12, "w": 0.15628032830097194}, {"a": 0, "b": 13, "w": 0.22314737457175238}, {"a": 0, "b": 14, "w": 0.2175159235869869}, {"a": 0, "b": 15, "w": 0.15778202388064366}, {"a": 0, "b": 16, "w": 0.0425208059779576}, {"a": 0, "b": 17, "w": 0.18197094270234226}, {"a": 0, "b": 18, "w": 0.13683285220519015}, {"a": 0, "b": 19, "w": 0.11025449993816283}, {"a": 0, "b": 20, "w": 0.10985481519472662}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.458,hiY=-0.060;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
