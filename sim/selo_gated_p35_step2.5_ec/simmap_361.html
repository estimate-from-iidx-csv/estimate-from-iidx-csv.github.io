<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HYENA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.842, "c": "種", "n": "HYENA [H]  n=2379 cos1.00 難-0.84", "s": 0.93, "f": 0}, {"x": 0.996, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos1.00 難-0.81", "s": 0.302, "f": 0}, {"x": 0.995, "y": -0.809, "c": "近傍", "n": "Sphere [H]  n=1980 cos0.99 難-0.81", "s": 0.774, "f": 0}, {"x": 0.994, "y": -0.86, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1851 cos0.99 難-0.86", "s": 0.724, "f": 0}, {"x": 0.996, "y": -0.74, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos1.00 難-0.74", "s": 0.289, "f": 0}, {"x": 0.996, "y": -0.958, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos1.00 難-0.96", "s": 0.244, "f": 0}, {"x": 0.993, "y": -0.909, "c": "近傍", "n": "-65℃ [H]  n=1552 cos0.99 難-0.91", "s": 0.607, "f": 0}, {"x": 0.995, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.99 難-0.73", "s": 0.792, "f": 0}, {"x": 0.994, "y": -0.752, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.75", "s": 0.71, "f": 0}, {"x": 0.994, "y": -0.964, "c": "近傍", "n": "終焔のClaudia [H]  n=803 cos0.99 難-0.96", "s": 0.314, "f": 0}, {"x": 0.994, "y": -0.722, "c": "近傍", "n": "Konzert V [H]  n=2419 cos0.99 難-0.72", "s": 0.946, "f": 0}, {"x": 0.993, "y": -0.752, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.75", "s": 0.616, "f": 0}, {"x": 0.993, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos0.99 難-0.74", "s": 0.759, "f": 0}, {"x": 0.999, "y": -1.026, "c": "近傍", "n": "Trill auf G [H]  n=1800 cos1.00 難-1.03", "s": 0.704, "f": 0}, {"x": 0.993, "y": -0.963, "c": "近傍", "n": "閠槞彁の願い [H]  n=1557 cos0.99 難-0.96", "s": 0.609, "f": 0}, {"x": 0.995, "y": -0.683, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.68", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.926, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1066 cos0.99 難-0.93", "s": 0.417, "f": 0}, {"x": 0.99, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.99 難-0.81", "s": 0.371, "f": 0}, {"x": 0.99, "y": -0.852, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos0.99 難-0.85", "s": 0.239, "f": 0}, {"x": 0.992, "y": -0.728, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.73", "s": 0.642, "f": 0}, {"x": 0.99, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-0.84", "s": 0.21, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49219377135808784}, {"a": 0, "b": 2, "w": 0.49343675442082857}, {"a": 0, "b": 3, "w": 0.23488954195932088}, {"a": 0, "b": 4, "w": 0.48118571287514134}, {"a": 0, "b": 5, "w": 0.5458730494559204}, {"a": 0, "b": 6, "w": 0.3421203855464561}, {"a": 0, "b": 7, "w": 0.3340467249204716}, {"a": 0, "b": 8, "w": 0.321580053135871}, {"a": 0, "b": 9, "w": 0.43801061998620106}, {"a": 0, "b": 10, "w": 0.4776893210747094}, {"a": 0, "b": 11, "w": 0.39635258743645396}, {"a": 0, "b": 12, "w": 0.40217168954545834}, {"a": 0, "b": 13, "w": 0.7370529721425748}, {"a": 0, "b": 14, "w": 0.32679116292631694}, {"a": 0, "b": 15, "w": 0.4064017479104578}, {"a": 0, "b": 16, "w": 4.668310182864843e-11}, {"a": 0, "b": 17, "w": 0.23642834395449508}, {"a": 0, "b": 18, "w": 0.20348301293002724}, {"a": 0, "b": 19, "w": 0.32170050229635383}, {"a": 0, "b": 20, "w": 0.24378904013459624}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.054,hiY=-0.655;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
