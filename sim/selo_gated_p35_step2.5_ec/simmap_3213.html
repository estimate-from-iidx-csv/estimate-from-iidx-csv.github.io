<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">龍王の霊廟(Mausoleum Of The Primal Dragon) [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.113, "c": "種", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [L]  n=1822 cos1.00 難1.11", "s": 0.514, "f": 0}, {"x": 0.985, "y": 1.15, "c": "近傍", "n": "spiral galaxy [L]  n=3069 cos0.98 難1.15", "s": 0.865, "f": 0}, {"x": 0.981, "y": 1.107, "c": "近傍", "n": "GENE [A]  n=3138 cos0.98 難1.11", "s": 0.885, "f": 0}, {"x": 0.979, "y": 1.141, "c": "近傍", "n": "refrain [A]  n=3325 cos0.98 難1.14", "s": 0.937, "f": 0}, {"x": 0.982, "y": 1.02, "c": "近傍", "n": "Vinculum stellarum [A]  n=2772 cos0.98 難1.02", "s": 0.782, "f": 0}, {"x": 0.978, "y": 1.118, "c": "近傍", "n": "クレッシェンド [A]  n=717 cos0.98 難1.12", "s": 0.202, "f": 0}, {"x": 0.98, "y": 1.042, "c": "近傍", "n": "Ypsilon [L]  n=2342 cos0.98 難1.04", "s": 0.66, "f": 0}, {"x": 0.986, "y": 0.969, "c": "近傍", "n": "RAIN [A]  n=3407 cos0.99 難0.97", "s": 0.961, "f": 0}, {"x": 0.981, "y": 1.009, "c": "近傍", "n": "thunder HOUSE NATION Remix [L]  n=2570 cos0.98 難1.01", "s": 0.725, "f": 0}, {"x": 0.977, "y": 1.069, "c": "近傍", "n": "Umbral [L]  n=2059 cos0.98 難1.07", "s": 0.58, "f": 0}, {"x": 0.983, "y": 0.975, "c": "近傍", "n": "destination [A]  n=1475 cos0.98 難0.98", "s": 0.416, "f": 0}, {"x": 0.976, "y": 1.146, "c": "近傍", "n": "華爛漫 -Flowers- [L]  n=2171 cos0.98 難1.15", "s": 0.612, "f": 0}, {"x": 0.977, "y": 1.031, "c": "近傍", "n": "entelecheia [A]  n=3423 cos0.98 難1.03", "s": 0.965, "f": 0}, {"x": 0.981, "y": 1.253, "c": "近傍", "n": "逆月 [A]  n=2284 cos0.98 難1.25", "s": 0.644, "f": 0}, {"x": 0.979, "y": 1.233, "c": "近傍", "n": "X [A]  n=3224 cos0.98 難1.23", "s": 0.909, "f": 0}, {"x": 0.989, "y": 1.3, "c": "近傍", "n": "HARD BRAIN [A]  n=3026 cos0.99 難1.30", "s": 0.853, "f": 0}, {"x": 0.976, "y": 1.201, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.98 難1.20", "s": 0.397, "f": 0}, {"x": 0.974, "y": 1.072, "c": "近傍", "n": "DUAL STRIKER [A]  n=2410 cos0.97 難1.07", "s": 0.679, "f": 0}, {"x": 0.975, "y": 1.045, "c": "近傍", "n": "Colorful Cookie [A]  n=3547 cos0.97 難1.05", "s": 1.0, "f": 0}, {"x": 0.973, "y": 1.115, "c": "近傍", "n": "Viridian [A]  n=2633 cos0.97 難1.12", "s": 0.742, "f": 0}, {"x": 0.978, "y": 0.983, "c": "近傍", "n": "EVANESCENT [A]  n=3032 cos0.98 難0.98", "s": 0.855, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.20929860621868712}, {"a": 0, "b": 2, "w": 0.13356444226918518}, {"a": 0, "b": 3, "w": 0.1356503307807374}, {"a": 0, "b": 4, "w": 0.20019760140936926}, {"a": 0, "b": 5, "w": 0.1121333724709419}, {"a": 0, "b": 6, "w": 0.13699478899417028}, {"a": 0, "b": 7, "w": 0.21047004079756115}, {"a": 0, "b": 8, "w": 0.14700569785311413}, {"a": 0, "b": 9, "w": 0.03463915622467251}, {"a": 0, "b": 10, "w": 0.08084100213592416}, {"a": 0, "b": 11, "w": 0.05174173950720795}, {"a": 0, "b": 12, "w": 0.081805934653428}, {"a": 0, "b": 13, "w": 0.11200630265957945}, {"a": 0, "b": 14, "w": 0.1212221456842082}, {"a": 0, "b": 15, "w": 0.3526563759507887}, {"a": 0, "b": 16, "w": 2.793232312114924e-11}, {"a": 0, "b": 17, "w": 0.006830841949034161}, {"a": 0, "b": 18, "w": 0.04196606829055316}, {"a": 0, "b": 19, "w": 0.0029784170528945886}, {"a": 0, "b": 20, "w": 0.09071920469849737}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=0.942,hiY=1.327;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
