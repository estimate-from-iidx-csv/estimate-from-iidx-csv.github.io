<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ピアノ独奏無言歌 "灰燼" [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.337, "c": "種", "n": "ピアノ独奏無言歌 \"灰燼\" [A]  n=1736 cos1.00 難2.34", "s": 0.597, "f": 0}, {"x": 0.975, "y": 2.393, "c": "近傍", "n": "Saturn [L]  n=1035 cos0.98 難2.39", "s": 0.356, "f": 0}, {"x": 0.96, "y": 2.318, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.96 難2.32", "s": 0.788, "f": 0}, {"x": 0.954, "y": 2.254, "c": "近傍", "n": "ディスコルディア [A]  n=1932 cos0.95 難2.25", "s": 0.664, "f": 0}, {"x": 0.962, "y": 2.531, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [A]  n=2908 cos0.96 難2.53", "s": 1.0, "f": 0}, {"x": 0.965, "y": 2.554, "c": "近傍", "n": "perditus†paradisus [A]  n=2878 cos0.97 難2.55", "s": 0.99, "f": 0}, {"x": 0.981, "y": 2.037, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [L]  n=2757 cos0.98 難2.04", "s": 0.948, "f": 0}, {"x": 0.963, "y": 2.087, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [A]  n=809 cos0.96 難2.09", "s": 0.278, "f": 0}, {"x": 0.957, "y": 2.552, "c": "近傍", "n": "Elemental Creation [A]  n=2833 cos0.96 難2.55", "s": 0.974, "f": 0}, {"x": 0.97, "y": 2.62, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1162 cos0.97 難2.62", "s": 0.4, "f": 0}, {"x": 0.944, "y": 2.254, "c": "近傍", "n": "THE F∀UST [A]  n=2481 cos0.94 難2.25", "s": 0.853, "f": 0}, {"x": 0.956, "y": 2.113, "c": "近傍", "n": "-65℃ [A]  n=2214 cos0.96 難2.11", "s": 0.761, "f": 0}, {"x": 0.945, "y": 2.452, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.94 難2.45", "s": 0.722, "f": 0}, {"x": 0.941, "y": 2.381, "c": "近傍", "n": "LIGHTNING STRIKES [L]  n=1109 cos0.94 難2.38", "s": 0.381, "f": 0}, {"x": 0.969, "y": 2.037, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2354 cos0.97 難2.04", "s": 0.809, "f": 0}, {"x": 0.946, "y": 2.494, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [A]  n=1055 cos0.95 難2.49", "s": 0.363, "f": 0}, {"x": 0.958, "y": 2.07, "c": "近傍", "n": "色を喪った街 [A]  n=619 cos0.96 難2.07", "s": 0.213, "f": 0}, {"x": 0.939, "y": 2.389, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1151 cos0.94 難2.39", "s": 0.396, "f": 0}, {"x": 0.956, "y": 2.59, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [L]  n=1799 cos0.96 難2.59", "s": 0.619, "f": 0}, {"x": 0.94, "y": 2.435, "c": "近傍", "n": "IX [A]  n=2727 cos0.94 難2.43", "s": 0.938, "f": 0}, {"x": 0.937, "y": 2.304, "c": "近傍", "n": "CONTRACT [L]  n=2438 cos0.94 難2.30", "s": 0.838, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39438107041759407}, {"a": 0, "b": 2, "w": 0.23858220376518124}, {"a": 0, "b": 3, "w": 1.5515810858346413e-11}, {"a": 0, "b": 4, "w": 0.2193720189320708}, {"a": 0, "b": 5, "w": 0.2826847486823578}, {"a": 0, "b": 6, "w": 0.47854481283524763}, {"a": 0, "b": 7, "w": 0.2762243338189485}, {"a": 0, "b": 8, "w": 0.11610387903971942}, {"a": 0, "b": 9, "w": 0.3176676980201921}, {"a": 0, "b": 10, "w": 0.11569269028245233}, {"a": 0, "b": 11, "w": 0.21368511924431943}, {"a": 0, "b": 12, "w": 0.11547799324832642}, {"a": 0, "b": 13, "w": 0.06972397673951547}, {"a": 0, "b": 14, "w": 0.12559084580445434}, {"a": 0, "b": 15, "w": 0.09714204044076247}, {"a": 0, "b": 16, "w": 0.20945643191037}, {"a": 0, "b": 17, "w": 0.044081825397545016}, {"a": 0, "b": 18, "w": 0.20748460811065705}, {"a": 0, "b": 19, "w": 0.07215061084465146}, {"a": 0, "b": 20, "w": 0.03532807675338334}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.932,hiX=1.005,loY=1.990,hiY=2.667;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
