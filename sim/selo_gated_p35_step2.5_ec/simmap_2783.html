<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">rage against usual [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.238, "c": "種", "n": "rage against usual [A]  n=3251 cos1.00 難1.24", "s": 0.973, "f": 0}, {"x": 0.974, "y": 1.232, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3284 cos0.97 難1.23", "s": 0.983, "f": 0}, {"x": 0.977, "y": 1.115, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3274 cos0.98 難1.12", "s": 0.98, "f": 0}, {"x": 0.969, "y": 1.16, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3252 cos0.97 難1.16", "s": 0.974, "f": 0}, {"x": 0.972, "y": 1.04, "c": "近傍", "n": "童話回廊 [A]  n=3231 cos0.97 難1.04", "s": 0.967, "f": 0}, {"x": 0.97, "y": 1.394, "c": "近傍", "n": "ANCHOR [A]  n=2994 cos0.97 難1.39", "s": 0.896, "f": 0}, {"x": 0.965, "y": 1.171, "c": "近傍", "n": "Vermilion Carol [A]  n=1653 cos0.97 難1.17", "s": 0.495, "f": 0}, {"x": 0.971, "y": 1.446, "c": "近傍", "n": "ORCA [A]  n=2530 cos0.97 難1.45", "s": 0.757, "f": 0}, {"x": 0.963, "y": 1.234, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3030 cos0.96 難1.23", "s": 0.907, "f": 0}, {"x": 0.964, "y": 1.174, "c": "近傍", "n": "少年は空を辿る [A]  n=3255 cos0.96 難1.17", "s": 0.975, "f": 0}, {"x": 0.97, "y": 1.027, "c": "近傍", "n": "Last Dance [A]  n=3340 cos0.97 難1.03", "s": 1.0, "f": 0}, {"x": 0.965, "y": 1.115, "c": "近傍", "n": "Viridian [A]  n=2633 cos0.96 難1.12", "s": 0.788, "f": 0}, {"x": 0.966, "y": 1.068, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.97 難1.07", "s": 0.961, "f": 0}, {"x": 0.962, "y": 1.178, "c": "近傍", "n": "Smalt #28598F [A]  n=2172 cos0.96 難1.18", "s": 0.65, "f": 0}, {"x": 0.962, "y": 1.329, "c": "近傍", "n": "KILL EACH OTHER [A]  n=3056 cos0.96 難1.33", "s": 0.915, "f": 0}, {"x": 0.963, "y": 1.357, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.96 難1.36", "s": 0.952, "f": 0}, {"x": 0.966, "y": 1.059, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2999 cos0.97 難1.06", "s": 0.898, "f": 0}, {"x": 0.97, "y": 0.978, "c": "近傍", "n": "Meissa [A]  n=2090 cos0.97 難0.98", "s": 0.626, "f": 0}, {"x": 0.969, "y": 1.489, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3218 cos0.97 難1.49", "s": 0.963, "f": 0}, {"x": 0.959, "y": 1.327, "c": "近傍", "n": "EYE OF THE HEAVEN [A]  n=739 cos0.96 難1.33", "s": 0.221, "f": 0}, {"x": 0.959, "y": 1.347, "c": "近傍", "n": "津軽雪 [A]  n=3214 cos0.96 難1.35", "s": 0.962, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.18882934266562534}, {"a": 0, "b": 2, "w": 0.2043306213490731}, {"a": 0, "b": 3, "w": 0.053841555464090085}, {"a": 0, "b": 4, "w": 0.11831912998683125}, {"a": 0, "b": 5, "w": 0.14637841784645766}, {"a": 0, "b": 6, "w": 0.08638876498745163}, {"a": 0, "b": 7, "w": 0.16564519029942915}, {"a": 0, "b": 8, "w": 0.053316752811732204}, {"a": 0, "b": 9, "w": 0.0678929700034635}, {"a": 0, "b": 10, "w": 0.1073294501962494}, {"a": 0, "b": 11, "w": 0.06384035800921539}, {"a": 0, "b": 12, "w": 0.05558537813397846}, {"a": 0, "b": 13, "w": 0.027959553079405786}, {"a": 0, "b": 14, "w": 0.050630840899285934}, {"a": 0, "b": 15, "w": 0.06105325773235515}, {"a": 0, "b": 16, "w": 0.017069769241364052}, {"a": 0, "b": 17, "w": 0.043253144623027096}, {"a": 0, "b": 18, "w": 0.13471774743955112}, {"a": 0, "b": 19, "w": 0.017495446300220596}, {"a": 0, "b": 20, "w": 2.2080670625257426e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.956,hiX=1.003,loY=0.937,hiY=1.530;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
