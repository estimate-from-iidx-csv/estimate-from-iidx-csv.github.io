<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Funky Quirky [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.032, "c": "種", "n": "Funky Quirky [A]  n=519 cos1.00 難0.03", "s": 0.142, "f": 0}, {"x": 0.994, "y": 0.136, "c": "近傍", "n": "XINOBIKILL [A]  n=3450 cos0.99 難0.14", "s": 0.944, "f": 0}, {"x": 0.992, "y": -0.081, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2907 cos0.99 難-0.08", "s": 0.795, "f": 0}, {"x": 0.992, "y": 0.125, "c": "近傍", "n": "voice of echo. [A]  n=814 cos0.99 難0.13", "s": 0.223, "f": 0}, {"x": 0.991, "y": -0.195, "c": "近傍", "n": "ハイ*ビスカス ft. Kanae Asaba [A]  n=3286 cos0.99 難-0.20", "s": 0.899, "f": 0}, {"x": 0.989, "y": 0.107, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos0.99 難0.11", "s": 0.308, "f": 0}, {"x": 0.989, "y": 0.081, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2858 cos0.99 難0.08", "s": 0.782, "f": 0}, {"x": 0.991, "y": -0.226, "c": "近傍", "n": "snow storm [A]  n=3656 cos0.99 難-0.23", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.002, "c": "近傍", "n": "BLO§OM [A]  n=2557 cos0.99 難0.00", "s": 0.699, "f": 0}, {"x": 0.989, "y": 0.231, "c": "近傍", "n": "鬼天 [A]  n=3356 cos0.99 難0.23", "s": 0.918, "f": 0}, {"x": 0.988, "y": -0.057, "c": "近傍", "n": "Rise'n Beauty [A]  n=2870 cos0.99 難-0.06", "s": 0.785, "f": 0}, {"x": 0.989, "y": -0.178, "c": "近傍", "n": "Vermilion [A]  n=3040 cos0.99 難-0.18", "s": 0.832, "f": 0}, {"x": 0.99, "y": 0.298, "c": "近傍", "n": "Dawn Saga [A]  n=2733 cos0.99 難0.30", "s": 0.748, "f": 0}, {"x": 0.987, "y": -0.06, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1102 cos0.99 難-0.06", "s": 0.301, "f": 0}, {"x": 0.987, "y": 0.085, "c": "近傍", "n": "Energy Drive [A]  n=3461 cos0.99 難0.08", "s": 0.947, "f": 0}, {"x": 0.987, "y": -0.059, "c": "近傍", "n": "Back Into The Light [A]  n=3045 cos0.99 難-0.06", "s": 0.833, "f": 0}, {"x": 0.989, "y": -0.253, "c": "近傍", "n": "セピアの軌跡 ft. 天宮みや(少女フラクタル) [A]  n=3071 cos0.99 難-0.25", "s": 0.84, "f": 0}, {"x": 0.988, "y": -0.199, "c": "近傍", "n": "Arcana [A]  n=3097 cos0.99 難-0.20", "s": 0.847, "f": 0}, {"x": 0.988, "y": -0.203, "c": "近傍", "n": "PLASMA [A]  n=2454 cos0.99 難-0.20", "s": 0.671, "f": 0}, {"x": 0.986, "y": -0.032, "c": "近傍", "n": "PopなEDEN [A]  n=1556 cos0.99 難-0.03", "s": 0.426, "f": 0}, {"x": 0.986, "y": -0.02, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2795 cos0.99 難-0.02", "s": 0.764, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36284573465234427}, {"a": 0, "b": 2, "w": 0.27551392036888356}, {"a": 0, "b": 3, "w": 0.3541329673278226}, {"a": 0, "b": 4, "w": 0.31704469217499887}, {"a": 0, "b": 5, "w": 0.29175889646324127}, {"a": 0, "b": 6, "w": 0.35171500196426786}, {"a": 0, "b": 7, "w": 0.3996004415244738}, {"a": 0, "b": 8, "w": 0.30577621159870993}, {"a": 0, "b": 9, "w": 0.3237272462072922}, {"a": 0, "b": 10, "w": 3.7342573477872065e-11}, {"a": 0, "b": 11, "w": 0.2121904653407657}, {"a": 0, "b": 12, "w": 0.24364158978361772}, {"a": 0, "b": 13, "w": 0.30250862113876087}, {"a": 0, "b": 14, "w": 0.30925721174448817}, {"a": 0, "b": 15, "w": 0.0017331968476238524}, {"a": 0, "b": 16, "w": 0.3510063701007734}, {"a": 0, "b": 17, "w": 0.22158189701917097}, {"a": 0, "b": 18, "w": 0.0632987669139281}, {"a": 0, "b": 19, "w": 0.24700300107707485}, {"a": 0, "b": 20, "w": 0.06651042216454917}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.297,hiY=0.342;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
