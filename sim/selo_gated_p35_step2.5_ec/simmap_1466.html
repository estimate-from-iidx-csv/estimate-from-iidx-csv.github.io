<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Proof of the existence [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.333, "c": "種", "n": "Proof of the existence [H]  n=2878 cos1.00 難-0.33", "s": 0.82, "f": 0}, {"x": 0.998, "y": -0.407, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos1.00 難-0.41", "s": 0.725, "f": 0}, {"x": 0.997, "y": -0.299, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos1.00 難-0.30", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.355, "c": "近傍", "n": "ZZ [H]  n=3341 cos1.00 難-0.36", "s": 0.952, "f": 0}, {"x": 0.996, "y": -0.315, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos1.00 難-0.31", "s": 0.742, "f": 0}, {"x": 0.996, "y": -0.245, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos1.00 難-0.25", "s": 0.708, "f": 0}, {"x": 0.995, "y": -0.31, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos1.00 難-0.31", "s": 0.93, "f": 0}, {"x": 0.996, "y": -0.244, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos1.00 難-0.24", "s": 0.789, "f": 0}, {"x": 0.995, "y": -0.314, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.31", "s": 0.604, "f": 0}, {"x": 0.995, "y": -0.251, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.25", "s": 0.677, "f": 0}, {"x": 0.995, "y": -0.28, "c": "近傍", "n": "Arabian Rave Night [H]  n=2709 cos1.00 難-0.28", "s": 0.772, "f": 0}, {"x": 0.995, "y": -0.39, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos0.99 難-0.39", "s": 0.731, "f": 0}, {"x": 0.994, "y": -0.338, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.34", "s": 0.805, "f": 0}, {"x": 0.995, "y": -0.203, "c": "近傍", "n": "楽園追放 [A]  n=1689 cos1.00 難-0.20", "s": 0.481, "f": 0}, {"x": 0.994, "y": -0.411, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.41", "s": 0.851, "f": 0}, {"x": 0.994, "y": -0.251, "c": "近傍", "n": "異心前進♪ぴょんぴょんぴょん [A]  n=1538 cos0.99 難-0.25", "s": 0.438, "f": 0}, {"x": 0.998, "y": -0.136, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos1.00 難-0.14", "s": 0.868, "f": 0}, {"x": 0.997, "y": -0.144, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos1.00 難-0.14", "s": 0.891, "f": 0}, {"x": 0.993, "y": -0.317, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1729 cos0.99 難-0.32", "s": 0.493, "f": 0}, {"x": 0.997, "y": -0.143, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos1.00 難-0.14", "s": 0.673, "f": 0}, {"x": 0.995, "y": -0.186, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2548 cos1.00 難-0.19", "s": 0.726, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6477187843050327}, {"a": 0, "b": 2, "w": 0.3826655545248968}, {"a": 0, "b": 3, "w": 0.3257627432609622}, {"a": 0, "b": 4, "w": 0.365083296233217}, {"a": 0, "b": 5, "w": 0.3903816695080088}, {"a": 0, "b": 6, "w": 0.3604992770354821}, {"a": 0, "b": 7, "w": 0.33917652918172536}, {"a": 0, "b": 8, "w": 0.37797126556198235}, {"a": 0, "b": 9, "w": 0.40739933987747234}, {"a": 0, "b": 10, "w": 0.2560826280813401}, {"a": 0, "b": 11, "w": 0.3569503305718503}, {"a": 0, "b": 12, "w": 0.34340240081224027}, {"a": 0, "b": 13, "w": 0.31425070267776534}, {"a": 0, "b": 14, "w": 0.31928677677019723}, {"a": 0, "b": 15, "w": 0.288741942905437}, {"a": 0, "b": 16, "w": 0.5058900721979686}, {"a": 0, "b": 17, "w": 0.5297605898007889}, {"a": 0, "b": 18, "w": 0.1935675052746233}, {"a": 0, "b": 19, "w": 0.48340836934150666}, {"a": 0, "b": 20, "w": 6.022415899309408e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.433,hiY=-0.114;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
