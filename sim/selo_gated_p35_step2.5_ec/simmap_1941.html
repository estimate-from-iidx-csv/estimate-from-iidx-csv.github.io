<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Jungle Eater [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.363, "c": "種", "n": "Jungle Eater [A]  n=2411 cos1.00 難0.36", "s": 0.649, "f": 0}, {"x": 0.997, "y": 0.405, "c": "近傍", "n": "Ritual of Anubis [A]  n=2272 cos1.00 難0.40", "s": 0.611, "f": 0}, {"x": 0.996, "y": 0.28, "c": "近傍", "n": "Xyndrome [A]  n=2511 cos1.00 難0.28", "s": 0.676, "f": 0}, {"x": 0.997, "y": 0.244, "c": "近傍", "n": "Wonderland [A]  n=3133 cos1.00 難0.24", "s": 0.843, "f": 0}, {"x": 0.995, "y": 0.375, "c": "近傍", "n": "See You Again [A]  n=1074 cos1.00 難0.38", "s": 0.289, "f": 0}, {"x": 0.995, "y": 0.316, "c": "近傍", "n": "STARLiGHT [A]  n=3187 cos0.99 難0.32", "s": 0.857, "f": 0}, {"x": 0.995, "y": 0.467, "c": "近傍", "n": "invoker [A]  n=3717 cos1.00 難0.47", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.398, "c": "近傍", "n": "ここからよろしく大作戦143 [L]  n=874 cos0.99 難0.40", "s": 0.235, "f": 0}, {"x": 0.995, "y": 0.456, "c": "近傍", "n": "smooooch・∀・ [L]  n=1442 cos0.99 難0.46", "s": 0.388, "f": 0}, {"x": 0.994, "y": 0.306, "c": "近傍", "n": "MAGIC & LOVE [A]  n=3382 cos0.99 難0.31", "s": 0.91, "f": 0}, {"x": 0.993, "y": 0.32, "c": "近傍", "n": "THE DETONATOR [A]  n=3237 cos0.99 難0.32", "s": 0.871, "f": 0}, {"x": 0.993, "y": 0.301, "c": "近傍", "n": "Cleopatrysm [A]  n=3255 cos0.99 難0.30", "s": 0.876, "f": 0}, {"x": 0.995, "y": 0.215, "c": "近傍", "n": "ATHER [A]  n=3422 cos0.99 難0.22", "s": 0.921, "f": 0}, {"x": 0.993, "y": 0.288, "c": "近傍", "n": "Outbreak [A]  n=3389 cos0.99 難0.29", "s": 0.912, "f": 0}, {"x": 0.992, "y": 0.373, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3114 cos0.99 難0.37", "s": 0.838, "f": 0}, {"x": 0.997, "y": 0.136, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1675 cos1.00 難0.14", "s": 0.451, "f": 0}, {"x": 0.992, "y": 0.275, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos0.99 難0.27", "s": 0.337, "f": 0}, {"x": 0.991, "y": 0.385, "c": "近傍", "n": "Time to Air [A]  n=3600 cos0.99 難0.39", "s": 0.969, "f": 0}, {"x": 0.992, "y": 0.261, "c": "近傍", "n": "命の標本 [A]  n=3125 cos0.99 難0.26", "s": 0.841, "f": 0}, {"x": 0.996, "y": 0.132, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1935 cos1.00 難0.13", "s": 0.521, "f": 0}, {"x": 0.992, "y": 0.433, "c": "近傍", "n": "VOX UP [H]  n=3235 cos0.99 難0.43", "s": 0.87, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47509240160637833}, {"a": 0, "b": 2, "w": 0.15503703713562678}, {"a": 0, "b": 3, "w": 0.30664025035957876}, {"a": 0, "b": 4, "w": 0.35264203957384843}, {"a": 0, "b": 5, "w": 0.31982795301359657}, {"a": 0, "b": 6, "w": 0.24557301053516611}, {"a": 0, "b": 7, "w": 0.29563137283037677}, {"a": 0, "b": 8, "w": 0.29801232555717894}, {"a": 0, "b": 9, "w": 0.16670286782479593}, {"a": 0, "b": 10, "w": 0.21811527895225136}, {"a": 0, "b": 11, "w": 0.063192521690557}, {"a": 0, "b": 12, "w": 0.28743535296627176}, {"a": 0, "b": 13, "w": 0.08561950783363914}, {"a": 0, "b": 14, "w": 0.1661696490134934}, {"a": 0, "b": 15, "w": 0.38352833597111}, {"a": 0, "b": 16, "w": 0.12628628348313098}, {"a": 0, "b": 17, "w": 5.360156762890256e-11}, {"a": 0, "b": 18, "w": 0.11917062475320483}, {"a": 0, "b": 19, "w": 0.3527812536012247}, {"a": 0, "b": 20, "w": 0.10189025954284447}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.105,hiY=0.494;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
