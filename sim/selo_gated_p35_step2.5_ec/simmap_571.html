<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">This Is Club Musik feat. 大久保紅葉 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.971, "c": "種", "n": "This Is Club Musik feat. 大久保紅葉 [H]  n=472 cos1.00 難-1.97", "s": 0.373, "f": 0}, {"x": 0.994, "y": -1.977, "c": "近傍", "n": "Neo Heritage [H]  n=804 cos0.99 難-1.98", "s": 0.635, "f": 0}, {"x": 0.991, "y": -1.98, "c": "近傍", "n": "Lovely Howdy Cowboy!! [H]  n=780 cos0.99 難-1.98", "s": 0.616, "f": 0}, {"x": 0.992, "y": -1.946, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.99 難-1.95", "s": 0.476, "f": 0}, {"x": 0.991, "y": -1.978, "c": "近傍", "n": "《GRANDMASTER》 [H]  n=690 cos0.99 難-1.98", "s": 0.545, "f": 0}, {"x": 0.992, "y": -1.922, "c": "近傍", "n": "Burning Flame [H]  n=852 cos0.99 難-1.92", "s": 0.673, "f": 0}, {"x": 0.993, "y": -1.919, "c": "近傍", "n": "Ypsilon [H]  n=1065 cos0.99 難-1.92", "s": 0.841, "f": 0}, {"x": 0.988, "y": -1.995, "c": "近傍", "n": "SOLID WYVERN [H]  n=700 cos0.99 難-1.99", "s": 0.553, "f": 0}, {"x": 0.99, "y": -1.923, "c": "近傍", "n": "乱膳の舞姫 [H]  n=771 cos0.99 難-1.92", "s": 0.609, "f": 0}, {"x": 0.987, "y": -1.981, "c": "近傍", "n": "Mukade [H]  n=508 cos0.99 難-1.98", "s": 0.401, "f": 0}, {"x": 0.993, "y": -1.889, "c": "近傍", "n": "Rosa azuL [H]  n=628 cos0.99 難-1.89", "s": 0.496, "f": 0}, {"x": 0.985, "y": -1.975, "c": "近傍", "n": "狂水一華 [H]  n=1018 cos0.98 難-1.98", "s": 0.804, "f": 0}, {"x": 0.994, "y": -2.061, "c": "近傍", "n": "THE TIME MACHINE [H]  n=708 cos0.99 難-2.06", "s": 0.559, "f": 0}, {"x": 0.985, "y": -1.933, "c": "近傍", "n": "GIGA RAID [H]  n=900 cos0.99 難-1.93", "s": 0.711, "f": 0}, {"x": 0.984, "y": -1.943, "c": "近傍", "n": "Nasty Techniques [H]  n=1266 cos0.98 難-1.94", "s": 1.0, "f": 0}, {"x": 0.984, "y": -1.937, "c": "近傍", "n": "STOIC HYPOTHESIS [H]  n=998 cos0.98 難-1.94", "s": 0.788, "f": 0}, {"x": 0.983, "y": -1.953, "c": "近傍", "n": "MA・TSU・RI [H]  n=527 cos0.98 難-1.95", "s": 0.416, "f": 0}, {"x": 0.982, "y": -1.937, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [H]  n=984 cos0.98 難-1.94", "s": 0.777, "f": 0}, {"x": 0.988, "y": -2.073, "c": "近傍", "n": "FINALLY BLAZE [H]  n=854 cos0.99 難-2.07", "s": 0.675, "f": 0}, {"x": 0.982, "y": -1.919, "c": "近傍", "n": "ハイテックトキオ [H]  n=1060 cos0.98 難-1.92", "s": 0.837, "f": 0}, {"x": 0.981, "y": -1.918, "c": "近傍", "n": "Nocturnal 2097 [H]  n=720 cos0.98 難-1.92", "s": 0.569, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2869154238479783}, {"a": 0, "b": 2, "w": 0.3149637945766355}, {"a": 0, "b": 3, "w": 0.29133976975715636}, {"a": 0, "b": 4, "w": 0.31215870500399845}, {"a": 0, "b": 5, "w": 0.372770856344514}, {"a": 0, "b": 6, "w": 0.25717569062427603}, {"a": 0, "b": 7, "w": 0.23569274647129146}, {"a": 0, "b": 8, "w": 0.28959559463405826}, {"a": 0, "b": 9, "w": 0.16293273446083}, {"a": 0, "b": 10, "w": 0.34087539488672225}, {"a": 0, "b": 11, "w": 0.02655431557014032}, {"a": 0, "b": 12, "w": 0.40229113811816786}, {"a": 0, "b": 13, "w": 0.11561575090968224}, {"a": 0, "b": 14, "w": 5.0389470374057055e-11}, {"a": 0, "b": 15, "w": 0.038990681917502656}, {"a": 0, "b": 16, "w": 0.057530536302545565}, {"a": 0, "b": 17, "w": 0.03625244333553601}, {"a": 0, "b": 18, "w": 0.23730712372130658}, {"a": 0, "b": 19, "w": 0.052660439476619914}, {"a": 0, "b": 20, "w": 0.022931697657434746}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-2.087,hiY=-1.874;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
