<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">TRANOID [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.198, "c": "種", "n": "TRANOID [H]  n=2312 cos1.00 難-0.20", "s": 0.659, "f": 0}, {"x": 0.994, "y": -0.258, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.26", "s": 0.89, "f": 0}, {"x": 0.995, "y": -0.31, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos1.00 難-0.31", "s": 0.93, "f": 0}, {"x": 0.993, "y": -0.239, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.24", "s": 0.928, "f": 0}, {"x": 0.995, "y": -0.321, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.99 難-0.32", "s": 0.759, "f": 0}, {"x": 0.993, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.99 難-0.26", "s": 0.746, "f": 0}, {"x": 0.992, "y": -0.25, "c": "近傍", "n": "CONTRACT [H]  n=2804 cos0.99 難-0.25", "s": 0.799, "f": 0}, {"x": 0.991, "y": -0.179, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.18", "s": 0.942, "f": 0}, {"x": 0.991, "y": -0.133, "c": "近傍", "n": "dual control [A]  n=2202 cos0.99 難-0.13", "s": 0.628, "f": 0}, {"x": 0.991, "y": -0.146, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.99 難-0.15", "s": 0.886, "f": 0}, {"x": 0.992, "y": -0.299, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos0.99 難-0.30", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.298, "c": "近傍", "n": "Ubertreffen [H]  n=3087 cos0.99 難-0.30", "s": 0.88, "f": 0}, {"x": 0.99, "y": -0.203, "c": "近傍", "n": "LOVE B.B.B [A]  n=3198 cos0.99 難-0.20", "s": 0.911, "f": 0}, {"x": 0.99, "y": -0.235, "c": "近傍", "n": "A [H]  n=3015 cos0.99 難-0.23", "s": 0.859, "f": 0}, {"x": 0.99, "y": -0.182, "c": "近傍", "n": "ICARUS [H]  n=3028 cos0.99 難-0.18", "s": 0.863, "f": 0}, {"x": 0.99, "y": -0.244, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.24", "s": 0.789, "f": 0}, {"x": 0.993, "y": -0.392, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3252 cos0.99 難-0.39", "s": 0.927, "f": 0}, {"x": 0.99, "y": -0.174, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos0.99 難-0.17", "s": 0.877, "f": 0}, {"x": 0.991, "y": -0.314, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.31", "s": 0.604, "f": 0}, {"x": 0.989, "y": -0.175, "c": "近傍", "n": "Silvia Drive [A]  n=2194 cos0.99 難-0.18", "s": 0.625, "f": 0}, {"x": 0.994, "y": -0.418, "c": "近傍", "n": "疾風迅雷 [H]  n=2797 cos0.99 難-0.42", "s": 0.797, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3489951201121936}, {"a": 0, "b": 2, "w": 0.4242244937738624}, {"a": 0, "b": 3, "w": 0.30591439389092523}, {"a": 0, "b": 4, "w": 0.37184076838991365}, {"a": 0, "b": 5, "w": 0.2655057736337383}, {"a": 0, "b": 6, "w": 0.26161490045903424}, {"a": 0, "b": 7, "w": 0.19987324431449716}, {"a": 0, "b": 8, "w": 0.21811520653432026}, {"a": 0, "b": 9, "w": 0.037271515260360655}, {"a": 0, "b": 10, "w": 0.060680046385573894}, {"a": 0, "b": 11, "w": 0.19450961836293246}, {"a": 0, "b": 12, "w": 0.02538738601540569}, {"a": 0, "b": 13, "w": 0.1446597114145729}, {"a": 0, "b": 14, "w": 0.07544788849150097}, {"a": 0, "b": 15, "w": 5.58293411501154e-11}, {"a": 0, "b": 16, "w": 0.18581037249226262}, {"a": 0, "b": 17, "w": 0.10562763037126777}, {"a": 0, "b": 18, "w": 0.1395088989963975}, {"a": 0, "b": 19, "w": 0.12841109292363506}, {"a": 0, "b": 20, "w": 0.30546963780070713}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.441,hiY=-0.110;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
