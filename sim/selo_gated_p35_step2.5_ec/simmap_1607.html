<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">キャトられ恋はモ～モク [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.301, "c": "種", "n": "キャトられ恋はモ～モク [H]  n=3046 cos1.00 難-0.30", "s": 0.816, "f": 0}, {"x": 0.995, "y": -0.28, "c": "近傍", "n": "Arabian Rave Night [H]  n=2709 cos1.00 難-0.28", "s": 0.726, "f": 0}, {"x": 0.994, "y": -0.147, "c": "近傍", "n": "Candy Galy [H]  n=2910 cos0.99 難-0.15", "s": 0.78, "f": 0}, {"x": 0.99, "y": -0.165, "c": "近傍", "n": "EXUSIA [H]  n=2983 cos0.99 難-0.17", "s": 0.799, "f": 0}, {"x": 0.989, "y": -0.186, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2548 cos0.99 難-0.19", "s": 0.683, "f": 0}, {"x": 0.988, "y": -0.166, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.99 難-0.17", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.194, "c": "近傍", "n": "oratio [H]  n=2403 cos0.99 難-0.19", "s": 0.644, "f": 0}, {"x": 0.992, "y": -0.025, "c": "近傍", "n": "ANDROMEDA II [A]  n=3026 cos0.99 難-0.02", "s": 0.811, "f": 0}, {"x": 0.987, "y": -0.314, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.31", "s": 0.568, "f": 0}, {"x": 0.988, "y": -0.136, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3181 cos0.99 難-0.14", "s": 0.852, "f": 0}, {"x": 0.987, "y": -0.407, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos0.99 難-0.41", "s": 0.681, "f": 0}, {"x": 0.987, "y": -0.224, "c": "近傍", "n": "Aurora [H]  n=3070 cos0.99 難-0.22", "s": 0.822, "f": 0}, {"x": 0.987, "y": -0.346, "c": "近傍", "n": "GAIA [H]  n=2878 cos0.99 難-0.35", "s": 0.771, "f": 0}, {"x": 0.988, "y": -0.14, "c": "近傍", "n": "Queen's Tragedy [A]  n=3243 cos0.99 難-0.14", "s": 0.869, "f": 0}, {"x": 0.987, "y": -0.333, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos0.99 難-0.33", "s": 0.771, "f": 0}, {"x": 0.99, "y": -0.56, "c": "近傍", "n": "シムルグの目醒め [H]  n=2325 cos0.99 難-0.56", "s": 0.623, "f": 0}, {"x": 0.986, "y": -0.267, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2475 cos0.99 難-0.27", "s": 0.663, "f": 0}, {"x": 0.987, "y": -0.476, "c": "近傍", "n": "Quakes [H]  n=1955 cos0.99 難-0.48", "s": 0.524, "f": 0}, {"x": 0.987, "y": -0.124, "c": "近傍", "n": "Lucky Days [A]  n=2965 cos0.99 難-0.12", "s": 0.794, "f": 0}, {"x": 0.987, "y": -0.114, "c": "近傍", "n": "GENOCIDE [H]  n=2573 cos0.99 難-0.11", "s": 0.689, "f": 0}, {"x": 0.986, "y": -0.284, "c": "近傍", "n": "Confiserie [H]  n=3060 cos0.99 難-0.28", "s": 0.82, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4531667087739186}, {"a": 0, "b": 2, "w": 0.5002078735102379}, {"a": 0, "b": 3, "w": 0.3645065008618713}, {"a": 0, "b": 4, "w": 0.3395164591490507}, {"a": 0, "b": 5, "w": 0.21609524993731932}, {"a": 0, "b": 6, "w": 3.678723992095456e-11}, {"a": 0, "b": 7, "w": 0.25601367505324013}, {"a": 0, "b": 8, "w": 0.08076146460438816}, {"a": 0, "b": 9, "w": 0.11649302064241818}, {"a": 0, "b": 10, "w": 0.10939721717135975}, {"a": 0, "b": 11, "w": 0.2923220955887753}, {"a": 0, "b": 12, "w": 0.1939427942315295}, {"a": 0, "b": 13, "w": 0.08231616664332941}, {"a": 0, "b": 14, "w": 0.10463937353475139}, {"a": 0, "b": 15, "w": 0.2245864307585672}, {"a": 0, "b": 16, "w": 0.18698487792565133}, {"a": 0, "b": 17, "w": 0.30542329649884437}, {"a": 0, "b": 18, "w": 0.13652412219248888}, {"a": 0, "b": 19, "w": 0.20860460045291673}, {"a": 0, "b": 20, "w": 0.25759005775307}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.602,hiY=0.018;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
