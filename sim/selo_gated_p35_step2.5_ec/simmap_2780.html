<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">quaver♪ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.407, "c": "種", "n": "quaver♪ [A]  n=3248 cos1.00 難1.41", "s": 1.0, "f": 0}, {"x": 0.994, "y": 1.436, "c": "近傍", "n": "Ubertreffen [L]  n=2820 cos0.99 難1.44", "s": 0.868, "f": 0}, {"x": 0.992, "y": 1.402, "c": "近傍", "n": "ΕΛΠΙΣ [L]  n=2217 cos0.99 難1.40", "s": 0.683, "f": 0}, {"x": 0.992, "y": 1.447, "c": "近傍", "n": "SYNC-ANTHEM [A]  n=3166 cos0.99 難1.45", "s": 0.975, "f": 0}, {"x": 0.99, "y": 1.39, "c": "近傍", "n": "neu [A]  n=3247 cos0.99 難1.39", "s": 1.0, "f": 0}, {"x": 0.99, "y": 1.439, "c": "近傍", "n": "Resonant [A]  n=1284 cos0.99 難1.44", "s": 0.395, "f": 0}, {"x": 0.99, "y": 1.375, "c": "近傍", "n": "抱きしめてモナムール [A]  n=2919 cos0.99 難1.38", "s": 0.899, "f": 0}, {"x": 0.992, "y": 1.327, "c": "近傍", "n": "THANK YOU FOR PLAYING [L]  n=2944 cos0.99 難1.33", "s": 0.906, "f": 0}, {"x": 0.987, "y": 1.446, "c": "近傍", "n": "ORCA [A]  n=2530 cos0.99 難1.45", "s": 0.779, "f": 0}, {"x": 0.99, "y": 1.482, "c": "近傍", "n": "DORNWALD ～Junge～ [A]  n=3068 cos0.99 難1.48", "s": 0.945, "f": 0}, {"x": 0.985, "y": 1.394, "c": "近傍", "n": "ANCHOR [A]  n=2994 cos0.99 難1.39", "s": 0.922, "f": 0}, {"x": 0.989, "y": 1.489, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3218 cos0.99 難1.49", "s": 0.991, "f": 0}, {"x": 0.984, "y": 1.421, "c": "近傍", "n": "Bad Maniacs [A]  n=3239 cos0.98 難1.42", "s": 0.997, "f": 0}, {"x": 0.987, "y": 1.331, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3075 cos0.99 難1.33", "s": 0.947, "f": 0}, {"x": 0.985, "y": 1.347, "c": "近傍", "n": "津軽雪 [A]  n=3214 cos0.99 難1.35", "s": 0.99, "f": 0}, {"x": 0.987, "y": 1.327, "c": "近傍", "n": "EYE OF THE HEAVEN [A]  n=739 cos0.99 難1.33", "s": 0.228, "f": 0}, {"x": 0.983, "y": 1.416, "c": "近傍", "n": "GUILTY [L]  n=1226 cos0.98 難1.42", "s": 0.377, "f": 0}, {"x": 0.986, "y": 1.336, "c": "近傍", "n": "Super Duper Racers [L]  n=731 cos0.99 難1.34", "s": 0.225, "f": 0}, {"x": 0.982, "y": 1.4, "c": "近傍", "n": "Illusionary Waterlily [A]  n=3023 cos0.98 難1.40", "s": 0.931, "f": 0}, {"x": 0.994, "y": 1.529, "c": "近傍", "n": "ぞうしょく！？マイデンティティ [A]  n=1648 cos0.99 難1.53", "s": 0.507, "f": 0}, {"x": 0.983, "y": 1.357, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.98 難1.36", "s": 0.979, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.41475029218273174}, {"a": 0, "b": 2, "w": 0.2967294578620324}, {"a": 0, "b": 3, "w": 0.31235476175331645}, {"a": 0, "b": 4, "w": 0.24152877638340353}, {"a": 0, "b": 5, "w": 0.2519755732630756}, {"a": 0, "b": 6, "w": 0.20123562384048643}, {"a": 0, "b": 7, "w": 0.18490529969601543}, {"a": 0, "b": 8, "w": 0.14490732768504222}, {"a": 0, "b": 9, "w": 0.22574409775875992}, {"a": 0, "b": 10, "w": 0.08731499478542093}, {"a": 0, "b": 11, "w": 0.22402558072429823}, {"a": 0, "b": 12, "w": 0.06285510615920398}, {"a": 0, "b": 13, "w": 0.08733747675706582}, {"a": 0, "b": 14, "w": 0.07227928774130543}, {"a": 0, "b": 15, "w": 0.15046536400538868}, {"a": 0, "b": 16, "w": 3.435185469413682e-11}, {"a": 0, "b": 17, "w": 0.10608060787292062}, {"a": 0, "b": 18, "w": 0.0096527341834447}, {"a": 0, "b": 19, "w": 0.4159821912774323}, {"a": 0, "b": 20, "w": 0.022497304504366822}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=1.311,hiY=1.545;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
