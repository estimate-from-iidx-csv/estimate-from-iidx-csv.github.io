<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">FLARE -炎舞- ft.Nana Takahashi [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.145, "c": "種", "n": "FLARE -炎舞- ft.Nana Takahashi [A]  n=1506 cos1.00 難-0.15", "s": 0.408, "f": 0}, {"x": 0.996, "y": -0.281, "c": "近傍", "n": "Psychedelic Intelligence [A]  n=873 cos1.00 難-0.28", "s": 0.237, "f": 0}, {"x": 0.995, "y": -0.195, "c": "近傍", "n": "ZEROIN ON THE LIGHT [A]  n=1589 cos0.99 難-0.20", "s": 0.431, "f": 0}, {"x": 0.995, "y": -0.194, "c": "近傍", "n": "Turii ～Panta rhei～ [A]  n=3426 cos0.99 難-0.19", "s": 0.928, "f": 0}, {"x": 0.995, "y": -0.002, "c": "近傍", "n": "ANAGMA [A]  n=2588 cos1.00 難-0.00", "s": 0.701, "f": 0}, {"x": 0.994, "y": -0.251, "c": "近傍", "n": "Fading Stars [A]  n=1793 cos0.99 難-0.25", "s": 0.486, "f": 0}, {"x": 0.994, "y": -0.095, "c": "近傍", "n": "1001 -ESCAPE- [A]  n=3068 cos0.99 難-0.10", "s": 0.831, "f": 0}, {"x": 0.994, "y": -0.267, "c": "近傍", "n": "煉獄のエルフェリア [H]  n=3107 cos0.99 難-0.27", "s": 0.842, "f": 0}, {"x": 0.994, "y": -0.295, "c": "近傍", "n": "Nyan Nyan University [A]  n=1120 cos0.99 難-0.29", "s": 0.303, "f": 0}, {"x": 0.996, "y": 0.125, "c": "近傍", "n": "夢縁 [A]  n=1910 cos1.00 難0.12", "s": 0.517, "f": 0}, {"x": 0.992, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3210 cos0.99 難-0.18", "s": 0.87, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos0.99 難-0.23", "s": 0.813, "f": 0}, {"x": 0.994, "y": 0.054, "c": "近傍", "n": "ミラージュ・レジデンス [A]  n=2809 cos0.99 難0.05", "s": 0.761, "f": 0}, {"x": 0.993, "y": -0.032, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos0.99 難-0.03", "s": 0.877, "f": 0}, {"x": 0.993, "y": 0.028, "c": "近傍", "n": "超!!遠距離らぶメ～ル [A]  n=2979 cos0.99 難0.03", "s": 0.807, "f": 0}, {"x": 0.992, "y": -0.286, "c": "近傍", "n": "アルストロメリア [A]  n=3691 cos0.99 難-0.29", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.193, "c": "近傍", "n": "8bit Princess [A]  n=3429 cos0.99 難-0.19", "s": 0.929, "f": 0}, {"x": 0.993, "y": 0.059, "c": "近傍", "n": "Danza Aestas [A]  n=2310 cos0.99 難0.06", "s": 0.626, "f": 0}, {"x": 0.993, "y": 0.076, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [A]  n=2938 cos0.99 難0.08", "s": 0.796, "f": 0}, {"x": 0.993, "y": 0.074, "c": "近傍", "n": "Go Faraway [A]  n=2755 cos0.99 難0.07", "s": 0.746, "f": 0}, {"x": 0.993, "y": 0.065, "c": "近傍", "n": "狂水一華 [A]  n=2793 cos0.99 難0.06", "s": 0.757, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3638782028928854}, {"a": 0, "b": 2, "w": 0.3179216740060581}, {"a": 0, "b": 3, "w": 0.3077931202761893}, {"a": 0, "b": 4, "w": 0.36891834202027307}, {"a": 0, "b": 5, "w": 0.323060131985514}, {"a": 0, "b": 6, "w": 0.27638261593104096}, {"a": 0, "b": 7, "w": 0.2985372850415211}, {"a": 0, "b": 8, "w": 0.3204658647577864}, {"a": 0, "b": 9, "w": 0.23494107479311477}, {"a": 0, "b": 10, "w": 5.7403526376731406e-11}, {"a": 0, "b": 11, "w": 0.13628123344539322}, {"a": 0, "b": 12, "w": 0.2892941867539244}, {"a": 0, "b": 13, "w": 0.22026649234394025}, {"a": 0, "b": 14, "w": 0.1919723949334048}, {"a": 0, "b": 15, "w": 0.030832623570846485}, {"a": 0, "b": 16, "w": 0.14504036911114282}, {"a": 0, "b": 17, "w": 0.2446922651473551}, {"a": 0, "b": 18, "w": 0.15489292264381116}, {"a": 0, "b": 19, "w": 0.19867888352697016}, {"a": 0, "b": 20, "w": 0.21468969426327722}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.328,hiY=0.158;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
