<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">華蝶風雪 [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.978, "c": "種", "n": "華蝶風雪 [L]  n=1465 cos1.00 難0.98", "s": 0.414, "f": 0}, {"x": 0.996, "y": 0.866, "c": "近傍", "n": "DARK LEGACY [A]  n=3462 cos1.00 難0.87", "s": 0.979, "f": 0}, {"x": 0.982, "y": 1.059, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [A]  n=3487 cos0.98 難1.06", "s": 0.986, "f": 0}, {"x": 0.98, "y": 1.031, "c": "近傍", "n": "Rave Patroller [A]  n=2943 cos0.98 難1.03", "s": 0.832, "f": 0}, {"x": 0.976, "y": 0.949, "c": "近傍", "n": "King of Tribe [A]  n=594 cos0.98 難0.95", "s": 0.168, "f": 0}, {"x": 0.978, "y": 1.055, "c": "近傍", "n": "cinder [A]  n=3236 cos0.98 難1.06", "s": 0.915, "f": 0}, {"x": 0.976, "y": 1.009, "c": "近傍", "n": "thunder HOUSE NATION Remix [L]  n=2570 cos0.98 難1.01", "s": 0.727, "f": 0}, {"x": 0.99, "y": 0.814, "c": "近傍", "n": "Beat Radiance [L]  n=3485 cos0.99 難0.81", "s": 0.986, "f": 0}, {"x": 0.976, "y": 0.92, "c": "近傍", "n": "No Border [A]  n=2261 cos0.98 難0.92", "s": 0.639, "f": 0}, {"x": 0.978, "y": 1.059, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2999 cos0.98 難1.06", "s": 0.848, "f": 0}, {"x": 0.974, "y": 0.939, "c": "近傍", "n": "Nothing but Theory [L]  n=1124 cos0.97 難0.94", "s": 0.318, "f": 0}, {"x": 0.974, "y": 1.016, "c": "近傍", "n": "innocent revolver [A]  n=2544 cos0.97 難1.02", "s": 0.719, "f": 0}, {"x": 0.974, "y": 1.02, "c": "近傍", "n": "Vinculum stellarum [A]  n=2772 cos0.97 難1.02", "s": 0.784, "f": 0}, {"x": 0.974, "y": 1.042, "c": "近傍", "n": "Ypsilon [L]  n=2342 cos0.97 難1.04", "s": 0.662, "f": 0}, {"x": 0.974, "y": 0.899, "c": "近傍", "n": "Valanga [A]  n=3501 cos0.97 難0.90", "s": 0.99, "f": 0}, {"x": 0.971, "y": 0.915, "c": "近傍", "n": "Super Rush [A]  n=3502 cos0.97 難0.92", "s": 0.99, "f": 0}, {"x": 0.97, "y": 0.962, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3387 cos0.97 難0.96", "s": 0.958, "f": 0}, {"x": 0.988, "y": 1.181, "c": "近傍", "n": "rommmo [A]  n=2584 cos0.99 難1.18", "s": 0.731, "f": 0}, {"x": 0.972, "y": 0.884, "c": "近傍", "n": "GOLDEN CROSS [A]  n=3536 cos0.97 難0.88", "s": 1.0, "f": 0}, {"x": 0.97, "y": 0.928, "c": "近傍", "n": "WONDER WALKER [A]  n=3501 cos0.97 難0.93", "s": 0.99, "f": 0}, {"x": 0.982, "y": 0.796, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3433 cos0.98 難0.80", "s": 0.971, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5203346897556693}, {"a": 0, "b": 2, "w": 0.2768436135057931}, {"a": 0, "b": 3, "w": 0.019095919289597307}, {"a": 0, "b": 4, "w": 0.003248907370424381}, {"a": 0, "b": 5, "w": 0.09720472129658297}, {"a": 0, "b": 6, "w": 0.16281424393795096}, {"a": 0, "b": 7, "w": 0.47258288310606367}, {"a": 0, "b": 8, "w": 0.1061220424135404}, {"a": 0, "b": 9, "w": 0.030350824925334807}, {"a": 0, "b": 10, "w": 0.11069329202969158}, {"a": 0, "b": 11, "w": 0.12356691890760774}, {"a": 0, "b": 12, "w": 0.11462490108679257}, {"a": 0, "b": 13, "w": 0.07217181831027464}, {"a": 0, "b": 14, "w": 0.08554113830457466}, {"a": 0, "b": 15, "w": 0.05294055021544308}, {"a": 0, "b": 16, "w": 2.3519852732079016e-11}, {"a": 0, "b": 17, "w": 0.33548432775673276}, {"a": 0, "b": 18, "w": 0.06252628537839588}, {"a": 0, "b": 19, "w": 0.04018538298029528}, {"a": 0, "b": 20, "w": 0.04226998018124317}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.967,hiX=1.002,loY=0.766,hiY=1.212;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
