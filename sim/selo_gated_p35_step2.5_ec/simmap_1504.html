<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Smalt #28598F [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.968, "c": "種", "n": "Smalt #28598F [H]  n=1301 cos1.00 難-0.97", "s": 0.522, "f": 0}, {"x": 0.994, "y": -0.959, "c": "近傍", "n": "二人ノ廃城幽踊宴 [H]  n=1086 cos0.99 難-0.96", "s": 0.436, "f": 0}, {"x": 0.994, "y": -0.988, "c": "近傍", "n": "MARLIN [H]  n=506 cos0.99 難-0.99", "s": 0.203, "f": 0}, {"x": 0.993, "y": -0.971, "c": "近傍", "n": "Raspberry Railgun [H]  n=1994 cos0.99 難-0.97", "s": 0.8, "f": 0}, {"x": 0.995, "y": -0.846, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos1.00 難-0.85", "s": 0.301, "f": 0}, {"x": 0.993, "y": -1.051, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.05", "s": 0.256, "f": 0}, {"x": 0.992, "y": -0.958, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-0.96", "s": 0.25, "f": 0}, {"x": 0.994, "y": -0.833, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [H]  n=1248 cos0.99 難-0.83", "s": 0.501, "f": 0}, {"x": 0.993, "y": -1.072, "c": "近傍", "n": "禊 [H]  n=1637 cos0.99 難-1.07", "s": 0.657, "f": 0}, {"x": 0.994, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-0.84", "s": 0.216, "f": 0}, {"x": 0.992, "y": -1.072, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos0.99 難-1.07", "s": 0.486, "f": 0}, {"x": 0.995, "y": -0.809, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=610 cos0.99 難-0.81", "s": 0.245, "f": 0}, {"x": 0.993, "y": -0.827, "c": "近傍", "n": "B.O.D.Y. [H]  n=1306 cos0.99 難-0.83", "s": 0.524, "f": 0}, {"x": 0.991, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos0.99 難-0.90", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.989, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos0.99 難-0.99", "s": 0.462, "f": 0}, {"x": 0.99, "y": -0.994, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos0.99 難-0.99", "s": 0.281, "f": 0}, {"x": 0.991, "y": -1.036, "c": "近傍", "n": "Regina vespaE [H]  n=652 cos0.99 難-1.04", "s": 0.262, "f": 0}, {"x": 0.995, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.883, "f": 0}, {"x": 0.991, "y": -0.878, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.99 難-0.88", "s": 0.89, "f": 0}, {"x": 0.99, "y": -0.991, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.99 難-0.99", "s": 0.661, "f": 0}, {"x": 0.99, "y": -0.998, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos0.99 難-1.00", "s": 0.347, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.37862246097765295}, {"a": 0, "b": 2, "w": 0.2922100470485952}, {"a": 0, "b": 3, "w": 0.39128120340930916}, {"a": 0, "b": 4, "w": 0.48110278064326595}, {"a": 0, "b": 5, "w": 0.35666974891925607}, {"a": 0, "b": 6, "w": 0.34030805872358416}, {"a": 0, "b": 7, "w": 0.10742052786903411}, {"a": 0, "b": 8, "w": 0.2222227113902735}, {"a": 0, "b": 9, "w": 0.2424618107252291}, {"a": 0, "b": 10, "w": 0.3110025190311515}, {"a": 0, "b": 11, "w": 0.07034474237135302}, {"a": 0, "b": 12, "w": 0.38326818110062755}, {"a": 0, "b": 13, "w": 0.29187782177623867}, {"a": 0, "b": 14, "w": 0.19628582676260098}, {"a": 0, "b": 15, "w": 0.26317587956324284}, {"a": 0, "b": 16, "w": 5.2455373378279546e-11}, {"a": 0, "b": 17, "w": 0.4310842373500444}, {"a": 0, "b": 18, "w": 0.28184884088613427}, {"a": 0, "b": 19, "w": 0.24797852832097333}, {"a": 0, "b": 20, "w": 0.07374460696213647}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.095,hiY=-0.761;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
