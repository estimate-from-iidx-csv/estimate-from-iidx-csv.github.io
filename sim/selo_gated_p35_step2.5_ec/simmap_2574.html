<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Despair of ELFERIA [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.56, "c": "種", "n": "Despair of ELFERIA [A]  n=3175 cos1.00 難1.56", "s": 0.977, "f": 0}, {"x": 0.993, "y": 1.617, "c": "近傍", "n": "THE BRAVE MUST DIE [A]  n=2704 cos0.99 難1.62", "s": 0.832, "f": 0}, {"x": 0.981, "y": 1.529, "c": "近傍", "n": "Shooting Fireball [A]  n=3218 cos0.98 難1.53", "s": 0.99, "f": 0}, {"x": 0.984, "y": 1.617, "c": "近傍", "n": "天空の夜明け [A]  n=3251 cos0.98 難1.62", "s": 1.0, "f": 0}, {"x": 0.98, "y": 1.588, "c": "近傍", "n": "G59 [A]  n=3111 cos0.98 難1.59", "s": 0.957, "f": 0}, {"x": 0.978, "y": 1.531, "c": "近傍", "n": "QUANTUM TELEPORTATION [L]  n=2759 cos0.98 難1.53", "s": 0.849, "f": 0}, {"x": 0.974, "y": 1.507, "c": "近傍", "n": "A MINSTREL ～ ver. short-scape ～ [L]  n=1126 cos0.97 難1.51", "s": 0.346, "f": 0}, {"x": 0.991, "y": 1.426, "c": "近傍", "n": "Triple Counter [A]  n=3130 cos0.99 難1.43", "s": 0.963, "f": 0}, {"x": 0.973, "y": 1.518, "c": "近傍", "n": "ALTERNATOR [A]  n=2280 cos0.97 難1.52", "s": 0.701, "f": 0}, {"x": 0.98, "y": 1.447, "c": "近傍", "n": "SYNC-ANTHEM [A]  n=3166 cos0.98 難1.45", "s": 0.974, "f": 0}, {"x": 0.969, "y": 1.567, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.97 難1.57", "s": 0.749, "f": 0}, {"x": 0.972, "y": 1.627, "c": "近傍", "n": "MAX 300 [A]  n=1585 cos0.97 難1.63", "s": 0.488, "f": 0}, {"x": 0.97, "y": 1.489, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3218 cos0.97 難1.49", "s": 0.99, "f": 0}, {"x": 0.976, "y": 1.446, "c": "近傍", "n": "ORCA [A]  n=2530 cos0.98 難1.45", "s": 0.778, "f": 0}, {"x": 0.967, "y": 1.617, "c": "近傍", "n": "Artist [A]  n=2459 cos0.97 難1.62", "s": 0.756, "f": 0}, {"x": 0.975, "y": 1.68, "c": "近傍", "n": "ALBA -黎明- [L]  n=1258 cos0.97 難1.68", "s": 0.387, "f": 0}, {"x": 0.965, "y": 1.541, "c": "近傍", "n": "MENDES [A]  n=3238 cos0.97 難1.54", "s": 0.996, "f": 0}, {"x": 0.984, "y": 1.718, "c": "近傍", "n": "仮想空間の旅人たち [L]  n=2941 cos0.98 難1.72", "s": 0.905, "f": 0}, {"x": 0.964, "y": 1.546, "c": "近傍", "n": "お菓子の王国 [A]  n=2847 cos0.96 難1.55", "s": 0.876, "f": 0}, {"x": 0.966, "y": 1.616, "c": "近傍", "n": "HAERETICUS [A]  n=3064 cos0.97 難1.62", "s": 0.942, "f": 0}, {"x": 0.964, "y": 1.588, "c": "近傍", "n": "Demon March [A]  n=1395 cos0.96 難1.59", "s": 0.429, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5456318491702382}, {"a": 0, "b": 2, "w": 0.29160578586698904}, {"a": 0, "b": 3, "w": 0.34675874628659176}, {"a": 0, "b": 4, "w": 0.28471345008823334}, {"a": 0, "b": 5, "w": 0.1517345517887947}, {"a": 0, "b": 6, "w": 0.19239996978874363}, {"a": 0, "b": 7, "w": 0.5199184500516466}, {"a": 0, "b": 8, "w": 0.1637610607181862}, {"a": 0, "b": 9, "w": 0.24904011723462716}, {"a": 0, "b": 10, "w": 0.05184941580775959}, {"a": 0, "b": 11, "w": 0.10914448317515746}, {"a": 0, "b": 12, "w": 0.0955196478702739}, {"a": 0, "b": 13, "w": 0.19779382025761383}, {"a": 0, "b": 14, "w": 0.08279429944540195}, {"a": 0, "b": 15, "w": 0.2061770202406923}, {"a": 0, "b": 16, "w": 0.07213449020481744}, {"a": 0, "b": 17, "w": 0.3474904931662275}, {"a": 0, "b": 18, "w": 0.035784702566907134}, {"a": 0, "b": 19, "w": 2.1043833342559992e-11}, {"a": 0, "b": 20, "w": 0.03290611920135833}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.961,hiX=1.003,loY=1.403,hiY=1.741;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
