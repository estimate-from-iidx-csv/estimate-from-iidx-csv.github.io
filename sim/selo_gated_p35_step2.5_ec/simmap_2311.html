<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">創世ノート [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.395, "c": "種", "n": "創世ノート [A]  n=3282 cos1.00 難0.40", "s": 0.883, "f": 0}, {"x": 0.99, "y": 0.385, "c": "近傍", "n": "Time to Air [A]  n=3600 cos0.99 難0.39", "s": 0.969, "f": 0}, {"x": 0.991, "y": 0.261, "c": "近傍", "n": "命の標本 [A]  n=3125 cos0.99 難0.26", "s": 0.841, "f": 0}, {"x": 0.991, "y": 0.25, "c": "近傍", "n": "lowercase lifetime [A]  n=1453 cos0.99 難0.25", "s": 0.391, "f": 0}, {"x": 0.99, "y": 0.306, "c": "近傍", "n": "MAGIC & LOVE [A]  n=3382 cos0.99 難0.31", "s": 0.91, "f": 0}, {"x": 0.991, "y": 0.574, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [A]  n=3059 cos0.99 難0.57", "s": 0.823, "f": 0}, {"x": 0.988, "y": 0.361, "c": "近傍", "n": "Tropical April [A]  n=3269 cos0.99 難0.36", "s": 0.879, "f": 0}, {"x": 0.993, "y": 0.113, "c": "近傍", "n": "SHELTER OF THE MIND [A]  n=3428 cos0.99 難0.11", "s": 0.922, "f": 0}, {"x": 0.986, "y": 0.301, "c": "近傍", "n": "Cleopatrysm [A]  n=3255 cos0.99 難0.30", "s": 0.876, "f": 0}, {"x": 0.988, "y": 0.18, "c": "近傍", "n": "華蝶風雪 [A]  n=3533 cos0.99 難0.18", "s": 0.95, "f": 0}, {"x": 0.987, "y": 0.568, "c": "近傍", "n": "Venom [A]  n=3552 cos0.99 難0.57", "s": 0.956, "f": 0}, {"x": 0.988, "y": 0.169, "c": "近傍", "n": "純真可憐デザイア [L]  n=801 cos0.99 難0.17", "s": 0.215, "f": 0}, {"x": 0.985, "y": 0.467, "c": "近傍", "n": "invoker [A]  n=3717 cos0.99 難0.47", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.358, "c": "近傍", "n": "ELYSIUM [A]  n=1505 cos0.99 難0.36", "s": 0.405, "f": 0}, {"x": 0.985, "y": 0.495, "c": "近傍", "n": "smile [A]  n=3304 cos0.99 難0.49", "s": 0.889, "f": 0}, {"x": 0.985, "y": 0.512, "c": "近傍", "n": "New Decade IIDX Edition [A]  n=3410 cos0.99 難0.51", "s": 0.917, "f": 0}, {"x": 0.985, "y": 0.327, "c": "近傍", "n": "waxing and wanding [A]  n=3675 cos0.98 難0.33", "s": 0.989, "f": 0}, {"x": 0.987, "y": 0.644, "c": "近傍", "n": "HYPE THE CORE [A]  n=3106 cos0.99 難0.64", "s": 0.836, "f": 0}, {"x": 0.984, "y": 0.45, "c": "近傍", "n": "MENTAL MELTDOWN [A]  n=3299 cos0.98 難0.45", "s": 0.888, "f": 0}, {"x": 0.986, "y": 0.144, "c": "近傍", "n": "鴉 [A]  n=3543 cos0.99 難0.14", "s": 0.953, "f": 0}, {"x": 0.983, "y": 0.375, "c": "近傍", "n": "Beyond The Earth [A]  n=3383 cos0.98 難0.38", "s": 0.91, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4148327024899312}, {"a": 0, "b": 2, "w": 0.3165144988746077}, {"a": 0, "b": 3, "w": 0.3693119377145664}, {"a": 0, "b": 4, "w": 0.4035978259552918}, {"a": 0, "b": 5, "w": 0.21969844233224078}, {"a": 0, "b": 6, "w": 0.36102318942767186}, {"a": 0, "b": 7, "w": 0.40760339661057987}, {"a": 0, "b": 8, "w": 0.15335813826833233}, {"a": 0, "b": 9, "w": 0.3538234898417494}, {"a": 0, "b": 10, "w": 0.3333046960111543}, {"a": 0, "b": 11, "w": 0.3469003366767238}, {"a": 0, "b": 12, "w": 0.29425267790233867}, {"a": 0, "b": 13, "w": 0.29136282642243194}, {"a": 0, "b": 14, "w": 0.28327220064340886}, {"a": 0, "b": 15, "w": 0.2604051590714086}, {"a": 0, "b": 16, "w": 0.2579247064624446}, {"a": 0, "b": 17, "w": 0.2486883793505158}, {"a": 0, "b": 18, "w": 3.2235547564596345e-11}, {"a": 0, "b": 19, "w": 0.30730359855347245}, {"a": 0, "b": 20, "w": 0.24356761055437326}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.071,hiY=0.687;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
