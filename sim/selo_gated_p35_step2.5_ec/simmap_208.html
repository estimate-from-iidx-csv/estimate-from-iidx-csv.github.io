<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Always We Trust In You [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.38, "c": "種", "n": "Always We Trust In You [H]  n=505 cos1.00 難-1.38", "s": 0.259, "f": 0}, {"x": 0.997, "y": -1.424, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos1.00 難-1.42", "s": 0.711, "f": 0}, {"x": 0.99, "y": -1.324, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.99 難-1.32", "s": 0.887, "f": 0}, {"x": 0.993, "y": -1.272, "c": "近傍", "n": "2 Be Continued [H]  n=568 cos0.99 難-1.27", "s": 0.291, "f": 0}, {"x": 0.99, "y": -1.465, "c": "近傍", "n": "encounter [H]  n=1624 cos0.99 難-1.47", "s": 0.833, "f": 0}, {"x": 0.99, "y": -1.273, "c": "近傍", "n": "One for All [H]  n=957 cos0.99 難-1.27", "s": 0.491, "f": 0}, {"x": 0.987, "y": -1.341, "c": "近傍", "n": "NANAIRO [H]  n=1415 cos0.99 難-1.34", "s": 0.726, "f": 0}, {"x": 0.989, "y": -1.262, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1841 cos0.99 難-1.26", "s": 0.945, "f": 0}, {"x": 0.986, "y": -1.318, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.99 難-1.32", "s": 0.827, "f": 0}, {"x": 0.988, "y": -1.5, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.50", "s": 0.56, "f": 0}, {"x": 0.987, "y": -1.264, "c": "近傍", "n": "SCREW // owo // SCREW [H]  n=1631 cos0.99 難-1.26", "s": 0.837, "f": 0}, {"x": 0.983, "y": -1.324, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.98 難-1.32", "s": 0.624, "f": 0}, {"x": 0.984, "y": -1.46, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.98 難-1.46", "s": 0.498, "f": 0}, {"x": 0.983, "y": -1.352, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.98 難-1.35", "s": 0.72, "f": 0}, {"x": 0.995, "y": -1.183, "c": "近傍", "n": "東京神話 [H]  n=1949 cos1.00 難-1.18", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.498, "c": "近傍", "n": "《PL|RAYER》 [H]  n=603 cos0.98 難-1.50", "s": 0.309, "f": 0}, {"x": 0.982, "y": -1.414, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos0.98 難-1.41", "s": 0.678, "f": 0}, {"x": 0.981, "y": -1.409, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1478 cos0.98 難-1.41", "s": 0.758, "f": 0}, {"x": 0.981, "y": -1.408, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.98 難-1.41", "s": 0.704, "f": 0}, {"x": 0.983, "y": -1.5, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos0.98 難-1.50", "s": 0.724, "f": 0}, {"x": 0.983, "y": -1.267, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=722 cos0.98 難-1.27", "s": 0.37, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5077035280590658}, {"a": 0, "b": 2, "w": 0.3148622067400413}, {"a": 0, "b": 3, "w": 0.45820169395402677}, {"a": 0, "b": 4, "w": 0.24971524700319114}, {"a": 0, "b": 5, "w": 0.30985296209362345}, {"a": 0, "b": 6, "w": 0.21380067310929118}, {"a": 0, "b": 7, "w": 0.31388983793759206}, {"a": 0, "b": 8, "w": 0.10571557451914104}, {"a": 0, "b": 9, "w": 0.1718705048171898}, {"a": 0, "b": 10, "w": 0.047784352388882234}, {"a": 0, "b": 11, "w": 0.0789531930178109}, {"a": 0, "b": 12, "w": 0.06157165809806753}, {"a": 0, "b": 13, "w": 0.03375583940669791}, {"a": 0, "b": 14, "w": 0.4879398697939984}, {"a": 0, "b": 15, "w": 0.15184094099302614}, {"a": 0, "b": 16, "w": 4.8628656657001557e-11}, {"a": 0, "b": 17, "w": 0.08285004728532375}, {"a": 0, "b": 18, "w": 0.07146490911906422}, {"a": 0, "b": 19, "w": 0.06793499241599288}, {"a": 0, "b": 20, "w": 0.09764970256335614}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.525,hiY=-1.158;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
