<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">エクスプロウル [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.379, "c": "種", "n": "エクスプロウル [A]  n=1133 cos1.00 難-0.38", "s": 0.341, "f": 0}, {"x": 0.996, "y": -0.309, "c": "近傍", "n": "ナイトフィクション [A]  n=2306 cos1.00 難-0.31", "s": 0.695, "f": 0}, {"x": 0.996, "y": -0.256, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos1.00 難-0.26", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.353, "c": "近傍", "n": "閉塞的フレーション [A]  n=1557 cos0.99 難-0.35", "s": 0.469, "f": 0}, {"x": 0.994, "y": -0.372, "c": "近傍", "n": "Iris [A]  n=2038 cos0.99 難-0.37", "s": 0.614, "f": 0}, {"x": 0.994, "y": -0.29, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.29", "s": 0.338, "f": 0}, {"x": 0.993, "y": -0.329, "c": "近傍", "n": "get set mind [A]  n=1502 cos0.99 難-0.33", "s": 0.452, "f": 0}, {"x": 0.993, "y": -0.31, "c": "近傍", "n": "アイドル [A]  n=2110 cos0.99 難-0.31", "s": 0.636, "f": 0}, {"x": 0.993, "y": -0.438, "c": "近傍", "n": "Far east nightbird [A]  n=3200 cos0.99 難-0.44", "s": 0.964, "f": 0}, {"x": 0.993, "y": -0.312, "c": "近傍", "n": "夏色のセレナーデ [A]  n=1050 cos0.99 難-0.31", "s": 0.316, "f": 0}, {"x": 0.993, "y": -0.39, "c": "近傍", "n": "Kung-fu Empire [H]  n=3013 cos0.99 難-0.39", "s": 0.908, "f": 0}, {"x": 0.992, "y": -0.326, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3122 cos0.99 難-0.33", "s": 0.94, "f": 0}, {"x": 0.992, "y": -0.387, "c": "近傍", "n": "Shooting Star [A]  n=1062 cos0.99 難-0.39", "s": 0.32, "f": 0}, {"x": 0.992, "y": -0.434, "c": "近傍", "n": "Mel [A]  n=2620 cos0.99 難-0.43", "s": 0.789, "f": 0}, {"x": 0.995, "y": -0.173, "c": "近傍", "n": "ILIAS [A]  n=3053 cos0.99 難-0.17", "s": 0.92, "f": 0}, {"x": 0.995, "y": -0.591, "c": "近傍", "n": "Sounds Of Summer [H]  n=2726 cos1.00 難-0.59", "s": 0.821, "f": 0}, {"x": 0.992, "y": -0.438, "c": "近傍", "n": "虹色 [A]  n=3051 cos0.99 難-0.44", "s": 0.919, "f": 0}, {"x": 0.993, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.869, "f": 0}, {"x": 0.994, "y": -0.203, "c": "近傍", "n": "beatonic nation [A]  n=2335 cos0.99 難-0.20", "s": 0.703, "f": 0}, {"x": 0.993, "y": -0.486, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=996 cos0.99 難-0.49", "s": 0.3, "f": 0}, {"x": 0.992, "y": -0.296, "c": "近傍", "n": "Ariah [A]  n=2454 cos0.99 難-0.30", "s": 0.739, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3427942927999508}, {"a": 0, "b": 2, "w": 0.25280416805455086}, {"a": 0, "b": 3, "w": 0.24945925205848574}, {"a": 0, "b": 4, "w": 0.2659288534549}, {"a": 0, "b": 5, "w": 0.3404680069895234}, {"a": 0, "b": 6, "w": 0.2840596827577746}, {"a": 0, "b": 7, "w": 0.2808071776846899}, {"a": 0, "b": 8, "w": 0.08691864788854664}, {"a": 0, "b": 9, "w": 0.21357858235490856}, {"a": 0, "b": 10, "w": 0.2786048528368328}, {"a": 0, "b": 11, "w": 0.2739829353898724}, {"a": 0, "b": 12, "w": 0.2079701183436714}, {"a": 0, "b": 13, "w": 0.1582854924091498}, {"a": 0, "b": 14, "w": 0.3708834491234472}, {"a": 0, "b": 15, "w": 0.3274121999810402}, {"a": 0, "b": 16, "w": 5.879496889349412e-11}, {"a": 0, "b": 17, "w": 0.240530149867501}, {"a": 0, "b": 18, "w": 0.19043157108368958}, {"a": 0, "b": 19, "w": 0.24411374218578819}, {"a": 0, "b": 20, "w": 0.17567574446039602}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.625,hiY=-0.140;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
