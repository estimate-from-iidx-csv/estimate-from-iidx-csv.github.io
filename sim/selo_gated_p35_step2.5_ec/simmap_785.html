<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BRAVE GLOW [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.135, "c": "種", "n": "BRAVE GLOW [A]  n=3122 cos1.00 難-0.13", "s": 0.847, "f": 0}, {"x": 0.998, "y": 0.024, "c": "近傍", "n": "Cosmic Cat [A]  n=3687 cos1.00 難0.02", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.007, "c": "近傍", "n": "Vitamin [A]  n=1127 cos1.00 難-0.01", "s": 0.306, "f": 0}, {"x": 0.995, "y": -0.203, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos0.99 難-0.20", "s": 0.74, "f": 0}, {"x": 0.995, "y": -0.216, "c": "近傍", "n": "Answer [A]  n=3214 cos0.99 難-0.22", "s": 0.872, "f": 0}, {"x": 0.994, "y": -0.11, "c": "近傍", "n": "SOLID STATE SQUAD [H]  n=2672 cos0.99 難-0.11", "s": 0.725, "f": 0}, {"x": 0.994, "y": -0.143, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos0.99 難-0.14", "s": 0.641, "f": 0}, {"x": 0.994, "y": -0.214, "c": "近傍", "n": "Flash Back 90's [A]  n=3439 cos0.99 難-0.21", "s": 0.933, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos0.99 難-0.23", "s": 0.814, "f": 0}, {"x": 0.993, "y": -0.207, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1403 cos0.99 難-0.21", "s": 0.381, "f": 0}, {"x": 0.994, "y": -0.002, "c": "近傍", "n": "ANAGMA [A]  n=2588 cos0.99 難-0.00", "s": 0.702, "f": 0}, {"x": 0.995, "y": 0.073, "c": "近傍", "n": "月光 [A]  n=3166 cos1.00 難0.07", "s": 0.859, "f": 0}, {"x": 0.995, "y": -0.339, "c": "近傍", "n": "百恋ラブラスター [A]  n=1052 cos0.99 難-0.34", "s": 0.285, "f": 0}, {"x": 0.994, "y": 0.009, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [A]  n=2798 cos0.99 難0.01", "s": 0.759, "f": 0}, {"x": 0.993, "y": -0.057, "c": "近傍", "n": "Ventriloquist [A]  n=2650 cos0.99 難-0.06", "s": 0.719, "f": 0}, {"x": 0.996, "y": 0.114, "c": "近傍", "n": "うさ☆かめ 大戦争！ [A]  n=3354 cos1.00 難0.11", "s": 0.91, "f": 0}, {"x": 0.992, "y": -0.095, "c": "近傍", "n": "1001 -ESCAPE- [A]  n=3068 cos0.99 難-0.10", "s": 0.832, "f": 0}, {"x": 0.992, "y": -0.058, "c": "近傍", "n": "廿 [A]  n=3167 cos0.99 難-0.06", "s": 0.859, "f": 0}, {"x": 0.992, "y": -0.109, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3055 cos0.99 難-0.11", "s": 0.829, "f": 0}, {"x": 0.993, "y": 0.041, "c": "近傍", "n": "POODLE [A]  n=2923 cos0.99 難0.04", "s": 0.793, "f": 0}, {"x": 0.993, "y": -0.338, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.34", "s": 0.766, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.519860103866792}, {"a": 0, "b": 2, "w": 0.3976541917049071}, {"a": 0, "b": 3, "w": 0.25946760835459604}, {"a": 0, "b": 4, "w": 0.1548421742986552}, {"a": 0, "b": 5, "w": 0.26423955840875135}, {"a": 0, "b": 6, "w": 0.13783967283318954}, {"a": 0, "b": 7, "w": 0.0785885191696839}, {"a": 0, "b": 8, "w": 0.11657325522284245}, {"a": 0, "b": 9, "w": 0.16571955263724036}, {"a": 0, "b": 10, "w": 0.23838984879054925}, {"a": 0, "b": 11, "w": 0.3367397409592737}, {"a": 0, "b": 12, "w": 0.287628891735768}, {"a": 0, "b": 13, "w": 0.14670358547025175}, {"a": 0, "b": 14, "w": 0.1849305536674164}, {"a": 0, "b": 15, "w": 0.3252192468321865}, {"a": 0, "b": 16, "w": 0.175353097032105}, {"a": 0, "b": 17, "w": 0.11109847304014464}, {"a": 0, "b": 18, "w": 0.010906642277468515}, {"a": 0, "b": 19, "w": 0.04771567028305845}, {"a": 0, "b": 20, "w": 5.960254512160645e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.376,hiY=0.151;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
