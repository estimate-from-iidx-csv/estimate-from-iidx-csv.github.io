<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Too Late Snow [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.304, "c": "種", "n": "Too Late Snow [A]  n=1380 cos1.00 難-0.30", "s": 0.374, "f": 0}, {"x": 0.996, "y": -0.293, "c": "近傍", "n": "Twilight Warp [A]  n=2518 cos1.00 難-0.29", "s": 0.682, "f": 0}, {"x": 0.996, "y": -0.181, "c": "近傍", "n": "Umbral [A]  n=3241 cos1.00 難-0.18", "s": 0.878, "f": 0}, {"x": 0.994, "y": -0.294, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2711 cos0.99 難-0.29", "s": 0.734, "f": 0}, {"x": 0.994, "y": -0.255, "c": "近傍", "n": "IXION [A]  n=2650 cos0.99 難-0.26", "s": 0.718, "f": 0}, {"x": 0.996, "y": -0.155, "c": "近傍", "n": "Everlasting Last [A]  n=3198 cos1.00 難-0.15", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.155, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos1.00 難-0.15", "s": 0.349, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.19", "s": 0.832, "f": 0}, {"x": 0.993, "y": -0.338, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.34", "s": 0.765, "f": 0}, {"x": 0.993, "y": -0.39, "c": "近傍", "n": "Ristaccia [H]  n=2302 cos0.99 難-0.39", "s": 0.624, "f": 0}, {"x": 0.992, "y": -0.39, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [H]  n=2987 cos0.99 難-0.39", "s": 0.809, "f": 0}, {"x": 0.994, "y": -0.483, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1933 cos0.99 難-0.48", "s": 0.524, "f": 0}, {"x": 0.991, "y": -0.299, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.685, "f": 0}, {"x": 0.991, "y": -0.305, "c": "近傍", "n": "オッド ラヴィ [A]  n=1493 cos0.99 難-0.30", "s": 0.404, "f": 0}, {"x": 0.992, "y": -0.181, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.18", "s": 0.647, "f": 0}, {"x": 0.991, "y": -0.259, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.99 難-0.26", "s": 0.785, "f": 0}, {"x": 0.992, "y": -0.446, "c": "近傍", "n": "INFERNO [A]  n=2475 cos0.99 難-0.45", "s": 0.671, "f": 0}, {"x": 0.99, "y": -0.286, "c": "近傍", "n": "アルストロメリア [A]  n=3691 cos0.99 難-0.29", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.103, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.99 難-0.10", "s": 0.795, "f": 0}, {"x": 0.995, "y": -0.558, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3469 cos0.99 難-0.56", "s": 0.94, "f": 0}, {"x": 0.99, "y": -0.344, "c": "近傍", "n": "Last Dance [H]  n=2703 cos0.99 難-0.34", "s": 0.732, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6117456701360433}, {"a": 0, "b": 2, "w": 0.6690737492322754}, {"a": 0, "b": 3, "w": 0.5677881610075415}, {"a": 0, "b": 4, "w": 0.523582105866919}, {"a": 0, "b": 5, "w": 0.5525792297275726}, {"a": 0, "b": 6, "w": 0.5939814104549628}, {"a": 0, "b": 7, "w": 0.45518350947270314}, {"a": 0, "b": 8, "w": 0.3049860016549837}, {"a": 0, "b": 9, "w": 0.37507586150852423}, {"a": 0, "b": 10, "w": 0.3414868474913608}, {"a": 0, "b": 11, "w": 0.5518038620657955}, {"a": 0, "b": 12, "w": 0.46716107273126084}, {"a": 0, "b": 13, "w": 4.340028336713431e-11}, {"a": 0, "b": 14, "w": 0.4909390762362492}, {"a": 0, "b": 15, "w": 0.38585275440970324}, {"a": 0, "b": 16, "w": 0.47841711321236213}, {"a": 0, "b": 17, "w": 0.2599273609566629}, {"a": 0, "b": 18, "w": 0.3492599258382705}, {"a": 0, "b": 19, "w": 0.6004012890329953}, {"a": 0, "b": 20, "w": 0.38906382479216695}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.594,hiY=-0.067;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
