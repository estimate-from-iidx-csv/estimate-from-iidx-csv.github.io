<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">灼熱Beach Side Bunny [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.341, "c": "種", "n": "灼熱Beach Side Bunny [A]  n=3253 cos1.00 難2.34", "s": 1.0, "f": 0}, {"x": 0.984, "y": 2.427, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [A]  n=1818 cos0.98 難2.43", "s": 0.559, "f": 0}, {"x": 0.994, "y": 2.616, "c": "近傍", "n": "Level 5 [A]  n=1098 cos0.99 難2.62", "s": 0.338, "f": 0}, {"x": 0.962, "y": 2.092, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [A]  n=2332 cos0.96 難2.09", "s": 0.717, "f": 0}, {"x": 0.951, "y": 2.47, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [L]  n=1150 cos0.95 難2.47", "s": 0.354, "f": 0}, {"x": 0.982, "y": 1.974, "c": "近傍", "n": "Lords Of The Roundtable [A]  n=2510 cos0.98 難1.97", "s": 0.772, "f": 0}, {"x": 0.948, "y": 2.22, "c": "近傍", "n": "CODE:0 [L]  n=1250 cos0.95 難2.22", "s": 0.384, "f": 0}, {"x": 0.986, "y": 1.958, "c": "近傍", "n": "Red. by Jack Trance [A]  n=2727 cos0.99 難1.96", "s": 0.838, "f": 0}, {"x": 0.975, "y": 1.958, "c": "近傍", "n": "Level 3 [A]  n=2167 cos0.97 難1.96", "s": 0.666, "f": 0}, {"x": 0.986, "y": 1.886, "c": "近傍", "n": "Level 4 [A]  n=1729 cos0.99 難1.89", "s": 0.532, "f": 0}, {"x": 0.996, "y": 2.816, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [A]  n=2781 cos1.00 難2.82", "s": 0.855, "f": 0}, {"x": 0.946, "y": 2.044, "c": "近傍", "n": "TOMAHAWK [A]  n=1925 cos0.95 難2.04", "s": 0.592, "f": 0}, {"x": 0.976, "y": 1.873, "c": "近傍", "n": "Level One [A]  n=2922 cos0.98 難1.87", "s": 0.898, "f": 0}, {"x": 0.938, "y": 2.117, "c": "近傍", "n": "WHA [A]  n=1878 cos0.94 難2.12", "s": 0.577, "f": 0}, {"x": 0.995, "y": 2.875, "c": "近傍", "n": "SAMURAI-Scramble [L]  n=1665 cos0.99 難2.87", "s": 0.512, "f": 0}, {"x": 0.985, "y": 1.781, "c": "近傍", "n": "Makin' It [A]  n=971 cos0.98 難1.78", "s": 0.298, "f": 0}, {"x": 0.98, "y": 1.73, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.98 難1.73", "s": 0.649, "f": 0}, {"x": 0.95, "y": 2.854, "c": "近傍", "n": "Plan 8 [A]  n=2861 cos0.95 難2.85", "s": 0.879, "f": 0}, {"x": 0.927, "y": 1.96, "c": "近傍", "n": "invoker [L]  n=2635 cos0.93 難1.96", "s": 0.81, "f": 0}, {"x": 0.907, "y": 2.3, "c": "近傍", "n": "焔極OVERKILL [A]  n=2760 cos0.91 難2.30", "s": 0.848, "f": 0}, {"x": 0.905, "y": 2.196, "c": "近傍", "n": "Bad Encryption [A]  n=1818 cos0.90 難2.20", "s": 0.559, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5665925058216047}, {"a": 0, "b": 2, "w": 0.7176059328238733}, {"a": 0, "b": 3, "w": 0.3646718832470007}, {"a": 0, "b": 4, "w": 0.22691922747893778}, {"a": 0, "b": 5, "w": 0.5506257192153807}, {"a": 0, "b": 6, "w": 0.26231897429019635}, {"a": 0, "b": 7, "w": 0.594283643099458}, {"a": 0, "b": 8, "w": 0.4810482123417892}, {"a": 0, "b": 9, "w": 0.602318967516213}, {"a": 0, "b": 10, "w": 0.7541954389073618}, {"a": 0, "b": 11, "w": 0.2435305778265805}, {"a": 0, "b": 12, "w": 0.49266801619496026}, {"a": 0, "b": 13, "w": 0.18773842033255927}, {"a": 0, "b": 14, "w": 0.7592192647793409}, {"a": 0, "b": 15, "w": 0.520242057063168}, {"a": 0, "b": 16, "w": 0.491655299369705}, {"a": 0, "b": 17, "w": 0.25322597794263635}, {"a": 0, "b": 18, "w": 0.130554926633893}, {"a": 0, "b": 19, "w": 1.3143264254722453e-11}, {"a": 0, "b": 20, "w": 0.003509292535080921}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.897,hiX=1.008,loY=1.639,hiY=2.967;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
