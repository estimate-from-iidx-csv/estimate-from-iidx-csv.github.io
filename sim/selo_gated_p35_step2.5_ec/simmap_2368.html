<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">響花水月 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.157, "c": "種", "n": "響花水月 [A]  n=2146 cos1.00 難0.16", "s": 0.585, "f": 0}, {"x": 0.998, "y": 0.163, "c": "近傍", "n": "Xepher [A]  n=3669 cos1.00 難0.16", "s": 1.0, "f": 0}, {"x": 0.997, "y": 0.19, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos1.00 難0.19", "s": 0.938, "f": 0}, {"x": 0.997, "y": 0.237, "c": "近傍", "n": "UNITE THE HEART [A]  n=2852 cos1.00 難0.24", "s": 0.777, "f": 0}, {"x": 0.996, "y": 0.195, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.19", "s": 0.766, "f": 0}, {"x": 0.995, "y": 0.143, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos1.00 難0.14", "s": 0.961, "f": 0}, {"x": 0.995, "y": 0.161, "c": "近傍", "n": "Aurora [A]  n=3652 cos1.00 難0.16", "s": 0.995, "f": 0}, {"x": 0.995, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.18", "s": 0.446, "f": 0}, {"x": 0.995, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos1.00 難0.20", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.218, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2290 cos1.00 難0.22", "s": 0.624, "f": 0}, {"x": 0.994, "y": 0.18, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.18", "s": 0.523, "f": 0}, {"x": 0.994, "y": 0.099, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos0.99 難0.10", "s": 0.29, "f": 0}, {"x": 0.994, "y": 0.146, "c": "近傍", "n": "SOLID WYVERN [A]  n=2530 cos0.99 難0.15", "s": 0.69, "f": 0}, {"x": 0.995, "y": 0.265, "c": "近傍", "n": "Battleground [A]  n=3268 cos1.00 難0.27", "s": 0.891, "f": 0}, {"x": 0.994, "y": 0.218, "c": "近傍", "n": "xenon [A]  n=3549 cos0.99 難0.22", "s": 0.967, "f": 0}, {"x": 0.994, "y": 0.112, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3582 cos0.99 難0.11", "s": 0.976, "f": 0}, {"x": 0.994, "y": 0.213, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [L]  n=3272 cos0.99 難0.21", "s": 0.892, "f": 0}, {"x": 0.994, "y": 0.144, "c": "近傍", "n": "儚き恋の華 [A]  n=2559 cos0.99 難0.14", "s": 0.697, "f": 0}, {"x": 0.994, "y": 0.189, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.19", "s": 0.957, "f": 0}, {"x": 0.994, "y": 0.2, "c": "近傍", "n": "Elektrick U-Phoria [A]  n=3481 cos0.99 難0.20", "s": 0.949, "f": 0}, {"x": 0.993, "y": 0.173, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos0.99 難0.17", "s": 0.481, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5500345740885224}, {"a": 0, "b": 2, "w": 0.47224315353591484}, {"a": 0, "b": 3, "w": 0.34563147142927164}, {"a": 0, "b": 4, "w": 0.3680385500095712}, {"a": 0, "b": 5, "w": 0.20029915063804915}, {"a": 0, "b": 6, "w": 0.37238494390778976}, {"a": 0, "b": 7, "w": 0.3581101548902885}, {"a": 0, "b": 8, "w": 0.391554249985283}, {"a": 0, "b": 9, "w": 0.2766171959598591}, {"a": 0, "b": 10, "w": 0.31209512846688126}, {"a": 0, "b": 11, "w": 0.25137402424454014}, {"a": 0, "b": 12, "w": 0.22570629099447037}, {"a": 0, "b": 13, "w": 0.34671869489635476}, {"a": 0, "b": 14, "w": 0.12501743285105615}, {"a": 0, "b": 15, "w": 4.899647354505987e-11}, {"a": 0, "b": 16, "w": 0.31314743120049504}, {"a": 0, "b": 17, "w": 0.2728429370309523}, {"a": 0, "b": 18, "w": 0.2894835777629948}, {"a": 0, "b": 19, "w": 0.26378136509250194}, {"a": 0, "b": 20, "w": 0.28669265565359914}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=0.086,hiY=0.279;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
