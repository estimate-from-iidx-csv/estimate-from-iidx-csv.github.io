<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">S!ck (Nhato Remix) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -2.159, "c": "種", "n": "S!ck (Nhato Remix) [H]  n=969 cos1.00 難-2.16", "s": 0.765, "f": 0}, {"x": 0.992, "y": -2.073, "c": "近傍", "n": "FINALLY BLAZE [H]  n=854 cos0.99 難-2.07", "s": 0.675, "f": 0}, {"x": 0.986, "y": -2.061, "c": "近傍", "n": "THE TIME MACHINE [H]  n=708 cos0.99 難-2.06", "s": 0.559, "f": 0}, {"x": 0.988, "y": -2.026, "c": "近傍", "n": "Ergosphere [H]  n=542 cos0.99 難-2.03", "s": 0.428, "f": 0}, {"x": 0.988, "y": -2.012, "c": "近傍", "n": "Tail Lights [H]  n=770 cos0.99 難-2.01", "s": 0.608, "f": 0}, {"x": 0.984, "y": -2.016, "c": "近傍", "n": "Perfect Plan [H]  n=607 cos0.98 難-2.02", "s": 0.479, "f": 0}, {"x": 0.968, "y": -2.102, "c": "近傍", "n": "あるビー！ feat.ころねぽち [H]  n=584 cos0.97 難-2.10", "s": 0.461, "f": 0}, {"x": 0.993, "y": -1.975, "c": "近傍", "n": "狂水一華 [H]  n=1018 cos0.99 難-1.98", "s": 0.804, "f": 0}, {"x": 0.989, "y": -1.978, "c": "近傍", "n": "《GRANDMASTER》 [H]  n=690 cos0.99 難-1.98", "s": 0.545, "f": 0}, {"x": 0.987, "y": -1.981, "c": "近傍", "n": "Mukade [H]  n=508 cos0.99 難-1.98", "s": 0.401, "f": 0}, {"x": 0.986, "y": -1.98, "c": "近傍", "n": "Lovely Howdy Cowboy!! [H]  n=780 cos0.99 難-1.98", "s": 0.616, "f": 0}, {"x": 0.978, "y": -1.996, "c": "近傍", "n": "X-ray binary [H]  n=795 cos0.98 難-2.00", "s": 0.628, "f": 0}, {"x": 0.978, "y": -1.995, "c": "近傍", "n": "SOLID WYVERN [H]  n=700 cos0.98 難-1.99", "s": 0.553, "f": 0}, {"x": 0.985, "y": -1.977, "c": "近傍", "n": "Neo Heritage [H]  n=804 cos0.98 難-1.98", "s": 0.635, "f": 0}, {"x": 0.987, "y": -1.953, "c": "近傍", "n": "MA・TSU・RI [H]  n=527 cos0.99 難-1.95", "s": 0.416, "f": 0}, {"x": 0.99, "y": -1.943, "c": "近傍", "n": "Nasty Techniques [H]  n=1266 cos0.99 難-1.94", "s": 1.0, "f": 0}, {"x": 0.956, "y": -2.205, "c": "近傍", "n": "Souhait bleu [H]  n=724 cos0.96 難-2.20", "s": 0.572, "f": 0}, {"x": 0.986, "y": -1.946, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.99 難-1.95", "s": 0.476, "f": 0}, {"x": 0.992, "y": -1.937, "c": "近傍", "n": "STOIC HYPOTHESIS [H]  n=998 cos0.99 難-1.94", "s": 0.788, "f": 0}, {"x": 0.989, "y": -1.937, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [H]  n=984 cos0.99 難-1.94", "s": 0.777, "f": 0}, {"x": 0.99, "y": -1.923, "c": "近傍", "n": "乱膳の舞姫 [H]  n=771 cos0.99 難-1.92", "s": 0.609, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5318956191618491}, {"a": 0, "b": 2, "w": 0.43122527738238525}, {"a": 0, "b": 3, "w": 0.40715235208302936}, {"a": 0, "b": 4, "w": 0.4589405383067705}, {"a": 0, "b": 5, "w": 0.3639353580854878}, {"a": 0, "b": 6, "w": 0.14274752739815488}, {"a": 0, "b": 7, "w": 0.5771786001810579}, {"a": 0, "b": 8, "w": 0.492951086015716}, {"a": 0, "b": 9, "w": 0.44646861397355064}, {"a": 0, "b": 10, "w": 0.3424637459602514}, {"a": 0, "b": 11, "w": 0.300372339752077}, {"a": 0, "b": 12, "w": 0.2637010872147646}, {"a": 0, "b": 13, "w": 0.40970640279000203}, {"a": 0, "b": 14, "w": 0.4538740146437765}, {"a": 0, "b": 15, "w": 0.5054625110101478}, {"a": 0, "b": 16, "w": 3.599143205690325e-11}, {"a": 0, "b": 17, "w": 0.430343134763144}, {"a": 0, "b": 18, "w": 0.5603947880135336}, {"a": 0, "b": 19, "w": 0.5012857980231695}, {"a": 0, "b": 20, "w": 0.49747226667103406}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.952,hiX=1.004,loY=-2.227,hiY=-1.900;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
