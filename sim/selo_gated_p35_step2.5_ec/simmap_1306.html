<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Demon March [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.81, "c": "種", "n": "Demon March [H]  n=834 cos1.00 難-0.81", "s": 0.265, "f": 0}, {"x": 0.997, "y": -0.719, "c": "近傍", "n": "ANCHOR [H]  n=2040 cos1.00 難-0.72", "s": 0.648, "f": 0}, {"x": 0.995, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos1.00 難-0.84", "s": 0.171, "f": 0}, {"x": 0.995, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.699, "f": 0}, {"x": 0.995, "y": -0.717, "c": "近傍", "n": "∀ [H]  n=2296 cos1.00 難-0.72", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.786, "c": "近傍", "n": "EVANESCENT [H]  n=1488 cos0.99 難-0.79", "s": 0.473, "f": 0}, {"x": 0.994, "y": -0.852, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos0.99 難-0.85", "s": 0.194, "f": 0}, {"x": 0.994, "y": -0.715, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos0.99 難-0.71", "s": 0.582, "f": 0}, {"x": 0.994, "y": -0.752, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.75", "s": 0.5, "f": 0}, {"x": 0.995, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos1.00 難-0.68", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.855, "c": "近傍", "n": "destination [H]  n=822 cos0.99 難-0.85", "s": 0.261, "f": 0}, {"x": 0.993, "y": -0.709, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos0.99 難-0.71", "s": 0.59, "f": 0}, {"x": 0.997, "y": -0.989, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos1.00 難-0.99", "s": 0.366, "f": 0}, {"x": 0.993, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos0.99 難-0.90", "s": 0.792, "f": 0}, {"x": 0.992, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.81", "s": 0.245, "f": 0}, {"x": 0.992, "y": -0.843, "c": "近傍", "n": "Catch Our Fire! [H]  n=1841 cos0.99 難-0.84", "s": 0.585, "f": 0}, {"x": 0.996, "y": -0.998, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos1.00 難-1.00", "s": 0.274, "f": 0}, {"x": 0.992, "y": -0.923, "c": "近傍", "n": "SEQUENCE CAT [H]  n=2133 cos0.99 難-0.92", "s": 0.677, "f": 0}, {"x": 0.991, "y": -0.846, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos0.99 難-0.85", "s": 0.238, "f": 0}, {"x": 0.992, "y": -0.93, "c": "近傍", "n": "Xb10r [H]  n=803 cos0.99 難-0.93", "s": 0.255, "f": 0}, {"x": 0.991, "y": -0.839, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2503 cos0.99 難-0.84", "s": 0.795, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45918952863728146}, {"a": 0, "b": 2, "w": 0.4541013869162698}, {"a": 0, "b": 3, "w": 0.39121944861234725}, {"a": 0, "b": 4, "w": 0.40763718479540445}, {"a": 0, "b": 5, "w": 0.3717228467673712}, {"a": 0, "b": 6, "w": 0.34685468915119355}, {"a": 0, "b": 7, "w": 0.3702929069507841}, {"a": 0, "b": 8, "w": 0.3625003622515306}, {"a": 0, "b": 9, "w": 0.010631978815224263}, {"a": 0, "b": 10, "w": 0.13627702257373686}, {"a": 0, "b": 11, "w": 0.35627166357790074}, {"a": 0, "b": 12, "w": 0.592836303520487}, {"a": 0, "b": 13, "w": 0.2096697318001658}, {"a": 0, "b": 14, "w": 0.27945067942078794}, {"a": 0, "b": 15, "w": 0.27534830015628275}, {"a": 0, "b": 16, "w": 0.47785819924337314}, {"a": 0, "b": 17, "w": 0.000937940386564029}, {"a": 0, "b": 18, "w": 0.18594401975236785}, {"a": 0, "b": 19, "w": 0.29770896977517813}, {"a": 0, "b": 20, "w": 5.106415290612176e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-1.024,hiY=-0.655;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
