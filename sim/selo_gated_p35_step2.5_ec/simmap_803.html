<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Colors -Y&Co. Eurobeat Remix- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.023, "c": "種", "n": "Colors -Y&Co. Eurobeat Remix- [A]  n=3125 cos1.00 難-0.02", "s": 0.977, "f": 0}, {"x": 0.997, "y": -0.02, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2795 cos1.00 難-0.02", "s": 0.874, "f": 0}, {"x": 0.996, "y": -0.136, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos1.00 難-0.14", "s": 0.953, "f": 0}, {"x": 0.995, "y": 0.067, "c": "近傍", "n": "Roulette [A]  n=2595 cos1.00 難0.07", "s": 0.811, "f": 0}, {"x": 0.997, "y": -0.193, "c": "近傍", "n": "HYPER BOUNDARY GATE [A]  n=1598 cos1.00 難-0.19", "s": 0.5, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Be OK [A]  n=2981 cos0.99 難-0.14", "s": 0.932, "f": 0}, {"x": 0.993, "y": -0.019, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.02", "s": 0.891, "f": 0}, {"x": 0.993, "y": 0.002, "c": "近傍", "n": "BLO§OM [A]  n=2557 cos0.99 難0.00", "s": 0.8, "f": 0}, {"x": 0.993, "y": -0.056, "c": "近傍", "n": "Sephirot [A]  n=3055 cos0.99 難-0.06", "s": 0.955, "f": 0}, {"x": 0.994, "y": -0.136, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3181 cos0.99 難-0.14", "s": 0.995, "f": 0}, {"x": 0.993, "y": -0.057, "c": "近傍", "n": "Rise'n Beauty [A]  n=2870 cos0.99 難-0.06", "s": 0.897, "f": 0}, {"x": 0.993, "y": -0.12, "c": "近傍", "n": "SPEEDY CAT [A]  n=2412 cos0.99 難-0.12", "s": 0.754, "f": 0}, {"x": 0.994, "y": -0.144, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos0.99 難-0.14", "s": 0.977, "f": 0}, {"x": 0.992, "y": 0.041, "c": "近傍", "n": "POODLE [A]  n=2923 cos0.99 難0.04", "s": 0.914, "f": 0}, {"x": 0.994, "y": -0.177, "c": "近傍", "n": "REPLAY [A]  n=2245 cos0.99 難-0.18", "s": 0.702, "f": 0}, {"x": 0.991, "y": -0.016, "c": "近傍", "n": "Silly Love [A]  n=2738 cos0.99 難-0.02", "s": 0.856, "f": 0}, {"x": 0.993, "y": -0.155, "c": "近傍", "n": "Everlasting Last [A]  n=3198 cos0.99 難-0.15", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.103, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.99 難-0.10", "s": 0.918, "f": 0}, {"x": 0.995, "y": -0.244, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.24", "s": 0.866, "f": 0}, {"x": 0.991, "y": -0.109, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3055 cos0.99 難-0.11", "s": 0.955, "f": 0}, {"x": 0.991, "y": -0.144, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=992 cos0.99 難-0.14", "s": 0.31, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5602135839418194}, {"a": 0, "b": 2, "w": 0.4670139636087036}, {"a": 0, "b": 3, "w": 0.459813072287101}, {"a": 0, "b": 4, "w": 0.6081337782445455}, {"a": 0, "b": 5, "w": 0.2807832730955262}, {"a": 0, "b": 6, "w": 0.1706166453947051}, {"a": 0, "b": 7, "w": 5.44482237074817e-11}, {"a": 0, "b": 8, "w": 0.2096216003491349}, {"a": 0, "b": 9, "w": 0.23724654883049667}, {"a": 0, "b": 10, "w": 0.3793430537679455}, {"a": 0, "b": 11, "w": 0.3237596775255962}, {"a": 0, "b": 12, "w": 0.2067537970536838}, {"a": 0, "b": 13, "w": 0.13276679451506634}, {"a": 0, "b": 14, "w": 0.4259842100998964}, {"a": 0, "b": 15, "w": 0.21560190459965278}, {"a": 0, "b": 16, "w": 0.35356208549517454}, {"a": 0, "b": 17, "w": 0.19946682157832207}, {"a": 0, "b": 18, "w": 0.43083136883267736}, {"a": 0, "b": 19, "w": 0.07601802505565314}, {"a": 0, "b": 20, "w": 0.19774605322194572}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.269,hiY=0.092;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
