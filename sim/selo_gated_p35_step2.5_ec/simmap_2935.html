<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.128, "c": "種", "n": "∀ [A]  n=2452 cos1.00 難2.13", "s": 0.812, "f": 0}, {"x": 0.995, "y": 2.113, "c": "近傍", "n": "-65℃ [A]  n=2214 cos1.00 難2.11", "s": 0.733, "f": 0}, {"x": 0.99, "y": 2.126, "c": "近傍", "n": "Bow shock!! [L]  n=887 cos0.99 難2.13", "s": 0.294, "f": 0}, {"x": 0.988, "y": 2.124, "c": "近傍", "n": "嘆きの樹 [A]  n=3019 cos0.99 難2.12", "s": 1.0, "f": 0}, {"x": 0.996, "y": 2.189, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1872 cos1.00 難2.19", "s": 0.62, "f": 0}, {"x": 0.988, "y": 2.117, "c": "近傍", "n": "PERFECT GREAT!! [A]  n=553 cos0.99 難2.12", "s": 0.183, "f": 0}, {"x": 0.988, "y": 2.149, "c": "近傍", "n": "スキッテイエェエエェ!!!! [A]  n=1005 cos0.99 難2.15", "s": 0.333, "f": 0}, {"x": 0.985, "y": 2.163, "c": "近傍", "n": "SOLID WYVERN [L]  n=1045 cos0.99 難2.16", "s": 0.346, "f": 0}, {"x": 0.988, "y": 2.063, "c": "近傍", "n": "[ ]DENTITY [A]  n=1831 cos0.99 難2.06", "s": 0.606, "f": 0}, {"x": 0.993, "y": 2.04, "c": "近傍", "n": "Elektrick U-Phoria [L]  n=1406 cos0.99 難2.04", "s": 0.466, "f": 0}, {"x": 0.981, "y": 2.087, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [A]  n=809 cos0.98 難2.09", "s": 0.268, "f": 0}, {"x": 0.988, "y": 2.223, "c": "近傍", "n": "≡+≡ [L]  n=746 cos0.99 難2.22", "s": 0.247, "f": 0}, {"x": 0.986, "y": 2.041, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1606 cos0.99 難2.04", "s": 0.532, "f": 0}, {"x": 0.993, "y": 2.014, "c": "近傍", "n": "Blue Spring Express [A]  n=2855 cos0.99 難2.01", "s": 0.946, "f": 0}, {"x": 0.985, "y": 2.037, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2354 cos0.99 難2.04", "s": 0.78, "f": 0}, {"x": 0.977, "y": 2.1, "c": "近傍", "n": "Smashing Wedge [A]  n=2355 cos0.98 難2.10", "s": 0.78, "f": 0}, {"x": 0.985, "y": 2.028, "c": "近傍", "n": "君のハートにロックオン [L]  n=1867 cos0.98 難2.03", "s": 0.618, "f": 0}, {"x": 0.991, "y": 2.254, "c": "近傍", "n": "THE F∀UST [A]  n=2481 cos0.99 難2.25", "s": 0.822, "f": 0}, {"x": 0.988, "y": 2.01, "c": "近傍", "n": "suspicions [A]  n=1382 cos0.99 難2.01", "s": 0.458, "f": 0}, {"x": 0.979, "y": 2.196, "c": "近傍", "n": "Bad Encryption [A]  n=1818 cos0.98 難2.20", "s": 0.602, "f": 0}, {"x": 0.984, "y": 2.236, "c": "近傍", "n": "Vulnerability [A]  n=1145 cos0.98 難2.24", "s": 0.379, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6964380324032513}, {"a": 0, "b": 2, "w": 0.49269515138471587}, {"a": 0, "b": 3, "w": 0.43847299629634273}, {"a": 0, "b": 4, "w": 0.6491595560381532}, {"a": 0, "b": 5, "w": 0.5283733679470144}, {"a": 0, "b": 6, "w": 0.37314476598028057}, {"a": 0, "b": 7, "w": 0.4413748336187825}, {"a": 0, "b": 8, "w": 0.5203382982588747}, {"a": 0, "b": 9, "w": 0.5919406550551651}, {"a": 0, "b": 10, "w": 0.3896563026352291}, {"a": 0, "b": 11, "w": 1.9043877586000235e-11}, {"a": 0, "b": 12, "w": 0.4897475270954976}, {"a": 0, "b": 13, "w": 0.6460650235370509}, {"a": 0, "b": 14, "w": 0.29463134827949333}, {"a": 0, "b": 15, "w": 0.33885287810857634}, {"a": 0, "b": 16, "w": 0.39869869259155755}, {"a": 0, "b": 17, "w": 0.5690818651155671}, {"a": 0, "b": 18, "w": 0.5375984234849641}, {"a": 0, "b": 19, "w": 0.31700107086879037}, {"a": 0, "b": 20, "w": 0.45199425973160534}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=1.990,hiY=2.274;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
