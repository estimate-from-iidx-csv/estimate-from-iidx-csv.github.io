<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">StrayedCatz [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.56, "c": "種", "n": "StrayedCatz [H]  n=2624 cos1.00 難-0.56", "s": 0.807, "f": 0}, {"x": 0.988, "y": -0.497, "c": "近傍", "n": "TOXIC VIBRATION [H]  n=2913 cos0.99 難-0.50", "s": 0.896, "f": 0}, {"x": 0.988, "y": -0.648, "c": "近傍", "n": "Light and Cyber… [H]  n=2224 cos0.99 難-0.65", "s": 0.684, "f": 0}, {"x": 0.99, "y": -0.723, "c": "近傍", "n": "MEGAERA [H]  n=1642 cos0.99 難-0.72", "s": 0.505, "f": 0}, {"x": 0.988, "y": -0.418, "c": "近傍", "n": "疾風迅雷 [H]  n=2797 cos0.99 難-0.42", "s": 0.86, "f": 0}, {"x": 0.987, "y": -0.467, "c": "近傍", "n": "Sigmund [H]  n=2989 cos0.99 難-0.47", "s": 0.919, "f": 0}, {"x": 0.985, "y": -0.647, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.99 難-0.65", "s": 0.53, "f": 0}, {"x": 0.984, "y": -0.56, "c": "近傍", "n": "シムルグの目醒め [H]  n=2325 cos0.98 難-0.56", "s": 0.715, "f": 0}, {"x": 0.984, "y": -0.431, "c": "近傍", "n": "Hollywood Galaxy [H]  n=2639 cos0.98 難-0.43", "s": 0.812, "f": 0}, {"x": 0.983, "y": -0.558, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos0.98 難-0.56", "s": 0.651, "f": 0}, {"x": 0.984, "y": -0.706, "c": "近傍", "n": "紅牡丹 [H]  n=2666 cos0.98 難-0.71", "s": 0.82, "f": 0}, {"x": 0.984, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.98 難-0.73", "s": 0.622, "f": 0}, {"x": 0.99, "y": -0.258, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.26", "s": 0.961, "f": 0}, {"x": 0.984, "y": -0.74, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.98 難-0.74", "s": 0.228, "f": 0}, {"x": 0.983, "y": -0.717, "c": "近傍", "n": "∀ [H]  n=2296 cos0.98 難-0.72", "s": 0.706, "f": 0}, {"x": 0.983, "y": -0.392, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3252 cos0.98 難-0.39", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.842, "c": "近傍", "n": "HYENA [H]  n=2379 cos0.99 難-0.84", "s": 0.732, "f": 0}, {"x": 0.98, "y": -0.581, "c": "近傍", "n": "Carmina [H]  n=2220 cos0.98 難-0.58", "s": 0.683, "f": 0}, {"x": 0.987, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.99 難-0.26", "s": 0.805, "f": 0}, {"x": 0.984, "y": -0.786, "c": "近傍", "n": "華麗なる大犬円舞曲 [H]  n=2030 cos0.98 難-0.79", "s": 0.624, "f": 0}, {"x": 0.981, "y": -0.39, "c": "近傍", "n": "entelecheia [H]  n=2808 cos0.98 難-0.39", "s": 0.863, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35603767839146416}, {"a": 0, "b": 2, "w": 0.19431673211714984}, {"a": 0, "b": 3, "w": 0.4251117792414534}, {"a": 0, "b": 4, "w": 0.26369128267736675}, {"a": 0, "b": 5, "w": 0.3171192311236102}, {"a": 0, "b": 6, "w": 0.31594493331191265}, {"a": 0, "b": 7, "w": 0.2288983580319981}, {"a": 0, "b": 8, "w": 0.27286360751885463}, {"a": 0, "b": 9, "w": 0.030054868396259038}, {"a": 0, "b": 10, "w": 0.1869408617187296}, {"a": 0, "b": 11, "w": 3.4428904172045804e-11}, {"a": 0, "b": 12, "w": 0.32705124185257783}, {"a": 0, "b": 13, "w": 0.26352004137765306}, {"a": 0, "b": 14, "w": 0.16556931325494662}, {"a": 0, "b": 15, "w": 0.09422456598108475}, {"a": 0, "b": 16, "w": 0.24315498319119366}, {"a": 0, "b": 17, "w": 0.18689344045964118}, {"a": 0, "b": 18, "w": 0.32335437456323257}, {"a": 0, "b": 19, "w": 0.2736232449123406}, {"a": 0, "b": 20, "w": 0.21121795759569717}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.889,hiY=-0.210;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
