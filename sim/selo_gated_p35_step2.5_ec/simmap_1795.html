<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CHECKING YOU OUT [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.597, "c": "種", "n": "CHECKING YOU OUT [A]  n=3264 cos1.00 難0.60", "s": 0.861, "f": 0}, {"x": 0.967, "y": 0.537, "c": "近傍", "n": "ラクエン [A]  n=2997 cos0.97 難0.54", "s": 0.791, "f": 0}, {"x": 0.964, "y": 0.36, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3347 cos0.96 難0.36", "s": 0.883, "f": 0}, {"x": 0.968, "y": 0.269, "c": "近傍", "n": "Halfway of promise [A]  n=3452 cos0.97 難0.27", "s": 0.911, "f": 0}, {"x": 0.957, "y": 0.466, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2979 cos0.96 難0.47", "s": 0.786, "f": 0}, {"x": 0.963, "y": 0.245, "c": "近傍", "n": "Digitank System [A]  n=3622 cos0.96 難0.24", "s": 0.955, "f": 0}, {"x": 0.975, "y": 0.09, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2867 cos0.97 難0.09", "s": 0.756, "f": 0}, {"x": 0.963, "y": 0.217, "c": "近傍", "n": "Hella Deep [A]  n=2813 cos0.96 難0.22", "s": 0.742, "f": 0}, {"x": 0.97, "y": 0.074, "c": "近傍", "n": "Really Love [A]  n=3148 cos0.97 難0.07", "s": 0.83, "f": 0}, {"x": 0.965, "y": 0.111, "c": "近傍", "n": "SWEET LAB [A]  n=2480 cos0.96 難0.11", "s": 0.654, "f": 0}, {"x": 0.952, "y": 0.358, "c": "近傍", "n": "rough percussionythm [A]  n=2835 cos0.95 難0.36", "s": 0.748, "f": 0}, {"x": 0.975, "y": 0.001, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.97 難0.00", "s": 0.614, "f": 0}, {"x": 0.958, "y": 0.132, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [H]  n=3791 cos0.96 難0.13", "s": 1.0, "f": 0}, {"x": 0.951, "y": 0.256, "c": "近傍", "n": "Catch Me [L]  n=733 cos0.95 難0.26", "s": 0.193, "f": 0}, {"x": 0.946, "y": 0.367, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3244 cos0.95 難0.37", "s": 0.856, "f": 0}, {"x": 0.963, "y": 0.014, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2166 cos0.96 難0.01", "s": 0.571, "f": 0}, {"x": 0.966, "y": -0.018, "c": "近傍", "n": "Shamshir [A]  n=1509 cos0.97 難-0.02", "s": 0.398, "f": 0}, {"x": 0.945, "y": 0.376, "c": "近傍", "n": "Theory [A]  n=2922 cos0.94 難0.38", "s": 0.771, "f": 0}, {"x": 0.953, "y": 0.145, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3740 cos0.95 難0.14", "s": 0.987, "f": 0}, {"x": 0.952, "y": 0.132, "c": "近傍", "n": "灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A]  n=2958 cos0.95 難0.13", "s": 0.78, "f": 0}, {"x": 0.947, "y": 0.186, "c": "近傍", "n": "250bpm [A]  n=2656 cos0.95 難0.19", "s": 0.701, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3933451751704379}, {"a": 0, "b": 2, "w": 0.35544358521966424}, {"a": 0, "b": 3, "w": 0.4082274713715568}, {"a": 0, "b": 4, "w": 0.3181282252692482}, {"a": 0, "b": 5, "w": 0.2998384830032217}, {"a": 0, "b": 6, "w": 0.44873969884405196}, {"a": 0, "b": 7, "w": 0.3666877686857877}, {"a": 0, "b": 8, "w": 0.41920177938963954}, {"a": 0, "b": 9, "w": 0.3776020198709664}, {"a": 0, "b": 10, "w": 0.14243734070862457}, {"a": 0, "b": 11, "w": 0.4626531792792813}, {"a": 0, "b": 12, "w": 0.10419285130872036}, {"a": 0, "b": 13, "w": 0.18949907636059016}, {"a": 0, "b": 14, "w": 0.13063923514045062}, {"a": 0, "b": 15, "w": 0.35393166052663894}, {"a": 0, "b": 16, "w": 0.3478985545242472}, {"a": 0, "b": 17, "w": 2.1900703472965688e-11}, {"a": 0, "b": 18, "w": 0.21792707616724938}, {"a": 0, "b": 19, "w": 0.2357195264584827}, {"a": 0, "b": 20, "w": 0.24367011061081023}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.940,hiX=1.004,loY=-0.067,hiY=0.646;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
