<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Special One [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.415, "c": "種", "n": "Special One [A]  n=2860 cos1.00 難-0.42", "s": 0.815, "f": 0}, {"x": 0.991, "y": -0.488, "c": "近傍", "n": "end of world [H]  n=1762 cos0.99 難-0.49", "s": 0.502, "f": 0}, {"x": 0.991, "y": -0.366, "c": "近傍", "n": "808monkey [A]  n=2023 cos0.99 難-0.37", "s": 0.577, "f": 0}, {"x": 0.993, "y": -0.248, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos0.99 難-0.25", "s": 0.791, "f": 0}, {"x": 0.991, "y": -0.31, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos0.99 難-0.31", "s": 0.93, "f": 0}, {"x": 0.995, "y": -0.175, "c": "近傍", "n": "Silvia Drive [A]  n=2194 cos0.99 難-0.18", "s": 0.625, "f": 0}, {"x": 0.992, "y": -0.212, "c": "近傍", "n": "7 Colors [A]  n=1872 cos0.99 難-0.21", "s": 0.533, "f": 0}, {"x": 0.989, "y": -0.315, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos0.99 難-0.31", "s": 0.742, "f": 0}, {"x": 0.989, "y": -0.317, "c": "近傍", "n": "KOTONOHA ft. Kotoha [A]  n=1510 cos0.99 難-0.32", "s": 0.43, "f": 0}, {"x": 0.989, "y": -0.299, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos0.99 難-0.30", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.308, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.31", "s": 0.657, "f": 0}, {"x": 0.992, "y": -0.666, "c": "近傍", "n": "LAB [H]  n=1742 cos0.99 難-0.67", "s": 0.496, "f": 0}, {"x": 0.988, "y": -0.313, "c": "近傍", "n": "MINT [H]  n=2436 cos0.99 難-0.31", "s": 0.694, "f": 0}, {"x": 0.988, "y": -0.393, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.39", "s": 0.729, "f": 0}, {"x": 0.99, "y": -0.203, "c": "近傍", "n": "LOVE B.B.B [A]  n=3198 cos0.99 難-0.20", "s": 0.911, "f": 0}, {"x": 0.99, "y": -0.221, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.22", "s": 0.727, "f": 0}, {"x": 0.993, "y": -0.133, "c": "近傍", "n": "dual control [A]  n=2202 cos0.99 難-0.13", "s": 0.628, "f": 0}, {"x": 0.989, "y": -0.239, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.24", "s": 0.928, "f": 0}, {"x": 0.987, "y": -0.431, "c": "近傍", "n": "Hollywood Galaxy [H]  n=2639 cos0.99 難-0.43", "s": 0.752, "f": 0}, {"x": 0.987, "y": -0.333, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos0.99 難-0.33", "s": 0.82, "f": 0}, {"x": 0.988, "y": -0.235, "c": "近傍", "n": "A [H]  n=3015 cos0.99 難-0.23", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1879095899039751}, {"a": 0, "b": 2, "w": 0.24436500864553667}, {"a": 0, "b": 3, "w": 0.3182456694443946}, {"a": 0, "b": 4, "w": 0.23544396015154168}, {"a": 0, "b": 5, "w": 0.38303915864154603}, {"a": 0, "b": 6, "w": 0.24548604471458835}, {"a": 0, "b": 7, "w": 0.15543006200933684}, {"a": 0, "b": 8, "w": 0.19709192397498299}, {"a": 0, "b": 9, "w": 0.16299506481335269}, {"a": 0, "b": 10, "w": 0.19165118714336116}, {"a": 0, "b": 11, "w": 0.3145367127538279}, {"a": 0, "b": 12, "w": 0.09014669470395997}, {"a": 0, "b": 13, "w": 0.11874235726480264}, {"a": 0, "b": 14, "w": 0.2140452267167292}, {"a": 0, "b": 15, "w": 0.16045793596856173}, {"a": 0, "b": 16, "w": 0.32204886121961673}, {"a": 0, "b": 17, "w": 0.15994299938301182}, {"a": 0, "b": 18, "w": 5.266909131051989e-11}, {"a": 0, "b": 19, "w": 0.1357805711880803}, {"a": 0, "b": 20, "w": 0.05923728557458663}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.708,hiY=-0.090;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
