<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Timepiece phase II (CN Ver.) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.242, "c": "種", "n": "Timepiece phase II (CN Ver.) [H]  n=2857 cos1.00 難-0.24", "s": 0.824, "f": 0}, {"x": 0.993, "y": -0.019, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.99 難-0.02", "s": 0.972, "f": 0}, {"x": 0.987, "y": -0.248, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.99 難-0.25", "s": 0.725, "f": 0}, {"x": 0.99, "y": -0.0, "c": "近傍", "n": "Deep Sea Mystery [A]  n=1856 cos0.99 難-0.00", "s": 0.535, "f": 0}, {"x": 0.986, "y": -0.238, "c": "近傍", "n": "Infinity Mirror [A]  n=3000 cos0.99 難-0.24", "s": 0.866, "f": 0}, {"x": 0.983, "y": -0.186, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.98 難-0.19", "s": 0.509, "f": 0}, {"x": 0.983, "y": -0.146, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.98 難-0.15", "s": 0.359, "f": 0}, {"x": 0.983, "y": -0.005, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.98 難-0.00", "s": 0.824, "f": 0}, {"x": 0.98, "y": -0.411, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.98 難-0.41", "s": 0.323, "f": 0}, {"x": 0.978, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.98 難-0.37", "s": 0.271, "f": 0}, {"x": 0.983, "y": 0.156, "c": "近傍", "n": "Urban Constellations [A]  n=3173 cos0.98 難0.16", "s": 0.915, "f": 0}, {"x": 0.99, "y": 0.311, "c": "近傍", "n": "Zenith [A]  n=2366 cos0.99 難0.31", "s": 0.683, "f": 0}, {"x": 0.977, "y": -0.199, "c": "近傍", "n": "Arcana [A]  n=3097 cos0.98 難-0.20", "s": 0.894, "f": 0}, {"x": 0.977, "y": -0.414, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2947 cos0.98 難-0.41", "s": 0.85, "f": 0}, {"x": 0.976, "y": -0.343, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.98 難-0.34", "s": 0.715, "f": 0}, {"x": 0.976, "y": -0.188, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.98 難-0.19", "s": 0.359, "f": 0}, {"x": 0.976, "y": -0.352, "c": "近傍", "n": "THE BLACK KNIGHT [H]  n=2724 cos0.98 難-0.35", "s": 0.786, "f": 0}, {"x": 0.98, "y": 0.156, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1763 cos0.98 難0.16", "s": 0.509, "f": 0}, {"x": 0.976, "y": -0.069, "c": "近傍", "n": "Donkey Donk [A]  n=3466 cos0.98 難-0.07", "s": 1.0, "f": 0}, {"x": 0.978, "y": 0.147, "c": "近傍", "n": "Clione [L]  n=3199 cos0.98 難0.15", "s": 0.923, "f": 0}, {"x": 0.975, "y": -0.473, "c": "近傍", "n": "TOGAKUSHI [H]  n=2630 cos0.97 難-0.47", "s": 0.759, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5036373193067272}, {"a": 0, "b": 2, "w": 0.4713154585276079}, {"a": 0, "b": 3, "w": 0.5238732768874443}, {"a": 0, "b": 4, "w": 0.376390322249306}, {"a": 0, "b": 5, "w": 0.40311685546902376}, {"a": 0, "b": 6, "w": 0.37658152185323523}, {"a": 0, "b": 7, "w": 0.31540377872472725}, {"a": 0, "b": 8, "w": 0.2054420956489047}, {"a": 0, "b": 9, "w": 0.11036868163752267}, {"a": 0, "b": 10, "w": 0.3864815019912786}, {"a": 0, "b": 11, "w": 0.542377831880342}, {"a": 0, "b": 12, "w": 0.23917623581854996}, {"a": 0, "b": 13, "w": 2.7756574816351076e-11}, {"a": 0, "b": 14, "w": 0.2809163424692156}, {"a": 0, "b": 15, "w": 0.23042299251366027}, {"a": 0, "b": 16, "w": 0.2277175305674809}, {"a": 0, "b": 17, "w": 0.34926418082905175}, {"a": 0, "b": 18, "w": 0.2831056798525635}, {"a": 0, "b": 19, "w": 0.33288992546761975}, {"a": 0, "b": 20, "w": 0.27216896367976695}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=-0.536,hiY=0.373;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
