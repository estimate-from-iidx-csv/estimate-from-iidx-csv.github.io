<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">深淵に捧ぐレクイエム [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.404, "c": "種", "n": "深淵に捧ぐレクイエム [H]  n=1519 cos1.00 難-1.40", "s": 0.679, "f": 0}, {"x": 0.95, "y": -1.267, "c": "近傍", "n": "NZM [H]  n=1596 cos0.95 難-1.27", "s": 0.713, "f": 0}, {"x": 0.949, "y": -1.588, "c": "近傍", "n": "神のシナリオ [H]  n=664 cos0.95 難-1.59", "s": 0.297, "f": 0}, {"x": 0.959, "y": -1.056, "c": "近傍", "n": "烽火連天の刃 [H]  n=1241 cos0.96 難-1.06", "s": 0.555, "f": 0}, {"x": 0.938, "y": -1.287, "c": "近傍", "n": "Summerlights(IIDX Edition) [H]  n=1470 cos0.94 難-1.29", "s": 0.657, "f": 0}, {"x": 0.952, "y": -1.054, "c": "近傍", "n": "Acid Pumper [H]  n=2061 cos0.95 難-1.05", "s": 0.921, "f": 0}, {"x": 0.93, "y": -1.298, "c": "近傍", "n": "TRIUMPH [H]  n=1661 cos0.93 難-1.30", "s": 0.742, "f": 0}, {"x": 0.931, "y": -1.554, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.93 難-1.55", "s": 0.476, "f": 0}, {"x": 0.938, "y": -1.073, "c": "近傍", "n": "Megalara Garuda [H]  n=1487 cos0.94 難-1.07", "s": 0.664, "f": 0}, {"x": 0.923, "y": -1.297, "c": "近傍", "n": "BEAT PRISONER [H]  n=1425 cos0.92 難-1.30", "s": 0.637, "f": 0}, {"x": 0.921, "y": -1.39, "c": "近傍", "n": "Donkey Donk [H]  n=1724 cos0.92 難-1.39", "s": 0.77, "f": 0}, {"x": 0.933, "y": -1.723, "c": "近傍", "n": "Afterimage d'automne [H]  n=931 cos0.93 難-1.72", "s": 0.416, "f": 0}, {"x": 0.954, "y": -1.895, "c": "近傍", "n": "of the first magnitude [H]  n=847 cos0.95 難-1.89", "s": 0.378, "f": 0}, {"x": 0.962, "y": -0.822, "c": "近傍", "n": "EROICA [H]  n=2238 cos0.96 難-0.82", "s": 1.0, "f": 0}, {"x": 0.913, "y": -1.423, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.91 難-1.42", "s": 0.766, "f": 0}, {"x": 0.961, "y": -0.808, "c": "近傍", "n": "栄冠のカンパネラ [H]  n=1245 cos0.96 難-0.81", "s": 0.556, "f": 0}, {"x": 0.915, "y": -1.59, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.92 難-1.59", "s": 0.793, "f": 0}, {"x": 0.912, "y": -1.496, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.91 難-1.50", "s": 0.447, "f": 0}, {"x": 0.919, "y": -1.125, "c": "近傍", "n": "Reflux [H]  n=1964 cos0.92 難-1.12", "s": 0.878, "f": 0}, {"x": 0.925, "y": -1.037, "c": "近傍", "n": "Visterhv [H]  n=2069 cos0.93 難-1.04", "s": 0.924, "f": 0}, {"x": 0.916, "y": -1.176, "c": "近傍", "n": "DIVINE JUDGEMENT [H]  n=624 cos0.92 難-1.18", "s": 0.279, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.20697446890950344}, {"a": 0, "b": 2, "w": 0.23916021480219096}, {"a": 0, "b": 3, "w": 0.3566735345789902}, {"a": 0, "b": 4, "w": 0.14666798409646686}, {"a": 0, "b": 5, "w": 0.2985845774936813}, {"a": 0, "b": 6, "w": 0.1649444222660299}, {"a": 0, "b": 7, "w": 0.10083551960030435}, {"a": 0, "b": 8, "w": 0.17056190190966647}, {"a": 0, "b": 9, "w": 0.11879644483490115}, {"a": 0, "b": 10, "w": 0.11661834083890266}, {"a": 0, "b": 11, "w": 0.10514262792026818}, {"a": 0, "b": 12, "w": 0.220331740996765}, {"a": 0, "b": 13, "w": 0.38128849515882757}, {"a": 0, "b": 14, "w": 0.0527141255654735}, {"a": 0, "b": 15, "w": 0.3680875900758718}, {"a": 0, "b": 16, "w": 1.9876544854469103e-11}, {"a": 0, "b": 17, "w": 0.02636270294569587}, {"a": 0, "b": 18, "w": 0.0904236533778231}, {"a": 0, "b": 19, "w": 0.12636128949638104}, {"a": 0, "b": 20, "w": 0.08860106834416503}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.905,hiX=1.007,loY=-1.981,hiY=-0.721;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
