<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ハイテックトキオ [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.115, "c": "種", "n": "ハイテックトキオ [L]  n=2026 cos1.00 難1.12", "s": 0.6, "f": 0}, {"x": 0.994, "y": 1.201, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.99 難1.20", "s": 0.417, "f": 0}, {"x": 0.991, "y": 1.115, "c": "近傍", "n": "Flashes [A]  n=3308 cos0.99 難1.12", "s": 0.98, "f": 0}, {"x": 0.991, "y": 1.073, "c": "近傍", "n": "THE DAY OF JUBILATIONS [A]  n=3058 cos0.99 難1.07", "s": 0.906, "f": 0}, {"x": 0.991, "y": 1.146, "c": "近傍", "n": "24h Endurance Race [A]  n=1710 cos0.99 難1.15", "s": 0.507, "f": 0}, {"x": 0.991, "y": 1.184, "c": "近傍", "n": "Xb10r [A]  n=1448 cos0.99 難1.18", "s": 0.429, "f": 0}, {"x": 0.99, "y": 1.067, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [A]  n=2585 cos0.99 難1.07", "s": 0.766, "f": 0}, {"x": 0.991, "y": 1.026, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1132 cos0.99 難1.03", "s": 0.335, "f": 0}, {"x": 0.989, "y": 1.143, "c": "近傍", "n": "B.O.D.Y. [A]  n=2092 cos0.99 難1.14", "s": 0.62, "f": 0}, {"x": 0.989, "y": 1.113, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2239 cos0.99 難1.11", "s": 0.663, "f": 0}, {"x": 0.988, "y": 1.125, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2513 cos0.99 難1.13", "s": 0.744, "f": 0}, {"x": 0.989, "y": 1.198, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.99 難1.20", "s": 0.286, "f": 0}, {"x": 0.991, "y": 0.983, "c": "近傍", "n": "EVANESCENT [A]  n=3032 cos0.99 難0.98", "s": 0.898, "f": 0}, {"x": 0.99, "y": 1.239, "c": "近傍", "n": "BIGWAVERS [A]  n=1782 cos0.99 難1.24", "s": 0.528, "f": 0}, {"x": 0.99, "y": 1.234, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3030 cos0.99 難1.23", "s": 0.898, "f": 0}, {"x": 0.99, "y": 0.983, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [A]  n=3293 cos0.99 難0.98", "s": 0.975, "f": 0}, {"x": 0.987, "y": 1.121, "c": "近傍", "n": "Drop Syndicate [A]  n=1341 cos0.99 難1.12", "s": 0.397, "f": 0}, {"x": 0.986, "y": 1.096, "c": "近傍", "n": "Sol Cosine Job 2 [A]  n=3236 cos0.99 難1.10", "s": 0.959, "f": 0}, {"x": 0.988, "y": 0.998, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3376 cos0.99 難1.00", "s": 1.0, "f": 0}, {"x": 0.991, "y": 1.296, "c": "近傍", "n": "ONIGOROSHI [A]  n=2738 cos0.99 難1.30", "s": 0.811, "f": 0}, {"x": 0.988, "y": 1.004, "c": "近傍", "n": "From Human Blood [A]  n=984 cos0.99 難1.00", "s": 0.291, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6384258017763278}, {"a": 0, "b": 2, "w": 0.4285420407627577}, {"a": 0, "b": 3, "w": 0.38793466291741885}, {"a": 0, "b": 4, "w": 0.5667034710760344}, {"a": 0, "b": 5, "w": 0.4050555081321281}, {"a": 0, "b": 6, "w": 0.4066323406566691}, {"a": 0, "b": 7, "w": 0.5111849665494292}, {"a": 0, "b": 8, "w": 0.4710418278112327}, {"a": 0, "b": 9, "w": 0.43441311705052665}, {"a": 0, "b": 10, "w": 0.4207070965206474}, {"a": 0, "b": 11, "w": 0.4698326946046105}, {"a": 0, "b": 12, "w": 0.5186545584666744}, {"a": 0, "b": 13, "w": 0.2689166526959905}, {"a": 0, "b": 14, "w": 0.4449004279155705}, {"a": 0, "b": 15, "w": 0.5012326991644552}, {"a": 0, "b": 16, "w": 2.3820279082542584e-11}, {"a": 0, "b": 17, "w": 0.4138359905697335}, {"a": 0, "b": 18, "w": 0.26393769603487816}, {"a": 0, "b": 19, "w": 0.4981247419929482}, {"a": 0, "b": 20, "w": 0.3513340276084449}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=0.958,hiY=1.321;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
