<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Energy Drive [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.085, "c": "種", "n": "Energy Drive [A]  n=3461 cos1.00 難0.08", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.156, "c": "近傍", "n": "Urban Constellations [A]  n=3173 cos0.99 難0.16", "s": 0.917, "f": 0}, {"x": 0.995, "y": 0.231, "c": "近傍", "n": "鬼天 [A]  n=3356 cos1.00 難0.23", "s": 0.97, "f": 0}, {"x": 0.994, "y": 0.081, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2858 cos0.99 難0.08", "s": 0.826, "f": 0}, {"x": 0.994, "y": -0.086, "c": "近傍", "n": "Almace [A]  n=3119 cos0.99 難-0.09", "s": 0.901, "f": 0}, {"x": 0.993, "y": -0.137, "c": "近傍", "n": "If [A]  n=2170 cos0.99 難-0.14", "s": 0.627, "f": 0}, {"x": 0.99, "y": 0.122, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos0.99 難0.12", "s": 0.707, "f": 0}, {"x": 0.99, "y": 0.147, "c": "近傍", "n": "Clione [L]  n=3199 cos0.99 難0.15", "s": 0.924, "f": 0}, {"x": 0.991, "y": 0.216, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.99 難0.22", "s": 0.73, "f": 0}, {"x": 0.993, "y": -0.199, "c": "近傍", "n": "Arcana [A]  n=3097 cos0.99 難-0.20", "s": 0.895, "f": 0}, {"x": 0.991, "y": 0.298, "c": "近傍", "n": "Dawn Saga [A]  n=2733 cos0.99 難0.30", "s": 0.79, "f": 0}, {"x": 0.989, "y": 0.125, "c": "近傍", "n": "voice of echo. [A]  n=814 cos0.99 難0.13", "s": 0.235, "f": 0}, {"x": 0.99, "y": -0.088, "c": "近傍", "n": "That Feeling [A]  n=2075 cos0.99 難-0.09", "s": 0.6, "f": 0}, {"x": 0.989, "y": -0.005, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.99 難-0.00", "s": 0.825, "f": 0}, {"x": 0.99, "y": 0.261, "c": "近傍", "n": "Rising in the Sun(original mix) [A]  n=2243 cos0.99 難0.26", "s": 0.648, "f": 0}, {"x": 0.992, "y": 0.385, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2466 cos0.99 難0.39", "s": 0.713, "f": 0}, {"x": 0.988, "y": 0.138, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.99 難0.14", "s": 0.807, "f": 0}, {"x": 0.991, "y": -0.187, "c": "近傍", "n": "Several Words [A]  n=3039 cos0.99 難-0.19", "s": 0.878, "f": 0}, {"x": 0.988, "y": 0.213, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.21", "s": 0.962, "f": 0}, {"x": 0.987, "y": 0.032, "c": "近傍", "n": "Funky Quirky [A]  n=519 cos0.99 難0.03", "s": 0.15, "f": 0}, {"x": 0.987, "y": -0.052, "c": "近傍", "n": "Heavenly Sun (IIDX VERSION) [A]  n=2887 cos0.99 難-0.05", "s": 0.834, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5984279908515155}, {"a": 0, "b": 2, "w": 0.6241192560869013}, {"a": 0, "b": 3, "w": 0.5898357224636848}, {"a": 0, "b": 4, "w": 0.606516777490451}, {"a": 0, "b": 5, "w": 0.46775131860388475}, {"a": 0, "b": 6, "w": 0.31071960733777104}, {"a": 0, "b": 7, "w": 0.5013147114643399}, {"a": 0, "b": 8, "w": 0.4652924056914728}, {"a": 0, "b": 9, "w": 0.4133469581898457}, {"a": 0, "b": 10, "w": 0.41520084494488874}, {"a": 0, "b": 11, "w": 0.41103386673942743}, {"a": 0, "b": 12, "w": 0.36312551787000535}, {"a": 0, "b": 13, "w": 0.3415644601751153}, {"a": 0, "b": 14, "w": 0.48425690696589097}, {"a": 0, "b": 15, "w": 0.4418429962383028}, {"a": 0, "b": 16, "w": 0.45124345528385656}, {"a": 0, "b": 17, "w": 0.5021741886594271}, {"a": 0, "b": 18, "w": 0.4240902868700783}, {"a": 0, "b": 19, "w": 0.42741670035355595}, {"a": 0, "b": 20, "w": 3.095457223878384e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.246,hiY=0.432;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
