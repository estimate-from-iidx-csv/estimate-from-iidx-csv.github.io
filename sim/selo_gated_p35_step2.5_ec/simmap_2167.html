<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Tail Lights [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.496, "c": "種", "n": "Tail Lights [A]  n=2429 cos1.00 難0.50", "s": 0.64, "f": 0}, {"x": 0.997, "y": 0.506, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2944 cos1.00 難0.51", "s": 0.775, "f": 0}, {"x": 0.994, "y": 0.525, "c": "近傍", "n": "LIGHTNING STRIKES [A]  n=3324 cos0.99 難0.52", "s": 0.875, "f": 0}, {"x": 0.993, "y": 0.488, "c": "近傍", "n": "Apocalypse [A]  n=3646 cos0.99 難0.49", "s": 0.96, "f": 0}, {"x": 0.994, "y": 0.426, "c": "近傍", "n": "千年ノ理 [A]  n=3797 cos0.99 難0.43", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.55, "c": "近傍", "n": "snow storm [L]  n=3339 cos0.99 難0.55", "s": 0.879, "f": 0}, {"x": 0.992, "y": 0.496, "c": "近傍", "n": "ZERO-ONE [L]  n=1136 cos0.99 難0.50", "s": 0.299, "f": 0}, {"x": 0.991, "y": 0.503, "c": "近傍", "n": "Todestrieb [A]  n=3776 cos0.99 難0.50", "s": 0.994, "f": 0}, {"x": 0.994, "y": 0.356, "c": "近傍", "n": "Around The Galaxy [A]  n=3231 cos0.99 難0.36", "s": 0.851, "f": 0}, {"x": 0.991, "y": 0.495, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3105 cos0.99 難0.49", "s": 0.818, "f": 0}, {"x": 0.992, "y": 0.384, "c": "近傍", "n": "明鏡止水 [A]  n=3157 cos0.99 難0.38", "s": 0.831, "f": 0}, {"x": 0.991, "y": 0.547, "c": "近傍", "n": "LASER CRUSTER [A]  n=3656 cos0.99 難0.55", "s": 0.963, "f": 0}, {"x": 0.992, "y": 0.631, "c": "近傍", "n": "刃図羅 [A]  n=3589 cos0.99 難0.63", "s": 0.945, "f": 0}, {"x": 0.993, "y": 0.349, "c": "近傍", "n": "ANDROMEDA [A]  n=3490 cos0.99 難0.35", "s": 0.919, "f": 0}, {"x": 0.99, "y": 0.504, "c": "近傍", "n": "Mukade [A]  n=1863 cos0.99 難0.50", "s": 0.491, "f": 0}, {"x": 0.99, "y": 0.563, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3237 cos0.99 難0.56", "s": 0.853, "f": 0}, {"x": 0.99, "y": 0.494, "c": "近傍", "n": "Speculation [A]  n=1818 cos0.99 難0.49", "s": 0.479, "f": 0}, {"x": 0.989, "y": 0.473, "c": "近傍", "n": "Raspberry Railgun [A]  n=3614 cos0.99 難0.47", "s": 0.952, "f": 0}, {"x": 0.991, "y": 0.354, "c": "近傍", "n": "XANADU OF TWO [L]  n=734 cos0.99 難0.35", "s": 0.193, "f": 0}, {"x": 0.989, "y": 0.587, "c": "近傍", "n": "CUE CUE RESCUE [L]  n=1252 cos0.99 難0.59", "s": 0.33, "f": 0}, {"x": 0.993, "y": 0.289, "c": "近傍", "n": "ANTHEM LANDING [A]  n=3586 cos0.99 難0.29", "s": 0.944, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46921481751362815}, {"a": 0, "b": 2, "w": 0.23159744251027348}, {"a": 0, "b": 3, "w": 0.30556346552634917}, {"a": 0, "b": 4, "w": 0.42002466544099737}, {"a": 0, "b": 5, "w": 0.3032473474948947}, {"a": 0, "b": 6, "w": 0.4080166249379824}, {"a": 0, "b": 7, "w": 3.784050850441645e-11}, {"a": 0, "b": 8, "w": 0.4535140143603076}, {"a": 0, "b": 9, "w": 0.36407921192709125}, {"a": 0, "b": 10, "w": 0.40420688410399386}, {"a": 0, "b": 11, "w": 0.25715886947295064}, {"a": 0, "b": 12, "w": 0.26015536949171314}, {"a": 0, "b": 13, "w": 0.2540434486633344}, {"a": 0, "b": 14, "w": 0.26764834462653386}, {"a": 0, "b": 15, "w": 0.22766094088915345}, {"a": 0, "b": 16, "w": 0.09073367246169994}, {"a": 0, "b": 17, "w": 0.23236538720489852}, {"a": 0, "b": 18, "w": 0.27032481185187895}, {"a": 0, "b": 19, "w": 0.20543373014064892}, {"a": 0, "b": 20, "w": 0.450555050254836}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.261,hiY=0.658;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
