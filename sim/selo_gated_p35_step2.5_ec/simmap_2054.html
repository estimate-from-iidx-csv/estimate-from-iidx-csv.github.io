<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">prompt [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.24, "c": "種", "n": "prompt [A]  n=3337 cos1.00 難0.24", "s": 0.939, "f": 0}, {"x": 0.999, "y": 0.279, "c": "近傍", "n": "月とミルク [A]  n=2662 cos1.00 難0.28", "s": 0.749, "f": 0}, {"x": 0.997, "y": 0.224, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos1.00 難0.22", "s": 0.968, "f": 0}, {"x": 0.995, "y": 0.18, "c": "近傍", "n": "華蝶風雪 [A]  n=3533 cos1.00 難0.18", "s": 0.994, "f": 0}, {"x": 0.997, "y": 0.088, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos1.00 難0.09", "s": 0.838, "f": 0}, {"x": 0.994, "y": 0.179, "c": "近傍", "n": "Vulkan [A]  n=3518 cos0.99 難0.18", "s": 0.99, "f": 0}, {"x": 0.994, "y": 0.224, "c": "近傍", "n": "squall [A]  n=1407 cos0.99 難0.22", "s": 0.396, "f": 0}, {"x": 0.994, "y": 0.217, "c": "近傍", "n": "≡+≡ [A]  n=2296 cos0.99 難0.22", "s": 0.646, "f": 0}, {"x": 0.994, "y": 0.209, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3555 cos0.99 難0.21", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.385, "c": "近傍", "n": "rainbow rainbow [A]  n=3315 cos0.99 難0.39", "s": 0.932, "f": 0}, {"x": 0.992, "y": 0.228, "c": "近傍", "n": "Take It Easy [A]  n=3281 cos0.99 難0.23", "s": 0.923, "f": 0}, {"x": 0.993, "y": 0.139, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難0.14", "s": 0.323, "f": 0}, {"x": 0.992, "y": 0.155, "c": "近傍", "n": "輪廻の鴉 [A]  n=1953 cos0.99 難0.15", "s": 0.549, "f": 0}, {"x": 0.992, "y": 0.271, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3281 cos0.99 難0.27", "s": 0.923, "f": 0}, {"x": 0.994, "y": 0.055, "c": "近傍", "n": "SnapSkipSpark [A]  n=1095 cos0.99 難0.05", "s": 0.308, "f": 0}, {"x": 0.995, "y": 0.04, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2768 cos1.00 難0.04", "s": 0.779, "f": 0}, {"x": 0.992, "y": 0.275, "c": "近傍", "n": "きみのせかい [A]  n=1145 cos0.99 難0.28", "s": 0.322, "f": 0}, {"x": 0.994, "y": 0.052, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos0.99 難0.05", "s": 0.843, "f": 0}, {"x": 0.993, "y": 0.069, "c": "近傍", "n": "ランカーキラーガール [A]  n=3145 cos0.99 難0.07", "s": 0.885, "f": 0}, {"x": 0.991, "y": 0.206, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3408 cos0.99 難0.21", "s": 0.959, "f": 0}, {"x": 0.991, "y": 0.186, "c": "近傍", "n": "Be A Star [A]  n=3353 cos0.99 難0.19", "s": 0.943, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6597455076003949}, {"a": 0, "b": 2, "w": 0.5197494294474132}, {"a": 0, "b": 3, "w": 0.2044445407817561}, {"a": 0, "b": 4, "w": 0.5369264690864572}, {"a": 0, "b": 5, "w": 0.11052942595501836}, {"a": 0, "b": 6, "w": 0.26969238488341984}, {"a": 0, "b": 7, "w": 0.08106687613074115}, {"a": 0, "b": 8, "w": 0.21270506071539896}, {"a": 0, "b": 9, "w": 0.19456689298564034}, {"a": 0, "b": 10, "w": 0.048836009816298764}, {"a": 0, "b": 11, "w": 0.2379247741284447}, {"a": 0, "b": 12, "w": 0.19094011501558117}, {"a": 0, "b": 13, "w": 5.588074447615554e-11}, {"a": 0, "b": 14, "w": 0.21747304231251696}, {"a": 0, "b": 15, "w": 0.34039956889224443}, {"a": 0, "b": 16, "w": 0.10727648398263523}, {"a": 0, "b": 17, "w": 0.1273319850488387}, {"a": 0, "b": 18, "w": 0.2352419537114635}, {"a": 0, "b": 19, "w": 0.145534959748026}, {"a": 0, "b": 20, "w": 0.10906575073212832}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.013,hiY=0.413;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
