<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">紫陽花 -AZISAI- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.43, "c": "種", "n": "紫陽花 -AZISAI- [A]  n=3710 cos1.00 難0.43", "s": 0.991, "f": 0}, {"x": 0.996, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos1.00 難0.45", "s": 0.475, "f": 0}, {"x": 0.995, "y": 0.385, "c": "近傍", "n": "Neo Heritage [A]  n=2299 cos1.00 難0.39", "s": 0.614, "f": 0}, {"x": 0.995, "y": 0.439, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.44", "s": 0.531, "f": 0}, {"x": 0.995, "y": 0.453, "c": "近傍", "n": "diagram [A]  n=3166 cos0.99 難0.45", "s": 0.846, "f": 0}, {"x": 0.995, "y": 0.531, "c": "近傍", "n": "The Sampling Paradise [A]  n=3743 cos0.99 難0.53", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.547, "c": "近傍", "n": "雪月花 [A]  n=3725 cos0.99 難0.55", "s": 0.995, "f": 0}, {"x": 0.994, "y": 0.523, "c": "近傍", "n": "COSMIC CYBER [A]  n=2567 cos0.99 難0.52", "s": 0.686, "f": 0}, {"x": 0.994, "y": 0.376, "c": "近傍", "n": "& Intelligence [A]  n=2938 cos0.99 難0.38", "s": 0.785, "f": 0}, {"x": 0.993, "y": 0.293, "c": "近傍", "n": "Advent Infamous [A]  n=2555 cos0.99 難0.29", "s": 0.683, "f": 0}, {"x": 0.993, "y": 0.289, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1738 cos0.99 難0.29", "s": 0.464, "f": 0}, {"x": 0.994, "y": 0.23, "c": "近傍", "n": "GIGA THRASH [A]  n=3158 cos0.99 難0.23", "s": 0.844, "f": 0}, {"x": 0.994, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos0.99 難0.26", "s": 0.275, "f": 0}, {"x": 0.993, "y": 0.275, "c": "近傍", "n": "No.13 [A]  n=3463 cos0.99 難0.27", "s": 0.925, "f": 0}, {"x": 0.992, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.99 難0.38", "s": 0.864, "f": 0}, {"x": 0.992, "y": 0.446, "c": "近傍", "n": "Carry Me Away [A]  n=3350 cos0.99 難0.45", "s": 0.895, "f": 0}, {"x": 0.992, "y": 0.493, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1359 cos0.99 難0.49", "s": 0.363, "f": 0}, {"x": 0.992, "y": 0.439, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2693 cos0.99 難0.44", "s": 0.719, "f": 0}, {"x": 0.993, "y": 0.272, "c": "近傍", "n": "ChaserXX [A]  n=3337 cos0.99 難0.27", "s": 0.892, "f": 0}, {"x": 0.997, "y": 0.711, "c": "近傍", "n": "BRAVE OUT [L]  n=696 cos1.00 難0.71", "s": 0.186, "f": 0}, {"x": 0.992, "y": 0.484, "c": "近傍", "n": "Giudecca [A]  n=3156 cos0.99 難0.48", "s": 0.843, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5392998568331433}, {"a": 0, "b": 2, "w": 0.47019371910097607}, {"a": 0, "b": 3, "w": 0.3703628177942486}, {"a": 0, "b": 4, "w": 0.43589128185995907}, {"a": 0, "b": 5, "w": 0.4157203312607617}, {"a": 0, "b": 6, "w": 0.4356805854844725}, {"a": 0, "b": 7, "w": 0.4657374907655424}, {"a": 0, "b": 8, "w": 0.4403026454590133}, {"a": 0, "b": 9, "w": 0.35110937046073976}, {"a": 0, "b": 10, "w": 0.3709049655920461}, {"a": 0, "b": 11, "w": 0.35147380145082974}, {"a": 0, "b": 12, "w": 0.14242568086938412}, {"a": 0, "b": 13, "w": 0.40810843409190756}, {"a": 0, "b": 14, "w": 3.709077489588708e-11}, {"a": 0, "b": 15, "w": 0.343391866986795}, {"a": 0, "b": 16, "w": 0.3593563179800835}, {"a": 0, "b": 17, "w": 0.1698982693067831}, {"a": 0, "b": 18, "w": 0.21551800913750818}, {"a": 0, "b": 19, "w": 0.2646346291245635}, {"a": 0, "b": 20, "w": 0.09696432756945361}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.192,hiY=0.749;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
