<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SHION [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.195, "c": "種", "n": "SHION [A]  n=3340 cos1.00 難-0.20", "s": 0.902, "f": 0}, {"x": 0.996, "y": -0.136, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos1.00 難-0.14", "s": 0.85, "f": 0}, {"x": 0.995, "y": -0.223, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos0.99 難-0.22", "s": 0.689, "f": 0}, {"x": 0.994, "y": -0.237, "c": "近傍", "n": "湘南ロンリーMIDNIGHT RAIN [A]  n=1879 cos0.99 難-0.24", "s": 0.508, "f": 0}, {"x": 0.993, "y": -0.109, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos0.99 難-0.11", "s": 0.839, "f": 0}, {"x": 0.992, "y": -0.136, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3183 cos0.99 難-0.14", "s": 0.86, "f": 0}, {"x": 0.993, "y": -0.329, "c": "近傍", "n": "get set mind [A]  n=1502 cos0.99 難-0.33", "s": 0.406, "f": 0}, {"x": 0.995, "y": 0.004, "c": "近傍", "n": "Τeλοs [A]  n=606 cos1.00 難0.00", "s": 0.164, "f": 0}, {"x": 0.993, "y": -0.028, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.03", "s": 0.836, "f": 0}, {"x": 0.992, "y": -0.31, "c": "近傍", "n": "アイドル [A]  n=2110 cos0.99 難-0.31", "s": 0.57, "f": 0}, {"x": 0.991, "y": -0.173, "c": "近傍", "n": "rainbow rainbow [H]  n=2670 cos0.99 難-0.17", "s": 0.721, "f": 0}, {"x": 0.991, "y": -0.298, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2122 cos0.99 難-0.30", "s": 0.573, "f": 0}, {"x": 0.991, "y": -0.202, "c": "近傍", "n": "Express Emotion [A]  n=3445 cos0.99 難-0.20", "s": 0.931, "f": 0}, {"x": 0.991, "y": -0.257, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos0.99 難-0.26", "s": 0.651, "f": 0}, {"x": 0.994, "y": 0.02, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [A]  n=3192 cos0.99 難0.02", "s": 0.862, "f": 0}, {"x": 0.99, "y": -0.221, "c": "近傍", "n": "EDEN [A]  n=3701 cos0.99 難-0.22", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.154, "c": "近傍", "n": "タンポポ [A]  n=713 cos0.99 難-0.15", "s": 0.193, "f": 0}, {"x": 0.99, "y": -0.124, "c": "近傍", "n": "勇者 [A]  n=1812 cos0.99 難-0.12", "s": 0.49, "f": 0}, {"x": 0.99, "y": -0.147, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos0.99 難-0.15", "s": 0.696, "f": 0}, {"x": 0.99, "y": -0.239, "c": "近傍", "n": "Tell me what you wish feat.らっぷびと [A]  n=2535 cos0.99 難-0.24", "s": 0.685, "f": 0}, {"x": 0.998, "y": 0.088, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos1.00 難0.09", "s": 0.805, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3328457476696538}, {"a": 0, "b": 2, "w": 0.31081381315892653}, {"a": 0, "b": 3, "w": 0.25246861302654844}, {"a": 0, "b": 4, "w": 0.11764874464283182}, {"a": 0, "b": 5, "w": 0.0318718266670599}, {"a": 0, "b": 6, "w": 0.18462328385754279}, {"a": 0, "b": 7, "w": 0.34643233303007026}, {"a": 0, "b": 8, "w": 0.23163429801300417}, {"a": 0, "b": 9, "w": 0.13648888552203153}, {"a": 0, "b": 10, "w": 0.07616909722700138}, {"a": 0, "b": 11, "w": 0.08135152666009582}, {"a": 0, "b": 12, "w": 0.015095819377247577}, {"a": 0, "b": 13, "w": 0.10189851343854694}, {"a": 0, "b": 14, "w": 0.12765479878522656}, {"a": 0, "b": 15, "w": 0.09759741395316524}, {"a": 0, "b": 16, "w": 0.018807544396582387}, {"a": 0, "b": 17, "w": 0.08956531517691713}, {"a": 0, "b": 18, "w": 5.884370768427516e-11}, {"a": 0, "b": 19, "w": 0.07846402405438246}, {"a": 0, "b": 20, "w": 0.5530222649383316}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.362,hiY=0.121;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
