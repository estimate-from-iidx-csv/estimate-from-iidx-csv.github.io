<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">B.O.D.Y. [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.827, "c": "種", "n": "B.O.D.Y. [H]  n=1306 cos1.00 難-0.83", "s": 0.521, "f": 0}, {"x": 0.996, "y": -0.895, "c": "近傍", "n": "Without Heaven [H]  n=515 cos1.00 難-0.90", "s": 0.206, "f": 0}, {"x": 0.995, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.856, "f": 0}, {"x": 0.995, "y": -0.791, "c": "近傍", "n": "Giudecca [H]  n=1656 cos0.99 難-0.79", "s": 0.661, "f": 0}, {"x": 0.994, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.76", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.99 難-0.81", "s": 0.378, "f": 0}, {"x": 0.993, "y": -0.856, "c": "近傍", "n": "UMMU [H]  n=2418 cos0.99 難-0.86", "s": 0.965, "f": 0}, {"x": 0.994, "y": -0.723, "c": "近傍", "n": "INAZUMA [H]  n=2055 cos0.99 難-0.72", "s": 0.82, "f": 0}, {"x": 0.993, "y": -0.727, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos0.99 難-0.73", "s": 0.717, "f": 0}, {"x": 0.991, "y": -0.839, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2503 cos0.99 難-0.84", "s": 0.999, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.68", "s": 0.564, "f": 0}, {"x": 0.994, "y": -0.689, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2334 cos0.99 難-0.69", "s": 0.932, "f": 0}, {"x": 0.991, "y": -0.821, "c": "近傍", "n": "仮想空間の旅人たち [H]  n=2269 cos0.99 難-0.82", "s": 0.906, "f": 0}, {"x": 0.991, "y": -0.846, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos0.99 難-0.85", "s": 0.3, "f": 0}, {"x": 0.992, "y": -0.91, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos0.99 難-0.91", "s": 0.871, "f": 0}, {"x": 0.991, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-0.84", "s": 0.215, "f": 0}, {"x": 0.995, "y": -0.66, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2347 cos1.00 難-0.66", "s": 0.937, "f": 0}, {"x": 0.992, "y": -0.728, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.73", "s": 0.655, "f": 0}, {"x": 0.993, "y": -0.968, "c": "近傍", "n": "Smalt #28598F [H]  n=1301 cos0.99 難-0.97", "s": 0.519, "f": 0}, {"x": 0.993, "y": -0.958, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-0.96", "s": 0.249, "f": 0}, {"x": 0.991, "y": -0.752, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.75", "s": 0.629, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5155844244984807}, {"a": 0, "b": 2, "w": 0.41973018449465405}, {"a": 0, "b": 3, "w": 0.2463937458837573}, {"a": 0, "b": 4, "w": 0.42992379756265975}, {"a": 0, "b": 5, "w": 0.18522230066640166}, {"a": 0, "b": 6, "w": 0.3315343429894183}, {"a": 0, "b": 7, "w": 0.14221616270482818}, {"a": 0, "b": 8, "w": 5.2667981087495264e-11}, {"a": 0, "b": 9, "w": 0.2259404934625321}, {"a": 0, "b": 10, "w": 0.3614817755952986}, {"a": 0, "b": 11, "w": 0.41479607675425456}, {"a": 0, "b": 12, "w": 0.20077406615831395}, {"a": 0, "b": 13, "w": 0.2830859344094856}, {"a": 0, "b": 14, "w": 0.26992683842142606}, {"a": 0, "b": 15, "w": 0.11992360789032608}, {"a": 0, "b": 16, "w": 0.3414302584320833}, {"a": 0, "b": 17, "w": 0.2849866924082992}, {"a": 0, "b": 18, "w": 0.38076829941760926}, {"a": 0, "b": 19, "w": 0.35875395923741193}, {"a": 0, "b": 20, "w": 0.23224617189813412}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.993,hiY=-0.635;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
