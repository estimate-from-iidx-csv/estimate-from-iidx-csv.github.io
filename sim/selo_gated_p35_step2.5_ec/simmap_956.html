<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Nowhere [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.007, "c": "種", "n": "Nowhere [A]  n=2750 cos1.00 難-0.01", "s": 0.777, "f": 0}, {"x": 0.996, "y": 0.026, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos1.00 難0.03", "s": 0.782, "f": 0}, {"x": 0.996, "y": 0.074, "c": "近傍", "n": "Go Faraway [A]  n=2755 cos1.00 難0.07", "s": 0.778, "f": 0}, {"x": 0.996, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos1.00 難0.11", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.082, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos1.00 難-0.08", "s": 0.913, "f": 0}, {"x": 0.995, "y": -0.007, "c": "近傍", "n": "Space Time [A]  n=2797 cos1.00 難-0.01", "s": 0.79, "f": 0}, {"x": 0.995, "y": 0.031, "c": "近傍", "n": "The Story Begins [A]  n=2767 cos0.99 難0.03", "s": 0.782, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "罪と罰 [A]  n=3503 cos1.00 難-0.14", "s": 0.99, "f": 0}, {"x": 0.997, "y": 0.213, "c": "近傍", "n": "セロトニン [A]  n=3330 cos1.00 難0.21", "s": 0.941, "f": 0}, {"x": 0.996, "y": -0.18, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos1.00 難-0.18", "s": 0.399, "f": 0}, {"x": 0.995, "y": -0.09, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2956 cos0.99 難-0.09", "s": 0.835, "f": 0}, {"x": 0.996, "y": -0.196, "c": "近傍", "n": "Last Burning [A]  n=3170 cos1.00 難-0.20", "s": 0.895, "f": 0}, {"x": 0.994, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos0.99 難-0.11", "s": 0.878, "f": 0}, {"x": 0.995, "y": -0.18, "c": "近傍", "n": "EXE [A]  n=3025 cos1.00 難-0.18", "s": 0.855, "f": 0}, {"x": 0.995, "y": -0.167, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos0.99 難-0.17", "s": 0.208, "f": 0}, {"x": 0.994, "y": -0.058, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3090 cos0.99 難-0.06", "s": 0.873, "f": 0}, {"x": 0.995, "y": -0.194, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos0.99 難-0.19", "s": 0.37, "f": 0}, {"x": 0.993, "y": -0.032, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2848 cos0.99 難-0.03", "s": 0.805, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "キスキツネ [A]  n=1147 cos1.00 難-0.25", "s": 0.324, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.14", "s": 0.638, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "神様、つれない。 [A]  n=1325 cos1.00 難-0.25", "s": 0.374, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30702113932222597}, {"a": 0, "b": 2, "w": 0.21854730809754397}, {"a": 0, "b": 3, "w": 0.29571760865934704}, {"a": 0, "b": 4, "w": 0.2956594402910898}, {"a": 0, "b": 5, "w": 0.2511328215305352}, {"a": 0, "b": 6, "w": 0.2189883830944488}, {"a": 0, "b": 7, "w": 0.28858400502534454}, {"a": 0, "b": 8, "w": 0.15332980055314527}, {"a": 0, "b": 9, "w": 0.2864240705153005}, {"a": 0, "b": 10, "w": 0.2059416069584854}, {"a": 0, "b": 11, "w": 0.2610961903177026}, {"a": 0, "b": 12, "w": 0.16831084119115214}, {"a": 0, "b": 13, "w": 0.2641552942595673}, {"a": 0, "b": 14, "w": 0.21009370140497696}, {"a": 0, "b": 15, "w": 0.14557665757214444}, {"a": 0, "b": 16, "w": 0.18622769306877174}, {"a": 0, "b": 17, "w": 0.06983335037841865}, {"a": 0, "b": 18, "w": 0.3073145836254326}, {"a": 0, "b": 19, "w": 7.32739424691431e-11}, {"a": 0, "b": 20, "w": 0.24363401707862753}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.291,hiY=0.251;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
