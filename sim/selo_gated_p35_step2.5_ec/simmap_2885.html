<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Triple Counter [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.426, "c": "種", "n": "Triple Counter [A]  n=3130 cos1.00 難1.43", "s": 0.974, "f": 0}, {"x": 0.988, "y": 1.38, "c": "近傍", "n": "Little Little Princess [L]  n=2886 cos0.99 難1.38", "s": 0.898, "f": 0}, {"x": 0.984, "y": 1.414, "c": "近傍", "n": "CaptivAte～浄化～ [L]  n=947 cos0.98 難1.41", "s": 0.295, "f": 0}, {"x": 0.991, "y": 1.518, "c": "近傍", "n": "ALTERNATOR [A]  n=2280 cos0.99 難1.52", "s": 0.709, "f": 0}, {"x": 0.984, "y": 1.446, "c": "近傍", "n": "ORCA [A]  n=2530 cos0.98 難1.45", "s": 0.787, "f": 0}, {"x": 0.983, "y": 1.457, "c": "近傍", "n": "Antigravity [A]  n=2890 cos0.98 難1.46", "s": 0.899, "f": 0}, {"x": 0.989, "y": 1.329, "c": "近傍", "n": "THE DEEP STRIKER [L]  n=2928 cos0.99 難1.33", "s": 0.911, "f": 0}, {"x": 0.983, "y": 1.469, "c": "近傍", "n": "DEADHEAT [A]  n=3004 cos0.98 難1.47", "s": 0.935, "f": 0}, {"x": 0.979, "y": 1.416, "c": "近傍", "n": "GUILTY [L]  n=1226 cos0.98 難1.42", "s": 0.381, "f": 0}, {"x": 0.979, "y": 1.42, "c": "近傍", "n": "255 [A]  n=3009 cos0.98 難1.42", "s": 0.936, "f": 0}, {"x": 0.983, "y": 1.338, "c": "近傍", "n": "Aftermath [A]  n=2309 cos0.98 難1.34", "s": 0.718, "f": 0}, {"x": 0.991, "y": 1.56, "c": "近傍", "n": "Despair of ELFERIA [A]  n=3175 cos0.99 難1.56", "s": 0.988, "f": 0}, {"x": 0.982, "y": 1.329, "c": "近傍", "n": "KILL EACH OTHER [A]  n=3056 cos0.98 難1.33", "s": 0.951, "f": 0}, {"x": 0.976, "y": 1.447, "c": "近傍", "n": "SYNC-ANTHEM [A]  n=3166 cos0.98 難1.45", "s": 0.985, "f": 0}, {"x": 0.979, "y": 1.331, "c": "近傍", "n": "Timepiece phase II [A]  n=3137 cos0.98 難1.33", "s": 0.976, "f": 0}, {"x": 0.976, "y": 1.371, "c": "近傍", "n": "Vitrum [A]  n=2543 cos0.98 難1.37", "s": 0.791, "f": 0}, {"x": 0.979, "y": 1.531, "c": "近傍", "n": "QUANTUM TELEPORTATION [L]  n=2759 cos0.98 難1.53", "s": 0.858, "f": 0}, {"x": 0.974, "y": 1.375, "c": "近傍", "n": "抱きしめてモナムール [A]  n=2919 cos0.97 難1.38", "s": 0.908, "f": 0}, {"x": 0.983, "y": 1.567, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.98 難1.57", "s": 0.757, "f": 0}, {"x": 0.976, "y": 1.347, "c": "近傍", "n": "津軽雪 [A]  n=3214 cos0.98 難1.35", "s": 1.0, "f": 0}, {"x": 0.989, "y": 1.261, "c": "近傍", "n": "電腦都市 [A]  n=1375 cos0.99 難1.26", "s": 0.428, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3667873346906433}, {"a": 0, "b": 2, "w": 0.2595439646210468}, {"a": 0, "b": 3, "w": 0.44740237378516656}, {"a": 0, "b": 4, "w": 0.22899476086691362}, {"a": 0, "b": 5, "w": 0.015079449798144573}, {"a": 0, "b": 6, "w": 0.31275437853678534}, {"a": 0, "b": 7, "w": 0.11966434599077913}, {"a": 0, "b": 8, "w": 0.0746392464765433}, {"a": 0, "b": 9, "w": 0.15008952775455098}, {"a": 0, "b": 10, "w": 0.08619110601765823}, {"a": 0, "b": 11, "w": 0.4329828922268366}, {"a": 0, "b": 12, "w": 0.17589780492546936}, {"a": 0, "b": 13, "w": 0.08510630362275584}, {"a": 0, "b": 14, "w": 0.09474497379112035}, {"a": 0, "b": 15, "w": 2.485456285228338e-11}, {"a": 0, "b": 16, "w": 0.07248548165274638}, {"a": 0, "b": 17, "w": 0.0780606986273582}, {"a": 0, "b": 18, "w": 0.1551045762431068}, {"a": 0, "b": 19, "w": 0.10131617168182827}, {"a": 0, "b": 20, "w": 0.2735926481491552}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.972,hiX=1.002,loY=1.236,hiY=1.591;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
