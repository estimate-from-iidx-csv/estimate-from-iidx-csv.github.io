<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LAB [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.603, "c": "種", "n": "LAB [L]  n=861 cos1.00 難0.60", "s": 0.229, "f": 0}, {"x": 0.995, "y": 0.584, "c": "近傍", "n": "LADYBIRD [A]  n=2809 cos1.00 難0.58", "s": 0.747, "f": 0}, {"x": 0.996, "y": 0.696, "c": "近傍", "n": "GHOST [A]  n=2246 cos1.00 難0.70", "s": 0.598, "f": 0}, {"x": 0.994, "y": 0.666, "c": "近傍", "n": "ONE AND ONLY [A]  n=2180 cos0.99 難0.67", "s": 0.58, "f": 0}, {"x": 0.992, "y": 0.589, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3554 cos0.99 難0.59", "s": 0.946, "f": 0}, {"x": 0.992, "y": 0.527, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.53", "s": 0.846, "f": 0}, {"x": 0.992, "y": 0.586, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.59", "s": 0.711, "f": 0}, {"x": 0.994, "y": 0.459, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos0.99 難0.46", "s": 0.853, "f": 0}, {"x": 0.996, "y": 0.404, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos1.00 難0.40", "s": 0.228, "f": 0}, {"x": 0.992, "y": 0.536, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.99 難0.54", "s": 0.897, "f": 0}, {"x": 0.992, "y": 0.55, "c": "近傍", "n": "Little Star [A]  n=3676 cos0.99 難0.55", "s": 0.978, "f": 0}, {"x": 0.991, "y": 0.611, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1840 cos0.99 難0.61", "s": 0.49, "f": 0}, {"x": 0.992, "y": 0.48, "c": "近傍", "n": "3V0 [A]  n=2201 cos0.99 難0.48", "s": 0.586, "f": 0}, {"x": 0.993, "y": 0.777, "c": "近傍", "n": "BLAZING_LAZER [A]  n=1566 cos0.99 難0.78", "s": 0.417, "f": 0}, {"x": 0.997, "y": 0.362, "c": "近傍", "n": "Lovely Howdy Cowboy!! [A]  n=2479 cos1.00 難0.36", "s": 0.66, "f": 0}, {"x": 0.994, "y": 0.404, "c": "近傍", "n": "REVOLVER [A]  n=2960 cos0.99 難0.40", "s": 0.788, "f": 0}, {"x": 0.991, "y": 0.521, "c": "近傍", "n": "HAPPY★RUSH [A]  n=3201 cos0.99 難0.52", "s": 0.852, "f": 0}, {"x": 0.993, "y": 0.423, "c": "近傍", "n": "Crazy Jackpot [A]  n=2701 cos0.99 難0.42", "s": 0.719, "f": 0}, {"x": 0.991, "y": 0.473, "c": "近傍", "n": "デッドボヲルdeホームラン [A]  n=3241 cos0.99 難0.47", "s": 0.862, "f": 0}, {"x": 0.993, "y": 0.407, "c": "近傍", "n": "Ristaccia [A]  n=3758 cos0.99 難0.41", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.405, "c": "近傍", "n": "Welcome [A]  n=3292 cos0.99 難0.41", "s": 0.876, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.392107050902209}, {"a": 0, "b": 2, "w": 0.5471731128714137}, {"a": 0, "b": 3, "w": 0.29318689399461173}, {"a": 0, "b": 4, "w": 0.25436891727541244}, {"a": 0, "b": 5, "w": 0.32866520895608964}, {"a": 0, "b": 6, "w": 0.3421098798164097}, {"a": 0, "b": 7, "w": 0.3833107420482972}, {"a": 0, "b": 8, "w": 0.5257720865710696}, {"a": 0, "b": 9, "w": 0.2633220848559711}, {"a": 0, "b": 10, "w": 0.2924568638271775}, {"a": 0, "b": 11, "w": 0.26066091907213307}, {"a": 0, "b": 12, "w": 0.08039021038031624}, {"a": 0, "b": 13, "w": 4.0549674729106755e-11}, {"a": 0, "b": 14, "w": 0.547777570864168}, {"a": 0, "b": 15, "w": 0.40537710522063286}, {"a": 0, "b": 16, "w": 0.2062683168207391}, {"a": 0, "b": 17, "w": 0.37773687076941265}, {"a": 0, "b": 18, "w": 0.2372717901874145}, {"a": 0, "b": 19, "w": 0.38257877267192897}, {"a": 0, "b": 20, "w": 0.3781029577463543}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.329,hiY=0.810;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
