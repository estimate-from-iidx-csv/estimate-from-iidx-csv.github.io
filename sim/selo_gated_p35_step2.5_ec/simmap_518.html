<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Session 1 -Genesis- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.419, "c": "種", "n": "Session 1 -Genesis- [H]  n=1866 cos1.00 難-0.42", "s": 0.581, "f": 0}, {"x": 0.991, "y": -0.584, "c": "近傍", "n": "NEMESIS [H]  n=1853 cos0.99 難-0.58", "s": 0.577, "f": 0}, {"x": 0.988, "y": -0.321, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.99 難-0.32", "s": 0.83, "f": 0}, {"x": 0.988, "y": -0.558, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos0.99 難-0.56", "s": 0.659, "f": 0}, {"x": 0.987, "y": -0.349, "c": "近傍", "n": "Clione [A]  n=2774 cos0.99 難-0.35", "s": 0.864, "f": 0}, {"x": 0.989, "y": -0.613, "c": "近傍", "n": "quasar [H]  n=3212 cos0.99 難-0.61", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.488, "c": "近傍", "n": "end of world [H]  n=1762 cos0.99 難-0.49", "s": 0.549, "f": 0}, {"x": 0.986, "y": -0.591, "c": "近傍", "n": "She is my wife [H]  n=2408 cos0.99 難-0.59", "s": 0.75, "f": 0}, {"x": 0.987, "y": -0.634, "c": "近傍", "n": "switch [H]  n=1803 cos0.99 難-0.63", "s": 0.561, "f": 0}, {"x": 0.985, "y": -0.56, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2442 cos0.98 難-0.56", "s": 0.76, "f": 0}, {"x": 0.986, "y": -0.218, "c": "近傍", "n": "Adularia [H]  n=3011 cos0.99 難-0.22", "s": 0.937, "f": 0}, {"x": 0.986, "y": -0.198, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.99 難-0.20", "s": 0.72, "f": 0}, {"x": 0.986, "y": -0.658, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.66", "s": 0.49, "f": 0}, {"x": 0.983, "y": -0.295, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.98 難-0.29", "s": 0.777, "f": 0}, {"x": 0.983, "y": -0.431, "c": "近傍", "n": "Hollywood Galaxy [H]  n=2639 cos0.98 難-0.43", "s": 0.822, "f": 0}, {"x": 0.988, "y": -0.707, "c": "近傍", "n": "Go Ahead!! [H]  n=2507 cos0.99 難-0.71", "s": 0.781, "f": 0}, {"x": 0.985, "y": -0.639, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.64", "s": 0.935, "f": 0}, {"x": 0.984, "y": -0.257, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.98 難-0.26", "s": 0.815, "f": 0}, {"x": 0.983, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.98 難-0.57", "s": 0.711, "f": 0}, {"x": 0.986, "y": -0.146, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.99 難-0.15", "s": 0.968, "f": 0}, {"x": 0.987, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.72", "s": 0.593, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24405789741753703}, {"a": 0, "b": 2, "w": 0.3774205805498162}, {"a": 0, "b": 3, "w": 0.22575163191131753}, {"a": 0, "b": 4, "w": 0.010235377651375388}, {"a": 0, "b": 5, "w": 0.05858927403689862}, {"a": 0, "b": 6, "w": 0.12397740683109237}, {"a": 0, "b": 7, "w": 0.2518929224983577}, {"a": 0, "b": 8, "w": 0.17001256396272513}, {"a": 0, "b": 9, "w": 0.28565697649511324}, {"a": 0, "b": 10, "w": 0.23967269318464846}, {"a": 0, "b": 11, "w": 0.3199485429745961}, {"a": 0, "b": 12, "w": 0.32527639260162255}, {"a": 0, "b": 13, "w": 3.687705696364674e-11}, {"a": 0, "b": 14, "w": 0.2409601289473603}, {"a": 0, "b": 15, "w": 0.33354970439653775}, {"a": 0, "b": 16, "w": 0.18446249220749578}, {"a": 0, "b": 17, "w": 0.26784424564510134}, {"a": 0, "b": 18, "w": 0.10217280462221445}, {"a": 0, "b": 19, "w": 0.1873958655304956}, {"a": 0, "b": 20, "w": 0.05794385445505201}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-0.768,hiY=-0.100;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
