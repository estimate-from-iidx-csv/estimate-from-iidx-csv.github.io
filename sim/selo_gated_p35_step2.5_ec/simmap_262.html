<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Carry Me Away [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.352, "c": "種", "n": "Carry Me Away [H]  n=1403 cos1.00 難-1.35", "s": 0.629, "f": 0}, {"x": 0.995, "y": -1.324, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos1.00 難-1.32", "s": 0.546, "f": 0}, {"x": 0.994, "y": -1.342, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1721 cos0.99 難-1.34", "s": 0.772, "f": 0}, {"x": 0.993, "y": -1.341, "c": "近傍", "n": "NANAIRO [H]  n=1415 cos0.99 難-1.34", "s": 0.635, "f": 0}, {"x": 0.992, "y": -1.367, "c": "近傍", "n": "Lethal Weapon [H]  n=1417 cos0.99 難-1.37", "s": 0.635, "f": 0}, {"x": 0.992, "y": -1.408, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.99 難-1.41", "s": 0.615, "f": 0}, {"x": 0.996, "y": -1.443, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1677 cos1.00 難-1.44", "s": 0.752, "f": 0}, {"x": 0.992, "y": -1.262, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1841 cos0.99 難-1.26", "s": 0.826, "f": 0}, {"x": 0.988, "y": -1.318, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.99 難-1.32", "s": 0.722, "f": 0}, {"x": 0.995, "y": -1.241, "c": "近傍", "n": "BIGWAVERS [H]  n=767 cos0.99 難-1.24", "s": 0.344, "f": 0}, {"x": 0.99, "y": -1.285, "c": "近傍", "n": "Arkadia [H]  n=857 cos0.99 難-1.29", "s": 0.384, "f": 0}, {"x": 0.994, "y": -1.465, "c": "近傍", "n": "encounter [H]  n=1624 cos0.99 難-1.47", "s": 0.728, "f": 0}, {"x": 0.996, "y": -1.229, "c": "近傍", "n": "麗 ～うらら～ [H]  n=1861 cos1.00 難-1.23", "s": 0.835, "f": 0}, {"x": 0.988, "y": -1.414, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos0.99 難-1.41", "s": 0.592, "f": 0}, {"x": 0.989, "y": -1.423, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.99 難-1.42", "s": 0.769, "f": 0}, {"x": 0.986, "y": -1.324, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.99 難-1.32", "s": 0.775, "f": 0}, {"x": 0.988, "y": -1.424, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.42", "s": 0.622, "f": 0}, {"x": 0.985, "y": -1.383, "c": "近傍", "n": "Fervidex [H]  n=1551 cos0.99 難-1.38", "s": 0.696, "f": 0}, {"x": 0.988, "y": -1.269, "c": "近傍", "n": "妖隠し -あやかしかくし- [H]  n=2230 cos0.99 難-1.27", "s": 1.0, "f": 0}, {"x": 0.987, "y": -1.287, "c": "近傍", "n": "忍恋花 [H]  n=1362 cos0.99 難-1.29", "s": 0.611, "f": 0}, {"x": 0.989, "y": -1.46, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.99 難-1.46", "s": 0.435, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47655580175863355}, {"a": 0, "b": 2, "w": 0.4100742635783219}, {"a": 0, "b": 3, "w": 0.3025106601197005}, {"a": 0, "b": 4, "w": 0.253850222381129}, {"a": 0, "b": 5, "w": 0.20959373723676267}, {"a": 0, "b": 6, "w": 0.49621029365770863}, {"a": 0, "b": 7, "w": 0.14449885508720883}, {"a": 0, "b": 8, "w": 0.19967529810280682}, {"a": 0, "b": 9, "w": 0.4577646072720044}, {"a": 0, "b": 10, "w": 0.23853211991280843}, {"a": 0, "b": 11, "w": 0.42329215516756913}, {"a": 0, "b": 12, "w": 0.4640444801177811}, {"a": 0, "b": 13, "w": 0.20220899537043335}, {"a": 0, "b": 14, "w": 0.08806938185848567}, {"a": 0, "b": 15, "w": 0.06814091849074144}, {"a": 0, "b": 16, "w": 0.14068315989203517}, {"a": 0, "b": 17, "w": 0.05072346153740315}, {"a": 0, "b": 18, "w": 5.994815754917227e-11}, {"a": 0, "b": 19, "w": 0.13602513123612203}, {"a": 0, "b": 20, "w": 0.22788449483105255}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.484,hiY=-1.210;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
