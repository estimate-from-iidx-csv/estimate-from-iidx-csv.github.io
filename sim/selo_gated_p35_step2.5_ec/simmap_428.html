<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">NEMESIS [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.584, "c": "種", "n": "NEMESIS [H]  n=1853 cos1.00 難-0.58", "s": 0.574, "f": 0}, {"x": 0.997, "y": -0.558, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos1.00 難-0.56", "s": 0.656, "f": 0}, {"x": 0.997, "y": -0.639, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos1.00 難-0.64", "s": 0.931, "f": 0}, {"x": 0.996, "y": -0.634, "c": "近傍", "n": "switch [H]  n=1803 cos1.00 難-0.63", "s": 0.559, "f": 0}, {"x": 0.997, "y": -0.488, "c": "近傍", "n": "end of world [H]  n=1762 cos1.00 難-0.49", "s": 0.546, "f": 0}, {"x": 0.994, "y": -0.613, "c": "近傍", "n": "quasar [H]  n=3212 cos0.99 難-0.61", "s": 0.996, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos1.00 難-0.68", "s": 0.438, "f": 0}, {"x": 0.994, "y": -0.648, "c": "近傍", "n": "rainbow flyer [H]  n=1908 cos0.99 難-0.65", "s": 0.591, "f": 0}, {"x": 0.994, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.99 難-0.57", "s": 0.708, "f": 0}, {"x": 0.994, "y": -0.631, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2363 cos0.99 難-0.63", "s": 0.732, "f": 0}, {"x": 0.996, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos1.00 難-0.73", "s": 0.627, "f": 0}, {"x": 0.993, "y": -0.59, "c": "近傍", "n": "DIAVOLO [H]  n=3226 cos0.99 難-0.59", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos1.00 難-0.72", "s": 0.59, "f": 0}, {"x": 0.992, "y": -0.591, "c": "近傍", "n": "She is my wife [H]  n=2408 cos0.99 難-0.59", "s": 0.746, "f": 0}, {"x": 0.995, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos0.99 難-0.74", "s": 0.601, "f": 0}, {"x": 0.992, "y": -0.648, "c": "近傍", "n": "Light and Cyber… [H]  n=2224 cos0.99 難-0.65", "s": 0.689, "f": 0}, {"x": 0.993, "y": -0.679, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.68", "s": 0.467, "f": 0}, {"x": 0.993, "y": -0.717, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1989 cos0.99 難-0.72", "s": 0.617, "f": 0}, {"x": 0.992, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.68", "s": 0.976, "f": 0}, {"x": 0.992, "y": -0.658, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.66", "s": 0.488, "f": 0}, {"x": 0.992, "y": -0.656, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.66", "s": 0.644, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6103747927263272}, {"a": 0, "b": 2, "w": 0.5465646606851507}, {"a": 0, "b": 3, "w": 0.5158359824705057}, {"a": 0, "b": 4, "w": 0.5552431255936506}, {"a": 0, "b": 5, "w": 0.3680382251105644}, {"a": 0, "b": 6, "w": 0.48666966617448193}, {"a": 0, "b": 7, "w": 0.4311226034474819}, {"a": 0, "b": 8, "w": 0.40807955353965597}, {"a": 0, "b": 9, "w": 0.33153796005676817}, {"a": 0, "b": 10, "w": 0.5289373035084166}, {"a": 0, "b": 11, "w": 0.3442981914378159}, {"a": 0, "b": 12, "w": 0.4165129538425826}, {"a": 0, "b": 13, "w": 0.2714435333287587}, {"a": 0, "b": 14, "w": 0.3911305149364327}, {"a": 0, "b": 15, "w": 0.27493246029149077}, {"a": 0, "b": 16, "w": 0.3431174637842075}, {"a": 0, "b": 17, "w": 0.3826578299011961}, {"a": 0, "b": 18, "w": 0.32829987400961813}, {"a": 0, "b": 19, "w": 5.6154969563237955e-11}, {"a": 0, "b": 20, "w": 0.31607172136441253}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.761,hiY=-0.468;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
