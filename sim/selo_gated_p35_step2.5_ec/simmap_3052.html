<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">黒髪乱れし修羅となりて [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.531, "c": "種", "n": "黒髪乱れし修羅となりて [A]  n=3698 cos1.00 難0.53", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.547, "c": "近傍", "n": "LASER CRUSTER [A]  n=3656 cos0.99 難0.55", "s": 0.989, "f": 0}, {"x": 0.995, "y": 0.473, "c": "近傍", "n": "Raspberry Railgun [A]  n=3614 cos0.99 難0.47", "s": 0.977, "f": 0}, {"x": 0.993, "y": 0.549, "c": "近傍", "n": "V2 [A]  n=3623 cos0.99 難0.55", "s": 0.98, "f": 0}, {"x": 0.993, "y": 0.459, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [A]  n=1660 cos0.99 難0.46", "s": 0.449, "f": 0}, {"x": 0.993, "y": 0.459, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [A]  n=3569 cos0.99 難0.46", "s": 0.965, "f": 0}, {"x": 0.992, "y": 0.531, "c": "近傍", "n": "Macuilxochitl [A]  n=3477 cos0.99 難0.53", "s": 0.94, "f": 0}, {"x": 0.991, "y": 0.548, "c": "近傍", "n": "ベンガル vs. アムール Battle [A]  n=744 cos0.99 難0.55", "s": 0.201, "f": 0}, {"x": 0.992, "y": 0.587, "c": "近傍", "n": "CUE CUE RESCUE [L]  n=1252 cos0.99 難0.59", "s": 0.339, "f": 0}, {"x": 0.992, "y": 0.474, "c": "近傍", "n": "ユミル [A]  n=3395 cos0.99 難0.47", "s": 0.918, "f": 0}, {"x": 0.991, "y": 0.58, "c": "近傍", "n": "RED ZONE [L]  n=3559 cos0.99 難0.58", "s": 0.962, "f": 0}, {"x": 0.992, "y": 0.617, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [A]  n=3626 cos0.99 難0.62", "s": 0.981, "f": 0}, {"x": 0.991, "y": 0.469, "c": "近傍", "n": "THE CANNONBALLER [A]  n=3345 cos0.99 難0.47", "s": 0.905, "f": 0}, {"x": 0.99, "y": 0.503, "c": "近傍", "n": "Be OK [L]  n=2613 cos0.99 難0.50", "s": 0.707, "f": 0}, {"x": 0.994, "y": 0.679, "c": "近傍", "n": "九尾狐夜行 [A]  n=3512 cos0.99 難0.68", "s": 0.95, "f": 0}, {"x": 0.994, "y": 0.682, "c": "近傍", "n": "#CMFLG [A]  n=1956 cos0.99 難0.68", "s": 0.529, "f": 0}, {"x": 0.99, "y": 0.495, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3105 cos0.99 難0.49", "s": 0.84, "f": 0}, {"x": 0.989, "y": 0.506, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2944 cos0.99 難0.51", "s": 0.796, "f": 0}, {"x": 0.99, "y": 0.631, "c": "近傍", "n": "刃図羅 [A]  n=3589 cos0.99 難0.63", "s": 0.971, "f": 0}, {"x": 0.995, "y": 0.723, "c": "近傍", "n": "Thunderbolt [A]  n=3593 cos1.00 難0.72", "s": 0.972, "f": 0}, {"x": 0.988, "y": 0.504, "c": "近傍", "n": "Mukade [A]  n=1863 cos0.99 難0.50", "s": 0.504, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4176431775960433}, {"a": 0, "b": 2, "w": 0.41460251667617354}, {"a": 0, "b": 3, "w": 0.34455417461395876}, {"a": 0, "b": 4, "w": 0.3795714955928883}, {"a": 0, "b": 5, "w": 0.30700940011939903}, {"a": 0, "b": 6, "w": 0.29921874561381023}, {"a": 0, "b": 7, "w": 7.563296488399818e-05}, {"a": 0, "b": 8, "w": 0.29993434428935395}, {"a": 0, "b": 9, "w": 0.15019484752441425}, {"a": 0, "b": 10, "w": 0.2829513052473507}, {"a": 0, "b": 11, "w": 0.28035687213453075}, {"a": 0, "b": 12, "w": 0.2587289335985481}, {"a": 0, "b": 13, "w": 0.2022575603419341}, {"a": 0, "b": 14, "w": 0.4026233934507434}, {"a": 0, "b": 15, "w": 0.39373589976977175}, {"a": 0, "b": 16, "w": 0.11357445673004596}, {"a": 0, "b": 17, "w": 0.19682312918266143}, {"a": 0, "b": 18, "w": 0.2421993003312447}, {"a": 0, "b": 19, "w": 3.95534716091106e-11}, {"a": 0, "b": 20, "w": 0.15557483718969467}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.438,hiY=0.744;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
