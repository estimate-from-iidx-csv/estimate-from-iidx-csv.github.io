<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">唱 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.584, "c": "種", "n": "唱 [A]  n=1534 cos1.00 難-0.58", "s": 0.442, "f": 0}, {"x": 0.995, "y": -0.524, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos1.00 難-0.52", "s": 0.658, "f": 0}, {"x": 0.995, "y": -0.752, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1602 cos1.00 難-0.75", "s": 0.462, "f": 0}, {"x": 0.995, "y": -0.412, "c": "近傍", "n": "WISE UP! [A]  n=2812 cos1.00 難-0.41", "s": 0.811, "f": 0}, {"x": 0.996, "y": -0.362, "c": "近傍", "n": "No Day But Today! [A]  n=2351 cos1.00 難-0.36", "s": 0.678, "f": 0}, {"x": 0.993, "y": -0.437, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.44", "s": 0.763, "f": 0}, {"x": 0.995, "y": -0.356, "c": "近傍", "n": "So What [A]  n=985 cos1.00 難-0.36", "s": 0.284, "f": 0}, {"x": 0.991, "y": -0.558, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3469 cos0.99 難-0.56", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.36, "c": "近傍", "n": "Mind Mapping [A]  n=3104 cos0.99 難-0.36", "s": 0.895, "f": 0}, {"x": 0.991, "y": -0.683, "c": "近傍", "n": "GENE [H]  n=2179 cos0.99 難-0.68", "s": 0.628, "f": 0}, {"x": 0.991, "y": -0.483, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1933 cos0.99 難-0.48", "s": 0.557, "f": 0}, {"x": 0.991, "y": -0.534, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.99 難-0.53", "s": 0.73, "f": 0}, {"x": 0.995, "y": -0.312, "c": "近傍", "n": "Exchange Place [A]  n=2677 cos1.00 難-0.31", "s": 0.772, "f": 0}, {"x": 0.991, "y": -0.679, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.68", "s": 0.435, "f": 0}, {"x": 0.993, "y": -0.371, "c": "近傍", "n": "In Heaven [A]  n=2966 cos0.99 難-0.37", "s": 0.855, "f": 0}, {"x": 0.991, "y": -0.451, "c": "近傍", "n": "LUV CAN SAVE U [A]  n=3146 cos0.99 難-0.45", "s": 0.907, "f": 0}, {"x": 0.991, "y": -0.723, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos0.99 難-0.72", "s": 0.488, "f": 0}, {"x": 0.991, "y": -0.436, "c": "近傍", "n": "黒紅掬い [A]  n=1971 cos0.99 難-0.44", "s": 0.568, "f": 0}, {"x": 0.992, "y": -0.389, "c": "近傍", "n": "Liquid Crystal Girl feat. echo [A]  n=2466 cos0.99 難-0.39", "s": 0.711, "f": 0}, {"x": 0.991, "y": -0.417, "c": "近傍", "n": "Show Time [A]  n=659 cos0.99 難-0.42", "s": 0.19, "f": 0}, {"x": 0.991, "y": -0.746, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2208 cos0.99 難-0.75", "s": 0.636, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4882969892766864}, {"a": 0, "b": 2, "w": 0.5014472113062731}, {"a": 0, "b": 3, "w": 0.46359607884394605}, {"a": 0, "b": 4, "w": 0.2283607540026622}, {"a": 0, "b": 5, "w": 0.37437435394265806}, {"a": 0, "b": 6, "w": 0.4078764790610948}, {"a": 0, "b": 7, "w": 0.327027510538878}, {"a": 0, "b": 8, "w": 0.41359213978237097}, {"a": 0, "b": 9, "w": 0.016608120857507847}, {"a": 0, "b": 10, "w": 0.3166828852034882}, {"a": 0, "b": 11, "w": 0.2795505853300221}, {"a": 0, "b": 12, "w": 0.49260700796468393}, {"a": 0, "b": 13, "w": 0.30709410154907757}, {"a": 0, "b": 14, "w": 0.2878523045914425}, {"a": 0, "b": 15, "w": 0.29890041225577235}, {"a": 0, "b": 16, "w": 0.17382732986389493}, {"a": 0, "b": 17, "w": 0.2875588468222746}, {"a": 0, "b": 18, "w": 0.30174105038801713}, {"a": 0, "b": 19, "w": 5.573586037144196e-11}, {"a": 0, "b": 20, "w": 0.12768258080693373}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.787,hiY=-0.277;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
