<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Phoenix [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.057, "c": "種", "n": "Phoenix [A]  n=3111 cos1.00 難-0.06", "s": 0.832, "f": 0}, {"x": 0.997, "y": -0.019, "c": "近傍", "n": "As You Want [A]  n=1915 cos1.00 難-0.02", "s": 0.512, "f": 0}, {"x": 0.996, "y": -0.071, "c": "近傍", "n": "yellow head joe [A]  n=3287 cos1.00 難-0.07", "s": 0.879, "f": 0}, {"x": 0.996, "y": -0.065, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos1.00 難-0.06", "s": 0.257, "f": 0}, {"x": 0.997, "y": -0.168, "c": "近傍", "n": "G59 [H]  n=2935 cos1.00 難-0.17", "s": 0.785, "f": 0}, {"x": 0.996, "y": -0.06, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1102 cos1.00 難-0.06", "s": 0.295, "f": 0}, {"x": 0.997, "y": 0.057, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos1.00 難0.06", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.061, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3048 cos1.00 難-0.06", "s": 0.815, "f": 0}, {"x": 0.995, "y": -0.114, "c": "近傍", "n": "GENOCIDE [H]  n=2573 cos1.00 難-0.11", "s": 0.688, "f": 0}, {"x": 0.995, "y": -0.097, "c": "近傍", "n": "Super Duper Racers [A]  n=2874 cos1.00 難-0.10", "s": 0.768, "f": 0}, {"x": 0.997, "y": -0.203, "c": "近傍", "n": "楽園追放 [A]  n=1689 cos1.00 難-0.20", "s": 0.452, "f": 0}, {"x": 0.996, "y": -0.18, "c": "近傍", "n": "EXE [A]  n=3025 cos1.00 難-0.18", "s": 0.809, "f": 0}, {"x": 0.995, "y": -0.035, "c": "近傍", "n": "Sphere [A]  n=2892 cos0.99 難-0.04", "s": 0.773, "f": 0}, {"x": 0.995, "y": 0.025, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2824 cos1.00 難0.02", "s": 0.755, "f": 0}, {"x": 0.994, "y": -0.019, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.02", "s": 0.762, "f": 0}, {"x": 0.995, "y": -0.144, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos0.99 難-0.14", "s": 0.836, "f": 0}, {"x": 0.994, "y": -0.067, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1359 cos0.99 難-0.07", "s": 0.363, "f": 0}, {"x": 0.995, "y": 0.065, "c": "近傍", "n": "狂水一華 [A]  n=2793 cos1.00 難0.06", "s": 0.747, "f": 0}, {"x": 0.995, "y": -0.186, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2548 cos1.00 難-0.19", "s": 0.681, "f": 0}, {"x": 0.994, "y": -0.136, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3181 cos0.99 難-0.14", "s": 0.851, "f": 0}, {"x": 0.993, "y": -0.032, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2848 cos0.99 難-0.03", "s": 0.761, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2543412725439774}, {"a": 0, "b": 2, "w": 0.36265726538111864}, {"a": 0, "b": 3, "w": 0.3804962314175767}, {"a": 0, "b": 4, "w": 0.5453574488292559}, {"a": 0, "b": 5, "w": 0.41970700765799873}, {"a": 0, "b": 6, "w": 0.5231275066153476}, {"a": 0, "b": 7, "w": 0.3954517054470572}, {"a": 0, "b": 8, "w": 0.39135551714633987}, {"a": 0, "b": 9, "w": 0.3728970769766947}, {"a": 0, "b": 10, "w": 0.5269827257421356}, {"a": 0, "b": 11, "w": 0.28990933434799004}, {"a": 0, "b": 12, "w": 0.34598068916067004}, {"a": 0, "b": 13, "w": 0.16781291993662717}, {"a": 0, "b": 14, "w": 0.28578595219778125}, {"a": 0, "b": 15, "w": 0.2959698275523768}, {"a": 0, "b": 16, "w": 0.32001072926396623}, {"a": 0, "b": 17, "w": 0.3133486745704397}, {"a": 0, "b": 18, "w": 0.24038707846190166}, {"a": 0, "b": 19, "w": 0.22695957506677245}, {"a": 0, "b": 20, "w": 5.842293315794223e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.225,hiY=0.086;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
