<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">アストライアの双皿 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.647, "c": "種", "n": "アストライアの双皿 [H]  n=2536 cos1.00 難-0.65", "s": 0.79, "f": 0}, {"x": 0.988, "y": -0.555, "c": "近傍", "n": "G2 [H]  n=1587 cos0.99 難-0.55", "s": 0.494, "f": 0}, {"x": 0.988, "y": -0.732, "c": "近傍", "n": "symbolic [H]  n=1605 cos0.99 難-0.73", "s": 0.5, "f": 0}, {"x": 0.988, "y": -0.786, "c": "近傍", "n": "Godspeed [H]  n=2822 cos0.99 難-0.79", "s": 0.879, "f": 0}, {"x": 0.986, "y": -0.679, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos0.99 難-0.68", "s": 0.576, "f": 0}, {"x": 0.99, "y": -0.839, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2503 cos0.99 難-0.84", "s": 0.779, "f": 0}, {"x": 0.988, "y": -0.811, "c": "近傍", "n": "ruin of opals [H]  n=1547 cos0.99 難-0.81", "s": 0.482, "f": 0}, {"x": 0.985, "y": -0.644, "c": "近傍", "n": "SOLITON BEAM [H]  n=1733 cos0.98 難-0.64", "s": 0.54, "f": 0}, {"x": 0.985, "y": -0.644, "c": "近傍", "n": "Rise'n Beauty [H]  n=1913 cos0.98 難-0.64", "s": 0.596, "f": 0}, {"x": 0.984, "y": -0.644, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos0.98 難-0.64", "s": 0.818, "f": 0}, {"x": 0.985, "y": -0.576, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.98 難-0.58", "s": 0.794, "f": 0}, {"x": 0.985, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.98 難-0.73", "s": 0.63, "f": 0}, {"x": 0.985, "y": -0.736, "c": "近傍", "n": "dAuntl3ss [H]  n=1995 cos0.98 難-0.74", "s": 0.621, "f": 0}, {"x": 0.984, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.98 難-0.57", "s": 0.711, "f": 0}, {"x": 0.984, "y": -0.56, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2442 cos0.98 難-0.56", "s": 0.76, "f": 0}, {"x": 0.983, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.98 難-0.68", "s": 0.98, "f": 0}, {"x": 0.982, "y": -0.613, "c": "近傍", "n": "quasar [H]  n=3212 cos0.98 難-0.61", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.726, "c": "近傍", "n": "Ignis†Irae [H]  n=1632 cos0.98 難-0.73", "s": 0.508, "f": 0}, {"x": 0.982, "y": -0.645, "c": "近傍", "n": "DXY! [H]  n=1879 cos0.98 難-0.64", "s": 0.585, "f": 0}, {"x": 0.983, "y": -0.795, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.98 難-0.80", "s": 0.612, "f": 0}, {"x": 0.986, "y": -0.87, "c": "近傍", "n": "NOIXIA [H]  n=932 cos0.99 難-0.87", "s": 0.29, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3499997182791932}, {"a": 0, "b": 2, "w": 0.3643502058631358}, {"a": 0, "b": 3, "w": 0.4258649661505658}, {"a": 0, "b": 4, "w": 0.22658957716361317}, {"a": 0, "b": 5, "w": 0.3249901058900353}, {"a": 0, "b": 6, "w": 0.4230959521829468}, {"a": 0, "b": 7, "w": 0.2119689995171825}, {"a": 0, "b": 8, "w": 3.2065572419526234e-11}, {"a": 0, "b": 9, "w": 0.18635521070218564}, {"a": 0, "b": 10, "w": 0.14632072873138535}, {"a": 0, "b": 11, "w": 0.23156250615896845}, {"a": 0, "b": 12, "w": 0.2013069805414225}, {"a": 0, "b": 13, "w": 0.23694933072535307}, {"a": 0, "b": 14, "w": 0.3654722013689674}, {"a": 0, "b": 15, "w": 0.1703597997643458}, {"a": 0, "b": 16, "w": 0.10934221218521345}, {"a": 0, "b": 17, "w": 0.29106697040075846}, {"a": 0, "b": 18, "w": 0.25850628161571554}, {"a": 0, "b": 19, "w": 0.13619869470595636}, {"a": 0, "b": 20, "w": 0.40276145851405953}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-0.895,hiY=-0.530;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
