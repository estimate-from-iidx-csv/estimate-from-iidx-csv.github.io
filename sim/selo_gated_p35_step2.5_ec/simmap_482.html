<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">RAVE SYNDROME [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.978, "c": "種", "n": "RAVE SYNDROME [H]  n=448 cos1.00 難-1.98", "s": 0.345, "f": 0}, {"x": 0.993, "y": -1.972, "c": "近傍", "n": "Victory Of Ravers [H]  n=728 cos0.99 難-1.97", "s": 0.561, "f": 0}, {"x": 0.991, "y": -1.983, "c": "近傍", "n": "眠りの国のステラ [H]  n=696 cos0.99 難-1.98", "s": 0.537, "f": 0}, {"x": 0.993, "y": -1.924, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=958 cos0.99 難-1.92", "s": 0.739, "f": 0}, {"x": 0.99, "y": -2.002, "c": "近傍", "n": "Rejection Girl [H]  n=825 cos0.99 難-2.00", "s": 0.636, "f": 0}, {"x": 0.989, "y": -1.957, "c": "近傍", "n": "Speculation [H]  n=532 cos0.99 難-1.96", "s": 0.41, "f": 0}, {"x": 0.993, "y": -1.904, "c": "近傍", "n": "Ritual of Anubis [H]  n=625 cos0.99 難-1.90", "s": 0.482, "f": 0}, {"x": 0.987, "y": -1.952, "c": "近傍", "n": "Xyndrome [H]  n=862 cos0.99 難-1.95", "s": 0.665, "f": 0}, {"x": 0.988, "y": -1.932, "c": "近傍", "n": "Banger Banger Banger Banger [H]  n=827 cos0.99 難-1.93", "s": 0.638, "f": 0}, {"x": 0.987, "y": -1.936, "c": "近傍", "n": "Chemical Colours [H]  n=504 cos0.99 難-1.94", "s": 0.389, "f": 0}, {"x": 0.994, "y": -1.888, "c": "近傍", "n": "儚き恋の華 [H]  n=974 cos0.99 難-1.89", "s": 0.751, "f": 0}, {"x": 0.985, "y": -1.938, "c": "近傍", "n": "Lost Souls [H]  n=869 cos0.98 難-1.94", "s": 0.67, "f": 0}, {"x": 0.984, "y": -2.004, "c": "近傍", "n": "輪廻の鴉 [H]  n=559 cos0.98 難-2.00", "s": 0.431, "f": 0}, {"x": 0.983, "y": -1.93, "c": "近傍", "n": "Pout [H]  n=600 cos0.98 難-1.93", "s": 0.463, "f": 0}, {"x": 0.982, "y": -2.014, "c": "近傍", "n": "KING [H]  n=776 cos0.98 難-2.01", "s": 0.598, "f": 0}, {"x": 0.988, "y": -2.073, "c": "近傍", "n": "響花水月 [H]  n=686 cos0.99 難-2.07", "s": 0.529, "f": 0}, {"x": 0.983, "y": -1.937, "c": "近傍", "n": "ウツシミウツシ [H]  n=717 cos0.98 難-1.94", "s": 0.553, "f": 0}, {"x": 0.981, "y": -1.976, "c": "近傍", "n": "メズマライザー [H]  n=600 cos0.98 難-1.98", "s": 0.463, "f": 0}, {"x": 0.987, "y": -1.878, "c": "近傍", "n": "Rubrum Piano [H]  n=659 cos0.99 難-1.88", "s": 0.508, "f": 0}, {"x": 0.992, "y": -1.858, "c": "近傍", "n": "曼荼羅恋々 [H]  n=1039 cos0.99 難-1.86", "s": 0.801, "f": 0}, {"x": 0.981, "y": -1.929, "c": "近傍", "n": "ランカーキラーガール [H]  n=1297 cos0.98 難-1.93", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3250605399825147}, {"a": 0, "b": 2, "w": 0.3065469378974839}, {"a": 0, "b": 3, "w": 0.41209478067954786}, {"a": 0, "b": 4, "w": 0.4069101577233776}, {"a": 0, "b": 5, "w": 0.34622773587305644}, {"a": 0, "b": 6, "w": 0.3340480699046191}, {"a": 0, "b": 7, "w": 0.19600887622808694}, {"a": 0, "b": 8, "w": 0.17988326493074736}, {"a": 0, "b": 9, "w": 5.0352388925034575e-11}, {"a": 0, "b": 10, "w": 0.41158749925491844}, {"a": 0, "b": 11, "w": 0.2735077013567415}, {"a": 0, "b": 12, "w": 0.2030954345259729}, {"a": 0, "b": 13, "w": 0.1272396326434878}, {"a": 0, "b": 14, "w": 0.1612270327846781}, {"a": 0, "b": 15, "w": 0.3451712383119018}, {"a": 0, "b": 16, "w": 0.15711972259870044}, {"a": 0, "b": 17, "w": 0.17158622888032582}, {"a": 0, "b": 18, "w": 0.2480212841828765}, {"a": 0, "b": 19, "w": 0.44685535506212337}, {"a": 0, "b": 20, "w": 0.16654550671117252}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-2.091,hiY=-1.840;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
