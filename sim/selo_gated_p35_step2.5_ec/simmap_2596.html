<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">EBONY & IVORY [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.006, "c": "種", "n": "EBONY & IVORY [A]  n=3388 cos1.00 難1.01", "s": 0.955, "f": 0}, {"x": 0.995, "y": 1.034, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2198 cos1.00 難1.03", "s": 0.62, "f": 0}, {"x": 0.993, "y": 1.021, "c": "近傍", "n": "MARLIN [A]  n=1133 cos0.99 難1.02", "s": 0.319, "f": 0}, {"x": 0.993, "y": 1.016, "c": "近傍", "n": "NEO GENERATOR SEVEN [A]  n=3253 cos0.99 難1.02", "s": 0.917, "f": 0}, {"x": 0.993, "y": 0.959, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3358 cos0.99 難0.96", "s": 0.947, "f": 0}, {"x": 0.993, "y": 1.068, "c": "近傍", "n": "Proof of the existence [A]  n=3391 cos0.99 難1.07", "s": 0.956, "f": 0}, {"x": 0.991, "y": 1.045, "c": "近傍", "n": "Colorful Cookie [A]  n=3547 cos0.99 難1.05", "s": 1.0, "f": 0}, {"x": 0.991, "y": 1.045, "c": "近傍", "n": "Amazing Mirage [L]  n=3185 cos0.99 難1.05", "s": 0.898, "f": 0}, {"x": 0.994, "y": 0.929, "c": "近傍", "n": "Chaotoxin [A]  n=1947 cos0.99 難0.93", "s": 0.549, "f": 0}, {"x": 0.99, "y": 1.032, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos0.99 難1.03", "s": 0.371, "f": 0}, {"x": 0.991, "y": 0.951, "c": "近傍", "n": "Seven Times Four [A]  n=1333 cos0.99 難0.95", "s": 0.376, "f": 0}, {"x": 0.99, "y": 0.951, "c": "近傍", "n": "dAuntl3ss [A]  n=3300 cos0.99 難0.95", "s": 0.93, "f": 0}, {"x": 0.99, "y": 0.937, "c": "近傍", "n": "Sounds Of Summer [A]  n=3419 cos0.99 難0.94", "s": 0.964, "f": 0}, {"x": 0.988, "y": 1.042, "c": "近傍", "n": "Ypsilon [L]  n=2342 cos0.99 難1.04", "s": 0.66, "f": 0}, {"x": 0.99, "y": 1.072, "c": "近傍", "n": "DUAL STRIKER [A]  n=2410 cos0.99 難1.07", "s": 0.679, "f": 0}, {"x": 0.988, "y": 0.964, "c": "近傍", "n": "u gotta beat [A]  n=1438 cos0.99 難0.96", "s": 0.405, "f": 0}, {"x": 0.987, "y": 0.998, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3376 cos0.99 難1.00", "s": 0.952, "f": 0}, {"x": 0.987, "y": 1.004, "c": "近傍", "n": "From Human Blood [A]  n=984 cos0.99 難1.00", "s": 0.277, "f": 0}, {"x": 0.987, "y": 0.99, "c": "近傍", "n": "Angel's Ladder [A]  n=2498 cos0.99 難0.99", "s": 0.704, "f": 0}, {"x": 0.987, "y": 1.04, "c": "近傍", "n": "童話回廊 [A]  n=3231 cos0.99 難1.04", "s": 0.911, "f": 0}, {"x": 0.991, "y": 0.909, "c": "近傍", "n": "Gravigazer [A]  n=3406 cos0.99 難0.91", "s": 0.96, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3507794202421818}, {"a": 0, "b": 2, "w": 0.3105506935674619}, {"a": 0, "b": 3, "w": 0.2911562145662442}, {"a": 0, "b": 4, "w": 0.1468938095846064}, {"a": 0, "b": 5, "w": 0.2707999733374118}, {"a": 0, "b": 6, "w": 0.21411372350914337}, {"a": 0, "b": 7, "w": 0.21490727025349854}, {"a": 0, "b": 8, "w": 0.3232119138999746}, {"a": 0, "b": 9, "w": 0.0875966808848937}, {"a": 0, "b": 10, "w": 0.1788419886521465}, {"a": 0, "b": 11, "w": 0.09932019571396844}, {"a": 0, "b": 12, "w": 0.15341427510259786}, {"a": 0, "b": 13, "w": 0.10331241688139792}, {"a": 0, "b": 14, "w": 0.06876161451774732}, {"a": 0, "b": 15, "w": 0.004216195800160971}, {"a": 0, "b": 16, "w": 3.967204342814057e-11}, {"a": 0, "b": 17, "w": 0.05142605677250123}, {"a": 0, "b": 18, "w": 0.0554710146561298}, {"a": 0, "b": 19, "w": 0.007337083260057775}, {"a": 0, "b": 20, "w": 0.09800482110969955}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.896,hiY=1.085;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
