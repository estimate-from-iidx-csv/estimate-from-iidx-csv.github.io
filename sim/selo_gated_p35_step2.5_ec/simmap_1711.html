<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Advent Infamous [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.293, "c": "種", "n": "Advent Infamous [A]  n=2555 cos1.00 難0.29", "s": 0.697, "f": 0}, {"x": 0.997, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.26", "s": 0.281, "f": 0}, {"x": 0.996, "y": 0.228, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos1.00 難0.23", "s": 0.787, "f": 0}, {"x": 0.996, "y": 0.36, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1132 cos1.00 難0.36", "s": 0.309, "f": 0}, {"x": 0.996, "y": 0.23, "c": "近傍", "n": "GIGA THRASH [A]  n=3158 cos1.00 難0.23", "s": 0.862, "f": 0}, {"x": 0.995, "y": 0.26, "c": "近傍", "n": "Rosa azuL [A]  n=2237 cos1.00 難0.26", "s": 0.611, "f": 0}, {"x": 0.996, "y": 0.183, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos1.00 難0.18", "s": 0.921, "f": 0}, {"x": 0.995, "y": 0.252, "c": "近傍", "n": "EXTREME MACH COLLIDER [A]  n=3312 cos1.00 難0.25", "s": 0.904, "f": 0}, {"x": 0.995, "y": 0.376, "c": "近傍", "n": "& Intelligence [A]  n=2938 cos1.00 難0.38", "s": 0.802, "f": 0}, {"x": 0.995, "y": 0.255, "c": "近傍", "n": "IN BETWEEN [A]  n=1026 cos0.99 難0.25", "s": 0.28, "f": 0}, {"x": 0.995, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.18", "s": 0.446, "f": 0}, {"x": 0.995, "y": 0.18, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos1.00 難0.18", "s": 0.524, "f": 0}, {"x": 0.997, "y": 0.11, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos1.00 難0.11", "s": 0.65, "f": 0}, {"x": 0.995, "y": 0.363, "c": "近傍", "n": "Moving on [A]  n=3017 cos0.99 難0.36", "s": 0.823, "f": 0}, {"x": 0.995, "y": 0.356, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.36", "s": 0.747, "f": 0}, {"x": 0.994, "y": 0.355, "c": "近傍", "n": "《GRANDMASTER》 [A]  n=2189 cos0.99 難0.35", "s": 0.597, "f": 0}, {"x": 0.994, "y": 0.224, "c": "近傍", "n": "Discloze [A]  n=3149 cos0.99 難0.22", "s": 0.859, "f": 0}, {"x": 0.994, "y": 0.248, "c": "近傍", "n": "the shadow [A]  n=3400 cos0.99 難0.25", "s": 0.928, "f": 0}, {"x": 0.996, "y": 0.105, "c": "近傍", "n": "朧 [L]  n=3664 cos1.00 難0.10", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.16, "c": "近傍", "n": "Amazing Mirage [A]  n=3635 cos1.00 難0.16", "s": 0.992, "f": 0}, {"x": 0.995, "y": 0.439, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos1.00 難0.44", "s": 0.543, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24090169384759874}, {"a": 0, "b": 2, "w": 0.31701289024402046}, {"a": 0, "b": 3, "w": 0.34891084725930877}, {"a": 0, "b": 4, "w": 0.3564536471738031}, {"a": 0, "b": 5, "w": 0.3240511203523303}, {"a": 0, "b": 6, "w": 0.3690055669333694}, {"a": 0, "b": 7, "w": 0.034009909852699916}, {"a": 0, "b": 8, "w": 0.20664760336956167}, {"a": 0, "b": 9, "w": 0.05521015316807232}, {"a": 0, "b": 10, "w": 0.2901997573617905}, {"a": 0, "b": 11, "w": 0.2846122493357228}, {"a": 0, "b": 12, "w": 0.23603980411800252}, {"a": 0, "b": 13, "w": 0.16051482055898347}, {"a": 0, "b": 14, "w": 0.2058303148324815}, {"a": 0, "b": 15, "w": 0.2547425036476586}, {"a": 0, "b": 16, "w": 0.23020080882210836}, {"a": 0, "b": 17, "w": 0.05275055821090113}, {"a": 0, "b": 18, "w": 5.6216808985709577e-11}, {"a": 0, "b": 19, "w": 0.2794134929650899}, {"a": 0, "b": 20, "w": 0.3007095525708535}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.078,hiY=0.465;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
