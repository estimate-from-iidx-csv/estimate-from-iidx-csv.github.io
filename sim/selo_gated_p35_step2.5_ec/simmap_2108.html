<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Scharfrichter [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.231, "c": "種", "n": "Scharfrichter [A]  n=3415 cos1.00 難0.23", "s": 0.901, "f": 0}, {"x": 0.996, "y": 0.112, "c": "近傍", "n": "Daily Lunch Special [A]  n=3535 cos1.00 難0.11", "s": 0.932, "f": 0}, {"x": 0.994, "y": 0.275, "c": "近傍", "n": "きみのせかい [A]  n=1145 cos0.99 難0.28", "s": 0.302, "f": 0}, {"x": 0.993, "y": 0.182, "c": "近傍", "n": "少年リップルズ [A]  n=1807 cos0.99 難0.18", "s": 0.477, "f": 0}, {"x": 0.993, "y": 0.139, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難0.14", "s": 0.303, "f": 0}, {"x": 0.993, "y": 0.138, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3310 cos0.99 難0.14", "s": 0.873, "f": 0}, {"x": 0.995, "y": 0.427, "c": "近傍", "n": "ADAMANT [A]  n=1507 cos0.99 難0.43", "s": 0.398, "f": 0}, {"x": 0.992, "y": 0.264, "c": "近傍", "n": "Sparkle Smilin' [A]  n=2650 cos0.99 難0.26", "s": 0.699, "f": 0}, {"x": 0.992, "y": 0.136, "c": "近傍", "n": "Pout [A]  n=2136 cos0.99 難0.14", "s": 0.563, "f": 0}, {"x": 0.99, "y": 0.275, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos0.99 難0.27", "s": 0.331, "f": 0}, {"x": 0.989, "y": 0.225, "c": "近傍", "n": "BabeL ～Grand Story～ [A]  n=3347 cos0.99 難0.22", "s": 0.883, "f": 0}, {"x": 0.992, "y": 0.019, "c": "近傍", "n": "あるビー！ feat.ころねぽち [A]  n=1931 cos0.99 難0.02", "s": 0.509, "f": 0}, {"x": 0.99, "y": 0.348, "c": "近傍", "n": "Steel Edge [A]  n=3746 cos0.99 難0.35", "s": 0.988, "f": 0}, {"x": 0.991, "y": 0.024, "c": "近傍", "n": "PHOTONGENIC [A]  n=2864 cos0.99 難0.02", "s": 0.755, "f": 0}, {"x": 0.99, "y": 0.075, "c": "近傍", "n": "Sakura Reflection [A]  n=3791 cos0.99 難0.08", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.068, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3594 cos0.99 難0.07", "s": 0.948, "f": 0}, {"x": 0.991, "y": 0.01, "c": "近傍", "n": "Shirdal [A]  n=695 cos0.99 難0.01", "s": 0.183, "f": 0}, {"x": 0.988, "y": 0.185, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2303 cos0.99 難0.18", "s": 0.607, "f": 0}, {"x": 0.988, "y": 0.228, "c": "近傍", "n": "Take It Easy [A]  n=3281 cos0.99 難0.23", "s": 0.865, "f": 0}, {"x": 0.988, "y": 0.184, "c": "近傍", "n": "Chronos [A]  n=3401 cos0.99 難0.18", "s": 0.897, "f": 0}, {"x": 0.988, "y": 0.245, "c": "近傍", "n": "Divine Heaven [A]  n=1989 cos0.99 難0.24", "s": 0.525, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.625825329598569}, {"a": 0, "b": 2, "w": 0.5566631397852868}, {"a": 0, "b": 3, "w": 0.38820034275390825}, {"a": 0, "b": 4, "w": 0.4092214089042431}, {"a": 0, "b": 5, "w": 0.2982996127385147}, {"a": 0, "b": 6, "w": 0.6014619375784773}, {"a": 0, "b": 7, "w": 0.3191848605998565}, {"a": 0, "b": 8, "w": 0.4319967479138809}, {"a": 0, "b": 9, "w": 0.37955986753174764}, {"a": 0, "b": 10, "w": 0.43570011026517397}, {"a": 0, "b": 11, "w": 0.4856726568604889}, {"a": 0, "b": 12, "w": 0.43042250759100553}, {"a": 0, "b": 13, "w": 3.127420544757342e-11}, {"a": 0, "b": 14, "w": 0.41022998855667314}, {"a": 0, "b": 15, "w": 0.3609936282220362}, {"a": 0, "b": 16, "w": 0.2368933865178786}, {"a": 0, "b": 17, "w": 0.3870679803604954}, {"a": 0, "b": 18, "w": 0.14706083349439947}, {"a": 0, "b": 19, "w": 0.37459255926698565}, {"a": 0, "b": 20, "w": 0.39158730201437053}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.023,hiY=0.460;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
