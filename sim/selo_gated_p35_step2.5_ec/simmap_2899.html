<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">VANESSA [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.577, "c": "種", "n": "VANESSA [A]  n=3651 cos1.00 難0.58", "s": 0.975, "f": 0}, {"x": 0.991, "y": 0.616, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3094 cos0.99 難0.62", "s": 0.827, "f": 0}, {"x": 0.988, "y": 0.439, "c": "近傍", "n": "Scripted Connection⇒ N mix [L]  n=1194 cos0.99 難0.44", "s": 0.319, "f": 0}, {"x": 0.987, "y": 0.771, "c": "近傍", "n": "Friction[!]Function [A]  n=2923 cos0.99 難0.77", "s": 0.781, "f": 0}, {"x": 0.985, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos0.99 難0.45", "s": 0.475, "f": 0}, {"x": 0.984, "y": 0.531, "c": "近傍", "n": "The Sampling Paradise [A]  n=3743 cos0.98 難0.53", "s": 1.0, "f": 0}, {"x": 0.983, "y": 0.579, "c": "近傍", "n": "THE FALLEN [A]  n=3133 cos0.98 難0.58", "s": 0.837, "f": 0}, {"x": 0.984, "y": 0.472, "c": "近傍", "n": "Pollinosis [A]  n=3354 cos0.98 難0.47", "s": 0.896, "f": 0}, {"x": 0.991, "y": 0.909, "c": "近傍", "n": "Gravigazer [A]  n=3406 cos0.99 難0.91", "s": 0.91, "f": 0}, {"x": 0.985, "y": 0.377, "c": "近傍", "n": "FLOWER [A]  n=3683 cos0.98 難0.38", "s": 0.984, "f": 0}, {"x": 0.982, "y": 0.523, "c": "近傍", "n": "COSMIC CYBER [A]  n=2567 cos0.98 難0.52", "s": 0.686, "f": 0}, {"x": 0.983, "y": 0.397, "c": "近傍", "n": "DESIRE [A]  n=3355 cos0.98 難0.40", "s": 0.896, "f": 0}, {"x": 0.981, "y": 0.502, "c": "近傍", "n": "MAXIVCORD [A]  n=2840 cos0.98 難0.50", "s": 0.759, "f": 0}, {"x": 0.981, "y": 0.672, "c": "近傍", "n": "Broken [A]  n=3714 cos0.98 難0.67", "s": 0.992, "f": 0}, {"x": 0.988, "y": 0.925, "c": "近傍", "n": "Ghost Pulse [A]  n=1923 cos0.99 難0.92", "s": 0.514, "f": 0}, {"x": 0.983, "y": 0.36, "c": "近傍", "n": "Constellation [A]  n=1134 cos0.98 難0.36", "s": 0.303, "f": 0}, {"x": 0.981, "y": 0.661, "c": "近傍", "n": "FIRE FIRE [A]  n=3658 cos0.98 難0.66", "s": 0.977, "f": 0}, {"x": 0.981, "y": 0.727, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1074 cos0.98 難0.73", "s": 0.287, "f": 0}, {"x": 0.983, "y": 0.311, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.98 難0.31", "s": 0.63, "f": 0}, {"x": 0.979, "y": 0.611, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1840 cos0.98 難0.61", "s": 0.492, "f": 0}, {"x": 0.979, "y": 0.619, "c": "近傍", "n": "BLOCKS [A]  n=3326 cos0.98 難0.62", "s": 0.889, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4430336905356881}, {"a": 0, "b": 2, "w": 0.35870432929354945}, {"a": 0, "b": 3, "w": 0.1994314338588582}, {"a": 0, "b": 4, "w": 0.25926618397463197}, {"a": 0, "b": 5, "w": 0.1568069334990928}, {"a": 0, "b": 6, "w": 0.26571357129927653}, {"a": 0, "b": 7, "w": 0.2506104014342263}, {"a": 0, "b": 8, "w": 0.3881965811005743}, {"a": 0, "b": 9, "w": 0.2812131229436191}, {"a": 0, "b": 10, "w": 0.21130111642811233}, {"a": 0, "b": 11, "w": 0.2686435829135473}, {"a": 0, "b": 12, "w": 0.22405662075337374}, {"a": 0, "b": 13, "w": 0.16308381778744896}, {"a": 0, "b": 14, "w": 0.22482337877058}, {"a": 0, "b": 15, "w": 0.23279901171565243}, {"a": 0, "b": 16, "w": 0.1958570636923963}, {"a": 0, "b": 17, "w": 0.1670432223084285}, {"a": 0, "b": 18, "w": 0.2234697143029052}, {"a": 0, "b": 19, "w": 0.16241396043489464}, {"a": 0, "b": 20, "w": 3.123523661940908e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=0.262,hiY=0.974;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
