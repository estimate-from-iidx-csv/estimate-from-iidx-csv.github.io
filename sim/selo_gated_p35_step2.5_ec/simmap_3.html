<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">abstract [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.254, "c": "種", "n": "abstract [A]  n=2276 cos1.00 難-0.25", "s": 0.69, "f": 0}, {"x": 0.998, "y": -0.317, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2244 cos1.00 難-0.32", "s": 0.68, "f": 0}, {"x": 0.994, "y": -0.294, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2711 cos0.99 難-0.29", "s": 0.822, "f": 0}, {"x": 0.994, "y": -0.299, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.766, "f": 0}, {"x": 0.993, "y": -0.29, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos0.99 難-0.29", "s": 0.308, "f": 0}, {"x": 0.993, "y": -0.197, "c": "近傍", "n": "In The Breeze [A]  n=2527 cos0.99 難-0.20", "s": 0.766, "f": 0}, {"x": 0.993, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.20", "s": 0.645, "f": 0}, {"x": 0.992, "y": -0.259, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.26", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.31, "c": "近傍", "n": "thunder [A]  n=2861 cos0.99 難-0.31", "s": 0.867, "f": 0}, {"x": 0.992, "y": -0.181, "c": "近傍", "n": "Umbral [A]  n=3241 cos0.99 難-0.18", "s": 0.982, "f": 0}, {"x": 0.992, "y": -0.248, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos0.99 難-0.25", "s": 0.628, "f": 0}, {"x": 0.992, "y": -0.412, "c": "近傍", "n": "WISE UP! [A]  n=2812 cos0.99 難-0.41", "s": 0.852, "f": 0}, {"x": 0.991, "y": -0.36, "c": "近傍", "n": "Mind Mapping [A]  n=3104 cos0.99 難-0.36", "s": 0.941, "f": 0}, {"x": 0.991, "y": -0.349, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1733 cos0.99 難-0.35", "s": 0.525, "f": 0}, {"x": 0.993, "y": -0.018, "c": "近傍", "n": "Music is The Answer [A]  n=3025 cos0.99 難-0.02", "s": 0.917, "f": 0}, {"x": 0.991, "y": -0.293, "c": "近傍", "n": "Scripted Connection⇒ H mix [H]  n=2493 cos0.99 難-0.29", "s": 0.755, "f": 0}, {"x": 0.991, "y": -0.3, "c": "近傍", "n": "STAR FIELD [A]  n=2390 cos0.99 難-0.30", "s": 0.724, "f": 0}, {"x": 0.991, "y": -0.15, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2790 cos0.99 難-0.15", "s": 0.845, "f": 0}, {"x": 0.99, "y": -0.239, "c": "近傍", "n": "Cheer Train [A]  n=2414 cos0.99 難-0.24", "s": 0.732, "f": 0}, {"x": 0.99, "y": -0.293, "c": "近傍", "n": "Twilight Warp [A]  n=2518 cos0.99 難-0.29", "s": 0.763, "f": 0}, {"x": 0.99, "y": -0.264, "c": "近傍", "n": "アクマフカ [A]  n=1847 cos0.99 難-0.26", "s": 0.56, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5897055691937946}, {"a": 0, "b": 2, "w": 0.39806900148868196}, {"a": 0, "b": 3, "w": 0.3179422019711441}, {"a": 0, "b": 4, "w": 0.3183449719664274}, {"a": 0, "b": 5, "w": 0.2904819726050204}, {"a": 0, "b": 6, "w": 0.191096327754537}, {"a": 0, "b": 7, "w": 0.1930467737711521}, {"a": 0, "b": 8, "w": 0.3068220033652902}, {"a": 0, "b": 9, "w": 0.2902673914281114}, {"a": 0, "b": 10, "w": 0.27193792594851285}, {"a": 0, "b": 11, "w": 0.2712016095850972}, {"a": 0, "b": 12, "w": 0.24854399222265544}, {"a": 0, "b": 13, "w": 0.12004790623354844}, {"a": 0, "b": 14, "w": 0.3296459926042299}, {"a": 0, "b": 15, "w": 0.09545195186127775}, {"a": 0, "b": 16, "w": 0.24798528073696768}, {"a": 0, "b": 17, "w": 0.21647727460944766}, {"a": 0, "b": 18, "w": 0.22572546855213393}, {"a": 0, "b": 19, "w": 0.21268596086536218}, {"a": 0, "b": 20, "w": 5.991851459441477e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.444,hiY=0.014;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
