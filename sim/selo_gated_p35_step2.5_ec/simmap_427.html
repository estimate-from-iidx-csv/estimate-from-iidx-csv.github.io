<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Necroxis Girl [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.451, "c": "種", "n": "Necroxis Girl [H]  n=936 cos1.00 難-1.45", "s": 0.504, "f": 0}, {"x": 0.992, "y": -1.464, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.99 難-1.46", "s": 0.562, "f": 0}, {"x": 0.992, "y": -1.466, "c": "近傍", "n": "CoMAAAAAAA [H]  n=1228 cos0.99 難-1.47", "s": 0.662, "f": 0}, {"x": 0.989, "y": -1.428, "c": "近傍", "n": "天邪鬼 [H]  n=1289 cos0.99 難-1.43", "s": 0.695, "f": 0}, {"x": 0.989, "y": -1.396, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.99 難-1.40", "s": 0.815, "f": 0}, {"x": 0.992, "y": -1.337, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.34", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.364, "c": "近傍", "n": "Scarlet Moon [H]  n=1836 cos0.99 難-1.36", "s": 0.989, "f": 0}, {"x": 0.989, "y": -1.381, "c": "近傍", "n": "Discloze [H]  n=1378 cos0.99 難-1.38", "s": 0.742, "f": 0}, {"x": 0.99, "y": -1.549, "c": "近傍", "n": "Static State [H]  n=1084 cos0.99 難-1.55", "s": 0.584, "f": 0}, {"x": 0.989, "y": -1.368, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.99 難-1.37", "s": 0.803, "f": 0}, {"x": 0.99, "y": -1.356, "c": "近傍", "n": "Push on Beats!～音ゲの国のeX-ストリーマー～ [H]  n=783 cos0.99 難-1.36", "s": 0.422, "f": 0}, {"x": 0.994, "y": -1.298, "c": "近傍", "n": "童話回廊 [H]  n=1035 cos0.99 難-1.30", "s": 0.558, "f": 0}, {"x": 0.986, "y": -1.476, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.48", "s": 0.6, "f": 0}, {"x": 0.988, "y": -1.547, "c": "近傍", "n": "ZENDEGI DANCE [H]  n=1083 cos0.99 難-1.55", "s": 0.584, "f": 0}, {"x": 0.986, "y": -1.496, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.99 難-1.50", "s": 0.539, "f": 0}, {"x": 0.988, "y": -1.342, "c": "近傍", "n": "Arca [H]  n=1546 cos0.99 難-1.34", "s": 0.833, "f": 0}, {"x": 0.989, "y": -1.324, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.99 難-1.32", "s": 0.546, "f": 0}, {"x": 0.991, "y": -1.602, "c": "近傍", "n": "ChaserXX [H]  n=1407 cos0.99 難-1.60", "s": 0.758, "f": 0}, {"x": 0.985, "y": -1.509, "c": "近傍", "n": "ZEPHYRANTHES [H]  n=1643 cos0.98 難-1.51", "s": 0.885, "f": 0}, {"x": 0.991, "y": -1.29, "c": "近傍", "n": "Begin [H]  n=613 cos0.99 難-1.29", "s": 0.33, "f": 0}, {"x": 0.992, "y": -1.615, "c": "近傍", "n": "SPEED ROCKER [H]  n=1120 cos0.99 難-1.61", "s": 0.603, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33318517191849795}, {"a": 0, "b": 2, "w": 0.30502081687319815}, {"a": 0, "b": 3, "w": 0.04257305370750397}, {"a": 0, "b": 4, "w": 0.11142004861042731}, {"a": 0, "b": 5, "w": 0.22920192678993967}, {"a": 0, "b": 6, "w": 0.17178815845593687}, {"a": 0, "b": 7, "w": 0.06573375152773508}, {"a": 0, "b": 8, "w": 0.21557854012466615}, {"a": 0, "b": 9, "w": 0.15885229943902157}, {"a": 0, "b": 10, "w": 0.17631878711776405}, {"a": 0, "b": 11, "w": 0.28204026518710434}, {"a": 0, "b": 12, "w": 0.022723302809268597}, {"a": 0, "b": 13, "w": 0.10379488971515805}, {"a": 0, "b": 14, "w": 5.4357851553277214e-11}, {"a": 0, "b": 15, "w": 0.0026159699928240965}, {"a": 0, "b": 16, "w": 0.18579170121834798}, {"a": 0, "b": 17, "w": 0.15709965043343244}, {"a": 0, "b": 18, "w": 0.06746019193315489}, {"a": 0, "b": 19, "w": 0.27816477680027496}, {"a": 0, "b": 20, "w": 0.08597115879936401}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.641,hiY=-1.264;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
