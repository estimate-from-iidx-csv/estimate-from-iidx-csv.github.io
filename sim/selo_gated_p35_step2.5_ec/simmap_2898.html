<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Valanga [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.899, "c": "種", "n": "Valanga [A]  n=3501 cos1.00 難0.90", "s": 0.974, "f": 0}, {"x": 0.997, "y": 0.796, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3433 cos1.00 難0.80", "s": 0.955, "f": 0}, {"x": 0.989, "y": 0.983, "c": "近傍", "n": "Triple Cross [A]  n=2548 cos0.99 難0.98", "s": 0.709, "f": 0}, {"x": 0.987, "y": 0.949, "c": "近傍", "n": "King of Tribe [A]  n=594 cos0.99 難0.95", "s": 0.165, "f": 0}, {"x": 0.985, "y": 0.915, "c": "近傍", "n": "Super Rush [A]  n=3502 cos0.98 難0.92", "s": 0.974, "f": 0}, {"x": 0.985, "y": 0.866, "c": "近傍", "n": "DARK LEGACY [A]  n=3462 cos0.98 難0.87", "s": 0.963, "f": 0}, {"x": 0.989, "y": 1.031, "c": "近傍", "n": "Rave Patroller [A]  n=2943 cos0.99 難1.03", "s": 0.819, "f": 0}, {"x": 0.992, "y": 0.743, "c": "近傍", "n": "Megalara Garuda [A]  n=2812 cos0.99 難0.74", "s": 0.782, "f": 0}, {"x": 0.984, "y": 0.962, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3387 cos0.98 難0.96", "s": 0.942, "f": 0}, {"x": 0.982, "y": 0.865, "c": "近傍", "n": "DOMINION [A]  n=3448 cos0.98 難0.87", "s": 0.959, "f": 0}, {"x": 0.988, "y": 1.059, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2999 cos0.99 難1.06", "s": 0.834, "f": 0}, {"x": 0.987, "y": 1.055, "c": "近傍", "n": "cinder [A]  n=3236 cos0.99 難1.06", "s": 0.9, "f": 0}, {"x": 0.986, "y": 0.749, "c": "近傍", "n": "グッバイ宣言 [L]  n=1315 cos0.99 難0.75", "s": 0.366, "f": 0}, {"x": 0.98, "y": 0.814, "c": "近傍", "n": "Beat Radiance [L]  n=3485 cos0.98 難0.81", "s": 0.97, "f": 0}, {"x": 0.984, "y": 0.739, "c": "近傍", "n": "GRID KNIGHT [L]  n=3179 cos0.98 難0.74", "s": 0.885, "f": 0}, {"x": 0.982, "y": 0.758, "c": "近傍", "n": "Say YEEEAHH [A]  n=3513 cos0.98 難0.76", "s": 0.977, "f": 0}, {"x": 0.985, "y": 0.722, "c": "近傍", "n": "Idola [A]  n=3594 cos0.98 難0.72", "s": 1.0, "f": 0}, {"x": 0.977, "y": 0.841, "c": "近傍", "n": "天邪鬼 [A]  n=2445 cos0.98 難0.84", "s": 0.68, "f": 0}, {"x": 0.979, "y": 1.016, "c": "近傍", "n": "TECHNO Style Essentials [A]  n=2988 cos0.98 難1.02", "s": 0.831, "f": 0}, {"x": 0.983, "y": 1.069, "c": "近傍", "n": "Umbral [L]  n=2059 cos0.98 難1.07", "s": 0.573, "f": 0}, {"x": 0.976, "y": 0.855, "c": "近傍", "n": "M4K3 1T B0UNC3 [A]  n=3478 cos0.98 難0.85", "s": 0.968, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48090149993341313}, {"a": 0, "b": 2, "w": 0.34685365536878476}, {"a": 0, "b": 3, "w": 0.23281772805252232}, {"a": 0, "b": 4, "w": 0.23329470015006482}, {"a": 0, "b": 5, "w": 0.22814493822043513}, {"a": 0, "b": 6, "w": 0.26513612458166524}, {"a": 0, "b": 7, "w": 0.24378125714690901}, {"a": 0, "b": 8, "w": 0.20838268218191902}, {"a": 0, "b": 9, "w": 0.16354589729232705}, {"a": 0, "b": 10, "w": 0.26810168564702186}, {"a": 0, "b": 11, "w": 0.28911861301490216}, {"a": 0, "b": 12, "w": 0.25759503973689846}, {"a": 0, "b": 13, "w": 3.031119799601356e-11}, {"a": 0, "b": 14, "w": 0.21198514421128223}, {"a": 0, "b": 15, "w": 0.1633186678913232}, {"a": 0, "b": 16, "w": 0.2298837208031128}, {"a": 0, "b": 17, "w": 0.07055510455664327}, {"a": 0, "b": 18, "w": 0.0986527935387157}, {"a": 0, "b": 19, "w": 0.17988113085020463}, {"a": 0, "b": 20, "w": 0.02378376002439031}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=0.694,hiY=1.097;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
