<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MIRACLE MEETS [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.034, "c": "種", "n": "MIRACLE MEETS [A]  n=3777 cos1.00 難-0.03", "s": 0.996, "f": 0}, {"x": 0.99, "y": -0.188, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.99 難-0.19", "s": 0.328, "f": 0}, {"x": 0.989, "y": 0.072, "c": "近傍", "n": "Elisha [A]  n=3769 cos0.99 難0.07", "s": 0.994, "f": 0}, {"x": 0.982, "y": 0.107, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.98 難0.11", "s": 0.417, "f": 0}, {"x": 0.979, "y": -0.19, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.98 難-0.19", "s": 0.482, "f": 0}, {"x": 0.977, "y": -0.184, "c": "近傍", "n": "おおきなこえで [L]  n=2619 cos0.98 難-0.18", "s": 0.691, "f": 0}, {"x": 0.975, "y": 0.156, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1763 cos0.98 難0.16", "s": 0.465, "f": 0}, {"x": 0.978, "y": 0.361, "c": "近傍", "n": "Golden Palms [L]  n=3343 cos0.98 難0.36", "s": 0.882, "f": 0}, {"x": 0.974, "y": -0.248, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2165 cos0.97 難-0.25", "s": 0.571, "f": 0}, {"x": 0.974, "y": -0.241, "c": "近傍", "n": "Golden Palms [A]  n=3230 cos0.97 難-0.24", "s": 0.852, "f": 0}, {"x": 0.976, "y": -0.415, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.98 難-0.42", "s": 0.792, "f": 0}, {"x": 0.972, "y": -0.021, "c": "近傍", "n": "えだまめカレークッキング [A]  n=1612 cos0.97 難-0.02", "s": 0.425, "f": 0}, {"x": 0.974, "y": -0.414, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2947 cos0.97 難-0.41", "s": 0.777, "f": 0}, {"x": 0.974, "y": -0.425, "c": "近傍", "n": "REcorrection [A]  n=689 cos0.97 難-0.43", "s": 0.182, "f": 0}, {"x": 0.97, "y": 0.075, "c": "近傍", "n": "Sakura Reflection [A]  n=3791 cos0.97 難0.08", "s": 1.0, "f": 0}, {"x": 0.97, "y": -0.109, "c": "近傍", "n": "十六夜セツナ [A]  n=3348 cos0.97 難-0.11", "s": 0.883, "f": 0}, {"x": 0.975, "y": -0.479, "c": "近傍", "n": "真夏の花・真夏の夢 [A]  n=2783 cos0.97 難-0.48", "s": 0.734, "f": 0}, {"x": 0.97, "y": 0.102, "c": "近傍", "n": "Onyx [A]  n=2505 cos0.97 難0.10", "s": 0.661, "f": 0}, {"x": 0.974, "y": -0.486, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=996 cos0.97 難-0.49", "s": 0.263, "f": 0}, {"x": 0.973, "y": -0.438, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2752 cos0.97 難-0.44", "s": 0.726, "f": 0}, {"x": 0.97, "y": 0.265, "c": "近傍", "n": "Souhait bleu [A]  n=2368 cos0.97 難0.26", "s": 0.625, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4452600601642078}, {"a": 0, "b": 2, "w": 0.5224160808671843}, {"a": 0, "b": 3, "w": 0.387585999573568}, {"a": 0, "b": 4, "w": 0.345776275021786}, {"a": 0, "b": 5, "w": 0.1955276471806633}, {"a": 0, "b": 6, "w": 0.27360913344087534}, {"a": 0, "b": 7, "w": 0.3313382133695054}, {"a": 0, "b": 8, "w": 0.27767910945734664}, {"a": 0, "b": 9, "w": 0.20788398097132543}, {"a": 0, "b": 10, "w": 0.23582877079665343}, {"a": 0, "b": 11, "w": 0.23172730590572044}, {"a": 0, "b": 12, "w": 2.7818858328032547e-11}, {"a": 0, "b": 13, "w": 0.09880994160427237}, {"a": 0, "b": 14, "w": 0.21400032547667025}, {"a": 0, "b": 15, "w": 0.21880679127004432}, {"a": 0, "b": 16, "w": 0.008290144653871123}, {"a": 0, "b": 17, "w": 0.22557777985966065}, {"a": 0, "b": 18, "w": 0.1616519528075283}, {"a": 0, "b": 19, "w": 0.049211785679872166}, {"a": 0, "b": 20, "w": 0.17791072231634197}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.553,hiY=0.429;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
