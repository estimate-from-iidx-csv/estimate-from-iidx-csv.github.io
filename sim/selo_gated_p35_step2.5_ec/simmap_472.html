<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Queen Kaguya [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.914, "c": "種", "n": "Queen Kaguya [H]  n=927 cos1.00 難-1.91", "s": 0.778, "f": 0}, {"x": 0.993, "y": -1.93, "c": "近傍", "n": "Pout [H]  n=600 cos0.99 難-1.93", "s": 0.504, "f": 0}, {"x": 0.986, "y": -1.988, "c": "近傍", "n": "Seraph [H]  n=597 cos0.99 難-1.99", "s": 0.501, "f": 0}, {"x": 0.984, "y": -1.983, "c": "近傍", "n": "眠りの国のステラ [H]  n=696 cos0.98 難-1.98", "s": 0.584, "f": 0}, {"x": 0.982, "y": -1.957, "c": "近傍", "n": "Speculation [H]  n=532 cos0.98 難-1.96", "s": 0.447, "f": 0}, {"x": 0.978, "y": -1.878, "c": "近傍", "n": "Rubrum Piano [H]  n=659 cos0.98 難-1.88", "s": 0.553, "f": 0}, {"x": 0.977, "y": -1.904, "c": "近傍", "n": "Ritual of Anubis [H]  n=625 cos0.98 難-1.90", "s": 0.525, "f": 0}, {"x": 0.977, "y": -1.868, "c": "近傍", "n": "Garuda [H]  n=879 cos0.98 難-1.87", "s": 0.738, "f": 0}, {"x": 0.976, "y": -1.924, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=958 cos0.98 難-1.92", "s": 0.804, "f": 0}, {"x": 0.975, "y": -1.952, "c": "近傍", "n": "Xyndrome [H]  n=862 cos0.98 難-1.95", "s": 0.724, "f": 0}, {"x": 0.976, "y": -1.976, "c": "近傍", "n": "メズマライザー [H]  n=600 cos0.98 難-1.98", "s": 0.504, "f": 0}, {"x": 0.982, "y": -1.741, "c": "近傍", "n": "Break Stasis [H]  n=1191 cos0.98 難-1.74", "s": 1.0, "f": 0}, {"x": 0.973, "y": -1.895, "c": "近傍", "n": "of the first magnitude [H]  n=847 cos0.97 難-1.89", "s": 0.711, "f": 0}, {"x": 0.982, "y": -1.723, "c": "近傍", "n": "Afterimage d'automne [H]  n=931 cos0.98 難-1.72", "s": 0.782, "f": 0}, {"x": 0.978, "y": -2.075, "c": "近傍", "n": "オールトの雲 [H]  n=825 cos0.98 難-2.07", "s": 0.693, "f": 0}, {"x": 0.972, "y": -1.888, "c": "近傍", "n": "儚き恋の華 [H]  n=974 cos0.97 難-1.89", "s": 0.818, "f": 0}, {"x": 0.972, "y": -2.004, "c": "近傍", "n": "輪廻の鴉 [H]  n=559 cos0.97 難-2.00", "s": 0.469, "f": 0}, {"x": 0.985, "y": -1.666, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [H]  n=1153 cos0.99 難-1.67", "s": 0.968, "f": 0}, {"x": 0.97, "y": -1.972, "c": "近傍", "n": "Victory Of Ravers [H]  n=728 cos0.97 難-1.97", "s": 0.611, "f": 0}, {"x": 0.973, "y": -2.073, "c": "近傍", "n": "響花水月 [H]  n=686 cos0.97 難-2.07", "s": 0.576, "f": 0}, {"x": 0.97, "y": -2.02, "c": "近傍", "n": "フォニイ [H]  n=788 cos0.97 難-2.02", "s": 0.662, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46061732454755266}, {"a": 0, "b": 2, "w": 0.2960680148390984}, {"a": 0, "b": 3, "w": 0.25924731156308334}, {"a": 0, "b": 4, "w": 0.1809148774362711}, {"a": 0, "b": 5, "w": 0.1616769350671099}, {"a": 0, "b": 6, "w": 0.15734692819246077}, {"a": 0, "b": 7, "w": 0.06785397243923197}, {"a": 0, "b": 8, "w": 0.11505446988762447}, {"a": 0, "b": 9, "w": 0.13262389734108104}, {"a": 0, "b": 10, "w": 0.06090851083301574}, {"a": 0, "b": 11, "w": 0.22603890594956877}, {"a": 0, "b": 12, "w": 0.10730967358526511}, {"a": 0, "b": 13, "w": 0.2203328930241285}, {"a": 0, "b": 14, "w": 0.16874944476374154}, {"a": 0, "b": 15, "w": 0.07095200553746439}, {"a": 0, "b": 16, "w": 0.04857350028713192}, {"a": 0, "b": 17, "w": 0.3395275596659605}, {"a": 0, "b": 18, "w": 0.06538781029829599}, {"a": 0, "b": 19, "w": 0.020381822968882357}, {"a": 0, "b": 20, "w": 3.887035138205874e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-2.107,hiY=-1.633;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
