<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Alpheratz [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.167, "c": "種", "n": "Alpheratz [L]  n=212 cos1.00 難0.17", "s": 0.057, "f": 0}, {"x": 0.998, "y": 0.195, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.19", "s": 0.76, "f": 0}, {"x": 0.998, "y": 0.173, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos1.00 難0.17", "s": 0.477, "f": 0}, {"x": 0.998, "y": 0.112, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos1.00 難0.11", "s": 0.943, "f": 0}, {"x": 0.997, "y": 0.115, "c": "近傍", "n": "PILGRIM [A]  n=1299 cos1.00 難0.11", "s": 0.351, "f": 0}, {"x": 0.996, "y": 0.143, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos1.00 難0.14", "s": 0.953, "f": 0}, {"x": 0.996, "y": 0.131, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos1.00 難0.13", "s": 0.492, "f": 0}, {"x": 0.996, "y": 0.113, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos1.00 難0.11", "s": 0.857, "f": 0}, {"x": 0.996, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.18", "s": 0.442, "f": 0}, {"x": 0.996, "y": 0.19, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos1.00 難0.19", "s": 0.931, "f": 0}, {"x": 0.997, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos1.00 難0.27", "s": 0.926, "f": 0}, {"x": 0.996, "y": 0.218, "c": "近傍", "n": "xenon [A]  n=3549 cos1.00 難0.22", "s": 0.96, "f": 0}, {"x": 0.997, "y": 0.065, "c": "近傍", "n": "X-ray binary [A]  n=2522 cos1.00 難0.07", "s": 0.682, "f": 0}, {"x": 0.996, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.26", "s": 0.278, "f": 0}, {"x": 0.995, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos1.00 難0.13", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.155, "c": "近傍", "n": "Ambush Ace [A]  n=1736 cos1.00 難0.16", "s": 0.47, "f": 0}, {"x": 0.995, "y": 0.129, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos1.00 難0.13", "s": 0.962, "f": 0}, {"x": 0.996, "y": 0.253, "c": "近傍", "n": "rainbow guitar weeps [A]  n=3345 cos1.00 難0.25", "s": 0.905, "f": 0}, {"x": 0.995, "y": 0.144, "c": "近傍", "n": "無意識のフィロソフィア [A]  n=2452 cos0.99 難0.14", "s": 0.663, "f": 0}, {"x": 0.995, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos0.99 難0.20", "s": 0.935, "f": 0}, {"x": 0.995, "y": 0.2, "c": "近傍", "n": "Elektrick U-Phoria [A]  n=3481 cos0.99 難0.20", "s": 0.942, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5841486196382333}, {"a": 0, "b": 2, "w": 0.4594907435229445}, {"a": 0, "b": 3, "w": 0.5194203509847893}, {"a": 0, "b": 4, "w": 0.3451466612730909}, {"a": 0, "b": 5, "w": 0.37777428301765203}, {"a": 0, "b": 6, "w": 0.3700195664036595}, {"a": 0, "b": 7, "w": 0.4131030732305515}, {"a": 0, "b": 8, "w": 0.3350528684656966}, {"a": 0, "b": 9, "w": 0.3008199665635556}, {"a": 0, "b": 10, "w": 0.4615973153724797}, {"a": 0, "b": 11, "w": 0.3362354730186927}, {"a": 0, "b": 12, "w": 0.43378047252112006}, {"a": 0, "b": 13, "w": 0.40837131158620354}, {"a": 0, "b": 14, "w": 0.17916029290386715}, {"a": 0, "b": 15, "w": 0.20659196685411874}, {"a": 0, "b": 16, "w": 0.3175811566412081}, {"a": 0, "b": 17, "w": 0.37461835726068216}, {"a": 0, "b": 18, "w": 0.2094401978821282}, {"a": 0, "b": 19, "w": 0.13948615911753703}, {"a": 0, "b": 20, "w": 5.7822746590829865e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.049,hiY=0.281;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
