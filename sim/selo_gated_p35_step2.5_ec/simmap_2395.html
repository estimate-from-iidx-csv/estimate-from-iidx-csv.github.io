<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Somnidiscotheque [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.254, "c": "種", "n": "Somnidiscotheque [H]  n=1647 cos1.00 難-0.25", "s": 0.457, "f": 0}, {"x": 0.985, "y": -0.439, "c": "近傍", "n": "rumrum triplets [H]  n=2692 cos0.99 難-0.44", "s": 0.746, "f": 0}, {"x": 0.981, "y": -0.547, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.98 難-0.55", "s": 0.681, "f": 0}, {"x": 0.977, "y": -0.181, "c": "近傍", "n": "Magical [A]  n=3224 cos0.98 難-0.18", "s": 0.894, "f": 0}, {"x": 0.977, "y": -0.387, "c": "近傍", "n": "駅猫のワルツ [H]  n=2703 cos0.98 難-0.39", "s": 0.749, "f": 0}, {"x": 0.976, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.98 難-0.41", "s": 0.864, "f": 0}, {"x": 0.975, "y": -0.248, "c": "近傍", "n": "rage against usual [H]  n=2637 cos0.97 難-0.25", "s": 0.731, "f": 0}, {"x": 0.978, "y": -0.571, "c": "近傍", "n": "少年は空を辿る [H]  n=2731 cos0.98 難-0.57", "s": 0.757, "f": 0}, {"x": 0.977, "y": -0.607, "c": "近傍", "n": "snow storm [H]  n=3002 cos0.98 難-0.61", "s": 0.832, "f": 0}, {"x": 0.974, "y": -0.474, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1633 cos0.97 難-0.47", "s": 0.453, "f": 0}, {"x": 0.975, "y": -0.573, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.97 難-0.57", "s": 0.659, "f": 0}, {"x": 0.985, "y": -0.801, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.98 難-0.80", "s": 0.569, "f": 0}, {"x": 0.971, "y": -0.301, "c": "近傍", "n": "天空の夜明け [H]  n=3607 cos0.97 難-0.30", "s": 1.0, "f": 0}, {"x": 0.974, "y": -0.626, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.97 難-0.63", "s": 0.632, "f": 0}, {"x": 0.971, "y": -0.02, "c": "近傍", "n": "Freezing atmosphere [A]  n=2166 cos0.97 難-0.02", "s": 0.6, "f": 0}, {"x": 0.97, "y": -0.439, "c": "近傍", "n": "真夜中のバベル [A]  n=1944 cos0.97 難-0.44", "s": 0.539, "f": 0}, {"x": 0.97, "y": -0.489, "c": "近傍", "n": "Thor's Hammer [H]  n=3183 cos0.97 難-0.49", "s": 0.882, "f": 0}, {"x": 0.973, "y": -0.604, "c": "近傍", "n": "Nightmare before oversleep [H]  n=2374 cos0.97 難-0.60", "s": 0.658, "f": 0}, {"x": 0.971, "y": -0.508, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.97 難-0.51", "s": 0.811, "f": 0}, {"x": 0.974, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.97 難-0.65", "s": 0.63, "f": 0}, {"x": 0.982, "y": -0.837, "c": "近傍", "n": "Illegal Function Call [H]  n=2006 cos0.98 難-0.84", "s": 0.556, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2226705721690979}, {"a": 0, "b": 2, "w": 0.10334117443772217}, {"a": 0, "b": 3, "w": 0.05117673110154264}, {"a": 0, "b": 4, "w": 0.10708613531434885}, {"a": 0, "b": 5, "w": 0.19604765816447867}, {"a": 0, "b": 6, "w": 0.18251553501819484}, {"a": 0, "b": 7, "w": 0.23054110449034715}, {"a": 0, "b": 8, "w": 0.22076932519604453}, {"a": 0, "b": 9, "w": 0.15821451038841017}, {"a": 0, "b": 10, "w": 0.13451719970505505}, {"a": 0, "b": 11, "w": 0.21688013692570796}, {"a": 0, "b": 12, "w": 0.12076090530553651}, {"a": 0, "b": 13, "w": 3.5774605500193957e-11}, {"a": 0, "b": 14, "w": 0.08202631924846915}, {"a": 0, "b": 15, "w": 0.08003908137345295}, {"a": 0, "b": 16, "w": 0.10891480559066102}, {"a": 0, "b": 17, "w": 0.154063202818699}, {"a": 0, "b": 18, "w": 0.08205887435130255}, {"a": 0, "b": 19, "w": 0.10969287695069063}, {"a": 0, "b": 20, "w": 0.0999565612540636}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.902,hiY=0.046;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
