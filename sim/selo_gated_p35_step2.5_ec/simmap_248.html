<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Boundary [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.751, "c": "種", "n": "Boundary [H]  n=1742 cos1.00 難-0.75", "s": 0.489, "f": 0}, {"x": 0.989, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.493, "f": 0}, {"x": 0.994, "y": -0.997, "c": "近傍", "n": "NEO GENERATOR SEVEN [H]  n=1629 cos0.99 難-1.00", "s": 0.457, "f": 0}, {"x": 0.988, "y": -0.683, "c": "近傍", "n": "HIGH [H]  n=1620 cos0.99 難-0.68", "s": 0.455, "f": 0}, {"x": 0.99, "y": -0.97, "c": "近傍", "n": "No Tears [H]  n=1729 cos0.99 難-0.97", "s": 0.485, "f": 0}, {"x": 0.987, "y": -0.604, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.60", "s": 0.523, "f": 0}, {"x": 0.991, "y": -0.438, "c": "近傍", "n": "虹色 [A]  n=3051 cos0.99 難-0.44", "s": 0.856, "f": 0}, {"x": 0.985, "y": -0.791, "c": "近傍", "n": "HEISEI [H]  n=2018 cos0.99 難-0.79", "s": 0.566, "f": 0}, {"x": 0.989, "y": -0.486, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1232 cos0.99 難-0.49", "s": 0.346, "f": 0}, {"x": 0.986, "y": -0.607, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.61", "s": 0.71, "f": 0}, {"x": 0.985, "y": -0.653, "c": "近傍", "n": "LOVELY STORM [H]  n=1965 cos0.99 難-0.65", "s": 0.552, "f": 0}, {"x": 0.991, "y": -1.077, "c": "近傍", "n": "RIZING YOU UP [H]  n=1821 cos0.99 難-1.08", "s": 0.511, "f": 0}, {"x": 0.986, "y": -0.556, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.56", "s": 0.727, "f": 0}, {"x": 0.984, "y": -0.702, "c": "近傍", "n": "凛として咲く花の如く [H]  n=3267 cos0.98 難-0.70", "s": 0.917, "f": 0}, {"x": 0.988, "y": -0.486, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=996 cos0.99 難-0.49", "s": 0.28, "f": 0}, {"x": 0.984, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.98 難-0.84", "s": 0.561, "f": 0}, {"x": 0.984, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.98 難-0.70", "s": 0.504, "f": 0}, {"x": 0.985, "y": -0.591, "c": "近傍", "n": "Sounds Of Summer [H]  n=2726 cos0.98 難-0.59", "s": 0.765, "f": 0}, {"x": 0.986, "y": -0.506, "c": "近傍", "n": "Element of SPADA [A]  n=3563 cos0.99 難-0.51", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.925, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos0.98 難-0.92", "s": 0.63, "f": 0}, {"x": 0.985, "y": -0.509, "c": "近傍", "n": "イガク [A]  n=1533 cos0.99 難-0.51", "s": 0.43, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3497389589376564}, {"a": 0, "b": 2, "w": 0.4951814939085575}, {"a": 0, "b": 3, "w": 0.31911279567802653}, {"a": 0, "b": 4, "w": 0.38475952005951697}, {"a": 0, "b": 5, "w": 0.14603597062044604}, {"a": 0, "b": 6, "w": 0.3877348582407978}, {"a": 0, "b": 7, "w": 0.25523297624084595}, {"a": 0, "b": 8, "w": 0.33516778252640467}, {"a": 0, "b": 9, "w": 0.27155008384580104}, {"a": 0, "b": 10, "w": 0.24786274526102614}, {"a": 0, "b": 11, "w": 0.40386147207291556}, {"a": 0, "b": 12, "w": 0.2725264176163401}, {"a": 0, "b": 13, "w": 0.22625258696023332}, {"a": 0, "b": 14, "w": 0.30321452713330244}, {"a": 0, "b": 15, "w": 0.22646287782394303}, {"a": 0, "b": 16, "w": 4.612077386667579e-11}, {"a": 0, "b": 17, "w": 0.23618864679553453}, {"a": 0, "b": 18, "w": 0.22165230935747648}, {"a": 0, "b": 19, "w": 0.17566800281604122}, {"a": 0, "b": 20, "w": 0.25383023409663663}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.129,hiY=-0.387;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
