<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">VANESSA [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.381, "c": "種", "n": "VANESSA [L]  n=2321 cos1.00 難2.38", "s": 0.8, "f": 0}, {"x": 0.978, "y": 2.389, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1151 cos0.98 難2.39", "s": 0.396, "f": 0}, {"x": 0.981, "y": 2.318, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.98 難2.32", "s": 0.79, "f": 0}, {"x": 0.981, "y": 2.317, "c": "近傍", "n": "Confiserie [A]  n=2903 cos0.98 難2.32", "s": 1.0, "f": 0}, {"x": 0.976, "y": 2.381, "c": "近傍", "n": "LIGHTNING STRIKES [L]  n=1109 cos0.98 難2.38", "s": 0.382, "f": 0}, {"x": 0.979, "y": 2.434, "c": "近傍", "n": "Override [L]  n=1612 cos0.98 難2.43", "s": 0.555, "f": 0}, {"x": 0.975, "y": 2.386, "c": "近傍", "n": "EMERALDAS [A]  n=2713 cos0.97 難2.39", "s": 0.935, "f": 0}, {"x": 0.973, "y": 2.435, "c": "近傍", "n": "IX [A]  n=2727 cos0.97 難2.43", "s": 0.939, "f": 0}, {"x": 0.972, "y": 2.309, "c": "近傍", "n": "HYENA [L]  n=760 cos0.97 難2.31", "s": 0.262, "f": 0}, {"x": 0.979, "y": 2.254, "c": "近傍", "n": "THE F∀UST [A]  n=2481 cos0.98 難2.25", "s": 0.855, "f": 0}, {"x": 0.982, "y": 2.223, "c": "近傍", "n": "≡+≡ [L]  n=746 cos0.98 難2.22", "s": 0.257, "f": 0}, {"x": 0.966, "y": 2.452, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.97 難2.45", "s": 0.724, "f": 0}, {"x": 0.977, "y": 2.236, "c": "近傍", "n": "Vulnerability [A]  n=1145 cos0.98 難2.24", "s": 0.394, "f": 0}, {"x": 0.988, "y": 2.558, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2335 cos0.99 難2.56", "s": 0.804, "f": 0}, {"x": 0.964, "y": 2.304, "c": "近傍", "n": "CONTRACT [L]  n=2438 cos0.96 難2.30", "s": 0.84, "f": 0}, {"x": 0.964, "y": 2.307, "c": "近傍", "n": "千年ノ理 [L]  n=2365 cos0.96 難2.31", "s": 0.815, "f": 0}, {"x": 0.96, "y": 2.372, "c": "近傍", "n": "Binary Black Hole [A]  n=1876 cos0.96 難2.37", "s": 0.646, "f": 0}, {"x": 0.959, "y": 2.427, "c": "近傍", "n": "VOID [A]  n=1272 cos0.96 難2.43", "s": 0.438, "f": 0}, {"x": 0.974, "y": 2.552, "c": "近傍", "n": "Elemental Creation [A]  n=2833 cos0.97 難2.55", "s": 0.976, "f": 0}, {"x": 0.979, "y": 2.189, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1872 cos0.98 難2.19", "s": 0.645, "f": 0}, {"x": 0.987, "y": 2.163, "c": "近傍", "n": "SOLID WYVERN [L]  n=1045 cos0.99 難2.16", "s": 0.36, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28081869280727256}, {"a": 0, "b": 2, "w": 0.3326103165808719}, {"a": 0, "b": 3, "w": 0.33229168787352914}, {"a": 0, "b": 4, "w": 0.25771565841021304}, {"a": 0, "b": 5, "w": 0.2953859199937495}, {"a": 0, "b": 6, "w": 0.2139628694245903}, {"a": 0, "b": 7, "w": 0.20793866503954894}, {"a": 0, "b": 8, "w": 0.19154066843421724}, {"a": 0, "b": 9, "w": 0.2975806120656903}, {"a": 0, "b": 10, "w": 0.1307204444188419}, {"a": 0, "b": 11, "w": 0.12170481649829068}, {"a": 0, "b": 12, "w": 0.24364710065452955}, {"a": 0, "b": 13, "w": 0.47343309189155414}, {"a": 0, "b": 14, "w": 1.9427903730218077e-11}, {"a": 0, "b": 15, "w": 0.05610454876607707}, {"a": 0, "b": 16, "w": 0.029910574250020194}, {"a": 0, "b": 17, "w": 0.029164157728403195}, {"a": 0, "b": 18, "w": 0.12914573826220177}, {"a": 0, "b": 19, "w": 0.3017333151372835}, {"a": 0, "b": 20, "w": 0.4443003890446322}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.956,hiX=1.003,loY=2.131,hiY=2.590;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
