<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Aurora [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.161, "c": "種", "n": "Aurora [A]  n=3652 cos1.00 難0.16", "s": 0.976, "f": 0}, {"x": 0.997, "y": 0.219, "c": "近傍", "n": "INHERITANCE [A]  n=1654 cos1.00 難0.22", "s": 0.442, "f": 0}, {"x": 0.997, "y": 0.163, "c": "近傍", "n": "Lost Souls [A]  n=2609 cos1.00 難0.16", "s": 0.698, "f": 0}, {"x": 0.996, "y": 0.182, "c": "近傍", "n": "Squeeze [A]  n=3316 cos1.00 難0.18", "s": 0.887, "f": 0}, {"x": 0.996, "y": 0.183, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos1.00 難0.18", "s": 0.902, "f": 0}, {"x": 0.997, "y": 0.25, "c": "近傍", "n": "Ubertreffen [A]  n=3511 cos1.00 難0.25", "s": 0.939, "f": 0}, {"x": 0.996, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.18", "s": 0.437, "f": 0}, {"x": 0.996, "y": 0.107, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos1.00 難0.11", "s": 0.938, "f": 0}, {"x": 0.995, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos1.00 難0.12", "s": 0.693, "f": 0}, {"x": 0.995, "y": 0.218, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2290 cos1.00 難0.22", "s": 0.612, "f": 0}, {"x": 0.995, "y": 0.19, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos1.00 難0.19", "s": 0.92, "f": 0}, {"x": 0.995, "y": 0.157, "c": "近傍", "n": "響花水月 [A]  n=2146 cos1.00 難0.16", "s": 0.574, "f": 0}, {"x": 0.997, "y": 0.302, "c": "近傍", "n": "Angelic Jelly [A]  n=3400 cos1.00 難0.30", "s": 0.909, "f": 0}, {"x": 0.997, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos1.00 難0.30", "s": 0.479, "f": 0}, {"x": 0.995, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos0.99 難0.13", "s": 0.989, "f": 0}, {"x": 0.995, "y": 0.132, "c": "近傍", "n": "Override [A]  n=3124 cos0.99 難0.13", "s": 0.835, "f": 0}, {"x": 0.995, "y": 0.066, "c": "近傍", "n": "MENDES [H]  n=3662 cos1.00 難0.07", "s": 0.979, "f": 0}, {"x": 0.995, "y": 0.189, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.19", "s": 0.939, "f": 0}, {"x": 0.995, "y": 0.057, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos1.00 難0.06", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.131, "c": "近傍", "n": "Empire State Glory [A]  n=3578 cos0.99 難0.13", "s": 0.957, "f": 0}, {"x": 0.995, "y": 0.099, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos0.99 難0.10", "s": 0.284, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45879198267781507}, {"a": 0, "b": 2, "w": 0.44108243764294874}, {"a": 0, "b": 3, "w": 0.45201117617916}, {"a": 0, "b": 4, "w": 0.4603979027347632}, {"a": 0, "b": 5, "w": 0.5370429994210708}, {"a": 0, "b": 6, "w": 0.4517003146405463}, {"a": 0, "b": 7, "w": 0.20916312481887267}, {"a": 0, "b": 8, "w": 5.1305293347070346e-11}, {"a": 0, "b": 9, "w": 0.16545196005469875}, {"a": 0, "b": 10, "w": 0.3865675703957452}, {"a": 0, "b": 11, "w": 0.34281023827377854}, {"a": 0, "b": 12, "w": 0.2394345647704379}, {"a": 0, "b": 13, "w": 0.3412689447227948}, {"a": 0, "b": 14, "w": 0.3233515322853284}, {"a": 0, "b": 15, "w": 0.314526032521265}, {"a": 0, "b": 16, "w": 0.3982650522139938}, {"a": 0, "b": 17, "w": 0.25956278939573574}, {"a": 0, "b": 18, "w": 0.11731167805798304}, {"a": 0, "b": 19, "w": 0.28272990016565647}, {"a": 0, "b": 20, "w": 0.3160764311285318}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.037,hiY=0.321;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
