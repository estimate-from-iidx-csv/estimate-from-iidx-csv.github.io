<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Freeway Shuffle [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.08, "c": "種", "n": "Freeway Shuffle [A]  n=2925 cos1.00 難-0.08", "s": 0.777, "f": 0}, {"x": 0.995, "y": -0.124, "c": "近傍", "n": "Lucky Days [A]  n=2965 cos1.00 難-0.12", "s": 0.788, "f": 0}, {"x": 0.996, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos1.00 難-0.20", "s": 0.565, "f": 0}, {"x": 0.995, "y": -0.061, "c": "近傍", "n": "Scripted Connection⇒ N mix [A]  n=2801 cos1.00 難-0.06", "s": 0.744, "f": 0}, {"x": 0.995, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos1.00 難-0.11", "s": 0.826, "f": 0}, {"x": 0.995, "y": -0.012, "c": "近傍", "n": "Votum stellarum [A]  n=2865 cos1.00 難-0.01", "s": 0.761, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "First Resolution [A]  n=2082 cos1.00 難0.01", "s": 0.553, "f": 0}, {"x": 0.996, "y": -0.248, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos1.00 難-0.25", "s": 0.738, "f": 0}, {"x": 0.994, "y": -0.033, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.99 難-0.03", "s": 0.824, "f": 0}, {"x": 0.995, "y": -0.171, "c": "近傍", "n": "霧幻メモリア [A]  n=2432 cos0.99 難-0.17", "s": 0.646, "f": 0}, {"x": 0.995, "y": 0.026, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos0.99 難0.03", "s": 0.736, "f": 0}, {"x": 0.994, "y": -0.047, "c": "近傍", "n": "madrugada [A]  n=2180 cos0.99 難-0.05", "s": 0.579, "f": 0}, {"x": 0.996, "y": 0.121, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos1.00 難0.12", "s": 0.909, "f": 0}, {"x": 0.994, "y": -0.033, "c": "近傍", "n": "ラキラキ [A]  n=3102 cos0.99 難-0.03", "s": 0.824, "f": 0}, {"x": 0.994, "y": 0.024, "c": "近傍", "n": "She is my wife [A]  n=3098 cos0.99 難0.02", "s": 0.823, "f": 0}, {"x": 0.993, "y": -0.082, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos0.99 難-0.08", "s": 0.859, "f": 0}, {"x": 0.995, "y": 0.122, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos1.00 難0.12", "s": 0.65, "f": 0}, {"x": 0.994, "y": -0.209, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos0.99 難-0.21", "s": 0.744, "f": 0}, {"x": 0.994, "y": -0.259, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.26", "s": 0.877, "f": 0}, {"x": 0.993, "y": -0.124, "c": "近傍", "n": "THE SAFARI [H]  n=3763 cos0.99 難-0.12", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.079, "c": "近傍", "n": "alla turca con passione [A]  n=2818 cos0.99 難0.08", "s": 0.749, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.31317382831565976}, {"a": 0, "b": 2, "w": 0.485218406931354}, {"a": 0, "b": 3, "w": 0.14723876610960207}, {"a": 0, "b": 4, "w": 0.26264491547791047}, {"a": 0, "b": 5, "w": 0.3733691112800599}, {"a": 0, "b": 6, "w": 0.40674172885441073}, {"a": 0, "b": 7, "w": 0.48593511125001665}, {"a": 0, "b": 8, "w": 0.3727768751739887}, {"a": 0, "b": 9, "w": 0.1032035428175877}, {"a": 0, "b": 10, "w": 0.32293104853816734}, {"a": 0, "b": 11, "w": 0.3450827855410732}, {"a": 0, "b": 12, "w": 0.34535499349811327}, {"a": 0, "b": 13, "w": 0.30034915410080043}, {"a": 0, "b": 14, "w": 5.965183902389981e-11}, {"a": 0, "b": 15, "w": 0.2845535565779882}, {"a": 0, "b": 16, "w": 0.4172073816038535}, {"a": 0, "b": 17, "w": 0.32352192534047675}, {"a": 0, "b": 18, "w": 0.3650228943343322}, {"a": 0, "b": 19, "w": 0.19947737346127248}, {"a": 0, "b": 20, "w": 0.2202723378238831}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.289,hiY=0.153;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
