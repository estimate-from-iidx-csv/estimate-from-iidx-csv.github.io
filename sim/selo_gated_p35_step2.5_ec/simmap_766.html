<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Bahram Attack-猫叉Master Remix- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.02, "c": "種", "n": "Bahram Attack-猫叉Master Remix- [A]  n=3192 cos1.00 難0.02", "s": 0.889, "f": 0}, {"x": 0.997, "y": 0.067, "c": "近傍", "n": "No Tears [A]  n=3592 cos1.00 難0.07", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.076, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos1.00 難0.08", "s": 0.661, "f": 0}, {"x": 0.995, "y": 0.088, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos1.00 難0.09", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.028, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.03", "s": 0.861, "f": 0}, {"x": 0.997, "y": -0.136, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos1.00 難-0.14", "s": 0.876, "f": 0}, {"x": 0.995, "y": 0.139, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難0.14", "s": 0.32, "f": 0}, {"x": 0.993, "y": 0.024, "c": "近傍", "n": "PHOTONGENIC [A]  n=2864 cos0.99 難0.02", "s": 0.797, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3310 cos0.99 難0.14", "s": 0.921, "f": 0}, {"x": 0.993, "y": 0.08, "c": "近傍", "n": "PENDUAL TALISMAN [A]  n=3420 cos0.99 難0.08", "s": 0.952, "f": 0}, {"x": 0.992, "y": 0.052, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos0.99 難0.05", "s": 0.834, "f": 0}, {"x": 0.993, "y": -0.11, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3085 cos0.99 難-0.11", "s": 0.859, "f": 0}, {"x": 0.991, "y": 0.04, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2768 cos0.99 難0.04", "s": 0.771, "f": 0}, {"x": 0.991, "y": 0.058, "c": "近傍", "n": "RIZING YOU UP [A]  n=3106 cos0.99 難0.06", "s": 0.865, "f": 0}, {"x": 0.991, "y": 0.076, "c": "近傍", "n": "Shadow World [A]  n=2323 cos0.99 難0.08", "s": 0.647, "f": 0}, {"x": 0.991, "y": -0.095, "c": "近傍", "n": "オルタネイトβ [A]  n=3292 cos0.99 難-0.09", "s": 0.916, "f": 0}, {"x": 0.992, "y": -0.136, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3183 cos0.99 難-0.14", "s": 0.886, "f": 0}, {"x": 0.994, "y": 0.228, "c": "近傍", "n": "Take It Easy [A]  n=3281 cos0.99 難0.23", "s": 0.913, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "SHION [A]  n=3340 cos0.99 難-0.20", "s": 0.93, "f": 0}, {"x": 0.991, "y": 0.136, "c": "近傍", "n": "Pout [A]  n=2136 cos0.99 難0.14", "s": 0.595, "f": 0}, {"x": 0.99, "y": 0.055, "c": "近傍", "n": "SnapSkipSpark [A]  n=1095 cos0.99 難0.05", "s": 0.305, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5720440479147022}, {"a": 0, "b": 2, "w": 0.5593823172682084}, {"a": 0, "b": 3, "w": 0.3828922342523612}, {"a": 0, "b": 4, "w": 0.5110460647164512}, {"a": 0, "b": 5, "w": 0.6489778907248134}, {"a": 0, "b": 6, "w": 0.38799981583732335}, {"a": 0, "b": 7, "w": 0.4981952975013052}, {"a": 0, "b": 8, "w": 0.47666734675613276}, {"a": 0, "b": 9, "w": 0.36540405369822404}, {"a": 0, "b": 10, "w": 0.4623894191068135}, {"a": 0, "b": 11, "w": 0.5042714617238415}, {"a": 0, "b": 12, "w": 0.141957582172605}, {"a": 0, "b": 13, "w": 0.23834910394639175}, {"a": 0, "b": 14, "w": 0.37248484488474365}, {"a": 0, "b": 15, "w": 0.42473598063997486}, {"a": 0, "b": 16, "w": 0.48910259414021084}, {"a": 0, "b": 17, "w": 0.5236428878650673}, {"a": 0, "b": 18, "w": 0.4048513475374391}, {"a": 0, "b": 19, "w": 0.1824039653059385}, {"a": 0, "b": 20, "w": 4.01455535481432e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.229,hiY=0.262;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
