<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">The Dirty of Loudness [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>

const D=[{"x": 1.0, "y": -0.193, "c": "種", "n": "The Dirty of Loudness [H]  n=3064 cos1.00 難-0.19", "s": 0.821, "f": 0}, {"x": 0.984, "y": -0.056, "c": "近傍", "n": "ギョギョっと人魚♨爆婚ブライダル [A]  n=3165 cos0.98 難-0.06", "s": 0.848, "f": 0}, {"x": 0.982, "y": -0.066, "c": "近傍", "n": "B4U [A]  n=3226 cos0.98 難-0.07", "s": 0.864, "f": 0}, {"x": 0.989, "y": 0.324, "c": "近傍", "n": "The Dirty of Loudness [A]  n=3536 cos0.99 難0.32", "s": 0.947, "f": 0}, {"x": 0.983, "y": 0.277, "c": "近傍", "n": "ZEИITH [A]  n=2010 cos0.98 難0.28", "s": 0.538, "f": 0}, {"x": 0.984, "y": 0.363, "c": "近傍", "n": "neogenesis [L]  n=1514 cos0.98 難0.36", "s": 0.406, "f": 0}, {"x": 0.973, "y": -0.069, "c": "近傍", "n": "Amor De Verao [A]  n=3614 cos0.97 難-0.07", "s": 0.968, "f": 0}, {"x": 0.972, "y": 0.009, "c": "近傍", "n": "DENIM [A]  n=2090 cos0.97 難0.01", "s": 0.56, "f": 0}, {"x": 0.981, "y": 0.45, "c": "近傍", "n": "MENTAL MELTDOWN [A]  n=3299 cos0.98 難0.45", "s": 0.884, "f": 0}, {"x": 0.97, "y": -0.179, "c": "近傍", "n": "HAT TRICK [A]  n=3216 cos0.97 難-0.18", "s": 0.862, "f": 0}, {"x": 0.97, "y": -0.166, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.97 難-0.17", "s": 1.0, "f": 0}, {"x": 0.97, "y": -0.025, "c": "近傍", "n": "ANDROMEDA II [A]  n=3026 cos0.97 難-0.02", "s": 0.811, "f": 0}, {"x": 0.97, "y": -0.026, "c": "近傍", "n": "Punch Love 仮面 [A]  n=2991 cos0.97 難-0.03", "s": 0.801, "f": 0}, {"x": 0.97, "y": 0.02, "c": "近傍", "n": "refractive index [A]  n=3629 cos0.97 難0.02", "s": 0.972, "f": 0}, {"x": 0.979, "y": 0.506, "c": "近傍", "n": "Spica [A]  n=3302 cos0.98 難0.51", "s": 0.885, "f": 0}, {"x": 0.973, "y": 0.309, "c": "近傍", "n": "bloomin' feeling [A]  n=3657 cos0.97 難0.31", "s": 0.98, "f": 0}, {"x": 0.969, "y": 0.059, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2689 cos0.97 難0.06", "s": 0.72, "f": 0}, {"x": 0.967, "y": -0.332, "c": "近傍", "n": "サヨナラ・ヘヴン-Celtic Chip Dance Mix- [A]  n=1221 cos0.97 難-0.33", "s": 0.327, "f": 0}, {"x": 0.978, "y": 0.505, "c": "近傍", "n": "switch [A]  n=3109 cos0.98 難0.51", "s": 0.833, "f": 0}, {"x": 0.971, "y": 0.298, "c": "近傍", "n": "INVISIBLE STRIX [A]  n=3041 cos0.97 難0.30", "s": 0.815, "f": 0}, {"x": 0.967, "y": -0.506, "c": "近傍", "n": "カゴノトリ～弐式～ [H]  n=2359 cos0.97 難-0.51", "s": 0.632, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47813795442649976}, {"a": 0, "b": 2, "w": 0.40094778405739606}, {"a": 0, "b": 3, "w": 0.458166380679612}, {"a": 0, "b": 4, "w": 0.21185602413412086}, {"a": 0, "b": 5, "w": 0.39708967589632316}, {"a": 0, "b": 6, "w": 0.23399374947529927}, {"a": 0, "b": 7, "w": 0.24181120898653807}, {"a": 0, "b": 8, "w": 0.2746862536584709}, {"a": 0, "b": 9, "w": 0.21891005986413437}, {"a": 0, "b": 10, "w": 0.15498982410868467}, {"a": 0, "b": 11, "w": 0.13828240328442176}, {"a": 0, "b": 12, "w": 0.24622512402175345}, {"a": 0, "b": 13, "w": 0.24703032738515573}, {"a": 0, "b": 14, "w": 0.37631726344738714}, {"a": 0, "b": 15, "w": 0.31440434856541455}, {"a": 0, "b": 16, "w": 0.16897825332437277}, {"a": 0, "b": 17, "w": 0.2020896923345512}, {"a": 0, "b": 18, "w": 0.35318052979130465}, {"a": 0, "b": 19, "w": 0.2968532721884347}, {"a": 0, "b": 20, "w": 2.2707169478053402e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.964,hiX=1.003,loY=-0.587,hiY=0.587;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
