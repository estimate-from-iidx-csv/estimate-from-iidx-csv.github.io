<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Chain of pain [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.032, "c": "種", "n": "Chain of pain [A]  n=2993 cos1.00 難-0.03", "s": 0.8, "f": 0}, {"x": 0.997, "y": 0.063, "c": "近傍", "n": "NΦ CRIME [L]  n=1725 cos1.00 難0.06", "s": 0.461, "f": 0}, {"x": 0.996, "y": -0.006, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos1.00 難-0.01", "s": 0.739, "f": 0}, {"x": 0.996, "y": -0.065, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos1.00 難-0.06", "s": 0.257, "f": 0}, {"x": 0.996, "y": -0.123, "c": "近傍", "n": "planarian [A]  n=2948 cos1.00 難-0.12", "s": 0.788, "f": 0}, {"x": 0.996, "y": 0.057, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos1.00 難0.06", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos1.00 難-0.11", "s": 0.831, "f": 0}, {"x": 0.996, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos1.00 難0.11", "s": 0.947, "f": 0}, {"x": 0.995, "y": -0.032, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos0.99 難-0.03", "s": 0.866, "f": 0}, {"x": 0.998, "y": -0.215, "c": "近傍", "n": "中華急行 [A]  n=3540 cos1.00 難-0.22", "s": 0.947, "f": 0}, {"x": 0.994, "y": -0.055, "c": "近傍", "n": "Hat Surprise [A]  n=2365 cos0.99 難-0.05", "s": 0.632, "f": 0}, {"x": 0.995, "y": -0.158, "c": "近傍", "n": "CUE CUE RESCUE [A]  n=2427 cos1.00 難-0.16", "s": 0.649, "f": 0}, {"x": 0.995, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos1.00 難0.12", "s": 0.693, "f": 0}, {"x": 0.994, "y": -0.111, "c": "近傍", "n": "La dolce primavera [A]  n=2616 cos0.99 難-0.11", "s": 0.699, "f": 0}, {"x": 0.995, "y": 0.112, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos0.99 難0.11", "s": 0.932, "f": 0}, {"x": 0.993, "y": -0.032, "c": "近傍", "n": "PopなEDEN [A]  n=1556 cos0.99 難-0.03", "s": 0.416, "f": 0}, {"x": 0.993, "y": -0.007, "c": "近傍", "n": "sync [A]  n=3166 cos0.99 難-0.01", "s": 0.847, "f": 0}, {"x": 0.994, "y": -0.167, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos0.99 難-0.17", "s": 0.197, "f": 0}, {"x": 0.996, "y": 0.174, "c": "近傍", "n": "end of world [A]  n=3010 cos1.00 難0.17", "s": 0.805, "f": 0}, {"x": 0.995, "y": -0.182, "c": "近傍", "n": "消極的セツナイズム [A]  n=1234 cos0.99 難-0.18", "s": 0.33, "f": 0}, {"x": 0.994, "y": 0.119, "c": "近傍", "n": "Harmony and Lovely [A]  n=3541 cos0.99 難0.12", "s": 0.947, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3495275591541307}, {"a": 0, "b": 2, "w": 0.3670901168148073}, {"a": 0, "b": 3, "w": 0.27747657258894065}, {"a": 0, "b": 4, "w": 0.3870901228965441}, {"a": 0, "b": 5, "w": 0.3584669223166165}, {"a": 0, "b": 6, "w": 0.35187995054418675}, {"a": 0, "b": 7, "w": 0.4328964736455685}, {"a": 0, "b": 8, "w": 0.24445748573087456}, {"a": 0, "b": 9, "w": 0.3723229528297015}, {"a": 0, "b": 10, "w": 6.141942510140552e-11}, {"a": 0, "b": 11, "w": 0.13806542266074173}, {"a": 0, "b": 12, "w": 0.3589307371487688}, {"a": 0, "b": 13, "w": 0.28048362716942865}, {"a": 0, "b": 14, "w": 0.11282953652736938}, {"a": 0, "b": 15, "w": 0.2488486666977976}, {"a": 0, "b": 16, "w": 0.24321948482699818}, {"a": 0, "b": 17, "w": 0.17166628823928298}, {"a": 0, "b": 18, "w": 0.4242324905882334}, {"a": 0, "b": 19, "w": 0.28025309545879973}, {"a": 0, "b": 20, "w": 0.2184319143239064}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.246,hiY=0.205;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
