<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">紅牡丹 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.706, "c": "種", "n": "紅牡丹 [H]  n=2666 cos1.00 難-0.71", "s": 0.888, "f": 0}, {"x": 0.997, "y": -0.648, "c": "近傍", "n": "Light and Cyber… [H]  n=2224 cos1.00 難-0.65", "s": 0.741, "f": 0}, {"x": 0.996, "y": -0.723, "c": "近傍", "n": "MEGAERA [H]  n=1642 cos1.00 難-0.72", "s": 0.547, "f": 0}, {"x": 0.996, "y": -0.659, "c": "近傍", "n": "ALL MY TURN -このターンに、オレの全てを賭ける- [H]  n=2167 cos1.00 難-0.66", "s": 0.722, "f": 0}, {"x": 0.993, "y": -0.681, "c": "近傍", "n": "Gravigazer [H]  n=2396 cos0.99 難-0.68", "s": 0.798, "f": 0}, {"x": 0.993, "y": -0.679, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.68", "s": 0.502, "f": 0}, {"x": 0.993, "y": -0.656, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.66", "s": 0.692, "f": 0}, {"x": 0.993, "y": -0.804, "c": "近傍", "n": "NITROUS CANNON [H]  n=2161 cos0.99 難-0.80", "s": 0.72, "f": 0}, {"x": 0.992, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.99 難-0.73", "s": 0.674, "f": 0}, {"x": 0.992, "y": -0.717, "c": "近傍", "n": "∀ [H]  n=2296 cos0.99 難-0.72", "s": 0.765, "f": 0}, {"x": 0.991, "y": -0.723, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos0.99 難-0.72", "s": 0.564, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "Sphere [H]  n=1980 cos0.99 難-0.81", "s": 0.66, "f": 0}, {"x": 0.991, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos0.99 難-0.74", "s": 0.646, "f": 0}, {"x": 0.991, "y": -0.683, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.68", "s": 0.852, "f": 0}, {"x": 0.992, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.734, "f": 0}, {"x": 0.991, "y": -0.639, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.64", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.717, "c": "近傍", "n": "Painful Fate [H]  n=1816 cos0.99 難-0.72", "s": 0.605, "f": 0}, {"x": 0.993, "y": -0.842, "c": "近傍", "n": "HYENA [H]  n=2379 cos0.99 難-0.84", "s": 0.792, "f": 0}, {"x": 0.99, "y": -0.647, "c": "近傍", "n": "Broken Sword [H]  n=2592 cos0.99 難-0.65", "s": 0.863, "f": 0}, {"x": 0.992, "y": -0.584, "c": "近傍", "n": "NEMESIS [H]  n=1853 cos0.99 難-0.58", "s": 0.617, "f": 0}, {"x": 0.99, "y": -0.699, "c": "近傍", "n": "405nm (Ryu☆mix) [H]  n=2975 cos0.99 難-0.70", "s": 0.991, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49764947561751915}, {"a": 0, "b": 2, "w": 0.21564763012240895}, {"a": 0, "b": 3, "w": 0.48329193244796964}, {"a": 0, "b": 4, "w": 0.3115221801173238}, {"a": 0, "b": 5, "w": 0.11039673860912447}, {"a": 0, "b": 6, "w": 0.17341959235024185}, {"a": 0, "b": 7, "w": 0.34921248521956816}, {"a": 0, "b": 8, "w": 0.1348369275315079}, {"a": 0, "b": 9, "w": 0.2589341635822455}, {"a": 0, "b": 10, "w": 0.23716961403907766}, {"a": 0, "b": 11, "w": 0.31160283719123283}, {"a": 0, "b": 12, "w": 0.23931112028737267}, {"a": 0, "b": 13, "w": 0.17126975490683694}, {"a": 0, "b": 14, "w": 0.2499345936523154}, {"a": 0, "b": 15, "w": 0.19511897063792705}, {"a": 0, "b": 16, "w": 5.535849556537187e-11}, {"a": 0, "b": 17, "w": 0.302373591852233}, {"a": 0, "b": 18, "w": 0.2037758998358652}, {"a": 0, "b": 19, "w": 0.17083639777615}, {"a": 0, "b": 20, "w": 0.13420428055533073}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.863,hiY=-0.563;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
