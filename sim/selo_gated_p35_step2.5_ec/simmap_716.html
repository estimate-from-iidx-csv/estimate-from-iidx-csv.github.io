<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">鬼天 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.265, "c": "種", "n": "鬼天 [H]  n=1574 cos1.00 難-1.26", "s": 0.68, "f": 0}, {"x": 0.985, "y": -1.251, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.99 難-1.25", "s": 0.68, "f": 0}, {"x": 0.987, "y": -1.178, "c": "近傍", "n": "九尾狐夜行 [H]  n=1567 cos0.99 難-1.18", "s": 0.677, "f": 0}, {"x": 0.986, "y": -1.186, "c": "近傍", "n": "パ→ピ→プ→Yeah! [H]  n=2314 cos0.99 難-1.19", "s": 1.0, "f": 0}, {"x": 0.986, "y": -1.337, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.34", "s": 0.802, "f": 0}, {"x": 0.983, "y": -1.301, "c": "近傍", "n": "RAIN [H]  n=1518 cos0.98 難-1.30", "s": 0.656, "f": 0}, {"x": 0.986, "y": -1.381, "c": "近傍", "n": "Discloze [H]  n=1378 cos0.99 難-1.38", "s": 0.596, "f": 0}, {"x": 0.982, "y": -1.244, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos0.98 難-1.24", "s": 0.711, "f": 0}, {"x": 0.989, "y": -1.428, "c": "近傍", "n": "天邪鬼 [H]  n=1289 cos0.99 難-1.43", "s": 0.557, "f": 0}, {"x": 0.986, "y": -1.123, "c": "近傍", "n": "Ghost Pulse [H]  n=824 cos0.99 難-1.12", "s": 0.356, "f": 0}, {"x": 0.994, "y": -1.464, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.99 難-1.46", "s": 0.451, "f": 0}, {"x": 0.981, "y": -1.226, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.98 難-1.23", "s": 0.708, "f": 0}, {"x": 0.981, "y": -1.267, "c": "近傍", "n": "Sirius [H]  n=512 cos0.98 難-1.27", "s": 0.221, "f": 0}, {"x": 0.983, "y": -1.368, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.98 難-1.37", "s": 0.644, "f": 0}, {"x": 0.988, "y": -1.089, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.99 難-1.09", "s": 0.584, "f": 0}, {"x": 0.983, "y": -1.119, "c": "近傍", "n": "Slipstream [H]  n=1475 cos0.98 難-1.12", "s": 0.637, "f": 0}, {"x": 0.982, "y": -1.129, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1717 cos0.98 難-1.13", "s": 0.742, "f": 0}, {"x": 0.978, "y": -1.324, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.98 難-1.32", "s": 0.438, "f": 0}, {"x": 0.978, "y": -1.287, "c": "近傍", "n": "Meissa [H]  n=923 cos0.98 難-1.29", "s": 0.399, "f": 0}, {"x": 0.978, "y": -1.239, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos0.98 難-1.24", "s": 0.623, "f": 0}, {"x": 0.982, "y": -1.11, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.98 難-1.11", "s": 0.677, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 4.0230596631829485e-11}, {"a": 0, "b": 2, "w": 0.23991403490352292}, {"a": 0, "b": 3, "w": 0.25274394070745465}, {"a": 0, "b": 4, "w": 0.1882612326241695}, {"a": 0, "b": 5, "w": 0.17418656607610017}, {"a": 0, "b": 6, "w": 0.14691188455809712}, {"a": 0, "b": 7, "w": 0.02226774126915032}, {"a": 0, "b": 8, "w": 0.17610736268914662}, {"a": 0, "b": 9, "w": 0.30721049938164124}, {"a": 0, "b": 10, "w": 0.5207497667903576}, {"a": 0, "b": 11, "w": 0.15961438367565595}, {"a": 0, "b": 12, "w": 0.1493092885225994}, {"a": 0, "b": 13, "w": 0.16554586002817007}, {"a": 0, "b": 14, "w": 0.28734114268848265}, {"a": 0, "b": 15, "w": 0.22760590561063365}, {"a": 0, "b": 16, "w": 0.1985477883205362}, {"a": 0, "b": 17, "w": 0.11425021964760473}, {"a": 0, "b": 18, "w": 0.09367027217729174}, {"a": 0, "b": 19, "w": 0.019050212632025665}, {"a": 0, "b": 20, "w": 0.2097750793777634}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.494,hiY=-1.058;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
