<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Night sky [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.18, "c": "種", "n": "Night sky [A]  n=3488 cos1.00 難0.18", "s": 0.944, "f": 0}, {"x": 0.995, "y": 0.107, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos0.99 難0.11", "s": 0.949, "f": 0}, {"x": 0.995, "y": 0.302, "c": "近傍", "n": "Angelic Jelly [A]  n=3400 cos1.00 難0.30", "s": 0.92, "f": 0}, {"x": 0.994, "y": 0.19, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos0.99 難0.19", "s": 0.932, "f": 0}, {"x": 0.993, "y": 0.182, "c": "近傍", "n": "Squeeze [A]  n=3316 cos0.99 難0.18", "s": 0.898, "f": 0}, {"x": 0.993, "y": 0.161, "c": "近傍", "n": "Aurora [A]  n=3652 cos0.99 難0.16", "s": 0.989, "f": 0}, {"x": 0.993, "y": 0.093, "c": "近傍", "n": "Amethyst [A]  n=1480 cos0.99 難0.09", "s": 0.401, "f": 0}, {"x": 0.993, "y": 0.219, "c": "近傍", "n": "INHERITANCE [A]  n=1654 cos0.99 難0.22", "s": 0.448, "f": 0}, {"x": 0.993, "y": 0.257, "c": "近傍", "n": "ZED [A]  n=3488 cos0.99 難0.26", "s": 0.944, "f": 0}, {"x": 0.993, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos0.99 難0.12", "s": 0.702, "f": 0}, {"x": 0.992, "y": 0.213, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.21", "s": 0.901, "f": 0}, {"x": 0.992, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos0.99 難0.20", "s": 0.935, "f": 0}, {"x": 0.992, "y": 0.195, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos0.99 難0.19", "s": 0.761, "f": 0}, {"x": 0.993, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.32", "s": 0.885, "f": 0}, {"x": 0.992, "y": 0.132, "c": "近傍", "n": "Ruler or Loser [A]  n=2210 cos0.99 難0.13", "s": 0.598, "f": 0}, {"x": 0.992, "y": 0.163, "c": "近傍", "n": "Lost Souls [A]  n=2609 cos0.99 難0.16", "s": 0.706, "f": 0}, {"x": 0.992, "y": 0.111, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [H]  n=3694 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.069, "c": "近傍", "n": "Praludium [A]  n=2983 cos0.99 難0.07", "s": 0.808, "f": 0}, {"x": 0.992, "y": 0.121, "c": "近傍", "n": "SPEED ROCKER [A]  n=2665 cos0.99 難0.12", "s": 0.721, "f": 0}, {"x": 0.992, "y": 0.173, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2221 cos0.99 難0.17", "s": 0.601, "f": 0}, {"x": 0.992, "y": 0.138, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.14", "s": 0.611, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.17387763129756162}, {"a": 0, "b": 2, "w": 0.6134627126214469}, {"a": 0, "b": 3, "w": 0.40938954672890715}, {"a": 0, "b": 4, "w": 0.44152969190808533}, {"a": 0, "b": 5, "w": 0.3867372063845417}, {"a": 0, "b": 6, "w": 0.2249713900485094}, {"a": 0, "b": 7, "w": 0.46194685059816487}, {"a": 0, "b": 8, "w": 0.36759597414624756}, {"a": 0, "b": 9, "w": 0.025507194253512333}, {"a": 0, "b": 10, "w": 0.11306842128587102}, {"a": 0, "b": 11, "w": 0.4461632079723096}, {"a": 0, "b": 12, "w": 0.3265331821265942}, {"a": 0, "b": 13, "w": 0.0030481049642815394}, {"a": 0, "b": 14, "w": 0.29182061676755366}, {"a": 0, "b": 15, "w": 0.2856601275893411}, {"a": 0, "b": 16, "w": 0.44842706391017517}, {"a": 0, "b": 17, "w": 2.7597146790014904e-11}, {"a": 0, "b": 18, "w": 0.05826753312295485}, {"a": 0, "b": 19, "w": 0.2920941155969422}, {"a": 0, "b": 20, "w": 0.08589105203443348}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.049,hiY=0.344;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
