<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE DAY OF JUBILATIONS [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.644, "c": "種", "n": "THE DAY OF JUBILATIONS [H]  n=2130 cos1.00 難-0.64", "s": 0.805, "f": 0}, {"x": 0.995, "y": -0.632, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.63", "s": 0.923, "f": 0}, {"x": 0.994, "y": -0.715, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos0.99 難-0.71", "s": 0.692, "f": 0}, {"x": 0.994, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.832, "f": 0}, {"x": 0.992, "y": -0.719, "c": "近傍", "n": "ANCHOR [H]  n=2040 cos0.99 難-0.72", "s": 0.771, "f": 0}, {"x": 0.993, "y": -0.795, "c": "近傍", "n": "PUNISHER [H]  n=2323 cos0.99 難-0.79", "s": 0.878, "f": 0}, {"x": 0.991, "y": -0.666, "c": "近傍", "n": "LAB [H]  n=1742 cos0.99 難-0.67", "s": 0.658, "f": 0}, {"x": 0.991, "y": -0.699, "c": "近傍", "n": "Secrets [H]  n=1777 cos0.99 難-0.70", "s": 0.671, "f": 0}, {"x": 0.99, "y": -0.683, "c": "近傍", "n": "GENE [H]  n=2179 cos0.99 難-0.68", "s": 0.823, "f": 0}, {"x": 0.992, "y": -0.809, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=610 cos0.99 難-0.81", "s": 0.23, "f": 0}, {"x": 0.997, "y": -0.368, "c": "近傍", "n": "もんめためたもん [A]  n=1109 cos1.00 難-0.37", "s": 0.419, "f": 0}, {"x": 0.992, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-0.84", "s": 0.203, "f": 0}, {"x": 0.99, "y": -0.751, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [H]  n=2428 cos0.99 難-0.75", "s": 0.917, "f": 0}, {"x": 0.991, "y": -0.808, "c": "近傍", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [H]  n=2005 cos0.99 難-0.81", "s": 0.757, "f": 0}, {"x": 0.99, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.81", "s": 0.292, "f": 0}, {"x": 0.992, "y": -0.407, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos0.99 難-0.41", "s": 0.961, "f": 0}, {"x": 0.989, "y": -0.569, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.57", "s": 0.981, "f": 0}, {"x": 0.988, "y": -0.605, "c": "近傍", "n": "Xlo [H]  n=2314 cos0.99 難-0.60", "s": 0.874, "f": 0}, {"x": 0.991, "y": -0.878, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.99 難-0.88", "s": 0.839, "f": 0}, {"x": 0.99, "y": -0.843, "c": "近傍", "n": "Catch Our Fire! [H]  n=1841 cos0.99 難-0.84", "s": 0.696, "f": 0}, {"x": 0.99, "y": -0.437, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.44", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.428344460597893}, {"a": 0, "b": 2, "w": 0.348006910563879}, {"a": 0, "b": 3, "w": 0.39942236784605534}, {"a": 0, "b": 4, "w": 0.3213077256976491}, {"a": 0, "b": 5, "w": 0.35217584718855877}, {"a": 0, "b": 6, "w": 0.17735348465171952}, {"a": 0, "b": 7, "w": 0.3017584303205657}, {"a": 0, "b": 8, "w": 0.23918339173493008}, {"a": 0, "b": 9, "w": 0.3065941552760606}, {"a": 0, "b": 10, "w": 0.461561466410522}, {"a": 0, "b": 11, "w": 0.34798574543601657}, {"a": 0, "b": 12, "w": 0.050733292564291044}, {"a": 0, "b": 13, "w": 0.13368970259604007}, {"a": 0, "b": 14, "w": 0.29672671839502573}, {"a": 0, "b": 15, "w": 0.2715448501390165}, {"a": 0, "b": 16, "w": 0.11183250929165811}, {"a": 0, "b": 17, "w": 0.20471708503579678}, {"a": 0, "b": 18, "w": 0.18584364725909863}, {"a": 0, "b": 19, "w": 0.27767012859618134}, {"a": 0, "b": 20, "w": 4.60144145009167e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.919,hiY=-0.327;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
