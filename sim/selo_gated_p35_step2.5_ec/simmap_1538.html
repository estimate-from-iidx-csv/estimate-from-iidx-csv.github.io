<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">The Rebellion of Sequencer [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.563, "c": "種", "n": "The Rebellion of Sequencer [H]  n=1934 cos1.00 難-0.56", "s": 0.6, "f": 0}, {"x": 0.999, "y": -0.338, "c": "近傍", "n": "Howling [A]  n=2823 cos1.00 難-0.34", "s": 0.875, "f": 0}, {"x": 0.994, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.68", "s": 0.438, "f": 0}, {"x": 0.993, "y": -0.57, "c": "近傍", "n": "KILL EACH OTHER [H]  n=2022 cos0.99 難-0.57", "s": 0.627, "f": 0}, {"x": 0.993, "y": -0.583, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.99 難-0.58", "s": 0.741, "f": 0}, {"x": 0.993, "y": -0.59, "c": "近傍", "n": "DIAVOLO [H]  n=3226 cos0.99 難-0.59", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.344, "c": "近傍", "n": "Last Dance [H]  n=2703 cos1.00 難-0.34", "s": 0.838, "f": 0}, {"x": 0.992, "y": -0.689, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2334 cos0.99 難-0.69", "s": 0.723, "f": 0}, {"x": 0.994, "y": -0.336, "c": "近傍", "n": "まほろば [A]  n=2892 cos0.99 難-0.34", "s": 0.896, "f": 0}, {"x": 0.994, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.665, "f": 0}, {"x": 0.991, "y": -0.515, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1774 cos0.99 難-0.51", "s": 0.55, "f": 0}, {"x": 0.992, "y": -0.411, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.41", "s": 0.926, "f": 0}, {"x": 0.995, "y": -0.827, "c": "近傍", "n": "B.O.D.Y. [H]  n=1306 cos1.00 難-0.83", "s": 0.405, "f": 0}, {"x": 0.991, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.99 難-0.57", "s": 0.708, "f": 0}, {"x": 0.992, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.68", "s": 0.976, "f": 0}, {"x": 0.991, "y": -0.634, "c": "近傍", "n": "switch [H]  n=1803 cos0.99 難-0.63", "s": 0.559, "f": 0}, {"x": 0.997, "y": -0.245, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos1.00 難-0.25", "s": 0.77, "f": 0}, {"x": 0.993, "y": -0.317, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1729 cos0.99 難-0.32", "s": 0.536, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=610 cos0.99 難-0.81", "s": 0.189, "f": 0}, {"x": 0.992, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.76", "s": 0.777, "f": 0}, {"x": 0.992, "y": -0.368, "c": "近傍", "n": "もんめためたもん [A]  n=1109 cos0.99 難-0.37", "s": 0.344, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.7188761640056079}, {"a": 0, "b": 2, "w": 0.3126707257314374}, {"a": 0, "b": 3, "w": 0.2537373464633843}, {"a": 0, "b": 4, "w": 0.2701659296413621}, {"a": 0, "b": 5, "w": 0.2705013624708841}, {"a": 0, "b": 6, "w": 0.4027904722931095}, {"a": 0, "b": 7, "w": 0.30526707702576805}, {"a": 0, "b": 8, "w": 0.40111876743250496}, {"a": 0, "b": 9, "w": 0.3741506437372307}, {"a": 0, "b": 10, "w": 0.2627171830446493}, {"a": 0, "b": 11, "w": 0.3002704308356996}, {"a": 0, "b": 12, "w": 0.45362144487074274}, {"a": 0, "b": 13, "w": 0.17436181092623093}, {"a": 0, "b": 14, "w": 0.12720012904429423}, {"a": 0, "b": 15, "w": 0.17014603924882266}, {"a": 0, "b": 16, "w": 0.4981911405860018}, {"a": 0, "b": 17, "w": 0.23926297852728617}, {"a": 0, "b": 18, "w": 5.4335425048179786e-11}, {"a": 0, "b": 19, "w": 0.3012376382613744}, {"a": 0, "b": 20, "w": 0.29057790885759005}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.874,hiY=-0.199;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
