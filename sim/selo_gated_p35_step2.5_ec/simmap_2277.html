<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">チェイスチェイスジョーカーズのうた (オニスタイルリミックス) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.147, "c": "種", "n": "チェイスチェイスジョーカーズのうた (オニスタイルリミックス) [A]  n=1498 cos1.00 難0.15", "s": 0.411, "f": 0}, {"x": 0.997, "y": 0.195, "c": "近傍", "n": "Egret and Willow [A]  n=3210 cos1.00 難0.19", "s": 0.881, "f": 0}, {"x": 0.994, "y": 0.136, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1675 cos0.99 難0.14", "s": 0.46, "f": 0}, {"x": 0.995, "y": 0.068, "c": "近傍", "n": "Volcanic Dragon [A]  n=3184 cos0.99 難0.07", "s": 0.874, "f": 0}, {"x": 0.994, "y": 0.111, "c": "近傍", "n": "罠 [A]  n=2926 cos0.99 難0.11", "s": 0.803, "f": 0}, {"x": 0.996, "y": -0.021, "c": "近傍", "n": "SigSig [A]  n=3612 cos1.00 難-0.02", "s": 0.991, "f": 0}, {"x": 0.993, "y": 0.203, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos0.99 難0.20", "s": 0.806, "f": 0}, {"x": 0.993, "y": 0.244, "c": "近傍", "n": "Wonderland [A]  n=3133 cos0.99 難0.24", "s": 0.86, "f": 0}, {"x": 0.993, "y": 0.023, "c": "近傍", "n": "ミュージック・アワー [A]  n=2508 cos0.99 難0.02", "s": 0.688, "f": 0}, {"x": 0.993, "y": -0.004, "c": "近傍", "n": "rottel-the-Mercury [A]  n=2989 cos0.99 難-0.00", "s": 0.82, "f": 0}, {"x": 0.992, "y": 0.215, "c": "近傍", "n": "ATHER [A]  n=3422 cos0.99 難0.22", "s": 0.939, "f": 0}, {"x": 0.992, "y": 0.264, "c": "近傍", "n": "BroGamer [A]  n=3643 cos0.99 難0.26", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.083, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難0.08", "s": 0.854, "f": 0}, {"x": 0.994, "y": -0.057, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.06", "s": 0.752, "f": 0}, {"x": 0.992, "y": 0.014, "c": "近傍", "n": "Wing of Hearts [A]  n=3094 cos0.99 難0.01", "s": 0.849, "f": 0}, {"x": 0.992, "y": 0.28, "c": "近傍", "n": "Xyndrome [A]  n=2511 cos0.99 難0.28", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.015, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.02", "s": 0.779, "f": 0}, {"x": 0.992, "y": 0.32, "c": "近傍", "n": "THE DETONATOR [A]  n=3237 cos0.99 難0.32", "s": 0.889, "f": 0}, {"x": 0.991, "y": 0.083, "c": "近傍", "n": "Victory Of Ravers [A]  n=2472 cos0.99 難0.08", "s": 0.679, "f": 0}, {"x": 0.991, "y": 0.215, "c": "近傍", "n": "Valgus [A]  n=3344 cos0.99 難0.22", "s": 0.918, "f": 0}, {"x": 0.992, "y": -0.06, "c": "近傍", "n": "Ascalon [A]  n=3050 cos0.99 難-0.06", "s": 0.837, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4844000134030504}, {"a": 0, "b": 2, "w": 0.4179778180900585}, {"a": 0, "b": 3, "w": 0.44802486843786793}, {"a": 0, "b": 4, "w": 0.31189654859350946}, {"a": 0, "b": 5, "w": 0.2915021684797736}, {"a": 0, "b": 6, "w": 0.2505214924939453}, {"a": 0, "b": 7, "w": 0.29733784663047813}, {"a": 0, "b": 8, "w": 0.2943706332670929}, {"a": 0, "b": 9, "w": 0.14910476001743245}, {"a": 0, "b": 10, "w": 0.3124681882145861}, {"a": 0, "b": 11, "w": 0.05805552579283457}, {"a": 0, "b": 12, "w": 0.0035458000623791452}, {"a": 0, "b": 13, "w": 0.13141563662779587}, {"a": 0, "b": 14, "w": 0.3118158875582051}, {"a": 0, "b": 15, "w": 4.599265412963405e-11}, {"a": 0, "b": 16, "w": 0.14216488877817812}, {"a": 0, "b": 17, "w": 0.25607107534314777}, {"a": 0, "b": 18, "w": 0.2474006599887525}, {"a": 0, "b": 19, "w": 0.25471972967791867}, {"a": 0, "b": 20, "w": 0.03408452076125468}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.090,hiY=0.350;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
