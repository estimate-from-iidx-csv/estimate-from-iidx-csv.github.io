<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">栄冠のカンパネラ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.808, "c": "種", "n": "栄冠のカンパネラ [H]  n=1245 cos1.00 難-0.81", "s": 0.387, "f": 0}, {"x": 0.989, "y": -0.822, "c": "近傍", "n": "EROICA [H]  n=2238 cos0.99 難-0.82", "s": 0.695, "f": 0}, {"x": 0.992, "y": -1.056, "c": "近傍", "n": "烽火連天の刃 [H]  n=1241 cos0.99 難-1.06", "s": 0.385, "f": 0}, {"x": 0.982, "y": -0.806, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2823 cos0.98 難-0.81", "s": 0.876, "f": 0}, {"x": 0.994, "y": -0.408, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3069 cos0.99 難-0.41", "s": 0.953, "f": 0}, {"x": 0.977, "y": -1.073, "c": "近傍", "n": "Megalara Garuda [H]  n=1487 cos0.98 難-1.07", "s": 0.462, "f": 0}, {"x": 0.973, "y": -0.843, "c": "近傍", "n": "Binary Black Hole [H]  n=1335 cos0.97 難-0.84", "s": 0.414, "f": 0}, {"x": 0.972, "y": -0.798, "c": "近傍", "n": "Unbelief [H]  n=1475 cos0.97 難-0.80", "s": 0.458, "f": 0}, {"x": 0.973, "y": -0.714, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.97 難-0.71", "s": 0.943, "f": 0}, {"x": 0.971, "y": -0.791, "c": "近傍", "n": "HEISEI [H]  n=2018 cos0.97 難-0.79", "s": 0.627, "f": 0}, {"x": 0.979, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.98 難-0.41", "s": 0.968, "f": 0}, {"x": 0.97, "y": -0.811, "c": "近傍", "n": "Lightspeed [H]  n=632 cos0.97 難-0.81", "s": 0.196, "f": 0}, {"x": 0.969, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.97 難-0.72", "s": 1.0, "f": 0}, {"x": 0.968, "y": -0.809, "c": "近傍", "n": "Scharfrichter [H]  n=2653 cos0.97 難-0.81", "s": 0.824, "f": 0}, {"x": 0.974, "y": -0.438, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2752 cos0.97 難-0.44", "s": 0.854, "f": 0}, {"x": 0.977, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.98 難-0.37", "s": 0.292, "f": 0}, {"x": 0.983, "y": -0.248, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2165 cos0.98 難-0.25", "s": 0.672, "f": 0}, {"x": 0.97, "y": -0.473, "c": "近傍", "n": "TOGAKUSHI [H]  n=2630 cos0.97 難-0.47", "s": 0.817, "f": 0}, {"x": 0.973, "y": -0.37, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [H]  n=3067 cos0.97 難-0.37", "s": 0.952, "f": 0}, {"x": 0.974, "y": -1.267, "c": "近傍", "n": "NZM [H]  n=1596 cos0.97 難-1.27", "s": 0.495, "f": 0}, {"x": 0.975, "y": -1.287, "c": "近傍", "n": "Summerlights(IIDX Edition) [H]  n=1470 cos0.98 難-1.29", "s": 0.456, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5565346397567836}, {"a": 0, "b": 2, "w": 0.6215289934252533}, {"a": 0, "b": 3, "w": 0.3109692371291962}, {"a": 0, "b": 4, "w": 0.6723472245993003}, {"a": 0, "b": 5, "w": 0.2372737985761113}, {"a": 0, "b": 6, "w": 0.2722681382175952}, {"a": 0, "b": 7, "w": 0.3048832936141518}, {"a": 0, "b": 8, "w": 0.0768221343134241}, {"a": 0, "b": 9, "w": 0.18535387905111045}, {"a": 0, "b": 10, "w": 0.27231155465850054}, {"a": 0, "b": 11, "w": 0.2763673239853328}, {"a": 0, "b": 12, "w": 0.012491137054110757}, {"a": 0, "b": 13, "w": 2.5973223571895687e-11}, {"a": 0, "b": 14, "w": 0.14605903307806178}, {"a": 0, "b": 15, "w": 0.2102363523160936}, {"a": 0, "b": 16, "w": 0.45154418049451117}, {"a": 0, "b": 17, "w": 0.2824795954136545}, {"a": 0, "b": 18, "w": 0.3238928051884321}, {"a": 0, "b": 19, "w": 0.15750429409157063}, {"a": 0, "b": 20, "w": 0.16213170446744762}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.966,hiX=1.003,loY=-1.371,hiY=-0.165;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
