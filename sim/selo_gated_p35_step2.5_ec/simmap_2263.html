<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.101, "c": "種", "n": "ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A]  n=3488 cos1.00 難0.10", "s": 0.963, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3252 cos0.99 難0.27", "s": 0.898, "f": 0}, {"x": 0.993, "y": 0.203, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos0.99 難0.20", "s": 0.811, "f": 0}, {"x": 0.991, "y": 0.111, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [A]  n=3193 cos0.99 難0.11", "s": 0.882, "f": 0}, {"x": 0.992, "y": -0.015, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.02", "s": 0.783, "f": 0}, {"x": 0.991, "y": 0.104, "c": "近傍", "n": "NANAIRO [A]  n=3065 cos0.99 難0.10", "s": 0.846, "f": 0}, {"x": 0.991, "y": 0.204, "c": "近傍", "n": "Engraved Mark [A]  n=3414 cos0.99 難0.20", "s": 0.943, "f": 0}, {"x": 0.994, "y": -0.183, "c": "近傍", "n": "朱と碧のランページ [A]  n=1033 cos0.99 難-0.18", "s": 0.285, "f": 0}, {"x": 0.99, "y": 0.004, "c": "近傍", "n": "Τeλοs [A]  n=606 cos0.99 難0.00", "s": 0.167, "f": 0}, {"x": 0.989, "y": 0.215, "c": "近傍", "n": "ATHER [A]  n=3422 cos0.99 難0.22", "s": 0.945, "f": 0}, {"x": 0.99, "y": -0.06, "c": "近傍", "n": "Ascalon [A]  n=3050 cos0.99 難-0.06", "s": 0.842, "f": 0}, {"x": 0.989, "y": 0.083, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難0.08", "s": 0.859, "f": 0}, {"x": 0.988, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難0.03", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.101, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos0.99 難0.10", "s": 0.263, "f": 0}, {"x": 0.989, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.04", "s": 0.769, "f": 0}, {"x": 0.988, "y": 0.132, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1935 cos0.99 難0.13", "s": 0.534, "f": 0}, {"x": 0.99, "y": -0.101, "c": "近傍", "n": "AO-∞ [A]  n=2934 cos0.99 難-0.10", "s": 0.81, "f": 0}, {"x": 0.989, "y": -0.021, "c": "近傍", "n": "SigSig [A]  n=3612 cos0.99 難-0.02", "s": 0.998, "f": 0}, {"x": 0.989, "y": -0.097, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.10", "s": 0.823, "f": 0}, {"x": 0.988, "y": 0.15, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos0.99 難0.15", "s": 0.96, "f": 0}, {"x": 0.989, "y": 0.301, "c": "近傍", "n": "Cleopatrysm [A]  n=3255 cos0.99 難0.30", "s": 0.899, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3856645972688618}, {"a": 0, "b": 2, "w": 0.34233267638915077}, {"a": 0, "b": 3, "w": 0.14623992962003496}, {"a": 0, "b": 4, "w": 0.25961380093282627}, {"a": 0, "b": 5, "w": 0.20020669375900924}, {"a": 0, "b": 6, "w": 0.2586628130849644}, {"a": 0, "b": 7, "w": 0.2976133903995446}, {"a": 0, "b": 8, "w": 0.1993237570026084}, {"a": 0, "b": 9, "w": 0.11914183916015542}, {"a": 0, "b": 10, "w": 0.12983942884903532}, {"a": 0, "b": 11, "w": 0.08960076953551499}, {"a": 0, "b": 12, "w": 0.0242424865843055}, {"a": 0, "b": 13, "w": 0.15161985535580969}, {"a": 0, "b": 14, "w": 0.05805928333556598}, {"a": 0, "b": 15, "w": 0.10388902285430279}, {"a": 0, "b": 16, "w": 0.1976837270858971}, {"a": 0, "b": 17, "w": 0.16150046171298915}, {"a": 0, "b": 18, "w": 0.1202659206501624}, {"a": 0, "b": 19, "w": 5.005684755587936e-11}, {"a": 0, "b": 20, "w": 0.1721115542691226}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.222,hiY=0.340;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
