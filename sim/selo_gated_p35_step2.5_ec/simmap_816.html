<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

 <div id="legend"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.299, "c": "種", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos1.00 難-0.30", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.315, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos1.00 難-0.31", "s": 0.742, "f": 0}, {"x": 0.998, "y": -0.244, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos1.00 難-0.24", "s": 0.789, "f": 0}, {"x": 0.997, "y": -0.333, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos1.00 難-0.33", "s": 0.82, "f": 0}, {"x": 0.998, "y": -0.393, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos1.00 難-0.39", "s": 0.729, "f": 0}, {"x": 0.997, "y": -0.355, "c": "近傍", "n": "ZZ [H]  n=3341 cos1.00 難-0.36", "s": 0.952, "f": 0}, {"x": 0.997, "y": -0.245, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos1.00 難-0.25", "s": 0.708, "f": 0}, {"x": 0.996, "y": -0.317, "c": "近傍", "n": "KOTONOHA ft. Kotoha [A]  n=1510 cos1.00 難-0.32", "s": 0.43, "f": 0}, {"x": 0.996, "y": -0.308, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos1.00 難-0.31", "s": 0.657, "f": 0}, {"x": 0.996, "y": -0.248, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos1.00 難-0.25", "s": 0.791, "f": 0}, {"x": 0.996, "y": -0.371, "c": "近傍", "n": "In Heaven [A]  n=2966 cos1.00 難-0.37", "s": 0.845, "f": 0}, {"x": 0.995, "y": -0.31, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos1.00 難-0.31", "s": 0.93, "f": 0}, {"x": 0.996, "y": -0.39, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos1.00 難-0.39", "s": 0.731, "f": 0}, {"x": 0.995, "y": -0.314, "c": "近傍", "n": "double thrash [H]  n=2121 cos1.00 難-0.31", "s": 0.604, "f": 0}, {"x": 0.995, "y": -0.344, "c": "近傍", "n": "Last Dance [H]  n=2703 cos1.00 難-0.34", "s": 0.77, "f": 0}, {"x": 0.995, "y": -0.295, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos1.00 難-0.29", "s": 0.712, "f": 0}, {"x": 0.995, "y": -0.317, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1729 cos1.00 難-0.32", "s": 0.493, "f": 0}, {"x": 0.996, "y": -0.18, "c": "近傍", "n": "EXE [A]  n=3025 cos1.00 難-0.18", "s": 0.862, "f": 0}, {"x": 0.998, "y": -0.144, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=992 cos1.00 難-0.14", "s": 0.283, "f": 0}, {"x": 0.998, "y": -0.144, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos1.00 難-0.14", "s": 0.891, "f": 0}, {"x": 0.996, "y": -0.407, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos1.00 難-0.41", "s": 0.725, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.20785699025784754}, {"a": 0, "b": 2, "w": 0.5708221584556967}, {"a": 0, "b": 3, "w": 0.35238385156415875}, {"a": 0, "b": 4, "w": 0.6189143933308071}, {"a": 0, "b": 5, "w": 0.5195784371355534}, {"a": 0, "b": 6, "w": 0.5026655557099151}, {"a": 0, "b": 7, "w": 0.42281255581218957}, {"a": 0, "b": 8, "w": 0.33495219607540117}, {"a": 0, "b": 9, "w": 0.438971060338436}, {"a": 0, "b": 10, "w": 0.44158253543868997}, {"a": 0, "b": 11, "w": 0.1418012593534127}, {"a": 0, "b": 12, "w": 0.4030368648282675}, {"a": 0, "b": 13, "w": 0.3102457390848964}, {"a": 0, "b": 14, "w": 0.40203526172087223}, {"a": 0, "b": 15, "w": 0.2728881797486704}, {"a": 0, "b": 16, "w": 6.317835143931916e-11}, {"a": 0, "b": 17, "w": 0.419796416333461}, {"a": 0, "b": 18, "w": 0.5134359378966395}, {"a": 0, "b": 19, "w": 0.42593832432966194}, {"a": 0, "b": 20, "w": 0.31109143233989345}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.995,hiX=1.000,loY=-0.428,hiY=-0.123;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
