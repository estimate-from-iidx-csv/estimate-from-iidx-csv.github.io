<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Close the World feat.a☆ru [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.486, "c": "種", "n": "Close the World feat.a☆ru [H]  n=3019 cos1.00 難-0.49", "s": 0.839, "f": 0}, {"x": 0.995, "y": -0.561, "c": "近傍", "n": "smile [H]  n=1932 cos1.00 難-0.56", "s": 0.537, "f": 0}, {"x": 0.996, "y": -0.291, "c": "近傍", "n": "純真可憐デザイア [A]  n=3599 cos1.00 難-0.29", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.555, "c": "近傍", "n": "抱きしめてモナムール [H]  n=2133 cos0.99 難-0.55", "s": 0.593, "f": 0}, {"x": 0.995, "y": -0.312, "c": "近傍", "n": "Time to Air [H]  n=3133 cos1.00 難-0.31", "s": 0.871, "f": 0}, {"x": 0.996, "y": -0.234, "c": "近傍", "n": "STARLIGHT JUNCTION [A]  n=2984 cos1.00 難-0.23", "s": 0.829, "f": 0}, {"x": 0.993, "y": -0.508, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.99 難-0.51", "s": 0.813, "f": 0}, {"x": 0.997, "y": -0.789, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos1.00 難-0.79", "s": 0.463, "f": 0}, {"x": 0.997, "y": -0.184, "c": "近傍", "n": "ヒマワリ [A]  n=3298 cos1.00 難-0.18", "s": 0.916, "f": 0}, {"x": 0.993, "y": -0.295, "c": "近傍", "n": "Tropical April [H]  n=2580 cos0.99 難-0.29", "s": 0.717, "f": 0}, {"x": 0.996, "y": -0.188, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3193 cos1.00 難-0.19", "s": 0.887, "f": 0}, {"x": 0.997, "y": -0.163, "c": "近傍", "n": "DOMINION [H]  n=2932 cos1.00 難-0.16", "s": 0.815, "f": 0}, {"x": 0.996, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos1.00 難-0.81", "s": 0.459, "f": 0}, {"x": 0.993, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.801, "f": 0}, {"x": 0.998, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos1.00 難-0.83", "s": 0.436, "f": 0}, {"x": 0.994, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.488, "f": 0}, {"x": 0.994, "y": -0.201, "c": "近傍", "n": "MARIA (I believe... ) [A]  n=2086 cos0.99 難-0.20", "s": 0.58, "f": 0}, {"x": 0.993, "y": -0.259, "c": "近傍", "n": "MOON [A]  n=3205 cos0.99 難-0.26", "s": 0.891, "f": 0}, {"x": 0.997, "y": -0.125, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2073 cos1.00 難-0.12", "s": 0.576, "f": 0}, {"x": 0.994, "y": -0.192, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.19", "s": 0.818, "f": 0}, {"x": 0.991, "y": -0.607, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2052 cos0.99 難-0.61", "s": 0.57, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3294644879053843}, {"a": 0, "b": 2, "w": 0.4616671059027144}, {"a": 0, "b": 3, "w": 0.30500723904520566}, {"a": 0, "b": 4, "w": 0.37788576368768234}, {"a": 0, "b": 5, "w": 0.41889010793513637}, {"a": 0, "b": 6, "w": 0.11862900543849764}, {"a": 0, "b": 7, "w": 0.5061652672536612}, {"a": 0, "b": 8, "w": 0.41060800105873274}, {"a": 0, "b": 9, "w": 0.18880565715111564}, {"a": 0, "b": 10, "w": 0.3716156969385429}, {"a": 0, "b": 11, "w": 0.27119828711376226}, {"a": 0, "b": 12, "w": 0.44104601266010524}, {"a": 0, "b": 13, "w": 0.21798263200218648}, {"a": 0, "b": 14, "w": 0.4762020808495807}, {"a": 0, "b": 15, "w": 0.1678790362131164}, {"a": 0, "b": 16, "w": 0.27844812810614306}, {"a": 0, "b": 17, "w": 0.15036947330299189}, {"a": 0, "b": 18, "w": 0.45289705127069546}, {"a": 0, "b": 19, "w": 0.27384641995369274}, {"a": 0, "b": 20, "w": 6.410227904041221e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.890,hiY=-0.068;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
