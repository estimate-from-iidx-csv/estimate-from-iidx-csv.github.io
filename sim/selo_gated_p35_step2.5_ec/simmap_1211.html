<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">湘南ロンリーMIDNIGHT RAIN [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.237, "c": "種", "n": "湘南ロンリーMIDNIGHT RAIN [A]  n=1879 cos1.00 難-0.24", "s": 0.508, "f": 0}, {"x": 0.995, "y": -0.195, "c": "近傍", "n": "夏の匂い。キミの残像。 ft. Kanae Asaba [A]  n=3233 cos0.99 難-0.20", "s": 0.874, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "SHION [A]  n=3340 cos0.99 難-0.20", "s": 0.902, "f": 0}, {"x": 0.994, "y": -0.242, "c": "近傍", "n": "翼 [L]  n=2119 cos0.99 難-0.24", "s": 0.573, "f": 0}, {"x": 0.993, "y": -0.147, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos0.99 難-0.15", "s": 0.696, "f": 0}, {"x": 0.994, "y": -0.37, "c": "近傍", "n": "Crank It [A]  n=2607 cos0.99 難-0.37", "s": 0.704, "f": 0}, {"x": 0.993, "y": -0.298, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2122 cos0.99 難-0.30", "s": 0.573, "f": 0}, {"x": 0.992, "y": -0.223, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos0.99 難-0.22", "s": 0.689, "f": 0}, {"x": 0.991, "y": -0.221, "c": "近傍", "n": "EDEN [A]  n=3701 cos0.99 難-0.22", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.154, "c": "近傍", "n": "タンポポ [A]  n=713 cos0.99 難-0.15", "s": 0.193, "f": 0}, {"x": 0.991, "y": -0.27, "c": "近傍", "n": "AGETEKE ONDO [A]  n=1013 cos0.99 難-0.27", "s": 0.274, "f": 0}, {"x": 0.992, "y": -0.363, "c": "近傍", "n": "きゅんです。 [A]  n=2224 cos0.99 難-0.36", "s": 0.601, "f": 0}, {"x": 0.991, "y": -0.318, "c": "近傍", "n": "ゲシュタルト [A]  n=1500 cos0.99 難-0.32", "s": 0.405, "f": 0}, {"x": 0.991, "y": -0.136, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.14", "s": 0.85, "f": 0}, {"x": 0.992, "y": -0.11, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3085 cos0.99 難-0.11", "s": 0.834, "f": 0}, {"x": 0.99, "y": -0.256, "c": "近傍", "n": "ハリツヤランデヴー [A]  n=2421 cos0.99 難-0.26", "s": 0.654, "f": 0}, {"x": 0.99, "y": -0.236, "c": "近傍", "n": "FERMI PARADOX [A]  n=1461 cos0.99 難-0.24", "s": 0.395, "f": 0}, {"x": 0.99, "y": -0.31, "c": "近傍", "n": "アイドル [A]  n=2110 cos0.99 難-0.31", "s": 0.57, "f": 0}, {"x": 0.996, "y": 0.023, "c": "近傍", "n": "グッバイ宣言 [A]  n=2497 cos1.00 難0.02", "s": 0.675, "f": 0}, {"x": 0.991, "y": -0.095, "c": "近傍", "n": "でんぱ どりる わんにゃー☆三 [A]  n=1135 cos0.99 難-0.09", "s": 0.307, "f": 0}, {"x": 0.99, "y": -0.257, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos0.99 難-0.26", "s": 0.651, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34349470710597985}, {"a": 0, "b": 2, "w": 0.530247941380616}, {"a": 0, "b": 3, "w": 0.3001565251819329}, {"a": 0, "b": 4, "w": 0.36850564424941845}, {"a": 0, "b": 5, "w": 0.3768105948507081}, {"a": 0, "b": 6, "w": 0.3866818373357852}, {"a": 0, "b": 7, "w": 0.4603607182129472}, {"a": 0, "b": 8, "w": 0.40754687622807195}, {"a": 0, "b": 9, "w": 0.4327845713566003}, {"a": 0, "b": 10, "w": 0.41806068533669816}, {"a": 0, "b": 11, "w": 0.36235783125526533}, {"a": 0, "b": 12, "w": 0.24818423151280788}, {"a": 0, "b": 13, "w": 0.35867509761157435}, {"a": 0, "b": 14, "w": 0.3509388214255186}, {"a": 0, "b": 15, "w": 0.3228697886235925}, {"a": 0, "b": 16, "w": 0.4044236610924419}, {"a": 0, "b": 17, "w": 0.33674563912398814}, {"a": 0, "b": 18, "w": 0.5213367382091711}, {"a": 0, "b": 19, "w": 3.6977643169677776e-11}, {"a": 0, "b": 20, "w": 0.3526693481060835}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.402,hiY=0.054;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
