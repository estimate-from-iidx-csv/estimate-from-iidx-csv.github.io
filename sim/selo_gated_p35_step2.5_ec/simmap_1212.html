<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.132, "c": "種", "n": "灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A]  n=2958 cos1.00 難0.13", "s": 0.766, "f": 0}, {"x": 0.986, "y": 0.217, "c": "近傍", "n": "Hella Deep [A]  n=2813 cos0.99 難0.22", "s": 0.729, "f": 0}, {"x": 0.985, "y": 0.145, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3740 cos0.99 難0.14", "s": 0.969, "f": 0}, {"x": 0.991, "y": -0.173, "c": "近傍", "n": "BLACK.by X-Cross Fade [H]  n=3723 cos0.99 難-0.17", "s": 0.964, "f": 0}, {"x": 0.99, "y": -0.168, "c": "近傍", "n": "Skratch Education Lv-1 [H]  n=718 cos0.99 難-0.17", "s": 0.186, "f": 0}, {"x": 0.98, "y": 0.001, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.98 難0.00", "s": 0.602, "f": 0}, {"x": 0.978, "y": 0.282, "c": "近傍", "n": "Uh-Oh [A]  n=3506 cos0.98 難0.28", "s": 0.908, "f": 0}, {"x": 0.982, "y": 0.48, "c": "近傍", "n": "SAMURAI-Scramble [A]  n=3622 cos0.98 難0.48", "s": 0.938, "f": 0}, {"x": 0.975, "y": 0.269, "c": "近傍", "n": "Halfway of promise [A]  n=3452 cos0.97 難0.27", "s": 0.894, "f": 0}, {"x": 0.984, "y": -0.311, "c": "近傍", "n": "灼熱Beach Side Bunny [H]  n=3861 cos0.98 難-0.31", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.296, "c": "近傍", "n": "Red. by Jack Trance [H]  n=2978 cos0.98 難-0.30", "s": 0.771, "f": 0}, {"x": 0.978, "y": -0.245, "c": "近傍", "n": "FIRE FIRE [H]  n=3345 cos0.98 難-0.25", "s": 0.866, "f": 0}, {"x": 0.98, "y": -0.31, "c": "近傍", "n": "Red. by Full Metal Jacket [H]  n=3709 cos0.98 難-0.31", "s": 0.961, "f": 0}, {"x": 0.972, "y": 0.256, "c": "近傍", "n": "Catch Me [L]  n=733 cos0.97 難0.26", "s": 0.19, "f": 0}, {"x": 0.973, "y": 0.358, "c": "近傍", "n": "rough percussionythm [A]  n=2835 cos0.97 難0.36", "s": 0.734, "f": 0}, {"x": 0.975, "y": 0.466, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2979 cos0.97 難0.47", "s": 0.772, "f": 0}, {"x": 0.971, "y": 0.002, "c": "近傍", "n": "5.1.1. [A]  n=3418 cos0.97 難0.00", "s": 0.885, "f": 0}, {"x": 0.97, "y": 0.074, "c": "近傍", "n": "Really Love [A]  n=3148 cos0.97 難0.07", "s": 0.815, "f": 0}, {"x": 0.971, "y": -0.041, "c": "近傍", "n": "Buffalo [A]  n=2619 cos0.97 難-0.04", "s": 0.678, "f": 0}, {"x": 0.976, "y": 0.537, "c": "近傍", "n": "ラクエン [A]  n=2997 cos0.98 難0.54", "s": 0.776, "f": 0}, {"x": 0.984, "y": -0.438, "c": "近傍", "n": "Lords Of The Roundtable [H]  n=2285 cos0.98 難-0.44", "s": 0.592, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3568005815511818}, {"a": 0, "b": 2, "w": 0.36535256252652215}, {"a": 0, "b": 3, "w": 0.4576919054286487}, {"a": 0, "b": 4, "w": 0.46504484273229274}, {"a": 0, "b": 5, "w": 0.2938989588590927}, {"a": 0, "b": 6, "w": 0.21287631813882169}, {"a": 0, "b": 7, "w": 0.1491507315303885}, {"a": 0, "b": 8, "w": 0.18557801060675938}, {"a": 0, "b": 9, "w": 0.34027302016129246}, {"a": 0, "b": 10, "w": 0.32369697979284684}, {"a": 0, "b": 11, "w": 0.023663337970484366}, {"a": 0, "b": 12, "w": 0.29324845802840604}, {"a": 0, "b": 13, "w": 0.12251572253133236}, {"a": 0, "b": 14, "w": 0.07742014908523254}, {"a": 0, "b": 15, "w": 0.18573316749702962}, {"a": 0, "b": 16, "w": 3.1481262041666014e-11}, {"a": 0, "b": 17, "w": 0.052691933615084174}, {"a": 0, "b": 18, "w": 0.06967205626816952}, {"a": 0, "b": 19, "w": 0.208342809404913}, {"a": 0, "b": 20, "w": 0.36719089401464966}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.516,hiY=0.615;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
