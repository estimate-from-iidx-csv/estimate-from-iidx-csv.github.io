<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">AO-1 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.612, "c": "種", "n": "AO-1 [H]  n=2826 cos1.00 難-0.61", "s": 0.862, "f": 0}, {"x": 0.996, "y": -0.415, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos1.00 難-0.42", "s": 0.916, "f": 0}, {"x": 0.991, "y": -0.601, "c": "近傍", "n": "bloomin' feeling [H]  n=3277 cos0.99 難-0.60", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.644, "c": "近傍", "n": "金野火織の金色提言 [H]  n=2553 cos0.99 難-0.64", "s": 0.779, "f": 0}, {"x": 0.992, "y": -0.402, "c": "近傍", "n": "PALETTE [A]  n=1098 cos0.99 難-0.40", "s": 0.335, "f": 0}, {"x": 0.989, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.70", "s": 0.548, "f": 0}, {"x": 0.99, "y": -0.791, "c": "近傍", "n": "HEISEI [H]  n=2018 cos0.99 難-0.79", "s": 0.616, "f": 0}, {"x": 0.988, "y": -0.66, "c": "近傍", "n": "Linus [H]  n=1669 cos0.99 難-0.66", "s": 0.509, "f": 0}, {"x": 0.988, "y": -0.685, "c": "近傍", "n": "memories [H]  n=1669 cos0.99 難-0.69", "s": 0.509, "f": 0}, {"x": 0.988, "y": -0.534, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.99 難-0.53", "s": 0.772, "f": 0}, {"x": 0.993, "y": -0.268, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.99 難-0.27", "s": 0.819, "f": 0}, {"x": 0.989, "y": -0.843, "c": "近傍", "n": "Binary Black Hole [H]  n=1335 cos0.99 難-0.84", "s": 0.407, "f": 0}, {"x": 0.99, "y": -0.321, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2094 cos0.99 難-0.32", "s": 0.639, "f": 0}, {"x": 0.987, "y": -0.673, "c": "近傍", "n": "GOLD RUSH [H]  n=2945 cos0.99 難-0.67", "s": 0.899, "f": 0}, {"x": 0.987, "y": -0.714, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.99 難-0.71", "s": 0.927, "f": 0}, {"x": 0.987, "y": -0.704, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.495, "f": 0}, {"x": 0.987, "y": -0.683, "c": "近傍", "n": "HIGH [H]  n=1620 cos0.99 難-0.68", "s": 0.494, "f": 0}, {"x": 0.986, "y": -0.556, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.56", "s": 0.791, "f": 0}, {"x": 0.987, "y": -0.416, "c": "近傍", "n": "Riff//rain [A]  n=1288 cos0.99 難-0.42", "s": 0.393, "f": 0}, {"x": 0.994, "y": -0.19, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.99 難-0.19", "s": 0.558, "f": 0}, {"x": 0.987, "y": -0.41, "c": "近傍", "n": "Valanga [H]  n=2998 cos0.99 難-0.41", "s": 0.915, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6130414469419896}, {"a": 0, "b": 2, "w": 0.4002646305731725}, {"a": 0, "b": 3, "w": 0.3417785206854391}, {"a": 0, "b": 4, "w": 0.33486776189994805}, {"a": 0, "b": 5, "w": 0.2922196892882747}, {"a": 0, "b": 6, "w": 0.30740544826148086}, {"a": 0, "b": 7, "w": 0.009429111236525345}, {"a": 0, "b": 8, "w": 0.24472291034133087}, {"a": 0, "b": 9, "w": 0.1006147905928646}, {"a": 0, "b": 10, "w": 0.2568169461944215}, {"a": 0, "b": 11, "w": 0.33250493373110435}, {"a": 0, "b": 12, "w": 0.37040118002135447}, {"a": 0, "b": 13, "w": 0.056780498684434355}, {"a": 0, "b": 14, "w": 0.059632994786919746}, {"a": 0, "b": 15, "w": 4.4323877901319975e-11}, {"a": 0, "b": 16, "w": 0.22798413347486834}, {"a": 0, "b": 17, "w": 0.20685547253191872}, {"a": 0, "b": 18, "w": 0.02756797448550896}, {"a": 0, "b": 19, "w": 0.44154259626217685}, {"a": 0, "b": 20, "w": 0.2830859874032895}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.896,hiY=-0.138;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
