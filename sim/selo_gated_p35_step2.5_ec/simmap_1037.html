<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SOLITON BEAM [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.066, "c": "種", "n": "SOLITON BEAM [A]  n=2876 cos1.00 難0.07", "s": 0.812, "f": 0}, {"x": 0.995, "y": -0.058, "c": "近傍", "n": "VJ ARMY [A]  n=1741 cos1.00 難-0.06", "s": 0.492, "f": 0}, {"x": 0.995, "y": -0.057, "c": "近傍", "n": "Rise'n Beauty [A]  n=2870 cos1.00 難-0.06", "s": 0.811, "f": 0}, {"x": 0.994, "y": 0.122, "c": "近傍", "n": "symbolic [A]  n=2767 cos0.99 難0.12", "s": 0.782, "f": 0}, {"x": 0.993, "y": 0.026, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos0.99 難0.03", "s": 0.782, "f": 0}, {"x": 0.993, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.167, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos0.99 難-0.17", "s": 0.208, "f": 0}, {"x": 0.995, "y": -0.177, "c": "近傍", "n": "stoic [H]  n=2581 cos1.00 難-0.18", "s": 0.729, "f": 0}, {"x": 0.992, "y": -0.052, "c": "近傍", "n": "Heavenly Sun (IIDX VERSION) [A]  n=2887 cos0.99 難-0.05", "s": 0.816, "f": 0}, {"x": 0.992, "y": -0.059, "c": "近傍", "n": "Back Into The Light [A]  n=3045 cos0.99 難-0.06", "s": 0.86, "f": 0}, {"x": 0.992, "y": -0.081, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2907 cos0.99 難-0.08", "s": 0.821, "f": 0}, {"x": 0.991, "y": -0.016, "c": "近傍", "n": "Silly Love [A]  n=2738 cos0.99 難-0.02", "s": 0.773, "f": 0}, {"x": 0.991, "y": -0.032, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2848 cos0.99 難-0.03", "s": 0.805, "f": 0}, {"x": 0.993, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3210 cos0.99 難-0.18", "s": 0.907, "f": 0}, {"x": 0.992, "y": -0.144, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos0.99 難-0.14", "s": 0.883, "f": 0}, {"x": 0.99, "y": -0.007, "c": "近傍", "n": "Space Time [A]  n=2797 cos0.99 難-0.01", "s": 0.79, "f": 0}, {"x": 0.99, "y": 0.002, "c": "近傍", "n": "BLO§OM [A]  n=2557 cos0.99 難0.00", "s": 0.722, "f": 0}, {"x": 0.99, "y": -0.007, "c": "近傍", "n": "Nowhere [A]  n=2750 cos0.99 難-0.01", "s": 0.777, "f": 0}, {"x": 0.99, "y": -0.006, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos0.99 難-0.01", "s": 0.781, "f": 0}, {"x": 0.992, "y": -0.177, "c": "近傍", "n": "REPLAY [A]  n=2245 cos0.99 難-0.18", "s": 0.634, "f": 0}, {"x": 0.993, "y": -0.203, "c": "近傍", "n": "PLASMA [A]  n=2454 cos0.99 難-0.20", "s": 0.693, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44001983499250974}, {"a": 0, "b": 2, "w": 0.3062865584851435}, {"a": 0, "b": 3, "w": 0.2946305818367665}, {"a": 0, "b": 4, "w": 0.3494629518239749}, {"a": 0, "b": 5, "w": 0.31093970023852835}, {"a": 0, "b": 6, "w": 0.4245771312429313}, {"a": 0, "b": 7, "w": 0.45522820804616393}, {"a": 0, "b": 8, "w": 5.383948842307973e-11}, {"a": 0, "b": 9, "w": 0.19299652893491026}, {"a": 0, "b": 10, "w": 0.3027287770310708}, {"a": 0, "b": 11, "w": 0.26011409163942356}, {"a": 0, "b": 12, "w": 0.19746865688020365}, {"a": 0, "b": 13, "w": 0.3319227397268124}, {"a": 0, "b": 14, "w": 0.29344849333850087}, {"a": 0, "b": 15, "w": 0.22640020046022458}, {"a": 0, "b": 16, "w": 0.15371158079025327}, {"a": 0, "b": 17, "w": 0.22508921121694458}, {"a": 0, "b": 18, "w": 0.2208412747292099}, {"a": 0, "b": 19, "w": 0.15018416293292902}, {"a": 0, "b": 20, "w": 0.25744909942152117}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.229,hiY=0.148;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
