<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Virus Funk [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.181, "c": "種", "n": "Virus Funk [A]  n=3044 cos1.00 難-0.18", "s": 0.922, "f": 0}, {"x": 0.995, "y": -0.065, "c": "近傍", "n": "Do Back Burn [A]  n=1891 cos1.00 難-0.06", "s": 0.573, "f": 0}, {"x": 0.992, "y": -0.244, "c": "近傍", "n": "HIGH VOLTAGE [A]  n=2740 cos0.99 難-0.24", "s": 0.83, "f": 0}, {"x": 0.992, "y": -0.259, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.26", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.186, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.19", "s": 0.535, "f": 0}, {"x": 0.991, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.20", "s": 0.645, "f": 0}, {"x": 0.991, "y": -0.139, "c": "近傍", "n": "Rowdy [A]  n=2462 cos0.99 難-0.14", "s": 0.746, "f": 0}, {"x": 0.992, "y": -0.417, "c": "近傍", "n": "Show Time [A]  n=659 cos0.99 難-0.42", "s": 0.2, "f": 0}, {"x": 0.991, "y": -0.356, "c": "近傍", "n": "So What [A]  n=985 cos0.99 難-0.36", "s": 0.298, "f": 0}, {"x": 0.99, "y": -0.268, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.99 難-0.27", "s": 0.813, "f": 0}, {"x": 0.99, "y": -0.124, "c": "近傍", "n": "STAR BEAT [A]  n=1422 cos0.99 難-0.12", "s": 0.431, "f": 0}, {"x": 0.989, "y": -0.264, "c": "近傍", "n": "アクマフカ [A]  n=1847 cos0.99 難-0.26", "s": 0.56, "f": 0}, {"x": 0.99, "y": -0.032, "c": "近傍", "n": "Galaxy Collapse [A]  n=792 cos0.99 難-0.03", "s": 0.24, "f": 0}, {"x": 0.99, "y": 0.021, "c": "近傍", "n": "Caldwell 99 [A]  n=1673 cos0.99 難0.02", "s": 0.507, "f": 0}, {"x": 0.989, "y": -0.309, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.99 難-0.31", "s": 0.953, "f": 0}, {"x": 0.989, "y": -0.39, "c": "近傍", "n": "ギャ・ギャ・ギャ・ギャラクシー！ [A]  n=1122 cos0.99 難-0.39", "s": 0.34, "f": 0}, {"x": 0.988, "y": -0.248, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.99 難-0.25", "s": 0.762, "f": 0}, {"x": 0.988, "y": -0.15, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2790 cos0.99 難-0.15", "s": 0.845, "f": 0}, {"x": 0.989, "y": -0.36, "c": "近傍", "n": "Mind Mapping [A]  n=3104 cos0.99 難-0.36", "s": 0.941, "f": 0}, {"x": 0.987, "y": -0.216, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.22", "s": 0.68, "f": 0}, {"x": 0.988, "y": -0.369, "c": "近傍", "n": "Rewind Time [A]  n=2018 cos0.99 難-0.37", "s": 0.612, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5769165044538642}, {"a": 0, "b": 2, "w": 0.47507576366367765}, {"a": 0, "b": 3, "w": 0.3130332067940327}, {"a": 0, "b": 4, "w": 0.43169986448133746}, {"a": 0, "b": 5, "w": 0.29321750454281414}, {"a": 0, "b": 6, "w": 0.3978675671785288}, {"a": 0, "b": 7, "w": 0.42569301892973777}, {"a": 0, "b": 8, "w": 0.2520130589527406}, {"a": 0, "b": 9, "w": 3.753886090862579e-11}, {"a": 0, "b": 10, "w": 0.3560726323892168}, {"a": 0, "b": 11, "w": 0.3179271865153387}, {"a": 0, "b": 12, "w": 0.40055461513085755}, {"a": 0, "b": 13, "w": 0.40485141815843384}, {"a": 0, "b": 14, "w": 0.2785174497968802}, {"a": 0, "b": 15, "w": 0.3048437367785276}, {"a": 0, "b": 16, "w": 0.35890617115264856}, {"a": 0, "b": 17, "w": 0.15282016309673618}, {"a": 0, "b": 18, "w": 0.15406111705320968}, {"a": 0, "b": 19, "w": 0.3347465829072024}, {"a": 0, "b": 20, "w": 0.10817352048514195}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.452,hiY=0.056;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
