<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">花冠 feat.Aikapin [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.919, "c": "種", "n": "花冠 feat.Aikapin [A]  n=3174 cos1.00 難0.92", "s": 0.889, "f": 0}, {"x": 0.979, "y": 0.998, "c": "近傍", "n": "Level 2 [A]  n=2883 cos0.98 難1.00", "s": 0.807, "f": 0}, {"x": 0.978, "y": 0.922, "c": "近傍", "n": "火影 [A]  n=3399 cos0.98 難0.92", "s": 0.952, "f": 0}, {"x": 0.985, "y": 0.632, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2504 cos0.98 難0.63", "s": 0.701, "f": 0}, {"x": 0.978, "y": 0.689, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1748 cos0.98 難0.69", "s": 0.489, "f": 0}, {"x": 0.972, "y": 0.976, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3478 cos0.97 難0.98", "s": 0.974, "f": 0}, {"x": 0.98, "y": 0.58, "c": "近傍", "n": "Sense 2007 [H]  n=3335 cos0.98 難0.58", "s": 0.934, "f": 0}, {"x": 0.972, "y": 1.072, "c": "近傍", "n": "Snake Stick [A]  n=3368 cos0.97 難1.07", "s": 0.943, "f": 0}, {"x": 0.974, "y": 0.669, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2172 cos0.97 難0.67", "s": 0.608, "f": 0}, {"x": 0.971, "y": 0.802, "c": "近傍", "n": "SAY BAY [A]  n=3496 cos0.97 難0.80", "s": 0.979, "f": 0}, {"x": 0.973, "y": 0.684, "c": "近傍", "n": "SCREAM SQUAD [A]  n=3571 cos0.97 難0.68", "s": 1.0, "f": 0}, {"x": 0.974, "y": 0.639, "c": "近傍", "n": "T.R.O.L.L. [A]  n=1094 cos0.97 難0.64", "s": 0.306, "f": 0}, {"x": 0.972, "y": 0.68, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3286 cos0.97 難0.68", "s": 0.92, "f": 0}, {"x": 0.976, "y": 0.569, "c": "近傍", "n": "Just a Little Smile [A]  n=3393 cos0.98 難0.57", "s": 0.95, "f": 0}, {"x": 0.969, "y": 1.115, "c": "近傍", "n": "199024club -Re:BounceKiller- [A]  n=3344 cos0.97 難1.11", "s": 0.936, "f": 0}, {"x": 0.979, "y": 1.33, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1570 cos0.98 難1.33", "s": 0.44, "f": 0}, {"x": 0.969, "y": 0.662, "c": "近傍", "n": "one or eight [A]  n=3564 cos0.97 難0.66", "s": 0.998, "f": 0}, {"x": 0.966, "y": 0.815, "c": "近傍", "n": "GAME ON [A]  n=1839 cos0.97 難0.81", "s": 0.515, "f": 0}, {"x": 0.966, "y": 1.021, "c": "近傍", "n": "雪上断火 [A]  n=2098 cos0.97 難1.02", "s": 0.588, "f": 0}, {"x": 0.966, "y": 0.78, "c": "近傍", "n": "Caterpillar [A]  n=3428 cos0.97 難0.78", "s": 0.96, "f": 0}, {"x": 0.976, "y": 0.48, "c": "近傍", "n": "C-C-C-N-N-N [A]  n=2180 cos0.98 難0.48", "s": 0.61, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33333829171482576}, {"a": 0, "b": 2, "w": 0.3126635239832576}, {"a": 0, "b": 3, "w": 0.41156820282746476}, {"a": 0, "b": 4, "w": 0.27114530460406405}, {"a": 0, "b": 5, "w": 0.19219686224346755}, {"a": 0, "b": 6, "w": 0.15329262089593831}, {"a": 0, "b": 7, "w": 0.22508409451291533}, {"a": 0, "b": 8, "w": 0.2372582971766407}, {"a": 0, "b": 9, "w": 0.20113820120379855}, {"a": 0, "b": 10, "w": 2.2616797323848914e-11}, {"a": 0, "b": 11, "w": 0.1916070579042024}, {"a": 0, "b": 12, "w": 0.2155801610895628}, {"a": 0, "b": 13, "w": 0.17110107056795587}, {"a": 0, "b": 14, "w": 0.1886445503312406}, {"a": 0, "b": 15, "w": 0.2522865371496823}, {"a": 0, "b": 16, "w": 0.17214212238125914}, {"a": 0, "b": 17, "w": 0.1521106531939025}, {"a": 0, "b": 18, "w": 0.0431727815205869}, {"a": 0, "b": 19, "w": 0.13002329049894956}, {"a": 0, "b": 20, "w": 0.29036665687622953}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.963,hiX=1.003,loY=0.413,hiY=1.398;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
