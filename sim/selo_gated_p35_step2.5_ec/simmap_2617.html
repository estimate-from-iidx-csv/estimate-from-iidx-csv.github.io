<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.36, "c": "種", "n": "Fascination MAXX [A]  n=3171 cos1.00 難1.36", "s": 0.876, "f": 0}, {"x": 0.967, "y": 1.421, "c": "近傍", "n": "DAY DREAM [A]  n=2913 cos0.97 難1.42", "s": 0.805, "f": 0}, {"x": 0.96, "y": 1.041, "c": "近傍", "n": "桜 [A]  n=3303 cos0.96 難1.04", "s": 0.913, "f": 0}, {"x": 0.95, "y": 0.803, "c": "近傍", "n": "D [A]  n=3226 cos0.95 難0.80", "s": 0.892, "f": 0}, {"x": 0.943, "y": 0.706, "c": "近傍", "n": "POSSESSION [A]  n=3618 cos0.94 難0.71", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.419, "c": "近傍", "n": "Fascination MAXX [H]  n=3536 cos0.99 難0.42", "s": 0.977, "f": 0}, {"x": 0.945, "y": 0.672, "c": "近傍", "n": "FUTURE is Dead [A]  n=3214 cos0.94 難0.67", "s": 0.888, "f": 0}, {"x": 0.938, "y": 0.691, "c": "近傍", "n": "SABER WING [A]  n=3428 cos0.94 難0.69", "s": 0.947, "f": 0}, {"x": 0.916, "y": 1.05, "c": "近傍", "n": "聖人の塔 [A]  n=3286 cos0.92 難1.05", "s": 0.908, "f": 0}, {"x": 0.913, "y": 1.566, "c": "近傍", "n": "恋愛＝精度×認識力 [A]  n=1690 cos0.91 難1.57", "s": 0.467, "f": 0}, {"x": 0.914, "y": 1.675, "c": "近傍", "n": "Y&Co. is dead or alive [A]  n=2616 cos0.91 難1.67", "s": 0.723, "f": 0}, {"x": 0.916, "y": 1.776, "c": "近傍", "n": "PARANOiA ～HADES～ [A]  n=2877 cos0.92 難1.78", "s": 0.795, "f": 0}, {"x": 0.944, "y": 0.444, "c": "近傍", "n": "PARANOIA survivor MAX [A]  n=1116 cos0.94 難0.44", "s": 0.308, "f": 0}, {"x": 0.938, "y": 0.493, "c": "近傍", "n": "fun [A]  n=1291 cos0.94 難0.49", "s": 0.357, "f": 0}, {"x": 0.906, "y": 1.194, "c": "近傍", "n": "IMPLANTATION [A]  n=3251 cos0.91 難1.19", "s": 0.899, "f": 0}, {"x": 0.904, "y": 1.409, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.90 難1.41", "s": 0.761, "f": 0}, {"x": 0.933, "y": 0.512, "c": "近傍", "n": "Monkey Business [A]  n=1419 cos0.93 難0.51", "s": 0.392, "f": 0}, {"x": 0.975, "y": 0.228, "c": "近傍", "n": "罪過の聖堂 [A]  n=2151 cos0.97 難0.23", "s": 0.595, "f": 0}, {"x": 0.903, "y": 1.432, "c": "近傍", "n": "FAKE TIME [A]  n=3102 cos0.90 難1.43", "s": 0.857, "f": 0}, {"x": 0.917, "y": 1.98, "c": "近傍", "n": "音楽 [A]  n=2907 cos0.92 難1.98", "s": 0.803, "f": 0}, {"x": 0.922, "y": 0.617, "c": "近傍", "n": "kors k's How to make OTOGE CORE [A]  n=2390 cos0.92 難0.62", "s": 0.661, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43643966692945724}, {"a": 0, "b": 2, "w": 0.28309094837311044}, {"a": 0, "b": 3, "w": 0.1872399982280465}, {"a": 0, "b": 4, "w": 0.24430350336106477}, {"a": 0, "b": 5, "w": 0.4309248682628867}, {"a": 0, "b": 6, "w": 0.08136234274549736}, {"a": 0, "b": 7, "w": 0.22148426084130168}, {"a": 0, "b": 8, "w": 0.10867992124793846}, {"a": 0, "b": 9, "w": 0.08221516776130999}, {"a": 0, "b": 10, "w": 0.09013468134545}, {"a": 0, "b": 11, "w": 0.09738441228135386}, {"a": 0, "b": 12, "w": 0.12082243889469113}, {"a": 0, "b": 13, "w": 0.06601535654630086}, {"a": 0, "b": 14, "w": 0.007402348071868792}, {"a": 0, "b": 15, "w": 0.055375365359224715}, {"a": 0, "b": 16, "w": 0.1321127710531259}, {"a": 0, "b": 17, "w": 0.3750204602890339}, {"a": 0, "b": 18, "w": 1.3771428442055367e-11}, {"a": 0, "b": 19, "w": 0.11008884464860746}, {"a": 0, "b": 20, "w": 0.06505203701944395}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.895,hiX=1.008,loY=0.088,hiY=2.120;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
