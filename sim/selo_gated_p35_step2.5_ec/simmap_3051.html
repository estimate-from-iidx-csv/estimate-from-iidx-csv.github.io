<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">魔法のかくれんぼ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.275, "c": "種", "n": "魔法のかくれんぼ [A]  n=2567 cos1.00 難1.27", "s": 0.75, "f": 0}, {"x": 0.992, "y": 1.355, "c": "近傍", "n": "Hollywood Galaxy [A]  n=3156 cos0.99 難1.36", "s": 0.922, "f": 0}, {"x": 0.987, "y": 1.232, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3343 cos0.99 難1.23", "s": 0.977, "f": 0}, {"x": 0.987, "y": 1.177, "c": "近傍", "n": "深淵に捧ぐレクイエム [A]  n=2939 cos0.99 難1.18", "s": 0.859, "f": 0}, {"x": 0.98, "y": 1.337, "c": "近傍", "n": "摩天楼 [A]  n=1779 cos0.98 難1.34", "s": 0.52, "f": 0}, {"x": 0.981, "y": 1.409, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.98 難1.41", "s": 0.805, "f": 0}, {"x": 0.981, "y": 1.125, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2513 cos0.98 難1.13", "s": 0.734, "f": 0}, {"x": 0.978, "y": 1.357, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.98 難1.36", "s": 0.929, "f": 0}, {"x": 0.983, "y": 1.069, "c": "近傍", "n": "Umbral [L]  n=2059 cos0.98 難1.07", "s": 0.602, "f": 0}, {"x": 0.99, "y": 1.548, "c": "近傍", "n": "Painful Fate [A]  n=2865 cos0.99 難1.55", "s": 0.837, "f": 0}, {"x": 0.975, "y": 1.327, "c": "近傍", "n": "EYE OF THE HEAVEN [A]  n=739 cos0.97 難1.33", "s": 0.216, "f": 0}, {"x": 0.975, "y": 1.2, "c": "近傍", "n": "chaplet -IIDX re:build- [A]  n=891 cos0.97 難1.20", "s": 0.26, "f": 0}, {"x": 0.974, "y": 1.246, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=945 cos0.97 難1.25", "s": 0.276, "f": 0}, {"x": 0.977, "y": 1.439, "c": "近傍", "n": "Resonant [A]  n=1284 cos0.98 難1.44", "s": 0.375, "f": 0}, {"x": 0.98, "y": 1.486, "c": "近傍", "n": "烽火連天の刃 [A]  n=2076 cos0.98 難1.49", "s": 0.606, "f": 0}, {"x": 0.975, "y": 1.385, "c": "近傍", "n": "MAX 360 [A]  n=1541 cos0.97 難1.39", "s": 0.45, "f": 0}, {"x": 0.973, "y": 1.201, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.97 難1.20", "s": 0.412, "f": 0}, {"x": 0.972, "y": 1.331, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3075 cos0.97 難1.33", "s": 0.898, "f": 0}, {"x": 0.98, "y": 1.031, "c": "近傍", "n": "entelecheia [A]  n=3423 cos0.98 難1.03", "s": 1.0, "f": 0}, {"x": 0.983, "y": 1.001, "c": "近傍", "n": "Godspeed [A]  n=3315 cos0.98 難1.00", "s": 0.968, "f": 0}, {"x": 0.98, "y": 1.021, "c": "近傍", "n": "DIVINE JUDGEMENT [A]  n=1312 cos0.98 難1.02", "s": 0.383, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5056038778633978}, {"a": 0, "b": 2, "w": 0.3760397704436169}, {"a": 0, "b": 3, "w": 0.2300898558262603}, {"a": 0, "b": 4, "w": 0.23617851958598113}, {"a": 0, "b": 5, "w": 0.22534483461034627}, {"a": 0, "b": 6, "w": 0.20924813901833794}, {"a": 0, "b": 7, "w": 0.05923531621818334}, {"a": 0, "b": 8, "w": 0.29650875243188457}, {"a": 0, "b": 9, "w": 0.3433628479016835}, {"a": 0, "b": 10, "w": 2.787636788070813e-11}, {"a": 0, "b": 11, "w": 0.12845161837036978}, {"a": 0, "b": 12, "w": 0.1130269651283321}, {"a": 0, "b": 13, "w": 0.07870084362288898}, {"a": 0, "b": 14, "w": 0.06481137934084524}, {"a": 0, "b": 15, "w": 0.10104423217780811}, {"a": 0, "b": 16, "w": 0.11352061745643083}, {"a": 0, "b": 17, "w": 0.0763497960101076}, {"a": 0, "b": 18, "w": 0.114731425766747}, {"a": 0, "b": 19, "w": 0.1844540985824925}, {"a": 0, "b": 20, "w": 0.14098533333273633}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=0.958,hiY=1.592;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
