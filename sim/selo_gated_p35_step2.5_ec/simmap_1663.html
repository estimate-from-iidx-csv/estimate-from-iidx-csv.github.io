<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">金野火織の金色提言 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.644, "c": "種", "n": "金野火織の金色提言 [H]  n=2553 cos1.00 難-0.64", "s": 0.843, "f": 0}, {"x": 0.993, "y": -0.576, "c": "近傍", "n": "Xperanza [H]  n=2619 cos0.99 難-0.58", "s": 0.865, "f": 0}, {"x": 0.993, "y": -0.683, "c": "近傍", "n": "DARK LEGACY [H]  n=2282 cos0.99 難-0.68", "s": 0.753, "f": 0}, {"x": 0.995, "y": -0.431, "c": "近傍", "n": "OTENAMI Hurricane [H]  n=2536 cos0.99 難-0.43", "s": 0.837, "f": 0}, {"x": 0.994, "y": -0.473, "c": "近傍", "n": "アタシ完全絶対正義ちゃん！ [A]  n=1767 cos0.99 難-0.47", "s": 0.583, "f": 0}, {"x": 0.994, "y": -0.416, "c": "近傍", "n": "Skywalking [A]  n=620 cos0.99 難-0.42", "s": 0.205, "f": 0}, {"x": 0.992, "y": -0.492, "c": "近傍", "n": "ALTERNATOR [H]  n=1705 cos0.99 難-0.49", "s": 0.563, "f": 0}, {"x": 0.994, "y": -0.904, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.99 難-0.90", "s": 0.534, "f": 0}, {"x": 0.991, "y": -0.556, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.56", "s": 0.856, "f": 0}, {"x": 0.991, "y": -0.612, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [H]  n=1690 cos0.99 難-0.61", "s": 0.558, "f": 0}, {"x": 0.99, "y": -0.612, "c": "近傍", "n": "AO-1 [H]  n=2826 cos0.99 難-0.61", "s": 0.933, "f": 0}, {"x": 0.992, "y": -0.839, "c": "近傍", "n": "VEGA [H]  n=2540 cos0.99 難-0.84", "s": 0.839, "f": 0}, {"x": 0.99, "y": -0.685, "c": "近傍", "n": "memories [H]  n=1669 cos0.99 難-0.69", "s": 0.551, "f": 0}, {"x": 0.99, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.70", "s": 0.593, "f": 0}, {"x": 0.991, "y": -0.509, "c": "近傍", "n": "LEMON MELON COOKIE [A]  n=1087 cos0.99 難-0.51", "s": 0.359, "f": 0}, {"x": 0.991, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.546, "f": 0}, {"x": 0.992, "y": -0.369, "c": "近傍", "n": "Rewind Time [A]  n=2018 cos0.99 難-0.37", "s": 0.666, "f": 0}, {"x": 0.99, "y": -0.746, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.99 難-0.75", "s": 0.832, "f": 0}, {"x": 0.99, "y": -0.811, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1683 cos0.99 難-0.81", "s": 0.556, "f": 0}, {"x": 0.994, "y": -0.285, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.28", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.683, "c": "近傍", "n": "HIGH [H]  n=1620 cos0.99 難-0.68", "s": 0.535, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32568411710294987}, {"a": 0, "b": 2, "w": 0.30284461736427437}, {"a": 0, "b": 3, "w": 0.37630550518563377}, {"a": 0, "b": 4, "w": 0.08036135318841409}, {"a": 0, "b": 5, "w": 0.3701039732687792}, {"a": 0, "b": 6, "w": 0.26291013892866666}, {"a": 0, "b": 7, "w": 0.3627649450908589}, {"a": 0, "b": 8, "w": 0.02496974043211375}, {"a": 0, "b": 9, "w": 0.1742065332548246}, {"a": 0, "b": 10, "w": 0.18381859145412116}, {"a": 0, "b": 11, "w": 0.0755727893203002}, {"a": 0, "b": 12, "w": 5.4960702655648674e-11}, {"a": 0, "b": 13, "w": 0.18143878243773137}, {"a": 0, "b": 14, "w": 0.0018982729182058788}, {"a": 0, "b": 15, "w": 0.127455483717264}, {"a": 0, "b": 16, "w": 0.05906359828039698}, {"a": 0, "b": 17, "w": 0.16290959197118882}, {"a": 0, "b": 18, "w": 0.18496402730704187}, {"a": 0, "b": 19, "w": 0.2812714131619273}, {"a": 0, "b": 20, "w": 0.0018463147444673922}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.953,hiY=-0.235;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
