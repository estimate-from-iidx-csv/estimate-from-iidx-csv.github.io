<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">double thrash [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.131, "c": "種", "n": "double thrash [A]  n=2392 cos1.00 難0.13", "s": 0.649, "f": 0}, {"x": 0.995, "y": 0.139, "c": "近傍", "n": "Sakura Mirage [A]  n=3464 cos1.00 難0.14", "s": 0.94, "f": 0}, {"x": 0.995, "y": 0.15, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3379 cos1.00 難0.15", "s": 0.916, "f": 0}, {"x": 0.995, "y": 0.107, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos1.00 難0.11", "s": 0.951, "f": 0}, {"x": 0.995, "y": 0.175, "c": "近傍", "n": "LASER CRUSTER [H]  n=3204 cos0.99 難0.18", "s": 0.869, "f": 0}, {"x": 0.995, "y": 0.261, "c": "近傍", "n": "Rising in the Sun(original mix) [A]  n=2243 cos1.00 難0.26", "s": 0.608, "f": 0}, {"x": 0.998, "y": -0.067, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1359 cos1.00 難-0.07", "s": 0.369, "f": 0}, {"x": 0.995, "y": 0.041, "c": "近傍", "n": "POODLE [A]  n=2923 cos0.99 難0.04", "s": 0.793, "f": 0}, {"x": 0.994, "y": 0.124, "c": "近傍", "n": "GREEN EYES [A]  n=1810 cos0.99 難0.12", "s": 0.491, "f": 0}, {"x": 0.994, "y": 0.142, "c": "近傍", "n": "Hat Surprise (Season 3) [A]  n=1474 cos0.99 難0.14", "s": 0.4, "f": 0}, {"x": 0.994, "y": 0.026, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos0.99 難0.03", "s": 0.751, "f": 0}, {"x": 0.995, "y": -0.019, "c": "近傍", "n": "As You Want [A]  n=1915 cos0.99 難-0.02", "s": 0.519, "f": 0}, {"x": 0.995, "y": -0.019, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.02", "s": 0.773, "f": 0}, {"x": 0.993, "y": 0.077, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2617 cos0.99 難0.08", "s": 0.71, "f": 0}, {"x": 0.993, "y": 0.114, "c": "近傍", "n": "KHAMEN BREAK [A]  n=3465 cos0.99 難0.11", "s": 0.94, "f": 0}, {"x": 0.993, "y": 0.127, "c": "近傍", "n": "Raspberry Potion (feat.あれたん & ぎゃるのしん☆) [A]  n=1551 cos0.99 難0.13", "s": 0.421, "f": 0}, {"x": 0.993, "y": 0.121, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.12", "s": 0.927, "f": 0}, {"x": 0.993, "y": 0.106, "c": "近傍", "n": "garden [A]  n=3224 cos0.99 難0.11", "s": 0.874, "f": 0}, {"x": 0.993, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos0.99 難0.12", "s": 0.703, "f": 0}, {"x": 0.993, "y": 0.024, "c": "近傍", "n": "Cosmic Cat [A]  n=3687 cos0.99 難0.02", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.324, "c": "近傍", "n": "Lighting Shower [A]  n=3194 cos0.99 難0.32", "s": 0.866, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 5.704392513905532e-11}, {"a": 0, "b": 2, "w": 0.3289171303914342}, {"a": 0, "b": 3, "w": 0.36471723942040724}, {"a": 0, "b": 4, "w": 0.36422891515488565}, {"a": 0, "b": 5, "w": 0.2412850610542404}, {"a": 0, "b": 6, "w": 0.5704121648473276}, {"a": 0, "b": 7, "w": 0.3250056464972332}, {"a": 0, "b": 8, "w": 0.280953204672021}, {"a": 0, "b": 9, "w": 0.001657595171217996}, {"a": 0, "b": 10, "w": 0.26699041885733665}, {"a": 0, "b": 11, "w": 0.15484234117037066}, {"a": 0, "b": 12, "w": 0.3211106762465161}, {"a": 0, "b": 13, "w": 0.2611902524365842}, {"a": 0, "b": 14, "w": 0.188658051115405}, {"a": 0, "b": 15, "w": 0.04871221927243152}, {"a": 0, "b": 16, "w": 0.23706964111112383}, {"a": 0, "b": 17, "w": 0.2386605625422391}, {"a": 0, "b": 18, "w": 0.2558682869584239}, {"a": 0, "b": 19, "w": 0.2723005990641052}, {"a": 0, "b": 20, "w": 0.330332434808178}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.099,hiY=0.355;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
