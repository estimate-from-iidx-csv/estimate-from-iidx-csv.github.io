<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Beastie Starter [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.676, "c": "種", "n": "Beastie Starter [A]  n=3263 cos1.00 難0.68", "s": 0.913, "f": 0}, {"x": 0.991, "y": 0.634, "c": "近傍", "n": "Sarutobi Champion is 拙者 [A]  n=2913 cos0.99 難0.63", "s": 0.815, "f": 0}, {"x": 0.992, "y": 0.531, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.99 難0.53", "s": 0.966, "f": 0}, {"x": 0.988, "y": 0.586, "c": "近傍", "n": "TRANOID [A]  n=3073 cos0.99 難0.59", "s": 0.86, "f": 0}, {"x": 0.994, "y": 0.399, "c": "近傍", "n": "Secret of Love [A]  n=3058 cos0.99 難0.40", "s": 0.856, "f": 0}, {"x": 0.988, "y": 0.47, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3012 cos0.99 難0.47", "s": 0.843, "f": 0}, {"x": 0.985, "y": 0.527, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.53", "s": 0.889, "f": 0}, {"x": 0.984, "y": 0.586, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.98 難0.59", "s": 0.747, "f": 0}, {"x": 0.983, "y": 0.677, "c": "近傍", "n": "ICARUS [A]  n=3574 cos0.98 難0.68", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.445, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.99 難0.44", "s": 0.861, "f": 0}, {"x": 0.984, "y": 0.821, "c": "近傍", "n": "少年A [A]  n=3507 cos0.98 難0.82", "s": 0.981, "f": 0}, {"x": 0.983, "y": 0.584, "c": "近傍", "n": "LADYBIRD [A]  n=2809 cos0.98 難0.58", "s": 0.786, "f": 0}, {"x": 0.982, "y": 0.704, "c": "近傍", "n": "Parvati [A]  n=2633 cos0.98 難0.70", "s": 0.737, "f": 0}, {"x": 0.985, "y": 0.459, "c": "近傍", "n": "NEMESIS [A]  n=3214 cos0.99 難0.46", "s": 0.899, "f": 0}, {"x": 0.985, "y": 0.468, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.47", "s": 0.907, "f": 0}, {"x": 0.989, "y": 0.386, "c": "近傍", "n": "Castle on the Moon [A]  n=3392 cos0.99 難0.39", "s": 0.949, "f": 0}, {"x": 0.987, "y": 0.407, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.41", "s": 0.929, "f": 0}, {"x": 0.986, "y": 0.426, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3248 cos0.99 難0.43", "s": 0.909, "f": 0}, {"x": 0.99, "y": 0.349, "c": "近傍", "n": "RESONATE 1794 [A]  n=3171 cos0.99 難0.35", "s": 0.887, "f": 0}, {"x": 0.981, "y": 0.52, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.98 難0.52", "s": 0.931, "f": 0}, {"x": 0.979, "y": 0.727, "c": "近傍", "n": "Out of Control [A]  n=1758 cos0.98 難0.73", "s": 0.492, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40678791223282396}, {"a": 0, "b": 2, "w": 0.5302114781509629}, {"a": 0, "b": 3, "w": 0.4221056330147366}, {"a": 0, "b": 4, "w": 0.3659537786370697}, {"a": 0, "b": 5, "w": 0.41690788551137425}, {"a": 0, "b": 6, "w": 0.2917473027377758}, {"a": 0, "b": 7, "w": 0.3430500195448931}, {"a": 0, "b": 8, "w": 2.8486102365832267e-11}, {"a": 0, "b": 9, "w": 0.4572217342138296}, {"a": 0, "b": 10, "w": 0.342584083535848}, {"a": 0, "b": 11, "w": 0.3731999979920636}, {"a": 0, "b": 12, "w": 0.2887837774645603}, {"a": 0, "b": 13, "w": 0.35381582341217177}, {"a": 0, "b": 14, "w": 0.1709368992902297}, {"a": 0, "b": 15, "w": 0.46164816958951504}, {"a": 0, "b": 16, "w": 0.40090675803288567}, {"a": 0, "b": 17, "w": 0.3936599824989404}, {"a": 0, "b": 18, "w": 0.3953334964219778}, {"a": 0, "b": 19, "w": 0.343169256119795}, {"a": 0, "b": 20, "w": 0.07449964663453912}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=0.311,hiY=0.859;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
