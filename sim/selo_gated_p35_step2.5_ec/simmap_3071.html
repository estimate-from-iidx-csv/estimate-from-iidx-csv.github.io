<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Blue Rain [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.841, "c": "種", "n": "Blue Rain [L]  n=2878 cos1.00 難1.84", "s": 0.969, "f": 0}, {"x": 0.988, "y": 1.88, "c": "近傍", "n": "INAZUMA [L]  n=759 cos0.99 難1.88", "s": 0.256, "f": 0}, {"x": 0.985, "y": 1.874, "c": "近傍", "n": "Violet Pulse [L]  n=1459 cos0.99 難1.87", "s": 0.491, "f": 0}, {"x": 0.983, "y": 1.853, "c": "近傍", "n": "伐折羅-vajra- [A]  n=2266 cos0.98 難1.85", "s": 0.763, "f": 0}, {"x": 0.989, "y": 1.904, "c": "近傍", "n": "Flashes [L]  n=670 cos0.99 難1.90", "s": 0.226, "f": 0}, {"x": 0.979, "y": 1.86, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [L]  n=1649 cos0.98 難1.86", "s": 0.555, "f": 0}, {"x": 0.983, "y": 1.901, "c": "近傍", "n": "ZEPHYRANTHES [L]  n=2168 cos0.98 難1.90", "s": 0.73, "f": 0}, {"x": 0.984, "y": 1.911, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1790 cos0.98 難1.91", "s": 0.603, "f": 0}, {"x": 0.985, "y": 1.919, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2970 cos0.98 難1.92", "s": 1.0, "f": 0}, {"x": 0.979, "y": 1.795, "c": "近傍", "n": "Life Is A Game ft.DD\"ナカタ\"Metal [A]  n=2805 cos0.98 難1.80", "s": 0.944, "f": 0}, {"x": 0.979, "y": 1.793, "c": "近傍", "n": "Initiation [A]  n=2955 cos0.98 難1.79", "s": 0.995, "f": 0}, {"x": 0.984, "y": 1.92, "c": "近傍", "n": "waxing and wanding [L]  n=2819 cos0.98 難1.92", "s": 0.949, "f": 0}, {"x": 0.99, "y": 1.946, "c": "近傍", "n": "Scripted Connection⇒ A mix [L]  n=1751 cos0.99 難1.95", "s": 0.59, "f": 0}, {"x": 0.994, "y": 1.718, "c": "近傍", "n": "仮想空間の旅人たち [L]  n=2941 cos0.99 難1.72", "s": 0.99, "f": 0}, {"x": 0.976, "y": 1.776, "c": "近傍", "n": "PARANOiA ～HADES～ [A]  n=2877 cos0.98 難1.78", "s": 0.969, "f": 0}, {"x": 0.972, "y": 1.865, "c": "近傍", "n": "CADENZA [A]  n=1361 cos0.97 難1.87", "s": 0.458, "f": 0}, {"x": 0.97, "y": 1.864, "c": "近傍", "n": "二人ノ廃城幽踊宴 [A]  n=1946 cos0.97 難1.86", "s": 0.655, "f": 0}, {"x": 0.973, "y": 1.903, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2472 cos0.97 難1.90", "s": 0.832, "f": 0}, {"x": 0.983, "y": 1.959, "c": "近傍", "n": "BLACK or WHITE? [A]  n=2319 cos0.98 難1.96", "s": 0.781, "f": 0}, {"x": 0.978, "y": 1.737, "c": "近傍", "n": "Feel The Beat [L]  n=2738 cos0.98 難1.74", "s": 0.922, "f": 0}, {"x": 0.97, "y": 1.87, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [A]  n=2947 cos0.97 難1.87", "s": 0.992, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4513747665010437}, {"a": 0, "b": 2, "w": 0.44215084053520737}, {"a": 0, "b": 3, "w": 0.44405181720001097}, {"a": 0, "b": 4, "w": 0.4782464663581214}, {"a": 0, "b": 5, "w": 0.3307192088246639}, {"a": 0, "b": 6, "w": 0.4493868183310923}, {"a": 0, "b": 7, "w": 0.44774782150958803}, {"a": 0, "b": 8, "w": 0.3736323465544621}, {"a": 0, "b": 9, "w": 0.2675960002313509}, {"a": 0, "b": 10, "w": 0.02639182845210375}, {"a": 0, "b": 11, "w": 0.22694058397413008}, {"a": 0, "b": 12, "w": 0.5759427673826308}, {"a": 0, "b": 13, "w": 0.6606137309588469}, {"a": 0, "b": 14, "w": 0.3120127284169838}, {"a": 0, "b": 15, "w": 1.954902906220468e-11}, {"a": 0, "b": 16, "w": 0.28249296948243396}, {"a": 0, "b": 17, "w": 0.2850759616756442}, {"a": 0, "b": 18, "w": 0.2696369809862659}, {"a": 0, "b": 19, "w": 0.06484943959772682}, {"a": 0, "b": 20, "w": 0.05176070140760003}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.967,hiX=1.002,loY=1.698,hiY=1.979;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
