<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">TYPE MARS(G-Style Mix) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.474, "c": "種", "n": "TYPE MARS(G-Style Mix) [H]  n=1633 cos1.00 難-0.47", "s": 0.506, "f": 0}, {"x": 0.992, "y": -0.437, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.44", "s": 0.772, "f": 0}, {"x": 0.993, "y": -0.573, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.57", "s": 0.737, "f": 0}, {"x": 0.993, "y": -0.58, "c": "近傍", "n": "the shadow [H]  n=1902 cos0.99 難-0.58", "s": 0.59, "f": 0}, {"x": 0.994, "y": -0.613, "c": "近傍", "n": "quasar [H]  n=3212 cos0.99 難-0.61", "s": 0.996, "f": 0}, {"x": 0.992, "y": -0.576, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.99 難-0.58", "s": 0.791, "f": 0}, {"x": 0.994, "y": -0.626, "c": "近傍", "n": "xenon [H]  n=2372 cos0.99 難-0.63", "s": 0.735, "f": 0}, {"x": 0.994, "y": -0.644, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos0.99 難-0.64", "s": 0.815, "f": 0}, {"x": 0.991, "y": -0.39, "c": "近傍", "n": "Ristaccia [H]  n=2302 cos0.99 難-0.39", "s": 0.714, "f": 0}, {"x": 0.991, "y": -0.601, "c": "近傍", "n": "ANDROMEDA II [H]  n=1979 cos0.99 難-0.60", "s": 0.613, "f": 0}, {"x": 0.99, "y": -0.572, "c": "近傍", "n": "STELLAR WIND [H]  n=2284 cos0.99 難-0.57", "s": 0.708, "f": 0}, {"x": 0.99, "y": -0.59, "c": "近傍", "n": "DIAVOLO [H]  n=3226 cos0.99 難-0.59", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.605, "c": "近傍", "n": "トリカゴノ鳳凰 [H]  n=2598 cos0.99 難-0.61", "s": 0.805, "f": 0}, {"x": 0.993, "y": -0.684, "c": "近傍", "n": "Votum stellarum [H]  n=1929 cos0.99 難-0.68", "s": 0.598, "f": 0}, {"x": 0.993, "y": -0.684, "c": "近傍", "n": "KAMAITACHI [H]  n=2388 cos0.99 難-0.68", "s": 0.74, "f": 0}, {"x": 0.989, "y": -0.61, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [H]  n=2289 cos0.99 難-0.61", "s": 0.71, "f": 0}, {"x": 0.995, "y": -0.723, "c": "近傍", "n": "INAZUMA [H]  n=2055 cos0.99 難-0.72", "s": 0.637, "f": 0}, {"x": 0.988, "y": -0.574, "c": "近傍", "n": "黒髪乱れし修羅となりて [H]  n=3133 cos0.99 難-0.57", "s": 0.971, "f": 0}, {"x": 0.994, "y": -0.717, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1989 cos0.99 難-0.72", "s": 0.617, "f": 0}, {"x": 0.991, "y": -0.685, "c": "近傍", "n": "HYPERION [H]  n=1842 cos0.99 難-0.68", "s": 0.571, "f": 0}, {"x": 0.987, "y": -0.386, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.99 難-0.39", "s": 0.745, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2504885698912076}, {"a": 0, "b": 2, "w": 0.4182179759575968}, {"a": 0, "b": 3, "w": 0.44069332404509776}, {"a": 0, "b": 4, "w": 0.41946140982531566}, {"a": 0, "b": 5, "w": 0.3740524442280113}, {"a": 0, "b": 6, "w": 0.4485099869158887}, {"a": 0, "b": 7, "w": 0.4850346168017867}, {"a": 0, "b": 8, "w": 0.3158067753322552}, {"a": 0, "b": 9, "w": 0.36682068441920634}, {"a": 0, "b": 10, "w": 0.3341973090578989}, {"a": 0, "b": 11, "w": 0.3294939591372966}, {"a": 0, "b": 12, "w": 0.3144720522383404}, {"a": 0, "b": 13, "w": 0.3177304935688513}, {"a": 0, "b": 14, "w": 0.432836343758386}, {"a": 0, "b": 15, "w": 0.12977786916022238}, {"a": 0, "b": 16, "w": 0.45397124758189467}, {"a": 0, "b": 17, "w": 0.22428767507466563}, {"a": 0, "b": 18, "w": 0.4760140836382539}, {"a": 0, "b": 19, "w": 0.3505576138096056}, {"a": 0, "b": 20, "w": 4.9126813728150864e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.750,hiY=-0.359;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
