<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Monkey Business [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.512, "c": "種", "n": "Monkey Business [A]  n=1419 cos1.00 難0.51", "s": 0.401, "f": 0}, {"x": 0.992, "y": 0.444, "c": "近傍", "n": "PARANOIA survivor MAX [A]  n=1116 cos0.99 難0.44", "s": 0.315, "f": 0}, {"x": 0.986, "y": 0.506, "c": "近傍", "n": "PARANOiA ～HADES～ [H]  n=3128 cos0.99 難0.51", "s": 0.883, "f": 0}, {"x": 0.984, "y": 0.493, "c": "近傍", "n": "fun [A]  n=1291 cos0.98 難0.49", "s": 0.365, "f": 0}, {"x": 0.985, "y": 0.803, "c": "近傍", "n": "D [A]  n=3226 cos0.99 難0.80", "s": 0.911, "f": 0}, {"x": 0.983, "y": 0.642, "c": "近傍", "n": "ZETA～素数の世界と超越者～ [A]  n=3256 cos0.98 難0.64", "s": 0.92, "f": 0}, {"x": 0.981, "y": 0.375, "c": "近傍", "n": "GRADIUS -FULL SPEED- [A]  n=2775 cos0.98 難0.37", "s": 0.784, "f": 0}, {"x": 0.981, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.98 難0.32", "s": 0.924, "f": 0}, {"x": 0.981, "y": 0.672, "c": "近傍", "n": "FUTURE is Dead [A]  n=3214 cos0.98 難0.67", "s": 0.908, "f": 0}, {"x": 0.983, "y": 0.119, "c": "近傍", "n": "Harmony and Lovely [A]  n=3541 cos0.98 難0.12", "s": 1.0, "f": 0}, {"x": 0.981, "y": 0.793, "c": "近傍", "n": "Lethal Weapon [A]  n=3095 cos0.98 難0.79", "s": 0.874, "f": 0}, {"x": 0.986, "y": -0.052, "c": "近傍", "n": "Heavenly Sun (IIDX VERSION) [A]  n=2887 cos0.99 難-0.05", "s": 0.815, "f": 0}, {"x": 0.979, "y": 0.468, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.98 難0.47", "s": 0.916, "f": 0}, {"x": 0.979, "y": 0.258, "c": "近傍", "n": "rainbow flyer [A]  n=3359 cos0.98 難0.26", "s": 0.949, "f": 0}, {"x": 0.981, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.98 難0.11", "s": 1.0, "f": 0}, {"x": 0.978, "y": 0.295, "c": "近傍", "n": "GUILTY [A]  n=1451 cos0.98 難0.29", "s": 0.41, "f": 0}, {"x": 0.977, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.98 難0.38", "s": 0.913, "f": 0}, {"x": 0.98, "y": 0.121, "c": "近傍", "n": "lower world [A]  n=2593 cos0.98 難0.12", "s": 0.732, "f": 0}, {"x": 0.982, "y": -0.006, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos0.98 難-0.01", "s": 0.78, "f": 0}, {"x": 0.979, "y": 0.174, "c": "近傍", "n": "end of world [A]  n=3010 cos0.98 難0.17", "s": 0.85, "f": 0}, {"x": 0.978, "y": 0.238, "c": "近傍", "n": "HYPERION [A]  n=3347 cos0.98 難0.24", "s": 0.945, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5727251594365679}, {"a": 0, "b": 2, "w": 0.30233635873223397}, {"a": 0, "b": 3, "w": 0.40446880324302514}, {"a": 0, "b": 4, "w": 0.4841545008050271}, {"a": 0, "b": 5, "w": 0.4106651650003288}, {"a": 0, "b": 6, "w": 0.296723843629064}, {"a": 0, "b": 7, "w": 0.2740721035670475}, {"a": 0, "b": 8, "w": 0.34666992732842206}, {"a": 0, "b": 9, "w": 0.21457707778031565}, {"a": 0, "b": 10, "w": 0.28413847404733716}, {"a": 0, "b": 11, "w": 2.4358293160275934e-11}, {"a": 0, "b": 12, "w": 0.10308011805928663}, {"a": 0, "b": 13, "w": 0.258920997438184}, {"a": 0, "b": 14, "w": 0.2673272347965119}, {"a": 0, "b": 15, "w": 0.20835002154612936}, {"a": 0, "b": 16, "w": 0.31476636290775717}, {"a": 0, "b": 17, "w": 0.2765616456262696}, {"a": 0, "b": 18, "w": 0.246518665748803}, {"a": 0, "b": 19, "w": 0.2942972575876236}, {"a": 0, "b": 20, "w": 0.2894920327879783}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-0.120,hiY=0.871;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
