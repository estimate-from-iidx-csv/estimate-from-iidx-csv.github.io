<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">仮想空間の旅人たち [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.718, "c": "種", "n": "仮想空間の旅人たち [L]  n=2941 cos1.00 難1.72", "s": 0.905, "f": 0}, {"x": 0.982, "y": 1.704, "c": "近傍", "n": "KAISER PHOENIX [A]  n=2968 cos0.98 難1.70", "s": 0.913, "f": 0}, {"x": 0.982, "y": 1.702, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2854 cos0.98 難1.70", "s": 0.878, "f": 0}, {"x": 0.982, "y": 1.68, "c": "近傍", "n": "ALBA -黎明- [L]  n=1258 cos0.98 難1.68", "s": 0.387, "f": 0}, {"x": 0.994, "y": 1.617, "c": "近傍", "n": "天空の夜明け [A]  n=3251 cos0.99 難1.62", "s": 1.0, "f": 0}, {"x": 0.982, "y": 1.649, "c": "近傍", "n": "GRAVITON [A]  n=1936 cos0.98 難1.65", "s": 0.596, "f": 0}, {"x": 0.981, "y": 1.651, "c": "近傍", "n": "Uaigh Gealai [A]  n=867 cos0.98 難1.65", "s": 0.267, "f": 0}, {"x": 0.982, "y": 1.793, "c": "近傍", "n": "Initiation [A]  n=2955 cos0.98 難1.79", "s": 0.909, "f": 0}, {"x": 0.98, "y": 1.648, "c": "近傍", "n": "VOLAQUAS [A]  n=1729 cos0.98 難1.65", "s": 0.532, "f": 0}, {"x": 0.985, "y": 1.627, "c": "近傍", "n": "MAX 300 [A]  n=1585 cos0.98 難1.63", "s": 0.488, "f": 0}, {"x": 0.976, "y": 1.679, "c": "近傍", "n": "Satellite Burst [A]  n=1278 cos0.98 難1.68", "s": 0.393, "f": 0}, {"x": 0.975, "y": 1.737, "c": "近傍", "n": "Feel The Beat [L]  n=2738 cos0.97 難1.74", "s": 0.842, "f": 0}, {"x": 0.987, "y": 1.617, "c": "近傍", "n": "THE BRAVE MUST DIE [A]  n=2704 cos0.99 難1.62", "s": 0.832, "f": 0}, {"x": 0.979, "y": 1.795, "c": "近傍", "n": "Life Is A Game ft.DD\"ナカタ\"Metal [A]  n=2805 cos0.98 難1.80", "s": 0.863, "f": 0}, {"x": 0.973, "y": 1.728, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2753 cos0.97 難1.73", "s": 0.847, "f": 0}, {"x": 0.994, "y": 1.841, "c": "近傍", "n": "Blue Rain [L]  n=2878 cos0.99 難1.84", "s": 0.885, "f": 0}, {"x": 0.973, "y": 1.678, "c": "近傍", "n": "O/D*20 [L]  n=1303 cos0.97 難1.68", "s": 0.401, "f": 0}, {"x": 0.973, "y": 1.679, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [A]  n=2324 cos0.97 難1.68", "s": 0.715, "f": 0}, {"x": 0.987, "y": 1.588, "c": "近傍", "n": "G59 [A]  n=3111 cos0.99 難1.59", "s": 0.957, "f": 0}, {"x": 0.968, "y": 1.741, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.97 難1.74", "s": 0.225, "f": 0}, {"x": 0.976, "y": 1.617, "c": "近傍", "n": "Artist [A]  n=2459 cos0.98 難1.62", "s": 0.756, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3727081017116869}, {"a": 0, "b": 2, "w": 0.28936386947729786}, {"a": 0, "b": 3, "w": 0.30970345905741736}, {"a": 0, "b": 4, "w": 0.6136269311245721}, {"a": 0, "b": 5, "w": 0.3275698567073083}, {"a": 0, "b": 6, "w": 0.338002234114099}, {"a": 0, "b": 7, "w": 0.05454552591181261}, {"a": 0, "b": 8, "w": 0.2903144696768133}, {"a": 0, "b": 9, "w": 0.4011235845348279}, {"a": 0, "b": 10, "w": 0.2539607024300118}, {"a": 0, "b": 11, "w": 2.138800248019379e-11}, {"a": 0, "b": 12, "w": 0.44504602283812245}, {"a": 0, "b": 13, "w": 0.2364295518357633}, {"a": 0, "b": 14, "w": 0.21745804235406874}, {"a": 0, "b": 15, "w": 0.6286860865334382}, {"a": 0, "b": 16, "w": 0.20517793918999383}, {"a": 0, "b": 17, "w": 0.17780188547093267}, {"a": 0, "b": 18, "w": 0.4383702581050025}, {"a": 0, "b": 19, "w": 0.15790226520590367}, {"a": 0, "b": 20, "w": 0.2618359152852917}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.966,hiX=1.003,loY=1.568,hiY=1.861;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
