<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Liberation [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.785, "c": "種", "n": "Liberation [A]  n=3544 cos1.00 難0.79", "s": 0.958, "f": 0}, {"x": 0.983, "y": 0.841, "c": "近傍", "n": "Scripted Connection⇒ A mix [A]  n=3524 cos0.98 難0.84", "s": 0.953, "f": 0}, {"x": 0.977, "y": 0.823, "c": "近傍", "n": "ワルツ第17番 ト短調”大犬のワルツ” [A]  n=3567 cos0.98 難0.82", "s": 0.965, "f": 0}, {"x": 0.975, "y": 0.766, "c": "近傍", "n": "電人、暁に斃れる。 [A]  n=3511 cos0.97 難0.77", "s": 0.949, "f": 0}, {"x": 0.975, "y": 0.723, "c": "近傍", "n": "Thunderbolt [A]  n=3593 cos0.97 難0.72", "s": 0.972, "f": 0}, {"x": 0.975, "y": 0.686, "c": "近傍", "n": "SpaceLand☆TOYBOX [A]  n=3554 cos0.97 難0.69", "s": 0.961, "f": 0}, {"x": 0.974, "y": 0.679, "c": "近傍", "n": "九尾狐夜行 [A]  n=3512 cos0.97 難0.68", "s": 0.95, "f": 0}, {"x": 0.972, "y": 0.813, "c": "近傍", "n": "True Blue [A]  n=3598 cos0.97 難0.81", "s": 0.973, "f": 0}, {"x": 0.979, "y": 1.001, "c": "近傍", "n": "Godspeed [A]  n=3315 cos0.98 難1.00", "s": 0.896, "f": 0}, {"x": 0.97, "y": 0.787, "c": "近傍", "n": "Ancient Scapes [A]  n=3551 cos0.97 難0.79", "s": 0.96, "f": 0}, {"x": 0.978, "y": 1.016, "c": "近傍", "n": "innocent revolver [A]  n=2544 cos0.98 難1.02", "s": 0.688, "f": 0}, {"x": 0.979, "y": 0.531, "c": "近傍", "n": "黒髪乱れし修羅となりて [A]  n=3698 cos0.98 難0.53", "s": 1.0, "f": 0}, {"x": 0.969, "y": 0.797, "c": "近傍", "n": "Silver Bullet [A]  n=2434 cos0.97 難0.80", "s": 0.658, "f": 0}, {"x": 0.968, "y": 0.78, "c": "近傍", "n": "Drastic Dramatic [A]  n=3378 cos0.97 難0.78", "s": 0.913, "f": 0}, {"x": 0.974, "y": 0.988, "c": "近傍", "n": "トリカゴノ鳳凰 [A]  n=3395 cos0.97 難0.99", "s": 0.918, "f": 0}, {"x": 0.979, "y": 0.506, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2944 cos0.98 難0.51", "s": 0.796, "f": 0}, {"x": 0.971, "y": 0.975, "c": "近傍", "n": "destination [A]  n=1475 cos0.97 難0.98", "s": 0.399, "f": 0}, {"x": 0.979, "y": 0.496, "c": "近傍", "n": "Tail Lights [A]  n=2429 cos0.98 難0.50", "s": 0.657, "f": 0}, {"x": 0.967, "y": 0.682, "c": "近傍", "n": "#CMFLG [A]  n=1956 cos0.97 難0.68", "s": 0.529, "f": 0}, {"x": 0.973, "y": 0.547, "c": "近傍", "n": "LASER CRUSTER [A]  n=3656 cos0.97 難0.55", "s": 0.989, "f": 0}, {"x": 0.973, "y": 1.027, "c": "近傍", "n": "Last Dance [A]  n=3340 cos0.97 難1.03", "s": 0.903, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.17937129049639278}, {"a": 0, "b": 2, "w": 0.15961176158210633}, {"a": 0, "b": 3, "w": 0.07214485735070253}, {"a": 0, "b": 4, "w": 0.08240237553033614}, {"a": 0, "b": 5, "w": 0.06605782900569335}, {"a": 0, "b": 6, "w": 0.05098517003110392}, {"a": 0, "b": 7, "w": 0.06712546401940989}, {"a": 0, "b": 8, "w": 0.1942000029350156}, {"a": 0, "b": 9, "w": 0.055137921591947525}, {"a": 0, "b": 10, "w": 0.18667357310585253}, {"a": 0, "b": 11, "w": 0.1705137300343218}, {"a": 0, "b": 12, "w": 2.5889401733536488e-11}, {"a": 0, "b": 13, "w": 0.007440766659591813}, {"a": 0, "b": 14, "w": 0.11300685742397265}, {"a": 0, "b": 15, "w": 0.12044292773808851}, {"a": 0, "b": 16, "w": 0.021321318611109308}, {"a": 0, "b": 17, "w": 0.004098675070405178}, {"a": 0, "b": 18, "w": 0.007100270874533465}, {"a": 0, "b": 19, "w": 0.03737797318824321}, {"a": 0, "b": 20, "w": 0.08954835038189624}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.965,hiX=1.003,loY=0.453,hiY=1.070;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
