<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Colors -Y&Co. Eurobeat Remix- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.795, "c": "種", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos1.00 難-0.80", "s": 0.748, "f": 0}, {"x": 0.998, "y": -0.752, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos1.00 難-0.75", "s": 0.925, "f": 0}, {"x": 0.995, "y": -0.791, "c": "近傍", "n": "Giudecca [H]  n=1656 cos1.00 難-0.79", "s": 0.63, "f": 0}, {"x": 0.995, "y": -0.727, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos1.00 難-0.73", "s": 0.684, "f": 0}, {"x": 0.995, "y": -0.736, "c": "近傍", "n": "dAuntl3ss [H]  n=1995 cos1.00 難-0.74", "s": 0.759, "f": 0}, {"x": 0.998, "y": -0.91, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos1.00 難-0.91", "s": 0.83, "f": 0}, {"x": 0.995, "y": -0.723, "c": "近傍", "n": "INAZUMA [H]  n=2055 cos0.99 難-0.72", "s": 0.782, "f": 0}, {"x": 0.993, "y": -0.835, "c": "近傍", "n": "Let The Track Flow [H]  n=1749 cos0.99 難-0.83", "s": 0.666, "f": 0}, {"x": 0.993, "y": -0.821, "c": "近傍", "n": "仮想空間の旅人たち [H]  n=2269 cos0.99 難-0.82", "s": 0.863, "f": 0}, {"x": 0.997, "y": -0.919, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2234 cos1.00 難-0.92", "s": 0.85, "f": 0}, {"x": 0.994, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.72", "s": 0.725, "f": 0}, {"x": 0.993, "y": -0.839, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2503 cos0.99 難-0.84", "s": 0.952, "f": 0}, {"x": 0.996, "y": -0.679, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos1.00 難-0.68", "s": 0.704, "f": 0}, {"x": 0.993, "y": -0.856, "c": "近傍", "n": "UMMU [H]  n=2418 cos0.99 難-0.86", "s": 0.92, "f": 0}, {"x": 0.993, "y": -0.752, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.75", "s": 0.691, "f": 0}, {"x": 0.995, "y": -0.684, "c": "近傍", "n": "Votum stellarum [H]  n=1929 cos0.99 難-0.68", "s": 0.734, "f": 0}, {"x": 0.994, "y": -0.684, "c": "近傍", "n": "KAMAITACHI [H]  n=2388 cos0.99 難-0.68", "s": 0.909, "f": 0}, {"x": 0.996, "y": -0.93, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [H]  n=2504 cos1.00 難-0.93", "s": 0.953, "f": 0}, {"x": 0.995, "y": -0.92, "c": "近傍", "n": "TIEFSEE [H]  n=2156 cos0.99 難-0.92", "s": 0.82, "f": 0}, {"x": 0.998, "y": -0.644, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos1.00 難-0.64", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.902, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos0.99 難-0.90", "s": 0.949, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5733427506060997}, {"a": 0, "b": 2, "w": 0.5099169489589499}, {"a": 0, "b": 3, "w": 0.4855719094401745}, {"a": 0, "b": 4, "w": 0.48168730071425125}, {"a": 0, "b": 5, "w": 0.5247321764386144}, {"a": 0, "b": 6, "w": 0.4778087461719682}, {"a": 0, "b": 7, "w": 0.37547427295406854}, {"a": 0, "b": 8, "w": 0.3585673948860151}, {"a": 0, "b": 9, "w": 0.6086115480759748}, {"a": 0, "b": 10, "w": 0.4457720747947893}, {"a": 0, "b": 11, "w": 0.34026928907499954}, {"a": 0, "b": 12, "w": 0.5273930193390082}, {"a": 0, "b": 13, "w": 5.539646519281405e-11}, {"a": 0, "b": 14, "w": 0.3273988397561355}, {"a": 0, "b": 15, "w": 0.46157123598190997}, {"a": 0, "b": 16, "w": 0.4304897220459133}, {"a": 0, "b": 17, "w": 0.5107331951826808}, {"a": 0, "b": 18, "w": 0.47653577183146845}, {"a": 0, "b": 19, "w": 0.6319821366257424}, {"a": 0, "b": 20, "w": 0.20678776811346533}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.952,hiY=-0.621;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
