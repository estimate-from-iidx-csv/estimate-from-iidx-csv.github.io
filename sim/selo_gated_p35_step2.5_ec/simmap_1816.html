<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">crew [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.01, "c": "種", "n": "crew [A]  n=3602 cos1.00 難-0.01", "s": 0.974, "f": 0}, {"x": 0.996, "y": -0.032, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos1.00 難-0.03", "s": 0.876, "f": 0}, {"x": 0.995, "y": 0.018, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos0.99 難0.02", "s": 0.981, "f": 0}, {"x": 0.996, "y": 0.112, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos1.00 難0.11", "s": 0.943, "f": 0}, {"x": 0.996, "y": -0.147, "c": "近傍", "n": "Euphoric Lagoon [A]  n=2431 cos1.00 難-0.15", "s": 0.658, "f": 0}, {"x": 0.995, "y": 0.107, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos0.99 難0.11", "s": 0.305, "f": 0}, {"x": 0.994, "y": 0.044, "c": "近傍", "n": "Hard Breaker [A]  n=1314 cos0.99 難0.04", "s": 0.355, "f": 0}, {"x": 0.994, "y": 0.086, "c": "近傍", "n": "仮想空間の旅人たち [A]  n=3683 cos0.99 難0.09", "s": 0.996, "f": 0}, {"x": 0.994, "y": 0.059, "c": "近傍", "n": "Danza Aestas [A]  n=2310 cos0.99 難0.06", "s": 0.625, "f": 0}, {"x": 0.995, "y": 0.125, "c": "近傍", "n": "夢縁 [A]  n=1910 cos1.00 難0.12", "s": 0.517, "f": 0}, {"x": 0.995, "y": 0.113, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos0.99 難0.11", "s": 0.857, "f": 0}, {"x": 0.997, "y": 0.195, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.19", "s": 0.76, "f": 0}, {"x": 0.996, "y": 0.194, "c": "近傍", "n": "Countdown to Heaven or Hell [A]  n=1126 cos1.00 難0.19", "s": 0.305, "f": 0}, {"x": 0.993, "y": 0.115, "c": "近傍", "n": "PILGRIM [A]  n=1299 cos0.99 難0.11", "s": 0.351, "f": 0}, {"x": 0.994, "y": 0.132, "c": "近傍", "n": "Override [A]  n=3124 cos0.99 難0.13", "s": 0.845, "f": 0}, {"x": 0.995, "y": 0.181, "c": "近傍", "n": "Stylus [A]  n=1635 cos0.99 難0.18", "s": 0.442, "f": 0}, {"x": 0.993, "y": 0.111, "c": "近傍", "n": "アイドル [L]  n=1439 cos0.99 難0.11", "s": 0.389, "f": 0}, {"x": 0.993, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.123, "c": "近傍", "n": "planarian [A]  n=2948 cos0.99 難-0.12", "s": 0.797, "f": 0}, {"x": 0.993, "y": 0.108, "c": "近傍", "n": "PAPAYAPA BASS [A]  n=3510 cos0.99 難0.11", "s": 0.949, "f": 0}, {"x": 0.992, "y": -0.065, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos0.99 難-0.06", "s": 0.26, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.21439546991735237}, {"a": 0, "b": 2, "w": 0.3161676072052293}, {"a": 0, "b": 3, "w": 0.3427638582566168}, {"a": 0, "b": 4, "w": 0.2831369167123535}, {"a": 0, "b": 5, "w": 0.31151186099624717}, {"a": 0, "b": 6, "w": 0.24123285320560794}, {"a": 0, "b": 7, "w": 0.15562419083588197}, {"a": 0, "b": 8, "w": 0.1630007905866454}, {"a": 0, "b": 9, "w": 0.3408407063644969}, {"a": 0, "b": 10, "w": 0.2729286173853651}, {"a": 0, "b": 11, "w": 0.5122037759496232}, {"a": 0, "b": 12, "w": 0.2273669716892176}, {"a": 0, "b": 13, "w": 0.10035193504222162}, {"a": 0, "b": 14, "w": 0.1784528953490535}, {"a": 0, "b": 15, "w": 0.3262227945726932}, {"a": 0, "b": 16, "w": 0.09721205306527447}, {"a": 0, "b": 17, "w": 0.15265352896525186}, {"a": 0, "b": 18, "w": 5.56874546475683e-11}, {"a": 0, "b": 19, "w": 0.12158147042429124}, {"a": 0, "b": 20, "w": 0.04072358487728234}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.174,hiY=0.222;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
