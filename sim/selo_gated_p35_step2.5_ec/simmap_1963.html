<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lighting Shower [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.324, "c": "種", "n": "Lighting Shower [A]  n=3194 cos1.00 難0.32", "s": 0.909, "f": 0}, {"x": 0.996, "y": 0.325, "c": "近傍", "n": "HYENA [A]  n=3455 cos1.00 難0.33", "s": 0.983, "f": 0}, {"x": 0.995, "y": 0.385, "c": "近傍", "n": "GENOCIDE [A]  n=3260 cos1.00 難0.39", "s": 0.928, "f": 0}, {"x": 0.995, "y": 0.386, "c": "近傍", "n": "Castle on the Moon [A]  n=3392 cos1.00 難0.39", "s": 0.966, "f": 0}, {"x": 0.997, "y": 0.183, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos1.00 難0.18", "s": 0.96, "f": 0}, {"x": 0.995, "y": 0.404, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos1.00 難0.40", "s": 0.243, "f": 0}, {"x": 0.995, "y": 0.25, "c": "近傍", "n": "Ubertreffen [A]  n=3511 cos1.00 難0.25", "s": 0.999, "f": 0}, {"x": 0.995, "y": 0.257, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos1.00 難0.26", "s": 0.476, "f": 0}, {"x": 0.997, "y": 0.142, "c": "近傍", "n": "Hat Surprise (Season 3) [A]  n=1474 cos1.00 難0.14", "s": 0.42, "f": 0}, {"x": 0.994, "y": 0.328, "c": "近傍", "n": "SUPER HEROINE!! [A]  n=1032 cos0.99 難0.33", "s": 0.294, "f": 0}, {"x": 0.997, "y": 0.139, "c": "近傍", "n": "Sakura Mirage [A]  n=3464 cos1.00 難0.14", "s": 0.986, "f": 0}, {"x": 0.995, "y": 0.238, "c": "近傍", "n": "HYPERION [A]  n=3347 cos0.99 難0.24", "s": 0.953, "f": 0}, {"x": 0.994, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.32", "s": 0.931, "f": 0}, {"x": 0.996, "y": 0.189, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos1.00 難0.19", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.175, "c": "近傍", "n": "LASER CRUSTER [H]  n=3204 cos1.00 難0.18", "s": 0.912, "f": 0}, {"x": 0.997, "y": 0.146, "c": "近傍", "n": "SOLID WYVERN [A]  n=2530 cos1.00 難0.15", "s": 0.72, "f": 0}, {"x": 0.998, "y": 0.107, "c": "近傍", "n": "Destiny Sword [A]  n=3494 cos1.00 難0.11", "s": 0.995, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos0.99 難0.30", "s": 0.51, "f": 0}, {"x": 0.994, "y": 0.255, "c": "近傍", "n": "IN BETWEEN [A]  n=1026 cos0.99 難0.25", "s": 0.292, "f": 0}, {"x": 0.997, "y": 0.127, "c": "近傍", "n": "Raspberry Potion (feat.あれたん & ぎゃるのしん☆) [A]  n=1551 cos1.00 難0.13", "s": 0.442, "f": 0}, {"x": 0.994, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.99 難0.38", "s": 0.92, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.18707690638553087}, {"a": 0, "b": 2, "w": 0.47366576060547316}, {"a": 0, "b": 3, "w": 0.2460543633627882}, {"a": 0, "b": 4, "w": 0.32340405152076845}, {"a": 0, "b": 5, "w": 0.293212862136904}, {"a": 0, "b": 6, "w": 0.3570578692008667}, {"a": 0, "b": 7, "w": 0.4039073209239197}, {"a": 0, "b": 8, "w": 0.4476312206610664}, {"a": 0, "b": 9, "w": 0.23164232362700032}, {"a": 0, "b": 10, "w": 0.388549081957401}, {"a": 0, "b": 11, "w": 0.49311589657981236}, {"a": 0, "b": 12, "w": 0.4157119814214213}, {"a": 0, "b": 13, "w": 0.09929555011435709}, {"a": 0, "b": 14, "w": 0.5274949538642011}, {"a": 0, "b": 15, "w": 0.5087144285385629}, {"a": 0, "b": 16, "w": 0.7069311054124673}, {"a": 0, "b": 17, "w": 4.425115829320703e-11}, {"a": 0, "b": 18, "w": 0.46665940210522083}, {"a": 0, "b": 19, "w": 0.500146494694761}, {"a": 0, "b": 20, "w": 0.46368522729228945}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.083,hiY=0.428;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
