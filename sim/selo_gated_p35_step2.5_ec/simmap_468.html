<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PUNISHER [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.795, "c": "種", "n": "PUNISHER [H]  n=2323 cos1.00 難-0.79", "s": 0.774, "f": 0}, {"x": 0.997, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos1.00 難-0.78", "s": 0.734, "f": 0}, {"x": 0.996, "y": -0.843, "c": "近傍", "n": "Catch Our Fire! [H]  n=1841 cos1.00 難-0.84", "s": 0.613, "f": 0}, {"x": 0.996, "y": -0.846, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos1.00 難-0.85", "s": 0.25, "f": 0}, {"x": 0.995, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos1.00 難-0.76", "s": 0.834, "f": 0}, {"x": 0.995, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos1.00 難-0.84", "s": 0.179, "f": 0}, {"x": 0.998, "y": -0.666, "c": "近傍", "n": "LAB [H]  n=1742 cos1.00 難-0.67", "s": 0.58, "f": 0}, {"x": 0.994, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.99 難-0.81", "s": 0.316, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.81", "s": 0.257, "f": 0}, {"x": 0.993, "y": -0.821, "c": "近傍", "n": "仮想空間の旅人たち [H]  n=2269 cos0.99 難-0.82", "s": 0.756, "f": 0}, {"x": 0.993, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos0.99 難-0.74", "s": 0.646, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.68", "s": 0.471, "f": 0}, {"x": 0.993, "y": -0.709, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos0.99 難-0.71", "s": 0.619, "f": 0}, {"x": 0.992, "y": -0.77, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos0.99 難-0.77", "s": 0.743, "f": 0}, {"x": 0.993, "y": -0.852, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos0.99 難-0.85", "s": 0.204, "f": 0}, {"x": 0.992, "y": -0.723, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos0.99 難-0.72", "s": 0.564, "f": 0}, {"x": 0.991, "y": -0.809, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=610 cos0.99 難-0.81", "s": 0.203, "f": 0}, {"x": 0.991, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.715, "f": 0}, {"x": 0.991, "y": -0.752, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.75", "s": 0.605, "f": 0}, {"x": 0.994, "y": -0.639, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.64", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.751, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [H]  n=2428 cos0.99 難-0.75", "s": 0.809, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6684372298576038}, {"a": 0, "b": 2, "w": 0.5571051487157928}, {"a": 0, "b": 3, "w": 0.5838346069954843}, {"a": 0, "b": 4, "w": 0.5465539562715506}, {"a": 0, "b": 5, "w": 0.5029302517200214}, {"a": 0, "b": 6, "w": 0.6602995722315064}, {"a": 0, "b": 7, "w": 0.43190623429487207}, {"a": 0, "b": 8, "w": 0.4541565030043111}, {"a": 0, "b": 9, "w": 0.33425220534516453}, {"a": 0, "b": 10, "w": 0.45553054550102867}, {"a": 0, "b": 11, "w": 0.401768891403528}, {"a": 0, "b": 12, "w": 0.4806824603359794}, {"a": 0, "b": 13, "w": 0.45290893512079533}, {"a": 0, "b": 14, "w": 0.37537365836755865}, {"a": 0, "b": 15, "w": 0.415396637717548}, {"a": 0, "b": 16, "w": 0.2564558273659042}, {"a": 0, "b": 17, "w": 0.357734243325433}, {"a": 0, "b": 18, "w": 0.3073790629950651}, {"a": 0, "b": 19, "w": 0.44148198703568253}, {"a": 0, "b": 20, "w": 4.1890046986736706e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.869,hiY=-0.622;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
