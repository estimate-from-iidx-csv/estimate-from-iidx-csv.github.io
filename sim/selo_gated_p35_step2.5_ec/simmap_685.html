<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">時空トラベローグ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.241, "c": "種", "n": "時空トラベローグ [H]  n=1454 cos1.00 難-1.24", "s": 0.637, "f": 0}, {"x": 0.994, "y": -1.263, "c": "近傍", "n": "24h Endurance Race [H]  n=878 cos0.99 難-1.26", "s": 0.384, "f": 0}, {"x": 0.994, "y": -1.263, "c": "近傍", "n": "未完成ノ蒸氣驅動乙女 [H]  n=695 cos0.99 難-1.26", "s": 0.304, "f": 0}, {"x": 0.993, "y": -1.218, "c": "近傍", "n": "Disco Killer Music Lover [H]  n=555 cos0.99 難-1.22", "s": 0.243, "f": 0}, {"x": 0.991, "y": -1.226, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.99 難-1.23", "s": 0.717, "f": 0}, {"x": 0.991, "y": -1.277, "c": "近傍", "n": "夢縁 [H]  n=1042 cos0.99 難-1.28", "s": 0.456, "f": 0}, {"x": 0.99, "y": -1.287, "c": "近傍", "n": "Meissa [H]  n=923 cos0.99 難-1.29", "s": 0.404, "f": 0}, {"x": 0.989, "y": -1.29, "c": "近傍", "n": "Begin [H]  n=613 cos0.99 難-1.29", "s": 0.268, "f": 0}, {"x": 0.987, "y": -1.267, "c": "近傍", "n": "Sirius [H]  n=512 cos0.99 難-1.27", "s": 0.224, "f": 0}, {"x": 0.99, "y": -1.16, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1670 cos0.99 難-1.16", "s": 0.731, "f": 0}, {"x": 0.99, "y": -1.324, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.99 難-1.32", "s": 0.444, "f": 0}, {"x": 0.988, "y": -1.175, "c": "近傍", "n": "ACT0 [H]  n=762 cos0.99 難-1.17", "s": 0.334, "f": 0}, {"x": 0.991, "y": -1.337, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.34", "s": 0.813, "f": 0}, {"x": 0.986, "y": -1.279, "c": "近傍", "n": "量子の海のリントヴルム [H]  n=2284 cos0.99 難-1.28", "s": 1.0, "f": 0}, {"x": 0.984, "y": -1.253, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.98 難-1.25", "s": 0.674, "f": 0}, {"x": 0.985, "y": -1.193, "c": "近傍", "n": "dica dica [H]  n=1133 cos0.99 難-1.19", "s": 0.496, "f": 0}, {"x": 0.991, "y": -1.364, "c": "近傍", "n": "Scarlet Moon [H]  n=1836 cos0.99 難-1.36", "s": 0.804, "f": 0}, {"x": 0.991, "y": -1.119, "c": "近傍", "n": "Slipstream [H]  n=1475 cos0.99 難-1.12", "s": 0.646, "f": 0}, {"x": 0.993, "y": -1.105, "c": "近傍", "n": "Bring The Fire [H]  n=669 cos0.99 難-1.10", "s": 0.293, "f": 0}, {"x": 0.985, "y": -1.17, "c": "近傍", "n": "Hat Surprise (Season 3) [H]  n=662 cos0.99 難-1.17", "s": 0.29, "f": 0}, {"x": 0.985, "y": -1.172, "c": "近傍", "n": "Realize Maze [H]  n=1574 cos0.99 難-1.17", "s": 0.689, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3675272755757655}, {"a": 0, "b": 2, "w": 0.4651049223399585}, {"a": 0, "b": 3, "w": 0.4436549446381203}, {"a": 0, "b": 4, "w": 0.36745280384195256}, {"a": 0, "b": 5, "w": 0.3566530923119706}, {"a": 0, "b": 6, "w": 0.30346815656336645}, {"a": 0, "b": 7, "w": 0.2911674441577058}, {"a": 0, "b": 8, "w": 0.23630334218193316}, {"a": 0, "b": 9, "w": 0.23341689118003606}, {"a": 0, "b": 10, "w": 0.3114553830510416}, {"a": 0, "b": 11, "w": 5.035805106246016e-11}, {"a": 0, "b": 12, "w": 0.31133789505521126}, {"a": 0, "b": 13, "w": 0.10436624559401164}, {"a": 0, "b": 14, "w": 0.14775970749391065}, {"a": 0, "b": 15, "w": 0.09914904640477118}, {"a": 0, "b": 16, "w": 0.21453864226725172}, {"a": 0, "b": 17, "w": 0.26262220792961477}, {"a": 0, "b": 18, "w": 0.40901841282952434}, {"a": 0, "b": 19, "w": 0.06818992792108491}, {"a": 0, "b": 20, "w": 0.1550922813302793}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.385,hiY=-1.084;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
