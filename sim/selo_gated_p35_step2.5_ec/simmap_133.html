<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">thunder [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.31, "c": "種", "n": "thunder [A]  n=2861 cos1.00 難-0.31", "s": 0.847, "f": 0}, {"x": 0.998, "y": -0.248, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos1.00 難-0.25", "s": 0.613, "f": 0}, {"x": 0.997, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos1.00 難-0.32", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.373, "c": "近傍", "n": "Saturn [H]  n=2300 cos1.00 難-0.37", "s": 0.681, "f": 0}, {"x": 0.995, "y": -0.29, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos1.00 難-0.29", "s": 0.3, "f": 0}, {"x": 0.995, "y": -0.299, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.748, "f": 0}, {"x": 0.994, "y": -0.3, "c": "近傍", "n": "STAR FIELD [A]  n=2390 cos0.99 難-0.30", "s": 0.707, "f": 0}, {"x": 0.995, "y": -0.195, "c": "近傍", "n": "Power of Love [A]  n=2905 cos1.00 難-0.20", "s": 0.86, "f": 0}, {"x": 0.995, "y": -0.449, "c": "近傍", "n": "quell～the seventh slave～ [H]  n=2525 cos0.99 難-0.45", "s": 0.747, "f": 0}, {"x": 0.994, "y": -0.209, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos0.99 難-0.21", "s": 0.828, "f": 0}, {"x": 0.998, "y": -0.077, "c": "近傍", "n": "e-motion 2003  -romantic extra- [A]  n=2824 cos1.00 難-0.08", "s": 0.836, "f": 0}, {"x": 0.993, "y": -0.317, "c": "近傍", "n": "Change the World [A]  n=2744 cos0.99 難-0.32", "s": 0.812, "f": 0}, {"x": 0.993, "y": -0.317, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2244 cos0.99 難-0.32", "s": 0.664, "f": 0}, {"x": 0.993, "y": -0.221, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.22", "s": 0.755, "f": 0}, {"x": 0.993, "y": -0.341, "c": "近傍", "n": "下弦の月 [A]  n=3049 cos0.99 難-0.34", "s": 0.902, "f": 0}, {"x": 0.992, "y": -0.295, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.99 難-0.29", "s": 0.739, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "abstract [A]  n=2276 cos0.99 難-0.25", "s": 0.674, "f": 0}, {"x": 0.992, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.20", "s": 0.629, "f": 0}, {"x": 0.992, "y": -0.258, "c": "近傍", "n": "Summerblue [A]  n=2192 cos0.99 難-0.26", "s": 0.649, "f": 0}, {"x": 0.995, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.99 難-0.56", "s": 0.783, "f": 0}, {"x": 0.992, "y": -0.349, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1733 cos0.99 難-0.35", "s": 0.513, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.672502697550265}, {"a": 0, "b": 2, "w": 0.44896103272368315}, {"a": 0, "b": 3, "w": 0.29457287390201814}, {"a": 0, "b": 4, "w": 0.47563661665666024}, {"a": 0, "b": 5, "w": 0.43971342469974095}, {"a": 0, "b": 6, "w": 0.4581970501519269}, {"a": 0, "b": 7, "w": 0.4899603796999735}, {"a": 0, "b": 8, "w": 0.44624427678147993}, {"a": 0, "b": 9, "w": 0.26972662055672847}, {"a": 0, "b": 10, "w": 0.7062730732920426}, {"a": 0, "b": 11, "w": 0.39010060085315745}, {"a": 0, "b": 12, "w": 0.3222643332652777}, {"a": 0, "b": 13, "w": 0.34871684576431483}, {"a": 0, "b": 14, "w": 5.617850629136001e-11}, {"a": 0, "b": 15, "w": 0.36488000917812846}, {"a": 0, "b": 16, "w": 0.3500888402688418}, {"a": 0, "b": 17, "w": 0.20414187482993795}, {"a": 0, "b": 18, "w": 0.10251021362972912}, {"a": 0, "b": 19, "w": 0.3540865526734819}, {"a": 0, "b": 20, "w": 0.15084093674128418}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.599,hiY=-0.039;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
