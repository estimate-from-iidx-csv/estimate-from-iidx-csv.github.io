<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">シンデレラ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.25, "c": "種", "n": "シンデレラ [A]  n=1872 cos1.00 難-0.25", "s": 0.538, "f": 0}, {"x": 0.995, "y": -0.336, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos1.00 難-0.34", "s": 0.765, "f": 0}, {"x": 0.994, "y": -0.367, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos0.99 難-0.37", "s": 0.791, "f": 0}, {"x": 0.995, "y": -0.408, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.41", "s": 0.359, "f": 0}, {"x": 0.992, "y": -0.194, "c": "近傍", "n": "smooooch・∀・ (Snail's House Remix) [A]  n=2451 cos0.99 難-0.19", "s": 0.704, "f": 0}, {"x": 0.992, "y": -0.255, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos0.99 難-0.26", "s": 0.804, "f": 0}, {"x": 0.992, "y": -0.208, "c": "近傍", "n": "次葉 -turn the page- [A]  n=3299 cos0.99 難-0.21", "s": 0.947, "f": 0}, {"x": 0.99, "y": -0.173, "c": "近傍", "n": "ACT [A]  n=2300 cos0.99 難-0.17", "s": 0.661, "f": 0}, {"x": 0.99, "y": -0.29, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.29", "s": 0.323, "f": 0}, {"x": 0.994, "y": -0.509, "c": "近傍", "n": "イガク [A]  n=1533 cos0.99 難-0.51", "s": 0.44, "f": 0}, {"x": 0.99, "y": -0.35, "c": "近傍", "n": "ビビデバ [A]  n=1667 cos0.99 難-0.35", "s": 0.479, "f": 0}, {"x": 0.99, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.828, "f": 0}, {"x": 0.99, "y": -0.268, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.99 難-0.27", "s": 0.771, "f": 0}, {"x": 0.991, "y": -0.414, "c": "近傍", "n": "バブリン [A]  n=1146 cos0.99 難-0.41", "s": 0.329, "f": 0}, {"x": 0.989, "y": -0.216, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.22", "s": 0.644, "f": 0}, {"x": 0.99, "y": -0.134, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos0.99 難-0.13", "s": 0.905, "f": 0}, {"x": 0.991, "y": -0.476, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos0.99 難-0.48", "s": 0.496, "f": 0}, {"x": 0.989, "y": -0.181, "c": "近傍", "n": "Magical [A]  n=3224 cos0.99 難-0.18", "s": 0.926, "f": 0}, {"x": 0.989, "y": -0.192, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.19", "s": 0.845, "f": 0}, {"x": 0.989, "y": -0.248, "c": "近傍", "n": "妖隠し -あやかしかくし- [A]  n=3482 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.018, "c": "近傍", "n": "Bitter & Lucky [A]  n=1495 cos0.99 難-0.02", "s": 0.429, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.408155880724998}, {"a": 0, "b": 2, "w": 0.3764403648983594}, {"a": 0, "b": 3, "w": 0.4413926263587753}, {"a": 0, "b": 4, "w": 0.4028051460418478}, {"a": 0, "b": 5, "w": 0.3626747863152875}, {"a": 0, "b": 6, "w": 0.3771782552735472}, {"a": 0, "b": 7, "w": 0.22205112064550925}, {"a": 0, "b": 8, "w": 0.3194847772283559}, {"a": 0, "b": 9, "w": 0.42508354285172834}, {"a": 0, "b": 10, "w": 0.2611787599609716}, {"a": 0, "b": 11, "w": 0.3325991152838812}, {"a": 0, "b": 12, "w": 0.25105998172634614}, {"a": 0, "b": 13, "w": 0.2915103709077307}, {"a": 0, "b": 14, "w": 0.09824598652373195}, {"a": 0, "b": 15, "w": 0.28436884569528575}, {"a": 0, "b": 16, "w": 0.14638519121652593}, {"a": 0, "b": 17, "w": 0.13021476200892002}, {"a": 0, "b": 18, "w": 0.3057894608268439}, {"a": 0, "b": 19, "w": 0.21743536569614785}, {"a": 0, "b": 20, "w": 4.8158588228375265e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.548,hiY=0.021;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
