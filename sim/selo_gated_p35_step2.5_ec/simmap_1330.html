<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Elisha [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.392, "c": "種", "n": "Elisha [H]  n=3406 cos1.00 難-0.39", "s": 0.983, "f": 0}, {"x": 0.978, "y": -0.786, "c": "近傍", "n": "Kailua [H]  n=2460 cos0.98 難-0.79", "s": 0.71, "f": 0}, {"x": 0.961, "y": -0.408, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3069 cos0.96 難-0.41", "s": 0.885, "f": 0}, {"x": 0.978, "y": 0.151, "c": "近傍", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2956 cos0.98 難0.15", "s": 0.853, "f": 0}, {"x": 0.96, "y": -0.192, "c": "近傍", "n": "ATOMIC AGE [A]  n=1610 cos0.96 難-0.19", "s": 0.465, "f": 0}, {"x": 0.963, "y": -0.808, "c": "近傍", "n": "栄冠のカンパネラ [H]  n=1245 cos0.96 難-0.81", "s": 0.359, "f": 0}, {"x": 0.962, "y": -0.809, "c": "近傍", "n": "Scharfrichter [H]  n=2653 cos0.96 難-0.81", "s": 0.765, "f": 0}, {"x": 0.949, "y": -0.473, "c": "近傍", "n": "TOGAKUSHI [H]  n=2630 cos0.95 難-0.47", "s": 0.759, "f": 0}, {"x": 0.949, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.95 難-0.41", "s": 0.899, "f": 0}, {"x": 0.948, "y": -0.438, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2752 cos0.95 難-0.44", "s": 0.794, "f": 0}, {"x": 0.971, "y": -1.054, "c": "近傍", "n": "Acid Pumper [H]  n=2061 cos0.97 難-1.05", "s": 0.595, "f": 0}, {"x": 0.95, "y": -0.806, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2823 cos0.95 難-0.81", "s": 0.814, "f": 0}, {"x": 0.945, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.95 難-0.72", "s": 0.929, "f": 0}, {"x": 0.988, "y": -1.267, "c": "近傍", "n": "NZM [H]  n=1596 cos0.99 難-1.27", "s": 0.46, "f": 0}, {"x": 0.94, "y": -0.37, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [H]  n=3067 cos0.94 難-0.37", "s": 0.885, "f": 0}, {"x": 0.945, "y": -0.798, "c": "近傍", "n": "Unbelief [H]  n=1475 cos0.95 難-0.80", "s": 0.426, "f": 0}, {"x": 0.943, "y": -0.069, "c": "近傍", "n": "Donkey Donk [A]  n=3466 cos0.94 難-0.07", "s": 1.0, "f": 0}, {"x": 0.952, "y": -0.982, "c": "近傍", "n": "魔法のかくれんぼ [H]  n=1209 cos0.95 難-0.98", "s": 0.349, "f": 0}, {"x": 0.937, "y": -0.373, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.94 難-0.37", "s": 0.271, "f": 0}, {"x": 0.944, "y": -0.822, "c": "近傍", "n": "EROICA [H]  n=2238 cos0.94 難-0.82", "s": 0.646, "f": 0}, {"x": 0.937, "y": -0.411, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.94 難-0.41", "s": 0.323, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3677584750555908}, {"a": 0, "b": 2, "w": 0.25498572536531505}, {"a": 0, "b": 3, "w": 0.41768650236622273}, {"a": 0, "b": 4, "w": 0.36909682630263474}, {"a": 0, "b": 5, "w": 0.20970851290788972}, {"a": 0, "b": 6, "w": 0.36170543376630426}, {"a": 0, "b": 7, "w": 0.1813890153821095}, {"a": 0, "b": 8, "w": 0.2836106145559023}, {"a": 0, "b": 9, "w": 0.2904609780526538}, {"a": 0, "b": 10, "w": 0.39061442215460906}, {"a": 0, "b": 11, "w": 0.2913807357599201}, {"a": 0, "b": 12, "w": 0.25667060260230046}, {"a": 0, "b": 13, "w": 0.64479154346336}, {"a": 0, "b": 14, "w": 0.08537249334616759}, {"a": 0, "b": 15, "w": 0.17345027181661155}, {"a": 0, "b": 16, "w": 2.3551716132885758e-11}, {"a": 0, "b": 17, "w": 0.30898063771515527}, {"a": 0, "b": 18, "w": 0.21569397648803668}, {"a": 0, "b": 19, "w": 0.1387770554238863}, {"a": 0, "b": 20, "w": 0.19893530754118882}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.932,hiX=1.005,loY=-1.380,hiY=0.265;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
