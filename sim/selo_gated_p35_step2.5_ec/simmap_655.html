<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ヒマワリ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.744, "c": "種", "n": "ヒマワリ [H]  n=2139 cos1.00 難-0.74", "s": 0.685, "f": 0}, {"x": 0.996, "y": -0.789, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos1.00 難-0.79", "s": 0.533, "f": 0}, {"x": 0.995, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.562, "f": 0}, {"x": 0.994, "y": -0.796, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.80", "s": 0.729, "f": 0}, {"x": 0.995, "y": -0.833, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos1.00 難-0.83", "s": 0.502, "f": 0}, {"x": 0.996, "y": -0.607, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2052 cos1.00 難-0.61", "s": 0.657, "f": 0}, {"x": 0.994, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.84", "s": 0.64, "f": 0}, {"x": 0.998, "y": -0.907, "c": "近傍", "n": "New Lights [H]  n=1942 cos1.00 難-0.91", "s": 0.622, "f": 0}, {"x": 0.993, "y": -0.806, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.81", "s": 0.529, "f": 0}, {"x": 0.993, "y": -0.626, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.99 難-0.63", "s": 0.729, "f": 0}, {"x": 0.996, "y": -0.561, "c": "近傍", "n": "smile [H]  n=1932 cos1.00 難-0.56", "s": 0.619, "f": 0}, {"x": 0.991, "y": -0.768, "c": "近傍", "n": "†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [H]  n=3123 cos0.99 難-0.77", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.939, "c": "近傍", "n": "Venom [H]  n=1708 cos1.00 難-0.94", "s": 0.547, "f": 0}, {"x": 0.991, "y": -0.681, "c": "近傍", "n": "Debtty Daddy [H]  n=1563 cos0.99 難-0.68", "s": 0.5, "f": 0}, {"x": 0.991, "y": -0.738, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.74", "s": 0.598, "f": 0}, {"x": 0.99, "y": -0.825, "c": "近傍", "n": "Antigravity [H]  n=2035 cos0.99 難-0.82", "s": 0.652, "f": 0}, {"x": 0.99, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.65", "s": 0.728, "f": 0}, {"x": 0.996, "y": -0.508, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos1.00 難-0.51", "s": 0.937, "f": 0}, {"x": 0.989, "y": -0.751, "c": "近傍", "n": "Triple Counter [H]  n=2862 cos0.99 難-0.75", "s": 0.916, "f": 0}, {"x": 0.992, "y": -0.56, "c": "近傍", "n": "Thunderbolt [H]  n=2738 cos0.99 難-0.56", "s": 0.877, "f": 0}, {"x": 0.988, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.72", "s": 0.65, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43652118181548716}, {"a": 0, "b": 2, "w": 0.5548100546338058}, {"a": 0, "b": 3, "w": 0.535316590669795}, {"a": 0, "b": 4, "w": 0.5230455286882115}, {"a": 0, "b": 5, "w": 0.6265920610355036}, {"a": 0, "b": 6, "w": 0.5412106488666892}, {"a": 0, "b": 7, "w": 0.7373637579723163}, {"a": 0, "b": 8, "w": 0.35607309552242783}, {"a": 0, "b": 9, "w": 0.4330710579129058}, {"a": 0, "b": 10, "w": 0.562717308032459}, {"a": 0, "b": 11, "w": 0.43078078220021154}, {"a": 0, "b": 12, "w": 0.5145517711237576}, {"a": 0, "b": 13, "w": 0.43579825605528455}, {"a": 0, "b": 14, "w": 0.40754523120930675}, {"a": 0, "b": 15, "w": 0.3390764545453989}, {"a": 0, "b": 16, "w": 0.4043331125263635}, {"a": 0, "b": 17, "w": 0.6060054889467434}, {"a": 0, "b": 18, "w": 4.700162481441339e-11}, {"a": 0, "b": 19, "w": 0.4354304237573411}, {"a": 0, "b": 20, "w": 0.34464239768992433}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.973,hiY=-0.474;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
