<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">がっつり陰キャ!? 怪盗いいんちょの億劫^^; [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.808, "c": "種", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [H]  n=2005 cos1.00 難-0.81", "s": 0.733, "f": 0}, {"x": 0.994, "y": -0.715, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos0.99 難-0.71", "s": 0.67, "f": 0}, {"x": 0.992, "y": -0.788, "c": "近傍", "n": "God Mind [H]  n=718 cos0.99 難-0.79", "s": 0.263, "f": 0}, {"x": 0.992, "y": -0.833, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [H]  n=1248 cos0.99 難-0.83", "s": 0.456, "f": 0}, {"x": 0.992, "y": -0.719, "c": "近傍", "n": "ANCHOR [H]  n=2040 cos0.99 難-0.72", "s": 0.746, "f": 0}, {"x": 0.994, "y": -0.998, "c": "近傍", "n": "Vinculum stellarum [H]  n=1443 cos0.99 難-1.00", "s": 0.528, "f": 0}, {"x": 0.994, "y": -0.997, "c": "近傍", "n": "ORCA [H]  n=1536 cos0.99 難-1.00", "s": 0.562, "f": 0}, {"x": 0.991, "y": -0.74, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.99 難-0.74", "s": 0.271, "f": 0}, {"x": 0.99, "y": -0.878, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.99 難-0.88", "s": 0.812, "f": 0}, {"x": 0.993, "y": -0.997, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.00", "s": 0.49, "f": 0}, {"x": 0.992, "y": -0.632, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.63", "s": 0.894, "f": 0}, {"x": 0.989, "y": -0.784, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.78", "s": 0.805, "f": 0}, {"x": 0.991, "y": -0.936, "c": "近傍", "n": "suspicions [H]  n=721 cos0.99 難-0.94", "s": 0.264, "f": 0}, {"x": 0.989, "y": -0.786, "c": "近傍", "n": "EVANESCENT [H]  n=1488 cos0.99 難-0.79", "s": 0.544, "f": 0}, {"x": 0.99, "y": -0.926, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1066 cos0.99 難-0.93", "s": 0.39, "f": 0}, {"x": 0.989, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.81", "s": 0.282, "f": 0}, {"x": 0.989, "y": -0.752, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.75", "s": 0.576, "f": 0}, {"x": 0.991, "y": -0.644, "c": "近傍", "n": "THE DAY OF JUBILATIONS [H]  n=2130 cos0.99 難-0.64", "s": 0.779, "f": 0}, {"x": 0.988, "y": -0.86, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1851 cos0.99 難-0.86", "s": 0.677, "f": 0}, {"x": 0.989, "y": -0.645, "c": "近傍", "n": "神謳 -RESONANCE- [H]  n=2734 cos0.99 難-0.65", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.836, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-0.84", "s": 0.197, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.17639765353980597}, {"a": 0, "b": 2, "w": 0.4276063175974716}, {"a": 0, "b": 3, "w": 0.3625333419427569}, {"a": 0, "b": 4, "w": 0.38428957122526286}, {"a": 0, "b": 5, "w": 0.2530316622421057}, {"a": 0, "b": 6, "w": 0.3188836415486658}, {"a": 0, "b": 7, "w": 0.24159791177575807}, {"a": 0, "b": 8, "w": 3.806477355539073e-11}, {"a": 0, "b": 9, "w": 0.3367007473224015}, {"a": 0, "b": 10, "w": 0.19556818829783307}, {"a": 0, "b": 11, "w": 0.10961526368456809}, {"a": 0, "b": 12, "w": 0.059529710008381476}, {"a": 0, "b": 13, "w": 0.16149394140040463}, {"a": 0, "b": 14, "w": 0.352554994960373}, {"a": 0, "b": 15, "w": 0.19698031548137385}, {"a": 0, "b": 16, "w": 0.13984512497351642}, {"a": 0, "b": 17, "w": 0.2833576356460198}, {"a": 0, "b": 18, "w": 0.27466449854689357}, {"a": 0, "b": 19, "w": 0.1680362524579767}, {"a": 0, "b": 20, "w": 0.19018415553851553}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.028,hiY=-0.603;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
