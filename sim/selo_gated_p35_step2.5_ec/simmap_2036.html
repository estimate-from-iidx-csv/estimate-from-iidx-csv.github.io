<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Para siempre [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.311, "c": "種", "n": "Para siempre [A]  n=2673 cos1.00 難0.31", "s": 0.74, "f": 0}, {"x": 0.991, "y": 0.28, "c": "近傍", "n": "Xyndrome [A]  n=2511 cos0.99 難0.28", "s": 0.695, "f": 0}, {"x": 0.991, "y": 0.375, "c": "近傍", "n": "See You Again [A]  n=1074 cos0.99 難0.38", "s": 0.297, "f": 0}, {"x": 0.993, "y": 0.113, "c": "近傍", "n": "kors k's Let's make an Image Song! [A]  n=994 cos0.99 難0.11", "s": 0.275, "f": 0}, {"x": 0.991, "y": 0.235, "c": "近傍", "n": "AGEHA [L]  n=2373 cos0.99 難0.24", "s": 0.657, "f": 0}, {"x": 0.991, "y": 0.456, "c": "近傍", "n": "smooooch・∀・ [L]  n=1442 cos0.99 難0.46", "s": 0.399, "f": 0}, {"x": 0.99, "y": 0.215, "c": "近傍", "n": "ATHER [A]  n=3422 cos0.99 難0.22", "s": 0.947, "f": 0}, {"x": 0.992, "y": 0.068, "c": "近傍", "n": "Volcanic Dragon [A]  n=3184 cos0.99 難0.07", "s": 0.882, "f": 0}, {"x": 0.992, "y": 0.083, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難0.08", "s": 0.861, "f": 0}, {"x": 0.99, "y": 0.405, "c": "近傍", "n": "Ritual of Anubis [A]  n=2272 cos0.99 難0.40", "s": 0.629, "f": 0}, {"x": 0.99, "y": 0.101, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos0.99 難0.10", "s": 0.264, "f": 0}, {"x": 0.989, "y": 0.374, "c": "近傍", "n": "Lisa-RICCIA [A]  n=1131 cos0.99 難0.37", "s": 0.313, "f": 0}, {"x": 0.992, "y": 0.023, "c": "近傍", "n": "ミュージック・アワー [A]  n=2508 cos0.99 難0.02", "s": 0.694, "f": 0}, {"x": 0.988, "y": 0.244, "c": "近傍", "n": "Wonderland [A]  n=3133 cos0.99 難0.24", "s": 0.867, "f": 0}, {"x": 0.987, "y": 0.373, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3114 cos0.99 難0.37", "s": 0.862, "f": 0}, {"x": 0.987, "y": 0.363, "c": "近傍", "n": "Jungle Eater [A]  n=2411 cos0.99 難0.36", "s": 0.667, "f": 0}, {"x": 0.991, "y": -0.021, "c": "近傍", "n": "SigSig [A]  n=3612 cos0.99 難-0.02", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.503, "c": "近傍", "n": "On the FM [A]  n=3148 cos0.99 難0.50", "s": 0.872, "f": 0}, {"x": 0.987, "y": 0.237, "c": "近傍", "n": "Just Gimme [A]  n=1340 cos0.99 難0.24", "s": 0.371, "f": 0}, {"x": 0.987, "y": 0.147, "c": "近傍", "n": "チェイスチェイスジョーカーズのうた (オニスタイルリミックス) [A]  n=1498 cos0.99 難0.15", "s": 0.415, "f": 0}, {"x": 0.99, "y": -0.015, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.02", "s": 0.785, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28177654698226007}, {"a": 0, "b": 2, "w": 0.37138076562887856}, {"a": 0, "b": 3, "w": 0.3673446791137832}, {"a": 0, "b": 4, "w": 0.36413088758866663}, {"a": 0, "b": 5, "w": 0.372699218451763}, {"a": 0, "b": 6, "w": 0.3003728221268058}, {"a": 0, "b": 7, "w": 0.399141243861197}, {"a": 0, "b": 8, "w": 3.782685276121356e-11}, {"a": 0, "b": 9, "w": 0.32680273106841806}, {"a": 0, "b": 10, "w": 0.13276799426637098}, {"a": 0, "b": 11, "w": 0.15054309809977884}, {"a": 0, "b": 12, "w": 0.3959065450873023}, {"a": 0, "b": 13, "w": 0.16230732173623275}, {"a": 0, "b": 14, "w": 0.24482831177024855}, {"a": 0, "b": 15, "w": 0.24866381640884394}, {"a": 0, "b": 16, "w": 0.1255720512302344}, {"a": 0, "b": 17, "w": 0.09269113740360313}, {"a": 0, "b": 18, "w": 0.23220253176485572}, {"a": 0, "b": 19, "w": 0.23331578713903778}, {"a": 0, "b": 20, "w": 0.07302850146049344}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.063,hiY=0.544;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
