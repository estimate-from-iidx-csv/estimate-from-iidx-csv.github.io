<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">

 <div id="legend"></div>
 <div id="plot"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.754, "c": "種", "n": "金野火織の金色提言 [A]  n=2862 cos1.00 難1.75", "s": 0.934, "f": 0}, {"x": 0.983, "y": 1.794, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.98 難1.79", "s": 0.887, "f": 0}, {"x": 0.98, "y": 1.728, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2753 cos0.98 難1.73", "s": 0.898, "f": 0}, {"x": 0.978, "y": 1.779, "c": "近傍", "n": "カジノファイヤーことみちゃん [L]  n=1076 cos0.98 難1.78", "s": 0.351, "f": 0}, {"x": 0.976, "y": 1.704, "c": "近傍", "n": "KAISER PHOENIX [A]  n=2968 cos0.98 難1.70", "s": 0.969, "f": 0}, {"x": 0.975, "y": 1.796, "c": "近傍", "n": "Quakes [A]  n=2875 cos0.98 難1.80", "s": 0.938, "f": 0}, {"x": 0.984, "y": 1.903, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2472 cos0.98 難1.90", "s": 0.807, "f": 0}, {"x": 0.975, "y": 1.679, "c": "近傍", "n": "POLKAMANIA [L]  n=817 cos0.98 難1.68", "s": 0.267, "f": 0}, {"x": 0.981, "y": 1.616, "c": "近傍", "n": "HAERETICUS [A]  n=3064 cos0.98 難1.62", "s": 1.0, "f": 0}, {"x": 0.98, "y": 1.617, "c": "近傍", "n": "Artist [A]  n=2459 cos0.98 難1.62", "s": 0.803, "f": 0}, {"x": 0.972, "y": 1.711, "c": "近傍", "n": "Devil's Gear [A]  n=3000 cos0.97 難1.71", "s": 0.979, "f": 0}, {"x": 0.975, "y": 1.652, "c": "近傍", "n": "GiGaGaHell [A]  n=2176 cos0.97 難1.65", "s": 0.71, "f": 0}, {"x": 0.975, "y": 1.869, "c": "近傍", "n": "シムルグの目醒め [A]  n=2840 cos0.97 難1.87", "s": 0.927, "f": 0}, {"x": 0.971, "y": 1.702, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2854 cos0.97 難1.70", "s": 0.931, "f": 0}, {"x": 0.983, "y": 1.567, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.98 難1.57", "s": 0.794, "f": 0}, {"x": 0.971, "y": 1.679, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [A]  n=2324 cos0.97 難1.68", "s": 0.758, "f": 0}, {"x": 0.977, "y": 1.599, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.98 難1.60", "s": 0.729, "f": 0}, {"x": 0.973, "y": 1.87, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [A]  n=2947 cos0.97 難1.87", "s": 0.962, "f": 0}, {"x": 0.969, "y": 1.793, "c": "近傍", "n": "Initiation [A]  n=2955 cos0.97 難1.79", "s": 0.964, "f": 0}, {"x": 0.976, "y": 1.602, "c": "近傍", "n": "Macho Monky [A]  n=2727 cos0.98 難1.60", "s": 0.89, "f": 0}, {"x": 0.969, "y": 1.701, "c": "近傍", "n": "God Mind [A]  n=1021 cos0.97 難1.70", "s": 0.333, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5403448409613503}, {"a": 0, "b": 2, "w": 0.45668013356048964}, {"a": 0, "b": 3, "w": 0.3226754144641295}, {"a": 0, "b": 4, "w": 0.4136339036927015}, {"a": 0, "b": 5, "w": 0.3941480529779292}, {"a": 0, "b": 6, "w": 0.49443443955641864}, {"a": 0, "b": 7, "w": 0.3786407041987502}, {"a": 0, "b": 8, "w": 0.5372151120161938}, {"a": 0, "b": 9, "w": 0.46774639626513626}, {"a": 0, "b": 10, "w": 0.4047020037098801}, {"a": 0, "b": 11, "w": 0.32971377966845117}, {"a": 0, "b": 12, "w": 0.4035604054347338}, {"a": 0, "b": 13, "w": 0.23348650096278}, {"a": 0, "b": 14, "w": 0.5606692258633188}, {"a": 0, "b": 15, "w": 0.27569384749007086}, {"a": 0, "b": 16, "w": 0.4785193829945734}, {"a": 0, "b": 17, "w": 0.14837042354420082}, {"a": 0, "b": 18, "w": 1.6514234424391816e-11}, {"a": 0, "b": 19, "w": 0.45826150416633804}, {"a": 0, "b": 20, "w": 0.015569466424558809}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.966,hiX=1.003,loY=1.540,hiY=1.930;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
