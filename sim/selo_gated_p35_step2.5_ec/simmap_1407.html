<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 4 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.658, "c": "種", "n": "Level 4 [H]  n=1523 cos1.00 難-0.66", "s": 0.447, "f": 0}, {"x": 0.992, "y": -0.531, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2310 cos0.99 難-0.53", "s": 0.678, "f": 0}, {"x": 0.988, "y": -0.571, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3319 cos0.99 難-0.57", "s": 0.974, "f": 0}, {"x": 0.99, "y": -0.971, "c": "近傍", "n": "LOCUS OF THE TRAVEL [H]  n=1281 cos0.99 難-0.97", "s": 0.376, "f": 0}, {"x": 0.98, "y": -0.77, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos0.98 難-0.77", "s": 0.655, "f": 0}, {"x": 0.98, "y": -0.583, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.98 難-0.58", "s": 0.702, "f": 0}, {"x": 0.983, "y": -0.919, "c": "近傍", "n": "FlyAway [H]  n=630 cos0.98 難-0.92", "s": 0.185, "f": 0}, {"x": 0.978, "y": -0.806, "c": "近傍", "n": "CADENZA [H]  n=732 cos0.98 難-0.81", "s": 0.215, "f": 0}, {"x": 0.979, "y": -0.833, "c": "近傍", "n": "Xerulean [H]  n=981 cos0.98 難-0.83", "s": 0.288, "f": 0}, {"x": 0.981, "y": -0.386, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.98 難-0.39", "s": 0.705, "f": 0}, {"x": 0.977, "y": -0.572, "c": "近傍", "n": "VOID [H]  n=878 cos0.98 難-0.57", "s": 0.258, "f": 0}, {"x": 0.976, "y": -0.59, "c": "近傍", "n": "Feel The Beat [H]  n=2624 cos0.98 難-0.59", "s": 0.77, "f": 0}, {"x": 0.977, "y": -0.812, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.98 難-0.81", "s": 0.278, "f": 0}, {"x": 0.976, "y": -0.813, "c": "近傍", "n": "Purple Perplex [H]  n=1797 cos0.98 難-0.81", "s": 0.528, "f": 0}, {"x": 0.98, "y": -0.987, "c": "近傍", "n": "Dahlia [H]  n=1112 cos0.98 難-0.99", "s": 0.326, "f": 0}, {"x": 0.975, "y": -0.528, "c": "近傍", "n": "Level 3 [H]  n=1946 cos0.98 難-0.53", "s": 0.571, "f": 0}, {"x": 0.987, "y": -0.178, "c": "近傍", "n": "Snake Stick [H]  n=3406 cos0.99 難-0.18", "s": 1.0, "f": 0}, {"x": 0.974, "y": -0.689, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2334 cos0.97 難-0.69", "s": 0.685, "f": 0}, {"x": 0.978, "y": -1.002, "c": "近傍", "n": "& Intelligence [H]  n=1407 cos0.98 難-1.00", "s": 0.413, "f": 0}, {"x": 0.973, "y": -0.717, "c": "近傍", "n": "The Sampling Paradise [H]  n=3031 cos0.97 難-0.72", "s": 0.89, "f": 0}, {"x": 0.974, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.97 難-0.80", "s": 0.63, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5865212681963303}, {"a": 0, "b": 2, "w": 0.47616087499081916}, {"a": 0, "b": 3, "w": 0.5091244219505007}, {"a": 0, "b": 4, "w": 0.20241205247779237}, {"a": 0, "b": 5, "w": 0.25934708971460274}, {"a": 0, "b": 6, "w": 0.3110624991687807}, {"a": 0, "b": 7, "w": 0.23606046304829653}, {"a": 0, "b": 8, "w": 0.3404629614835093}, {"a": 0, "b": 9, "w": 0.279515387481615}, {"a": 0, "b": 10, "w": 0.2951323174736301}, {"a": 0, "b": 11, "w": 0.22518281995411216}, {"a": 0, "b": 12, "w": 0.26109265692613126}, {"a": 0, "b": 13, "w": 0.2384972271049709}, {"a": 0, "b": 14, "w": 0.33404859730998826}, {"a": 0, "b": 15, "w": 0.22106390921937003}, {"a": 0, "b": 16, "w": 0.4591857676044657}, {"a": 0, "b": 17, "w": 0.1159767796165857}, {"a": 0, "b": 18, "w": 0.2037079872125439}, {"a": 0, "b": 19, "w": 2.5881741194666574e-11}, {"a": 0, "b": 20, "w": 0.049596310909297836}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=-1.067,hiY=-0.112;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
