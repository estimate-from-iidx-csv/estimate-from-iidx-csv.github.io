<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ATHER [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.982, "c": "種", "n": "ATHER [L]  n=1585 cos1.00 難0.98", "s": 0.449, "f": 0}, {"x": 0.98, "y": 0.949, "c": "近傍", "n": "King of Tribe [A]  n=594 cos0.98 難0.95", "s": 0.168, "f": 0}, {"x": 0.983, "y": 0.859, "c": "近傍", "n": "TROOPERS [A]  n=3528 cos0.98 難0.86", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.815, "c": "近傍", "n": "LIVE DRIVING!! feat. 花たん [A]  n=2562 cos0.99 難0.81", "s": 0.726, "f": 0}, {"x": 0.981, "y": 0.865, "c": "近傍", "n": "DOMINION [A]  n=3448 cos0.98 難0.87", "s": 0.977, "f": 0}, {"x": 0.982, "y": 0.805, "c": "近傍", "n": "The Least 100sec [A]  n=3395 cos0.98 難0.81", "s": 0.962, "f": 0}, {"x": 0.976, "y": 1.045, "c": "近傍", "n": "Amazing Mirage [L]  n=3185 cos0.98 難1.05", "s": 0.903, "f": 0}, {"x": 0.975, "y": 0.915, "c": "近傍", "n": "Super Rush [A]  n=3502 cos0.98 難0.92", "s": 0.993, "f": 0}, {"x": 0.972, "y": 0.997, "c": "近傍", "n": "Push on Beats!～音ゲの国のeX-ストリーマー～ [A]  n=2150 cos0.97 難1.00", "s": 0.609, "f": 0}, {"x": 0.973, "y": 1.031, "c": "近傍", "n": "Rave Patroller [A]  n=2943 cos0.97 難1.03", "s": 0.834, "f": 0}, {"x": 0.972, "y": 1.066, "c": "近傍", "n": "RINNE [A]  n=2037 cos0.97 難1.07", "s": 0.577, "f": 0}, {"x": 0.976, "y": 1.159, "c": "近傍", "n": "Sense 2007 [A]  n=3338 cos0.98 難1.16", "s": 0.946, "f": 0}, {"x": 0.974, "y": 1.146, "c": "近傍", "n": "OTENAMI Hurricane [A]  n=3187 cos0.97 難1.15", "s": 0.903, "f": 0}, {"x": 0.971, "y": 1.107, "c": "近傍", "n": "Invitation from Mr.C [A]  n=3174 cos0.97 難1.11", "s": 0.9, "f": 0}, {"x": 0.97, "y": 1.083, "c": "近傍", "n": "UNDO THE NIGHT [A]  n=648 cos0.97 難1.08", "s": 0.184, "f": 0}, {"x": 0.968, "y": 0.99, "c": "近傍", "n": "Angel's Ladder [A]  n=2498 cos0.97 難0.99", "s": 0.708, "f": 0}, {"x": 0.98, "y": 1.261, "c": "近傍", "n": "電腦都市 [A]  n=1375 cos0.98 難1.26", "s": 0.39, "f": 0}, {"x": 0.97, "y": 0.814, "c": "近傍", "n": "Beat Radiance [L]  n=3485 cos0.97 難0.81", "s": 0.988, "f": 0}, {"x": 0.97, "y": 1.146, "c": "近傍", "n": "Cosmic Cat [L]  n=3126 cos0.97 難1.15", "s": 0.886, "f": 0}, {"x": 0.967, "y": 1.092, "c": "近傍", "n": "AO-1 [A]  n=3339 cos0.97 難1.09", "s": 0.946, "f": 0}, {"x": 0.966, "y": 1.059, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2999 cos0.97 難1.06", "s": 0.85, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.25118515541729003}, {"a": 0, "b": 2, "w": 0.2899155744469042}, {"a": 0, "b": 3, "w": 0.32369856751469595}, {"a": 0, "b": 4, "w": 0.3066518206252655}, {"a": 0, "b": 5, "w": 0.3187987693616793}, {"a": 0, "b": 6, "w": 0.18944668037188162}, {"a": 0, "b": 7, "w": 0.19806617732667198}, {"a": 0, "b": 8, "w": 0.09204146587469209}, {"a": 0, "b": 9, "w": 0.13679957269224197}, {"a": 0, "b": 10, "w": 0.15343619130594544}, {"a": 0, "b": 11, "w": 0.22148641899099053}, {"a": 0, "b": 12, "w": 0.18742748866567815}, {"a": 0, "b": 13, "w": 0.13130762466737245}, {"a": 0, "b": 14, "w": 2.498301565623251e-11}, {"a": 0, "b": 15, "w": 0.09126438221005329}, {"a": 0, "b": 16, "w": 0.2774681518760177}, {"a": 0, "b": 17, "w": 0.025097565131371402}, {"a": 0, "b": 18, "w": 0.11597021988661738}, {"a": 0, "b": 19, "w": 0.08450583467099793}, {"a": 0, "b": 20, "w": 0.058919050460683575}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.963,hiX=1.003,loY=0.769,hiY=1.297;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
