<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">rage against usual [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.248, "c": "種", "n": "rage against usual [H]  n=2637 cos1.00 難-0.25", "s": 0.731, "f": 0}, {"x": 0.996, "y": -0.301, "c": "近傍", "n": "天空の夜明け [H]  n=3607 cos1.00 難-0.30", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.284, "c": "近傍", "n": "fffff [H]  n=3223 cos0.99 難-0.28", "s": 0.894, "f": 0}, {"x": 0.989, "y": -0.348, "c": "近傍", "n": "F [H]  n=3316 cos0.99 難-0.35", "s": 0.919, "f": 0}, {"x": 0.997, "y": -0.571, "c": "近傍", "n": "少年は空を辿る [H]  n=2731 cos1.00 難-0.57", "s": 0.757, "f": 0}, {"x": 0.99, "y": -0.056, "c": "近傍", "n": "Sephirot [A]  n=3055 cos0.99 難-0.06", "s": 0.847, "f": 0}, {"x": 0.988, "y": -0.195, "c": "近傍", "n": "ハイ*ビスカス ft. Kanae Asaba [A]  n=3286 cos0.99 難-0.20", "s": 0.911, "f": 0}, {"x": 0.991, "y": -0.489, "c": "近傍", "n": "Thor's Hammer [H]  n=3183 cos0.99 難-0.49", "s": 0.882, "f": 0}, {"x": 0.987, "y": -0.174, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos0.99 難-0.17", "s": 0.853, "f": 0}, {"x": 0.987, "y": -0.244, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.24", "s": 0.768, "f": 0}, {"x": 0.987, "y": -0.295, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.99 難-0.29", "s": 0.692, "f": 0}, {"x": 0.986, "y": -0.195, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.19", "s": 0.851, "f": 0}, {"x": 0.986, "y": -0.179, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.18", "s": 0.917, "f": 0}, {"x": 0.992, "y": -0.573, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.57", "s": 0.659, "f": 0}, {"x": 0.994, "y": -0.607, "c": "近傍", "n": "snow storm [H]  n=3002 cos0.99 難-0.61", "s": 0.832, "f": 0}, {"x": 0.986, "y": -0.259, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.99 難-0.26", "s": 0.803, "f": 0}, {"x": 0.987, "y": -0.437, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.44", "s": 0.69, "f": 0}, {"x": 0.993, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.502, "f": 0}, {"x": 0.986, "y": -0.314, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.31", "s": 0.588, "f": 0}, {"x": 0.986, "y": -0.12, "c": "近傍", "n": "SPEEDY CAT [A]  n=2412 cos0.99 難-0.12", "s": 0.669, "f": 0}, {"x": 0.987, "y": -0.023, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [A]  n=3125 cos0.99 難-0.02", "s": 0.866, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5620889164712971}, {"a": 0, "b": 2, "w": 0.26127047978322004}, {"a": 0, "b": 3, "w": 0.16868508032967244}, {"a": 0, "b": 4, "w": 0.570584764863914}, {"a": 0, "b": 5, "w": 0.2601337642082686}, {"a": 0, "b": 6, "w": 0.18031979648565222}, {"a": 0, "b": 7, "w": 0.2975871786654083}, {"a": 0, "b": 8, "w": 0.02095160458587897}, {"a": 0, "b": 9, "w": 0.13335793565218357}, {"a": 0, "b": 10, "w": 5.108669043352165e-11}, {"a": 0, "b": 11, "w": 0.13226690768401694}, {"a": 0, "b": 12, "w": 0.12682115213612544}, {"a": 0, "b": 13, "w": 0.18736558549836158}, {"a": 0, "b": 14, "w": 0.4078257048864302}, {"a": 0, "b": 15, "w": 0.11411086870062015}, {"a": 0, "b": 16, "w": 0.1539666473051544}, {"a": 0, "b": 17, "w": 0.35899057290725533}, {"a": 0, "b": 18, "w": 0.12029428346756976}, {"a": 0, "b": 19, "w": 0.131928560739775}, {"a": 0, "b": 20, "w": 0.09930650764775495}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.656,hiY=0.024;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
