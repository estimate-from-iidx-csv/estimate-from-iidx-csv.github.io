<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Flash Back 90's [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.439, "c": "種", "n": "Flash Back 90's [L]  n=1988 cos1.00 難0.44", "s": 0.536, "f": 0}, {"x": 0.997, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos1.00 難0.45", "s": 0.479, "f": 0}, {"x": 0.996, "y": 0.459, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos1.00 難0.46", "s": 0.864, "f": 0}, {"x": 0.995, "y": 0.472, "c": "近傍", "n": "Pollinosis [A]  n=3354 cos1.00 難0.47", "s": 0.904, "f": 0}, {"x": 0.996, "y": 0.363, "c": "近傍", "n": "Moving on [A]  n=3017 cos1.00 難0.36", "s": 0.813, "f": 0}, {"x": 0.995, "y": 0.36, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1132 cos1.00 難0.36", "s": 0.305, "f": 0}, {"x": 0.995, "y": 0.43, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3710 cos0.99 難0.43", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.397, "c": "近傍", "n": "DESIRE [A]  n=3355 cos0.99 難0.40", "s": 0.904, "f": 0}, {"x": 0.995, "y": 0.343, "c": "近傍", "n": "Show Me All Your Love [A]  n=1153 cos1.00 難0.34", "s": 0.311, "f": 0}, {"x": 0.995, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.99 難0.38", "s": 0.871, "f": 0}, {"x": 0.994, "y": 0.446, "c": "近傍", "n": "Carry Me Away [A]  n=3350 cos0.99 難0.45", "s": 0.903, "f": 0}, {"x": 0.994, "y": 0.377, "c": "近傍", "n": "FLOWER [A]  n=3683 cos0.99 難0.38", "s": 0.993, "f": 0}, {"x": 0.995, "y": 0.312, "c": "近傍", "n": "LAST DAY [A]  n=2629 cos1.00 難0.31", "s": 0.709, "f": 0}, {"x": 0.994, "y": 0.453, "c": "近傍", "n": "diagram [A]  n=3166 cos0.99 難0.45", "s": 0.853, "f": 0}, {"x": 0.994, "y": 0.493, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1359 cos0.99 難0.49", "s": 0.366, "f": 0}, {"x": 0.994, "y": 0.357, "c": "近傍", "n": "GloriosA [A]  n=1782 cos0.99 難0.36", "s": 0.48, "f": 0}, {"x": 0.994, "y": 0.439, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2693 cos0.99 難0.44", "s": 0.726, "f": 0}, {"x": 0.994, "y": 0.376, "c": "近傍", "n": "Bow shock!! [A]  n=2972 cos0.99 難0.38", "s": 0.801, "f": 0}, {"x": 0.996, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.26", "s": 0.277, "f": 0}, {"x": 0.995, "y": 0.589, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3554 cos1.00 難0.59", "s": 0.958, "f": 0}, {"x": 0.995, "y": 0.293, "c": "近傍", "n": "Advent Infamous [A]  n=2555 cos1.00 難0.29", "s": 0.689, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1868566899817774}, {"a": 0, "b": 2, "w": 0.3944334604445672}, {"a": 0, "b": 3, "w": 0.37807704845248247}, {"a": 0, "b": 4, "w": 0.32688811002565077}, {"a": 0, "b": 5, "w": 0.39526441545409274}, {"a": 0, "b": 6, "w": 0.1256522091896961}, {"a": 0, "b": 7, "w": 0.2807914313647285}, {"a": 0, "b": 8, "w": 0.3627718058942059}, {"a": 0, "b": 9, "w": 0.15182962249762266}, {"a": 0, "b": 10, "w": 5.15062437145275e-11}, {"a": 0, "b": 11, "w": 0.17418762169957935}, {"a": 0, "b": 12, "w": 0.389656423197695}, {"a": 0, "b": 13, "w": 0.262381746574899}, {"a": 0, "b": 14, "w": 0.18907517852079614}, {"a": 0, "b": 15, "w": 0.3025805231821054}, {"a": 0, "b": 16, "w": 0.2614457172934145}, {"a": 0, "b": 17, "w": 0.2806404587900939}, {"a": 0, "b": 18, "w": 0.34600786742995404}, {"a": 0, "b": 19, "w": 0.11520652619907723}, {"a": 0, "b": 20, "w": 0.35930488731072285}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=0.235,hiY=0.616;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
