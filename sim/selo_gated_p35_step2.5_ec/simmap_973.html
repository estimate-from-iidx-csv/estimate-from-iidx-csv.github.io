<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Piano Samurai [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.033, "c": "種", "n": "Piano Samurai [A]  n=2816 cos1.00 難-0.03", "s": 0.769, "f": 0}, {"x": 0.996, "y": -0.057, "c": "近傍", "n": "Ventriloquist [A]  n=2650 cos1.00 難-0.06", "s": 0.723, "f": 0}, {"x": 0.998, "y": 0.121, "c": "近傍", "n": "MA・TSU・RI [A]  n=2109 cos1.00 難0.12", "s": 0.576, "f": 0}, {"x": 0.996, "y": -0.137, "c": "近傍", "n": "Hold My Hand [A]  n=2574 cos1.00 難-0.14", "s": 0.703, "f": 0}, {"x": 0.997, "y": 0.117, "c": "近傍", "n": "RAVE SYNDROME [A]  n=1568 cos1.00 難0.12", "s": 0.428, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "First Resolution [A]  n=2082 cos1.00 難0.01", "s": 0.568, "f": 0}, {"x": 0.995, "y": 0.031, "c": "近傍", "n": "The Story Begins [A]  n=2767 cos1.00 難0.03", "s": 0.755, "f": 0}, {"x": 0.994, "y": -0.061, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3048 cos0.99 難-0.06", "s": 0.832, "f": 0}, {"x": 0.995, "y": 0.088, "c": "近傍", "n": "CaptivAte～浄化～ [A]  n=3648 cos1.00 難0.09", "s": 0.996, "f": 0}, {"x": 0.994, "y": -0.007, "c": "近傍", "n": "Vitamin [A]  n=1127 cos0.99 難-0.01", "s": 0.308, "f": 0}, {"x": 0.996, "y": -0.203, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos1.00 難-0.20", "s": 0.744, "f": 0}, {"x": 0.995, "y": 0.083, "c": "近傍", "n": "Exhaust Hype [A]  n=3389 cos0.99 難0.08", "s": 0.925, "f": 0}, {"x": 0.995, "y": 0.106, "c": "近傍", "n": "garden [A]  n=3224 cos0.99 難0.11", "s": 0.88, "f": 0}, {"x": 0.994, "y": -0.002, "c": "近傍", "n": "ANAGMA [A]  n=2588 cos0.99 難-0.00", "s": 0.706, "f": 0}, {"x": 0.995, "y": 0.099, "c": "近傍", "n": "ハードベース・フェスタ [A]  n=3457 cos0.99 難0.10", "s": 0.944, "f": 0}, {"x": 0.996, "y": -0.23, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos1.00 難-0.23", "s": 0.876, "f": 0}, {"x": 0.995, "y": 0.105, "c": "近傍", "n": "朧 [L]  n=3664 cos0.99 難0.10", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.058, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3090 cos0.99 難-0.06", "s": 0.843, "f": 0}, {"x": 0.995, "y": -0.188, "c": "近傍", "n": "深愛のリグレット [A]  n=2677 cos0.99 難-0.19", "s": 0.731, "f": 0}, {"x": 0.994, "y": -0.082, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos0.99 難-0.08", "s": 0.882, "f": 0}, {"x": 0.994, "y": 0.054, "c": "近傍", "n": "ミラージュ・レジデンス [A]  n=2809 cos0.99 難0.05", "s": 0.767, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42962079486174787}, {"a": 0, "b": 2, "w": 0.5363303426863342}, {"a": 0, "b": 3, "w": 0.3183515477655895}, {"a": 0, "b": 4, "w": 0.4573068454435464}, {"a": 0, "b": 5, "w": 0.012465143499563514}, {"a": 0, "b": 6, "w": 0.1613782556812503}, {"a": 0, "b": 7, "w": 0.3046387567937535}, {"a": 0, "b": 8, "w": 0.39536801597455296}, {"a": 0, "b": 9, "w": 0.35320623250317695}, {"a": 0, "b": 10, "w": 0.3200693179803151}, {"a": 0, "b": 11, "w": 0.35197320225072726}, {"a": 0, "b": 12, "w": 0.3439117300945238}, {"a": 0, "b": 13, "w": 0.27989949790227064}, {"a": 0, "b": 14, "w": 0.3101032330975598}, {"a": 0, "b": 15, "w": 0.21448932204502924}, {"a": 0, "b": 16, "w": 0.3269302491568532}, {"a": 0, "b": 17, "w": 0.0697741099787802}, {"a": 0, "b": 18, "w": 0.13829456201037083}, {"a": 0, "b": 19, "w": 5.2812310080696534e-11}, {"a": 0, "b": 20, "w": 0.30243673098426327}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.259,hiY=0.149;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
