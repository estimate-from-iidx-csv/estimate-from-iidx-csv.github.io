<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Beyond The Earth [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.656, "c": "種", "n": "Beyond The Earth [H]  n=2287 cos1.00 難-0.66", "s": 0.766, "f": 0}, {"x": 0.991, "y": -0.483, "c": "近傍", "n": "Don't Stop The Music feat. Kanae Asaba [A]  n=2220 cos0.99 難-0.48", "s": 0.743, "f": 0}, {"x": 0.991, "y": -0.446, "c": "近傍", "n": "INFERNO [A]  n=2475 cos0.99 難-0.45", "s": 0.829, "f": 0}, {"x": 0.988, "y": -0.515, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1774 cos0.99 難-0.51", "s": 0.594, "f": 0}, {"x": 0.987, "y": -0.57, "c": "近傍", "n": "KILL EACH OTHER [H]  n=2022 cos0.99 難-0.57", "s": 0.677, "f": 0}, {"x": 0.989, "y": -0.411, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.41", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.803, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos0.99 難-0.80", "s": 0.718, "f": 0}, {"x": 0.986, "y": -0.714, "c": "近傍", "n": "Make A Difference [H]  n=1366 cos0.99 難-0.71", "s": 0.457, "f": 0}, {"x": 0.986, "y": -0.563, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1934 cos0.99 難-0.56", "s": 0.648, "f": 0}, {"x": 0.985, "y": -0.728, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.73", "s": 0.55, "f": 0}, {"x": 0.985, "y": -0.66, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2347 cos0.98 難-0.66", "s": 0.786, "f": 0}, {"x": 0.988, "y": -0.39, "c": "近傍", "n": "Ristaccia [H]  n=2302 cos0.99 難-0.39", "s": 0.771, "f": 0}, {"x": 0.987, "y": -0.349, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1733 cos0.99 難-0.35", "s": 0.58, "f": 0}, {"x": 0.983, "y": -0.689, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2334 cos0.98 難-0.69", "s": 0.782, "f": 0}, {"x": 0.983, "y": -0.752, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1602 cos0.98 難-0.75", "s": 0.537, "f": 0}, {"x": 0.984, "y": -0.483, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1933 cos0.98 難-0.48", "s": 0.647, "f": 0}, {"x": 0.989, "y": -0.28, "c": "近傍", "n": "Ganymede [H]  n=2744 cos0.99 難-0.28", "s": 0.919, "f": 0}, {"x": 0.983, "y": -0.806, "c": "近傍", "n": "BabeL ～Grand Story～ [H]  n=2101 cos0.98 難-0.81", "s": 0.704, "f": 0}, {"x": 0.984, "y": -0.475, "c": "近傍", "n": "それは花火のような恋 [H]  n=2650 cos0.98 難-0.48", "s": 0.887, "f": 0}, {"x": 0.983, "y": -0.789, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.98 難-0.79", "s": 0.558, "f": 0}, {"x": 0.983, "y": -0.827, "c": "近傍", "n": "B.O.D.Y. [H]  n=1306 cos0.98 難-0.83", "s": 0.437, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.29757429446122585}, {"a": 0, "b": 2, "w": 0.19570791913485786}, {"a": 0, "b": 3, "w": 0.2957161229062044}, {"a": 0, "b": 4, "w": 0.2601211296514}, {"a": 0, "b": 5, "w": 0.2973000179832044}, {"a": 0, "b": 6, "w": 0.2015494297399394}, {"a": 0, "b": 7, "w": 0.03661790252390118}, {"a": 0, "b": 8, "w": 0.22142793320939191}, {"a": 0, "b": 9, "w": 0.15675181662931814}, {"a": 0, "b": 10, "w": 0.09422627433420838}, {"a": 0, "b": 11, "w": 0.2597266300919787}, {"a": 0, "b": 12, "w": 0.25045886118916216}, {"a": 0, "b": 13, "w": 0.15920006613334492}, {"a": 0, "b": 14, "w": 0.04820627139768918}, {"a": 0, "b": 15, "w": 0.06514576770839975}, {"a": 0, "b": 16, "w": 0.005587126623361693}, {"a": 0, "b": 17, "w": 0.1425502348435006}, {"a": 0, "b": 18, "w": 4.315869883697587e-11}, {"a": 0, "b": 19, "w": 0.133539176113187}, {"a": 0, "b": 20, "w": 0.16181383992929743}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.871,hiY=-0.236;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
