<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Bahram Attack-猫叉Master Remix- [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.594, "c": "種", "n": "Bahram Attack-猫叉Master Remix- [L]  n=2455 cos1.00 難0.59", "s": 0.655, "f": 0}, {"x": 0.996, "y": 0.503, "c": "近傍", "n": "錬成人間トリコロイダー [A]  n=2948 cos1.00 難0.50", "s": 0.786, "f": 0}, {"x": 0.994, "y": 0.652, "c": "近傍", "n": "HIGH [L]  n=882 cos0.99 難0.65", "s": 0.235, "f": 0}, {"x": 0.993, "y": 0.568, "c": "近傍", "n": "Venom [A]  n=3552 cos0.99 難0.57", "s": 0.947, "f": 0}, {"x": 0.994, "y": 0.683, "c": "近傍", "n": "Rampage [A]  n=3572 cos0.99 難0.68", "s": 0.953, "f": 0}, {"x": 0.991, "y": 0.669, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [A]  n=1972 cos0.99 難0.67", "s": 0.526, "f": 0}, {"x": 0.991, "y": 0.678, "c": "近傍", "n": "Sword of Vengeance [A]  n=1658 cos0.99 難0.68", "s": 0.442, "f": 0}, {"x": 0.992, "y": 0.749, "c": "近傍", "n": "グッバイ宣言 [L]  n=1315 cos0.99 難0.75", "s": 0.351, "f": 0}, {"x": 0.99, "y": 0.739, "c": "近傍", "n": "GRID KNIGHT [L]  n=3179 cos0.99 難0.74", "s": 0.848, "f": 0}, {"x": 0.995, "y": 0.393, "c": "近傍", "n": "EDEN [L]  n=1743 cos1.00 難0.39", "s": 0.465, "f": 0}, {"x": 0.986, "y": 0.539, "c": "近傍", "n": "mosaic [A]  n=3750 cos0.99 難0.54", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.398, "c": "近傍", "n": "ここからよろしく大作戦143 [L]  n=874 cos0.99 難0.40", "s": 0.233, "f": 0}, {"x": 0.988, "y": 0.722, "c": "近傍", "n": "Idola [A]  n=3594 cos0.99 難0.72", "s": 0.958, "f": 0}, {"x": 0.991, "y": 0.796, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3433 cos0.99 難0.80", "s": 0.915, "f": 0}, {"x": 0.991, "y": 0.383, "c": "近傍", "n": "怪物 [L]  n=1259 cos0.99 難0.38", "s": 0.336, "f": 0}, {"x": 0.984, "y": 0.644, "c": "近傍", "n": "HYPE THE CORE [A]  n=3106 cos0.98 難0.64", "s": 0.828, "f": 0}, {"x": 0.985, "y": 0.487, "c": "近傍", "n": "BIGソムタム [A]  n=3093 cos0.98 難0.49", "s": 0.825, "f": 0}, {"x": 0.99, "y": 0.373, "c": "近傍", "n": "Unicorn tail [A]  n=3495 cos0.99 難0.37", "s": 0.932, "f": 0}, {"x": 0.984, "y": 0.498, "c": "近傍", "n": "in the Sky [A]  n=3438 cos0.98 難0.50", "s": 0.917, "f": 0}, {"x": 0.986, "y": 0.758, "c": "近傍", "n": "Say YEEEAHH [A]  n=3513 cos0.99 難0.76", "s": 0.937, "f": 0}, {"x": 0.988, "y": 0.385, "c": "近傍", "n": "Time to Air [A]  n=3600 cos0.99 難0.39", "s": 0.96, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5425823714701634}, {"a": 0, "b": 2, "w": 0.5421979145178015}, {"a": 0, "b": 3, "w": 0.46838037256933485}, {"a": 0, "b": 4, "w": 0.1721475528154367}, {"a": 0, "b": 5, "w": 0.1378250465862425}, {"a": 0, "b": 6, "w": 0.4171307289683297}, {"a": 0, "b": 7, "w": 0.1525935828980004}, {"a": 0, "b": 8, "w": 0.2710443804439522}, {"a": 0, "b": 9, "w": 0.5266993996837087}, {"a": 0, "b": 10, "w": 0.05732889756784054}, {"a": 0, "b": 11, "w": 0.4867599610813137}, {"a": 0, "b": 12, "w": 3.2410296668672345e-11}, {"a": 0, "b": 13, "w": 0.40126490974186646}, {"a": 0, "b": 14, "w": 0.34855566632502544}, {"a": 0, "b": 15, "w": 0.14697367012308216}, {"a": 0, "b": 16, "w": 0.043432648995269885}, {"a": 0, "b": 17, "w": 0.43201695853959365}, {"a": 0, "b": 18, "w": 0.2661822873245382}, {"a": 0, "b": 19, "w": 0.09026421668602591}, {"a": 0, "b": 20, "w": 0.34605086403280994}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.339,hiY=0.830;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
