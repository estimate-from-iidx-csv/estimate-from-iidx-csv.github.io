<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">moon_child [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.735, "c": "種", "n": "moon_child [A]  n=3574 cos1.00 難0.74", "s": 0.959, "f": 0}, {"x": 0.997, "y": 0.711, "c": "近傍", "n": "BRAVE OUT [L]  n=696 cos1.00 難0.71", "s": 0.187, "f": 0}, {"x": 0.995, "y": 0.727, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1074 cos1.00 難0.73", "s": 0.288, "f": 0}, {"x": 0.994, "y": 0.795, "c": "近傍", "n": "Persephone [A]  n=3438 cos0.99 難0.80", "s": 0.923, "f": 0}, {"x": 0.992, "y": 0.704, "c": "近傍", "n": "Dahlia [A]  n=1923 cos0.99 難0.70", "s": 0.516, "f": 0}, {"x": 0.995, "y": 0.873, "c": "近傍", "n": "oratio [A]  n=3448 cos1.00 難0.87", "s": 0.926, "f": 0}, {"x": 0.993, "y": 0.616, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3094 cos0.99 難0.62", "s": 0.831, "f": 0}, {"x": 0.995, "y": 0.584, "c": "近傍", "n": "LADYBIRD [A]  n=2809 cos1.00 難0.58", "s": 0.754, "f": 0}, {"x": 0.995, "y": 0.586, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.59", "s": 0.717, "f": 0}, {"x": 0.991, "y": 0.696, "c": "近傍", "n": "GHOST [A]  n=2246 cos0.99 難0.70", "s": 0.603, "f": 0}, {"x": 0.991, "y": 0.795, "c": "近傍", "n": "gigadelic [A]  n=3542 cos0.99 難0.80", "s": 0.951, "f": 0}, {"x": 0.992, "y": 0.611, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1840 cos0.99 難0.61", "s": 0.494, "f": 0}, {"x": 0.992, "y": 0.861, "c": "近傍", "n": "終焔のClaudia [A]  n=1707 cos0.99 難0.86", "s": 0.458, "f": 0}, {"x": 0.99, "y": 0.752, "c": "近傍", "n": "RALLY '25 [A]  n=1108 cos0.99 難0.75", "s": 0.297, "f": 0}, {"x": 0.99, "y": 0.771, "c": "近傍", "n": "Friction[!]Function [A]  n=2923 cos0.99 難0.77", "s": 0.785, "f": 0}, {"x": 0.989, "y": 0.735, "c": "近傍", "n": "Super Freak [A]  n=2092 cos0.99 難0.74", "s": 0.562, "f": 0}, {"x": 0.992, "y": 0.589, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3554 cos0.99 難0.59", "s": 0.954, "f": 0}, {"x": 0.989, "y": 0.791, "c": "近傍", "n": "電光 [A]  n=1713 cos0.99 難0.79", "s": 0.46, "f": 0}, {"x": 0.989, "y": 0.727, "c": "近傍", "n": "Out of Control [A]  n=1758 cos0.99 難0.73", "s": 0.472, "f": 0}, {"x": 0.993, "y": 0.547, "c": "近傍", "n": "雪月花 [A]  n=3725 cos0.99 難0.55", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.527, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.53", "s": 0.853, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6687902605588294}, {"a": 0, "b": 2, "w": 0.4122728068305269}, {"a": 0, "b": 3, "w": 0.37868547144908127}, {"a": 0, "b": 4, "w": 0.11771930972107547}, {"a": 0, "b": 5, "w": 0.5798770029016501}, {"a": 0, "b": 6, "w": 0.5523784902492976}, {"a": 0, "b": 7, "w": 0.5849180244518838}, {"a": 0, "b": 8, "w": 0.5877435947696064}, {"a": 0, "b": 9, "w": 0.45491722438051385}, {"a": 0, "b": 10, "w": 0.46424232196383}, {"a": 0, "b": 11, "w": 0.40316844532160223}, {"a": 0, "b": 12, "w": 0.32101979990584883}, {"a": 0, "b": 13, "w": 0.2177564571361834}, {"a": 0, "b": 14, "w": 0.11458267330314742}, {"a": 0, "b": 15, "w": 3.2028046881293903e-11}, {"a": 0, "b": 16, "w": 0.33965269422114197}, {"a": 0, "b": 17, "w": 0.06932087103911477}, {"a": 0, "b": 18, "w": 0.20670196299297783}, {"a": 0, "b": 19, "w": 0.5030875480025351}, {"a": 0, "b": 20, "w": 0.5032116065747858}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.499,hiY=0.901;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
