<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">beatonic nation [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.203, "c": "種", "n": "beatonic nation [A]  n=2335 cos1.00 難-0.20", "s": 0.671, "f": 0}, {"x": 0.998, "y": -0.256, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos1.00 難-0.26", "s": 0.953, "f": 0}, {"x": 0.997, "y": -0.192, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos1.00 難-0.19", "s": 0.845, "f": 0}, {"x": 0.997, "y": -0.259, "c": "近傍", "n": "MOON [A]  n=3205 cos1.00 難-0.26", "s": 0.92, "f": 0}, {"x": 0.997, "y": -0.255, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos1.00 難-0.26", "s": 0.804, "f": 0}, {"x": 0.997, "y": -0.134, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos1.00 難-0.13", "s": 0.905, "f": 0}, {"x": 0.996, "y": -0.188, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3193 cos1.00 難-0.19", "s": 0.917, "f": 0}, {"x": 0.995, "y": -0.184, "c": "近傍", "n": "ヒマワリ [A]  n=3298 cos1.00 難-0.18", "s": 0.947, "f": 0}, {"x": 0.995, "y": -0.123, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos1.00 難-0.12", "s": 0.717, "f": 0}, {"x": 0.995, "y": -0.248, "c": "近傍", "n": "妖隠し -あやかしかくし- [A]  n=3482 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos1.00 難-0.29", "s": 0.828, "f": 0}, {"x": 0.995, "y": -0.197, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos0.99 難-0.20", "s": 0.989, "f": 0}, {"x": 0.995, "y": -0.312, "c": "近傍", "n": "セカンドピアス [A]  n=2576 cos1.00 難-0.31", "s": 0.74, "f": 0}, {"x": 0.995, "y": -0.095, "c": "近傍", "n": "オルタネイトβ [A]  n=3292 cos1.00 難-0.09", "s": 0.945, "f": 0}, {"x": 0.995, "y": -0.29, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.29", "s": 0.323, "f": 0}, {"x": 0.994, "y": -0.179, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos0.99 難-0.18", "s": 0.883, "f": 0}, {"x": 0.994, "y": -0.163, "c": "近傍", "n": "Rainbow after snow [A]  n=3289 cos0.99 難-0.16", "s": 0.945, "f": 0}, {"x": 0.996, "y": -0.047, "c": "近傍", "n": "QQQ [A]  n=2895 cos1.00 難-0.05", "s": 0.831, "f": 0}, {"x": 0.996, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.04", "s": 0.8, "f": 0}, {"x": 0.995, "y": -0.351, "c": "近傍", "n": "タシカナモノ [A]  n=2492 cos0.99 難-0.35", "s": 0.716, "f": 0}, {"x": 0.996, "y": -0.39, "c": "近傍", "n": "ANAGRAMS I to Y [A]  n=2713 cos1.00 難-0.39", "s": 0.779, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5157813248892098}, {"a": 0, "b": 2, "w": 0.3318446211274465}, {"a": 0, "b": 3, "w": 0.45488559427289077}, {"a": 0, "b": 4, "w": 0.43470739170796835}, {"a": 0, "b": 5, "w": 0.4164249120138831}, {"a": 0, "b": 6, "w": 0.2789919301576749}, {"a": 0, "b": 7, "w": 0.24996912685845152}, {"a": 0, "b": 8, "w": 7.943812274646689e-11}, {"a": 0, "b": 9, "w": 0.21618369224966572}, {"a": 0, "b": 10, "w": 0.21561355738757526}, {"a": 0, "b": 11, "w": 0.053323937017525136}, {"a": 0, "b": 12, "w": 0.2760994773507448}, {"a": 0, "b": 13, "w": 0.23707114112941285}, {"a": 0, "b": 14, "w": 0.00986627988740385}, {"a": 0, "b": 15, "w": 0.06245137973865067}, {"a": 0, "b": 16, "w": 0.16629655872311655}, {"a": 0, "b": 17, "w": 0.14864348446591202}, {"a": 0, "b": 18, "w": 0.06798029355604318}, {"a": 0, "b": 19, "w": 0.2535277261422154}, {"a": 0, "b": 20, "w": 0.2856671154036857}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.418,hiY=-0.008;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
