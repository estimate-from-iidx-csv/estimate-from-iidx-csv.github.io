<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PARADISE LOST [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.883, "c": "種", "n": "PARADISE LOST [A]  n=2879 cos1.00 難1.88", "s": 0.937, "f": 0}, {"x": 0.982, "y": 1.959, "c": "近傍", "n": "Cross Fire [A]  n=948 cos0.98 難1.96", "s": 0.308, "f": 0}, {"x": 0.979, "y": 1.869, "c": "近傍", "n": "シムルグの目醒め [A]  n=2840 cos0.98 難1.87", "s": 0.924, "f": 0}, {"x": 0.984, "y": 2.041, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1606 cos0.98 難2.04", "s": 0.523, "f": 0}, {"x": 0.979, "y": 1.796, "c": "近傍", "n": "Quakes [A]  n=2875 cos0.98 難1.80", "s": 0.936, "f": 0}, {"x": 0.983, "y": 1.705, "c": "近傍", "n": "LOCUS OF THE TRAVEL [A]  n=2105 cos0.98 難1.71", "s": 0.685, "f": 0}, {"x": 0.981, "y": 2.063, "c": "近傍", "n": "COSMIC RAY [A]  n=1985 cos0.98 難2.06", "s": 0.646, "f": 0}, {"x": 0.974, "y": 1.96, "c": "近傍", "n": "invoker [L]  n=2635 cos0.97 難1.96", "s": 0.857, "f": 0}, {"x": 0.973, "y": 1.917, "c": "近傍", "n": "紫陽花 -AZISAI- [L]  n=1077 cos0.97 難1.92", "s": 0.35, "f": 0}, {"x": 0.974, "y": 1.794, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.97 難1.79", "s": 0.885, "f": 0}, {"x": 0.977, "y": 1.728, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2753 cos0.98 難1.73", "s": 0.896, "f": 0}, {"x": 0.978, "y": 1.703, "c": "近傍", "n": "NZM [A]  n=2975 cos0.98 難1.70", "s": 0.968, "f": 0}, {"x": 0.978, "y": 1.711, "c": "近傍", "n": "Devil's Gear [A]  n=3000 cos0.98 難1.71", "s": 0.976, "f": 0}, {"x": 0.98, "y": 2.096, "c": "近傍", "n": "REVOLVER [L]  n=1708 cos0.98 難2.10", "s": 0.556, "f": 0}, {"x": 0.972, "y": 1.791, "c": "近傍", "n": "2 Beasts Unchained [A]  n=1873 cos0.97 難1.79", "s": 0.61, "f": 0}, {"x": 0.97, "y": 1.862, "c": "近傍", "n": "華麗なる大犬円舞曲 [A]  n=2636 cos0.97 難1.86", "s": 0.858, "f": 0}, {"x": 0.971, "y": 1.958, "c": "近傍", "n": "Glitch N Ride [A]  n=1282 cos0.97 難1.96", "s": 0.417, "f": 0}, {"x": 0.973, "y": 1.7, "c": "近傍", "n": "GuNGNiR [A]  n=3073 cos0.97 難1.70", "s": 1.0, "f": 0}, {"x": 0.99, "y": 2.216, "c": "近傍", "n": "Ignis†Irae [A]  n=2008 cos0.99 難2.22", "s": 0.653, "f": 0}, {"x": 0.981, "y": 1.599, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.98 難1.60", "s": 0.727, "f": 0}, {"x": 0.97, "y": 1.741, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.97 難1.74", "s": 0.238, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.26837573804694825}, {"a": 0, "b": 2, "w": 0.2018504684528688}, {"a": 0, "b": 3, "w": 0.29399825238053345}, {"a": 0, "b": 4, "w": 0.19323962384591986}, {"a": 0, "b": 5, "w": 0.15601425539438674}, {"a": 0, "b": 6, "w": 0.23369656476532374}, {"a": 0, "b": 7, "w": 0.11086486232591253}, {"a": 0, "b": 8, "w": 0.06707844829996823}, {"a": 0, "b": 9, "w": 0.12962320150965922}, {"a": 0, "b": 10, "w": 0.16328591466847053}, {"a": 0, "b": 11, "w": 0.12500956662874363}, {"a": 0, "b": 12, "w": 0.1894507368021685}, {"a": 0, "b": 13, "w": 0.16230995100087642}, {"a": 0, "b": 14, "w": 0.05886090573260927}, {"a": 0, "b": 15, "w": 0.01757830710835484}, {"a": 0, "b": 16, "w": 0.0769219571422679}, {"a": 0, "b": 17, "w": 2.4917179430872238e-11}, {"a": 0, "b": 18, "w": 0.344870462727939}, {"a": 0, "b": 19, "w": 0.24368613331249156}, {"a": 0, "b": 20, "w": 0.07144510005185423}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=1.550,hiY=2.265;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
