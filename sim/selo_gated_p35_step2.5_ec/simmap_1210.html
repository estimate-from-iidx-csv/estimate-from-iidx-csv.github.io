<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">深愛のリグレット [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.188, "c": "種", "n": "深愛のリグレット [A]  n=2677 cos1.00 難-0.19", "s": 0.725, "f": 0}, {"x": 0.998, "y": -0.23, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos1.00 難-0.23", "s": 0.87, "f": 0}, {"x": 0.998, "y": -0.233, "c": "近傍", "n": "Follow Tomorrow [A]  n=3529 cos1.00 難-0.23", "s": 0.956, "f": 0}, {"x": 0.999, "y": -0.082, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos1.00 難-0.08", "s": 0.876, "f": 0}, {"x": 0.997, "y": -0.196, "c": "近傍", "n": "Last Burning [A]  n=3170 cos1.00 難-0.20", "s": 0.859, "f": 0}, {"x": 0.997, "y": -0.234, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos1.00 難-0.23", "s": 0.813, "f": 0}, {"x": 0.997, "y": -0.203, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos1.00 難-0.20", "s": 0.739, "f": 0}, {"x": 0.997, "y": -0.174, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos1.00 難-0.17", "s": 0.635, "f": 0}, {"x": 0.996, "y": -0.195, "c": "近傍", "n": "リグレット [A]  n=3196 cos1.00 難-0.19", "s": 0.866, "f": 0}, {"x": 0.996, "y": -0.194, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos1.00 難-0.19", "s": 0.355, "f": 0}, {"x": 0.996, "y": -0.137, "c": "近傍", "n": "Hold My Hand [A]  n=2574 cos1.00 難-0.14", "s": 0.697, "f": 0}, {"x": 0.997, "y": -0.305, "c": "近傍", "n": "ラブキラ☆スプラッシュ [A]  n=2337 cos1.00 難-0.30", "s": 0.633, "f": 0}, {"x": 0.996, "y": -0.194, "c": "近傍", "n": "Turii ～Panta rhei～ [A]  n=3426 cos1.00 難-0.19", "s": 0.928, "f": 0}, {"x": 0.995, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos1.00 難-0.20", "s": 0.576, "f": 0}, {"x": 0.996, "y": -0.251, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.25", "s": 0.644, "f": 0}, {"x": 0.996, "y": -0.286, "c": "近傍", "n": "アルストロメリア [A]  n=3691 cos1.00 難-0.29", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.058, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3090 cos1.00 難-0.06", "s": 0.837, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "ミッドナイト☆WAR [A]  n=3154 cos1.00 難-0.14", "s": 0.855, "f": 0}, {"x": 0.998, "y": 0.009, "c": "近傍", "n": "First Resolution [A]  n=2082 cos1.00 難0.01", "s": 0.564, "f": 0}, {"x": 0.995, "y": -0.254, "c": "近傍", "n": "キスキツネ [A]  n=1147 cos1.00 難-0.25", "s": 0.311, "f": 0}, {"x": 0.998, "y": 0.031, "c": "近傍", "n": "The Story Begins [A]  n=2767 cos1.00 難0.03", "s": 0.75, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5687048834270845}, {"a": 0, "b": 2, "w": 0.5228147635832319}, {"a": 0, "b": 3, "w": 0.5963357785559393}, {"a": 0, "b": 4, "w": 0.3090165241797199}, {"a": 0, "b": 5, "w": 0.4420287696623696}, {"a": 0, "b": 6, "w": 0.31091658566591296}, {"a": 0, "b": 7, "w": 0.30889652350438757}, {"a": 0, "b": 8, "w": 0.3608717055078431}, {"a": 0, "b": 9, "w": 0.3283302620841896}, {"a": 0, "b": 10, "w": 0.293878487194723}, {"a": 0, "b": 11, "w": 0.3151564081454241}, {"a": 0, "b": 12, "w": 0.2170925253591076}, {"a": 0, "b": 13, "w": 0.2401599351547301}, {"a": 0, "b": 14, "w": 0.2971983659551034}, {"a": 0, "b": 15, "w": 0.30556441547859015}, {"a": 0, "b": 16, "w": 0.3493248026755086}, {"a": 0, "b": 17, "w": 7.159028925229904e-11}, {"a": 0, "b": 18, "w": 0.4272921004508393}, {"a": 0, "b": 19, "w": 0.27431744145788217}, {"a": 0, "b": 20, "w": 0.5780455130195239}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.995,hiX=1.000,loY=-0.332,hiY=0.058;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
