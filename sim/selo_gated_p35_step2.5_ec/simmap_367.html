<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">INAZUMA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.723, "c": "種", "n": "INAZUMA [H]  n=2055 cos1.00 難-0.72", "s": 0.64, "f": 0}, {"x": 0.997, "y": -0.727, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos1.00 難-0.73", "s": 0.559, "f": 0}, {"x": 0.997, "y": -0.717, "c": "近傍", "n": "Programmed Life [H]  n=1854 cos1.00 難-0.72", "s": 0.577, "f": 0}, {"x": 0.996, "y": -0.717, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1989 cos1.00 難-0.72", "s": 0.619, "f": 0}, {"x": 0.997, "y": -0.684, "c": "近傍", "n": "Votum stellarum [H]  n=1929 cos1.00 難-0.68", "s": 0.601, "f": 0}, {"x": 0.997, "y": -0.791, "c": "近傍", "n": "Giudecca [H]  n=1656 cos1.00 難-0.79", "s": 0.516, "f": 0}, {"x": 0.995, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.72", "s": 0.593, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos1.00 難-0.68", "s": 0.44, "f": 0}, {"x": 0.995, "y": -0.684, "c": "近傍", "n": "KAMAITACHI [H]  n=2388 cos1.00 難-0.68", "s": 0.743, "f": 0}, {"x": 0.997, "y": -0.644, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos1.00 難-0.64", "s": 0.818, "f": 0}, {"x": 0.995, "y": -0.685, "c": "近傍", "n": "HYPERION [H]  n=1842 cos0.99 難-0.68", "s": 0.573, "f": 0}, {"x": 0.994, "y": -0.752, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos0.99 難-0.75", "s": 0.757, "f": 0}, {"x": 0.994, "y": -0.679, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos0.99 難-0.68", "s": 0.576, "f": 0}, {"x": 0.996, "y": -0.809, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [H]  n=1588 cos1.00 難-0.81", "s": 0.494, "f": 0}, {"x": 0.994, "y": -0.752, "c": "近傍", "n": "GHOST REVIVAL [H]  n=1611 cos0.99 難-0.75", "s": 0.502, "f": 0}, {"x": 0.996, "y": -0.626, "c": "近傍", "n": "xenon [H]  n=2372 cos1.00 難-0.63", "s": 0.738, "f": 0}, {"x": 0.994, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.76", "s": 0.78, "f": 0}, {"x": 0.994, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.68", "s": 0.98, "f": 0}, {"x": 0.994, "y": -0.658, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.66", "s": 0.49, "f": 0}, {"x": 0.997, "y": -0.613, "c": "近傍", "n": "quasar [H]  n=3212 cos1.00 難-0.61", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.795, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.80", "s": 0.612, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6360304766991456}, {"a": 0, "b": 2, "w": 0.6208188246370888}, {"a": 0, "b": 3, "w": 0.5715315435385693}, {"a": 0, "b": 4, "w": 0.6302884453395448}, {"a": 0, "b": 5, "w": 0.6717190037336038}, {"a": 0, "b": 6, "w": 0.5638083904448491}, {"a": 0, "b": 7, "w": 0.4869468722717065}, {"a": 0, "b": 8, "w": 0.5175948342539474}, {"a": 0, "b": 9, "w": 0.6228440748341768}, {"a": 0, "b": 10, "w": 0.541713703548653}, {"a": 0, "b": 11, "w": 0.45005184091248585}, {"a": 0, "b": 12, "w": 0.5039338241934224}, {"a": 0, "b": 13, "w": 0.49711861526123036}, {"a": 0, "b": 14, "w": 0.4915327512101072}, {"a": 0, "b": 15, "w": 0.6243878441478815}, {"a": 0, "b": 16, "w": 0.2545634699960274}, {"a": 0, "b": 17, "w": 0.4949076976793225}, {"a": 0, "b": 18, "w": 4.784095342103001e-11}, {"a": 0, "b": 19, "w": 0.6936931119387839}, {"a": 0, "b": 20, "w": 0.5490297163594379}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.825,hiY=-0.597;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
