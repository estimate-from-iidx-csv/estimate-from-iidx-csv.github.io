<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">エコ爺 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.358, "c": "種", "n": "エコ爺 [A]  n=3109 cos1.00 難-0.36", "s": 0.874, "f": 0}, {"x": 0.996, "y": -0.465, "c": "近傍", "n": "Midnight Lady [A]  n=2780 cos1.00 難-0.46", "s": 0.782, "f": 0}, {"x": 0.993, "y": -0.3, "c": "近傍", "n": "STAR FIELD [A]  n=2390 cos0.99 難-0.30", "s": 0.672, "f": 0}, {"x": 0.993, "y": -0.389, "c": "近傍", "n": "Liquid Crystal Girl feat. echo [A]  n=2466 cos0.99 難-0.39", "s": 0.693, "f": 0}, {"x": 0.994, "y": -0.524, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos0.99 難-0.52", "s": 0.642, "f": 0}, {"x": 0.992, "y": -0.312, "c": "近傍", "n": "Exchange Place [A]  n=2677 cos0.99 難-0.31", "s": 0.753, "f": 0}, {"x": 0.992, "y": -0.325, "c": "近傍", "n": "OOO [A]  n=3557 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.412, "c": "近傍", "n": "WISE UP! [A]  n=2812 cos0.99 難-0.41", "s": 0.791, "f": 0}, {"x": 0.993, "y": -0.512, "c": "近傍", "n": "Journey [A]  n=2721 cos0.99 難-0.51", "s": 0.765, "f": 0}, {"x": 0.993, "y": -0.15, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2790 cos0.99 難-0.15", "s": 0.784, "f": 0}, {"x": 0.99, "y": -0.254, "c": "近傍", "n": "神様、つれない。 [A]  n=1325 cos0.99 難-0.25", "s": 0.373, "f": 0}, {"x": 0.99, "y": -0.299, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.711, "f": 0}, {"x": 0.99, "y": -0.451, "c": "近傍", "n": "LUV CAN SAVE U [A]  n=3146 cos0.99 難-0.45", "s": 0.884, "f": 0}, {"x": 0.988, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.32", "s": 0.95, "f": 0}, {"x": 0.988, "y": -0.437, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.44", "s": 0.744, "f": 0}, {"x": 0.988, "y": -0.36, "c": "近傍", "n": "Mind Mapping [A]  n=3104 cos0.99 難-0.36", "s": 0.873, "f": 0}, {"x": 0.988, "y": -0.259, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.26", "s": 0.928, "f": 0}, {"x": 0.988, "y": -0.5, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2537 cos0.99 難-0.50", "s": 0.713, "f": 0}, {"x": 0.988, "y": -0.294, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2711 cos0.99 難-0.29", "s": 0.762, "f": 0}, {"x": 0.987, "y": -0.417, "c": "近傍", "n": "Show Time [A]  n=659 cos0.99 難-0.42", "s": 0.185, "f": 0}, {"x": 0.987, "y": -0.264, "c": "近傍", "n": "アクマフカ [A]  n=1847 cos0.99 難-0.26", "s": 0.519, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5827657639242876}, {"a": 0, "b": 2, "w": 0.4893727280062523}, {"a": 0, "b": 3, "w": 0.5799038281824169}, {"a": 0, "b": 4, "w": 0.5454221892411117}, {"a": 0, "b": 5, "w": 0.5263895236805647}, {"a": 0, "b": 6, "w": 0.36168442538393286}, {"a": 0, "b": 7, "w": 0.5415403209412368}, {"a": 0, "b": 8, "w": 0.6060909436576174}, {"a": 0, "b": 9, "w": 0.36062527074466033}, {"a": 0, "b": 10, "w": 0.3034213564388205}, {"a": 0, "b": 11, "w": 0.5056176027927328}, {"a": 0, "b": 12, "w": 0.3751213161322666}, {"a": 0, "b": 13, "w": 0.21800536581788033}, {"a": 0, "b": 14, "w": 0.30469706930028806}, {"a": 0, "b": 15, "w": 0.28573815892910925}, {"a": 0, "b": 16, "w": 0.18181757736135984}, {"a": 0, "b": 17, "w": 0.47439916322495}, {"a": 0, "b": 18, "w": 0.4184641811440589}, {"a": 0, "b": 19, "w": 3.971478701458864e-11}, {"a": 0, "b": 20, "w": 0.0643527157121796}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.554,hiY=-0.120;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
