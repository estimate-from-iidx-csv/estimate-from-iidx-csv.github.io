<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Time to Air [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.312, "c": "種", "n": "Time to Air [H]  n=3133 cos1.00 難-0.31", "s": 0.841, "f": 0}, {"x": 0.997, "y": -0.295, "c": "近傍", "n": "Tropical April [H]  n=2580 cos1.00 難-0.29", "s": 0.692, "f": 0}, {"x": 0.997, "y": -0.179, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos1.00 難-0.18", "s": 0.825, "f": 0}, {"x": 0.997, "y": -0.173, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos1.00 難-0.17", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.184, "c": "近傍", "n": "ヒマワリ [A]  n=3298 cos1.00 難-0.18", "s": 0.885, "f": 0}, {"x": 0.995, "y": -0.234, "c": "近傍", "n": "STARLIGHT JUNCTION [A]  n=2984 cos0.99 難-0.23", "s": 0.801, "f": 0}, {"x": 0.994, "y": -0.241, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2645 cos0.99 難-0.24", "s": 0.71, "f": 0}, {"x": 0.995, "y": -0.486, "c": "近傍", "n": "Close the World feat.a☆ru [H]  n=3019 cos1.00 難-0.49", "s": 0.81, "f": 0}, {"x": 0.993, "y": -0.291, "c": "近傍", "n": "純真可憐デザイア [A]  n=3599 cos0.99 難-0.29", "s": 0.966, "f": 0}, {"x": 0.993, "y": -0.253, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1081 cos0.99 難-0.25", "s": 0.29, "f": 0}, {"x": 0.993, "y": -0.311, "c": "近傍", "n": "華蝶風雪 [H]  n=2941 cos0.99 難-0.31", "s": 0.789, "f": 0}, {"x": 0.993, "y": -0.192, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.19", "s": 0.79, "f": 0}, {"x": 0.993, "y": -0.163, "c": "近傍", "n": "DOMINION [H]  n=2932 cos0.99 難-0.16", "s": 0.787, "f": 0}, {"x": 0.993, "y": -0.147, "c": "近傍", "n": "電子になりたい [A]  n=1538 cos0.99 難-0.15", "s": 0.413, "f": 0}, {"x": 0.992, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.774, "f": 0}, {"x": 0.994, "y": -0.109, "c": "近傍", "n": "TROOPERS [H]  n=2633 cos0.99 難-0.11", "s": 0.707, "f": 0}, {"x": 0.992, "y": -0.201, "c": "近傍", "n": "MARIA (I believe... ) [A]  n=2086 cos0.99 難-0.20", "s": 0.56, "f": 0}, {"x": 0.994, "y": -0.097, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.10", "s": 0.8, "f": 0}, {"x": 0.992, "y": -0.259, "c": "近傍", "n": "MOON [A]  n=3205 cos0.99 難-0.26", "s": 0.86, "f": 0}, {"x": 0.992, "y": -0.431, "c": "近傍", "n": "OTENAMI Hurricane [H]  n=2536 cos0.99 難-0.43", "s": 0.681, "f": 0}, {"x": 0.995, "y": -0.576, "c": "近傍", "n": "Xperanza [H]  n=2619 cos1.00 難-0.58", "s": 0.703, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3834247779921611}, {"a": 0, "b": 2, "w": 0.4484664988330006}, {"a": 0, "b": 3, "w": 0.4568744592232833}, {"a": 0, "b": 4, "w": 0.33387455396630283}, {"a": 0, "b": 5, "w": 0.29956141480564624}, {"a": 0, "b": 6, "w": 0.10674172046854791}, {"a": 0, "b": 7, "w": 0.3545839776819205}, {"a": 0, "b": 8, "w": 0.2275349888299356}, {"a": 0, "b": 9, "w": 0.020825787861511458}, {"a": 0, "b": 10, "w": 0.15460679395213128}, {"a": 0, "b": 11, "w": 0.1783642920590418}, {"a": 0, "b": 12, "w": 0.05611963374832696}, {"a": 0, "b": 13, "w": 0.1797903147507608}, {"a": 0, "b": 14, "w": 0.12826408710470472}, {"a": 0, "b": 15, "w": 6.650324735346658e-11}, {"a": 0, "b": 16, "w": 0.1372391964181564}, {"a": 0, "b": 17, "w": 0.24103683730169778}, {"a": 0, "b": 18, "w": 0.0471578768555867}, {"a": 0, "b": 19, "w": 0.16220184754382427}, {"a": 0, "b": 20, "w": 0.19345630376202838}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.614,hiY=-0.058;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
