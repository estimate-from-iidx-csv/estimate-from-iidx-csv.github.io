<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Agnus Dei [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.008, "c": "種", "n": "Agnus Dei [A]  n=2682 cos1.00 難-0.01", "s": 0.72, "f": 0}, {"x": 0.996, "y": -0.06, "c": "近傍", "n": "Ascalon [A]  n=3050 cos1.00 難-0.06", "s": 0.819, "f": 0}, {"x": 0.996, "y": 0.015, "c": "近傍", "n": "Erosion Mark [A]  n=3619 cos1.00 難0.02", "s": 0.971, "f": 0}, {"x": 0.995, "y": -0.036, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.04", "s": 0.747, "f": 0}, {"x": 0.996, "y": -0.095, "c": "近傍", "n": "Chemical Cookie [A]  n=3322 cos1.00 難-0.10", "s": 0.892, "f": 0}, {"x": 0.996, "y": -0.102, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3406 cos1.00 難-0.10", "s": 0.914, "f": 0}, {"x": 0.995, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難0.03", "s": 0.972, "f": 0}, {"x": 0.995, "y": -0.101, "c": "近傍", "n": "ビューティフルレシート [A]  n=3314 cos1.00 難-0.10", "s": 0.889, "f": 0}, {"x": 0.994, "y": -0.057, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.06", "s": 0.735, "f": 0}, {"x": 0.995, "y": -0.123, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos0.99 難-0.12", "s": 0.67, "f": 0}, {"x": 0.995, "y": -0.123, "c": "近傍", "n": "HIGH [A]  n=2329 cos0.99 難-0.12", "s": 0.625, "f": 0}, {"x": 0.995, "y": -0.125, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2073 cos0.99 難-0.12", "s": 0.556, "f": 0}, {"x": 0.994, "y": 0.074, "c": "近傍", "n": "Love Magic [A]  n=2554 cos0.99 難0.07", "s": 0.685, "f": 0}, {"x": 0.994, "y": -0.047, "c": "近傍", "n": "QQQ [A]  n=2895 cos0.99 難-0.05", "s": 0.777, "f": 0}, {"x": 0.995, "y": -0.173, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos1.00 難-0.17", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.111, "c": "近傍", "n": "Breakin' Chain [A]  n=2893 cos0.99 難-0.11", "s": 0.776, "f": 0}, {"x": 0.995, "y": -0.197, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos1.00 難-0.20", "s": 0.924, "f": 0}, {"x": 0.993, "y": -0.006, "c": "近傍", "n": "LUV DRIVE [A]  n=2839 cos0.99 難-0.01", "s": 0.762, "f": 0}, {"x": 0.993, "y": -0.027, "c": "近傍", "n": "Damage Per Second [L]  n=2954 cos0.99 難-0.03", "s": 0.793, "f": 0}, {"x": 0.992, "y": -0.015, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.02", "s": 0.761, "f": 0}, {"x": 0.993, "y": -0.097, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.10", "s": 0.8, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36302934761462324}, {"a": 0, "b": 2, "w": 0.32008580685688925}, {"a": 0, "b": 3, "w": 0.31146568256884877}, {"a": 0, "b": 4, "w": 0.28745834563396366}, {"a": 0, "b": 5, "w": 0.3218172990063085}, {"a": 0, "b": 6, "w": 0.2966895353994222}, {"a": 0, "b": 7, "w": 0.2906486930961426}, {"a": 0, "b": 8, "w": 0.1577405711076082}, {"a": 0, "b": 9, "w": 0.26106204741140937}, {"a": 0, "b": 10, "w": 0.27030890130392704}, {"a": 0, "b": 11, "w": 0.2494153046383012}, {"a": 0, "b": 12, "w": 0.16392710477942196}, {"a": 0, "b": 13, "w": 0.2145273060301759}, {"a": 0, "b": 14, "w": 0.3027323547719405}, {"a": 0, "b": 15, "w": 0.2099557770613243}, {"a": 0, "b": 16, "w": 0.3339093563462293}, {"a": 0, "b": 17, "w": 0.16287555862182668}, {"a": 0, "b": 18, "w": 0.08877055181015658}, {"a": 0, "b": 19, "w": 7.037070925974831e-11}, {"a": 0, "b": 20, "w": 0.10263993673287675}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.219,hiY=0.096;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
