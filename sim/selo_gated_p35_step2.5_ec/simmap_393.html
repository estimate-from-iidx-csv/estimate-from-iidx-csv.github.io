<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Liberation [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.531, "c": "種", "n": "Liberation [H]  n=2362 cos1.00 難-0.53", "s": 0.621, "f": 0}, {"x": 0.995, "y": -0.376, "c": "近傍", "n": "不死身ごっこ [A]  n=705 cos1.00 難-0.38", "s": 0.185, "f": 0}, {"x": 0.996, "y": -0.715, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos1.00 難-0.71", "s": 0.482, "f": 0}, {"x": 0.996, "y": -0.312, "c": "近傍", "n": "朧 [A]  n=3802 cos1.00 難-0.31", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.632, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.63", "s": 0.643, "f": 0}, {"x": 0.993, "y": -0.393, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.39", "s": 0.673, "f": 0}, {"x": 0.995, "y": -0.309, "c": "近傍", "n": "True Blue [H]  n=3057 cos0.99 難-0.31", "s": 0.804, "f": 0}, {"x": 0.993, "y": -0.39, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos0.99 難-0.39", "s": 0.674, "f": 0}, {"x": 0.993, "y": -0.645, "c": "近傍", "n": "神謳 -RESONANCE- [H]  n=2734 cos0.99 難-0.65", "s": 0.719, "f": 0}, {"x": 0.994, "y": -0.283, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3309 cos0.99 難-0.28", "s": 0.87, "f": 0}, {"x": 0.991, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.99 難-0.56", "s": 0.696, "f": 0}, {"x": 0.992, "y": -0.683, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.68", "s": 0.673, "f": 0}, {"x": 0.991, "y": -0.441, "c": "近傍", "n": "愛包ダンスホール [A]  n=1617 cos0.99 難-0.44", "s": 0.425, "f": 0}, {"x": 0.991, "y": -0.437, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.44", "s": 0.696, "f": 0}, {"x": 0.992, "y": -0.325, "c": "近傍", "n": "OOO [A]  n=3557 cos0.99 難-0.33", "s": 0.936, "f": 0}, {"x": 0.992, "y": -0.329, "c": "近傍", "n": "オブソミート [A]  n=1258 cos0.99 難-0.33", "s": 0.331, "f": 0}, {"x": 0.992, "y": -0.371, "c": "近傍", "n": "In Heaven [A]  n=2966 cos0.99 難-0.37", "s": 0.78, "f": 0}, {"x": 0.991, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.68", "s": 0.828, "f": 0}, {"x": 0.993, "y": -0.308, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.31", "s": 0.606, "f": 0}, {"x": 0.993, "y": -0.299, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos0.99 難-0.30", "s": 0.923, "f": 0}, {"x": 0.99, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.477, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3737941283061009}, {"a": 0, "b": 2, "w": 0.27312810251973174}, {"a": 0, "b": 3, "w": 0.4519547834002846}, {"a": 0, "b": 4, "w": 0.07832393599501797}, {"a": 0, "b": 5, "w": 0.31308002661940015}, {"a": 0, "b": 6, "w": 0.30947790102669626}, {"a": 0, "b": 7, "w": 0.23801601682225504}, {"a": 0, "b": 8, "w": 6.129308172120318e-11}, {"a": 0, "b": 9, "w": 0.33464568772177283}, {"a": 0, "b": 10, "w": 0.20548189592655353}, {"a": 0, "b": 11, "w": 0.25635837017475616}, {"a": 0, "b": 12, "w": 0.18583274093394897}, {"a": 0, "b": 13, "w": 0.21332997365297368}, {"a": 0, "b": 14, "w": 0.27875720226984435}, {"a": 0, "b": 15, "w": 0.020722042792334916}, {"a": 0, "b": 16, "w": 0.22055137739906872}, {"a": 0, "b": 17, "w": 0.1964981849869879}, {"a": 0, "b": 18, "w": 0.1784173254268102}, {"a": 0, "b": 19, "w": 0.28244954738157624}, {"a": 0, "b": 20, "w": 0.18794358014840462}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.749,hiY=-0.249;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
