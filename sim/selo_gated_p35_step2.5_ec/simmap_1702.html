<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">3V0 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.48, "c": "種", "n": "3V0 [A]  n=2201 cos1.00 難0.48", "s": 0.6, "f": 0}, {"x": 0.997, "y": 0.453, "c": "近傍", "n": "diagram [A]  n=3166 cos1.00 難0.45", "s": 0.863, "f": 0}, {"x": 0.995, "y": 0.423, "c": "近傍", "n": "Crazy Jackpot [A]  n=2701 cos1.00 難0.42", "s": 0.736, "f": 0}, {"x": 0.995, "y": 0.493, "c": "近傍", "n": "THE SHINING POLARIS(kors k mix) [A]  n=1527 cos0.99 難0.49", "s": 0.416, "f": 0}, {"x": 0.995, "y": 0.446, "c": "近傍", "n": "Carry Me Away [A]  n=3350 cos0.99 難0.45", "s": 0.913, "f": 0}, {"x": 0.993, "y": 0.527, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.53", "s": 0.867, "f": 0}, {"x": 0.996, "y": 0.679, "c": "近傍", "n": "Fegrix [A]  n=2634 cos1.00 難0.68", "s": 0.718, "f": 0}, {"x": 0.993, "y": 0.586, "c": "近傍", "n": "1st Samurai [A]  n=3017 cos0.99 難0.59", "s": 0.823, "f": 0}, {"x": 0.993, "y": 0.586, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.59", "s": 0.728, "f": 0}, {"x": 0.993, "y": 0.385, "c": "近傍", "n": "Neo Heritage [A]  n=2299 cos0.99 難0.39", "s": 0.627, "f": 0}, {"x": 0.994, "y": 0.294, "c": "近傍", "n": "POLKAMANIA [A]  n=2923 cos0.99 難0.29", "s": 0.797, "f": 0}, {"x": 0.993, "y": 0.325, "c": "近傍", "n": "HYENA [A]  n=3455 cos0.99 難0.33", "s": 0.942, "f": 0}, {"x": 0.994, "y": 0.289, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1738 cos0.99 難0.29", "s": 0.474, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos0.99 難0.30", "s": 0.489, "f": 0}, {"x": 0.992, "y": 0.603, "c": "近傍", "n": "LAB [L]  n=861 cos0.99 難0.60", "s": 0.235, "f": 0}, {"x": 0.995, "y": 0.245, "c": "近傍", "n": "S!ck [A]  n=3668 cos1.00 難0.24", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.404, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos0.99 難0.40", "s": 0.233, "f": 0}, {"x": 0.991, "y": 0.471, "c": "近傍", "n": "BRAINSTORM [A]  n=3418 cos0.99 難0.47", "s": 0.932, "f": 0}, {"x": 0.991, "y": 0.536, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.99 難0.54", "s": 0.919, "f": 0}, {"x": 0.991, "y": 0.405, "c": "近傍", "n": "Welcome [A]  n=3292 cos0.99 難0.41", "s": 0.897, "f": 0}, {"x": 0.992, "y": 0.346, "c": "近傍", "n": "Around the Future [A]  n=3149 cos0.99 難0.35", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.367415252882349}, {"a": 0, "b": 2, "w": 0.1795777615570937}, {"a": 0, "b": 3, "w": 0.33995731542335605}, {"a": 0, "b": 4, "w": 0.45784845214336123}, {"a": 0, "b": 5, "w": 0.32099585055516966}, {"a": 0, "b": 6, "w": 0.5555323723562773}, {"a": 0, "b": 7, "w": 0.3061627541232558}, {"a": 0, "b": 8, "w": 0.19455840591094142}, {"a": 0, "b": 9, "w": 0.2460482443387082}, {"a": 0, "b": 10, "w": 0.23077426108703503}, {"a": 0, "b": 11, "w": 0.22325839910016032}, {"a": 0, "b": 12, "w": 0.2508594533611421}, {"a": 0, "b": 13, "w": 0.3110700407481336}, {"a": 0, "b": 14, "w": 0.19116914749683533}, {"a": 0, "b": 15, "w": 0.2814589794621841}, {"a": 0, "b": 16, "w": 0.08794242815015463}, {"a": 0, "b": 17, "w": 0.2864433326145426}, {"a": 0, "b": 18, "w": 0.28695493477059375}, {"a": 0, "b": 19, "w": 0.15661713558360357}, {"a": 0, "b": 20, "w": 3.566491546536099e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.210,hiY=0.713;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
