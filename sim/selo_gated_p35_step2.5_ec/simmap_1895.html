<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Giudecca [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.484, "c": "種", "n": "Giudecca [A]  n=3156 cos1.00 難0.48", "s": 0.851, "f": 0}, {"x": 0.997, "y": 0.459, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos1.00 難0.46", "s": 0.864, "f": 0}, {"x": 0.996, "y": 0.534, "c": "近傍", "n": "OTOKOZAKA [A]  n=1619 cos1.00 難0.53", "s": 0.436, "f": 0}, {"x": 0.998, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos1.00 難0.38", "s": 0.871, "f": 0}, {"x": 0.995, "y": 0.429, "c": "近傍", "n": "DROP [A]  n=3229 cos0.99 難0.43", "s": 0.87, "f": 0}, {"x": 0.994, "y": 0.586, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.59", "s": 0.72, "f": 0}, {"x": 0.992, "y": 0.404, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos0.99 難0.40", "s": 0.23, "f": 0}, {"x": 0.992, "y": 0.493, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1359 cos0.99 難0.49", "s": 0.366, "f": 0}, {"x": 0.992, "y": 0.439, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.44", "s": 0.536, "f": 0}, {"x": 0.995, "y": 0.272, "c": "近傍", "n": "ChaserXX [A]  n=3337 cos0.99 難0.27", "s": 0.899, "f": 0}, {"x": 0.992, "y": 0.429, "c": "近傍", "n": "Overslept [A]  n=2562 cos0.99 難0.43", "s": 0.691, "f": 0}, {"x": 0.992, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos0.99 難0.45", "s": 0.479, "f": 0}, {"x": 0.992, "y": 0.43, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3710 cos0.99 難0.43", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.52, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.99 難0.52", "s": 0.896, "f": 0}, {"x": 0.993, "y": 0.324, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.32", "s": 0.882, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "Battleground [A]  n=3268 cos0.99 難0.27", "s": 0.881, "f": 0}, {"x": 0.991, "y": 0.397, "c": "近傍", "n": "DESIRE [A]  n=3355 cos0.99 難0.40", "s": 0.904, "f": 0}, {"x": 0.994, "y": 0.711, "c": "近傍", "n": "BRAVE OUT [L]  n=696 cos0.99 難0.71", "s": 0.188, "f": 0}, {"x": 0.992, "y": 0.313, "c": "近傍", "n": "20XX [A]  n=1765 cos0.99 難0.31", "s": 0.476, "f": 0}, {"x": 0.991, "y": 0.409, "c": "近傍", "n": "Light and Cyber… [A]  n=3255 cos0.99 難0.41", "s": 0.877, "f": 0}, {"x": 0.991, "y": 0.426, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3248 cos0.99 難0.43", "s": 0.875, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5786861033410824}, {"a": 0, "b": 2, "w": 0.5842301572670949}, {"a": 0, "b": 3, "w": 0.6499799865015637}, {"a": 0, "b": 4, "w": 0.5310644423256058}, {"a": 0, "b": 5, "w": 0.3760966173095437}, {"a": 0, "b": 6, "w": 0.3607908709062897}, {"a": 0, "b": 7, "w": 0.141598701247029}, {"a": 0, "b": 8, "w": 0.3300182594464153}, {"a": 0, "b": 9, "w": 0.5148628493298085}, {"a": 0, "b": 10, "w": 0.3881226913860484}, {"a": 0, "b": 11, "w": 3.938738224462668e-11}, {"a": 0, "b": 12, "w": 0.041048695251558964}, {"a": 0, "b": 13, "w": 0.37630956358761447}, {"a": 0, "b": 14, "w": 0.30545208685633085}, {"a": 0, "b": 15, "w": 0.4727603257346905}, {"a": 0, "b": 16, "w": 0.18546930786548732}, {"a": 0, "b": 17, "w": 0.491588821597137}, {"a": 0, "b": 18, "w": 0.4014535935108665}, {"a": 0, "b": 19, "w": 0.08314481201242296}, {"a": 0, "b": 20, "w": 0.327909902940978}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.230,hiY=0.746;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
