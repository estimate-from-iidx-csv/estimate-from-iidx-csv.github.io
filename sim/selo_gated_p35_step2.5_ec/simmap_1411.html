<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lightspeed [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.811, "c": "種", "n": "Lightspeed [H]  n=632 cos1.00 難-0.81", "s": 0.196, "f": 0}, {"x": 0.994, "y": -0.843, "c": "近傍", "n": "Binary Black Hole [H]  n=1335 cos0.99 難-0.84", "s": 0.414, "f": 0}, {"x": 0.991, "y": -0.699, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.70", "s": 0.558, "f": 0}, {"x": 0.99, "y": -0.8, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [H]  n=1349 cos0.99 難-0.80", "s": 0.419, "f": 0}, {"x": 0.994, "y": -1.037, "c": "近傍", "n": "Visterhv [H]  n=2069 cos0.99 難-1.04", "s": 0.642, "f": 0}, {"x": 0.991, "y": -0.988, "c": "近傍", "n": "Boomy and The Boost [H]  n=2209 cos0.99 難-0.99", "s": 0.686, "f": 0}, {"x": 0.989, "y": -0.717, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.72", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.791, "c": "近傍", "n": "HEISEI [H]  n=2018 cos0.99 難-0.79", "s": 0.627, "f": 0}, {"x": 0.986, "y": -0.842, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.84", "s": 0.62, "f": 0}, {"x": 0.99, "y": -1.073, "c": "近傍", "n": "Megalara Garuda [H]  n=1487 cos0.99 難-1.07", "s": 0.462, "f": 0}, {"x": 0.985, "y": -0.763, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.76", "s": 0.545, "f": 0}, {"x": 0.986, "y": -0.71, "c": "近傍", "n": "ONIGOROSHI [H]  n=1805 cos0.99 難-0.71", "s": 0.56, "f": 0}, {"x": 0.987, "y": -0.612, "c": "近傍", "n": "AO-1 [H]  n=2826 cos0.99 難-0.61", "s": 0.877, "f": 0}, {"x": 0.988, "y": -1.072, "c": "近傍", "n": "Triple Cross [H]  n=1734 cos0.99 難-1.07", "s": 0.538, "f": 0}, {"x": 0.985, "y": -0.704, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.504, "f": 0}, {"x": 0.984, "y": -0.836, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos0.98 難-0.84", "s": 0.744, "f": 0}, {"x": 0.985, "y": -0.684, "c": "近傍", "n": "Todestrieb [H]  n=3122 cos0.98 難-0.68", "s": 0.969, "f": 0}, {"x": 0.984, "y": -0.89, "c": "近傍", "n": "voltississimo [H]  n=1811 cos0.98 難-0.89", "s": 0.562, "f": 0}, {"x": 0.987, "y": -1.06, "c": "近傍", "n": "[ ]DENTITY [H]  n=1433 cos0.99 難-1.06", "s": 0.445, "f": 0}, {"x": 0.983, "y": -0.717, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.98 難-0.72", "s": 0.63, "f": 0}, {"x": 0.99, "y": -1.176, "c": "近傍", "n": "DIVINE JUDGEMENT [H]  n=624 cos0.99 難-1.18", "s": 0.194, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5288317146561385}, {"a": 0, "b": 2, "w": 0.45409260491247394}, {"a": 0, "b": 3, "w": 0.39049729632914854}, {"a": 0, "b": 4, "w": 0.4988927681827666}, {"a": 0, "b": 5, "w": 0.18178741355384676}, {"a": 0, "b": 6, "w": 0.03732000874446173}, {"a": 0, "b": 7, "w": 0.2767358324924152}, {"a": 0, "b": 8, "w": 0.18485767849600798}, {"a": 0, "b": 9, "w": 0.31123426614301075}, {"a": 0, "b": 10, "w": 0.16637512337662697}, {"a": 0, "b": 11, "w": 0.3233202481308819}, {"a": 0, "b": 12, "w": 0.34472958055207215}, {"a": 0, "b": 13, "w": 0.3737351915622079}, {"a": 0, "b": 14, "w": 3.827271832790302e-11}, {"a": 0, "b": 15, "w": 0.09147920006881405}, {"a": 0, "b": 16, "w": 0.0755169431864312}, {"a": 0, "b": 17, "w": 0.20993421891510333}, {"a": 0, "b": 18, "w": 0.25338979354151314}, {"a": 0, "b": 19, "w": 0.060172588892642875}, {"a": 0, "b": 20, "w": 0.4435149862573913}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.221,hiY=-0.566;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
