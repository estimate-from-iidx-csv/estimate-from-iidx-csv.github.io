<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">えだまめカレークッキング [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.021, "c": "種", "n": "えだまめカレークッキング [A]  n=1612 cos1.00 難-0.02", "s": 0.425, "f": 0}, {"x": 0.995, "y": 0.102, "c": "近傍", "n": "Onyx [A]  n=2505 cos1.00 難0.10", "s": 0.661, "f": 0}, {"x": 0.996, "y": -0.312, "c": "近傍", "n": "夏色のセレナーデ [A]  n=1050 cos1.00 難-0.31", "s": 0.277, "f": 0}, {"x": 0.988, "y": -0.027, "c": "近傍", "n": "Damage Per Second [L]  n=2954 cos0.99 難-0.03", "s": 0.779, "f": 0}, {"x": 0.988, "y": -0.109, "c": "近傍", "n": "十六夜セツナ [A]  n=3348 cos0.99 難-0.11", "s": 0.883, "f": 0}, {"x": 0.988, "y": 0.136, "c": "近傍", "n": "Pout [A]  n=2136 cos0.99 難0.14", "s": 0.563, "f": 0}, {"x": 0.987, "y": 0.006, "c": "近傍", "n": "Do What You Want [A]  n=2649 cos0.99 難0.01", "s": 0.699, "f": 0}, {"x": 0.988, "y": -0.19, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.99 難-0.19", "s": 0.482, "f": 0}, {"x": 0.987, "y": 0.075, "c": "近傍", "n": "Sakura Reflection [A]  n=3791 cos0.99 難0.08", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.248, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2165 cos0.99 難-0.25", "s": 0.571, "f": 0}, {"x": 0.985, "y": 0.112, "c": "近傍", "n": "Daily Lunch Special [A]  n=3535 cos0.99 難0.11", "s": 0.932, "f": 0}, {"x": 0.986, "y": -0.239, "c": "近傍", "n": "華爛漫 -Flowers- [A]  n=3643 cos0.99 難-0.24", "s": 0.961, "f": 0}, {"x": 0.987, "y": -0.29, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.29", "s": 0.761, "f": 0}, {"x": 0.988, "y": -0.379, "c": "近傍", "n": "エクスプロウル [A]  n=1133 cos0.99 難-0.38", "s": 0.299, "f": 0}, {"x": 0.987, "y": -0.353, "c": "近傍", "n": "ANEMONE [A]  n=2527 cos0.99 難-0.35", "s": 0.667, "f": 0}, {"x": 0.984, "y": 0.068, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3594 cos0.98 難0.07", "s": 0.948, "f": 0}, {"x": 0.985, "y": -0.194, "c": "近傍", "n": "smooooch・∀・ (Snail's House Remix) [A]  n=2451 cos0.98 難-0.19", "s": 0.647, "f": 0}, {"x": 0.984, "y": 0.127, "c": "近傍", "n": "眠りの国のステラ [A]  n=2541 cos0.98 難0.13", "s": 0.67, "f": 0}, {"x": 0.984, "y": 0.114, "c": "近傍", "n": "ROTTERDAM SHOGUN [A]  n=3431 cos0.98 難0.11", "s": 0.905, "f": 0}, {"x": 0.984, "y": -0.147, "c": "近傍", "n": "電子になりたい [A]  n=1538 cos0.98 難-0.15", "s": 0.406, "f": 0}, {"x": 0.983, "y": -0.123, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos0.98 難-0.12", "s": 0.658, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5625415730837524}, {"a": 0, "b": 2, "w": 0.613416105301609}, {"a": 0, "b": 3, "w": 0.35338329368716503}, {"a": 0, "b": 4, "w": 0.35489153842896515}, {"a": 0, "b": 5, "w": 0.2212300382867316}, {"a": 0, "b": 6, "w": 0.31212343049925384}, {"a": 0, "b": 7, "w": 0.3404999567201167}, {"a": 0, "b": 8, "w": 0.1437801233134729}, {"a": 0, "b": 9, "w": 0.2426357025838728}, {"a": 0, "b": 10, "w": 3.9851899558129844e-11}, {"a": 0, "b": 11, "w": 0.22269047782598128}, {"a": 0, "b": 12, "w": 0.24190822606581097}, {"a": 0, "b": 13, "w": 0.34392311014791754}, {"a": 0, "b": 14, "w": 0.15918050516188953}, {"a": 0, "b": 15, "w": 0.15170010965313951}, {"a": 0, "b": 16, "w": 0.23644942357991716}, {"a": 0, "b": 17, "w": 0.218106870066187}, {"a": 0, "b": 18, "w": 0.10633802773973489}, {"a": 0, "b": 19, "w": 0.16875109899673923}, {"a": 0, "b": 20, "w": 0.2261191207538341}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.421,hiY=0.177;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
