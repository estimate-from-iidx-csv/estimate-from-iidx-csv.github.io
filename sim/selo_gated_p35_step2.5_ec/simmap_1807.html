<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CONCEPTUAL [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.245, "c": "種", "n": "CONCEPTUAL [A]  n=3292 cos1.00 難0.25", "s": 0.89, "f": 0}, {"x": 0.997, "y": 0.257, "c": "近傍", "n": "ZED [A]  n=3488 cos1.00 難0.26", "s": 0.943, "f": 0}, {"x": 0.997, "y": 0.186, "c": "近傍", "n": "405nm (Ryu☆mix) [A]  n=3619 cos1.00 難0.19", "s": 0.979, "f": 0}, {"x": 0.996, "y": 0.26, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=840 cos1.00 難0.26", "s": 0.227, "f": 0}, {"x": 0.997, "y": 0.324, "c": "近傍", "n": "rumrum triplets [A]  n=3302 cos1.00 難0.32", "s": 0.893, "f": 0}, {"x": 0.995, "y": 0.242, "c": "近傍", "n": "Take My Life [A]  n=3360 cos1.00 難0.24", "s": 0.909, "f": 0}, {"x": 0.997, "y": 0.363, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2937 cos1.00 難0.36", "s": 0.794, "f": 0}, {"x": 0.995, "y": 0.203, "c": "近傍", "n": "ZEPHYRANTHES [A]  n=3392 cos0.99 難0.20", "s": 0.918, "f": 0}, {"x": 0.995, "y": 0.302, "c": "近傍", "n": "Angelic Jelly [A]  n=3400 cos0.99 難0.30", "s": 0.92, "f": 0}, {"x": 0.995, "y": 0.313, "c": "近傍", "n": "20XX [A]  n=1765 cos0.99 難0.31", "s": 0.477, "f": 0}, {"x": 0.994, "y": 0.257, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos0.99 難0.26", "s": 0.452, "f": 0}, {"x": 0.996, "y": 0.366, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos1.00 難0.37", "s": 0.883, "f": 0}, {"x": 0.994, "y": 0.163, "c": "近傍", "n": "Lost Souls [A]  n=2609 cos0.99 難0.16", "s": 0.706, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "Arabian Rave Night [A]  n=3455 cos0.99 難0.20", "s": 0.935, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.26", "s": 0.83, "f": 0}, {"x": 0.994, "y": 0.207, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3470 cos0.99 難0.21", "s": 0.939, "f": 0}, {"x": 0.994, "y": 0.174, "c": "近傍", "n": "end of world [A]  n=3010 cos0.99 難0.17", "s": 0.814, "f": 0}, {"x": 0.994, "y": 0.128, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.332, "c": "近傍", "n": "I Love You [A]  n=3131 cos0.99 難0.33", "s": 0.847, "f": 0}, {"x": 0.994, "y": 0.385, "c": "近傍", "n": "GENOCIDE [A]  n=3260 cos0.99 難0.39", "s": 0.882, "f": 0}, {"x": 0.994, "y": 0.111, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [H]  n=3694 cos0.99 難0.11", "s": 0.999, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5043677392696229}, {"a": 0, "b": 2, "w": 0.38683543119059294}, {"a": 0, "b": 3, "w": 0.43029999437516375}, {"a": 0, "b": 4, "w": 0.535409604307272}, {"a": 0, "b": 5, "w": 0.41203110540856824}, {"a": 0, "b": 6, "w": 0.5740775687772086}, {"a": 0, "b": 7, "w": 0.3319096752951226}, {"a": 0, "b": 8, "w": 0.3562806280609818}, {"a": 0, "b": 9, "w": 0.3725244439171118}, {"a": 0, "b": 10, "w": 0.3081218888631756}, {"a": 0, "b": 11, "w": 0.4166244146770637}, {"a": 0, "b": 12, "w": 0.3034670051021261}, {"a": 0, "b": 13, "w": 0.37803853060019055}, {"a": 0, "b": 14, "w": 0.25859714177874626}, {"a": 0, "b": 15, "w": 0.2673623108495441}, {"a": 0, "b": 16, "w": 4.392908259376327e-11}, {"a": 0, "b": 17, "w": 0.4137677223626417}, {"a": 0, "b": 18, "w": 0.1337061533463929}, {"a": 0, "b": 19, "w": 0.25651900197775923}, {"a": 0, "b": 20, "w": 0.39988028042857315}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=0.089,hiY=0.407;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
