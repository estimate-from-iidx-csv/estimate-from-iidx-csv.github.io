<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ちょえちょえまぎか [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.378, "c": "種", "n": "ちょえちょえまぎか [H]  n=1188 cos1.00 難-1.38", "s": 0.506, "f": 0}, {"x": 0.992, "y": -1.27, "c": "近傍", "n": "≡+≡ [H]  n=1324 cos0.99 難-1.27", "s": 0.563, "f": 0}, {"x": 0.99, "y": -1.285, "c": "近傍", "n": "Arkadia [H]  n=857 cos0.99 難-1.29", "s": 0.365, "f": 0}, {"x": 0.99, "y": -1.508, "c": "近傍", "n": "Angelic Jelly [H]  n=1599 cos0.99 難-1.51", "s": 0.68, "f": 0}, {"x": 0.986, "y": -1.402, "c": "近傍", "n": "Be A Star [H]  n=1614 cos0.99 難-1.40", "s": 0.687, "f": 0}, {"x": 0.986, "y": -1.324, "c": "近傍", "n": "Derelict Star feat. Ryu* [H]  n=1290 cos0.99 難-1.32", "s": 0.549, "f": 0}, {"x": 0.987, "y": -1.237, "c": "近傍", "n": "GRAVITON [H]  n=1116 cos0.99 難-1.24", "s": 0.475, "f": 0}, {"x": 0.987, "y": -1.23, "c": "近傍", "n": "cinder [H]  n=1446 cos0.99 難-1.23", "s": 0.615, "f": 0}, {"x": 0.984, "y": -1.324, "c": "近傍", "n": "イザナミノナゲキ [H]  n=1555 cos0.98 難-1.32", "s": 0.662, "f": 0}, {"x": 0.986, "y": -1.243, "c": "近傍", "n": "NINJA IS DEAD IIDX ver. [H]  n=1573 cos0.99 難-1.24", "s": 0.669, "f": 0}, {"x": 0.985, "y": -1.225, "c": "近傍", "n": "千年ノ理 [H]  n=2350 cos0.99 難-1.23", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.528, "c": "近傍", "n": "From Time To Time [H]  n=867 cos0.98 難-1.53", "s": 0.369, "f": 0}, {"x": 0.988, "y": -1.152, "c": "近傍", "n": "Aftermath [H]  n=1341 cos0.99 難-1.15", "s": 0.571, "f": 0}, {"x": 0.983, "y": -1.242, "c": "近傍", "n": "VOLAQUAS [H]  n=1075 cos0.98 難-1.24", "s": 0.457, "f": 0}, {"x": 0.983, "y": -1.217, "c": "近傍", "n": "Vulkan [H]  n=1929 cos0.98 難-1.22", "s": 0.821, "f": 0}, {"x": 0.982, "y": -1.229, "c": "近傍", "n": "Lisa-RICCIA [H]  n=672 cos0.98 難-1.23", "s": 0.286, "f": 0}, {"x": 0.982, "y": -1.554, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.98 難-1.55", "s": 0.453, "f": 0}, {"x": 0.991, "y": -1.077, "c": "近傍", "n": "RIZING YOU UP [H]  n=1821 cos0.99 難-1.08", "s": 0.775, "f": 0}, {"x": 0.991, "y": -1.075, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.08", "s": 0.314, "f": 0}, {"x": 0.979, "y": -1.423, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.98 難-1.42", "s": 0.729, "f": 0}, {"x": 0.98, "y": -1.278, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=537 cos0.98 難-1.28", "s": 0.229, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32146191475848795}, {"a": 0, "b": 2, "w": 0.2896637835815321}, {"a": 0, "b": 3, "w": 0.30638048688438224}, {"a": 0, "b": 4, "w": 0.11712577598772289}, {"a": 0, "b": 5, "w": 0.18561650850764766}, {"a": 0, "b": 6, "w": 0.18771284628791618}, {"a": 0, "b": 7, "w": 0.20497412808551752}, {"a": 0, "b": 8, "w": 0.14474052764493384}, {"a": 0, "b": 9, "w": 0.18114586646377384}, {"a": 0, "b": 10, "w": 0.1584451817242144}, {"a": 0, "b": 11, "w": 0.08957594176815542}, {"a": 0, "b": 12, "w": 0.17239076622730398}, {"a": 0, "b": 13, "w": 0.052231308969604595}, {"a": 0, "b": 14, "w": 0.12192647874453344}, {"a": 0, "b": 15, "w": 0.01613861254527149}, {"a": 0, "b": 16, "w": 0.08400035092287061}, {"a": 0, "b": 17, "w": 0.3319087686687241}, {"a": 0, "b": 18, "w": 0.33892007766777477}, {"a": 0, "b": 19, "w": 5.185796236872875e-11}, {"a": 0, "b": 20, "w": 0.014949782460979777}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=-1.592,hiY=-1.037;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
