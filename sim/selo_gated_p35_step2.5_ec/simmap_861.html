<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Geirskogul [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.061, "c": "種", "n": "Geirskogul [A]  n=2371 cos1.00 難-0.06", "s": 0.655, "f": 0}, {"x": 0.995, "y": -0.086, "c": "近傍", "n": "Jumper [A]  n=1726 cos1.00 難-0.09", "s": 0.477, "f": 0}, {"x": 0.995, "y": -0.217, "c": "近傍", "n": "突撃!ガラスのニーソ姫! [A]  n=3529 cos0.99 難-0.22", "s": 0.975, "f": 0}, {"x": 0.994, "y": 0.074, "c": "近傍", "n": "Slumber☆Party [A]  n=1080 cos0.99 難0.07", "s": 0.298, "f": 0}, {"x": 0.993, "y": -0.139, "c": "近傍", "n": "Rowdy [A]  n=2462 cos0.99 難-0.14", "s": 0.68, "f": 0}, {"x": 0.995, "y": -0.253, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1081 cos0.99 難-0.25", "s": 0.299, "f": 0}, {"x": 0.992, "y": 0.069, "c": "近傍", "n": "EMERALDAS [H]  n=3144 cos0.99 難0.07", "s": 0.868, "f": 0}, {"x": 0.991, "y": 0.006, "c": "近傍", "n": "Do What You Want [A]  n=2649 cos0.99 難0.01", "s": 0.732, "f": 0}, {"x": 0.992, "y": -0.19, "c": "近傍", "n": "Next Level [A]  n=1622 cos0.99 難-0.19", "s": 0.448, "f": 0}, {"x": 0.991, "y": 0.013, "c": "近傍", "n": "BABY LOVE [A]  n=2741 cos0.99 難0.01", "s": 0.757, "f": 0}, {"x": 0.991, "y": -0.095, "c": "近傍", "n": "Chemical Cookie [A]  n=3322 cos0.99 難-0.10", "s": 0.917, "f": 0}, {"x": 0.992, "y": 0.133, "c": "近傍", "n": "No Limit 2 dAnce feat. 大山愛未 [A]  n=3298 cos0.99 難0.13", "s": 0.911, "f": 0}, {"x": 0.991, "y": 0.114, "c": "近傍", "n": "ROTTERDAM SHOGUN [A]  n=3431 cos0.99 難0.11", "s": 0.948, "f": 0}, {"x": 0.99, "y": 0.029, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難0.03", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.061, "c": "近傍", "n": "Odin [A]  n=2946 cos0.99 難-0.06", "s": 0.814, "f": 0}, {"x": 0.995, "y": -0.381, "c": "近傍", "n": "BLUE DRAGON(雷龍RemixIIDX) [H]  n=2841 cos0.99 難-0.38", "s": 0.785, "f": 0}, {"x": 0.99, "y": -0.142, "c": "近傍", "n": "bag [A]  n=2864 cos0.99 難-0.14", "s": 0.791, "f": 0}, {"x": 0.99, "y": 0.015, "c": "近傍", "n": "Erosion Mark [A]  n=3619 cos0.99 難0.02", "s": 0.999, "f": 0}, {"x": 0.989, "y": -0.06, "c": "近傍", "n": "Ascalon [A]  n=3050 cos0.99 難-0.06", "s": 0.842, "f": 0}, {"x": 0.99, "y": -0.236, "c": "近傍", "n": "FERMI PARADOX [A]  n=1461 cos0.99 難-0.24", "s": 0.403, "f": 0}, {"x": 0.989, "y": -0.109, "c": "近傍", "n": "TROOPERS [H]  n=2633 cos0.99 難-0.11", "s": 0.727, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48252437820642935}, {"a": 0, "b": 2, "w": 0.5267181053745578}, {"a": 0, "b": 3, "w": 0.4237051725539486}, {"a": 0, "b": 4, "w": 0.3857100466607022}, {"a": 0, "b": 5, "w": 0.5224538971465278}, {"a": 0, "b": 6, "w": 4.2081005346972233e-11}, {"a": 0, "b": 7, "w": 0.39097544114731286}, {"a": 0, "b": 8, "w": 0.40560764921155834}, {"a": 0, "b": 9, "w": 0.29079243634148266}, {"a": 0, "b": 10, "w": 0.3502814372644226}, {"a": 0, "b": 11, "w": 0.37927962712859853}, {"a": 0, "b": 12, "w": 0.31116862709207793}, {"a": 0, "b": 13, "w": 0.26020763348174103}, {"a": 0, "b": 14, "w": 0.19181023223397486}, {"a": 0, "b": 15, "w": 0.5038162243042958}, {"a": 0, "b": 16, "w": 0.1902315801543515}, {"a": 0, "b": 17, "w": 0.1632042904581965}, {"a": 0, "b": 18, "w": 0.28761796593704136}, {"a": 0, "b": 19, "w": 0.34002504111598586}, {"a": 0, "b": 20, "w": 0.3137912593690685}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.422,hiY=0.174;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
