<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">冬椿 ft. Kanae Asaba [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.262, "c": "種", "n": "冬椿 ft. Kanae Asaba [A]  n=3566 cos1.00 難-0.26", "s": 0.957, "f": 0}, {"x": 0.995, "y": -0.285, "c": "近傍", "n": "My Sweet Bird? [A]  n=1524 cos0.99 難-0.28", "s": 0.409, "f": 0}, {"x": 0.994, "y": -0.259, "c": "近傍", "n": "MOON [A]  n=3205 cos0.99 難-0.26", "s": 0.86, "f": 0}, {"x": 0.994, "y": -0.234, "c": "近傍", "n": "STARLIGHT JUNCTION [A]  n=2984 cos0.99 難-0.23", "s": 0.801, "f": 0}, {"x": 0.995, "y": -0.192, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.19", "s": 0.79, "f": 0}, {"x": 0.993, "y": -0.294, "c": "近傍", "n": "Sugar Drippin' [A]  n=2161 cos0.99 難-0.29", "s": 0.58, "f": 0}, {"x": 0.994, "y": -0.344, "c": "近傍", "n": "SHINING☆DANCE [A]  n=1113 cos0.99 難-0.34", "s": 0.299, "f": 0}, {"x": 0.993, "y": -0.195, "c": "近傍", "n": "SAMSARA [A]  n=3305 cos0.99 難-0.19", "s": 0.887, "f": 0}, {"x": 0.994, "y": -0.125, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2073 cos0.99 難-0.12", "s": 0.556, "f": 0}, {"x": 0.992, "y": -0.336, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos0.99 難-0.34", "s": 0.715, "f": 0}, {"x": 0.993, "y": -0.39, "c": "近傍", "n": "ANAGRAMS I to Y [A]  n=2713 cos0.99 難-0.39", "s": 0.728, "f": 0}, {"x": 0.992, "y": -0.295, "c": "近傍", "n": "Tropical April [H]  n=2580 cos0.99 難-0.29", "s": 0.692, "f": 0}, {"x": 0.992, "y": -0.241, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2645 cos0.99 難-0.24", "s": 0.71, "f": 0}, {"x": 0.993, "y": -0.097, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.10", "s": 0.8, "f": 0}, {"x": 0.991, "y": -0.183, "c": "近傍", "n": "朱と碧のランページ [A]  n=1033 cos0.99 難-0.18", "s": 0.277, "f": 0}, {"x": 0.992, "y": -0.436, "c": "近傍", "n": "Fantastic Merry-Go-Round [A]  n=2074 cos0.99 難-0.44", "s": 0.557, "f": 0}, {"x": 0.99, "y": -0.173, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos0.99 難-0.17", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.351, "c": "近傍", "n": "I know You know [A]  n=2736 cos0.99 難-0.35", "s": 0.734, "f": 0}, {"x": 0.992, "y": -0.437, "c": "近傍", "n": "鏡像都市 [A]  n=902 cos0.99 難-0.44", "s": 0.242, "f": 0}, {"x": 0.99, "y": -0.255, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos0.99 難-0.26", "s": 0.751, "f": 0}, {"x": 0.991, "y": -0.41, "c": "近傍", "n": "THE DETONATOR [H]  n=2220 cos0.99 難-0.41", "s": 0.596, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35118667960493366}, {"a": 0, "b": 2, "w": 0.39208390412554683}, {"a": 0, "b": 3, "w": 0.34582776300510154}, {"a": 0, "b": 4, "w": 0.3661838420010759}, {"a": 0, "b": 5, "w": 0.27155485380170286}, {"a": 0, "b": 6, "w": 0.18050346202545786}, {"a": 0, "b": 7, "w": 0.2276766398315998}, {"a": 0, "b": 8, "w": 0.3324800141096811}, {"a": 0, "b": 9, "w": 0.23979076688900158}, {"a": 0, "b": 10, "w": 0.3129401323964981}, {"a": 0, "b": 11, "w": 6.115585815535951e-11}, {"a": 0, "b": 12, "w": 0.2607307254400957}, {"a": 0, "b": 13, "w": 0.10740172525602942}, {"a": 0, "b": 14, "w": 0.010804716487031296}, {"a": 0, "b": 15, "w": 0.2657625487264592}, {"a": 0, "b": 16, "w": 0.15004259319337232}, {"a": 0, "b": 17, "w": 0.15148429635979588}, {"a": 0, "b": 18, "w": 0.2362322888731322}, {"a": 0, "b": 19, "w": 0.1881208703093683}, {"a": 0, "b": 20, "w": 0.10944818405721835}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.464,hiY=-0.069;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
