<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MINT [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.313, "c": "種", "n": "MINT [H]  n=2436 cos1.00 難-0.31", "s": 0.685, "f": 0}, {"x": 0.998, "y": -0.248, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos1.00 難-0.25", "s": 0.781, "f": 0}, {"x": 0.998, "y": -0.212, "c": "近傍", "n": "7 Colors [A]  n=1872 cos1.00 難-0.21", "s": 0.526, "f": 0}, {"x": 0.997, "y": -0.167, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos1.00 難-0.17", "s": 0.207, "f": 0}, {"x": 0.995, "y": -0.373, "c": "近傍", "n": "Saturn [H]  n=2300 cos1.00 難-0.37", "s": 0.647, "f": 0}, {"x": 0.996, "y": -0.221, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos1.00 難-0.22", "s": 0.717, "f": 0}, {"x": 0.995, "y": -0.393, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos1.00 難-0.39", "s": 0.719, "f": 0}, {"x": 0.995, "y": -0.355, "c": "近傍", "n": "ZZ [H]  n=3341 cos0.99 難-0.36", "s": 0.939, "f": 0}, {"x": 0.994, "y": -0.41, "c": "近傍", "n": "陽炎 [A]  n=2850 cos0.99 難-0.41", "s": 0.801, "f": 0}, {"x": 0.996, "y": -0.137, "c": "近傍", "n": "If [A]  n=2170 cos1.00 難-0.14", "s": 0.61, "f": 0}, {"x": 0.994, "y": -0.18, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos0.99 難-0.18", "s": 0.398, "f": 0}, {"x": 0.993, "y": -0.325, "c": "近傍", "n": "OOO [A]  n=3557 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.201, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.20", "s": 0.598, "f": 0}, {"x": 0.993, "y": -0.362, "c": "近傍", "n": "No Day But Today! [A]  n=2351 cos0.99 難-0.36", "s": 0.661, "f": 0}, {"x": 0.993, "y": -0.29, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos0.99 難-0.29", "s": 0.285, "f": 0}, {"x": 0.995, "y": -0.508, "c": "近傍", "n": "IMPLANTATION [H]  n=2233 cos0.99 難-0.51", "s": 0.628, "f": 0}, {"x": 0.993, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.32", "s": 0.95, "f": 0}, {"x": 0.993, "y": -0.308, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.31", "s": 0.648, "f": 0}, {"x": 0.992, "y": -0.343, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.99 難-0.34", "s": 0.697, "f": 0}, {"x": 0.995, "y": -0.111, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos0.99 難-0.11", "s": 0.874, "f": 0}, {"x": 0.993, "y": -0.18, "c": "近傍", "n": "EXE [A]  n=3025 cos0.99 難-0.18", "s": 0.85, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5974891220200782}, {"a": 0, "b": 2, "w": 0.6204268803809667}, {"a": 0, "b": 3, "w": 0.511230801669698}, {"a": 0, "b": 4, "w": 0.3504644397828114}, {"a": 0, "b": 5, "w": 0.4868127823063977}, {"a": 0, "b": 6, "w": 0.43801885395887674}, {"a": 0, "b": 7, "w": 0.4196335804204073}, {"a": 0, "b": 8, "w": 0.33596584058964574}, {"a": 0, "b": 9, "w": 0.2016715555734525}, {"a": 0, "b": 10, "w": 0.3744410145909749}, {"a": 0, "b": 11, "w": 0.3611938467111516}, {"a": 0, "b": 12, "w": 0.30027262611413896}, {"a": 0, "b": 13, "w": 0.16502273274177548}, {"a": 0, "b": 14, "w": 0.3453454924575068}, {"a": 0, "b": 15, "w": 0.415685349023023}, {"a": 0, "b": 16, "w": 0.300631266142275}, {"a": 0, "b": 17, "w": 0.17588068464530437}, {"a": 0, "b": 18, "w": 5.759170917940537e-11}, {"a": 0, "b": 19, "w": 0.14757040346620365}, {"a": 0, "b": 20, "w": 0.2473684624791025}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.540,hiY=-0.079;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
