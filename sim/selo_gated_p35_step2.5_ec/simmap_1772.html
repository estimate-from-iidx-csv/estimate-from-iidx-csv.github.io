<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Bow shock!! [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.376, "c": "種", "n": "Bow shock!! [A]  n=2972 cos1.00 難0.38", "s": 0.881, "f": 0}, {"x": 0.998, "y": 0.374, "c": "近傍", "n": "Never Fade Away [A]  n=3150 cos1.00 難0.37", "s": 0.934, "f": 0}, {"x": 0.998, "y": 0.363, "c": "近傍", "n": "Moving on [A]  n=3017 cos1.00 難0.36", "s": 0.894, "f": 0}, {"x": 0.997, "y": 0.312, "c": "近傍", "n": "LAST DAY [A]  n=2629 cos1.00 難0.31", "s": 0.779, "f": 0}, {"x": 0.997, "y": 0.469, "c": "近傍", "n": "THE CANNONBALLER [A]  n=3345 cos1.00 難0.47", "s": 0.991, "f": 0}, {"x": 0.996, "y": 0.357, "c": "近傍", "n": "GloriosA [A]  n=1782 cos1.00 難0.36", "s": 0.528, "f": 0}, {"x": 0.995, "y": 0.4, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3025 cos1.00 難0.40", "s": 0.897, "f": 0}, {"x": 0.995, "y": 0.343, "c": "近傍", "n": "Show Me All Your Love [A]  n=1153 cos1.00 難0.34", "s": 0.342, "f": 0}, {"x": 0.995, "y": 0.366, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos0.99 難0.37", "s": 0.968, "f": 0}, {"x": 0.995, "y": 0.324, "c": "近傍", "n": "rumrum triplets [A]  n=3302 cos0.99 難0.32", "s": 0.979, "f": 0}, {"x": 0.997, "y": 0.504, "c": "近傍", "n": "Mukade [A]  n=1863 cos1.00 難0.50", "s": 0.552, "f": 0}, {"x": 0.996, "y": 0.493, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1359 cos1.00 難0.49", "s": 0.403, "f": 0}, {"x": 0.994, "y": 0.377, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.99 難0.38", "s": 0.958, "f": 0}, {"x": 0.995, "y": 0.275, "c": "近傍", "n": "yamabiko (SINOBUZ Edition) [A]  n=3150 cos1.00 難0.27", "s": 0.934, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos0.99 難0.30", "s": 0.531, "f": 0}, {"x": 0.994, "y": 0.384, "c": "近傍", "n": "明鏡止水 [A]  n=3157 cos0.99 難0.38", "s": 0.936, "f": 0}, {"x": 0.995, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.26", "s": 0.305, "f": 0}, {"x": 0.994, "y": 0.313, "c": "近傍", "n": "20XX [A]  n=1765 cos0.99 難0.31", "s": 0.523, "f": 0}, {"x": 0.994, "y": 0.459, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos0.99 難0.46", "s": 0.95, "f": 0}, {"x": 0.994, "y": 0.295, "c": "近傍", "n": "ウツシミウツシ [A]  n=2337 cos0.99 難0.30", "s": 0.693, "f": 0}, {"x": 0.994, "y": 0.465, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3374 cos0.99 難0.47", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39746764767998943}, {"a": 0, "b": 2, "w": 0.34838197307178387}, {"a": 0, "b": 3, "w": 0.4802476746991938}, {"a": 0, "b": 4, "w": 0.3774119253895374}, {"a": 0, "b": 5, "w": 0.3806764308005077}, {"a": 0, "b": 6, "w": 0.3165252621707719}, {"a": 0, "b": 7, "w": 0.2948467365059456}, {"a": 0, "b": 8, "w": 0.27570181544427164}, {"a": 0, "b": 9, "w": 0.3106418906194921}, {"a": 0, "b": 10, "w": 0.3697562468111093}, {"a": 0, "b": 11, "w": 0.32199651730748957}, {"a": 0, "b": 12, "w": 5.360045740587793e-11}, {"a": 0, "b": 13, "w": 0.2517928702028116}, {"a": 0, "b": 14, "w": 0.2436211832466818}, {"a": 0, "b": 15, "w": 0.1948952374963473}, {"a": 0, "b": 16, "w": 0.17515335887200922}, {"a": 0, "b": 17, "w": 0.21829073169657243}, {"a": 0, "b": 18, "w": 0.24124385343286314}, {"a": 0, "b": 19, "w": 0.2715575717594698}, {"a": 0, "b": 20, "w": 0.2634946903280768}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=0.242,hiY=0.523;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
