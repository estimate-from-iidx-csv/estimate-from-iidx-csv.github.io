<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">WAKE UP NOW [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.509, "c": "種", "n": "WAKE UP NOW [A]  n=2296 cos1.00 難-0.51", "s": 0.662, "f": 0}, {"x": 0.996, "y": -0.483, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1933 cos1.00 難-0.48", "s": 0.557, "f": 0}, {"x": 0.994, "y": -0.446, "c": "近傍", "n": "INFERNO [A]  n=2475 cos0.99 難-0.45", "s": 0.713, "f": 0}, {"x": 0.995, "y": -0.657, "c": "近傍", "n": "CaptivAte～誓い～ [H]  n=2186 cos1.00 難-0.66", "s": 0.63, "f": 0}, {"x": 0.994, "y": -0.411, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.41", "s": 0.861, "f": 0}, {"x": 0.997, "y": -0.29, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos1.00 難-0.29", "s": 0.293, "f": 0}, {"x": 0.993, "y": -0.5, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2537 cos0.99 難-0.50", "s": 0.731, "f": 0}, {"x": 0.995, "y": -0.322, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.32", "s": 0.974, "f": 0}, {"x": 0.992, "y": -0.569, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.57", "s": 0.749, "f": 0}, {"x": 0.992, "y": -0.524, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos0.99 難-0.52", "s": 0.658, "f": 0}, {"x": 0.995, "y": -0.294, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2711 cos0.99 難-0.29", "s": 0.781, "f": 0}, {"x": 0.991, "y": -0.558, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3469 cos0.99 難-0.56", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.3, "c": "近傍", "n": "STAR FIELD [A]  n=2390 cos0.99 難-0.30", "s": 0.689, "f": 0}, {"x": 0.991, "y": -0.428, "c": "近傍", "n": "neogenesis [A]  n=2777 cos0.99 難-0.43", "s": 0.801, "f": 0}, {"x": 0.991, "y": -0.407, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos0.99 難-0.41", "s": 0.733, "f": 0}, {"x": 0.992, "y": -0.373, "c": "近傍", "n": "Saturn [H]  n=2300 cos0.99 難-0.37", "s": 0.663, "f": 0}, {"x": 0.992, "y": -0.333, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos0.99 難-0.33", "s": 0.83, "f": 0}, {"x": 0.992, "y": -0.647, "c": "近傍", "n": "Broken Sword [H]  n=2592 cos0.99 難-0.65", "s": 0.747, "f": 0}, {"x": 0.993, "y": -0.299, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.729, "f": 0}, {"x": 0.993, "y": -0.31, "c": "近傍", "n": "thunder [A]  n=2861 cos0.99 難-0.31", "s": 0.825, "f": 0}, {"x": 0.991, "y": -0.39, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos0.99 難-0.39", "s": 0.739, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5008926772444222}, {"a": 0, "b": 2, "w": 0.3750208070555131}, {"a": 0, "b": 3, "w": 0.3492995620129016}, {"a": 0, "b": 4, "w": 0.19908707061080877}, {"a": 0, "b": 5, "w": 0.5498844032477557}, {"a": 0, "b": 6, "w": 0.23164478557939872}, {"a": 0, "b": 7, "w": 0.33229294782488483}, {"a": 0, "b": 8, "w": 0.13602201697392347}, {"a": 0, "b": 9, "w": 0.2566032809615212}, {"a": 0, "b": 10, "w": 0.38099870272713876}, {"a": 0, "b": 11, "w": 0.25056755430431776}, {"a": 0, "b": 12, "w": 0.3460405317109758}, {"a": 0, "b": 13, "w": 0.22888386070165778}, {"a": 0, "b": 14, "w": 6.181766210033857e-11}, {"a": 0, "b": 15, "w": 0.09650796186361088}, {"a": 0, "b": 16, "w": 0.014160919397198879}, {"a": 0, "b": 17, "w": 0.11501631369846421}, {"a": 0, "b": 18, "w": 0.26069637037678406}, {"a": 0, "b": 19, "w": 0.3082134915887007}, {"a": 0, "b": 20, "w": 0.07191278196250939}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.687,hiY=-0.261;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
