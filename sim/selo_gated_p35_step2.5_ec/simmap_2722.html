<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MAX 360 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.385, "c": "種", "n": "MAX 360 [A]  n=1541 cos1.00 難1.39", "s": 0.461, "f": 0}, {"x": 0.993, "y": 1.409, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.99 難1.41", "s": 0.824, "f": 0}, {"x": 0.985, "y": 1.38, "c": "近傍", "n": "One More Lovely [A]  n=3342 cos0.98 難1.38", "s": 1.0, "f": 0}, {"x": 0.987, "y": 1.467, "c": "近傍", "n": "2 Be Continued [A]  n=953 cos0.99 難1.47", "s": 0.285, "f": 0}, {"x": 0.984, "y": 1.394, "c": "近傍", "n": "ANCHOR [A]  n=2994 cos0.98 難1.39", "s": 0.896, "f": 0}, {"x": 0.987, "y": 1.482, "c": "近傍", "n": "DORNWALD ～Junge～ [A]  n=3068 cos0.99 難1.48", "s": 0.918, "f": 0}, {"x": 0.988, "y": 1.505, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [A]  n=3243 cos0.99 難1.51", "s": 0.97, "f": 0}, {"x": 0.984, "y": 1.331, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3075 cos0.98 難1.33", "s": 0.92, "f": 0}, {"x": 0.993, "y": 1.232, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3284 cos0.99 難1.23", "s": 0.983, "f": 0}, {"x": 0.982, "y": 1.39, "c": "近傍", "n": "neu [A]  n=3247 cos0.98 難1.39", "s": 0.972, "f": 0}, {"x": 0.983, "y": 1.439, "c": "近傍", "n": "Resonant [A]  n=1284 cos0.98 難1.44", "s": 0.384, "f": 0}, {"x": 0.991, "y": 1.233, "c": "近傍", "n": "Session 9 -Chronicles- [A]  n=3083 cos0.99 難1.23", "s": 0.923, "f": 0}, {"x": 0.984, "y": 1.3, "c": "近傍", "n": "NITROUS CANNON [A]  n=3128 cos0.98 難1.30", "s": 0.936, "f": 0}, {"x": 0.982, "y": 1.347, "c": "近傍", "n": "津軽雪 [A]  n=3214 cos0.98 難1.35", "s": 0.962, "f": 0}, {"x": 0.984, "y": 1.489, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3218 cos0.98 難1.49", "s": 0.963, "f": 0}, {"x": 0.99, "y": 1.224, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1198 cos0.99 難1.22", "s": 0.358, "f": 0}, {"x": 0.981, "y": 1.327, "c": "近傍", "n": "THANK YOU FOR PLAYING [L]  n=2944 cos0.98 難1.33", "s": 0.881, "f": 0}, {"x": 0.98, "y": 1.357, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.98 難1.36", "s": 0.952, "f": 0}, {"x": 0.98, "y": 1.407, "c": "近傍", "n": "quaver♪ [A]  n=3248 cos0.98 難1.41", "s": 0.972, "f": 0}, {"x": 0.98, "y": 1.421, "c": "近傍", "n": "Bad Maniacs [A]  n=3239 cos0.98 難1.42", "s": 0.969, "f": 0}, {"x": 0.985, "y": 1.246, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=945 cos0.98 難1.25", "s": 0.283, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47918416671283837}, {"a": 0, "b": 2, "w": 0.1951523659995621}, {"a": 0, "b": 3, "w": 0.10573448765831661}, {"a": 0, "b": 4, "w": 0.11111267133345726}, {"a": 0, "b": 5, "w": 0.24498459487893487}, {"a": 0, "b": 6, "w": 0.30395572752833877}, {"a": 0, "b": 7, "w": 0.19228024552752}, {"a": 0, "b": 8, "w": 0.4474423819988057}, {"a": 0, "b": 9, "w": 0.07510483836600346}, {"a": 0, "b": 10, "w": 0.1339041161664083}, {"a": 0, "b": 11, "w": 0.20380401706928641}, {"a": 0, "b": 12, "w": 0.11487919250106227}, {"a": 0, "b": 13, "w": 3.131017667357128e-11}, {"a": 0, "b": 14, "w": 0.16890947526644673}, {"a": 0, "b": 15, "w": 0.35473569038080144}, {"a": 0, "b": 16, "w": 0.12976370200522758}, {"a": 0, "b": 17, "w": 0.04521678688200448}, {"a": 0, "b": 18, "w": 0.017613395763106277}, {"a": 0, "b": 19, "w": 0.03627314575236773}, {"a": 0, "b": 20, "w": 0.21144676278469843}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=1.202,hiY=1.528;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
