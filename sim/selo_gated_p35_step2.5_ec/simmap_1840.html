<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Divine Heaven [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.245, "c": "種", "n": "Divine Heaven [A]  n=1989 cos1.00 難0.24", "s": 0.559, "f": 0}, {"x": 0.995, "y": 0.175, "c": "近傍", "n": "BLUST OF WIND [L]  n=1626 cos0.99 難0.18", "s": 0.457, "f": 0}, {"x": 0.994, "y": 0.236, "c": "近傍", "n": "HEISEI [A]  n=3350 cos0.99 難0.24", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.11, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos1.00 難0.11", "s": 0.67, "f": 0}, {"x": 0.994, "y": 0.261, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos0.99 難0.26", "s": 0.289, "f": 0}, {"x": 0.994, "y": 0.178, "c": "近傍", "n": "Ember Lights [A]  n=3417 cos0.99 難0.18", "s": 0.961, "f": 0}, {"x": 0.994, "y": 0.33, "c": "近傍", "n": "2 tribe 4 K [A]  n=3259 cos0.99 難0.33", "s": 0.917, "f": 0}, {"x": 0.994, "y": 0.185, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2303 cos0.99 難0.18", "s": 0.648, "f": 0}, {"x": 0.994, "y": 0.36, "c": "近傍", "n": "Constellation [A]  n=1134 cos0.99 難0.36", "s": 0.319, "f": 0}, {"x": 0.993, "y": 0.265, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos0.99 難0.27", "s": 0.963, "f": 0}, {"x": 0.993, "y": 0.155, "c": "近傍", "n": "Ambush Ace [A]  n=1736 cos0.99 難0.16", "s": 0.488, "f": 0}, {"x": 0.993, "y": 0.293, "c": "近傍", "n": "Advent Infamous [A]  n=2555 cos0.99 難0.29", "s": 0.719, "f": 0}, {"x": 0.993, "y": 0.129, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.221, "c": "近傍", "n": "Get On Your Feet [A]  n=1761 cos0.99 難0.22", "s": 0.495, "f": 0}, {"x": 0.992, "y": 0.295, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2433 cos0.99 難0.30", "s": 0.684, "f": 0}, {"x": 0.993, "y": 0.131, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos0.99 難0.13", "s": 0.511, "f": 0}, {"x": 0.993, "y": 0.113, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos0.99 難0.11", "s": 0.892, "f": 0}, {"x": 0.992, "y": 0.295, "c": "近傍", "n": "Primitive Vibes [A]  n=3448 cos0.99 難0.30", "s": 0.97, "f": 0}, {"x": 0.992, "y": 0.228, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos0.99 難0.23", "s": 0.811, "f": 0}, {"x": 0.993, "y": 0.081, "c": "近傍", "n": "n'pa pa BBQ [A]  n=3524 cos0.99 難0.08", "s": 0.991, "f": 0}, {"x": 0.992, "y": 0.262, "c": "近傍", "n": "Last Card [A]  n=828 cos0.99 難0.26", "s": 0.233, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1724770362501823}, {"a": 0, "b": 2, "w": 0.07411441622847448}, {"a": 0, "b": 3, "w": 0.1595688592052984}, {"a": 0, "b": 4, "w": 0.09798448479806332}, {"a": 0, "b": 5, "w": 0.11932820908557318}, {"a": 0, "b": 6, "w": 0.16318817159491716}, {"a": 0, "b": 7, "w": 0.22280558176938536}, {"a": 0, "b": 8, "w": 0.1917621358190449}, {"a": 0, "b": 9, "w": 0.1504943843118074}, {"a": 0, "b": 10, "w": 0.22535872879895125}, {"a": 0, "b": 11, "w": 0.19998718655429637}, {"a": 0, "b": 12, "w": 0.05209696380352724}, {"a": 0, "b": 13, "w": 0.17301882994024242}, {"a": 0, "b": 14, "w": 0.0035527287043664035}, {"a": 0, "b": 15, "w": 0.1751025036023851}, {"a": 0, "b": 16, "w": 0.06985526809460729}, {"a": 0, "b": 17, "w": 0.12267503520484246}, {"a": 0, "b": 18, "w": 0.09837284759754217}, {"a": 0, "b": 19, "w": 0.1882992364646393}, {"a": 0, "b": 20, "w": 5.319611418030945e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.058,hiY=0.382;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
