<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Highcharge Divolt [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.58, "c": "種", "n": "Highcharge Divolt [A]  n=3604 cos1.00 難0.58", "s": 0.996, "f": 0}, {"x": 0.992, "y": 0.505, "c": "近傍", "n": "朝焼けから始まるボクらの小さな旅 [A]  n=3074 cos0.99 難0.50", "s": 0.85, "f": 0}, {"x": 0.99, "y": 0.498, "c": "近傍", "n": "in the Sky [A]  n=3438 cos0.99 難0.50", "s": 0.951, "f": 0}, {"x": 0.989, "y": 0.574, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [A]  n=3059 cos0.99 難0.57", "s": 0.846, "f": 0}, {"x": 0.989, "y": 0.489, "c": "近傍", "n": "The Onlyonez [A]  n=1441 cos0.99 難0.49", "s": 0.398, "f": 0}, {"x": 0.989, "y": 0.454, "c": "近傍", "n": "Critical Crystal [A]  n=3617 cos0.99 難0.45", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.596, "c": "近傍", "n": "ディッシュウォッシャー◎彡おいわちゃん [A]  n=3070 cos0.99 難0.60", "s": 0.849, "f": 0}, {"x": 0.995, "y": 0.275, "c": "近傍", "n": "きみのせかい [A]  n=1145 cos1.00 難0.28", "s": 0.317, "f": 0}, {"x": 0.99, "y": 0.358, "c": "近傍", "n": "ELYSIUM [A]  n=1505 cos0.99 難0.36", "s": 0.416, "f": 0}, {"x": 0.987, "y": 0.444, "c": "近傍", "n": "Garuda [A]  n=2808 cos0.99 難0.44", "s": 0.776, "f": 0}, {"x": 0.987, "y": 0.438, "c": "近傍", "n": "STEEL NEEDLE [A]  n=3349 cos0.99 難0.44", "s": 0.926, "f": 0}, {"x": 0.987, "y": 0.678, "c": "近傍", "n": "Sword of Vengeance [A]  n=1658 cos0.99 難0.68", "s": 0.458, "f": 0}, {"x": 0.988, "y": 0.743, "c": "近傍", "n": "Megalara Garuda [A]  n=2812 cos0.99 難0.74", "s": 0.777, "f": 0}, {"x": 0.987, "y": 0.438, "c": "近傍", "n": "chaos eater -IIDX edition- [A]  n=3161 cos0.99 難0.44", "s": 0.874, "f": 0}, {"x": 0.986, "y": 0.568, "c": "近傍", "n": "Venom [A]  n=3552 cos0.99 難0.57", "s": 0.982, "f": 0}, {"x": 0.992, "y": 0.301, "c": "近傍", "n": "Cleopatrysm [A]  n=3255 cos0.99 難0.30", "s": 0.9, "f": 0}, {"x": 0.987, "y": 0.427, "c": "近傍", "n": "ADAMANT [A]  n=1507 cos0.99 難0.43", "s": 0.417, "f": 0}, {"x": 0.987, "y": 0.401, "c": "近傍", "n": "Ganymede [A]  n=3335 cos0.99 難0.40", "s": 0.922, "f": 0}, {"x": 0.992, "y": 0.279, "c": "近傍", "n": "月とミルク [A]  n=2662 cos0.99 難0.28", "s": 0.736, "f": 0}, {"x": 0.993, "y": 0.265, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3252 cos0.99 難0.27", "s": 0.899, "f": 0}, {"x": 0.993, "y": 0.264, "c": "近傍", "n": "オールトの雲 [A]  n=2473 cos0.99 難0.26", "s": 0.684, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48165902446162756}, {"a": 0, "b": 2, "w": 0.385764812170587}, {"a": 0, "b": 3, "w": 0.17896339471137457}, {"a": 0, "b": 4, "w": 0.3175633066266159}, {"a": 0, "b": 5, "w": 0.3747814681476106}, {"a": 0, "b": 6, "w": 0.3593193173851591}, {"a": 0, "b": 7, "w": 0.5011054956855174}, {"a": 0, "b": 8, "w": 0.4446647960704031}, {"a": 0, "b": 9, "w": 0.32757583785919375}, {"a": 0, "b": 10, "w": 0.21481563534214831}, {"a": 0, "b": 11, "w": 0.36195338051740467}, {"a": 0, "b": 12, "w": 0.38683148275849943}, {"a": 0, "b": 13, "w": 0.3249991614665275}, {"a": 0, "b": 14, "w": 0.34060097656602106}, {"a": 0, "b": 15, "w": 0.23524266197667454}, {"a": 0, "b": 16, "w": 0.36242699549607094}, {"a": 0, "b": 17, "w": 2.98751023919408e-11}, {"a": 0, "b": 18, "w": 0.3299786731028632}, {"a": 0, "b": 19, "w": 0.27242543751568493}, {"a": 0, "b": 20, "w": 0.4444101124724017}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=0.226,hiY=0.781;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
