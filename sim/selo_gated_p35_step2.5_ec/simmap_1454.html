<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ou Legends [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.114, "c": "種", "n": "Ou Legends [H]  n=922 cos1.00 難-1.11", "s": 0.457, "f": 0}, {"x": 0.989, "y": -1.129, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1717 cos0.99 難-1.13", "s": 0.85, "f": 0}, {"x": 0.989, "y": -1.026, "c": "近傍", "n": "Trill auf G [H]  n=1800 cos0.99 難-1.03", "s": 0.892, "f": 0}, {"x": 0.989, "y": -0.964, "c": "近傍", "n": "終焔のClaudia [H]  n=803 cos0.99 難-0.96", "s": 0.398, "f": 0}, {"x": 0.987, "y": -0.997, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.00", "s": 0.663, "f": 0}, {"x": 0.987, "y": -1.241, "c": "近傍", "n": "#CMFLG [H]  n=891 cos0.99 難-1.24", "s": 0.441, "f": 0}, {"x": 0.986, "y": -0.989, "c": "近傍", "n": "Bad Encryption [H]  n=1504 cos0.99 難-0.99", "s": 0.745, "f": 0}, {"x": 0.986, "y": -0.993, "c": "近傍", "n": "Resonant [H]  n=560 cos0.99 難-0.99", "s": 0.277, "f": 0}, {"x": 0.984, "y": -1.036, "c": "近傍", "n": "Regina vespaE [H]  n=652 cos0.98 難-1.04", "s": 0.323, "f": 0}, {"x": 0.986, "y": -0.958, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-0.96", "s": 0.309, "f": 0}, {"x": 0.989, "y": -0.909, "c": "近傍", "n": "-65℃ [H]  n=1552 cos0.99 難-0.91", "s": 0.769, "f": 0}, {"x": 0.99, "y": -0.895, "c": "近傍", "n": "Without Heaven [H]  n=515 cos0.99 難-0.90", "s": 0.255, "f": 0}, {"x": 0.983, "y": -0.998, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos0.98 難-1.00", "s": 0.428, "f": 0}, {"x": 0.982, "y": -1.072, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos0.98 難-1.07", "s": 0.6, "f": 0}, {"x": 0.982, "y": -1.175, "c": "近傍", "n": "ACT0 [H]  n=762 cos0.98 難-1.17", "s": 0.377, "f": 0}, {"x": 0.981, "y": -1.122, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.98 難-1.12", "s": 0.797, "f": 0}, {"x": 0.981, "y": -1.12, "c": "近傍", "n": "frequent [H]  n=1106 cos0.98 難-1.12", "s": 0.548, "f": 0}, {"x": 0.987, "y": -0.916, "c": "近傍", "n": "The Last Apocalypse [H]  n=625 cos0.99 難-0.92", "s": 0.31, "f": 0}, {"x": 0.981, "y": -1.041, "c": "近傍", "n": "#The_Relentless [H]  n=2019 cos0.98 難-1.04", "s": 1.0, "f": 0}, {"x": 0.981, "y": -1.176, "c": "近傍", "n": "innocent revolver [H]  n=1332 cos0.98 難-1.18", "s": 0.66, "f": 0}, {"x": 0.981, "y": -1.178, "c": "近傍", "n": "九尾狐夜行 [H]  n=1567 cos0.98 難-1.18", "s": 0.776, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36031906797172997}, {"a": 0, "b": 2, "w": 0.3667899366566135}, {"a": 0, "b": 3, "w": 0.3908065641605668}, {"a": 0, "b": 4, "w": 0.34195111354719454}, {"a": 0, "b": 5, "w": 0.2466961150698983}, {"a": 0, "b": 6, "w": 0.3161219523163634}, {"a": 0, "b": 7, "w": 0.30821040436697833}, {"a": 0, "b": 8, "w": 0.24748850574598036}, {"a": 0, "b": 9, "w": 0.23539806383891215}, {"a": 0, "b": 10, "w": 0.38227285327405036}, {"a": 0, "b": 11, "w": 0.33909455415371503}, {"a": 0, "b": 12, "w": 0.25294864594909516}, {"a": 0, "b": 13, "w": 0.1975294891875946}, {"a": 0, "b": 14, "w": 0.22157270012087937}, {"a": 0, "b": 15, "w": 0.0623095893977057}, {"a": 0, "b": 16, "w": 0.15304882994860425}, {"a": 0, "b": 17, "w": 0.27024954117398026}, {"a": 0, "b": 18, "w": 0.08554746068978702}, {"a": 0, "b": 19, "w": 0.18229896191031858}, {"a": 0, "b": 20, "w": 3.669942127970671e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.269,hiY=-0.868;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
