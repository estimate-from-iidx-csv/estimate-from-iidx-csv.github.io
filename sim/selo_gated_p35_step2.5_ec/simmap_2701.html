<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level One [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.873, "c": "種", "n": "Level One [A]  n=2922 cos1.00 難1.87", "s": 0.959, "f": 0}, {"x": 0.993, "y": 1.886, "c": "近傍", "n": "Level 4 [A]  n=1729 cos0.99 難1.89", "s": 0.567, "f": 0}, {"x": 0.996, "y": 1.958, "c": "近傍", "n": "Level 3 [A]  n=2167 cos1.00 難1.96", "s": 0.711, "f": 0}, {"x": 0.985, "y": 1.791, "c": "近傍", "n": "2 Beasts Unchained [A]  n=1873 cos0.99 難1.79", "s": 0.615, "f": 0}, {"x": 0.986, "y": 1.73, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.99 難1.73", "s": 0.692, "f": 0}, {"x": 0.981, "y": 1.96, "c": "近傍", "n": "invoker [L]  n=2635 cos0.98 難1.96", "s": 0.865, "f": 0}, {"x": 0.987, "y": 1.705, "c": "近傍", "n": "LOCUS OF THE TRAVEL [A]  n=2105 cos0.99 難1.71", "s": 0.691, "f": 0}, {"x": 0.99, "y": 1.679, "c": "近傍", "n": "HEROES [A]  n=577 cos0.99 難1.68", "s": 0.189, "f": 0}, {"x": 0.979, "y": 1.958, "c": "近傍", "n": "Red. by Jack Trance [A]  n=2727 cos0.98 難1.96", "s": 0.895, "f": 0}, {"x": 0.985, "y": 1.704, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [A]  n=3048 cos0.98 難1.70", "s": 1.0, "f": 0}, {"x": 0.977, "y": 1.917, "c": "近傍", "n": "紫陽花 -AZISAI- [L]  n=1077 cos0.98 難1.92", "s": 0.353, "f": 0}, {"x": 0.993, "y": 2.092, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [A]  n=2332 cos0.99 難2.09", "s": 0.765, "f": 0}, {"x": 0.997, "y": 1.617, "c": "近傍", "n": "Cult Invitation [A]  n=1265 cos1.00 難1.62", "s": 0.415, "f": 0}, {"x": 0.988, "y": 2.117, "c": "近傍", "n": "WHA [A]  n=1878 cos0.99 難2.12", "s": 0.616, "f": 0}, {"x": 0.974, "y": 1.779, "c": "近傍", "n": "カジノファイヤーことみちゃん [L]  n=1076 cos0.97 難1.78", "s": 0.353, "f": 0}, {"x": 0.978, "y": 2.044, "c": "近傍", "n": "TOMAHAWK [A]  n=1925 cos0.98 難2.04", "s": 0.632, "f": 0}, {"x": 0.972, "y": 1.781, "c": "近傍", "n": "Makin' It [A]  n=971 cos0.97 難1.78", "s": 0.319, "f": 0}, {"x": 0.98, "y": 1.62, "c": "近傍", "n": "Miracle 5ympho X [L]  n=1295 cos0.98 難1.62", "s": 0.425, "f": 0}, {"x": 0.979, "y": 1.599, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.98 難1.60", "s": 0.733, "f": 0}, {"x": 0.976, "y": 1.591, "c": "近傍", "n": "Don't believe the hype [A]  n=2210 cos0.98 難1.59", "s": 0.725, "f": 0}, {"x": 0.966, "y": 2.041, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1606 cos0.97 難2.04", "s": 0.527, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4516741907009656}, {"a": 0, "b": 2, "w": 0.6099229006425269}, {"a": 0, "b": 3, "w": 0.3358806698204958}, {"a": 0, "b": 4, "w": 0.32055975803393566}, {"a": 0, "b": 5, "w": 0.23492198355539395}, {"a": 0, "b": 6, "w": 0.3656842070788511}, {"a": 0, "b": 7, "w": 0.4501018610180826}, {"a": 0, "b": 8, "w": 0.10420183731076682}, {"a": 0, "b": 9, "w": 0.3279590371537998}, {"a": 0, "b": 10, "w": 0.17787642294461214}, {"a": 0, "b": 11, "w": 0.5578191394580484}, {"a": 0, "b": 12, "w": 0.6139218232748693}, {"a": 0, "b": 13, "w": 0.37406808108367096}, {"a": 0, "b": 14, "w": 0.12075694150062644}, {"a": 0, "b": 15, "w": 0.17251039383530997}, {"a": 0, "b": 16, "w": 0.06602461182184938}, {"a": 0, "b": 17, "w": 0.20084946818833038}, {"a": 0, "b": 18, "w": 0.11930408730891406}, {"a": 0, "b": 19, "w": 0.16071064684271008}, {"a": 0, "b": 20, "w": 2.275557520192706e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.963,hiX=1.003,loY=1.549,hiY=2.159;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
