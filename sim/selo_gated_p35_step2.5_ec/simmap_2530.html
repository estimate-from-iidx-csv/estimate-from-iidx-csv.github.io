<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BLACK.by X-Cross Fade [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.504, "c": "種", "n": "BLACK.by X-Cross Fade [A]  n=3300 cos1.00 難1.50", "s": 0.998, "f": 0}, {"x": 0.988, "y": 1.617, "c": "近傍", "n": "Cult Invitation [A]  n=1265 cos0.99 難1.62", "s": 0.383, "f": 0}, {"x": 0.981, "y": 1.482, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2757 cos0.98 難1.48", "s": 0.834, "f": 0}, {"x": 0.981, "y": 1.62, "c": "近傍", "n": "Miracle 5ympho X [L]  n=1295 cos0.98 難1.62", "s": 0.392, "f": 0}, {"x": 0.992, "y": 1.73, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.99 難1.73", "s": 0.638, "f": 0}, {"x": 0.974, "y": 1.591, "c": "近傍", "n": "Don't believe the hype [A]  n=2210 cos0.97 難1.59", "s": 0.669, "f": 0}, {"x": 0.977, "y": 1.33, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1570 cos0.98 難1.33", "s": 0.475, "f": 0}, {"x": 0.979, "y": 1.307, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3148 cos0.98 難1.31", "s": 0.952, "f": 0}, {"x": 0.968, "y": 1.489, "c": "近傍", "n": "SOLAR ECLIPSE [A]  n=1659 cos0.97 難1.49", "s": 0.502, "f": 0}, {"x": 0.97, "y": 1.415, "c": "近傍", "n": "STARLIGHT DANCEHALL [L]  n=2924 cos0.97 難1.41", "s": 0.885, "f": 0}, {"x": 0.973, "y": 1.305, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [A]  n=2502 cos0.97 難1.31", "s": 0.757, "f": 0}, {"x": 0.969, "y": 1.321, "c": "近傍", "n": "Astra Blaze [A]  n=538 cos0.97 難1.32", "s": 0.163, "f": 0}, {"x": 0.969, "y": 1.704, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [A]  n=3048 cos0.97 難1.70", "s": 0.922, "f": 0}, {"x": 0.963, "y": 1.439, "c": "近傍", "n": "HADES [A]  n=3300 cos0.96 難1.44", "s": 0.998, "f": 0}, {"x": 0.977, "y": 1.237, "c": "近傍", "n": "Peaktime Booster [A]  n=1914 cos0.98 難1.24", "s": 0.579, "f": 0}, {"x": 0.967, "y": 1.679, "c": "近傍", "n": "HEROES [A]  n=577 cos0.97 難1.68", "s": 0.175, "f": 0}, {"x": 0.963, "y": 1.399, "c": "近傍", "n": "Dynamite [A]  n=3305 cos0.96 難1.40", "s": 1.0, "f": 0}, {"x": 0.959, "y": 1.494, "c": "近傍", "n": "廿 [L]  n=2719 cos0.96 難1.49", "s": 0.823, "f": 0}, {"x": 0.959, "y": 1.469, "c": "近傍", "n": "DEADHEAT [A]  n=3004 cos0.96 難1.47", "s": 0.909, "f": 0}, {"x": 0.958, "y": 1.487, "c": "近傍", "n": "Boomy and The Boost [A]  n=3146 cos0.96 難1.49", "s": 0.952, "f": 0}, {"x": 0.96, "y": 1.599, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.96 難1.60", "s": 0.676, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.419468737178857}, {"a": 0, "b": 2, "w": 0.2879419393654691}, {"a": 0, "b": 3, "w": 0.32254776276585917}, {"a": 0, "b": 4, "w": 0.4760916042891944}, {"a": 0, "b": 5, "w": 0.2671105098776475}, {"a": 0, "b": 6, "w": 0.26859716057424954}, {"a": 0, "b": 7, "w": 0.2917098948554788}, {"a": 0, "b": 8, "w": 0.21276737429343062}, {"a": 0, "b": 9, "w": 0.19039846453055043}, {"a": 0, "b": 10, "w": 0.25329633209382907}, {"a": 0, "b": 11, "w": 0.16536765415958088}, {"a": 0, "b": 12, "w": 0.21246244715663498}, {"a": 0, "b": 13, "w": 0.0382816078060334}, {"a": 0, "b": 14, "w": 0.21826858875593658}, {"a": 0, "b": 15, "w": 0.19620974840563976}, {"a": 0, "b": 16, "w": 0.1493019580143572}, {"a": 0, "b": 17, "w": 0.10299507882276882}, {"a": 0, "b": 18, "w": 1.780930958261706e-11}, {"a": 0, "b": 19, "w": 0.06306678272303012}, {"a": 0, "b": 20, "w": 0.03347960778389636}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.955,hiX=1.003,loY=1.198,hiY=1.770;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
