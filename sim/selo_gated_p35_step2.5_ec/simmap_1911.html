<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HEISEI [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.236, "c": "種", "n": "HEISEI [A]  n=3350 cos1.00 難0.24", "s": 0.909, "f": 0}, {"x": 0.996, "y": 0.175, "c": "近傍", "n": "BLUST OF WIND [L]  n=1626 cos1.00 難0.18", "s": 0.441, "f": 0}, {"x": 0.995, "y": 0.185, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2303 cos0.99 難0.18", "s": 0.625, "f": 0}, {"x": 0.995, "y": 0.231, "c": "近傍", "n": "鬼天 [A]  n=3356 cos0.99 難0.23", "s": 0.911, "f": 0}, {"x": 0.994, "y": 0.245, "c": "近傍", "n": "Divine Heaven [A]  n=1989 cos0.99 難0.24", "s": 0.54, "f": 0}, {"x": 0.995, "y": 0.36, "c": "近傍", "n": "Aublia [A]  n=3096 cos0.99 難0.36", "s": 0.84, "f": 0}, {"x": 0.994, "y": 0.178, "c": "近傍", "n": "Ember Lights [A]  n=3417 cos0.99 難0.18", "s": 0.927, "f": 0}, {"x": 0.994, "y": 0.111, "c": "近傍", "n": "パ→ピ→プ→Yeah! [A]  n=3685 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.221, "c": "近傍", "n": "Get On Your Feet [A]  n=1761 cos0.99 難0.22", "s": 0.478, "f": 0}, {"x": 0.993, "y": 0.324, "c": "近傍", "n": "ABSOLUTE [L]  n=3179 cos0.99 難0.32", "s": 0.863, "f": 0}, {"x": 0.994, "y": 0.385, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2466 cos0.99 難0.39", "s": 0.669, "f": 0}, {"x": 0.996, "y": -0.009, "c": "近傍", "n": "shuriken [A]  n=3146 cos1.00 難-0.01", "s": 0.854, "f": 0}, {"x": 0.993, "y": 0.119, "c": "近傍", "n": "Harmony and Lovely [A]  n=3541 cos0.99 難0.12", "s": 0.961, "f": 0}, {"x": 0.993, "y": 0.11, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.11", "s": 0.961, "f": 0}, {"x": 0.994, "y": 0.428, "c": "近傍", "n": "Ergosphere [A]  n=2075 cos0.99 難0.43", "s": 0.563, "f": 0}, {"x": 0.992, "y": 0.356, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.36", "s": 0.742, "f": 0}, {"x": 0.992, "y": 0.11, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos0.99 難0.11", "s": 0.646, "f": 0}, {"x": 0.992, "y": 0.155, "c": "近傍", "n": "Ambush Ace [A]  n=1736 cos0.99 難0.16", "s": 0.471, "f": 0}, {"x": 0.991, "y": 0.296, "c": "近傍", "n": "of the first magnitude [A]  n=2747 cos0.99 難0.30", "s": 0.745, "f": 0}, {"x": 0.991, "y": 0.138, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.99 難0.14", "s": 0.758, "f": 0}, {"x": 0.993, "y": -0.006, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos0.99 難-0.01", "s": 0.75, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5075258943539265}, {"a": 0, "b": 2, "w": 0.09449931861020011}, {"a": 0, "b": 3, "w": 0.34838629772315144}, {"a": 0, "b": 4, "w": 0.1462975099233017}, {"a": 0, "b": 5, "w": 0.4110967178641908}, {"a": 0, "b": 6, "w": 0.3613018800459402}, {"a": 0, "b": 7, "w": 0.2622685910035857}, {"a": 0, "b": 8, "w": 0.14525751042863255}, {"a": 0, "b": 9, "w": 0.17509157973898437}, {"a": 0, "b": 10, "w": 0.1438832527629874}, {"a": 0, "b": 11, "w": 0.5075215481860217}, {"a": 0, "b": 12, "w": 0.0367549272839659}, {"a": 0, "b": 13, "w": 0.19266979550945107}, {"a": 0, "b": 14, "w": 0.0050053994739357455}, {"a": 0, "b": 15, "w": 0.2607341395224507}, {"a": 0, "b": 16, "w": 0.2877674770911558}, {"a": 0, "b": 17, "w": 0.09262292267653771}, {"a": 0, "b": 18, "w": 4.904887607182218e-11}, {"a": 0, "b": 19, "w": 0.2667777394174756}, {"a": 0, "b": 20, "w": 0.13509163404673818}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.043,hiY=0.463;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
