<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">灼熱Beach Side Bunny [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.311, "c": "種", "n": "灼熱Beach Side Bunny [H]  n=3861 cos1.00 難-0.31", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.296, "c": "近傍", "n": "Red. by Jack Trance [H]  n=2978 cos0.99 難-0.30", "s": 0.771, "f": 0}, {"x": 0.991, "y": -0.438, "c": "近傍", "n": "Lords Of The Roundtable [H]  n=2285 cos0.99 難-0.44", "s": 0.592, "f": 0}, {"x": 0.99, "y": -0.173, "c": "近傍", "n": "BLACK.by X-Cross Fade [H]  n=3723 cos0.99 難-0.17", "s": 0.964, "f": 0}, {"x": 0.99, "y": -0.51, "c": "近傍", "n": "灼熱 Lost Summer Dayz [H]  n=1451 cos0.99 難-0.51", "s": 0.376, "f": 0}, {"x": 0.986, "y": -0.31, "c": "近傍", "n": "Red. by Full Metal Jacket [H]  n=3709 cos0.99 難-0.31", "s": 0.961, "f": 0}, {"x": 0.987, "y": -0.168, "c": "近傍", "n": "Skratch Education Lv-1 [H]  n=718 cos0.99 難-0.17", "s": 0.186, "f": 0}, {"x": 0.986, "y": -0.436, "c": "近傍", "n": "199024club -Re:BounceKiller- [H]  n=2826 cos0.99 難-0.44", "s": 0.732, "f": 0}, {"x": 0.981, "y": -0.213, "c": "近傍", "n": "Watch out!! [A]  n=3272 cos0.98 難-0.21", "s": 0.847, "f": 0}, {"x": 0.983, "y": 0.001, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.98 難0.00", "s": 0.602, "f": 0}, {"x": 0.978, "y": -0.479, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [H]  n=1812 cos0.98 難-0.48", "s": 0.469, "f": 0}, {"x": 0.984, "y": -0.684, "c": "近傍", "n": "naughty girl@Queen's Palace [H]  n=2762 cos0.98 難-0.68", "s": 0.715, "f": 0}, {"x": 0.99, "y": 0.145, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3740 cos0.99 難0.14", "s": 0.969, "f": 0}, {"x": 0.976, "y": -0.307, "c": "近傍", "n": "HEARTACHE [A]  n=2644 cos0.98 難-0.31", "s": 0.685, "f": 0}, {"x": 0.977, "y": -0.556, "c": "近傍", "n": "Macho Monky [H]  n=1760 cos0.98 難-0.56", "s": 0.456, "f": 0}, {"x": 0.974, "y": -0.414, "c": "近傍", "n": "The Chase [H]  n=2971 cos0.97 難-0.41", "s": 0.769, "f": 0}, {"x": 0.984, "y": 0.132, "c": "近傍", "n": "灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A]  n=2958 cos0.98 難0.13", "s": 0.766, "f": 0}, {"x": 0.979, "y": 0.074, "c": "近傍", "n": "Really Love [A]  n=3148 cos0.98 難0.07", "s": 0.815, "f": 0}, {"x": 0.971, "y": -0.245, "c": "近傍", "n": "FIRE FIRE [H]  n=3345 cos0.97 難-0.25", "s": 0.866, "f": 0}, {"x": 0.97, "y": -0.291, "c": "近傍", "n": "Bling-Bang-Bang-Born [A]  n=1523 cos0.97 難-0.29", "s": 0.394, "f": 0}, {"x": 0.984, "y": 0.217, "c": "近傍", "n": "Hella Deep [A]  n=2813 cos0.98 難0.22", "s": 0.729, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6442115439412021}, {"a": 0, "b": 2, "w": 0.5467828628995242}, {"a": 0, "b": 3, "w": 0.5375372345164464}, {"a": 0, "b": 4, "w": 0.47187690643603797}, {"a": 0, "b": 5, "w": 0.4480986207914339}, {"a": 0, "b": 6, "w": 0.4764122731579564}, {"a": 0, "b": 7, "w": 0.32766250326663926}, {"a": 0, "b": 8, "w": 0.33634550029056265}, {"a": 0, "b": 9, "w": 0.3923735793454718}, {"a": 0, "b": 10, "w": 0.32336411139380916}, {"a": 0, "b": 11, "w": 0.24499316111779446}, {"a": 0, "b": 12, "w": 0.541904691945498}, {"a": 0, "b": 13, "w": 0.23724063148974062}, {"a": 0, "b": 14, "w": 0.30701260134213404}, {"a": 0, "b": 15, "w": 0.18080810808754488}, {"a": 0, "b": 16, "w": 0.42172219105745257}, {"a": 0, "b": 17, "w": 0.1999936720486798}, {"a": 0, "b": 18, "w": 2.7594482254755803e-11}, {"a": 0, "b": 19, "w": 0.20193597394335105}, {"a": 0, "b": 20, "w": 0.34243654208504914}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.756,hiY=0.289;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
