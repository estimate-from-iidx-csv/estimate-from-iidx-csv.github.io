<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">rumrum triplets [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.439, "c": "種", "n": "rumrum triplets [H]  n=2692 cos1.00 難-0.44", "s": 0.773, "f": 0}, {"x": 0.994, "y": -0.508, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.99 難-0.51", "s": 0.841, "f": 0}, {"x": 0.993, "y": -0.469, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.47", "s": 0.652, "f": 0}, {"x": 0.993, "y": -0.547, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.99 難-0.55", "s": 0.705, "f": 0}, {"x": 0.992, "y": -0.56, "c": "近傍", "n": "Thunderbolt [H]  n=2738 cos0.99 難-0.56", "s": 0.786, "f": 0}, {"x": 0.993, "y": -0.248, "c": "近傍", "n": "妖隠し -あやかしかくし- [A]  n=3482 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.181, "c": "近傍", "n": "Magical [A]  n=3224 cos1.00 難-0.18", "s": 0.926, "f": 0}, {"x": 0.99, "y": -0.408, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.41", "s": 0.359, "f": 0}, {"x": 0.991, "y": -0.555, "c": "近傍", "n": "抱きしめてモナムール [H]  n=2133 cos0.99 難-0.55", "s": 0.613, "f": 0}, {"x": 0.99, "y": -0.486, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1232 cos0.99 難-0.49", "s": 0.354, "f": 0}, {"x": 0.992, "y": -0.626, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.99 難-0.63", "s": 0.654, "f": 0}, {"x": 0.99, "y": -0.336, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos0.99 難-0.34", "s": 0.765, "f": 0}, {"x": 0.989, "y": -0.412, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.99 難-0.41", "s": 0.895, "f": 0}, {"x": 0.99, "y": -0.308, "c": "近傍", "n": "Little Little Princess [H]  n=2749 cos0.99 難-0.31", "s": 0.789, "f": 0}, {"x": 0.99, "y": -0.604, "c": "近傍", "n": "Nightmare before oversleep [H]  n=2374 cos0.99 難-0.60", "s": 0.682, "f": 0}, {"x": 0.99, "y": -0.647, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.65", "s": 0.652, "f": 0}, {"x": 0.997, "y": -0.801, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos1.00 難-0.80", "s": 0.59, "f": 0}, {"x": 0.989, "y": -0.604, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.60", "s": 0.535, "f": 0}, {"x": 0.989, "y": -0.261, "c": "近傍", "n": "The Limbo [H]  n=2860 cos0.99 難-0.26", "s": 0.821, "f": 0}, {"x": 0.988, "y": -0.607, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.61", "s": 0.727, "f": 0}, {"x": 0.987, "y": -0.452, "c": "近傍", "n": "轟け！恋のビーンボール！！ [H]  n=3208 cos0.99 難-0.45", "s": 0.921, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4127114371071475}, {"a": 0, "b": 2, "w": 0.4104671514046997}, {"a": 0, "b": 3, "w": 0.44796549590773627}, {"a": 0, "b": 4, "w": 0.4105073656100259}, {"a": 0, "b": 5, "w": 0.4598648198563414}, {"a": 0, "b": 6, "w": 0.5873761763754504}, {"a": 0, "b": 7, "w": 0.309951252450018}, {"a": 0, "b": 8, "w": 0.17417431862234167}, {"a": 0, "b": 9, "w": 0.3127315550768055}, {"a": 0, "b": 10, "w": 0.372679118325298}, {"a": 0, "b": 11, "w": 0.3285307867144154}, {"a": 0, "b": 12, "w": 0.16584442434673352}, {"a": 0, "b": 13, "w": 0.23326697608382485}, {"a": 0, "b": 14, "w": 0.07882937552535796}, {"a": 0, "b": 15, "w": 0.3166680996720802}, {"a": 0, "b": 16, "w": 0.6656273887871392}, {"a": 0, "b": 17, "w": 0.26343359823468804}, {"a": 0, "b": 18, "w": 0.060646079696688004}, {"a": 0, "b": 19, "w": 0.20101484876706643}, {"a": 0, "b": 20, "w": 5.367439825931797e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.850,hiY=-0.132;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
