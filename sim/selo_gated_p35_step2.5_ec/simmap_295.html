<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">D.C.fish [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.752, "c": "種", "n": "D.C.fish [H]  n=1815 cos1.00 難-0.75", "s": 0.576, "f": 0}, {"x": 0.996, "y": -0.741, "c": "近傍", "n": "Quick Silver [H]  n=1940 cos1.00 難-0.74", "s": 0.616, "f": 0}, {"x": 0.996, "y": -0.683, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos1.00 難-0.68", "s": 0.812, "f": 0}, {"x": 0.996, "y": -0.679, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos1.00 難-0.68", "s": 0.588, "f": 0}, {"x": 0.995, "y": -0.809, "c": "近傍", "n": "Sphere [H]  n=1980 cos1.00 難-0.81", "s": 0.629, "f": 0}, {"x": 0.997, "y": -0.647, "c": "近傍", "n": "Broken Sword [H]  n=2592 cos1.00 難-0.65", "s": 0.823, "f": 0}, {"x": 0.995, "y": -0.722, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.72", "s": 0.605, "f": 0}, {"x": 0.997, "y": -0.644, "c": "近傍", "n": "ANTHEM LANDING [H]  n=2379 cos1.00 難-0.64", "s": 0.755, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "lower world [H]  n=1414 cos1.00 難-0.68", "s": 0.449, "f": 0}, {"x": 0.994, "y": -0.68, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.68", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.733, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.99 難-0.73", "s": 0.643, "f": 0}, {"x": 0.993, "y": -0.752, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos0.99 難-0.75", "s": 0.772, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.81", "s": 0.245, "f": 0}, {"x": 0.993, "y": -0.722, "c": "近傍", "n": "Konzert V [H]  n=2419 cos0.99 難-0.72", "s": 0.768, "f": 0}, {"x": 0.994, "y": -0.842, "c": "近傍", "n": "HYENA [H]  n=2379 cos0.99 難-0.84", "s": 0.755, "f": 0}, {"x": 0.993, "y": -0.728, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.73", "s": 0.521, "f": 0}, {"x": 0.993, "y": -0.679, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.68", "s": 0.479, "f": 0}, {"x": 0.993, "y": -0.795, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.80", "s": 0.624, "f": 0}, {"x": 0.992, "y": -0.764, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.76", "s": 0.795, "f": 0}, {"x": 0.993, "y": -0.656, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.66", "s": 0.659, "f": 0}, {"x": 0.995, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.575, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4586794394847272}, {"a": 0, "b": 2, "w": 0.537483377322255}, {"a": 0, "b": 3, "w": 0.5134182920116946}, {"a": 0, "b": 4, "w": 0.3760075574923182}, {"a": 0, "b": 5, "w": 0.4906744865538418}, {"a": 0, "b": 6, "w": 0.4307159161664932}, {"a": 0, "b": 7, "w": 0.583930061256668}, {"a": 0, "b": 8, "w": 0.49935232503036997}, {"a": 0, "b": 9, "w": 0.4376255397357741}, {"a": 0, "b": 10, "w": 0.4155947515745976}, {"a": 0, "b": 11, "w": 0.4001777540304001}, {"a": 0, "b": 12, "w": 5.4508064728509e-11}, {"a": 0, "b": 13, "w": 0.2394411670433878}, {"a": 0, "b": 14, "w": 0.20786365653718653}, {"a": 0, "b": 15, "w": 0.35615832352179067}, {"a": 0, "b": 16, "w": 0.38560955574744915}, {"a": 0, "b": 17, "w": 0.33818477797917634}, {"a": 0, "b": 18, "w": 0.2633393801452616}, {"a": 0, "b": 19, "w": 0.40366661612545474}, {"a": 0, "b": 20, "w": 0.46954363547450695}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.861,hiY=-0.591;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
