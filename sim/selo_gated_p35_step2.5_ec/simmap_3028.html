<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">紅牡丹 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.439, "c": "種", "n": "紅牡丹 [A]  n=3745 cos1.00 難0.44", "s": 0.989, "f": 0}, {"x": 0.995, "y": 0.377, "c": "近傍", "n": "I'm so Happy [A]  n=3633 cos0.99 難0.38", "s": 0.959, "f": 0}, {"x": 0.996, "y": 0.318, "c": "近傍", "n": "SPECIAL SUMMER CAMPAIGN! [A]  n=3787 cos1.00 難0.32", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.472, "c": "近傍", "n": "Pollinosis [A]  n=3354 cos0.99 難0.47", "s": 0.886, "f": 0}, {"x": 0.993, "y": 0.45, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos0.99 難0.45", "s": 0.469, "f": 0}, {"x": 0.994, "y": 0.318, "c": "近傍", "n": "Night! Night! Night! [A]  n=2921 cos0.99 難0.32", "s": 0.771, "f": 0}, {"x": 0.993, "y": 0.397, "c": "近傍", "n": "DESIRE [A]  n=3355 cos0.99 難0.40", "s": 0.886, "f": 0}, {"x": 0.993, "y": 0.465, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3374 cos0.99 難0.47", "s": 0.891, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1793 cos0.99 難0.30", "s": 0.473, "f": 0}, {"x": 0.994, "y": 0.311, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.99 難0.31", "s": 0.622, "f": 0}, {"x": 0.992, "y": 0.404, "c": "近傍", "n": "REVOLVER [A]  n=2960 cos0.99 難0.40", "s": 0.782, "f": 0}, {"x": 0.992, "y": 0.439, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2693 cos0.99 難0.44", "s": 0.711, "f": 0}, {"x": 0.991, "y": 0.439, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.44", "s": 0.525, "f": 0}, {"x": 0.991, "y": 0.499, "c": "近傍", "n": "Debtty Daddy [A]  n=3106 cos0.99 難0.50", "s": 0.82, "f": 0}, {"x": 0.991, "y": 0.407, "c": "近傍", "n": "Ristaccia [A]  n=3758 cos0.99 難0.41", "s": 0.992, "f": 0}, {"x": 0.996, "y": 0.214, "c": "近傍", "n": "Pharaoh [A]  n=3343 cos1.00 難0.21", "s": 0.883, "f": 0}, {"x": 0.991, "y": 0.357, "c": "近傍", "n": "GloriosA [A]  n=1782 cos0.99 難0.36", "s": 0.471, "f": 0}, {"x": 0.992, "y": 0.309, "c": "近傍", "n": "bloomin' feeling [A]  n=3657 cos0.99 難0.31", "s": 0.966, "f": 0}, {"x": 0.993, "y": 0.611, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1840 cos0.99 難0.61", "s": 0.486, "f": 0}, {"x": 0.995, "y": 0.218, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2290 cos1.00 難0.22", "s": 0.605, "f": 0}, {"x": 0.991, "y": 0.374, "c": "近傍", "n": "Never Fade Away [A]  n=3150 cos0.99 難0.37", "s": 0.832, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.31245672041374783}, {"a": 0, "b": 2, "w": 0.5353894415482083}, {"a": 0, "b": 3, "w": 0.10559859800810811}, {"a": 0, "b": 4, "w": 0.3605145373663401}, {"a": 0, "b": 5, "w": 0.31036369510332684}, {"a": 0, "b": 6, "w": 0.2756260230482438}, {"a": 0, "b": 7, "w": 0.2606863171081124}, {"a": 0, "b": 8, "w": 0.3472601347509172}, {"a": 0, "b": 9, "w": 0.03323953653513878}, {"a": 0, "b": 10, "w": 0.26946100652751126}, {"a": 0, "b": 11, "w": 3.936040382512829e-11}, {"a": 0, "b": 12, "w": 0.10267902122013017}, {"a": 0, "b": 13, "w": 0.018259547128321563}, {"a": 0, "b": 14, "w": 0.16505273453869918}, {"a": 0, "b": 15, "w": 0.28835252686207213}, {"a": 0, "b": 16, "w": 0.14594148446900912}, {"a": 0, "b": 17, "w": 0.2629935693751896}, {"a": 0, "b": 18, "w": 0.3261392891336259}, {"a": 0, "b": 19, "w": 0.4290933040671442}, {"a": 0, "b": 20, "w": 0.2481463438078899}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.182,hiY=0.643;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
