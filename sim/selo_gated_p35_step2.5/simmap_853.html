<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Follow Tomorrow [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.344, "c": "種", "n": "Follow Tomorrow [A]  n=3529 cos1.00 難-0.34", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.258, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos1.00 難-0.26", "s": 0.773, "f": 0}, {"x": 0.998, "y": -0.245, "c": "近傍", "n": "深愛のリグレット [A]  n=2677 cos1.00 難-0.25", "s": 0.759, "f": 0}, {"x": 0.998, "y": -0.238, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos1.00 難-0.24", "s": 0.916, "f": 0}, {"x": 0.997, "y": -0.304, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos1.00 難-0.30", "s": 0.91, "f": 0}, {"x": 0.997, "y": -0.239, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3177 cos1.00 難-0.24", "s": 0.9, "f": 0}, {"x": 0.996, "y": -0.262, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos1.00 難-0.26", "s": 0.371, "f": 0}, {"x": 0.996, "y": -0.426, "c": "近傍", "n": "陽炎 [A]  n=2850 cos1.00 難-0.43", "s": 0.808, "f": 0}, {"x": 0.997, "y": -0.497, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1774 cos1.00 難-0.50", "s": 0.503, "f": 0}, {"x": 0.997, "y": -0.193, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2956 cos1.00 難-0.19", "s": 0.838, "f": 0}, {"x": 0.996, "y": -0.282, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos1.00 難-0.28", "s": 0.664, "f": 0}, {"x": 0.996, "y": -0.346, "c": "近傍", "n": "ラブキラ☆スプラッシュ [A]  n=2337 cos1.00 難-0.35", "s": 0.662, "f": 0}, {"x": 0.997, "y": -0.509, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1733 cos1.00 難-0.51", "s": 0.491, "f": 0}, {"x": 0.996, "y": -0.223, "c": "近傍", "n": "Hold My Hand [A]  n=2574 cos1.00 難-0.22", "s": 0.729, "f": 0}, {"x": 0.995, "y": -0.355, "c": "近傍", "n": "Dreaming Dream [A]  n=1434 cos1.00 難-0.36", "s": 0.406, "f": 0}, {"x": 0.996, "y": -0.42, "c": "近傍", "n": "まほろば [A]  n=2892 cos1.00 難-0.42", "s": 0.819, "f": 0}, {"x": 0.995, "y": -0.254, "c": "近傍", "n": "Last Burning [A]  n=3170 cos1.00 難-0.25", "s": 0.898, "f": 0}, {"x": 0.995, "y": -0.263, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos0.99 難-0.26", "s": 0.85, "f": 0}, {"x": 0.995, "y": -0.349, "c": "近傍", "n": "Stepper [A]  n=1978 cos0.99 難-0.35", "s": 0.56, "f": 0}, {"x": 0.995, "y": -0.341, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.34", "s": 0.935, "f": 0}, {"x": 0.995, "y": -0.318, "c": "近傍", "n": "Voo Doo Bamboleo [A]  n=2378 cos0.99 難-0.32", "s": 0.674, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46429606295186665}, {"a": 0, "b": 2, "w": 0.534942229895411}, {"a": 0, "b": 3, "w": 0.4765706554149246}, {"a": 0, "b": 4, "w": 0.39277264617387864}, {"a": 0, "b": 5, "w": 0.3864968608685979}, {"a": 0, "b": 6, "w": 0.385356200500682}, {"a": 0, "b": 7, "w": 0.2947459494211856}, {"a": 0, "b": 8, "w": 0.4388618404094978}, {"a": 0, "b": 9, "w": 0.441986667035387}, {"a": 0, "b": 10, "w": 0.22360602914770178}, {"a": 0, "b": 11, "w": 0.26159486849438585}, {"a": 0, "b": 12, "w": 0.3623937742457928}, {"a": 0, "b": 13, "w": 0.3191477667020799}, {"a": 0, "b": 14, "w": 0.27638447513341036}, {"a": 0, "b": 15, "w": 0.3038153092779672}, {"a": 0, "b": 16, "w": 0.15811251857235598}, {"a": 0, "b": 17, "w": 0.2699333727270369}, {"a": 0, "b": 18, "w": 0.1519068113850699}, {"a": 0, "b": 19, "w": 0.16430816786075253}, {"a": 0, "b": 20, "w": 6.977085575954334e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.534,hiY=-0.167;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
