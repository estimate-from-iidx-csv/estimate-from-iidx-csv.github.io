<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Zenith [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.589, "c": "種", "n": "Zenith [H]  n=751 cos1.00 難-1.59", "s": 0.423, "f": 0}, {"x": 0.976, "y": -1.538, "c": "近傍", "n": "Dawn Saga [H]  n=1270 cos0.98 難-1.54", "s": 0.715, "f": 0}, {"x": 0.982, "y": -1.464, "c": "近傍", "n": "神のシナリオ [H]  n=664 cos0.98 難-1.46", "s": 0.374, "f": 0}, {"x": 0.966, "y": -1.658, "c": "近傍", "n": "of the first magnitude [H]  n=847 cos0.97 難-1.66", "s": 0.477, "f": 0}, {"x": 0.961, "y": -1.558, "c": "近傍", "n": "SPEED ROCKER [H]  n=1120 cos0.96 難-1.56", "s": 0.631, "f": 0}, {"x": 0.974, "y": -1.755, "c": "近傍", "n": "Perfect Plan [H]  n=607 cos0.97 難-1.76", "s": 0.342, "f": 0}, {"x": 0.958, "y": -1.662, "c": "近傍", "n": "Nocturnal 2097 [H]  n=720 cos0.96 難-1.66", "s": 0.406, "f": 0}, {"x": 0.953, "y": -1.544, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.95 難-1.54", "s": 1.0, "f": 0}, {"x": 0.959, "y": -1.726, "c": "近傍", "n": "ハイテックトキオ [H]  n=1060 cos0.96 難-1.73", "s": 0.597, "f": 0}, {"x": 0.952, "y": -1.592, "c": "近傍", "n": "Change Yourself [H]  n=857 cos0.95 難-1.59", "s": 0.483, "f": 0}, {"x": 0.951, "y": -1.588, "c": "近傍", "n": "Backyard Stars [H]  n=766 cos0.95 難-1.59", "s": 0.432, "f": 0}, {"x": 0.958, "y": -1.45, "c": "近傍", "n": "Rising in the Sun(original mix) [H]  n=639 cos0.96 難-1.45", "s": 0.36, "f": 0}, {"x": 0.963, "y": -1.777, "c": "近傍", "n": "10000 MILES AWAY [H]  n=729 cos0.96 難-1.78", "s": 0.411, "f": 0}, {"x": 0.956, "y": -1.422, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.96 難-1.42", "s": 0.627, "f": 0}, {"x": 0.945, "y": -1.582, "c": "近傍", "n": "Parvati [H]  n=735 cos0.95 難-1.58", "s": 0.414, "f": 0}, {"x": 0.968, "y": -1.346, "c": "近傍", "n": "Vitrum [H]  n=1212 cos0.97 難-1.35", "s": 0.683, "f": 0}, {"x": 0.958, "y": -1.391, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1530 cos0.96 難-1.39", "s": 0.862, "f": 0}, {"x": 0.944, "y": -1.588, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1157 cos0.94 難-1.59", "s": 0.652, "f": 0}, {"x": 0.945, "y": -1.661, "c": "近傍", "n": "rough percussionythm [H]  n=1069 cos0.95 難-1.66", "s": 0.602, "f": 0}, {"x": 0.946, "y": -1.682, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.95 難-1.68", "s": 0.339, "f": 0}, {"x": 0.954, "y": -1.408, "c": "近傍", "n": "Static State [H]  n=1084 cos0.95 難-1.41", "s": 0.611, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3626772303591861}, {"a": 0, "b": 2, "w": 0.4205456714853595}, {"a": 0, "b": 3, "w": 0.24376003735260765}, {"a": 0, "b": 4, "w": 0.18801462404874514}, {"a": 0, "b": 5, "w": 0.2836985857799974}, {"a": 0, "b": 6, "w": 0.11545375746401498}, {"a": 0, "b": 7, "w": 0.1051879356311709}, {"a": 0, "b": 8, "w": 0.12100642786454296}, {"a": 0, "b": 9, "w": 0.07915571867003846}, {"a": 0, "b": 10, "w": 0.08905422130875096}, {"a": 0, "b": 11, "w": 0.11647647192514587}, {"a": 0, "b": 12, "w": 0.20285048836071717}, {"a": 0, "b": 13, "w": 0.1364996171824734}, {"a": 0, "b": 14, "w": 0.03294648677965095}, {"a": 0, "b": 15, "w": 0.2584238960470826}, {"a": 0, "b": 16, "w": 0.1580291797113912}, {"a": 0, "b": 17, "w": 3.19264614745407e-11}, {"a": 0, "b": 18, "w": 0.01361269327772141}, {"a": 0, "b": 19, "w": 0.02940392307398676}, {"a": 0, "b": 20, "w": 0.09375033767086538}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.940,hiX=1.004,loY=-1.811,hiY=-1.311;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
