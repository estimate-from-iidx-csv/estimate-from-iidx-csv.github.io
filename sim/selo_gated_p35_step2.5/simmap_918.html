<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LOVE B.B.B [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.305, "c": "種", "n": "LOVE B.B.B [A]  n=3198 cos1.00 難-0.30", "s": 0.841, "f": 0}, {"x": 0.997, "y": -0.262, "c": "近傍", "n": "Yellow Sunrise [A]  n=3127 cos1.00 難-0.26", "s": 0.822, "f": 0}, {"x": 0.995, "y": -0.346, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.35", "s": 0.673, "f": 0}, {"x": 0.994, "y": -0.297, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.30", "s": 0.606, "f": 0}, {"x": 0.994, "y": -0.339, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos0.99 難-0.34", "s": 0.372, "f": 0}, {"x": 0.993, "y": -0.233, "c": "近傍", "n": "EXE [A]  n=3025 cos0.99 難-0.23", "s": 0.796, "f": 0}, {"x": 0.993, "y": -0.284, "c": "近傍", "n": "Silvia Drive [A]  n=2194 cos0.99 難-0.28", "s": 0.577, "f": 0}, {"x": 0.992, "y": -0.313, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos0.99 難-0.31", "s": 0.73, "f": 0}, {"x": 0.992, "y": -0.256, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=992 cos0.99 難-0.26", "s": 0.261, "f": 0}, {"x": 0.993, "y": -0.4, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos0.99 難-0.40", "s": 0.923, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos0.99 難-0.25", "s": 0.685, "f": 0}, {"x": 0.992, "y": -0.386, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.39", "s": 0.822, "f": 0}, {"x": 0.992, "y": -0.441, "c": "近傍", "n": "朧 [A]  n=3802 cos0.99 難-0.44", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.484, "c": "近傍", "n": "KOTONOHA ft. Kotoha [A]  n=1510 cos0.99 難-0.48", "s": 0.397, "f": 0}, {"x": 0.99, "y": -0.295, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.29", "s": 0.671, "f": 0}, {"x": 0.991, "y": -0.379, "c": "近傍", "n": "808monkey [A]  n=2023 cos0.99 難-0.38", "s": 0.532, "f": 0}, {"x": 0.99, "y": -0.234, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.99 難-0.23", "s": 0.608, "f": 0}, {"x": 0.99, "y": -0.254, "c": "近傍", "n": "Several Words [A]  n=3039 cos0.99 難-0.25", "s": 0.799, "f": 0}, {"x": 0.99, "y": -0.303, "c": "近傍", "n": "YAKSHA [H]  n=2604 cos0.99 難-0.30", "s": 0.685, "f": 0}, {"x": 0.99, "y": -0.235, "c": "近傍", "n": "MINT [H]  n=2436 cos0.99 難-0.23", "s": 0.641, "f": 0}, {"x": 0.989, "y": -0.289, "c": "近傍", "n": "楽園追放 [A]  n=1689 cos0.99 難-0.29", "s": 0.444, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5172795626139935}, {"a": 0, "b": 2, "w": 0.5205276272277048}, {"a": 0, "b": 3, "w": 0.4383881219176733}, {"a": 0, "b": 4, "w": 0.4598871134055248}, {"a": 0, "b": 5, "w": 0.4144747378048286}, {"a": 0, "b": 6, "w": 0.20603755227436005}, {"a": 0, "b": 7, "w": 0.42005314932644844}, {"a": 0, "b": 8, "w": 0.38356268263079674}, {"a": 0, "b": 9, "w": 0.44333066405498023}, {"a": 0, "b": 10, "w": 0.21617622688215776}, {"a": 0, "b": 11, "w": 0.28564414212331357}, {"a": 0, "b": 12, "w": 0.4195966004751501}, {"a": 0, "b": 13, "w": 0.41830132058235414}, {"a": 0, "b": 14, "w": 0.35165785739043376}, {"a": 0, "b": 15, "w": 0.35591737892568565}, {"a": 0, "b": 16, "w": 0.15371751893329055}, {"a": 0, "b": 17, "w": 0.007477544313394868}, {"a": 0, "b": 18, "w": 4.8478110414862385e-11}, {"a": 0, "b": 19, "w": 0.3233452761954948}, {"a": 0, "b": 20, "w": 0.09598966535861697}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.504,hiY=-0.213;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
