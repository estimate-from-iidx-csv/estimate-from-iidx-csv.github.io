<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">東京神話 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.095, "c": "種", "n": "東京神話 [H]  n=1949 cos1.00 難-1.09", "s": 0.837, "f": 0}, {"x": 0.996, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos1.00 難-1.01", "s": 0.81, "f": 0}, {"x": 0.993, "y": -1.152, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1841 cos0.99 難-1.15", "s": 0.79, "f": 0}, {"x": 0.991, "y": -1.14, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [H]  n=1582 cos0.99 難-1.14", "s": 0.679, "f": 0}, {"x": 0.995, "y": -1.233, "c": "近傍", "n": "Always We Trust In You [H]  n=505 cos1.00 難-1.23", "s": 0.217, "f": 0}, {"x": 0.991, "y": -1.134, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=722 cos0.99 難-1.13", "s": 0.31, "f": 0}, {"x": 0.99, "y": -1.152, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.99 難-1.15", "s": 0.742, "f": 0}, {"x": 0.99, "y": -1.147, "c": "近傍", "n": "BIGソムタム [H]  n=1909 cos0.99 難-1.15", "s": 0.82, "f": 0}, {"x": 0.99, "y": -1.016, "c": "近傍", "n": "1116 [H]  n=662 cos0.99 難-1.02", "s": 0.284, "f": 0}, {"x": 0.991, "y": -0.987, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2186 cos0.99 難-0.99", "s": 0.939, "f": 0}, {"x": 0.989, "y": -1.124, "c": "近傍", "n": "Night sky [H]  n=2107 cos0.99 難-1.12", "s": 0.905, "f": 0}, {"x": 0.992, "y": -0.975, "c": "近傍", "n": "Hello Happiness [H]  n=2032 cos0.99 難-0.98", "s": 0.872, "f": 0}, {"x": 0.99, "y": -1.176, "c": "近傍", "n": "NANAIRO [H]  n=1415 cos0.99 難-1.18", "s": 0.608, "f": 0}, {"x": 0.988, "y": -1.043, "c": "近傍", "n": "Cult Invitation [H]  n=759 cos0.99 難-1.04", "s": 0.326, "f": 0}, {"x": 0.993, "y": -1.274, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.27", "s": 0.523, "f": 0}, {"x": 0.989, "y": -1.229, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.99 難-1.23", "s": 0.602, "f": 0}, {"x": 0.987, "y": -1.174, "c": "近傍", "n": "BLAZING_LAZER [H]  n=803 cos0.99 難-1.17", "s": 0.345, "f": 0}, {"x": 0.991, "y": -0.92, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.99 難-0.92", "s": 0.964, "f": 0}, {"x": 0.992, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.99 難-0.89", "s": 0.986, "f": 0}, {"x": 0.985, "y": -1.068, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [H]  n=1241 cos0.99 難-1.07", "s": 0.533, "f": 0}, {"x": 0.987, "y": -0.987, "c": "近傍", "n": "m1dy Deluxe [H]  n=2329 cos0.99 難-0.99", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5027444841972436}, {"a": 0, "b": 2, "w": 0.2862148305189268}, {"a": 0, "b": 3, "w": 0.22241048264676966}, {"a": 0, "b": 4, "w": 0.3699340013737571}, {"a": 0, "b": 5, "w": 0.07366966621900106}, {"a": 0, "b": 6, "w": 0.233602293943882}, {"a": 0, "b": 7, "w": 0.17148964431589175}, {"a": 0, "b": 8, "w": 5.983535888987035e-11}, {"a": 0, "b": 9, "w": 0.24853072225571504}, {"a": 0, "b": 10, "w": 0.189997085291983}, {"a": 0, "b": 11, "w": 0.22530742934364523}, {"a": 0, "b": 12, "w": 0.2170303375888697}, {"a": 0, "b": 13, "w": 0.10958490426286438}, {"a": 0, "b": 14, "w": 0.3233808319628443}, {"a": 0, "b": 15, "w": 0.16150771200782366}, {"a": 0, "b": 16, "w": 0.09111197651301861}, {"a": 0, "b": 17, "w": 0.12595347745291785}, {"a": 0, "b": 18, "w": 0.16847782727945293}, {"a": 0, "b": 19, "w": 0.04930914376021811}, {"a": 0, "b": 20, "w": 0.06646515460933744}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.305,hiY=-0.856;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
