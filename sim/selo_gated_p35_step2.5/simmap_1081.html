<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Tripping Jumping [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.107, "c": "種", "n": "Tripping Jumping [A]  n=1970 cos1.00 難-0.11", "s": 0.522, "f": 0}, {"x": 0.997, "y": 0.081, "c": "近傍", "n": "Shamshir [A]  n=1509 cos1.00 難0.08", "s": 0.4, "f": 0}, {"x": 0.992, "y": -0.082, "c": "近傍", "n": "Snake Stick [H]  n=3406 cos0.99 難-0.08", "s": 0.902, "f": 0}, {"x": 0.995, "y": -0.386, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3319 cos0.99 難-0.39", "s": 0.879, "f": 0}, {"x": 0.99, "y": 0.056, "c": "近傍", "n": "A Certified Rave Moment [A]  n=1123 cos0.99 難0.06", "s": 0.298, "f": 0}, {"x": 0.987, "y": -0.065, "c": "近傍", "n": "Non Stop Rock [A]  n=2198 cos0.99 難-0.06", "s": 0.582, "f": 0}, {"x": 0.986, "y": -0.192, "c": "近傍", "n": "Vibing! Shake it! [A]  n=1366 cos0.99 難-0.19", "s": 0.362, "f": 0}, {"x": 0.994, "y": 0.31, "c": "近傍", "n": "27th style [A]  n=2980 cos0.99 難0.31", "s": 0.79, "f": 0}, {"x": 0.985, "y": -0.132, "c": "近傍", "n": "NO LIMIT -オレ達に限界は無い- [A]  n=3121 cos0.98 難-0.13", "s": 0.827, "f": 0}, {"x": 0.984, "y": -0.028, "c": "近傍", "n": "Feedback [A]  n=2745 cos0.98 難-0.03", "s": 0.727, "f": 0}, {"x": 0.983, "y": -0.103, "c": "近傍", "n": "P.O.W.E.R. [A]  n=2497 cos0.98 難-0.10", "s": 0.662, "f": 0}, {"x": 0.983, "y": -0.025, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.98 難-0.03", "s": 0.616, "f": 0}, {"x": 0.983, "y": -0.272, "c": "近傍", "n": "Lift Us High [A]  n=2439 cos0.98 難-0.27", "s": 0.646, "f": 0}, {"x": 0.983, "y": -0.29, "c": "近傍", "n": "MENTAL MELTDOWN [H]  n=2512 cos0.98 難-0.29", "s": 0.666, "f": 0}, {"x": 0.985, "y": 0.232, "c": "近傍", "n": "Insane Techniques [A]  n=3376 cos0.99 難0.23", "s": 0.895, "f": 0}, {"x": 0.983, "y": 0.109, "c": "近傍", "n": "bass 2 bass [A]  n=3774 cos0.98 難0.11", "s": 1.0, "f": 0}, {"x": 0.982, "y": 0.015, "c": "近傍", "n": "Honey Trap [A]  n=3499 cos0.98 難0.02", "s": 0.927, "f": 0}, {"x": 0.981, "y": -0.035, "c": "近傍", "n": "Central Station [A]  n=2874 cos0.98 難-0.04", "s": 0.762, "f": 0}, {"x": 0.982, "y": -0.276, "c": "近傍", "n": "MAD ATTACK [A]  n=2734 cos0.98 難-0.28", "s": 0.724, "f": 0}, {"x": 0.981, "y": 0.006, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2166 cos0.98 難0.01", "s": 0.574, "f": 0}, {"x": 0.981, "y": -0.196, "c": "近傍", "n": "Frisk And Squeak [A]  n=1806 cos0.98 難-0.20", "s": 0.479, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6068907049082426}, {"a": 0, "b": 2, "w": 0.39362318019516873}, {"a": 0, "b": 3, "w": 0.5162412083339176}, {"a": 0, "b": 4, "w": 0.03878064640051215}, {"a": 0, "b": 5, "w": 0.20377863637992555}, {"a": 0, "b": 6, "w": 0.1998472683920275}, {"a": 0, "b": 7, "w": 0.4191429748708111}, {"a": 0, "b": 8, "w": 0.17754434467417712}, {"a": 0, "b": 9, "w": 4.005740183998796e-11}, {"a": 0, "b": 10, "w": 0.12285034308713172}, {"a": 0, "b": 11, "w": 0.10486967958409998}, {"a": 0, "b": 12, "w": 0.10074632115800497}, {"a": 0, "b": 13, "w": 0.05799072783033765}, {"a": 0, "b": 14, "w": 0.19523601756630726}, {"a": 0, "b": 15, "w": 0.12716402120354786}, {"a": 0, "b": 16, "w": 0.049143756083461554}, {"a": 0, "b": 17, "w": 0.09150990198753073}, {"a": 0, "b": 18, "w": 0.048524213737474065}, {"a": 0, "b": 19, "w": 0.07191442010400018}, {"a": 0, "b": 20, "w": 0.04568266310460589}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=-0.442,hiY=0.365;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
