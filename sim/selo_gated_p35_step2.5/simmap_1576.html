<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">voltississimo [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.874, "c": "種", "n": "voltississimo [H]  n=1811 cos1.00 難-0.87", "s": 0.58, "f": 0}, {"x": 0.99, "y": -0.793, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.79", "s": 0.575, "f": 0}, {"x": 0.991, "y": -1.076, "c": "近傍", "n": "Triple Cross [H]  n=1734 cos0.99 難-1.08", "s": 0.555, "f": 0}, {"x": 0.992, "y": -1.131, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.13", "s": 0.236, "f": 0}, {"x": 0.989, "y": -1.012, "c": "近傍", "n": "Binary Black Hole [H]  n=1335 cos0.99 難-1.01", "s": 0.428, "f": 0}, {"x": 0.992, "y": -1.153, "c": "近傍", "n": "glacia [H]  n=1069 cos0.99 難-1.15", "s": 0.342, "f": 0}, {"x": 0.988, "y": -0.81, "c": "近傍", "n": "Todestrieb [H]  n=3122 cos0.99 難-0.81", "s": 1.0, "f": 0}, {"x": 0.991, "y": -1.174, "c": "近傍", "n": "VOLAQUAS [H]  n=1075 cos0.99 難-1.17", "s": 0.344, "f": 0}, {"x": 0.989, "y": -1.093, "c": "近傍", "n": "cinder [H]  n=1446 cos0.99 難-1.09", "s": 0.463, "f": 0}, {"x": 0.988, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.81, "f": 0}, {"x": 0.99, "y": -1.162, "c": "近傍", "n": "朝焼けから始まるボクらの小さな旅 [H]  n=1459 cos0.99 難-1.16", "s": 0.467, "f": 0}, {"x": 0.992, "y": -0.531, "c": "近傍", "n": "Everlasting Message [H]  n=2008 cos0.99 難-0.53", "s": 0.643, "f": 0}, {"x": 0.988, "y": -1.048, "c": "近傍", "n": "Visterhv [H]  n=2069 cos0.99 難-1.05", "s": 0.663, "f": 0}, {"x": 0.987, "y": -0.797, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.80", "s": 0.529, "f": 0}, {"x": 0.986, "y": -0.875, "c": "近傍", "n": "XHRONOXAPSULΞ [H]  n=515 cos0.99 難-0.87", "s": 0.165, "f": 0}, {"x": 0.987, "y": -0.703, "c": "近傍", "n": "LOVELY STORM [H]  n=1965 cos0.99 難-0.70", "s": 0.629, "f": 0}, {"x": 0.986, "y": -0.87, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.99 難-0.87", "s": 0.502, "f": 0}, {"x": 0.986, "y": -0.864, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.86", "s": 0.64, "f": 0}, {"x": 0.987, "y": -1.052, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.99 難-1.05", "s": 0.328, "f": 0}, {"x": 0.989, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.728, "f": 0}, {"x": 0.985, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.562, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.488873943300663}, {"a": 0, "b": 2, "w": 0.4201088076854188}, {"a": 0, "b": 3, "w": 0.31808218557219103}, {"a": 0, "b": 4, "w": 0.3896377811416404}, {"a": 0, "b": 5, "w": 0.34388856239447907}, {"a": 0, "b": 6, "w": 0.09881458879613503}, {"a": 0, "b": 7, "w": 0.37674217410756206}, {"a": 0, "b": 8, "w": 0.30634569306455495}, {"a": 0, "b": 9, "w": 0.23860336012348837}, {"a": 0, "b": 10, "w": 0.20424475736623016}, {"a": 0, "b": 11, "w": 0.5603275892000239}, {"a": 0, "b": 12, "w": 0.3275042472501838}, {"a": 0, "b": 13, "w": 0.302314259559752}, {"a": 0, "b": 14, "w": 0.41584632694608237}, {"a": 0, "b": 15, "w": 0.26276425427237193}, {"a": 0, "b": 16, "w": 0.22922968274370792}, {"a": 0, "b": 17, "w": 0.1707075341606098}, {"a": 0, "b": 18, "w": 0.12364453929203079}, {"a": 0, "b": 19, "w": 3.0521807303784954e-11}, {"a": 0, "b": 20, "w": 0.15083174543454758}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.225,hiY=-0.480;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
