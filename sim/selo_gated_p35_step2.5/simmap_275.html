<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CODE -CRiMSON- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.494, "c": "種", "n": "CODE -CRiMSON- [H]  n=442 cos1.00 難-1.49", "s": 0.241, "f": 0}, {"x": 0.992, "y": -1.422, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.42", "s": 0.606, "f": 0}, {"x": 0.986, "y": -1.537, "c": "近傍", "n": "ONE AND ONLY [H]  n=844 cos0.99 難-1.54", "s": 0.46, "f": 0}, {"x": 0.985, "y": -1.45, "c": "近傍", "n": "Rising in the Sun(original mix) [H]  n=639 cos0.99 難-1.45", "s": 0.348, "f": 0}, {"x": 0.992, "y": -1.587, "c": "近傍", "n": "POLKAMANIA [H]  n=1248 cos0.99 難-1.59", "s": 0.68, "f": 0}, {"x": 0.989, "y": -1.579, "c": "近傍", "n": "Night! Night! Night! [H]  n=941 cos0.99 難-1.58", "s": 0.513, "f": 0}, {"x": 0.987, "y": -1.412, "c": "近傍", "n": "Sirius [H]  n=512 cos0.99 難-1.41", "s": 0.279, "f": 0}, {"x": 0.99, "y": -1.592, "c": "近傍", "n": "Change Yourself [H]  n=857 cos0.99 難-1.59", "s": 0.467, "f": 0}, {"x": 0.989, "y": -1.596, "c": "近傍", "n": "Overslept [H]  n=758 cos0.99 難-1.60", "s": 0.413, "f": 0}, {"x": 0.981, "y": -1.538, "c": "近傍", "n": "Dawn Saga [H]  n=1270 cos0.98 難-1.54", "s": 0.692, "f": 0}, {"x": 0.981, "y": -1.546, "c": "近傍", "n": "GIGA THRASH [H]  n=1177 cos0.98 難-1.55", "s": 0.641, "f": 0}, {"x": 0.981, "y": -1.408, "c": "近傍", "n": "Static State [H]  n=1084 cos0.98 難-1.41", "s": 0.59, "f": 0}, {"x": 0.978, "y": -1.558, "c": "近傍", "n": "SPEED ROCKER [H]  n=1120 cos0.98 難-1.56", "s": 0.61, "f": 0}, {"x": 0.977, "y": -1.519, "c": "近傍", "n": "VOLCANIC BIGBEAT [H]  n=758 cos0.98 難-1.52", "s": 0.413, "f": 0}, {"x": 0.975, "y": -1.528, "c": "近傍", "n": "Exhaust Hype [H]  n=1307 cos0.97 難-1.53", "s": 0.712, "f": 0}, {"x": 0.985, "y": -1.353, "c": "近傍", "n": "Abraxas [H]  n=1533 cos0.99 難-1.35", "s": 0.835, "f": 0}, {"x": 0.977, "y": -1.401, "c": "近傍", "n": "HARD BRAIN [H]  n=1255 cos0.98 難-1.40", "s": 0.684, "f": 0}, {"x": 0.99, "y": -1.327, "c": "近傍", "n": "Matt Silver [H]  n=1138 cos0.99 難-1.33", "s": 0.62, "f": 0}, {"x": 0.984, "y": -1.346, "c": "近傍", "n": "Scarlet Moon [H]  n=1836 cos0.98 難-1.35", "s": 1.0, "f": 0}, {"x": 0.973, "y": -1.447, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [H]  n=831 cos0.97 難-1.45", "s": 0.453, "f": 0}, {"x": 0.976, "y": -1.381, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [H]  n=1006 cos0.98 難-1.38", "s": 0.548, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4105168926134255}, {"a": 0, "b": 2, "w": 0.3360454755465271}, {"a": 0, "b": 3, "w": 0.31756248844020574}, {"a": 0, "b": 4, "w": 0.5053483332170614}, {"a": 0, "b": 5, "w": 0.32100487134161826}, {"a": 0, "b": 6, "w": 0.33786989850012994}, {"a": 0, "b": 7, "w": 0.3932645305188518}, {"a": 0, "b": 8, "w": 0.4041794103832058}, {"a": 0, "b": 9, "w": 0.15289732407851875}, {"a": 0, "b": 10, "w": 0.21687901369826623}, {"a": 0, "b": 11, "w": 0.2091251488536462}, {"a": 0, "b": 12, "w": 0.08728144828985773}, {"a": 0, "b": 13, "w": 0.11637269209508327}, {"a": 0, "b": 14, "w": 0.07519617948523538}, {"a": 0, "b": 15, "w": 0.27720959994368655}, {"a": 0, "b": 16, "w": 0.10743420857691188}, {"a": 0, "b": 17, "w": 0.4091530933755393}, {"a": 0, "b": 18, "w": 0.237175637581157}, {"a": 0, "b": 19, "w": 4.033973155515014e-11}, {"a": 0, "b": 20, "w": 0.0565890602986846}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=-1.618,hiY=-1.306;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
