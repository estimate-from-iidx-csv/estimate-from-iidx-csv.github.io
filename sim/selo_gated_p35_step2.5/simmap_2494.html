<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Aftermath [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.21, "c": "種", "n": "Aftermath [A]  n=2309 cos1.00 難1.21", "s": 0.66, "f": 0}, {"x": 0.996, "y": 1.108, "c": "近傍", "n": "Triple Cross [A]  n=2548 cos1.00 難1.11", "s": 0.728, "f": 0}, {"x": 0.991, "y": 1.097, "c": "近傍", "n": "Valanga [A]  n=3501 cos0.99 難1.10", "s": 1.0, "f": 0}, {"x": 0.987, "y": 1.236, "c": "近傍", "n": "cinder [A]  n=3236 cos0.99 難1.24", "s": 0.924, "f": 0}, {"x": 0.987, "y": 1.26, "c": "近傍", "n": "Vitrum [A]  n=2543 cos0.99 難1.26", "s": 0.726, "f": 0}, {"x": 0.993, "y": 1.367, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2273 cos0.99 難1.37", "s": 0.649, "f": 0}, {"x": 0.984, "y": 1.246, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2999 cos0.98 難1.25", "s": 0.857, "f": 0}, {"x": 0.983, "y": 1.264, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3343 cos0.98 難1.26", "s": 0.955, "f": 0}, {"x": 0.991, "y": 1.396, "c": "近傍", "n": "Lightspeed [A]  n=1144 cos0.99 難1.40", "s": 0.327, "f": 0}, {"x": 0.987, "y": 1.369, "c": "近傍", "n": "逆月 [A]  n=2284 cos0.99 難1.37", "s": 0.652, "f": 0}, {"x": 0.982, "y": 1.184, "c": "近傍", "n": "DOMINION [A]  n=3448 cos0.98 難1.18", "s": 0.985, "f": 0}, {"x": 0.992, "y": 0.994, "c": "近傍", "n": "Megalara Garuda [A]  n=2812 cos0.99 難0.99", "s": 0.803, "f": 0}, {"x": 0.988, "y": 1.396, "c": "近傍", "n": "Monopole. [A]  n=3176 cos0.99 難1.40", "s": 0.907, "f": 0}, {"x": 0.995, "y": 0.97, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3433 cos0.99 難0.97", "s": 0.981, "f": 0}, {"x": 0.986, "y": 1.004, "c": "近傍", "n": "Umbral [L]  n=2059 cos0.99 難1.00", "s": 0.588, "f": 0}, {"x": 0.978, "y": 1.155, "c": "近傍", "n": "RINNE [A]  n=2037 cos0.98 難1.16", "s": 0.582, "f": 0}, {"x": 0.977, "y": 1.177, "c": "近傍", "n": "EYE OF THE HEAVEN [A]  n=739 cos0.98 難1.18", "s": 0.211, "f": 0}, {"x": 0.981, "y": 1.388, "c": "近傍", "n": "rommmo [A]  n=2584 cos0.98 難1.39", "s": 0.738, "f": 0}, {"x": 0.976, "y": 1.185, "c": "近傍", "n": "Cosmic Cat [L]  n=3126 cos0.98 難1.18", "s": 0.893, "f": 0}, {"x": 0.979, "y": 1.362, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.98 難1.36", "s": 0.908, "f": 0}, {"x": 0.98, "y": 1.035, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.98 難1.04", "s": 0.402, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6465001711172911}, {"a": 0, "b": 2, "w": 0.4223154543909259}, {"a": 0, "b": 3, "w": 0.3237025850865748}, {"a": 0, "b": 4, "w": 0.31103588174115104}, {"a": 0, "b": 5, "w": 0.41307105516025455}, {"a": 0, "b": 6, "w": 0.23370900531887318}, {"a": 0, "b": 7, "w": 0.2322497466444412}, {"a": 0, "b": 8, "w": 0.4333386909086585}, {"a": 0, "b": 9, "w": 0.04456756343252577}, {"a": 0, "b": 10, "w": 0.19981949265400034}, {"a": 0, "b": 11, "w": 0.3477171655526087}, {"a": 0, "b": 12, "w": 0.3032307293401524}, {"a": 0, "b": 13, "w": 0.5050225104295987}, {"a": 0, "b": 14, "w": 0.2942253220478762}, {"a": 0, "b": 15, "w": 0.10050999976427422}, {"a": 0, "b": 16, "w": 2.97047941799633e-11}, {"a": 0, "b": 17, "w": 0.16160568576825463}, {"a": 0, "b": 18, "w": 0.06813688238313087}, {"a": 0, "b": 19, "w": 0.044473902689699085}, {"a": 0, "b": 20, "w": 0.15859417132988218}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=0.935,hiY=1.430;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
