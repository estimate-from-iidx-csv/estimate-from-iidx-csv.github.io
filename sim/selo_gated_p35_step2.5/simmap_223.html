<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Around The Galaxy [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.252, "c": "種", "n": "Around The Galaxy [H]  n=1246 cos1.00 難-1.25", "s": 0.512, "f": 0}, {"x": 0.993, "y": -1.313, "c": "近傍", "n": "CoMAAAAAAA [H]  n=1228 cos0.99 難-1.31", "s": 0.505, "f": 0}, {"x": 0.99, "y": -1.231, "c": "近傍", "n": "Begin [H]  n=613 cos0.99 難-1.23", "s": 0.252, "f": 0}, {"x": 0.992, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.99 難-1.16", "s": 0.612, "f": 0}, {"x": 0.99, "y": -1.29, "c": "近傍", "n": "Apocalypse [H]  n=1206 cos0.99 難-1.29", "s": 0.495, "f": 0}, {"x": 0.989, "y": -1.294, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.29", "s": 0.763, "f": 0}, {"x": 0.99, "y": -1.33, "c": "近傍", "n": "夢縁 [H]  n=1042 cos0.99 難-1.33", "s": 0.428, "f": 0}, {"x": 0.995, "y": -1.099, "c": "近傍", "n": "Realize Maze [H]  n=1574 cos0.99 難-1.10", "s": 0.647, "f": 0}, {"x": 0.989, "y": -1.228, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.99 難-1.23", "s": 0.621, "f": 0}, {"x": 0.989, "y": -1.307, "c": "近傍", "n": "Discloze [H]  n=1378 cos0.99 難-1.31", "s": 0.566, "f": 0}, {"x": 0.996, "y": -1.08, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos1.00 難-1.08", "s": 0.592, "f": 0}, {"x": 0.992, "y": -1.111, "c": "近傍", "n": "Arca [H]  n=1546 cos0.99 難-1.11", "s": 0.635, "f": 0}, {"x": 0.989, "y": -1.336, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=811 cos0.99 難-1.34", "s": 0.333, "f": 0}, {"x": 0.987, "y": -1.171, "c": "近傍", "n": "Bring The Fire [H]  n=669 cos0.99 難-1.17", "s": 0.275, "f": 0}, {"x": 0.986, "y": -1.174, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos0.99 難-1.17", "s": 0.288, "f": 0}, {"x": 0.985, "y": -1.242, "c": "近傍", "n": "Hat Surprise (Season 3) [H]  n=662 cos0.98 難-1.24", "s": 0.272, "f": 0}, {"x": 0.985, "y": -1.295, "c": "近傍", "n": "Disco Killer Music Lover [H]  n=555 cos0.98 難-1.30", "s": 0.228, "f": 0}, {"x": 0.985, "y": -1.252, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.98 難-1.25", "s": 0.411, "f": 0}, {"x": 0.99, "y": -1.063, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.99 難-1.06", "s": 0.661, "f": 0}, {"x": 0.99, "y": -1.07, "c": "近傍", "n": "Primitive Vibes [H]  n=2434 cos0.99 難-1.07", "s": 1.0, "f": 0}, {"x": 0.986, "y": -1.129, "c": "近傍", "n": "No Border [H]  n=1432 cos0.99 難-1.13", "s": 0.588, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42070030042167805}, {"a": 0, "b": 2, "w": 0.3351335105932558}, {"a": 0, "b": 3, "w": 0.4527936709337901}, {"a": 0, "b": 4, "w": 0.383882361367177}, {"a": 0, "b": 5, "w": 0.40026604092262663}, {"a": 0, "b": 6, "w": 0.29035277174461604}, {"a": 0, "b": 7, "w": 0.5652850375350642}, {"a": 0, "b": 8, "w": 0.38899514256336587}, {"a": 0, "b": 9, "w": 0.4058228915550298}, {"a": 0, "b": 10, "w": 0.6289615440298442}, {"a": 0, "b": 11, "w": 0.49153360738870977}, {"a": 0, "b": 12, "w": 0.20303584827383414}, {"a": 0, "b": 13, "w": 0.28206449239740816}, {"a": 0, "b": 14, "w": 0.10724268895306699}, {"a": 0, "b": 15, "w": 4.47020198635073e-11}, {"a": 0, "b": 16, "w": 0.23641672486552068}, {"a": 0, "b": 17, "w": 0.3000157410059211}, {"a": 0, "b": 18, "w": 0.34386433796445204}, {"a": 0, "b": 19, "w": 0.3554821535547017}, {"a": 0, "b": 20, "w": 0.32825145964509383}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.357,hiY=-1.041;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
