<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ghost Pulse [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.127, "c": "種", "n": "Ghost Pulse [H]  n=824 cos1.00 難-1.13", "s": 0.465, "f": 0}, {"x": 0.994, "y": -1.154, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.99 難-1.15", "s": 0.884, "f": 0}, {"x": 0.993, "y": -1.113, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=993 cos0.99 難-1.11", "s": 0.56, "f": 0}, {"x": 0.993, "y": -1.132, "c": "近傍", "n": "Drop Syndicate [H]  n=714 cos0.99 難-1.13", "s": 0.403, "f": 0}, {"x": 0.992, "y": -1.145, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.99 難-1.14", "s": 0.572, "f": 0}, {"x": 0.992, "y": -1.103, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.99 難-1.10", "s": 0.924, "f": 0}, {"x": 0.992, "y": -1.16, "c": "近傍", "n": "RAIN [H]  n=1518 cos0.99 難-1.16", "s": 0.857, "f": 0}, {"x": 0.992, "y": -1.167, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.99 難-1.17", "s": 0.869, "f": 0}, {"x": 0.992, "y": -1.091, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.99 難-1.09", "s": 0.762, "f": 0}, {"x": 0.992, "y": -1.113, "c": "近傍", "n": "Meissa [H]  n=923 cos0.99 難-1.11", "s": 0.521, "f": 0}, {"x": 0.994, "y": -1.228, "c": "近傍", "n": "Million Dollar [H]  n=723 cos0.99 難-1.23", "s": 0.408, "f": 0}, {"x": 0.994, "y": -1.227, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.99 難-1.23", "s": 0.589, "f": 0}, {"x": 0.991, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.99 難-1.16", "s": 0.841, "f": 0}, {"x": 0.992, "y": -1.175, "c": "近傍", "n": "chaplet -IIDX re:build- [H]  n=503 cos0.99 難-1.18", "s": 0.284, "f": 0}, {"x": 0.992, "y": -1.043, "c": "近傍", "n": "EBONY & IVORY [H]  n=1772 cos0.99 難-1.04", "s": 1.0, "f": 0}, {"x": 0.991, "y": -1.093, "c": "近傍", "n": "Slipstream [H]  n=1475 cos0.99 難-1.09", "s": 0.832, "f": 0}, {"x": 0.991, "y": -1.068, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [H]  n=1438 cos0.99 難-1.07", "s": 0.812, "f": 0}, {"x": 0.989, "y": -1.134, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.99 難-1.13", "s": 0.888, "f": 0}, {"x": 0.989, "y": -1.115, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=575 cos0.99 難-1.11", "s": 0.324, "f": 0}, {"x": 0.99, "y": -1.228, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.99 難-1.23", "s": 0.853, "f": 0}, {"x": 0.988, "y": -1.109, "c": "近傍", "n": "禊 [H]  n=1637 cos0.99 難-1.11", "s": 0.924, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4576771279067342}, {"a": 0, "b": 2, "w": 0.32977737214118197}, {"a": 0, "b": 3, "w": 0.3236032374303822}, {"a": 0, "b": 4, "w": 0.38920823352913736}, {"a": 0, "b": 5, "w": 0.3776028932460772}, {"a": 0, "b": 6, "w": 0.3436509555761811}, {"a": 0, "b": 7, "w": 0.35136660846877166}, {"a": 0, "b": 8, "w": 0.36548390824601784}, {"a": 0, "b": 9, "w": 0.355367314287789}, {"a": 0, "b": 10, "w": 0.38527496395833294}, {"a": 0, "b": 11, "w": 0.47702761485997136}, {"a": 0, "b": 12, "w": 0.30838481436292975}, {"a": 0, "b": 13, "w": 0.38792581074877597}, {"a": 0, "b": 14, "w": 0.4054167480632874}, {"a": 0, "b": 15, "w": 0.3409326592172168}, {"a": 0, "b": 16, "w": 0.35095232438739976}, {"a": 0, "b": 17, "w": 4.748001991572437e-11}, {"a": 0, "b": 18, "w": 0.2504907653831312}, {"a": 0, "b": 19, "w": 0.23791684597364748}, {"a": 0, "b": 20, "w": 0.12141721341960454}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.243,hiY=-1.028;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
