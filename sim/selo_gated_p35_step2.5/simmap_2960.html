<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">バッド・スイーツ、バッド・ドリーム [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.706, "c": "種", "n": "バッド・スイーツ、バッド・ドリーム [A]  n=2502 cos1.00 難1.71", "s": 0.757, "f": 0}, {"x": 0.99, "y": 1.738, "c": "近傍", "n": "Dynamite [A]  n=3305 cos0.99 難1.74", "s": 1.0, "f": 0}, {"x": 0.982, "y": 1.632, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.98 難1.63", "s": 0.736, "f": 0}, {"x": 0.977, "y": 1.651, "c": "近傍", "n": "Macho Monky [A]  n=2727 cos0.98 難1.65", "s": 0.825, "f": 0}, {"x": 0.976, "y": 1.727, "c": "近傍", "n": "Marie Antoinette [L]  n=1729 cos0.98 難1.73", "s": 0.523, "f": 0}, {"x": 0.976, "y": 1.771, "c": "近傍", "n": "Antigravity [A]  n=2890 cos0.98 難1.77", "s": 0.874, "f": 0}, {"x": 0.974, "y": 1.674, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.97 難1.67", "s": 0.676, "f": 0}, {"x": 0.977, "y": 1.608, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2757 cos0.98 難1.61", "s": 0.834, "f": 0}, {"x": 0.977, "y": 1.801, "c": "近傍", "n": "Cult Invitation [A]  n=1265 cos0.98 難1.80", "s": 0.383, "f": 0}, {"x": 0.98, "y": 1.55, "c": "近傍", "n": "ALTERNATOR [A]  n=2280 cos0.98 難1.55", "s": 0.69, "f": 0}, {"x": 0.979, "y": 1.868, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.98 難1.87", "s": 0.638, "f": 0}, {"x": 0.972, "y": 1.657, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.97 難1.66", "s": 0.823, "f": 0}, {"x": 0.983, "y": 1.917, "c": "近傍", "n": "Don't believe the hype [A]  n=2210 cos0.98 難1.92", "s": 0.669, "f": 0}, {"x": 0.97, "y": 1.77, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3148 cos0.97 難1.77", "s": 0.952, "f": 0}, {"x": 0.989, "y": 1.464, "c": "近傍", "n": "TRIUMPH [A]  n=2893 cos0.99 難1.46", "s": 0.875, "f": 0}, {"x": 0.97, "y": 1.806, "c": "近傍", "n": "255 [A]  n=3009 cos0.97 難1.81", "s": 0.91, "f": 0}, {"x": 0.991, "y": 1.968, "c": "近傍", "n": "VOX UP [A]  n=2951 cos0.99 難1.97", "s": 0.893, "f": 0}, {"x": 0.97, "y": 1.601, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2753 cos0.97 難1.60", "s": 0.833, "f": 0}, {"x": 0.972, "y": 1.857, "c": "近傍", "n": "POLKAMANIA [L]  n=817 cos0.97 難1.86", "s": 0.247, "f": 0}, {"x": 0.979, "y": 1.482, "c": "近傍", "n": "ATHER [L]  n=1585 cos0.98 難1.48", "s": 0.48, "f": 0}, {"x": 0.974, "y": 1.521, "c": "近傍", "n": "HAERETICUS [A]  n=3064 cos0.97 難1.52", "s": 0.927, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43377191588075525}, {"a": 0, "b": 2, "w": 0.20439537762608684}, {"a": 0, "b": 3, "w": 0.1523668196310083}, {"a": 0, "b": 4, "w": 0.024964443582410567}, {"a": 0, "b": 5, "w": 2.355882156024336e-11}, {"a": 0, "b": 6, "w": 0.09759745994497682}, {"a": 0, "b": 7, "w": 0.16683974871642726}, {"a": 0, "b": 8, "w": 0.17437087910047544}, {"a": 0, "b": 9, "w": 0.23993430800603743}, {"a": 0, "b": 10, "w": 0.21675920263154935}, {"a": 0, "b": 11, "w": 0.0734618499546631}, {"a": 0, "b": 12, "w": 0.290368533787111}, {"a": 0, "b": 13, "w": 0.06633231920522409}, {"a": 0, "b": 14, "w": 0.43024875435424836}, {"a": 0, "b": 15, "w": 0.07216141600060655}, {"a": 0, "b": 16, "w": 0.47734887041083407}, {"a": 0, "b": 17, "w": 0.05990990691672249}, {"a": 0, "b": 18, "w": 0.09447798026516274}, {"a": 0, "b": 19, "w": 0.1361540388386252}, {"a": 0, "b": 20, "w": 0.059826217166569884}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.967,hiX=1.002,loY=1.423,hiY=2.008;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
