<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DAZZLE ATTACK [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.09, "c": "種", "n": "DAZZLE ATTACK [A]  n=1935 cos1.00 難0.09", "s": 0.536, "f": 0}, {"x": 0.999, "y": 0.133, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos1.00 難0.13", "s": 0.962, "f": 0}, {"x": 0.997, "y": 0.105, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos1.00 難0.11", "s": 0.347, "f": 0}, {"x": 0.996, "y": 0.158, "c": "近傍", "n": "Be A Star [A]  n=3353 cos1.00 難0.16", "s": 0.928, "f": 0}, {"x": 0.996, "y": 0.193, "c": "近傍", "n": "Wonderland [A]  n=3133 cos1.00 難0.19", "s": 0.867, "f": 0}, {"x": 0.995, "y": 0.037, "c": "近傍", "n": "SigSig [A]  n=3612 cos1.00 難0.04", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.147, "c": "近傍", "n": "命の標本 [A]  n=3125 cos0.99 難0.15", "s": 0.865, "f": 0}, {"x": 0.993, "y": 0.04, "c": "近傍", "n": "PENDUAL TALISMAN [A]  n=3420 cos0.99 難0.04", "s": 0.947, "f": 0}, {"x": 0.993, "y": 0.056, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1675 cos0.99 難0.06", "s": 0.464, "f": 0}, {"x": 0.993, "y": 0.072, "c": "近傍", "n": "NANAIRO [A]  n=3065 cos0.99 難0.07", "s": 0.849, "f": 0}, {"x": 0.994, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos0.99 難-0.02", "s": 0.824, "f": 0}, {"x": 0.994, "y": -0.069, "c": "近傍", "n": "Shapeshifter [A]  n=1780 cos0.99 難-0.07", "s": 0.493, "f": 0}, {"x": 0.994, "y": -0.064, "c": "近傍", "n": "グッバイ宣言 [A]  n=2497 cos0.99 難-0.06", "s": 0.691, "f": 0}, {"x": 0.993, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.658, "f": 0}, {"x": 0.997, "y": -0.133, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos1.00 難-0.13", "s": 0.264, "f": 0}, {"x": 0.992, "y": 0.162, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos0.99 難0.16", "s": 0.953, "f": 0}, {"x": 0.992, "y": 0.077, "c": "近傍", "n": "Volcanic Dragon [A]  n=3184 cos0.99 難0.08", "s": 0.882, "f": 0}, {"x": 0.992, "y": 0.056, "c": "近傍", "n": "ランカーキラーガール [A]  n=3145 cos0.99 難0.06", "s": 0.871, "f": 0}, {"x": 0.992, "y": 0.131, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos0.99 難0.13", "s": 0.813, "f": 0}, {"x": 0.994, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.10", "s": 0.857, "f": 0}, {"x": 0.991, "y": 0.043, "c": "近傍", "n": "あるビー！ feat.ころねぽち [A]  n=1931 cos0.99 難0.04", "s": 0.535, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5846545740839193}, {"a": 0, "b": 2, "w": 0.4276369982608449}, {"a": 0, "b": 3, "w": 0.3974981807352156}, {"a": 0, "b": 4, "w": 0.3792514823617935}, {"a": 0, "b": 5, "w": 0.17378148611711408}, {"a": 0, "b": 6, "w": 0.19868017508447378}, {"a": 0, "b": 7, "w": 0.1570666685711528}, {"a": 0, "b": 8, "w": 0.1785101414049014}, {"a": 0, "b": 9, "w": 0.166762223105541}, {"a": 0, "b": 10, "w": 0.21366585906738977}, {"a": 0, "b": 11, "w": 0.25587337122118015}, {"a": 0, "b": 12, "w": 0.14507620086725537}, {"a": 0, "b": 13, "w": 0.08251450310748876}, {"a": 0, "b": 14, "w": 0.2714387967818903}, {"a": 0, "b": 15, "w": 0.13340692035898782}, {"a": 0, "b": 16, "w": 0.07311725792951618}, {"a": 0, "b": 17, "w": 0.09476254325634881}, {"a": 0, "b": 18, "w": 0.0625353625771844}, {"a": 0, "b": 19, "w": 0.09373852600865595}, {"a": 0, "b": 20, "w": 6.067679692023376e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.159,hiY=0.219;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
