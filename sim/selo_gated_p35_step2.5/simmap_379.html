<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Karma [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.7, "c": "種", "n": "Karma [H]  n=1622 cos1.00 難-0.70", "s": 0.504, "f": 0}, {"x": 0.998, "y": -0.682, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos1.00 難-0.68", "s": 0.786, "f": 0}, {"x": 0.995, "y": -0.812, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos1.00 難-0.81", "s": 0.744, "f": 0}, {"x": 0.994, "y": -0.831, "c": "近傍", "n": "GOLD RUSH [H]  n=2945 cos0.99 難-0.83", "s": 0.914, "f": 0}, {"x": 0.991, "y": -0.731, "c": "近傍", "n": "Linus [H]  n=1669 cos0.99 難-0.73", "s": 0.518, "f": 0}, {"x": 0.992, "y": -0.822, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.99 難-0.82", "s": 0.943, "f": 0}, {"x": 0.991, "y": -0.74, "c": "近傍", "n": "EDEN [H]  n=3027 cos0.99 難-0.74", "s": 0.94, "f": 0}, {"x": 0.992, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.705, "f": 0}, {"x": 0.991, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.81", "s": 0.58, "f": 0}, {"x": 0.99, "y": -0.711, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.71", "s": 0.63, "f": 0}, {"x": 0.991, "y": -0.566, "c": "近傍", "n": "黒紅掬い [A]  n=1971 cos0.99 難-0.57", "s": 0.612, "f": 0}, {"x": 0.991, "y": -0.86, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.86", "s": 0.707, "f": 0}, {"x": 0.993, "y": -0.92, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.99 難-0.92", "s": 0.697, "f": 0}, {"x": 0.989, "y": -0.752, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1602 cos0.99 難-0.75", "s": 0.497, "f": 0}, {"x": 0.989, "y": -0.689, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1232 cos0.99 難-0.69", "s": 0.382, "f": 0}, {"x": 0.99, "y": -0.871, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.87", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.643, "c": "近傍", "n": "gentle stress [A]  n=1887 cos0.99 難-0.64", "s": 0.586, "f": 0}, {"x": 0.988, "y": -0.741, "c": "近傍", "n": "唱 [A]  n=1534 cos0.99 難-0.74", "s": 0.476, "f": 0}, {"x": 0.988, "y": -0.635, "c": "近傍", "n": "PALETTE [A]  n=1098 cos0.99 難-0.63", "s": 0.341, "f": 0}, {"x": 0.988, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.545, "f": 0}, {"x": 0.989, "y": -0.525, "c": "近傍", "n": "Journey [A]  n=2721 cos0.99 難-0.52", "s": 0.845, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5955587445424793}, {"a": 0, "b": 2, "w": 0.4321555484534323}, {"a": 0, "b": 3, "w": 0.4087693069407884}, {"a": 0, "b": 4, "w": 0.31868013299257025}, {"a": 0, "b": 5, "w": 0.3355836716569941}, {"a": 0, "b": 6, "w": 0.3076296030481931}, {"a": 0, "b": 7, "w": 0.33418428970133907}, {"a": 0, "b": 8, "w": 0.2798369146385029}, {"a": 0, "b": 9, "w": 0.21998376957065502}, {"a": 0, "b": 10, "w": 0.2742389791269588}, {"a": 0, "b": 11, "w": 0.29457435355354833}, {"a": 0, "b": 12, "w": 0.39553257483761717}, {"a": 0, "b": 13, "w": 0.041563801676666956}, {"a": 0, "b": 14, "w": 0.1331603990136625}, {"a": 0, "b": 15, "w": 0.29281114637446004}, {"a": 0, "b": 16, "w": 0.22793812916528067}, {"a": 0, "b": 17, "w": 0.07162805713951859}, {"a": 0, "b": 18, "w": 6.07791594831042e-11}, {"a": 0, "b": 19, "w": 0.08042785146039044}, {"a": 0, "b": 20, "w": 0.25157417903562074}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.952,hiY=-0.493;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
