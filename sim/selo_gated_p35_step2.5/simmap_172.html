<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">獅子霞麗ノ舞 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.402, "c": "種", "n": "獅子霞麗ノ舞 [A]  n=2947 cos1.00 難-0.40", "s": 0.813, "f": 0}, {"x": 0.99, "y": -0.422, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.99 難-0.42", "s": 0.259, "f": 0}, {"x": 0.99, "y": -0.254, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.99 難-0.25", "s": 0.344, "f": 0}, {"x": 0.987, "y": -0.525, "c": "近傍", "n": "Journey [A]  n=2721 cos0.99 難-0.52", "s": 0.751, "f": 0}, {"x": 0.986, "y": -0.498, "c": "近傍", "n": "Midnight Lady [A]  n=2780 cos0.99 難-0.50", "s": 0.767, "f": 0}, {"x": 0.986, "y": -0.512, "c": "近傍", "n": "New Castle Legions [H]  n=1402 cos0.99 難-0.51", "s": 0.387, "f": 0}, {"x": 0.985, "y": -0.538, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.99 難-0.54", "s": 0.86, "f": 0}, {"x": 0.984, "y": -0.337, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.98 難-0.34", "s": 0.741, "f": 0}, {"x": 0.984, "y": -0.457, "c": "近傍", "n": "エコ爺 [A]  n=3109 cos0.98 難-0.46", "s": 0.858, "f": 0}, {"x": 0.983, "y": -0.385, "c": "近傍", "n": "satfinal [A]  n=2973 cos0.98 難-0.39", "s": 0.82, "f": 0}, {"x": 0.983, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.98 難-0.43", "s": 0.829, "f": 0}, {"x": 0.985, "y": -0.597, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.98 難-0.60", "s": 0.309, "f": 0}, {"x": 0.995, "y": -0.822, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.99 難-0.82", "s": 0.838, "f": 0}, {"x": 0.985, "y": -0.2, "c": "近傍", "n": "the trigger of innocence [A]  n=2644 cos0.98 難-0.20", "s": 0.73, "f": 0}, {"x": 0.983, "y": -0.377, "c": "近傍", "n": "Shining World [A]  n=3141 cos0.98 難-0.38", "s": 0.867, "f": 0}, {"x": 0.987, "y": -0.7, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.448, "f": 0}, {"x": 0.984, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.98 難-0.24", "s": 0.693, "f": 0}, {"x": 0.983, "y": -0.239, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.98 難-0.24", "s": 0.343, "f": 0}, {"x": 0.983, "y": -0.244, "c": "近傍", "n": "おおきなこえで [L]  n=2619 cos0.98 難-0.24", "s": 0.723, "f": 0}, {"x": 0.988, "y": -0.74, "c": "近傍", "n": "EDEN [H]  n=3027 cos0.99 難-0.74", "s": 0.835, "f": 0}, {"x": 0.985, "y": -0.673, "c": "近傍", "n": "chrono diver -fragment- [A]  n=3624 cos0.98 難-0.67", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5112047964410082}, {"a": 0, "b": 2, "w": 0.2965254158694802}, {"a": 0, "b": 3, "w": 0.5004743795835509}, {"a": 0, "b": 4, "w": 0.4571726999358653}, {"a": 0, "b": 5, "w": 0.36080766277228715}, {"a": 0, "b": 6, "w": 0.3701028843843479}, {"a": 0, "b": 7, "w": 0.4481013162435594}, {"a": 0, "b": 8, "w": 0.4533237487711975}, {"a": 0, "b": 9, "w": 0.441599169739033}, {"a": 0, "b": 10, "w": 0.22212923635060033}, {"a": 0, "b": 11, "w": 0.34111254038922545}, {"a": 0, "b": 12, "w": 0.6906554170926229}, {"a": 0, "b": 13, "w": 0.4268159092809356}, {"a": 0, "b": 14, "w": 0.430804757354581}, {"a": 0, "b": 15, "w": 0.5114816726629257}, {"a": 0, "b": 16, "w": 3.53553852860955e-11}, {"a": 0, "b": 17, "w": 0.056692109197383656}, {"a": 0, "b": 18, "w": 0.319613041405717}, {"a": 0, "b": 19, "w": 0.5154637644665401}, {"a": 0, "b": 20, "w": 0.47048032536077633}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.872,hiY=-0.150;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
