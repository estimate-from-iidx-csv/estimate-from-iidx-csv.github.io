<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.983, "c": "種", "n": "Uaigh Gealai [H]  n=404 cos1.00 難-0.98", "s": 0.162, "f": 0}, {"x": 0.996, "y": -1.031, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos1.00 難-1.03", "s": 0.245, "f": 0}, {"x": 0.996, "y": -0.935, "c": "近傍", "n": "Trill auf G [H]  n=1800 cos1.00 難-0.94", "s": 0.722, "f": 0}, {"x": 0.994, "y": -1.013, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos0.99 難-1.01", "s": 0.576, "f": 0}, {"x": 0.994, "y": -0.933, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos0.99 難-0.93", "s": 1.0, "f": 0}, {"x": 0.996, "y": -1.071, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos1.00 難-1.07", "s": 0.486, "f": 0}, {"x": 0.995, "y": -1.065, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos1.00 難-1.06", "s": 0.25, "f": 0}, {"x": 0.994, "y": -1.045, "c": "近傍", "n": "Out of Control [H]  n=848 cos0.99 難-1.05", "s": 0.34, "f": 0}, {"x": 0.994, "y": -0.903, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1326 cos0.99 難-0.90", "s": 0.532, "f": 0}, {"x": 0.994, "y": -0.897, "c": "近傍", "n": "HYENA [H]  n=2379 cos0.99 難-0.90", "s": 0.954, "f": 0}, {"x": 0.993, "y": -0.953, "c": "近傍", "n": "Fegrix [H]  n=1718 cos0.99 難-0.95", "s": 0.689, "f": 0}, {"x": 0.993, "y": -0.915, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.99 難-0.92", "s": 0.38, "f": 0}, {"x": 0.993, "y": -1.049, "c": "近傍", "n": "ぞうしょく！？マイデンティティ [H]  n=831 cos0.99 難-1.05", "s": 0.333, "f": 0}, {"x": 0.992, "y": -0.974, "c": "近傍", "n": "#The_Relentless [H]  n=2019 cos0.99 難-0.97", "s": 0.81, "f": 0}, {"x": 0.996, "y": -1.106, "c": "近傍", "n": "Satellite Burst [H]  n=905 cos1.00 難-1.11", "s": 0.363, "f": 0}, {"x": 0.992, "y": -0.94, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos0.99 難-0.94", "s": 0.875, "f": 0}, {"x": 0.995, "y": -1.095, "c": "近傍", "n": "⁽⁽ଘ( ˙꒳˙ )ଓ⁾⁾ beyond reason [H]  n=605 cos0.99 難-1.09", "s": 0.243, "f": 0}, {"x": 0.991, "y": -0.986, "c": "近傍", "n": "TIEFSEE [H]  n=2156 cos0.99 難-0.99", "s": 0.865, "f": 0}, {"x": 0.995, "y": -1.121, "c": "近傍", "n": "dica dica [H]  n=1133 cos1.00 難-1.12", "s": 0.454, "f": 0}, {"x": 0.992, "y": -0.902, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.99 難-0.90", "s": 0.661, "f": 0}, {"x": 0.995, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos1.00 難-1.13", "s": 0.537, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.19545000193606143}, {"a": 0, "b": 2, "w": 0.36439920931023106}, {"a": 0, "b": 3, "w": 0.2202158155414884}, {"a": 0, "b": 4, "w": 0.3276331568454779}, {"a": 0, "b": 5, "w": 0.39278694076387133}, {"a": 0, "b": 6, "w": 0.3778747577173722}, {"a": 0, "b": 7, "w": 0.1387112604745483}, {"a": 0, "b": 8, "w": 0.3291508059869872}, {"a": 0, "b": 9, "w": 0.3198689100726939}, {"a": 0, "b": 10, "w": 0.23989248189420198}, {"a": 0, "b": 11, "w": 0.09832508892650937}, {"a": 0, "b": 12, "w": 0.1518660581398209}, {"a": 0, "b": 13, "w": 0.1649728110374853}, {"a": 0, "b": 14, "w": 0.415570852762548}, {"a": 0, "b": 15, "w": 0.16348173959508083}, {"a": 0, "b": 16, "w": 0.3308064337222766}, {"a": 0, "b": 17, "w": 6.094125204469947e-11}, {"a": 0, "b": 18, "w": 0.39872857289265606}, {"a": 0, "b": 19, "w": 0.20558323474206708}, {"a": 0, "b": 20, "w": 0.20147386749612872}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-1.146,hiY=-0.878;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
