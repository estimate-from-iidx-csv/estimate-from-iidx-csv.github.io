<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">T-REX vs Velociraptor (In the Far east euphoria) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.14, "c": "種", "n": "T-REX vs Velociraptor (In the Far east euphoria) [H]  n=1582 cos1.00 難-1.14", "s": 0.724, "f": 0}, {"x": 0.995, "y": -1.176, "c": "近傍", "n": "NANAIRO [H]  n=1415 cos1.00 難-1.18", "s": 0.647, "f": 0}, {"x": 0.994, "y": -1.124, "c": "近傍", "n": "Night sky [H]  n=2107 cos0.99 難-1.12", "s": 0.964, "f": 0}, {"x": 0.994, "y": -1.17, "c": "近傍", "n": "BIGWAVERS [H]  n=767 cos0.99 難-1.17", "s": 0.351, "f": 0}, {"x": 0.996, "y": -1.229, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos1.00 難-1.23", "s": 0.642, "f": 0}, {"x": 0.993, "y": -1.151, "c": "近傍", "n": "麗 ～うらら～ [H]  n=1861 cos0.99 難-1.15", "s": 0.851, "f": 0}, {"x": 0.992, "y": -1.184, "c": "近傍", "n": "スーパー戦湯ババンバーン [H]  n=1258 cos0.99 難-1.18", "s": 0.575, "f": 0}, {"x": 0.992, "y": -1.11, "c": "近傍", "n": "忍恋花 [H]  n=1362 cos0.99 難-1.11", "s": 0.623, "f": 0}, {"x": 0.991, "y": -1.095, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.99 難-1.09", "s": 0.892, "f": 0}, {"x": 0.996, "y": -0.999, "c": "近傍", "n": "L.F.O [H]  n=1705 cos1.00 難-1.00", "s": 0.78, "f": 0}, {"x": 0.997, "y": -0.987, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2186 cos1.00 難-0.99", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.274, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.27", "s": 0.557, "f": 0}, {"x": 0.99, "y": -1.174, "c": "近傍", "n": "BLAZING_LAZER [H]  n=803 cos0.99 難-1.17", "s": 0.367, "f": 0}, {"x": 0.989, "y": -1.159, "c": "近傍", "n": "[ ]DENTITY [H]  n=1433 cos0.99 難-1.16", "s": 0.656, "f": 0}, {"x": 0.995, "y": -1.301, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1721 cos0.99 難-1.30", "s": 0.787, "f": 0}, {"x": 0.989, "y": -1.162, "c": "近傍", "n": "Lethal Weapon [H]  n=1417 cos0.99 難-1.16", "s": 0.648, "f": 0}, {"x": 0.991, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos0.99 難-1.01", "s": 0.863, "f": 0}, {"x": 0.994, "y": -0.975, "c": "近傍", "n": "もっと！モット！ときめき feat. 松下 [H]  n=2033 cos0.99 難-0.97", "s": 0.93, "f": 0}, {"x": 0.993, "y": -1.298, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.99 難-1.30", "s": 0.444, "f": 0}, {"x": 0.988, "y": -1.052, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.99 難-1.05", "s": 0.469, "f": 0}, {"x": 0.991, "y": -1.299, "c": "近傍", "n": "2 Be Continued [H]  n=568 cos0.99 難-1.30", "s": 0.26, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3305719084720845}, {"a": 0, "b": 2, "w": 0.33446997092469577}, {"a": 0, "b": 3, "w": 0.33371897409342854}, {"a": 0, "b": 4, "w": 0.4525687786293996}, {"a": 0, "b": 5, "w": 0.22165154680461163}, {"a": 0, "b": 6, "w": 0.2265855242121998}, {"a": 0, "b": 7, "w": 0.23354567391578174}, {"a": 0, "b": 8, "w": 0.12930525626208422}, {"a": 0, "b": 9, "w": 0.4671215725644995}, {"a": 0, "b": 10, "w": 0.30764865567212374}, {"a": 0, "b": 11, "w": 0.3615857010334109}, {"a": 0, "b": 12, "w": 6.699973909007895e-11}, {"a": 0, "b": 13, "w": 0.002239192628507136}, {"a": 0, "b": 14, "w": 0.3555692933665524}, {"a": 0, "b": 15, "w": 0.03621713323512765}, {"a": 0, "b": 16, "w": 0.15062841965876317}, {"a": 0, "b": 17, "w": 0.3429751300152898}, {"a": 0, "b": 18, "w": 0.32078067795037135}, {"a": 0, "b": 19, "w": 0.0749655969347619}, {"a": 0, "b": 20, "w": 0.016036131197211922}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.327,hiY=-0.949;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
