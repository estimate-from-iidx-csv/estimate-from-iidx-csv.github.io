<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Blame [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.143, "c": "種", "n": "Blame [A]  n=3294 cos1.00 難0.14", "s": 0.912, "f": 0}, {"x": 0.993, "y": -0.05, "c": "近傍", "n": "HYPER EUROBEAT (2DX style) [A]  n=2545 cos0.99 難-0.05", "s": 0.705, "f": 0}, {"x": 0.992, "y": -0.026, "c": "近傍", "n": "symbolic [A]  n=2767 cos0.99 難-0.03", "s": 0.766, "f": 0}, {"x": 0.994, "y": -0.119, "c": "近傍", "n": "traces [A]  n=2803 cos0.99 難-0.12", "s": 0.776, "f": 0}, {"x": 0.993, "y": -0.164, "c": "近傍", "n": "VJ ARMY [A]  n=1741 cos0.99 難-0.16", "s": 0.482, "f": 0}, {"x": 0.988, "y": 0.1, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2689 cos0.99 難0.10", "s": 0.745, "f": 0}, {"x": 0.988, "y": 0.143, "c": "近傍", "n": "SPEED ROCKER [A]  n=2665 cos0.99 難0.14", "s": 0.738, "f": 0}, {"x": 0.989, "y": -0.11, "c": "近傍", "n": "Scripted Connection⇒ N mix [A]  n=2801 cos0.99 難-0.11", "s": 0.776, "f": 0}, {"x": 0.987, "y": 0.195, "c": "近傍", "n": "SNOW [A]  n=2759 cos0.99 難0.19", "s": 0.764, "f": 0}, {"x": 0.988, "y": -0.081, "c": "近傍", "n": "Votum stellarum [A]  n=2865 cos0.99 難-0.08", "s": 0.793, "f": 0}, {"x": 0.988, "y": -0.075, "c": "近傍", "n": "2hot2eat [A]  n=1063 cos0.99 難-0.07", "s": 0.294, "f": 0}, {"x": 0.987, "y": 0.315, "c": "近傍", "n": "GRADIUS -FULL SPEED- [A]  n=2775 cos0.99 難0.32", "s": 0.768, "f": 0}, {"x": 0.993, "y": -0.292, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2244 cos0.99 難-0.29", "s": 0.621, "f": 0}, {"x": 0.988, "y": -0.087, "c": "近傍", "n": "SOLITON BEAM [A]  n=2876 cos0.99 難-0.09", "s": 0.796, "f": 0}, {"x": 0.986, "y": 0.167, "c": "近傍", "n": "Secret of Love [A]  n=3058 cos0.99 難0.17", "s": 0.847, "f": 0}, {"x": 0.989, "y": -0.196, "c": "近傍", "n": "moon_child [H]  n=2782 cos0.99 難-0.20", "s": 0.77, "f": 0}, {"x": 0.987, "y": -0.076, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.99 難-0.08", "s": 0.859, "f": 0}, {"x": 0.986, "y": 0.255, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.25", "s": 0.898, "f": 0}, {"x": 0.986, "y": 0.045, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.04", "s": 0.947, "f": 0}, {"x": 0.988, "y": -0.175, "c": "近傍", "n": "Freeway Shuffle [A]  n=2925 cos0.99 難-0.18", "s": 0.81, "f": 0}, {"x": 0.985, "y": 0.12, "c": "近傍", "n": "Be quiet [A]  n=3611 cos0.99 難0.12", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4539891147942994}, {"a": 0, "b": 2, "w": 0.36753119882719776}, {"a": 0, "b": 3, "w": 0.496369370833347}, {"a": 0, "b": 4, "w": 0.4319682510814189}, {"a": 0, "b": 5, "w": 0.23026763438376907}, {"a": 0, "b": 6, "w": 0.24138026033941784}, {"a": 0, "b": 7, "w": 0.29281297727645417}, {"a": 0, "b": 8, "w": 0.24121866995374552}, {"a": 0, "b": 9, "w": 0.30567791999655913}, {"a": 0, "b": 10, "w": 0.27619600012496826}, {"a": 0, "b": 11, "w": 0.2453542989084443}, {"a": 0, "b": 12, "w": 0.4082471475667824}, {"a": 0, "b": 13, "w": 0.2901029220639809}, {"a": 0, "b": 14, "w": 0.23973484853495575}, {"a": 0, "b": 15, "w": 0.3351933224529442}, {"a": 0, "b": 16, "w": 0.2567478566281971}, {"a": 0, "b": 17, "w": 0.1907279200137897}, {"a": 0, "b": 18, "w": 0.22406406194799433}, {"a": 0, "b": 19, "w": 0.27567685218844196}, {"a": 0, "b": 20, "w": 4.449873802769844e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.341,hiY=0.364;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
