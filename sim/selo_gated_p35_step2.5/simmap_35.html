<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Digital Radiance [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.554, "c": "種", "n": "Digital Radiance [A]  n=1249 cos1.00 難-0.55", "s": 0.379, "f": 0}, {"x": 0.994, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.538, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.99 難-0.54", "s": 0.945, "f": 0}, {"x": 0.992, "y": -0.586, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos0.99 難-0.59", "s": 0.478, "f": 0}, {"x": 0.993, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.767, "f": 0}, {"x": 0.993, "y": -0.371, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos0.99 難-0.37", "s": 0.807, "f": 0}, {"x": 0.99, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.59", "s": 0.786, "f": 0}, {"x": 0.995, "y": -0.315, "c": "近傍", "n": "シンデレラ [A]  n=1872 cos0.99 難-0.31", "s": 0.567, "f": 0}, {"x": 0.99, "y": -0.612, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos0.99 難-0.61", "s": 0.524, "f": 0}, {"x": 0.99, "y": -0.552, "c": "近傍", "n": "rumrum triplets [H]  n=2692 cos0.99 難-0.55", "s": 0.816, "f": 0}, {"x": 0.99, "y": -0.584, "c": "近傍", "n": "Dreamship [A]  n=1395 cos0.99 難-0.58", "s": 0.423, "f": 0}, {"x": 0.989, "y": -0.525, "c": "近傍", "n": "Mel [A]  n=2620 cos0.99 難-0.52", "s": 0.794, "f": 0}, {"x": 0.989, "y": -0.537, "c": "近傍", "n": "Far east nightbird [A]  n=3200 cos0.99 難-0.54", "s": 0.97, "f": 0}, {"x": 0.99, "y": -0.684, "c": "近傍", "n": "Sounds Of Summer [H]  n=2726 cos0.99 難-0.68", "s": 0.826, "f": 0}, {"x": 0.99, "y": -0.422, "c": "近傍", "n": "虹色 [A]  n=3051 cos0.99 難-0.42", "s": 0.925, "f": 0}, {"x": 0.992, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.532, "f": 0}, {"x": 0.989, "y": -0.559, "c": "近傍", "n": "Iris [A]  n=2038 cos0.99 難-0.56", "s": 0.618, "f": 0}, {"x": 0.992, "y": -0.761, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.76", "s": 0.561, "f": 0}, {"x": 0.991, "y": -0.349, "c": "近傍", "n": "次葉 -turn the page- [A]  n=3299 cos0.99 難-0.35", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.384, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos0.99 難-0.38", "s": 0.835, "f": 0}, {"x": 0.99, "y": -0.711, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.71", "s": 0.615, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1642171540683829}, {"a": 0, "b": 2, "w": 0.14369501658776485}, {"a": 0, "b": 3, "w": 0.19004585317463507}, {"a": 0, "b": 4, "w": 0.21217853587663194}, {"a": 0, "b": 5, "w": 0.2795228590323545}, {"a": 0, "b": 6, "w": 0.09665740407498102}, {"a": 0, "b": 7, "w": 0.20123394842763043}, {"a": 0, "b": 8, "w": 0.050043941634209776}, {"a": 0, "b": 9, "w": 0.11468196818362042}, {"a": 0, "b": 10, "w": 0.028526746158326732}, {"a": 0, "b": 11, "w": 0.06840099336591865}, {"a": 0, "b": 12, "w": 0.0971563061028482}, {"a": 0, "b": 13, "w": 0.06400078286647826}, {"a": 0, "b": 14, "w": 0.12977888172947738}, {"a": 0, "b": 15, "w": 0.20433016258457948}, {"a": 0, "b": 16, "w": 6.886313741460981e-11}, {"a": 0, "b": 17, "w": 0.012401619364426741}, {"a": 0, "b": 18, "w": 0.15527361402589768}, {"a": 0, "b": 19, "w": 0.1366747226293682}, {"a": 0, "b": 20, "w": 0.11796274082883484}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.802,hiY=-0.279;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
