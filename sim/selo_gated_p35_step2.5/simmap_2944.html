<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">アストライアの双皿 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.294, "c": "種", "n": "アストライアの双皿 [A]  n=3191 cos1.00 難1.29", "s": 0.895, "f": 0}, {"x": 0.983, "y": 1.321, "c": "近傍", "n": "IMPLANTATION [A]  n=3251 cos0.98 難1.32", "s": 0.911, "f": 0}, {"x": 0.98, "y": 1.276, "c": "近傍", "n": "Godspeed [A]  n=3315 cos0.98 難1.28", "s": 0.929, "f": 0}, {"x": 0.979, "y": 1.397, "c": "近傍", "n": "MAX 360 [A]  n=1541 cos0.98 難1.40", "s": 0.432, "f": 0}, {"x": 0.977, "y": 1.31, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.98 難1.31", "s": 0.772, "f": 0}, {"x": 0.977, "y": 1.103, "c": "近傍", "n": "Scripted Connection⇒ A mix [A]  n=3524 cos0.98 難1.10", "s": 0.988, "f": 0}, {"x": 0.972, "y": 1.155, "c": "近傍", "n": "ワルツ第17番 ト短調”大犬のワルツ” [A]  n=3567 cos0.97 難1.16", "s": 1.0, "f": 0}, {"x": 0.965, "y": 1.334, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.97 難1.33", "s": 0.205, "f": 0}, {"x": 0.973, "y": 0.911, "c": "近傍", "n": "Liberation [A]  n=3544 cos0.97 難0.91", "s": 0.994, "f": 0}, {"x": 0.964, "y": 1.243, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3284 cos0.96 難1.24", "s": 0.921, "f": 0}, {"x": 0.965, "y": 1.127, "c": "近傍", "n": "疾風迅雷 [A]  n=3357 cos0.96 難1.13", "s": 0.941, "f": 0}, {"x": 0.963, "y": 1.331, "c": "近傍", "n": "轟け！恋のビーンボール！！ [A]  n=3292 cos0.96 難1.33", "s": 0.923, "f": 0}, {"x": 0.966, "y": 0.994, "c": "近傍", "n": "Out of Control [A]  n=1758 cos0.97 難0.99", "s": 0.493, "f": 0}, {"x": 0.962, "y": 1.396, "c": "近傍", "n": "Session 9 -Chronicles- [A]  n=3083 cos0.96 難1.40", "s": 0.864, "f": 0}, {"x": 0.971, "y": 1.73, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [A]  n=3243 cos0.97 難1.73", "s": 0.909, "f": 0}, {"x": 0.964, "y": 1.532, "c": "近傍", "n": "烽火連天の刃 [A]  n=2076 cos0.96 難1.53", "s": 0.582, "f": 0}, {"x": 0.969, "y": 0.895, "c": "近傍", "n": "電人、暁に斃れる。 [A]  n=3511 cos0.97 難0.90", "s": 0.984, "f": 0}, {"x": 0.958, "y": 1.376, "c": "近傍", "n": "24h Endurance Race [A]  n=1710 cos0.96 難1.38", "s": 0.479, "f": 0}, {"x": 0.967, "y": 1.725, "c": "近傍", "n": "華麗なる大犬円舞曲 [A]  n=2636 cos0.97 難1.73", "s": 0.739, "f": 0}, {"x": 0.961, "y": 0.994, "c": "近傍", "n": "Ou Legends [A]  n=2000 cos0.96 難0.99", "s": 0.561, "f": 0}, {"x": 0.98, "y": 0.638, "c": "近傍", "n": "nostos [A]  n=3080 cos0.98 難0.64", "s": 0.863, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.21992822544577817}, {"a": 0, "b": 2, "w": 0.34239826125130235}, {"a": 0, "b": 3, "w": 0.33727945032599116}, {"a": 0, "b": 4, "w": 0.31032595100702165}, {"a": 0, "b": 5, "w": 0.2571491770990332}, {"a": 0, "b": 6, "w": 0.22912140886627408}, {"a": 0, "b": 7, "w": 0.13972325467549784}, {"a": 0, "b": 8, "w": 0.23617093920090726}, {"a": 0, "b": 9, "w": 0.14072044410967077}, {"a": 0, "b": 10, "w": 0.07908924795192707}, {"a": 0, "b": 11, "w": 2.1881607636942135e-11}, {"a": 0, "b": 12, "w": 0.15492941260807835}, {"a": 0, "b": 13, "w": 0.030564700561149127}, {"a": 0, "b": 14, "w": 0.23038937778822655}, {"a": 0, "b": 15, "w": 0.09350072246774577}, {"a": 0, "b": 16, "w": 0.17242445776515358}, {"a": 0, "b": 17, "w": 0.07426947851027621}, {"a": 0, "b": 18, "w": 0.07075323092560981}, {"a": 0, "b": 19, "w": 0.09972005371420745}, {"a": 0, "b": 20, "w": 0.19185082529437936}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.955,hiX=1.003,loY=0.550,hiY=1.818;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
