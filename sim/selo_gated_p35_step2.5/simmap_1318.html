<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Don't believe the hype [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.495, "c": "種", "n": "Don't believe the hype [H]  n=1893 cos1.00 難-0.50", "s": 0.543, "f": 0}, {"x": 0.988, "y": -0.554, "c": "近傍", "n": "GAME ON [H]  n=1321 cos0.99 難-0.55", "s": 0.379, "f": 0}, {"x": 0.985, "y": -0.3, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [H]  n=1812 cos0.99 難-0.30", "s": 0.52, "f": 0}, {"x": 0.985, "y": -0.299, "c": "近傍", "n": "Dynamite [H]  n=3348 cos0.98 難-0.30", "s": 0.961, "f": 0}, {"x": 0.983, "y": -0.528, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.98 難-0.53", "s": 0.822, "f": 0}, {"x": 0.982, "y": -0.592, "c": "近傍", "n": "naughty girl@Queen's Palace [H]  n=2762 cos0.98 難-0.59", "s": 0.793, "f": 0}, {"x": 0.982, "y": -0.417, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.98 難-0.42", "s": 0.657, "f": 0}, {"x": 0.982, "y": -0.403, "c": "近傍", "n": "Level One [H]  n=2810 cos0.98 難-0.40", "s": 0.807, "f": 0}, {"x": 0.981, "y": -0.643, "c": "近傍", "n": "SOLAR ECLIPSE [H]  n=1479 cos0.98 難-0.64", "s": 0.425, "f": 0}, {"x": 0.979, "y": -0.556, "c": "近傍", "n": "ビビデバ [A]  n=1667 cos0.98 難-0.56", "s": 0.479, "f": 0}, {"x": 0.984, "y": -0.13, "c": "近傍", "n": "5.1.1. [A]  n=3418 cos0.98 難-0.13", "s": 0.981, "f": 0}, {"x": 0.98, "y": -0.273, "c": "近傍", "n": "SAMSARA [A]  n=3305 cos0.98 難-0.27", "s": 0.949, "f": 0}, {"x": 0.978, "y": -0.366, "c": "近傍", "n": "Lords Of The Roundtable [H]  n=2285 cos0.98 難-0.37", "s": 0.656, "f": 0}, {"x": 0.977, "y": -0.374, "c": "近傍", "n": "最強頂戴girl [A]  n=1424 cos0.98 難-0.37", "s": 0.409, "f": 0}, {"x": 0.983, "y": -0.067, "c": "近傍", "n": "Catch Me [A]  n=2858 cos0.98 難-0.07", "s": 0.821, "f": 0}, {"x": 0.978, "y": -0.659, "c": "近傍", "n": "Level 5 [H]  n=961 cos0.98 難-0.66", "s": 0.276, "f": 0}, {"x": 0.977, "y": -0.365, "c": "近傍", "n": "FIRE FIRE [H]  n=3345 cos0.98 難-0.37", "s": 0.96, "f": 0}, {"x": 0.977, "y": -0.64, "c": "近傍", "n": "Agnus Dei [H]  n=1708 cos0.98 難-0.64", "s": 0.49, "f": 0}, {"x": 0.983, "y": -0.945, "c": "近傍", "n": "Double Dribble [H]  n=1638 cos0.98 難-0.94", "s": 0.47, "f": 0}, {"x": 0.977, "y": -0.281, "c": "近傍", "n": "Plan 8 [H]  n=3483 cos0.98 難-0.28", "s": 1.0, "f": 0}, {"x": 0.976, "y": -0.586, "c": "近傍", "n": "Xperanza [H]  n=2619 cos0.98 難-0.59", "s": 0.752, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4715855427162725}, {"a": 0, "b": 2, "w": 0.4301987359902746}, {"a": 0, "b": 3, "w": 0.4174116220657219}, {"a": 0, "b": 4, "w": 0.18320479049039906}, {"a": 0, "b": 5, "w": 0.2400290866027549}, {"a": 0, "b": 6, "w": 0.25883966046165374}, {"a": 0, "b": 7, "w": 0.35812677840555907}, {"a": 0, "b": 8, "w": 0.34346129353406063}, {"a": 0, "b": 9, "w": 0.033503209876735385}, {"a": 0, "b": 10, "w": 0.19642958788859677}, {"a": 0, "b": 11, "w": 2.9235391885151785e-11}, {"a": 0, "b": 12, "w": 0.29593429884019684}, {"a": 0, "b": 13, "w": 0.28913824648652475}, {"a": 0, "b": 14, "w": 0.24278556827193865}, {"a": 0, "b": 15, "w": 0.25629115039672634}, {"a": 0, "b": 16, "w": 0.06740197358393141}, {"a": 0, "b": 17, "w": 0.0007947471137665918}, {"a": 0, "b": 18, "w": 0.33155107817720597}, {"a": 0, "b": 19, "w": 0.28902041813587853}, {"a": 0, "b": 20, "w": 0.2541485794487123}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=-1.015,hiY=0.003;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
