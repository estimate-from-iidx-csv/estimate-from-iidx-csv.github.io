<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">The Last Apocalypse [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.051, "c": "種", "n": "The Last Apocalypse [H]  n=625 cos1.00 難-1.05", "s": 0.338, "f": 0}, {"x": 0.994, "y": -1.022, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1066 cos0.99 難-1.02", "s": 0.576, "f": 0}, {"x": 0.993, "y": -1.154, "c": "近傍", "n": "Regina vespaE [H]  n=652 cos0.99 難-1.15", "s": 0.352, "f": 0}, {"x": 0.994, "y": -0.915, "c": "近傍", "n": "u gotta beat [H]  n=948 cos0.99 難-0.92", "s": 0.512, "f": 0}, {"x": 0.991, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.13", "s": 0.723, "f": 0}, {"x": 0.988, "y": -1.065, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-1.06", "s": 0.337, "f": 0}, {"x": 0.988, "y": -0.945, "c": "近傍", "n": "Dahlia [H]  n=1112 cos0.99 難-0.94", "s": 0.601, "f": 0}, {"x": 0.989, "y": -0.903, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1851 cos0.99 難-0.90", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.823, "c": "近傍", "n": "God Mind [H]  n=718 cos0.99 難-0.82", "s": 0.388, "f": 0}, {"x": 0.988, "y": -0.935, "c": "近傍", "n": "Trill auf G [H]  n=1800 cos0.99 難-0.94", "s": 0.972, "f": 0}, {"x": 0.987, "y": -1.097, "c": "近傍", "n": "Ou Legends [H]  n=922 cos0.99 難-1.10", "s": 0.498, "f": 0}, {"x": 0.99, "y": -1.243, "c": "近傍", "n": "ACT0 [H]  n=762 cos0.99 難-1.24", "s": 0.412, "f": 0}, {"x": 0.99, "y": -1.255, "c": "近傍", "n": "#CMFLG [H]  n=891 cos0.99 難-1.26", "s": 0.481, "f": 0}, {"x": 0.988, "y": -0.894, "c": "近傍", "n": "CADENZA [H]  n=732 cos0.99 難-0.89", "s": 0.395, "f": 0}, {"x": 0.985, "y": -1.051, "c": "近傍", "n": "MARLIN [H]  n=506 cos0.99 難-1.05", "s": 0.273, "f": 0}, {"x": 0.985, "y": -1.023, "c": "近傍", "n": "終焔のClaudia [H]  n=803 cos0.99 難-1.02", "s": 0.434, "f": 0}, {"x": 0.986, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.15", "s": 0.345, "f": 0}, {"x": 0.985, "y": -1.028, "c": "近傍", "n": "Bad Encryption [H]  n=1504 cos0.98 難-1.03", "s": 0.813, "f": 0}, {"x": 0.985, "y": -1.051, "c": "近傍", "n": "Without Heaven [H]  n=515 cos0.98 難-1.05", "s": 0.278, "f": 0}, {"x": 0.985, "y": -1.151, "c": "近傍", "n": "innocent revolver [H]  n=1332 cos0.99 難-1.15", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.806, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.99 難-0.81", "s": 0.4, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4810690640574028}, {"a": 0, "b": 2, "w": 0.4425553039291288}, {"a": 0, "b": 3, "w": 0.41994346438301744}, {"a": 0, "b": 4, "w": 0.3160744803496409}, {"a": 0, "b": 5, "w": 0.03210323944946658}, {"a": 0, "b": 6, "w": 0.27500910366095166}, {"a": 0, "b": 7, "w": 0.3056213401588995}, {"a": 0, "b": 8, "w": 0.4115374971925393}, {"a": 0, "b": 9, "w": 0.16255031754900873}, {"a": 0, "b": 10, "w": 0.21450144450332187}, {"a": 0, "b": 11, "w": 0.2563123708174617}, {"a": 0, "b": 12, "w": 0.06243694998567484}, {"a": 0, "b": 13, "w": 0.16774249345606107}, {"a": 0, "b": 14, "w": 0.14722609589682822}, {"a": 0, "b": 15, "w": 0.14142733984345235}, {"a": 0, "b": 16, "w": 0.09548403160408925}, {"a": 0, "b": 17, "w": 0.15912029124002214}, {"a": 0, "b": 18, "w": 3.950295646149016e-11}, {"a": 0, "b": 19, "w": 0.05138294980047953}, {"a": 0, "b": 20, "w": 0.2501190703703461}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.291,hiY=-0.770;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
