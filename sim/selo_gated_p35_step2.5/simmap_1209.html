<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">消極的セツナイズム [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.261, "c": "種", "n": "消極的セツナイズム [A]  n=1234 cos1.00 難-0.26", "s": 0.36, "f": 0}, {"x": 0.998, "y": -0.285, "c": "近傍", "n": "8bit Princess [A]  n=3429 cos1.00 難-0.28", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.248, "c": "近傍", "n": "LESSON 5 [A]  n=2304 cos1.00 難-0.25", "s": 0.672, "f": 0}, {"x": 0.999, "y": -0.156, "c": "近傍", "n": "PopなEDEN [A]  n=1556 cos1.00 難-0.16", "s": 0.454, "f": 0}, {"x": 0.996, "y": -0.264, "c": "近傍", "n": "ABSOLUTE [A]  n=3210 cos1.00 難-0.26", "s": 0.936, "f": 0}, {"x": 0.997, "y": -0.366, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3309 cos1.00 難-0.37", "s": 0.965, "f": 0}, {"x": 0.996, "y": -0.253, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos1.00 難-0.25", "s": 0.215, "f": 0}, {"x": 0.996, "y": -0.198, "c": "近傍", "n": "planarian [A]  n=2948 cos1.00 難-0.20", "s": 0.86, "f": 0}, {"x": 0.996, "y": -0.135, "c": "近傍", "n": "Calvados Queen [A]  n=2628 cos1.00 難-0.13", "s": 0.766, "f": 0}, {"x": 0.997, "y": -0.086, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos1.00 難-0.09", "s": 0.806, "f": 0}, {"x": 0.995, "y": -0.282, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos0.99 難-0.28", "s": 0.683, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos0.99 難-0.25", "s": 0.281, "f": 0}, {"x": 0.995, "y": -0.123, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos1.00 難-0.12", "s": 0.944, "f": 0}, {"x": 0.995, "y": -0.367, "c": "近傍", "n": "Secret Rouge [A]  n=1564 cos0.99 難-0.37", "s": 0.456, "f": 0}, {"x": 0.994, "y": -0.281, "c": "近傍", "n": "XANADU OF TWO [A]  n=3389 cos0.99 難-0.28", "s": 0.988, "f": 0}, {"x": 0.994, "y": -0.254, "c": "近傍", "n": "可愛くてごめん [L]  n=1106 cos0.99 難-0.25", "s": 0.323, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "La dolce primavera [A]  n=2616 cos0.99 難-0.25", "s": 0.763, "f": 0}, {"x": 0.993, "y": -0.303, "c": "近傍", "n": "DM STAR～関西 energy style～ [A]  n=3108 cos0.99 難-0.30", "s": 0.906, "f": 0}, {"x": 0.994, "y": -0.339, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos0.99 難-0.34", "s": 0.412, "f": 0}, {"x": 0.993, "y": -0.254, "c": "近傍", "n": "Last Burning [A]  n=3170 cos0.99 難-0.25", "s": 0.924, "f": 0}, {"x": 0.993, "y": -0.224, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3108 cos0.99 難-0.22", "s": 0.906, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5460647195101851}, {"a": 0, "b": 2, "w": 0.4779135419342605}, {"a": 0, "b": 3, "w": 0.66713760172817}, {"a": 0, "b": 4, "w": 0.5792909155096269}, {"a": 0, "b": 5, "w": 0.5885490263232628}, {"a": 0, "b": 6, "w": 0.5117088545358885}, {"a": 0, "b": 7, "w": 0.3892492894098194}, {"a": 0, "b": 8, "w": 0.41544631735201454}, {"a": 0, "b": 9, "w": 0.6244177635482241}, {"a": 0, "b": 10, "w": 0.4680108083440585}, {"a": 0, "b": 11, "w": 0.2537290883742017}, {"a": 0, "b": 12, "w": 0.3249993198215563}, {"a": 0, "b": 13, "w": 0.4807121757308812}, {"a": 0, "b": 14, "w": 0.2591353149962905}, {"a": 0, "b": 15, "w": 4.889988414191748e-11}, {"a": 0, "b": 16, "w": 0.40202574197839624}, {"a": 0, "b": 17, "w": 0.41127978970515755}, {"a": 0, "b": 18, "w": 0.4209197450663684}, {"a": 0, "b": 19, "w": 0.3960809028873654}, {"a": 0, "b": 20, "w": 0.3933378903959225}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.390,hiY=-0.064;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
