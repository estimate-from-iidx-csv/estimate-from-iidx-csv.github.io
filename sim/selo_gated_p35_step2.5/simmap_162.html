<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">リメンバーリメンバー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.689, "c": "種", "n": "リメンバーリメンバー [A]  n=1232 cos1.00 難-0.69", "s": 0.421, "f": 0}, {"x": 0.995, "y": -0.729, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.73", "s": 0.636, "f": 0}, {"x": 0.994, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.6, "f": 0}, {"x": 0.993, "y": -0.643, "c": "近傍", "n": "gentle stress [A]  n=1887 cos0.99 難-0.64", "s": 0.645, "f": 0}, {"x": 0.992, "y": -0.694, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.99 難-0.69", "s": 0.839, "f": 0}, {"x": 0.992, "y": -0.765, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.99 難-0.77", "s": 0.778, "f": 0}, {"x": 0.991, "y": -0.729, "c": "近傍", "n": "Lucy [H]  n=1819 cos0.99 難-0.73", "s": 0.621, "f": 0}, {"x": 0.991, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.864, "f": 0}, {"x": 0.993, "y": -0.864, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.86", "s": 0.683, "f": 0}, {"x": 0.991, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.776, "f": 0}, {"x": 0.99, "y": -0.662, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.99 難-0.66", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.723, "c": "近傍", "n": "Boundary [H]  n=1742 cos0.99 難-0.72", "s": 0.595, "f": 0}, {"x": 0.989, "y": -0.645, "c": "近傍", "n": "Thunderbolt [H]  n=2738 cos0.99 難-0.64", "s": 0.935, "f": 0}, {"x": 0.99, "y": -0.552, "c": "近傍", "n": "rumrum triplets [H]  n=2692 cos0.99 難-0.55", "s": 0.92, "f": 0}, {"x": 0.989, "y": -0.7, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.554, "f": 0}, {"x": 0.988, "y": -0.682, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.99 難-0.68", "s": 0.865, "f": 0}, {"x": 0.99, "y": -0.86, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.86", "s": 0.778, "f": 0}, {"x": 0.989, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.81", "s": 0.638, "f": 0}, {"x": 0.989, "y": -0.554, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.55", "s": 0.427, "f": 0}, {"x": 0.991, "y": -0.912, "c": "近傍", "n": "NEO GENERATOR SEVEN [H]  n=1629 cos0.99 難-0.91", "s": 0.557, "f": 0}, {"x": 0.988, "y": -0.66, "c": "近傍", "n": "Nightmare before oversleep [H]  n=2374 cos0.99 難-0.66", "s": 0.811, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32971712013262877}, {"a": 0, "b": 2, "w": 0.43014174791456494}, {"a": 0, "b": 3, "w": 0.281105724077249}, {"a": 0, "b": 4, "w": 0.2907071290951745}, {"a": 0, "b": 5, "w": 0.26804621488186475}, {"a": 0, "b": 6, "w": 0.31459927798863285}, {"a": 0, "b": 7, "w": 0.264980090135596}, {"a": 0, "b": 8, "w": 0.36560211840729906}, {"a": 0, "b": 9, "w": 0.23108253659049782}, {"a": 0, "b": 10, "w": 0.232123110774472}, {"a": 0, "b": 11, "w": 0.16258806697024786}, {"a": 0, "b": 12, "w": 0.20798987305773808}, {"a": 0, "b": 13, "w": 0.256154744643718}, {"a": 0, "b": 14, "w": 0.17147162008577366}, {"a": 0, "b": 15, "w": 0.20444827309587554}, {"a": 0, "b": 16, "w": 0.24418575809721899}, {"a": 0, "b": 17, "w": 0.2011205597121123}, {"a": 0, "b": 18, "w": 0.2148751907739056}, {"a": 0, "b": 19, "w": 0.280150722017249}, {"a": 0, "b": 20, "w": 5.8092863852721166e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.941,hiY=-0.523;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
