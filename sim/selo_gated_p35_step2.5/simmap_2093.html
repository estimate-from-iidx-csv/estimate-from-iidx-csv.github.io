<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ruler or Loser [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.125, "c": "種", "n": "Ruler or Loser [A]  n=2210 cos1.00 難0.13", "s": 0.598, "f": 0}, {"x": 0.996, "y": 0.075, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [A]  n=3697 cos1.00 難0.08", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.12, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos1.00 難0.12", "s": 0.943, "f": 0}, {"x": 0.995, "y": 0.19, "c": "近傍", "n": "Show Me All Your Love [A]  n=1153 cos1.00 難0.19", "s": 0.312, "f": 0}, {"x": 0.995, "y": 0.19, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3656 cos0.99 難0.19", "s": 0.989, "f": 0}, {"x": 0.994, "y": 0.134, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos0.99 難0.13", "s": 0.452, "f": 0}, {"x": 0.994, "y": 0.134, "c": "近傍", "n": "Nasty Techniques [A]  n=2976 cos0.99 難0.13", "s": 0.805, "f": 0}, {"x": 0.994, "y": 0.041, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.04", "s": 0.958, "f": 0}, {"x": 0.995, "y": 0.012, "c": "近傍", "n": "PILGRIM [A]  n=1299 cos0.99 難0.01", "s": 0.351, "f": 0}, {"x": 0.994, "y": 0.12, "c": "近傍", "n": "Override [A]  n=3124 cos0.99 難0.12", "s": 0.845, "f": 0}, {"x": 0.995, "y": -0.013, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos1.00 難-0.01", "s": 0.305, "f": 0}, {"x": 0.994, "y": 0.17, "c": "近傍", "n": "THE LAST STRIKER [A]  n=3470 cos0.99 難0.17", "s": 0.939, "f": 0}, {"x": 0.994, "y": 0.03, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos0.99 難0.03", "s": 0.857, "f": 0}, {"x": 0.993, "y": 0.056, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.06", "s": 0.61, "f": 0}, {"x": 0.993, "y": 0.04, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos0.99 難0.04", "s": 0.949, "f": 0}, {"x": 0.993, "y": 0.252, "c": "近傍", "n": "GloriosA [A]  n=1782 cos0.99 難0.25", "s": 0.482, "f": 0}, {"x": 0.992, "y": 0.174, "c": "近傍", "n": "Night sky [A]  n=3488 cos0.99 難0.17", "s": 0.943, "f": 0}, {"x": 0.992, "y": 0.043, "c": "近傍", "n": "Empire State Glory [A]  n=3578 cos0.99 難0.04", "s": 0.968, "f": 0}, {"x": 0.992, "y": 0.156, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos0.99 難0.16", "s": 0.931, "f": 0}, {"x": 0.992, "y": 0.101, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.10", "s": 0.901, "f": 0}, {"x": 0.992, "y": 0.039, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2824 cos0.99 難0.04", "s": 0.764, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4604780477699436}, {"a": 0, "b": 2, "w": 0.5346784906217865}, {"a": 0, "b": 3, "w": 0.5301821371611399}, {"a": 0, "b": 4, "w": 0.40807620211235207}, {"a": 0, "b": 5, "w": 0.49825647326052436}, {"a": 0, "b": 6, "w": 0.49462855497101177}, {"a": 0, "b": 7, "w": 0.30327249281568813}, {"a": 0, "b": 8, "w": 0.4778273140516286}, {"a": 0, "b": 9, "w": 0.38306154318523755}, {"a": 0, "b": 10, "w": 0.501526608669792}, {"a": 0, "b": 11, "w": 0.4840703526911253}, {"a": 0, "b": 12, "w": 0.4906054879604488}, {"a": 0, "b": 13, "w": 0.3879759855550594}, {"a": 0, "b": 14, "w": 0.4100543872903304}, {"a": 0, "b": 15, "w": 0.3809235995669371}, {"a": 0, "b": 16, "w": 3.896938327585531e-11}, {"a": 0, "b": 17, "w": 0.43661974606260767}, {"a": 0, "b": 18, "w": 0.3761381236011041}, {"a": 0, "b": 19, "w": 0.35212883929154304}, {"a": 0, "b": 20, "w": 0.4277590913224453}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.034,hiY=0.273;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
