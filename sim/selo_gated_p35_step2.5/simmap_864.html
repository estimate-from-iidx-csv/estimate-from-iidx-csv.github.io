<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Get Into The Groove feat.WaMi [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.695, "c": "種", "n": "Get Into The Groove feat.WaMi [A]  n=486 cos1.00 難-0.69", "s": 0.128, "f": 0}, {"x": 0.996, "y": -0.53, "c": "近傍", "n": "When I Met U [A]  n=2647 cos1.00 難-0.53", "s": 0.696, "f": 0}, {"x": 0.997, "y": -0.498, "c": "近傍", "n": "神様、つれない。 [A]  n=1325 cos1.00 難-0.50", "s": 0.349, "f": 0}, {"x": 0.994, "y": -0.729, "c": "近傍", "n": "Cyber Force [H]  n=1937 cos0.99 難-0.73", "s": 0.509, "f": 0}, {"x": 0.996, "y": -0.477, "c": "近傍", "n": "OOO [A]  n=3557 cos1.00 難-0.48", "s": 0.936, "f": 0}, {"x": 0.993, "y": -0.581, "c": "近傍", "n": "不死身ごっこ [A]  n=705 cos0.99 難-0.58", "s": 0.185, "f": 0}, {"x": 0.997, "y": -0.366, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3309 cos1.00 難-0.37", "s": 0.87, "f": 0}, {"x": 0.991, "y": -0.811, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.99 難-0.81", "s": 0.584, "f": 0}, {"x": 0.991, "y": -0.584, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos0.99 難-0.58", "s": 0.6, "f": 0}, {"x": 0.991, "y": -0.608, "c": "近傍", "n": "Liberation [H]  n=2362 cos0.99 難-0.61", "s": 0.621, "f": 0}, {"x": 0.992, "y": -0.491, "c": "近傍", "n": "thunder HOUSE NATION Remix [A]  n=1651 cos0.99 難-0.49", "s": 0.434, "f": 0}, {"x": 0.991, "y": -0.633, "c": "近傍", "n": "愛包ダンスホール [A]  n=1617 cos0.99 難-0.63", "s": 0.425, "f": 0}, {"x": 0.991, "y": -0.567, "c": "近傍", "n": "ギャ・ギャ・ギャ・ギャラクシー！ [A]  n=1122 cos0.99 難-0.57", "s": 0.295, "f": 0}, {"x": 0.992, "y": -0.506, "c": "近傍", "n": "LUV CAN SAVE U [A]  n=3146 cos0.99 難-0.51", "s": 0.827, "f": 0}, {"x": 0.992, "y": -0.462, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.46", "s": 0.889, "f": 0}, {"x": 0.995, "y": -0.349, "c": "近傍", "n": "Stepper [A]  n=1978 cos1.00 難-0.35", "s": 0.52, "f": 0}, {"x": 0.991, "y": -0.474, "c": "近傍", "n": "キスキツネ [A]  n=1147 cos0.99 難-0.47", "s": 0.302, "f": 0}, {"x": 0.998, "y": -0.303, "c": "近傍", "n": "DM STAR～関西 energy style～ [A]  n=3108 cos1.00 難-0.30", "s": 0.817, "f": 0}, {"x": 0.992, "y": -0.946, "c": "近傍", "n": "Raspberry Railgun [H]  n=1994 cos0.99 難-0.95", "s": 0.524, "f": 0}, {"x": 0.992, "y": -0.426, "c": "近傍", "n": "陽炎 [A]  n=2850 cos0.99 難-0.43", "s": 0.75, "f": 0}, {"x": 0.992, "y": -0.441, "c": "近傍", "n": "朧 [A]  n=3802 cos0.99 難-0.44", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.466573721236618}, {"a": 0, "b": 2, "w": 0.5490936570448459}, {"a": 0, "b": 3, "w": 0.20675645362502448}, {"a": 0, "b": 4, "w": 0.4682438147836343}, {"a": 0, "b": 5, "w": 0.21117431749064453}, {"a": 0, "b": 6, "w": 0.47215336647561956}, {"a": 0, "b": 7, "w": 0.13878065557536767}, {"a": 0, "b": 8, "w": 0.10654712426071977}, {"a": 0, "b": 9, "w": 0.17058201108676374}, {"a": 0, "b": 10, "w": 6.484357495395443e-11}, {"a": 0, "b": 11, "w": 0.12251634518148946}, {"a": 0, "b": 12, "w": 0.08179881600229422}, {"a": 0, "b": 13, "w": 0.17864707253744927}, {"a": 0, "b": 14, "w": 0.19501739864216228}, {"a": 0, "b": 15, "w": 0.36163872704447364}, {"a": 0, "b": 16, "w": 0.009008617774948768}, {"a": 0, "b": 17, "w": 0.5461049602817554}, {"a": 0, "b": 18, "w": 0.15380624790867492}, {"a": 0, "b": 19, "w": 0.18541038281564748}, {"a": 0, "b": 20, "w": 0.1901833161272708}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.998,hiY=-0.252;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
