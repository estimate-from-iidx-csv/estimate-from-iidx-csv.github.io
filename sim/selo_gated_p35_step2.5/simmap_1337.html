<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">EX-MASSIVE FIGHTER [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.065, "c": "種", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos1.00 難-1.06", "s": 0.309, "f": 0}, {"x": 0.998, "y": -1.071, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos1.00 難-1.07", "s": 0.6, "f": 0}, {"x": 0.996, "y": -1.103, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos1.00 難-1.10", "s": 0.811, "f": 0}, {"x": 0.995, "y": -1.045, "c": "近傍", "n": "Out of Control [H]  n=848 cos1.00 難-1.05", "s": 0.42, "f": 0}, {"x": 0.996, "y": -1.131, "c": "近傍", "n": "frequent [H]  n=1106 cos1.00 難-1.13", "s": 0.548, "f": 0}, {"x": 0.996, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos1.00 難-1.13", "s": 0.663, "f": 0}, {"x": 0.995, "y": -1.051, "c": "近傍", "n": "Without Heaven [H]  n=515 cos0.99 難-1.05", "s": 0.255, "f": 0}, {"x": 0.995, "y": -1.032, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1717 cos0.99 難-1.03", "s": 0.85, "f": 0}, {"x": 0.996, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos1.00 難-1.15", "s": 0.316, "f": 0}, {"x": 0.997, "y": -1.174, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos1.00 難-1.17", "s": 0.347, "f": 0}, {"x": 0.994, "y": -1.032, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-1.03", "s": 0.266, "f": 0}, {"x": 0.994, "y": -1.106, "c": "近傍", "n": "Satellite Burst [H]  n=905 cos0.99 難-1.11", "s": 0.448, "f": 0}, {"x": 0.995, "y": -0.974, "c": "近傍", "n": "#The_Relentless [H]  n=2019 cos0.99 難-0.97", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.115, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos0.99 難-1.11", "s": 0.428, "f": 0}, {"x": 0.993, "y": -1.053, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos0.99 難-1.05", "s": 0.372, "f": 0}, {"x": 0.993, "y": -1.031, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=612 cos0.99 難-1.03", "s": 0.303, "f": 0}, {"x": 0.993, "y": -1.109, "c": "近傍", "n": "禊 [H]  n=1637 cos0.99 難-1.11", "s": 0.811, "f": 0}, {"x": 0.993, "y": -1.013, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos0.99 難-1.01", "s": 0.712, "f": 0}, {"x": 0.993, "y": -1.043, "c": "近傍", "n": "EBONY & IVORY [H]  n=1772 cos0.99 難-1.04", "s": 0.878, "f": 0}, {"x": 0.993, "y": -1.027, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos0.99 難-1.03", "s": 0.57, "f": 0}, {"x": 0.996, "y": -0.935, "c": "近傍", "n": "Trill auf G [H]  n=1800 cos1.00 難-0.94", "s": 0.892, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.557052897030123}, {"a": 0, "b": 2, "w": 0.3909064625126505}, {"a": 0, "b": 3, "w": 0.16114574528121872}, {"a": 0, "b": 4, "w": 0.457446233850501}, {"a": 0, "b": 5, "w": 0.16416413430716503}, {"a": 0, "b": 6, "w": 0.37137947405488425}, {"a": 0, "b": 7, "w": 0.3198601429435811}, {"a": 0, "b": 8, "w": 0.41094952772750093}, {"a": 0, "b": 9, "w": 0.5265370560647309}, {"a": 0, "b": 10, "w": 0.1162821491827809}, {"a": 0, "b": 11, "w": 0.3449679394132642}, {"a": 0, "b": 12, "w": 0.371208567451918}, {"a": 0, "b": 13, "w": 0.06291943332786298}, {"a": 0, "b": 14, "w": 0.30039692802579243}, {"a": 0, "b": 15, "w": 5.878653119850696e-11}, {"a": 0, "b": 16, "w": 0.10492183307685743}, {"a": 0, "b": 17, "w": 0.2671225625399891}, {"a": 0, "b": 18, "w": 0.2806299819355944}, {"a": 0, "b": 19, "w": 0.15884773790420703}, {"a": 0, "b": 20, "w": 0.3338158260065006}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-1.193,hiY=-0.916;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
