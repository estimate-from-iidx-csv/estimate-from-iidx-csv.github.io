<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">シンデレラ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.315, "c": "種", "n": "シンデレラ [A]  n=1872 cos1.00 難-0.31", "s": 0.538, "f": 0}, {"x": 0.995, "y": -0.371, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos1.00 難-0.37", "s": 0.765, "f": 0}, {"x": 0.994, "y": -0.384, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos0.99 難-0.38", "s": 0.791, "f": 0}, {"x": 0.992, "y": -0.343, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos0.99 難-0.34", "s": 0.804, "f": 0}, {"x": 0.992, "y": -0.232, "c": "近傍", "n": "smooooch・∀・ (Snail's House Remix) [A]  n=2451 cos0.99 難-0.23", "s": 0.704, "f": 0}, {"x": 0.992, "y": -0.349, "c": "近傍", "n": "次葉 -turn the page- [A]  n=3299 cos0.99 難-0.35", "s": 0.947, "f": 0}, {"x": 0.995, "y": -0.554, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.55", "s": 0.359, "f": 0}, {"x": 0.99, "y": -0.245, "c": "近傍", "n": "ACT [A]  n=2300 cos0.99 難-0.24", "s": 0.661, "f": 0}, {"x": 0.99, "y": -0.353, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.35", "s": 0.323, "f": 0}, {"x": 0.99, "y": -0.323, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.32", "s": 0.828, "f": 0}, {"x": 0.99, "y": -0.337, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.99 難-0.34", "s": 0.771, "f": 0}, {"x": 0.99, "y": -0.228, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos0.99 難-0.23", "s": 0.905, "f": 0}, {"x": 0.989, "y": -0.249, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.25", "s": 0.644, "f": 0}, {"x": 0.989, "y": -0.262, "c": "近傍", "n": "Lycoris [A]  n=1033 cos0.99 難-0.26", "s": 0.297, "f": 0}, {"x": 0.989, "y": -0.254, "c": "近傍", "n": "Magical [A]  n=3224 cos0.99 難-0.25", "s": 0.926, "f": 0}, {"x": 0.989, "y": -0.242, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.24", "s": 0.845, "f": 0}, {"x": 0.989, "y": -0.268, "c": "近傍", "n": "妖隠し -あやかしかくし- [A]  n=3482 cos0.99 難-0.27", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.251, "c": "近傍", "n": "Next Level [A]  n=1622 cos0.99 難-0.25", "s": 0.466, "f": 0}, {"x": 0.988, "y": -0.31, "c": "近傍", "n": "電子になりたい [A]  n=1538 cos0.99 難-0.31", "s": 0.442, "f": 0}, {"x": 0.992, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.59", "s": 0.744, "f": 0}, {"x": 0.988, "y": -0.401, "c": "近傍", "n": "ヨシダさん [A]  n=2888 cos0.99 難-0.40", "s": 0.829, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39898921277411237}, {"a": 0, "b": 2, "w": 0.36678247705864575}, {"a": 0, "b": 3, "w": 0.35280369286295843}, {"a": 0, "b": 4, "w": 0.3935556042285103}, {"a": 0, "b": 5, "w": 0.36753179611215137}, {"a": 0, "b": 6, "w": 0.4327407395826458}, {"a": 0, "b": 7, "w": 0.21000200361019639}, {"a": 0, "b": 8, "w": 0.30894474332498256}, {"a": 0, "b": 9, "w": 0.32226220037491127}, {"a": 0, "b": 10, "w": 0.23946016305947382}, {"a": 0, "b": 11, "w": 0.27328492519463754}, {"a": 0, "b": 12, "w": 0.08427933661422349}, {"a": 0, "b": 13, "w": 0.26897958784734166}, {"a": 0, "b": 14, "w": 0.11674325455352264}, {"a": 0, "b": 15, "w": 0.29503730955363217}, {"a": 0, "b": 16, "w": 0.20531475839577118}, {"a": 0, "b": 17, "w": 0.1092726897979519}, {"a": 0, "b": 18, "w": 0.2808565367250335}, {"a": 0, "b": 19, "w": 0.38641260443009373}, {"a": 0, "b": 20, "w": 4.8904436056318445e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.621,hiY=-0.199;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
