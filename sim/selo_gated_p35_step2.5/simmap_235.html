<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Be a Hero! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.398, "c": "種", "n": "Be a Hero! [H]  n=1362 cos1.00 難-1.40", "s": 0.771, "f": 0}, {"x": 0.996, "y": -1.412, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1767 cos1.00 難-1.41", "s": 1.0, "f": 0}, {"x": 0.996, "y": -1.358, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos1.00 難-1.36", "s": 0.799, "f": 0}, {"x": 0.997, "y": -1.353, "c": "近傍", "n": "encounter [H]  n=1624 cos1.00 難-1.35", "s": 0.919, "f": 0}, {"x": 0.995, "y": -1.476, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.48", "s": 0.386, "f": 0}, {"x": 0.996, "y": -1.303, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos1.00 難-1.30", "s": 0.748, "f": 0}, {"x": 0.992, "y": -1.323, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.32", "s": 0.784, "f": 0}, {"x": 0.995, "y": -1.301, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1721 cos0.99 難-1.30", "s": 0.974, "f": 0}, {"x": 0.989, "y": -1.43, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.43", "s": 0.617, "f": 0}, {"x": 0.987, "y": -1.421, "c": "近傍", "n": "Jungle Eater [H]  n=1104 cos0.99 難-1.42", "s": 0.625, "f": 0}, {"x": 0.993, "y": -1.286, "c": "近傍", "n": "スパークリング☆彡ハイパーチューン！！ [H]  n=1043 cos0.99 難-1.29", "s": 0.59, "f": 0}, {"x": 0.986, "y": -1.379, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1677 cos0.99 難-1.38", "s": 0.949, "f": 0}, {"x": 0.995, "y": -1.525, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1156 cos0.99 難-1.53", "s": 0.654, "f": 0}, {"x": 0.99, "y": -1.298, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [H]  n=970 cos0.99 難-1.30", "s": 0.549, "f": 0}, {"x": 0.985, "y": -1.358, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.99 難-1.36", "s": 0.776, "f": 0}, {"x": 0.991, "y": -1.274, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.27", "s": 0.689, "f": 0}, {"x": 0.994, "y": -1.54, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [H]  n=1100 cos0.99 難-1.54", "s": 0.623, "f": 0}, {"x": 0.984, "y": -1.419, "c": "近傍", "n": "Cyber True Color [H]  n=899 cos0.98 難-1.42", "s": 0.509, "f": 0}, {"x": 0.984, "y": -1.391, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1530 cos0.98 難-1.39", "s": 0.866, "f": 0}, {"x": 0.988, "y": -1.282, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.99 難-1.28", "s": 0.912, "f": 0}, {"x": 0.992, "y": -1.546, "c": "近傍", "n": "STARLiGHT [H]  n=1530 cos0.99 難-1.55", "s": 0.866, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39396788822183415}, {"a": 0, "b": 2, "w": 0.5362391359018928}, {"a": 0, "b": 3, "w": 0.5534701776422857}, {"a": 0, "b": 4, "w": 0.3946602292263187}, {"a": 0, "b": 5, "w": 0.47228441272903354}, {"a": 0, "b": 6, "w": 0.3065416382874381}, {"a": 0, "b": 7, "w": 0.37262176532137914}, {"a": 0, "b": 8, "w": 0.17824290153750666}, {"a": 0, "b": 9, "w": 0.13086380121985997}, {"a": 0, "b": 10, "w": 0.3758166241772408}, {"a": 0, "b": 11, "w": 0.06254518999477265}, {"a": 0, "b": 12, "w": 0.4419532486412724}, {"a": 0, "b": 13, "w": 0.23478366846616328}, {"a": 0, "b": 14, "w": 6.097744531530225e-11}, {"a": 0, "b": 15, "w": 0.25406054268191924}, {"a": 0, "b": 16, "w": 0.3723204252930097}, {"a": 0, "b": 17, "w": 0.02527665238750154}, {"a": 0, "b": 18, "w": 0.013413529524606504}, {"a": 0, "b": 19, "w": 0.166811278248431}, {"a": 0, "b": 20, "w": 0.3059969747531883}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.568,hiY=-1.252;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
