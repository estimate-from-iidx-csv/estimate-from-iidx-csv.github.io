<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Concertino in Blue [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.233, "c": "種", "n": "Concertino in Blue [H]  n=2829 cos1.00 難-0.23", "s": 0.862, "f": 0}, {"x": 0.992, "y": -0.298, "c": "近傍", "n": "GALGALIM [H]  n=2297 cos0.99 難-0.30", "s": 0.7, "f": 0}, {"x": 0.989, "y": -0.263, "c": "近傍", "n": "Cheer Train [A]  n=2414 cos0.99 難-0.26", "s": 0.735, "f": 0}, {"x": 0.989, "y": -0.164, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.99 難-0.16", "s": 0.894, "f": 0}, {"x": 0.989, "y": -0.199, "c": "近傍", "n": "route 80s [A]  n=2374 cos0.99 難-0.20", "s": 0.723, "f": 0}, {"x": 0.99, "y": -0.385, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.39", "s": 0.86, "f": 0}, {"x": 0.989, "y": -0.123, "c": "近傍", "n": "Music is The Answer [A]  n=3025 cos0.99 難-0.12", "s": 0.921, "f": 0}, {"x": 0.988, "y": -0.301, "c": "近傍", "n": "太陽～T・A・I・Y・O～ [A]  n=2502 cos0.99 難-0.30", "s": 0.762, "f": 0}, {"x": 0.988, "y": -0.126, "c": "近傍", "n": "Do it!! Do it!! [H]  n=2810 cos0.99 難-0.13", "s": 0.856, "f": 0}, {"x": 0.987, "y": -0.292, "c": "近傍", "n": "THE DEEP STRIKER [H]  n=2677 cos0.99 難-0.29", "s": 0.815, "f": 0}, {"x": 0.987, "y": -0.237, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos0.99 難-0.24", "s": 0.392, "f": 0}, {"x": 0.992, "y": -0.542, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1934 cos0.99 難-0.54", "s": 0.589, "f": 0}, {"x": 0.986, "y": -0.244, "c": "近傍", "n": "Don't let it go [A]  n=1279 cos0.99 難-0.24", "s": 0.39, "f": 0}, {"x": 0.988, "y": -0.028, "c": "近傍", "n": "Feedback [A]  n=2745 cos0.99 難-0.03", "s": 0.836, "f": 0}, {"x": 0.986, "y": -0.277, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1403 cos0.99 難-0.28", "s": 0.427, "f": 0}, {"x": 0.986, "y": -0.298, "c": "近傍", "n": "Umbral [A]  n=3241 cos0.99 難-0.30", "s": 0.987, "f": 0}, {"x": 0.986, "y": -0.295, "c": "近傍", "n": "Star Trail [A]  n=3283 cos0.99 難-0.29", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.727, "f": 0}, {"x": 0.985, "y": -0.2, "c": "近傍", "n": "In The Breeze [A]  n=2527 cos0.99 難-0.20", "s": 0.77, "f": 0}, {"x": 0.985, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.98 難-0.26", "s": 0.947, "f": 0}, {"x": 0.986, "y": -0.063, "c": "近傍", "n": "Regulus [A]  n=2456 cos0.99 難-0.06", "s": 0.748, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43405892541656876}, {"a": 0, "b": 2, "w": 0.12761732724891528}, {"a": 0, "b": 3, "w": 0.3054494339088074}, {"a": 0, "b": 4, "w": 0.2750628605660995}, {"a": 0, "b": 5, "w": 0.3442572258435297}, {"a": 0, "b": 6, "w": 0.18733451684999025}, {"a": 0, "b": 7, "w": 0.23569400562136666}, {"a": 0, "b": 8, "w": 0.3204293187731203}, {"a": 0, "b": 9, "w": 0.2933657701606739}, {"a": 0, "b": 10, "w": 0.11369269658425385}, {"a": 0, "b": 11, "w": 0.4083440506627283}, {"a": 0, "b": 12, "w": 0.119551376948131}, {"a": 0, "b": 13, "w": 0.28113048501323723}, {"a": 0, "b": 14, "w": 0.2735596690545853}, {"a": 0, "b": 15, "w": 3.983890994874173e-11}, {"a": 0, "b": 16, "w": 0.13373106676205915}, {"a": 0, "b": 17, "w": 0.036800448905863536}, {"a": 0, "b": 18, "w": 0.1205889150770384}, {"a": 0, "b": 19, "w": 0.13075318592981722}, {"a": 0, "b": 20, "w": 0.1711563274908956}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-0.583,hiY=0.013;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
