<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BLACK or WHITE? [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.713, "c": "種", "n": "BLACK or WHITE? [A]  n=2319 cos1.00 難1.71", "s": 0.713, "f": 0}, {"x": 0.985, "y": 1.692, "c": "近傍", "n": "suspicions [A]  n=1382 cos0.98 難1.69", "s": 0.425, "f": 0}, {"x": 0.985, "y": 1.691, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2472 cos0.98 難1.69", "s": 0.76, "f": 0}, {"x": 0.983, "y": 1.724, "c": "近傍", "n": "ZEPHYRANTHES [L]  n=2168 cos0.98 難1.72", "s": 0.667, "f": 0}, {"x": 0.983, "y": 1.742, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2854 cos0.98 難1.74", "s": 0.878, "f": 0}, {"x": 0.984, "y": 1.663, "c": "近傍", "n": "VOLAQUAS [A]  n=1729 cos0.98 難1.66", "s": 0.532, "f": 0}, {"x": 0.983, "y": 1.674, "c": "近傍", "n": "Life Is A Game ft.DD\"ナカタ\"Metal [A]  n=2805 cos0.98 難1.67", "s": 0.863, "f": 0}, {"x": 0.98, "y": 1.738, "c": "近傍", "n": "ALBA -黎明- [L]  n=1258 cos0.98 難1.74", "s": 0.387, "f": 0}, {"x": 0.982, "y": 1.663, "c": "近傍", "n": "waxing and wanding [L]  n=2819 cos0.98 難1.66", "s": 0.867, "f": 0}, {"x": 0.981, "y": 1.669, "c": "近傍", "n": "Artist [A]  n=2459 cos0.98 難1.67", "s": 0.756, "f": 0}, {"x": 0.979, "y": 1.715, "c": "近傍", "n": "Zirkfied [A]  n=2951 cos0.98 難1.71", "s": 0.908, "f": 0}, {"x": 0.981, "y": 1.661, "c": "近傍", "n": "MAX 300 [A]  n=1585 cos0.98 難1.66", "s": 0.488, "f": 0}, {"x": 0.982, "y": 1.651, "c": "近傍", "n": "天空の夜明け [A]  n=3251 cos0.98 難1.65", "s": 1.0, "f": 0}, {"x": 0.994, "y": 1.823, "c": "近傍", "n": "∀ [A]  n=2452 cos0.99 難1.82", "s": 0.754, "f": 0}, {"x": 0.976, "y": 1.712, "c": "近傍", "n": "Satellite Burst [A]  n=1278 cos0.98 難1.71", "s": 0.393, "f": 0}, {"x": 0.983, "y": 1.628, "c": "近傍", "n": "Blue Rain [L]  n=2878 cos0.98 難1.63", "s": 0.885, "f": 0}, {"x": 0.983, "y": 1.813, "c": "近傍", "n": "お菓子の王国 [A]  n=2847 cos0.98 難1.81", "s": 0.876, "f": 0}, {"x": 0.976, "y": 1.765, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2354 cos0.98 難1.76", "s": 0.724, "f": 0}, {"x": 0.979, "y": 1.633, "c": "近傍", "n": "Quakes [A]  n=2875 cos0.98 難1.63", "s": 0.884, "f": 0}, {"x": 0.982, "y": 1.616, "c": "近傍", "n": "閠槞彁の願い [A]  n=2330 cos0.98 難1.62", "s": 0.717, "f": 0}, {"x": 0.974, "y": 1.662, "c": "近傍", "n": "MENDES [A]  n=3238 cos0.97 難1.66", "s": 0.996, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3657773720860772}, {"a": 0, "b": 2, "w": 0.3797523328592891}, {"a": 0, "b": 3, "w": 0.31684107805115236}, {"a": 0, "b": 4, "w": 0.4049744418998322}, {"a": 0, "b": 5, "w": 0.4186898173974316}, {"a": 0, "b": 6, "w": 0.3964041695519934}, {"a": 0, "b": 7, "w": 0.360368662817556}, {"a": 0, "b": 8, "w": 0.37908287025360177}, {"a": 0, "b": 9, "w": 0.31014813094723515}, {"a": 0, "b": 10, "w": 0.2890513524054008}, {"a": 0, "b": 11, "w": 0.2607616967709566}, {"a": 0, "b": 12, "w": 0.35059077071863687}, {"a": 0, "b": 13, "w": 0.5748573123542909}, {"a": 0, "b": 14, "w": 0.27578803862038137}, {"a": 0, "b": 15, "w": 0.3006144005862704}, {"a": 0, "b": 16, "w": 0.401940837557065}, {"a": 0, "b": 17, "w": 1.8719803485112152e-11}, {"a": 0, "b": 18, "w": 0.30506640580162003}, {"a": 0, "b": 19, "w": 0.3493886464202456}, {"a": 0, "b": 20, "w": 0.25478233503118064}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.972,hiX=1.002,loY=1.600,hiY=1.839;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
