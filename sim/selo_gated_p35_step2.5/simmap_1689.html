<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">サヨナラ・ヘヴン [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.436, "c": "種", "n": "サヨナラ・ヘヴン [L]  n=663 cos1.00 難-0.44", "s": 0.176, "f": 0}, {"x": 0.99, "y": -0.285, "c": "近傍", "n": "Roots of my way! [A]  n=2452 cos0.99 難-0.29", "s": 0.65, "f": 0}, {"x": 0.99, "y": -0.258, "c": "近傍", "n": "MARIA (I believe... ) [A]  n=2086 cos0.99 難-0.26", "s": 0.553, "f": 0}, {"x": 0.987, "y": -0.611, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2052 cos0.99 難-0.61", "s": 0.544, "f": 0}, {"x": 0.986, "y": -0.247, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3193 cos0.99 難-0.25", "s": 0.847, "f": 0}, {"x": 0.987, "y": -0.664, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.99 難-0.66", "s": 0.442, "f": 0}, {"x": 0.984, "y": -0.386, "c": "近傍", "n": "純真可憐デザイア [A]  n=3599 cos0.98 難-0.39", "s": 0.955, "f": 0}, {"x": 0.984, "y": -0.389, "c": "近傍", "n": "PIRATES BLADE [A]  n=2286 cos0.98 難-0.39", "s": 0.606, "f": 0}, {"x": 0.987, "y": -0.159, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2073 cos0.99 難-0.16", "s": 0.55, "f": 0}, {"x": 0.984, "y": -0.282, "c": "近傍", "n": "STARLIGHT JUNCTION [A]  n=2984 cos0.98 難-0.28", "s": 0.792, "f": 0}, {"x": 0.989, "y": -0.088, "c": "近傍", "n": "AFRO KNUCKLE [A]  n=3675 cos0.99 難-0.09", "s": 0.975, "f": 0}, {"x": 0.983, "y": -0.603, "c": "近傍", "n": "smile [H]  n=1932 cos0.98 難-0.60", "s": 0.512, "f": 0}, {"x": 0.985, "y": -0.164, "c": "近傍", "n": "METALLIC MIND [A]  n=2575 cos0.98 難-0.16", "s": 0.683, "f": 0}, {"x": 0.982, "y": -0.499, "c": "近傍", "n": "Double Loving Heart [A]  n=2702 cos0.98 難-0.50", "s": 0.717, "f": 0}, {"x": 0.982, "y": -0.232, "c": "近傍", "n": "ヒマワリ [A]  n=3298 cos0.98 難-0.23", "s": 0.875, "f": 0}, {"x": 0.982, "y": -0.617, "c": "近傍", "n": "Close the World feat.a☆ru [H]  n=3019 cos0.98 難-0.62", "s": 0.801, "f": 0}, {"x": 0.981, "y": -0.329, "c": "近傍", "n": "MOON [A]  n=3205 cos0.98 難-0.33", "s": 0.85, "f": 0}, {"x": 0.981, "y": -0.283, "c": "近傍", "n": "Raspberry Heart(English version) [A]  n=2297 cos0.98 難-0.28", "s": 0.609, "f": 0}, {"x": 0.984, "y": -0.748, "c": "近傍", "n": "レシピのリドル [A]  n=726 cos0.98 難-0.75", "s": 0.193, "f": 0}, {"x": 0.982, "y": -0.214, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos0.98 難-0.21", "s": 0.988, "f": 0}, {"x": 0.98, "y": -0.481, "c": "近傍", "n": "Mermaid girl [A]  n=3770 cos0.98 難-0.48", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.354653866394531}, {"a": 0, "b": 2, "w": 0.3619519955482765}, {"a": 0, "b": 3, "w": 0.1868627164184109}, {"a": 0, "b": 4, "w": 0.25964055550728804}, {"a": 0, "b": 5, "w": 0.3154970098729827}, {"a": 0, "b": 6, "w": 0.2628049017934364}, {"a": 0, "b": 7, "w": 0.222253086641518}, {"a": 0, "b": 8, "w": 0.2974229849762251}, {"a": 0, "b": 9, "w": 0.24031292074424915}, {"a": 0, "b": 10, "w": 0.2971870506508608}, {"a": 0, "b": 11, "w": 0.18708832522916607}, {"a": 0, "b": 12, "w": 0.26285589584483493}, {"a": 0, "b": 13, "w": 4.075950688076091e-11}, {"a": 0, "b": 14, "w": 0.16810583772441434}, {"a": 0, "b": 15, "w": 0.2026383897809545}, {"a": 0, "b": 16, "w": 0.12114427644360548}, {"a": 0, "b": 17, "w": 0.19269275262980312}, {"a": 0, "b": 18, "w": 0.23478695195912713}, {"a": 0, "b": 19, "w": 0.20193467235702944}, {"a": 0, "b": 20, "w": 0.16007582374167717}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.801,hiY=-0.035;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
