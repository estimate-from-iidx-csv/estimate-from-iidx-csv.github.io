<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Next Level [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.251, "c": "種", "n": "Next Level [A]  n=1622 cos1.00 難-0.25", "s": 0.46, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos1.00 難-0.25", "s": 0.636, "f": 0}, {"x": 0.995, "y": -0.375, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1081 cos1.00 難-0.37", "s": 0.306, "f": 0}, {"x": 0.994, "y": -0.31, "c": "近傍", "n": "電子になりたい [A]  n=1538 cos0.99 難-0.31", "s": 0.436, "f": 0}, {"x": 0.993, "y": -0.224, "c": "近傍", "n": "Infinite cave [A]  n=3075 cos0.99 難-0.22", "s": 0.871, "f": 0}, {"x": 0.993, "y": -0.274, "c": "近傍", "n": "突撃!ガラスのニーソ姫! [A]  n=3529 cos0.99 難-0.27", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.257, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.99 難-0.26", "s": 0.518, "f": 0}, {"x": 0.993, "y": -0.353, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.99 難-0.35", "s": 0.318, "f": 0}, {"x": 0.992, "y": -0.164, "c": "近傍", "n": "Rowdy [A]  n=2462 cos0.99 難-0.16", "s": 0.698, "f": 0}, {"x": 0.993, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.99 難-0.43", "s": 0.851, "f": 0}, {"x": 0.992, "y": -0.165, "c": "近傍", "n": "Odin [A]  n=2946 cos0.99 難-0.17", "s": 0.835, "f": 0}, {"x": 0.992, "y": -0.172, "c": "近傍", "n": "Geirskogul [A]  n=2371 cos0.99 難-0.17", "s": 0.672, "f": 0}, {"x": 0.991, "y": -0.323, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos0.99 難-0.32", "s": 0.817, "f": 0}, {"x": 0.992, "y": -0.449, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2094 cos0.99 難-0.45", "s": 0.593, "f": 0}, {"x": 0.992, "y": -0.088, "c": "近傍", "n": "Do What You Want [A]  n=2649 cos0.99 難-0.09", "s": 0.751, "f": 0}, {"x": 0.991, "y": -0.09, "c": "近傍", "n": "QQQ [A]  n=2895 cos0.99 難-0.09", "s": 0.82, "f": 0}, {"x": 0.991, "y": -0.344, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.34", "s": 0.858, "f": 0}, {"x": 0.991, "y": -0.384, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [H]  n=2719 cos0.99 難-0.38", "s": 0.77, "f": 0}, {"x": 0.991, "y": -0.384, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos0.99 難-0.38", "s": 0.781, "f": 0}, {"x": 0.991, "y": -0.376, "c": "近傍", "n": "Abyss -The Heavens Remix- [H]  n=2834 cos0.99 難-0.38", "s": 0.803, "f": 0}, {"x": 0.99, "y": -0.343, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos0.99 難-0.34", "s": 0.793, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5357813630658548}, {"a": 0, "b": 2, "w": 0.5375928508136462}, {"a": 0, "b": 3, "w": 0.3029727757531103}, {"a": 0, "b": 4, "w": 0.35884177185619837}, {"a": 0, "b": 5, "w": 0.4370712017275019}, {"a": 0, "b": 6, "w": 0.4274802205399012}, {"a": 0, "b": 7, "w": 0.37461153522932}, {"a": 0, "b": 8, "w": 0.28693643000104196}, {"a": 0, "b": 9, "w": 0.3988583198123866}, {"a": 0, "b": 10, "w": 0.2741999787237065}, {"a": 0, "b": 11, "w": 0.3734002622235061}, {"a": 0, "b": 12, "w": 0.23583084978601}, {"a": 0, "b": 13, "w": 0.34193020379998795}, {"a": 0, "b": 14, "w": 0.3825325178342026}, {"a": 0, "b": 15, "w": 0.2985633458958893}, {"a": 0, "b": 16, "w": 0.27593531975017527}, {"a": 0, "b": 17, "w": 0.34825866464134336}, {"a": 0, "b": 18, "w": 4.436118139494738e-11}, {"a": 0, "b": 19, "w": 0.07778032728228457}, {"a": 0, "b": 20, "w": 0.07502646476125263}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.477,hiY=-0.059;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
