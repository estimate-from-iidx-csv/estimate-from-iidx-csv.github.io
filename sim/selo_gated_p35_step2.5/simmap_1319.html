<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DORNWALD ～Junge～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.8, "c": "種", "n": "DORNWALD ～Junge～ [H]  n=2391 cos1.00 難-0.80", "s": 0.744, "f": 0}, {"x": 0.992, "y": -0.788, "c": "近傍", "n": "BROKEN EDEN [H]  n=2059 cos0.99 難-0.79", "s": 0.641, "f": 0}, {"x": 0.991, "y": -0.815, "c": "近傍", "n": "Battle Train -IIDX Edition- [H]  n=2154 cos0.99 難-0.81", "s": 0.671, "f": 0}, {"x": 0.991, "y": -0.8, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos0.99 難-0.80", "s": 0.757, "f": 0}, {"x": 0.992, "y": -0.902, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.99 難-0.90", "s": 0.513, "f": 0}, {"x": 0.99, "y": -0.806, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.99 難-0.81", "s": 0.23, "f": 0}, {"x": 0.991, "y": -0.707, "c": "近傍", "n": "Giudecca [H]  n=1656 cos0.99 難-0.71", "s": 0.516, "f": 0}, {"x": 0.99, "y": -0.893, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [H]  n=2504 cos0.99 難-0.89", "s": 0.78, "f": 0}, {"x": 0.994, "y": -0.611, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.61", "s": 0.74, "f": 0}, {"x": 0.989, "y": -0.821, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.82", "s": 0.24, "f": 0}, {"x": 0.994, "y": -1.013, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos0.99 難-1.01", "s": 0.447, "f": 0}, {"x": 0.989, "y": -0.894, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.89", "s": 0.612, "f": 0}, {"x": 0.988, "y": -0.814, "c": "近傍", "n": "Violet Rose [H]  n=1476 cos0.99 難-0.81", "s": 0.46, "f": 0}, {"x": 0.988, "y": -0.733, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos0.99 難-0.73", "s": 0.576, "f": 0}, {"x": 0.988, "y": -0.759, "c": "近傍", "n": "quasar [H]  n=3212 cos0.99 難-0.76", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.599, "c": "近傍", "n": "シムルグの目醒め [H]  n=2325 cos0.99 難-0.60", "s": 0.724, "f": 0}, {"x": 0.988, "y": -0.78, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos0.99 難-0.78", "s": 0.559, "f": 0}, {"x": 0.989, "y": -0.94, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos0.99 難-0.94", "s": 0.679, "f": 0}, {"x": 0.988, "y": -0.695, "c": "近傍", "n": "snow storm [H]  n=3002 cos0.99 難-0.69", "s": 0.935, "f": 0}, {"x": 0.991, "y": -0.595, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.99 難-0.60", "s": 0.794, "f": 0}, {"x": 0.991, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.564, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2737651866887587}, {"a": 0, "b": 2, "w": 0.3381440059753337}, {"a": 0, "b": 3, "w": 0.3048560807822691}, {"a": 0, "b": 4, "w": 0.3759872893948657}, {"a": 0, "b": 5, "w": 0.17512742686318483}, {"a": 0, "b": 6, "w": 0.22901501284560521}, {"a": 0, "b": 7, "w": 0.03825489735195642}, {"a": 0, "b": 8, "w": 0.30585150297896857}, {"a": 0, "b": 9, "w": 0.14248494544443802}, {"a": 0, "b": 10, "w": 0.41675641236062644}, {"a": 0, "b": 11, "w": 0.14077636693343276}, {"a": 0, "b": 12, "w": 0.23950068939617575}, {"a": 0, "b": 13, "w": 0.18410243356915768}, {"a": 0, "b": 14, "w": 0.10431614125110678}, {"a": 0, "b": 15, "w": 0.3161788541670124}, {"a": 0, "b": 16, "w": 4.89270846060208e-11}, {"a": 0, "b": 17, "w": 0.26599408279038106}, {"a": 0, "b": 18, "w": 0.2378400393900939}, {"a": 0, "b": 19, "w": 0.19541455671541208}, {"a": 0, "b": 20, "w": 0.30774386524112307}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.046,hiY=-0.562;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
