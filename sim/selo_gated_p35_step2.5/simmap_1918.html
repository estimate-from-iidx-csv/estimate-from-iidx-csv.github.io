<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HYPERION [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.22, "c": "種", "n": "HYPERION [A]  n=3347 cos1.00 難0.22", "s": 0.909, "f": 0}, {"x": 0.999, "y": 0.295, "c": "近傍", "n": "《GRANDMASTER》 [A]  n=2189 cos1.00 難0.30", "s": 0.595, "f": 0}, {"x": 0.996, "y": 0.187, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.19", "s": 0.444, "f": 0}, {"x": 0.996, "y": 0.297, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos1.00 難0.30", "s": 0.878, "f": 0}, {"x": 0.995, "y": 0.19, "c": "近傍", "n": "EXTREME MACH COLLIDER [A]  n=3312 cos1.00 難0.19", "s": 0.9, "f": 0}, {"x": 0.995, "y": 0.263, "c": "近傍", "n": "Rosa azuL [A]  n=2237 cos1.00 難0.26", "s": 0.608, "f": 0}, {"x": 0.996, "y": 0.119, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos1.00 難0.12", "s": 0.888, "f": 0}, {"x": 0.995, "y": 0.148, "c": "近傍", "n": "KAMAITACHI [A]  n=3682 cos1.00 難0.15", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.17, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos0.99 難0.17", "s": 0.916, "f": 0}, {"x": 0.995, "y": 0.263, "c": "近傍", "n": "Lighting Shower [A]  n=3194 cos0.99 難0.26", "s": 0.867, "f": 0}, {"x": 0.995, "y": 0.134, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos1.00 難0.13", "s": 0.454, "f": 0}, {"x": 0.995, "y": 0.12, "c": "近傍", "n": "Override [A]  n=3124 cos1.00 難0.12", "s": 0.848, "f": 0}, {"x": 0.995, "y": 0.156, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos0.99 難0.16", "s": 0.935, "f": 0}, {"x": 0.995, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.15", "s": 0.521, "f": 0}, {"x": 0.994, "y": 0.246, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos0.99 難0.25", "s": 0.232, "f": 0}, {"x": 0.994, "y": 0.294, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos0.99 難0.29", "s": 0.887, "f": 0}, {"x": 0.994, "y": 0.147, "c": "近傍", "n": "xenon [A]  n=3549 cos0.99 難0.15", "s": 0.964, "f": 0}, {"x": 0.994, "y": 0.27, "c": "近傍", "n": "Moving on [A]  n=3017 cos0.99 難0.27", "s": 0.819, "f": 0}, {"x": 0.996, "y": 0.039, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2824 cos1.00 難0.04", "s": 0.767, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "the shadow [A]  n=3400 cos0.99 難0.21", "s": 0.923, "f": 0}, {"x": 0.994, "y": 0.298, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.30", "s": 0.743, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.26429857546928737}, {"a": 0, "b": 2, "w": 0.2389459553893738}, {"a": 0, "b": 3, "w": 0.5175491405401225}, {"a": 0, "b": 4, "w": 0.45605962296532976}, {"a": 0, "b": 5, "w": 0.11569514135922487}, {"a": 0, "b": 6, "w": 0.48274298829367224}, {"a": 0, "b": 7, "w": 0.33894044914870813}, {"a": 0, "b": 8, "w": 0.09419083493718972}, {"a": 0, "b": 9, "w": 0.4433668914306922}, {"a": 0, "b": 10, "w": 0.2806490767420208}, {"a": 0, "b": 11, "w": 4.8594239743238177e-11}, {"a": 0, "b": 12, "w": 0.11138618044581217}, {"a": 0, "b": 13, "w": 0.17861353275624514}, {"a": 0, "b": 14, "w": 0.09190894860223653}, {"a": 0, "b": 15, "w": 0.17976759251586527}, {"a": 0, "b": 16, "w": 0.3824337945299774}, {"a": 0, "b": 17, "w": 0.28732035169972825}, {"a": 0, "b": 18, "w": 0.3660211994617075}, {"a": 0, "b": 19, "w": 0.3432331673712822}, {"a": 0, "b": 20, "w": 0.21570126316450422}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.000,loY=0.019,hiY=0.318;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
