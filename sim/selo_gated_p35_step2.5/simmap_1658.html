<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">華麗なる大犬円舞曲 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.8, "c": "種", "n": "華麗なる大犬円舞曲 [H]  n=2030 cos1.00 難-0.80", "s": 0.676, "f": 0}, {"x": 0.993, "y": -0.779, "c": "近傍", "n": "Let The Track Flow [H]  n=1749 cos0.99 難-0.78", "s": 0.583, "f": 0}, {"x": 0.993, "y": -0.886, "c": "近傍", "n": "Grand Chariot [H]  n=2692 cos0.99 難-0.89", "s": 0.897, "f": 0}, {"x": 0.989, "y": -0.759, "c": "近傍", "n": "KAMAITACHI [H]  n=2388 cos0.99 難-0.76", "s": 0.795, "f": 0}, {"x": 0.989, "y": -0.78, "c": "近傍", "n": "dAuntl3ss [H]  n=1995 cos0.99 難-0.78", "s": 0.665, "f": 0}, {"x": 0.988, "y": -0.828, "c": "近傍", "n": "Tiempo Loco [H]  n=1744 cos0.99 難-0.83", "s": 0.581, "f": 0}, {"x": 0.988, "y": -0.772, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2024 cos0.99 難-0.77", "s": 0.674, "f": 0}, {"x": 0.99, "y": -0.903, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1326 cos0.99 難-0.90", "s": 0.442, "f": 0}, {"x": 0.988, "y": -0.827, "c": "近傍", "n": "Catch Our Fire! [H]  n=1841 cos0.99 難-0.83", "s": 0.613, "f": 0}, {"x": 0.988, "y": -0.8, "c": "近傍", "n": "24th Century BOY [H]  n=2432 cos0.99 難-0.80", "s": 0.81, "f": 0}, {"x": 0.991, "y": -0.661, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos0.99 難-0.66", "s": 0.705, "f": 0}, {"x": 0.988, "y": -0.759, "c": "近傍", "n": "Light and Cyber… [H]  n=2224 cos0.99 難-0.76", "s": 0.741, "f": 0}, {"x": 0.987, "y": -0.787, "c": "近傍", "n": "405nm (Ryu☆mix) [H]  n=2975 cos0.99 難-0.79", "s": 0.991, "f": 0}, {"x": 0.99, "y": -0.662, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos0.99 難-0.66", "s": 0.875, "f": 0}, {"x": 0.987, "y": -0.821, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.82", "s": 0.257, "f": 0}, {"x": 0.986, "y": -0.814, "c": "近傍", "n": "∀ [H]  n=2296 cos0.99 難-0.81", "s": 0.765, "f": 0}, {"x": 0.987, "y": -0.921, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2234 cos0.99 難-0.92", "s": 0.744, "f": 0}, {"x": 0.987, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.679, "c": "近傍", "n": "LAB [H]  n=1742 cos0.99 難-0.68", "s": 0.58, "f": 0}, {"x": 0.985, "y": -0.8, "c": "近傍", "n": "DORNWALD ～Junge～ [H]  n=2391 cos0.98 難-0.80", "s": 0.796, "f": 0}, {"x": 0.986, "y": -0.681, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos0.99 難-0.68", "s": 0.619, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24900582035182173}, {"a": 0, "b": 2, "w": 0.4617219863969777}, {"a": 0, "b": 3, "w": 0.194196813532571}, {"a": 0, "b": 4, "w": 0.16300215418425168}, {"a": 0, "b": 5, "w": 0.26600073776945654}, {"a": 0, "b": 6, "w": 0.18589864448958882}, {"a": 0, "b": 7, "w": 0.3616072893718991}, {"a": 0, "b": 8, "w": 0.41724104889967084}, {"a": 0, "b": 9, "w": 0.20230122264596173}, {"a": 0, "b": 10, "w": 0.27351943214811136}, {"a": 0, "b": 11, "w": 0.2967014361331137}, {"a": 0, "b": 12, "w": 0.23029928945470157}, {"a": 0, "b": 13, "w": 0.15524811099287172}, {"a": 0, "b": 14, "w": 0.3852667758839846}, {"a": 0, "b": 15, "w": 0.32767056799583694}, {"a": 0, "b": 16, "w": 3.338795906415726e-11}, {"a": 0, "b": 17, "w": 0.2315975920369151}, {"a": 0, "b": 18, "w": 0.286623669226718}, {"a": 0, "b": 19, "w": 0.2594808254879406}, {"a": 0, "b": 20, "w": 0.3644747809989778}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.941,hiY=-0.641;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
