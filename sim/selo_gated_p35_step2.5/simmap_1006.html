<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Roulette [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.012, "c": "種", "n": "Roulette [A]  n=2595 cos1.00 難0.01", "s": 0.741, "f": 0}, {"x": 0.995, "y": -0.018, "c": "近傍", "n": "GREEN EYES [A]  n=1810 cos0.99 難-0.02", "s": 0.517, "f": 0}, {"x": 0.996, "y": -0.128, "c": "近傍", "n": "POODLE [A]  n=2923 cos1.00 難-0.13", "s": 0.835, "f": 0}, {"x": 0.995, "y": -0.109, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [A]  n=3125 cos1.00 難-0.11", "s": 0.893, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "ラキラキ [A]  n=3102 cos0.99 難-0.08", "s": 0.886, "f": 0}, {"x": 0.995, "y": -0.109, "c": "近傍", "n": "Silly Love [A]  n=2738 cos0.99 難-0.11", "s": 0.782, "f": 0}, {"x": 0.996, "y": -0.164, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos1.00 難-0.16", "s": 0.839, "f": 0}, {"x": 0.995, "y": -0.146, "c": "近傍", "n": "NPC World [A]  n=2851 cos1.00 難-0.15", "s": 0.814, "f": 0}, {"x": 0.997, "y": -0.196, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos1.00 難-0.20", "s": 0.893, "f": 0}, {"x": 0.997, "y": -0.198, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos1.00 難-0.20", "s": 0.87, "f": 0}, {"x": 0.996, "y": -0.164, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2795 cos1.00 難-0.16", "s": 0.798, "f": 0}, {"x": 0.995, "y": -0.146, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3055 cos0.99 難-0.15", "s": 0.873, "f": 0}, {"x": 0.994, "y": 0.132, "c": "近傍", "n": "LAB [A]  n=3095 cos0.99 難0.13", "s": 0.884, "f": 0}, {"x": 0.995, "y": -0.159, "c": "近傍", "n": "REPLAY [A]  n=2245 cos1.00 難-0.16", "s": 0.641, "f": 0}, {"x": 0.996, "y": -0.18, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3181 cos1.00 難-0.18", "s": 0.909, "f": 0}, {"x": 0.996, "y": -0.2, "c": "近傍", "n": "ベィスドロップ・フリークス [A]  n=3501 cos1.00 難-0.20", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.089, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos0.99 難-0.09", "s": 0.791, "f": 0}, {"x": 0.992, "y": -0.028, "c": "近傍", "n": "ZERO-ONE [A]  n=2950 cos0.99 難-0.03", "s": 0.843, "f": 0}, {"x": 0.993, "y": -0.127, "c": "近傍", "n": "First Resolution [A]  n=2082 cos0.99 難-0.13", "s": 0.595, "f": 0}, {"x": 0.993, "y": -0.126, "c": "近傍", "n": "Back Into The Light [A]  n=3045 cos0.99 難-0.13", "s": 0.87, "f": 0}, {"x": 0.992, "y": -0.092, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2697 cos0.99 難-0.09", "s": 0.77, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.12880861038363833}, {"a": 0, "b": 2, "w": 0.23420870228976376}, {"a": 0, "b": 3, "w": 0.301219579698072}, {"a": 0, "b": 4, "w": 0.2222264589439531}, {"a": 0, "b": 5, "w": 0.24303054364950016}, {"a": 0, "b": 6, "w": 0.3277599434256444}, {"a": 0, "b": 7, "w": 0.1833635462515696}, {"a": 0, "b": 8, "w": 0.35598930270058915}, {"a": 0, "b": 9, "w": 0.4909978879444037}, {"a": 0, "b": 10, "w": 0.362935988036135}, {"a": 0, "b": 11, "w": 0.14961819071355587}, {"a": 0, "b": 12, "w": 0.01916499459181986}, {"a": 0, "b": 13, "w": 0.24428314703751008}, {"a": 0, "b": 14, "w": 0.26508795869419366}, {"a": 0, "b": 15, "w": 7.043365890524456e-11}, {"a": 0, "b": 16, "w": 0.11129720314391711}, {"a": 0, "b": 17, "w": 0.07176769502114944}, {"a": 0, "b": 18, "w": 0.14739445532083295}, {"a": 0, "b": 19, "w": 0.14912518775526873}, {"a": 0, "b": 20, "w": 0.13037300829067577}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.226,hiY=0.158;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
