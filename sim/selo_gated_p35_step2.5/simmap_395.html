<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LIGHTNING STRIKES [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.379, "c": "種", "n": "LIGHTNING STRIKES [H]  n=1677 cos1.00 難-1.38", "s": 0.945, "f": 0}, {"x": 0.995, "y": -1.476, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos1.00 難-1.48", "s": 0.384, "f": 0}, {"x": 0.988, "y": -1.353, "c": "近傍", "n": "encounter [H]  n=1624 cos0.99 難-1.35", "s": 0.915, "f": 0}, {"x": 0.99, "y": -1.301, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1721 cos0.99 難-1.30", "s": 0.97, "f": 0}, {"x": 0.987, "y": -1.358, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos0.99 難-1.36", "s": 0.795, "f": 0}, {"x": 0.993, "y": -1.274, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.27", "s": 0.686, "f": 0}, {"x": 0.987, "y": -1.412, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1767 cos0.99 難-1.41", "s": 0.995, "f": 0}, {"x": 0.987, "y": -1.358, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.99 難-1.36", "s": 0.773, "f": 0}, {"x": 0.986, "y": -1.398, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos0.99 難-1.40", "s": 0.767, "f": 0}, {"x": 0.987, "y": -1.419, "c": "近傍", "n": "Cyber True Color [H]  n=899 cos0.99 難-1.42", "s": 0.506, "f": 0}, {"x": 0.991, "y": -1.486, "c": "近傍", "n": "《PL|RAYER》 [H]  n=603 cos0.99 難-1.49", "s": 0.34, "f": 0}, {"x": 0.986, "y": -1.421, "c": "近傍", "n": "Jungle Eater [H]  n=1104 cos0.99 難-1.42", "s": 0.622, "f": 0}, {"x": 0.986, "y": -1.43, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.43", "s": 0.615, "f": 0}, {"x": 0.984, "y": -1.391, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1530 cos0.98 難-1.39", "s": 0.862, "f": 0}, {"x": 0.986, "y": -1.303, "c": "近傍", "n": "Fervidex [H]  n=1551 cos0.99 難-1.30", "s": 0.874, "f": 0}, {"x": 0.986, "y": -1.3, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.99 難-1.30", "s": 0.966, "f": 0}, {"x": 0.996, "y": -1.229, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos1.00 難-1.23", "s": 0.79, "f": 0}, {"x": 0.982, "y": -1.382, "c": "近傍", "n": "最小三倍完全数 [H]  n=1145 cos0.98 難-1.38", "s": 0.645, "f": 0}, {"x": 0.984, "y": -1.299, "c": "近傍", "n": "2 Be Continued [H]  n=568 cos0.98 難-1.30", "s": 0.32, "f": 0}, {"x": 0.983, "y": -1.301, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=537 cos0.98 難-1.30", "s": 0.303, "f": 0}, {"x": 0.994, "y": -1.544, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.99 難-1.54", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.572378534682231}, {"a": 0, "b": 2, "w": 0.277782613422506}, {"a": 0, "b": 3, "w": 0.4082533448683897}, {"a": 0, "b": 4, "w": 0.2636063269924165}, {"a": 0, "b": 5, "w": 0.4384778490771093}, {"a": 0, "b": 6, "w": 0.31445339801973093}, {"a": 0, "b": 7, "w": 0.12116112003954904}, {"a": 0, "b": 8, "w": 0.220753789039693}, {"a": 0, "b": 9, "w": 0.26970115612365586}, {"a": 0, "b": 10, "w": 0.2780908874854696}, {"a": 0, "b": 11, "w": 0.195587561285413}, {"a": 0, "b": 12, "w": 0.2353192768381972}, {"a": 0, "b": 13, "w": 0.16042724205297565}, {"a": 0, "b": 14, "w": 0.2678559874654496}, {"a": 0, "b": 15, "w": 0.0941102175555093}, {"a": 0, "b": 16, "w": 0.5740416125685706}, {"a": 0, "b": 17, "w": 0.06775523343728318}, {"a": 0, "b": 18, "w": 5.068667707774921e-11}, {"a": 0, "b": 19, "w": 0.1854169396748574}, {"a": 0, "b": 20, "w": 0.5390555492428438}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-1.570,hiY=-1.203;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
