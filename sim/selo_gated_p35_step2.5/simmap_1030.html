<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Skywalking [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.532, "c": "種", "n": "Skywalking [A]  n=620 cos1.00 難-0.53", "s": 0.169, "f": 0}, {"x": 0.995, "y": -0.586, "c": "近傍", "n": "Xperanza [H]  n=2619 cos1.00 難-0.59", "s": 0.712, "f": 0}, {"x": 0.996, "y": -0.666, "c": "近傍", "n": "恋愛観測 [A]  n=636 cos1.00 難-0.67", "s": 0.173, "f": 0}, {"x": 0.994, "y": -0.561, "c": "近傍", "n": "金野火織の金色提言 [H]  n=2553 cos0.99 難-0.56", "s": 0.695, "f": 0}, {"x": 0.994, "y": -0.496, "c": "近傍", "n": "in the Sky [H]  n=2364 cos0.99 難-0.50", "s": 0.643, "f": 0}, {"x": 0.996, "y": -0.344, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos1.00 難-0.34", "s": 0.824, "f": 0}, {"x": 0.994, "y": -0.471, "c": "近傍", "n": "Colorful Cookie [H]  n=3676 cos0.99 難-0.47", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.399, "c": "近傍", "n": "THE DETONATOR [H]  n=2220 cos0.99 難-0.40", "s": 0.604, "f": 0}, {"x": 0.994, "y": -0.589, "c": "近傍", "n": "ALTERNATOR [H]  n=1705 cos0.99 難-0.59", "s": 0.464, "f": 0}, {"x": 0.995, "y": -0.375, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1081 cos1.00 難-0.37", "s": 0.294, "f": 0}, {"x": 0.995, "y": -0.382, "c": "近傍", "n": "Drive Me Crazy [A]  n=3472 cos1.00 難-0.38", "s": 0.945, "f": 0}, {"x": 0.995, "y": -0.384, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [H]  n=2719 cos0.99 難-0.38", "s": 0.74, "f": 0}, {"x": 0.993, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.59", "s": 0.705, "f": 0}, {"x": 0.994, "y": -0.704, "c": "近傍", "n": "DARK LEGACY [H]  n=2282 cos0.99 難-0.70", "s": 0.621, "f": 0}, {"x": 0.994, "y": -0.393, "c": "近傍", "n": "AGETEKE ONDO [A]  n=1013 cos0.99 難-0.39", "s": 0.276, "f": 0}, {"x": 0.993, "y": -0.574, "c": "近傍", "n": "かわいいだけじゃだめですか？ [A]  n=1114 cos0.99 難-0.57", "s": 0.303, "f": 0}, {"x": 0.992, "y": -0.449, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2094 cos0.99 難-0.45", "s": 0.57, "f": 0}, {"x": 0.995, "y": -0.299, "c": "近傍", "n": "BLUE DRAGON(雷龍RemixIIDX) [H]  n=2841 cos0.99 難-0.30", "s": 0.773, "f": 0}, {"x": 0.995, "y": -0.275, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos1.00 難-0.27", "s": 0.937, "f": 0}, {"x": 0.992, "y": -0.429, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2661 cos0.99 難-0.43", "s": 0.724, "f": 0}, {"x": 0.995, "y": -0.274, "c": "近傍", "n": "突撃!ガラスのニーソ姫! [A]  n=3529 cos0.99 難-0.27", "s": 0.96, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.316205208990628}, {"a": 0, "b": 2, "w": 0.29387379926419765}, {"a": 0, "b": 3, "w": 0.26471685836832703}, {"a": 0, "b": 4, "w": 0.2688452998425761}, {"a": 0, "b": 5, "w": 0.33704072123478956}, {"a": 0, "b": 6, "w": 0.20772870869264448}, {"a": 0, "b": 7, "w": 0.2940280576781431}, {"a": 0, "b": 8, "w": 0.21828468197269735}, {"a": 0, "b": 9, "w": 0.2849458466648389}, {"a": 0, "b": 10, "w": 0.25900098282953987}, {"a": 0, "b": 11, "w": 0.25508061699852824}, {"a": 0, "b": 12, "w": 6.415612485710653e-11}, {"a": 0, "b": 13, "w": 0.2901706011246846}, {"a": 0, "b": 14, "w": 0.16482427166966906}, {"a": 0, "b": 15, "w": 0.1485231547283159}, {"a": 0, "b": 16, "w": 0.12009347733618525}, {"a": 0, "b": 17, "w": 0.11005233500792266}, {"a": 0, "b": 18, "w": 0.2694600156308429}, {"a": 0, "b": 19, "w": 0.13494149406500267}, {"a": 0, "b": 20, "w": 0.2911029222930356}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.738,hiY=-0.239;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
