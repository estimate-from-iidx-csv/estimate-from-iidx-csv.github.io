<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Antigravity [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.771, "c": "種", "n": "Antigravity [A]  n=2890 cos1.00 難1.77", "s": 0.893, "f": 0}, {"x": 0.992, "y": 1.812, "c": "近傍", "n": "金野火織の金色提言 [A]  n=2862 cos0.99 難1.81", "s": 0.884, "f": 0}, {"x": 0.992, "y": 1.727, "c": "近傍", "n": "Marie Antoinette [L]  n=1729 cos0.99 難1.73", "s": 0.534, "f": 0}, {"x": 0.987, "y": 1.806, "c": "近傍", "n": "255 [A]  n=3009 cos0.99 難1.81", "s": 0.929, "f": 0}, {"x": 0.987, "y": 1.857, "c": "近傍", "n": "POLKAMANIA [L]  n=817 cos0.99 難1.86", "s": 0.252, "f": 0}, {"x": 0.985, "y": 1.705, "c": "近傍", "n": "東京神話 [A]  n=3131 cos0.99 難1.70", "s": 0.967, "f": 0}, {"x": 0.991, "y": 1.657, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.99 難1.66", "s": 0.84, "f": 0}, {"x": 0.987, "y": 1.674, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.99 難1.67", "s": 0.69, "f": 0}, {"x": 0.986, "y": 1.858, "c": "近傍", "n": "Blue Spring Express [A]  n=2855 cos0.99 難1.86", "s": 0.882, "f": 0}, {"x": 0.987, "y": 1.669, "c": "近傍", "n": "Artist [A]  n=2459 cos0.99 難1.67", "s": 0.759, "f": 0}, {"x": 0.993, "y": 1.632, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.99 難1.63", "s": 0.752, "f": 0}, {"x": 0.981, "y": 1.788, "c": "近傍", "n": "Cross Fire [A]  n=948 cos0.98 難1.79", "s": 0.293, "f": 0}, {"x": 0.983, "y": 1.691, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2472 cos0.98 難1.69", "s": 0.763, "f": 0}, {"x": 0.981, "y": 1.84, "c": "近傍", "n": "SOLID WYVERN [L]  n=1045 cos0.98 難1.84", "s": 0.323, "f": 0}, {"x": 0.979, "y": 1.738, "c": "近傍", "n": "ALBA -黎明- [L]  n=1258 cos0.98 難1.74", "s": 0.389, "f": 0}, {"x": 0.984, "y": 1.651, "c": "近傍", "n": "Macho Monky [A]  n=2727 cos0.98 難1.65", "s": 0.842, "f": 0}, {"x": 0.983, "y": 1.662, "c": "近傍", "n": "MENDES [A]  n=3238 cos0.98 難1.66", "s": 1.0, "f": 0}, {"x": 0.979, "y": 1.712, "c": "近傍", "n": "Satellite Burst [A]  n=1278 cos0.98 難1.71", "s": 0.395, "f": 0}, {"x": 0.978, "y": 1.742, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2854 cos0.98 難1.74", "s": 0.881, "f": 0}, {"x": 0.98, "y": 1.858, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [L]  n=1649 cos0.98 難1.86", "s": 0.509, "f": 0}, {"x": 0.978, "y": 1.815, "c": "近傍", "n": "[ ]DENTITY [A]  n=1831 cos0.98 難1.81", "s": 0.565, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6036896895020583}, {"a": 0, "b": 2, "w": 0.6336623561852375}, {"a": 0, "b": 3, "w": 0.3271949884152723}, {"a": 0, "b": 4, "w": 0.2824803287739466}, {"a": 0, "b": 5, "w": 0.48488054197045904}, {"a": 0, "b": 6, "w": 0.48496380931451877}, {"a": 0, "b": 7, "w": 0.4495763459169011}, {"a": 0, "b": 8, "w": 0.3545784364805855}, {"a": 0, "b": 9, "w": 0.35828258850110306}, {"a": 0, "b": 10, "w": 0.5868619670454613}, {"a": 0, "b": 11, "w": 0.3088601635721707}, {"a": 0, "b": 12, "w": 0.26139653856205836}, {"a": 0, "b": 13, "w": 0.06833185498887162}, {"a": 0, "b": 14, "w": 0.06496309608606277}, {"a": 0, "b": 15, "w": 0.3836687711362502}, {"a": 0, "b": 16, "w": 0.18443143895344138}, {"a": 0, "b": 17, "w": 0.15795607993251104}, {"a": 0, "b": 18, "w": 2.1454504839368838e-11}, {"a": 0, "b": 19, "w": 0.12850577137639552}, {"a": 0, "b": 20, "w": 0.15687801564663173}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=1.614,hiY=1.876;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
