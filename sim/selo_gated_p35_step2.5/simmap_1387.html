<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ICARUS [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.076, "c": "種", "n": "ICARUS [H]  n=3028 cos1.00 難-0.08", "s": 0.88, "f": 0}, {"x": 0.995, "y": -0.031, "c": "近傍", "n": "She is my wife [A]  n=3098 cos1.00 難-0.03", "s": 0.901, "f": 0}, {"x": 0.994, "y": -0.146, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.15", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.146, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3055 cos0.99 難-0.15", "s": 0.888, "f": 0}, {"x": 0.994, "y": -0.171, "c": "近傍", "n": "Super Duper Racers [A]  n=2874 cos0.99 難-0.17", "s": 0.836, "f": 0}, {"x": 0.993, "y": -0.128, "c": "近傍", "n": "POODLE [A]  n=2923 cos0.99 難-0.13", "s": 0.85, "f": 0}, {"x": 0.993, "y": -0.164, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.99 難-0.16", "s": 0.854, "f": 0}, {"x": 0.992, "y": -0.093, "c": "近傍", "n": "VOID [H]  n=878 cos0.99 難-0.09", "s": 0.255, "f": 0}, {"x": 0.992, "y": -0.105, "c": "近傍", "n": "Space Time [A]  n=2797 cos0.99 難-0.11", "s": 0.813, "f": 0}, {"x": 0.992, "y": -0.2, "c": "近傍", "n": "In The Breeze [A]  n=2527 cos0.99 難-0.20", "s": 0.735, "f": 0}, {"x": 0.992, "y": -0.198, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos0.99 難-0.20", "s": 0.886, "f": 0}, {"x": 0.991, "y": -0.142, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1359 cos0.99 難-0.14", "s": 0.395, "f": 0}, {"x": 0.993, "y": -0.263, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.26", "s": 0.893, "f": 0}, {"x": 0.991, "y": -0.143, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2848 cos0.99 難-0.14", "s": 0.828, "f": 0}, {"x": 0.991, "y": -0.156, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.16", "s": 0.617, "f": 0}, {"x": 0.991, "y": -0.106, "c": "近傍", "n": "Good Looking [A]  n=761 cos0.99 難-0.11", "s": 0.221, "f": 0}, {"x": 0.993, "y": -0.25, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos0.99 難-0.25", "s": 0.687, "f": 0}, {"x": 0.992, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.694, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "Flash Back 90's [A]  n=3439 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.018, "c": "近傍", "n": "GREEN EYES [A]  n=1810 cos0.99 難-0.02", "s": 0.526, "f": 0}, {"x": 0.993, "y": -0.302, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos0.99 難-0.30", "s": 0.722, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5420587467758515}, {"a": 0, "b": 2, "w": 0.39202475334437403}, {"a": 0, "b": 3, "w": 0.3814544079081751}, {"a": 0, "b": 4, "w": 0.47574835284408923}, {"a": 0, "b": 5, "w": 0.36422925665332273}, {"a": 0, "b": 6, "w": 0.2871789512145786}, {"a": 0, "b": 7, "w": 0.4091441845113526}, {"a": 0, "b": 8, "w": 0.19849922460490876}, {"a": 0, "b": 9, "w": 0.1166481011629078}, {"a": 0, "b": 10, "w": 0.2007453420109071}, {"a": 0, "b": 11, "w": 0.3564157882939406}, {"a": 0, "b": 12, "w": 0.21019206006941704}, {"a": 0, "b": 13, "w": 0.09918132173642091}, {"a": 0, "b": 14, "w": 0.25784191549153324}, {"a": 0, "b": 15, "w": 0.3696747485709637}, {"a": 0, "b": 16, "w": 0.3715189708618627}, {"a": 0, "b": 17, "w": 4.043376744533589e-11}, {"a": 0, "b": 18, "w": 0.32324088633368675}, {"a": 0, "b": 19, "w": 0.28317786232558606}, {"a": 0, "b": 20, "w": 0.2092953371168026}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.325,hiY=0.005;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
