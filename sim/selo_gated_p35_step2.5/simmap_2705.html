<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LIGHTNING STRIKES [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.557, "c": "種", "n": "LIGHTNING STRIKES [A]  n=3324 cos1.00 難0.56", "s": 0.88, "f": 0}, {"x": 0.996, "y": 0.535, "c": "近傍", "n": "Speculation [A]  n=1818 cos1.00 難0.53", "s": 0.481, "f": 0}, {"x": 0.996, "y": 0.501, "c": "近傍", "n": "CUE CUE RESCUE [L]  n=1252 cos1.00 難0.50", "s": 0.332, "f": 0}, {"x": 0.997, "y": 0.475, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3237 cos1.00 難0.47", "s": 0.857, "f": 0}, {"x": 0.995, "y": 0.499, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2944 cos1.00 難0.50", "s": 0.78, "f": 0}, {"x": 0.996, "y": 0.637, "c": "近傍", "n": "刃図羅 [A]  n=3589 cos1.00 難0.64", "s": 0.95, "f": 0}, {"x": 0.993, "y": 0.589, "c": "近傍", "n": "Todestrieb [A]  n=3776 cos0.99 難0.59", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.496, "c": "近傍", "n": "Tail Lights [A]  n=2429 cos0.99 難0.50", "s": 0.643, "f": 0}, {"x": 0.993, "y": 0.574, "c": "近傍", "n": "COSMIC CYBER [A]  n=2567 cos0.99 難0.57", "s": 0.68, "f": 0}, {"x": 0.993, "y": 0.535, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1840 cos0.99 難0.54", "s": 0.487, "f": 0}, {"x": 0.993, "y": 0.528, "c": "近傍", "n": "Symmetry [A]  n=3716 cos0.99 難0.53", "s": 0.984, "f": 0}, {"x": 0.993, "y": 0.608, "c": "近傍", "n": "RED ZONE [L]  n=3559 cos0.99 難0.61", "s": 0.943, "f": 0}, {"x": 0.992, "y": 0.592, "c": "近傍", "n": "POODLE [L]  n=2557 cos0.99 難0.59", "s": 0.677, "f": 0}, {"x": 0.992, "y": 0.513, "c": "近傍", "n": "Apocalypse [A]  n=3646 cos0.99 難0.51", "s": 0.966, "f": 0}, {"x": 0.991, "y": 0.538, "c": "近傍", "n": "Macuilxochitl [A]  n=3477 cos0.99 難0.54", "s": 0.921, "f": 0}, {"x": 0.993, "y": 0.464, "c": "近傍", "n": "Mukade [A]  n=1863 cos0.99 難0.46", "s": 0.493, "f": 0}, {"x": 0.995, "y": 0.67, "c": "近傍", "n": "LASER CRUSTER [A]  n=3656 cos1.00 難0.67", "s": 0.968, "f": 0}, {"x": 0.991, "y": 0.556, "c": "近傍", "n": "F [A]  n=3726 cos0.99 難0.56", "s": 0.987, "f": 0}, {"x": 0.991, "y": 0.551, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3105 cos0.99 難0.55", "s": 0.822, "f": 0}, {"x": 0.991, "y": 0.58, "c": "近傍", "n": "Last Card [A]  n=828 cos0.99 難0.58", "s": 0.219, "f": 0}, {"x": 0.994, "y": 0.442, "c": "近傍", "n": "Raspberry Railgun [A]  n=3614 cos0.99 難0.44", "s": 0.957, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47137600539998004}, {"a": 0, "b": 2, "w": 0.39454091539780667}, {"a": 0, "b": 3, "w": 0.5179409552960268}, {"a": 0, "b": 4, "w": 0.3563502510566843}, {"a": 0, "b": 5, "w": 0.4603079059125149}, {"a": 0, "b": 6, "w": 0.22980095299865044}, {"a": 0, "b": 7, "w": 0.09439155069614402}, {"a": 0, "b": 8, "w": 0.23736310883901235}, {"a": 0, "b": 9, "w": 0.22667553180378452}, {"a": 0, "b": 10, "w": 0.2571568200249831}, {"a": 0, "b": 11, "w": 0.2566431859354531}, {"a": 0, "b": 12, "w": 0.2324315117147846}, {"a": 0, "b": 13, "w": 0.22071569133967517}, {"a": 0, "b": 14, "w": 0.18289513444288463}, {"a": 0, "b": 15, "w": 0.23487716004615544}, {"a": 0, "b": 16, "w": 0.34625087408693134}, {"a": 0, "b": 17, "w": 0.16093369119699485}, {"a": 0, "b": 18, "w": 4.459732583228515e-11}, {"a": 0, "b": 19, "w": 0.1533129585574785}, {"a": 0, "b": 20, "w": 0.26591087330141616}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.424,hiY=0.688;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
