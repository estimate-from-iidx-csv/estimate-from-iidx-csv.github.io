<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Deep Sea Mystery [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.013, "c": "種", "n": "Deep Sea Mystery [A]  n=1856 cos1.00 難-0.01", "s": 0.52, "f": 0}, {"x": 0.99, "y": -0.102, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2857 cos0.99 難-0.10", "s": 0.801, "f": 0}, {"x": 0.989, "y": -0.114, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.99 難-0.11", "s": 0.944, "f": 0}, {"x": 0.985, "y": -0.239, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.99 難-0.24", "s": 0.348, "f": 0}, {"x": 0.984, "y": -0.215, "c": "近傍", "n": "Infinity Mirror [A]  n=3000 cos0.98 難-0.22", "s": 0.841, "f": 0}, {"x": 0.983, "y": 0.132, "c": "近傍", "n": "Clione [L]  n=3199 cos0.98 難0.13", "s": 0.897, "f": 0}, {"x": 0.982, "y": 0.08, "c": "近傍", "n": "Energy Drive [A]  n=3461 cos0.98 難0.08", "s": 0.97, "f": 0}, {"x": 0.98, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.98 難-0.15", "s": 0.8, "f": 0}, {"x": 0.978, "y": 0.161, "c": "近傍", "n": "Urban Constellations [A]  n=3173 cos0.98 難0.16", "s": 0.889, "f": 0}, {"x": 0.977, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.98 難-0.24", "s": 0.704, "f": 0}, {"x": 0.979, "y": -0.379, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.98 難-0.38", "s": 0.695, "f": 0}, {"x": 0.976, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.98 難-0.26", "s": 0.494, "f": 0}, {"x": 0.975, "y": 0.194, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.97 難0.19", "s": 0.709, "f": 0}, {"x": 0.975, "y": 0.297, "c": "近傍", "n": "Zenith [A]  n=2366 cos0.97 難0.30", "s": 0.663, "f": 0}, {"x": 0.973, "y": -0.202, "c": "近傍", "n": "Almace [A]  n=3119 cos0.97 難-0.20", "s": 0.874, "f": 0}, {"x": 0.981, "y": 0.554, "c": "近傍", "n": "Kailua [A]  n=3546 cos0.98 難0.55", "s": 0.994, "f": 0}, {"x": 0.97, "y": -0.122, "c": "近傍", "n": "If [A]  n=2170 cos0.97 難-0.12", "s": 0.608, "f": 0}, {"x": 0.974, "y": 0.382, "c": "近傍", "n": "Acid Pumper [A]  n=3568 cos0.97 難0.38", "s": 1.0, "f": 0}, {"x": 0.975, "y": -0.498, "c": "近傍", "n": "TOGAKUSHI [H]  n=2630 cos0.98 難-0.50", "s": 0.737, "f": 0}, {"x": 0.97, "y": -0.249, "c": "近傍", "n": "Arcana [A]  n=3097 cos0.97 難-0.25", "s": 0.868, "f": 0}, {"x": 0.972, "y": 0.347, "c": "近傍", "n": "鬼天 [A]  n=3356 cos0.97 難0.35", "s": 0.941, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48937519538986485}, {"a": 0, "b": 2, "w": 0.321888382708738}, {"a": 0, "b": 3, "w": 0.31159861078905227}, {"a": 0, "b": 4, "w": 0.23607913149659732}, {"a": 0, "b": 5, "w": 0.3467985881660005}, {"a": 0, "b": 6, "w": 0.3184146158357015}, {"a": 0, "b": 7, "w": 0.1611756677141063}, {"a": 0, "b": 8, "w": 0.25742819773666625}, {"a": 0, "b": 9, "w": 0.2122565223314543}, {"a": 0, "b": 10, "w": 0.21118265352013688}, {"a": 0, "b": 11, "w": 0.22118256771613276}, {"a": 0, "b": 12, "w": 0.19030686614820347}, {"a": 0, "b": 13, "w": 0.20645414104245785}, {"a": 0, "b": 14, "w": 0.16696581959408852}, {"a": 0, "b": 15, "w": 2.9767632803157085e-11}, {"a": 0, "b": 16, "w": 0.07820203351687893}, {"a": 0, "b": 17, "w": 0.12087907682816423}, {"a": 0, "b": 18, "w": 0.17951294228552417}, {"a": 0, "b": 19, "w": 0.04183272575211461}, {"a": 0, "b": 20, "w": 0.15937588402061031}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-0.582,hiY=0.639;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
