<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Close my Eyes for Me [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.006, "c": "種", "n": "Close my Eyes for Me [A]  n=2166 cos1.00 難0.01", "s": 0.598, "f": 0}, {"x": 0.995, "y": -0.116, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2867 cos0.99 難-0.12", "s": 0.792, "f": 0}, {"x": 0.991, "y": -0.163, "c": "近傍", "n": "Somebody Like You [A]  n=1180 cos0.99 難-0.16", "s": 0.326, "f": 0}, {"x": 0.984, "y": 0.081, "c": "近傍", "n": "Shamshir [A]  n=1509 cos0.98 難0.08", "s": 0.417, "f": 0}, {"x": 0.983, "y": -0.035, "c": "近傍", "n": "Central Station [A]  n=2874 cos0.98 難-0.04", "s": 0.793, "f": 0}, {"x": 0.983, "y": -0.025, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.98 難-0.03", "s": 0.642, "f": 0}, {"x": 0.984, "y": 0.234, "c": "近傍", "n": "Watch out!! [A]  n=3272 cos0.98 難0.23", "s": 0.903, "f": 0}, {"x": 0.981, "y": -0.107, "c": "近傍", "n": "Tripping Jumping [A]  n=1970 cos0.98 難-0.11", "s": 0.544, "f": 0}, {"x": 0.983, "y": -0.302, "c": "近傍", "n": "Round and Round [A]  n=2986 cos0.98 難-0.30", "s": 0.824, "f": 0}, {"x": 0.985, "y": 0.384, "c": "近傍", "n": "Digitank System [A]  n=3622 cos0.99 難0.38", "s": 1.0, "f": 0}, {"x": 0.984, "y": 0.402, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3347 cos0.98 難0.40", "s": 0.924, "f": 0}, {"x": 0.976, "y": 0.015, "c": "近傍", "n": "Honey Trap [A]  n=3499 cos0.98 難0.02", "s": 0.966, "f": 0}, {"x": 0.979, "y": -0.263, "c": "近傍", "n": "MOVE! (We Keep It Movin') [A]  n=1629 cos0.98 難-0.26", "s": 0.45, "f": 0}, {"x": 0.979, "y": -0.272, "c": "近傍", "n": "Lift Us High [A]  n=2439 cos0.98 難-0.27", "s": 0.673, "f": 0}, {"x": 0.974, "y": -0.065, "c": "近傍", "n": "Non Stop Rock [A]  n=2198 cos0.97 難-0.06", "s": 0.607, "f": 0}, {"x": 0.975, "y": -0.188, "c": "近傍", "n": "Buffalo [A]  n=2619 cos0.98 難-0.19", "s": 0.723, "f": 0}, {"x": 0.99, "y": -0.555, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2310 cos0.99 難-0.55", "s": 0.638, "f": 0}, {"x": 0.979, "y": -0.348, "c": "近傍", "n": "HEARTACHE [A]  n=2644 cos0.98 難-0.35", "s": 0.73, "f": 0}, {"x": 0.974, "y": -0.024, "c": "近傍", "n": "illuminate [A]  n=2898 cos0.97 難-0.02", "s": 0.8, "f": 0}, {"x": 0.974, "y": -0.093, "c": "近傍", "n": "VOID [H]  n=878 cos0.97 難-0.09", "s": 0.242, "f": 0}, {"x": 0.973, "y": -0.028, "c": "近傍", "n": "Feedback [A]  n=2745 cos0.97 難-0.03", "s": 0.758, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42123678243082685}, {"a": 0, "b": 2, "w": 0.4836353210277061}, {"a": 0, "b": 3, "w": 0.3024761447773031}, {"a": 0, "b": 4, "w": 0.23437418784772113}, {"a": 0, "b": 5, "w": 0.2890413447721082}, {"a": 0, "b": 6, "w": 0.3247376410538886}, {"a": 0, "b": 7, "w": 0.1996196399429606}, {"a": 0, "b": 8, "w": 0.3103513492125224}, {"a": 0, "b": 9, "w": 0.2824071283003269}, {"a": 0, "b": 10, "w": 0.31571374718366085}, {"a": 0, "b": 11, "w": 0.013553977087369051}, {"a": 0, "b": 12, "w": 0.22443066406282675}, {"a": 0, "b": 13, "w": 0.22761292836795133}, {"a": 0, "b": 14, "w": 3.4545477589631446e-11}, {"a": 0, "b": 15, "w": 0.12719047346391354}, {"a": 0, "b": 16, "w": 0.35884484861921073}, {"a": 0, "b": 17, "w": 0.21333390962356358}, {"a": 0, "b": 18, "w": 0.11605717774764823}, {"a": 0, "b": 19, "w": 0.1078909395765808}, {"a": 0, "b": 20, "w": 0.11528830532154011}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=-0.631,hiY=0.479;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
