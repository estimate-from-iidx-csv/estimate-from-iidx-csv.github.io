<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">1st Samurai [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.209, "c": "種", "n": "1st Samurai [H]  n=2308 cos1.00 難-0.21", "s": 0.698, "f": 0}, {"x": 0.998, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos1.00 難-0.26", "s": 0.94, "f": 0}, {"x": 0.996, "y": -0.195, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos1.00 難-0.20", "s": 0.792, "f": 0}, {"x": 0.996, "y": -0.102, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos1.00 難-0.10", "s": 0.931, "f": 0}, {"x": 0.993, "y": -0.198, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos0.99 難-0.20", "s": 0.922, "f": 0}, {"x": 0.993, "y": -0.304, "c": "近傍", "n": "oratio [H]  n=2403 cos0.99 難-0.30", "s": 0.727, "f": 0}, {"x": 0.994, "y": -0.329, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.33", "s": 0.985, "f": 0}, {"x": 0.992, "y": -0.146, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.15", "s": 0.862, "f": 0}, {"x": 0.991, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.722, "f": 0}, {"x": 0.992, "y": -0.295, "c": "近傍", "n": "Star Trail [A]  n=3283 cos0.99 難-0.29", "s": 0.993, "f": 0}, {"x": 0.991, "y": -0.164, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.99 難-0.16", "s": 0.888, "f": 0}, {"x": 0.991, "y": -0.238, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.254, "c": "近傍", "n": "SPEEDY CAT [A]  n=2412 cos0.99 難-0.25", "s": 0.73, "f": 0}, {"x": 0.991, "y": -0.302, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.99 難-0.30", "s": 0.877, "f": 0}, {"x": 0.99, "y": -0.237, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos0.99 難-0.24", "s": 0.389, "f": 0}, {"x": 0.994, "y": -0.402, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.40", "s": 0.753, "f": 0}, {"x": 0.99, "y": -0.232, "c": "近傍", "n": "共鳴遊戯の華 [H]  n=2742 cos0.99 難-0.23", "s": 0.829, "f": 0}, {"x": 0.992, "y": -0.367, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos0.99 難-0.37", "s": 0.871, "f": 0}, {"x": 0.99, "y": -0.175, "c": "近傍", "n": "電人、暁に斃れる。 [H]  n=2681 cos0.99 難-0.18", "s": 0.811, "f": 0}, {"x": 0.992, "y": -0.365, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.36", "s": 0.838, "f": 0}, {"x": 0.991, "y": -0.325, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.32", "s": 0.745, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4388067891238804}, {"a": 0, "b": 2, "w": 0.3775106371969499}, {"a": 0, "b": 3, "w": 0.3609537934505386}, {"a": 0, "b": 4, "w": 0.2538633502117751}, {"a": 0, "b": 5, "w": 0.2536999408760998}, {"a": 0, "b": 6, "w": 0.3270519612550248}, {"a": 0, "b": 7, "w": 0.24115319872501595}, {"a": 0, "b": 8, "w": 5.672184943961156e-11}, {"a": 0, "b": 9, "w": 0.13623434843293936}, {"a": 0, "b": 10, "w": 0.20189684479607384}, {"a": 0, "b": 11, "w": 0.19471246521602614}, {"a": 0, "b": 12, "w": 0.15854020757944765}, {"a": 0, "b": 13, "w": 0.14720030291636632}, {"a": 0, "b": 14, "w": 0.029979539332155247}, {"a": 0, "b": 15, "w": 0.3438245331166686}, {"a": 0, "b": 16, "w": 0.11794309291824134}, {"a": 0, "b": 17, "w": 0.2512823633132134}, {"a": 0, "b": 18, "w": 0.15214666740518668}, {"a": 0, "b": 19, "w": 0.15202943724759888}, {"a": 0, "b": 20, "w": 0.1887483502473889}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.426,hiY=-0.078;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
