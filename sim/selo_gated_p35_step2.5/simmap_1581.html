<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">WHA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.566, "c": "種", "n": "WHA [H]  n=1441 cos1.00 難-0.57", "s": 0.46, "f": 0}, {"x": 0.992, "y": -0.729, "c": "近傍", "n": "TOMAHAWK [H]  n=1306 cos0.99 難-0.73", "s": 0.417, "f": 0}, {"x": 0.992, "y": -0.377, "c": "近傍", "n": "BRAINSTORM [H]  n=2556 cos0.99 難-0.38", "s": 0.816, "f": 0}, {"x": 0.989, "y": -0.702, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.70", "s": 0.725, "f": 0}, {"x": 0.989, "y": -0.765, "c": "近傍", "n": "hard-wired [H]  n=1151 cos0.99 難-0.76", "s": 0.367, "f": 0}, {"x": 0.986, "y": -0.386, "c": "近傍", "n": "Time to Air [H]  n=3133 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.526, "c": "近傍", "n": "焔極OVERKILL [H]  n=2631 cos0.98 難-0.53", "s": 0.84, "f": 0}, {"x": 0.993, "y": -0.987, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2186 cos0.99 難-0.99", "s": 0.698, "f": 0}, {"x": 0.985, "y": -0.403, "c": "近傍", "n": "Level One [H]  n=2810 cos0.99 難-0.40", "s": 0.897, "f": 0}, {"x": 0.985, "y": -0.417, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.98 難-0.42", "s": 0.731, "f": 0}, {"x": 0.985, "y": -0.713, "c": "近傍", "n": "お菓子の王国 [H]  n=1895 cos0.98 難-0.71", "s": 0.605, "f": 0}, {"x": 0.985, "y": -0.797, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.99 難-0.80", "s": 0.528, "f": 0}, {"x": 0.987, "y": -0.884, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.99 難-0.88", "s": 0.516, "f": 0}, {"x": 0.983, "y": -0.528, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.98 難-0.53", "s": 0.914, "f": 0}, {"x": 0.985, "y": -0.301, "c": "近傍", "n": "SCREAM SQUAD [H]  n=2627 cos0.99 難-0.30", "s": 0.838, "f": 0}, {"x": 0.983, "y": -0.662, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.98 難-0.66", "s": 0.934, "f": 0}, {"x": 0.983, "y": -0.678, "c": "近傍", "n": "ONIGOROSHI [H]  n=1805 cos0.98 難-0.68", "s": 0.576, "f": 0}, {"x": 0.982, "y": -0.664, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.98 難-0.66", "s": 0.531, "f": 0}, {"x": 0.982, "y": -0.552, "c": "近傍", "n": "rumrum triplets [H]  n=2692 cos0.98 難-0.55", "s": 0.859, "f": 0}, {"x": 0.985, "y": -0.878, "c": "近傍", "n": "Venom [H]  n=1708 cos0.99 難-0.88", "s": 0.545, "f": 0}, {"x": 0.985, "y": -0.875, "c": "近傍", "n": "Antigravity [H]  n=2035 cos0.98 難-0.87", "s": 0.65, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42036322670454707}, {"a": 0, "b": 2, "w": 0.3340853959989305}, {"a": 0, "b": 3, "w": 0.16129544596996492}, {"a": 0, "b": 4, "w": 0.400474137330992}, {"a": 0, "b": 5, "w": 0.3023324957604264}, {"a": 0, "b": 6, "w": 0.33008773866089014}, {"a": 0, "b": 7, "w": 0.32400671474296106}, {"a": 0, "b": 8, "w": 0.3410280323530708}, {"a": 0, "b": 9, "w": 0.27650096402254987}, {"a": 0, "b": 10, "w": 0.24246659487599598}, {"a": 0, "b": 11, "w": 0.2552649964828949}, {"a": 0, "b": 12, "w": 0.3438412198475844}, {"a": 0, "b": 13, "w": 0.1570029776196924}, {"a": 0, "b": 14, "w": 0.1522970618923296}, {"a": 0, "b": 15, "w": 0.10277044182171269}, {"a": 0, "b": 16, "w": 0.2870547620420808}, {"a": 0, "b": 17, "w": 0.22448557995114238}, {"a": 0, "b": 18, "w": 3.48568951480388e-11}, {"a": 0, "b": 19, "w": 0.22575645540903744}, {"a": 0, "b": 20, "w": 0.20389054330121692}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-1.042,hiY=-0.247;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
