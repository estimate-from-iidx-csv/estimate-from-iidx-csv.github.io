<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ANAGRAMS I to Y [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.377, "c": "種", "n": "ANAGRAMS I to Y [A]  n=2713 cos1.00 難-0.38", "s": 0.754, "f": 0}, {"x": 0.998, "y": -0.329, "c": "近傍", "n": "MOON [A]  n=3205 cos1.00 難-0.33", "s": 0.891, "f": 0}, {"x": 0.998, "y": -0.429, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2661 cos1.00 難-0.43", "s": 0.739, "f": 0}, {"x": 0.997, "y": -0.416, "c": "近傍", "n": "Kung-fu Empire [H]  n=3013 cos1.00 難-0.42", "s": 0.837, "f": 0}, {"x": 0.998, "y": -0.242, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos1.00 難-0.24", "s": 0.818, "f": 0}, {"x": 0.997, "y": -0.275, "c": "近傍", "n": "■□模様 [A]  n=1388 cos1.00 難-0.27", "s": 0.386, "f": 0}, {"x": 0.997, "y": -0.228, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos1.00 難-0.23", "s": 0.876, "f": 0}, {"x": 0.995, "y": -0.399, "c": "近傍", "n": "THE DETONATOR [H]  n=2220 cos0.99 難-0.40", "s": 0.617, "f": 0}, {"x": 0.995, "y": -0.37, "c": "近傍", "n": "Sugar Drippin' [A]  n=2161 cos0.99 難-0.37", "s": 0.6, "f": 0}, {"x": 0.995, "y": -0.377, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos0.99 難-0.38", "s": 0.922, "f": 0}, {"x": 0.996, "y": -0.252, "c": "近傍", "n": "beatonic nation [A]  n=2335 cos1.00 難-0.25", "s": 0.649, "f": 0}, {"x": 0.994, "y": -0.457, "c": "近傍", "n": "ゲシュタルト [A]  n=1500 cos0.99 難-0.46", "s": 0.417, "f": 0}, {"x": 0.994, "y": -0.343, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2800 cos0.99 難-0.34", "s": 0.778, "f": 0}, {"x": 0.994, "y": -0.386, "c": "近傍", "n": "純真可憐デザイア [A]  n=3599 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.282, "c": "近傍", "n": "STARLIGHT JUNCTION [A]  n=2984 cos0.99 難-0.28", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.382, "c": "近傍", "n": "Drive Me Crazy [A]  n=3472 cos0.99 難-0.38", "s": 0.965, "f": 0}, {"x": 0.994, "y": -0.277, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos0.99 難-0.28", "s": 0.669, "f": 0}, {"x": 0.994, "y": -0.437, "c": "近傍", "n": "アイドル [A]  n=2110 cos0.99 難-0.44", "s": 0.586, "f": 0}, {"x": 0.995, "y": -0.188, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.19", "s": 0.774, "f": 0}, {"x": 0.993, "y": -0.356, "c": "近傍", "n": "タシカナモノ [A]  n=2492 cos0.99 難-0.36", "s": 0.692, "f": 0}, {"x": 0.993, "y": -0.297, "c": "近傍", "n": "夏の匂い。キミの残像。 ft. Kanae Asaba [A]  n=3233 cos0.99 難-0.30", "s": 0.898, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6226292507632438}, {"a": 0, "b": 2, "w": 0.44904212672281085}, {"a": 0, "b": 3, "w": 0.4755470775930666}, {"a": 0, "b": 4, "w": 0.567514615275165}, {"a": 0, "b": 5, "w": 0.19694173828130734}, {"a": 0, "b": 6, "w": 0.5020987021397603}, {"a": 0, "b": 7, "w": 0.28275805633402484}, {"a": 0, "b": 8, "w": 0.2819614400634647}, {"a": 0, "b": 9, "w": 0.36839935244073185}, {"a": 0, "b": 10, "w": 0.43885771088110626}, {"a": 0, "b": 11, "w": 0.29252487581277054}, {"a": 0, "b": 12, "w": 0.3165884088860792}, {"a": 0, "b": 13, "w": 0.23267833112790892}, {"a": 0, "b": 14, "w": 0.3345926586836263}, {"a": 0, "b": 15, "w": 0.27463198638428343}, {"a": 0, "b": 16, "w": 6.240241656740864e-11}, {"a": 0, "b": 17, "w": 0.0659166577361966}, {"a": 0, "b": 18, "w": 0.32787817291586463}, {"a": 0, "b": 19, "w": 0.2959903465123074}, {"a": 0, "b": 20, "w": 0.23177979483901578}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.478,hiY=-0.166;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
