<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">天空の夜明け [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.651, "c": "種", "n": "天空の夜明け [A]  n=3251 cos1.00 難1.65", "s": 1.0, "f": 0}, {"x": 0.998, "y": 1.692, "c": "近傍", "n": "suspicions [A]  n=1382 cos1.00 難1.69", "s": 0.425, "f": 0}, {"x": 0.991, "y": 1.681, "c": "近傍", "n": "INAZUMA [L]  n=759 cos0.99 難1.68", "s": 0.233, "f": 0}, {"x": 0.99, "y": 1.628, "c": "近傍", "n": "Blue Rain [L]  n=2878 cos0.99 難1.63", "s": 0.885, "f": 0}, {"x": 0.989, "y": 1.663, "c": "近傍", "n": "waxing and wanding [L]  n=2819 cos0.99 難1.66", "s": 0.867, "f": 0}, {"x": 0.991, "y": 1.608, "c": "近傍", "n": "THE BRAVE MUST DIE [A]  n=2704 cos0.99 難1.61", "s": 0.832, "f": 0}, {"x": 0.984, "y": 1.663, "c": "近傍", "n": "VOLAQUAS [A]  n=1729 cos0.98 難1.66", "s": 0.532, "f": 0}, {"x": 0.983, "y": 1.691, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2472 cos0.98 難1.69", "s": 0.76, "f": 0}, {"x": 0.988, "y": 1.724, "c": "近傍", "n": "ZEPHYRANTHES [L]  n=2168 cos0.99 難1.72", "s": 0.667, "f": 0}, {"x": 0.981, "y": 1.669, "c": "近傍", "n": "Artist [A]  n=2459 cos0.98 難1.67", "s": 0.756, "f": 0}, {"x": 0.982, "y": 1.712, "c": "近傍", "n": "Satellite Burst [A]  n=1278 cos0.98 難1.71", "s": 0.393, "f": 0}, {"x": 0.982, "y": 1.713, "c": "近傍", "n": "BLACK or WHITE? [A]  n=2319 cos0.98 難1.71", "s": 0.713, "f": 0}, {"x": 0.978, "y": 1.674, "c": "近傍", "n": "Life Is A Game ft.DD\"ナカタ\"Metal [A]  n=2805 cos0.98 難1.67", "s": 0.863, "f": 0}, {"x": 0.983, "y": 1.572, "c": "近傍", "n": "伐折羅-vajra- [A]  n=2266 cos0.98 難1.57", "s": 0.697, "f": 0}, {"x": 0.977, "y": 1.661, "c": "近傍", "n": "MAX 300 [A]  n=1585 cos0.98 難1.66", "s": 0.488, "f": 0}, {"x": 0.977, "y": 1.637, "c": "近傍", "n": "Tiempo Loco [A]  n=2283 cos0.98 難1.64", "s": 0.702, "f": 0}, {"x": 0.982, "y": 1.57, "c": "近傍", "n": "Scripted Connection⇒ A mix [L]  n=1751 cos0.98 難1.57", "s": 0.539, "f": 0}, {"x": 0.982, "y": 1.559, "c": "近傍", "n": "DORNWALD ～Junge～ [A]  n=3068 cos0.98 難1.56", "s": 0.944, "f": 0}, {"x": 0.982, "y": 1.742, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2854 cos0.98 難1.74", "s": 0.878, "f": 0}, {"x": 0.975, "y": 1.59, "c": "近傍", "n": "O/D*20 [L]  n=1303 cos0.97 難1.59", "s": 0.401, "f": 0}, {"x": 0.984, "y": 1.535, "c": "近傍", "n": "Uaigh Gealai [A]  n=867 cos0.98 難1.53", "s": 0.267, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6923471028705985}, {"a": 0, "b": 2, "w": 0.3783391356625373}, {"a": 0, "b": 3, "w": 0.3498338876198439}, {"a": 0, "b": 4, "w": 0.14441097020384142}, {"a": 0, "b": 5, "w": 0.3940358086161381}, {"a": 0, "b": 6, "w": 0.18389241430574454}, {"a": 0, "b": 7, "w": 0.1895550981763784}, {"a": 0, "b": 8, "w": 0.3030280735336881}, {"a": 0, "b": 9, "w": 0.14911142808208178}, {"a": 0, "b": 10, "w": 0.16112187641438303}, {"a": 0, "b": 11, "w": 0.038837056256864066}, {"a": 0, "b": 12, "w": 0.0010810080457404059}, {"a": 0, "b": 13, "w": 0.19687827879106723}, {"a": 0, "b": 14, "w": 0.04007942028148492}, {"a": 0, "b": 15, "w": 0.055006430067822354}, {"a": 0, "b": 16, "w": 0.11233507517319918}, {"a": 0, "b": 17, "w": 0.1432553029325715}, {"a": 0, "b": 18, "w": 0.0854866980680058}, {"a": 0, "b": 19, "w": 2.770639273563802e-11}, {"a": 0, "b": 20, "w": 0.215318583327623}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=1.518,hiY=1.758;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
