<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Love Is Eternity [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.028, "c": "種", "n": "Love Is Eternity [A]  n=3531 cos1.00 難-0.03", "s": 0.946, "f": 0}, {"x": 0.997, "y": -0.215, "c": "近傍", "n": "Queen's Tragedy [A]  n=3243 cos1.00 難-0.22", "s": 0.869, "f": 0}, {"x": 0.995, "y": -0.106, "c": "近傍", "n": "ANDROMEDA II [A]  n=3026 cos1.00 難-0.11", "s": 0.811, "f": 0}, {"x": 0.995, "y": 0.066, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3582 cos1.00 難0.07", "s": 0.96, "f": 0}, {"x": 0.995, "y": -0.126, "c": "近傍", "n": "Back Into The Light [A]  n=3045 cos0.99 難-0.13", "s": 0.816, "f": 0}, {"x": 0.995, "y": -0.164, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2950 cos0.99 難-0.16", "s": 0.79, "f": 0}, {"x": 0.995, "y": -0.191, "c": "近傍", "n": "BLO§OM [A]  n=2557 cos1.00 難-0.19", "s": 0.685, "f": 0}, {"x": 0.994, "y": -0.105, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2907 cos0.99 難-0.11", "s": 0.779, "f": 0}, {"x": 0.994, "y": -0.092, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2697 cos0.99 難-0.09", "s": 0.722, "f": 0}, {"x": 0.995, "y": -0.18, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3181 cos0.99 難-0.18", "s": 0.852, "f": 0}, {"x": 0.993, "y": -0.028, "c": "近傍", "n": "ZERO-ONE [A]  n=2950 cos0.99 難-0.03", "s": 0.79, "f": 0}, {"x": 0.994, "y": -0.164, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2795 cos0.99 難-0.16", "s": 0.749, "f": 0}, {"x": 0.993, "y": -0.012, "c": "近傍", "n": "Change Yourself [A]  n=3048 cos0.99 難-0.01", "s": 0.817, "f": 0}, {"x": 0.993, "y": 0.04, "c": "近傍", "n": "BROKEN EDEN [A]  n=3527 cos0.99 難0.04", "s": 0.945, "f": 0}, {"x": 0.994, "y": -0.254, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos0.99 難-0.25", "s": 0.75, "f": 0}, {"x": 0.993, "y": -0.218, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1102 cos0.99 難-0.22", "s": 0.295, "f": 0}, {"x": 0.992, "y": 0.007, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2617 cos0.99 難0.01", "s": 0.701, "f": 0}, {"x": 0.995, "y": -0.325, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.32", "s": 0.636, "f": 0}, {"x": 0.992, "y": -0.028, "c": "近傍", "n": "refractive index [A]  n=3629 cos0.99 難-0.03", "s": 0.972, "f": 0}, {"x": 0.996, "y": -0.34, "c": "近傍", "n": "Summerblue [A]  n=2192 cos1.00 難-0.34", "s": 0.587, "f": 0}, {"x": 0.993, "y": -0.245, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.99 難-0.24", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6651633114137335}, {"a": 0, "b": 2, "w": 0.4713472417363985}, {"a": 0, "b": 3, "w": 0.31569400930118197}, {"a": 0, "b": 4, "w": 0.537065487094798}, {"a": 0, "b": 5, "w": 0.42794178106568004}, {"a": 0, "b": 6, "w": 0.3990992183617801}, {"a": 0, "b": 7, "w": 0.5153564701567115}, {"a": 0, "b": 8, "w": 0.5255328058090224}, {"a": 0, "b": 9, "w": 0.5151858844399568}, {"a": 0, "b": 10, "w": 0.46450728668907937}, {"a": 0, "b": 11, "w": 0.5171777933913004}, {"a": 0, "b": 12, "w": 0.025093003192432684}, {"a": 0, "b": 13, "w": 0.23587744234497243}, {"a": 0, "b": 14, "w": 0.5421350680052266}, {"a": 0, "b": 15, "w": 0.3174047349486232}, {"a": 0, "b": 16, "w": 0.3706647057618858}, {"a": 0, "b": 17, "w": 0.5572398623487078}, {"a": 0, "b": 18, "w": 4.340205972397371e-11}, {"a": 0, "b": 19, "w": 0.5686154461213628}, {"a": 0, "b": 20, "w": 0.348124115297906}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.372,hiY=0.098;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
