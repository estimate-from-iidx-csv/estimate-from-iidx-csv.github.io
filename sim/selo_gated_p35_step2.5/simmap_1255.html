<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ANCHOR [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.679, "c": "種", "n": "ANCHOR [H]  n=2040 cos1.00 難-0.68", "s": 0.648, "f": 0}, {"x": 0.995, "y": -0.681, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos1.00 難-0.68", "s": 0.59, "f": 0}, {"x": 0.995, "y": -0.613, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos1.00 難-0.61", "s": 0.776, "f": 0}, {"x": 0.995, "y": -0.761, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos1.00 難-0.76", "s": 0.582, "f": 0}, {"x": 0.995, "y": -0.8, "c": "近傍", "n": "Artist [H]  n=1575 cos1.00 難-0.80", "s": 0.5, "f": 0}, {"x": 0.996, "y": -0.84, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos1.00 難-0.84", "s": 0.699, "f": 0}, {"x": 0.995, "y": -0.816, "c": "近傍", "n": "EVANESCENT [H]  n=1488 cos0.99 難-0.82", "s": 0.473, "f": 0}, {"x": 0.993, "y": -0.78, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.78", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 0.953, "f": 0}, {"x": 0.994, "y": -0.553, "c": "近傍", "n": "もんめためたもん [A]  n=1109 cos0.99 難-0.55", "s": 0.352, "f": 0}, {"x": 0.994, "y": -0.814, "c": "近傍", "n": "∀ [H]  n=2296 cos0.99 難-0.81", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.827, "c": "近傍", "n": "Catch Our Fire! [H]  n=1841 cos0.99 難-0.83", "s": 0.585, "f": 0}, {"x": 0.992, "y": -0.604, "c": "近傍", "n": "THE DAY OF JUBILATIONS [H]  n=2130 cos0.99 難-0.60", "s": 0.676, "f": 0}, {"x": 0.993, "y": -0.553, "c": "近傍", "n": "オブソミート [A]  n=1258 cos0.99 難-0.55", "s": 0.399, "f": 0}, {"x": 0.992, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.575, "f": 0}, {"x": 0.993, "y": -0.823, "c": "近傍", "n": "God Mind [H]  n=718 cos0.99 難-0.82", "s": 0.228, "f": 0}, {"x": 0.992, "y": -0.821, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.82", "s": 0.245, "f": 0}, {"x": 0.992, "y": -0.814, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [H]  n=1248 cos0.99 難-0.81", "s": 0.396, "f": 0}, {"x": 0.992, "y": -0.581, "c": "近傍", "n": "不死身ごっこ [A]  n=705 cos0.99 難-0.58", "s": 0.224, "f": 0}, {"x": 0.992, "y": -0.527, "c": "近傍", "n": "Carmina [H]  n=2220 cos0.99 難-0.53", "s": 0.705, "f": 0}, {"x": 0.991, "y": -0.59, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.59", "s": 0.825, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4708321372890315}, {"a": 0, "b": 2, "w": 0.4336052511847198}, {"a": 0, "b": 3, "w": 0.38780282533823973}, {"a": 0, "b": 4, "w": 0.4544850605085591}, {"a": 0, "b": 5, "w": 0.4307432815912191}, {"a": 0, "b": 6, "w": 0.4610952291856809}, {"a": 0, "b": 7, "w": 3.792532954349781e-11}, {"a": 0, "b": 8, "w": 0.13846822452886665}, {"a": 0, "b": 9, "w": 0.3250602723913679}, {"a": 0, "b": 10, "w": 0.337906378554798}, {"a": 0, "b": 11, "w": 0.47207557475467543}, {"a": 0, "b": 12, "w": 0.44061873184573497}, {"a": 0, "b": 13, "w": 0.388766485469178}, {"a": 0, "b": 14, "w": 0.10776350978814264}, {"a": 0, "b": 15, "w": 0.42887510664064454}, {"a": 0, "b": 16, "w": 0.4136751098944099}, {"a": 0, "b": 17, "w": 0.45159626929162544}, {"a": 0, "b": 18, "w": 0.18701316628830367}, {"a": 0, "b": 19, "w": 0.42660417495889646}, {"a": 0, "b": 20, "w": 0.19721613439491192}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.865,hiY=-0.502;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
