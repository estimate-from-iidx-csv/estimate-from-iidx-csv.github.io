<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Flashes [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.4, "c": "種", "n": "Flashes [A]  n=3308 cos1.00 難1.40", "s": 1.0, "f": 0}, {"x": 0.988, "y": 1.436, "c": "近傍", "n": "LASER CRUSTER (IGNITE REMIX) [A]  n=2521 cos0.99 難1.44", "s": 0.762, "f": 0}, {"x": 0.988, "y": 1.428, "c": "近傍", "n": "Slipstream [A]  n=2980 cos0.99 難1.43", "s": 0.901, "f": 0}, {"x": 0.987, "y": 1.411, "c": "近傍", "n": "INHERITANCE [L]  n=589 cos0.99 難1.41", "s": 0.178, "f": 0}, {"x": 0.985, "y": 1.38, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [A]  n=2585 cos0.99 難1.38", "s": 0.781, "f": 0}, {"x": 0.985, "y": 1.376, "c": "近傍", "n": "24h Endurance Race [A]  n=1710 cos0.99 難1.38", "s": 0.517, "f": 0}, {"x": 0.985, "y": 1.383, "c": "近傍", "n": "Illusionary Waterlily [A]  n=3023 cos0.98 難1.38", "s": 0.914, "f": 0}, {"x": 0.984, "y": 1.367, "c": "近傍", "n": "HADES [A]  n=3300 cos0.98 難1.37", "s": 0.998, "f": 0}, {"x": 0.987, "y": 1.55, "c": "近傍", "n": "水鏡の異界 [A]  n=2516 cos0.99 難1.55", "s": 0.761, "f": 0}, {"x": 0.983, "y": 1.427, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.98 難1.43", "s": 0.292, "f": 0}, {"x": 0.987, "y": 1.589, "c": "近傍", "n": "Flamingo [A]  n=796 cos0.99 難1.59", "s": 0.241, "f": 0}, {"x": 0.992, "y": 1.651, "c": "近傍", "n": "2 Beasts Unchained [A]  n=1873 cos0.99 難1.65", "s": 0.566, "f": 0}, {"x": 0.982, "y": 1.36, "c": "近傍", "n": "Papilio ulysses [A]  n=3228 cos0.98 難1.36", "s": 0.976, "f": 0}, {"x": 0.982, "y": 1.445, "c": "近傍", "n": "ONIGOROSHI [A]  n=2738 cos0.98 難1.44", "s": 0.828, "f": 0}, {"x": 0.984, "y": 1.234, "c": "近傍", "n": "Without Heaven [A]  n=1055 cos0.98 難1.23", "s": 0.319, "f": 0}, {"x": 0.989, "y": 1.144, "c": "近傍", "n": "Mid-Corner (Magic Maker) [A]  n=1203 cos0.99 難1.14", "s": 0.364, "f": 0}, {"x": 0.991, "y": 1.108, "c": "近傍", "n": "ハイテックトキオ [L]  n=2026 cos0.99 難1.11", "s": 0.612, "f": 0}, {"x": 0.979, "y": 1.358, "c": "近傍", "n": "STARLIGHT DANCEHALL [L]  n=2924 cos0.98 難1.36", "s": 0.884, "f": 0}, {"x": 0.979, "y": 1.468, "c": "近傍", "n": "Boomy and The Boost [A]  n=3146 cos0.98 難1.47", "s": 0.951, "f": 0}, {"x": 0.98, "y": 1.262, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3030 cos0.98 難1.26", "s": 0.916, "f": 0}, {"x": 0.984, "y": 1.164, "c": "近傍", "n": "Here We Go Now [A]  n=1383 cos0.98 難1.16", "s": 0.418, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.19151226257120824}, {"a": 0, "b": 2, "w": 0.25631633368686213}, {"a": 0, "b": 3, "w": 0.2422062241134344}, {"a": 0, "b": 4, "w": 0.21181254985405795}, {"a": 0, "b": 5, "w": 0.14397006142585445}, {"a": 0, "b": 6, "w": 0.1867130693464618}, {"a": 0, "b": 7, "w": 0.18602747353236382}, {"a": 0, "b": 8, "w": 0.24076558306459928}, {"a": 0, "b": 9, "w": 0.14530141524657958}, {"a": 0, "b": 10, "w": 0.2366467896269352}, {"a": 0, "b": 11, "w": 0.2934426604386505}, {"a": 0, "b": 12, "w": 0.12094179038806085}, {"a": 0, "b": 13, "w": 0.1244424733050955}, {"a": 0, "b": 14, "w": 0.09376422888796876}, {"a": 0, "b": 15, "w": 0.32598126612945544}, {"a": 0, "b": 16, "w": 0.25831133978924914}, {"a": 0, "b": 17, "w": 3.0916047499829347e-11}, {"a": 0, "b": 18, "w": 0.030650750288861217}, {"a": 0, "b": 19, "w": 0.09166687991026656}, {"a": 0, "b": 20, "w": 0.1477867452615832}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=1.064,hiY=1.694;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
