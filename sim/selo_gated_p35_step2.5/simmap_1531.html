<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE DEEP STRIKER [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.292, "c": "種", "n": "THE DEEP STRIKER [H]  n=2677 cos1.00 難-0.29", "s": 0.725, "f": 0}, {"x": 0.995, "y": -0.343, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [H]  n=3292 cos1.00 難-0.34", "s": 0.892, "f": 0}, {"x": 0.994, "y": -0.123, "c": "近傍", "n": "Music is The Answer [A]  n=3025 cos0.99 難-0.12", "s": 0.82, "f": 0}, {"x": 0.993, "y": -0.103, "c": "近傍", "n": "P.O.W.E.R. [A]  n=2497 cos0.99 難-0.10", "s": 0.677, "f": 0}, {"x": 0.991, "y": -0.277, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1403 cos0.99 難-0.28", "s": 0.38, "f": 0}, {"x": 0.991, "y": -0.29, "c": "近傍", "n": "MENTAL MELTDOWN [H]  n=2512 cos0.99 難-0.29", "s": 0.681, "f": 0}, {"x": 0.991, "y": -0.379, "c": "近傍", "n": "Twilight Warp [A]  n=2518 cos0.99 難-0.38", "s": 0.682, "f": 0}, {"x": 0.99, "y": -0.254, "c": "近傍", "n": "Everlasting Last [A]  n=3198 cos0.99 難-0.25", "s": 0.866, "f": 0}, {"x": 0.99, "y": -0.359, "c": "近傍", "n": "アルストロメリア [A]  n=3691 cos0.99 難-0.36", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.197, "c": "近傍", "n": "SOLID STATE SQUAD [H]  n=2672 cos0.99 難-0.20", "s": 0.724, "f": 0}, {"x": 0.992, "y": -0.028, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [A]  n=2798 cos0.99 難-0.03", "s": 0.758, "f": 0}, {"x": 0.99, "y": -0.263, "c": "近傍", "n": "Cheer Train [A]  n=2414 cos0.99 難-0.26", "s": 0.654, "f": 0}, {"x": 0.989, "y": -0.238, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos0.99 難-0.24", "s": 0.876, "f": 0}, {"x": 0.989, "y": -0.258, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos0.99 難-0.26", "s": 0.739, "f": 0}, {"x": 0.991, "y": -0.528, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.99 難-0.53", "s": 0.776, "f": 0}, {"x": 0.989, "y": -0.276, "c": "近傍", "n": "MAD ATTACK [A]  n=2734 cos0.99 難-0.28", "s": 0.741, "f": 0}, {"x": 0.989, "y": -0.385, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.39", "s": 0.765, "f": 0}, {"x": 0.99, "y": -0.067, "c": "近傍", "n": "Catch Me [A]  n=2858 cos0.99 難-0.07", "s": 0.774, "f": 0}, {"x": 0.988, "y": -0.245, "c": "近傍", "n": "abstract [A]  n=2276 cos0.99 難-0.24", "s": 0.617, "f": 0}, {"x": 0.99, "y": -0.542, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1934 cos0.99 難-0.54", "s": 0.524, "f": 0}, {"x": 0.989, "y": -0.497, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1774 cos0.99 難-0.50", "s": 0.481, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4035096795693134}, {"a": 0, "b": 2, "w": 0.24869386475741284}, {"a": 0, "b": 3, "w": 0.1417548599950037}, {"a": 0, "b": 4, "w": 0.20413208928376247}, {"a": 0, "b": 5, "w": 0.2183292257726699}, {"a": 0, "b": 6, "w": 0.12960751290908168}, {"a": 0, "b": 7, "w": 0.16310185089452334}, {"a": 0, "b": 8, "w": 0.22287148260971879}, {"a": 0, "b": 9, "w": 0.13676072902639014}, {"a": 0, "b": 10, "w": 0.29216523805969363}, {"a": 0, "b": 11, "w": 0.052144375298289525}, {"a": 0, "b": 12, "w": 0.18605824195039267}, {"a": 0, "b": 13, "w": 0.13008818316889048}, {"a": 0, "b": 14, "w": 0.13141449218871082}, {"a": 0, "b": 15, "w": 0.14404298785237302}, {"a": 0, "b": 16, "w": 0.1795363627000256}, {"a": 0, "b": 17, "w": 0.16730481042609902}, {"a": 0, "b": 18, "w": 5.388822721386077e-11}, {"a": 0, "b": 19, "w": 0.21684042381867918}, {"a": 0, "b": 20, "w": 0.1909195375549766}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.583,hiY=0.013;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
