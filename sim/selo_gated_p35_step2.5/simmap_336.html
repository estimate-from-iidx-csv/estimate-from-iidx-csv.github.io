<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Frozen Ray (original mix) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.729, "c": "種", "n": "Frozen Ray (original mix) [H]  n=1862 cos1.00 難-0.73", "s": 0.523, "f": 0}, {"x": 0.995, "y": -0.689, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1232 cos0.99 難-0.69", "s": 0.346, "f": 0}, {"x": 0.993, "y": -0.765, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.99 難-0.77", "s": 0.639, "f": 0}, {"x": 0.993, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.493, "f": 0}, {"x": 0.992, "y": -0.761, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.76", "s": 0.519, "f": 0}, {"x": 0.991, "y": -0.694, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.99 難-0.69", "s": 0.689, "f": 0}, {"x": 0.991, "y": -0.643, "c": "近傍", "n": "gentle stress [A]  n=1887 cos0.99 難-0.64", "s": 0.53, "f": 0}, {"x": 0.992, "y": -0.586, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos0.99 難-0.59", "s": 0.443, "f": 0}, {"x": 0.989, "y": -0.729, "c": "近傍", "n": "Lucy [H]  n=1819 cos0.99 難-0.73", "s": 0.511, "f": 0}, {"x": 0.991, "y": -0.894, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2287 cos0.99 難-0.89", "s": 0.642, "f": 0}, {"x": 0.989, "y": -0.662, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.99 難-0.66", "s": 0.821, "f": 0}, {"x": 0.988, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.71, "f": 0}, {"x": 0.989, "y": -0.612, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos0.99 難-0.61", "s": 0.485, "f": 0}, {"x": 0.99, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.638, "f": 0}, {"x": 0.989, "y": -0.864, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.86", "s": 0.561, "f": 0}, {"x": 0.988, "y": -0.796, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.99 難-0.80", "s": 0.6, "f": 0}, {"x": 0.99, "y": -0.912, "c": "近傍", "n": "NEO GENERATOR SEVEN [H]  n=1629 cos0.99 難-0.91", "s": 0.457, "f": 0}, {"x": 0.994, "y": -0.458, "c": "近傍", "n": "未来のプリズム [A]  n=2668 cos0.99 難-0.46", "s": 0.749, "f": 0}, {"x": 0.987, "y": -0.81, "c": "近傍", "n": "Todestrieb [H]  n=3122 cos0.99 難-0.81", "s": 0.876, "f": 0}, {"x": 0.989, "y": -0.899, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos0.99 難-0.90", "s": 0.63, "f": 0}, {"x": 0.987, "y": -0.638, "c": "近傍", "n": "Element of SPADA [A]  n=3563 cos0.99 難-0.64", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3259541040893431}, {"a": 0, "b": 2, "w": 0.4113584205684617}, {"a": 0, "b": 3, "w": 0.21666855913790894}, {"a": 0, "b": 4, "w": 0.3855581350313749}, {"a": 0, "b": 5, "w": 0.32049763638084194}, {"a": 0, "b": 6, "w": 0.3488318583938871}, {"a": 0, "b": 7, "w": 0.3213090233134961}, {"a": 0, "b": 8, "w": 0.18454783395875973}, {"a": 0, "b": 9, "w": 0.3544947665818279}, {"a": 0, "b": 10, "w": 0.08375161107476381}, {"a": 0, "b": 11, "w": 5.841904737735604e-11}, {"a": 0, "b": 12, "w": 0.28386374613878296}, {"a": 0, "b": 13, "w": 0.30483921996903485}, {"a": 0, "b": 14, "w": 0.0907944691700816}, {"a": 0, "b": 15, "w": 0.11445156395612355}, {"a": 0, "b": 16, "w": 0.10259096177161764}, {"a": 0, "b": 17, "w": 0.40462774222132125}, {"a": 0, "b": 18, "w": 0.16607324724097217}, {"a": 0, "b": 19, "w": 0.23943507986238344}, {"a": 0, "b": 20, "w": 0.18371288598484314}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.948,hiY=-0.421;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
