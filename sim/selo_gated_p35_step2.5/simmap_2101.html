<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Sarutobi Champion is 拙者 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.664, "c": "種", "n": "Sarutobi Champion is 拙者 [A]  n=2913 cos1.00 難0.66", "s": 0.782, "f": 0}, {"x": 0.992, "y": 0.627, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.99 難0.63", "s": 0.927, "f": 0}, {"x": 0.991, "y": 0.733, "c": "近傍", "n": "TRANOID [A]  n=3073 cos0.99 難0.73", "s": 0.825, "f": 0}, {"x": 0.991, "y": 0.738, "c": "近傍", "n": "Beastie Starter [A]  n=3263 cos0.99 難0.74", "s": 0.876, "f": 0}, {"x": 0.987, "y": 0.512, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.51", "s": 0.853, "f": 0}, {"x": 0.983, "y": 0.702, "c": "近傍", "n": "SCHWARZSCHILD FIELD [A]  n=3217 cos0.98 難0.70", "s": 0.864, "f": 0}, {"x": 0.983, "y": 0.756, "c": "近傍", "n": "moon_child [A]  n=3574 cos0.98 難0.76", "s": 0.959, "f": 0}, {"x": 0.989, "y": 0.403, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.99 難0.40", "s": 0.826, "f": 0}, {"x": 0.981, "y": 0.73, "c": "近傍", "n": "1st Samurai [A]  n=3017 cos0.98 難0.73", "s": 0.81, "f": 0}, {"x": 0.98, "y": 0.548, "c": "近傍", "n": "LADYBIRD [A]  n=2809 cos0.98 難0.55", "s": 0.754, "f": 0}, {"x": 0.983, "y": 0.899, "c": "近傍", "n": "one or eight [A]  n=3564 cos0.98 難0.90", "s": 0.957, "f": 0}, {"x": 0.979, "y": 0.591, "c": "近傍", "n": "雪月花 [A]  n=3725 cos0.98 難0.59", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.378, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.38", "s": 0.717, "f": 0}, {"x": 0.985, "y": 0.383, "c": "近傍", "n": "Castle on the Moon [A]  n=3392 cos0.98 難0.38", "s": 0.911, "f": 0}, {"x": 0.98, "y": 0.475, "c": "近傍", "n": "Aegis [A]  n=3425 cos0.98 難0.48", "s": 0.919, "f": 0}, {"x": 0.981, "y": 0.874, "c": "近傍", "n": "卑弥呼 [H]  n=3674 cos0.98 難0.87", "s": 0.986, "f": 0}, {"x": 0.979, "y": 0.52, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos0.98 難0.52", "s": 0.86, "f": 0}, {"x": 0.985, "y": 0.363, "c": "近傍", "n": "switch [A]  n=3109 cos0.98 難0.36", "s": 0.835, "f": 0}, {"x": 0.988, "y": 0.312, "c": "近傍", "n": "Overslept [A]  n=2562 cos0.99 難0.31", "s": 0.688, "f": 0}, {"x": 0.984, "y": 0.376, "c": "近傍", "n": "Back Spin Sweeper [A]  n=3245 cos0.98 難0.38", "s": 0.871, "f": 0}, {"x": 0.981, "y": 0.414, "c": "近傍", "n": "Giudecca [A]  n=3156 cos0.98 難0.41", "s": 0.847, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3811918844856017}, {"a": 0, "b": 2, "w": 0.3754699023339927}, {"a": 0, "b": 3, "w": 0.2511371806295635}, {"a": 0, "b": 4, "w": 0.24521801911685448}, {"a": 0, "b": 5, "w": 0.12047476259573031}, {"a": 0, "b": 6, "w": 0.1111713527838345}, {"a": 0, "b": 7, "w": 0.10350742941005053}, {"a": 0, "b": 8, "w": 0.08991473772348912}, {"a": 0, "b": 9, "w": 3.596056785681867e-11}, {"a": 0, "b": 10, "w": 0.13845200729328333}, {"a": 0, "b": 11, "w": 0.03876770251118067}, {"a": 0, "b": 12, "w": 0.18587174913134785}, {"a": 0, "b": 13, "w": 0.16497340085875078}, {"a": 0, "b": 14, "w": 0.060988474749657184}, {"a": 0, "b": 15, "w": 0.01411794865747662}, {"a": 0, "b": 16, "w": 0.003771849211814393}, {"a": 0, "b": 17, "w": 0.11741044841537707}, {"a": 0, "b": 18, "w": 0.212174945915508}, {"a": 0, "b": 19, "w": 0.06109513603105132}, {"a": 0, "b": 20, "w": 0.005601452659537709}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=0.265,hiY=0.946;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
