<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">オッド ラヴィ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.399, "c": "種", "n": "オッド ラヴィ [A]  n=1493 cos1.00 難-0.40", "s": 0.452, "f": 0}, {"x": 0.996, "y": -0.412, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [H]  n=2987 cos1.00 難-0.41", "s": 0.904, "f": 0}, {"x": 0.994, "y": -0.385, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.39", "s": 0.854, "f": 0}, {"x": 0.995, "y": -0.295, "c": "近傍", "n": "IXION [A]  n=2650 cos0.99 難-0.30", "s": 0.802, "f": 0}, {"x": 0.994, "y": -0.302, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.99 難-0.30", "s": 0.877, "f": 0}, {"x": 0.994, "y": -0.263, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.26", "s": 0.929, "f": 0}, {"x": 0.995, "y": -0.238, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.325, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.32", "s": 0.745, "f": 0}, {"x": 0.992, "y": -0.356, "c": "近傍", "n": "Answer [A]  n=3214 cos0.99 難-0.36", "s": 0.972, "f": 0}, {"x": 0.993, "y": -0.281, "c": "近傍", "n": "星をこの手に [A]  n=3016 cos0.99 難-0.28", "s": 0.912, "f": 0}, {"x": 0.993, "y": -0.25, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos0.99 難-0.25", "s": 0.714, "f": 0}, {"x": 0.994, "y": -0.237, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos0.99 難-0.24", "s": 0.389, "f": 0}, {"x": 0.992, "y": -0.458, "c": "近傍", "n": "Ristaccia [H]  n=2302 cos0.99 難-0.46", "s": 0.696, "f": 0}, {"x": 0.991, "y": -0.379, "c": "近傍", "n": "Twilight Warp [A]  n=2518 cos0.99 難-0.38", "s": 0.762, "f": 0}, {"x": 0.994, "y": -0.223, "c": "近傍", "n": "Be OK [A]  n=2981 cos0.99 難-0.22", "s": 0.902, "f": 0}, {"x": 0.995, "y": -0.606, "c": "近傍", "n": "Feel The Beat [H]  n=2624 cos0.99 難-0.61", "s": 0.794, "f": 0}, {"x": 0.993, "y": -0.254, "c": "近傍", "n": "Everlasting Last [A]  n=3198 cos0.99 難-0.25", "s": 0.967, "f": 0}, {"x": 0.991, "y": -0.364, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.99 難-0.36", "s": 0.727, "f": 0}, {"x": 0.991, "y": -0.484, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.99 難-0.48", "s": 0.723, "f": 0}, {"x": 0.991, "y": -0.499, "c": "近傍", "n": "Too Late Snow [A]  n=1380 cos0.99 難-0.50", "s": 0.417, "f": 0}, {"x": 0.991, "y": -0.375, "c": "近傍", "n": "Last Dance [H]  n=2703 cos0.99 難-0.37", "s": 0.818, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4089630555763222}, {"a": 0, "b": 2, "w": 0.3884788808940446}, {"a": 0, "b": 3, "w": 0.21923810068891092}, {"a": 0, "b": 4, "w": 0.2723626833371716}, {"a": 0, "b": 5, "w": 0.30103914576593926}, {"a": 0, "b": 6, "w": 0.45163448286808483}, {"a": 0, "b": 7, "w": 0.3416503658632246}, {"a": 0, "b": 8, "w": 0.3713961042983621}, {"a": 0, "b": 9, "w": 0.3627076857190853}, {"a": 0, "b": 10, "w": 0.43434699698681967}, {"a": 0, "b": 11, "w": 0.14983698157217584}, {"a": 0, "b": 12, "w": 0.27563264376479835}, {"a": 0, "b": 13, "w": 0.11233081663789635}, {"a": 0, "b": 14, "w": 0.3799139719222039}, {"a": 0, "b": 15, "w": 0.5127503717914831}, {"a": 0, "b": 16, "w": 0.20594111373578483}, {"a": 0, "b": 17, "w": 0.35361206524476785}, {"a": 0, "b": 18, "w": 0.3621406539430183}, {"a": 0, "b": 19, "w": 4.340028336713431e-11}, {"a": 0, "b": 20, "w": 0.13505300105207108}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.636,hiY=-0.193;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
