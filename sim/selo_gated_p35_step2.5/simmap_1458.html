<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Peaktime Booster [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.852, "c": "種", "n": "Peaktime Booster [H]  n=1232 cos1.00 難-0.85", "s": 0.444, "f": 0}, {"x": 0.989, "y": -0.945, "c": "近傍", "n": "Double Dribble [H]  n=1638 cos0.99 難-0.94", "s": 0.59, "f": 0}, {"x": 0.989, "y": -1.043, "c": "近傍", "n": "Cult Invitation [H]  n=759 cos0.99 難-1.04", "s": 0.273, "f": 0}, {"x": 0.983, "y": -0.829, "c": "近傍", "n": "SAMURAI-Scramble [H]  n=1980 cos0.98 難-0.83", "s": 0.713, "f": 0}, {"x": 0.994, "y": -1.134, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=722 cos0.99 難-1.13", "s": 0.26, "f": 0}, {"x": 0.985, "y": -1.05, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [H]  n=1324 cos0.98 難-1.05", "s": 0.477, "f": 0}, {"x": 0.987, "y": -0.592, "c": "近傍", "n": "naughty girl@Queen's Palace [H]  n=2762 cos0.99 難-0.59", "s": 0.995, "f": 0}, {"x": 0.98, "y": -0.987, "c": "近傍", "n": "m1dy Deluxe [H]  n=2329 cos0.98 難-0.99", "s": 0.839, "f": 0}, {"x": 0.998, "y": -0.495, "c": "近傍", "n": "灼熱 Lost Summer Dayz [H]  n=1451 cos1.00 難-0.50", "s": 0.523, "f": 0}, {"x": 0.981, "y": -1.068, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [H]  n=1241 cos0.98 難-1.07", "s": 0.447, "f": 0}, {"x": 0.979, "y": -0.643, "c": "近傍", "n": "Digitank System [H]  n=2777 cos0.98 難-0.64", "s": 1.0, "f": 0}, {"x": 0.975, "y": -0.764, "c": "近傍", "n": "Bounce Bounce Bounce [H]  n=2279 cos0.98 難-0.76", "s": 0.821, "f": 0}, {"x": 0.974, "y": -0.898, "c": "近傍", "n": "255 [H]  n=1429 cos0.97 難-0.90", "s": 0.515, "f": 0}, {"x": 0.977, "y": -1.095, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.98 難-1.09", "s": 0.702, "f": 0}, {"x": 0.975, "y": -1.065, "c": "近傍", "n": "Level 2 [H]  n=1490 cos0.97 難-1.06", "s": 0.537, "f": 0}, {"x": 0.974, "y": -1.086, "c": "近傍", "n": "Beat Juggling Mix [H]  n=1503 cos0.97 難-1.09", "s": 0.541, "f": 0}, {"x": 0.989, "y": -1.283, "c": "近傍", "n": "27th style [H]  n=1336 cos0.99 難-1.28", "s": 0.481, "f": 0}, {"x": 0.97, "y": -0.975, "c": "近傍", "n": "Hello Happiness [H]  n=2032 cos0.97 難-0.98", "s": 0.732, "f": 0}, {"x": 0.968, "y": -0.702, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.97 難-0.70", "s": 0.818, "f": 0}, {"x": 0.967, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.97 難-0.89", "s": 0.827, "f": 0}, {"x": 0.988, "y": -0.366, "c": "近傍", "n": "Lords Of The Roundtable [H]  n=2285 cos0.99 難-0.37", "s": 0.823, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5244623302229123}, {"a": 0, "b": 2, "w": 0.4560912367012624}, {"a": 0, "b": 3, "w": 0.3977682111246513}, {"a": 0, "b": 4, "w": 0.6238661767786897}, {"a": 0, "b": 5, "w": 0.3607958431088445}, {"a": 0, "b": 6, "w": 0.4564360888315723}, {"a": 0, "b": 7, "w": 0.3160742681980121}, {"a": 0, "b": 8, "w": 0.7516749969878183}, {"a": 0, "b": 9, "w": 0.2230854903720254}, {"a": 0, "b": 10, "w": 0.3240080119598471}, {"a": 0, "b": 11, "w": 0.1908447870207588}, {"a": 0, "b": 12, "w": 0.21094803789129812}, {"a": 0, "b": 13, "w": 0.23985624620583657}, {"a": 0, "b": 14, "w": 0.22827754413204748}, {"a": 0, "b": 15, "w": 0.24467122253262397}, {"a": 0, "b": 16, "w": 0.3889429721736166}, {"a": 0, "b": 17, "w": 0.18683676321478804}, {"a": 0, "b": 18, "w": 0.11949869982195604}, {"a": 0, "b": 19, "w": 3.139732918100435e-11}, {"a": 0, "b": 20, "w": 0.44038251495593517}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.964,hiX=1.003,loY=-1.356,hiY=-0.293;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
