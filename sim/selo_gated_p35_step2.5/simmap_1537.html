<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE PEERLESS UNDER HEAVEN [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.555, "c": "種", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2310 cos1.00 難-0.55", "s": 0.696, "f": 0}, {"x": 0.992, "y": -0.611, "c": "近傍", "n": "Level 4 [H]  n=1523 cos0.99 難-0.61", "s": 0.459, "f": 0}, {"x": 0.99, "y": -0.649, "c": "近傍", "n": "Level 3 [H]  n=1946 cos0.99 難-0.65", "s": 0.586, "f": 0}, {"x": 0.989, "y": -0.696, "c": "近傍", "n": "LOCUS OF THE TRAVEL [H]  n=1281 cos0.99 難-0.70", "s": 0.386, "f": 0}, {"x": 0.985, "y": -0.364, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.99 難-0.36", "s": 0.724, "f": 0}, {"x": 0.983, "y": -0.758, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos0.98 難-0.76", "s": 0.672, "f": 0}, {"x": 0.98, "y": -0.386, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3319 cos0.98 難-0.39", "s": 1.0, "f": 0}, {"x": 0.978, "y": -0.484, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.98 難-0.48", "s": 0.72, "f": 0}, {"x": 0.981, "y": -0.272, "c": "近傍", "n": "Lift Us High [A]  n=2439 cos0.98 難-0.27", "s": 0.735, "f": 0}, {"x": 0.98, "y": -0.302, "c": "近傍", "n": "Round and Round [A]  n=2986 cos0.98 難-0.30", "s": 0.9, "f": 0}, {"x": 0.983, "y": -0.196, "c": "近傍", "n": "Frisk And Squeak [A]  n=1806 cos0.98 難-0.20", "s": 0.544, "f": 0}, {"x": 0.98, "y": -0.814, "c": "近傍", "n": "The Sampling Paradise [H]  n=3031 cos0.98 難-0.81", "s": 0.913, "f": 0}, {"x": 0.988, "y": -0.107, "c": "近傍", "n": "Tripping Jumping [A]  n=1970 cos0.99 難-0.11", "s": 0.594, "f": 0}, {"x": 0.978, "y": -0.757, "c": "近傍", "n": "Purple Perplex [H]  n=1797 cos0.98 難-0.76", "s": 0.541, "f": 0}, {"x": 0.991, "y": -1.065, "c": "近傍", "n": "Level 2 [H]  n=1490 cos0.99 難-1.06", "s": 0.449, "f": 0}, {"x": 0.976, "y": -0.606, "c": "近傍", "n": "Feel The Beat [H]  n=2624 cos0.98 難-0.61", "s": 0.791, "f": 0}, {"x": 0.987, "y": -1.033, "c": "近傍", "n": "FlyAway [H]  n=630 cos0.99 難-1.03", "s": 0.19, "f": 0}, {"x": 0.981, "y": -0.917, "c": "近傍", "n": "Papilio ulysses [H]  n=2094 cos0.98 難-0.92", "s": 0.631, "f": 0}, {"x": 0.975, "y": -0.55, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1051 cos0.98 難-0.55", "s": 0.317, "f": 0}, {"x": 0.978, "y": -0.816, "c": "近傍", "n": "SμG@R RU$# [H]  n=620 cos0.98 難-0.82", "s": 0.187, "f": 0}, {"x": 0.98, "y": -0.898, "c": "近傍", "n": "255 [H]  n=1429 cos0.98 難-0.90", "s": 0.431, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5094640787511424}, {"a": 0, "b": 2, "w": 0.3010457118367632}, {"a": 0, "b": 3, "w": 0.3444660858951313}, {"a": 0, "b": 4, "w": 0.31578998404621805}, {"a": 0, "b": 5, "w": 0.2086465816735883}, {"a": 0, "b": 6, "w": 0.2786696320399912}, {"a": 0, "b": 7, "w": 0.19525206678501317}, {"a": 0, "b": 8, "w": 0.2555299632513496}, {"a": 0, "b": 9, "w": 0.21233611910364902}, {"a": 0, "b": 10, "w": 0.31131883248111336}, {"a": 0, "b": 11, "w": 0.023226354881363487}, {"a": 0, "b": 12, "w": 0.43097923854709197}, {"a": 0, "b": 13, "w": 0.20930963560914762}, {"a": 0, "b": 14, "w": 0.45745097772070686}, {"a": 0, "b": 15, "w": 0.17773014949800303}, {"a": 0, "b": 16, "w": 0.3634433943266173}, {"a": 0, "b": 17, "w": 0.28567774569755167}, {"a": 0, "b": 18, "w": 0.09310357408134817}, {"a": 0, "b": 19, "w": 0.23655986613418167}, {"a": 0, "b": 20, "w": 3.070510512515057e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=-1.142,hiY=-0.031;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
