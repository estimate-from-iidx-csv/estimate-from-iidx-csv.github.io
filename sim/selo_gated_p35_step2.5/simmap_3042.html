<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">雪月花 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.591, "c": "種", "n": "雪月花 [A]  n=3725 cos1.00 難0.59", "s": 0.995, "f": 0}, {"x": 0.995, "y": 0.595, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3710 cos0.99 難0.59", "s": 0.991, "f": 0}, {"x": 0.992, "y": 0.571, "c": "近傍", "n": "The Sampling Paradise [A]  n=3743 cos0.99 難0.57", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.756, "c": "近傍", "n": "moon_child [A]  n=3574 cos0.99 難0.76", "s": 0.955, "f": 0}, {"x": 0.992, "y": 0.44, "c": "近傍", "n": "diagram [A]  n=3166 cos0.99 難0.44", "s": 0.846, "f": 0}, {"x": 0.989, "y": 0.535, "c": "近傍", "n": "C-C-C-N-N-N [A]  n=2180 cos0.99 難0.54", "s": 0.582, "f": 0}, {"x": 0.992, "y": 0.769, "c": "近傍", "n": "Do it!! Do it!! [A]  n=3362 cos0.99 難0.77", "s": 0.898, "f": 0}, {"x": 0.99, "y": 0.702, "c": "近傍", "n": "SCHWARZSCHILD FIELD [A]  n=3217 cos0.99 難0.70", "s": 0.859, "f": 0}, {"x": 0.99, "y": 0.497, "c": "近傍", "n": "BRAVE OUT [L]  n=696 cos0.99 難0.50", "s": 0.186, "f": 0}, {"x": 0.989, "y": 0.553, "c": "近傍", "n": "gigadelic [A]  n=3542 cos0.99 難0.55", "s": 0.946, "f": 0}, {"x": 0.989, "y": 0.49, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1777 cos0.99 難0.49", "s": 0.475, "f": 0}, {"x": 0.991, "y": 0.739, "c": "近傍", "n": "Funny shuffle [A]  n=3261 cos0.99 難0.74", "s": 0.871, "f": 0}, {"x": 0.989, "y": 0.512, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.99 難0.51", "s": 0.849, "f": 0}, {"x": 0.988, "y": 0.668, "c": "近傍", "n": "FIRE FIRE [A]  n=3658 cos0.99 難0.67", "s": 0.977, "f": 0}, {"x": 0.988, "y": 0.52, "c": "近傍", "n": "STELLAR WIND [A]  n=3204 cos0.99 難0.52", "s": 0.856, "f": 0}, {"x": 0.987, "y": 0.591, "c": "近傍", "n": "Pollinosis [A]  n=3354 cos0.99 難0.59", "s": 0.896, "f": 0}, {"x": 0.986, "y": 0.574, "c": "近傍", "n": "COSMIC CYBER [A]  n=2567 cos0.99 難0.57", "s": 0.686, "f": 0}, {"x": 0.986, "y": 0.473, "c": "近傍", "n": "3V0 [A]  n=2201 cos0.99 難0.47", "s": 0.588, "f": 0}, {"x": 0.993, "y": 0.296, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1738 cos0.99 難0.30", "s": 0.464, "f": 0}, {"x": 0.986, "y": 0.515, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3094 cos0.99 難0.52", "s": 0.827, "f": 0}, {"x": 0.988, "y": 0.794, "c": "近傍", "n": "Persephone [A]  n=3438 cos0.99 難0.79", "s": 0.919, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4222424244235764}, {"a": 0, "b": 2, "w": 0.19233243440157044}, {"a": 0, "b": 3, "w": 0.41083568512808255}, {"a": 0, "b": 4, "w": 0.38020487197541586}, {"a": 0, "b": 5, "w": 0.15159458792640046}, {"a": 0, "b": 6, "w": 0.4010405598460255}, {"a": 0, "b": 7, "w": 0.3185015433591628}, {"a": 0, "b": 8, "w": 0.22922829655698984}, {"a": 0, "b": 9, "w": 0.22435163588897522}, {"a": 0, "b": 10, "w": 0.21392398163107795}, {"a": 0, "b": 11, "w": 0.3271640705724682}, {"a": 0, "b": 12, "w": 0.24636162338454337}, {"a": 0, "b": 13, "w": 0.2313453624705335}, {"a": 0, "b": 14, "w": 0.2160298925458729}, {"a": 0, "b": 15, "w": 0.1879452617222519}, {"a": 0, "b": 16, "w": 0.1390842817575334}, {"a": 0, "b": 17, "w": 3.797395731197639e-11}, {"a": 0, "b": 18, "w": 0.42814270143165467}, {"a": 0, "b": 19, "w": 0.16920171725592847}, {"a": 0, "b": 20, "w": 0.1710022600508856}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=0.256,hiY=0.833;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
