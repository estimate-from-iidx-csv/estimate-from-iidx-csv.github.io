<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Line 4 Ruin [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.011, "c": "種", "n": "Line 4 Ruin [H]  n=2373 cos1.00 難-1.01", "s": 0.737, "f": 0}, {"x": 0.992, "y": -0.956, "c": "近傍", "n": "Elektrick U-Phoria [H]  n=2155 cos0.99 難-0.96", "s": 0.669, "f": 0}, {"x": 0.993, "y": -0.894, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2287 cos0.99 難-0.89", "s": 0.71, "f": 0}, {"x": 0.99, "y": -1.016, "c": "近傍", "n": "Boomy and The Boost [H]  n=2209 cos0.99 難-1.02", "s": 0.686, "f": 0}, {"x": 0.993, "y": -0.899, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos0.99 難-0.90", "s": 0.697, "f": 0}, {"x": 0.99, "y": -0.871, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.87", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.162, "c": "近傍", "n": "Lethal Weapon [H]  n=1417 cos0.99 難-1.16", "s": 0.44, "f": 0}, {"x": 0.987, "y": -1.151, "c": "近傍", "n": "麗 ～うらら～ [H]  n=1861 cos0.99 難-1.15", "s": 0.578, "f": 0}, {"x": 0.984, "y": -0.999, "c": "近傍", "n": "L.F.O [H]  n=1705 cos0.98 難-1.00", "s": 0.529, "f": 0}, {"x": 0.984, "y": -1.03, "c": "近傍", "n": "魔法のかくれんぼ [H]  n=1209 cos0.98 難-1.03", "s": 0.375, "f": 0}, {"x": 0.985, "y": -0.92, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.98 難-0.92", "s": 0.697, "f": 0}, {"x": 0.984, "y": -1.007, "c": "近傍", "n": "No Tears [H]  n=1729 cos0.98 難-1.01", "s": 0.537, "f": 0}, {"x": 0.988, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.81", "s": 0.58, "f": 0}, {"x": 0.984, "y": -1.114, "c": "近傍", "n": "Say YEEEAHH [H]  n=1814 cos0.98 難-1.11", "s": 0.563, "f": 0}, {"x": 0.992, "y": -0.761, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.76", "s": 0.574, "f": 0}, {"x": 0.984, "y": -0.903, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.98 難-0.90", "s": 0.638, "f": 0}, {"x": 0.984, "y": -0.865, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1828 cos0.98 難-0.86", "s": 0.568, "f": 0}, {"x": 0.983, "y": -1.113, "c": "近傍", "n": "Summerlights(IIDX Edition) [H]  n=1470 cos0.98 難-1.11", "s": 0.456, "f": 0}, {"x": 0.985, "y": -1.188, "c": "近傍", "n": "妖隠し -あやかしかくし- [H]  n=2230 cos0.98 難-1.19", "s": 0.692, "f": 0}, {"x": 0.986, "y": -1.229, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.99 難-1.23", "s": 0.436, "f": 0}, {"x": 0.986, "y": -1.225, "c": "近傍", "n": "千年ノ理 [H]  n=2350 cos0.99 難-1.22", "s": 0.73, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3390627896848637}, {"a": 0, "b": 2, "w": 0.453530772649833}, {"a": 0, "b": 3, "w": 0.26043571838837387}, {"a": 0, "b": 4, "w": 0.3791318670010312}, {"a": 0, "b": 5, "w": 0.3439138791629266}, {"a": 0, "b": 6, "w": 0.06117577307208588}, {"a": 0, "b": 7, "w": 0.29573021867083416}, {"a": 0, "b": 8, "w": 0.09979168413740747}, {"a": 0, "b": 9, "w": 0.14004219393487227}, {"a": 0, "b": 10, "w": 0.20572026383478792}, {"a": 0, "b": 11, "w": 0.01761308132331596}, {"a": 0, "b": 12, "w": 0.2534682837370019}, {"a": 0, "b": 13, "w": 0.16528226463367868}, {"a": 0, "b": 14, "w": 0.4254624447680232}, {"a": 0, "b": 15, "w": 0.1057133017617401}, {"a": 0, "b": 16, "w": 0.07150089023845141}, {"a": 0, "b": 17, "w": 5.43359801596921e-11}, {"a": 0, "b": 18, "w": 0.21691914222418374}, {"a": 0, "b": 19, "w": 0.16931761462701134}, {"a": 0, "b": 20, "w": 0.12443304924590792}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-1.266,hiY=-0.723;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
