<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">satellite020712 from "CODED ARMS" [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.678, "c": "種", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1694 cos1.00 難-0.68", "s": 0.564, "f": 0}, {"x": 0.995, "y": -0.612, "c": "近傍", "n": "GENE [H]  n=2179 cos1.00 難-0.61", "s": 0.726, "f": 0}, {"x": 0.997, "y": -0.495, "c": "近傍", "n": "In Heaven [A]  n=2966 cos1.00 難-0.50", "s": 0.988, "f": 0}, {"x": 0.995, "y": -0.538, "c": "近傍", "n": "Sphere [H]  n=1980 cos1.00 難-0.54", "s": 0.66, "f": 0}, {"x": 0.994, "y": -0.609, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.61", "s": 0.471, "f": 0}, {"x": 0.993, "y": -0.754, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.75", "s": 0.502, "f": 0}, {"x": 0.994, "y": -0.553, "c": "近傍", "n": "オブソミート [A]  n=1258 cos0.99 難-0.55", "s": 0.419, "f": 0}, {"x": 0.993, "y": -0.752, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1602 cos0.99 難-0.75", "s": 0.534, "f": 0}, {"x": 0.993, "y": -0.613, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.61", "s": 0.814, "f": 0}, {"x": 0.995, "y": -0.84, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos0.99 難-0.84", "s": 0.734, "f": 0}, {"x": 0.996, "y": -0.484, "c": "近傍", "n": "KOTONOHA ft. Kotoha [A]  n=1510 cos1.00 難-0.48", "s": 0.503, "f": 0}, {"x": 0.993, "y": -0.819, "c": "近傍", "n": "NITROUS CANNON [H]  n=2161 cos0.99 難-0.82", "s": 0.72, "f": 0}, {"x": 0.992, "y": -0.705, "c": "近傍", "n": "n/a [H]  n=1574 cos0.99 難-0.71", "s": 0.524, "f": 0}, {"x": 0.992, "y": -0.73, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.73", "s": 0.605, "f": 0}, {"x": 0.992, "y": -0.669, "c": "近傍", "n": "end of world [H]  n=1762 cos0.99 難-0.67", "s": 0.587, "f": 0}, {"x": 0.991, "y": -0.66, "c": "近傍", "n": "Be quiet [H]  n=2526 cos0.99 難-0.66", "s": 0.841, "f": 0}, {"x": 0.992, "y": -0.59, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.59", "s": 0.865, "f": 0}, {"x": 0.991, "y": -0.74, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.74", "s": 0.692, "f": 0}, {"x": 0.991, "y": -0.759, "c": "近傍", "n": "紅牡丹 [H]  n=2666 cos0.99 難-0.76", "s": 0.888, "f": 0}, {"x": 0.992, "y": -0.53, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.53", "s": 0.882, "f": 0}, {"x": 0.991, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2841422249926415}, {"a": 0, "b": 2, "w": 0.5360605125730649}, {"a": 0, "b": 3, "w": 0.37654054376731205}, {"a": 0, "b": 4, "w": 0.2577950325124919}, {"a": 0, "b": 5, "w": 0.16411089168424176}, {"a": 0, "b": 6, "w": 0.14704906799377448}, {"a": 0, "b": 7, "w": 0.17878452431297776}, {"a": 0, "b": 8, "w": 0.12168973424551388}, {"a": 0, "b": 9, "w": 0.24224185993462533}, {"a": 0, "b": 10, "w": 0.3952524021417624}, {"a": 0, "b": 11, "w": 0.20047108251175272}, {"a": 0, "b": 12, "w": 6.446798650472374e-11}, {"a": 0, "b": 13, "w": 0.14884246573759186}, {"a": 0, "b": 14, "w": 0.1299400453515821}, {"a": 0, "b": 15, "w": 0.16383685085831778}, {"a": 0, "b": 16, "w": 0.18029672033974398}, {"a": 0, "b": 17, "w": 0.12390733319857317}, {"a": 0, "b": 18, "w": 0.11164261516484952}, {"a": 0, "b": 19, "w": 0.1738906132135477}, {"a": 0, "b": 20, "w": 0.1425290621361116}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.869,hiY=-0.455;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
