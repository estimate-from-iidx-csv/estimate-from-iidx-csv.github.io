<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Don't believe the hype [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.917, "c": "種", "n": "Don't believe the hype [A]  n=2210 cos1.00 難1.92", "s": 0.669, "f": 0}, {"x": 0.977, "y": 1.868, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.98 難1.87", "s": 0.638, "f": 0}, {"x": 0.976, "y": 1.889, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [A]  n=3048 cos0.98 難1.89", "s": 0.922, "f": 0}, {"x": 0.976, "y": 1.94, "c": "近傍", "n": "TOMAHAWK [A]  n=1925 cos0.98 難1.94", "s": 0.582, "f": 0}, {"x": 0.974, "y": 1.887, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3300 cos0.97 難1.89", "s": 0.998, "f": 0}, {"x": 0.974, "y": 1.992, "c": "近傍", "n": "LOCUS OF THE TRAVEL [A]  n=2105 cos0.97 難1.99", "s": 0.637, "f": 0}, {"x": 0.972, "y": 1.893, "c": "近傍", "n": "Level 3 [A]  n=2167 cos0.97 難1.89", "s": 0.656, "f": 0}, {"x": 0.974, "y": 1.801, "c": "近傍", "n": "Cult Invitation [A]  n=1265 cos0.97 難1.80", "s": 0.383, "f": 0}, {"x": 0.983, "y": 1.706, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [A]  n=2502 cos0.98 難1.71", "s": 0.757, "f": 0}, {"x": 0.975, "y": 2.079, "c": "近傍", "n": "CODE:0 [L]  n=1250 cos0.98 難2.08", "s": 0.378, "f": 0}, {"x": 0.966, "y": 1.77, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3148 cos0.97 難1.77", "s": 0.952, "f": 0}, {"x": 0.962, "y": 1.968, "c": "近傍", "n": "VOX UP [A]  n=2951 cos0.96 難1.97", "s": 0.893, "f": 0}, {"x": 0.968, "y": 1.738, "c": "近傍", "n": "Dynamite [A]  n=3305 cos0.97 難1.74", "s": 1.0, "f": 0}, {"x": 0.985, "y": 1.608, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2757 cos0.98 難1.61", "s": 0.834, "f": 0}, {"x": 0.973, "y": 1.674, "c": "近傍", "n": "Purple Perplex [A]  n=2233 cos0.97 難1.67", "s": 0.676, "f": 0}, {"x": 0.965, "y": 1.706, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1570 cos0.97 難1.71", "s": 0.475, "f": 0}, {"x": 0.975, "y": 2.214, "c": "近傍", "n": "Lords Of The Roundtable [A]  n=2510 cos0.97 難2.21", "s": 0.759, "f": 0}, {"x": 0.961, "y": 1.771, "c": "近傍", "n": "Antigravity [A]  n=2890 cos0.96 難1.77", "s": 0.874, "f": 0}, {"x": 0.957, "y": 1.967, "c": "近傍", "n": "The Chase [A]  n=3116 cos0.96 難1.97", "s": 0.943, "f": 0}, {"x": 0.957, "y": 2.02, "c": "近傍", "n": "HEROES [A]  n=577 cos0.96 難2.02", "s": 0.175, "f": 0}, {"x": 0.968, "y": 1.651, "c": "近傍", "n": "Macho Monky [A]  n=2727 cos0.97 難1.65", "s": 0.825, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3015234219690961}, {"a": 0, "b": 2, "w": 0.29216152946644625}, {"a": 0, "b": 3, "w": 0.24505180683319527}, {"a": 0, "b": 4, "w": 0.17859470454121418}, {"a": 0, "b": 5, "w": 0.22307365842818572}, {"a": 0, "b": 6, "w": 0.16205899202882945}, {"a": 0, "b": 7, "w": 0.2569418685147761}, {"a": 0, "b": 8, "w": 0.398762139285176}, {"a": 0, "b": 9, "w": 0.27866537188536167}, {"a": 0, "b": 10, "w": 0.15769647432638834}, {"a": 0, "b": 11, "w": 0.11207451206370067}, {"a": 0, "b": 12, "w": 0.15248737589502548}, {"a": 0, "b": 13, "w": 0.41332142533123584}, {"a": 0, "b": 14, "w": 0.20858022536467902}, {"a": 0, "b": 15, "w": 0.14639454596715484}, {"a": 0, "b": 16, "w": 0.26378954815173405}, {"a": 0, "b": 17, "w": 0.0003581137448334104}, {"a": 0, "b": 18, "w": 1.996025567052584e-11}, {"a": 0, "b": 19, "w": 0.035866107735701536}, {"a": 0, "b": 20, "w": 0.160044750077598}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.953,hiX=1.003,loY=1.559,hiY=2.262;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
