<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SOLITON BEAM [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.594, "c": "種", "n": "SOLITON BEAM [H]  n=1733 cos1.00 難-0.59", "s": 0.494, "f": 0}, {"x": 0.995, "y": -0.595, "c": "近傍", "n": "SHADE [H]  n=2551 cos0.99 難-0.60", "s": 0.727, "f": 0}, {"x": 0.994, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos0.99 難-0.61", "s": 0.516, "f": 0}, {"x": 0.993, "y": -0.611, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.61", "s": 0.677, "f": 0}, {"x": 0.993, "y": -0.642, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3469 cos0.99 難-0.64", "s": 0.989, "f": 0}, {"x": 0.993, "y": -0.59, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.59", "s": 0.74, "f": 0}, {"x": 0.993, "y": -0.73, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.73", "s": 0.517, "f": 0}, {"x": 0.992, "y": -0.613, "c": "近傍", "n": "黒髪乱れし修羅となりて [H]  n=3133 cos0.99 難-0.61", "s": 0.893, "f": 0}, {"x": 0.993, "y": -0.733, "c": "近傍", "n": "spiral galaxy [H]  n=1851 cos0.99 難-0.73", "s": 0.528, "f": 0}, {"x": 0.991, "y": -0.589, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2537 cos0.99 難-0.59", "s": 0.723, "f": 0}, {"x": 0.994, "y": -0.78, "c": "近傍", "n": "Broken [H]  n=3149 cos0.99 難-0.78", "s": 0.897, "f": 0}, {"x": 0.995, "y": -0.374, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos1.00 難-0.37", "s": 0.731, "f": 0}, {"x": 0.99, "y": -0.623, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.62", "s": 0.729, "f": 0}, {"x": 0.99, "y": -0.662, "c": "近傍", "n": "WONDER WALKER [H]  n=2628 cos0.99 難-0.66", "s": 0.749, "f": 0}, {"x": 0.993, "y": -0.4, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos0.99 難-0.40", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.609, "c": "近傍", "n": "lower world [H]  n=1414 cos0.99 難-0.61", "s": 0.403, "f": 0}, {"x": 0.992, "y": -0.78, "c": "近傍", "n": "dAuntl3ss [H]  n=1995 cos0.99 難-0.78", "s": 0.569, "f": 0}, {"x": 0.99, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 0.856, "f": 0}, {"x": 0.991, "y": -0.729, "c": "近傍", "n": "ZERO-ONE [H]  n=1904 cos0.99 難-0.73", "s": 0.543, "f": 0}, {"x": 0.993, "y": -0.814, "c": "近傍", "n": "Violet Rose [H]  n=1476 cos0.99 難-0.81", "s": 0.421, "f": 0}, {"x": 0.989, "y": -0.642, "c": "近傍", "n": "ANTHEM LANDING [H]  n=2379 cos0.99 難-0.64", "s": 0.678, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.29797817542898486}, {"a": 0, "b": 2, "w": 0.25526677412562515}, {"a": 0, "b": 3, "w": 0.2240451039428989}, {"a": 0, "b": 4, "w": 0.22795094853094144}, {"a": 0, "b": 5, "w": 0.03207925679865098}, {"a": 0, "b": 6, "w": 0.2123471719787503}, {"a": 0, "b": 7, "w": 0.12275892410818612}, {"a": 0, "b": 8, "w": 0.21557683711994646}, {"a": 0, "b": 9, "w": 0.052183666464225675}, {"a": 0, "b": 10, "w": 0.26348136043831305}, {"a": 0, "b": 11, "w": 0.1373639424179366}, {"a": 0, "b": 12, "w": 0.034793431480194204}, {"a": 0, "b": 13, "w": 0.09077668097972325}, {"a": 0, "b": 14, "w": 0.15188619120873403}, {"a": 0, "b": 15, "w": 0.04537163669859168}, {"a": 0, "b": 16, "w": 0.18170868516039196}, {"a": 0, "b": 17, "w": 7.099165699742116e-11}, {"a": 0, "b": 18, "w": 0.0957275168019015}, {"a": 0, "b": 19, "w": 0.09072915782667001}, {"a": 0, "b": 20, "w": 0.03536235047040226}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.849,hiY=-0.339;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
