<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">取り残された美術(Arranged:HiZuMi) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.225, "c": "種", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3406 cos1.00 難-0.23", "s": 0.914, "f": 0}, {"x": 0.996, "y": -0.142, "c": "近傍", "n": "Ascalon [A]  n=3050 cos1.00 難-0.14", "s": 0.819, "f": 0}, {"x": 0.996, "y": -0.156, "c": "近傍", "n": "Chemical Cookie [A]  n=3322 cos1.00 難-0.16", "s": 0.892, "f": 0}, {"x": 0.995, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos1.00 難-0.23", "s": 0.735, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.19", "s": 0.761, "f": 0}, {"x": 0.996, "y": -0.125, "c": "近傍", "n": "Agnus Dei [A]  n=2682 cos1.00 難-0.13", "s": 0.72, "f": 0}, {"x": 0.995, "y": -0.214, "c": "近傍", "n": "smooooch・∀・ [A]  n=3726 cos0.99 難-0.21", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.164, "c": "近傍", "n": "HIGH [A]  n=2329 cos0.99 難-0.16", "s": 0.625, "f": 0}, {"x": 0.995, "y": -0.125, "c": "近傍", "n": "passionate fate [A]  n=3195 cos0.99 難-0.13", "s": 0.857, "f": 0}, {"x": 0.997, "y": -0.394, "c": "近傍", "n": "ポラリスノウタ [A]  n=1797 cos1.00 難-0.39", "s": 0.482, "f": 0}, {"x": 0.993, "y": -0.188, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.19", "s": 0.747, "f": 0}, {"x": 0.996, "y": -0.399, "c": "近傍", "n": "白露の風 [A]  n=3057 cos1.00 難-0.40", "s": 0.82, "f": 0}, {"x": 0.996, "y": -0.401, "c": "近傍", "n": "LADS [A]  n=1941 cos1.00 難-0.40", "s": 0.521, "f": 0}, {"x": 0.993, "y": -0.156, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.16", "s": 0.8, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "ビューティフルレシート [A]  n=3314 cos0.99 難-0.08", "s": 0.889, "f": 0}, {"x": 0.995, "y": -0.382, "c": "近傍", "n": "Drive Me Crazy [A]  n=3472 cos0.99 難-0.38", "s": 0.932, "f": 0}, {"x": 0.993, "y": -0.263, "c": "近傍", "n": "梅雪夜 [A]  n=3414 cos0.99 難-0.26", "s": 0.916, "f": 0}, {"x": 0.995, "y": -0.063, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難-0.06", "s": 0.835, "f": 0}, {"x": 0.993, "y": -0.167, "c": "近傍", "n": "Love Me Do [A]  n=2506 cos0.99 難-0.17", "s": 0.673, "f": 0}, {"x": 0.994, "y": -0.36, "c": "近傍", "n": "Sweet Radar [A]  n=3516 cos0.99 難-0.36", "s": 0.944, "f": 0}, {"x": 0.992, "y": -0.275, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos0.99 難-0.27", "s": 0.924, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.38934158906966376}, {"a": 0, "b": 2, "w": 0.3588688109733168}, {"a": 0, "b": 3, "w": 0.3159015529123581}, {"a": 0, "b": 4, "w": 0.25224388010777365}, {"a": 0, "b": 5, "w": 0.35406575717778377}, {"a": 0, "b": 6, "w": 0.2689706165038167}, {"a": 0, "b": 7, "w": 0.3066588984691888}, {"a": 0, "b": 8, "w": 0.2895644548075983}, {"a": 0, "b": 9, "w": 0.4407036845015906}, {"a": 0, "b": 10, "w": 0.21637801296302162}, {"a": 0, "b": 11, "w": 0.31435534543721877}, {"a": 0, "b": 12, "w": 0.34465820964494553}, {"a": 0, "b": 13, "w": 0.21420116717749937}, {"a": 0, "b": 14, "w": 0.29514954835243457}, {"a": 0, "b": 15, "w": 0.288725181030561}, {"a": 0, "b": 16, "w": 0.20378002679420149}, {"a": 0, "b": 17, "w": 0.29572049943832146}, {"a": 0, "b": 18, "w": 0.019387810386517157}, {"a": 0, "b": 19, "w": 6.702449706352809e-11}, {"a": 0, "b": 20, "w": 0.13666116044530885}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.428,hiY=-0.036;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
