<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">JUST SYNC ft.Kanae Asaba [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.704, "c": "種", "n": "JUST SYNC ft.Kanae Asaba [A]  n=996 cos1.00 難-0.70", "s": 0.28, "f": 0}, {"x": 0.997, "y": -0.822, "c": "近傍", "n": "HEISEI [H]  n=2018 cos1.00 難-0.82", "s": 0.566, "f": 0}, {"x": 0.995, "y": -0.586, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos0.99 難-0.59", "s": 0.443, "f": 0}, {"x": 0.993, "y": -0.635, "c": "近傍", "n": "PALETTE [A]  n=1098 cos0.99 難-0.63", "s": 0.308, "f": 0}, {"x": 0.993, "y": -0.584, "c": "近傍", "n": "Dreamship [A]  n=1395 cos0.99 難-0.58", "s": 0.392, "f": 0}, {"x": 0.991, "y": -0.747, "c": "近傍", "n": "イガク [A]  n=1533 cos0.99 難-0.75", "s": 0.43, "f": 0}, {"x": 0.993, "y": -0.546, "c": "近傍", "n": "エクスプロウル [A]  n=1133 cos0.99 難-0.55", "s": 0.318, "f": 0}, {"x": 0.991, "y": -0.793, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.79", "s": 0.504, "f": 0}, {"x": 0.993, "y": -0.534, "c": "近傍", "n": "犬に雨傘 [A]  n=2124 cos0.99 難-0.53", "s": 0.596, "f": 0}, {"x": 0.991, "y": -0.613, "c": "近傍", "n": "れとりば！ [A]  n=1676 cos0.99 難-0.61", "s": 0.47, "f": 0}, {"x": 0.992, "y": -0.845, "c": "近傍", "n": "凛として咲く花の如く [H]  n=3267 cos0.99 難-0.85", "s": 0.917, "f": 0}, {"x": 0.992, "y": -0.537, "c": "近傍", "n": "Far east nightbird [A]  n=3200 cos0.99 難-0.54", "s": 0.898, "f": 0}, {"x": 0.99, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.59", "s": 0.727, "f": 0}, {"x": 0.99, "y": -0.754, "c": "近傍", "n": "LEMON MELON COOKIE [A]  n=1087 cos0.99 難-0.75", "s": 0.305, "f": 0}, {"x": 0.994, "y": -0.458, "c": "近傍", "n": "未来のプリズム [A]  n=2668 cos0.99 難-0.46", "s": 0.749, "f": 0}, {"x": 0.989, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.71, "f": 0}, {"x": 0.99, "y": -0.612, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos0.99 難-0.61", "s": 0.485, "f": 0}, {"x": 0.99, "y": -0.588, "c": "近傍", "n": "シル・ヴ・プレジデント [A]  n=2829 cos0.99 難-0.59", "s": 0.794, "f": 0}, {"x": 0.991, "y": -0.513, "c": "近傍", "n": "ANEMONE [A]  n=2527 cos0.99 難-0.51", "s": 0.709, "f": 0}, {"x": 0.989, "y": -0.638, "c": "近傍", "n": "Element of SPADA [A]  n=3563 cos0.99 難-0.64", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.74, "c": "近傍", "n": "memories [H]  n=1669 cos0.99 難-0.74", "s": 0.468, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5509662511067961}, {"a": 0, "b": 2, "w": 0.27833361834924986}, {"a": 0, "b": 3, "w": 0.3732765233225013}, {"a": 0, "b": 4, "w": 0.09280133911047328}, {"a": 0, "b": 5, "w": 0.24666950237772467}, {"a": 0, "b": 6, "w": 0.28381447980600305}, {"a": 0, "b": 7, "w": 0.06001216330138359}, {"a": 0, "b": 8, "w": 0.34325146025264563}, {"a": 0, "b": 9, "w": 0.2814047350712595}, {"a": 0, "b": 10, "w": 0.2719767954621646}, {"a": 0, "b": 11, "w": 0.2691578581423777}, {"a": 0, "b": 12, "w": 0.2560163403684471}, {"a": 0, "b": 13, "w": 0.2223562760740717}, {"a": 0, "b": 14, "w": 0.23788663953312517}, {"a": 0, "b": 15, "w": 0.21165284206739587}, {"a": 0, "b": 16, "w": 5.570688355049924e-11}, {"a": 0, "b": 17, "w": 0.24113184431867463}, {"a": 0, "b": 18, "w": 0.2671692324616649}, {"a": 0, "b": 19, "w": 0.08522711199726019}, {"a": 0, "b": 20, "w": 0.19479059845059976}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.876,hiY=-0.427;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
