<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SISYPHUS [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.816, "c": "種", "n": "SISYPHUS [H]  n=460 cos1.00 難-0.82", "s": 0.156, "f": 0}, {"x": 0.992, "y": -0.864, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1998 cos0.99 難-0.86", "s": 0.678, "f": 0}, {"x": 0.99, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.81", "s": 0.634, "f": 0}, {"x": 0.99, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.596, "f": 0}, {"x": 0.991, "y": -0.702, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.70", "s": 0.771, "f": 0}, {"x": 0.99, "y": -0.86, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.86", "s": 0.773, "f": 0}, {"x": 0.99, "y": -0.92, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.99 難-0.92", "s": 0.762, "f": 0}, {"x": 0.989, "y": -0.711, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.71", "s": 0.689, "f": 0}, {"x": 0.992, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos0.99 難-1.01", "s": 0.64, "f": 0}, {"x": 0.988, "y": -0.831, "c": "近傍", "n": "GOLD RUSH [H]  n=2945 cos0.99 難-0.83", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.99 難-0.89", "s": 0.78, "f": 0}, {"x": 0.989, "y": -0.682, "c": "近傍", "n": "One More Lovely [H]  n=2531 cos0.99 難-0.68", "s": 0.859, "f": 0}, {"x": 0.986, "y": -0.873, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.99 難-0.87", "s": 0.72, "f": 0}, {"x": 0.987, "y": -0.976, "c": "近傍", "n": "TRIP MACHINE PhoeniX [H]  n=640 cos0.99 難-0.98", "s": 0.217, "f": 0}, {"x": 0.987, "y": -0.975, "c": "近傍", "n": "Hello Happiness [H]  n=2032 cos0.99 難-0.98", "s": 0.69, "f": 0}, {"x": 0.986, "y": -0.899, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos0.99 難-0.90", "s": 0.762, "f": 0}, {"x": 0.986, "y": -0.7, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.551, "f": 0}, {"x": 0.985, "y": -0.796, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.99 難-0.80", "s": 0.726, "f": 0}, {"x": 0.991, "y": -1.095, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.99 難-1.09", "s": 0.662, "f": 0}, {"x": 0.985, "y": -0.797, "c": "近傍", "n": "Empire of Fury [H]  n=1653 cos0.98 難-0.80", "s": 0.561, "f": 0}, {"x": 0.985, "y": -0.765, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.98 難-0.77", "s": 0.774, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3529735206924238}, {"a": 0, "b": 2, "w": 0.18437461169296065}, {"a": 0, "b": 3, "w": 0.2954502913087571}, {"a": 0, "b": 4, "w": 0.3083727127283711}, {"a": 0, "b": 5, "w": 0.18058460113675467}, {"a": 0, "b": 6, "w": 0.10350386862710192}, {"a": 0, "b": 7, "w": 0.20027068383997293}, {"a": 0, "b": 8, "w": 0.3642146900060018}, {"a": 0, "b": 9, "w": 0.1398945497447487}, {"a": 0, "b": 10, "w": 0.05731659859445071}, {"a": 0, "b": 11, "w": 0.18544020082984025}, {"a": 0, "b": 12, "w": 0.17975231070897346}, {"a": 0, "b": 13, "w": 0.29055902616595497}, {"a": 0, "b": 14, "w": 0.3028176633636649}, {"a": 0, "b": 15, "w": 0.09515008355395915}, {"a": 0, "b": 16, "w": 0.0518385874997237}, {"a": 0, "b": 17, "w": 0.16375406428788297}, {"a": 0, "b": 18, "w": 0.3440491451781632}, {"a": 0, "b": 19, "w": 0.245064583307109}, {"a": 0, "b": 20, "w": 4.3605341559782573e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.128,hiY=-0.649;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
