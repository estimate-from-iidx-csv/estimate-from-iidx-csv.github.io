<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BattleRoyal [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.239, "c": "種", "n": "BattleRoyal [A]  n=1038 cos1.00 難0.24", "s": 0.312, "f": 0}, {"x": 0.996, "y": -0.038, "c": "近傍", "n": "Caldwell 99 [A]  n=1673 cos1.00 難-0.04", "s": 0.502, "f": 0}, {"x": 0.992, "y": 0.267, "c": "近傍", "n": "Temple of Anubis [A]  n=3259 cos0.99 難0.27", "s": 0.979, "f": 0}, {"x": 0.993, "y": -0.015, "c": "近傍", "n": "Musik LoverZ [A]  n=3119 cos0.99 難-0.02", "s": 0.937, "f": 0}, {"x": 0.993, "y": -0.004, "c": "近傍", "n": "GRADIUS 2012 [A]  n=2997 cos0.99 難-0.00", "s": 0.9, "f": 0}, {"x": 0.99, "y": 0.338, "c": "近傍", "n": "BREAK OVER [A]  n=3009 cos0.99 難0.34", "s": 0.904, "f": 0}, {"x": 0.99, "y": 0.377, "c": "近傍", "n": "Aublia [A]  n=3096 cos0.99 難0.38", "s": 0.93, "f": 0}, {"x": 0.989, "y": 0.279, "c": "近傍", "n": "Around the Future [A]  n=3149 cos0.99 難0.28", "s": 0.946, "f": 0}, {"x": 0.992, "y": -0.136, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3090 cos0.99 難-0.14", "s": 0.928, "f": 0}, {"x": 0.989, "y": 0.101, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.10", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.105, "c": "近傍", "n": "Space Time [A]  n=2797 cos0.99 難-0.11", "s": 0.84, "f": 0}, {"x": 0.991, "y": -0.126, "c": "近傍", "n": "Programmed Life [A]  n=2777 cos0.99 難-0.13", "s": 0.834, "f": 0}, {"x": 0.989, "y": -0.026, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos0.99 難-0.03", "s": 0.715, "f": 0}, {"x": 0.989, "y": 0.042, "c": "近傍", "n": "Static State [A]  n=2845 cos0.99 難0.04", "s": 0.854, "f": 0}, {"x": 0.991, "y": -0.15, "c": "近傍", "n": "Neonlights [A]  n=3013 cos0.99 難-0.15", "s": 0.905, "f": 0}, {"x": 0.99, "y": -0.081, "c": "近傍", "n": "Nowhere [A]  n=2750 cos0.99 難-0.08", "s": 0.826, "f": 0}, {"x": 0.991, "y": -0.182, "c": "近傍", "n": "BLACK JACKAL [A]  n=2469 cos0.99 難-0.18", "s": 0.741, "f": 0}, {"x": 0.991, "y": -0.175, "c": "近傍", "n": "Shiva [A]  n=3026 cos0.99 難-0.17", "s": 0.909, "f": 0}, {"x": 0.987, "y": 0.306, "c": "近傍", "n": "Abraxas [A]  n=3305 cos0.99 難0.31", "s": 0.992, "f": 0}, {"x": 0.987, "y": 0.255, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos0.99 難0.25", "s": 0.974, "f": 0}, {"x": 0.991, "y": -0.193, "c": "近傍", "n": "Glory [A]  n=2168 cos0.99 難-0.19", "s": 0.651, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5185627930794079}, {"a": 0, "b": 2, "w": 0.5055741147757269}, {"a": 0, "b": 3, "w": 0.47050716683199956}, {"a": 0, "b": 4, "w": 0.5497952730580808}, {"a": 0, "b": 5, "w": 0.39946777743097384}, {"a": 0, "b": 6, "w": 0.45199712124657}, {"a": 0, "b": 7, "w": 0.4456113125340192}, {"a": 0, "b": 8, "w": 0.24436003684648222}, {"a": 0, "b": 9, "w": 0.33507576056570687}, {"a": 0, "b": 10, "w": 0.12543576869672712}, {"a": 0, "b": 11, "w": 0.28306053290608035}, {"a": 0, "b": 12, "w": 0.41873270186132894}, {"a": 0, "b": 13, "w": 0.35820087026213887}, {"a": 0, "b": 14, "w": 0.26610467367858204}, {"a": 0, "b": 15, "w": 0.17696467115371917}, {"a": 0, "b": 16, "w": 0.4661667256330756}, {"a": 0, "b": 17, "w": 0.3438159989941476}, {"a": 0, "b": 18, "w": 0.4043279340469953}, {"a": 0, "b": 19, "w": 3.051148222965594e-11}, {"a": 0, "b": 20, "w": 0.19563101349014878}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.238,hiY=0.423;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
