<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Golden Horn [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.097, "c": "種", "n": "Golden Horn [A]  n=1924 cos1.00 難-0.10", "s": 0.591, "f": 0}, {"x": 0.99, "y": -0.067, "c": "近傍", "n": "SA.YO.NA.RA. SUPER STAR [A]  n=2911 cos0.99 難-0.07", "s": 0.894, "f": 0}, {"x": 0.992, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.99 難-0.26", "s": 0.954, "f": 0}, {"x": 0.991, "y": -0.234, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.99 難-0.23", "s": 0.71, "f": 0}, {"x": 0.99, "y": -0.247, "c": "近傍", "n": "RESONATE 1794 [H]  n=2277 cos0.99 難-0.25", "s": 0.699, "f": 0}, {"x": 0.99, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.733, "f": 0}, {"x": 0.988, "y": -0.195, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.99 難-0.20", "s": 0.804, "f": 0}, {"x": 0.987, "y": -0.183, "c": "近傍", "n": "RISE [A]  n=3105 cos0.99 難-0.18", "s": 0.953, "f": 0}, {"x": 0.99, "y": -0.283, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.99 難-0.28", "s": 0.818, "f": 0}, {"x": 0.988, "y": -0.244, "c": "近傍", "n": "Don't let it go [A]  n=1279 cos0.99 難-0.24", "s": 0.393, "f": 0}, {"x": 0.991, "y": -0.327, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.99 難-0.33", "s": 0.767, "f": 0}, {"x": 0.986, "y": -0.175, "c": "近傍", "n": "Freezing atmosphere [A]  n=2166 cos0.99 難-0.17", "s": 0.665, "f": 0}, {"x": 0.995, "y": -0.384, "c": "近傍", "n": "Clione [A]  n=2774 cos0.99 難-0.38", "s": 0.852, "f": 0}, {"x": 0.988, "y": 0.102, "c": "近傍", "n": "Narcissus At Oasis [A]  n=2841 cos0.99 難0.10", "s": 0.872, "f": 0}, {"x": 0.986, "y": -0.237, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos0.99 難-0.24", "s": 0.395, "f": 0}, {"x": 0.987, "y": -0.262, "c": "近傍", "n": "minimalian [A]  n=2136 cos0.99 難-0.26", "s": 0.656, "f": 0}, {"x": 0.989, "y": -0.329, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.209, "c": "近傍", "n": "1st Samurai [H]  n=2308 cos0.98 難-0.21", "s": 0.709, "f": 0}, {"x": 0.984, "y": -0.122, "c": "近傍", "n": "If [A]  n=2170 cos0.98 難-0.12", "s": 0.666, "f": 0}, {"x": 0.984, "y": -0.164, "c": "近傍", "n": "vault of heaven [A]  n=2936 cos0.98 難-0.16", "s": 0.901, "f": 0}, {"x": 0.989, "y": -0.355, "c": "近傍", "n": "Adularia [H]  n=3011 cos0.99 難-0.36", "s": 0.924, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.17313127481490942}, {"a": 0, "b": 2, "w": 0.44303405738094515}, {"a": 0, "b": 3, "w": 0.09610344430459417}, {"a": 0, "b": 4, "w": 0.5080930845381586}, {"a": 0, "b": 5, "w": 0.4793113799074349}, {"a": 0, "b": 6, "w": 3.961131422869357e-11}, {"a": 0, "b": 7, "w": 0.1284375230164222}, {"a": 0, "b": 8, "w": 0.046838048727050774}, {"a": 0, "b": 9, "w": 0.3868122216613915}, {"a": 0, "b": 10, "w": 0.5126722769158228}, {"a": 0, "b": 11, "w": 0.39045487540684054}, {"a": 0, "b": 12, "w": 0.6324503855948029}, {"a": 0, "b": 13, "w": 0.2228160653874831}, {"a": 0, "b": 14, "w": 0.36348891954946694}, {"a": 0, "b": 15, "w": 0.422079681458021}, {"a": 0, "b": 16, "w": 0.09317479011602203}, {"a": 0, "b": 17, "w": 0.10467766746334095}, {"a": 0, "b": 18, "w": 0.07100419092465804}, {"a": 0, "b": 19, "w": 0.18581951099000782}, {"a": 0, "b": 20, "w": 0.30728319288503136}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-0.423,hiY=0.141;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
