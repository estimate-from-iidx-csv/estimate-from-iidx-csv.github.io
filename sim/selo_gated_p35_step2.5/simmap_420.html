<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MOON [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.763, "c": "種", "n": "MOON [H]  n=1890 cos1.00 難-0.76", "s": 0.729, "f": 0}, {"x": 0.996, "y": -0.747, "c": "近傍", "n": "イガク [A]  n=1533 cos1.00 難-0.75", "s": 0.591, "f": 0}, {"x": 0.998, "y": -0.899, "c": "近傍", "n": "Time To Empress [H]  n=2245 cos1.00 難-0.90", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.691, "c": "近傍", "n": "鏡像都市 [A]  n=902 cos0.99 難-0.69", "s": 0.348, "f": 0}, {"x": 0.994, "y": -0.761, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1850 cos0.99 難-0.76", "s": 0.714, "f": 0}, {"x": 0.997, "y": -0.612, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1728 cos1.00 難-0.61", "s": 0.667, "f": 0}, {"x": 0.993, "y": -0.711, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.71", "s": 0.783, "f": 0}, {"x": 0.993, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.99 難-0.81", "s": 0.72, "f": 0}, {"x": 0.993, "y": -0.667, "c": "近傍", "n": "可愛くてごめん [A]  n=1842 cos0.99 難-0.67", "s": 0.711, "f": 0}, {"x": 0.992, "y": -0.766, "c": "近傍", "n": "Believe In Me [H]  n=1756 cos0.99 難-0.77", "s": 0.677, "f": 0}, {"x": 0.996, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos1.00 難-0.59", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.754, "c": "近傍", "n": "LEMON MELON COOKIE [A]  n=1087 cos0.99 難-0.75", "s": 0.419, "f": 0}, {"x": 0.993, "y": -0.894, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2287 cos0.99 難-0.89", "s": 0.882, "f": 0}, {"x": 0.992, "y": -0.823, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.99 難-0.82", "s": 0.972, "f": 0}, {"x": 0.993, "y": -0.873, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.99 難-0.87", "s": 0.818, "f": 0}, {"x": 0.994, "y": -0.584, "c": "近傍", "n": "Dreamship [A]  n=1395 cos0.99 難-0.58", "s": 0.538, "f": 0}, {"x": 0.991, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.976, "f": 0}, {"x": 0.992, "y": -0.865, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1828 cos0.99 難-0.86", "s": 0.705, "f": 0}, {"x": 0.994, "y": -0.956, "c": "近傍", "n": "Elektrick U-Phoria [H]  n=2155 cos0.99 難-0.96", "s": 0.831, "f": 0}, {"x": 0.993, "y": -0.586, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos0.99 難-0.59", "s": 0.609, "f": 0}, {"x": 0.992, "y": -0.637, "c": "近傍", "n": "Shooting Star [A]  n=1062 cos0.99 難-0.64", "s": 0.41, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5451692968601793}, {"a": 0, "b": 2, "w": 0.6346677200161226}, {"a": 0, "b": 3, "w": 0.4867983190511993}, {"a": 0, "b": 4, "w": 0.3124450705644295}, {"a": 0, "b": 5, "w": 0.5191091465304418}, {"a": 0, "b": 6, "w": 0.40676018836205363}, {"a": 0, "b": 7, "w": 0.38205550998931215}, {"a": 0, "b": 8, "w": 0.39805961162654946}, {"a": 0, "b": 9, "w": 0.36407150024109014}, {"a": 0, "b": 10, "w": 0.45578103227726063}, {"a": 0, "b": 11, "w": 0.31248290812956137}, {"a": 0, "b": 12, "w": 0.3601327339778517}, {"a": 0, "b": 13, "w": 5.64818192216876e-11}, {"a": 0, "b": 14, "w": 0.38699612777976056}, {"a": 0, "b": 15, "w": 0.3992222421333447}, {"a": 0, "b": 16, "w": 0.2840456826718204}, {"a": 0, "b": 17, "w": 0.3580244009235748}, {"a": 0, "b": 18, "w": 0.44720901067294083}, {"a": 0, "b": 19, "w": 0.4076222722339341}, {"a": 0, "b": 20, "w": 0.2465492159751358}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.986,hiY=-0.554;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
