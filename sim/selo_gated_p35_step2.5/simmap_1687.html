<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">おおきなこえで [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.244, "c": "種", "n": "おおきなこえで [L]  n=2619 cos1.00 難-0.24", "s": 0.739, "f": 0}, {"x": 0.994, "y": -0.371, "c": "近傍", "n": "エディブルフラワーの独白 [A]  n=3305 cos0.99 難-0.37", "s": 0.932, "f": 0}, {"x": 0.992, "y": -0.185, "c": "近傍", "n": "Rainbow after snow [A]  n=3289 cos0.99 難-0.19", "s": 0.928, "f": 0}, {"x": 0.993, "y": -0.385, "c": "近傍", "n": "satfinal [A]  n=2973 cos0.99 難-0.39", "s": 0.838, "f": 0}, {"x": 0.992, "y": -0.334, "c": "近傍", "n": "And-RoiD [A]  n=2213 cos0.99 難-0.33", "s": 0.624, "f": 0}, {"x": 0.992, "y": -0.381, "c": "近傍", "n": "chrono diver -fragment- [L]  n=3546 cos0.99 難-0.38", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.278, "c": "近傍", "n": "Claiomh Solais [A]  n=2511 cos0.99 難-0.28", "s": 0.708, "f": 0}, {"x": 0.993, "y": -0.513, "c": "近傍", "n": "ANEMONE [A]  n=2527 cos0.99 難-0.51", "s": 0.713, "f": 0}, {"x": 0.99, "y": -0.397, "c": "近傍", "n": "being torn the sky [A]  n=3407 cos0.99 難-0.40", "s": 0.961, "f": 0}, {"x": 0.99, "y": -0.4, "c": "近傍", "n": "SURVIVOR [A]  n=2829 cos0.99 難-0.40", "s": 0.798, "f": 0}, {"x": 0.989, "y": -0.377, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos0.99 難-0.38", "s": 0.936, "f": 0}, {"x": 0.989, "y": -0.339, "c": "近傍", "n": "Hurry Hurry [A]  n=2879 cos0.99 難-0.34", "s": 0.812, "f": 0}, {"x": 0.99, "y": -0.457, "c": "近傍", "n": "Only for now [A]  n=3200 cos0.99 難-0.46", "s": 0.902, "f": 0}, {"x": 0.988, "y": -0.356, "c": "近傍", "n": "タシカナモノ [A]  n=2492 cos0.99 難-0.36", "s": 0.703, "f": 0}, {"x": 0.989, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.99 難-0.43", "s": 0.847, "f": 0}, {"x": 0.988, "y": -0.191, "c": "近傍", "n": "Believe in you [A]  n=3061 cos0.99 難-0.19", "s": 0.863, "f": 0}, {"x": 0.988, "y": -0.226, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2790 cos0.99 難-0.23", "s": 0.787, "f": 0}, {"x": 0.992, "y": -0.59, "c": "近傍", "n": "Riff//rain [A]  n=1288 cos0.99 難-0.59", "s": 0.363, "f": 0}, {"x": 0.988, "y": -0.377, "c": "近傍", "n": "Shining World [A]  n=3141 cos0.99 難-0.38", "s": 0.886, "f": 0}, {"x": 0.988, "y": -0.385, "c": "近傍", "n": "BRIDAL FESTIVAL !!! [A]  n=2637 cos0.99 難-0.39", "s": 0.744, "f": 0}, {"x": 0.988, "y": -0.358, "c": "近傍", "n": "S-Bahn [A]  n=2156 cos0.99 難-0.36", "s": 0.608, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36753919118820033}, {"a": 0, "b": 2, "w": 0.29116334569234203}, {"a": 0, "b": 3, "w": 0.20148693525182504}, {"a": 0, "b": 4, "w": 0.34383843377978196}, {"a": 0, "b": 5, "w": 0.34599590890311016}, {"a": 0, "b": 6, "w": 0.3020545592601027}, {"a": 0, "b": 7, "w": 0.3516293103976965}, {"a": 0, "b": 8, "w": 0.288552380496634}, {"a": 0, "b": 9, "w": 0.24107389044123073}, {"a": 0, "b": 10, "w": 0.23531390590443413}, {"a": 0, "b": 11, "w": 0.2394262452511009}, {"a": 0, "b": 12, "w": 0.262506467957068}, {"a": 0, "b": 13, "w": 0.21249943287399886}, {"a": 0, "b": 14, "w": 0.20116810201498714}, {"a": 0, "b": 15, "w": 0.15163989420476065}, {"a": 0, "b": 16, "w": 0.21329270397373523}, {"a": 0, "b": 17, "w": 0.1597829780266875}, {"a": 0, "b": 18, "w": 5.2477799883376974e-11}, {"a": 0, "b": 19, "w": 0.20729034941169477}, {"a": 0, "b": 20, "w": 0.13252050771947788}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.623,hiY=-0.153;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
