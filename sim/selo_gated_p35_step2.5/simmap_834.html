<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">end of world [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.015, "c": "種", "n": "end of world [A]  n=3010 cos1.00 難-0.01", "s": 0.805, "f": 0}, {"x": 0.997, "y": -0.001, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos1.00 難-0.00", "s": 1.0, "f": 0}, {"x": 0.998, "y": 0.045, "c": "近傍", "n": "405nm (Ryu☆mix) [A]  n=3619 cos1.00 難0.05", "s": 0.968, "f": 0}, {"x": 0.996, "y": -0.082, "c": "近傍", "n": "Chain of pain [A]  n=2993 cos1.00 難-0.08", "s": 0.8, "f": 0}, {"x": 0.995, "y": -0.028, "c": "近傍", "n": "ZERO-ONE [A]  n=2950 cos1.00 難-0.03", "s": 0.789, "f": 0}, {"x": 0.996, "y": -0.075, "c": "近傍", "n": "Hat Surprise [A]  n=2365 cos1.00 難-0.08", "s": 0.632, "f": 0}, {"x": 0.996, "y": -0.102, "c": "近傍", "n": "KAISER PHOENIX [H]  n=2581 cos1.00 難-0.10", "s": 0.69, "f": 0}, {"x": 0.995, "y": -0.062, "c": "近傍", "n": "NΦ CRIME [L]  n=1725 cos1.00 難-0.06", "s": 0.461, "f": 0}, {"x": 0.998, "y": 0.147, "c": "近傍", "n": "xenon [A]  n=3549 cos1.00 難0.15", "s": 0.949, "f": 0}, {"x": 0.995, "y": -0.123, "c": "近傍", "n": "Time To Empress [A]  n=3237 cos1.00 難-0.12", "s": 0.866, "f": 0}, {"x": 0.994, "y": -0.04, "c": "近傍", "n": "lower world [A]  n=2593 cos0.99 難-0.04", "s": 0.693, "f": 0}, {"x": 0.997, "y": -0.198, "c": "近傍", "n": "planarian [A]  n=2948 cos1.00 難-0.20", "s": 0.788, "f": 0}, {"x": 0.995, "y": 0.12, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos1.00 難0.12", "s": 0.932, "f": 0}, {"x": 0.993, "y": -0.028, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos0.99 難-0.03", "s": 0.284, "f": 0}, {"x": 0.996, "y": 0.175, "c": "近傍", "n": "Take My Life [A]  n=3360 cos1.00 難0.18", "s": 0.898, "f": 0}, {"x": 0.995, "y": 0.134, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos0.99 難0.13", "s": 0.447, "f": 0}, {"x": 0.993, "y": 0.039, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2824 cos0.99 難0.04", "s": 0.755, "f": 0}, {"x": 0.993, "y": 0.041, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.04", "s": 0.947, "f": 0}, {"x": 0.993, "y": 0.005, "c": "近傍", "n": "Danza Aestas [A]  n=2310 cos0.99 難0.01", "s": 0.618, "f": 0}, {"x": 0.993, "y": -0.061, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos0.99 難-0.06", "s": 0.97, "f": 0}, {"x": 0.993, "y": -0.009, "c": "近傍", "n": "DEEP ROAR [A]  n=1658 cos0.99 難-0.01", "s": 0.443, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5351507735785961}, {"a": 0, "b": 2, "w": 0.33481761782036323}, {"a": 0, "b": 3, "w": 0.47185654791515197}, {"a": 0, "b": 4, "w": 0.319422121328926}, {"a": 0, "b": 5, "w": 0.21281842943682272}, {"a": 0, "b": 6, "w": 0.4481714835055697}, {"a": 0, "b": 7, "w": 0.32584120707790776}, {"a": 0, "b": 8, "w": 0.49721930286438665}, {"a": 0, "b": 9, "w": 0.3739749015241963}, {"a": 0, "b": 10, "w": 0.3335908040735064}, {"a": 0, "b": 11, "w": 0.533133278782291}, {"a": 0, "b": 12, "w": 0.2778869359458921}, {"a": 0, "b": 13, "w": 0.1080735711298565}, {"a": 0, "b": 14, "w": 0.1074766298613371}, {"a": 0, "b": 15, "w": 0.1292780583119011}, {"a": 0, "b": 16, "w": 0.10986469999027004}, {"a": 0, "b": 17, "w": 0.2668425071438555}, {"a": 0, "b": 18, "w": 0.21787164722634533}, {"a": 0, "b": 19, "w": 0.0607701920883954}, {"a": 0, "b": 20, "w": 5.633915556302327e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.228,hiY=0.205;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
