<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Cyber Force [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.729, "c": "種", "n": "Cyber Force [H]  n=1937 cos1.00 難-0.73", "s": 0.545, "f": 0}, {"x": 0.994, "y": -0.642, "c": "近傍", "n": "ANTHEM LANDING [H]  n=2379 cos0.99 難-0.64", "s": 0.669, "f": 0}, {"x": 0.993, "y": -0.623, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.62", "s": 0.719, "f": 0}, {"x": 0.995, "y": -0.53, "c": "近傍", "n": "When I Met U [A]  n=2647 cos0.99 難-0.53", "s": 0.744, "f": 0}, {"x": 0.991, "y": -0.754, "c": "近傍", "n": "Quickening [H]  n=1508 cos0.99 難-0.75", "s": 0.424, "f": 0}, {"x": 0.993, "y": -0.584, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2283 cos0.99 難-0.58", "s": 0.642, "f": 0}, {"x": 0.991, "y": -0.73, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.73", "s": 0.51, "f": 0}, {"x": 0.996, "y": -0.477, "c": "近傍", "n": "OOO [A]  n=3557 cos1.00 難-0.48", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.498, "c": "近傍", "n": "神様、つれない。 [A]  n=1325 cos0.99 難-0.50", "s": 0.373, "f": 0}, {"x": 0.99, "y": -0.74, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.74", "s": 0.584, "f": 0}, {"x": 0.991, "y": -0.61, "c": "近傍", "n": "traces [H]  n=1627 cos0.99 難-0.61", "s": 0.457, "f": 0}, {"x": 0.994, "y": -0.462, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.46", "s": 0.95, "f": 0}, {"x": 0.99, "y": -0.589, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2537 cos0.99 難-0.59", "s": 0.713, "f": 0}, {"x": 0.989, "y": -0.729, "c": "近傍", "n": "Broken Sword [H]  n=2592 cos0.99 難-0.73", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.457, "c": "近傍", "n": "エコ爺 [A]  n=3109 cos0.99 難-0.46", "s": 0.874, "f": 0}, {"x": 0.989, "y": -0.608, "c": "近傍", "n": "Liberation [H]  n=2362 cos0.99 難-0.61", "s": 0.664, "f": 0}, {"x": 0.989, "y": -0.594, "c": "近傍", "n": "SOLITON BEAM [H]  n=1733 cos0.99 難-0.59", "s": 0.487, "f": 0}, {"x": 0.989, "y": -0.642, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3469 cos0.99 難-0.64", "s": 0.975, "f": 0}, {"x": 0.99, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.99 難-0.56", "s": 0.744, "f": 0}, {"x": 0.991, "y": -0.488, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos0.99 難-0.49", "s": 0.285, "f": 0}, {"x": 0.988, "y": -0.756, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2208 cos0.99 難-0.76", "s": 0.621, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3801229251236913}, {"a": 0, "b": 2, "w": 0.2838812678603846}, {"a": 0, "b": 3, "w": 0.4234834287794922}, {"a": 0, "b": 4, "w": 0.3229111816202025}, {"a": 0, "b": 5, "w": 0.40302427222073745}, {"a": 0, "b": 6, "w": 0.25324485465694213}, {"a": 0, "b": 7, "w": 0.4493738517727872}, {"a": 0, "b": 8, "w": 0.3399671535544039}, {"a": 0, "b": 9, "w": 0.23690191281449935}, {"a": 0, "b": 10, "w": 0.2659036986793334}, {"a": 0, "b": 11, "w": 0.3047710890019272}, {"a": 0, "b": 12, "w": 0.28915168422888515}, {"a": 0, "b": 13, "w": 0.04601403061401799}, {"a": 0, "b": 14, "w": 0.35701705434181263}, {"a": 0, "b": 15, "w": 0.16161335388436981}, {"a": 0, "b": 16, "w": 0.2372529844498038}, {"a": 0, "b": 17, "w": 0.22959439356083444}, {"a": 0, "b": 18, "w": 0.1332135864760895}, {"a": 0, "b": 19, "w": 0.2850499081069733}, {"a": 0, "b": 20, "w": 5.5871640647353615e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.780,hiY=-0.433;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
