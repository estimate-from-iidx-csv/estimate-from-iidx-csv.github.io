<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">KAMIKAZE [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.045, "c": "種", "n": "KAMIKAZE [A]  n=3201 cos1.00 難0.05", "s": 0.856, "f": 0}, {"x": 0.989, "y": 0.035, "c": "近傍", "n": "罠 [A]  n=2926 cos0.99 難0.04", "s": 0.782, "f": 0}, {"x": 0.989, "y": -0.003, "c": "近傍", "n": "rottel-the-Mercury [A]  n=2989 cos0.99 難-0.00", "s": 0.799, "f": 0}, {"x": 0.992, "y": -0.163, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3085 cos0.99 難-0.16", "s": 0.825, "f": 0}, {"x": 0.994, "y": -0.211, "c": "近傍", "n": "お願いアインシュタイン [A]  n=3212 cos0.99 難-0.21", "s": 0.859, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "ハルイロメロディー [A]  n=1086 cos0.99 難-0.25", "s": 0.29, "f": 0}, {"x": 0.986, "y": 0.107, "c": "近傍", "n": "鴉 [A]  n=3543 cos0.99 難0.11", "s": 0.947, "f": 0}, {"x": 0.986, "y": 0.145, "c": "近傍", "n": "Linus [A]  n=3392 cos0.99 難0.15", "s": 0.907, "f": 0}, {"x": 0.994, "y": -0.277, "c": "近傍", "n": "Dazzlin' Darlin [A]  n=3566 cos0.99 難-0.28", "s": 0.953, "f": 0}, {"x": 0.991, "y": -0.249, "c": "近傍", "n": "LOVE SHINE [A]  n=3366 cos0.99 難-0.25", "s": 0.9, "f": 0}, {"x": 0.986, "y": -0.072, "c": "近傍", "n": "断罪の一花 [A]  n=1496 cos0.99 難-0.07", "s": 0.4, "f": 0}, {"x": 0.985, "y": -0.025, "c": "近傍", "n": "Second Heaven [A]  n=3741 cos0.99 難-0.02", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.046, "c": "近傍", "n": "Warrior [A]  n=2493 cos0.98 難0.05", "s": 0.666, "f": 0}, {"x": 0.986, "y": -0.075, "c": "近傍", "n": "Wing of Hearts [A]  n=3094 cos0.99 難-0.07", "s": 0.827, "f": 0}, {"x": 0.985, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.635, "f": 0}, {"x": 0.989, "y": -0.215, "c": "近傍", "n": "Sorrows [A]  n=3300 cos0.99 難-0.21", "s": 0.882, "f": 0}, {"x": 0.989, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.23", "s": 0.732, "f": 0}, {"x": 0.987, "y": -0.191, "c": "近傍", "n": "Believe in you [A]  n=3061 cos0.99 難-0.19", "s": 0.818, "f": 0}, {"x": 0.986, "y": -0.167, "c": "近傍", "n": "Love Me Do [A]  n=2506 cos0.99 難-0.17", "s": 0.67, "f": 0}, {"x": 0.99, "y": -0.263, "c": "近傍", "n": "梅雪夜 [A]  n=3414 cos0.99 難-0.26", "s": 0.913, "f": 0}, {"x": 0.988, "y": -0.225, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3406 cos0.99 難-0.23", "s": 0.91, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34299172953303547}, {"a": 0, "b": 2, "w": 0.3680176601974138}, {"a": 0, "b": 3, "w": 0.4362846073729195}, {"a": 0, "b": 4, "w": 0.49420807192462424}, {"a": 0, "b": 5, "w": 0.5522069106719216}, {"a": 0, "b": 6, "w": 4.054456770319348e-11}, {"a": 0, "b": 7, "w": 0.2501180759060897}, {"a": 0, "b": 8, "w": 0.4958139950044166}, {"a": 0, "b": 9, "w": 0.41219524565450516}, {"a": 0, "b": 10, "w": 0.22946018220064157}, {"a": 0, "b": 11, "w": 0.2550959506184861}, {"a": 0, "b": 12, "w": 0.21165638068333148}, {"a": 0, "b": 13, "w": 0.10659983184089783}, {"a": 0, "b": 14, "w": 0.2539908635110987}, {"a": 0, "b": 15, "w": 0.34453772191983345}, {"a": 0, "b": 16, "w": 0.3485985360298628}, {"a": 0, "b": 17, "w": 0.2927521586134533}, {"a": 0, "b": 18, "w": 0.13130052317234853}, {"a": 0, "b": 19, "w": 0.36179977026382937}, {"a": 0, "b": 20, "w": 0.31264064844931083}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.310,hiY=0.179;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
