<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">TOGAKUSHI [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.498, "c": "種", "n": "TOGAKUSHI [H]  n=2630 cos1.00 難-0.50", "s": 0.759, "f": 0}, {"x": 0.99, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.99 難-0.24", "s": 0.725, "f": 0}, {"x": 0.984, "y": -0.597, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1120 cos0.98 難-0.60", "s": 0.323, "f": 0}, {"x": 0.991, "y": -0.131, "c": "近傍", "n": "Donkey Donk [A]  n=3466 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.76, "c": "近傍", "n": "Unbelief [H]  n=1475 cos0.99 難-0.76", "s": 0.426, "f": 0}, {"x": 0.982, "y": -0.658, "c": "近傍", "n": "ECHIDNA [H]  n=2780 cos0.98 難-0.66", "s": 0.802, "f": 0}, {"x": 0.98, "y": -0.379, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.98 難-0.38", "s": 0.715, "f": 0}, {"x": 0.98, "y": -0.56, "c": "近傍", "n": "真夜中のバベル [A]  n=1944 cos0.98 難-0.56", "s": 0.561, "f": 0}, {"x": 0.984, "y": -0.196, "c": "近傍", "n": "Galaxy Collapse [A]  n=792 cos0.98 難-0.20", "s": 0.229, "f": 0}, {"x": 0.979, "y": -0.469, "c": "近傍", "n": "新宝島 [A]  n=2975 cos0.98 難-0.47", "s": 0.858, "f": 0}, {"x": 0.978, "y": -0.462, "c": "近傍", "n": "海神 [H]  n=3063 cos0.98 難-0.46", "s": 0.884, "f": 0}, {"x": 0.978, "y": -0.559, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2442 cos0.98 難-0.56", "s": 0.705, "f": 0}, {"x": 0.98, "y": -0.756, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2208 cos0.98 難-0.76", "s": 0.637, "f": 0}, {"x": 0.985, "y": -0.908, "c": "近傍", "n": "Acid Pumper [H]  n=2061 cos0.98 難-0.91", "s": 0.595, "f": 0}, {"x": 0.983, "y": -0.114, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.98 難-0.11", "s": 0.972, "f": 0}, {"x": 0.978, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.98 難-0.26", "s": 0.509, "f": 0}, {"x": 0.988, "y": 0.003, "c": "近傍", "n": "The Best of Both Worlds [A]  n=2647 cos0.99 難0.00", "s": 0.764, "f": 0}, {"x": 0.983, "y": -0.903, "c": "近傍", "n": "Godspeed [H]  n=2822 cos0.98 難-0.90", "s": 0.814, "f": 0}, {"x": 0.976, "y": -0.636, "c": "近傍", "n": "Ignis†Irae [H]  n=1632 cos0.98 難-0.64", "s": 0.471, "f": 0}, {"x": 0.979, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.98 難-0.15", "s": 0.824, "f": 0}, {"x": 0.988, "y": -1.042, "c": "近傍", "n": "鬼天 [H]  n=1574 cos0.99 難-1.04", "s": 0.454, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39331444541199245}, {"a": 0, "b": 2, "w": 0.16673998077657137}, {"a": 0, "b": 3, "w": 0.31045611078721624}, {"a": 0, "b": 4, "w": 0.30558078196190175}, {"a": 0, "b": 5, "w": 0.14167991910378952}, {"a": 0, "b": 6, "w": 0.17727694360755164}, {"a": 0, "b": 7, "w": 0.010640755790424228}, {"a": 0, "b": 8, "w": 0.21549568483390846}, {"a": 0, "b": 9, "w": 0.0985052821025082}, {"a": 0, "b": 10, "w": 0.1106467330247759}, {"a": 0, "b": 11, "w": 0.11919757080688875}, {"a": 0, "b": 12, "w": 0.1414468867202343}, {"a": 0, "b": 13, "w": 0.2663514284426073}, {"a": 0, "b": 14, "w": 0.2171559968593103}, {"a": 0, "b": 15, "w": 0.05881160156626741}, {"a": 0, "b": 16, "w": 0.3599715097646895}, {"a": 0, "b": 17, "w": 0.21516579818565496}, {"a": 0, "b": 18, "w": 3.874389697955394e-11}, {"a": 0, "b": 19, "w": 0.12777856521463948}, {"a": 0, "b": 20, "w": 0.34139813215997705}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=-1.125,hiY=0.087;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
