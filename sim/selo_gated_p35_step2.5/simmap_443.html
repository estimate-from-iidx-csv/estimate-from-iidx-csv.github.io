<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ONE AND ONLY [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.537, "c": "種", "n": "ONE AND ONLY [H]  n=844 cos1.00 難-1.54", "s": 0.529, "f": 0}, {"x": 0.995, "y": -1.587, "c": "近傍", "n": "POLKAMANIA [H]  n=1248 cos1.00 難-1.59", "s": 0.782, "f": 0}, {"x": 0.992, "y": -1.579, "c": "近傍", "n": "Night! Night! Night! [H]  n=941 cos0.99 難-1.58", "s": 0.59, "f": 0}, {"x": 0.992, "y": -1.592, "c": "近傍", "n": "Change Yourself [H]  n=857 cos0.99 難-1.59", "s": 0.537, "f": 0}, {"x": 0.992, "y": -1.596, "c": "近傍", "n": "Overslept [H]  n=758 cos0.99 難-1.60", "s": 0.475, "f": 0}, {"x": 0.988, "y": -1.546, "c": "近傍", "n": "GIGA THRASH [H]  n=1177 cos0.99 難-1.55", "s": 0.738, "f": 0}, {"x": 0.987, "y": -1.558, "c": "近傍", "n": "SPEED ROCKER [H]  n=1120 cos0.99 難-1.56", "s": 0.702, "f": 0}, {"x": 0.985, "y": -1.528, "c": "近傍", "n": "Exhaust Hype [H]  n=1307 cos0.99 難-1.53", "s": 0.819, "f": 0}, {"x": 0.99, "y": -1.45, "c": "近傍", "n": "Rising in the Sun(original mix) [H]  n=639 cos0.99 難-1.45", "s": 0.401, "f": 0}, {"x": 0.985, "y": -1.539, "c": "近傍", "n": "天邪鬼 [H]  n=1289 cos0.98 難-1.54", "s": 0.808, "f": 0}, {"x": 0.985, "y": -1.528, "c": "近傍", "n": "VJ ARMY [H]  n=597 cos0.98 難-1.53", "s": 0.374, "f": 0}, {"x": 0.992, "y": -1.422, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.42", "s": 0.698, "f": 0}, {"x": 0.993, "y": -1.412, "c": "近傍", "n": "Sirius [H]  n=512 cos0.99 難-1.41", "s": 0.321, "f": 0}, {"x": 0.984, "y": -1.469, "c": "近傍", "n": "禍根 [H]  n=1595 cos0.98 難-1.47", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.447, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [H]  n=831 cos0.98 難-1.45", "s": 0.521, "f": 0}, {"x": 0.99, "y": -1.663, "c": "近傍", "n": "SOLID WYVERN [H]  n=700 cos0.99 難-1.66", "s": 0.439, "f": 0}, {"x": 0.98, "y": -1.538, "c": "近傍", "n": "Dawn Saga [H]  n=1270 cos0.98 難-1.54", "s": 0.796, "f": 0}, {"x": 0.987, "y": -1.428, "c": "近傍", "n": "ZENDEGI DANCE [H]  n=1083 cos0.99 難-1.43", "s": 0.679, "f": 0}, {"x": 0.998, "y": -1.689, "c": "近傍", "n": "winkle 2 winkle [H]  n=514 cos1.00 難-1.69", "s": 0.322, "f": 0}, {"x": 0.99, "y": -1.403, "c": "近傍", "n": "Like+it! [H]  n=1124 cos0.99 難-1.40", "s": 0.705, "f": 0}, {"x": 0.991, "y": -1.682, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.99 難-1.68", "s": 0.377, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5337443749895858}, {"a": 0, "b": 2, "w": 0.30455621687285106}, {"a": 0, "b": 3, "w": 0.3755759548288329}, {"a": 0, "b": 4, "w": 0.3818970373187718}, {"a": 0, "b": 5, "w": 0.27261777675856946}, {"a": 0, "b": 6, "w": 0.10029638051860656}, {"a": 0, "b": 7, "w": 0.14217016262466242}, {"a": 0, "b": 8, "w": 0.3330720189586617}, {"a": 0, "b": 9, "w": 0.0715816999793194}, {"a": 0, "b": 10, "w": 0.09677325962687844}, {"a": 0, "b": 11, "w": 0.31997941397125373}, {"a": 0, "b": 12, "w": 0.4094049411072881}, {"a": 0, "b": 13, "w": 0.00643274435175567}, {"a": 0, "b": 14, "w": 0.08835296632164447}, {"a": 0, "b": 15, "w": 0.32731622513129754}, {"a": 0, "b": 16, "w": 4.792499730399413e-11}, {"a": 0, "b": 17, "w": 0.18378790566100545}, {"a": 0, "b": 18, "w": 0.6812958669028705}, {"a": 0, "b": 19, "w": 0.31823927341858493}, {"a": 0, "b": 20, "w": 0.31488488124057223}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.712,hiY=-1.380;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
