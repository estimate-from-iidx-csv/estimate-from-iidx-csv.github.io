<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 2 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.364, "c": "種", "n": "Level 2 [A]  n=2883 cos1.00 難1.36", "s": 0.829, "f": 0}, {"x": 0.996, "y": 1.221, "c": "近傍", "n": "火影 [A]  n=3399 cos1.00 難1.22", "s": 0.977, "f": 0}, {"x": 0.987, "y": 1.367, "c": "近傍", "n": "HADES [A]  n=3300 cos0.99 難1.37", "s": 0.949, "f": 0}, {"x": 0.985, "y": 1.305, "c": "近傍", "n": "Xperanza [A]  n=3345 cos0.99 難1.31", "s": 0.962, "f": 0}, {"x": 0.991, "y": 1.555, "c": "近傍", "n": "Snake Stick [A]  n=3368 cos0.99 難1.56", "s": 0.968, "f": 0}, {"x": 0.99, "y": 1.598, "c": "近傍", "n": "Peaktime Booster [A]  n=1914 cos0.99 難1.60", "s": 0.55, "f": 0}, {"x": 0.982, "y": 1.432, "c": "近傍", "n": "MAD ATTACK [L]  n=1394 cos0.98 難1.43", "s": 0.401, "f": 0}, {"x": 0.982, "y": 1.323, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3478 cos0.98 難1.32", "s": 1.0, "f": 0}, {"x": 0.982, "y": 1.358, "c": "近傍", "n": "STARLIGHT DANCEHALL [L]  n=2924 cos0.98 難1.36", "s": 0.841, "f": 0}, {"x": 0.982, "y": 1.436, "c": "近傍", "n": "LASER CRUSTER (IGNITE REMIX) [A]  n=2521 cos0.98 難1.44", "s": 0.725, "f": 0}, {"x": 0.982, "y": 1.427, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.98 難1.43", "s": 0.277, "f": 0}, {"x": 0.985, "y": 1.193, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2504 cos0.98 難1.19", "s": 0.72, "f": 0}, {"x": 0.99, "y": 1.106, "c": "近傍", "n": "GAME ON [A]  n=1839 cos0.99 難1.11", "s": 0.529, "f": 0}, {"x": 0.981, "y": 1.266, "c": "近傍", "n": "UNDO THE NIGHT [A]  n=648 cos0.98 難1.27", "s": 0.186, "f": 0}, {"x": 0.98, "y": 1.398, "c": "近傍", "n": "199024club -Re:BounceKiller- [A]  n=3344 cos0.98 難1.40", "s": 0.961, "f": 0}, {"x": 0.979, "y": 1.36, "c": "近傍", "n": "Papilio ulysses [A]  n=3228 cos0.98 難1.36", "s": 0.928, "f": 0}, {"x": 0.987, "y": 1.608, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2757 cos0.99 難1.61", "s": 0.793, "f": 0}, {"x": 0.978, "y": 1.386, "c": "近傍", "n": "SISYPHUS [A]  n=828 cos0.98 難1.39", "s": 0.238, "f": 0}, {"x": 0.98, "y": 1.21, "c": "近傍", "n": "灼熱 Lost Summer Dayz [A]  n=1579 cos0.98 難1.21", "s": 0.454, "f": 0}, {"x": 0.988, "y": 1.651, "c": "近傍", "n": "2 Beasts Unchained [A]  n=1873 cos0.99 難1.65", "s": 0.539, "f": 0}, {"x": 0.981, "y": 1.565, "c": "近傍", "n": "廿 [L]  n=2719 cos0.98 難1.56", "s": 0.782, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5998602154549417}, {"a": 0, "b": 2, "w": 0.3405658107867545}, {"a": 0, "b": 3, "w": 0.28496556699554076}, {"a": 0, "b": 4, "w": 0.45201183211993057}, {"a": 0, "b": 5, "w": 0.39688847392141524}, {"a": 0, "b": 6, "w": 0.14832256348149309}, {"a": 0, "b": 7, "w": 0.16789683113811005}, {"a": 0, "b": 8, "w": 0.11048144337816279}, {"a": 0, "b": 9, "w": 0.08623716543134474}, {"a": 0, "b": 10, "w": 0.21042375859341178}, {"a": 0, "b": 11, "w": 0.24904215207632963}, {"a": 0, "b": 12, "w": 0.39677369489924874}, {"a": 0, "b": 13, "w": 0.0823172851940297}, {"a": 0, "b": 14, "w": 0.15413841575752185}, {"a": 0, "b": 15, "w": 0.14008960814161153}, {"a": 0, "b": 16, "w": 0.2758277986636142}, {"a": 0, "b": 17, "w": 0.05273662200082507}, {"a": 0, "b": 18, "w": 0.1842210904189029}, {"a": 0, "b": 19, "w": 0.19744847110556496}, {"a": 0, "b": 20, "w": 2.8487323611159354e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=1.063,hiY=1.694;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
