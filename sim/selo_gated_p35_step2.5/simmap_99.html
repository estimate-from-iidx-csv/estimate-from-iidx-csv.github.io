<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">neogenesis [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.492, "c": "種", "n": "neogenesis [A]  n=2777 cos1.00 難-0.49", "s": 0.911, "f": 0}, {"x": 0.995, "y": -0.639, "c": "近傍", "n": "カゴノトリ～弐式～ [H]  n=2359 cos0.99 難-0.64", "s": 0.774, "f": 0}, {"x": 0.991, "y": -0.555, "c": "近傍", "n": "WAKE UP NOW [A]  n=2296 cos0.99 難-0.56", "s": 0.753, "f": 0}, {"x": 0.993, "y": -0.328, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos0.99 難-0.33", "s": 0.68, "f": 0}, {"x": 0.993, "y": -0.299, "c": "近傍", "n": "Change the World [A]  n=2744 cos0.99 難-0.30", "s": 0.9, "f": 0}, {"x": 0.991, "y": -0.609, "c": "近傍", "n": "B4U [H]  n=2240 cos0.99 難-0.61", "s": 0.735, "f": 0}, {"x": 0.99, "y": -0.577, "c": "近傍", "n": "Don't Stop The Music feat. Kanae Asaba [A]  n=2220 cos0.99 難-0.58", "s": 0.728, "f": 0}, {"x": 0.99, "y": -0.432, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.43", "s": 0.979, "f": 0}, {"x": 0.99, "y": -0.366, "c": "近傍", "n": "Ganymede [H]  n=2744 cos0.99 難-0.37", "s": 0.9, "f": 0}, {"x": 0.99, "y": -0.608, "c": "近傍", "n": "Don't be afraid myself [H]  n=1642 cos0.99 難-0.61", "s": 0.539, "f": 0}, {"x": 0.99, "y": -0.304, "c": "近傍", "n": "oratio [H]  n=2403 cos0.99 難-0.30", "s": 0.788, "f": 0}, {"x": 0.989, "y": -0.389, "c": "近傍", "n": "thunder [A]  n=2861 cos0.99 難-0.39", "s": 0.938, "f": 0}, {"x": 0.988, "y": -0.598, "c": "近傍", "n": "ANDROMEDA II [H]  n=1979 cos0.99 難-0.60", "s": 0.649, "f": 0}, {"x": 0.988, "y": -0.488, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1015 cos0.99 難-0.49", "s": 0.333, "f": 0}, {"x": 0.988, "y": -0.386, "c": "近傍", "n": "INFERNO [A]  n=2475 cos0.99 難-0.39", "s": 0.812, "f": 0}, {"x": 0.988, "y": -0.395, "c": "近傍", "n": "下弦の月 [A]  n=3049 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.68, "c": "近傍", "n": "Make A Difference [H]  n=1366 cos0.99 難-0.68", "s": 0.448, "f": 0}, {"x": 0.987, "y": -0.301, "c": "近傍", "n": "太陽～T・A・I・Y・O～ [A]  n=2502 cos0.99 難-0.30", "s": 0.821, "f": 0}, {"x": 0.986, "y": -0.365, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.36", "s": 0.908, "f": 0}, {"x": 0.988, "y": -0.254, "c": "近傍", "n": "SPEEDY CAT [A]  n=2412 cos0.99 難-0.25", "s": 0.791, "f": 0}, {"x": 0.988, "y": -0.73, "c": "近傍", "n": "D.C.fish [H]  n=1815 cos0.99 難-0.73", "s": 0.595, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45821787603102826}, {"a": 0, "b": 2, "w": 0.33300333640929813}, {"a": 0, "b": 3, "w": 0.3991156602208542}, {"a": 0, "b": 4, "w": 0.4127667517385991}, {"a": 0, "b": 5, "w": 0.25523643788453454}, {"a": 0, "b": 6, "w": 0.2702863682387293}, {"a": 0, "b": 7, "w": 0.19539445129291844}, {"a": 0, "b": 8, "w": 0.24745815634494595}, {"a": 0, "b": 9, "w": 0.253624282511692}, {"a": 0, "b": 10, "w": 0.26282819187349404}, {"a": 0, "b": 11, "w": 0.23494393213736642}, {"a": 0, "b": 12, "w": 0.23295311354613912}, {"a": 0, "b": 13, "w": 0.213126467223127}, {"a": 0, "b": 14, "w": 0.22735527670205713}, {"a": 0, "b": 15, "w": 5.3470783356601714e-11}, {"a": 0, "b": 16, "w": 0.21915325481671166}, {"a": 0, "b": 17, "w": 0.15099920821370105}, {"a": 0, "b": 18, "w": 0.1335784592362299}, {"a": 0, "b": 19, "w": 0.15910385327131216}, {"a": 0, "b": 20, "w": 0.20460648952659077}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.768,hiY=-0.215;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
