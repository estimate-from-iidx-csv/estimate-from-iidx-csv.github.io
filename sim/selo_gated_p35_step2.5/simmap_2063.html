<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">rainbow rainbow [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.306, "c": "種", "n": "rainbow rainbow [A]  n=3315 cos1.00 難0.31", "s": 0.902, "f": 0}, {"x": 0.995, "y": 0.405, "c": "近傍", "n": "Garuda [A]  n=2808 cos1.00 難0.41", "s": 0.764, "f": 0}, {"x": 0.995, "y": 0.208, "c": "近傍", "n": "≡+≡ [A]  n=2296 cos1.00 難0.21", "s": 0.625, "f": 0}, {"x": 0.994, "y": 0.263, "c": "近傍", "n": "prompt [A]  n=3337 cos0.99 難0.26", "s": 0.908, "f": 0}, {"x": 0.994, "y": 0.248, "c": "近傍", "n": "waxing and wanding [A]  n=3675 cos0.99 難0.25", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.195, "c": "近傍", "n": "月とミルク [A]  n=2662 cos0.99 難0.19", "s": 0.724, "f": 0}, {"x": 0.993, "y": 0.278, "c": "近傍", "n": "AsiaN distractive [A]  n=3185 cos0.99 難0.28", "s": 0.867, "f": 0}, {"x": 0.996, "y": 0.147, "c": "近傍", "n": "Vulkan [A]  n=3518 cos1.00 難0.15", "s": 0.957, "f": 0}, {"x": 0.993, "y": 0.293, "c": "近傍", "n": "シャムシールの舞 [A]  n=2281 cos0.99 難0.29", "s": 0.621, "f": 0}, {"x": 0.993, "y": 0.177, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3555 cos0.99 難0.18", "s": 0.967, "f": 0}, {"x": 0.992, "y": 0.333, "c": "近傍", "n": "in the Sky [A]  n=3438 cos0.99 難0.33", "s": 0.936, "f": 0}, {"x": 0.994, "y": 0.158, "c": "近傍", "n": "Be A Star [A]  n=3353 cos0.99 難0.16", "s": 0.912, "f": 0}, {"x": 0.993, "y": 0.179, "c": "近傍", "n": "シル・ヴ・プレジデント [L]  n=2289 cos0.99 難0.18", "s": 0.623, "f": 0}, {"x": 0.991, "y": 0.269, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3281 cos0.99 難0.27", "s": 0.893, "f": 0}, {"x": 0.989, "y": 0.206, "c": "近傍", "n": "雫 [A]  n=1348 cos0.99 難0.21", "s": 0.367, "f": 0}, {"x": 0.99, "y": 0.162, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos0.99 難0.16", "s": 0.937, "f": 0}, {"x": 0.989, "y": 0.234, "c": "近傍", "n": "華蝶風雪 [A]  n=3533 cos0.99 難0.23", "s": 0.961, "f": 0}, {"x": 0.99, "y": 0.133, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos0.99 難0.13", "s": 0.946, "f": 0}, {"x": 0.996, "y": 0.015, "c": "近傍", "n": "RIZING YOU UP [A]  n=3106 cos1.00 難0.02", "s": 0.845, "f": 0}, {"x": 0.988, "y": 0.255, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3252 cos0.99 難0.25", "s": 0.885, "f": 0}, {"x": 0.989, "y": 0.447, "c": "近傍", "n": "chaos eater -IIDX edition- [A]  n=3161 cos0.99 難0.45", "s": 0.86, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4198805252419252}, {"a": 0, "b": 2, "w": 0.38036336673028326}, {"a": 0, "b": 3, "w": 0.2907719394354309}, {"a": 0, "b": 4, "w": 0.12274279034277413}, {"a": 0, "b": 5, "w": 0.31504095921405106}, {"a": 0, "b": 6, "w": 0.2547326518016674}, {"a": 0, "b": 7, "w": 0.44332488496909617}, {"a": 0, "b": 8, "w": 0.2854776598583927}, {"a": 0, "b": 9, "w": 0.3174393507912009}, {"a": 0, "b": 10, "w": 0.24016484980679387}, {"a": 0, "b": 11, "w": 0.3305456547029475}, {"a": 0, "b": 12, "w": 0.21540792486148896}, {"a": 0, "b": 13, "w": 0.19015550876667764}, {"a": 0, "b": 14, "w": 0.09944525525592418}, {"a": 0, "b": 15, "w": 0.13388252616486007}, {"a": 0, "b": 16, "w": 0.0950408865342488}, {"a": 0, "b": 17, "w": 0.16804402291095322}, {"a": 0, "b": 18, "w": 0.3648599483283871}, {"a": 0, "b": 19, "w": 4.92060836521091e-11}, {"a": 0, "b": 20, "w": 0.1234868590439091}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.020,hiY=0.482;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
