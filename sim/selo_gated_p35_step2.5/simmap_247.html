<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Bounce Bounce Bounce [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.764, "c": "種", "n": "Bounce Bounce Bounce [H]  n=2279 cos1.00 難-0.76", "s": 0.752, "f": 0}, {"x": 0.989, "y": -0.801, "c": "近傍", "n": "Make Me Your Own [H]  n=1671 cos0.99 難-0.80", "s": 0.551, "f": 0}, {"x": 0.992, "y": -0.898, "c": "近傍", "n": "255 [H]  n=1429 cos0.99 難-0.90", "s": 0.471, "f": 0}, {"x": 0.99, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.99 難-0.89", "s": 0.758, "f": 0}, {"x": 0.986, "y": -0.794, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [H]  n=2079 cos0.99 難-0.79", "s": 0.686, "f": 0}, {"x": 0.983, "y": -0.703, "c": "近傍", "n": "Y&Co. is dead or alive [H]  n=1174 cos0.98 難-0.70", "s": 0.387, "f": 0}, {"x": 0.986, "y": -0.556, "c": "近傍", "n": "ビビデバ [A]  n=1667 cos0.99 難-0.56", "s": 0.55, "f": 0}, {"x": 0.981, "y": -0.735, "c": "近傍", "n": "Programmed Life [H]  n=1854 cos0.98 難-0.73", "s": 0.612, "f": 0}, {"x": 0.98, "y": -0.814, "c": "近傍", "n": "The Sampling Paradise [H]  n=3031 cos0.98 難-0.81", "s": 1.0, "f": 0}, {"x": 0.98, "y": -0.729, "c": "近傍", "n": "Programmed Sun [H]  n=2098 cos0.98 難-0.73", "s": 0.692, "f": 0}, {"x": 0.982, "y": -0.945, "c": "近傍", "n": "Double Dribble [H]  n=1638 cos0.98 難-0.94", "s": 0.54, "f": 0}, {"x": 0.979, "y": -0.757, "c": "近傍", "n": "Purple Perplex [H]  n=1797 cos0.98 難-0.76", "s": 0.593, "f": 0}, {"x": 0.98, "y": -0.639, "c": "近傍", "n": "abstract [H]  n=1826 cos0.98 難-0.64", "s": 0.602, "f": 0}, {"x": 0.979, "y": -0.702, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.98 難-0.70", "s": 0.75, "f": 0}, {"x": 0.983, "y": -0.55, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1051 cos0.98 難-0.55", "s": 0.347, "f": 0}, {"x": 0.983, "y": -0.987, "c": "近傍", "n": "m1dy Deluxe [H]  n=2329 cos0.98 難-0.99", "s": 0.768, "f": 0}, {"x": 0.98, "y": -0.933, "c": "近傍", "n": "火影 [H]  n=2103 cos0.98 難-0.93", "s": 0.694, "f": 0}, {"x": 0.978, "y": -0.81, "c": "近傍", "n": "REMINISCENCE [H]  n=1867 cos0.98 難-0.81", "s": 0.616, "f": 0}, {"x": 0.979, "y": -0.92, "c": "近傍", "n": "Rock Da House [H]  n=2245 cos0.98 難-0.92", "s": 0.741, "f": 0}, {"x": 0.978, "y": -0.629, "c": "近傍", "n": "Regulus [H]  n=1427 cos0.98 難-0.63", "s": 0.471, "f": 0}, {"x": 0.977, "y": -0.643, "c": "近傍", "n": "Digitank System [H]  n=2777 cos0.98 難-0.64", "s": 0.916, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5110491726314672}, {"a": 0, "b": 2, "w": 0.5616748708034218}, {"a": 0, "b": 3, "w": 0.48746734038590334}, {"a": 0, "b": 4, "w": 0.4455475150269814}, {"a": 0, "b": 5, "w": 0.3035970707670458}, {"a": 0, "b": 6, "w": 0.4589801889329844}, {"a": 0, "b": 7, "w": 0.35186927616818486}, {"a": 0, "b": 8, "w": 0.3111415910095401}, {"a": 0, "b": 9, "w": 0.32687621298269}, {"a": 0, "b": 10, "w": 0.17546560327093452}, {"a": 0, "b": 11, "w": 3.626099420728224e-11}, {"a": 0, "b": 12, "w": 0.3465442871249531}, {"a": 0, "b": 13, "w": 0.33151311789390214}, {"a": 0, "b": 14, "w": 0.2272894881287122}, {"a": 0, "b": 15, "w": 0.3429495865386958}, {"a": 0, "b": 16, "w": 0.32062451811129355}, {"a": 0, "b": 17, "w": 0.30947212604848573}, {"a": 0, "b": 18, "w": 0.3182110655595659}, {"a": 0, "b": 19, "w": 0.3232607114988696}, {"a": 0, "b": 20, "w": 0.07656523266191662}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-1.022,hiY=-0.515;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
