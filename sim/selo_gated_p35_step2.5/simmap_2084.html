<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Rock It [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.234, "c": "種", "n": "Rock It [A]  n=3337 cos1.00 難0.23", "s": 0.91, "f": 0}, {"x": 0.995, "y": 0.263, "c": "近傍", "n": "I Love You [A]  n=3131 cos1.00 難0.26", "s": 0.853, "f": 0}, {"x": 0.994, "y": 0.255, "c": "近傍", "n": "INAZUMA [A]  n=3450 cos0.99 難0.26", "s": 0.94, "f": 0}, {"x": 0.994, "y": 0.175, "c": "近傍", "n": "Take My Life [A]  n=3360 cos0.99 難0.18", "s": 0.916, "f": 0}, {"x": 0.993, "y": 0.217, "c": "近傍", "n": "ZEPHYRANTHES [A]  n=3392 cos0.99 難0.22", "s": 0.925, "f": 0}, {"x": 0.994, "y": 0.097, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [A]  n=2938 cos0.99 難0.10", "s": 0.801, "f": 0}, {"x": 0.992, "y": 0.245, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.24", "s": 0.836, "f": 0}, {"x": 0.992, "y": 0.205, "c": "近傍", "n": "the shadow [A]  n=3400 cos0.99 難0.21", "s": 0.927, "f": 0}, {"x": 0.992, "y": 0.294, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos0.99 難0.29", "s": 0.89, "f": 0}, {"x": 0.992, "y": 0.298, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.30", "s": 0.746, "f": 0}, {"x": 0.992, "y": 0.171, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3160 cos0.99 難0.17", "s": 0.861, "f": 0}, {"x": 0.993, "y": 0.403, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.99 難0.40", "s": 0.849, "f": 0}, {"x": 0.991, "y": 0.314, "c": "近傍", "n": "INORI [A]  n=3404 cos0.99 難0.31", "s": 0.928, "f": 0}, {"x": 0.991, "y": 0.194, "c": "近傍", "n": "MENDES [H]  n=3662 cos0.99 難0.19", "s": 0.998, "f": 0}, {"x": 0.992, "y": 0.043, "c": "近傍", "n": "Empire State Glory [A]  n=3578 cos0.99 難0.04", "s": 0.975, "f": 0}, {"x": 0.99, "y": 0.213, "c": "近傍", "n": "Countdown to Heaven or Hell [A]  n=1126 cos0.99 難0.21", "s": 0.307, "f": 0}, {"x": 0.99, "y": 0.263, "c": "近傍", "n": "Xepher [A]  n=3669 cos0.99 難0.26", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.045, "c": "近傍", "n": "405nm (Ryu☆mix) [A]  n=3619 cos0.99 難0.05", "s": 0.986, "f": 0}, {"x": 0.99, "y": 0.265, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=840 cos0.99 難0.27", "s": 0.229, "f": 0}, {"x": 0.992, "y": 0.039, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2824 cos0.99 難0.04", "s": 0.77, "f": 0}, {"x": 0.99, "y": 0.136, "c": "近傍", "n": "INHERITANCE [A]  n=1654 cos0.99 難0.14", "s": 0.451, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5330188866966633}, {"a": 0, "b": 2, "w": 0.4169929963539233}, {"a": 0, "b": 3, "w": 0.3936362631138195}, {"a": 0, "b": 4, "w": 0.4156654919039028}, {"a": 0, "b": 5, "w": 0.43169189862916657}, {"a": 0, "b": 6, "w": 0.39420468105135364}, {"a": 0, "b": 7, "w": 0.4073657607231417}, {"a": 0, "b": 8, "w": 0.3349060657910711}, {"a": 0, "b": 9, "w": 0.35082727052787344}, {"a": 0, "b": 10, "w": 0.24708317300644966}, {"a": 0, "b": 11, "w": 0.42133610338512273}, {"a": 0, "b": 12, "w": 0.2993430944853068}, {"a": 0, "b": 13, "w": 0.2857117591807127}, {"a": 0, "b": 14, "w": 0.4064027681989397}, {"a": 0, "b": 15, "w": 0.08622311455021969}, {"a": 0, "b": 16, "w": 0.23915852420799566}, {"a": 0, "b": 17, "w": 0.39279474598335073}, {"a": 0, "b": 18, "w": 4.1762482361207276e-11}, {"a": 0, "b": 19, "w": 0.3765191334197855}, {"a": 0, "b": 20, "w": 0.1489359135323275}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.010,hiY=0.432;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
