<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Click Again [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.422, "c": "種", "n": "Click Again [A]  n=3100 cos1.00 難0.42", "s": 0.85, "f": 0}, {"x": 0.992, "y": 0.285, "c": "近傍", "n": "Discloze [A]  n=3149 cos0.99 難0.29", "s": 0.863, "f": 0}, {"x": 0.991, "y": 0.297, "c": "近傍", "n": "Debtty Daddy [A]  n=3106 cos0.99 難0.30", "s": 0.851, "f": 0}, {"x": 0.994, "y": 0.108, "c": "近傍", "n": "50th Memorial Songs -Flagship medley- [A]  n=2093 cos0.99 難0.11", "s": 0.574, "f": 0}, {"x": 0.995, "y": 0.057, "c": "近傍", "n": "Make A Difference [A]  n=2551 cos0.99 難0.06", "s": 0.699, "f": 0}, {"x": 0.991, "y": 0.266, "c": "近傍", "n": "Sun Field [A]  n=3143 cos0.99 難0.27", "s": 0.862, "f": 0}, {"x": 0.989, "y": 0.411, "c": "近傍", "n": "Playing With Fire [A]  n=2931 cos0.99 難0.41", "s": 0.803, "f": 0}, {"x": 0.992, "y": 0.12, "c": "近傍", "n": "Be quiet [A]  n=3611 cos0.99 難0.12", "s": 0.99, "f": 0}, {"x": 0.989, "y": 0.376, "c": "近傍", "n": "Back Spin Sweeper [A]  n=3245 cos0.99 難0.38", "s": 0.89, "f": 0}, {"x": 0.992, "y": 0.1, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2689 cos0.99 難0.10", "s": 0.737, "f": 0}, {"x": 0.989, "y": 0.403, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.99 難0.40", "s": 0.844, "f": 0}, {"x": 0.99, "y": 0.151, "c": "近傍", "n": "Amazing Mirage [A]  n=3635 cos0.99 難0.15", "s": 0.996, "f": 0}, {"x": 0.991, "y": 0.092, "c": "近傍", "n": "Logic Board [A]  n=1414 cos0.99 難0.09", "s": 0.388, "f": 0}, {"x": 0.99, "y": 0.121, "c": "近傍", "n": "合体せよ！ストロングイェーガー！！ (Ryu☆ remix) [A]  n=3327 cos0.99 難0.12", "s": 0.912, "f": 0}, {"x": 0.99, "y": 0.109, "c": "近傍", "n": "CaptivAte～浄化～ [A]  n=3648 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.143, "c": "近傍", "n": "SPEED ROCKER [A]  n=2665 cos0.99 難0.14", "s": 0.731, "f": 0}, {"x": 0.99, "y": 0.073, "c": "近傍", "n": "Leaving... [A]  n=2612 cos0.99 難0.07", "s": 0.716, "f": 0}, {"x": 0.988, "y": 0.616, "c": "近傍", "n": "DXY! [A]  n=3261 cos0.99 難0.62", "s": 0.894, "f": 0}, {"x": 0.987, "y": 0.215, "c": "近傍", "n": "Into The Madness [A]  n=2663 cos0.99 難0.22", "s": 0.73, "f": 0}, {"x": 0.988, "y": 0.189, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos0.99 難0.19", "s": 0.79, "f": 0}, {"x": 0.986, "y": 0.475, "c": "近傍", "n": "Aegis [A]  n=3425 cos0.99 難0.48", "s": 0.939, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2279732047151074}, {"a": 0, "b": 2, "w": 0.22734167921969928}, {"a": 0, "b": 3, "w": 0.47223578939986366}, {"a": 0, "b": 4, "w": 0.5964889764854873}, {"a": 0, "b": 5, "w": 0.3528951239188831}, {"a": 0, "b": 6, "w": 0.09967884671936522}, {"a": 0, "b": 7, "w": 0.37600546487413244}, {"a": 0, "b": 8, "w": 0.26731188967064345}, {"a": 0, "b": 9, "w": 0.4707028090408464}, {"a": 0, "b": 10, "w": 0.32653638537962026}, {"a": 0, "b": 11, "w": 0.17877714887829377}, {"a": 0, "b": 12, "w": 0.46751210056521275}, {"a": 0, "b": 13, "w": 0.41051738336005383}, {"a": 0, "b": 14, "w": 0.27351328228900096}, {"a": 0, "b": 15, "w": 0.40423559283165256}, {"a": 0, "b": 16, "w": 0.35450326763059226}, {"a": 0, "b": 17, "w": 0.277080497404922}, {"a": 0, "b": 18, "w": 0.2705909179741255}, {"a": 0, "b": 19, "w": 0.15732828336870375}, {"a": 0, "b": 20, "w": 3.764100142689131e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=0.012,hiY=0.661;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
