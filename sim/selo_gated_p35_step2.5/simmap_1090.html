<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Violet Pulse [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.164, "c": "種", "n": "Violet Pulse [A]  n=2914 cos1.00 難-0.16", "s": 0.752, "f": 0}, {"x": 0.993, "y": -0.232, "c": "近傍", "n": "Euphoric Lagoon [A]  n=2431 cos0.99 難-0.23", "s": 0.628, "f": 0}, {"x": 0.993, "y": -0.1, "c": "近傍", "n": "sync [A]  n=3166 cos0.99 難-0.10", "s": 0.817, "f": 0}, {"x": 0.992, "y": -0.086, "c": "近傍", "n": "Cyber Force [A]  n=2763 cos0.99 難-0.09", "s": 0.713, "f": 0}, {"x": 0.992, "y": -0.295, "c": "近傍", "n": "V [H]  n=3526 cos0.99 難-0.29", "s": 0.91, "f": 0}, {"x": 0.992, "y": -0.268, "c": "近傍", "n": "Devilz Staircase [H]  n=2866 cos0.99 難-0.27", "s": 0.74, "f": 0}, {"x": 0.991, "y": -0.263, "c": "近傍", "n": "snow storm [A]  n=3656 cos0.99 難-0.26", "s": 0.944, "f": 0}, {"x": 0.991, "y": -0.153, "c": "近傍", "n": "Hard Breaker [A]  n=1314 cos0.99 難-0.15", "s": 0.339, "f": 0}, {"x": 0.991, "y": -0.082, "c": "近傍", "n": "Chain of pain [A]  n=2993 cos0.99 難-0.08", "s": 0.773, "f": 0}, {"x": 0.991, "y": -0.013, "c": "近傍", "n": "月下繚乱 [A]  n=1126 cos0.99 難-0.01", "s": 0.291, "f": 0}, {"x": 0.99, "y": -0.105, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2907 cos0.99 難-0.11", "s": 0.75, "f": 0}, {"x": 0.99, "y": -0.244, "c": "近傍", "n": "罪と罰 [A]  n=3503 cos0.99 難-0.24", "s": 0.904, "f": 0}, {"x": 0.991, "y": -0.024, "c": "近傍", "n": "Backyard Stars [A]  n=2698 cos0.99 難-0.02", "s": 0.696, "f": 0}, {"x": 0.991, "y": 0.012, "c": "近傍", "n": "PILGRIM [A]  n=1299 cos0.99 難0.01", "s": 0.335, "f": 0}, {"x": 0.99, "y": -0.263, "c": "近傍", "n": "QUANTUM TELEPORTATION [H]  n=2524 cos0.99 難-0.26", "s": 0.652, "f": 0}, {"x": 0.99, "y": -0.194, "c": "近傍", "n": "quasar [A]  n=3874 cos0.99 難-0.19", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.154, "c": "近傍", "n": "Harmony and Lovely [A]  n=3541 cos0.99 難0.15", "s": 0.914, "f": 0}, {"x": 0.99, "y": -0.076, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.99 難-0.08", "s": 0.801, "f": 0}, {"x": 0.99, "y": -0.234, "c": "近傍", "n": "Brave Spirits [A]  n=1880 cos0.99 難-0.23", "s": 0.485, "f": 0}, {"x": 0.99, "y": -0.107, "c": "近傍", "n": "crew [A]  n=3602 cos0.99 難-0.11", "s": 0.93, "f": 0}, {"x": 0.991, "y": 0.041, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.04", "s": 0.914, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3140007481030034}, {"a": 0, "b": 2, "w": 0.45451599459084424}, {"a": 0, "b": 3, "w": 0.5115219740283465}, {"a": 0, "b": 4, "w": 0.4655461824477186}, {"a": 0, "b": 5, "w": 0.40728789038516633}, {"a": 0, "b": 6, "w": 0.37157571307992276}, {"a": 0, "b": 7, "w": 0.17152474265614093}, {"a": 0, "b": 8, "w": 0.4195747786216881}, {"a": 0, "b": 9, "w": 3.90176779774265e-11}, {"a": 0, "b": 10, "w": 0.4563902721480979}, {"a": 0, "b": 11, "w": 0.45431210718355686}, {"a": 0, "b": 12, "w": 0.4471969868894182}, {"a": 0, "b": 13, "w": 0.32667620464076563}, {"a": 0, "b": 14, "w": 0.4347984392730706}, {"a": 0, "b": 15, "w": 0.32568276822983966}, {"a": 0, "b": 16, "w": 0.5832198665692065}, {"a": 0, "b": 17, "w": 0.4349685582582151}, {"a": 0, "b": 18, "w": 0.2727855085945543}, {"a": 0, "b": 19, "w": 0.02272724882578192}, {"a": 0, "b": 20, "w": 0.45268142999103944}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.331,hiY=0.190;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
