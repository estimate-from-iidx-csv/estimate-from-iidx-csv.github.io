<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">パ→ピ→プ→Yeah! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.153, "c": "種", "n": "パ→ピ→プ→Yeah! [H]  n=2314 cos1.00 難-1.15", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.16, "c": "近傍", "n": "RAIN [H]  n=1518 cos0.99 難-1.16", "s": 0.656, "f": 0}, {"x": 0.989, "y": -1.227, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.99 難-1.23", "s": 0.451, "f": 0}, {"x": 0.99, "y": -1.307, "c": "近傍", "n": "Discloze [H]  n=1378 cos0.99 難-1.31", "s": 0.596, "f": 0}, {"x": 0.986, "y": -1.113, "c": "近傍", "n": "Meissa [H]  n=923 cos0.99 難-1.11", "s": 0.399, "f": 0}, {"x": 0.984, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.98 難-1.16", "s": 0.644, "f": 0}, {"x": 0.986, "y": -1.042, "c": "近傍", "n": "鬼天 [H]  n=1574 cos0.99 難-1.04", "s": 0.68, "f": 0}, {"x": 0.985, "y": -1.252, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.99 難-1.25", "s": 0.433, "f": 0}, {"x": 0.984, "y": -1.127, "c": "近傍", "n": "Ghost Pulse [H]  n=824 cos0.98 難-1.13", "s": 0.356, "f": 0}, {"x": 0.984, "y": -1.093, "c": "近傍", "n": "Slipstream [H]  n=1475 cos0.98 難-1.09", "s": 0.637, "f": 0}, {"x": 0.983, "y": -1.175, "c": "近傍", "n": "chaplet -IIDX re:build- [H]  n=503 cos0.98 難-1.18", "s": 0.217, "f": 0}, {"x": 0.986, "y": -1.294, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.99 難-1.29", "s": 0.802, "f": 0}, {"x": 0.982, "y": -1.129, "c": "近傍", "n": "No Border [H]  n=1432 cos0.98 難-1.13", "s": 0.619, "f": 0}, {"x": 0.982, "y": -1.091, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.98 難-1.09", "s": 0.584, "f": 0}, {"x": 0.984, "y": -1.043, "c": "近傍", "n": "NOIXIA [H]  n=932 cos0.98 難-1.04", "s": 0.403, "f": 0}, {"x": 0.982, "y": -1.134, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.98 難-1.13", "s": 0.68, "f": 0}, {"x": 0.982, "y": -1.08, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos0.98 難-1.08", "s": 0.623, "f": 0}, {"x": 0.983, "y": -1.034, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos0.98 難-1.03", "s": 0.711, "f": 0}, {"x": 0.981, "y": -1.103, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.98 難-1.10", "s": 0.708, "f": 0}, {"x": 0.984, "y": -1.302, "c": "近傍", "n": "Back Spin Sweeper [H]  n=1434 cos0.98 難-1.30", "s": 0.62, "f": 0}, {"x": 0.98, "y": -1.132, "c": "近傍", "n": "Drop Syndicate [H]  n=714 cos0.98 難-1.13", "s": 0.309, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42139706664932075}, {"a": 0, "b": 2, "w": 0.35567560941958376}, {"a": 0, "b": 3, "w": 0.41706562928834756}, {"a": 0, "b": 4, "w": 0.3193734186474867}, {"a": 0, "b": 5, "w": 0.2937315827996214}, {"a": 0, "b": 6, "w": 0.20945774710572151}, {"a": 0, "b": 7, "w": 0.3045894642547494}, {"a": 0, "b": 8, "w": 0.21657235901624372}, {"a": 0, "b": 9, "w": 0.18371212500237655}, {"a": 0, "b": 10, "w": 0.23094693580965575}, {"a": 0, "b": 11, "w": 0.31709715389626314}, {"a": 0, "b": 12, "w": 0.24727086871503556}, {"a": 0, "b": 13, "w": 0.24790627338684168}, {"a": 0, "b": 14, "w": 0.07187202046306773}, {"a": 0, "b": 15, "w": 0.16117405468645063}, {"a": 0, "b": 16, "w": 0.2434927441785243}, {"a": 0, "b": 17, "w": 0.22194680963352176}, {"a": 0, "b": 18, "w": 0.21149987785478197}, {"a": 0, "b": 19, "w": 0.2753470436090255}, {"a": 0, "b": 20, "w": 4.256106578282015e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.329,hiY=-1.012;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
