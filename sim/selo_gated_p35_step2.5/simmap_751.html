<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">AO-∞ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.116, "c": "種", "n": "AO-∞ [A]  n=2934 cos1.00 難-0.12", "s": 0.808, "f": 0}, {"x": 0.995, "y": -0.062, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [A]  n=3193 cos1.00 難-0.06", "s": 0.88, "f": 0}, {"x": 0.996, "y": 0.037, "c": "近傍", "n": "SigSig [A]  n=3612 cos1.00 難0.04", "s": 0.995, "f": 0}, {"x": 0.996, "y": 0.056, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1675 cos1.00 難0.06", "s": 0.462, "f": 0}, {"x": 0.994, "y": -0.142, "c": "近傍", "n": "Ascalon [A]  n=3050 cos0.99 難-0.14", "s": 0.84, "f": 0}, {"x": 0.994, "y": -0.156, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2979 cos0.99 難-0.16", "s": 0.821, "f": 0}, {"x": 0.994, "y": -0.188, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos0.99 難-0.19", "s": 0.767, "f": 0}, {"x": 0.993, "y": -0.187, "c": "近傍", "n": "TROOPERS [H]  n=2633 cos0.99 難-0.19", "s": 0.726, "f": 0}, {"x": 0.993, "y": -0.114, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難-0.11", "s": 0.998, "f": 0}, {"x": 0.997, "y": 0.131, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos1.00 難0.13", "s": 0.809, "f": 0}, {"x": 0.994, "y": -0.275, "c": "近傍", "n": "■□模様 [A]  n=1388 cos0.99 難-0.27", "s": 0.382, "f": 0}, {"x": 0.993, "y": -0.193, "c": "近傍", "n": "New Lights [A]  n=2837 cos0.99 難-0.19", "s": 0.782, "f": 0}, {"x": 0.994, "y": -0.277, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos0.99 難-0.28", "s": 0.664, "f": 0}, {"x": 0.993, "y": -0.063, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3110 cos0.99 難-0.06", "s": 0.857, "f": 0}, {"x": 0.993, "y": -0.257, "c": "近傍", "n": "Mel [L]  n=613 cos0.99 難-0.26", "s": 0.169, "f": 0}, {"x": 0.993, "y": -0.258, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos0.99 難-0.26", "s": 0.71, "f": 0}, {"x": 0.993, "y": -0.278, "c": "近傍", "n": "Fly Above (Vicissitude Remix) [A]  n=2511 cos0.99 難-0.28", "s": 0.692, "f": 0}, {"x": 0.991, "y": -0.133, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos0.99 難-0.13", "s": 0.262, "f": 0}, {"x": 0.991, "y": -0.127, "c": "近傍", "n": "Miracle 5ympho X [A]  n=3629 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.196, "c": "近傍", "n": "Expanded !! [A]  n=2821 cos0.99 難-0.20", "s": 0.777, "f": 0}, {"x": 0.992, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.23", "s": 0.755, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.22084445457562718}, {"a": 0, "b": 2, "w": 0.3750106205446323}, {"a": 0, "b": 3, "w": 0.3949747879012566}, {"a": 0, "b": 4, "w": 0.1554713428483695}, {"a": 0, "b": 5, "w": 0.15468502175372878}, {"a": 0, "b": 6, "w": 0.06993176995284522}, {"a": 0, "b": 7, "w": 0.2500367480223382}, {"a": 0, "b": 8, "w": 5.810663061822652e-11}, {"a": 0, "b": 9, "w": 0.4807718141883732}, {"a": 0, "b": 10, "w": 0.2194165629162147}, {"a": 0, "b": 11, "w": 0.19342178325780757}, {"a": 0, "b": 12, "w": 0.25741773154464087}, {"a": 0, "b": 13, "w": 0.07917343813025612}, {"a": 0, "b": 14, "w": 0.17859753896962627}, {"a": 0, "b": 15, "w": 0.0901960624477397}, {"a": 0, "b": 16, "w": 0.2038785604245883}, {"a": 0, "b": 17, "w": 0.14607535561545604}, {"a": 0, "b": 18, "w": 0.05912014140683153}, {"a": 0, "b": 19, "w": 0.1634310050669019}, {"a": 0, "b": 20, "w": 0.09800848373144422}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.310,hiY=0.164;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
