<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Fire Beat [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.245, "c": "種", "n": "Fire Beat [A]  n=2050 cos1.00 難1.24", "s": 0.611, "f": 0}, {"x": 0.986, "y": 1.207, "c": "近傍", "n": "Xb10r [A]  n=1448 cos0.99 難1.21", "s": 0.431, "f": 0}, {"x": 0.985, "y": 1.228, "c": "近傍", "n": "Flying Castle [A]  n=2142 cos0.99 難1.23", "s": 0.638, "f": 0}, {"x": 0.993, "y": 1.01, "c": "近傍", "n": "Lethal Weapon [A]  n=3095 cos0.99 難1.01", "s": 0.922, "f": 0}, {"x": 0.984, "y": 1.26, "c": "近傍", "n": "Vitrum [A]  n=2543 cos0.98 難1.26", "s": 0.758, "f": 0}, {"x": 0.984, "y": 1.262, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3030 cos0.98 難1.26", "s": 0.903, "f": 0}, {"x": 0.986, "y": 1.108, "c": "近傍", "n": "ハイテックトキオ [L]  n=2026 cos0.99 難1.11", "s": 0.604, "f": 0}, {"x": 0.984, "y": 1.15, "c": "近傍", "n": "Sol Cosine Job 2 [A]  n=3236 cos0.98 難1.15", "s": 0.964, "f": 0}, {"x": 0.983, "y": 1.31, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.98 難1.31", "s": 0.821, "f": 0}, {"x": 0.984, "y": 1.376, "c": "近傍", "n": "24h Endurance Race [A]  n=1710 cos0.98 難1.38", "s": 0.509, "f": 0}, {"x": 0.986, "y": 1.058, "c": "近傍", "n": "Million Dollar [A]  n=1564 cos0.99 難1.06", "s": 0.466, "f": 0}, {"x": 0.985, "y": 1.088, "c": "近傍", "n": "Chaotoxin [A]  n=1947 cos0.98 難1.09", "s": 0.58, "f": 0}, {"x": 0.983, "y": 1.126, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2513 cos0.98 難1.13", "s": 0.749, "f": 0}, {"x": 0.982, "y": 1.194, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3075 cos0.98 難1.19", "s": 0.916, "f": 0}, {"x": 0.983, "y": 1.351, "c": "近傍", "n": "2 Be Continued [A]  n=953 cos0.98 難1.35", "s": 0.284, "f": 0}, {"x": 0.987, "y": 1.023, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.99 難1.02", "s": 0.956, "f": 0}, {"x": 0.983, "y": 1.376, "c": "近傍", "n": "HyperTwist [A]  n=676 cos0.98 難1.38", "s": 0.201, "f": 0}, {"x": 0.986, "y": 1.035, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.99 難1.04", "s": 0.42, "f": 0}, {"x": 0.981, "y": 1.267, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=945 cos0.98 難1.27", "s": 0.282, "f": 0}, {"x": 0.984, "y": 1.074, "c": "近傍", "n": "Always We Trust In You [A]  n=1763 cos0.98 難1.07", "s": 0.525, "f": 0}, {"x": 0.982, "y": 1.127, "c": "近傍", "n": "疾風迅雷 [A]  n=3357 cos0.98 難1.13", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1878627940785078}, {"a": 0, "b": 2, "w": 0.19262121930517273}, {"a": 0, "b": 3, "w": 0.4673530848877633}, {"a": 0, "b": 4, "w": 0.2968834735716952}, {"a": 0, "b": 5, "w": 0.23648222347495162}, {"a": 0, "b": 6, "w": 0.44813157926439706}, {"a": 0, "b": 7, "w": 0.29489478656016255}, {"a": 0, "b": 8, "w": 0.2838568746839686}, {"a": 0, "b": 9, "w": 0.3929016021881564}, {"a": 0, "b": 10, "w": 0.25450491064176617}, {"a": 0, "b": 11, "w": 0.29684570434444346}, {"a": 0, "b": 12, "w": 0.24008472123249358}, {"a": 0, "b": 13, "w": 0.2852529265436279}, {"a": 0, "b": 14, "w": 2.0651480525657462e-11}, {"a": 0, "b": 15, "w": 0.3806676981196391}, {"a": 0, "b": 16, "w": 0.34626854739000357}, {"a": 0, "b": 17, "w": 0.41972065484606447}, {"a": 0, "b": 18, "w": 0.30540488322090875}, {"a": 0, "b": 19, "w": 0.21388056024533075}, {"a": 0, "b": 20, "w": 0.4988647186255266}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=0.981,hiY=1.406;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
