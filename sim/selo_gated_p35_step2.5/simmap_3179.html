<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">≡+≡ [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.266, "c": "種", "n": "≡+≡ [L]  n=746 cos1.00 難2.27", "s": 0.251, "f": 0}, {"x": 0.988, "y": 2.198, "c": "近傍", "n": "LIGHTNING STRIKES [L]  n=1109 cos0.99 難2.20", "s": 0.373, "f": 0}, {"x": 0.988, "y": 2.196, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2970 cos0.99 難2.20", "s": 1.0, "f": 0}, {"x": 0.983, "y": 2.224, "c": "近傍", "n": "Binary Black Hole [A]  n=1876 cos0.98 難2.22", "s": 0.632, "f": 0}, {"x": 0.989, "y": 2.175, "c": "近傍", "n": "Override [L]  n=1612 cos0.99 難2.18", "s": 0.543, "f": 0}, {"x": 0.98, "y": 2.302, "c": "近傍", "n": "IX [A]  n=2727 cos0.98 難2.30", "s": 0.918, "f": 0}, {"x": 0.979, "y": 2.273, "c": "近傍", "n": "Confiserie [A]  n=2903 cos0.98 難2.27", "s": 0.977, "f": 0}, {"x": 0.993, "y": 2.143, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2335 cos0.99 難2.14", "s": 0.786, "f": 0}, {"x": 0.979, "y": 2.339, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1790 cos0.98 難2.34", "s": 0.603, "f": 0}, {"x": 0.981, "y": 2.355, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.98 難2.35", "s": 0.772, "f": 0}, {"x": 0.982, "y": 2.37, "c": "近傍", "n": "VANESSA [L]  n=2321 cos0.98 難2.37", "s": 0.781, "f": 0}, {"x": 0.984, "y": 2.39, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1151 cos0.98 難2.39", "s": 0.388, "f": 0}, {"x": 0.973, "y": 2.333, "c": "近傍", "n": "perditus†paradisus [A]  n=2878 cos0.97 難2.33", "s": 0.969, "f": 0}, {"x": 0.97, "y": 2.259, "c": "近傍", "n": "Ignis†Irae [A]  n=2008 cos0.97 難2.26", "s": 0.676, "f": 0}, {"x": 0.981, "y": 2.391, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.98 難2.39", "s": 0.707, "f": 0}, {"x": 0.988, "y": 2.414, "c": "近傍", "n": "スキッテイエェエエェ!!!! [A]  n=1005 cos0.99 難2.41", "s": 0.338, "f": 0}, {"x": 0.984, "y": 2.128, "c": "近傍", "n": "Vulnerability [A]  n=1145 cos0.98 難2.13", "s": 0.386, "f": 0}, {"x": 0.97, "y": 2.332, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2217 cos0.97 難2.33", "s": 0.746, "f": 0}, {"x": 0.977, "y": 2.402, "c": "近傍", "n": "Feel The Beat [L]  n=2738 cos0.98 難2.40", "s": 0.922, "f": 0}, {"x": 0.97, "y": 2.172, "c": "近傍", "n": "Amor∞Fati [A]  n=559 cos0.97 難2.17", "s": 0.188, "f": 0}, {"x": 0.967, "y": 2.339, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [A]  n=1055 cos0.97 難2.34", "s": 0.355, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3406964812416706}, {"a": 0, "b": 2, "w": 0.25215822916410013}, {"a": 0, "b": 3, "w": 0.26687277179545155}, {"a": 0, "b": 4, "w": 0.3382624898520561}, {"a": 0, "b": 5, "w": 0.19993564743260706}, {"a": 0, "b": 6, "w": 0.18135836941331251}, {"a": 0, "b": 7, "w": 0.38428579982017164}, {"a": 0, "b": 8, "w": 0.04337483767812156}, {"a": 0, "b": 9, "w": 0.23515804670700724}, {"a": 0, "b": 10, "w": 0.26635085072116604}, {"a": 0, "b": 11, "w": 0.30780501384494685}, {"a": 0, "b": 12, "w": 0.15191774910503808}, {"a": 0, "b": 13, "w": 0.05699031480546368}, {"a": 0, "b": 14, "w": 0.18593932752731024}, {"a": 0, "b": 15, "w": 0.38284271522955193}, {"a": 0, "b": 16, "w": 0.1511989671871744}, {"a": 0, "b": 17, "w": 1.639655078378155e-11}, {"a": 0, "b": 18, "w": 0.25446167343560233}, {"a": 0, "b": 19, "w": 0.09312224593592111}, {"a": 0, "b": 20, "w": 0.11349837076828417}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.965,hiX=1.003,loY=2.105,hiY=2.437;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
