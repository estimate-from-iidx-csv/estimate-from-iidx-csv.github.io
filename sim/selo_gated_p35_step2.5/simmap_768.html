<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">beatAffection [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.196, "c": "種", "n": "beatAffection [A]  n=2812 cos1.00 難-0.20", "s": 0.816, "f": 0}, {"x": 0.996, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos1.00 難-0.10", "s": 0.898, "f": 0}, {"x": 0.995, "y": -0.188, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.19", "s": 0.808, "f": 0}, {"x": 0.996, "y": -0.277, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos1.00 難-0.28", "s": 0.699, "f": 0}, {"x": 0.995, "y": -0.212, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos0.99 難-0.21", "s": 0.902, "f": 0}, {"x": 0.995, "y": -0.275, "c": "近傍", "n": "■□模様 [A]  n=1388 cos1.00 難-0.27", "s": 0.403, "f": 0}, {"x": 0.995, "y": -0.304, "c": "近傍", "n": "Express Emotion [A]  n=3445 cos0.99 難-0.30", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.239, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos0.99 難-0.24", "s": 0.725, "f": 0}, {"x": 0.994, "y": -0.196, "c": "近傍", "n": "Breakin' Chain [A]  n=2893 cos0.99 難-0.20", "s": 0.84, "f": 0}, {"x": 0.996, "y": -0.372, "c": "近傍", "n": "Take It Easy [H]  n=2268 cos1.00 難-0.37", "s": 0.658, "f": 0}, {"x": 0.994, "y": -0.308, "c": "近傍", "n": "メテオラ-meteor- [A]  n=575 cos0.99 難-0.31", "s": 0.167, "f": 0}, {"x": 0.993, "y": -0.229, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3183 cos0.99 難-0.23", "s": 0.924, "f": 0}, {"x": 0.996, "y": -0.416, "c": "近傍", "n": "Kung-fu Empire [H]  n=3013 cos1.00 難-0.42", "s": 0.875, "f": 0}, {"x": 0.995, "y": -0.377, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos0.99 難-0.38", "s": 0.964, "f": 0}, {"x": 0.993, "y": -0.119, "c": "近傍", "n": "Shirdal [A]  n=695 cos0.99 難-0.12", "s": 0.202, "f": 0}, {"x": 0.993, "y": -0.242, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos0.99 難-0.24", "s": 0.854, "f": 0}, {"x": 0.993, "y": -0.297, "c": "近傍", "n": "夏の匂い。キミの残像。 ft. Kanae Asaba [A]  n=3233 cos0.99 難-0.30", "s": 0.938, "f": 0}, {"x": 0.993, "y": -0.26, "c": "近傍", "n": "オルタネイトβ [A]  n=3292 cos0.99 難-0.26", "s": 0.956, "f": 0}, {"x": 0.994, "y": -0.377, "c": "近傍", "n": "ANAGRAMS I to Y [A]  n=2713 cos0.99 難-0.38", "s": 0.788, "f": 0}, {"x": 0.992, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.16", "s": 0.913, "f": 0}, {"x": 0.992, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.23", "s": 0.795, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40747794543685834}, {"a": 0, "b": 2, "w": 0.33399617873641385}, {"a": 0, "b": 3, "w": 0.3865202937365868}, {"a": 0, "b": 4, "w": 0.3408504950888823}, {"a": 0, "b": 5, "w": 0.36877548031789886}, {"a": 0, "b": 6, "w": 0.34945674282791295}, {"a": 0, "b": 7, "w": 0.2958826439836715}, {"a": 0, "b": 8, "w": 0.297927179129437}, {"a": 0, "b": 9, "w": 0.3842540860507758}, {"a": 0, "b": 10, "w": 0.32170044826929056}, {"a": 0, "b": 11, "w": 0.24188328734628117}, {"a": 0, "b": 12, "w": 0.3632189014361896}, {"a": 0, "b": 13, "w": 6.098921367936327e-11}, {"a": 0, "b": 14, "w": 0.2384717893931142}, {"a": 0, "b": 15, "w": 0.12827923942099106}, {"a": 0, "b": 16, "w": 0.21684820806491434}, {"a": 0, "b": 17, "w": 0.06776528060946552}, {"a": 0, "b": 18, "w": 0.10507345529159107}, {"a": 0, "b": 19, "w": 0.2208478760218019}, {"a": 0, "b": 20, "w": 0.21778920254269407}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.441,hiY=-0.076;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
