<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Almace [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.202, "c": "種", "n": "Almace [A]  n=3119 cos1.00 難-0.20", "s": 0.989, "f": 0}, {"x": 0.998, "y": -0.122, "c": "近傍", "n": "If [A]  n=2170 cos1.00 難-0.12", "s": 0.688, "f": 0}, {"x": 0.994, "y": -0.256, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=992 cos0.99 難-0.26", "s": 0.315, "f": 0}, {"x": 0.996, "y": -0.379, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos1.00 難-0.38", "s": 0.786, "f": 0}, {"x": 0.995, "y": -0.313, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos0.99 難-0.31", "s": 0.88, "f": 0}, {"x": 0.997, "y": -0.012, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos1.00 難-0.01", "s": 0.776, "f": 0}, {"x": 0.993, "y": -0.235, "c": "近傍", "n": "MINT [H]  n=2436 cos0.99 難-0.23", "s": 0.772, "f": 0}, {"x": 0.994, "y": -0.346, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.35", "s": 0.811, "f": 0}, {"x": 0.993, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.99 難-0.15", "s": 0.906, "f": 0}, {"x": 0.993, "y": -0.175, "c": "近傍", "n": "Freeway Shuffle [A]  n=2925 cos0.99 難-0.18", "s": 0.927, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "霧幻メモリア [A]  n=2432 cos0.99 難-0.25", "s": 0.771, "f": 0}, {"x": 0.993, "y": -0.297, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.30", "s": 0.731, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "Several Words [A]  n=3039 cos0.99 難-0.25", "s": 0.964, "f": 0}, {"x": 0.993, "y": -0.377, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.99 難-0.38", "s": 0.997, "f": 0}, {"x": 0.991, "y": -0.245, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.24", "s": 0.674, "f": 0}, {"x": 0.991, "y": -0.156, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.16", "s": 0.672, "f": 0}, {"x": 0.991, "y": -0.178, "c": "近傍", "n": "Lucky Days [A]  n=2965 cos0.99 難-0.18", "s": 0.94, "f": 0}, {"x": 0.991, "y": -0.236, "c": "近傍", "n": "ミッドナイト☆WAR [A]  n=3154 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.462, "c": "近傍", "n": "海神 [H]  n=3063 cos0.99 難-0.46", "s": 0.971, "f": 0}, {"x": 0.991, "y": -0.295, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.29", "s": 0.809, "f": 0}, {"x": 0.991, "y": -0.339, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos0.99 難-0.34", "s": 0.448, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5631776278141634}, {"a": 0, "b": 2, "w": 0.2683810753566095}, {"a": 0, "b": 3, "w": 0.5077750584134827}, {"a": 0, "b": 4, "w": 0.17137669361203167}, {"a": 0, "b": 5, "w": 0.29595563423288684}, {"a": 0, "b": 6, "w": 0.01336579618984124}, {"a": 0, "b": 7, "w": 0.12817137241063903}, {"a": 0, "b": 8, "w": 0.24127471744231355}, {"a": 0, "b": 9, "w": 0.11013263024419828}, {"a": 0, "b": 10, "w": 0.3454476031261259}, {"a": 0, "b": 11, "w": 0.25100115265276535}, {"a": 0, "b": 12, "w": 0.3361246385946811}, {"a": 0, "b": 13, "w": 0.2347856635980179}, {"a": 0, "b": 14, "w": 0.12433977903979865}, {"a": 0, "b": 15, "w": 0.1896538067777741}, {"a": 0, "b": 16, "w": 0.22490911734111696}, {"a": 0, "b": 17, "w": 0.28004398269943376}, {"a": 0, "b": 18, "w": 0.29427296564866356}, {"a": 0, "b": 19, "w": 4.6958659183360396e-11}, {"a": 0, "b": 20, "w": 0.09892800079819708}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.498,hiY=0.024;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
