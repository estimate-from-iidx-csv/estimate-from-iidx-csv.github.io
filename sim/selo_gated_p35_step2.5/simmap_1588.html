<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Xlo [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.386, "c": "種", "n": "Xlo [H]  n=2314 cos1.00 難-0.39", "s": 0.673, "f": 0}, {"x": 0.996, "y": -0.393, "c": "近傍", "n": "ドリムチウ [A]  n=1161 cos1.00 難-0.39", "s": 0.338, "f": 0}, {"x": 0.995, "y": -0.484, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos1.00 難-0.48", "s": 0.695, "f": 0}, {"x": 0.994, "y": -0.302, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos0.99 難-0.30", "s": 0.722, "f": 0}, {"x": 0.994, "y": -0.261, "c": "近傍", "n": "Candy Galy [H]  n=2910 cos0.99 難-0.26", "s": 0.846, "f": 0}, {"x": 0.993, "y": -0.254, "c": "近傍", "n": "Flash Back 90's [A]  n=3439 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.364, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.99 難-0.36", "s": 0.698, "f": 0}, {"x": 0.992, "y": -0.302, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.99 難-0.30", "s": 0.843, "f": 0}, {"x": 0.994, "y": -0.171, "c": "近傍", "n": "Super Duper Racers [A]  n=2874 cos0.99 難-0.17", "s": 0.836, "f": 0}, {"x": 0.995, "y": -0.146, "c": "近傍", "n": "NPC World [A]  n=2851 cos0.99 難-0.15", "s": 0.829, "f": 0}, {"x": 0.993, "y": -0.197, "c": "近傍", "n": "SOLID STATE SQUAD [H]  n=2672 cos0.99 難-0.20", "s": 0.777, "f": 0}, {"x": 0.993, "y": -0.553, "c": "近傍", "n": "オブソミート [A]  n=1258 cos0.99 難-0.55", "s": 0.366, "f": 0}, {"x": 0.993, "y": -0.175, "c": "近傍", "n": "Shiva [A]  n=3026 cos0.99 難-0.17", "s": 0.88, "f": 0}, {"x": 0.991, "y": -0.29, "c": "近傍", "n": "MENTAL MELTDOWN [H]  n=2512 cos0.99 難-0.29", "s": 0.73, "f": 0}, {"x": 0.992, "y": -0.547, "c": "近傍", "n": "KILL EACH OTHER [H]  n=2022 cos0.99 難-0.55", "s": 0.588, "f": 0}, {"x": 0.993, "y": -0.613, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos0.99 難-0.61", "s": 0.711, "f": 0}, {"x": 0.991, "y": -0.263, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.26", "s": 0.893, "f": 0}, {"x": 0.991, "y": -0.472, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos0.99 難-0.47", "s": 0.74, "f": 0}, {"x": 0.991, "y": -0.495, "c": "近傍", "n": "In Heaven [A]  n=2966 cos0.99 難-0.50", "s": 0.862, "f": 0}, {"x": 0.992, "y": -0.59, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos0.99 難-0.59", "s": 0.755, "f": 0}, {"x": 0.992, "y": -0.191, "c": "近傍", "n": "BLO§OM [A]  n=2557 cos0.99 難-0.19", "s": 0.744, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4931346113289675}, {"a": 0, "b": 2, "w": 0.4214600053251125}, {"a": 0, "b": 3, "w": 0.08968593850042761}, {"a": 0, "b": 4, "w": 0.35040359232621354}, {"a": 0, "b": 5, "w": 0.24493797838270936}, {"a": 0, "b": 6, "w": 0.2919064396360561}, {"a": 0, "b": 7, "w": 0.009874157906290537}, {"a": 0, "b": 8, "w": 0.38383733454902447}, {"a": 0, "b": 9, "w": 0.29533153695182135}, {"a": 0, "b": 10, "w": 0.34475939619781015}, {"a": 0, "b": 11, "w": 0.27539782993790674}, {"a": 0, "b": 12, "w": 0.3437672331840482}, {"a": 0, "b": 13, "w": 0.23188395856681276}, {"a": 0, "b": 14, "w": 0.28904255080569663}, {"a": 0, "b": 15, "w": 0.2952159600151316}, {"a": 0, "b": 16, "w": 0.025856609677150866}, {"a": 0, "b": 17, "w": 0.1382754647434149}, {"a": 0, "b": 18, "w": 4.85660400784127e-11}, {"a": 0, "b": 19, "w": 0.10177562617447478}, {"a": 0, "b": 20, "w": 0.2633752341843977}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.650,hiY=-0.108;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
