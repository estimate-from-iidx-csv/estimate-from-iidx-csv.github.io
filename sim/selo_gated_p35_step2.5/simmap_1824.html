<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dawn Saga [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.373, "c": "種", "n": "Dawn Saga [A]  n=2733 cos1.00 難0.37", "s": 0.778, "f": 0}, {"x": 0.995, "y": 0.347, "c": "近傍", "n": "鬼天 [A]  n=3356 cos1.00 難0.35", "s": 0.955, "f": 0}, {"x": 0.995, "y": 0.192, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2640 cos0.99 難0.19", "s": 0.751, "f": 0}, {"x": 0.993, "y": 0.286, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2466 cos0.99 難0.29", "s": 0.702, "f": 0}, {"x": 0.992, "y": 0.298, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2736 cos0.99 難0.30", "s": 0.779, "f": 0}, {"x": 0.99, "y": 0.382, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.38", "s": 0.945, "f": 0}, {"x": 0.993, "y": 0.114, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2858 cos0.99 難0.11", "s": 0.814, "f": 0}, {"x": 0.99, "y": 0.245, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.24", "s": 0.873, "f": 0}, {"x": 0.989, "y": 0.403, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3025 cos0.99 難0.40", "s": 0.861, "f": 0}, {"x": 0.989, "y": 0.255, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.26", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.193, "c": "近傍", "n": "HEISEI [A]  n=3350 cos0.99 難0.19", "s": 0.954, "f": 0}, {"x": 0.996, "y": 0.013, "c": "近傍", "n": "voice of echo. [A]  n=814 cos1.00 難0.01", "s": 0.232, "f": 0}, {"x": 0.988, "y": 0.403, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.99 難0.40", "s": 0.887, "f": 0}, {"x": 0.988, "y": 0.44, "c": "近傍", "n": "Ergosphere [A]  n=2075 cos0.99 難0.44", "s": 0.591, "f": 0}, {"x": 0.988, "y": 0.376, "c": "近傍", "n": "Afterimage d'automne [A]  n=2746 cos0.99 難0.38", "s": 0.782, "f": 0}, {"x": 0.989, "y": 0.535, "c": "近傍", "n": "glacia [A]  n=2172 cos0.99 難0.54", "s": 0.618, "f": 0}, {"x": 0.99, "y": 0.119, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.12", "s": 0.931, "f": 0}, {"x": 0.987, "y": 0.377, "c": "近傍", "n": "Aublia [A]  n=3096 cos0.99 難0.38", "s": 0.881, "f": 0}, {"x": 0.988, "y": 0.194, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.99 難0.19", "s": 0.72, "f": 0}, {"x": 0.991, "y": 0.08, "c": "近傍", "n": "Energy Drive [A]  n=3461 cos0.99 難0.08", "s": 0.985, "f": 0}, {"x": 0.99, "y": 0.099, "c": "近傍", "n": "Rejection Girl [A]  n=2662 cos0.99 難0.10", "s": 0.758, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49165892723517857}, {"a": 0, "b": 2, "w": 0.49523602942381584}, {"a": 0, "b": 3, "w": 0.4124489823006319}, {"a": 0, "b": 4, "w": 0.34686241382678107}, {"a": 0, "b": 5, "w": 0.08285825777116107}, {"a": 0, "b": 6, "w": 0.378923803988353}, {"a": 0, "b": 7, "w": 0.2744764732631073}, {"a": 0, "b": 8, "w": 0.2847474443047292}, {"a": 0, "b": 9, "w": 0.27421512300055984}, {"a": 0, "b": 10, "w": 0.22548217063663267}, {"a": 0, "b": 11, "w": 0.5602469137327019}, {"a": 0, "b": 12, "w": 0.1753743896204678}, {"a": 0, "b": 13, "w": 0.23352636282661088}, {"a": 0, "b": 14, "w": 0.19215448618879427}, {"a": 0, "b": 15, "w": 0.15982405575595404}, {"a": 0, "b": 16, "w": 3.8516079214900856e-11}, {"a": 0, "b": 17, "w": 0.18705903349438346}, {"a": 0, "b": 18, "w": 0.26475594236395117}, {"a": 0, "b": 19, "w": 0.2723500047757431}, {"a": 0, "b": 20, "w": 0.32779342060133565}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.029,hiY=0.577;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
