<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Todestrieb [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.81, "c": "種", "n": "Todestrieb [H]  n=3122 cos1.00 難-0.81", "s": 0.956, "f": 0}, {"x": 0.994, "y": -0.684, "c": "近傍", "n": "Sounds Of Summer [H]  n=2726 cos0.99 難-0.68", "s": 0.834, "f": 0}, {"x": 0.991, "y": -0.699, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2530 cos0.99 難-0.70", "s": 0.774, "f": 0}, {"x": 0.991, "y": -0.694, "c": "近傍", "n": "THANK YOU FOR PLAYING [H]  n=2456 cos0.99 難-0.69", "s": 0.752, "f": 0}, {"x": 0.99, "y": -0.903, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2054 cos0.99 難-0.90", "s": 0.629, "f": 0}, {"x": 0.993, "y": -1.016, "c": "近傍", "n": "Boomy and The Boost [H]  n=2209 cos0.99 難-1.02", "s": 0.676, "f": 0}, {"x": 0.989, "y": -0.845, "c": "近傍", "n": "凛として咲く花の如く [H]  n=3267 cos0.99 難-0.85", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.871, "c": "近傍", "n": "FLOWER [H]  n=3221 cos0.99 難-0.87", "s": 0.986, "f": 0}, {"x": 0.993, "y": -1.03, "c": "近傍", "n": "魔法のかくれんぼ [H]  n=1209 cos0.99 難-1.03", "s": 0.37, "f": 0}, {"x": 0.993, "y": -1.031, "c": "近傍", "n": "バンブーソード・ガール [H]  n=2279 cos0.99 難-1.03", "s": 0.698, "f": 0}, {"x": 0.995, "y": -1.076, "c": "近傍", "n": "Triple Cross [H]  n=1734 cos0.99 難-1.08", "s": 0.531, "f": 0}, {"x": 0.996, "y": -1.093, "c": "近傍", "n": "cinder [H]  n=1446 cos1.00 難-1.09", "s": 0.443, "f": 0}, {"x": 0.988, "y": -0.812, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos0.99 難-0.81", "s": 0.733, "f": 0}, {"x": 0.992, "y": -0.575, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2272 cos0.99 難-0.58", "s": 0.695, "f": 0}, {"x": 0.993, "y": -0.554, "c": "近傍", "n": "Digital Radiance [A]  n=1249 cos0.99 難-0.55", "s": 0.382, "f": 0}, {"x": 0.988, "y": -0.874, "c": "近傍", "n": "voltississimo [H]  n=1811 cos0.99 難-0.87", "s": 0.554, "f": 0}, {"x": 0.991, "y": -1.048, "c": "近傍", "n": "Visterhv [H]  n=2069 cos0.99 難-1.05", "s": 0.633, "f": 0}, {"x": 0.987, "y": -0.729, "c": "近傍", "n": "Frozen Ray (original mix) [H]  n=1862 cos0.99 難-0.73", "s": 0.57, "f": 0}, {"x": 0.988, "y": -0.689, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1232 cos0.99 難-0.69", "s": 0.377, "f": 0}, {"x": 0.989, "y": -0.987, "c": "近傍", "n": "examination leave [H]  n=1911 cos0.99 難-0.99", "s": 0.585, "f": 0}, {"x": 0.987, "y": -0.894, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2287 cos0.99 難-0.89", "s": 0.7, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.587933065772025}, {"a": 0, "b": 2, "w": 0.553126416097466}, {"a": 0, "b": 3, "w": 0.6006406640986002}, {"a": 0, "b": 4, "w": 0.5865060841334118}, {"a": 0, "b": 5, "w": 0.6404190639659693}, {"a": 0, "b": 6, "w": 0.5437986070526255}, {"a": 0, "b": 7, "w": 0.5573279777019862}, {"a": 0, "b": 8, "w": 0.6391882742078454}, {"a": 0, "b": 9, "w": 0.6376744287489963}, {"a": 0, "b": 10, "w": 0.4606731864423056}, {"a": 0, "b": 11, "w": 0.590414451184816}, {"a": 0, "b": 12, "w": 0.5368114633851551}, {"a": 0, "b": 13, "w": 0.6040841621807249}, {"a": 0, "b": 14, "w": 0.6237079325640469}, {"a": 0, "b": 15, "w": 3.386868563381995e-11}, {"a": 0, "b": 16, "w": 0.4429794474460389}, {"a": 0, "b": 17, "w": 0.516527975752036}, {"a": 0, "b": 18, "w": 0.5246864156268447}, {"a": 0, "b": 19, "w": 0.5121310909992411}, {"a": 0, "b": 20, "w": 0.5232804451054994}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.137,hiY=-0.511;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
