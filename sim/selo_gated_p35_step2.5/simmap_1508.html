<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">SOLAR ECLIPSE [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.643, "c": "種", "n": "SOLAR ECLIPSE [H]  n=1479 cos1.00 難-0.64", "s": 0.472, "f": 0}, {"x": 0.995, "y": -0.678, "c": "近傍", "n": "ONIGOROSHI [H]  n=1805 cos0.99 難-0.68", "s": 0.576, "f": 0}, {"x": 0.995, "y": -0.586, "c": "近傍", "n": "Xperanza [H]  n=2619 cos0.99 難-0.59", "s": 0.836, "f": 0}, {"x": 0.991, "y": -0.711, "c": "近傍", "n": "DESIRE [H]  n=2029 cos0.99 難-0.71", "s": 0.648, "f": 0}, {"x": 0.994, "y": -0.417, "c": "近傍", "n": "DEADHEAT [H]  n=2289 cos0.99 難-0.42", "s": 0.731, "f": 0}, {"x": 0.992, "y": -0.445, "c": "近傍", "n": "Watermelon Explosion [A]  n=775 cos0.99 難-0.44", "s": 0.247, "f": 0}, {"x": 0.993, "y": -0.884, "c": "近傍", "n": "Smashing Wedge [H]  n=1618 cos0.99 難-0.88", "s": 0.516, "f": 0}, {"x": 0.993, "y": -0.375, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1081 cos0.99 難-0.37", "s": 0.345, "f": 0}, {"x": 0.989, "y": -0.561, "c": "近傍", "n": "金野火織の金色提言 [H]  n=2553 cos0.99 難-0.56", "s": 0.815, "f": 0}, {"x": 0.992, "y": -0.883, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1683 cos0.99 難-0.88", "s": 0.537, "f": 0}, {"x": 0.989, "y": -0.532, "c": "近傍", "n": "Skywalking [A]  n=620 cos0.99 難-0.53", "s": 0.198, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos1.00 難-0.25", "s": 0.716, "f": 0}, {"x": 0.99, "y": -0.403, "c": "近傍", "n": "Level One [H]  n=2810 cos0.99 難-0.40", "s": 0.897, "f": 0}, {"x": 0.988, "y": -0.528, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.99 難-0.53", "s": 0.914, "f": 0}, {"x": 0.988, "y": -0.531, "c": "近傍", "n": "Everlasting Message [H]  n=2008 cos0.99 難-0.53", "s": 0.641, "f": 0}, {"x": 0.993, "y": -1.016, "c": "近傍", "n": "1116 [H]  n=662 cos0.99 難-1.02", "s": 0.211, "f": 0}, {"x": 0.988, "y": -0.823, "c": "近傍", "n": "Rampage [H]  n=2519 cos0.99 難-0.82", "s": 0.804, "f": 0}, {"x": 0.989, "y": -0.386, "c": "近傍", "n": "Time to Air [H]  n=3133 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2592 cos0.99 難-0.59", "s": 0.827, "f": 0}, {"x": 0.987, "y": -0.729, "c": "近傍", "n": "TOMAHAWK [H]  n=1306 cos0.99 難-0.73", "s": 0.417, "f": 0}, {"x": 0.989, "y": -0.399, "c": "近傍", "n": "THE DETONATOR [H]  n=2220 cos0.99 難-0.40", "s": 0.709, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5087108910639937}, {"a": 0, "b": 2, "w": 0.5425507794057307}, {"a": 0, "b": 3, "w": 3.542921511723307e-11}, {"a": 0, "b": 4, "w": 0.3693054680125244}, {"a": 0, "b": 5, "w": 0.4704781034266402}, {"a": 0, "b": 6, "w": 0.4036394625918993}, {"a": 0, "b": 7, "w": 0.5095973662564014}, {"a": 0, "b": 8, "w": 0.38024140178702015}, {"a": 0, "b": 9, "w": 0.39229444091783705}, {"a": 0, "b": 10, "w": 0.35442832819346615}, {"a": 0, "b": 11, "w": 0.589965719992132}, {"a": 0, "b": 12, "w": 0.4264848722531632}, {"a": 0, "b": 13, "w": 0.13046063364407623}, {"a": 0, "b": 14, "w": 0.3728167957966708}, {"a": 0, "b": 15, "w": 0.41891132223428207}, {"a": 0, "b": 16, "w": 0.3070779210620399}, {"a": 0, "b": 17, "w": 0.2879901415650937}, {"a": 0, "b": 18, "w": 0.1041585949233147}, {"a": 0, "b": 19, "w": 0.3137901441843465}, {"a": 0, "b": 20, "w": 0.28115415386941445}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.078,hiY=-0.188;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
