<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">勇者 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.25, "c": "種", "n": "勇者 [A]  n=1812 cos1.00 難-0.25", "s": 0.49, "f": 0}, {"x": 0.997, "y": -0.254, "c": "近傍", "n": "タンポポ [A]  n=713 cos1.00 難-0.25", "s": 0.193, "f": 0}, {"x": 0.996, "y": -0.308, "c": "近傍", "n": "メテオラ-meteor- [A]  n=575 cos1.00 難-0.31", "s": 0.155, "f": 0}, {"x": 0.995, "y": -0.239, "c": "近傍", "n": "マーシャル・マキシマイザー [A]  n=1814 cos1.00 難-0.24", "s": 0.49, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "Τeλοs [A]  n=606 cos0.99 難-0.19", "s": 0.164, "f": 0}, {"x": 0.994, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.16", "s": 0.85, "f": 0}, {"x": 0.993, "y": -0.241, "c": "近傍", "n": "NEEDLESS MY LOVE FOR YOU [A]  n=1168 cos0.99 難-0.24", "s": 0.316, "f": 0}, {"x": 0.995, "y": -0.087, "c": "近傍", "n": "Shadow World [A]  n=2323 cos0.99 難-0.09", "s": 0.628, "f": 0}, {"x": 0.995, "y": -0.069, "c": "近傍", "n": "Shapeshifter [A]  n=1780 cos1.00 難-0.07", "s": 0.481, "f": 0}, {"x": 0.994, "y": -0.103, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難-0.10", "s": 0.31, "f": 0}, {"x": 0.995, "y": -0.072, "c": "近傍", "n": "断罪の一花 [A]  n=1496 cos1.00 難-0.07", "s": 0.404, "f": 0}, {"x": 0.994, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.10", "s": 0.836, "f": 0}, {"x": 0.992, "y": -0.232, "c": "近傍", "n": "Aeterna [A]  n=1756 cos0.99 難-0.23", "s": 0.474, "f": 0}, {"x": 0.991, "y": -0.26, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos0.99 難-0.26", "s": 0.689, "f": 0}, {"x": 0.995, "y": -0.471, "c": "近傍", "n": "Despair of ELFERIA [H]  n=2663 cos1.00 難-0.47", "s": 0.72, "f": 0}, {"x": 0.991, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.23", "s": 0.74, "f": 0}, {"x": 0.991, "y": -0.195, "c": "近傍", "n": "The Sky of Sadness [A]  n=2249 cos0.99 難-0.20", "s": 0.608, "f": 0}, {"x": 0.991, "y": -0.297, "c": "近傍", "n": "DAYDREAMER [A]  n=3287 cos0.99 難-0.30", "s": 0.888, "f": 0}, {"x": 0.99, "y": -0.252, "c": "近傍", "n": "SHION [A]  n=3340 cos0.99 難-0.25", "s": 0.902, "f": 0}, {"x": 0.99, "y": -0.315, "c": "近傍", "n": "EDEN [A]  n=3701 cos0.99 難-0.32", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.642, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.13935482325942017}, {"a": 0, "b": 2, "w": 0.4207015907725986}, {"a": 0, "b": 3, "w": 0.3150373119776809}, {"a": 0, "b": 4, "w": 0.18125768302047696}, {"a": 0, "b": 5, "w": 0.25096558528101875}, {"a": 0, "b": 6, "w": 0.19222431122688155}, {"a": 0, "b": 7, "w": 0.29288305900930156}, {"a": 0, "b": 8, "w": 0.19815419640568044}, {"a": 0, "b": 9, "w": 0.15772352725341066}, {"a": 0, "b": 10, "w": 0.23282068894707397}, {"a": 0, "b": 11, "w": 0.24258966562756268}, {"a": 0, "b": 12, "w": 0.07675164305001891}, {"a": 0, "b": 13, "w": 6.41802166967409e-11}, {"a": 0, "b": 14, "w": 0.32831125839911346}, {"a": 0, "b": 15, "w": 0.08882037921157737}, {"a": 0, "b": 16, "w": 0.07918885731307168}, {"a": 0, "b": 17, "w": 0.08473233263580182}, {"a": 0, "b": 18, "w": 0.006998300605794094}, {"a": 0, "b": 19, "w": 0.03429055782188406}, {"a": 0, "b": 20, "w": 0.16827043229183292}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.505,hiY=-0.008;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
