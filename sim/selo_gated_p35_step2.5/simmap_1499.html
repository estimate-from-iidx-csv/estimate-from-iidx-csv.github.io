<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Sigmund [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.483, "c": "種", "n": "Sigmund [H]  n=2989 cos1.00 難-0.48", "s": 0.901, "f": 0}, {"x": 0.993, "y": -0.527, "c": "近傍", "n": "Carmina [H]  n=2220 cos0.99 難-0.53", "s": 0.669, "f": 0}, {"x": 0.993, "y": -0.57, "c": "近傍", "n": "TOXIC VIBRATION [H]  n=2913 cos0.99 難-0.57", "s": 0.878, "f": 0}, {"x": 0.992, "y": -0.579, "c": "近傍", "n": "Verflucht [H]  n=3274 cos0.99 難-0.58", "s": 0.987, "f": 0}, {"x": 0.993, "y": -0.599, "c": "近傍", "n": "シムルグの目醒め [H]  n=2325 cos0.99 難-0.60", "s": 0.701, "f": 0}, {"x": 0.991, "y": -0.398, "c": "近傍", "n": "AA -rebuild- [H]  n=3002 cos0.99 難-0.40", "s": 0.905, "f": 0}, {"x": 0.989, "y": -0.433, "c": "近傍", "n": "疾風迅雷 [H]  n=2797 cos0.99 難-0.43", "s": 0.843, "f": 0}, {"x": 0.989, "y": -0.402, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.40", "s": 0.751, "f": 0}, {"x": 0.989, "y": -0.4, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.99 難-0.40", "s": 0.519, "f": 0}, {"x": 0.997, "y": -0.232, "c": "近傍", "n": "共鳴遊戯の華 [H]  n=2742 cos1.00 難-0.23", "s": 0.827, "f": 0}, {"x": 0.988, "y": -0.536, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3252 cos0.99 難-0.54", "s": 0.981, "f": 0}, {"x": 0.988, "y": -0.386, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.39", "s": 0.942, "f": 0}, {"x": 0.989, "y": -0.325, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.32", "s": 0.742, "f": 0}, {"x": 0.987, "y": -0.623, "c": "近傍", "n": "StrayedCatz [H]  n=2624 cos0.99 難-0.62", "s": 0.791, "f": 0}, {"x": 0.986, "y": -0.611, "c": "近傍", "n": "Colors (radio edit) [H]  n=2377 cos0.99 難-0.61", "s": 0.717, "f": 0}, {"x": 0.985, "y": -0.43, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos0.99 難-0.43", "s": 0.985, "f": 0}, {"x": 0.985, "y": -0.467, "c": "近傍", "n": "F [H]  n=3316 cos0.98 難-0.47", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.355, "c": "近傍", "n": "Adularia [H]  n=3011 cos0.99 難-0.36", "s": 0.908, "f": 0}, {"x": 0.988, "y": -0.681, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos0.99 難-0.68", "s": 0.561, "f": 0}, {"x": 0.986, "y": -0.636, "c": "近傍", "n": "Ignis†Irae [H]  n=1632 cos0.99 難-0.64", "s": 0.492, "f": 0}, {"x": 0.985, "y": -0.378, "c": "近傍", "n": "GAIA [H]  n=2878 cos0.99 難-0.38", "s": 0.868, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2380022683641274}, {"a": 0, "b": 2, "w": 0.47307774416732984}, {"a": 0, "b": 3, "w": 0.27744876234845084}, {"a": 0, "b": 4, "w": 0.4359822400714395}, {"a": 0, "b": 5, "w": 0.3247591977240658}, {"a": 0, "b": 6, "w": 0.2970593966810384}, {"a": 0, "b": 7, "w": 0.31415733769127574}, {"a": 0, "b": 8, "w": 0.28018639545594515}, {"a": 0, "b": 9, "w": 0.6435942283729869}, {"a": 0, "b": 10, "w": 0.21297931083986843}, {"a": 0, "b": 11, "w": 0.27871289722804193}, {"a": 0, "b": 12, "w": 0.2776651421214663}, {"a": 0, "b": 13, "w": 0.16045832791119785}, {"a": 0, "b": 14, "w": 4.2327363836136556e-11}, {"a": 0, "b": 15, "w": 0.21785974924589224}, {"a": 0, "b": 16, "w": 0.05332504563015095}, {"a": 0, "b": 17, "w": 0.17841131086084605}, {"a": 0, "b": 18, "w": 0.29094382112570527}, {"a": 0, "b": 19, "w": 0.1397587485755597}, {"a": 0, "b": 20, "w": 0.2163075743122448}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.717,hiY=-0.196;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
