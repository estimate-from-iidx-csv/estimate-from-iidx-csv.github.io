<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Space Battleship S4TO [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.995, "c": "種", "n": "Space Battleship S4TO [A]  n=970 cos1.00 難0.99", "s": 0.274, "f": 0}, {"x": 0.997, "y": 0.959, "c": "近傍", "n": "Ypsilon [L]  n=2342 cos1.00 難0.96", "s": 0.662, "f": 0}, {"x": 0.996, "y": 1.016, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos1.00 難1.02", "s": 0.372, "f": 0}, {"x": 0.995, "y": 0.969, "c": "近傍", "n": "シュレーディンガーの猫 [A]  n=3495 cos1.00 難0.97", "s": 0.988, "f": 0}, {"x": 0.996, "y": 0.94, "c": "近傍", "n": "spiral galaxy [L]  n=3069 cos1.00 難0.94", "s": 0.868, "f": 0}, {"x": 0.994, "y": 0.956, "c": "近傍", "n": "Kung-fu Empire [L]  n=3294 cos0.99 難0.96", "s": 0.932, "f": 0}, {"x": 0.995, "y": 1.047, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3455 cos1.00 難1.05", "s": 0.977, "f": 0}, {"x": 0.992, "y": 1.0, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3274 cos0.99 難1.00", "s": 0.926, "f": 0}, {"x": 0.997, "y": 0.927, "c": "近傍", "n": "dAuntl3ss [A]  n=3300 cos1.00 難0.93", "s": 0.933, "f": 0}, {"x": 0.992, "y": 0.97, "c": "近傍", "n": "FUZIN RIZIN [A]  n=3386 cos0.99 難0.97", "s": 0.958, "f": 0}, {"x": 0.993, "y": 1.038, "c": "近傍", "n": "華爛漫 -Flowers- [L]  n=2171 cos0.99 難1.04", "s": 0.614, "f": 0}, {"x": 0.993, "y": 1.041, "c": "近傍", "n": "HARD BRAIN [A]  n=3026 cos0.99 難1.04", "s": 0.856, "f": 0}, {"x": 0.992, "y": 1.028, "c": "近傍", "n": "不沈艦CANDY [A]  n=3417 cos0.99 難1.03", "s": 0.966, "f": 0}, {"x": 0.992, "y": 0.957, "c": "近傍", "n": "Sounds Of Summer [A]  n=3419 cos0.99 難0.96", "s": 0.967, "f": 0}, {"x": 0.991, "y": 1.023, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.99 難1.02", "s": 0.908, "f": 0}, {"x": 0.991, "y": 0.953, "c": "近傍", "n": "旋律のドグマ～Miserables～ [A]  n=3435 cos0.99 難0.95", "s": 0.971, "f": 0}, {"x": 0.995, "y": 1.067, "c": "近傍", "n": "GENE [A]  n=3138 cos0.99 難1.07", "s": 0.887, "f": 0}, {"x": 0.99, "y": 0.989, "c": "近傍", "n": "Seven Times Four [A]  n=1333 cos0.99 難0.99", "s": 0.377, "f": 0}, {"x": 0.997, "y": 1.082, "c": "近傍", "n": "Viridian [A]  n=2633 cos1.00 難1.08", "s": 0.745, "f": 0}, {"x": 0.995, "y": 0.912, "c": "近傍", "n": "GOLDEN CROSS [A]  n=3536 cos1.00 難0.91", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.949, "c": "近傍", "n": "Candy Galy [A]  n=3383 cos0.99 難0.95", "s": 0.957, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.38965158599530847}, {"a": 0, "b": 2, "w": 0.40659672894079324}, {"a": 0, "b": 3, "w": 0.34217326242551604}, {"a": 0, "b": 4, "w": 0.240106662052877}, {"a": 0, "b": 5, "w": 0.28741102777713445}, {"a": 0, "b": 6, "w": 0.396787485621951}, {"a": 0, "b": 7, "w": 0.08682915390705759}, {"a": 0, "b": 8, "w": 0.18418173869266752}, {"a": 0, "b": 9, "w": 0.20353260624774472}, {"a": 0, "b": 10, "w": 0.14283191009559004}, {"a": 0, "b": 11, "w": 0.23115004590808141}, {"a": 0, "b": 12, "w": 0.14284405202341233}, {"a": 0, "b": 13, "w": 0.07251629509214619}, {"a": 0, "b": 14, "w": 4.073030801521327e-11}, {"a": 0, "b": 15, "w": 0.1673072671742205}, {"a": 0, "b": 16, "w": 0.3064947707542901}, {"a": 0, "b": 17, "w": 0.022443251071432968}, {"a": 0, "b": 18, "w": 0.3459272085978058}, {"a": 0, "b": 19, "w": 0.3120650994093521}, {"a": 0, "b": 20, "w": 0.15568573852870393}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.899,hiY=1.095;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
