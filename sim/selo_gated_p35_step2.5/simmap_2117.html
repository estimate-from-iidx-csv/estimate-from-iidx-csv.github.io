<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">See You Again [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.179, "c": "種", "n": "See You Again [A]  n=1074 cos1.00 難0.18", "s": 0.295, "f": 0}, {"x": 0.998, "y": 0.077, "c": "近傍", "n": "Volcanic Dragon [A]  n=3184 cos1.00 難0.08", "s": 0.874, "f": 0}, {"x": 0.994, "y": 0.248, "c": "近傍", "n": "ATHER [A]  n=3422 cos0.99 難0.25", "s": 0.939, "f": 0}, {"x": 0.992, "y": 0.193, "c": "近傍", "n": "Wonderland [A]  n=3133 cos0.99 難0.19", "s": 0.86, "f": 0}, {"x": 0.994, "y": 0.031, "c": "近傍", "n": "ミュージック・アワー [A]  n=2508 cos0.99 難0.03", "s": 0.688, "f": 0}, {"x": 0.993, "y": 0.316, "c": "近傍", "n": "Xyndrome [A]  n=2511 cos0.99 難0.32", "s": 0.689, "f": 0}, {"x": 0.993, "y": 0.318, "c": "近傍", "n": "Ritual of Anubis [A]  n=2272 cos0.99 難0.32", "s": 0.624, "f": 0}, {"x": 0.995, "y": 0.393, "c": "近傍", "n": "smooooch・∀・ [L]  n=1442 cos1.00 難0.39", "s": 0.396, "f": 0}, {"x": 0.995, "y": 0.402, "c": "近傍", "n": "Jungle Eater [A]  n=2411 cos1.00 難0.40", "s": 0.662, "f": 0}, {"x": 0.991, "y": 0.056, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1675 cos0.99 難0.06", "s": 0.46, "f": 0}, {"x": 0.991, "y": 0.108, "c": "近傍", "n": "チェイスチェイスジョーカーズのうた (オニスタイルリミックス) [A]  n=1498 cos0.99 難0.11", "s": 0.411, "f": 0}, {"x": 0.991, "y": 0.372, "c": "近傍", "n": "Para siempre [A]  n=2673 cos0.99 難0.37", "s": 0.734, "f": 0}, {"x": 0.99, "y": 0.037, "c": "近傍", "n": "SigSig [A]  n=3612 cos0.99 難0.04", "s": 0.991, "f": 0}, {"x": 0.989, "y": 0.09, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1935 cos0.99 難0.09", "s": 0.531, "f": 0}, {"x": 0.988, "y": 0.084, "c": "近傍", "n": "kors k's Let's make an Image Song! [A]  n=994 cos0.99 難0.08", "s": 0.273, "f": 0}, {"x": 0.988, "y": 0.271, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3114 cos0.99 難0.27", "s": 0.855, "f": 0}, {"x": 0.987, "y": 0.224, "c": "近傍", "n": "Egret and Willow [A]  n=3210 cos0.99 難0.22", "s": 0.881, "f": 0}, {"x": 0.987, "y": 0.274, "c": "近傍", "n": "BroGamer [A]  n=3643 cos0.99 難0.27", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.131, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos0.99 難0.13", "s": 0.806, "f": 0}, {"x": 0.987, "y": 0.189, "c": "近傍", "n": "ここからよろしく大作戦143 [L]  n=874 cos0.99 難0.19", "s": 0.24, "f": 0}, {"x": 0.991, "y": -0.133, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos0.99 難-0.13", "s": 0.261, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6418606930414343}, {"a": 0, "b": 2, "w": 0.4250966752024502}, {"a": 0, "b": 3, "w": 0.3006076728274377}, {"a": 0, "b": 4, "w": 0.40111936094351985}, {"a": 0, "b": 5, "w": 0.15780304669150902}, {"a": 0, "b": 6, "w": 0.37026151700728693}, {"a": 0, "b": 7, "w": 0.437057021950341}, {"a": 0, "b": 8, "w": 0.4821808799068814}, {"a": 0, "b": 9, "w": 0.3158453168138281}, {"a": 0, "b": 10, "w": 0.2970163509403302}, {"a": 0, "b": 11, "w": 0.28747789293758264}, {"a": 0, "b": 12, "w": 0.12748231568011248}, {"a": 0, "b": 13, "w": 0.21812818243095033}, {"a": 0, "b": 14, "w": 0.19410073939657113}, {"a": 0, "b": 15, "w": 0.19538451979445548}, {"a": 0, "b": 16, "w": 0.14409716543649698}, {"a": 0, "b": 17, "w": 4.287570298799892e-11}, {"a": 0, "b": 18, "w": 0.10086678264123294}, {"a": 0, "b": 19, "w": 0.15391159510873187}, {"a": 0, "b": 20, "w": 0.18376203954228287}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.176,hiY=0.444;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
