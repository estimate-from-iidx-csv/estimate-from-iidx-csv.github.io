<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Feel The Beat [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.402, "c": "種", "n": "Feel The Beat [L]  n=2738 cos1.00 難2.40", "s": 0.891, "f": 0}, {"x": 0.993, "y": 2.39, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1151 cos0.99 難2.39", "s": 0.374, "f": 0}, {"x": 0.988, "y": 2.41, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [L]  n=1799 cos0.99 難2.41", "s": 0.585, "f": 0}, {"x": 0.983, "y": 2.414, "c": "近傍", "n": "スキッテイエェエエェ!!!! [A]  n=1005 cos0.98 難2.41", "s": 0.327, "f": 0}, {"x": 0.995, "y": 2.509, "c": "近傍", "n": "#The_Relentless [L]  n=682 cos0.99 難2.51", "s": 0.222, "f": 0}, {"x": 0.991, "y": 2.302, "c": "近傍", "n": "IX [A]  n=2727 cos0.99 難2.30", "s": 0.887, "f": 0}, {"x": 0.977, "y": 2.387, "c": "近傍", "n": "Bad Encryption [A]  n=1818 cos0.98 難2.39", "s": 0.591, "f": 0}, {"x": 0.978, "y": 2.37, "c": "近傍", "n": "VANESSA [L]  n=2321 cos0.98 難2.37", "s": 0.755, "f": 0}, {"x": 0.979, "y": 2.355, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.98 難2.35", "s": 0.746, "f": 0}, {"x": 0.975, "y": 2.423, "c": "近傍", "n": "Elemental Creation [A]  n=2833 cos0.98 難2.42", "s": 0.922, "f": 0}, {"x": 0.973, "y": 2.391, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.97 難2.39", "s": 0.683, "f": 0}, {"x": 0.991, "y": 2.273, "c": "近傍", "n": "Confiserie [A]  n=2903 cos0.99 難2.27", "s": 0.944, "f": 0}, {"x": 0.981, "y": 2.507, "c": "近傍", "n": "hard-wired [A]  n=1624 cos0.98 難2.51", "s": 0.528, "f": 0}, {"x": 0.974, "y": 2.339, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1790 cos0.97 難2.34", "s": 0.582, "f": 0}, {"x": 0.989, "y": 2.548, "c": "近傍", "n": "Phoenix [L]  n=1432 cos0.99 難2.55", "s": 0.466, "f": 0}, {"x": 0.974, "y": 2.312, "c": "近傍", "n": "色を喪った街 [A]  n=619 cos0.97 難2.31", "s": 0.201, "f": 0}, {"x": 0.974, "y": 2.497, "c": "近傍", "n": "Carmina [A]  n=2518 cos0.97 難2.50", "s": 0.819, "f": 0}, {"x": 0.972, "y": 2.495, "c": "近傍", "n": "Lost Souls [L]  n=921 cos0.97 難2.49", "s": 0.3, "f": 0}, {"x": 0.969, "y": 2.339, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [A]  n=1055 cos0.97 難2.34", "s": 0.343, "f": 0}, {"x": 0.992, "y": 2.564, "c": "近傍", "n": "3y3s [A]  n=3074 cos0.99 難2.56", "s": 1.0, "f": 0}, {"x": 0.966, "y": 2.435, "c": "近傍", "n": "Everlasting Message [A]  n=2265 cos0.97 難2.43", "s": 0.737, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5356252565343999}, {"a": 0, "b": 2, "w": 0.3236058574990258}, {"a": 0, "b": 3, "w": 0.28154717923432293}, {"a": 0, "b": 4, "w": 0.5962983117995826}, {"a": 0, "b": 5, "w": 0.43484638269487763}, {"a": 0, "b": 6, "w": 0.15490435510940181}, {"a": 0, "b": 7, "w": 0.1847972162144036}, {"a": 0, "b": 8, "w": 0.1997420540417807}, {"a": 0, "b": 9, "w": 0.10774978693028092}, {"a": 0, "b": 10, "w": 0.08405137014451669}, {"a": 0, "b": 11, "w": 0.43562224227456803}, {"a": 0, "b": 12, "w": 0.25131707678292015}, {"a": 0, "b": 13, "w": 0.015298023956626494}, {"a": 0, "b": 14, "w": 0.40944412209298175}, {"a": 0, "b": 15, "w": 0.12592294477425736}, {"a": 0, "b": 16, "w": 0.13419063603002834}, {"a": 0, "b": 17, "w": 0.09829882247711363}, {"a": 0, "b": 18, "w": 0.04214694148513298}, {"a": 0, "b": 19, "w": 0.49870805876803304}, {"a": 0, "b": 20, "w": 2.0946466783300366e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.964,hiX=1.003,loY=2.250,hiY=2.588;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
