<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Destiny Sword [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.084, "c": "種", "n": "Destiny Sword [A]  n=3494 cos1.00 難0.08", "s": 0.934, "f": 0}, {"x": 0.997, "y": -0.001, "c": "近傍", "n": "RED ZONE [A]  n=3740 cos1.00 難-0.00", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.028, "c": "近傍", "n": "Sphere [A]  n=2892 cos1.00 難-0.03", "s": 0.773, "f": 0}, {"x": 0.996, "y": 0.056, "c": "近傍", "n": "Hat Surprise (Season 3) [A]  n=1474 cos1.00 難0.06", "s": 0.394, "f": 0}, {"x": 0.996, "y": 0.069, "c": "近傍", "n": "IN BETWEEN [A]  n=1026 cos1.00 難0.07", "s": 0.274, "f": 0}, {"x": 0.996, "y": 0.129, "c": "近傍", "n": "SOLID WYVERN [A]  n=2530 cos1.00 難0.13", "s": 0.676, "f": 0}, {"x": 0.996, "y": 0.04, "c": "近傍", "n": "BROKEN EDEN [A]  n=3527 cos1.00 難0.04", "s": 0.943, "f": 0}, {"x": 0.997, "y": -0.04, "c": "近傍", "n": "lower world [A]  n=2593 cos1.00 難-0.04", "s": 0.693, "f": 0}, {"x": 0.996, "y": -0.005, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [A]  n=3343 cos1.00 難-0.01", "s": 0.894, "f": 0}, {"x": 0.996, "y": -0.012, "c": "近傍", "n": "Change Yourself [A]  n=3048 cos1.00 難-0.01", "s": 0.815, "f": 0}, {"x": 0.996, "y": -0.025, "c": "近傍", "n": "狂水一華 [A]  n=2793 cos1.00 難-0.02", "s": 0.747, "f": 0}, {"x": 0.998, "y": 0.263, "c": "近傍", "n": "Lighting Shower [A]  n=3194 cos1.00 難0.26", "s": 0.854, "f": 0}, {"x": 0.996, "y": 0.151, "c": "近傍", "n": "Amazing Mirage [A]  n=3635 cos1.00 難0.15", "s": 0.972, "f": 0}, {"x": 0.996, "y": 0.17, "c": "近傍", "n": "Quick Silver [A]  n=3374 cos1.00 難0.17", "s": 0.902, "f": 0}, {"x": 0.996, "y": -0.043, "c": "近傍", "n": "Go Faraway [A]  n=2755 cos1.00 難-0.04", "s": 0.737, "f": 0}, {"x": 0.995, "y": 0.066, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3582 cos1.00 難0.07", "s": 0.958, "f": 0}, {"x": 0.995, "y": 0.09, "c": "近傍", "n": "うさ☆かめ 大戦争！ [A]  n=3354 cos1.00 難0.09", "s": 0.897, "f": 0}, {"x": 0.995, "y": 0.007, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2617 cos1.00 難0.01", "s": 0.7, "f": 0}, {"x": 0.997, "y": -0.082, "c": "近傍", "n": "ANAGMA [A]  n=2588 cos1.00 難-0.08", "s": 0.692, "f": 0}, {"x": 0.995, "y": 0.046, "c": "近傍", "n": "月光 [A]  n=3166 cos0.99 難0.05", "s": 0.847, "f": 0}, {"x": 0.995, "y": 0.01, "c": "近傍", "n": "Raspberry Potion (feat.あれたん & ぎゃるのしん☆) [A]  n=1551 cos0.99 難0.01", "s": 0.415, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5395303979293667}, {"a": 0, "b": 2, "w": 0.5613135295744256}, {"a": 0, "b": 3, "w": 0.17458028011825655}, {"a": 0, "b": 4, "w": 0.3857014733973799}, {"a": 0, "b": 5, "w": 0.27934562289552356}, {"a": 0, "b": 6, "w": 0.41915144515901726}, {"a": 0, "b": 7, "w": 0.4467356014632109}, {"a": 0, "b": 8, "w": 0.1283194592269462}, {"a": 0, "b": 9, "w": 0.2990206245945928}, {"a": 0, "b": 10, "w": 0.4078196848791408}, {"a": 0, "b": 11, "w": 0.612587964112681}, {"a": 0, "b": 12, "w": 0.08608748073828076}, {"a": 0, "b": 13, "w": 5.849631889986995e-11}, {"a": 0, "b": 14, "w": 0.41442175478445786}, {"a": 0, "b": 15, "w": 0.37203635791630263}, {"a": 0, "b": 16, "w": 0.2170637885692699}, {"a": 0, "b": 17, "w": 0.33172483500392846}, {"a": 0, "b": 18, "w": 0.4852016933005098}, {"a": 0, "b": 19, "w": 0.34179488652488266}, {"a": 0, "b": 20, "w": 0.1777922838211451}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.995,hiX=1.000,loY=-0.110,hiY=0.291;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
