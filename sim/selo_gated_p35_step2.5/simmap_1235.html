<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">100％ minimoo-G [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.313, "c": "種", "n": "100％ minimoo-G [H]  n=2308 cos1.00 難-0.31", "s": 0.703, "f": 0}, {"x": 0.99, "y": -0.301, "c": "近傍", "n": "SCREAM SQUAD [H]  n=2627 cos0.99 難-0.30", "s": 0.8, "f": 0}, {"x": 0.984, "y": -0.263, "c": "近傍", "n": "Cheer Train [A]  n=2414 cos0.98 難-0.26", "s": 0.735, "f": 0}, {"x": 0.987, "y": -0.531, "c": "近傍", "n": "Spica [H]  n=1923 cos0.99 難-0.53", "s": 0.586, "f": 0}, {"x": 0.982, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.98 難-0.26", "s": 0.727, "f": 0}, {"x": 0.982, "y": -0.298, "c": "近傍", "n": "Umbral [A]  n=3241 cos0.98 難-0.30", "s": 0.987, "f": 0}, {"x": 0.982, "y": -0.295, "c": "近傍", "n": "Star Trail [A]  n=3283 cos0.98 難-0.29", "s": 1.0, "f": 0}, {"x": 0.981, "y": -0.386, "c": "近傍", "n": "INFERNO [A]  n=2475 cos0.98 難-0.39", "s": 0.754, "f": 0}, {"x": 0.983, "y": -0.123, "c": "近傍", "n": "Music is The Answer [A]  n=3025 cos0.98 難-0.12", "s": 0.921, "f": 0}, {"x": 0.988, "y": -0.629, "c": "近傍", "n": "Regulus [H]  n=1427 cos0.99 難-0.63", "s": 0.435, "f": 0}, {"x": 0.982, "y": -0.116, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2867 cos0.98 難-0.12", "s": 0.873, "f": 0}, {"x": 0.979, "y": -0.366, "c": "近傍", "n": "Ganymede [H]  n=2744 cos0.98 難-0.37", "s": 0.836, "f": 0}, {"x": 0.98, "y": -0.175, "c": "近傍", "n": "Freezing atmosphere [A]  n=2166 cos0.98 難-0.17", "s": 0.66, "f": 0}, {"x": 0.979, "y": -0.237, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1287 cos0.98 難-0.24", "s": 0.392, "f": 0}, {"x": 0.987, "y": -0.639, "c": "近傍", "n": "abstract [H]  n=1826 cos0.99 難-0.64", "s": 0.556, "f": 0}, {"x": 0.979, "y": -0.233, "c": "近傍", "n": "Concertino in Blue [H]  n=2829 cos0.98 難-0.23", "s": 0.862, "f": 0}, {"x": 0.982, "y": -0.559, "c": "近傍", "n": "GHOST REVIVAL [H]  n=1611 cos0.98 難-0.56", "s": 0.491, "f": 0}, {"x": 0.978, "y": -0.376, "c": "近傍", "n": "We are Disっ娘よっつ打ち命 [A]  n=2702 cos0.98 難-0.38", "s": 0.823, "f": 0}, {"x": 0.982, "y": -0.56, "c": "近傍", "n": "真夜中のバベル [A]  n=1944 cos0.98 難-0.56", "s": 0.592, "f": 0}, {"x": 0.978, "y": -0.296, "c": "近傍", "n": "ALL I NEED YOUR LOVE [A]  n=2485 cos0.98 難-0.30", "s": 0.757, "f": 0}, {"x": 0.979, "y": -0.458, "c": "近傍", "n": "Ristaccia [H]  n=2302 cos0.98 難-0.46", "s": 0.701, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5276275071821761}, {"a": 0, "b": 2, "w": 0.41231406875870935}, {"a": 0, "b": 3, "w": 0.48053365103683143}, {"a": 0, "b": 4, "w": 0.3814828024418251}, {"a": 0, "b": 5, "w": 0.3843080836033077}, {"a": 0, "b": 6, "w": 0.3306993412307515}, {"a": 0, "b": 7, "w": 0.358036966198375}, {"a": 0, "b": 8, "w": 0.35965415323540595}, {"a": 0, "b": 9, "w": 0.5042800821966549}, {"a": 0, "b": 10, "w": 0.31812932149716877}, {"a": 0, "b": 11, "w": 0.34331484561100867}, {"a": 0, "b": 12, "w": 0.3494632939266764}, {"a": 0, "b": 13, "w": 0.31192103452231457}, {"a": 0, "b": 14, "w": 0.4677457912281836}, {"a": 0, "b": 15, "w": 3.5862868230651657e-11}, {"a": 0, "b": 16, "w": 0.38153476598041003}, {"a": 0, "b": 17, "w": 0.3295743303033505}, {"a": 0, "b": 18, "w": 0.37466162161884253}, {"a": 0, "b": 19, "w": 0.16882195237111375}, {"a": 0, "b": 20, "w": 0.2220897505427537}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-0.681,hiY=-0.074;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
