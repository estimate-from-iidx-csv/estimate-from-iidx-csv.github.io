<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Timepiece phase II [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.122, "c": "種", "n": "Timepiece phase II [H]  n=2933 cos1.00 難0.12", "s": 0.797, "f": 0}, {"x": 0.996, "y": 0.137, "c": "近傍", "n": "Programmed World [A]  n=3471 cos1.00 難0.14", "s": 0.943, "f": 0}, {"x": 0.995, "y": 0.102, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2221 cos0.99 難0.10", "s": 0.603, "f": 0}, {"x": 0.995, "y": 0.256, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.99 難0.26", "s": 0.64, "f": 0}, {"x": 0.995, "y": 0.297, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos1.00 難0.30", "s": 0.878, "f": 0}, {"x": 0.994, "y": -0.031, "c": "近傍", "n": "Lawes's Parotia [A]  n=2528 cos0.99 難-0.03", "s": 0.687, "f": 0}, {"x": 0.993, "y": 0.12, "c": "近傍", "n": "Be quiet [A]  n=3611 cos0.99 難0.12", "s": 0.981, "f": 0}, {"x": 0.993, "y": 0.077, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [A]  n=2928 cos0.99 難0.08", "s": 0.795, "f": 0}, {"x": 0.994, "y": 0.315, "c": "近傍", "n": "DROP [A]  n=3229 cos0.99 難0.31", "s": 0.877, "f": 0}, {"x": 0.992, "y": 0.151, "c": "近傍", "n": "Amazing Mirage [A]  n=3635 cos0.99 難0.15", "s": 0.987, "f": 0}, {"x": 0.995, "y": 0.375, "c": "近傍", "n": "Scripted Connection⇒ N mix [L]  n=1194 cos1.00 難0.38", "s": 0.324, "f": 0}, {"x": 0.991, "y": 0.148, "c": "近傍", "n": "KAMAITACHI [A]  n=3682 cos0.99 難0.15", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.265, "c": "近傍", "n": "Get On Your Feet [A]  n=1761 cos0.99 難0.26", "s": 0.478, "f": 0}, {"x": 0.991, "y": 0.158, "c": "近傍", "n": "rainbow flyer [A]  n=3359 cos0.99 難0.16", "s": 0.912, "f": 0}, {"x": 0.991, "y": 0.056, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.06", "s": 0.613, "f": 0}, {"x": 0.991, "y": 0.076, "c": "近傍", "n": "GUILTY [A]  n=1451 cos0.99 難0.08", "s": 0.394, "f": 0}, {"x": 0.991, "y": 0.004, "c": "近傍", "n": "MAX 300 [H]  n=1583 cos0.99 難0.00", "s": 0.43, "f": 0}, {"x": 0.991, "y": 0.106, "c": "近傍", "n": "Emera [A]  n=2046 cos0.99 難0.11", "s": 0.556, "f": 0}, {"x": 0.991, "y": 0.237, "c": "近傍", "n": "ChaserXX [A]  n=3337 cos0.99 難0.24", "s": 0.906, "f": 0}, {"x": 0.99, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.15", "s": 0.521, "f": 0}, {"x": 0.99, "y": 0.218, "c": "近傍", "n": "Programmed Sun [A]  n=3329 cos0.99 難0.22", "s": 0.904, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4806984891926386}, {"a": 0, "b": 2, "w": 0.30722739553006384}, {"a": 0, "b": 3, "w": 0.3189764688210347}, {"a": 0, "b": 4, "w": 0.4139727482878224}, {"a": 0, "b": 5, "w": 0.3401100056229688}, {"a": 0, "b": 6, "w": 0.26645707974744015}, {"a": 0, "b": 7, "w": 0.03498553719924202}, {"a": 0, "b": 8, "w": 0.2812657691964474}, {"a": 0, "b": 9, "w": 0.10914953297165597}, {"a": 0, "b": 10, "w": 0.2584855441105248}, {"a": 0, "b": 11, "w": 0.17904503280938888}, {"a": 0, "b": 12, "w": 0.013248132265147983}, {"a": 0, "b": 13, "w": 0.10146435945054222}, {"a": 0, "b": 14, "w": 0.18221701481420471}, {"a": 0, "b": 15, "w": 0.02140497867197766}, {"a": 0, "b": 16, "w": 0.157738803135964}, {"a": 0, "b": 17, "w": 5.306111106051503e-11}, {"a": 0, "b": 18, "w": 0.1142322441589102}, {"a": 0, "b": 19, "w": 0.05214752514171972}, {"a": 0, "b": 20, "w": 0.1323224043701534}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.064,hiY=0.408;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
