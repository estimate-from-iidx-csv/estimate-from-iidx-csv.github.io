<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DESIRE [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.275, "c": "種", "n": "DESIRE [A]  n=3355 cos1.00 難0.28", "s": 0.911, "f": 0}, {"x": 0.995, "y": 0.256, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos1.00 難0.26", "s": 0.64, "f": 0}, {"x": 0.995, "y": 0.315, "c": "近傍", "n": "DROP [A]  n=3229 cos1.00 難0.31", "s": 0.877, "f": 0}, {"x": 0.995, "y": 0.3, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.30", "s": 0.54, "f": 0}, {"x": 0.994, "y": 0.256, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2290 cos0.99 難0.26", "s": 0.622, "f": 0}, {"x": 0.994, "y": 0.335, "c": "近傍", "n": "No.13 [A]  n=3463 cos0.99 難0.33", "s": 0.94, "f": 0}, {"x": 0.995, "y": 0.365, "c": "近傍", "n": "VEGA [A]  n=3496 cos0.99 難0.36", "s": 0.949, "f": 0}, {"x": 0.994, "y": 0.19, "c": "近傍", "n": "Show Me All Your Love [A]  n=1153 cos0.99 難0.19", "s": 0.313, "f": 0}, {"x": 0.997, "y": 0.428, "c": "近傍", "n": "FLOWER [A]  n=3683 cos1.00 難0.43", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.232, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2433 cos0.99 難0.23", "s": 0.661, "f": 0}, {"x": 0.993, "y": 0.255, "c": "近傍", "n": "LAST DAY [A]  n=2629 cos0.99 難0.26", "s": 0.714, "f": 0}, {"x": 0.993, "y": 0.297, "c": "近傍", "n": "Never Fade Away [A]  n=3150 cos0.99 難0.30", "s": 0.855, "f": 0}, {"x": 0.993, "y": 0.252, "c": "近傍", "n": "GloriosA [A]  n=1782 cos0.99 難0.25", "s": 0.484, "f": 0}, {"x": 0.993, "y": 0.239, "c": "近傍", "n": "Bow shock!! [A]  n=2972 cos0.99 難0.24", "s": 0.807, "f": 0}, {"x": 0.995, "y": 0.137, "c": "近傍", "n": "Programmed World [A]  n=3471 cos0.99 難0.14", "s": 0.942, "f": 0}, {"x": 0.994, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.15", "s": 0.521, "f": 0}, {"x": 0.992, "y": 0.27, "c": "近傍", "n": "Moving on [A]  n=3017 cos0.99 難0.27", "s": 0.819, "f": 0}, {"x": 0.993, "y": 0.357, "c": "近傍", "n": "ALBA -黎明- [A]  n=3641 cos0.99 難0.36", "s": 0.989, "f": 0}, {"x": 0.993, "y": 0.156, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos0.99 難0.16", "s": 0.935, "f": 0}, {"x": 0.992, "y": 0.297, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3233 cos0.99 難0.30", "s": 0.878, "f": 0}, {"x": 0.995, "y": 0.102, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2221 cos0.99 難0.10", "s": 0.603, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2976499387860403}, {"a": 0, "b": 2, "w": 0.2774854139342693}, {"a": 0, "b": 3, "w": 0.3800284059634875}, {"a": 0, "b": 4, "w": 0.3519839932707257}, {"a": 0, "b": 5, "w": 0.35813368049204564}, {"a": 0, "b": 6, "w": 0.3135782167187492}, {"a": 0, "b": 7, "w": 0.31706145992125967}, {"a": 0, "b": 8, "w": 0.5302795239571927}, {"a": 0, "b": 9, "w": 0.11308453873325353}, {"a": 0, "b": 10, "w": 0.3109009005979402}, {"a": 0, "b": 11, "w": 0.28543507934269563}, {"a": 0, "b": 12, "w": 0.3060196052054437}, {"a": 0, "b": 13, "w": 0.30793193374841166}, {"a": 0, "b": 14, "w": 0.12071485221394351}, {"a": 0, "b": 15, "w": 0.30726697734760655}, {"a": 0, "b": 16, "w": 0.13865439572215277}, {"a": 0, "b": 17, "w": 0.04732423294128307}, {"a": 0, "b": 18, "w": 0.295098521301259}, {"a": 0, "b": 19, "w": 4.4399373066994485e-11}, {"a": 0, "b": 20, "w": 0.2872259094800722}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.076,hiY=0.454;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
