<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Cosmic Cat [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.976, "c": "種", "n": "Cosmic Cat [H]  n=1851 cos1.00 難-0.98", "s": 0.688, "f": 0}, {"x": 0.995, "y": -0.974, "c": "近傍", "n": "#The_Relentless [H]  n=2019 cos0.99 難-0.97", "s": 0.75, "f": 0}, {"x": 0.992, "y": -0.896, "c": "近傍", "n": "UMMU [H]  n=2418 cos0.99 難-0.90", "s": 0.898, "f": 0}, {"x": 0.991, "y": -1.049, "c": "近傍", "n": "童話回廊 [H]  n=1035 cos0.99 難-1.05", "s": 0.384, "f": 0}, {"x": 0.991, "y": -1.063, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.99 難-1.06", "s": 0.598, "f": 0}, {"x": 0.99, "y": -1.053, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos0.99 難-1.05", "s": 0.279, "f": 0}, {"x": 0.996, "y": -0.801, "c": "近傍", "n": "Destiny Sword [H]  n=2145 cos1.00 難-0.80", "s": 0.797, "f": 0}, {"x": 0.992, "y": -1.103, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.99 難-1.10", "s": 0.608, "f": 0}, {"x": 0.99, "y": -1.051, "c": "近傍", "n": "時空トラベローグ [H]  n=1454 cos0.99 難-1.05", "s": 0.54, "f": 0}, {"x": 0.995, "y": -1.145, "c": "近傍", "n": "LADYBIRD [H]  n=1013 cos0.99 難-1.14", "s": 0.376, "f": 0}, {"x": 0.991, "y": -1.091, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.99 難-1.09", "s": 0.502, "f": 0}, {"x": 0.992, "y": -1.113, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=993 cos0.99 難-1.11", "s": 0.369, "f": 0}, {"x": 0.989, "y": -1.034, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos0.99 難-1.03", "s": 0.611, "f": 0}, {"x": 0.989, "y": -0.886, "c": "近傍", "n": "Grand Chariot [H]  n=2692 cos0.99 難-0.89", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.898, "c": "近傍", "n": "B.O.D.Y. [H]  n=1306 cos0.99 難-0.90", "s": 0.485, "f": 0}, {"x": 0.988, "y": -1.028, "c": "近傍", "n": "& Intelligence [H]  n=1407 cos0.99 難-1.03", "s": 0.523, "f": 0}, {"x": 0.996, "y": -1.167, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos1.00 難-1.17", "s": 0.572, "f": 0}, {"x": 0.989, "y": -1.068, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [H]  n=1438 cos0.99 難-1.07", "s": 0.534, "f": 0}, {"x": 0.989, "y": -0.883, "c": "近傍", "n": "PUNISHER [H]  n=2323 cos0.99 難-0.88", "s": 0.863, "f": 0}, {"x": 0.989, "y": -0.884, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.88", "s": 0.931, "f": 0}, {"x": 0.989, "y": -1.065, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-1.06", "s": 0.232, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4169456785582297}, {"a": 0, "b": 2, "w": 0.11585289416745237}, {"a": 0, "b": 3, "w": 0.2030749648465512}, {"a": 0, "b": 4, "w": 0.23993522130294986}, {"a": 0, "b": 5, "w": 0.1506686633743325}, {"a": 0, "b": 6, "w": 0.505402486363377}, {"a": 0, "b": 7, "w": 0.28375178023032954}, {"a": 0, "b": 8, "w": 0.19965963062811998}, {"a": 0, "b": 9, "w": 0.4203214887831559}, {"a": 0, "b": 10, "w": 0.22787525010183185}, {"a": 0, "b": 11, "w": 5.835065763903913e-11}, {"a": 0, "b": 12, "w": 0.030757917546179403}, {"a": 0, "b": 13, "w": 0.06339481227281452}, {"a": 0, "b": 14, "w": 0.09020567961555259}, {"a": 0, "b": 15, "w": 0.003623979729648341}, {"a": 0, "b": 16, "w": 0.49324474086566783}, {"a": 0, "b": 17, "w": 0.16185050575425308}, {"a": 0, "b": 18, "w": 0.0025406832655262557}, {"a": 0, "b": 19, "w": 0.11720825212164776}, {"a": 0, "b": 20, "w": 0.11230287047489551}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.196,hiY=-0.772;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
