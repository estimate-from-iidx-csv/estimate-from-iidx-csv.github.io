<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Super Rush [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.954, "c": "種", "n": "Super Rush [A]  n=3502 cos1.00 難0.95", "s": 0.974, "f": 0}, {"x": 0.991, "y": 0.965, "c": "近傍", "n": "King of Tribe [A]  n=594 cos0.99 難0.96", "s": 0.165, "f": 0}, {"x": 0.994, "y": 0.894, "c": "近傍", "n": "Rave Patroller [A]  n=2943 cos0.99 難0.89", "s": 0.819, "f": 0}, {"x": 0.99, "y": 0.976, "c": "近傍", "n": "LIVE DRIVING!! feat. 花たん [A]  n=2562 cos0.99 難0.98", "s": 0.713, "f": 0}, {"x": 0.987, "y": 0.97, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3433 cos0.99 難0.97", "s": 0.955, "f": 0}, {"x": 0.993, "y": 0.832, "c": "近傍", "n": "GRID KNIGHT [L]  n=3179 cos0.99 難0.83", "s": 0.885, "f": 0}, {"x": 0.984, "y": 0.921, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3387 cos0.98 難0.92", "s": 0.942, "f": 0}, {"x": 0.984, "y": 0.897, "c": "近傍", "n": "Idola [A]  n=3594 cos0.98 難0.90", "s": 1.0, "f": 0}, {"x": 0.983, "y": 0.954, "c": "近傍", "n": "Say YEEEAHH [A]  n=3513 cos0.98 難0.95", "s": 0.977, "f": 0}, {"x": 0.989, "y": 0.821, "c": "近傍", "n": "Sword of Vengeance [A]  n=1658 cos0.99 難0.82", "s": 0.461, "f": 0}, {"x": 0.991, "y": 0.805, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [A]  n=1972 cos0.99 難0.80", "s": 0.549, "f": 0}, {"x": 0.982, "y": 0.908, "c": "近傍", "n": "The Least 100sec [A]  n=3395 cos0.98 難0.91", "s": 0.945, "f": 0}, {"x": 0.989, "y": 0.813, "c": "近傍", "n": "Beat Radiance [L]  n=3485 cos0.99 難0.81", "s": 0.97, "f": 0}, {"x": 0.992, "y": 1.121, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [A]  n=3487 cos0.99 難1.12", "s": 0.97, "f": 0}, {"x": 0.98, "y": 0.908, "c": "近傍", "n": "神っぽいな [L]  n=1294 cos0.98 難0.91", "s": 0.36, "f": 0}, {"x": 0.982, "y": 0.86, "c": "近傍", "n": "HYPE THE CORE [A]  n=3106 cos0.98 難0.86", "s": 0.864, "f": 0}, {"x": 0.985, "y": 1.097, "c": "近傍", "n": "Valanga [A]  n=3501 cos0.98 難1.10", "s": 0.974, "f": 0}, {"x": 0.983, "y": 1.082, "c": "近傍", "n": "DARK LEGACY [A]  n=3462 cos0.98 難1.08", "s": 0.963, "f": 0}, {"x": 0.98, "y": 0.855, "c": "近傍", "n": "M4K3 1T B0UNC3 [A]  n=3478 cos0.98 難0.86", "s": 0.968, "f": 0}, {"x": 0.981, "y": 0.822, "c": "近傍", "n": "NNRT [A]  n=3518 cos0.98 難0.82", "s": 0.979, "f": 0}, {"x": 0.978, "y": 0.883, "c": "近傍", "n": "天邪鬼 [A]  n=2445 cos0.98 難0.88", "s": 0.68, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28763906628009517}, {"a": 0, "b": 2, "w": 0.32593449589202395}, {"a": 0, "b": 3, "w": 0.2603134738736216}, {"a": 0, "b": 4, "w": 0.15171396569337847}, {"a": 0, "b": 5, "w": 0.39378313862305736}, {"a": 0, "b": 6, "w": 0.1360602497196376}, {"a": 0, "b": 7, "w": 0.13057252029396993}, {"a": 0, "b": 8, "w": 0.10972002519367707}, {"a": 0, "b": 9, "w": 0.16541103146931646}, {"a": 0, "b": 10, "w": 0.3698703382494849}, {"a": 0, "b": 11, "w": 0.09476835443915066}, {"a": 0, "b": 12, "w": 0.1462615588281594}, {"a": 0, "b": 13, "w": 0.24864669048641053}, {"a": 0, "b": 14, "w": 0.05390169092406916}, {"a": 0, "b": 15, "w": 0.0780068357640723}, {"a": 0, "b": 16, "w": 0.1673716086476289}, {"a": 0, "b": 17, "w": 0.10991771383549376}, {"a": 0, "b": 18, "w": 0.010678865927809866}, {"a": 0, "b": 19, "w": 0.07974152938597634}, {"a": 0, "b": 20, "w": 3.291755756862358e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=0.779,hiY=1.146;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
