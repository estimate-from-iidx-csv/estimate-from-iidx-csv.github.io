<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Votum stellarum [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.081, "c": "種", "n": "Votum stellarum [A]  n=2865 cos1.00 難-0.08", "s": 0.838, "f": 0}, {"x": 0.996, "y": -0.076, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos1.00 難-0.08", "s": 0.907, "f": 0}, {"x": 0.996, "y": -0.213, "c": "近傍", "n": "Twelfth Style [A]  n=3123 cos1.00 難-0.21", "s": 0.913, "f": 0}, {"x": 0.995, "y": -0.175, "c": "近傍", "n": "Freeway Shuffle [A]  n=2925 cos1.00 難-0.18", "s": 0.856, "f": 0}, {"x": 0.995, "y": -0.178, "c": "近傍", "n": "Lucky Days [A]  n=2965 cos0.99 難-0.18", "s": 0.867, "f": 0}, {"x": 0.995, "y": -0.196, "c": "近傍", "n": "moon_child [H]  n=2782 cos0.99 難-0.20", "s": 0.814, "f": 0}, {"x": 0.994, "y": -0.089, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos0.99 難-0.09", "s": 0.81, "f": 0}, {"x": 0.995, "y": 0.101, "c": "近傍", "n": "セロトニン [A]  n=3330 cos1.00 難0.10", "s": 0.974, "f": 0}, {"x": 0.994, "y": -0.199, "c": "近傍", "n": "madrugada [A]  n=2180 cos0.99 難-0.20", "s": 0.638, "f": 0}, {"x": 0.994, "y": 0.045, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.04", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.11, "c": "近傍", "n": "Scripted Connection⇒ N mix [A]  n=2801 cos0.99 難-0.11", "s": 0.819, "f": 0}, {"x": 0.993, "y": -0.075, "c": "近傍", "n": "2hot2eat [A]  n=1063 cos0.99 難-0.07", "s": 0.311, "f": 0}, {"x": 0.993, "y": -0.078, "c": "近傍", "n": "Praludium [A]  n=2983 cos0.99 難-0.08", "s": 0.872, "f": 0}, {"x": 0.995, "y": 0.121, "c": "近傍", "n": "合体せよ！ストロングイェーガー！！ (Ryu☆ remix) [A]  n=3327 cos0.99 難0.12", "s": 0.973, "f": 0}, {"x": 0.995, "y": 0.143, "c": "近傍", "n": "SPEED ROCKER [A]  n=2665 cos1.00 難0.14", "s": 0.779, "f": 0}, {"x": 0.992, "y": -0.05, "c": "近傍", "n": "HYPER EUROBEAT (2DX style) [A]  n=2545 cos0.99 難-0.05", "s": 0.744, "f": 0}, {"x": 0.992, "y": -0.104, "c": "近傍", "n": "Get Higher [A]  n=1861 cos0.99 難-0.10", "s": 0.544, "f": 0}, {"x": 0.992, "y": -0.031, "c": "近傍", "n": "She is my wife [A]  n=3098 cos0.99 難-0.03", "s": 0.906, "f": 0}, {"x": 0.992, "y": -0.081, "c": "近傍", "n": "Nowhere [A]  n=2750 cos0.99 難-0.08", "s": 0.804, "f": 0}, {"x": 0.992, "y": -0.119, "c": "近傍", "n": "traces [A]  n=2803 cos0.99 難-0.12", "s": 0.82, "f": 0}, {"x": 0.991, "y": -0.105, "c": "近傍", "n": "Space Time [A]  n=2797 cos0.99 難-0.11", "s": 0.818, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45567554605258687}, {"a": 0, "b": 2, "w": 0.4083554276732946}, {"a": 0, "b": 3, "w": 0.3991139504194132}, {"a": 0, "b": 4, "w": 0.37116282223257646}, {"a": 0, "b": 5, "w": 0.3893417315735077}, {"a": 0, "b": 6, "w": 0.35101131541313146}, {"a": 0, "b": 7, "w": 0.2460350177602526}, {"a": 0, "b": 8, "w": 0.2851614032562797}, {"a": 0, "b": 9, "w": 0.35076215269138944}, {"a": 0, "b": 10, "w": 0.22680737288559272}, {"a": 0, "b": 11, "w": 0.31192616119760364}, {"a": 0, "b": 12, "w": 0.25718881197176735}, {"a": 0, "b": 13, "w": 0.19468395860682342}, {"a": 0, "b": 14, "w": 0.29746182715192726}, {"a": 0, "b": 15, "w": 0.290324034544993}, {"a": 0, "b": 16, "w": 5.720113271934224e-11}, {"a": 0, "b": 17, "w": 0.09900221164020162}, {"a": 0, "b": 18, "w": 0.25957660657625947}, {"a": 0, "b": 19, "w": 0.25587365525445493}, {"a": 0, "b": 20, "w": 0.24101687226751445}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.241,hiY=0.172;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
