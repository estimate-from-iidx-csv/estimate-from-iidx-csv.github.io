<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vinculum stellarum [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.092, "c": "種", "n": "Vinculum stellarum [A]  n=2772 cos1.00 難1.09", "s": 0.782, "f": 0}, {"x": 0.997, "y": 1.104, "c": "近傍", "n": "refrain [A]  n=3325 cos1.00 難1.10", "s": 0.937, "f": 0}, {"x": 0.994, "y": 1.082, "c": "近傍", "n": "Viridian [A]  n=2633 cos0.99 難1.08", "s": 0.742, "f": 0}, {"x": 0.996, "y": 1.134, "c": "近傍", "n": "AA -rebuild- [A]  n=3345 cos1.00 難1.13", "s": 0.943, "f": 0}, {"x": 0.995, "y": 1.136, "c": "近傍", "n": "Proof of the existence [A]  n=3391 cos0.99 難1.14", "s": 0.956, "f": 0}, {"x": 0.993, "y": 1.06, "c": "近傍", "n": "Broken Sword [A]  n=3384 cos0.99 難1.06", "s": 0.954, "f": 0}, {"x": 0.992, "y": 1.067, "c": "近傍", "n": "GENE [A]  n=3138 cos0.99 難1.07", "s": 0.885, "f": 0}, {"x": 0.994, "y": 1.041, "c": "近傍", "n": "HARD BRAIN [A]  n=3026 cos0.99 難1.04", "s": 0.853, "f": 0}, {"x": 0.992, "y": 1.127, "c": "近傍", "n": "innocent revolver [A]  n=2544 cos0.99 難1.13", "s": 0.717, "f": 0}, {"x": 0.991, "y": 1.067, "c": "近傍", "n": "Last Dance [A]  n=3340 cos0.99 難1.07", "s": 0.942, "f": 0}, {"x": 0.992, "y": 1.038, "c": "近傍", "n": "華爛漫 -Flowers- [L]  n=2171 cos0.99 難1.04", "s": 0.612, "f": 0}, {"x": 0.992, "y": 1.155, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1198 cos0.99 難1.16", "s": 0.338, "f": 0}, {"x": 0.99, "y": 1.047, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3455 cos0.99 難1.05", "s": 0.974, "f": 0}, {"x": 0.991, "y": 1.028, "c": "近傍", "n": "不沈艦CANDY [A]  n=3417 cos0.99 難1.03", "s": 0.963, "f": 0}, {"x": 0.994, "y": 1.18, "c": "近傍", "n": "Colorful Cookie [A]  n=3547 cos0.99 難1.18", "s": 1.0, "f": 0}, {"x": 0.987, "y": 1.093, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3376 cos0.99 難1.09", "s": 0.952, "f": 0}, {"x": 0.994, "y": 0.995, "c": "近傍", "n": "Space Battleship S4TO [A]  n=970 cos0.99 難0.99", "s": 0.273, "f": 0}, {"x": 0.989, "y": 1.028, "c": "近傍", "n": "fffff [A]  n=3499 cos0.99 難1.03", "s": 0.986, "f": 0}, {"x": 0.99, "y": 1.015, "c": "近傍", "n": "トリカゴノ鳳凰 [A]  n=3395 cos0.99 難1.01", "s": 0.957, "f": 0}, {"x": 0.99, "y": 1.015, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [A]  n=1012 cos0.99 難1.01", "s": 0.285, "f": 0}, {"x": 0.991, "y": 1.18, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3252 cos0.99 難1.18", "s": 0.917, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5374097228721204}, {"a": 0, "b": 2, "w": 0.34549860371343677}, {"a": 0, "b": 3, "w": 0.4824270325188318}, {"a": 0, "b": 4, "w": 0.3448125520027884}, {"a": 0, "b": 5, "w": 0.16285505691171687}, {"a": 0, "b": 6, "w": 0.12698320623138715}, {"a": 0, "b": 7, "w": 0.338843940207334}, {"a": 0, "b": 8, "w": 0.23842855824866738}, {"a": 0, "b": 9, "w": 0.13770072507057962}, {"a": 0, "b": 10, "w": 0.21591922194293534}, {"a": 0, "b": 11, "w": 0.2156645546620677}, {"a": 0, "b": 12, "w": 0.15114175270909969}, {"a": 0, "b": 13, "w": 0.2221471503696716}, {"a": 0, "b": 14, "w": 0.32870335241081994}, {"a": 0, "b": 15, "w": 3.9705905230391636e-11}, {"a": 0, "b": 16, "w": 0.29237378287825155}, {"a": 0, "b": 17, "w": 0.12859316409666888}, {"a": 0, "b": 18, "w": 0.16861707182921915}, {"a": 0, "b": 19, "w": 0.1462591097209971}, {"a": 0, "b": 20, "w": 0.05853986492772223}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.980,hiY=1.195;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
