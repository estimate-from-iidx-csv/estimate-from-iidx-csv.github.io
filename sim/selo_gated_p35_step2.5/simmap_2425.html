<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Golden Palms [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.612, "c": "種", "n": "Golden Palms [L]  n=3343 cos1.00 難0.61", "s": 0.887, "f": 0}, {"x": 0.977, "y": 0.661, "c": "近傍", "n": "CALL [L]  n=888 cos0.98 難0.66", "s": 0.236, "f": 0}, {"x": 0.969, "y": 0.702, "c": "近傍", "n": "GIGANT [L]  n=1747 cos0.97 難0.70", "s": 0.464, "f": 0}, {"x": 0.962, "y": 0.731, "c": "近傍", "n": "神のシナリオ [A]  n=2051 cos0.96 難0.73", "s": 0.544, "f": 0}, {"x": 0.969, "y": 0.228, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1763 cos0.97 難0.23", "s": 0.468, "f": 0}, {"x": 0.957, "y": 0.619, "c": "近傍", "n": "Psycho Sheep Riddim [L]  n=1870 cos0.96 難0.62", "s": 0.496, "f": 0}, {"x": 0.97, "y": 0.149, "c": "近傍", "n": "Onyx [A]  n=2505 cos0.97 難0.15", "s": 0.665, "f": 0}, {"x": 0.959, "y": 0.382, "c": "近傍", "n": "Acid Pumper [A]  n=3568 cos0.96 難0.38", "s": 0.947, "f": 0}, {"x": 0.96, "y": 0.325, "c": "近傍", "n": "Souhait bleu [A]  n=2368 cos0.96 難0.32", "s": 0.628, "f": 0}, {"x": 0.966, "y": 0.168, "c": "近傍", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2956 cos0.97 難0.17", "s": 0.784, "f": 0}, {"x": 0.954, "y": 0.554, "c": "近傍", "n": "Kailua [A]  n=3546 cos0.95 難0.55", "s": 0.941, "f": 0}, {"x": 0.955, "y": 0.392, "c": "近傍", "n": "ADAMANT [A]  n=1507 cos0.95 難0.39", "s": 0.4, "f": 0}, {"x": 0.953, "y": 0.529, "c": "近傍", "n": "10000 MILES AWAY [A]  n=1997 cos0.95 難0.53", "s": 0.53, "f": 0}, {"x": 0.959, "y": 0.247, "c": "近傍", "n": "Scars of FAUNA [A]  n=3552 cos0.96 難0.25", "s": 0.942, "f": 0}, {"x": 0.973, "y": 0.023, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.97 難0.02", "s": 0.419, "f": 0}, {"x": 0.951, "y": 0.551, "c": "近傍", "n": "VALLIS-NERIA [A]  n=3498 cos0.95 難0.55", "s": 0.928, "f": 0}, {"x": 0.961, "y": 0.168, "c": "近傍", "n": "ROTTERDAM SHOGUN [A]  n=3431 cos0.96 難0.17", "s": 0.91, "f": 0}, {"x": 0.951, "y": 0.567, "c": "近傍", "n": "BIGソムタム [A]  n=3093 cos0.95 難0.57", "s": 0.821, "f": 0}, {"x": 0.95, "y": 0.587, "c": "近傍", "n": "Star Trail [L]  n=1143 cos0.95 難0.59", "s": 0.303, "f": 0}, {"x": 0.974, "y": -0.03, "c": "近傍", "n": "Elisha [A]  n=3769 cos0.97 難-0.03", "s": 1.0, "f": 0}, {"x": 0.959, "y": 0.137, "c": "近傍", "n": "Daily Lunch Special [A]  n=3535 cos0.96 難0.14", "s": 0.938, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.41486288804888427}, {"a": 0, "b": 2, "w": 0.2009651519100314}, {"a": 0, "b": 3, "w": 0.08456272015965416}, {"a": 0, "b": 4, "w": 0.39111027713670465}, {"a": 0, "b": 5, "w": 0.27277454994290695}, {"a": 0, "b": 6, "w": 0.40536231707654635}, {"a": 0, "b": 7, "w": 0.23518060915505457}, {"a": 0, "b": 8, "w": 0.2956002837689937}, {"a": 0, "b": 9, "w": 0.36925727367264227}, {"a": 0, "b": 10, "w": 0.03513524846741145}, {"a": 0, "b": 11, "w": 0.21882545921785612}, {"a": 0, "b": 12, "w": 0.13273496541533714}, {"a": 0, "b": 13, "w": 0.22784663818705253}, {"a": 0, "b": 14, "w": 0.4385567860046705}, {"a": 0, "b": 15, "w": 0.0981880114891871}, {"a": 0, "b": 16, "w": 0.32962699195356415}, {"a": 0, "b": 17, "w": 2.0762280783515052e-11}, {"a": 0, "b": 18, "w": 0.18996378254081692}, {"a": 0, "b": 19, "w": 0.4530303682755916}, {"a": 0, "b": 20, "w": 0.28294326473620535}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.946,hiX=1.004,loY=-0.091,hiY=0.792;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
