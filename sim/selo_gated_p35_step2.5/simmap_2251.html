<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">《ORDERBREAKER》 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.228, "c": "種", "n": "《ORDERBREAKER》 [A]  n=1763 cos1.00 難0.23", "s": 0.494, "f": 0}, {"x": 0.991, "y": 0.325, "c": "近傍", "n": "Souhait bleu [A]  n=2368 cos0.99 難0.32", "s": 0.664, "f": 0}, {"x": 0.989, "y": 0.194, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.99 難0.19", "s": 0.709, "f": 0}, {"x": 0.988, "y": 0.212, "c": "近傍", "n": "Perfect Plan [A]  n=2100 cos0.99 難0.21", "s": 0.589, "f": 0}, {"x": 0.992, "y": 0.587, "c": "近傍", "n": "Star Trail [L]  n=1143 cos0.99 難0.59", "s": 0.32, "f": 0}, {"x": 0.987, "y": 0.192, "c": "近傍", "n": "Chronos [A]  n=3401 cos0.99 難0.19", "s": 0.953, "f": 0}, {"x": 0.987, "y": 0.382, "c": "近傍", "n": "Acid Pumper [A]  n=3568 cos0.99 難0.38", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.114, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3368 cos0.99 難-0.11", "s": 0.944, "f": 0}, {"x": 0.991, "y": -0.254, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.99 難-0.25", "s": 0.349, "f": 0}, {"x": 0.987, "y": -0.11, "c": "近傍", "n": "Do Back Burn [A]  n=1891 cos0.99 難-0.11", "s": 0.53, "f": 0}, {"x": 0.984, "y": 0.313, "c": "近傍", "n": "ABSOLUTE [L]  n=3179 cos0.98 難0.31", "s": 0.891, "f": 0}, {"x": 0.984, "y": 0.132, "c": "近傍", "n": "Clione [L]  n=3199 cos0.98 難0.13", "s": 0.897, "f": 0}, {"x": 0.987, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.99 難-0.15", "s": 0.8, "f": 0}, {"x": 0.984, "y": 0.347, "c": "近傍", "n": "鬼天 [A]  n=3356 cos0.98 難0.35", "s": 0.941, "f": 0}, {"x": 0.988, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.99 難-0.24", "s": 0.704, "f": 0}, {"x": 0.988, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.26", "s": 0.494, "f": 0}, {"x": 0.983, "y": 0.023, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.98 難0.02", "s": 0.443, "f": 0}, {"x": 0.987, "y": -0.286, "c": "近傍", "n": "NEWALONE [A]  n=2222 cos0.99 難-0.29", "s": 0.623, "f": 0}, {"x": 0.982, "y": 0.287, "c": "近傍", "n": "of the first magnitude [A]  n=2747 cos0.98 難0.29", "s": 0.77, "f": 0}, {"x": 0.982, "y": 0.133, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.98 難0.13", "s": 0.783, "f": 0}, {"x": 0.986, "y": -0.261, "c": "近傍", "n": "Virus Funk [A]  n=3044 cos0.99 難-0.26", "s": 0.853, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4244681295875846}, {"a": 0, "b": 2, "w": 0.38344669928899633}, {"a": 0, "b": 3, "w": 0.3599226402808202}, {"a": 0, "b": 4, "w": 0.4205529773981437}, {"a": 0, "b": 5, "w": 0.3310806229698223}, {"a": 0, "b": 6, "w": 0.24160249129047706}, {"a": 0, "b": 7, "w": 0.20533138255850292}, {"a": 0, "b": 8, "w": 0.2162806209655067}, {"a": 0, "b": 9, "w": 0.2671036077169727}, {"a": 0, "b": 10, "w": 0.22688012592641482}, {"a": 0, "b": 11, "w": 0.2692531595309251}, {"a": 0, "b": 12, "w": 0.14043687608313515}, {"a": 0, "b": 13, "w": 0.25410555634826393}, {"a": 0, "b": 14, "w": 0.3030301531271402}, {"a": 0, "b": 15, "w": 0.34950554613677953}, {"a": 0, "b": 16, "w": 0.2394743449607757}, {"a": 0, "b": 17, "w": 3.4870661913544154e-11}, {"a": 0, "b": 18, "w": 0.13166047871298225}, {"a": 0, "b": 19, "w": 0.20696137200469022}, {"a": 0, "b": 20, "w": 0.27514309958238414}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-0.356,hiY=0.657;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
