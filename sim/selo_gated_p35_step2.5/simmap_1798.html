<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Chronos [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.192, "c": "種", "n": "Chronos [A]  n=3401 cos1.00 難0.19", "s": 0.962, "f": 0}, {"x": 0.994, "y": 0.133, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.99 難0.13", "s": 0.79, "f": 0}, {"x": 0.992, "y": -0.11, "c": "近傍", "n": "Do Back Burn [A]  n=1891 cos0.99 難-0.11", "s": 0.535, "f": 0}, {"x": 0.989, "y": 0.185, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2303 cos0.99 難0.19", "s": 0.651, "f": 0}, {"x": 0.989, "y": 0.286, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2466 cos0.99 難0.29", "s": 0.698, "f": 0}, {"x": 0.993, "y": 0.587, "c": "近傍", "n": "Star Trail [L]  n=1143 cos0.99 難0.59", "s": 0.323, "f": 0}, {"x": 0.989, "y": -0.026, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2382 cos0.99 難-0.03", "s": 0.674, "f": 0}, {"x": 0.988, "y": 0.134, "c": "近傍", "n": "Nasty Techniques [A]  n=2976 cos0.99 難0.13", "s": 0.842, "f": 0}, {"x": 0.988, "y": 0.313, "c": "近傍", "n": "ABSOLUTE [L]  n=3179 cos0.99 難0.31", "s": 0.899, "f": 0}, {"x": 0.988, "y": 0.262, "c": "近傍", "n": "Scharfrichter [A]  n=3415 cos0.99 難0.26", "s": 0.966, "f": 0}, {"x": 0.988, "y": 0.265, "c": "近傍", "n": "Get On Your Feet [A]  n=1761 cos0.99 難0.26", "s": 0.498, "f": 0}, {"x": 0.988, "y": -0.015, "c": "近傍", "n": "少年リップルズ [A]  n=1807 cos0.99 難-0.01", "s": 0.511, "f": 0}, {"x": 0.988, "y": 0.392, "c": "近傍", "n": "ADAMANT [A]  n=1507 cos0.99 難0.39", "s": 0.426, "f": 0}, {"x": 0.987, "y": 0.137, "c": "近傍", "n": "Daily Lunch Special [A]  n=3535 cos0.99 難0.14", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.26", "s": 0.499, "f": 0}, {"x": 0.988, "y": 0.377, "c": "近傍", "n": "Aublia [A]  n=3096 cos0.99 難0.38", "s": 0.876, "f": 0}, {"x": 0.987, "y": 0.228, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1763 cos0.99 難0.23", "s": 0.499, "f": 0}, {"x": 0.987, "y": 0.194, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2528 cos0.99 難0.19", "s": 0.715, "f": 0}, {"x": 0.987, "y": 0.101, "c": "近傍", "n": "セロトニン [A]  n=3330 cos0.99 難0.10", "s": 0.942, "f": 0}, {"x": 0.988, "y": -0.032, "c": "近傍", "n": "shuriken [A]  n=3146 cos0.99 難-0.03", "s": 0.89, "f": 0}, {"x": 0.987, "y": 0.325, "c": "近傍", "n": "Souhait bleu [A]  n=2368 cos0.99 難0.32", "s": 0.67, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3666993978305002}, {"a": 0, "b": 2, "w": 0.1811131980510473}, {"a": 0, "b": 3, "w": 4.8233417260235e-11}, {"a": 0, "b": 4, "w": 0.05952188077545928}, {"a": 0, "b": 5, "w": 0.23117186560892833}, {"a": 0, "b": 6, "w": 0.16910222182756263}, {"a": 0, "b": 7, "w": 0.12117122609796527}, {"a": 0, "b": 8, "w": 0.057638574561826195}, {"a": 0, "b": 9, "w": 0.035448129265254535}, {"a": 0, "b": 10, "w": 0.02297185643850219}, {"a": 0, "b": 11, "w": 0.09602597370703303}, {"a": 0, "b": 12, "w": 0.01030986694896907}, {"a": 0, "b": 13, "w": 0.059696353500563015}, {"a": 0, "b": 14, "w": 0.25513457705952236}, {"a": 0, "b": 15, "w": 0.10618615393817532}, {"a": 0, "b": 16, "w": 0.07474535684280137}, {"a": 0, "b": 17, "w": 0.04957701869816411}, {"a": 0, "b": 18, "w": 0.03335242480494238}, {"a": 0, "b": 19, "w": 0.10356459318188016}, {"a": 0, "b": 20, "w": 0.05224138712074389}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.325,hiY=0.655;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
