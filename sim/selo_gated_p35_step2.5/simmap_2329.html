<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">時空トラベローグ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.297, "c": "種", "n": "時空トラベローグ [A]  n=3207 cos1.00 難0.30", "s": 0.86, "f": 0}, {"x": 0.992, "y": 0.37, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3012 cos0.99 難0.37", "s": 0.808, "f": 0}, {"x": 0.991, "y": 0.167, "c": "近傍", "n": "murmur twins [A]  n=3525 cos0.99 難0.17", "s": 0.946, "f": 0}, {"x": 0.99, "y": 0.382, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.38", "s": 0.891, "f": 0}, {"x": 0.99, "y": 0.403, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3248 cos0.99 難0.40", "s": 0.871, "f": 0}, {"x": 0.99, "y": 0.483, "c": "近傍", "n": "stoic [A]  n=3319 cos0.99 難0.48", "s": 0.89, "f": 0}, {"x": 0.989, "y": 0.403, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.99 難0.40", "s": 0.836, "f": 0}, {"x": 0.988, "y": 0.245, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.24", "s": 0.823, "f": 0}, {"x": 0.988, "y": 0.13, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [H]  n=3620 cos0.99 難0.13", "s": 0.971, "f": 0}, {"x": 0.989, "y": 0.084, "c": "近傍", "n": "BLUE STRAGGLER [A]  n=2972 cos0.99 難0.08", "s": 0.797, "f": 0}, {"x": 0.986, "y": 0.234, "c": "近傍", "n": "Rock It [A]  n=3337 cos0.99 難0.23", "s": 0.895, "f": 0}, {"x": 0.986, "y": 0.184, "c": "近傍", "n": "LASER CRUSTER [H]  n=3204 cos0.99 難0.18", "s": 0.859, "f": 0}, {"x": 0.985, "y": 0.288, "c": "近傍", "n": "CONCEPTUAL [A]  n=3292 cos0.99 難0.29", "s": 0.883, "f": 0}, {"x": 0.988, "y": 0.557, "c": "近傍", "n": "Let The Track Flow [A]  n=3116 cos0.99 難0.56", "s": 0.836, "f": 0}, {"x": 0.987, "y": 0.075, "c": "近傍", "n": "嘆きの樹 [H]  n=3723 cos0.99 難0.08", "s": 0.999, "f": 0}, {"x": 0.987, "y": 0.04, "c": "近傍", "n": "BROKEN EDEN [A]  n=3527 cos0.99 難0.04", "s": 0.946, "f": 0}, {"x": 0.986, "y": 0.476, "c": "近傍", "n": "A [A]  n=3728 cos0.99 難0.48", "s": 1.0, "f": 0}, {"x": 0.985, "y": 0.128, "c": "近傍", "n": "reunion [H]  n=3567 cos0.99 難0.13", "s": 0.957, "f": 0}, {"x": 0.986, "y": 0.056, "c": "近傍", "n": "GENOCIDE [H]  n=2573 cos0.99 難0.06", "s": 0.69, "f": 0}, {"x": 0.986, "y": 0.045, "c": "近傍", "n": "405nm (Ryu☆mix) [A]  n=3619 cos0.99 難0.05", "s": 0.971, "f": 0}, {"x": 0.985, "y": 0.119, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.12", "s": 0.877, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.20837498983752567}, {"a": 0, "b": 2, "w": 0.27923955844062365}, {"a": 0, "b": 3, "w": 0.1686363580698541}, {"a": 0, "b": 4, "w": 0.18238218603624634}, {"a": 0, "b": 5, "w": 0.25895486122306965}, {"a": 0, "b": 6, "w": 0.2500501281967331}, {"a": 0, "b": 7, "w": 0.25912316014999714}, {"a": 0, "b": 8, "w": 0.25785976693112966}, {"a": 0, "b": 9, "w": 0.2401866309691767}, {"a": 0, "b": 10, "w": 0.18713870151123058}, {"a": 0, "b": 11, "w": 0.07659508843798601}, {"a": 0, "b": 12, "w": 0.1485730278239462}, {"a": 0, "b": 13, "w": 0.25982806704110006}, {"a": 0, "b": 14, "w": 0.2065436308372618}, {"a": 0, "b": 15, "w": 0.1636384547500762}, {"a": 0, "b": 16, "w": 0.2085918004997378}, {"a": 0, "b": 17, "w": 0.18986851581010522}, {"a": 0, "b": 18, "w": 0.08465324146197317}, {"a": 0, "b": 19, "w": 0.2120552092633724}, {"a": 0, "b": 20, "w": 3.8809955249519135e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.002,hiY=0.598;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
