<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">four pieces of heaven [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.195, "c": "種", "n": "four pieces of heaven [H]  n=2619 cos1.00 難-0.20", "s": 0.7, "f": 0}, {"x": 0.996, "y": -0.209, "c": "近傍", "n": "1st Samurai [H]  n=2308 cos1.00 難-0.21", "s": 0.617, "f": 0}, {"x": 0.995, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.99 難-0.26", "s": 0.83, "f": 0}, {"x": 0.994, "y": -0.102, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos0.99 難-0.10", "s": 0.822, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.99 難-0.23", "s": 0.618, "f": 0}, {"x": 0.995, "y": -0.329, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos1.00 難-0.33", "s": 0.87, "f": 0}, {"x": 0.991, "y": -0.24, "c": "近傍", "n": "冥 [H]  n=3743 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.283, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.99 難-0.28", "s": 0.712, "f": 0}, {"x": 0.995, "y": -0.4, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos1.00 難-0.40", "s": 0.46, "f": 0}, {"x": 0.991, "y": -0.304, "c": "近傍", "n": "oratio [H]  n=2403 cos0.99 難-0.30", "s": 0.642, "f": 0}, {"x": 0.989, "y": -0.159, "c": "近傍", "n": "少年A [H]  n=2696 cos0.99 難-0.16", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.182, "c": "近傍", "n": "dual control [A]  n=2202 cos0.99 難-0.18", "s": 0.588, "f": 0}, {"x": 0.992, "y": -0.386, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.39", "s": 0.835, "f": 0}, {"x": 0.988, "y": -0.198, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3047 cos0.99 難-0.20", "s": 0.814, "f": 0}, {"x": 0.988, "y": -0.156, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.16", "s": 0.567, "f": 0}, {"x": 0.988, "y": -0.232, "c": "近傍", "n": "共鳴遊戯の華 [H]  n=2742 cos0.99 難-0.23", "s": 0.733, "f": 0}, {"x": 0.988, "y": -0.238, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.24", "s": 0.883, "f": 0}, {"x": 0.991, "y": -0.402, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.40", "s": 0.665, "f": 0}, {"x": 0.988, "y": -0.097, "c": "近傍", "n": "Golden Horn [A]  n=1924 cos0.99 難-0.10", "s": 0.514, "f": 0}, {"x": 0.992, "y": -0.43, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos0.99 難-0.43", "s": 0.872, "f": 0}, {"x": 0.987, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.638, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5652885492253161}, {"a": 0, "b": 2, "w": 0.3602215404790148}, {"a": 0, "b": 3, "w": 0.5162898157898994}, {"a": 0, "b": 4, "w": 0.47887123591210046}, {"a": 0, "b": 5, "w": 0.5799368902473225}, {"a": 0, "b": 6, "w": 0.4061596795293927}, {"a": 0, "b": 7, "w": 0.4448111876406814}, {"a": 0, "b": 8, "w": 0.5448582053786972}, {"a": 0, "b": 9, "w": 0.295243431629567}, {"a": 0, "b": 10, "w": 0.362852679567217}, {"a": 0, "b": 11, "w": 0.3440972609226438}, {"a": 0, "b": 12, "w": 0.4376784590175534}, {"a": 0, "b": 13, "w": 0.24860250092057867}, {"a": 0, "b": 14, "w": 0.3033591777680944}, {"a": 0, "b": 15, "w": 0.3397883824093103}, {"a": 0, "b": 16, "w": 0.309900357439438}, {"a": 0, "b": 17, "w": 0.4147373527697116}, {"a": 0, "b": 18, "w": 3.961131422869357e-11}, {"a": 0, "b": 19, "w": 0.4678539408451339}, {"a": 0, "b": 20, "w": 0.08210209632241627}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.456,hiY=-0.071;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
