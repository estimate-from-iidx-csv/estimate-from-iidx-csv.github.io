<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">G59 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.284, "c": "種", "n": "G59 [H]  n=2935 cos1.00 難-0.28", "s": 0.901, "f": 0}, {"x": 0.997, "y": -0.25, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos1.00 難-0.25", "s": 0.725, "f": 0}, {"x": 0.996, "y": -0.297, "c": "近傍", "n": "Xepher [H]  n=3257 cos1.00 難-0.30", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos1.00 難-0.25", "s": 0.8, "f": 0}, {"x": 0.996, "y": -0.289, "c": "近傍", "n": "楽園追放 [A]  n=1689 cos1.00 難-0.29", "s": 0.519, "f": 0}, {"x": 0.996, "y": -0.251, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2548 cos1.00 難-0.25", "s": 0.782, "f": 0}, {"x": 0.998, "y": -0.147, "c": "近傍", "n": "As You Want [A]  n=1915 cos1.00 難-0.15", "s": 0.588, "f": 0}, {"x": 0.998, "y": -0.142, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1359 cos1.00 難-0.14", "s": 0.417, "f": 0}, {"x": 0.996, "y": -0.356, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2475 cos1.00 難-0.36", "s": 0.76, "f": 0}, {"x": 0.995, "y": -0.302, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos1.00 難-0.30", "s": 0.762, "f": 0}, {"x": 0.997, "y": -0.415, "c": "近傍", "n": "Nyan Nyan University [A]  n=1120 cos1.00 難-0.42", "s": 0.344, "f": 0}, {"x": 0.996, "y": -0.223, "c": "近傍", "n": "Be OK [A]  n=2981 cos1.00 難-0.22", "s": 0.915, "f": 0}, {"x": 0.995, "y": -0.233, "c": "近傍", "n": "EXE [A]  n=3025 cos1.00 難-0.23", "s": 0.929, "f": 0}, {"x": 0.995, "y": -0.365, "c": "近傍", "n": "ZEROIN ON THE LIGHT [A]  n=1589 cos1.00 難-0.36", "s": 0.488, "f": 0}, {"x": 0.996, "y": -0.196, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos1.00 難-0.20", "s": 0.96, "f": 0}, {"x": 0.997, "y": -0.127, "c": "近傍", "n": "Phoenix [A]  n=3111 cos1.00 難-0.13", "s": 0.955, "f": 0}, {"x": 0.996, "y": -0.164, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3048 cos1.00 難-0.16", "s": 0.936, "f": 0}, {"x": 0.997, "y": -0.426, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1729 cos1.00 難-0.43", "s": 0.531, "f": 0}, {"x": 0.995, "y": -0.263, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos0.99 難-0.26", "s": 0.921, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "弾幕信仰 [A]  n=962 cos0.99 難-0.25", "s": 0.295, "f": 0}, {"x": 0.995, "y": -0.367, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos0.99 難-0.37", "s": 0.884, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39977843418832393}, {"a": 0, "b": 2, "w": 0.3399098243765373}, {"a": 0, "b": 3, "w": 0.33101413304677396}, {"a": 0, "b": 4, "w": 0.331608059851914}, {"a": 0, "b": 5, "w": 0.15101876524553626}, {"a": 0, "b": 6, "w": 0.24499806949831548}, {"a": 0, "b": 7, "w": 0.5560833728012792}, {"a": 0, "b": 8, "w": 0.3429965382705019}, {"a": 0, "b": 9, "w": 6.893685622344492e-11}, {"a": 0, "b": 10, "w": 0.42425361100400694}, {"a": 0, "b": 11, "w": 0.17330029603462638}, {"a": 0, "b": 12, "w": 0.09512390012896266}, {"a": 0, "b": 13, "w": 0.28707613692342915}, {"a": 0, "b": 14, "w": 0.20181116044843916}, {"a": 0, "b": 15, "w": 0.46353882809813485}, {"a": 0, "b": 16, "w": 0.331758979697808}, {"a": 0, "b": 17, "w": 0.38258802322258956}, {"a": 0, "b": 18, "w": 0.20232574205063203}, {"a": 0, "b": 19, "w": 0.18458627118898752}, {"a": 0, "b": 20, "w": 0.1653718024124502}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.450,hiY=-0.103;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
