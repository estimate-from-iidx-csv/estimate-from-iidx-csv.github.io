<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ROCK女 feat. 大山愛未， Ken [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.628, "c": "種", "n": "ROCK女 feat. 大山愛未， Ken [A]  n=3085 cos1.00 難0.63", "s": 0.828, "f": 0}, {"x": 0.985, "y": 0.535, "c": "近傍", "n": "glacia [A]  n=2172 cos0.99 難0.54", "s": 0.583, "f": 0}, {"x": 0.985, "y": 0.724, "c": "近傍", "n": "Parvati [A]  n=2633 cos0.98 難0.72", "s": 0.706, "f": 0}, {"x": 0.983, "y": 0.548, "c": "近傍", "n": "LADYBIRD [A]  n=2809 cos0.98 難0.55", "s": 0.753, "f": 0}, {"x": 0.989, "y": 0.382, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.38", "s": 0.891, "f": 0}, {"x": 0.981, "y": 0.578, "c": "近傍", "n": "GENOCIDE [A]  n=3260 cos0.98 難0.58", "s": 0.874, "f": 0}, {"x": 0.99, "y": 0.373, "c": "近傍", "n": "Dawn Saga [A]  n=2733 cos0.99 難0.37", "s": 0.733, "f": 0}, {"x": 0.981, "y": 0.536, "c": "近傍", "n": "デッドボヲルdeホームラン [A]  n=3241 cos0.98 難0.54", "s": 0.869, "f": 0}, {"x": 0.98, "y": 0.627, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.98 難0.63", "s": 0.926, "f": 0}, {"x": 0.98, "y": 0.53, "c": "近傍", "n": "GHOST [A]  n=2246 cos0.98 難0.53", "s": 0.602, "f": 0}, {"x": 0.979, "y": 0.738, "c": "近傍", "n": "Beastie Starter [A]  n=3263 cos0.98 難0.74", "s": 0.875, "f": 0}, {"x": 0.979, "y": 0.476, "c": "近傍", "n": "A [A]  n=3728 cos0.98 難0.48", "s": 1.0, "f": 0}, {"x": 0.977, "y": 0.703, "c": "近傍", "n": "Adularia [A]  n=3591 cos0.98 難0.70", "s": 0.963, "f": 0}, {"x": 0.977, "y": 0.648, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.98 難0.65", "s": 0.904, "f": 0}, {"x": 0.977, "y": 0.512, "c": "近傍", "n": "TITANS RETURN [A]  n=3179 cos0.98 難0.51", "s": 0.853, "f": 0}, {"x": 0.982, "y": 0.383, "c": "近傍", "n": "Castle on the Moon [A]  n=3392 cos0.98 難0.38", "s": 0.91, "f": 0}, {"x": 0.981, "y": 0.378, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.98 難0.38", "s": 0.716, "f": 0}, {"x": 0.981, "y": 0.372, "c": "近傍", "n": "rumrum triplets [A]  n=3302 cos0.98 難0.37", "s": 0.886, "f": 0}, {"x": 0.976, "y": 0.738, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3554 cos0.98 難0.74", "s": 0.953, "f": 0}, {"x": 0.979, "y": 0.403, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.98 難0.40", "s": 0.836, "f": 0}, {"x": 0.982, "y": 0.347, "c": "近傍", "n": "鬼天 [A]  n=3356 cos0.98 難0.35", "s": 0.9, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2442945409207613}, {"a": 0, "b": 2, "w": 0.25241532285254076}, {"a": 0, "b": 3, "w": 0.11260996890070274}, {"a": 0, "b": 4, "w": 0.03435202042559815}, {"a": 0, "b": 5, "w": 0.06908006993302795}, {"a": 0, "b": 6, "w": 0.3625910553499495}, {"a": 0, "b": 7, "w": 0.16490329706705908}, {"a": 0, "b": 8, "w": 0.14533224525987876}, {"a": 0, "b": 9, "w": 0.13593942013259652}, {"a": 0, "b": 10, "w": 0.054692034107912346}, {"a": 0, "b": 11, "w": 0.08783427238822583}, {"a": 0, "b": 12, "w": 0.09433880000713546}, {"a": 0, "b": 13, "w": 0.06579856964415942}, {"a": 0, "b": 14, "w": 0.09196532436469873}, {"a": 0, "b": 15, "w": 0.1660583559649902}, {"a": 0, "b": 16, "w": 0.15151472785522824}, {"a": 0, "b": 17, "w": 0.1596440216102587}, {"a": 0, "b": 18, "w": 0.03332168309793282}, {"a": 0, "b": 19, "w": 3.256139802232383e-11}, {"a": 0, "b": 20, "w": 0.12813165499971757}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=0.316,hiY=0.769;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
