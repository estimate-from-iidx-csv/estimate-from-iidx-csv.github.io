<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ハオ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.005, "c": "種", "n": "ハオ [A]  n=1364 cos1.00 難-0.00", "s": 0.378, "f": 0}, {"x": 0.994, "y": -0.064, "c": "近傍", "n": "グッバイ宣言 [A]  n=2497 cos0.99 難-0.06", "s": 0.691, "f": 0}, {"x": 0.993, "y": -0.087, "c": "近傍", "n": "Shadow World [A]  n=2323 cos0.99 難-0.09", "s": 0.643, "f": 0}, {"x": 0.994, "y": 0.105, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos0.99 難0.11", "s": 0.347, "f": 0}, {"x": 0.992, "y": 0.0, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [A]  n=1896 cos0.99 難0.00", "s": 0.525, "f": 0}, {"x": 0.992, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.658, "f": 0}, {"x": 0.991, "y": -0.075, "c": "近傍", "n": "Wing of Hearts [A]  n=3094 cos0.99 難-0.07", "s": 0.857, "f": 0}, {"x": 0.991, "y": 0.096, "c": "近傍", "n": "恋は白帯、サンシロー [L]  n=3246 cos0.99 難0.10", "s": 0.899, "f": 0}, {"x": 0.991, "y": 0.04, "c": "近傍", "n": "PENDUAL TALISMAN [A]  n=3420 cos0.99 難0.04", "s": 0.947, "f": 0}, {"x": 0.993, "y": 0.206, "c": "近傍", "n": "雫 [A]  n=1348 cos0.99 難0.21", "s": 0.373, "f": 0}, {"x": 0.994, "y": -0.252, "c": "近傍", "n": "湘南ロンリーMIDNIGHT RAIN [A]  n=1879 cos0.99 難-0.25", "s": 0.52, "f": 0}, {"x": 0.992, "y": 0.189, "c": "近傍", "n": "ここからよろしく大作戦143 [L]  n=874 cos0.99 難0.19", "s": 0.242, "f": 0}, {"x": 0.989, "y": 0.09, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1935 cos0.99 難0.09", "s": 0.536, "f": 0}, {"x": 0.989, "y": 0.133, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos0.99 難0.13", "s": 0.962, "f": 0}, {"x": 0.993, "y": -0.258, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos0.99 難-0.26", "s": 0.713, "f": 0}, {"x": 0.988, "y": 0.037, "c": "近傍", "n": "SigSig [A]  n=3612 cos0.99 難0.04", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos0.99 難-0.02", "s": 0.824, "f": 0}, {"x": 0.989, "y": 0.158, "c": "近傍", "n": "Be A Star [A]  n=3353 cos0.99 難0.16", "s": 0.928, "f": 0}, {"x": 0.989, "y": -0.133, "c": "近傍", "n": "Mighty Cutie [A]  n=952 cos0.99 難-0.13", "s": 0.264, "f": 0}, {"x": 0.989, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.16", "s": 0.871, "f": 0}, {"x": 0.988, "y": -0.069, "c": "近傍", "n": "Shapeshifter [A]  n=1780 cos0.99 難-0.07", "s": 0.493, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.16069965771190076}, {"a": 0, "b": 2, "w": 0.28517884585886577}, {"a": 0, "b": 3, "w": 0.29384522035732563}, {"a": 0, "b": 4, "w": 0.1583614566617917}, {"a": 0, "b": 5, "w": 0.21025453481345135}, {"a": 0, "b": 6, "w": 0.09791462306287402}, {"a": 0, "b": 7, "w": 0.16746990949542562}, {"a": 0, "b": 8, "w": 0.1742624930712312}, {"a": 0, "b": 9, "w": 0.2684836065346706}, {"a": 0, "b": 10, "w": 0.3347470370604194}, {"a": 0, "b": 11, "w": 0.006652813287576609}, {"a": 0, "b": 12, "w": 0.08077002949368672}, {"a": 0, "b": 13, "w": 5.4102833324520816e-11}, {"a": 0, "b": 14, "w": 0.12700092696225962}, {"a": 0, "b": 15, "w": 0.05974846552276336}, {"a": 0, "b": 16, "w": 0.06552098159262043}, {"a": 0, "b": 17, "w": 0.05307515917165273}, {"a": 0, "b": 18, "w": 0.08000061790573554}, {"a": 0, "b": 19, "w": 0.051175143093793674}, {"a": 0, "b": 20, "w": 0.044031630016751144}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.295,hiY=0.243;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
