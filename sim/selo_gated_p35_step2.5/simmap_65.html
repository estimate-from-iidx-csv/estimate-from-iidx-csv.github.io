<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">IIDX RED Ending (Ryu☆Remix) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.379, "c": "種", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos1.00 難-0.38", "s": 0.734, "f": 0}, {"x": 0.996, "y": -0.202, "c": "近傍", "n": "Almace [A]  n=3119 cos1.00 難-0.20", "s": 0.923, "f": 0}, {"x": 0.996, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos1.00 難-0.15", "s": 0.845, "f": 0}, {"x": 0.992, "y": -0.377, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.99 難-0.38", "s": 0.931, "f": 0}, {"x": 0.992, "y": -0.235, "c": "近傍", "n": "MINT [H]  n=2436 cos0.99 難-0.23", "s": 0.721, "f": 0}, {"x": 0.995, "y": -0.122, "c": "近傍", "n": "If [A]  n=2170 cos1.00 難-0.12", "s": 0.642, "f": 0}, {"x": 0.992, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.26", "s": 0.522, "f": 0}, {"x": 0.993, "y": -0.559, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2442 cos0.99 難-0.56", "s": 0.723, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "霧幻メモリア [A]  n=2432 cos0.99 難-0.25", "s": 0.72, "f": 0}, {"x": 0.99, "y": -0.377, "c": "近傍", "n": "THE BLACK KNIGHT [H]  n=2724 cos0.99 難-0.38", "s": 0.806, "f": 0}, {"x": 0.991, "y": -0.462, "c": "近傍", "n": "海神 [H]  n=3063 cos0.99 難-0.46", "s": 0.906, "f": 0}, {"x": 0.991, "y": -0.239, "c": "近傍", "n": "Pink Rose [L]  n=1243 cos0.99 難-0.24", "s": 0.368, "f": 0}, {"x": 0.99, "y": -0.381, "c": "近傍", "n": "7 Colors [A]  n=1872 cos0.99 難-0.38", "s": 0.554, "f": 0}, {"x": 0.99, "y": -0.313, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos0.99 難-0.31", "s": 0.822, "f": 0}, {"x": 0.99, "y": -0.419, "c": "近傍", "n": "No Day But Today! [A]  n=2351 cos0.99 難-0.42", "s": 0.696, "f": 0}, {"x": 0.99, "y": -0.389, "c": "近傍", "n": "thunder [A]  n=2861 cos0.99 難-0.39", "s": 0.847, "f": 0}, {"x": 0.99, "y": -0.295, "c": "近傍", "n": "Monkey Dance [A]  n=2552 cos0.99 難-0.29", "s": 0.755, "f": 0}, {"x": 0.989, "y": -0.346, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.35", "s": 0.757, "f": 0}, {"x": 0.99, "y": -0.256, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=992 cos0.99 難-0.26", "s": 0.294, "f": 0}, {"x": 0.99, "y": -0.245, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.24", "s": 0.629, "f": 0}, {"x": 0.989, "y": -0.462, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.46", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4939438543298097}, {"a": 0, "b": 2, "w": 0.5068647708304}, {"a": 0, "b": 3, "w": 0.31682256499379335}, {"a": 0, "b": 4, "w": 0.1617162601247062}, {"a": 0, "b": 5, "w": 0.5053592639862057}, {"a": 0, "b": 6, "w": 0.18682273439560426}, {"a": 0, "b": 7, "w": 0.3809627856350112}, {"a": 0, "b": 8, "w": 0.3246664708890239}, {"a": 0, "b": 9, "w": 0.26306989278443427}, {"a": 0, "b": 10, "w": 0.2741858483709364}, {"a": 0, "b": 11, "w": 0.3160661319331014}, {"a": 0, "b": 12, "w": 0.1451035612765117}, {"a": 0, "b": 13, "w": 0.1929375439475034}, {"a": 0, "b": 14, "w": 0.25270516783147334}, {"a": 0, "b": 15, "w": 4.8278159248127395e-11}, {"a": 0, "b": 16, "w": 0.12379680221639422}, {"a": 0, "b": 17, "w": 0.1406252561515442}, {"a": 0, "b": 18, "w": 0.2324421547105553}, {"a": 0, "b": 19, "w": 0.20421939706119596}, {"a": 0, "b": 20, "w": 0.15624416286363318}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.594,hiY=-0.087;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
