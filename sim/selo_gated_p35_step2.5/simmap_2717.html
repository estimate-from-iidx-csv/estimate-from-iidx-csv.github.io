<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Makin' It [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.29, "c": "種", "n": "Makin' It [A]  n=971 cos1.00 難2.29", "s": 0.294, "f": 0}, {"x": 0.975, "y": 2.457, "c": "近傍", "n": "Level 4 [A]  n=1729 cos0.97 難2.46", "s": 0.524, "f": 0}, {"x": 0.972, "y": 2.46, "c": "近傍", "n": "Level One [A]  n=2922 cos0.97 難2.46", "s": 0.885, "f": 0}, {"x": 0.963, "y": 2.214, "c": "近傍", "n": "Lords Of The Roundtable [A]  n=2510 cos0.96 難2.21", "s": 0.761, "f": 0}, {"x": 0.963, "y": 2.473, "c": "近傍", "n": "Miracle 5ympho X [L]  n=1295 cos0.96 難2.47", "s": 0.392, "f": 0}, {"x": 0.956, "y": 2.423, "c": "近傍", "n": "Red. by Jack Trance [A]  n=2727 cos0.96 難2.42", "s": 0.826, "f": 0}, {"x": 0.949, "y": 2.433, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [A]  n=2332 cos0.95 難2.43", "s": 0.707, "f": 0}, {"x": 0.944, "y": 2.226, "c": "近傍", "n": "SOLAR ECLIPSE [A]  n=1659 cos0.94 難2.23", "s": 0.503, "f": 0}, {"x": 0.96, "y": 1.967, "c": "近傍", "n": "The Chase [A]  n=3116 cos0.96 難1.97", "s": 0.944, "f": 0}, {"x": 0.967, "y": 1.893, "c": "近傍", "n": "Level 3 [A]  n=2167 cos0.97 難1.89", "s": 0.657, "f": 0}, {"x": 0.985, "y": 2.741, "c": "近傍", "n": "灼熱Beach Side Bunny [A]  n=3253 cos0.98 難2.74", "s": 0.986, "f": 0}, {"x": 0.967, "y": 1.887, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3300 cos0.97 難1.89", "s": 1.0, "f": 0}, {"x": 0.983, "y": 2.759, "c": "近傍", "n": "Level 5 [A]  n=1098 cos0.98 難2.76", "s": 0.333, "f": 0}, {"x": 0.943, "y": 2.02, "c": "近傍", "n": "HEROES [A]  n=577 cos0.94 難2.02", "s": 0.175, "f": 0}, {"x": 0.937, "y": 2.518, "c": "近傍", "n": "WHA [A]  n=1878 cos0.94 難2.52", "s": 0.569, "f": 0}, {"x": 0.96, "y": 1.868, "c": "近傍", "n": "Be quiet [L]  n=2110 cos0.96 難1.87", "s": 0.639, "f": 0}, {"x": 0.938, "y": 1.992, "c": "近傍", "n": "LOCUS OF THE TRAVEL [A]  n=2105 cos0.94 難1.99", "s": 0.638, "f": 0}, {"x": 0.948, "y": 1.889, "c": "近傍", "n": "真 地獄超特急 -HELL or HELL- [A]  n=3048 cos0.95 難1.89", "s": 0.924, "f": 0}, {"x": 0.968, "y": 2.794, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [A]  n=1818 cos0.97 難2.79", "s": 0.551, "f": 0}, {"x": 0.942, "y": 1.917, "c": "近傍", "n": "Don't believe the hype [A]  n=2210 cos0.94 難1.92", "s": 0.67, "f": 0}, {"x": 0.959, "y": 1.801, "c": "近傍", "n": "Cult Invitation [A]  n=1265 cos0.96 難1.80", "s": 0.383, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24725643589371138}, {"a": 0, "b": 2, "w": 0.3413645668940213}, {"a": 0, "b": 3, "w": 0.2823554733291166}, {"a": 0, "b": 4, "w": 0.32164756066849387}, {"a": 0, "b": 5, "w": 0.05355187407512163}, {"a": 0, "b": 6, "w": 0.132414061521831}, {"a": 0, "b": 7, "w": 0.058974490043454675}, {"a": 0, "b": 8, "w": 0.3050070461048996}, {"a": 0, "b": 9, "w": 0.227968190075845}, {"a": 0, "b": 10, "w": 0.41423878712495954}, {"a": 0, "b": 11, "w": 0.22469445103056418}, {"a": 0, "b": 12, "w": 0.2877465360646818}, {"a": 0, "b": 13, "w": 0.11675937433166195}, {"a": 0, "b": 14, "w": 1.6047163597932013e-11}, {"a": 0, "b": 15, "w": 0.30050823691868245}, {"a": 0, "b": 16, "w": 0.04512061578636817}, {"a": 0, "b": 17, "w": 0.17138830261418647}, {"a": 0, "b": 18, "w": 0.178418510744783}, {"a": 0, "b": 19, "w": 0.11907952058485105}, {"a": 0, "b": 20, "w": 0.2853354546472573}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.932,hiX=1.005,loY=1.722,hiY=2.873;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
