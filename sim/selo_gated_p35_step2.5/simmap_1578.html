<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">waxing and wanding [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.531, "c": "種", "n": "waxing and wanding [H]  n=3324 cos1.00 難-0.53", "s": 0.991, "f": 0}, {"x": 0.995, "y": -0.703, "c": "近傍", "n": "LOVELY STORM [H]  n=1965 cos0.99 難-0.70", "s": 0.586, "f": 0}, {"x": 0.993, "y": -0.4, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3011 cos0.99 難-0.40", "s": 0.897, "f": 0}, {"x": 0.992, "y": -0.537, "c": "近傍", "n": "Far east nightbird [A]  n=3200 cos0.99 難-0.54", "s": 0.954, "f": 0}, {"x": 0.992, "y": -0.458, "c": "近傍", "n": "Alpheratz [A]  n=2963 cos0.99 難-0.46", "s": 0.883, "f": 0}, {"x": 0.992, "y": -0.393, "c": "近傍", "n": "COLOR BURST [A]  n=802 cos0.99 難-0.39", "s": 0.239, "f": 0}, {"x": 0.992, "y": -0.4, "c": "近傍", "n": "華蝶風雪 [H]  n=2941 cos0.99 難-0.40", "s": 0.877, "f": 0}, {"x": 0.996, "y": -0.223, "c": "近傍", "n": "ALFARSHEAR 双神威に廻る夢 [A]  n=3248 cos1.00 難-0.22", "s": 0.968, "f": 0}, {"x": 0.99, "y": -0.578, "c": "近傍", "n": "Idola [H]  n=3062 cos0.99 難-0.58", "s": 0.913, "f": 0}, {"x": 0.99, "y": -0.551, "c": "近傍", "n": "Tomorrow Perfume [H]  n=1779 cos0.99 難-0.55", "s": 0.53, "f": 0}, {"x": 0.99, "y": -0.525, "c": "近傍", "n": "neu [H]  n=2801 cos0.99 難-0.53", "s": 0.835, "f": 0}, {"x": 0.989, "y": -0.476, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3122 cos0.99 難-0.48", "s": 0.931, "f": 0}, {"x": 0.99, "y": -0.74, "c": "近傍", "n": "memories [H]  n=1669 cos0.99 難-0.74", "s": 0.497, "f": 0}, {"x": 0.99, "y": -0.793, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.79", "s": 0.535, "f": 0}, {"x": 0.99, "y": -0.256, "c": "近傍", "n": "HAERETICUS [H]  n=2683 cos0.99 難-0.26", "s": 0.8, "f": 0}, {"x": 0.993, "y": -0.137, "c": "近傍", "n": "memories [A]  n=2210 cos0.99 難-0.14", "s": 0.659, "f": 0}, {"x": 0.988, "y": -0.588, "c": "近傍", "n": "シル・ヴ・プレジデント [A]  n=2829 cos0.99 難-0.59", "s": 0.843, "f": 0}, {"x": 0.989, "y": -0.28, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3355 cos0.99 難-0.28", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.156, "c": "近傍", "n": "Best of Me [A]  n=3063 cos0.99 難-0.16", "s": 0.913, "f": 0}, {"x": 0.989, "y": -0.291, "c": "近傍", "n": "rainbow rainbow [H]  n=2670 cos0.99 難-0.29", "s": 0.796, "f": 0}, {"x": 0.99, "y": -0.213, "c": "近傍", "n": "Recollection [A]  n=2277 cos0.99 難-0.21", "s": 0.679, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3190303353582429}, {"a": 0, "b": 2, "w": 0.05020942782110982}, {"a": 0, "b": 3, "w": 0.054497484600400825}, {"a": 0, "b": 4, "w": 0.18041677564316327}, {"a": 0, "b": 5, "w": 0.22354876696614445}, {"a": 0, "b": 6, "w": 0.18072725877788454}, {"a": 0, "b": 7, "w": 0.40449592665177336}, {"a": 0, "b": 8, "w": 0.14211590343401548}, {"a": 0, "b": 9, "w": 0.03678825551106424}, {"a": 0, "b": 10, "w": 0.11596796377436869}, {"a": 0, "b": 11, "w": 0.08878015520098614}, {"a": 0, "b": 12, "w": 0.06589091137269698}, {"a": 0, "b": 13, "w": 0.028569496567379504}, {"a": 0, "b": 14, "w": 0.11646286577152998}, {"a": 0, "b": 15, "w": 0.2641271078839924}, {"a": 0, "b": 16, "w": 6.14680528698841e-11}, {"a": 0, "b": 17, "w": 0.10933600440079505}, {"a": 0, "b": 18, "w": 0.22359638092157208}, {"a": 0, "b": 19, "w": 0.03561463367633655}, {"a": 0, "b": 20, "w": 0.07845390300591104}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.845,hiY=-0.085;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
