<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">三日天下モンキー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.15, "c": "種", "n": "三日天下モンキー [A]  n=406 cos1.00 難-0.15", "s": 0.108, "f": 0}, {"x": 0.99, "y": -0.107, "c": "近傍", "n": "Tripping Jumping [A]  n=1970 cos0.99 難-0.11", "s": 0.522, "f": 0}, {"x": 0.991, "y": 0.081, "c": "近傍", "n": "Shamshir [A]  n=1509 cos0.99 難0.08", "s": 0.4, "f": 0}, {"x": 0.99, "y": -0.386, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3319 cos0.99 難-0.39", "s": 0.879, "f": 0}, {"x": 0.985, "y": 0.006, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2166 cos0.98 難0.01", "s": 0.574, "f": 0}, {"x": 0.983, "y": -0.082, "c": "近傍", "n": "Snake Stick [H]  n=3406 cos0.98 難-0.08", "s": 0.902, "f": 0}, {"x": 0.982, "y": -0.116, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2867 cos0.98 難-0.12", "s": 0.76, "f": 0}, {"x": 0.982, "y": -0.163, "c": "近傍", "n": "Somebody Like You [A]  n=1180 cos0.98 難-0.16", "s": 0.313, "f": 0}, {"x": 0.983, "y": -0.025, "c": "近傍", "n": "Midnight Drive [A]  n=2326 cos0.98 難-0.03", "s": 0.616, "f": 0}, {"x": 0.988, "y": 0.234, "c": "近傍", "n": "Watch out!! [A]  n=3272 cos0.99 難0.23", "s": 0.867, "f": 0}, {"x": 0.979, "y": 0.109, "c": "近傍", "n": "bass 2 bass [A]  n=3774 cos0.98 難0.11", "s": 1.0, "f": 0}, {"x": 0.976, "y": -0.065, "c": "近傍", "n": "Non Stop Rock [A]  n=2198 cos0.98 難-0.06", "s": 0.582, "f": 0}, {"x": 0.977, "y": 0.065, "c": "近傍", "n": "SWEET LAB [A]  n=2480 cos0.98 難0.06", "s": 0.657, "f": 0}, {"x": 0.987, "y": -0.643, "c": "近傍", "n": "Digitank System [H]  n=2777 cos0.99 難-0.64", "s": 0.736, "f": 0}, {"x": 0.981, "y": -0.555, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2310 cos0.98 難-0.55", "s": 0.612, "f": 0}, {"x": 0.973, "y": -0.067, "c": "近傍", "n": "Catch Me [A]  n=2858 cos0.97 難-0.07", "s": 0.757, "f": 0}, {"x": 0.986, "y": 0.384, "c": "近傍", "n": "Digitank System [A]  n=3622 cos0.99 難0.38", "s": 0.96, "f": 0}, {"x": 0.985, "y": 0.402, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3347 cos0.99 難0.40", "s": 0.887, "f": 0}, {"x": 0.973, "y": 0.056, "c": "近傍", "n": "A Certified Rave Moment [A]  n=1123 cos0.97 難0.06", "s": 0.298, "f": 0}, {"x": 0.98, "y": -0.611, "c": "近傍", "n": "Level 4 [H]  n=1523 cos0.98 難-0.61", "s": 0.404, "f": 0}, {"x": 0.973, "y": 0.064, "c": "近傍", "n": "Skratch Education Lv-1 [H]  n=718 cos0.97 難0.06", "s": 0.19, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5219131912973278}, {"a": 0, "b": 2, "w": 0.5774611394893896}, {"a": 0, "b": 3, "w": 0.536066202792246}, {"a": 0, "b": 4, "w": 0.44922172067166044}, {"a": 0, "b": 5, "w": 0.4000958860323799}, {"a": 0, "b": 6, "w": 0.28383932987231253}, {"a": 0, "b": 7, "w": 0.3844000372597949}, {"a": 0, "b": 8, "w": 0.4088273901405992}, {"a": 0, "b": 9, "w": 0.5043761373620829}, {"a": 0, "b": 10, "w": 0.33436099537283803}, {"a": 0, "b": 11, "w": 0.2307493522132419}, {"a": 0, "b": 12, "w": 0.2673778794924109}, {"a": 0, "b": 13, "w": 0.45105093773181293}, {"a": 0, "b": 14, "w": 0.35188956468717303}, {"a": 0, "b": 15, "w": 0.18980698864343726}, {"a": 0, "b": 16, "w": 0.45333386554718136}, {"a": 0, "b": 17, "w": 0.4581556061979076}, {"a": 0, "b": 18, "w": 2.8190338952072125e-11}, {"a": 0, "b": 19, "w": 0.26421201170293085}, {"a": 0, "b": 20, "w": 0.23011208807888006}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=-0.727,hiY=0.486;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
