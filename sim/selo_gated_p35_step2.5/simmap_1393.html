<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Initiation [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.733, "c": "種", "n": "Initiation [H]  n=2337 cos1.00 難-0.73", "s": 0.62, "f": 0}, {"x": 0.99, "y": -0.893, "c": "近傍", "n": "ディスコルディア [H]  n=1575 cos0.99 難-0.89", "s": 0.418, "f": 0}, {"x": 0.988, "y": -0.687, "c": "近傍", "n": "THE F∀UST [H]  n=1854 cos0.99 難-0.69", "s": 0.492, "f": 0}, {"x": 0.985, "y": -0.946, "c": "近傍", "n": "逆月 [H]  n=1692 cos0.99 難-0.95", "s": 0.449, "f": 0}, {"x": 0.986, "y": -1.047, "c": "近傍", "n": "suspicions [H]  n=721 cos0.99 難-1.05", "s": 0.191, "f": 0}, {"x": 0.992, "y": -0.254, "c": "近傍", "n": "Several Words [A]  n=3039 cos0.99 難-0.25", "s": 0.807, "f": 0}, {"x": 0.983, "y": -0.758, "c": "近傍", "n": "Painful Fate [H]  n=1816 cos0.98 難-0.76", "s": 0.482, "f": 0}, {"x": 0.983, "y": -0.811, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos0.98 難-0.81", "s": 0.589, "f": 0}, {"x": 0.983, "y": -0.595, "c": "近傍", "n": "Sky High [H]  n=2456 cos0.98 難-0.60", "s": 0.652, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "Brave Spirits [A]  n=1880 cos0.99 難-0.23", "s": 0.499, "f": 0}, {"x": 0.993, "y": -0.234, "c": "近傍", "n": "Nemophila [A]  n=684 cos0.99 難-0.23", "s": 0.182, "f": 0}, {"x": 0.992, "y": -0.236, "c": "近傍", "n": "ミッドナイト☆WAR [A]  n=3154 cos0.99 難-0.24", "s": 0.837, "f": 0}, {"x": 0.99, "y": -0.254, "c": "近傍", "n": "可愛くてごめん [L]  n=1106 cos0.99 難-0.25", "s": 0.294, "f": 0}, {"x": 0.984, "y": -0.469, "c": "近傍", "n": "新宝島 [A]  n=2975 cos0.98 難-0.47", "s": 0.79, "f": 0}, {"x": 0.982, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.98 難-0.56", "s": 0.702, "f": 0}, {"x": 0.982, "y": -0.756, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2208 cos0.98 難-0.76", "s": 0.586, "f": 0}, {"x": 0.981, "y": -0.761, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos0.98 難-0.76", "s": 0.486, "f": 0}, {"x": 0.985, "y": -0.377, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.98 難-0.38", "s": 0.835, "f": 0}, {"x": 0.984, "y": -0.428, "c": "近傍", "n": "AA [H]  n=3768 cos0.98 難-0.43", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.379, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2479 cos0.98 難-0.38", "s": 0.658, "f": 0}, {"x": 0.983, "y": -0.475, "c": "近傍", "n": "異心前進♪ぴょんぴょんぴょん [A]  n=1538 cos0.98 難-0.47", "s": 0.408, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3834018259405003}, {"a": 0, "b": 2, "w": 0.2988667494042373}, {"a": 0, "b": 3, "w": 0.2506257895099073}, {"a": 0, "b": 4, "w": 0.14697196266096724}, {"a": 0, "b": 5, "w": 0.4491037833775715}, {"a": 0, "b": 6, "w": 0.2008365617901039}, {"a": 0, "b": 7, "w": 0.053287289703294216}, {"a": 0, "b": 8, "w": 0.1638554596340709}, {"a": 0, "b": 9, "w": 0.4701746313641084}, {"a": 0, "b": 10, "w": 0.4646449958190436}, {"a": 0, "b": 11, "w": 0.45875511370734345}, {"a": 0, "b": 12, "w": 0.3883287419573829}, {"a": 0, "b": 13, "w": 0.23016209068835292}, {"a": 0, "b": 14, "w": 3.740374676652891e-11}, {"a": 0, "b": 15, "w": 0.03769888668453536}, {"a": 0, "b": 16, "w": 0.09242566233231653}, {"a": 0, "b": 17, "w": 0.10533747184551412}, {"a": 0, "b": 18, "w": 0.17424330216314288}, {"a": 0, "b": 19, "w": 0.19269035165403703}, {"a": 0, "b": 20, "w": 0.15816766551230566}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.112,hiY=-0.169;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
