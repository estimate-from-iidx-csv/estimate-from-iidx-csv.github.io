<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Saturn [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.234, "c": "種", "n": "Saturn [L]  n=1035 cos1.00 難2.23", "s": 0.348, "f": 0}, {"x": 0.972, "y": 2.096, "c": "近傍", "n": "音楽 [A]  n=2907 cos0.97 難2.10", "s": 0.979, "f": 0}, {"x": 0.953, "y": 2.332, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2217 cos0.95 難2.33", "s": 0.746, "f": 0}, {"x": 0.951, "y": 2.312, "c": "近傍", "n": "色を喪った街 [A]  n=619 cos0.95 難2.31", "s": 0.208, "f": 0}, {"x": 0.947, "y": 2.339, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1790 cos0.95 難2.34", "s": 0.603, "f": 0}, {"x": 0.954, "y": 2.423, "c": "近傍", "n": "Elemental Creation [A]  n=2833 cos0.95 難2.42", "s": 0.954, "f": 0}, {"x": 0.975, "y": 2.532, "c": "近傍", "n": "ピアノ独奏無言歌 \"灰燼\" [A]  n=1736 cos0.98 難2.53", "s": 0.585, "f": 0}, {"x": 0.945, "y": 2.333, "c": "近傍", "n": "perditus†paradisus [A]  n=2878 cos0.95 難2.33", "s": 0.969, "f": 0}, {"x": 0.94, "y": 2.172, "c": "近傍", "n": "Amor∞Fati [A]  n=559 cos0.94 難2.17", "s": 0.188, "f": 0}, {"x": 0.943, "y": 2.355, "c": "近傍", "n": "EBONY & IVORY [L]  n=2292 cos0.94 難2.35", "s": 0.772, "f": 0}, {"x": 0.939, "y": 2.196, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2970 cos0.94 難2.20", "s": 1.0, "f": 0}, {"x": 0.96, "y": 1.95, "c": "近傍", "n": "Initiation [A]  n=2955 cos0.96 難1.95", "s": 0.995, "f": 0}, {"x": 0.951, "y": 2.472, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [A]  n=2908 cos0.95 難2.47", "s": 0.979, "f": 0}, {"x": 0.969, "y": 2.568, "c": "近傍", "n": "ディスコルディア [A]  n=1932 cos0.97 難2.57", "s": 0.651, "f": 0}, {"x": 0.94, "y": 2.391, "c": "近傍", "n": "MEGAERA [A]  n=2101 cos0.94 難2.39", "s": 0.707, "f": 0}, {"x": 0.934, "y": 2.266, "c": "近傍", "n": "≡+≡ [L]  n=746 cos0.93 難2.27", "s": 0.251, "f": 0}, {"x": 0.969, "y": 2.578, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1162 cos0.97 難2.58", "s": 0.391, "f": 0}, {"x": 0.96, "y": 2.551, "c": "近傍", "n": "KAISER PHOENIX [L]  n=2030 cos0.96 難2.55", "s": 0.684, "f": 0}, {"x": 0.97, "y": 1.879, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [L]  n=2757 cos0.97 難1.88", "s": 0.928, "f": 0}, {"x": 0.933, "y": 2.143, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2335 cos0.93 難2.14", "s": 0.786, "f": 0}, {"x": 0.934, "y": 2.37, "c": "近傍", "n": "VANESSA [L]  n=2321 cos0.93 難2.37", "s": 0.781, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4013245135421126}, {"a": 0, "b": 2, "w": 0.2706262342706425}, {"a": 0, "b": 3, "w": 0.24893831446229897}, {"a": 0, "b": 4, "w": 0.2239583215022667}, {"a": 0, "b": 5, "w": 0.2155175489657737}, {"a": 0, "b": 6, "w": 0.47141244223484735}, {"a": 0, "b": 7, "w": 0.21311187165947099}, {"a": 0, "b": 8, "w": 0.1839437028380574}, {"a": 0, "b": 9, "w": 0.1966137256527567}, {"a": 0, "b": 10, "w": 0.17755838038290273}, {"a": 0, "b": 11, "w": 0.28472283143412014}, {"a": 0, "b": 12, "w": 0.23098505028617}, {"a": 0, "b": 13, "w": 0.26129472373979634}, {"a": 0, "b": 14, "w": 0.18779885884256886}, {"a": 0, "b": 15, "w": 1.3542278409772734e-11}, {"a": 0, "b": 16, "w": 0.3979622204062624}, {"a": 0, "b": 17, "w": 0.3128461313254558}, {"a": 0, "b": 18, "w": 0.41945131162412175}, {"a": 0, "b": 19, "w": 0.137288896147435}, {"a": 0, "b": 20, "w": 0.13543758603121558}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.928,hiX=1.005,loY=1.823,hiY=2.634;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
