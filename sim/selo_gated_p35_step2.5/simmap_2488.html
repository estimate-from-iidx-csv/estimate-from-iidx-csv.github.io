<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">A [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.476, "c": "種", "n": "A [A]  n=3728 cos1.00 難0.48", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.382, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [A]  n=3321 cos0.99 難0.38", "s": 0.891, "f": 0}, {"x": 0.989, "y": 0.312, "c": "近傍", "n": "Overslept [A]  n=2562 cos0.99 難0.31", "s": 0.687, "f": 0}, {"x": 0.987, "y": 0.335, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2937 cos0.99 難0.33", "s": 0.788, "f": 0}, {"x": 0.988, "y": 0.627, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.99 難0.63", "s": 0.926, "f": 0}, {"x": 0.987, "y": 0.315, "c": "近傍", "n": "GRADIUS -FULL SPEED- [A]  n=2775 cos0.99 難0.32", "s": 0.744, "f": 0}, {"x": 0.988, "y": 0.263, "c": "近傍", "n": "INVISIBLE STRIX [A]  n=3041 cos0.99 難0.26", "s": 0.816, "f": 0}, {"x": 0.988, "y": 0.245, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3067 cos0.99 難0.24", "s": 0.823, "f": 0}, {"x": 0.991, "y": 0.167, "c": "近傍", "n": "murmur twins [A]  n=3525 cos0.99 難0.17", "s": 0.946, "f": 0}, {"x": 0.985, "y": 0.403, "c": "近傍", "n": "禍根 [A]  n=3116 cos0.98 難0.40", "s": 0.836, "f": 0}, {"x": 0.986, "y": 0.297, "c": "近傍", "n": "時空トラベローグ [A]  n=3207 cos0.99 難0.30", "s": 0.86, "f": 0}, {"x": 0.986, "y": 0.288, "c": "近傍", "n": "CONCEPTUAL [A]  n=3292 cos0.99 難0.29", "s": 0.883, "f": 0}, {"x": 0.984, "y": 0.37, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3012 cos0.98 難0.37", "s": 0.808, "f": 0}, {"x": 0.986, "y": 0.265, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=840 cos0.99 難0.27", "s": 0.225, "f": 0}, {"x": 0.984, "y": 0.372, "c": "近傍", "n": "rumrum triplets [A]  n=3302 cos0.98 難0.37", "s": 0.886, "f": 0}, {"x": 0.991, "y": 0.128, "c": "近傍", "n": "reunion [H]  n=3567 cos0.99 難0.13", "s": 0.957, "f": 0}, {"x": 0.988, "y": 0.171, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3160 cos0.99 難0.17", "s": 0.848, "f": 0}, {"x": 0.987, "y": 0.192, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2640 cos0.99 難0.19", "s": 0.708, "f": 0}, {"x": 0.982, "y": 0.53, "c": "近傍", "n": "GHOST [A]  n=2246 cos0.98 難0.53", "s": 0.602, "f": 0}, {"x": 0.984, "y": 0.263, "c": "近傍", "n": "I Love You [A]  n=3131 cos0.98 難0.26", "s": 0.84, "f": 0}, {"x": 0.985, "y": 0.724, "c": "近傍", "n": "Parvati [A]  n=2633 cos0.98 難0.72", "s": 0.706, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.20639347189664026}, {"a": 0, "b": 2, "w": 0.25848091751802504}, {"a": 0, "b": 3, "w": 0.1135340853870187}, {"a": 0, "b": 4, "w": 0.1810953818992379}, {"a": 0, "b": 5, "w": 0.06451884135195396}, {"a": 0, "b": 6, "w": 0.2026134649092185}, {"a": 0, "b": 7, "w": 0.24948945859024996}, {"a": 0, "b": 8, "w": 0.28928821452803755}, {"a": 0, "b": 9, "w": 0.12106564900629113}, {"a": 0, "b": 10, "w": 0.1575376139860044}, {"a": 0, "b": 11, "w": 0.08479484833455209}, {"a": 0, "b": 12, "w": 0.018771919493905997}, {"a": 0, "b": 13, "w": 4.131350817004886e-11}, {"a": 0, "b": 14, "w": 0.0320071043539919}, {"a": 0, "b": 15, "w": 0.3178897216127029}, {"a": 0, "b": 16, "w": 0.19822107686584434}, {"a": 0, "b": 17, "w": 0.1712945310472307}, {"a": 0, "b": 18, "w": 0.016698380064093965}, {"a": 0, "b": 19, "w": 0.09470760023077363}, {"a": 0, "b": 20, "w": 0.06550422003778877}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=0.080,hiY=0.771;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
