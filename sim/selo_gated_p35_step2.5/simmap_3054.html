<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Innocent Walls [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.997, "c": "種", "n": "Innocent Walls [H]  n=3660 cos1.00 難1.00", "s": 1.0, "f": 0}, {"x": 0.996, "y": 1.139, "c": "近傍", "n": "Innocent Walls [A]  n=3541 cos1.00 難1.14", "s": 0.967, "f": 0}, {"x": 0.962, "y": 1.128, "c": "近傍", "n": "PLEASE DON'T GO [A]  n=3222 cos0.96 難1.13", "s": 0.88, "f": 0}, {"x": 0.949, "y": 0.899, "c": "近傍", "n": "one or eight [A]  n=3564 cos0.95 難0.90", "s": 0.974, "f": 0}, {"x": 0.951, "y": 0.695, "c": "近傍", "n": "Spica [A]  n=3302 cos0.95 難0.69", "s": 0.902, "f": 0}, {"x": 0.946, "y": 0.751, "c": "近傍", "n": "MENTAL MELTDOWN [A]  n=3299 cos0.95 難0.75", "s": 0.901, "f": 0}, {"x": 0.947, "y": 1.321, "c": "近傍", "n": "IMPLANTATION [A]  n=3251 cos0.95 難1.32", "s": 0.888, "f": 0}, {"x": 0.956, "y": 0.346, "c": "近傍", "n": "100％ minimoo-G [A]  n=3216 cos0.96 難0.35", "s": 0.879, "f": 0}, {"x": 0.951, "y": 0.318, "c": "近傍", "n": "RISLIM -Remix- [A]  n=3213 cos0.95 難0.32", "s": 0.878, "f": 0}, {"x": 0.937, "y": 0.616, "c": "近傍", "n": "DXY! [A]  n=3261 cos0.94 難0.62", "s": 0.891, "f": 0}, {"x": 0.944, "y": 0.312, "c": "近傍", "n": "ZEИITH [A]  n=2010 cos0.94 難0.31", "s": 0.549, "f": 0}, {"x": 0.938, "y": 1.632, "c": "近傍", "n": "reunion [A]  n=3389 cos0.94 難1.63", "s": 0.926, "f": 0}, {"x": 0.928, "y": 1.253, "c": "近傍", "n": "ICARUS [A]  n=3574 cos0.93 難1.25", "s": 0.977, "f": 0}, {"x": 0.926, "y": 0.589, "c": "近傍", "n": "旅人リラン [A]  n=3549 cos0.93 難0.59", "s": 0.97, "f": 0}, {"x": 0.934, "y": 0.278, "c": "近傍", "n": "neogenesis [L]  n=1514 cos0.93 難0.28", "s": 0.414, "f": 0}, {"x": 0.923, "y": 0.638, "c": "近傍", "n": "nostos [A]  n=3080 cos0.92 難0.64", "s": 0.842, "f": 0}, {"x": 0.921, "y": 1.228, "c": "近傍", "n": "Sense 2007 [A]  n=3338 cos0.92 難1.23", "s": 0.912, "f": 0}, {"x": 0.941, "y": 0.1, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2689 cos0.94 難0.10", "s": 0.735, "f": 0}, {"x": 0.922, "y": 1.268, "c": "近傍", "n": "Push on Beats!～音ゲの国のeX-ストリーマー～ [A]  n=2150 cos0.92 難1.27", "s": 0.587, "f": 0}, {"x": 0.944, "y": 1.956, "c": "近傍", "n": "GiGaGaHell [A]  n=2176 cos0.94 難1.96", "s": 0.595, "f": 0}, {"x": 0.931, "y": 1.73, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [A]  n=3243 cos0.93 難1.73", "s": 0.886, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.7976826777702964}, {"a": 0, "b": 2, "w": 0.18373648838924206}, {"a": 0, "b": 3, "w": 0.20693145689674874}, {"a": 0, "b": 4, "w": 0.13476325234480846}, {"a": 0, "b": 5, "w": 0.24992012188302293}, {"a": 0, "b": 6, "w": 0.13492965866337814}, {"a": 0, "b": 7, "w": 0.04440854123313798}, {"a": 0, "b": 8, "w": 0.004400741840121847}, {"a": 0, "b": 9, "w": 0.03742941857246962}, {"a": 0, "b": 10, "w": 0.23802985567194923}, {"a": 0, "b": 11, "w": 0.19804649340674507}, {"a": 0, "b": 12, "w": 0.13774465901196686}, {"a": 0, "b": 13, "w": 0.07487249094592074}, {"a": 0, "b": 14, "w": 0.02518278711454902}, {"a": 0, "b": 15, "w": 0.03021997704582069}, {"a": 0, "b": 16, "w": 0.09410124546780108}, {"a": 0, "b": 17, "w": 1.4259815550587973e-11}, {"a": 0, "b": 18, "w": 0.10162389059268861}, {"a": 0, "b": 19, "w": 0.21986002161338913}, {"a": 0, "b": 20, "w": 0.1521939701009588}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.915,hiX=1.006,loY=-0.049,hiY=2.104;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
