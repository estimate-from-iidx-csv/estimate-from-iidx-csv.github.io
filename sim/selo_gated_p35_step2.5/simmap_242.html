<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BIGソムタム [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.147, "c": "種", "n": "BIGソムタム [H]  n=1909 cos1.00 難-1.15", "s": 0.831, "f": 0}, {"x": 0.994, "y": -1.221, "c": "近傍", "n": "水鏡の異界 [H]  n=1253 cos0.99 難-1.22", "s": 0.545, "f": 0}, {"x": 0.99, "y": -1.152, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.99 難-1.15", "s": 0.752, "f": 0}, {"x": 0.99, "y": -1.095, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.99 難-1.09", "s": 0.848, "f": 0}, {"x": 0.987, "y": -1.142, "c": "近傍", "n": "TRIUMPH [H]  n=1661 cos0.99 難-1.14", "s": 0.723, "f": 0}, {"x": 0.987, "y": -1.152, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1841 cos0.99 難-1.15", "s": 0.801, "f": 0}, {"x": 0.987, "y": -1.124, "c": "近傍", "n": "Night sky [H]  n=2107 cos0.99 難-1.12", "s": 0.917, "f": 0}, {"x": 0.988, "y": -1.233, "c": "近傍", "n": "Always We Trust In You [H]  n=505 cos0.99 難-1.23", "s": 0.22, "f": 0}, {"x": 0.991, "y": -1.326, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1478 cos0.99 難-1.33", "s": 0.643, "f": 0}, {"x": 0.986, "y": -1.223, "c": "近傍", "n": "Outbreak [H]  n=1560 cos0.99 難-1.22", "s": 0.679, "f": 0}, {"x": 0.987, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos0.99 難-1.01", "s": 0.821, "f": 0}, {"x": 0.989, "y": -1.323, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.32", "s": 0.603, "f": 0}, {"x": 0.986, "y": -1.283, "c": "近傍", "n": "27th style [H]  n=1336 cos0.99 難-1.28", "s": 0.582, "f": 0}, {"x": 0.985, "y": -1.274, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1217 cos0.99 難-1.27", "s": 0.53, "f": 0}, {"x": 0.993, "y": -1.391, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1530 cos0.99 難-1.39", "s": 0.666, "f": 0}, {"x": 0.982, "y": -1.134, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=722 cos0.98 難-1.13", "s": 0.314, "f": 0}, {"x": 0.983, "y": -1.227, "c": "近傍", "n": "花冠 feat.Aikapin [H]  n=1111 cos0.98 難-1.23", "s": 0.484, "f": 0}, {"x": 0.982, "y": -1.229, "c": "近傍", "n": "Carry Me Away [H]  n=1403 cos0.98 難-1.23", "s": 0.611, "f": 0}, {"x": 0.981, "y": -1.17, "c": "近傍", "n": "BIGWAVERS [H]  n=767 cos0.98 難-1.17", "s": 0.334, "f": 0}, {"x": 0.993, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.99 難-0.89", "s": 1.0, "f": 0}, {"x": 0.982, "y": -1.052, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.98 難-1.05", "s": 0.446, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44230827482850044}, {"a": 0, "b": 2, "w": 0.2995677991818938}, {"a": 0, "b": 3, "w": 0.2891476789082984}, {"a": 0, "b": 4, "w": 0.10760720539653212}, {"a": 0, "b": 5, "w": 0.200791118268971}, {"a": 0, "b": 6, "w": 0.1758222446090445}, {"a": 0, "b": 7, "w": 0.21438632744482733}, {"a": 0, "b": 8, "w": 0.3571940183822847}, {"a": 0, "b": 9, "w": 0.05103796982743258}, {"a": 0, "b": 10, "w": 0.2185248154892554}, {"a": 0, "b": 11, "w": 0.2438606363174658}, {"a": 0, "b": 12, "w": 0.17525629975527002}, {"a": 0, "b": 13, "w": 0.11227109034245242}, {"a": 0, "b": 14, "w": 0.3831580885745439}, {"a": 0, "b": 15, "w": 0.021934986680185897}, {"a": 0, "b": 16, "w": 5.133804492629679e-11}, {"a": 0, "b": 17, "w": 0.02757296513108798}, {"a": 0, "b": 18, "w": 0.009144887535130763}, {"a": 0, "b": 19, "w": 0.16446131240352757}, {"a": 0, "b": 20, "w": 0.046523137908875856}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.431,hiY=-0.846;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
