<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Plea Per Phase [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.064, "c": "種", "n": "Plea Per Phase [A]  n=1029 cos1.00 難0.06", "s": 0.279, "f": 0}, {"x": 0.998, "y": 0.045, "c": "近傍", "n": "ミッドナイト堕天使 [A]  n=3398 cos1.00 難0.05", "s": 0.923, "f": 0}, {"x": 0.997, "y": 0.12, "c": "近傍", "n": "Synergy For Angels [A]  n=3487 cos1.00 難0.12", "s": 0.947, "f": 0}, {"x": 0.998, "y": -0.009, "c": "近傍", "n": "DEEP ROAR [A]  n=1658 cos1.00 難-0.01", "s": 0.45, "f": 0}, {"x": 0.997, "y": 0.097, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos1.00 難0.10", "s": 0.479, "f": 0}, {"x": 0.997, "y": 0.03, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos1.00 難0.03", "s": 0.965, "f": 0}, {"x": 0.997, "y": 0.029, "c": "近傍", "n": "PAPAYAPA BASS [A]  n=3510 cos1.00 難0.03", "s": 0.953, "f": 0}, {"x": 0.997, "y": 0.107, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos1.00 難0.11", "s": 0.494, "f": 0}, {"x": 0.999, "y": -0.061, "c": "近傍", "n": "Nothing but Theory [A]  n=3626 cos1.00 難-0.06", "s": 0.985, "f": 0}, {"x": 0.997, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos1.00 難0.15", "s": 0.521, "f": 0}, {"x": 0.998, "y": 0.178, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1132 cos1.00 難0.18", "s": 0.307, "f": 0}, {"x": 0.996, "y": 0.03, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3170 cos1.00 難0.03", "s": 0.861, "f": 0}, {"x": 0.997, "y": 0.161, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.16", "s": 0.763, "f": 0}, {"x": 0.998, "y": 0.187, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.19", "s": 0.444, "f": 0}, {"x": 0.996, "y": 0.16, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos1.00 難0.16", "s": 0.957, "f": 0}, {"x": 0.997, "y": 0.188, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3422 cos1.00 難0.19", "s": 0.929, "f": 0}, {"x": 0.996, "y": 0.147, "c": "近傍", "n": "xenon [A]  n=3549 cos1.00 難0.15", "s": 0.964, "f": 0}, {"x": 0.996, "y": -0.024, "c": "近傍", "n": "仮想空間の旅人たち [A]  n=3683 cos1.00 難-0.02", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.013, "c": "近傍", "n": "朧 [L]  n=3664 cos1.00 難0.01", "s": 0.995, "f": 0}, {"x": 0.996, "y": -0.027, "c": "近傍", "n": "アイドル [L]  n=1439 cos1.00 難-0.03", "s": 0.391, "f": 0}, {"x": 0.996, "y": 0.134, "c": "近傍", "n": "winkle 2 winkle [A]  n=1672 cos1.00 難0.13", "s": 0.454, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5079402978438095}, {"a": 0, "b": 2, "w": 0.4828539695585371}, {"a": 0, "b": 3, "w": 0.45411246543424977}, {"a": 0, "b": 4, "w": 0.26606245039810295}, {"a": 0, "b": 5, "w": 0.4248399789313664}, {"a": 0, "b": 6, "w": 0.41120429975514583}, {"a": 0, "b": 7, "w": 0.31910404820831384}, {"a": 0, "b": 8, "w": 0.6319573881079432}, {"a": 0, "b": 9, "w": 0.35974778495376947}, {"a": 0, "b": 10, "w": 0.4125364207303778}, {"a": 0, "b": 11, "w": 0.35639961273428455}, {"a": 0, "b": 12, "w": 0.3812322495105842}, {"a": 0, "b": 13, "w": 0.4166158263977433}, {"a": 0, "b": 14, "w": 0.37748078633468596}, {"a": 0, "b": 15, "w": 0.382088917450782}, {"a": 0, "b": 16, "w": 0.3422666662037497}, {"a": 0, "b": 17, "w": 0.3182570285047003}, {"a": 0, "b": 18, "w": 0.24872031274805206}, {"a": 0, "b": 19, "w": 6.208256131401413e-11}, {"a": 0, "b": 20, "w": 0.29623566640473087}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.995,hiX=1.000,loY=-0.081,hiY=0.208;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
