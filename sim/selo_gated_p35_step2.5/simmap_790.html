<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Break Stasis [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.101, "c": "種", "n": "Break Stasis [A]  n=3094 cos1.00 難-0.10", "s": 0.842, "f": 0}, {"x": 0.997, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos1.00 難-0.16", "s": 0.856, "f": 0}, {"x": 0.997, "y": -0.03, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos1.00 難-0.03", "s": 0.815, "f": 0}, {"x": 0.996, "y": -0.144, "c": "近傍", "n": "3y3s [H]  n=3676 cos1.00 難-0.14", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.188, "c": "近傍", "n": "REMINISCENCE [A]  n=2784 cos1.00 難-0.19", "s": 0.757, "f": 0}, {"x": 0.996, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos1.00 難-0.02", "s": 0.81, "f": 0}, {"x": 0.995, "y": -0.119, "c": "近傍", "n": "Shirdal [A]  n=695 cos1.00 難-0.12", "s": 0.189, "f": 0}, {"x": 0.996, "y": -0.196, "c": "近傍", "n": "beatAffection [A]  n=2812 cos1.00 難-0.20", "s": 0.765, "f": 0}, {"x": 0.995, "y": -0.114, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難-0.11", "s": 0.985, "f": 0}, {"x": 0.995, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos1.00 難-0.04", "s": 0.646, "f": 0}, {"x": 0.995, "y": -0.164, "c": "近傍", "n": "Abyss -The Heavens Remix- [A]  n=3140 cos1.00 難-0.16", "s": 0.854, "f": 0}, {"x": 0.997, "y": -0.26, "c": "近傍", "n": "The Wind of China Express(The 4th Mashup) [A]  n=2549 cos1.00 難-0.26", "s": 0.693, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "Τeλοs [A]  n=606 cos1.00 難-0.19", "s": 0.165, "f": 0}, {"x": 0.995, "y": -0.072, "c": "近傍", "n": "断罪の一花 [A]  n=1496 cos0.99 難-0.07", "s": 0.407, "f": 0}, {"x": 0.994, "y": -0.103, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難-0.10", "s": 0.313, "f": 0}, {"x": 0.995, "y": -0.229, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3183 cos1.00 難-0.23", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.212, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos0.99 難-0.21", "s": 0.845, "f": 0}, {"x": 0.996, "y": -0.277, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2409 cos1.00 難-0.28", "s": 0.655, "f": 0}, {"x": 0.994, "y": -0.191, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [A]  n=3192 cos0.99 難-0.19", "s": 0.868, "f": 0}, {"x": 0.998, "y": -0.308, "c": "近傍", "n": "メテオラ-meteor- [A]  n=575 cos1.00 難-0.31", "s": 0.156, "f": 0}, {"x": 0.995, "y": -0.258, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2576 cos1.00 難-0.26", "s": 0.701, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4147414623797492}, {"a": 0, "b": 2, "w": 0.35258659120483005}, {"a": 0, "b": 3, "w": 7.420797309976024e-11}, {"a": 0, "b": 4, "w": 0.20902745848234627}, {"a": 0, "b": 5, "w": 0.15625305826937486}, {"a": 0, "b": 6, "w": 0.22195937274535738}, {"a": 0, "b": 7, "w": 0.2790553836062516}, {"a": 0, "b": 8, "w": 0.07321726087013203}, {"a": 0, "b": 9, "w": 0.20578637711320147}, {"a": 0, "b": 10, "w": 0.21332281660683228}, {"a": 0, "b": 11, "w": 0.2215206293675881}, {"a": 0, "b": 12, "w": 0.0763271746470755}, {"a": 0, "b": 13, "w": 0.06564320738047413}, {"a": 0, "b": 14, "w": 0.04267177971975544}, {"a": 0, "b": 15, "w": 0.15662468290315967}, {"a": 0, "b": 16, "w": 0.15260402707775833}, {"a": 0, "b": 17, "w": 0.32912213023086734}, {"a": 0, "b": 18, "w": 0.09618041650477771}, {"a": 0, "b": 19, "w": 0.4360608617367612}, {"a": 0, "b": 20, "w": 0.18249876899118622}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.331,hiY=-0.002;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
