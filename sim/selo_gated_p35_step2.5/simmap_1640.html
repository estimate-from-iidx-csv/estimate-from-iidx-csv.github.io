<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">残像ニ繋ガレタ追憶ノHIDEAWAY [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.336, "c": "種", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=811 cos1.00 難-1.34", "s": 0.469, "f": 0}, {"x": 0.998, "y": -1.313, "c": "近傍", "n": "CoMAAAAAAA [H]  n=1228 cos1.00 難-1.31", "s": 0.71, "f": 0}, {"x": 0.993, "y": -1.33, "c": "近傍", "n": "夢縁 [H]  n=1042 cos0.99 難-1.33", "s": 0.603, "f": 0}, {"x": 0.993, "y": -1.255, "c": "近傍", "n": "#CMFLG [H]  n=891 cos0.99 難-1.26", "s": 0.515, "f": 0}, {"x": 0.993, "y": -1.231, "c": "近傍", "n": "Begin [H]  n=613 cos0.99 難-1.23", "s": 0.355, "f": 0}, {"x": 0.991, "y": -1.282, "c": "近傍", "n": "Necroxis Girl [H]  n=936 cos0.99 難-1.28", "s": 0.541, "f": 0}, {"x": 0.997, "y": -1.184, "c": "近傍", "n": "Stereo Beasts [H]  n=698 cos1.00 難-1.18", "s": 0.404, "f": 0}, {"x": 0.99, "y": -1.379, "c": "近傍", "n": "Battleground [H]  n=1215 cos0.99 難-1.38", "s": 0.703, "f": 0}, {"x": 0.99, "y": -1.243, "c": "近傍", "n": "ACT0 [H]  n=762 cos0.99 難-1.24", "s": 0.441, "f": 0}, {"x": 0.995, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.15", "s": 0.369, "f": 0}, {"x": 0.995, "y": -1.141, "c": "近傍", "n": "〆 [H]  n=1729 cos1.00 難-1.14", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.252, "c": "近傍", "n": "Around The Galaxy [H]  n=1246 cos0.99 難-1.25", "s": 0.721, "f": 0}, {"x": 0.991, "y": -1.174, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos0.99 難-1.17", "s": 0.405, "f": 0}, {"x": 0.992, "y": -1.151, "c": "近傍", "n": "innocent revolver [H]  n=1332 cos0.99 難-1.15", "s": 0.77, "f": 0}, {"x": 0.992, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.13", "s": 0.774, "f": 0}, {"x": 0.992, "y": -1.131, "c": "近傍", "n": "frequent [H]  n=1106 cos0.99 難-1.13", "s": 0.64, "f": 0}, {"x": 0.99, "y": -1.154, "c": "近傍", "n": "Regina vespaE [H]  n=652 cos0.99 難-1.15", "s": 0.377, "f": 0}, {"x": 0.988, "y": -1.205, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1670 cos0.99 難-1.21", "s": 0.966, "f": 0}, {"x": 0.986, "y": -1.403, "c": "近傍", "n": "Like+it! [H]  n=1124 cos0.99 難-1.40", "s": 0.65, "f": 0}, {"x": 0.993, "y": -1.115, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos0.99 難-1.11", "s": 0.5, "f": 0}, {"x": 0.99, "y": -1.528, "c": "近傍", "n": "Exhaust Hype [H]  n=1307 cos0.99 難-1.53", "s": 0.756, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6395884415501453}, {"a": 0, "b": 2, "w": 0.41549691077868167}, {"a": 0, "b": 3, "w": 0.43198888651585843}, {"a": 0, "b": 4, "w": 0.43415057478629615}, {"a": 0, "b": 5, "w": 0.36261809450715876}, {"a": 0, "b": 6, "w": 0.5015092924418971}, {"a": 0, "b": 7, "w": 0.32894412889028146}, {"a": 0, "b": 8, "w": 0.18226051476590688}, {"a": 0, "b": 9, "w": 0.4218137991090144}, {"a": 0, "b": 10, "w": 0.48886632251985496}, {"a": 0, "b": 11, "w": 0.14375235107813178}, {"a": 0, "b": 12, "w": 0.341831832076648}, {"a": 0, "b": 13, "w": 0.3359673509443234}, {"a": 0, "b": 14, "w": 0.1769611294844754}, {"a": 0, "b": 15, "w": 0.3801204134322803}, {"a": 0, "b": 16, "w": 4.802724884456211e-11}, {"a": 0, "b": 17, "w": 0.22866865688455185}, {"a": 0, "b": 18, "w": 0.1965867445255295}, {"a": 0, "b": 19, "w": 0.1756000138768199}, {"a": 0, "b": 20, "w": 0.24297597572845675}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.561,hiY=-1.082;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
