<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">WAKE UP NOW [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.254, "c": "種", "n": "WAKE UP NOW [L]  n=602 cos1.00 難-0.25", "s": 0.161, "f": 0}, {"x": 0.994, "y": -0.254, "c": "近傍", "n": "霧幻メモリア [A]  n=2432 cos0.99 難-0.25", "s": 0.651, "f": 0}, {"x": 0.993, "y": -0.254, "c": "近傍", "n": "Rainstorm [A]  n=2798 cos0.99 難-0.25", "s": 0.75, "f": 0}, {"x": 0.993, "y": -0.158, "c": "近傍", "n": "HAT TRICK [A]  n=3216 cos0.99 難-0.16", "s": 0.862, "f": 0}, {"x": 0.991, "y": -0.245, "c": "近傍", "n": "Daisuke [A]  n=3733 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.151, "c": "近傍", "n": "Amor De Verao [A]  n=3614 cos0.99 難-0.15", "s": 0.968, "f": 0}, {"x": 0.99, "y": -0.164, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2950 cos0.99 難-0.16", "s": 0.79, "f": 0}, {"x": 0.99, "y": -0.34, "c": "近傍", "n": "Summerblue [A]  n=2192 cos0.99 難-0.34", "s": 0.587, "f": 0}, {"x": 0.99, "y": -0.193, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2956 cos0.99 難-0.19", "s": 0.792, "f": 0}, {"x": 0.991, "y": -0.028, "c": "近傍", "n": "Love Is Eternity [A]  n=3531 cos0.99 難-0.03", "s": 0.946, "f": 0}, {"x": 0.989, "y": -0.282, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos0.99 難-0.28", "s": 0.628, "f": 0}, {"x": 0.989, "y": -0.215, "c": "近傍", "n": "Queen's Tragedy [A]  n=3243 cos0.99 難-0.22", "s": 0.869, "f": 0}, {"x": 0.991, "y": -0.028, "c": "近傍", "n": "Don't be afraid myself [A]  n=2812 cos0.99 難-0.03", "s": 0.753, "f": 0}, {"x": 0.99, "y": -0.462, "c": "近傍", "n": "BLUST OF WIND [A]  n=3379 cos0.99 難-0.46", "s": 0.905, "f": 0}, {"x": 0.989, "y": -0.198, "c": "近傍", "n": "グラナダの風 [A]  n=2831 cos0.99 難-0.20", "s": 0.758, "f": 0}, {"x": 0.989, "y": -0.328, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos0.99 難-0.33", "s": 0.555, "f": 0}, {"x": 0.989, "y": -0.325, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos0.99 難-0.32", "s": 0.636, "f": 0}, {"x": 0.989, "y": -0.106, "c": "近傍", "n": "ANDROMEDA II [A]  n=3026 cos0.99 難-0.11", "s": 0.811, "f": 0}, {"x": 0.989, "y": -0.092, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2697 cos0.99 難-0.09", "s": 0.722, "f": 0}, {"x": 0.995, "y": 0.212, "c": "近傍", "n": "Perfect Plan [A]  n=2100 cos1.00 難0.21", "s": 0.563, "f": 0}, {"x": 0.988, "y": -0.178, "c": "近傍", "n": "Lucky Days [A]  n=2965 cos0.99 難-0.18", "s": 0.794, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4512437726975892}, {"a": 0, "b": 2, "w": 0.2367591771411336}, {"a": 0, "b": 3, "w": 0.45411862252130364}, {"a": 0, "b": 4, "w": 0.34969716572817633}, {"a": 0, "b": 5, "w": 0.3844135191984397}, {"a": 0, "b": 6, "w": 0.32513417169249903}, {"a": 0, "b": 7, "w": 0.22066173388877297}, {"a": 0, "b": 8, "w": 0.25627777769451454}, {"a": 0, "b": 9, "w": 0.15389010497441236}, {"a": 0, "b": 10, "w": 0.13871119289793754}, {"a": 0, "b": 11, "w": 0.19657698118519873}, {"a": 0, "b": 12, "w": 0.37883455211674444}, {"a": 0, "b": 13, "w": 0.12747559474336378}, {"a": 0, "b": 14, "w": 0.09897234739046379}, {"a": 0, "b": 15, "w": 3.9105718663279276e-11}, {"a": 0, "b": 16, "w": 0.20333225223102835}, {"a": 0, "b": 17, "w": 0.2797720927000389}, {"a": 0, "b": 18, "w": 0.13192220648235153}, {"a": 0, "b": 19, "w": 0.5080615739495558}, {"a": 0, "b": 20, "w": 0.22913842463937184}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.516,hiY=0.266;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
