<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DIAMOND CROSSING [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.409, "c": "種", "n": "DIAMOND CROSSING [H]  n=3069 cos1.00 難-0.41", "s": 0.814, "f": 0}, {"x": 0.986, "y": -0.446, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2752 cos0.99 難-0.45", "s": 0.73, "f": 0}, {"x": 0.987, "y": -0.254, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.99 難-0.25", "s": 0.33, "f": 0}, {"x": 0.983, "y": -0.422, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.98 難-0.42", "s": 0.249, "f": 0}, {"x": 0.994, "y": -0.816, "c": "近傍", "n": "栄冠のカンパネラ [H]  n=1245 cos0.99 難-0.82", "s": 0.33, "f": 0}, {"x": 0.981, "y": -0.312, "c": "近傍", "n": "Golden Palms [A]  n=3230 cos0.98 難-0.31", "s": 0.857, "f": 0}, {"x": 0.978, "y": -0.402, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2947 cos0.98 難-0.40", "s": 0.782, "f": 0}, {"x": 0.978, "y": -0.538, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3117 cos0.98 難-0.54", "s": 0.827, "f": 0}, {"x": 0.978, "y": -0.55, "c": "近傍", "n": "真夏の花・真夏の夢 [A]  n=2783 cos0.98 難-0.55", "s": 0.738, "f": 0}, {"x": 0.978, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.98 難-0.24", "s": 0.667, "f": 0}, {"x": 0.976, "y": -0.265, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2165 cos0.98 難-0.27", "s": 0.574, "f": 0}, {"x": 0.99, "y": -0.922, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2823 cos0.99 難-0.92", "s": 0.749, "f": 0}, {"x": 0.986, "y": -0.906, "c": "近傍", "n": "EROICA [H]  n=2238 cos0.99 難-0.91", "s": 0.594, "f": 0}, {"x": 0.993, "y": 0.168, "c": "近傍", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2956 cos0.99 難0.17", "s": 0.784, "f": 0}, {"x": 0.979, "y": -0.822, "c": "近傍", "n": "Sakura Reflection [H]  n=3038 cos0.98 難-0.82", "s": 0.806, "f": 0}, {"x": 0.977, "y": -0.03, "c": "近傍", "n": "Elisha [A]  n=3769 cos0.98 難-0.03", "s": 1.0, "f": 0}, {"x": 0.978, "y": 0.023, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.98 難0.02", "s": 0.419, "f": 0}, {"x": 0.971, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.97 難-0.43", "s": 0.797, "f": 0}, {"x": 0.971, "y": -0.257, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.97 難-0.26", "s": 0.485, "f": 0}, {"x": 0.988, "y": -1.006, "c": "近傍", "n": "烽火連天の刃 [H]  n=1241 cos0.99 難-1.01", "s": 0.329, "f": 0}, {"x": 0.972, "y": -0.593, "c": "近傍", "n": "REcorrection [A]  n=689 cos0.97 難-0.59", "s": 0.183, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.15810802076528885}, {"a": 0, "b": 2, "w": 0.38265043368235585}, {"a": 0, "b": 3, "w": 0.18118939725798866}, {"a": 0, "b": 4, "w": 0.5829739222510506}, {"a": 0, "b": 5, "w": 0.26718022922663154}, {"a": 0, "b": 6, "w": 3.305800078123866e-11}, {"a": 0, "b": 7, "w": 0.16400268863808043}, {"a": 0, "b": 8, "w": 0.00840634274814267}, {"a": 0, "b": 9, "w": 0.23616256633082877}, {"a": 0, "b": 10, "w": 0.1689163061951643}, {"a": 0, "b": 11, "w": 0.3411914790966648}, {"a": 0, "b": 12, "w": 0.4031439457952689}, {"a": 0, "b": 13, "w": 0.5699042407344954}, {"a": 0, "b": 14, "w": 0.003993199098883626}, {"a": 0, "b": 15, "w": 0.215292288233758}, {"a": 0, "b": 16, "w": 0.2051654563899964}, {"a": 0, "b": 17, "w": 0.11759046200208634}, {"a": 0, "b": 18, "w": 0.14268069252930604}, {"a": 0, "b": 19, "w": 0.4345410456433302}, {"a": 0, "b": 20, "w": 0.034884516604162585}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.968,hiX=1.002,loY=-1.100,hiY=0.261;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
