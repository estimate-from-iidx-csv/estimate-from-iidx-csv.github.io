<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Devilz Sacrifice -贖罪の羊- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.255, "c": "種", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3252 cos1.00 難0.25", "s": 0.932, "f": 0}, {"x": 0.996, "y": 0.307, "c": "近傍", "n": "Cleopatrysm [A]  n=3255 cos1.00 難0.31", "s": 0.933, "f": 0}, {"x": 0.995, "y": 0.147, "c": "近傍", "n": "命の標本 [A]  n=3125 cos1.00 難0.15", "s": 0.896, "f": 0}, {"x": 0.993, "y": 0.333, "c": "近傍", "n": "in the Sky [A]  n=3438 cos0.99 難0.33", "s": 0.986, "f": 0}, {"x": 0.995, "y": 0.072, "c": "近傍", "n": "NANAIRO [A]  n=3065 cos1.00 難0.07", "s": 0.879, "f": 0}, {"x": 0.993, "y": 0.246, "c": "近傍", "n": "忍恋花 [A]  n=3299 cos0.99 難0.25", "s": 0.946, "f": 0}, {"x": 0.993, "y": 0.333, "c": "近傍", "n": "MAGIC & LOVE [A]  n=3382 cos0.99 難0.33", "s": 0.97, "f": 0}, {"x": 0.993, "y": 0.171, "c": "近傍", "n": "オールトの雲 [A]  n=2473 cos0.99 難0.17", "s": 0.709, "f": 0}, {"x": 0.992, "y": 0.264, "c": "近傍", "n": "squall [A]  n=1407 cos0.99 難0.26", "s": 0.403, "f": 0}, {"x": 0.994, "y": 0.082, "c": "近傍", "n": "ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A]  n=3488 cos0.99 難0.08", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.162, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos0.99 難0.16", "s": 0.987, "f": 0}, {"x": 0.993, "y": 0.131, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2937 cos0.99 難0.13", "s": 0.842, "f": 0}, {"x": 0.993, "y": 0.09, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1935 cos0.99 難0.09", "s": 0.555, "f": 0}, {"x": 0.994, "y": 0.447, "c": "近傍", "n": "chaos eater -IIDX edition- [A]  n=3161 cos0.99 難0.45", "s": 0.906, "f": 0}, {"x": 0.992, "y": 0.198, "c": "近傍", "n": "Valgus [A]  n=3344 cos0.99 難0.20", "s": 0.959, "f": 0}, {"x": 0.992, "y": 0.133, "c": "近傍", "n": "Blaze it UP! [A]  n=3476 cos0.99 難0.13", "s": 0.997, "f": 0}, {"x": 0.992, "y": 0.405, "c": "近傍", "n": "Garuda [A]  n=2808 cos0.99 難0.41", "s": 0.805, "f": 0}, {"x": 0.992, "y": 0.158, "c": "近傍", "n": "Be A Star [A]  n=3353 cos0.99 難0.16", "s": 0.961, "f": 0}, {"x": 0.991, "y": 0.184, "c": "近傍", "n": "Marie Antoinette [A]  n=1920 cos0.99 難0.18", "s": 0.55, "f": 0}, {"x": 0.992, "y": 0.388, "c": "近傍", "n": "smile [A]  n=3304 cos0.99 難0.39", "s": 0.947, "f": 0}, {"x": 0.995, "y": -0.03, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos1.00 難-0.03", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5399595549373066}, {"a": 0, "b": 2, "w": 0.4766498314919202}, {"a": 0, "b": 3, "w": 0.26314938921324305}, {"a": 0, "b": 4, "w": 0.46476659540399035}, {"a": 0, "b": 5, "w": 0.3888581699067324}, {"a": 0, "b": 6, "w": 4.580025247946651e-11}, {"a": 0, "b": 7, "w": 0.2494153351327788}, {"a": 0, "b": 8, "w": 0.37492176236206565}, {"a": 0, "b": 9, "w": 0.4379043460668406}, {"a": 0, "b": 10, "w": 0.34514624833122887}, {"a": 0, "b": 11, "w": 0.39153027134126117}, {"a": 0, "b": 12, "w": 0.3622399871510962}, {"a": 0, "b": 13, "w": 0.26331209045177395}, {"a": 0, "b": 14, "w": 0.2967424295221057}, {"a": 0, "b": 15, "w": 0.24492796348090173}, {"a": 0, "b": 16, "w": 0.23441911320722564}, {"a": 0, "b": 17, "w": 0.27977787631936324}, {"a": 0, "b": 18, "w": 0.33709696696824487}, {"a": 0, "b": 19, "w": 0.13621409452864708}, {"a": 0, "b": 20, "w": 0.40624836683011767}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.068,hiY=0.486;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
