<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">thunder HOUSE NATION Remix [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.491, "c": "種", "n": "thunder HOUSE NATION Remix [A]  n=1651 cos1.00 難-0.49", "s": 0.468, "f": 0}, {"x": 0.997, "y": -0.367, "c": "近傍", "n": "Secret Rouge [A]  n=1564 cos1.00 難-0.37", "s": 0.443, "f": 0}, {"x": 0.997, "y": -0.355, "c": "近傍", "n": "Dreaming Dream [A]  n=1434 cos1.00 難-0.36", "s": 0.406, "f": 0}, {"x": 0.996, "y": -0.349, "c": "近傍", "n": "Stepper [A]  n=1978 cos1.00 難-0.35", "s": 0.56, "f": 0}, {"x": 0.998, "y": -0.262, "c": "近傍", "n": "Get Wicked [A]  n=1311 cos1.00 難-0.26", "s": 0.371, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "Last Burning [A]  n=3170 cos1.00 難-0.25", "s": 0.898, "f": 0}, {"x": 0.994, "y": -0.346, "c": "近傍", "n": "ラブキラ☆スプラッシュ [A]  n=2337 cos0.99 難-0.35", "s": 0.662, "f": 0}, {"x": 0.992, "y": -0.474, "c": "近傍", "n": "キスキツネ [A]  n=1147 cos0.99 難-0.47", "s": 0.325, "f": 0}, {"x": 0.995, "y": -0.239, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3177 cos0.99 難-0.24", "s": 0.9, "f": 0}, {"x": 0.993, "y": -0.304, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos0.99 難-0.30", "s": 0.91, "f": 0}, {"x": 0.993, "y": -0.285, "c": "近傍", "n": "8bit Princess [A]  n=3429 cos0.99 難-0.28", "s": 0.972, "f": 0}, {"x": 0.992, "y": -0.483, "c": "近傍", "n": "きゅうくらりん [A]  n=1308 cos0.99 難-0.48", "s": 0.371, "f": 0}, {"x": 0.995, "y": -0.195, "c": "近傍", "n": "The Sky of Sadness [A]  n=2249 cos1.00 難-0.20", "s": 0.637, "f": 0}, {"x": 0.993, "y": -0.282, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos0.99 難-0.28", "s": 0.664, "f": 0}, {"x": 0.996, "y": -0.174, "c": "近傍", "n": "LUV CAN SAVE U [L]  n=2988 cos1.00 難-0.17", "s": 0.847, "f": 0}, {"x": 0.993, "y": -0.248, "c": "近傍", "n": "LESSON 5 [A]  n=2304 cos0.99 難-0.25", "s": 0.653, "f": 0}, {"x": 0.992, "y": -0.344, "c": "近傍", "n": "Follow Tomorrow [A]  n=3529 cos0.99 難-0.34", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.184, "c": "近傍", "n": "OOO [L]  n=863 cos0.99 難-0.18", "s": 0.245, "f": 0}, {"x": 0.991, "y": -0.479, "c": "近傍", "n": "サヨナラ・ヘヴン-Celtic Chip Dance Mix- [A]  n=1221 cos0.99 難-0.48", "s": 0.346, "f": 0}, {"x": 0.991, "y": -0.498, "c": "近傍", "n": "神様、つれない。 [A]  n=1325 cos0.99 難-0.50", "s": 0.375, "f": 0}, {"x": 0.991, "y": -0.426, "c": "近傍", "n": "陽炎 [A]  n=2850 cos0.99 難-0.43", "s": 0.808, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5204566021791455}, {"a": 0, "b": 2, "w": 0.485946899897705}, {"a": 0, "b": 3, "w": 0.29677042267904674}, {"a": 0, "b": 4, "w": 0.5768498998915474}, {"a": 0, "b": 5, "w": 0.3077290212723657}, {"a": 0, "b": 6, "w": 0.30156360443321684}, {"a": 0, "b": 7, "w": 0.23351921600941272}, {"a": 0, "b": 8, "w": 0.34379228097755266}, {"a": 0, "b": 9, "w": 0.26713434325178553}, {"a": 0, "b": 10, "w": 0.2537480220079644}, {"a": 0, "b": 11, "w": 0.017453285006223118}, {"a": 0, "b": 12, "w": 0.34435092308550985}, {"a": 0, "b": 13, "w": 0.1781450636144548}, {"a": 0, "b": 14, "w": 0.13880727417767946}, {"a": 0, "b": 15, "w": 0.24619774258324378}, {"a": 0, "b": 16, "w": 0.20336310147547054}, {"a": 0, "b": 17, "w": 0.16390602712117985}, {"a": 0, "b": 18, "w": 5.931932722802458e-11}, {"a": 0, "b": 19, "w": 0.024564191980667838}, {"a": 0, "b": 20, "w": 0.1088944660519332}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.523,hiY=-0.148;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
