<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">One for All [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.213, "c": "種", "n": "One for All [H]  n=957 cos1.00 難-1.21", "s": 0.42, "f": 0}, {"x": 0.99, "y": -1.233, "c": "近傍", "n": "Always We Trust In You [H]  n=505 cos0.99 難-1.23", "s": 0.222, "f": 0}, {"x": 0.991, "y": -1.086, "c": "近傍", "n": "Beat Juggling Mix [H]  n=1503 cos0.99 難-1.09", "s": 0.66, "f": 0}, {"x": 0.989, "y": -1.323, "c": "近傍", "n": "AO-∞ [H]  n=1386 cos0.99 難-1.32", "s": 0.608, "f": 0}, {"x": 0.989, "y": -1.014, "c": "近傍", "n": "雪上断火 [H]  n=1286 cos0.99 難-1.01", "s": 0.565, "f": 0}, {"x": 0.984, "y": -1.152, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.98 難-1.15", "s": 0.759, "f": 0}, {"x": 0.983, "y": -1.116, "c": "近傍", "n": "SCREW // owo // SCREW [H]  n=1631 cos0.98 難-1.12", "s": 0.716, "f": 0}, {"x": 0.986, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos0.99 難-1.01", "s": 0.828, "f": 0}, {"x": 0.985, "y": -1.016, "c": "近傍", "n": "1116 [H]  n=662 cos0.98 難-1.02", "s": 0.291, "f": 0}, {"x": 0.981, "y": -1.227, "c": "近傍", "n": "花冠 feat.Aikapin [H]  n=1111 cos0.98 難-1.23", "s": 0.488, "f": 0}, {"x": 0.987, "y": -0.956, "c": "近傍", "n": "New Lights [H]  n=1942 cos0.99 難-0.96", "s": 0.853, "f": 0}, {"x": 0.992, "y": -1.549, "c": "近傍", "n": "C-C-C-N-N-N [H]  n=731 cos0.99 難-1.55", "s": 0.321, "f": 0}, {"x": 0.983, "y": -1.014, "c": "近傍", "n": "Super Rush [H]  n=2278 cos0.98 難-1.01", "s": 1.0, "f": 0}, {"x": 0.981, "y": -1.052, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.98 難-1.05", "s": 0.45, "f": 0}, {"x": 0.979, "y": -1.104, "c": "近傍", "n": "MAXIMUM CHEAT GIRL [H]  n=845 cos0.98 難-1.10", "s": 0.371, "f": 0}, {"x": 0.979, "y": -1.147, "c": "近傍", "n": "BIGソムタム [H]  n=1909 cos0.98 難-1.15", "s": 0.838, "f": 0}, {"x": 0.979, "y": -1.095, "c": "近傍", "n": "東京神話 [H]  n=1949 cos0.98 難-1.09", "s": 0.856, "f": 0}, {"x": 0.978, "y": -1.282, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1611 cos0.98 難-1.28", "s": 0.707, "f": 0}, {"x": 0.978, "y": -1.152, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1841 cos0.98 難-1.15", "s": 0.808, "f": 0}, {"x": 0.978, "y": -1.326, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1478 cos0.98 難-1.33", "s": 0.649, "f": 0}, {"x": 0.977, "y": -1.299, "c": "近傍", "n": "2 Be Continued [H]  n=568 cos0.98 難-1.30", "s": 0.249, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39180208619063517}, {"a": 0, "b": 2, "w": 0.3482517514510497}, {"a": 0, "b": 3, "w": 0.27038341684614986}, {"a": 0, "b": 4, "w": 0.35998007473895977}, {"a": 0, "b": 5, "w": 0.18620515642678426}, {"a": 0, "b": 6, "w": 0.13424347941799863}, {"a": 0, "b": 7, "w": 0.2292554220628905}, {"a": 0, "b": 8, "w": 0.23739756371200005}, {"a": 0, "b": 9, "w": 4.285438670592612e-11}, {"a": 0, "b": 10, "w": 0.24222246911226775}, {"a": 0, "b": 11, "w": 0.4277486383229967}, {"a": 0, "b": 12, "w": 0.1426313774079403}, {"a": 0, "b": 13, "w": 0.0665596981381581}, {"a": 0, "b": 14, "w": 0.13194827323810288}, {"a": 0, "b": 15, "w": 0.10708925836385574}, {"a": 0, "b": 16, "w": 0.08855268317872678}, {"a": 0, "b": 17, "w": 0.0005046129976203906}, {"a": 0, "b": 18, "w": 0.08693227741722065}, {"a": 0, "b": 19, "w": 0.08373371938462637}, {"a": 0, "b": 20, "w": 0.07534294141255415}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-1.596,hiY=-0.908;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
