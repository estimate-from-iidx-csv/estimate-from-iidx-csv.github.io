<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">もっと！モット！ときめき feat. 松下 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.576, "c": "種", "n": "もっと！モット！ときめき feat. 松下 [A]  n=3260 cos1.00 難0.58", "s": 0.887, "f": 0}, {"x": 0.985, "y": 0.476, "c": "近傍", "n": "In the Blackest Den [A]  n=3294 cos0.99 難0.48", "s": 0.896, "f": 0}, {"x": 0.988, "y": 0.37, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3012 cos0.99 難0.37", "s": 0.819, "f": 0}, {"x": 0.987, "y": 0.376, "c": "近傍", "n": "Be a Hero! [A]  n=3196 cos0.99 難0.38", "s": 0.869, "f": 0}, {"x": 0.99, "y": 0.289, "c": "近傍", "n": "バンブーソード・ガール [A]  n=3442 cos0.99 難0.29", "s": 0.936, "f": 0}, {"x": 0.978, "y": 0.577, "c": "近傍", "n": "Overload Frontier [A]  n=3366 cos0.98 難0.58", "s": 0.916, "f": 0}, {"x": 0.978, "y": 0.627, "c": "近傍", "n": "four pieces of heaven [A]  n=3452 cos0.98 難0.63", "s": 0.939, "f": 0}, {"x": 0.98, "y": 0.387, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [A]  n=2977 cos0.98 難0.39", "s": 0.81, "f": 0}, {"x": 0.978, "y": 0.73, "c": "近傍", "n": "1st Samurai [A]  n=3017 cos0.98 難0.73", "s": 0.821, "f": 0}, {"x": 0.978, "y": 0.403, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.98 難0.40", "s": 0.837, "f": 0}, {"x": 0.978, "y": 0.381, "c": "近傍", "n": "Crazy Jackpot [A]  n=2701 cos0.98 難0.38", "s": 0.735, "f": 0}, {"x": 0.977, "y": 0.403, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3248 cos0.98 難0.40", "s": 0.884, "f": 0}, {"x": 0.975, "y": 0.581, "c": "近傍", "n": "Little Star [A]  n=3676 cos0.98 難0.58", "s": 1.0, "f": 0}, {"x": 0.982, "y": 0.272, "c": "近傍", "n": "CONTRACT [A]  n=3404 cos0.98 難0.27", "s": 0.926, "f": 0}, {"x": 0.987, "y": 0.959, "c": "近傍", "n": "少年A [A]  n=3507 cos0.99 難0.96", "s": 0.954, "f": 0}, {"x": 0.976, "y": 0.738, "c": "近傍", "n": "Beastie Starter [A]  n=3263 cos0.98 難0.74", "s": 0.888, "f": 0}, {"x": 0.993, "y": 0.14, "c": "近傍", "n": "KHAMEN BREAK [A]  n=3465 cos0.99 難0.14", "s": 0.943, "f": 0}, {"x": 0.978, "y": 0.308, "c": "近傍", "n": "TOKAKU=ALMiRAJ [A]  n=756 cos0.98 難0.31", "s": 0.206, "f": 0}, {"x": 0.973, "y": 0.53, "c": "近傍", "n": "GHOST [A]  n=2246 cos0.97 難0.53", "s": 0.611, "f": 0}, {"x": 0.974, "y": 0.457, "c": "近傍", "n": "perditus†paradisus [H]  n=3638 cos0.97 難0.46", "s": 0.99, "f": 0}, {"x": 0.978, "y": 0.297, "c": "近傍", "n": "時空トラベローグ [A]  n=3207 cos0.98 難0.30", "s": 0.872, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.26379554401508354}, {"a": 0, "b": 2, "w": 0.3473159168615383}, {"a": 0, "b": 3, "w": 0.26456397990895897}, {"a": 0, "b": 4, "w": 0.38829809211211797}, {"a": 0, "b": 5, "w": 0.1268414029034718}, {"a": 0, "b": 6, "w": 0.1435791790854064}, {"a": 0, "b": 7, "w": 0.20018047494703228}, {"a": 0, "b": 8, "w": 0.0767608268457719}, {"a": 0, "b": 9, "w": 0.2115945779406314}, {"a": 0, "b": 10, "w": 0.17935999631538246}, {"a": 0, "b": 11, "w": 0.17685225512235359}, {"a": 0, "b": 12, "w": 3.2278846262556726e-11}, {"a": 0, "b": 13, "w": 0.2495763457640765}, {"a": 0, "b": 14, "w": 0.31580283351148586}, {"a": 0, "b": 15, "w": 0.1637685211689881}, {"a": 0, "b": 16, "w": 0.5544212038107503}, {"a": 0, "b": 17, "w": 0.0576233593510217}, {"a": 0, "b": 18, "w": 0.06440715486447601}, {"a": 0, "b": 19, "w": 0.05516847162678884}, {"a": 0, "b": 20, "w": 0.17806029501705634}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=0.074,hiY=1.024;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
