<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">〆 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.141, "c": "種", "n": "〆 [H]  n=1729 cos1.00 難-1.14", "s": 0.71, "f": 0}, {"x": 0.996, "y": -1.184, "c": "近傍", "n": "Stereo Beasts [H]  n=698 cos1.00 難-1.18", "s": 0.287, "f": 0}, {"x": 0.996, "y": -1.047, "c": "近傍", "n": "suspicions [H]  n=721 cos1.00 難-1.05", "s": 0.296, "f": 0}, {"x": 0.995, "y": -1.051, "c": "近傍", "n": "Here We Go Now [H]  n=854 cos0.99 難-1.05", "s": 0.351, "f": 0}, {"x": 0.994, "y": -1.048, "c": "近傍", "n": "Vinculum stellarum [H]  n=1443 cos0.99 難-1.05", "s": 0.593, "f": 0}, {"x": 0.993, "y": -1.129, "c": "近傍", "n": "No Border [H]  n=1432 cos0.99 難-1.13", "s": 0.588, "f": 0}, {"x": 0.993, "y": -1.071, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos0.99 難-1.07", "s": 0.498, "f": 0}, {"x": 0.993, "y": -1.065, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-1.06", "s": 0.256, "f": 0}, {"x": 0.996, "y": -0.983, "c": "近傍", "n": "SEQUENCE CAT [H]  n=2133 cos1.00 難-0.98", "s": 0.876, "f": 0}, {"x": 0.992, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.15", "s": 0.262, "f": 0}, {"x": 0.992, "y": -1.131, "c": "近傍", "n": "frequent [H]  n=1106 cos0.99 難-1.13", "s": 0.454, "f": 0}, {"x": 0.992, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.13", "s": 0.55, "f": 0}, {"x": 0.992, "y": -1.07, "c": "近傍", "n": "Primitive Vibes [H]  n=2434 cos0.99 難-1.07", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.027, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos0.99 難-1.03", "s": 0.473, "f": 0}, {"x": 0.997, "y": -0.946, "c": "近傍", "n": "Raspberry Railgun [H]  n=1994 cos1.00 難-0.95", "s": 0.819, "f": 0}, {"x": 0.991, "y": -1.162, "c": "近傍", "n": "ιgniЯRuina [H]  n=658 cos0.99 難-1.16", "s": 0.27, "f": 0}, {"x": 0.992, "y": -1.013, "c": "近傍", "n": "ORCA [H]  n=1536 cos0.99 難-1.01", "s": 0.631, "f": 0}, {"x": 0.995, "y": -1.336, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=811 cos1.00 難-1.34", "s": 0.333, "f": 0}, {"x": 0.992, "y": -1.255, "c": "近傍", "n": "#CMFLG [H]  n=891 cos0.99 難-1.26", "s": 0.366, "f": 0}, {"x": 0.99, "y": -1.151, "c": "近傍", "n": "innocent revolver [H]  n=1332 cos0.99 難-1.15", "s": 0.547, "f": 0}, {"x": 0.993, "y": -1.313, "c": "近傍", "n": "CoMAAAAAAA [H]  n=1228 cos0.99 難-1.31", "s": 0.505, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42749102160286157}, {"a": 0, "b": 2, "w": 0.4536566142496493}, {"a": 0, "b": 3, "w": 0.2910829992876771}, {"a": 0, "b": 4, "w": 0.32069434142821085}, {"a": 0, "b": 5, "w": 5.994316154556145e-11}, {"a": 0, "b": 6, "w": 0.28240611150965134}, {"a": 0, "b": 7, "w": 0.26653584382497986}, {"a": 0, "b": 8, "w": 0.21141226695964632}, {"a": 0, "b": 9, "w": 0.20716284511868577}, {"a": 0, "b": 10, "w": 0.22083597588034098}, {"a": 0, "b": 11, "w": 0.0713147872845693}, {"a": 0, "b": 12, "w": 0.10271894168202822}, {"a": 0, "b": 13, "w": 0.19879387233050438}, {"a": 0, "b": 14, "w": 0.46515892152261085}, {"a": 0, "b": 15, "w": 0.1735900010361987}, {"a": 0, "b": 16, "w": 0.15694588029846823}, {"a": 0, "b": 17, "w": 0.36205023179231566}, {"a": 0, "b": 18, "w": 0.19654570174025632}, {"a": 0, "b": 19, "w": 0.1306035407295677}, {"a": 0, "b": 20, "w": 0.15695965837479486}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.367,hiY=-0.915;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
