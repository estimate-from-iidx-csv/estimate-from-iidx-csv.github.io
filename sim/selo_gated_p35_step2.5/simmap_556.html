<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Super Rush [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.014, "c": "種", "n": "Super Rush [H]  n=2278 cos1.00 難-1.01", "s": 0.774, "f": 0}, {"x": 0.994, "y": -1.052, "c": "近傍", "n": "rommmo [H]  n=1025 cos0.99 難-1.05", "s": 0.348, "f": 0}, {"x": 0.992, "y": -0.993, "c": "近傍", "n": "Unicorn tail [H]  n=2345 cos0.99 難-0.99", "s": 0.796, "f": 0}, {"x": 0.992, "y": -0.921, "c": "近傍", "n": "VEGA [H]  n=2540 cos0.99 難-0.92", "s": 0.862, "f": 0}, {"x": 0.992, "y": -1.126, "c": "近傍", "n": "イザナミノナゲキ [H]  n=1555 cos0.99 難-1.13", "s": 0.528, "f": 0}, {"x": 0.992, "y": -0.831, "c": "近傍", "n": "GOLD RUSH [H]  n=2945 cos0.99 難-0.83", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.068, "c": "近傍", "n": "Aftermath [H]  n=1341 cos0.99 難-1.07", "s": 0.455, "f": 0}, {"x": 0.997, "y": -0.74, "c": "近傍", "n": "memories [H]  n=1669 cos1.00 難-0.74", "s": 0.567, "f": 0}, {"x": 0.991, "y": -0.812, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2395 cos0.99 難-0.81", "s": 0.813, "f": 0}, {"x": 0.99, "y": -1.159, "c": "近傍", "n": "[ ]DENTITY [H]  n=1433 cos0.99 難-1.16", "s": 0.487, "f": 0}, {"x": 0.987, "y": -1.025, "c": "近傍", "n": "Dans la nuit de l'eternite [H]  n=1507 cos0.99 難-1.03", "s": 0.512, "f": 0}, {"x": 0.99, "y": -0.793, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1796 cos0.99 難-0.79", "s": 0.61, "f": 0}, {"x": 0.992, "y": -0.731, "c": "近傍", "n": "Linus [H]  n=1669 cos0.99 難-0.73", "s": 0.567, "f": 0}, {"x": 0.988, "y": -1.152, "c": "近傍", "n": "Rave Cannon [H]  n=1728 cos0.99 難-1.15", "s": 0.587, "f": 0}, {"x": 0.989, "y": -1.227, "c": "近傍", "n": "花冠 feat.Aikapin [H]  n=1111 cos0.99 難-1.23", "s": 0.377, "f": 0}, {"x": 0.987, "y": -1.131, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.13", "s": 0.25, "f": 0}, {"x": 0.986, "y": -1.114, "c": "近傍", "n": "Say YEEEAHH [H]  n=1814 cos0.99 難-1.11", "s": 0.616, "f": 0}, {"x": 0.986, "y": -0.961, "c": "近傍", "n": "Rave Patroller [H]  n=1627 cos0.99 難-0.96", "s": 0.552, "f": 0}, {"x": 0.988, "y": -1.225, "c": "近傍", "n": "千年ノ理 [H]  n=2350 cos0.99 難-1.22", "s": 0.798, "f": 0}, {"x": 0.986, "y": -0.976, "c": "近傍", "n": "TRIP MACHINE PhoeniX [H]  n=640 cos0.99 難-0.98", "s": 0.217, "f": 0}, {"x": 0.992, "y": -0.7, "c": "近傍", "n": "Karma [H]  n=1622 cos0.99 難-0.70", "s": 0.551, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4989603136594335}, {"a": 0, "b": 2, "w": 0.43849245112738433}, {"a": 0, "b": 3, "w": 0.4017983792253418}, {"a": 0, "b": 4, "w": 0.4278373701016568}, {"a": 0, "b": 5, "w": 0.3946761784490336}, {"a": 0, "b": 6, "w": 0.20968153944826606}, {"a": 0, "b": 7, "w": 0.6286466816895229}, {"a": 0, "b": 8, "w": 0.399029774279283}, {"a": 0, "b": 9, "w": 0.3287171247244488}, {"a": 0, "b": 10, "w": 0.09254367805833597}, {"a": 0, "b": 11, "w": 4.933187192079913e-11}, {"a": 0, "b": 12, "w": 0.3545517782205577}, {"a": 0, "b": 13, "w": 0.2843590287893155}, {"a": 0, "b": 14, "w": 0.2999480888840509}, {"a": 0, "b": 15, "w": 0.2494443344641356}, {"a": 0, "b": 16, "w": 0.21879967882540918}, {"a": 0, "b": 17, "w": 0.23257295178823256}, {"a": 0, "b": 18, "w": 0.3050467277807667}, {"a": 0, "b": 19, "w": 0.20782225392060127}, {"a": 0, "b": 20, "w": 0.36022009748493766}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.269,hiY=-0.658;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
