<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Beat Juggling Mix [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.619, "c": "種", "n": "Beat Juggling Mix [A]  n=3216 cos1.00 難0.62", "s": 0.86, "f": 0}, {"x": 0.991, "y": 0.449, "c": "近傍", "n": "Uh-Oh [A]  n=3506 cos0.99 難0.45", "s": 0.937, "f": 0}, {"x": 0.984, "y": 0.567, "c": "近傍", "n": "カジノファイヤーことみちゃん [A]  n=3426 cos0.98 難0.57", "s": 0.916, "f": 0}, {"x": 0.985, "y": 0.783, "c": "近傍", "n": "SCREAM SQUAD [A]  n=3571 cos0.98 難0.78", "s": 0.955, "f": 0}, {"x": 0.981, "y": 0.708, "c": "近傍", "n": "Just a Little Smile [A]  n=3393 cos0.98 難0.71", "s": 0.907, "f": 0}, {"x": 0.988, "y": 0.334, "c": "近傍", "n": "SPEED DEMON [A]  n=3045 cos0.99 難0.33", "s": 0.814, "f": 0}, {"x": 0.985, "y": 0.378, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3740 cos0.98 難0.38", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.284, "c": "近傍", "n": "TRIP THE DEEP [A]  n=1458 cos0.99 難0.28", "s": 0.39, "f": 0}, {"x": 0.982, "y": 0.34, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2979 cos0.98 難0.34", "s": 0.797, "f": 0}, {"x": 0.979, "y": 0.427, "c": "近傍", "n": "EMERALDAS [H]  n=3144 cos0.98 難0.43", "s": 0.841, "f": 0}, {"x": 0.981, "y": 0.883, "c": "近傍", "n": "Theory [A]  n=2922 cos0.98 難0.88", "s": 0.781, "f": 0}, {"x": 0.984, "y": 0.279, "c": "近傍", "n": "DISPARATE [A]  n=2293 cos0.98 難0.28", "s": 0.613, "f": 0}, {"x": 0.974, "y": 0.617, "c": "近傍", "n": "ラクエン [A]  n=2997 cos0.97 難0.62", "s": 0.801, "f": 0}, {"x": 0.974, "y": 0.554, "c": "近傍", "n": "Red Soul [A]  n=1738 cos0.97 難0.55", "s": 0.465, "f": 0}, {"x": 0.978, "y": 0.346, "c": "近傍", "n": "Buffalo [L]  n=1906 cos0.98 難0.35", "s": 0.51, "f": 0}, {"x": 0.979, "y": 0.31, "c": "近傍", "n": "CODE:0 [A]  n=2881 cos0.98 難0.31", "s": 0.77, "f": 0}, {"x": 0.975, "y": 0.402, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3347 cos0.97 難0.40", "s": 0.895, "f": 0}, {"x": 0.973, "y": 0.769, "c": "近傍", "n": "Do it!! Do it!! [A]  n=3362 cos0.97 難0.77", "s": 0.899, "f": 0}, {"x": 0.972, "y": 0.577, "c": "近傍", "n": "rough percussionythm [A]  n=2835 cos0.97 難0.58", "s": 0.758, "f": 0}, {"x": 0.973, "y": 0.497, "c": "近傍", "n": "HELL SCAPER -Last Escape Remix- [A]  n=3248 cos0.97 難0.50", "s": 0.868, "f": 0}, {"x": 0.976, "y": 0.321, "c": "近傍", "n": "STARLiGHT [A]  n=3187 cos0.98 難0.32", "s": 0.852, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.433710184440693}, {"a": 0, "b": 2, "w": 0.31203579048188856}, {"a": 0, "b": 3, "w": 0.2053021011334314}, {"a": 0, "b": 4, "w": 0.2525922195004854}, {"a": 0, "b": 5, "w": 0.37569587192643195}, {"a": 0, "b": 6, "w": 0.2771224336150443}, {"a": 0, "b": 7, "w": 0.39538162379996533}, {"a": 0, "b": 8, "w": 0.06559460466034484}, {"a": 0, "b": 9, "w": 0.21852754492064497}, {"a": 0, "b": 10, "w": 0.2494781672468399}, {"a": 0, "b": 11, "w": 0.23833825664050812}, {"a": 0, "b": 12, "w": 2.9657720723719194e-11}, {"a": 0, "b": 13, "w": 0.07637544351908276}, {"a": 0, "b": 14, "w": 0.19990724511967917}, {"a": 0, "b": 15, "w": 0.22490259687805136}, {"a": 0, "b": 16, "w": 0.05175911804633526}, {"a": 0, "b": 17, "w": 0.12530800038794376}, {"a": 0, "b": 18, "w": 0.10447369274122786}, {"a": 0, "b": 19, "w": 0.11077869285082609}, {"a": 0, "b": 20, "w": 0.1658218655374576}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=0.230,hiY=0.931;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
