<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Golden Palms [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.312, "c": "種", "n": "Golden Palms [A]  n=3230 cos1.00 難-0.31", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.359, "c": "近傍", "n": "Attitude [A]  n=2384 cos0.99 難-0.36", "s": 0.738, "f": 0}, {"x": 0.988, "y": -0.407, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2680 cos0.99 難-0.41", "s": 0.83, "f": 0}, {"x": 0.99, "y": -0.532, "c": "近傍", "n": "Fantastic Merry-Go-Round [A]  n=2074 cos0.99 難-0.53", "s": 0.642, "f": 0}, {"x": 0.986, "y": -0.352, "c": "近傍", "n": "Selfish Sweet [A]  n=2782 cos0.99 難-0.35", "s": 0.861, "f": 0}, {"x": 0.988, "y": -0.499, "c": "近傍", "n": "Double Loving Heart [A]  n=2702 cos0.99 難-0.50", "s": 0.837, "f": 0}, {"x": 0.986, "y": -0.458, "c": "近傍", "n": "未来のプリズム [A]  n=2668 cos0.99 難-0.46", "s": 0.826, "f": 0}, {"x": 0.984, "y": -0.254, "c": "近傍", "n": "Arcanos [A]  n=1245 cos0.98 難-0.25", "s": 0.385, "f": 0}, {"x": 0.986, "y": -0.09, "c": "近傍", "n": "VIBRΛ [A]  n=2521 cos0.99 難-0.09", "s": 0.78, "f": 0}, {"x": 0.988, "y": -0.593, "c": "近傍", "n": "REcorrection [A]  n=689 cos0.99 難-0.59", "s": 0.213, "f": 0}, {"x": 0.984, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.98 難-0.43", "s": 0.93, "f": 0}, {"x": 0.987, "y": -0.586, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1578 cos0.99 難-0.59", "s": 0.489, "f": 0}, {"x": 0.982, "y": -0.257, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.98 難-0.26", "s": 0.566, "f": 0}, {"x": 0.982, "y": -0.422, "c": "近傍", "n": "Valanga [H]  n=2998 cos0.98 難-0.42", "s": 0.928, "f": 0}, {"x": 0.982, "y": -0.422, "c": "近傍", "n": "GIGANT [A]  n=940 cos0.98 難-0.42", "s": 0.291, "f": 0}, {"x": 0.981, "y": -0.322, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2645 cos0.98 難-0.32", "s": 0.819, "f": 0}, {"x": 0.982, "y": -0.441, "c": "近傍", "n": "セカンドピアス [A]  n=2576 cos0.98 難-0.44", "s": 0.798, "f": 0}, {"x": 0.981, "y": -0.377, "c": "近傍", "n": "I know You know [A]  n=2736 cos0.98 難-0.38", "s": 0.847, "f": 0}, {"x": 0.981, "y": -0.409, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3069 cos0.98 難-0.41", "s": 0.95, "f": 0}, {"x": 0.983, "y": -0.55, "c": "近傍", "n": "真夏の花・真夏の夢 [A]  n=2783 cos0.98 難-0.55", "s": 0.862, "f": 0}, {"x": 0.98, "y": -0.37, "c": "近傍", "n": "Sugar Drippin' [A]  n=2161 cos0.98 難-0.37", "s": 0.669, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.11483664145043737}, {"a": 0, "b": 2, "w": 0.21282858932387516}, {"a": 0, "b": 3, "w": 0.35824977023208693}, {"a": 0, "b": 4, "w": 4.358580163454917e-11}, {"a": 0, "b": 5, "w": 0.13695994477162365}, {"a": 0, "b": 6, "w": 0.11928229465545315}, {"a": 0, "b": 7, "w": 0.22289667631762122}, {"a": 0, "b": 8, "w": 0.268460960567958}, {"a": 0, "b": 9, "w": 0.2672582798935087}, {"a": 0, "b": 10, "w": 0.208638058399377}, {"a": 0, "b": 11, "w": 0.13394515795300155}, {"a": 0, "b": 12, "w": 0.08249248550509958}, {"a": 0, "b": 13, "w": 0.17943681836397296}, {"a": 0, "b": 14, "w": 0.14302897057738162}, {"a": 0, "b": 15, "w": 0.11411630732691214}, {"a": 0, "b": 16, "w": 0.1091208902502222}, {"a": 0, "b": 17, "w": 0.04520931845038456}, {"a": 0, "b": 18, "w": 0.03380262349887975}, {"a": 0, "b": 19, "w": 0.0650102819107049}, {"a": 0, "b": 20, "w": 0.037591769154798116}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.633,hiY=-0.050;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
