<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Shadow World [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.087, "c": "種", "n": "Shadow World [A]  n=2323 cos1.00 難-0.09", "s": 0.647, "f": 0}, {"x": 0.996, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos1.00 難-0.02", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.064, "c": "近傍", "n": "グッバイ宣言 [A]  n=2497 cos0.99 難-0.06", "s": 0.695, "f": 0}, {"x": 0.994, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.661, "f": 0}, {"x": 0.994, "y": -0.155, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2768 cos0.99 難-0.16", "s": 0.771, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "タンポポ [A]  n=713 cos1.00 難-0.25", "s": 0.198, "f": 0}, {"x": 0.993, "y": -0.103, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難-0.10", "s": 0.32, "f": 0}, {"x": 0.993, "y": -0.005, "c": "近傍", "n": "ハオ [A]  n=1364 cos0.99 難-0.00", "s": 0.38, "f": 0}, {"x": 0.993, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos0.99 難-0.16", "s": 0.876, "f": 0}, {"x": 0.992, "y": -0.085, "c": "近傍", "n": "SnapSkipSpark [A]  n=1095 cos0.99 難-0.09", "s": 0.305, "f": 0}, {"x": 0.995, "y": -0.25, "c": "近傍", "n": "勇者 [A]  n=1812 cos0.99 難-0.25", "s": 0.504, "f": 0}, {"x": 0.992, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos0.99 難-0.10", "s": 0.861, "f": 0}, {"x": 0.994, "y": -0.252, "c": "近傍", "n": "湘南ロンリーMIDNIGHT RAIN [A]  n=1879 cos0.99 難-0.25", "s": 0.523, "f": 0}, {"x": 0.994, "y": -0.252, "c": "近傍", "n": "SHION [A]  n=3340 cos0.99 難-0.25", "s": 0.93, "f": 0}, {"x": 0.993, "y": -0.193, "c": "近傍", "n": "Τeλοs [A]  n=606 cos0.99 難-0.19", "s": 0.169, "f": 0}, {"x": 0.993, "y": 0.046, "c": "近傍", "n": "No Tears [A]  n=3592 cos0.99 難0.05", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.056, "c": "近傍", "n": "ランカーキラーガール [A]  n=3145 cos0.99 難0.06", "s": 0.876, "f": 0}, {"x": 0.992, "y": 0.015, "c": "近傍", "n": "RIZING YOU UP [A]  n=3106 cos0.99 難0.02", "s": 0.865, "f": 0}, {"x": 0.992, "y": 0.0, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [A]  n=1896 cos0.99 難0.00", "s": 0.528, "f": 0}, {"x": 0.994, "y": 0.096, "c": "近傍", "n": "恋は白帯、サンシロー [L]  n=3246 cos0.99 難0.10", "s": 0.904, "f": 0}, {"x": 0.994, "y": 0.105, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1253 cos0.99 難0.11", "s": 0.349, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43763052132013813}, {"a": 0, "b": 2, "w": 0.08857350024754806}, {"a": 0, "b": 3, "w": 0.4019622932933389}, {"a": 0, "b": 4, "w": 0.218769049813072}, {"a": 0, "b": 5, "w": 0.3543318669449397}, {"a": 0, "b": 6, "w": 0.2790913258585501}, {"a": 0, "b": 7, "w": 0.30910462928446114}, {"a": 0, "b": 8, "w": 0.3119683260572461}, {"a": 0, "b": 9, "w": 5.229194854905472e-11}, {"a": 0, "b": 10, "w": 0.4238635546071099}, {"a": 0, "b": 11, "w": 0.276390486062703}, {"a": 0, "b": 12, "w": 0.32324917366785344}, {"a": 0, "b": 13, "w": 0.3860484052768858}, {"a": 0, "b": 14, "w": 0.2644884154225853}, {"a": 0, "b": 15, "w": 0.3215437994564466}, {"a": 0, "b": 16, "w": 0.1701397453600686}, {"a": 0, "b": 17, "w": 0.2117883878163751}, {"a": 0, "b": 18, "w": 0.10761900889099385}, {"a": 0, "b": 19, "w": 0.2825340309840242}, {"a": 0, "b": 20, "w": 0.29130161114608455}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.282,hiY=0.134;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
