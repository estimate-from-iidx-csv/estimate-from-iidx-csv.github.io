<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Do Back Burn [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.11, "c": "種", "n": "Do Back Burn [A]  n=1891 cos1.00 難-0.11", "s": 0.556, "f": 0}, {"x": 0.995, "y": -0.261, "c": "近傍", "n": "Virus Funk [A]  n=3044 cos1.00 難-0.26", "s": 0.895, "f": 0}, {"x": 0.995, "y": -0.245, "c": "近傍", "n": "take me higher [A]  n=2127 cos0.99 難-0.24", "s": 0.625, "f": 0}, {"x": 0.993, "y": -0.258, "c": "近傍", "n": "ないないルーティン [A]  n=1764 cos0.99 難-0.26", "s": 0.519, "f": 0}, {"x": 0.994, "y": -0.341, "c": "近傍", "n": "!Viva! [A]  n=3300 cos0.99 難-0.34", "s": 0.97, "f": 0}, {"x": 0.994, "y": 0.133, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.99 難0.13", "s": 0.821, "f": 0}, {"x": 0.994, "y": -0.32, "c": "近傍", "n": "アクマフカ [A]  n=1847 cos0.99 難-0.32", "s": 0.543, "f": 0}, {"x": 0.991, "y": -0.012, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2447 cos0.99 難-0.01", "s": 0.719, "f": 0}, {"x": 0.993, "y": -0.377, "c": "近傍", "n": "IDOL syndrome. [A]  n=3146 cos0.99 難-0.38", "s": 0.925, "f": 0}, {"x": 0.991, "y": -0.232, "c": "近傍", "n": "STAR BEAT [A]  n=1422 cos0.99 難-0.23", "s": 0.418, "f": 0}, {"x": 0.991, "y": -0.245, "c": "近傍", "n": "深愛のリグレット [A]  n=2677 cos0.99 難-0.25", "s": 0.787, "f": 0}, {"x": 0.99, "y": -0.236, "c": "近傍", "n": "OUTER PLANETS [A]  n=2513 cos0.99 難-0.24", "s": 0.739, "f": 0}, {"x": 0.99, "y": -0.236, "c": "近傍", "n": "ミッドナイト☆WAR [A]  n=3154 cos0.99 難-0.24", "s": 0.927, "f": 0}, {"x": 0.992, "y": 0.192, "c": "近傍", "n": "Chronos [A]  n=3401 cos0.99 難0.19", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.226, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2790 cos0.99 難-0.23", "s": 0.82, "f": 0}, {"x": 0.989, "y": -0.127, "c": "近傍", "n": "First Resolution [A]  n=2082 cos0.99 難-0.13", "s": 0.612, "f": 0}, {"x": 0.989, "y": -0.154, "c": "近傍", "n": "Everlasting Resort [A]  n=2856 cos0.99 難-0.15", "s": 0.84, "f": 0}, {"x": 0.989, "y": -0.238, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos0.99 難-0.24", "s": 0.951, "f": 0}, {"x": 0.989, "y": -0.254, "c": "近傍", "n": "霧幻メモリア [A]  n=2432 cos0.99 難-0.25", "s": 0.715, "f": 0}, {"x": 0.995, "y": -0.537, "c": "近傍", "n": "So What [A]  n=985 cos1.00 難-0.54", "s": 0.29, "f": 0}, {"x": 0.989, "y": -0.196, "c": "近傍", "n": "Galaxy Collapse [A]  n=792 cos0.99 難-0.20", "s": 0.233, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4085340040558244}, {"a": 0, "b": 2, "w": 0.26642493068887385}, {"a": 0, "b": 3, "w": 0.20873408683186134}, {"a": 0, "b": 4, "w": 0.24313168785360184}, {"a": 0, "b": 5, "w": 0.3353526531973142}, {"a": 0, "b": 6, "w": 0.3046283888654916}, {"a": 0, "b": 7, "w": 0.14634231619345495}, {"a": 0, "b": 8, "w": 0.2669310971890346}, {"a": 0, "b": 9, "w": 0.10443225846114934}, {"a": 0, "b": 10, "w": 0.21090821455852427}, {"a": 0, "b": 11, "w": 0.2054065515835607}, {"a": 0, "b": 12, "w": 0.14882069985482604}, {"a": 0, "b": 13, "w": 0.10903593051548677}, {"a": 0, "b": 14, "w": 5.24789101064016e-11}, {"a": 0, "b": 15, "w": 0.09974479008881454}, {"a": 0, "b": 16, "w": 0.12135312203493098}, {"a": 0, "b": 17, "w": 0.12243060976115405}, {"a": 0, "b": 18, "w": 0.17868266878239658}, {"a": 0, "b": 19, "w": 0.23457412816748024}, {"a": 0, "b": 20, "w": 0.12617000940374568}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.595,hiY=0.251;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
