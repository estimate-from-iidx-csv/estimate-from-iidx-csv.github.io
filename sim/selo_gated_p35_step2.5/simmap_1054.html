<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Super Duper Racers [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.171, "c": "種", "n": "Super Duper Racers [A]  n=2874 cos1.00 難-0.17", "s": 0.919, "f": 0}, {"x": 0.996, "y": -0.146, "c": "近傍", "n": "NPC World [A]  n=2851 cos1.00 難-0.15", "s": 0.912, "f": 0}, {"x": 0.996, "y": -0.128, "c": "近傍", "n": "POODLE [A]  n=2923 cos1.00 難-0.13", "s": 0.935, "f": 0}, {"x": 0.996, "y": -0.147, "c": "近傍", "n": "As You Want [A]  n=1915 cos1.00 難-0.15", "s": 0.613, "f": 0}, {"x": 0.995, "y": -0.127, "c": "近傍", "n": "Phoenix [A]  n=3111 cos1.00 難-0.13", "s": 0.995, "f": 0}, {"x": 0.995, "y": -0.25, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos1.00 難-0.25", "s": 0.756, "f": 0}, {"x": 0.995, "y": -0.223, "c": "近傍", "n": "Be OK [A]  n=2981 cos0.99 難-0.22", "s": 0.954, "f": 0}, {"x": 0.995, "y": -0.254, "c": "近傍", "n": "Devil's Gear [H]  n=2605 cos0.99 難-0.25", "s": 0.833, "f": 0}, {"x": 0.994, "y": -0.146, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3055 cos0.99 難-0.15", "s": 0.977, "f": 0}, {"x": 0.995, "y": -0.233, "c": "近傍", "n": "EXE [A]  n=3025 cos0.99 難-0.23", "s": 0.968, "f": 0}, {"x": 0.994, "y": -0.15, "c": "近傍", "n": "Neonlights [A]  n=3013 cos0.99 難-0.15", "s": 0.964, "f": 0}, {"x": 0.995, "y": -0.281, "c": "近傍", "n": "星をこの手に [A]  n=3016 cos0.99 難-0.28", "s": 0.965, "f": 0}, {"x": 0.994, "y": -0.196, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos0.99 難-0.20", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.284, "c": "近傍", "n": "G59 [H]  n=2935 cos0.99 難-0.28", "s": 0.939, "f": 0}, {"x": 0.993, "y": -0.193, "c": "近傍", "n": "Glory [A]  n=2168 cos0.99 難-0.19", "s": 0.694, "f": 0}, {"x": 0.993, "y": -0.192, "c": "近傍", "n": "Vibing! Shake it! [A]  n=1366 cos0.99 難-0.19", "s": 0.437, "f": 0}, {"x": 0.994, "y": -0.076, "c": "近傍", "n": "ICARUS [H]  n=3028 cos0.99 難-0.08", "s": 0.969, "f": 0}, {"x": 0.994, "y": -0.263, "c": "近傍", "n": "Release The Music [A]  n=3070 cos0.99 難-0.26", "s": 0.982, "f": 0}, {"x": 0.993, "y": -0.106, "c": "近傍", "n": "Good Looking [A]  n=761 cos0.99 難-0.11", "s": 0.243, "f": 0}, {"x": 0.993, "y": -0.143, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2848 cos0.99 難-0.14", "s": 0.911, "f": 0}, {"x": 0.993, "y": -0.105, "c": "近傍", "n": "Space Time [A]  n=2797 cos0.99 難-0.11", "s": 0.895, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40475816939113307}, {"a": 0, "b": 2, "w": 0.41570692391511155}, {"a": 0, "b": 3, "w": 0.2862714347267613}, {"a": 0, "b": 4, "w": 0.4051388702384269}, {"a": 0, "b": 5, "w": 0.3868623489159144}, {"a": 0, "b": 6, "w": 0.27604767724676127}, {"a": 0, "b": 7, "w": 0.38510346098986437}, {"a": 0, "b": 8, "w": 0.31480445772512733}, {"a": 0, "b": 9, "w": 0.22465254780717725}, {"a": 0, "b": 10, "w": 0.30890935153419785}, {"a": 0, "b": 11, "w": 0.29489599177835657}, {"a": 0, "b": 12, "w": 0.2552540225916431}, {"a": 0, "b": 13, "w": 0.3676214081480721}, {"a": 0, "b": 14, "w": 0.21821507766868853}, {"a": 0, "b": 15, "w": 0.27402532394467205}, {"a": 0, "b": 16, "w": 0.2814524633296931}, {"a": 0, "b": 17, "w": 0.10827706911944279}, {"a": 0, "b": 18, "w": 0.2993095952439272}, {"a": 0, "b": 19, "w": 5.54191137425164e-11}, {"a": 0, "b": 20, "w": 0.11589509572819556}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.301,hiY=-0.060;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
