<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MAX 360 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.397, "c": "種", "n": "MAX 360 [A]  n=1541 cos1.00 難1.40", "s": 0.465, "f": 0}, {"x": 0.991, "y": 1.396, "c": "近傍", "n": "Session 9 -Chronicles- [A]  n=3083 cos0.99 難1.40", "s": 0.93, "f": 0}, {"x": 0.993, "y": 1.334, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.99 難1.33", "s": 0.221, "f": 0}, {"x": 0.993, "y": 1.31, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.99 難1.31", "s": 0.831, "f": 0}, {"x": 0.987, "y": 1.376, "c": "近傍", "n": "HyperTwist [A]  n=676 cos0.99 難1.38", "s": 0.204, "f": 0}, {"x": 0.992, "y": 1.276, "c": "近傍", "n": "Godspeed [A]  n=3315 cos0.99 難1.28", "s": 1.0, "f": 0}, {"x": 0.987, "y": 1.351, "c": "近傍", "n": "2 Be Continued [A]  n=953 cos0.99 難1.35", "s": 0.287, "f": 0}, {"x": 0.986, "y": 1.438, "c": "近傍", "n": "GRAVITON [A]  n=1936 cos0.99 難1.44", "s": 0.584, "f": 0}, {"x": 0.986, "y": 1.34, "c": "近傍", "n": "yellow head joe [L]  n=1619 cos0.99 難1.34", "s": 0.488, "f": 0}, {"x": 0.986, "y": 1.331, "c": "近傍", "n": "轟け！恋のビーンボール！！ [A]  n=3292 cos0.99 難1.33", "s": 0.993, "f": 0}, {"x": 0.993, "y": 1.243, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3284 cos0.99 難1.24", "s": 0.991, "f": 0}, {"x": 0.984, "y": 1.405, "c": "近傍", "n": "ANCHOR [A]  n=2994 cos0.98 難1.41", "s": 0.903, "f": 0}, {"x": 0.984, "y": 1.429, "c": "近傍", "n": "NITROUS CANNON [A]  n=3128 cos0.98 難1.43", "s": 0.944, "f": 0}, {"x": 0.985, "y": 1.321, "c": "近傍", "n": "IMPLANTATION [A]  n=3251 cos0.98 難1.32", "s": 0.981, "f": 0}, {"x": 0.983, "y": 1.394, "c": "近傍", "n": "Trill auf G [A]  n=3033 cos0.98 難1.39", "s": 0.915, "f": 0}, {"x": 0.983, "y": 1.401, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [A]  n=1835 cos0.98 難1.40", "s": 0.554, "f": 0}, {"x": 0.984, "y": 1.476, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3218 cos0.98 難1.48", "s": 0.971, "f": 0}, {"x": 0.983, "y": 1.478, "c": "近傍", "n": "Resonant [A]  n=1284 cos0.98 難1.48", "s": 0.387, "f": 0}, {"x": 0.982, "y": 1.42, "c": "近傍", "n": "津軽雪 [A]  n=3214 cos0.98 難1.42", "s": 0.97, "f": 0}, {"x": 0.981, "y": 1.419, "c": "近傍", "n": "THANK YOU FOR PLAYING [L]  n=2944 cos0.98 難1.42", "s": 0.888, "f": 0}, {"x": 0.985, "y": 1.267, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=945 cos0.98 難1.27", "s": 0.285, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.23003937793367668}, {"a": 0, "b": 2, "w": 0.45323258119167653}, {"a": 0, "b": 3, "w": 0.4963455084215491}, {"a": 0, "b": 4, "w": 0.29218622621453405}, {"a": 0, "b": 5, "w": 0.40138512342752986}, {"a": 0, "b": 6, "w": 0.13520132613507463}, {"a": 0, "b": 7, "w": 0.26976042014270574}, {"a": 0, "b": 8, "w": 0.26431489189240387}, {"a": 0, "b": 9, "w": 3.0278335394484657e-11}, {"a": 0, "b": 10, "w": 0.46564964354924576}, {"a": 0, "b": 11, "w": 0.14040229390792835}, {"a": 0, "b": 12, "w": 0.1440447048763437}, {"a": 0, "b": 13, "w": 0.01106376454423319}, {"a": 0, "b": 14, "w": 0.18001432089649716}, {"a": 0, "b": 15, "w": 0.04817718237512214}, {"a": 0, "b": 16, "w": 0.19629464210326253}, {"a": 0, "b": 17, "w": 0.16244274050347007}, {"a": 0, "b": 18, "w": 0.03295088326360085}, {"a": 0, "b": 19, "w": 0.15843875664585205}, {"a": 0, "b": 20, "w": 0.23743028842743807}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=1.224,hiY=1.497;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
