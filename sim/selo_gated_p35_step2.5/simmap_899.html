<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">into the battlefield [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.03, "c": "種", "n": "into the battlefield [A]  n=2997 cos1.00 難-0.03", "s": 0.815, "f": 0}, {"x": 0.997, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos1.00 難-0.10", "s": 0.842, "f": 0}, {"x": 0.996, "y": -0.01, "c": "近傍", "n": "PHOTONGENIC [A]  n=2864 cos1.00 難-0.01", "s": 0.779, "f": 0}, {"x": 0.996, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos1.00 難-0.16", "s": 0.856, "f": 0}, {"x": 0.995, "y": -0.119, "c": "近傍", "n": "Shirdal [A]  n=695 cos0.99 難-0.12", "s": 0.189, "f": 0}, {"x": 0.994, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos0.99 難-0.02", "s": 0.81, "f": 0}, {"x": 0.995, "y": 0.073, "c": "近傍", "n": "Sparkle Smilin' [A]  n=2650 cos0.99 難0.07", "s": 0.721, "f": 0}, {"x": 0.998, "y": -0.229, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3183 cos1.00 難-0.23", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.144, "c": "近傍", "n": "3y3s [H]  n=3676 cos0.99 難-0.14", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.103, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1149 cos0.99 難-0.10", "s": 0.313, "f": 0}, {"x": 0.995, "y": 0.107, "c": "近傍", "n": "Take It Easy [A]  n=3281 cos0.99 難0.11", "s": 0.893, "f": 0}, {"x": 0.994, "y": -0.156, "c": "近傍", "n": "Best of Me [A]  n=3063 cos0.99 難-0.16", "s": 0.833, "f": 0}, {"x": 0.996, "y": 0.162, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos1.00 難0.16", "s": 0.936, "f": 0}, {"x": 0.993, "y": -0.015, "c": "近傍", "n": "少年リップルズ [A]  n=1807 cos0.99 難-0.01", "s": 0.492, "f": 0}, {"x": 0.993, "y": 0.007, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3594 cos0.99 難0.01", "s": 0.978, "f": 0}, {"x": 0.993, "y": -0.114, "c": "近傍", "n": "Rock Da House [A]  n=3621 cos0.99 難-0.11", "s": 0.985, "f": 0}, {"x": 0.994, "y": -0.193, "c": "近傍", "n": "Τeλοs [A]  n=606 cos0.99 難-0.19", "s": 0.165, "f": 0}, {"x": 0.995, "y": -0.212, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos0.99 難-0.21", "s": 0.845, "f": 0}, {"x": 0.998, "y": -0.291, "c": "近傍", "n": "rainbow rainbow [H]  n=2670 cos1.00 難-0.29", "s": 0.726, "f": 0}, {"x": 0.996, "y": -0.26, "c": "近傍", "n": "オルタネイトβ [A]  n=3292 cos1.00 難-0.26", "s": 0.896, "f": 0}, {"x": 0.995, "y": -0.248, "c": "近傍", "n": "ILIAS [A]  n=3053 cos1.00 難-0.25", "s": 0.831, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47160880488742973}, {"a": 0, "b": 2, "w": 0.2919644710880994}, {"a": 0, "b": 3, "w": 0.45245293432069}, {"a": 0, "b": 4, "w": 0.332553664619163}, {"a": 0, "b": 5, "w": 0.11675918133319918}, {"a": 0, "b": 6, "w": 0.25755651998569784}, {"a": 0, "b": 7, "w": 0.5477782428334997}, {"a": 0, "b": 8, "w": 6.056544155086385e-11}, {"a": 0, "b": 9, "w": 0.11528483864226857}, {"a": 0, "b": 10, "w": 0.34667490138381374}, {"a": 0, "b": 11, "w": 0.2603574093571962}, {"a": 0, "b": 12, "w": 0.09994061189006831}, {"a": 0, "b": 13, "w": 0.12885778924754732}, {"a": 0, "b": 14, "w": 0.014626884264555717}, {"a": 0, "b": 15, "w": 0.22947127347175345}, {"a": 0, "b": 16, "w": 0.12244888499300632}, {"a": 0, "b": 17, "w": 0.3462318965607464}, {"a": 0, "b": 18, "w": 0.6234929846079874}, {"a": 0, "b": 19, "w": 0.23988856134892078}, {"a": 0, "b": 20, "w": 0.27848123718325035}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.327,hiY=0.198;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
