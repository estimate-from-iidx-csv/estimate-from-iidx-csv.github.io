<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">開きたまえ！Next stAge！ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.808, "c": "種", "n": "開きたまえ！Next stAge！ [H]  n=1064 cos1.00 難-1.81", "s": 0.82, "f": 0}, {"x": 0.984, "y": -1.778, "c": "近傍", "n": "Banger Banger Banger Banger [H]  n=827 cos0.98 難-1.78", "s": 0.637, "f": 0}, {"x": 0.98, "y": -1.792, "c": "近傍", "n": "Xyndrome [H]  n=862 cos0.98 難-1.79", "s": 0.664, "f": 0}, {"x": 0.981, "y": -1.772, "c": "近傍", "n": "曼荼羅恋々 [H]  n=1039 cos0.98 難-1.77", "s": 0.8, "f": 0}, {"x": 0.979, "y": -1.778, "c": "近傍", "n": "OVER VOLTAGE [H]  n=506 cos0.98 難-1.78", "s": 0.39, "f": 0}, {"x": 0.979, "y": -1.782, "c": "近傍", "n": "3V0 [H]  n=770 cos0.98 難-1.78", "s": 0.593, "f": 0}, {"x": 0.991, "y": -1.69, "c": "近傍", "n": "Super Freak [H]  n=717 cos0.99 難-1.69", "s": 0.552, "f": 0}, {"x": 0.981, "y": -1.723, "c": "近傍", "n": "Victory Of Ravers [H]  n=728 cos0.98 難-1.72", "s": 0.561, "f": 0}, {"x": 0.973, "y": -1.777, "c": "近傍", "n": "10000 MILES AWAY [H]  n=729 cos0.97 難-1.78", "s": 0.562, "f": 0}, {"x": 0.98, "y": -1.917, "c": "近傍", "n": "apo:llioth [H]  n=957 cos0.98 難-1.92", "s": 0.737, "f": 0}, {"x": 0.989, "y": -1.658, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1298 cos0.99 難-1.66", "s": 1.0, "f": 0}, {"x": 0.987, "y": -1.661, "c": "近傍", "n": "rough percussionythm [H]  n=1069 cos0.99 難-1.66", "s": 0.824, "f": 0}, {"x": 0.97, "y": -1.797, "c": "近傍", "n": "寝起きヤシの木 [H]  n=795 cos0.97 難-1.80", "s": 0.612, "f": 0}, {"x": 0.978, "y": -1.689, "c": "近傍", "n": "Lost Souls [H]  n=869 cos0.98 難-1.69", "s": 0.669, "f": 0}, {"x": 0.969, "y": -1.763, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [H]  n=575 cos0.97 難-1.76", "s": 0.443, "f": 0}, {"x": 0.968, "y": -1.79, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=958 cos0.97 難-1.79", "s": 0.738, "f": 0}, {"x": 0.977, "y": -1.939, "c": "近傍", "n": "あるビー！ feat.ころねぽち [H]  n=584 cos0.98 難-1.94", "s": 0.45, "f": 0}, {"x": 0.966, "y": -1.809, "c": "近傍", "n": "ZEИITH [H]  n=567 cos0.97 難-1.81", "s": 0.437, "f": 0}, {"x": 0.966, "y": -1.867, "c": "近傍", "n": "響花水月 [H]  n=686 cos0.97 難-1.87", "s": 0.529, "f": 0}, {"x": 0.964, "y": -1.799, "c": "近傍", "n": "Speculation [H]  n=532 cos0.96 難-1.80", "s": 0.41, "f": 0}, {"x": 0.969, "y": -1.706, "c": "近傍", "n": "儚き恋の華 [H]  n=974 cos0.97 難-1.71", "s": 0.75, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36214211031643706}, {"a": 0, "b": 2, "w": 0.28171226623303725}, {"a": 0, "b": 3, "w": 0.29068494658120037}, {"a": 0, "b": 4, "w": 0.17592508673399976}, {"a": 0, "b": 5, "w": 0.240479850123693}, {"a": 0, "b": 6, "w": 0.5339330244740664}, {"a": 0, "b": 7, "w": 0.3018633519782271}, {"a": 0, "b": 8, "w": 0.16476834066479484}, {"a": 0, "b": 9, "w": 0.2236030497057071}, {"a": 0, "b": 10, "w": 0.45394784508158303}, {"a": 0, "b": 11, "w": 0.3617277618376872}, {"a": 0, "b": 12, "w": 0.025001765041943402}, {"a": 0, "b": 13, "w": 0.23764015017387463}, {"a": 0, "b": 14, "w": 0.11465886815540027}, {"a": 0, "b": 15, "w": 0.1004857485588716}, {"a": 0, "b": 16, "w": 0.24143323772840553}, {"a": 0, "b": 17, "w": 4.021327715264533e-11}, {"a": 0, "b": 18, "w": 0.07709829341586294}, {"a": 0, "b": 19, "w": 0.055961779229950714}, {"a": 0, "b": 20, "w": 0.11904641684550099}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.961,hiX=1.003,loY=-1.961,hiY=-1.635;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
