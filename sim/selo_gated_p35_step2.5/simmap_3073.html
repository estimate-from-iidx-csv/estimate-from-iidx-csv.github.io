<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BroGamer [L] 近傍マップ</h2>

 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.187, "c": "種", "n": "BroGamer [L]  n=1963 cos1.00 難2.19", "s": 0.661, "f": 0}, {"x": 0.966, "y": 2.196, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2970 cos0.97 難2.20", "s": 1.0, "f": 0}, {"x": 0.967, "y": 2.143, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2335 cos0.97 難2.14", "s": 0.786, "f": 0}, {"x": 0.963, "y": 2.175, "c": "近傍", "n": "Override [L]  n=1612 cos0.96 難2.18", "s": 0.543, "f": 0}, {"x": 0.974, "y": 2.047, "c": "近傍", "n": "Smashing Wedge [A]  n=2355 cos0.97 難2.05", "s": 0.793, "f": 0}, {"x": 0.965, "y": 2.079, "c": "近傍", "n": "CODE:0 [L]  n=1250 cos0.96 難2.08", "s": 0.421, "f": 0}, {"x": 0.958, "y": 2.266, "c": "近傍", "n": "≡+≡ [L]  n=746 cos0.96 難2.27", "s": 0.251, "f": 0}, {"x": 0.985, "y": 1.968, "c": "近傍", "n": "VOX UP [A]  n=2951 cos0.98 難1.97", "s": 0.994, "f": 0}, {"x": 0.96, "y": 2.332, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2217 cos0.96 難2.33", "s": 0.746, "f": 0}, {"x": 0.982, "y": 2.423, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [L]  n=1150 cos0.98 難2.42", "s": 0.387, "f": 0}, {"x": 0.951, "y": 2.128, "c": "近傍", "n": "Vulnerability [A]  n=1145 cos0.95 難2.13", "s": 0.386, "f": 0}, {"x": 0.95, "y": 2.273, "c": "近傍", "n": "Confiserie [A]  n=2903 cos0.95 難2.27", "s": 0.977, "f": 0}, {"x": 0.964, "y": 1.989, "c": "近傍", "n": "God Mind [A]  n=1021 cos0.96 難1.99", "s": 0.344, "f": 0}, {"x": 0.96, "y": 2.37, "c": "近傍", "n": "VANESSA [L]  n=2321 cos0.96 難2.37", "s": 0.781, "f": 0}, {"x": 0.948, "y": 2.097, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1606 cos0.95 難2.10", "s": 0.541, "f": 0}, {"x": 0.965, "y": 1.975, "c": "近傍", "n": "voltississimo [A]  n=2582 cos0.96 難1.97", "s": 0.869, "f": 0}, {"x": 0.971, "y": 1.951, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [L]  n=2401 cos0.97 難1.95", "s": 0.808, "f": 0}, {"x": 0.957, "y": 2.009, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1872 cos0.96 難2.01", "s": 0.63, "f": 0}, {"x": 0.962, "y": 2.402, "c": "近傍", "n": "Feel The Beat [L]  n=2738 cos0.96 難2.40", "s": 0.922, "f": 0}, {"x": 0.964, "y": 1.966, "c": "近傍", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [A]  n=2594 cos0.96 難1.97", "s": 0.873, "f": 0}, {"x": 0.959, "y": 2.39, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1151 cos0.96 難2.39", "s": 0.388, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.18932144114512728}, {"a": 0, "b": 2, "w": 0.22997517677383084}, {"a": 0, "b": 3, "w": 0.1928835999608456}, {"a": 0, "b": 4, "w": 0.22498798179044066}, {"a": 0, "b": 5, "w": 0.14884629810343475}, {"a": 0, "b": 6, "w": 0.174117462108475}, {"a": 0, "b": 7, "w": 0.29040452999459165}, {"a": 0, "b": 8, "w": 0.0990471953225206}, {"a": 0, "b": 9, "w": 0.46126557122640954}, {"a": 0, "b": 10, "w": 0.04208952477218053}, {"a": 0, "b": 11, "w": 0.0787778354067129}, {"a": 0, "b": 12, "w": 0.24335753072690092}, {"a": 0, "b": 13, "w": 0.1793442162448775}, {"a": 0, "b": 14, "w": 1.4227841127478769e-11}, {"a": 0, "b": 15, "w": 0.14105740650462406}, {"a": 0, "b": 16, "w": 0.29325551359888535}, {"a": 0, "b": 17, "w": 0.11984683227976822}, {"a": 0, "b": 18, "w": 0.22483947086716716}, {"a": 0, "b": 19, "w": 0.23074690941317877}, {"a": 0, "b": 20, "w": 0.1722530745195061}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.944,hiX=1.004,loY=1.913,hiY=2.461;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
