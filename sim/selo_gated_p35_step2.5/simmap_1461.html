<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Pinky Happy Crazy [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.111, "c": "種", "n": "Pinky Happy Crazy [H]  n=344 cos1.00 難-1.11", "s": 0.105, "f": 0}, {"x": 0.993, "y": -1.131, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos0.99 難-1.13", "s": 0.226, "f": 0}, {"x": 0.992, "y": -1.076, "c": "近傍", "n": "Triple Cross [H]  n=1734 cos0.99 難-1.08", "s": 0.531, "f": 0}, {"x": 0.992, "y": -1.051, "c": "近傍", "n": "RIZING YOU UP [H]  n=1821 cos0.99 難-1.05", "s": 0.557, "f": 0}, {"x": 0.992, "y": -1.065, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1192 cos0.99 難-1.07", "s": 0.365, "f": 0}, {"x": 0.991, "y": -1.007, "c": "近傍", "n": "No Tears [H]  n=1729 cos0.99 難-1.01", "s": 0.529, "f": 0}, {"x": 0.992, "y": -0.961, "c": "近傍", "n": "Rave Patroller [H]  n=1627 cos0.99 難-0.96", "s": 0.498, "f": 0}, {"x": 0.991, "y": -0.987, "c": "近傍", "n": "UNITE THE HEART [H]  n=1714 cos0.99 難-0.99", "s": 0.525, "f": 0}, {"x": 0.99, "y": -1.155, "c": "近傍", "n": "Vulkan [H]  n=1929 cos0.99 難-1.15", "s": 0.59, "f": 0}, {"x": 0.993, "y": -1.305, "c": "近傍", "n": "≡+≡ [H]  n=1324 cos0.99 難-1.31", "s": 0.405, "f": 0}, {"x": 0.99, "y": -0.987, "c": "近傍", "n": "examination leave [H]  n=1911 cos0.99 難-0.99", "s": 0.585, "f": 0}, {"x": 0.991, "y": -0.942, "c": "近傍", "n": "AKASHIC BREAK [H]  n=1721 cos0.99 難-0.94", "s": 0.527, "f": 0}, {"x": 0.989, "y": -1.184, "c": "近傍", "n": "スーパー戦湯ババンバーン [H]  n=1258 cos0.99 難-1.18", "s": 0.385, "f": 0}, {"x": 0.991, "y": -0.865, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1828 cos0.99 難-0.86", "s": 0.56, "f": 0}, {"x": 0.989, "y": -0.912, "c": "近傍", "n": "スキッテイエェエエェ!!!! [H]  n=682 cos0.99 難-0.91", "s": 0.209, "f": 0}, {"x": 0.987, "y": -1.093, "c": "近傍", "n": "cinder [H]  n=1446 cos0.99 難-1.09", "s": 0.443, "f": 0}, {"x": 0.99, "y": -0.882, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [H]  n=2279 cos0.99 難-0.88", "s": 0.698, "f": 0}, {"x": 0.991, "y": -0.845, "c": "近傍", "n": "凛として咲く花の如く [H]  n=3267 cos0.99 難-0.85", "s": 1.0, "f": 0}, {"x": 0.987, "y": -1.174, "c": "近傍", "n": "VOLAQUAS [H]  n=1075 cos0.99 難-1.17", "s": 0.329, "f": 0}, {"x": 0.987, "y": -1.01, "c": "近傍", "n": "LIVE DRIVING!! feat. 花たん [H]  n=1707 cos0.99 難-1.01", "s": 0.522, "f": 0}, {"x": 0.986, "y": -1.153, "c": "近傍", "n": "glacia [H]  n=1069 cos0.99 難-1.15", "s": 0.327, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3095123627503399}, {"a": 0, "b": 2, "w": 0.29145522767811094}, {"a": 0, "b": 3, "w": 0.2848198457274118}, {"a": 0, "b": 4, "w": 0.22465701197625831}, {"a": 0, "b": 5, "w": 0.17717791663128013}, {"a": 0, "b": 6, "w": 0.26296773957633546}, {"a": 0, "b": 7, "w": 0.23835134720780726}, {"a": 0, "b": 8, "w": 0.13893082884649477}, {"a": 0, "b": 9, "w": 0.3395640332709068}, {"a": 0, "b": 10, "w": 0.17609409893883476}, {"a": 0, "b": 11, "w": 0.019488493650985372}, {"a": 0, "b": 12, "w": 0.09123953245387684}, {"a": 0, "b": 13, "w": 0.12385653896329352}, {"a": 0, "b": 14, "w": 5.525135904349554e-11}, {"a": 0, "b": 15, "w": 0.12308551393497202}, {"a": 0, "b": 16, "w": 0.17331762713504695}, {"a": 0, "b": 17, "w": 0.182073655022292}, {"a": 0, "b": 18, "w": 0.1222769366967752}, {"a": 0, "b": 19, "w": 0.028259171977106146}, {"a": 0, "b": 20, "w": 0.08941021176405783}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.342,hiY=-0.809;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
