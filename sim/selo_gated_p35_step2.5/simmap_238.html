<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BEAT PRISONER [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.234, "c": "種", "n": "BEAT PRISONER [H]  n=1425 cos1.00 難-1.23", "s": 0.505, "f": 0}, {"x": 0.989, "y": -1.175, "c": "近傍", "n": "chaplet -IIDX re:build- [H]  n=503 cos0.99 難-1.18", "s": 0.178, "f": 0}, {"x": 0.988, "y": -1.29, "c": "近傍", "n": "Donkey Donk [H]  n=1724 cos0.99 難-1.29", "s": 0.611, "f": 0}, {"x": 0.992, "y": -1.043, "c": "近傍", "n": "NOIXIA [H]  n=932 cos0.99 難-1.04", "s": 0.33, "f": 0}, {"x": 0.984, "y": -1.227, "c": "近傍", "n": "Playing With Fire [H]  n=1044 cos0.98 難-1.23", "s": 0.37, "f": 0}, {"x": 0.983, "y": -1.252, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.98 難-1.25", "s": 0.355, "f": 0}, {"x": 0.986, "y": -1.068, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [H]  n=1438 cos0.99 難-1.07", "s": 0.51, "f": 0}, {"x": 0.981, "y": -1.132, "c": "近傍", "n": "Drop Syndicate [H]  n=714 cos0.98 難-1.13", "s": 0.253, "f": 0}, {"x": 0.98, "y": -1.282, "c": "近傍", "n": "Necroxis Girl [H]  n=936 cos0.98 難-1.28", "s": 0.332, "f": 0}, {"x": 0.98, "y": -1.093, "c": "近傍", "n": "Slipstream [H]  n=1475 cos0.98 難-1.09", "s": 0.523, "f": 0}, {"x": 0.983, "y": -1.014, "c": "近傍", "n": "Reflux [H]  n=1964 cos0.98 難-1.01", "s": 0.696, "f": 0}, {"x": 0.978, "y": -1.127, "c": "近傍", "n": "Ghost Pulse [H]  n=824 cos0.98 難-1.13", "s": 0.292, "f": 0}, {"x": 0.983, "y": -1.464, "c": "近傍", "n": "神のシナリオ [H]  n=664 cos0.98 難-1.46", "s": 0.235, "f": 0}, {"x": 0.977, "y": -1.302, "c": "近傍", "n": "Back Spin Sweeper [H]  n=1434 cos0.98 難-1.30", "s": 0.508, "f": 0}, {"x": 0.977, "y": -1.307, "c": "近傍", "n": "Discloze [H]  n=1378 cos0.98 難-1.31", "s": 0.488, "f": 0}, {"x": 0.977, "y": -1.346, "c": "近傍", "n": "Vitrum [H]  n=1212 cos0.98 難-1.35", "s": 0.429, "f": 0}, {"x": 0.977, "y": -1.051, "c": "近傍", "n": "Without Heaven [H]  n=515 cos0.98 難-1.05", "s": 0.182, "f": 0}, {"x": 0.974, "y": -1.16, "c": "近傍", "n": "RAIN [H]  n=1518 cos0.97 難-1.16", "s": 0.538, "f": 0}, {"x": 0.973, "y": -1.154, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.97 難-1.15", "s": 0.555, "f": 0}, {"x": 0.974, "y": -1.113, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=993 cos0.97 難-1.11", "s": 0.352, "f": 0}, {"x": 0.983, "y": -0.903, "c": "近傍", "n": "Godspeed [H]  n=2822 cos0.98 難-0.90", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35833580172009727}, {"a": 0, "b": 2, "w": 0.43068969092220766}, {"a": 0, "b": 3, "w": 0.5397935335926873}, {"a": 0, "b": 4, "w": 0.3022847929283109}, {"a": 0, "b": 5, "w": 0.10831206407279759}, {"a": 0, "b": 6, "w": 0.30275865713921823}, {"a": 0, "b": 7, "w": 0.32411676935548506}, {"a": 0, "b": 8, "w": 0.24152770321602035}, {"a": 0, "b": 9, "w": 0.27471477599826166}, {"a": 0, "b": 10, "w": 0.24542799032417362}, {"a": 0, "b": 11, "w": 0.22653656069295225}, {"a": 0, "b": 12, "w": 0.217074392712172}, {"a": 0, "b": 13, "w": 0.11031621274293457}, {"a": 0, "b": 14, "w": 0.04298295814412356}, {"a": 0, "b": 15, "w": 3.0824121033390384e-11}, {"a": 0, "b": 16, "w": 0.22628696716008012}, {"a": 0, "b": 17, "w": 0.07783839173347473}, {"a": 0, "b": 18, "w": 0.1434427267887749}, {"a": 0, "b": 19, "w": 0.21151650199962468}, {"a": 0, "b": 20, "w": 0.33516389942928493}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.971,hiX=1.002,loY=-1.508,hiY=-0.858;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
