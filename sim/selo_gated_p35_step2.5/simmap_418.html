<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Meteor☆Shower [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.511, "c": "種", "n": "Meteor☆Shower [H]  n=125 cos1.00 難-1.51", "s": 0.07, "f": 0}, {"x": 0.991, "y": -1.525, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1156 cos0.99 難-1.53", "s": 0.651, "f": 0}, {"x": 0.991, "y": -1.544, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.99 難-1.54", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.546, "c": "近傍", "n": "STARLiGHT [H]  n=1530 cos0.99 難-1.55", "s": 0.862, "f": 0}, {"x": 0.993, "y": -1.43, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.43", "s": 0.615, "f": 0}, {"x": 0.989, "y": -1.486, "c": "近傍", "n": "《PL|RAYER》 [H]  n=603 cos0.99 難-1.49", "s": 0.34, "f": 0}, {"x": 0.989, "y": -1.476, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.48", "s": 0.384, "f": 0}, {"x": 0.99, "y": -1.579, "c": "近傍", "n": "Hat Surprise (Season 2) [H]  n=706 cos0.99 難-1.58", "s": 0.398, "f": 0}, {"x": 0.992, "y": -1.421, "c": "近傍", "n": "Jungle Eater [H]  n=1104 cos0.99 難-1.42", "s": 0.622, "f": 0}, {"x": 0.986, "y": -1.54, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [H]  n=1100 cos0.99 難-1.54", "s": 0.62, "f": 0}, {"x": 0.988, "y": -1.588, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1157 cos0.99 難-1.59", "s": 0.652, "f": 0}, {"x": 0.987, "y": -1.582, "c": "近傍", "n": "Parvati [H]  n=735 cos0.99 難-1.58", "s": 0.414, "f": 0}, {"x": 0.997, "y": -1.662, "c": "近傍", "n": "Chemical Colours [H]  n=504 cos1.00 難-1.66", "s": 0.284, "f": 0}, {"x": 0.987, "y": -1.412, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1767 cos0.99 難-1.41", "s": 0.995, "f": 0}, {"x": 0.988, "y": -1.391, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1530 cos0.99 難-1.39", "s": 0.862, "f": 0}, {"x": 0.989, "y": -1.379, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1677 cos0.99 難-1.38", "s": 0.945, "f": 0}, {"x": 0.987, "y": -1.398, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos0.99 難-1.40", "s": 0.767, "f": 0}, {"x": 0.989, "y": -1.663, "c": "近傍", "n": "Ritual of Anubis [H]  n=625 cos0.99 難-1.66", "s": 0.352, "f": 0}, {"x": 0.988, "y": -1.658, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1298 cos0.99 難-1.66", "s": 0.731, "f": 0}, {"x": 0.988, "y": -1.358, "c": "近傍", "n": "Piano Samurai [H]  n=1412 cos0.99 難-1.36", "s": 0.795, "f": 0}, {"x": 0.985, "y": -1.382, "c": "近傍", "n": "最小三倍完全数 [H]  n=1145 cos0.98 難-1.38", "s": 0.645, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.23213080191164437}, {"a": 0, "b": 2, "w": 0.11549694717980585}, {"a": 0, "b": 3, "w": 0.2307946901603134}, {"a": 0, "b": 4, "w": 0.3119291464696906}, {"a": 0, "b": 5, "w": 0.19573504197785874}, {"a": 0, "b": 6, "w": 0.08192539133707244}, {"a": 0, "b": 7, "w": 0.10100349201222081}, {"a": 0, "b": 8, "w": 0.2887181206461168}, {"a": 0, "b": 9, "w": 0.07066167236754162}, {"a": 0, "b": 10, "w": 0.17821890226393167}, {"a": 0, "b": 11, "w": 0.002319371069570808}, {"a": 0, "b": 12, "w": 0.5550089141374219}, {"a": 0, "b": 13, "w": 5.714895223718486e-11}, {"a": 0, "b": 14, "w": 0.1680955179742788}, {"a": 0, "b": 15, "w": 0.06940977119774316}, {"a": 0, "b": 16, "w": 0.11277533974643594}, {"a": 0, "b": 17, "w": 0.20222421706114813}, {"a": 0, "b": 18, "w": 0.03633288864210649}, {"a": 0, "b": 19, "w": 0.12482954555292802}, {"a": 0, "b": 20, "w": 0.06631771977571}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.688,hiY=-1.334;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
