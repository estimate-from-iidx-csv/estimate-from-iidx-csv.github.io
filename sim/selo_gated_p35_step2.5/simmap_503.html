<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Rubrum Piano [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.562, "c": "種", "n": "Rubrum Piano [H]  n=659 cos1.00 難-1.56", "s": 0.371, "f": 0}, {"x": 0.989, "y": -1.588, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1157 cos0.99 難-1.59", "s": 0.652, "f": 0}, {"x": 0.992, "y": -1.663, "c": "近傍", "n": "Ritual of Anubis [H]  n=625 cos0.99 難-1.66", "s": 0.352, "f": 0}, {"x": 0.987, "y": -1.609, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [H]  n=1153 cos0.99 難-1.61", "s": 0.65, "f": 0}, {"x": 0.988, "y": -1.486, "c": "近傍", "n": "《PL|RAYER》 [H]  n=603 cos0.99 難-1.49", "s": 0.34, "f": 0}, {"x": 0.992, "y": -1.43, "c": "近傍", "n": "Wonderland [H]  n=1091 cos0.99 難-1.43", "s": 0.615, "f": 0}, {"x": 0.993, "y": -1.706, "c": "近傍", "n": "儚き恋の華 [H]  n=974 cos0.99 難-1.71", "s": 0.549, "f": 0}, {"x": 0.99, "y": -1.686, "c": "近傍", "n": "Garuda [H]  n=879 cos0.99 難-1.69", "s": 0.495, "f": 0}, {"x": 0.985, "y": -1.525, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1156 cos0.98 難-1.53", "s": 0.651, "f": 0}, {"x": 0.987, "y": -1.676, "c": "近傍", "n": "Break Stasis [H]  n=1191 cos0.99 難-1.68", "s": 0.671, "f": 0}, {"x": 0.987, "y": -1.701, "c": "近傍", "n": "Pout [H]  n=600 cos0.99 難-1.70", "s": 0.338, "f": 0}, {"x": 0.988, "y": -1.723, "c": "近傍", "n": "Victory Of Ravers [H]  n=728 cos0.99 難-1.72", "s": 0.41, "f": 0}, {"x": 0.993, "y": -1.358, "c": "近傍", "n": "Be A Star [H]  n=1614 cos0.99 難-1.36", "s": 0.909, "f": 0}, {"x": 0.987, "y": -1.73, "c": "近傍", "n": "Seraph [H]  n=597 cos0.99 難-1.73", "s": 0.336, "f": 0}, {"x": 0.981, "y": -1.549, "c": "近傍", "n": "C-C-C-N-N-N [H]  n=731 cos0.98 難-1.55", "s": 0.412, "f": 0}, {"x": 0.987, "y": -1.382, "c": "近傍", "n": "最小三倍完全数 [H]  n=1145 cos0.99 難-1.38", "s": 0.645, "f": 0}, {"x": 0.983, "y": -1.705, "c": "近傍", "n": "ウツシミウツシ [H]  n=717 cos0.98 難-1.70", "s": 0.404, "f": 0}, {"x": 0.991, "y": -1.79, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=958 cos0.99 難-1.79", "s": 0.54, "f": 0}, {"x": 0.991, "y": -1.328, "c": "近傍", "n": "GRAVITON [H]  n=1116 cos0.99 難-1.33", "s": 0.629, "f": 0}, {"x": 0.987, "y": -1.358, "c": "近傍", "n": "HAPPY★RUSH [H]  n=1372 cos0.99 難-1.36", "s": 0.773, "f": 0}, {"x": 0.978, "y": -1.544, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1775 cos0.98 難-1.54", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2325404641985419}, {"a": 0, "b": 2, "w": 0.42092191279221003}, {"a": 0, "b": 3, "w": 0.20944768155921623}, {"a": 0, "b": 4, "w": 0.25296775003580163}, {"a": 0, "b": 5, "w": 0.42647243513801214}, {"a": 0, "b": 6, "w": 0.47668437725421664}, {"a": 0, "b": 7, "w": 0.3664660833629031}, {"a": 0, "b": 8, "w": 0.2300259490994211}, {"a": 0, "b": 9, "w": 0.28752453003528555}, {"a": 0, "b": 10, "w": 0.2791956673571282}, {"a": 0, "b": 11, "w": 0.2852335715773302}, {"a": 0, "b": 12, "w": 0.4602552265717156}, {"a": 0, "b": 13, "w": 0.2888016537253144}, {"a": 0, "b": 14, "w": 5.052125384708006e-11}, {"a": 0, "b": 15, "w": 0.2363464794678114}, {"a": 0, "b": 16, "w": 0.17700930280461946}, {"a": 0, "b": 17, "w": 0.40960838356689133}, {"a": 0, "b": 18, "w": 0.40906223721387436}, {"a": 0, "b": 19, "w": 0.19423610684881232}, {"a": 0, "b": 20, "w": 0.06577291204210967}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.827,hiY=-1.291;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
