<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HAERETICUS [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.256, "c": "種", "n": "HAERETICUS [H]  n=2683 cos1.00 難-0.26", "s": 0.777, "f": 0}, {"x": 0.992, "y": -0.164, "c": "近傍", "n": "STEEL NEEDLE [H]  n=2604 cos0.99 難-0.16", "s": 0.754, "f": 0}, {"x": 0.991, "y": -0.193, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1141 cos0.99 難-0.19", "s": 0.33, "f": 0}, {"x": 0.99, "y": -0.4, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3011 cos0.99 難-0.40", "s": 0.871, "f": 0}, {"x": 0.989, "y": -0.347, "c": "近傍", "n": "AGEHA [A]  n=3020 cos0.99 難-0.35", "s": 0.874, "f": 0}, {"x": 0.989, "y": -0.142, "c": "近傍", "n": "子供の落書き帳 [H]  n=2786 cos0.99 難-0.14", "s": 0.806, "f": 0}, {"x": 0.99, "y": -0.531, "c": "近傍", "n": "waxing and wanding [H]  n=3324 cos0.99 難-0.53", "s": 0.962, "f": 0}, {"x": 0.989, "y": -0.458, "c": "近傍", "n": "Elemental Creation [H]  n=3340 cos0.99 難-0.46", "s": 0.967, "f": 0}, {"x": 0.988, "y": -0.232, "c": "近傍", "n": "Go Beyond!! [H]  n=3455 cos0.99 難-0.23", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.281, "c": "近傍", "n": "DOMINION [H]  n=2932 cos0.99 難-0.28", "s": 0.849, "f": 0}, {"x": 0.987, "y": -0.264, "c": "近傍", "n": "fffff [H]  n=3223 cos0.99 難-0.26", "s": 0.933, "f": 0}, {"x": 0.987, "y": -0.341, "c": "近傍", "n": "CaptivAte～裁き～ [A]  n=2980 cos0.99 難-0.34", "s": 0.863, "f": 0}, {"x": 0.988, "y": -0.024, "c": "近傍", "n": "Backyard Stars [A]  n=2698 cos0.99 難-0.02", "s": 0.781, "f": 0}, {"x": 0.99, "y": -0.66, "c": "近傍", "n": "Nightmare before oversleep [H]  n=2374 cos0.99 難-0.66", "s": 0.687, "f": 0}, {"x": 0.987, "y": -0.398, "c": "近傍", "n": "Harmonia [A]  n=2407 cos0.99 難-0.40", "s": 0.697, "f": 0}, {"x": 0.989, "y": -0.617, "c": "近傍", "n": "Close the World feat.a☆ru [H]  n=3019 cos0.99 難-0.62", "s": 0.874, "f": 0}, {"x": 0.986, "y": -0.078, "c": "近傍", "n": "Karma [A]  n=2668 cos0.99 難-0.08", "s": 0.772, "f": 0}, {"x": 0.986, "y": -0.268, "c": "近傍", "n": "Devilz Staircase [H]  n=2866 cos0.99 難-0.27", "s": 0.83, "f": 0}, {"x": 0.986, "y": -0.017, "c": "近傍", "n": "Sweet Sweet Magic [A]  n=2816 cos0.99 難-0.02", "s": 0.815, "f": 0}, {"x": 0.985, "y": -0.324, "c": "近傍", "n": "NNRT [H]  n=2898 cos0.99 難-0.32", "s": 0.839, "f": 0}, {"x": 0.99, "y": 0.246, "c": "近傍", "n": "忍恋花 [A]  n=3299 cos0.99 難0.25", "s": 0.955, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3738593243057057}, {"a": 0, "b": 2, "w": 0.32414043776340107}, {"a": 0, "b": 3, "w": 0.22205808214630907}, {"a": 0, "b": 4, "w": 0.2183315824941643}, {"a": 0, "b": 5, "w": 0.2333716904405757}, {"a": 0, "b": 6, "w": 0.309499564421966}, {"a": 0, "b": 7, "w": 0.23892648255667082}, {"a": 0, "b": 8, "w": 4.8038462097110823e-11}, {"a": 0, "b": 9, "w": 0.16692666594068606}, {"a": 0, "b": 10, "w": 0.19126531134777647}, {"a": 0, "b": 11, "w": 0.05998735267919297}, {"a": 0, "b": 12, "w": 0.2143016735533756}, {"a": 0, "b": 13, "w": 0.2823496464630886}, {"a": 0, "b": 14, "w": 0.17934541284026462}, {"a": 0, "b": 15, "w": 0.24658658166747238}, {"a": 0, "b": 16, "w": 0.148427347732338}, {"a": 0, "b": 17, "w": 0.10350142342810831}, {"a": 0, "b": 18, "w": 0.17169103571727973}, {"a": 0, "b": 19, "w": 0.04850302205627388}, {"a": 0, "b": 20, "w": 0.21041762912557083}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.733,hiY=0.319;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
