<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ALTERNATOR [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.55, "c": "種", "n": "ALTERNATOR [A]  n=2280 cos1.00 難1.55", "s": 0.71, "f": 0}, {"x": 0.991, "y": 1.516, "c": "近傍", "n": "Triple Counter [A]  n=3130 cos0.99 難1.52", "s": 0.975, "f": 0}, {"x": 0.992, "y": 1.632, "c": "近傍", "n": "Empire of Fury [A]  n=2434 cos0.99 難1.63", "s": 0.758, "f": 0}, {"x": 0.985, "y": 1.521, "c": "近傍", "n": "HAERETICUS [A]  n=3064 cos0.99 難1.52", "s": 0.954, "f": 0}, {"x": 0.985, "y": 1.601, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2753 cos0.99 難1.60", "s": 0.857, "f": 0}, {"x": 0.987, "y": 1.464, "c": "近傍", "n": "TRIUMPH [A]  n=2893 cos0.99 難1.46", "s": 0.901, "f": 0}, {"x": 0.994, "y": 1.425, "c": "近傍", "n": "DEADHEAT [A]  n=3004 cos0.99 難1.43", "s": 0.936, "f": 0}, {"x": 0.981, "y": 1.59, "c": "近傍", "n": "O/D*20 [L]  n=1303 cos0.98 難1.59", "s": 0.406, "f": 0}, {"x": 0.986, "y": 1.651, "c": "近傍", "n": "Macho Monky [A]  n=2727 cos0.99 難1.65", "s": 0.849, "f": 0}, {"x": 0.989, "y": 1.405, "c": "近傍", "n": "BLUE DRAGON(雷龍RemixIIDX) [A]  n=3211 cos0.99 難1.41", "s": 1.0, "f": 0}, {"x": 0.979, "y": 1.482, "c": "近傍", "n": "ATHER [L]  n=1585 cos0.98 難1.48", "s": 0.494, "f": 0}, {"x": 0.992, "y": 1.384, "c": "近傍", "n": "電腦都市 [A]  n=1375 cos0.99 難1.38", "s": 0.428, "f": 0}, {"x": 0.977, "y": 1.608, "c": "近傍", "n": "THE BRAVE MUST DIE [A]  n=2704 cos0.98 難1.61", "s": 0.842, "f": 0}, {"x": 0.987, "y": 1.396, "c": "近傍", "n": "Monopole. [A]  n=3176 cos0.99 難1.40", "s": 0.989, "f": 0}, {"x": 0.988, "y": 1.388, "c": "近傍", "n": "rommmo [A]  n=2584 cos0.99 難1.39", "s": 0.805, "f": 0}, {"x": 0.986, "y": 1.396, "c": "近傍", "n": "Lightspeed [A]  n=1144 cos0.99 難1.40", "s": 0.356, "f": 0}, {"x": 0.992, "y": 1.727, "c": "近傍", "n": "Marie Antoinette [L]  n=1729 cos0.99 難1.73", "s": 0.538, "f": 0}, {"x": 0.979, "y": 1.657, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2719 cos0.98 難1.66", "s": 0.847, "f": 0}, {"x": 0.98, "y": 1.427, "c": "近傍", "n": "Caldwell 99 [L]  n=965 cos0.98 難1.43", "s": 0.301, "f": 0}, {"x": 0.988, "y": 1.376, "c": "近傍", "n": "One for All [A]  n=2203 cos0.99 難1.38", "s": 0.686, "f": 0}, {"x": 0.988, "y": 1.367, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2273 cos0.99 難1.37", "s": 0.708, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34837866550253527}, {"a": 0, "b": 2, "w": 0.3466966491354264}, {"a": 0, "b": 3, "w": 0.14740478302647408}, {"a": 0, "b": 4, "w": 0.20313147887204086}, {"a": 0, "b": 5, "w": 0.2530707838444808}, {"a": 0, "b": 6, "w": 0.36287726304003787}, {"a": 0, "b": 7, "w": 0.08564835099062829}, {"a": 0, "b": 8, "w": 0.20526822278769274}, {"a": 0, "b": 9, "w": 0.3039180080793098}, {"a": 0, "b": 10, "w": 0.005647473393006197}, {"a": 0, "b": 11, "w": 0.35866165802276007}, {"a": 0, "b": 12, "w": 2.930833353786966e-11}, {"a": 0, "b": 13, "w": 0.20624119681752096}, {"a": 0, "b": 14, "w": 0.23892333435002622}, {"a": 0, "b": 15, "w": 0.07416106513295517}, {"a": 0, "b": 16, "w": 0.20823725045983477}, {"a": 0, "b": 17, "w": 0.046584399742398475}, {"a": 0, "b": 18, "w": 0.032904085800883}, {"a": 0, "b": 19, "w": 0.286872867904008}, {"a": 0, "b": 20, "w": 0.28052286440985785}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=1.339,hiY=1.756;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
