<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">

 <div id="legend"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.635, "c": "種", "n": "Bling-Bang-Bang-Born [L]  n=880 cos1.00 難0.63", "s": 0.232, "f": 0}, {"x": 0.991, "y": 0.742, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1748 cos0.99 難0.74", "s": 0.461, "f": 0}, {"x": 0.987, "y": 0.741, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3244 cos0.99 難0.74", "s": 0.856, "f": 0}, {"x": 0.984, "y": 0.708, "c": "近傍", "n": "Just a Little Smile [A]  n=3393 cos0.98 難0.71", "s": 0.895, "f": 0}, {"x": 0.981, "y": 0.68, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2172 cos0.98 難0.68", "s": 0.573, "f": 0}, {"x": 0.981, "y": 0.456, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [H]  n=3791 cos0.98 難0.46", "s": 1.0, "f": 0}, {"x": 0.984, "y": 0.384, "c": "近傍", "n": "Digitank System [A]  n=3622 cos0.98 難0.38", "s": 0.955, "f": 0}, {"x": 0.982, "y": 0.402, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3347 cos0.98 難0.40", "s": 0.883, "f": 0}, {"x": 0.98, "y": 0.416, "c": "近傍", "n": "With You [A]  n=2139 cos0.98 難0.42", "s": 0.564, "f": 0}, {"x": 0.975, "y": 0.625, "c": "近傍", "n": "Routing [A]  n=3451 cos0.98 難0.62", "s": 0.91, "f": 0}, {"x": 0.985, "y": 0.31, "c": "近傍", "n": "27th style [A]  n=2980 cos0.98 難0.31", "s": 0.786, "f": 0}, {"x": 0.982, "y": 0.349, "c": "近傍", "n": "Catch Me [L]  n=733 cos0.98 難0.35", "s": 0.193, "f": 0}, {"x": 0.983, "y": 0.955, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3286 cos0.98 難0.95", "s": 0.867, "f": 0}, {"x": 0.978, "y": 0.401, "c": "近傍", "n": "ベラ・ベ・カラベラ [A]  n=1108 cos0.98 難0.40", "s": 0.292, "f": 0}, {"x": 0.978, "y": 0.883, "c": "近傍", "n": "Theory [A]  n=2922 cos0.98 難0.88", "s": 0.771, "f": 0}, {"x": 0.976, "y": 0.436, "c": "近傍", "n": "とろぴかる倶楽部 [A]  n=3233 cos0.98 難0.44", "s": 0.853, "f": 0}, {"x": 0.974, "y": 0.449, "c": "近傍", "n": "Uh-Oh [A]  n=3506 cos0.97 難0.45", "s": 0.925, "f": 0}, {"x": 0.971, "y": 0.567, "c": "近傍", "n": "カジノファイヤーことみちゃん [A]  n=3426 cos0.97 難0.57", "s": 0.904, "f": 0}, {"x": 0.969, "y": 0.619, "c": "近傍", "n": "Beat Juggling Mix [A]  n=3216 cos0.97 難0.62", "s": 0.848, "f": 0}, {"x": 0.974, "y": 0.34, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2979 cos0.97 難0.34", "s": 0.786, "f": 0}, {"x": 0.971, "y": 0.378, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3740 cos0.97 難0.38", "s": 0.987, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.527119946748195}, {"a": 0, "b": 2, "w": 0.34206383153720465}, {"a": 0, "b": 3, "w": 0.3198371088812386}, {"a": 0, "b": 4, "w": 0.38743941378402813}, {"a": 0, "b": 5, "w": 0.36542019829736205}, {"a": 0, "b": 6, "w": 0.25031673731445303}, {"a": 0, "b": 7, "w": 0.14528906814431453}, {"a": 0, "b": 8, "w": 0.2791434009701502}, {"a": 0, "b": 9, "w": 0.2776630275148171}, {"a": 0, "b": 10, "w": 0.35641312693106575}, {"a": 0, "b": 11, "w": 0.2493504493238632}, {"a": 0, "b": 12, "w": 0.4179892095014348}, {"a": 0, "b": 13, "w": 0.3337712190721671}, {"a": 0, "b": 14, "w": 0.3296389706399089}, {"a": 0, "b": 15, "w": 0.19955717361260716}, {"a": 0, "b": 16, "w": 0.1773427071335384}, {"a": 0, "b": 17, "w": 0.2058911426348048}, {"a": 0, "b": 18, "w": 0.20739351310481147}, {"a": 0, "b": 19, "w": 2.1603607791575996e-11}, {"a": 0, "b": 20, "w": 0.1250552122652585}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.966,hiX=1.002,loY=0.258,hiY=1.007;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
