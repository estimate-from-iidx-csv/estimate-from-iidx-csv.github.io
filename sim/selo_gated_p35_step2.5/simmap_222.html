<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Around the Future [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.284, "c": "種", "n": "Around the Future [H]  n=1288 cos1.00 難-1.28", "s": 0.679, "f": 0}, {"x": 0.99, "y": -1.213, "c": "近傍", "n": "Inner Spirit [H]  n=1473 cos0.99 難-1.21", "s": 0.776, "f": 0}, {"x": 0.987, "y": -1.327, "c": "近傍", "n": "Matt Silver [H]  n=1138 cos0.99 難-1.33", "s": 0.6, "f": 0}, {"x": 0.986, "y": -1.228, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.99 難-1.23", "s": 0.797, "f": 0}, {"x": 0.984, "y": -1.305, "c": "近傍", "n": "I Love You [H]  n=1154 cos0.98 難-1.31", "s": 0.608, "f": 0}, {"x": 0.99, "y": -1.171, "c": "近傍", "n": "Bring The Fire [H]  n=669 cos0.99 難-1.17", "s": 0.352, "f": 0}, {"x": 0.985, "y": -1.353, "c": "近傍", "n": "Abraxas [H]  n=1533 cos0.99 難-1.35", "s": 0.808, "f": 0}, {"x": 0.982, "y": -1.312, "c": "近傍", "n": "XINOBIKILL [H]  n=1497 cos0.98 難-1.31", "s": 0.789, "f": 0}, {"x": 0.988, "y": -1.422, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.42", "s": 0.586, "f": 0}, {"x": 0.983, "y": -1.412, "c": "近傍", "n": "Sirius [H]  n=512 cos0.98 難-1.41", "s": 0.27, "f": 0}, {"x": 0.978, "y": -1.346, "c": "近傍", "n": "Scarlet Moon [H]  n=1836 cos0.98 難-1.35", "s": 0.967, "f": 0}, {"x": 0.978, "y": -1.232, "c": "近傍", "n": "Usual Days-remix [H]  n=1249 cos0.98 難-1.23", "s": 0.658, "f": 0}, {"x": 0.981, "y": -1.167, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.98 難-1.17", "s": 0.811, "f": 0}, {"x": 0.977, "y": -1.295, "c": "近傍", "n": "Disco Killer Music Lover [H]  n=555 cos0.98 難-1.30", "s": 0.292, "f": 0}, {"x": 0.986, "y": -1.45, "c": "近傍", "n": "Rising in the Sun(original mix) [H]  n=639 cos0.99 難-1.45", "s": 0.337, "f": 0}, {"x": 0.977, "y": -1.303, "c": "近傍", "n": "Routing [H]  n=1898 cos0.98 難-1.30", "s": 1.0, "f": 0}, {"x": 0.976, "y": -1.323, "c": "近傍", "n": "ZEPHYRANTHES [H]  n=1643 cos0.98 難-1.32", "s": 0.866, "f": 0}, {"x": 0.975, "y": -1.294, "c": "近傍", "n": "Amazing Mirage [H]  n=1856 cos0.98 難-1.29", "s": 0.978, "f": 0}, {"x": 0.98, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.98 難-1.16", "s": 0.785, "f": 0}, {"x": 0.975, "y": -1.294, "c": "近傍", "n": "24h Endurance Race [H]  n=878 cos0.98 難-1.29", "s": 0.463, "f": 0}, {"x": 0.975, "y": -1.228, "c": "近傍", "n": "Million Dollar [H]  n=723 cos0.98 難-1.23", "s": 0.381, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4529200140200409}, {"a": 0, "b": 2, "w": 0.38292843477438443}, {"a": 0, "b": 3, "w": 0.33842463092544006}, {"a": 0, "b": 4, "w": 0.3039915255189224}, {"a": 0, "b": 5, "w": 0.4455651059589669}, {"a": 0, "b": 6, "w": 0.3247439315909969}, {"a": 0, "b": 7, "w": 0.2646158241257507}, {"a": 0, "b": 8, "w": 0.3867621859689002}, {"a": 0, "b": 9, "w": 0.2932015920672303}, {"a": 0, "b": 10, "w": 0.09213342328387175}, {"a": 0, "b": 11, "w": 0.05856862306931787}, {"a": 0, "b": 12, "w": 0.2405130403761937}, {"a": 0, "b": 13, "w": 0.16558275636692477}, {"a": 0, "b": 14, "w": 0.34367577482205125}, {"a": 0, "b": 15, "w": 0.15629632855549225}, {"a": 0, "b": 16, "w": 0.1516056765406255}, {"a": 0, "b": 17, "w": 0.1334863669703361}, {"a": 0, "b": 18, "w": 0.21600859751786916}, {"a": 0, "b": 19, "w": 0.07002090490899537}, {"a": 0, "b": 20, "w": 4.04085653826769e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=-1.473,hiY=-1.135;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
