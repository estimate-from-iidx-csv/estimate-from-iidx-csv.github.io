<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">冥 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.24, "c": "種", "n": "冥 [H]  n=3743 cos1.00 難-0.24", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.195, "c": "近傍", "n": "four pieces of heaven [H]  n=2619 cos0.99 難-0.20", "s": 0.7, "f": 0}, {"x": 0.995, "y": -0.4, "c": "近傍", "n": "DropZ-Line- [H]  n=1722 cos0.99 難-0.40", "s": 0.46, "f": 0}, {"x": 0.99, "y": -0.159, "c": "近傍", "n": "少年A [H]  n=2696 cos0.99 難-0.16", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.325, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2462 cos0.99 難-0.32", "s": 0.658, "f": 0}, {"x": 0.988, "y": -0.329, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.33", "s": 0.87, "f": 0}, {"x": 0.988, "y": -0.102, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3078 cos0.99 難-0.10", "s": 0.822, "f": 0}, {"x": 0.988, "y": -0.402, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.40", "s": 0.665, "f": 0}, {"x": 0.985, "y": -0.238, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.24", "s": 0.883, "f": 0}, {"x": 0.985, "y": -0.209, "c": "近傍", "n": "1st Samurai [H]  n=2308 cos0.98 難-0.21", "s": 0.617, "f": 0}, {"x": 0.984, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.98 難-0.26", "s": 0.83, "f": 0}, {"x": 0.984, "y": -0.234, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.98 難-0.23", "s": 0.618, "f": 0}, {"x": 0.985, "y": -0.364, "c": "近傍", "n": "Blue Spring Express [H]  n=2402 cos0.98 難-0.36", "s": 0.642, "f": 0}, {"x": 0.983, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.98 難-0.26", "s": 0.638, "f": 0}, {"x": 0.985, "y": -0.076, "c": "近傍", "n": "ICARUS [H]  n=3028 cos0.98 難-0.08", "s": 0.809, "f": 0}, {"x": 0.983, "y": -0.347, "c": "近傍", "n": "Ubertreffen [H]  n=3087 cos0.98 難-0.35", "s": 0.825, "f": 0}, {"x": 0.984, "y": -0.43, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos0.98 難-0.43", "s": 0.872, "f": 0}, {"x": 0.983, "y": -0.386, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.98 難-0.39", "s": 0.835, "f": 0}, {"x": 0.982, "y": -0.111, "c": "近傍", "n": "聖人の塔 [H]  n=2717 cos0.98 難-0.11", "s": 0.726, "f": 0}, {"x": 0.982, "y": -0.105, "c": "近傍", "n": "BRAVE OUT [A]  n=2845 cos0.98 難-0.11", "s": 0.76, "f": 0}, {"x": 0.981, "y": -0.302, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2898 cos0.98 難-0.30", "s": 0.774, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4637178167595192}, {"a": 0, "b": 2, "w": 0.5811893066805406}, {"a": 0, "b": 3, "w": 0.37162370812513257}, {"a": 0, "b": 4, "w": 0.31692834451140806}, {"a": 0, "b": 5, "w": 0.34518610262759586}, {"a": 0, "b": 6, "w": 0.37550814476791194}, {"a": 0, "b": 7, "w": 0.31384799471390057}, {"a": 0, "b": 8, "w": 0.2545673944907574}, {"a": 0, "b": 9, "w": 0.2585153808403764}, {"a": 0, "b": 10, "w": 0.1149015860937661}, {"a": 0, "b": 11, "w": 0.2649919824068513}, {"a": 0, "b": 12, "w": 0.2884094669251388}, {"a": 0, "b": 13, "w": 3.5771940964934856e-11}, {"a": 0, "b": 14, "w": 0.290938720312672}, {"a": 0, "b": 15, "w": 0.20083923268703252}, {"a": 0, "b": 16, "w": 0.2648404553990489}, {"a": 0, "b": 17, "w": 0.2266300680108132}, {"a": 0, "b": 18, "w": 0.23989641767431824}, {"a": 0, "b": 19, "w": 0.10416040041304964}, {"a": 0, "b": 20, "w": 0.08183220711003836}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=-0.458,hiY=-0.048;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
