<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lawes's Parotia [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.031, "c": "種", "n": "Lawes's Parotia [A]  n=2528 cos1.00 難-0.03", "s": 0.69, "f": 0}, {"x": 0.994, "y": 0.03, "c": "近傍", "n": "Beyond The Seven [A]  n=3555 cos0.99 難0.03", "s": 0.97, "f": 0}, {"x": 0.996, "y": 0.102, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2221 cos1.00 難0.10", "s": 0.606, "f": 0}, {"x": 0.994, "y": -0.037, "c": "近傍", "n": "AMRITA -不滅ノ花- [A]  n=2877 cos0.99 難-0.04", "s": 0.785, "f": 0}, {"x": 0.994, "y": 0.013, "c": "近傍", "n": "朧 [L]  n=3664 cos0.99 難0.01", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.077, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [A]  n=2928 cos0.99 難0.08", "s": 0.799, "f": 0}, {"x": 0.993, "y": -0.087, "c": "近傍", "n": "GRID KNIGHT [A]  n=2766 cos0.99 難-0.09", "s": 0.755, "f": 0}, {"x": 0.993, "y": 0.064, "c": "近傍", "n": "Plea Per Phase [A]  n=1029 cos0.99 難0.06", "s": 0.281, "f": 0}, {"x": 0.995, "y": 0.137, "c": "近傍", "n": "Programmed World [A]  n=3471 cos0.99 難0.14", "s": 0.947, "f": 0}, {"x": 0.994, "y": 0.107, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1818 cos0.99 難0.11", "s": 0.496, "f": 0}, {"x": 0.994, "y": 0.122, "c": "近傍", "n": "Timepiece phase II [H]  n=2933 cos0.99 難0.12", "s": 0.8, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "The Sky of Sadness [A]  n=2249 cos0.99 難-0.20", "s": 0.614, "f": 0}, {"x": 0.993, "y": 0.02, "c": "近傍", "n": "X-ray binary [A]  n=2522 cos0.99 難0.02", "s": 0.688, "f": 0}, {"x": 0.994, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos0.99 難0.15", "s": 0.524, "f": 0}, {"x": 0.993, "y": 0.056, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos0.99 難0.06", "s": 0.616, "f": 0}, {"x": 0.992, "y": 0.005, "c": "近傍", "n": "RAVE SYNDROME [A]  n=1568 cos0.99 難0.01", "s": 0.428, "f": 0}, {"x": 0.993, "y": 0.097, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1764 cos0.99 難0.10", "s": 0.481, "f": 0}, {"x": 0.995, "y": 0.189, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2882 cos1.00 難0.19", "s": 0.787, "f": 0}, {"x": 0.992, "y": -0.015, "c": "近傍", "n": "Beautiful Harmony (IIDX Mix) [A]  n=2580 cos0.99 難-0.01", "s": 0.704, "f": 0}, {"x": 0.992, "y": 0.106, "c": "近傍", "n": "Emera [A]  n=2046 cos0.99 難0.11", "s": 0.558, "f": 0}, {"x": 0.994, "y": 0.191, "c": "近傍", "n": "BabeL ～Grand Story～ [A]  n=3347 cos0.99 難0.19", "s": 0.913, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2770465161797092}, {"a": 0, "b": 2, "w": 0.31901042737951346}, {"a": 0, "b": 3, "w": 0.2479518573659547}, {"a": 0, "b": 4, "w": 0.19520627020450443}, {"a": 0, "b": 5, "w": 0.03406991853900221}, {"a": 0, "b": 6, "w": 0.19092982367946343}, {"a": 0, "b": 7, "w": 0.21552603721116292}, {"a": 0, "b": 8, "w": 0.30157490489387484}, {"a": 0, "b": 9, "w": 0.1614493273084332}, {"a": 0, "b": 10, "w": 0.2620922263400344}, {"a": 0, "b": 11, "w": 0.1809323499169696}, {"a": 0, "b": 12, "w": 0.16832899320756578}, {"a": 0, "b": 13, "w": 0.19131744752519764}, {"a": 0, "b": 14, "w": 0.11707428697046329}, {"a": 0, "b": 15, "w": 0.08615452381482369}, {"a": 0, "b": 16, "w": 0.03732736090229338}, {"a": 0, "b": 17, "w": 0.26091093946195854}, {"a": 0, "b": 18, "w": 0.03829958702340963}, {"a": 0, "b": 19, "w": 5.933442626115948e-11}, {"a": 0, "b": 20, "w": 0.09546762283377086}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.226,hiY=0.222;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
