<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">めいさいアイドル☆あいむちゃん♪ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.472, "c": "種", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2544 cos1.00 難-0.47", "s": 0.725, "f": 0}, {"x": 0.998, "y": -0.367, "c": "近傍", "n": "Proof of the existence [H]  n=2878 cos1.00 難-0.37", "s": 0.82, "f": 0}, {"x": 0.997, "y": -0.356, "c": "近傍", "n": "Answer [A]  n=3214 cos1.00 難-0.36", "s": 0.916, "f": 0}, {"x": 0.998, "y": -0.325, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.32", "s": 0.677, "f": 0}, {"x": 0.996, "y": -0.475, "c": "近傍", "n": "異心前進♪ぴょんぴょんぴょん [A]  n=1538 cos1.00 難-0.47", "s": 0.438, "f": 0}, {"x": 0.995, "y": -0.45, "c": "近傍", "n": "ZZ [H]  n=3341 cos1.00 難-0.45", "s": 0.952, "f": 0}, {"x": 0.996, "y": -0.374, "c": "近傍", "n": "Shooting Fireball [H]  n=2564 cos1.00 難-0.37", "s": 0.731, "f": 0}, {"x": 0.996, "y": -0.356, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2475 cos1.00 難-0.36", "s": 0.705, "f": 0}, {"x": 0.996, "y": -0.4, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3509 cos1.00 難-0.40", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.547, "c": "近傍", "n": "KILL EACH OTHER [H]  n=2022 cos1.00 難-0.55", "s": 0.576, "f": 0}, {"x": 0.997, "y": -0.302, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2483 cos1.00 難-0.30", "s": 0.708, "f": 0}, {"x": 0.996, "y": -0.613, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2444 cos1.00 難-0.61", "s": 0.696, "f": 0}, {"x": 0.996, "y": -0.34, "c": "近傍", "n": "Summerblue [A]  n=2192 cos1.00 難-0.34", "s": 0.625, "f": 0}, {"x": 0.995, "y": -0.59, "c": "近傍", "n": "津軽雪 [H]  n=2598 cos1.00 難-0.59", "s": 0.74, "f": 0}, {"x": 0.995, "y": -0.609, "c": "近傍", "n": "DROP [H]  n=1812 cos1.00 難-0.61", "s": 0.516, "f": 0}, {"x": 0.994, "y": -0.415, "c": "近傍", "n": "Nyan Nyan University [A]  n=1120 cos0.99 難-0.42", "s": 0.319, "f": 0}, {"x": 0.994, "y": -0.442, "c": "近傍", "n": "True Blue [H]  n=3057 cos0.99 難-0.44", "s": 0.871, "f": 0}, {"x": 0.994, "y": -0.365, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2769 cos0.99 難-0.36", "s": 0.789, "f": 0}, {"x": 0.994, "y": -0.38, "c": "近傍", "n": "refrain [H]  n=2585 cos0.99 難-0.38", "s": 0.737, "f": 0}, {"x": 0.994, "y": -0.432, "c": "近傍", "n": "Zirkfied [H]  n=2986 cos0.99 難-0.43", "s": 0.851, "f": 0}, {"x": 0.994, "y": -0.362, "c": "近傍", "n": "Arabian Rave Night [H]  n=2709 cos0.99 難-0.36", "s": 0.772, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5734965463930705}, {"a": 0, "b": 2, "w": 0.4115976142398934}, {"a": 0, "b": 3, "w": 0.563373342063026}, {"a": 0, "b": 4, "w": 0.21479761241523565}, {"a": 0, "b": 5, "w": 0.17845788652588868}, {"a": 0, "b": 6, "w": 0.34065958002378205}, {"a": 0, "b": 7, "w": 0.25338506320864096}, {"a": 0, "b": 8, "w": 0.20494441568582944}, {"a": 0, "b": 9, "w": 0.17703713302481894}, {"a": 0, "b": 10, "w": 0.3640798773952961}, {"a": 0, "b": 11, "w": 0.30378978744067164}, {"a": 0, "b": 12, "w": 0.3198570008450471}, {"a": 0, "b": 13, "w": 0.24086257368880293}, {"a": 0, "b": 14, "w": 0.1577680613519341}, {"a": 0, "b": 15, "w": 7.291289794153499e-11}, {"a": 0, "b": 16, "w": 0.1690115901526611}, {"a": 0, "b": 17, "w": 0.11834300034795553}, {"a": 0, "b": 18, "w": 0.1361084653054302}, {"a": 0, "b": 19, "w": 0.14261154730882886}, {"a": 0, "b": 20, "w": 0.02268079016226976}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.638,hiY=-0.277;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
