<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">switch [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.363, "c": "種", "n": "switch [A]  n=3109 cos1.00 難0.36", "s": 0.85, "f": 0}, {"x": 0.992, "y": 0.278, "c": "近傍", "n": "neogenesis [L]  n=1514 cos0.99 難0.28", "s": 0.414, "f": 0}, {"x": 0.991, "y": 0.312, "c": "近傍", "n": "Overslept [A]  n=2562 cos0.99 難0.31", "s": 0.701, "f": 0}, {"x": 0.991, "y": 0.272, "c": "近傍", "n": "I'm so Happy [A]  n=3633 cos0.99 難0.27", "s": 0.993, "f": 0}, {"x": 0.99, "y": 0.298, "c": "近傍", "n": "bloomin' feeling [A]  n=3657 cos0.99 難0.30", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.106, "c": "近傍", "n": "Quickening [A]  n=2769 cos0.99 難0.11", "s": 0.757, "f": 0}, {"x": 0.989, "y": 0.256, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.99 難0.26", "s": 0.645, "f": 0}, {"x": 0.989, "y": 0.266, "c": "近傍", "n": "Sun Field [A]  n=3143 cos0.99 難0.27", "s": 0.859, "f": 0}, {"x": 0.988, "y": 0.377, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2693 cos0.99 難0.38", "s": 0.736, "f": 0}, {"x": 0.99, "y": 0.122, "c": "近傍", "n": "Timepiece phase II [H]  n=2933 cos0.99 難0.12", "s": 0.802, "f": 0}, {"x": 0.99, "y": 0.137, "c": "近傍", "n": "Programmed World [A]  n=3471 cos0.99 難0.14", "s": 0.949, "f": 0}, {"x": 0.99, "y": 0.14, "c": "近傍", "n": "Butterfly Twist [A]  n=1007 cos0.99 難0.14", "s": 0.275, "f": 0}, {"x": 0.988, "y": 0.285, "c": "近傍", "n": "Discloze [A]  n=3149 cos0.99 難0.29", "s": 0.861, "f": 0}, {"x": 0.988, "y": 0.376, "c": "近傍", "n": "Back Spin Sweeper [A]  n=3245 cos0.99 難0.38", "s": 0.887, "f": 0}, {"x": 0.988, "y": 0.475, "c": "近傍", "n": "Aegis [A]  n=3425 cos0.99 難0.48", "s": 0.937, "f": 0}, {"x": 0.988, "y": 0.272, "c": "近傍", "n": "Ubertreffen [A]  n=3511 cos0.99 難0.27", "s": 0.96, "f": 0}, {"x": 0.987, "y": 0.382, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.99 難0.38", "s": 0.909, "f": 0}, {"x": 0.987, "y": 0.378, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2671 cos0.99 難0.38", "s": 0.73, "f": 0}, {"x": 0.993, "y": 0.733, "c": "近傍", "n": "TRANOID [A]  n=3073 cos0.99 難0.73", "s": 0.84, "f": 0}, {"x": 0.987, "y": 0.414, "c": "近傍", "n": "Giudecca [A]  n=3156 cos0.99 難0.41", "s": 0.863, "f": 0}, {"x": 0.989, "y": 0.12, "c": "近傍", "n": "Be quiet [A]  n=3611 cos0.99 難0.12", "s": 0.987, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24888281372792065}, {"a": 0, "b": 2, "w": 0.23730245392381943}, {"a": 0, "b": 3, "w": 0.11570575068768452}, {"a": 0, "b": 4, "w": 4.788425211899039e-11}, {"a": 0, "b": 5, "w": 0.12976926926328147}, {"a": 0, "b": 6, "w": 0.15379158331707543}, {"a": 0, "b": 7, "w": 0.1276502716307618}, {"a": 0, "b": 8, "w": 0.12726153676332852}, {"a": 0, "b": 9, "w": 0.18129123646923928}, {"a": 0, "b": 10, "w": 0.16366282863164894}, {"a": 0, "b": 11, "w": 0.03237240292139398}, {"a": 0, "b": 12, "w": 0.10656206545235392}, {"a": 0, "b": 13, "w": 0.10097734725627927}, {"a": 0, "b": 14, "w": 0.05455029745082396}, {"a": 0, "b": 15, "w": 0.10020769191856771}, {"a": 0, "b": 16, "w": 0.09760489728926969}, {"a": 0, "b": 17, "w": 0.030153947272515413}, {"a": 0, "b": 18, "w": 0.23120358238016214}, {"a": 0, "b": 19, "w": 0.08677704615236304}, {"a": 0, "b": 20, "w": 0.14186849757603215}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.056,hiY=0.784;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
