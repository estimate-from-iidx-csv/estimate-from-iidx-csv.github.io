<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Godspeed [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.276, "c": "種", "n": "Godspeed [A]  n=3315 cos1.00 難1.28", "s": 0.987, "f": 0}, {"x": 0.991, "y": 1.31, "c": "近傍", "n": "ruin of opals [A]  n=2755 cos0.99 難1.31", "s": 0.821, "f": 0}, {"x": 0.989, "y": 1.267, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=945 cos0.99 難1.27", "s": 0.282, "f": 0}, {"x": 0.989, "y": 1.334, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.99 難1.33", "s": 0.218, "f": 0}, {"x": 0.992, "y": 1.397, "c": "近傍", "n": "MAX 360 [A]  n=1541 cos0.99 難1.40", "s": 0.459, "f": 0}, {"x": 0.985, "y": 1.26, "c": "近傍", "n": "Vitrum [A]  n=2543 cos0.98 難1.26", "s": 0.758, "f": 0}, {"x": 0.985, "y": 1.351, "c": "近傍", "n": "2 Be Continued [A]  n=953 cos0.99 難1.35", "s": 0.284, "f": 0}, {"x": 0.984, "y": 1.307, "c": "近傍", "n": "少年は空を辿る [A]  n=3255 cos0.98 難1.31", "s": 0.97, "f": 0}, {"x": 0.984, "y": 1.264, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3343 cos0.98 難1.26", "s": 0.996, "f": 0}, {"x": 0.984, "y": 1.194, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3075 cos0.98 難1.19", "s": 0.916, "f": 0}, {"x": 0.987, "y": 1.127, "c": "近傍", "n": "疾風迅雷 [A]  n=3357 cos0.99 難1.13", "s": 1.0, "f": 0}, {"x": 0.985, "y": 1.396, "c": "近傍", "n": "Session 9 -Chronicles- [A]  n=3083 cos0.99 難1.40", "s": 0.918, "f": 0}, {"x": 0.983, "y": 1.331, "c": "近傍", "n": "轟け！恋のビーンボール！！ [A]  n=3292 cos0.98 難1.33", "s": 0.981, "f": 0}, {"x": 0.984, "y": 1.177, "c": "近傍", "n": "EYE OF THE HEAVEN [A]  n=739 cos0.98 難1.18", "s": 0.22, "f": 0}, {"x": 0.985, "y": 1.155, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1198 cos0.98 難1.16", "s": 0.357, "f": 0}, {"x": 0.982, "y": 1.306, "c": "近傍", "n": "ΕΛΠΙΣ [L]  n=2217 cos0.98 難1.31", "s": 0.66, "f": 0}, {"x": 0.982, "y": 1.321, "c": "近傍", "n": "IMPLANTATION [A]  n=3251 cos0.98 難1.32", "s": 0.968, "f": 0}, {"x": 0.982, "y": 1.243, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3284 cos0.98 難1.24", "s": 0.978, "f": 0}, {"x": 0.983, "y": 1.362, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3180 cos0.98 難1.36", "s": 0.947, "f": 0}, {"x": 0.982, "y": 1.34, "c": "近傍", "n": "yellow head joe [L]  n=1619 cos0.98 難1.34", "s": 0.482, "f": 0}, {"x": 0.984, "y": 1.4, "c": "近傍", "n": "クレッシェンド [A]  n=717 cos0.98 難1.40", "s": 0.214, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45374323016067075}, {"a": 0, "b": 2, "w": 0.37355583527290404}, {"a": 0, "b": 3, "w": 0.42983426605916}, {"a": 0, "b": 4, "w": 0.4831403062983054}, {"a": 0, "b": 5, "w": 0.3030602392655989}, {"a": 0, "b": 6, "w": 0.2748774518595871}, {"a": 0, "b": 7, "w": 0.3034922127863964}, {"a": 0, "b": 8, "w": 0.2807908983739581}, {"a": 0, "b": 9, "w": 0.286730706690729}, {"a": 0, "b": 10, "w": 0.13570920907667483}, {"a": 0, "b": 11, "w": 0.25762102035513323}, {"a": 0, "b": 12, "w": 0.15298190645537924}, {"a": 0, "b": 13, "w": 0.28890562835764766}, {"a": 0, "b": 14, "w": 0.30202492997671926}, {"a": 0, "b": 15, "w": 0.26236365655417127}, {"a": 0, "b": 16, "w": 2.6143087694663336e-11}, {"a": 0, "b": 17, "w": 0.2543026096115213}, {"a": 0, "b": 18, "w": 0.26488493739811314}, {"a": 0, "b": 19, "w": 0.2637450968047165}, {"a": 0, "b": 20, "w": 0.2849743040747642}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=1.105,hiY=1.422;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
