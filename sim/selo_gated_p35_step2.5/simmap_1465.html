<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Primitive Vibes [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.07, "c": "種", "n": "Primitive Vibes [H]  n=2434 cos1.00 難-1.07", "s": 1.0, "f": 0}, {"x": 0.996, "y": -1.08, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos1.00 難-1.08", "s": 0.592, "f": 0}, {"x": 0.996, "y": -1.053, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos1.00 難-1.05", "s": 0.309, "f": 0}, {"x": 0.996, "y": -1.129, "c": "近傍", "n": "No Border [H]  n=1432 cos1.00 難-1.13", "s": 0.588, "f": 0}, {"x": 0.996, "y": -1.034, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1646 cos1.00 難-1.03", "s": 0.676, "f": 0}, {"x": 0.995, "y": -1.103, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1638 cos0.99 難-1.10", "s": 0.673, "f": 0}, {"x": 0.995, "y": -1.115, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=575 cos0.99 難-1.11", "s": 0.236, "f": 0}, {"x": 0.994, "y": -1.051, "c": "近傍", "n": "Here We Go Now [H]  n=854 cos0.99 難-1.05", "s": 0.351, "f": 0}, {"x": 0.994, "y": -1.027, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1151 cos0.99 難-1.03", "s": 0.473, "f": 0}, {"x": 0.995, "y": -1.154, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.99 難-1.15", "s": 0.643, "f": 0}, {"x": 0.993, "y": -1.071, "c": "近傍", "n": "Flying Castle [H]  n=1211 cos0.99 難-1.07", "s": 0.498, "f": 0}, {"x": 0.994, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.99 難-1.16", "s": 0.612, "f": 0}, {"x": 0.992, "y": -1.065, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=624 cos0.99 難-1.06", "s": 0.256, "f": 0}, {"x": 0.992, "y": -1.091, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1351 cos0.99 難-1.09", "s": 0.555, "f": 0}, {"x": 0.992, "y": -1.032, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-1.03", "s": 0.221, "f": 0}, {"x": 0.993, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.15", "s": 0.262, "f": 0}, {"x": 0.992, "y": -1.043, "c": "近傍", "n": "EBONY & IVORY [H]  n=1772 cos0.99 難-1.04", "s": 0.728, "f": 0}, {"x": 0.992, "y": -1.099, "c": "近傍", "n": "Realize Maze [H]  n=1574 cos0.99 難-1.10", "s": 0.647, "f": 0}, {"x": 0.992, "y": -1.141, "c": "近傍", "n": "〆 [H]  n=1729 cos0.99 難-1.14", "s": 0.71, "f": 0}, {"x": 0.991, "y": -1.063, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.99 難-1.06", "s": 0.661, "f": 0}, {"x": 0.991, "y": -1.08, "c": "近傍", "n": "九尾狐夜行 [H]  n=1567 cos0.99 難-1.08", "s": 0.644, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5394471922996289}, {"a": 0, "b": 2, "w": 0.4251016345717008}, {"a": 0, "b": 3, "w": 0.5719577430437267}, {"a": 0, "b": 4, "w": 0.4391889916431906}, {"a": 0, "b": 5, "w": 0.5232354872266722}, {"a": 0, "b": 6, "w": 0.32091618732854754}, {"a": 0, "b": 7, "w": 0.14620964646603507}, {"a": 0, "b": 8, "w": 0.15110760453102534}, {"a": 0, "b": 9, "w": 0.4694803833349154}, {"a": 0, "b": 10, "w": 0.23035492760380738}, {"a": 0, "b": 11, "w": 0.49199764293826853}, {"a": 0, "b": 12, "w": 0.3310570449305106}, {"a": 0, "b": 13, "w": 0.41957925663735696}, {"a": 0, "b": 14, "w": 4.987810164891471e-11}, {"a": 0, "b": 15, "w": 0.21253187046220345}, {"a": 0, "b": 16, "w": 0.28482747948479403}, {"a": 0, "b": 17, "w": 0.3994399371736531}, {"a": 0, "b": 18, "w": 0.2533811032202703}, {"a": 0, "b": 19, "w": 0.3630200800036313}, {"a": 0, "b": 20, "w": 0.3684067619723913}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-1.169,hiY=-1.017;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
