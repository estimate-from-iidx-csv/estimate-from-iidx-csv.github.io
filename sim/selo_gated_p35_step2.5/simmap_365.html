<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Illegal Function Call [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.987, "c": "種", "n": "Illegal Function Call [H]  n=2006 cos1.00 難-0.99", "s": 0.801, "f": 0}, {"x": 0.995, "y": -0.989, "c": "近傍", "n": "Inferno of Fomalhaut [H]  n=1774 cos1.00 難-0.99", "s": 0.708, "f": 0}, {"x": 0.992, "y": -1.111, "c": "近傍", "n": "Arca [H]  n=1546 cos0.99 難-1.11", "s": 0.617, "f": 0}, {"x": 0.992, "y": -0.849, "c": "近傍", "n": "君のハートにロックオン [H]  n=2145 cos0.99 難-0.85", "s": 0.857, "f": 0}, {"x": 0.988, "y": -0.921, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2234 cos0.99 難-0.92", "s": 0.892, "f": 0}, {"x": 0.989, "y": -0.893, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [H]  n=2504 cos0.99 難-0.89", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.986, "c": "近傍", "n": "TIEFSEE [H]  n=2156 cos0.99 難-0.99", "s": 0.861, "f": 0}, {"x": 0.986, "y": -0.894, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1965 cos0.99 難-0.89", "s": 0.785, "f": 0}, {"x": 0.99, "y": -0.78, "c": "近傍", "n": "Love Is Eternity [H]  n=1797 cos0.99 難-0.78", "s": 0.718, "f": 0}, {"x": 0.982, "y": -1.013, "c": "近傍", "n": "Silver Bullet [H]  n=1437 cos0.98 難-1.01", "s": 0.574, "f": 0}, {"x": 0.984, "y": -1.099, "c": "近傍", "n": "Realize Maze [H]  n=1574 cos0.98 難-1.10", "s": 0.629, "f": 0}, {"x": 0.989, "y": -0.781, "c": "近傍", "n": "xenon [H]  n=2372 cos0.99 難-0.78", "s": 0.947, "f": 0}, {"x": 0.982, "y": -1.065, "c": "近傍", "n": "Sarutobi Champion is 拙者 [H]  n=1114 cos0.98 難-1.07", "s": 0.445, "f": 0}, {"x": 0.982, "y": -0.902, "c": "近傍", "n": "Angel's Ladder [H]  n=1649 cos0.98 難-0.90", "s": 0.659, "f": 0}, {"x": 0.981, "y": -0.94, "c": "近傍", "n": "刃図羅 [H]  n=2181 cos0.98 難-0.94", "s": 0.871, "f": 0}, {"x": 0.984, "y": -1.134, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.98 難-1.13", "s": 0.629, "f": 0}, {"x": 0.987, "y": -0.779, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [H]  n=1588 cos0.99 難-0.78", "s": 0.634, "f": 0}, {"x": 0.99, "y": -0.751, "c": "近傍", "n": "Votum stellarum [H]  n=1929 cos0.99 難-0.75", "s": 0.77, "f": 0}, {"x": 0.984, "y": -1.158, "c": "近傍", "n": "セロトニン [H]  n=1490 cos0.98 難-1.16", "s": 0.595, "f": 0}, {"x": 0.981, "y": -1.08, "c": "近傍", "n": "明鏡止水 [H]  n=1442 cos0.98 難-1.08", "s": 0.576, "f": 0}, {"x": 0.984, "y": -1.16, "c": "近傍", "n": "RAIN [H]  n=1518 cos0.98 難-1.16", "s": 0.606, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30262448486805515}, {"a": 0, "b": 2, "w": 0.5053659609283335}, {"a": 0, "b": 3, "w": 0.5552379304967114}, {"a": 0, "b": 4, "w": 0.41886167002098207}, {"a": 0, "b": 5, "w": 0.4572945802859606}, {"a": 0, "b": 6, "w": 0.26937107775183844}, {"a": 0, "b": 7, "w": 0.33119105607807475}, {"a": 0, "b": 8, "w": 0.47824141922586116}, {"a": 0, "b": 9, "w": 0.12663131197897937}, {"a": 0, "b": 10, "w": 0.246395437830899}, {"a": 0, "b": 11, "w": 0.3950942345164187}, {"a": 0, "b": 12, "w": 0.17298139776302035}, {"a": 0, "b": 13, "w": 4.313072121675532e-11}, {"a": 0, "b": 14, "w": 0.08211399375581285}, {"a": 0, "b": 15, "w": 0.3446958303065123}, {"a": 0, "b": 16, "w": 0.22330748568359515}, {"a": 0, "b": 17, "w": 0.47124012326481035}, {"a": 0, "b": 18, "w": 0.22921057874610473}, {"a": 0, "b": 19, "w": 0.23708638440884722}, {"a": 0, "b": 20, "w": 0.21731772311399422}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.193,hiY=-0.718;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
