<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">お願いアインシュタイン [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.211, "c": "種", "n": "お願いアインシュタイン [A]  n=3212 cos1.00 難-0.21", "s": 0.859, "f": 0}, {"x": 0.996, "y": -0.249, "c": "近傍", "n": "LOVE SHINE [A]  n=3366 cos1.00 難-0.25", "s": 0.9, "f": 0}, {"x": 0.996, "y": -0.163, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3085 cos1.00 難-0.16", "s": 0.825, "f": 0}, {"x": 0.995, "y": -0.263, "c": "近傍", "n": "梅雪夜 [A]  n=3414 cos1.00 難-0.26", "s": 0.913, "f": 0}, {"x": 0.995, "y": -0.277, "c": "近傍", "n": "Dazzlin' Darlin [A]  n=3566 cos0.99 難-0.28", "s": 0.953, "f": 0}, {"x": 0.994, "y": -0.216, "c": "近傍", "n": "LOVE IS ORANGE [L]  n=2307 cos0.99 難-0.22", "s": 0.617, "f": 0}, {"x": 0.994, "y": -0.238, "c": "近傍", "n": "COUNTING SHEEP ft. Kanae Asaba [A]  n=1257 cos0.99 難-0.24", "s": 0.336, "f": 0}, {"x": 0.993, "y": -0.241, "c": "近傍", "n": "NEEDLESS MY LOVE FOR YOU [A]  n=1168 cos0.99 難-0.24", "s": 0.312, "f": 0}, {"x": 0.993, "y": -0.229, "c": "近傍", "n": "RESISTANCE [A]  n=2740 cos0.99 難-0.23", "s": 0.732, "f": 0}, {"x": 0.992, "y": -0.249, "c": "近傍", "n": "ハルイロメロディー [A]  n=1086 cos0.99 難-0.25", "s": 0.29, "f": 0}, {"x": 0.992, "y": -0.239, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos0.99 難-0.24", "s": 0.667, "f": 0}, {"x": 0.992, "y": -0.239, "c": "近傍", "n": "マーシャル・マキシマイザー [A]  n=1814 cos0.99 難-0.24", "s": 0.485, "f": 0}, {"x": 0.994, "y": -0.344, "c": "近傍", "n": "コスモス [A]  n=2555 cos0.99 難-0.34", "s": 0.683, "f": 0}, {"x": 0.995, "y": -0.384, "c": "近傍", "n": "COSMIC☆WONDER☆REVOLUTION [A]  n=2881 cos0.99 難-0.38", "s": 0.77, "f": 0}, {"x": 0.993, "y": -0.072, "c": "近傍", "n": "断罪の一花 [A]  n=1496 cos0.99 難-0.07", "s": 0.4, "f": 0}, {"x": 0.991, "y": -0.245, "c": "近傍", "n": "AMICABLE [A]  n=1498 cos0.99 難-0.25", "s": 0.4, "f": 0}, {"x": 0.991, "y": -0.215, "c": "近傍", "n": "Sorrows [A]  n=3300 cos0.99 難-0.21", "s": 0.882, "f": 0}, {"x": 0.991, "y": -0.164, "c": "近傍", "n": "Abyss -The Heavens Remix- [A]  n=3140 cos0.99 難-0.16", "s": 0.839, "f": 0}, {"x": 0.991, "y": -0.191, "c": "近傍", "n": "Believe in you [A]  n=3061 cos0.99 難-0.19", "s": 0.818, "f": 0}, {"x": 0.992, "y": -0.356, "c": "近傍", "n": "CROSSROAD ～Left Story～ [A]  n=3630 cos0.99 難-0.36", "s": 0.97, "f": 0}, {"x": 0.993, "y": -0.025, "c": "近傍", "n": "Second Heaven [A]  n=3741 cos0.99 難-0.02", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5251638846768766}, {"a": 0, "b": 2, "w": 0.4786604943742341}, {"a": 0, "b": 3, "w": 0.4386577723342684}, {"a": 0, "b": 4, "w": 0.4247538067628803}, {"a": 0, "b": 5, "w": 0.39062273879464915}, {"a": 0, "b": 6, "w": 0.28920419095949423}, {"a": 0, "b": 7, "w": 0.3013848858471049}, {"a": 0, "b": 8, "w": 0.2958463769335934}, {"a": 0, "b": 9, "w": 0.19611313474052883}, {"a": 0, "b": 10, "w": 0.29847119717963144}, {"a": 0, "b": 11, "w": 0.21597433564363733}, {"a": 0, "b": 12, "w": 0.25183153109921586}, {"a": 0, "b": 13, "w": 0.3393673011865772}, {"a": 0, "b": 14, "w": 0.1197079816924943}, {"a": 0, "b": 15, "w": 5.5651816488477834e-11}, {"a": 0, "b": 16, "w": 0.1282974526390116}, {"a": 0, "b": 17, "w": 0.1905864627403563}, {"a": 0, "b": 18, "w": 0.23894117450751307}, {"a": 0, "b": 19, "w": 0.2769921722142572}, {"a": 0, "b": 20, "w": 0.23106678891588717}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.413,hiY=0.004;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
