<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CONTRACT [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.384, "c": "種", "n": "CONTRACT [H]  n=2804 cos1.00 難-0.38", "s": 0.848, "f": 0}, {"x": 0.994, "y": -0.347, "c": "近傍", "n": "Ubertreffen [H]  n=3087 cos0.99 難-0.35", "s": 0.934, "f": 0}, {"x": 0.992, "y": -0.234, "c": "近傍", "n": "TRANOID [H]  n=2312 cos0.99 難-0.23", "s": 0.699, "f": 0}, {"x": 0.99, "y": -0.43, "c": "近傍", "n": "ALBIDA [H]  n=3265 cos0.99 難-0.43", "s": 0.988, "f": 0}, {"x": 0.989, "y": -0.375, "c": "近傍", "n": "Last Dance [H]  n=2703 cos0.99 難-0.37", "s": 0.818, "f": 0}, {"x": 0.989, "y": -0.426, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1729 cos0.99 難-0.43", "s": 0.523, "f": 0}, {"x": 0.989, "y": -0.329, "c": "近傍", "n": "Bad Maniacs [H]  n=3257 cos0.99 難-0.33", "s": 0.985, "f": 0}, {"x": 0.991, "y": -0.582, "c": "近傍", "n": "NEMESIS [H]  n=1853 cos0.99 難-0.58", "s": 0.56, "f": 0}, {"x": 0.99, "y": -0.238, "c": "近傍", "n": "Re:GENERATION [A]  n=3306 cos0.99 難-0.24", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.671, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2363 cos1.00 難-0.67", "s": 0.715, "f": 0}, {"x": 0.989, "y": -0.536, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3252 cos0.99 難-0.54", "s": 0.984, "f": 0}, {"x": 0.988, "y": -0.484, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2390 cos0.99 難-0.48", "s": 0.723, "f": 0}, {"x": 0.993, "y": -0.65, "c": "近傍", "n": "DIAVOLO [H]  n=3226 cos0.99 難-0.65", "s": 0.976, "f": 0}, {"x": 0.988, "y": -0.263, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3108 cos0.99 難-0.26", "s": 0.94, "f": 0}, {"x": 0.986, "y": -0.402, "c": "近傍", "n": "Ancient Scapes [H]  n=2490 cos0.99 難-0.40", "s": 0.753, "f": 0}, {"x": 0.987, "y": -0.283, "c": "近傍", "n": "STULTI [H]  n=2665 cos0.99 難-0.28", "s": 0.806, "f": 0}, {"x": 0.986, "y": -0.385, "c": "近傍", "n": "Howling [A]  n=2823 cos0.99 難-0.39", "s": 0.854, "f": 0}, {"x": 0.992, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 0.908, "f": 0}, {"x": 0.986, "y": -0.386, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3124 cos0.99 難-0.39", "s": 0.945, "f": 0}, {"x": 0.99, "y": -0.648, "c": "近傍", "n": "switch [H]  n=1803 cos0.99 難-0.65", "s": 0.545, "f": 0}, {"x": 0.991, "y": -0.661, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2117 cos0.99 難-0.66", "s": 0.64, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33957562643310335}, {"a": 0, "b": 2, "w": 0.260353058415713}, {"a": 0, "b": 3, "w": 0.15512540117063256}, {"a": 0, "b": 4, "w": 0.01065882407117269}, {"a": 0, "b": 5, "w": 0.06943994499663553}, {"a": 0, "b": 6, "w": 0.10325289160811535}, {"a": 0, "b": 7, "w": 0.08449092007479952}, {"a": 0, "b": 8, "w": 0.15699296000459173}, {"a": 0, "b": 9, "w": 0.4977070602092688}, {"a": 0, "b": 10, "w": 0.1032052498339674}, {"a": 0, "b": 11, "w": 0.08300257949220868}, {"a": 0, "b": 12, "w": 0.17594167098859603}, {"a": 0, "b": 13, "w": 5.59247093079307e-11}, {"a": 0, "b": 14, "w": 0.025433411573025255}, {"a": 0, "b": 15, "w": 0.006777695640680426}, {"a": 0, "b": 16, "w": 0.010144427386825305}, {"a": 0, "b": 17, "w": 0.15860809945855747}, {"a": 0, "b": 18, "w": 0.009494296805677038}, {"a": 0, "b": 19, "w": 0.04044242416785959}, {"a": 0, "b": 20, "w": 0.1005862483172415}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.708,hiY=-0.199;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
