<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lethal Weapon [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.01, "c": "種", "n": "Lethal Weapon [A]  n=3095 cos1.00 難1.01", "s": 0.871, "f": 0}, {"x": 0.991, "y": 0.979, "c": "近傍", "n": "Silver Bullet [A]  n=2434 cos0.99 難0.98", "s": 0.685, "f": 0}, {"x": 0.99, "y": 1.023, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.99 難1.02", "s": 0.903, "f": 0}, {"x": 0.992, "y": 0.907, "c": "近傍", "n": "終焔のClaudia [A]  n=1707 cos0.99 難0.91", "s": 0.481, "f": 0}, {"x": 0.987, "y": 0.998, "c": "近傍", "n": "EVANESCENT [A]  n=3032 cos0.99 難1.00", "s": 0.854, "f": 0}, {"x": 0.988, "y": 0.977, "c": "近傍", "n": "BLAZING_LAZER [A]  n=1566 cos0.99 難0.98", "s": 0.441, "f": 0}, {"x": 0.987, "y": 1.036, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1132 cos0.99 難1.04", "s": 0.319, "f": 0}, {"x": 0.989, "y": 0.927, "c": "近傍", "n": "dAuntl3ss [A]  n=3300 cos0.99 難0.93", "s": 0.929, "f": 0}, {"x": 0.987, "y": 1.035, "c": "近傍", "n": "Bring The Fire [A]  n=1409 cos0.99 難1.04", "s": 0.397, "f": 0}, {"x": 0.989, "y": 0.908, "c": "近傍", "n": "oratio [A]  n=3448 cos0.99 難0.91", "s": 0.971, "f": 0}, {"x": 0.988, "y": 1.088, "c": "近傍", "n": "Chaotoxin [A]  n=1947 cos0.99 難1.09", "s": 0.548, "f": 0}, {"x": 0.987, "y": 1.047, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3455 cos0.99 難1.05", "s": 0.973, "f": 0}, {"x": 0.986, "y": 0.989, "c": "近傍", "n": "Seven Times Four [A]  n=1333 cos0.99 難0.99", "s": 0.375, "f": 0}, {"x": 0.988, "y": 1.097, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2239 cos0.99 難1.10", "s": 0.63, "f": 0}, {"x": 0.988, "y": 1.102, "c": "近傍", "n": "MARLIN [A]  n=1133 cos0.99 難1.10", "s": 0.319, "f": 0}, {"x": 0.991, "y": 0.863, "c": "近傍", "n": "GAIA [A]  n=3552 cos0.99 難0.86", "s": 1.0, "f": 0}, {"x": 0.985, "y": 1.041, "c": "近傍", "n": "ラブコメトキドキシリアス [A]  n=708 cos0.98 難1.04", "s": 0.199, "f": 0}, {"x": 0.986, "y": 1.093, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3376 cos0.99 難1.09", "s": 0.95, "f": 0}, {"x": 0.987, "y": 0.895, "c": "近傍", "n": "電人、暁に斃れる。 [A]  n=3511 cos0.99 難0.90", "s": 0.988, "f": 0}, {"x": 0.985, "y": 1.072, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [A]  n=3293 cos0.99 難1.07", "s": 0.927, "f": 0}, {"x": 0.985, "y": 0.953, "c": "近傍", "n": "旋律のドグマ～Miserables～ [A]  n=3435 cos0.99 難0.95", "s": 0.967, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4430942176018434}, {"a": 0, "b": 2, "w": 0.43197010778705835}, {"a": 0, "b": 3, "w": 0.4981975233517112}, {"a": 0, "b": 4, "w": 0.3370380252380736}, {"a": 0, "b": 5, "w": 0.3145690191534808}, {"a": 0, "b": 6, "w": 0.3267995325499058}, {"a": 0, "b": 7, "w": 0.3882861989810159}, {"a": 0, "b": 8, "w": 0.341834785323858}, {"a": 0, "b": 9, "w": 0.3247820775818351}, {"a": 0, "b": 10, "w": 0.3418633442697213}, {"a": 0, "b": 11, "w": 0.2150506916810241}, {"a": 0, "b": 12, "w": 0.3115740795869115}, {"a": 0, "b": 13, "w": 0.3125173106564708}, {"a": 0, "b": 14, "w": 0.25870828743171836}, {"a": 0, "b": 15, "w": 0.4608277256220553}, {"a": 0, "b": 16, "w": 2.935574006102115e-11}, {"a": 0, "b": 17, "w": 0.12083236819566079}, {"a": 0, "b": 18, "w": 0.34793686600562856}, {"a": 0, "b": 19, "w": 0.2898395271797204}, {"a": 0, "b": 20, "w": 0.21407692202930373}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=0.843,hiY=1.121;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
