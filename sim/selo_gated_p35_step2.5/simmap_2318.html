<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">天空脳番長危機十六連打 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.297, "c": "種", "n": "天空脳番長危機十六連打 [A]  n=3233 cos1.00 難0.30", "s": 0.889, "f": 0}, {"x": 0.996, "y": 0.295, "c": "近傍", "n": "《GRANDMASTER》 [A]  n=2189 cos1.00 難0.30", "s": 0.602, "f": 0}, {"x": 0.998, "y": 0.414, "c": "近傍", "n": "Giudecca [A]  n=3156 cos1.00 難0.41", "s": 0.868, "f": 0}, {"x": 0.996, "y": 0.22, "c": "近傍", "n": "HYPERION [A]  n=3347 cos1.00 難0.22", "s": 0.921, "f": 0}, {"x": 0.997, "y": 0.187, "c": "近傍", "n": "Stylus [A]  n=1635 cos1.00 難0.19", "s": 0.45, "f": 0}, {"x": 0.996, "y": 0.237, "c": "近傍", "n": "ChaserXX [A]  n=3337 cos1.00 難0.24", "s": 0.918, "f": 0}, {"x": 0.997, "y": 0.161, "c": "近傍", "n": "Ypsilon [A]  n=2811 cos1.00 難0.16", "s": 0.773, "f": 0}, {"x": 0.997, "y": 0.147, "c": "近傍", "n": "xenon [A]  n=3549 cos1.00 難0.15", "s": 0.976, "f": 0}, {"x": 0.997, "y": 0.156, "c": "近傍", "n": "#The_Relentless [A]  n=3442 cos1.00 難0.16", "s": 0.947, "f": 0}, {"x": 0.996, "y": 0.427, "c": "近傍", "n": "OTOKOZAKA [A]  n=1619 cos1.00 難0.43", "s": 0.445, "f": 0}, {"x": 0.995, "y": 0.256, "c": "近傍", "n": "Rubrum Piano [A]  n=2357 cos0.99 難0.26", "s": 0.648, "f": 0}, {"x": 0.995, "y": 0.3, "c": "近傍", "n": "Flash Back 90's [L]  n=1988 cos0.99 難0.30", "s": 0.547, "f": 0}, {"x": 0.995, "y": 0.265, "c": "近傍", "n": "Get On Your Feet [A]  n=1761 cos0.99 難0.26", "s": 0.484, "f": 0}, {"x": 0.996, "y": 0.148, "c": "近傍", "n": "Submerge Serenade [A]  n=1920 cos1.00 難0.15", "s": 0.528, "f": 0}, {"x": 0.995, "y": 0.263, "c": "近傍", "n": "Rosa azuL [A]  n=2237 cos0.99 難0.26", "s": 0.615, "f": 0}, {"x": 0.995, "y": 0.382, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3326 cos0.99 難0.38", "s": 0.915, "f": 0}, {"x": 0.996, "y": 0.16, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3525 cos1.00 難0.16", "s": 0.97, "f": 0}, {"x": 0.996, "y": 0.151, "c": "近傍", "n": "Amazing Mirage [A]  n=3635 cos1.00 難0.15", "s": 1.0, "f": 0}, {"x": 0.998, "y": 0.102, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2221 cos1.00 難0.10", "s": 0.611, "f": 0}, {"x": 0.994, "y": 0.246, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=855 cos0.99 難0.25", "s": 0.235, "f": 0}, {"x": 0.994, "y": 0.294, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3265 cos0.99 難0.29", "s": 0.898, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.16790838135022867}, {"a": 0, "b": 2, "w": 0.4923971227285371}, {"a": 0, "b": 3, "w": 0.43290414645359365}, {"a": 0, "b": 4, "w": 0.26939792422882003}, {"a": 0, "b": 5, "w": 0.24787018474830413}, {"a": 0, "b": 6, "w": 0.3230148620841047}, {"a": 0, "b": 7, "w": 0.4987975724859758}, {"a": 0, "b": 8, "w": 0.18551392376502363}, {"a": 0, "b": 9, "w": 0.3099943796167203}, {"a": 0, "b": 10, "w": 0.2462083219562735}, {"a": 0, "b": 11, "w": 0.05938457579144807}, {"a": 0, "b": 12, "w": 5.7120086438544604e-11}, {"a": 0, "b": 13, "w": 0.24729825251653537}, {"a": 0, "b": 14, "w": 0.06559763929232898}, {"a": 0, "b": 15, "w": 0.24087140415422226}, {"a": 0, "b": 16, "w": 0.382724983654702}, {"a": 0, "b": 17, "w": 0.20755696822279046}, {"a": 0, "b": 18, "w": 0.42967494842005616}, {"a": 0, "b": 19, "w": 0.07168891194842031}, {"a": 0, "b": 20, "w": 0.14316682764889188}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=0.076,hiY=0.453;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
