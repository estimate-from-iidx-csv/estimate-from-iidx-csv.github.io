<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Kick Out 仮面 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.359, "c": "種", "n": "Kick Out 仮面 [A]  n=2488 cos1.00 難-0.36", "s": 0.702, "f": 0}, {"x": 0.996, "y": -0.441, "c": "近傍", "n": "セカンドピアス [A]  n=2576 cos1.00 難-0.44", "s": 0.726, "f": 0}, {"x": 0.996, "y": -0.278, "c": "近傍", "n": "Claiomh Solais [A]  n=2511 cos1.00 難-0.28", "s": 0.708, "f": 0}, {"x": 0.995, "y": -0.344, "c": "近傍", "n": "コスモス [A]  n=2555 cos0.99 難-0.34", "s": 0.721, "f": 0}, {"x": 0.994, "y": -0.356, "c": "近傍", "n": "タシカナモノ [A]  n=2492 cos0.99 難-0.36", "s": 0.703, "f": 0}, {"x": 0.994, "y": -0.457, "c": "近傍", "n": "Only for now [A]  n=3200 cos0.99 難-0.46", "s": 0.902, "f": 0}, {"x": 0.993, "y": -0.384, "c": "近傍", "n": "COSMIC☆WONDER☆REVOLUTION [A]  n=2881 cos0.99 難-0.38", "s": 0.812, "f": 0}, {"x": 0.993, "y": -0.371, "c": "近傍", "n": "エディブルフラワーの独白 [A]  n=3305 cos0.99 難-0.37", "s": 0.932, "f": 0}, {"x": 0.992, "y": -0.385, "c": "近傍", "n": "satfinal [A]  n=2973 cos0.99 難-0.39", "s": 0.838, "f": 0}, {"x": 0.992, "y": -0.377, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos0.99 難-0.38", "s": 0.936, "f": 0}, {"x": 0.992, "y": -0.252, "c": "近傍", "n": "beatonic nation [A]  n=2335 cos0.99 難-0.25", "s": 0.658, "f": 0}, {"x": 0.992, "y": -0.484, "c": "近傍", "n": "昏き甲鉄のヴェルガ [A]  n=1761 cos0.99 難-0.48", "s": 0.497, "f": 0}, {"x": 0.996, "y": -0.601, "c": "近傍", "n": "たからもの [A]  n=3272 cos1.00 難-0.60", "s": 0.923, "f": 0}, {"x": 0.993, "y": -0.185, "c": "近傍", "n": "Rainbow after snow [A]  n=3289 cos0.99 難-0.19", "s": 0.928, "f": 0}, {"x": 0.991, "y": -0.381, "c": "近傍", "n": "chrono diver -fragment- [L]  n=3546 cos0.99 難-0.38", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.239, "c": "近傍", "n": "Surf on the Light [A]  n=2496 cos0.99 難-0.24", "s": 0.704, "f": 0}, {"x": 0.991, "y": -0.385, "c": "近傍", "n": "BRIDAL FESTIVAL !!! [A]  n=2637 cos0.99 難-0.39", "s": 0.744, "f": 0}, {"x": 0.991, "y": -0.339, "c": "近傍", "n": "Hurry Hurry [A]  n=2879 cos0.99 難-0.34", "s": 0.812, "f": 0}, {"x": 0.991, "y": -0.228, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos0.99 難-0.23", "s": 0.889, "f": 0}, {"x": 0.994, "y": -0.613, "c": "近傍", "n": "れとりば！ [A]  n=1676 cos0.99 難-0.61", "s": 0.473, "f": 0}, {"x": 0.991, "y": -0.247, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3193 cos0.99 難-0.25", "s": 0.9, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49389110434688543}, {"a": 0, "b": 2, "w": 0.4458231337244779}, {"a": 0, "b": 3, "w": 0.36150935318368826}, {"a": 0, "b": 4, "w": 0.3745077629904745}, {"a": 0, "b": 5, "w": 0.35828505934217414}, {"a": 0, "b": 6, "w": 0.24251430817574005}, {"a": 0, "b": 7, "w": 0.31793008868853345}, {"a": 0, "b": 8, "w": 0.2583708817625556}, {"a": 0, "b": 9, "w": 0.27608164669360324}, {"a": 0, "b": 10, "w": 0.2830772972416532}, {"a": 0, "b": 11, "w": 0.05386441825241195}, {"a": 0, "b": 12, "w": 0.3604304750023213}, {"a": 0, "b": 13, "w": 0.3284716225986082}, {"a": 0, "b": 14, "w": 0.13974239688602963}, {"a": 0, "b": 15, "w": 6.245248762581923e-11}, {"a": 0, "b": 16, "w": 0.11388283359603035}, {"a": 0, "b": 17, "w": 0.2003761985008755}, {"a": 0, "b": 18, "w": 0.24963064743171848}, {"a": 0, "b": 19, "w": 0.29380965456860586}, {"a": 0, "b": 20, "w": 0.15930105823436524}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.647,hiY=-0.151;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
