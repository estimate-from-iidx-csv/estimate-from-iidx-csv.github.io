<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">D [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.826, "c": "種", "n": "D [A]  n=3226 cos1.00 難0.83", "s": 0.89, "f": 0}, {"x": 0.995, "y": 0.825, "c": "近傍", "n": "FUTURE is Dead [A]  n=3214 cos1.00 難0.82", "s": 0.887, "f": 0}, {"x": 0.985, "y": 0.679, "c": "近傍", "n": "Monkey Business [A]  n=1419 cos0.99 難0.68", "s": 0.391, "f": 0}, {"x": 0.981, "y": 0.653, "c": "近傍", "n": "STEEL NEEDLE [A]  n=3349 cos0.98 難0.65", "s": 0.924, "f": 0}, {"x": 0.985, "y": 0.526, "c": "近傍", "n": "Ah Hah Yeah [A]  n=2590 cos0.98 難0.53", "s": 0.714, "f": 0}, {"x": 0.979, "y": 0.67, "c": "近傍", "n": "PARANOiA ～HADES～ [H]  n=3128 cos0.98 難0.67", "s": 0.863, "f": 0}, {"x": 0.989, "y": 0.375, "c": "近傍", "n": "PARANOIA survivor MAX [A]  n=1116 cos0.99 難0.37", "s": 0.308, "f": 0}, {"x": 0.976, "y": 0.676, "c": "近傍", "n": "NINJA IS DEAD IIDX ver. [A]  n=3625 cos0.98 難0.68", "s": 1.0, "f": 0}, {"x": 0.978, "y": 0.553, "c": "近傍", "n": "gigadelic [A]  n=3542 cos0.98 難0.55", "s": 0.977, "f": 0}, {"x": 0.977, "y": 0.528, "c": "近傍", "n": "Usual Days-remix [A]  n=3082 cos0.98 難0.53", "s": 0.85, "f": 0}, {"x": 0.981, "y": 1.245, "c": "近傍", "n": "Fire Beat [A]  n=2050 cos0.98 難1.24", "s": 0.566, "f": 0}, {"x": 0.975, "y": 1.01, "c": "近傍", "n": "Lethal Weapon [A]  n=3095 cos0.97 難1.01", "s": 0.854, "f": 0}, {"x": 0.974, "y": 0.899, "c": "近傍", "n": "SABER WING [A]  n=3428 cos0.97 難0.90", "s": 0.946, "f": 0}, {"x": 0.972, "y": 0.756, "c": "近傍", "n": "moon_child [A]  n=3574 cos0.97 難0.76", "s": 0.986, "f": 0}, {"x": 0.975, "y": 0.544, "c": "近傍", "n": "ディッシュウォッシャー◎彡おいわちゃん [A]  n=3070 cos0.98 難0.54", "s": 0.847, "f": 0}, {"x": 0.973, "y": 0.568, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [A]  n=3059 cos0.97 難0.57", "s": 0.844, "f": 0}, {"x": 0.977, "y": 0.427, "c": "近傍", "n": "EMERALDAS [H]  n=3144 cos0.98 難0.43", "s": 0.867, "f": 0}, {"x": 0.975, "y": 0.497, "c": "近傍", "n": "BRAVE OUT [L]  n=696 cos0.97 難0.50", "s": 0.192, "f": 0}, {"x": 0.974, "y": 0.513, "c": "近傍", "n": "Ganymede [A]  n=3335 cos0.97 難0.51", "s": 0.92, "f": 0}, {"x": 0.975, "y": 0.447, "c": "近傍", "n": "chaos eater -IIDX edition- [A]  n=3161 cos0.98 難0.45", "s": 0.872, "f": 0}, {"x": 0.976, "y": 0.408, "c": "近傍", "n": "fun [A]  n=1291 cos0.98 難0.41", "s": 0.356, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5583775083713378}, {"a": 0, "b": 2, "w": 0.4088141429839933}, {"a": 0, "b": 3, "w": 0.31784745816318893}, {"a": 0, "b": 4, "w": 0.40380580973027846}, {"a": 0, "b": 5, "w": 0.17994710991272123}, {"a": 0, "b": 6, "w": 0.4903925555837938}, {"a": 0, "b": 7, "w": 0.13326128212348642}, {"a": 0, "b": 8, "w": 0.2847244813875499}, {"a": 0, "b": 9, "w": 0.27326185993928265}, {"a": 0, "b": 10, "w": 0.3453513026732278}, {"a": 0, "b": 11, "w": 0.05775206491993812}, {"a": 0, "b": 12, "w": 2.7915891820384786e-11}, {"a": 0, "b": 13, "w": 0.19652533825357554}, {"a": 0, "b": 14, "w": 0.23588464650477659}, {"a": 0, "b": 15, "w": 0.18411653873151734}, {"a": 0, "b": 16, "w": 0.2356851249448173}, {"a": 0, "b": 17, "w": 0.24188285433920864}, {"a": 0, "b": 18, "w": 0.11509823730164448}, {"a": 0, "b": 19, "w": 0.24994327376010916}, {"a": 0, "b": 20, "w": 0.24007010128791728}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=0.305,hiY=1.315;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
