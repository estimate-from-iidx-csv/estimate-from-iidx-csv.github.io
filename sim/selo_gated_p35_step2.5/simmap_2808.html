<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">sakura storm [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.382, "c": "種", "n": "sakura storm [A]  n=3780 cos1.00 難0.38", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.272, "c": "近傍", "n": "Lovely Howdy Cowboy!! [A]  n=2479 cos0.99 難0.27", "s": 0.656, "f": 0}, {"x": 0.991, "y": 0.403, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.99 難0.40", "s": 0.814, "f": 0}, {"x": 0.991, "y": 0.475, "c": "近傍", "n": "Aegis [A]  n=3425 cos0.99 難0.48", "s": 0.906, "f": 0}, {"x": 0.991, "y": 0.266, "c": "近傍", "n": "Sun Field [A]  n=3143 cos0.99 難0.27", "s": 0.831, "f": 0}, {"x": 0.992, "y": 0.129, "c": "近傍", "n": "SUPER HEROINE!! [A]  n=1032 cos0.99 難0.13", "s": 0.273, "f": 0}, {"x": 0.992, "y": 0.09, "c": "近傍", "n": "うさ☆かめ 大戦争！ [A]  n=3354 cos0.99 難0.09", "s": 0.887, "f": 0}, {"x": 0.989, "y": 0.411, "c": "近傍", "n": "Playing With Fire [A]  n=2931 cos0.99 難0.41", "s": 0.775, "f": 0}, {"x": 0.989, "y": 0.263, "c": "近傍", "n": "Lighting Shower [A]  n=3194 cos0.99 難0.26", "s": 0.845, "f": 0}, {"x": 0.988, "y": 0.376, "c": "近傍", "n": "Welcome [A]  n=3292 cos0.99 難0.38", "s": 0.871, "f": 0}, {"x": 0.988, "y": 0.272, "c": "近傍", "n": "I'm so Happy [A]  n=3633 cos0.99 難0.27", "s": 0.961, "f": 0}, {"x": 0.993, "y": -0.005, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [A]  n=3343 cos0.99 難-0.01", "s": 0.884, "f": 0}, {"x": 0.988, "y": 0.255, "c": "近傍", "n": "Scarlet Moon [A]  n=3513 cos0.99 難0.26", "s": 0.929, "f": 0}, {"x": 0.989, "y": 0.129, "c": "近傍", "n": "SOLID WYVERN [A]  n=2530 cos0.99 難0.13", "s": 0.669, "f": 0}, {"x": 0.987, "y": 0.234, "c": "近傍", "n": "Sakura Mirage [A]  n=3464 cos0.99 難0.23", "s": 0.916, "f": 0}, {"x": 0.987, "y": 0.351, "c": "近傍", "n": "HYENA [A]  n=3455 cos0.99 難0.35", "s": 0.914, "f": 0}, {"x": 0.99, "y": 0.73, "c": "近傍", "n": "1st Samurai [A]  n=3017 cos0.99 難0.73", "s": 0.798, "f": 0}, {"x": 0.989, "y": 0.069, "c": "近傍", "n": "Howling [L]  n=2739 cos0.99 難0.07", "s": 0.725, "f": 0}, {"x": 0.987, "y": 0.192, "c": "近傍", "n": "ハイテックトキオ [A]  n=2639 cos0.99 難0.19", "s": 0.698, "f": 0}, {"x": 0.988, "y": 0.644, "c": "近傍", "n": "RUGGED ASH [L]  n=2758 cos0.99 難0.64", "s": 0.73, "f": 0}, {"x": 0.986, "y": 0.266, "c": "近傍", "n": "Catch ya Getcha! [A]  n=1046 cos0.99 難0.27", "s": 0.277, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4772574923320094}, {"a": 0, "b": 2, "w": 0.08065190356795016}, {"a": 0, "b": 3, "w": 0.32432461918326827}, {"a": 0, "b": 4, "w": 0.10913296459846455}, {"a": 0, "b": 5, "w": 0.3258316397783647}, {"a": 0, "b": 6, "w": 0.19900903177432017}, {"a": 0, "b": 7, "w": 0.2471885064400542}, {"a": 0, "b": 8, "w": 3.0644042858796183e-11}, {"a": 0, "b": 9, "w": 0.2815161618429235}, {"a": 0, "b": 10, "w": 0.29606860622408904}, {"a": 0, "b": 11, "w": 0.28787019059113694}, {"a": 0, "b": 12, "w": 0.2982567579761074}, {"a": 0, "b": 13, "w": 0.13604912875303787}, {"a": 0, "b": 14, "w": 0.19475773969216603}, {"a": 0, "b": 15, "w": 0.2479083240679465}, {"a": 0, "b": 16, "w": 0.3711592023647379}, {"a": 0, "b": 17, "w": 0.2441862761200858}, {"a": 0, "b": 18, "w": 0.11229737163323616}, {"a": 0, "b": 19, "w": 0.2221137605249297}, {"a": 0, "b": 20, "w": 0.28118031341864047}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.064,hiY=0.789;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
