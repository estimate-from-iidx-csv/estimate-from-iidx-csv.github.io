<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.74, "c": "種", "n": "Lisa-RICCIA [L]  n=633 cos1.00 難2.74", "s": 0.206, "f": 0}, {"x": 0.983, "y": 2.599, "c": "近傍", "n": "Time to Air [L]  n=1548 cos0.98 難2.60", "s": 0.504, "f": 0}, {"x": 0.967, "y": 2.752, "c": "近傍", "n": "KAMAITACHI [L]  n=2151 cos0.97 難2.75", "s": 0.7, "f": 0}, {"x": 0.963, "y": 2.592, "c": "近傍", "n": "Sigmund [L]  n=2042 cos0.96 難2.59", "s": 0.664, "f": 0}, {"x": 0.973, "y": 2.509, "c": "近傍", "n": "#The_Relentless [L]  n=682 cos0.97 難2.51", "s": 0.222, "f": 0}, {"x": 0.958, "y": 2.877, "c": "近傍", "n": "疾風迅雷 [L]  n=2111 cos0.96 難2.88", "s": 0.687, "f": 0}, {"x": 0.959, "y": 2.577, "c": "近傍", "n": "Plan 8 [A]  n=2861 cos0.96 難2.58", "s": 0.931, "f": 0}, {"x": 0.964, "y": 2.523, "c": "近傍", "n": "EMERALDAS [A]  n=2713 cos0.96 難2.52", "s": 0.883, "f": 0}, {"x": 0.952, "y": 2.828, "c": "近傍", "n": "烽火連天の刃 [L]  n=676 cos0.95 難2.83", "s": 0.22, "f": 0}, {"x": 0.955, "y": 2.597, "c": "近傍", "n": "VOID [A]  n=1272 cos0.95 難2.60", "s": 0.414, "f": 0}, {"x": 0.974, "y": 2.46, "c": "近傍", "n": "カジノファイヤーことみちゃん [L]  n=1076 cos0.97 難2.46", "s": 0.35, "f": 0}, {"x": 0.95, "y": 2.862, "c": "近傍", "n": "XHRONOXAPSULΞ [A]  n=719 cos0.95 難2.86", "s": 0.234, "f": 0}, {"x": 0.951, "y": 2.578, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1162 cos0.95 難2.58", "s": 0.378, "f": 0}, {"x": 0.944, "y": 2.794, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [A]  n=1818 cos0.94 難2.79", "s": 0.591, "f": 0}, {"x": 0.95, "y": 2.564, "c": "近傍", "n": "3y3s [A]  n=3074 cos0.95 難2.56", "s": 1.0, "f": 0}, {"x": 0.965, "y": 3.031, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [L]  n=776 cos0.96 難3.03", "s": 0.252, "f": 0}, {"x": 0.971, "y": 2.413, "c": "近傍", "n": "紫陽花 -AZISAI- [L]  n=1077 cos0.97 難2.41", "s": 0.35, "f": 0}, {"x": 0.94, "y": 2.8, "c": "近傍", "n": "Verflucht [L]  n=2405 cos0.94 難2.80", "s": 0.782, "f": 0}, {"x": 0.947, "y": 2.548, "c": "近傍", "n": "Phoenix [L]  n=1432 cos0.95 難2.55", "s": 0.466, "f": 0}, {"x": 0.944, "y": 2.906, "c": "近傍", "n": "n/a [A]  n=1652 cos0.94 難2.91", "s": 0.537, "f": 0}, {"x": 0.939, "y": 2.652, "c": "近傍", "n": "FiZZλ_POT!0N [A]  n=590 cos0.94 難2.65", "s": 0.192, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39903540433690654}, {"a": 0, "b": 2, "w": 0.24375259658561788}, {"a": 0, "b": 3, "w": 0.21795461964948515}, {"a": 0, "b": 4, "w": 0.30659454596235347}, {"a": 0, "b": 5, "w": 0.1423956901934711}, {"a": 0, "b": 6, "w": 0.15893101974094148}, {"a": 0, "b": 7, "w": 0.21284946066166321}, {"a": 0, "b": 8, "w": 0.11525998025719753}, {"a": 0, "b": 9, "w": 0.04474617455841223}, {"a": 0, "b": 10, "w": 0.2274910649833144}, {"a": 0, "b": 11, "w": 0.08802801143003125}, {"a": 0, "b": 12, "w": 0.09073773287000864}, {"a": 0, "b": 13, "w": 0.04150800137765076}, {"a": 0, "b": 14, "w": 0.08641022643982399}, {"a": 0, "b": 15, "w": 0.20953914551826547}, {"a": 0, "b": 16, "w": 0.16484902660725997}, {"a": 0, "b": 17, "w": 1.4369949674630789e-11}, {"a": 0, "b": 18, "w": 0.045204282788516514}, {"a": 0, "b": 19, "w": 0.010138989771605433}, {"a": 0, "b": 20, "w": 0.004496899488442896}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.934,hiX=1.005,loY=2.363,hiY=3.080;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
