<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">EXODUS SIGN [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.593, "c": "種", "n": "EXODUS SIGN [A]  n=1741 cos1.00 難0.59", "s": 0.504, "f": 0}, {"x": 0.995, "y": 0.478, "c": "近傍", "n": "Sense 2007 [H]  n=3335 cos1.00 難0.48", "s": 0.966, "f": 0}, {"x": 0.993, "y": 0.505, "c": "近傍", "n": "FREEDOM [A]  n=3259 cos0.99 難0.51", "s": 0.944, "f": 0}, {"x": 0.991, "y": 0.577, "c": "近傍", "n": "Overload Frontier [A]  n=3366 cos0.99 難0.58", "s": 0.975, "f": 0}, {"x": 0.996, "y": 0.376, "c": "近傍", "n": "Welcome [A]  n=3292 cos1.00 難0.38", "s": 0.954, "f": 0}, {"x": 0.99, "y": 0.625, "c": "近傍", "n": "Routing [A]  n=3451 cos0.99 難0.62", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.535, "c": "近傍", "n": "C-C-C-N-N-N [A]  n=2180 cos0.99 難0.54", "s": 0.632, "f": 0}, {"x": 0.988, "y": 0.639, "c": "近傍", "n": "GO! [A]  n=539 cos0.99 難0.64", "s": 0.156, "f": 0}, {"x": 0.995, "y": 0.862, "c": "近傍", "n": "T.R.O.L.L. [A]  n=1094 cos0.99 難0.86", "s": 0.317, "f": 0}, {"x": 0.988, "y": 0.583, "c": "近傍", "n": "LAB [L]  n=861 cos0.99 難0.58", "s": 0.249, "f": 0}, {"x": 0.988, "y": 0.702, "c": "近傍", "n": "SCHWARZSCHILD FIELD [A]  n=3217 cos0.99 難0.70", "s": 0.932, "f": 0}, {"x": 0.99, "y": 0.387, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [A]  n=2977 cos0.99 難0.39", "s": 0.863, "f": 0}, {"x": 0.989, "y": 0.436, "c": "近傍", "n": "とろぴかる倶楽部 [A]  n=3233 cos0.99 難0.44", "s": 0.937, "f": 0}, {"x": 0.995, "y": 0.266, "c": "近傍", "n": "Catch ya Getcha! [A]  n=1046 cos1.00 難0.27", "s": 0.303, "f": 0}, {"x": 0.989, "y": 0.383, "c": "近傍", "n": "Night! Night! Night! [A]  n=2921 cos0.99 難0.38", "s": 0.846, "f": 0}, {"x": 0.986, "y": 0.648, "c": "近傍", "n": "UMMU [A]  n=3371 cos0.99 難0.65", "s": 0.977, "f": 0}, {"x": 0.986, "y": 0.471, "c": "近傍", "n": "Game Changers [A]  n=1983 cos0.99 難0.47", "s": 0.575, "f": 0}, {"x": 0.99, "y": 0.308, "c": "近傍", "n": "TOKAKU=ALMiRAJ [A]  n=756 cos0.99 難0.31", "s": 0.219, "f": 0}, {"x": 0.986, "y": 0.708, "c": "近傍", "n": "Just a Little Smile [A]  n=3393 cos0.99 難0.71", "s": 0.983, "f": 0}, {"x": 0.992, "y": 0.272, "c": "近傍", "n": "Lovely Howdy Cowboy!! [A]  n=2479 cos0.99 難0.27", "s": 0.718, "f": 0}, {"x": 0.987, "y": 0.403, "c": "近傍", "n": "GALGALIM [A]  n=3078 cos0.99 難0.40", "s": 0.892, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.38578359624886494}, {"a": 0, "b": 2, "w": 0.35228492605747197}, {"a": 0, "b": 3, "w": 0.2701593781165249}, {"a": 0, "b": 4, "w": 0.49739872106345084}, {"a": 0, "b": 5, "w": 0.22648937674455227}, {"a": 0, "b": 6, "w": 0.040277863739578756}, {"a": 0, "b": 7, "w": 0.10990631414330454}, {"a": 0, "b": 8, "w": 0.45507007163248725}, {"a": 0, "b": 9, "w": 0.16525115321603212}, {"a": 0, "b": 10, "w": 0.1890055116434649}, {"a": 0, "b": 11, "w": 0.25608011187511315}, {"a": 0, "b": 12, "w": 0.17970036218445395}, {"a": 0, "b": 13, "w": 0.43316230954486423}, {"a": 0, "b": 14, "w": 0.18474350371038606}, {"a": 0, "b": 15, "w": 4.252664886905677e-11}, {"a": 0, "b": 16, "w": 0.10304321928560378}, {"a": 0, "b": 17, "w": 0.21427431465182545}, {"a": 0, "b": 18, "w": 0.09107567627160995}, {"a": 0, "b": 19, "w": 0.28232265640611387}, {"a": 0, "b": 20, "w": 0.016150470536576367}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=0.218,hiY=0.910;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
