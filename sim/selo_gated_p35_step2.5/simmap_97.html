<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MUSIC TO YOUR HEAD [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.014, "c": "種", "n": "MUSIC TO YOUR HEAD [A]  n=2374 cos1.00 難0.01", "s": 0.723, "f": 0}, {"x": 0.984, "y": -0.026, "c": "近傍", "n": "symbolic [A]  n=2767 cos0.98 難-0.03", "s": 0.843, "f": 0}, {"x": 0.984, "y": -0.097, "c": "近傍", "n": "Golden Horn [A]  n=1924 cos0.98 難-0.10", "s": 0.586, "f": 0}, {"x": 0.984, "y": 0.136, "c": "近傍", "n": "Macho Gang [A]  n=3035 cos0.98 難0.14", "s": 0.924, "f": 0}, {"x": 0.989, "y": -0.291, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2711 cos0.99 難-0.29", "s": 0.826, "f": 0}, {"x": 0.985, "y": -0.175, "c": "近傍", "n": "Freezing atmosphere [A]  n=2166 cos0.98 難-0.17", "s": 0.66, "f": 0}, {"x": 0.985, "y": -0.2, "c": "近傍", "n": "In The Breeze [A]  n=2527 cos0.99 難-0.20", "s": 0.77, "f": 0}, {"x": 0.987, "y": -0.256, "c": "近傍", "n": "pandora [A]  n=2387 cos0.99 難-0.26", "s": 0.727, "f": 0}, {"x": 0.986, "y": -0.245, "c": "近傍", "n": "abstract [A]  n=2276 cos0.99 難-0.24", "s": 0.693, "f": 0}, {"x": 0.986, "y": -0.262, "c": "近傍", "n": "minimalian [A]  n=2136 cos0.99 難-0.26", "s": 0.651, "f": 0}, {"x": 0.988, "y": -0.302, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.77, "f": 0}, {"x": 0.988, "y": -0.327, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.99 難-0.33", "s": 0.761, "f": 0}, {"x": 0.985, "y": -0.254, "c": "近傍", "n": "Scripted Connection⇒ H mix [H]  n=2493 cos0.98 難-0.25", "s": 0.759, "f": 0}, {"x": 0.986, "y": -0.298, "c": "近傍", "n": "Umbral [A]  n=3241 cos0.99 難-0.30", "s": 0.987, "f": 0}, {"x": 0.982, "y": -0.136, "c": "近傍", "n": "awakening [A]  n=2766 cos0.98 難-0.14", "s": 0.843, "f": 0}, {"x": 0.99, "y": -0.375, "c": "近傍", "n": "DXY! [H]  n=1879 cos0.99 難-0.37", "s": 0.572, "f": 0}, {"x": 0.991, "y": -0.399, "c": "近傍", "n": "G2 [H]  n=1587 cos0.99 難-0.40", "s": 0.483, "f": 0}, {"x": 0.985, "y": -0.288, "c": "近傍", "n": "Exchange Place [A]  n=2677 cos0.98 難-0.29", "s": 0.815, "f": 0}, {"x": 0.985, "y": -0.292, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2244 cos0.98 難-0.29", "s": 0.684, "f": 0}, {"x": 0.984, "y": -0.295, "c": "近傍", "n": "Star Trail [A]  n=3283 cos0.98 難-0.29", "s": 1.0, "f": 0}, {"x": 0.979, "y": 0.132, "c": "近傍", "n": "LAB [A]  n=3095 cos0.98 難0.13", "s": 0.943, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.028687738021904385}, {"a": 0, "b": 2, "w": 0.3148138021562831}, {"a": 0, "b": 3, "w": 0.2631814842860195}, {"a": 0, "b": 4, "w": 0.4172608377680065}, {"a": 0, "b": 5, "w": 0.3310290291286211}, {"a": 0, "b": 6, "w": 0.317069022810209}, {"a": 0, "b": 7, "w": 0.38132030771608816}, {"a": 0, "b": 8, "w": 0.35460506020851545}, {"a": 0, "b": 9, "w": 0.359920655355632}, {"a": 0, "b": 10, "w": 0.36833943381466006}, {"a": 0, "b": 11, "w": 0.4027134951775406}, {"a": 0, "b": 12, "w": 0.23872216431397464}, {"a": 0, "b": 13, "w": 0.36646177726817153}, {"a": 0, "b": 14, "w": 0.2721960175031488}, {"a": 0, "b": 15, "w": 0.39636052713872316}, {"a": 0, "b": 16, "w": 0.42909192347655245}, {"a": 0, "b": 17, "w": 0.32765378287937397}, {"a": 0, "b": 18, "w": 0.29405713735588}, {"a": 0, "b": 19, "w": 0.2764341560827286}, {"a": 0, "b": 20, "w": 4.16824352811318e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=-0.442,hiY=0.179;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
