<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Smintheus [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.21, "c": "種", "n": "Smintheus [H]  n=127 cos1.00 難-1.21", "s": 0.054, "f": 0}, {"x": 0.996, "y": -1.131, "c": "近傍", "n": "Sword of Vengeance [H]  n=737 cos1.00 難-1.13", "s": 0.314, "f": 0}, {"x": 0.994, "y": -1.174, "c": "近傍", "n": "VOLAQUAS [H]  n=1075 cos0.99 難-1.17", "s": 0.457, "f": 0}, {"x": 0.993, "y": -1.076, "c": "近傍", "n": "Triple Cross [H]  n=1734 cos0.99 難-1.08", "s": 0.738, "f": 0}, {"x": 0.992, "y": -1.093, "c": "近傍", "n": "cinder [H]  n=1446 cos0.99 難-1.09", "s": 0.615, "f": 0}, {"x": 0.993, "y": -1.068, "c": "近傍", "n": "Aftermath [H]  n=1341 cos0.99 難-1.07", "s": 0.571, "f": 0}, {"x": 0.991, "y": -1.155, "c": "近傍", "n": "Vulkan [H]  n=1929 cos0.99 難-1.15", "s": 0.821, "f": 0}, {"x": 0.99, "y": -1.159, "c": "近傍", "n": "[ ]DENTITY [H]  n=1433 cos0.99 難-1.16", "s": 0.61, "f": 0}, {"x": 0.991, "y": -1.301, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=537 cos0.99 難-1.30", "s": 0.229, "f": 0}, {"x": 0.992, "y": -1.048, "c": "近傍", "n": "Visterhv [H]  n=2069 cos0.99 難-1.05", "s": 0.88, "f": 0}, {"x": 0.993, "y": -1.012, "c": "近傍", "n": "Binary Black Hole [H]  n=1335 cos0.99 難-1.01", "s": 0.568, "f": 0}, {"x": 0.99, "y": -1.153, "c": "近傍", "n": "glacia [H]  n=1069 cos0.99 難-1.15", "s": 0.455, "f": 0}, {"x": 0.99, "y": -1.305, "c": "近傍", "n": "≡+≡ [H]  n=1324 cos0.99 難-1.31", "s": 0.563, "f": 0}, {"x": 0.989, "y": -1.184, "c": "近傍", "n": "スーパー戦湯ババンバーン [H]  n=1258 cos0.99 難-1.18", "s": 0.535, "f": 0}, {"x": 0.989, "y": -1.328, "c": "近傍", "n": "GRAVITON [H]  n=1116 cos0.99 難-1.33", "s": 0.475, "f": 0}, {"x": 0.988, "y": -1.3, "c": "近傍", "n": "Daily Lunch Special [H]  n=1714 cos0.99 難-1.30", "s": 0.729, "f": 0}, {"x": 0.989, "y": -1.065, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1192 cos0.99 難-1.07", "s": 0.507, "f": 0}, {"x": 0.988, "y": -1.292, "c": "近傍", "n": "Arkadia [H]  n=857 cos0.99 難-1.29", "s": 0.365, "f": 0}, {"x": 0.989, "y": -1.382, "c": "近傍", "n": "最小三倍完全数 [H]  n=1145 cos0.99 難-1.38", "s": 0.487, "f": 0}, {"x": 0.987, "y": -1.225, "c": "近傍", "n": "千年ノ理 [H]  n=2350 cos0.99 難-1.22", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.016, "c": "近傍", "n": "Boomy and The Boost [H]  n=2209 cos0.99 難-1.02", "s": 0.94, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3890556979103479}, {"a": 0, "b": 2, "w": 0.43202883937818304}, {"a": 0, "b": 3, "w": 0.42687737671551895}, {"a": 0, "b": 4, "w": 0.32424426623969405}, {"a": 0, "b": 5, "w": 0.4090752274426247}, {"a": 0, "b": 6, "w": 0.15501336149868017}, {"a": 0, "b": 7, "w": 0.23644145281920237}, {"a": 0, "b": 8, "w": 0.07218246966098163}, {"a": 0, "b": 9, "w": 0.3781461052795517}, {"a": 0, "b": 10, "w": 0.429380109413215}, {"a": 0, "b": 11, "w": 0.2543184079311588}, {"a": 0, "b": 12, "w": 0.294389069637068}, {"a": 0, "b": 13, "w": 0.10390562184434382}, {"a": 0, "b": 14, "w": 4.3673842320401945e-11}, {"a": 0, "b": 15, "w": 0.19130093046983554}, {"a": 0, "b": 16, "w": 0.3224985686218248}, {"a": 0, "b": 17, "w": 0.02265121654274982}, {"a": 0, "b": 18, "w": 0.15523264365520262}, {"a": 0, "b": 19, "w": 0.025655234530117754}, {"a": 0, "b": 20, "w": 0.04439991062687787}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.411,hiY=-0.982;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
