<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Perfect Plan [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.755, "c": "種", "n": "Perfect Plan [H]  n=607 cos1.00 難-1.76", "s": 0.468, "f": 0}, {"x": 0.991, "y": -1.726, "c": "近傍", "n": "ハイテックトキオ [H]  n=1060 cos0.99 難-1.73", "s": 0.817, "f": 0}, {"x": 0.995, "y": -1.662, "c": "近傍", "n": "Nocturnal 2097 [H]  n=720 cos1.00 難-1.66", "s": 0.555, "f": 0}, {"x": 0.986, "y": -1.784, "c": "近傍", "n": "Mukade [H]  n=508 cos0.99 難-1.78", "s": 0.392, "f": 0}, {"x": 0.987, "y": -1.817, "c": "近傍", "n": "Ypsilon [H]  n=1065 cos0.99 難-1.82", "s": 0.821, "f": 0}, {"x": 0.985, "y": -1.711, "c": "近傍", "n": "Tail Lights [H]  n=770 cos0.99 難-1.71", "s": 0.594, "f": 0}, {"x": 0.984, "y": -1.756, "c": "近傍", "n": "PHASE SHIFT MANEUVER [H]  n=889 cos0.98 難-1.76", "s": 0.685, "f": 0}, {"x": 0.993, "y": -1.858, "c": "近傍", "n": "Nasty Techniques [H]  n=1266 cos0.99 難-1.86", "s": 0.976, "f": 0}, {"x": 0.986, "y": -1.817, "c": "近傍", "n": "Ergosphere [H]  n=542 cos0.99 難-1.82", "s": 0.418, "f": 0}, {"x": 0.984, "y": -1.716, "c": "近傍", "n": "MA・TSU・RI [H]  n=527 cos0.98 難-1.72", "s": 0.406, "f": 0}, {"x": 0.986, "y": -1.817, "c": "近傍", "n": "Divine Heaven [H]  n=662 cos0.99 難-1.82", "s": 0.51, "f": 0}, {"x": 0.986, "y": -1.693, "c": "近傍", "n": "Neo Heritage [H]  n=804 cos0.99 難-1.69", "s": 0.62, "f": 0}, {"x": 0.983, "y": -1.786, "c": "近傍", "n": "GIGA RAID [H]  n=900 cos0.98 難-1.79", "s": 0.694, "f": 0}, {"x": 0.985, "y": -1.811, "c": "近傍", "n": "THE TIME MACHINE [H]  n=708 cos0.98 難-1.81", "s": 0.546, "f": 0}, {"x": 0.985, "y": -1.692, "c": "近傍", "n": "Rosa azuL [H]  n=628 cos0.99 難-1.69", "s": 0.484, "f": 0}, {"x": 0.982, "y": -1.766, "c": "近傍", "n": "LAST DAY [H]  n=871 cos0.98 難-1.77", "s": 0.672, "f": 0}, {"x": 0.985, "y": -1.682, "c": "近傍", "n": "Submerge Serenade [H]  n=602 cos0.98 難-1.68", "s": 0.464, "f": 0}, {"x": 0.982, "y": -1.704, "c": "近傍", "n": "X-ray binary [H]  n=795 cos0.98 難-1.70", "s": 0.613, "f": 0}, {"x": 0.98, "y": -1.794, "c": "近傍", "n": "Lovely Howdy Cowboy!! [H]  n=780 cos0.98 難-1.79", "s": 0.601, "f": 0}, {"x": 0.988, "y": -1.879, "c": "近傍", "n": "《GRANDMASTER》 [H]  n=690 cos0.99 難-1.88", "s": 0.532, "f": 0}, {"x": 0.978, "y": -1.761, "c": "近傍", "n": "ランカーキラーガール [H]  n=1297 cos0.98 難-1.76", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4270789135771438}, {"a": 0, "b": 2, "w": 0.5721912283170796}, {"a": 0, "b": 3, "w": 0.2773398154379244}, {"a": 0, "b": 4, "w": 0.25587402865921993}, {"a": 0, "b": 5, "w": 0.17834598305073734}, {"a": 0, "b": 6, "w": 0.2204332535795751}, {"a": 0, "b": 7, "w": 0.3768272941809895}, {"a": 0, "b": 8, "w": 0.2691538001182028}, {"a": 0, "b": 9, "w": 0.22993762581608335}, {"a": 0, "b": 10, "w": 0.28251551967649713}, {"a": 0, "b": 11, "w": 0.2196692132439193}, {"a": 0, "b": 12, "w": 0.2089334662592055}, {"a": 0, "b": 13, "w": 0.24086566802157716}, {"a": 0, "b": 14, "w": 0.24999063905580432}, {"a": 0, "b": 15, "w": 0.09701579809458516}, {"a": 0, "b": 16, "w": 0.234087324588366}, {"a": 0, "b": 17, "w": 0.13072970452700738}, {"a": 0, "b": 18, "w": 0.09737433073257151}, {"a": 0, "b": 19, "w": 0.3456397797711275}, {"a": 0, "b": 20, "w": 4.3925862946991856e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.897,hiY=-1.644;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
