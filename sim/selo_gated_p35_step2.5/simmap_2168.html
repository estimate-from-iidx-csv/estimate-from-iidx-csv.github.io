<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Take It Easy [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.107, "c": "種", "n": "Take It Easy [A]  n=3281 cos1.00 難0.11", "s": 0.913, "f": 0}, {"x": 0.995, "y": 0.184, "c": "近傍", "n": "Marie Antoinette [A]  n=1920 cos1.00 難0.18", "s": 0.535, "f": 0}, {"x": 0.994, "y": 0.162, "c": "近傍", "n": "Little Little Princess [A]  n=3442 cos0.99 難0.16", "s": 0.958, "f": 0}, {"x": 0.997, "y": -0.101, "c": "近傍", "n": "Break Stasis [A]  n=3094 cos1.00 難-0.10", "s": 0.861, "f": 0}, {"x": 0.995, "y": -0.03, "c": "近傍", "n": "into the battlefield [A]  n=2997 cos0.99 難-0.03", "s": 0.834, "f": 0}, {"x": 0.994, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos0.99 難-0.02", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.01, "c": "近傍", "n": "PHOTONGENIC [A]  n=2864 cos0.99 難-0.01", "s": 0.797, "f": 0}, {"x": 0.993, "y": 0.206, "c": "近傍", "n": "雫 [A]  n=1348 cos0.99 難0.21", "s": 0.375, "f": 0}, {"x": 0.993, "y": -0.015, "c": "近傍", "n": "少年リップルズ [A]  n=1807 cos0.99 難-0.01", "s": 0.503, "f": 0}, {"x": 0.996, "y": -0.163, "c": "近傍", "n": "Hypersonik [A]  n=3147 cos1.00 難-0.16", "s": 0.876, "f": 0}, {"x": 0.992, "y": 0.056, "c": "近傍", "n": "ランカーキラーガール [A]  n=3145 cos0.99 難0.06", "s": 0.876, "f": 0}, {"x": 0.992, "y": 0.109, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3310 cos0.99 難0.11", "s": 0.921, "f": 0}, {"x": 0.991, "y": 0.133, "c": "近傍", "n": "Jack [A]  n=2851 cos0.99 難0.13", "s": 0.794, "f": 0}, {"x": 0.992, "y": 0.263, "c": "近傍", "n": "prompt [A]  n=3337 cos0.99 難0.26", "s": 0.929, "f": 0}, {"x": 0.993, "y": -0.102, "c": "近傍", "n": "ToyCube Pf.(RX-Ver.S.P.L.) [A]  n=1927 cos0.99 難-0.10", "s": 0.536, "f": 0}, {"x": 0.992, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.661, "f": 0}, {"x": 0.991, "y": 0.046, "c": "近傍", "n": "No Tears [A]  n=3592 cos0.99 難0.05", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.088, "c": "近傍", "n": "超!!遠距離らぶメ～ル [A]  n=2979 cos0.99 難-0.09", "s": 0.829, "f": 0}, {"x": 0.996, "y": -0.212, "c": "近傍", "n": "Let me be your cure [A]  n=3106 cos1.00 難-0.21", "s": 0.865, "f": 0}, {"x": 0.995, "y": -0.196, "c": "近傍", "n": "beatAffection [A]  n=2812 cos1.00 難-0.20", "s": 0.783, "f": 0}, {"x": 0.991, "y": 0.128, "c": "近傍", "n": "きみのせかい [A]  n=1145 cos0.99 難0.13", "s": 0.319, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4606418779805237}, {"a": 0, "b": 2, "w": 0.2643114941174204}, {"a": 0, "b": 3, "w": 0.6002403786498869}, {"a": 0, "b": 4, "w": 0.5002244190765848}, {"a": 0, "b": 5, "w": 0.34327943259879135}, {"a": 0, "b": 6, "w": 0.3866999139509423}, {"a": 0, "b": 7, "w": 0.24452817009811756}, {"a": 0, "b": 8, "w": 0.33882546650478573}, {"a": 0, "b": 9, "w": 0.5802864340892325}, {"a": 0, "b": 10, "w": 0.11929717040005527}, {"a": 0, "b": 11, "w": 0.3526834033266746}, {"a": 0, "b": 12, "w": 0.331425116135423}, {"a": 0, "b": 13, "w": 0.2113877901464326}, {"a": 0, "b": 14, "w": 0.35170491420993755}, {"a": 0, "b": 15, "w": 0.35723033273934224}, {"a": 0, "b": 16, "w": 0.326149994801069}, {"a": 0, "b": 17, "w": 0.3884757126900267}, {"a": 0, "b": 18, "w": 0.5651142534993253}, {"a": 0, "b": 19, "w": 0.5323593242857122}, {"a": 0, "b": 20, "w": 4.633082806293487e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.250,hiY=0.301;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
