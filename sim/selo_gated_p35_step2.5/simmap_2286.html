<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">バッドエンド・シンドローム [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.097, "c": "種", "n": "バッドエンド・シンドローム [A]  n=2757 cos1.00 難0.10", "s": 0.75, "f": 0}, {"x": 0.996, "y": 0.076, "c": "近傍", "n": "KEY [A]  n=3461 cos1.00 難0.08", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.177, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3555 cos1.00 難0.18", "s": 0.967, "f": 0}, {"x": 0.993, "y": 0.106, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3408 cos0.99 難0.11", "s": 0.927, "f": 0}, {"x": 0.993, "y": 0.132, "c": "近傍", "n": "Fervidex [A]  n=3426 cos0.99 難0.13", "s": 0.932, "f": 0}, {"x": 0.992, "y": 0.046, "c": "近傍", "n": "No Tears [A]  n=3592 cos0.99 難0.05", "s": 0.977, "f": 0}, {"x": 0.993, "y": 0.208, "c": "近傍", "n": "≡+≡ [A]  n=2296 cos0.99 難0.21", "s": 0.625, "f": 0}, {"x": 0.992, "y": 0.195, "c": "近傍", "n": "月とミルク [A]  n=2662 cos0.99 難0.19", "s": 0.724, "f": 0}, {"x": 0.995, "y": -0.085, "c": "近傍", "n": "SnapSkipSpark [A]  n=1095 cos1.00 難-0.09", "s": 0.298, "f": 0}, {"x": 0.991, "y": 0.031, "c": "近傍", "n": "This is Love [A]  n=2481 cos0.99 難0.03", "s": 0.675, "f": 0}, {"x": 0.992, "y": -0.025, "c": "近傍", "n": "LOVELY STORM [A]  n=2978 cos0.99 難-0.02", "s": 0.81, "f": 0}, {"x": 0.99, "y": 0.057, "c": "近傍", "n": "輪廻の鴉 [A]  n=1953 cos0.99 難0.06", "s": 0.531, "f": 0}, {"x": 0.993, "y": 0.269, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3281 cos0.99 難0.27", "s": 0.893, "f": 0}, {"x": 0.992, "y": 0.234, "c": "近傍", "n": "華蝶風雪 [A]  n=3533 cos0.99 難0.23", "s": 0.961, "f": 0}, {"x": 0.99, "y": 0.096, "c": "近傍", "n": "恋は白帯、サンシロー [L]  n=3246 cos0.99 難0.10", "s": 0.883, "f": 0}, {"x": 0.991, "y": -0.042, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2376 cos0.99 難-0.04", "s": 0.647, "f": 0}, {"x": 0.991, "y": 0.248, "c": "近傍", "n": "waxing and wanding [A]  n=3675 cos0.99 難0.25", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.056, "c": "近傍", "n": "ランカーキラーガール [A]  n=3145 cos0.99 難0.06", "s": 0.856, "f": 0}, {"x": 0.997, "y": -0.155, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2768 cos1.00 難-0.16", "s": 0.753, "f": 0}, {"x": 0.992, "y": 0.278, "c": "近傍", "n": "AsiaN distractive [A]  n=3185 cos0.99 難0.28", "s": 0.867, "f": 0}, {"x": 0.995, "y": 0.333, "c": "近傍", "n": "Unicorn tail [A]  n=3495 cos0.99 難0.33", "s": 0.951, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4405664399567145}, {"a": 0, "b": 2, "w": 0.41552811114841004}, {"a": 0, "b": 3, "w": 0.27601851411240785}, {"a": 0, "b": 4, "w": 0.20034989375785095}, {"a": 0, "b": 5, "w": 0.07029857564251685}, {"a": 0, "b": 6, "w": 0.25671526455078253}, {"a": 0, "b": 7, "w": 0.20709902435960892}, {"a": 0, "b": 8, "w": 0.41740452066470657}, {"a": 0, "b": 9, "w": 0.12451921419334899}, {"a": 0, "b": 10, "w": 0.18411544026345716}, {"a": 0, "b": 11, "w": 0.17160338894540583}, {"a": 0, "b": 12, "w": 0.2791863315670391}, {"a": 0, "b": 13, "w": 0.220209420494609}, {"a": 0, "b": 14, "w": 0.12079540671211708}, {"a": 0, "b": 15, "w": 0.01700643033698801}, {"a": 0, "b": 16, "w": 4.9335646679082856e-11}, {"a": 0, "b": 17, "w": 0.1137176291570654}, {"a": 0, "b": 18, "w": 0.51959130288553}, {"a": 0, "b": 19, "w": 0.20615365821016507}, {"a": 0, "b": 20, "w": 0.3674628016115066}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.194,hiY=0.373;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
