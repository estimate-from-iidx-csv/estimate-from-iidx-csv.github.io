<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">共犯ヘヴンズコード [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.178, "c": "種", "n": "共犯ヘヴンズコード [A]  n=2781 cos1.00 難-0.18", "s": 0.739, "f": 0}, {"x": 0.994, "y": -0.223, "c": "近傍", "n": "Hold My Hand [A]  n=2574 cos0.99 難-0.22", "s": 0.684, "f": 0}, {"x": 0.994, "y": -0.076, "c": "近傍", "n": "Ventriloquist [A]  n=2650 cos0.99 難-0.08", "s": 0.704, "f": 0}, {"x": 0.993, "y": -0.118, "c": "近傍", "n": "Piano Samurai [A]  n=2816 cos0.99 難-0.12", "s": 0.748, "f": 0}, {"x": 0.997, "y": 0.109, "c": "近傍", "n": "CaptivAte～浄化～ [A]  n=3648 cos1.00 難0.11", "s": 0.969, "f": 0}, {"x": 0.992, "y": -0.304, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3211 cos0.99 難-0.30", "s": 0.853, "f": 0}, {"x": 0.991, "y": -0.239, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3177 cos0.99 難-0.24", "s": 0.844, "f": 0}, {"x": 0.994, "y": 0.108, "c": "近傍", "n": "50th Memorial Songs -Flagship medley- [A]  n=2093 cos0.99 難0.11", "s": 0.556, "f": 0}, {"x": 0.991, "y": -0.127, "c": "近傍", "n": "Punch Love 仮面 [A]  n=2991 cos0.99 難-0.13", "s": 0.795, "f": 0}, {"x": 0.991, "y": -0.164, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3048 cos0.99 難-0.16", "s": 0.81, "f": 0}, {"x": 0.991, "y": -0.282, "c": "近傍", "n": "SHOOTING STAR [A]  n=2343 cos0.99 難-0.28", "s": 0.623, "f": 0}, {"x": 0.991, "y": -0.344, "c": "近傍", "n": "Follow Tomorrow [A]  n=3529 cos0.99 難-0.34", "s": 0.938, "f": 0}, {"x": 0.991, "y": -0.127, "c": "近傍", "n": "First Resolution [A]  n=2082 cos0.99 難-0.13", "s": 0.553, "f": 0}, {"x": 0.991, "y": -0.258, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos0.99 難-0.26", "s": 0.725, "f": 0}, {"x": 0.991, "y": -0.318, "c": "近傍", "n": "Voo Doo Bamboleo [A]  n=2378 cos0.99 難-0.32", "s": 0.632, "f": 0}, {"x": 0.991, "y": -0.028, "c": "近傍", "n": "煉獄コンフィチュール [A]  n=1063 cos0.99 難-0.03", "s": 0.282, "f": 0}, {"x": 0.991, "y": -0.063, "c": "近傍", "n": "THE SAFARI [H]  n=3763 cos0.99 難-0.06", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.013, "c": "近傍", "n": "朧 [L]  n=3664 cos0.99 難0.01", "s": 0.974, "f": 0}, {"x": 0.99, "y": -0.142, "c": "近傍", "n": "alla turca con passione [A]  n=2818 cos0.99 難-0.14", "s": 0.749, "f": 0}, {"x": 0.992, "y": 0.057, "c": "近傍", "n": "Make A Difference [A]  n=2551 cos0.99 難0.06", "s": 0.678, "f": 0}, {"x": 0.99, "y": -0.226, "c": "近傍", "n": "メイメツ、フラグメンツ [A]  n=3205 cos0.99 難-0.23", "s": 0.852, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32298786330245055}, {"a": 0, "b": 2, "w": 0.25076680684737307}, {"a": 0, "b": 3, "w": 0.16733751704712674}, {"a": 0, "b": 4, "w": 0.34999842429202943}, {"a": 0, "b": 5, "w": 0.19692072658136106}, {"a": 0, "b": 6, "w": 0.17841169474131213}, {"a": 0, "b": 7, "w": 0.32047836233992355}, {"a": 0, "b": 8, "w": 0.07783912561122874}, {"a": 0, "b": 9, "w": 0.16486701206561083}, {"a": 0, "b": 10, "w": 5.615430342942318e-11}, {"a": 0, "b": 11, "w": 0.1640895980690994}, {"a": 0, "b": 12, "w": 0.026505747228821597}, {"a": 0, "b": 13, "w": 0.15836763355871553}, {"a": 0, "b": 14, "w": 0.12866372561220563}, {"a": 0, "b": 15, "w": 0.036404541198270635}, {"a": 0, "b": 16, "w": 0.10722099395094553}, {"a": 0, "b": 17, "w": 0.1795031817059768}, {"a": 0, "b": 18, "w": 0.088712308965462}, {"a": 0, "b": 19, "w": 0.1978473698246126}, {"a": 0, "b": 20, "w": 0.11084574737027786}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.380,hiY=0.145;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
