<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Catch Our Fire! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.827, "c": "種", "n": "Catch Our Fire! [H]  n=1841 cos1.00 難-0.83", "s": 0.613, "f": 0}, {"x": 0.998, "y": -0.903, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1326 cos1.00 難-0.90", "s": 0.442, "f": 0}, {"x": 0.996, "y": -0.883, "c": "近傍", "n": "PUNISHER [H]  n=2323 cos1.00 難-0.88", "s": 0.774, "f": 0}, {"x": 0.995, "y": -0.84, "c": "近傍", "n": "Caterpillar [H]  n=2202 cos1.00 難-0.84", "s": 0.734, "f": 0}, {"x": 0.995, "y": -0.821, "c": "近傍", "n": "MAX 360 [H]  n=772 cos0.99 難-0.82", "s": 0.257, "f": 0}, {"x": 0.996, "y": -0.915, "c": "近傍", "n": "u gotta beat [H]  n=948 cos1.00 難-0.92", "s": 0.316, "f": 0}, {"x": 0.996, "y": -0.933, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2493 cos1.00 難-0.93", "s": 0.83, "f": 0}, {"x": 0.993, "y": -0.814, "c": "近傍", "n": "∀ [H]  n=2296 cos0.99 難-0.81", "s": 0.765, "f": 0}, {"x": 0.996, "y": -0.953, "c": "近傍", "n": "Fegrix [H]  n=1718 cos1.00 難-0.95", "s": 0.572, "f": 0}, {"x": 0.998, "y": -0.681, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1859 cos1.00 難-0.68", "s": 0.619, "f": 0}, {"x": 0.993, "y": -0.806, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=740 cos0.99 難-0.81", "s": 0.247, "f": 0}, {"x": 0.993, "y": -0.8, "c": "近傍", "n": "Artist [H]  n=1575 cos0.99 難-0.80", "s": 0.525, "f": 0}, {"x": 0.992, "y": -0.816, "c": "近傍", "n": "EVANESCENT [H]  n=1488 cos0.99 難-0.82", "s": 0.496, "f": 0}, {"x": 0.992, "y": -0.886, "c": "近傍", "n": "Grand Chariot [H]  n=2692 cos0.99 難-0.89", "s": 0.897, "f": 0}, {"x": 0.992, "y": -0.884, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2505 cos0.99 難-0.88", "s": 0.834, "f": 0}, {"x": 0.992, "y": -0.758, "c": "近傍", "n": "Modular Technology [H]  n=2231 cos0.99 難-0.76", "s": 0.743, "f": 0}, {"x": 0.992, "y": -0.818, "c": "近傍", "n": "仮想空間の旅人たち [H]  n=2269 cos0.99 難-0.82", "s": 0.756, "f": 0}, {"x": 0.992, "y": -0.759, "c": "近傍", "n": "Light and Cyber… [H]  n=2224 cos0.99 難-0.76", "s": 0.741, "f": 0}, {"x": 0.995, "y": -0.679, "c": "近傍", "n": "LAB [H]  n=1742 cos0.99 難-0.68", "s": 0.58, "f": 0}, {"x": 0.991, "y": -0.823, "c": "近傍", "n": "God Mind [H]  n=718 cos0.99 難-0.82", "s": 0.239, "f": 0}, {"x": 0.994, "y": -0.673, "c": "近傍", "n": "RED ZONE [H]  n=3002 cos0.99 難-0.67", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4492204131882567}, {"a": 0, "b": 2, "w": 0.48372093854760534}, {"a": 0, "b": 3, "w": 0.4342967332377877}, {"a": 0, "b": 4, "w": 0.45377344679579523}, {"a": 0, "b": 5, "w": 0.5408228980716477}, {"a": 0, "b": 6, "w": 0.31437964623027337}, {"a": 0, "b": 7, "w": 0.3283453063545346}, {"a": 0, "b": 8, "w": 0.46985009457274063}, {"a": 0, "b": 9, "w": 0.6270555143344057}, {"a": 0, "b": 10, "w": 0.3643009379986456}, {"a": 0, "b": 11, "w": 0.349982072418383}, {"a": 0, "b": 12, "w": 0.33402386679665264}, {"a": 0, "b": 13, "w": 0.2816471539025056}, {"a": 0, "b": 14, "w": 0.2174427025434199}, {"a": 0, "b": 15, "w": 0.27045966315799186}, {"a": 0, "b": 16, "w": 4.883093929208826e-11}, {"a": 0, "b": 17, "w": 0.19118044287809022}, {"a": 0, "b": 18, "w": 0.29551276746790844}, {"a": 0, "b": 19, "w": 0.08358161908886486}, {"a": 0, "b": 20, "w": 0.18429109034008073}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.976,hiY=-0.651;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
