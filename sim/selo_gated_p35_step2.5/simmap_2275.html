<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">セロトニン [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.101, "c": "種", "n": "セロトニン [A]  n=3330 cos1.00 難0.10", "s": 0.941, "f": 0}, {"x": 0.996, "y": 0.056, "c": "近傍", "n": "Programmed Genom [A]  n=2257 cos1.00 難0.06", "s": 0.638, "f": 0}, {"x": 0.995, "y": 0.134, "c": "近傍", "n": "Nasty Techniques [A]  n=2976 cos1.00 難0.13", "s": 0.841, "f": 0}, {"x": 0.995, "y": 0.143, "c": "近傍", "n": "SPEED ROCKER [A]  n=2665 cos1.00 難0.14", "s": 0.753, "f": 0}, {"x": 0.997, "y": -0.081, "c": "近傍", "n": "Nowhere [A]  n=2750 cos1.00 難-0.08", "s": 0.777, "f": 0}, {"x": 0.996, "y": 0.255, "c": "近傍", "n": "Broadbanded [A]  n=3243 cos1.00 難0.25", "s": 0.916, "f": 0}, {"x": 0.995, "y": 0.041, "c": "近傍", "n": "D.C.fish [A]  n=3540 cos0.99 難0.04", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.21, "c": "近傍", "n": "Rising in the Sun(original mix) [A]  n=2243 cos0.99 難0.21", "s": 0.634, "f": 0}, {"x": 0.995, "y": -0.04, "c": "近傍", "n": "lower world [A]  n=2593 cos1.00 難-0.04", "s": 0.732, "f": 0}, {"x": 0.995, "y": -0.081, "c": "近傍", "n": "Votum stellarum [A]  n=2865 cos1.00 難-0.08", "s": 0.809, "f": 0}, {"x": 0.996, "y": -0.089, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2768 cos1.00 難-0.09", "s": 0.782, "f": 0}, {"x": 0.996, "y": -0.104, "c": "近傍", "n": "Get Higher [A]  n=1861 cos1.00 難-0.10", "s": 0.526, "f": 0}, {"x": 0.994, "y": 0.114, "c": "近傍", "n": "S!ck (Nhato Remix) [A]  n=2858 cos0.99 難0.11", "s": 0.807, "f": 0}, {"x": 0.995, "y": -0.078, "c": "近傍", "n": "Praludium [A]  n=2983 cos1.00 難-0.08", "s": 0.843, "f": 0}, {"x": 0.994, "y": 0.04, "c": "近傍", "n": "Believe In Me [A]  n=3507 cos0.99 難0.04", "s": 0.991, "f": 0}, {"x": 0.994, "y": -0.031, "c": "近傍", "n": "Amethyst [A]  n=1480 cos0.99 難-0.03", "s": 0.418, "f": 0}, {"x": 0.993, "y": 0.045, "c": "近傍", "n": "牧神笛吹きて [A]  n=3419 cos0.99 難0.04", "s": 0.966, "f": 0}, {"x": 0.993, "y": 0.119, "c": "近傍", "n": "spiral galaxy [A]  n=3271 cos0.99 難0.12", "s": 0.924, "f": 0}, {"x": 0.996, "y": 0.377, "c": "近傍", "n": "Aublia [A]  n=3096 cos1.00 難0.38", "s": 0.875, "f": 0}, {"x": 0.993, "y": 0.133, "c": "近傍", "n": "GIGA RAID [A]  n=2792 cos0.99 難0.13", "s": 0.789, "f": 0}, {"x": 0.994, "y": -0.076, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.99 難-0.08", "s": 0.876, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43038346220035406}, {"a": 0, "b": 2, "w": 0.13736429515998216}, {"a": 0, "b": 3, "w": 0.34600788832763263}, {"a": 0, "b": 4, "w": 0.3143447497933145}, {"a": 0, "b": 5, "w": 5.93390891978629e-11}, {"a": 0, "b": 6, "w": 0.27793451708800676}, {"a": 0, "b": 7, "w": 0.22973760359064743}, {"a": 0, "b": 8, "w": 0.3302448133309891}, {"a": 0, "b": 9, "w": 0.21785435377030404}, {"a": 0, "b": 10, "w": 0.24953522629727942}, {"a": 0, "b": 11, "w": 0.3732593595989012}, {"a": 0, "b": 12, "w": 0.13682756740097957}, {"a": 0, "b": 13, "w": 0.3081015434057397}, {"a": 0, "b": 14, "w": 0.25668479338902006}, {"a": 0, "b": 15, "w": 0.24062510668199832}, {"a": 0, "b": 16, "w": 0.1902472575299674}, {"a": 0, "b": 17, "w": 0.2000275699293691}, {"a": 0, "b": 18, "w": 0.31424834655229783}, {"a": 0, "b": 19, "w": 0.18775031224794836}, {"a": 0, "b": 20, "w": 0.06763051651137175}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.142,hiY=0.416;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
