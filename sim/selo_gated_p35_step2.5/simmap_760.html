<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">awakening [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.136, "c": "種", "n": "awakening [A]  n=2766 cos1.00 難-0.14", "s": 0.892, "f": 0}, {"x": 0.993, "y": -0.075, "c": "近傍", "n": "2hot2eat [A]  n=1063 cos0.99 難-0.07", "s": 0.343, "f": 0}, {"x": 0.991, "y": -0.214, "c": "近傍", "n": "That Feeling [A]  n=2075 cos0.99 難-0.21", "s": 0.669, "f": 0}, {"x": 0.99, "y": -0.327, "c": "近傍", "n": "MOON RACE [A]  n=2497 cos0.99 難-0.33", "s": 0.805, "f": 0}, {"x": 0.988, "y": -0.196, "c": "近傍", "n": "moon_child [H]  n=2782 cos0.99 難-0.20", "s": 0.897, "f": 0}, {"x": 0.988, "y": -0.153, "c": "近傍", "n": "e-motion 2003  -romantic extra- [A]  n=2824 cos0.99 難-0.15", "s": 0.91, "f": 0}, {"x": 0.995, "y": -0.459, "c": "近傍", "n": "quell～the seventh slave～ [H]  n=2525 cos0.99 難-0.46", "s": 0.814, "f": 0}, {"x": 0.987, "y": -0.081, "c": "近傍", "n": "Votum stellarum [A]  n=2865 cos0.99 難-0.08", "s": 0.924, "f": 0}, {"x": 0.989, "y": 0.102, "c": "近傍", "n": "Narcissus At Oasis [A]  n=2841 cos0.99 難0.10", "s": 0.916, "f": 0}, {"x": 0.986, "y": -0.175, "c": "近傍", "n": "Freezing atmosphere [A]  n=2166 cos0.99 難-0.17", "s": 0.698, "f": 0}, {"x": 0.987, "y": -0.299, "c": "近傍", "n": "Change the World [A]  n=2744 cos0.99 難-0.30", "s": 0.885, "f": 0}, {"x": 0.989, "y": -0.389, "c": "近傍", "n": "thunder [A]  n=2861 cos0.99 難-0.39", "s": 0.922, "f": 0}, {"x": 0.986, "y": -0.156, "c": "近傍", "n": "double thrash [H]  n=2121 cos0.99 難-0.16", "s": 0.684, "f": 0}, {"x": 0.985, "y": -0.199, "c": "近傍", "n": "madrugada [A]  n=2180 cos0.98 難-0.20", "s": 0.703, "f": 0}, {"x": 0.986, "y": -0.297, "c": "近傍", "n": "Wonderful Escape [A]  n=2305 cos0.99 難-0.30", "s": 0.743, "f": 0}, {"x": 0.985, "y": -0.302, "c": "近傍", "n": "heaven above [A]  n=2529 cos0.99 難-0.30", "s": 0.815, "f": 0}, {"x": 0.984, "y": -0.195, "c": "近傍", "n": "avant-guerre [A]  n=2852 cos0.98 難-0.19", "s": 0.919, "f": 0}, {"x": 0.984, "y": -0.076, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3102 cos0.98 難-0.08", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.328, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2072 cos0.98 難-0.33", "s": 0.668, "f": 0}, {"x": 0.983, "y": -0.2, "c": "近傍", "n": "In The Breeze [A]  n=2527 cos0.98 難-0.20", "s": 0.815, "f": 0}, {"x": 0.984, "y": -0.262, "c": "近傍", "n": "minimalian [A]  n=2136 cos0.98 難-0.26", "s": 0.689, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3421797256125515}, {"a": 0, "b": 2, "w": 0.15707546192409505}, {"a": 0, "b": 3, "w": 0.3381361585001865}, {"a": 0, "b": 4, "w": 0.028262567207656852}, {"a": 0, "b": 5, "w": 0.2666832335484237}, {"a": 0, "b": 6, "w": 0.4782425402315088}, {"a": 0, "b": 7, "w": 0.054494926498026675}, {"a": 0, "b": 8, "w": 0.11534802581591164}, {"a": 0, "b": 9, "w": 0.2114036146820799}, {"a": 0, "b": 10, "w": 0.23079600111612064}, {"a": 0, "b": 11, "w": 0.29004813185688894}, {"a": 0, "b": 12, "w": 0.014881225987317337}, {"a": 0, "b": 13, "w": 0.15327845388037042}, {"a": 0, "b": 14, "w": 5.194411567543966e-11}, {"a": 0, "b": 15, "w": 0.16133695656571556}, {"a": 0, "b": 16, "w": 0.1309982705426499}, {"a": 0, "b": 17, "w": 0.031987471973570214}, {"a": 0, "b": 18, "w": 0.16012352737346625}, {"a": 0, "b": 19, "w": 0.09499802789654077}, {"a": 0, "b": 20, "w": 0.1376813444032715}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.504,hiY=0.147;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
