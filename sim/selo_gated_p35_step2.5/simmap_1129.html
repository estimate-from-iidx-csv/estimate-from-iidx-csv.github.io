<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">アルストロメリア [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.359, "c": "種", "n": "アルストロメリア [A]  n=3691 cos1.00 難-0.36", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.356, "c": "近傍", "n": "Answer [A]  n=3214 cos1.00 難-0.36", "s": 0.871, "f": 0}, {"x": 0.998, "y": -0.263, "c": "近傍", "n": "ACCELERATE [A]  n=3000 cos1.00 難-0.26", "s": 0.813, "f": 0}, {"x": 0.997, "y": -0.254, "c": "近傍", "n": "Everlasting Last [A]  n=3198 cos1.00 難-0.25", "s": 0.866, "f": 0}, {"x": 0.997, "y": -0.223, "c": "近傍", "n": "Be OK [A]  n=2981 cos1.00 難-0.22", "s": 0.808, "f": 0}, {"x": 0.996, "y": -0.415, "c": "近傍", "n": "Nyan Nyan University [A]  n=1120 cos1.00 難-0.42", "s": 0.303, "f": 0}, {"x": 0.996, "y": -0.238, "c": "近傍", "n": "Fly you to the star [A]  n=3233 cos1.00 難-0.24", "s": 0.876, "f": 0}, {"x": 0.995, "y": -0.365, "c": "近傍", "n": "ZEROIN ON THE LIGHT [A]  n=1589 cos1.00 難-0.36", "s": 0.431, "f": 0}, {"x": 0.995, "y": -0.325, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2376 cos1.00 難-0.32", "s": 0.644, "f": 0}, {"x": 0.995, "y": -0.287, "c": "近傍", "n": "Fading Stars [A]  n=1793 cos1.00 難-0.29", "s": 0.486, "f": 0}, {"x": 0.996, "y": -0.245, "c": "近傍", "n": "深愛のリグレット [A]  n=2677 cos1.00 難-0.25", "s": 0.725, "f": 0}, {"x": 0.995, "y": -0.379, "c": "近傍", "n": "Twilight Warp [A]  n=2518 cos0.99 難-0.38", "s": 0.682, "f": 0}, {"x": 0.995, "y": -0.25, "c": "近傍", "n": "Prohibited Props [A]  n=2362 cos1.00 難-0.25", "s": 0.64, "f": 0}, {"x": 0.995, "y": -0.258, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2727 cos1.00 難-0.26", "s": 0.739, "f": 0}, {"x": 0.995, "y": -0.254, "c": "近傍", "n": "リグレット [A]  n=3196 cos0.99 難-0.25", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.248, "c": "近傍", "n": "Turii ～Panta rhei～ [A]  n=3426 cos0.99 難-0.25", "s": 0.928, "f": 0}, {"x": 0.995, "y": -0.196, "c": "近傍", "n": "Why did you go away [A]  n=3126 cos1.00 難-0.20", "s": 0.847, "f": 0}, {"x": 0.996, "y": -0.141, "c": "近傍", "n": "Vitamin [A]  n=1127 cos1.00 難-0.14", "s": 0.305, "f": 0}, {"x": 0.996, "y": -0.581, "c": "近傍", "n": "不死身ごっこ [A]  n=705 cos1.00 難-0.58", "s": 0.191, "f": 0}, {"x": 0.995, "y": -0.174, "c": "近傍", "n": "1001 -ESCAPE- [A]  n=3068 cos1.00 難-0.17", "s": 0.831, "f": 0}, {"x": 0.995, "y": -0.194, "c": "近傍", "n": "N.O. [A]  n=2211 cos0.99 難-0.19", "s": 0.599, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49905698250258723}, {"a": 0, "b": 2, "w": 0.5577648732682599}, {"a": 0, "b": 3, "w": 0.4193003317219196}, {"a": 0, "b": 4, "w": 0.4639550712808901}, {"a": 0, "b": 5, "w": 0.1538595959633382}, {"a": 0, "b": 6, "w": 0.42642485842155675}, {"a": 0, "b": 7, "w": 0.1677955739775564}, {"a": 0, "b": 8, "w": 0.3493039349356749}, {"a": 0, "b": 9, "w": 0.10732659448677229}, {"a": 0, "b": 10, "w": 0.36668685582495053}, {"a": 0, "b": 11, "w": 0.20141474565963147}, {"a": 0, "b": 12, "w": 0.30029731872062726}, {"a": 0, "b": 13, "w": 0.2052346941280413}, {"a": 0, "b": 14, "w": 0.2914255860250521}, {"a": 0, "b": 15, "w": 0.15876298654238918}, {"a": 0, "b": 16, "w": 0.3386547010446135}, {"a": 0, "b": 17, "w": 6.52891074537365e-11}, {"a": 0, "b": 18, "w": 0.40655762261836537}, {"a": 0, "b": 19, "w": 0.013212580587806166}, {"a": 0, "b": 20, "w": 0.3141860360456076}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.616,hiY=-0.106;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
