<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BLAZING_LAZER [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.977, "c": "種", "n": "BLAZING_LAZER [A]  n=1566 cos1.00 難0.98", "s": 0.446, "f": 0}, {"x": 0.996, "y": 0.989, "c": "近傍", "n": "Seven Times Four [A]  n=1333 cos1.00 難0.99", "s": 0.38, "f": 0}, {"x": 0.995, "y": 1.011, "c": "近傍", "n": "AKASHIC BREAK [A]  n=2962 cos0.99 難1.01", "s": 0.844, "f": 0}, {"x": 0.995, "y": 0.932, "c": "近傍", "n": "PUNISHER [A]  n=3509 cos1.00 難0.93", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.969, "c": "近傍", "n": "Dahlia [A]  n=1923 cos0.99 難0.97", "s": 0.548, "f": 0}, {"x": 0.995, "y": 1.036, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1132 cos1.00 難1.04", "s": 0.323, "f": 0}, {"x": 0.995, "y": 0.917, "c": "近傍", "n": "Catch Our Fire! [A]  n=3272 cos1.00 難0.92", "s": 0.932, "f": 0}, {"x": 0.994, "y": 0.923, "c": "近傍", "n": "それは花火のような恋 [A]  n=3456 cos0.99 難0.92", "s": 0.985, "f": 0}, {"x": 0.997, "y": 0.875, "c": "近傍", "n": "即席！脳直★ミュージックシステム [A]  n=3503 cos1.00 難0.87", "s": 0.998, "f": 0}, {"x": 0.991, "y": 1.023, "c": "近傍", "n": "L.F.O [A]  n=3209 cos0.99 難1.02", "s": 0.915, "f": 0}, {"x": 0.998, "y": 1.097, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2239 cos1.00 難1.10", "s": 0.638, "f": 0}, {"x": 0.993, "y": 0.885, "c": "近傍", "n": "ACT0 [A]  n=1598 cos0.99 難0.88", "s": 0.455, "f": 0}, {"x": 0.992, "y": 1.047, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3455 cos0.99 難1.05", "s": 0.985, "f": 0}, {"x": 0.991, "y": 0.937, "c": "近傍", "n": "狂イ咲ケ焔ノ華 [A]  n=3491 cos0.99 難0.94", "s": 0.995, "f": 0}, {"x": 0.991, "y": 1.016, "c": "近傍", "n": "Roar of Chronos [A]  n=1315 cos0.99 難1.02", "s": 0.375, "f": 0}, {"x": 0.996, "y": 1.096, "c": "近傍", "n": "The Last Apocalypse [A]  n=1425 cos1.00 難1.10", "s": 0.406, "f": 0}, {"x": 0.99, "y": 1.007, "c": "近傍", "n": "Evans [A]  n=3441 cos0.99 難1.01", "s": 0.981, "f": 0}, {"x": 0.993, "y": 0.883, "c": "近傍", "n": "Fegrix [A]  n=2634 cos0.99 難0.88", "s": 0.751, "f": 0}, {"x": 0.997, "y": 1.102, "c": "近傍", "n": "MARLIN [A]  n=1133 cos1.00 難1.10", "s": 0.323, "f": 0}, {"x": 0.99, "y": 0.994, "c": "近傍", "n": "Out of Control [A]  n=1758 cos0.99 難0.99", "s": 0.501, "f": 0}, {"x": 0.99, "y": 0.97, "c": "近傍", "n": "FUZIN RIZIN [A]  n=3386 cos0.99 難0.97", "s": 0.965, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4109579303763552}, {"a": 0, "b": 2, "w": 0.07839118091699182}, {"a": 0, "b": 3, "w": 0.296290499071859}, {"a": 0, "b": 4, "w": 0.30836326428537975}, {"a": 0, "b": 5, "w": 0.40638977743989946}, {"a": 0, "b": 6, "w": 0.35321747686334604}, {"a": 0, "b": 7, "w": 0.16448877284991337}, {"a": 0, "b": 8, "w": 0.4476364101558882}, {"a": 0, "b": 9, "w": 0.16878260097862452}, {"a": 0, "b": 10, "w": 0.5912088743869586}, {"a": 0, "b": 11, "w": 0.21536478189801456}, {"a": 0, "b": 12, "w": 0.15804230848011602}, {"a": 0, "b": 13, "w": 0.15841144749821112}, {"a": 0, "b": 14, "w": 0.022961709901197724}, {"a": 0, "b": 15, "w": 0.439798819246521}, {"a": 0, "b": 16, "w": 0.14159816911613632}, {"a": 0, "b": 17, "w": 0.23720418969833978}, {"a": 0, "b": 18, "w": 0.4744093754681826}, {"a": 0, "b": 19, "w": 0.09185664486512168}, {"a": 0, "b": 20, "w": 4.2553738310857625e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.857,hiY=1.120;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
