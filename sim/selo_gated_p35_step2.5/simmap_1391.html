<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">IMPLANTATION [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.471, "c": "種", "n": "IMPLANTATION [H]  n=2233 cos1.00 難-0.47", "s": 0.668, "f": 0}, {"x": 0.995, "y": -0.538, "c": "近傍", "n": "Sphere [H]  n=1980 cos0.99 難-0.54", "s": 0.593, "f": 0}, {"x": 0.995, "y": -0.313, "c": "近傍", "n": "NΦ CRIME [A]  n=2777 cos0.99 難-0.31", "s": 0.831, "f": 0}, {"x": 0.993, "y": -0.45, "c": "近傍", "n": "ZZ [H]  n=3341 cos0.99 難-0.45", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.346, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2558 cos0.99 難-0.35", "s": 0.766, "f": 0}, {"x": 0.993, "y": -0.38, "c": "近傍", "n": "Saturn [H]  n=2300 cos0.99 難-0.38", "s": 0.688, "f": 0}, {"x": 0.993, "y": -0.61, "c": "近傍", "n": "traces [H]  n=1627 cos0.99 難-0.61", "s": 0.487, "f": 0}, {"x": 0.994, "y": -0.66, "c": "近傍", "n": "DRUNK MONKY [H]  n=1662 cos0.99 難-0.66", "s": 0.497, "f": 0}, {"x": 0.994, "y": -0.292, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2244 cos0.99 難-0.29", "s": 0.672, "f": 0}, {"x": 0.993, "y": -0.623, "c": "近傍", "n": "旅人リラン [H]  n=2557 cos0.99 難-0.62", "s": 0.765, "f": 0}, {"x": 0.992, "y": -0.381, "c": "近傍", "n": "7 Colors [A]  n=1872 cos0.99 難-0.38", "s": 0.56, "f": 0}, {"x": 0.995, "y": -0.235, "c": "近傍", "n": "MINT [H]  n=2436 cos0.99 難-0.23", "s": 0.729, "f": 0}, {"x": 0.992, "y": -0.419, "c": "近傍", "n": "No Day But Today! [A]  n=2351 cos0.99 難-0.42", "s": 0.704, "f": 0}, {"x": 0.992, "y": -0.561, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2645 cos0.99 難-0.56", "s": 0.792, "f": 0}, {"x": 0.993, "y": -0.253, "c": "近傍", "n": "L'amour et la liberte [A]  n=738 cos0.99 難-0.25", "s": 0.221, "f": 0}, {"x": 0.995, "y": -0.754, "c": "近傍", "n": "Quickening [H]  n=1508 cos1.00 難-0.75", "s": 0.451, "f": 0}, {"x": 0.994, "y": -0.713, "c": "近傍", "n": "rainbow flyer [H]  n=1908 cos0.99 難-0.71", "s": 0.571, "f": 0}, {"x": 0.995, "y": -0.74, "c": "近傍", "n": "Programmed World [H]  n=2076 cos0.99 難-0.74", "s": 0.621, "f": 0}, {"x": 0.991, "y": -0.426, "c": "近傍", "n": "陽炎 [A]  n=2850 cos0.99 難-0.43", "s": 0.853, "f": 0}, {"x": 0.99, "y": -0.42, "c": "近傍", "n": "まほろば [A]  n=2892 cos0.99 難-0.42", "s": 0.866, "f": 0}, {"x": 0.991, "y": -0.339, "c": "近傍", "n": "Chasing After YOU ～夢の欠片～ ft. 小林マナ [A]  n=1414 cos0.99 難-0.34", "s": 0.423, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28809491076324567}, {"a": 0, "b": 2, "w": 0.3418821488889284}, {"a": 0, "b": 3, "w": 0.24546134536461917}, {"a": 0, "b": 4, "w": 0.27732531306473085}, {"a": 0, "b": 5, "w": 0.19811595734732568}, {"a": 0, "b": 6, "w": 0.22682401274109587}, {"a": 0, "b": 7, "w": 0.29635310526519687}, {"a": 0, "b": 8, "w": 0.28293896688601217}, {"a": 0, "b": 9, "w": 0.25397852919344943}, {"a": 0, "b": 10, "w": 0.20445540349420654}, {"a": 0, "b": 11, "w": 0.3210896654203378}, {"a": 0, "b": 12, "w": 0.0667325241258736}, {"a": 0, "b": 13, "w": 0.17299877236792138}, {"a": 0, "b": 14, "w": 0.2509707893272751}, {"a": 0, "b": 15, "w": 0.31940210548849446}, {"a": 0, "b": 16, "w": 0.24090612840222714}, {"a": 0, "b": 17, "w": 0.30710116349545913}, {"a": 0, "b": 18, "w": 0.10789118767420458}, {"a": 0, "b": 19, "w": 6.691536214020744e-11}, {"a": 0, "b": 20, "w": 0.11164580661504475}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.795,hiY=-0.193;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
