<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">suspicions [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.047, "c": "種", "n": "suspicions [H]  n=721 cos1.00 難-1.05", "s": 0.325, "f": 0}, {"x": 0.997, "y": -1.048, "c": "近傍", "n": "Vinculum stellarum [H]  n=1443 cos1.00 難-1.05", "s": 0.65, "f": 0}, {"x": 0.996, "y": -1.013, "c": "近傍", "n": "ORCA [H]  n=1536 cos1.00 難-1.01", "s": 0.692, "f": 0}, {"x": 0.996, "y": -1.141, "c": "近傍", "n": "〆 [H]  n=1729 cos1.00 難-1.14", "s": 0.779, "f": 0}, {"x": 0.996, "y": -0.946, "c": "近傍", "n": "Raspberry Railgun [H]  n=1994 cos1.00 難-0.95", "s": 0.898, "f": 0}, {"x": 0.992, "y": -0.983, "c": "近傍", "n": "SEQUENCE CAT [H]  n=2133 cos0.99 難-0.98", "s": 0.961, "f": 0}, {"x": 0.994, "y": -1.184, "c": "近傍", "n": "Stereo Beasts [H]  n=698 cos0.99 難-1.18", "s": 0.314, "f": 0}, {"x": 0.991, "y": -1.051, "c": "近傍", "n": "Here We Go Now [H]  n=854 cos0.99 難-1.05", "s": 0.385, "f": 0}, {"x": 0.991, "y": -1.032, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1717 cos0.99 難-1.03", "s": 0.773, "f": 0}, {"x": 0.997, "y": -0.811, "c": "近傍", "n": "Macuilxochitl [H]  n=2220 cos1.00 難-0.81", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.051, "c": "近傍", "n": "Resonant [H]  n=560 cos0.99 難-1.05", "s": 0.252, "f": 0}, {"x": 0.989, "y": -1.08, "c": "近傍", "n": "九尾狐夜行 [H]  n=1567 cos0.99 難-1.08", "s": 0.706, "f": 0}, {"x": 0.989, "y": -1.129, "c": "近傍", "n": "No Border [H]  n=1432 cos0.99 難-1.13", "s": 0.645, "f": 0}, {"x": 0.989, "y": -1.127, "c": "近傍", "n": "DUAL STRIKER [H]  n=1339 cos0.99 難-1.13", "s": 0.603, "f": 0}, {"x": 0.996, "y": -0.761, "c": "近傍", "n": "Drastic Dramatic [H]  n=1833 cos1.00 難-0.76", "s": 0.826, "f": 0}, {"x": 0.989, "y": -0.945, "c": "近傍", "n": "Demon March [H]  n=834 cos0.99 難-0.95", "s": 0.376, "f": 0}, {"x": 0.988, "y": -1.115, "c": "近傍", "n": "Vermilion Carol [H]  n=864 cos0.99 難-1.11", "s": 0.389, "f": 0}, {"x": 0.991, "y": -1.255, "c": "近傍", "n": "#CMFLG [H]  n=891 cos0.99 難-1.26", "s": 0.401, "f": 0}, {"x": 0.989, "y": -0.903, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1851 cos0.99 難-0.90", "s": 0.834, "f": 0}, {"x": 0.988, "y": -0.946, "c": "近傍", "n": "逆月 [H]  n=1692 cos0.99 難-0.95", "s": 0.762, "f": 0}, {"x": 0.988, "y": -1.131, "c": "近傍", "n": "frequent [H]  n=1106 cos0.99 難-1.13", "s": 0.498, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5762565102602633}, {"a": 0, "b": 2, "w": 0.45570058770645516}, {"a": 0, "b": 3, "w": 0.5674137806084264}, {"a": 0, "b": 4, "w": 0.5429205586076543}, {"a": 0, "b": 5, "w": 0.31870942297635174}, {"a": 0, "b": 6, "w": 0.4360516437031461}, {"a": 0, "b": 7, "w": 0.276105020840701}, {"a": 0, "b": 8, "w": 0.3104682348920498}, {"a": 0, "b": 9, "w": 0.5999225292239221}, {"a": 0, "b": 10, "w": 0.1893611747664914}, {"a": 0, "b": 11, "w": 0.20399147957062902}, {"a": 0, "b": 12, "w": 0.1692467611973576}, {"a": 0, "b": 13, "w": 0.14219798272827067}, {"a": 0, "b": 14, "w": 0.5639787849421488}, {"a": 0, "b": 15, "w": 0.1776054804929068}, {"a": 0, "b": 16, "w": 0.10449250351533812}, {"a": 0, "b": 17, "w": 0.3481296195308552}, {"a": 0, "b": 18, "w": 4.746203430272544e-11}, {"a": 0, "b": 19, "w": 0.12557819535556514}, {"a": 0, "b": 20, "w": 0.2530106953380813}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.295,hiY=-0.721;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
