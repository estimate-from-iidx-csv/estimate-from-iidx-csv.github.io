<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">UNDO THE NIGHT [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.161, "c": "種", "n": "UNDO THE NIGHT [H]  n=286 cos1.00 難-1.16", "s": 0.119, "f": 0}, {"x": 0.993, "y": -1.175, "c": "近傍", "n": "From Human Blood [H]  n=621 cos0.99 難-1.18", "s": 0.257, "f": 0}, {"x": 0.993, "y": -1.213, "c": "近傍", "n": "Inner Spirit [H]  n=1473 cos0.99 難-1.21", "s": 0.61, "f": 0}, {"x": 0.996, "y": -1.033, "c": "近傍", "n": "FlyAway [H]  n=630 cos1.00 難-1.03", "s": 0.261, "f": 0}, {"x": 0.994, "y": -1.053, "c": "近傍", "n": "RALLY '25 [H]  n=751 cos0.99 難-1.05", "s": 0.311, "f": 0}, {"x": 0.991, "y": -1.115, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=575 cos0.99 難-1.11", "s": 0.238, "f": 0}, {"x": 0.994, "y": -1.028, "c": "近傍", "n": "& Intelligence [H]  n=1407 cos0.99 難-1.03", "s": 0.583, "f": 0}, {"x": 0.989, "y": -1.167, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1540 cos0.99 難-1.17", "s": 0.638, "f": 0}, {"x": 0.989, "y": -1.171, "c": "近傍", "n": "Bring The Fire [H]  n=669 cos0.99 難-1.17", "s": 0.277, "f": 0}, {"x": 0.99, "y": -1.048, "c": "近傍", "n": "HADES [H]  n=2413 cos0.99 難-1.05", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.113, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=993 cos0.99 難-1.11", "s": 0.412, "f": 0}, {"x": 0.987, "y": -1.242, "c": "近傍", "n": "Hat Surprise (Season 3) [H]  n=662 cos0.99 難-1.24", "s": 0.274, "f": 0}, {"x": 0.987, "y": -1.154, "c": "近傍", "n": "Viridian [H]  n=1566 cos0.99 難-1.15", "s": 0.649, "f": 0}, {"x": 0.988, "y": -1.04, "c": "近傍", "n": "Vulnerability [H]  n=664 cos0.99 難-1.04", "s": 0.275, "f": 0}, {"x": 0.986, "y": -1.174, "c": "近傍", "n": "Roar of Chronos [H]  n=700 cos0.99 難-1.17", "s": 0.29, "f": 0}, {"x": 0.986, "y": -1.205, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1670 cos0.99 難-1.21", "s": 0.692, "f": 0}, {"x": 0.986, "y": -1.154, "c": "近傍", "n": "Space Battleship S4TO [H]  n=638 cos0.99 難-1.15", "s": 0.264, "f": 0}, {"x": 0.988, "y": -1.031, "c": "近傍", "n": "電光 [H]  n=857 cos0.99 難-1.03", "s": 0.355, "f": 0}, {"x": 0.987, "y": -1.063, "c": "近傍", "n": "Persephone [H]  n=1609 cos0.99 難-1.06", "s": 0.667, "f": 0}, {"x": 0.986, "y": -1.228, "c": "近傍", "n": "LOST TECHNOLOGIE [H]  n=1512 cos0.99 難-1.23", "s": 0.627, "f": 0}, {"x": 0.987, "y": -1.032, "c": "近傍", "n": "Cross Fire [H]  n=538 cos0.99 難-1.03", "s": 0.223, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4228713394963578}, {"a": 0, "b": 2, "w": 0.3038175264359768}, {"a": 0, "b": 3, "w": 0.5675493821466568}, {"a": 0, "b": 4, "w": 0.4456746294993671}, {"a": 0, "b": 5, "w": 0.37998844366669116}, {"a": 0, "b": 6, "w": 0.4989023258736637}, {"a": 0, "b": 7, "w": 0.13295591212402091}, {"a": 0, "b": 8, "w": 0.14668749508365142}, {"a": 0, "b": 9, "w": 0.22910313937919702}, {"a": 0, "b": 10, "w": 0.3001817800151243}, {"a": 0, "b": 11, "w": 0.25925922211505803}, {"a": 0, "b": 12, "w": 0.17458257622590967}, {"a": 0, "b": 13, "w": 0.24521158134077659}, {"a": 0, "b": 14, "w": 0.20073297612093954}, {"a": 0, "b": 15, "w": 0.2126562338575354}, {"a": 0, "b": 16, "w": 0.22067606303953524}, {"a": 0, "b": 17, "w": 0.27875941376030644}, {"a": 0, "b": 18, "w": 0.13062925783740575}, {"a": 0, "b": 19, "w": 4.3500869573165346e-11}, {"a": 0, "b": 20, "w": 0.23883398234335196}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.259,hiY=-1.010;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
