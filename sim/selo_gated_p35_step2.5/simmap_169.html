<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">恋は白帯、サンシロー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.343, "c": "種", "n": "恋は白帯、サンシロー [A]  n=2800 cos1.00 難-0.34", "s": 0.796, "f": 0}, {"x": 0.998, "y": -0.356, "c": "近傍", "n": "タシカナモノ [A]  n=2492 cos1.00 難-0.36", "s": 0.709, "f": 0}, {"x": 0.998, "y": -0.323, "c": "近傍", "n": "Damage Per Second [A]  n=2884 cos1.00 難-0.32", "s": 0.82, "f": 0}, {"x": 0.997, "y": -0.353, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos1.00 難-0.35", "s": 0.319, "f": 0}, {"x": 0.997, "y": -0.371, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos1.00 難-0.37", "s": 0.757, "f": 0}, {"x": 0.997, "y": -0.329, "c": "近傍", "n": "MOON [A]  n=3205 cos1.00 難-0.33", "s": 0.912, "f": 0}, {"x": 0.997, "y": -0.252, "c": "近傍", "n": "beatonic nation [A]  n=2335 cos1.00 難-0.25", "s": 0.664, "f": 0}, {"x": 0.996, "y": -0.384, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2755 cos1.00 難-0.38", "s": 0.784, "f": 0}, {"x": 0.998, "y": -0.228, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3152 cos1.00 難-0.23", "s": 0.896, "f": 0}, {"x": 0.996, "y": -0.385, "c": "近傍", "n": "satfinal [A]  n=2973 cos1.00 難-0.39", "s": 0.846, "f": 0}, {"x": 0.996, "y": -0.322, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2645 cos1.00 難-0.32", "s": 0.752, "f": 0}, {"x": 0.996, "y": -0.377, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3320 cos1.00 難-0.38", "s": 0.944, "f": 0}, {"x": 0.996, "y": -0.262, "c": "近傍", "n": "Lycoris [A]  n=1033 cos1.00 難-0.26", "s": 0.294, "f": 0}, {"x": 0.996, "y": -0.275, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3444 cos1.00 難-0.27", "s": 0.98, "f": 0}, {"x": 0.996, "y": -0.242, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2943 cos1.00 難-0.24", "s": 0.837, "f": 0}, {"x": 0.995, "y": -0.382, "c": "近傍", "n": "Drive Me Crazy [A]  n=3472 cos0.99 難-0.38", "s": 0.987, "f": 0}, {"x": 0.995, "y": -0.36, "c": "近傍", "n": "Sweet Radar [A]  n=3516 cos0.99 難-0.36", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.344, "c": "近傍", "n": "零 - ZERO - [A]  n=3029 cos0.99 難-0.34", "s": 0.861, "f": 0}, {"x": 0.994, "y": -0.337, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.99 難-0.34", "s": 0.763, "f": 0}, {"x": 0.994, "y": -0.349, "c": "近傍", "n": "次葉 -turn the page- [A]  n=3299 cos0.99 難-0.35", "s": 0.938, "f": 0}, {"x": 0.994, "y": -0.37, "c": "近傍", "n": "Sugar Drippin' [A]  n=2161 cos0.99 難-0.37", "s": 0.615, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5018557096217013}, {"a": 0, "b": 2, "w": 0.33290207762355173}, {"a": 0, "b": 3, "w": 0.07601238553097711}, {"a": 0, "b": 4, "w": 0.4356068508028076}, {"a": 0, "b": 5, "w": 0.4160399512791084}, {"a": 0, "b": 6, "w": 0.42570264000479585}, {"a": 0, "b": 7, "w": 0.34344083885023813}, {"a": 0, "b": 8, "w": 0.49291619281696564}, {"a": 0, "b": 9, "w": 0.22300251815486338}, {"a": 0, "b": 10, "w": 0.3136554578357281}, {"a": 0, "b": 11, "w": 0.31488009242733694}, {"a": 0, "b": 12, "w": 0.3349241409184951}, {"a": 0, "b": 13, "w": 0.04876093985664487}, {"a": 0, "b": 14, "w": 0.19999561772718122}, {"a": 0, "b": 15, "w": 0.006917597913796869}, {"a": 0, "b": 16, "w": 0.23003853885522374}, {"a": 0, "b": 17, "w": 8.070344392763218e-11}, {"a": 0, "b": 18, "w": 0.2144899882212452}, {"a": 0, "b": 19, "w": 0.1987746360353403}, {"a": 0, "b": 20, "w": 0.19563150745076086}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.398,hiY=-0.215;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
