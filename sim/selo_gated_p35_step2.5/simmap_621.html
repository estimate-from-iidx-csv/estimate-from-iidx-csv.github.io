<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.79, "c": "種", "n": "†渚の小悪魔ラヴリィ～レイディオ†(IIDX EDIT) [H]  n=3123 cos1.00 難-0.79", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.796, "c": "近傍", "n": "ヒマワリ [H]  n=2139 cos0.99 難-0.80", "s": 0.685, "f": 0}, {"x": 0.993, "y": -0.956, "c": "近傍", "n": "New Lights [H]  n=1942 cos0.99 難-0.96", "s": 0.622, "f": 0}, {"x": 0.99, "y": -0.678, "c": "近傍", "n": "Debtty Daddy [H]  n=1563 cos0.99 難-0.68", "s": 0.5, "f": 0}, {"x": 0.987, "y": -0.86, "c": "近傍", "n": "Castle on the Moon [H]  n=2277 cos0.99 難-0.86", "s": 0.729, "f": 0}, {"x": 0.987, "y": -0.702, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2272 cos0.99 難-0.70", "s": 0.728, "f": 0}, {"x": 0.989, "y": -0.611, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2052 cos0.99 難-0.61", "s": 0.657, "f": 0}, {"x": 0.986, "y": -0.664, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1665 cos0.99 難-0.66", "s": 0.533, "f": 0}, {"x": 0.985, "y": -0.887, "c": "近傍", "n": "Infinite cave [H]  n=2297 cos0.98 難-0.89", "s": 0.736, "f": 0}, {"x": 0.984, "y": -0.878, "c": "近傍", "n": "Venom [H]  n=1708 cos0.98 難-0.88", "s": 0.547, "f": 0}, {"x": 0.985, "y": -0.64, "c": "近傍", "n": "Agnus Dei [H]  n=1708 cos0.98 難-0.64", "s": 0.547, "f": 0}, {"x": 0.983, "y": -0.801, "c": "近傍", "n": "Make Me Your Own [H]  n=1671 cos0.98 難-0.80", "s": 0.535, "f": 0}, {"x": 0.986, "y": -1.011, "c": "近傍", "n": "invoker [H]  n=1886 cos0.99 難-1.01", "s": 0.604, "f": 0}, {"x": 0.982, "y": -0.765, "c": "近傍", "n": "murmur twins [H]  n=2278 cos0.98 難-0.77", "s": 0.729, "f": 0}, {"x": 0.984, "y": -0.603, "c": "近傍", "n": "smile [H]  n=1932 cos0.98 難-0.60", "s": 0.619, "f": 0}, {"x": 0.983, "y": -0.662, "c": "近傍", "n": "不沈艦CANDY [H]  n=2927 cos0.98 難-0.66", "s": 0.937, "f": 0}, {"x": 0.987, "y": -0.528, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2863 cos0.99 難-0.53", "s": 0.917, "f": 0}, {"x": 0.981, "y": -0.87, "c": "近傍", "n": "HYPE THE CORE [H]  n=1568 cos0.98 難-0.87", "s": 0.502, "f": 0}, {"x": 0.983, "y": -0.975, "c": "近傍", "n": "もっと！モット！ときめき feat. 松下 [H]  n=2033 cos0.98 難-0.97", "s": 0.651, "f": 0}, {"x": 0.982, "y": -0.645, "c": "近傍", "n": "Thunderbolt [H]  n=2738 cos0.98 難-0.64", "s": 0.877, "f": 0}, {"x": 0.981, "y": -0.873, "c": "近傍", "n": "Welcome [H]  n=2121 cos0.98 難-0.87", "s": 0.679, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33233578354722293}, {"a": 0, "b": 2, "w": 0.41956710118241436}, {"a": 0, "b": 3, "w": 0.2601215190525643}, {"a": 0, "b": 4, "w": 0.18450442536503076}, {"a": 0, "b": 5, "w": 0.19199573395033542}, {"a": 0, "b": 6, "w": 0.25845602403479384}, {"a": 0, "b": 7, "w": 0.01317858654556514}, {"a": 0, "b": 8, "w": 0.0667669485070207}, {"a": 0, "b": 9, "w": 0.021738045692426433}, {"a": 0, "b": 10, "w": 0.11645469282919829}, {"a": 0, "b": 11, "w": 0.05975046980583654}, {"a": 0, "b": 12, "w": 0.15670543898270595}, {"a": 0, "b": 13, "w": 0.0036916014132748476}, {"a": 0, "b": 14, "w": 0.07669361279129316}, {"a": 0, "b": 15, "w": 0.07102675957473892}, {"a": 0, "b": 16, "w": 0.15927928599191776}, {"a": 0, "b": 17, "w": 5.513045575611386e-11}, {"a": 0, "b": 18, "w": 0.0808646049420878}, {"a": 0, "b": 19, "w": 0.03653139911695136}, {"a": 0, "b": 20, "w": 0.023222605957362696}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.049,hiY=-0.489;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
