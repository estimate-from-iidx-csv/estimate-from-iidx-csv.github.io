<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ラストセンチュリーメランコリック [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.017, "c": "種", "n": "ラストセンチュリーメランコリック [A]  n=3093 cos1.00 難0.02", "s": 0.936, "f": 0}, {"x": 0.989, "y": -0.251, "c": "近傍", "n": "Next Level [A]  n=1622 cos0.99 難-0.25", "s": 0.491, "f": 0}, {"x": 0.985, "y": 0.023, "c": "近傍", "n": "Fiery Stallion [A]  n=1580 cos0.98 難0.02", "s": 0.478, "f": 0}, {"x": 0.987, "y": -0.249, "c": "近傍", "n": "Winner's Proof ft. KANASA from bless4 [A]  n=2243 cos0.99 難-0.25", "s": 0.679, "f": 0}, {"x": 0.986, "y": -0.257, "c": "近傍", "n": "流桜ノ門 [A]  n=1829 cos0.99 難-0.26", "s": 0.553, "f": 0}, {"x": 0.985, "y": -0.31, "c": "近傍", "n": "電子になりたい [A]  n=1538 cos0.99 難-0.31", "s": 0.465, "f": 0}, {"x": 0.985, "y": -0.315, "c": "近傍", "n": "シンデレラ [A]  n=1872 cos0.99 難-0.31", "s": 0.566, "f": 0}, {"x": 0.983, "y": -0.254, "c": "近傍", "n": "Magical [A]  n=3224 cos0.98 難-0.25", "s": 0.975, "f": 0}, {"x": 0.981, "y": 0.105, "c": "近傍", "n": "THE DOOR INTO RAINBOW [A]  n=2785 cos0.98 難0.11", "s": 0.843, "f": 0}, {"x": 0.982, "y": -0.232, "c": "近傍", "n": "smooooch・∀・ (Snail's House Remix) [A]  n=2451 cos0.98 難-0.23", "s": 0.742, "f": 0}, {"x": 0.988, "y": -0.43, "c": "近傍", "n": "VALLIS-NERIA [H]  n=3003 cos0.99 難-0.43", "s": 0.909, "f": 0}, {"x": 0.98, "y": -0.09, "c": "近傍", "n": "VIBRΛ [A]  n=2521 cos0.98 難-0.09", "s": 0.763, "f": 0}, {"x": 0.979, "y": 0.021, "c": "近傍", "n": "Bitter & Lucky [A]  n=1495 cos0.98 難0.02", "s": 0.452, "f": 0}, {"x": 0.984, "y": -0.371, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2663 cos0.98 難-0.37", "s": 0.806, "f": 0}, {"x": 0.983, "y": -0.337, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2684 cos0.98 難-0.34", "s": 0.812, "f": 0}, {"x": 0.983, "y": -0.353, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1123 cos0.98 難-0.35", "s": 0.34, "f": 0}, {"x": 0.98, "y": -0.184, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [H]  n=2290 cos0.98 難-0.18", "s": 0.693, "f": 0}, {"x": 0.984, "y": -0.376, "c": "近傍", "n": "Abyss -The Heavens Remix- [H]  n=2834 cos0.98 難-0.38", "s": 0.857, "f": 0}, {"x": 0.978, "y": -0.033, "c": "近傍", "n": "Love Magic [A]  n=2554 cos0.98 難-0.03", "s": 0.773, "f": 0}, {"x": 0.981, "y": -0.273, "c": "近傍", "n": "SAMSARA [A]  n=3305 cos0.98 難-0.27", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.377, "c": "近傍", "n": "I know You know [A]  n=2736 cos0.98 難-0.38", "s": 0.828, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4569680210104001}, {"a": 0, "b": 2, "w": 0.28727798132657667}, {"a": 0, "b": 3, "w": 0.3964614728478332}, {"a": 0, "b": 4, "w": 0.3810383039853865}, {"a": 0, "b": 5, "w": 0.26073727315397466}, {"a": 0, "b": 6, "w": 0.28637674737612395}, {"a": 0, "b": 7, "w": 3.45974360271839e-11}, {"a": 0, "b": 8, "w": 0.25981388783348824}, {"a": 0, "b": 9, "w": 0.26297784599811314}, {"a": 0, "b": 10, "w": 0.39158025650565764}, {"a": 0, "b": 11, "w": 0.24101062904182435}, {"a": 0, "b": 12, "w": 0.20922016482439887}, {"a": 0, "b": 13, "w": 0.09506726596768922}, {"a": 0, "b": 14, "w": 0.09541124412696966}, {"a": 0, "b": 15, "w": 0.2917472156620081}, {"a": 0, "b": 16, "w": 0.15110752194751753}, {"a": 0, "b": 17, "w": 0.14784536533942805}, {"a": 0, "b": 18, "w": 0.126889792151909}, {"a": 0, "b": 19, "w": 0.019831731842360645}, {"a": 0, "b": 20, "w": 0.05864378157512595}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-0.473,hiY=0.148;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
