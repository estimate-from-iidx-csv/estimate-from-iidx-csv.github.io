<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dolphin Kick [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.416, "c": "種", "n": "Dolphin Kick [A]  n=253 cos1.00 難1.42", "s": 0.078, "f": 0}, {"x": 0.995, "y": 1.447, "c": "近傍", "n": "今宵、ロマンス横丁。 [A]  n=1357 cos0.99 難1.45", "s": 0.417, "f": 0}, {"x": 0.993, "y": 1.429, "c": "近傍", "n": "NITROUS CANNON [A]  n=3128 cos0.99 難1.43", "s": 0.961, "f": 0}, {"x": 0.989, "y": 1.411, "c": "近傍", "n": "INHERITANCE [L]  n=589 cos0.99 難1.41", "s": 0.181, "f": 0}, {"x": 0.989, "y": 1.383, "c": "近傍", "n": "Illusionary Waterlily [A]  n=3023 cos0.99 難1.38", "s": 0.929, "f": 0}, {"x": 0.991, "y": 1.336, "c": "近傍", "n": "Arkadia [A]  n=2070 cos0.99 難1.34", "s": 0.636, "f": 0}, {"x": 0.988, "y": 1.428, "c": "近傍", "n": "Slipstream [A]  n=2980 cos0.99 難1.43", "s": 0.916, "f": 0}, {"x": 0.988, "y": 1.376, "c": "近傍", "n": "24h Endurance Race [A]  n=1710 cos0.99 難1.38", "s": 0.525, "f": 0}, {"x": 0.987, "y": 1.405, "c": "近傍", "n": "ANCHOR [A]  n=2994 cos0.99 難1.41", "s": 0.92, "f": 0}, {"x": 0.987, "y": 1.376, "c": "近傍", "n": "HyperTwist [A]  n=676 cos0.99 難1.38", "s": 0.208, "f": 0}, {"x": 0.987, "y": 1.478, "c": "近傍", "n": "ぞうしょく！？マイデンティティ [A]  n=1648 cos0.99 難1.48", "s": 0.506, "f": 0}, {"x": 0.985, "y": 1.419, "c": "近傍", "n": "THANK YOU FOR PLAYING [L]  n=2944 cos0.99 難1.42", "s": 0.904, "f": 0}, {"x": 0.985, "y": 1.38, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [A]  n=2585 cos0.99 難1.38", "s": 0.794, "f": 0}, {"x": 0.986, "y": 1.478, "c": "近傍", "n": "Demon March [A]  n=1395 cos0.99 難1.48", "s": 0.429, "f": 0}, {"x": 0.987, "y": 1.331, "c": "近傍", "n": "RIZING-GAMERS. [A]  n=521 cos0.99 難1.33", "s": 0.16, "f": 0}, {"x": 0.986, "y": 1.333, "c": "近傍", "n": "TOXIC VIBRATION [A]  n=3219 cos0.99 難1.33", "s": 0.989, "f": 0}, {"x": 0.985, "y": 1.358, "c": "近傍", "n": "EXUSIA [A]  n=3131 cos0.98 難1.36", "s": 0.962, "f": 0}, {"x": 0.987, "y": 1.307, "c": "近傍", "n": "少年は空を辿る [A]  n=3255 cos0.99 難1.31", "s": 1.0, "f": 0}, {"x": 0.986, "y": 1.334, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=731 cos0.99 難1.33", "s": 0.225, "f": 0}, {"x": 0.984, "y": 1.379, "c": "近傍", "n": "Burning Flame [L]  n=1629 cos0.98 難1.38", "s": 0.5, "f": 0}, {"x": 0.984, "y": 1.438, "c": "近傍", "n": "GRAVITON [A]  n=1936 cos0.98 難1.44", "s": 0.595, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4517175564991436}, {"a": 0, "b": 2, "w": 0.3869241205527596}, {"a": 0, "b": 3, "w": 0.22331173721238806}, {"a": 0, "b": 4, "w": 0.23071319877328833}, {"a": 0, "b": 5, "w": 0.2324563944823007}, {"a": 0, "b": 6, "w": 0.20295903088324263}, {"a": 0, "b": 7, "w": 0.006441676572844779}, {"a": 0, "b": 8, "w": 0.15802811660455862}, {"a": 0, "b": 9, "w": 0.01299452653532418}, {"a": 0, "b": 10, "w": 0.16923795052449808}, {"a": 0, "b": 11, "w": 3.317124352975043e-11}, {"a": 0, "b": 12, "w": 0.09639400985357416}, {"a": 0, "b": 13, "w": 0.12539514050108713}, {"a": 0, "b": 14, "w": 0.13080551304896226}, {"a": 0, "b": 15, "w": 0.14956434465031931}, {"a": 0, "b": 16, "w": 0.10079305928195126}, {"a": 0, "b": 17, "w": 0.16409765840109714}, {"a": 0, "b": 18, "w": 0.10925104895234661}, {"a": 0, "b": 19, "w": 0.06098911460217504}, {"a": 0, "b": 20, "w": 0.003902885763432118}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=1.293,hiY=1.492;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
