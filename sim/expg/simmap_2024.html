<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">of the first magnitude [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.414, "c": "種", "n": "of the first magnitude [A]  n=2743 cos1.00 難0.41", "s": 0.764, "f": 0}, {"x": 0.994, "y": 0.476, "c": "近傍", "n": "ABSOLUTE [L]  n=3176 cos0.99 難0.48", "s": 0.885, "f": 0}, {"x": 0.991, "y": 0.322, "c": "近傍", "n": "HEISEI [A]  n=3346 cos0.99 難0.32", "s": 0.933, "f": 0}, {"x": 0.989, "y": 0.523, "c": "近傍", "n": "鬼天 [A]  n=3354 cos0.99 難0.52", "s": 0.935, "f": 0}, {"x": 0.989, "y": 0.306, "c": "近傍", "n": "ABSOLUTE (kors k Remix) [A]  n=2525 cos0.99 難0.31", "s": 0.704, "f": 0}, {"x": 0.986, "y": 0.602, "c": "近傍", "n": "Ergosphere [A]  n=2071 cos0.99 難0.60", "s": 0.577, "f": 0}, {"x": 0.988, "y": 0.728, "c": "近傍", "n": "Star Trail [L]  n=1139 cos0.99 難0.73", "s": 0.317, "f": 0}, {"x": 0.988, "y": 0.76, "c": "近傍", "n": "Wolf 1061 [A]  n=3000 cos0.99 難0.76", "s": 0.836, "f": 0}, {"x": 0.985, "y": 0.286, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2296 cos0.99 難0.29", "s": 0.64, "f": 0}, {"x": 0.984, "y": 0.402, "c": "近傍", "n": "乱膳の舞姫 [A]  n=2462 cos0.98 難0.40", "s": 0.686, "f": 0}, {"x": 0.984, "y": 0.523, "c": "近傍", "n": "Dawn Saga [A]  n=2729 cos0.98 難0.52", "s": 0.761, "f": 0}, {"x": 0.986, "y": 0.063, "c": "近傍", "n": "BLUST OF WIND [L]  n=1623 cos0.99 難0.06", "s": 0.452, "f": 0}, {"x": 0.984, "y": 0.262, "c": "近傍", "n": "Clione [L]  n=3197 cos0.98 難0.26", "s": 0.891, "f": 0}, {"x": 0.989, "y": 0.933, "c": "近傍", "n": "Adularia [A]  n=3588 cos0.99 難0.93", "s": 1.0, "f": 0}, {"x": 0.982, "y": 0.31, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1760 cos0.98 難0.31", "s": 0.491, "f": 0}, {"x": 0.982, "y": 0.272, "c": "近傍", "n": "Ember Lights [A]  n=3412 cos0.98 難0.27", "s": 0.951, "f": 0}, {"x": 0.981, "y": 0.311, "c": "近傍", "n": "Perfect Plan [A]  n=2096 cos0.98 難0.31", "s": 0.584, "f": 0}, {"x": 0.981, "y": 0.21, "c": "近傍", "n": "Energy Drive [A]  n=3456 cos0.98 難0.21", "s": 0.963, "f": 0}, {"x": 0.983, "y": 0.033, "c": "近傍", "n": "shuriken [A]  n=3143 cos0.98 難0.03", "s": 0.876, "f": 0}, {"x": 0.98, "y": 0.395, "c": "近傍", "n": "Divine Heaven [A]  n=1986 cos0.98 難0.39", "s": 0.554, "f": 0}, {"x": 0.98, "y": 0.46, "c": "近傍", "n": "Souhait bleu [A]  n=2364 cos0.98 難0.46", "s": 0.659, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4409536119687528}, {"a": 0, "b": 2, "w": 0.22122577922720688}, {"a": 0, "b": 3, "w": 0.2588912636724605}, {"a": 0, "b": 4, "w": 0.2706999862654571}, {"a": 0, "b": 5, "w": 0.1867594006564679}, {"a": 0, "b": 6, "w": 0.2486096849418009}, {"a": 0, "b": 7, "w": 0.20762678515147526}, {"a": 0, "b": 8, "w": 0.15961507883345738}, {"a": 0, "b": 9, "w": 0.14618151166110316}, {"a": 0, "b": 10, "w": 0.13928860400960175}, {"a": 0, "b": 11, "w": 0.13010704023159536}, {"a": 0, "b": 12, "w": 0.04751122853249701}, {"a": 0, "b": 13, "w": 0.26281069688193104}, {"a": 0, "b": 14, "w": 0.04880556016665172}, {"a": 0, "b": 15, "w": 0.015426221691328679}, {"a": 0, "b": 16, "w": 0.030002914105398015}, {"a": 0, "b": 17, "w": 3.819800031834575e-11}, {"a": 0, "b": 18, "w": 0.017137359096131344}, {"a": 0, "b": 19, "w": 0.029809780585351886}, {"a": 0, "b": 20, "w": 0.01658089982055888}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=-0.039,hiY=1.005;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
