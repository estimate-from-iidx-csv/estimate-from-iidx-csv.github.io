<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">か・し・ま・し☆PUMP UP！ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>

const D=[{"x": 1.0, "y": -1.24, "c": "種", "n": "か・し・ま・し☆PUMP UP！ [H]  n=1237 cos1.00 難-1.24", "s": 0.588, "f": 0}, {"x": 0.994, "y": -1.244, "c": "近傍", "n": "Cult Invitation [H]  n=753 cos0.99 難-1.24", "s": 0.358, "f": 0}, {"x": 0.992, "y": -1.384, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1719 cos0.99 難-1.38", "s": 0.817, "f": 0}, {"x": 0.989, "y": -1.363, "c": "近傍", "n": "BLAZING_LAZER [H]  n=798 cos0.99 難-1.36", "s": 0.379, "f": 0}, {"x": 0.991, "y": -1.433, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos0.99 難-1.43", "s": 0.628, "f": 0}, {"x": 0.988, "y": -1.37, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=715 cos0.99 難-1.37", "s": 0.34, "f": 0}, {"x": 0.985, "y": -1.283, "c": "近傍", "n": "東京神話 [H]  n=1946 cos0.99 難-1.28", "s": 0.924, "f": 0}, {"x": 0.989, "y": -1.43, "c": "近傍", "n": "27th style [H]  n=1334 cos0.99 難-1.43", "s": 0.634, "f": 0}, {"x": 0.988, "y": -1.048, "c": "近傍", "n": "もっと！モット！ときめき feat. 松下 [H]  n=2031 cos0.99 難-1.05", "s": 0.965, "f": 0}, {"x": 0.994, "y": -1.522, "c": "近傍", "n": "Piano Samurai [H]  n=1409 cos0.99 難-1.52", "s": 0.669, "f": 0}, {"x": 0.984, "y": -1.246, "c": "近傍", "n": "Night sky [H]  n=2105 cos0.98 難-1.25", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.362, "c": "近傍", "n": "Carry Me Away [H]  n=1400 cos0.99 難-1.36", "s": 0.665, "f": 0}, {"x": 0.983, "y": -1.247, "c": "近傍", "n": "デッドボヲルdeホームラン [H]  n=1890 cos0.98 難-1.25", "s": 0.898, "f": 0}, {"x": 0.992, "y": -1.525, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos0.99 難-1.53", "s": 0.647, "f": 0}, {"x": 0.983, "y": -1.298, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [H]  n=1579 cos0.98 難-1.30", "s": 0.75, "f": 0}, {"x": 0.985, "y": -1.419, "c": "近傍", "n": "水鏡の異界 [H]  n=1252 cos0.98 難-1.42", "s": 0.595, "f": 0}, {"x": 0.988, "y": -1.497, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1762 cos0.99 難-1.50", "s": 0.837, "f": 0}, {"x": 0.983, "y": -1.346, "c": "近傍", "n": "BIGWAVERS [H]  n=765 cos0.98 難-1.35", "s": 0.363, "f": 0}, {"x": 0.981, "y": -1.262, "c": "近傍", "n": "麗 ～うらら～ [H]  n=1858 cos0.98 難-1.26", "s": 0.883, "f": 0}, {"x": 0.983, "y": -1.367, "c": "近傍", "n": "BREAK OVER [H]  n=1211 cos0.98 難-1.37", "s": 0.575, "f": 0}, {"x": 0.983, "y": -1.068, "c": "近傍", "n": "Double Dribble [H]  n=1635 cos0.98 難-1.07", "s": 0.777, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4572145949173878}, {"a": 0, "b": 2, "w": 0.48129870753822857}, {"a": 0, "b": 3, "w": 0.35982066597404283}, {"a": 0, "b": 4, "w": 0.4951266516451518}, {"a": 0, "b": 5, "w": 0.1887573699389643}, {"a": 0, "b": 6, "w": 0.31290880944277044}, {"a": 0, "b": 7, "w": 0.40813029675821666}, {"a": 0, "b": 8, "w": 0.4051308575319822}, {"a": 0, "b": 9, "w": 0.5976025831933094}, {"a": 0, "b": 10, "w": 0.3034738734593072}, {"a": 0, "b": 11, "w": 0.34660584404217876}, {"a": 0, "b": 12, "w": 0.26521271531616375}, {"a": 0, "b": 13, "w": 0.5093013250594657}, {"a": 0, "b": 14, "w": 0.2917532929362725}, {"a": 0, "b": 15, "w": 0.2966443587957377}, {"a": 0, "b": 16, "w": 0.39012446656652155}, {"a": 0, "b": 17, "w": 0.28930278638945217}, {"a": 0, "b": 18, "w": 0.23937447189221783}, {"a": 0, "b": 19, "w": 0.26348210420266005}, {"a": 0, "b": 20, "w": 4.324463009908186e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.563,hiY=-1.009;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
