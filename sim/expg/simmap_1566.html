<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Valanga [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.354, "c": "種", "n": "Valanga [H]  n=2996 cos1.00 難-0.35", "s": 0.903, "f": 0}, {"x": 0.996, "y": -0.311, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1118 cos1.00 難-0.31", "s": 0.337, "f": 0}, {"x": 0.995, "y": -0.301, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2683 cos0.99 難-0.30", "s": 0.809, "f": 0}, {"x": 0.995, "y": -0.25, "c": "近傍", "n": "Damage Per Second [A]  n=2881 cos0.99 難-0.25", "s": 0.869, "f": 0}, {"x": 0.994, "y": -0.321, "c": "近傍", "n": "タシカナモノ [A]  n=2489 cos0.99 難-0.32", "s": 0.75, "f": 0}, {"x": 0.994, "y": -0.367, "c": "近傍", "n": "VALLIS-NERIA [H]  n=2998 cos0.99 難-0.37", "s": 0.904, "f": 0}, {"x": 0.993, "y": -0.298, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2796 cos0.99 難-0.30", "s": 0.843, "f": 0}, {"x": 0.993, "y": -0.253, "c": "近傍", "n": "MOON [A]  n=3200 cos0.99 難-0.25", "s": 0.965, "f": 0}, {"x": 0.991, "y": -0.333, "c": "近傍", "n": "satfinal [A]  n=2970 cos0.99 難-0.33", "s": 0.895, "f": 0}, {"x": 0.992, "y": -0.268, "c": "近傍", "n": "NEWALONE [A]  n=2220 cos0.99 難-0.27", "s": 0.669, "f": 0}, {"x": 0.991, "y": -0.308, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3317 cos0.99 難-0.31", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.272, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2643 cos0.99 難-0.27", "s": 0.797, "f": 0}, {"x": 0.993, "y": -0.571, "c": "近傍", "n": "アタシ完全絶対正義ちゃん！ [A]  n=1759 cos0.99 難-0.57", "s": 0.53, "f": 0}, {"x": 0.992, "y": -0.133, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3148 cos0.99 難-0.13", "s": 0.949, "f": 0}, {"x": 0.991, "y": -0.19, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2938 cos0.99 難-0.19", "s": 0.886, "f": 0}, {"x": 0.99, "y": -0.397, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2655 cos0.99 難-0.40", "s": 0.8, "f": 0}, {"x": 0.99, "y": -0.29, "c": "近傍", "n": "電子になりたい [A]  n=1533 cos0.99 難-0.29", "s": 0.462, "f": 0}, {"x": 0.99, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos0.99 難-0.34", "s": 0.807, "f": 0}, {"x": 0.99, "y": -0.323, "c": "近傍", "n": "ANAGRAMS I to Y [A]  n=2711 cos0.99 難-0.32", "s": 0.817, "f": 0}, {"x": 0.992, "y": -0.591, "c": "近傍", "n": "れとりば！ [A]  n=1671 cos0.99 難-0.59", "s": 0.504, "f": 0}, {"x": 0.99, "y": -0.333, "c": "近傍", "n": "Sugar Drippin' [A]  n=2159 cos0.99 難-0.33", "s": 0.651, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5370173492065554}, {"a": 0, "b": 2, "w": 0.20678273350988707}, {"a": 0, "b": 3, "w": 0.4316293572194193}, {"a": 0, "b": 4, "w": 0.28561612831920546}, {"a": 0, "b": 5, "w": 0.4043483476182116}, {"a": 0, "b": 6, "w": 0.21762497343901688}, {"a": 0, "b": 7, "w": 0.265310479870852}, {"a": 0, "b": 8, "w": 5.245126555308843e-11}, {"a": 0, "b": 9, "w": 0.28591784577310353}, {"a": 0, "b": 10, "w": 0.19206878013254203}, {"a": 0, "b": 11, "w": 0.18462643006099522}, {"a": 0, "b": 12, "w": 0.2701158513160834}, {"a": 0, "b": 13, "w": 0.17887145828079698}, {"a": 0, "b": 14, "w": 0.2803072505737606}, {"a": 0, "b": 15, "w": 0.2603911303018279}, {"a": 0, "b": 16, "w": 0.2334757916659974}, {"a": 0, "b": 17, "w": 0.08751454150844062}, {"a": 0, "b": 18, "w": 0.21128014497211522}, {"a": 0, "b": 19, "w": 0.2923750623340674}, {"a": 0, "b": 20, "w": 0.03726644922940525}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.627,hiY=-0.096;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
