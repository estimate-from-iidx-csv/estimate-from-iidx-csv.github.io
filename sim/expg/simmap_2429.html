<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">IDOL syndrome. [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.4, "c": "種", "n": "IDOL syndrome. [L]  n=975 cos1.00 難0.40", "s": 0.267, "f": 0}, {"x": 0.993, "y": 0.529, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2690 cos0.99 難0.53", "s": 0.737, "f": 0}, {"x": 0.991, "y": 0.399, "c": "近傍", "n": "WISE UP! [L]  n=1830 cos0.99 難0.40", "s": 0.501, "f": 0}, {"x": 0.991, "y": 0.318, "c": "近傍", "n": "ANTHEM LANDING [A]  n=3583 cos0.99 難0.32", "s": 0.981, "f": 0}, {"x": 0.99, "y": 0.497, "c": "近傍", "n": "明鏡止水 [A]  n=3153 cos0.99 難0.50", "s": 0.863, "f": 0}, {"x": 0.99, "y": 0.521, "c": "近傍", "n": "Afterimage d'automne [A]  n=2743 cos0.99 難0.52", "s": 0.751, "f": 0}, {"x": 0.991, "y": 0.572, "c": "近傍", "n": "24th Century BOY [A]  n=3347 cos0.99 難0.57", "s": 0.916, "f": 0}, {"x": 0.988, "y": 0.328, "c": "近傍", "n": "BabeL ～Grand Story～ [A]  n=3343 cos0.99 難0.33", "s": 0.915, "f": 0}, {"x": 0.989, "y": 0.316, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2429 cos0.99 難0.32", "s": 0.665, "f": 0}, {"x": 0.989, "y": 0.49, "c": "近傍", "n": "bloomin' feeling [A]  n=3652 cos0.99 難0.49", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.265, "c": "近傍", "n": "Time To Empress [L]  n=632 cos0.99 難0.27", "s": 0.173, "f": 0}, {"x": 0.99, "y": 0.606, "c": "近傍", "n": "CUE CUE RESCUE [L]  n=1248 cos0.99 難0.61", "s": 0.342, "f": 0}, {"x": 0.987, "y": 0.45, "c": "近傍", "n": "Discloze [A]  n=3146 cos0.99 難0.45", "s": 0.861, "f": 0}, {"x": 0.987, "y": 0.378, "c": "近傍", "n": "2 tribe 4 K [A]  n=3256 cos0.99 難0.38", "s": 0.892, "f": 0}, {"x": 0.992, "y": 0.137, "c": "近傍", "n": "Beyond The Seven [A]  n=3550 cos0.99 難0.14", "s": 0.972, "f": 0}, {"x": 0.992, "y": 0.656, "c": "近傍", "n": "Last Card [A]  n=824 cos0.99 難0.66", "s": 0.226, "f": 0}, {"x": 0.987, "y": 0.33, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3417 cos0.99 難0.33", "s": 0.936, "f": 0}, {"x": 0.989, "y": 0.206, "c": "近傍", "n": "KEY [A]  n=3457 cos0.99 難0.21", "s": 0.947, "f": 0}, {"x": 0.988, "y": 0.525, "c": "近傍", "n": "ALBA -黎明- [A]  n=3637 cos0.99 難0.53", "s": 0.996, "f": 0}, {"x": 0.987, "y": 0.368, "c": "近傍", "n": "SHADE [A]  n=3606 cos0.99 難0.37", "s": 0.987, "f": 0}, {"x": 0.987, "y": 0.312, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3521 cos0.99 難0.31", "s": 0.964, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24145893137944552}, {"a": 0, "b": 2, "w": 0.2259819840721281}, {"a": 0, "b": 3, "w": 0.22350226767502157}, {"a": 0, "b": 4, "w": 0.1919374926355354}, {"a": 0, "b": 5, "w": 0.31868157569632594}, {"a": 0, "b": 6, "w": 0.3354862087262386}, {"a": 0, "b": 7, "w": 0.2094656672288555}, {"a": 0, "b": 8, "w": 0.04019444424263574}, {"a": 0, "b": 9, "w": 0.2691826967306822}, {"a": 0, "b": 10, "w": 0.2653309053941737}, {"a": 0, "b": 11, "w": 0.3242145674800506}, {"a": 0, "b": 12, "w": 0.13651268376139236}, {"a": 0, "b": 13, "w": 0.08416678285259438}, {"a": 0, "b": 14, "w": 0.13220408613317036}, {"a": 0, "b": 15, "w": 0.36795300373377093}, {"a": 0, "b": 16, "w": 0.11595294488217489}, {"a": 0, "b": 17, "w": 0.05431548120111118}, {"a": 0, "b": 18, "w": 0.1353816313184273}, {"a": 0, "b": 19, "w": 0.20740081975933067}, {"a": 0, "b": 20, "w": 3.6551206505919254e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.095,hiY=0.698;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
