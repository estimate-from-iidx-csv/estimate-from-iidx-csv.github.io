<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Matt Silver [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.988, "c": "種", "n": "Matt Silver [A]  n=3084 cos1.00 難0.99", "s": 0.844, "f": 0}, {"x": 0.992, "y": 0.87, "c": "近傍", "n": "Begin [A]  n=996 cos0.99 難0.87", "s": 0.273, "f": 0}, {"x": 0.992, "y": 1.08, "c": "近傍", "n": "Ypsilon [L]  n=2338 cos0.99 難1.08", "s": 0.64, "f": 0}, {"x": 0.994, "y": 1.163, "c": "近傍", "n": "From Human Blood [A]  n=979 cos0.99 難1.16", "s": 0.268, "f": 0}, {"x": 0.99, "y": 0.985, "c": "近傍", "n": "Ancient Scapes [A]  n=3546 cos0.99 難0.99", "s": 0.971, "f": 0}, {"x": 0.991, "y": 0.891, "c": "近傍", "n": "#CMFLG [A]  n=1949 cos0.99 難0.89", "s": 0.534, "f": 0}, {"x": 0.991, "y": 1.057, "c": "近傍", "n": "Friction[!]Function [A]  n=2918 cos0.99 難1.06", "s": 0.799, "f": 0}, {"x": 0.991, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.99 難0.89", "s": 0.293, "f": 0}, {"x": 0.99, "y": 1.095, "c": "近傍", "n": "Space Battleship S4TO [A]  n=965 cos0.99 難1.09", "s": 0.264, "f": 0}, {"x": 0.99, "y": 0.888, "c": "近傍", "n": "LASER CRUSTER [A]  n=3652 cos0.99 難0.89", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.892, "c": "近傍", "n": "Aqvion [A]  n=1146 cos0.99 難0.89", "s": 0.314, "f": 0}, {"x": 0.99, "y": 1.103, "c": "近傍", "n": "dAuntl3ss [A]  n=3294 cos0.99 難1.10", "s": 0.902, "f": 0}, {"x": 0.99, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.99 難1.12", "s": 0.931, "f": 0}, {"x": 0.99, "y": 1.087, "c": "近傍", "n": "Seven Times Four [A]  n=1327 cos0.99 難1.09", "s": 0.363, "f": 0}, {"x": 0.99, "y": 1.122, "c": "近傍", "n": "Bring The Fire [A]  n=1405 cos0.99 難1.12", "s": 0.385, "f": 0}, {"x": 0.991, "y": 1.172, "c": "近傍", "n": "Chaotoxin [A]  n=1942 cos0.99 難1.17", "s": 0.532, "f": 0}, {"x": 0.992, "y": 1.196, "c": "近傍", "n": "Mid-Corner (Magic Maker) [A]  n=1199 cos0.99 難1.20", "s": 0.328, "f": 0}, {"x": 0.99, "y": 1.133, "c": "近傍", "n": "Sounds Of Summer [A]  n=3413 cos0.99 難1.13", "s": 0.935, "f": 0}, {"x": 0.988, "y": 1.02, "c": "近傍", "n": "天邪鬼 [A]  n=2439 cos0.99 難1.02", "s": 0.668, "f": 0}, {"x": 0.993, "y": 0.743, "c": "近傍", "n": "COSMIC CYBER [A]  n=2563 cos0.99 難0.74", "s": 0.702, "f": 0}, {"x": 0.992, "y": 1.21, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1195 cos0.99 難1.21", "s": 0.327, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3676138974678499}, {"a": 0, "b": 2, "w": 0.26601695495407796}, {"a": 0, "b": 3, "w": 0.23333466457017038}, {"a": 0, "b": 4, "w": 0.25006840345139614}, {"a": 0, "b": 5, "w": 0.29743686992229434}, {"a": 0, "b": 6, "w": 0.25109859184203376}, {"a": 0, "b": 7, "w": 0.3022112266123026}, {"a": 0, "b": 8, "w": 3.767897105433349e-11}, {"a": 0, "b": 9, "w": 0.275446816122644}, {"a": 0, "b": 10, "w": 0.15349663136885394}, {"a": 0, "b": 11, "w": 0.26980750415140387}, {"a": 0, "b": 12, "w": 0.2842950451143653}, {"a": 0, "b": 13, "w": 0.21679841972059344}, {"a": 0, "b": 14, "w": 0.27475511551422116}, {"a": 0, "b": 15, "w": 0.27072906848845735}, {"a": 0, "b": 16, "w": 0.25402617545708117}, {"a": 0, "b": 17, "w": 0.2266468364574351}, {"a": 0, "b": 18, "w": 0.15056094536741693}, {"a": 0, "b": 19, "w": 0.39756668355310165}, {"a": 0, "b": 20, "w": 0.3008968053043941}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.706,hiY=1.247;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
