<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">デビルじゃないもん [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.402, "c": "種", "n": "デビルじゃないもん [A]  n=1758 cos1.00 難-0.40", "s": 0.499, "f": 0}, {"x": 0.994, "y": -0.269, "c": "近傍", "n": "Follow Tomorrow [A]  n=3525 cos0.99 難-0.27", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.131, "c": "近傍", "n": "メイメツ、フラグメンツ [A]  n=3202 cos1.00 難-0.13", "s": 0.908, "f": 0}, {"x": 0.993, "y": -0.361, "c": "近傍", "n": "まほろば [A]  n=2887 cos0.99 難-0.36", "s": 0.819, "f": 0}, {"x": 0.993, "y": -0.376, "c": "近傍", "n": "陽炎 [A]  n=2846 cos0.99 難-0.38", "s": 0.807, "f": 0}, {"x": 0.993, "y": -0.278, "c": "近傍", "n": "煉獄のエルフェリア [H]  n=3105 cos0.99 難-0.28", "s": 0.881, "f": 0}, {"x": 0.992, "y": -0.297, "c": "近傍", "n": "Aurora [H]  n=3068 cos0.99 難-0.30", "s": 0.87, "f": 0}, {"x": 0.992, "y": -0.28, "c": "近傍", "n": "セピアの軌跡 ft. 天宮みや(少女フラクタル) [A]  n=3065 cos0.99 難-0.28", "s": 0.87, "f": 0}, {"x": 0.992, "y": -0.534, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1771 cos0.99 難-0.53", "s": 0.502, "f": 0}, {"x": 0.994, "y": -0.135, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3173 cos0.99 難-0.13", "s": 0.9, "f": 0}, {"x": 0.994, "y": -0.134, "c": "近傍", "n": "Hard Breaker [A]  n=1311 cos0.99 難-0.13", "s": 0.372, "f": 0}, {"x": 0.994, "y": -0.133, "c": "近傍", "n": "Vermilion [A]  n=3037 cos0.99 難-0.13", "s": 0.862, "f": 0}, {"x": 0.992, "y": -0.184, "c": "近傍", "n": "Devilz Staircase [H]  n=2862 cos0.99 難-0.18", "s": 0.812, "f": 0}, {"x": 0.991, "y": -0.441, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1729 cos0.99 難-0.44", "s": 0.49, "f": 0}, {"x": 0.992, "y": -0.248, "c": "近傍", "n": "CUE CUE RESCUE [A]  n=2420 cos0.99 難-0.25", "s": 0.687, "f": 0}, {"x": 0.993, "y": -0.651, "c": "近傍", "n": "Sky High [H]  n=2453 cos0.99 難-0.65", "s": 0.696, "f": 0}, {"x": 0.991, "y": -0.305, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1401 cos0.99 難-0.30", "s": 0.397, "f": 0}, {"x": 0.992, "y": -0.211, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2724 cos0.99 難-0.21", "s": 0.773, "f": 0}, {"x": 0.993, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos0.99 難-0.11", "s": 0.841, "f": 0}, {"x": 0.992, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos0.99 難-0.18", "s": 0.793, "f": 0}, {"x": 0.99, "y": -0.333, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2473 cos0.99 難-0.33", "s": 0.702, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.24569930511081628}, {"a": 0, "b": 2, "w": 0.43734207723313256}, {"a": 0, "b": 3, "w": 0.15995231564241208}, {"a": 0, "b": 4, "w": 0.04072220754636813}, {"a": 0, "b": 5, "w": 0.29247390493123326}, {"a": 0, "b": 6, "w": 0.2618948940681143}, {"a": 0, "b": 7, "w": 0.2473122164402325}, {"a": 0, "b": 8, "w": 0.12922583052373582}, {"a": 0, "b": 9, "w": 0.31002736383311225}, {"a": 0, "b": 10, "w": 0.3226420329681119}, {"a": 0, "b": 11, "w": 0.13464620323955123}, {"a": 0, "b": 12, "w": 0.2562057389346577}, {"a": 0, "b": 13, "w": 5.1791571031856165e-11}, {"a": 0, "b": 14, "w": 0.2191402026401481}, {"a": 0, "b": 15, "w": 0.23481677954288038}, {"a": 0, "b": 16, "w": 0.17961093335645417}, {"a": 0, "b": 17, "w": 0.2175537991288473}, {"a": 0, "b": 18, "w": 0.20279011057058915}, {"a": 0, "b": 19, "w": 0.004931054657597134}, {"a": 0, "b": 20, "w": 0.15949920547898966}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.694,hiY=-0.066;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
