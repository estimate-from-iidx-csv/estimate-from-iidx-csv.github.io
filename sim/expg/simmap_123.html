<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Somebody Like You [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.249, "c": "種", "n": "Somebody Like You [A]  n=1178 cos1.00 難-0.25", "s": 0.355, "f": 0}, {"x": 0.995, "y": -0.058, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2864 cos0.99 難-0.06", "s": 0.864, "f": 0}, {"x": 0.991, "y": 0.026, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2162 cos0.99 難0.03", "s": 0.652, "f": 0}, {"x": 0.985, "y": -0.13, "c": "近傍", "n": "Buffalo [A]  n=2617 cos0.99 難-0.13", "s": 0.789, "f": 0}, {"x": 0.984, "y": -0.022, "c": "近傍", "n": "Midnight Drive [A]  n=2325 cos0.98 難-0.02", "s": 0.701, "f": 0}, {"x": 0.988, "y": 0.09, "c": "近傍", "n": "Really Love [A]  n=3145 cos0.99 難0.09", "s": 0.949, "f": 0}, {"x": 0.985, "y": -0.585, "c": "近傍", "n": "Digitank System [H]  n=2773 cos0.99 難-0.58", "s": 0.837, "f": 0}, {"x": 0.987, "y": 0.132, "c": "近傍", "n": "Shamshir [A]  n=1506 cos0.99 難0.13", "s": 0.454, "f": 0}, {"x": 0.98, "y": -0.253, "c": "近傍", "n": "Round and Round [A]  n=2982 cos0.98 難-0.25", "s": 0.9, "f": 0}, {"x": 0.98, "y": -0.275, "c": "近傍", "n": "SCREAM SQUAD [H]  n=2625 cos0.98 難-0.27", "s": 0.792, "f": 0}, {"x": 0.98, "y": -0.215, "c": "近傍", "n": "MAD ATTACK [A]  n=2731 cos0.98 難-0.21", "s": 0.824, "f": 0}, {"x": 0.981, "y": -0.074, "c": "近傍", "n": "Tripping Jumping [A]  n=1962 cos0.98 難-0.07", "s": 0.592, "f": 0}, {"x": 0.981, "y": -0.007, "c": "近傍", "n": "Catch Me [A]  n=2855 cos0.98 難-0.01", "s": 0.861, "f": 0}, {"x": 0.979, "y": -0.341, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3315 cos0.98 難-0.34", "s": 1.0, "f": 0}, {"x": 0.979, "y": -0.301, "c": "近傍", "n": "HEARTACHE [A]  n=2639 cos0.98 難-0.30", "s": 0.796, "f": 0}, {"x": 0.978, "y": -0.094, "c": "近傍", "n": "Make Me Your Own [A]  n=2899 cos0.98 難-0.09", "s": 0.875, "f": 0}, {"x": 0.978, "y": -0.307, "c": "近傍", "n": "We are Disっ娘よっつ打ち命 [A]  n=2700 cos0.98 難-0.31", "s": 0.814, "f": 0}, {"x": 0.977, "y": -0.256, "c": "近傍", "n": "雪月花 [H]  n=3302 cos0.98 難-0.26", "s": 0.996, "f": 0}, {"x": 0.98, "y": 0.048, "c": "近傍", "n": "Feedback [A]  n=2741 cos0.98 難0.05", "s": 0.827, "f": 0}, {"x": 0.99, "y": 0.318, "c": "近傍", "n": "Watch out!! [A]  n=3269 cos0.99 難0.32", "s": 0.986, "f": 0}, {"x": 0.978, "y": -0.496, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1047 cos0.98 難-0.50", "s": 0.316, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48195363676217295}, {"a": 0, "b": 2, "w": 0.42702046526603965}, {"a": 0, "b": 3, "w": 0.2900313612749078}, {"a": 0, "b": 4, "w": 0.24845466696735663}, {"a": 0, "b": 5, "w": 0.3247067438037017}, {"a": 0, "b": 6, "w": 0.3084978353889335}, {"a": 0, "b": 7, "w": 0.23618189988457594}, {"a": 0, "b": 8, "w": 0.19575075888318827}, {"a": 0, "b": 9, "w": 0.09108228888307379}, {"a": 0, "b": 10, "w": 0.1827449128003561}, {"a": 0, "b": 11, "w": 0.044619559765669004}, {"a": 0, "b": 12, "w": 0.18483353448889028}, {"a": 0, "b": 13, "w": 0.04820694111546786}, {"a": 0, "b": 14, "w": 0.16712828408169456}, {"a": 0, "b": 15, "w": 0.15790280354225406}, {"a": 0, "b": 16, "w": 3.833311446044263e-11}, {"a": 0, "b": 17, "w": 0.13566313686581244}, {"a": 0, "b": 18, "w": 0.18821426921106088}, {"a": 0, "b": 19, "w": 0.42788290435330256}, {"a": 0, "b": 20, "w": 0.14784167276572635}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-0.657,hiY=0.390;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
