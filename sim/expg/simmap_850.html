<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Flip Flap [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.111, "c": "種", "n": "Flip Flap [A]  n=3365 cos1.00 難-0.11", "s": 0.92, "f": 0}, {"x": 0.997, "y": -0.095, "c": "近傍", "n": "Mind Mapping [L]  n=2333 cos1.00 難-0.10", "s": 0.638, "f": 0}, {"x": 0.995, "y": 0.129, "c": "近傍", "n": "Logic Board [A]  n=1410 cos0.99 難0.13", "s": 0.386, "f": 0}, {"x": 0.994, "y": -0.309, "c": "近傍", "n": "Dreaming Dream [A]  n=1431 cos0.99 難-0.31", "s": 0.391, "f": 0}, {"x": 0.992, "y": -0.31, "c": "近傍", "n": "BRIDAL FESTIVAL !!! [A]  n=2635 cos0.99 難-0.31", "s": 0.721, "f": 0}, {"x": 0.993, "y": 0.115, "c": "近傍", "n": "朧 [L]  n=3657 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.322, "c": "近傍", "n": "Secret Rouge [A]  n=1557 cos0.99 難-0.32", "s": 0.426, "f": 0}, {"x": 0.992, "y": -0.286, "c": "近傍", "n": "Eleanor [A]  n=1364 cos0.99 難-0.29", "s": 0.373, "f": 0}, {"x": 0.992, "y": -0.288, "c": "近傍", "n": "Get Wicked [A]  n=1309 cos0.99 難-0.29", "s": 0.358, "f": 0}, {"x": 0.99, "y": -0.153, "c": "近傍", "n": "恋はどう？モロ◎波動OK☆方程式!! [A]  n=3032 cos0.99 難-0.15", "s": 0.829, "f": 0}, {"x": 0.991, "y": -0.33, "c": "近傍", "n": "Stepper [A]  n=1974 cos0.99 難-0.33", "s": 0.54, "f": 0}, {"x": 0.99, "y": -0.083, "c": "近傍", "n": "do the thing feat. Kanae Asaba [A]  n=3077 cos0.99 難-0.08", "s": 0.841, "f": 0}, {"x": 0.99, "y": -0.126, "c": "近傍", "n": "OOO [L]  n=858 cos0.99 難-0.13", "s": 0.235, "f": 0}, {"x": 0.991, "y": -0.324, "c": "近傍", "n": "ラブキラ☆スプラッシュ [A]  n=2331 cos0.99 難-0.32", "s": 0.637, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3204 cos0.99 難-0.25", "s": 0.876, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Hitch Hiker2 [L]  n=1872 cos0.99 難-0.25", "s": 0.512, "f": 0}, {"x": 0.99, "y": -0.151, "c": "近傍", "n": "Hold My Hand [A]  n=2571 cos0.99 難-0.15", "s": 0.703, "f": 0}, {"x": 0.99, "y": 0.01, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2379 cos0.99 難0.01", "s": 0.651, "f": 0}, {"x": 0.99, "y": -0.176, "c": "近傍", "n": "Last Burning [A]  n=3166 cos0.99 難-0.18", "s": 0.866, "f": 0}, {"x": 0.99, "y": 0.157, "c": "近傍", "n": "50th Memorial Songs -Flagship medley- [A]  n=2090 cos0.99 難0.16", "s": 0.572, "f": 0}, {"x": 0.989, "y": -0.064, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3085 cos0.99 難-0.06", "s": 0.844, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5741783092532433}, {"a": 0, "b": 2, "w": 0.46343556357561055}, {"a": 0, "b": 3, "w": 0.39035682154326223}, {"a": 0, "b": 4, "w": 0.29548171980513327}, {"a": 0, "b": 5, "w": 0.24978933373022405}, {"a": 0, "b": 6, "w": 0.34946210335069283}, {"a": 0, "b": 7, "w": 0.22245588969072172}, {"a": 0, "b": 8, "w": 0.30849070962742187}, {"a": 0, "b": 9, "w": 0.052289395770766633}, {"a": 0, "b": 10, "w": 0.27718824956574606}, {"a": 0, "b": 11, "w": 0.19127930648787905}, {"a": 0, "b": 12, "w": 0.05935351833504032}, {"a": 0, "b": 13, "w": 0.2519367771804062}, {"a": 0, "b": 14, "w": 0.2674761638144144}, {"a": 0, "b": 15, "w": 0.2675517985551341}, {"a": 0, "b": 16, "w": 0.21074783900843874}, {"a": 0, "b": 17, "w": 5.0824566777407654e-11}, {"a": 0, "b": 18, "w": 0.20508024441382222}, {"a": 0, "b": 19, "w": 0.10157240318624872}, {"a": 0, "b": 20, "w": 0.21048964951386773}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.369,hiY=0.196;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
