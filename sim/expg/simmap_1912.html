<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Hello Happiness [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.479, "c": "種", "n": "Hello Happiness [A]  n=3371 cos1.00 難0.48", "s": 0.906, "f": 0}, {"x": 0.993, "y": 0.457, "c": "近傍", "n": "Around the Future [A]  n=3146 cos0.99 難0.46", "s": 0.845, "f": 0}, {"x": 0.993, "y": 0.388, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1735 cos0.99 難0.39", "s": 0.466, "f": 0}, {"x": 0.992, "y": 0.281, "c": "近傍", "n": "Like+it! [A]  n=3047 cos0.99 難0.28", "s": 0.819, "f": 0}, {"x": 0.991, "y": 0.317, "c": "近傍", "n": "X-DEN [H]  n=3023 cos0.99 難0.32", "s": 0.812, "f": 0}, {"x": 0.99, "y": 0.462, "c": "近傍", "n": "S!ck [A]  n=3664 cos0.99 難0.46", "s": 0.985, "f": 0}, {"x": 0.991, "y": 0.345, "c": "近傍", "n": "Squeeze [A]  n=3313 cos0.99 難0.34", "s": 0.89, "f": 0}, {"x": 0.989, "y": 0.488, "c": "近傍", "n": "Abraxas [A]  n=3301 cos0.99 難0.49", "s": 0.887, "f": 0}, {"x": 0.989, "y": 0.652, "c": "近傍", "n": "3V0 [A]  n=2197 cos0.99 難0.65", "s": 0.59, "f": 0}, {"x": 0.989, "y": 0.72, "c": "近傍", "n": "TITANS RETURN [A]  n=3176 cos0.99 難0.72", "s": 0.854, "f": 0}, {"x": 0.988, "y": 0.533, "c": "近傍", "n": "Crazy Jackpot [A]  n=2696 cos0.99 難0.53", "s": 0.725, "f": 0}, {"x": 0.989, "y": 0.658, "c": "近傍", "n": "Modular Technology [A]  n=3019 cos0.99 難0.66", "s": 0.811, "f": 0}, {"x": 0.988, "y": 0.65, "c": "近傍", "n": "diagram [A]  n=3161 cos0.99 難0.65", "s": 0.85, "f": 0}, {"x": 0.989, "y": 0.212, "c": "近傍", "n": "Burning Flame [A]  n=2607 cos0.99 難0.21", "s": 0.701, "f": 0}, {"x": 0.987, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.93, "f": 0}, {"x": 0.989, "y": 0.808, "c": "近傍", "n": "雪月花 [A]  n=3721 cos0.99 難0.81", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.608, "c": "近傍", "n": "GALGALIM [A]  n=3076 cos0.99 難0.61", "s": 0.827, "f": 0}, {"x": 0.99, "y": 0.104, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [A]  n=3339 cos0.99 難0.10", "s": 0.897, "f": 0}, {"x": 0.986, "y": 0.311, "c": "近傍", "n": "Amazing Mirage [A]  n=3631 cos0.99 難0.31", "s": 0.976, "f": 0}, {"x": 0.985, "y": 0.355, "c": "近傍", "n": "TOKAKU=ALMiRAJ [A]  n=752 cos0.99 難0.35", "s": 0.202, "f": 0}, {"x": 0.985, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos0.99 難0.59", "s": 0.911, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2966376253813108}, {"a": 0, "b": 2, "w": 0.4212559489011385}, {"a": 0, "b": 3, "w": 0.27941248411812425}, {"a": 0, "b": 4, "w": 0.25214323244892145}, {"a": 0, "b": 5, "w": 0.3087772922996346}, {"a": 0, "b": 6, "w": 0.3106082766451095}, {"a": 0, "b": 7, "w": 0.24429115965515025}, {"a": 0, "b": 8, "w": 0.18274883621338256}, {"a": 0, "b": 9, "w": 0.3033907717014085}, {"a": 0, "b": 10, "w": 0.1958688527336202}, {"a": 0, "b": 11, "w": 0.2652385668148882}, {"a": 0, "b": 12, "w": 0.2490495012718258}, {"a": 0, "b": 13, "w": 0.28106677212107656}, {"a": 0, "b": 14, "w": 0.16229230149322715}, {"a": 0, "b": 15, "w": 0.2958185155511802}, {"a": 0, "b": 16, "w": 3.6220693111488345e-11}, {"a": 0, "b": 17, "w": 0.23675017812720545}, {"a": 0, "b": 18, "w": 0.13543401398942545}, {"a": 0, "b": 19, "w": 0.1870690038421452}, {"a": 0, "b": 20, "w": 0.1454811465205228}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=0.048,hiY=0.864;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
