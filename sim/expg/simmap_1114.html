<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">■□模様 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.295, "c": "種", "n": "■□模様 [A]  n=1385 cos1.00 難-0.29", "s": 0.399, "f": 0}, {"x": 0.999, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos1.00 難-0.35", "s": 0.868, "f": 0}, {"x": 0.997, "y": -0.243, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2572 cos1.00 難-0.24", "s": 0.741, "f": 0}, {"x": 0.997, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos1.00 難-0.25", "s": 0.694, "f": 0}, {"x": 0.997, "y": -0.323, "c": "近傍", "n": "ANAGRAMS I to Y [A]  n=2711 cos1.00 難-0.32", "s": 0.781, "f": 0}, {"x": 0.997, "y": -0.397, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2655 cos1.00 難-0.40", "s": 0.765, "f": 0}, {"x": 0.996, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos1.00 難-0.37", "s": 0.607, "f": 0}, {"x": 0.995, "y": -0.301, "c": "近傍", "n": "Drive Me Crazy [A]  n=3469 cos0.99 難-0.30", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.297, "c": "近傍", "n": "朱と碧のランページ [A]  n=1029 cos0.99 難-0.30", "s": 0.297, "f": 0}, {"x": 0.995, "y": -0.292, "c": "近傍", "n": "零 - ZERO - [A]  n=3027 cos0.99 難-0.29", "s": 0.873, "f": 0}, {"x": 0.995, "y": -0.19, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2938 cos1.00 難-0.19", "s": 0.847, "f": 0}, {"x": 0.995, "y": -0.253, "c": "近傍", "n": "MOON [A]  n=3200 cos0.99 難-0.25", "s": 0.922, "f": 0}, {"x": 0.995, "y": -0.125, "c": "近傍", "n": "Breakin' Chain [A]  n=2889 cos1.00 難-0.12", "s": 0.833, "f": 0}, {"x": 0.996, "y": -0.097, "c": "近傍", "n": "REMINISCENCE [A]  n=2781 cos1.00 難-0.10", "s": 0.802, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "beatAffection [A]  n=2807 cos1.00 難-0.13", "s": 0.809, "f": 0}, {"x": 0.994, "y": -0.413, "c": "近傍", "n": "SHINING☆DANCE [A]  n=1108 cos0.99 難-0.41", "s": 0.319, "f": 0}, {"x": 0.994, "y": -0.309, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2117 cos0.99 難-0.31", "s": 0.61, "f": 0}, {"x": 0.994, "y": -0.402, "c": "近傍", "n": "THE DETONATOR [H]  n=2218 cos0.99 難-0.40", "s": 0.639, "f": 0}, {"x": 0.996, "y": -0.099, "c": "近傍", "n": "Mighty Cutie [A]  n=946 cos1.00 難-0.10", "s": 0.273, "f": 0}, {"x": 0.995, "y": -0.112, "c": "近傍", "n": "Let me be your cure [A]  n=3101 cos1.00 難-0.11", "s": 0.894, "f": 0}, {"x": 0.993, "y": -0.311, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1118 cos0.99 難-0.31", "s": 0.322, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5344457659995892}, {"a": 0, "b": 2, "w": 0.477120022581075}, {"a": 0, "b": 3, "w": 0.46413971599038994}, {"a": 0, "b": 4, "w": 0.17151613731417192}, {"a": 0, "b": 5, "w": 0.4023655287517134}, {"a": 0, "b": 6, "w": 0.41192985587497366}, {"a": 0, "b": 7, "w": 0.2237397268182536}, {"a": 0, "b": 8, "w": 0.3048478961163563}, {"a": 0, "b": 9, "w": 0.21324195323140682}, {"a": 0, "b": 10, "w": 0.1839089875522789}, {"a": 0, "b": 11, "w": 6.43780584397291e-11}, {"a": 0, "b": 12, "w": 0.3292818149274962}, {"a": 0, "b": 13, "w": 0.348005189113476}, {"a": 0, "b": 14, "w": 0.33370181222084927}, {"a": 0, "b": 15, "w": 0.2661579892164364}, {"a": 0, "b": 16, "w": 0.24388139087386318}, {"a": 0, "b": 17, "w": 0.24216321574261634}, {"a": 0, "b": 18, "w": 0.33040954203083517}, {"a": 0, "b": 19, "w": 0.32201194667393607}, {"a": 0, "b": 20, "w": 0.1937366539765959}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.438,hiY=-0.072;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
