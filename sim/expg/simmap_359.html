<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Hello Happiness [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.041, "c": "種", "n": "Hello Happiness [H]  n=2031 cos1.00 難-1.04", "s": 0.691, "f": 0}, {"x": 0.992, "y": -1.112, "c": "近傍", "n": "1116 [H]  n=658 cos0.99 難-1.11", "s": 0.224, "f": 0}, {"x": 0.991, "y": -1.076, "c": "近傍", "n": "invoker [H]  n=1884 cos0.99 難-1.08", "s": 0.641, "f": 0}, {"x": 0.993, "y": -1.298, "c": "近傍", "n": "STARLIGHT DANCEHALL [H]  n=1838 cos0.99 難-1.30", "s": 0.625, "f": 0}, {"x": 0.989, "y": -0.972, "c": "近傍", "n": "Rock Da House [H]  n=2243 cos0.99 難-0.97", "s": 0.763, "f": 0}, {"x": 0.992, "y": -1.283, "c": "近傍", "n": "東京神話 [H]  n=1946 cos0.99 難-1.28", "s": 0.662, "f": 0}, {"x": 0.987, "y": -1.023, "c": "近傍", "n": "Smashing Wedge [H]  n=1615 cos0.99 難-1.02", "s": 0.549, "f": 0}, {"x": 0.988, "y": -0.916, "c": "近傍", "n": "GOLD RUSH [H]  n=2940 cos0.99 難-0.92", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.86, "c": "近傍", "n": "ONIGOROSHI [H]  n=1802 cos0.99 難-0.86", "s": 0.613, "f": 0}, {"x": 0.987, "y": -1.06, "c": "近傍", "n": "New Decade IIDX Edition [H]  n=2184 cos0.99 難-1.06", "s": 0.743, "f": 0}, {"x": 0.99, "y": -0.784, "c": "近傍", "n": "DESIRE [H]  n=2026 cos0.99 難-0.78", "s": 0.689, "f": 0}, {"x": 0.987, "y": -0.958, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1997 cos0.99 難-0.96", "s": 0.679, "f": 0}, {"x": 0.99, "y": -0.772, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2270 cos0.99 難-0.77", "s": 0.772, "f": 0}, {"x": 0.991, "y": -1.348, "c": "近傍", "n": "Rave Cannon [H]  n=1727 cos0.99 難-1.35", "s": 0.587, "f": 0}, {"x": 0.986, "y": -0.916, "c": "近傍", "n": "Castle on the Moon [H]  n=2273 cos0.99 難-0.92", "s": 0.773, "f": 0}, {"x": 0.988, "y": -0.779, "c": "近傍", "n": "SOLAR ECLIPSE [H]  n=1473 cos0.99 難-0.78", "s": 0.501, "f": 0}, {"x": 0.986, "y": -1.249, "c": "近傍", "n": "rommmo [H]  n=1023 cos0.99 難-1.25", "s": 0.348, "f": 0}, {"x": 0.986, "y": -1.288, "c": "近傍", "n": "TRIP MACHINE PhoeniX [H]  n=639 cos0.99 難-1.29", "s": 0.217, "f": 0}, {"x": 0.984, "y": -0.973, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1679 cos0.98 難-0.97", "s": 0.571, "f": 0}, {"x": 0.984, "y": -1.041, "c": "近傍", "n": "Unicorn tail [H]  n=2342 cos0.98 難-1.04", "s": 0.797, "f": 0}, {"x": 0.984, "y": -0.89, "c": "近傍", "n": "TOMAHAWK [H]  n=1304 cos0.98 難-0.89", "s": 0.444, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5276800442377396}, {"a": 0, "b": 2, "w": 0.5290095678860187}, {"a": 0, "b": 3, "w": 0.5911297925530099}, {"a": 0, "b": 4, "w": 0.34659796668902154}, {"a": 0, "b": 5, "w": 0.5481677865896893}, {"a": 0, "b": 6, "w": 0.40825619033558513}, {"a": 0, "b": 7, "w": 0.3839869014640549}, {"a": 0, "b": 8, "w": 0.40180403310213963}, {"a": 0, "b": 9, "w": 0.4509122049654404}, {"a": 0, "b": 10, "w": 0.45010422654824955}, {"a": 0, "b": 11, "w": 0.4399282689307924}, {"a": 0, "b": 12, "w": 0.49298838304469106}, {"a": 0, "b": 13, "w": 0.5381556817388136}, {"a": 0, "b": 14, "w": 0.36182599868026044}, {"a": 0, "b": 15, "w": 0.2035400893522772}, {"a": 0, "b": 16, "w": 0.39047189424269246}, {"a": 0, "b": 17, "w": 0.44574613099178784}, {"a": 0, "b": 18, "w": 0.3441208669675705}, {"a": 0, "b": 19, "w": 0.3668549105328245}, {"a": 0, "b": 20, "w": 3.489841748915978e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.394,hiY=-0.726;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
