<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ラクエン [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.807, "c": "種", "n": "ラクエン [A]  n=2994 cos1.00 難0.81", "s": 0.827, "f": 0}, {"x": 0.986, "y": 0.49, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2974 cos0.99 難0.49", "s": 0.822, "f": 0}, {"x": 0.983, "y": 0.603, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3343 cos0.98 難0.60", "s": 0.924, "f": 0}, {"x": 0.982, "y": 0.988, "c": "近傍", "n": "SCREAM SQUAD [A]  n=3568 cos0.98 難0.99", "s": 0.986, "f": 0}, {"x": 0.986, "y": 0.318, "c": "近傍", "n": "Hella Deep [A]  n=2810 cos0.99 難0.32", "s": 0.776, "f": 0}, {"x": 0.974, "y": 0.753, "c": "近傍", "n": "カジノファイヤーことみちゃん [A]  n=3422 cos0.97 難0.75", "s": 0.946, "f": 0}, {"x": 0.974, "y": 0.799, "c": "近傍", "n": "Beat Juggling Mix [A]  n=3214 cos0.97 難0.80", "s": 0.888, "f": 0}, {"x": 0.975, "y": 0.569, "c": "近傍", "n": "Digitank System [A]  n=3619 cos0.97 難0.57", "s": 1.0, "f": 0}, {"x": 0.974, "y": 0.602, "c": "近傍", "n": "EMERALDAS [H]  n=3140 cos0.97 難0.60", "s": 0.868, "f": 0}, {"x": 0.973, "y": 0.741, "c": "近傍", "n": "rough percussionythm [A]  n=2829 cos0.97 難0.74", "s": 0.782, "f": 0}, {"x": 0.972, "y": 0.836, "c": "近傍", "n": "Bounce Bounce Bounce [A]  n=3390 cos0.97 難0.84", "s": 0.937, "f": 0}, {"x": 0.972, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.97 難0.91", "s": 0.937, "f": 0}, {"x": 0.972, "y": 1.018, "c": "近傍", "n": "FUTURE is Dead [A]  n=3211 cos0.97 難1.02", "s": 0.887, "f": 0}, {"x": 0.971, "y": 0.784, "c": "近傍", "n": "Psycho Sheep Riddim [L]  n=1868 cos0.97 難0.78", "s": 0.516, "f": 0}, {"x": 0.986, "y": 0.09, "c": "近傍", "n": "Really Love [A]  n=3145 cos0.99 難0.09", "s": 0.869, "f": 0}, {"x": 0.976, "y": 0.309, "c": "近傍", "n": "250bpm [A]  n=2652 cos0.98 難0.31", "s": 0.733, "f": 0}, {"x": 0.976, "y": 0.32, "c": "近傍", "n": "灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A]  n=2953 cos0.98 難0.32", "s": 0.816, "f": 0}, {"x": 0.976, "y": 0.317, "c": "近傍", "n": "泰東ノ翠霞 [A]  n=2900 cos0.98 難0.32", "s": 0.801, "f": 0}, {"x": 0.97, "y": 1.035, "c": "近傍", "n": "Theory [A]  n=2919 cos0.97 難1.04", "s": 0.807, "f": 0}, {"x": 0.975, "y": 0.318, "c": "近傍", "n": "Watch out!! [A]  n=3269 cos0.97 難0.32", "s": 0.903, "f": 0}, {"x": 0.969, "y": 0.647, "c": "近傍", "n": "Ah Hah Yeah [A]  n=2588 cos0.97 難0.65", "s": 0.715, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5125423651912507}, {"a": 0, "b": 2, "w": 0.4510503560643153}, {"a": 0, "b": 3, "w": 0.42643772621089004}, {"a": 0, "b": 4, "w": 0.49832700878804026}, {"a": 0, "b": 5, "w": 0.13895325541186032}, {"a": 0, "b": 6, "w": 0.08053756579025861}, {"a": 0, "b": 7, "w": 0.2723667038626294}, {"a": 0, "b": 8, "w": 0.09501081162545066}, {"a": 0, "b": 9, "w": 0.14827049786242819}, {"a": 0, "b": 10, "w": 0.2363824645497662}, {"a": 0, "b": 11, "w": 0.16873380642515268}, {"a": 0, "b": 12, "w": 0.29222682660520183}, {"a": 0, "b": 13, "w": 0.1687139884606772}, {"a": 0, "b": 14, "w": 0.46518019447401693}, {"a": 0, "b": 15, "w": 0.3404030383075092}, {"a": 0, "b": 16, "w": 0.3142622030249359}, {"a": 0, "b": 17, "w": 0.33571859934262394}, {"a": 0, "b": 18, "w": 2.7269186908540632e-11}, {"a": 0, "b": 19, "w": 0.34139544787667586}, {"a": 0, "b": 20, "w": 0.13782693547283953}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.967,hiX=1.002,loY=0.014,hiY=1.111;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
