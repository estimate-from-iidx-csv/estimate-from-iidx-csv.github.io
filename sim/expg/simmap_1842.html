<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Do it!! Do it!! [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.981, "c": "種", "n": "Do it!! Do it!! [A]  n=3358 cos1.00 難0.98", "s": 0.895, "f": 0}, {"x": 0.992, "y": 0.808, "c": "近傍", "n": "雪月花 [A]  n=3721 cos0.99 難0.81", "s": 0.992, "f": 0}, {"x": 0.99, "y": 0.96, "c": "近傍", "n": "Funny shuffle [A]  n=3259 cos0.99 難0.96", "s": 0.869, "f": 0}, {"x": 0.988, "y": 1.16, "c": "近傍", "n": "SAY BAY [A]  n=3492 cos0.99 難1.16", "s": 0.931, "f": 0}, {"x": 0.986, "y": 0.903, "c": "近傍", "n": "SCHWARZSCHILD FIELD [A]  n=3215 cos0.99 難0.90", "s": 0.857, "f": 0}, {"x": 0.986, "y": 1.074, "c": "近傍", "n": "one or eight [A]  n=3560 cos0.99 難1.07", "s": 0.949, "f": 0}, {"x": 0.991, "y": 0.479, "c": "近傍", "n": "Hello Happiness [A]  n=3371 cos0.99 難0.48", "s": 0.899, "f": 0}, {"x": 0.985, "y": 1.326, "c": "近傍", "n": "SISYPHUS [A]  n=826 cos0.99 難1.33", "s": 0.22, "f": 0}, {"x": 0.983, "y": 0.98, "c": "近傍", "n": "moon_child [A]  n=3570 cos0.98 難0.98", "s": 0.952, "f": 0}, {"x": 0.983, "y": 0.988, "c": "近傍", "n": "SCREAM SQUAD [A]  n=3568 cos0.98 難0.99", "s": 0.951, "f": 0}, {"x": 0.983, "y": 1.021, "c": "近傍", "n": "電光 [A]  n=1707 cos0.98 難1.02", "s": 0.455, "f": 0}, {"x": 0.982, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.98 難0.91", "s": 0.904, "f": 0}, {"x": 0.984, "y": 0.523, "c": "近傍", "n": "gigadelic [H]  n=3750 cos0.98 難0.52", "s": 1.0, "f": 0}, {"x": 0.982, "y": 0.82, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3706 cos0.98 難0.82", "s": 0.988, "f": 0}, {"x": 0.982, "y": 0.79, "c": "近傍", "n": "The Sampling Paradise [A]  n=3739 cos0.98 難0.79", "s": 0.997, "f": 0}, {"x": 0.982, "y": 0.72, "c": "近傍", "n": "TITANS RETURN [A]  n=3176 cos0.98 難0.72", "s": 0.847, "f": 0}, {"x": 0.985, "y": 0.491, "c": "近傍", "n": "BREAK OVER [A]  n=3006 cos0.98 難0.49", "s": 0.802, "f": 0}, {"x": 0.987, "y": 0.388, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1735 cos0.99 難0.39", "s": 0.463, "f": 0}, {"x": 0.982, "y": 0.639, "c": "近傍", "n": "Click Again [A]  n=3097 cos0.98 難0.64", "s": 0.826, "f": 0}, {"x": 0.982, "y": 0.681, "c": "近傍", "n": "Sense 2007 [H]  n=3332 cos0.98 難0.68", "s": 0.889, "f": 0}, {"x": 0.986, "y": 0.347, "c": "近傍", "n": "TRIP THE DEEP [A]  n=1452 cos0.99 難0.35", "s": 0.387, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5957198862063325}, {"a": 0, "b": 2, "w": 0.5181586267154705}, {"a": 0, "b": 3, "w": 0.23971749819586963}, {"a": 0, "b": 4, "w": 0.4625628334780677}, {"a": 0, "b": 5, "w": 0.428819839735623}, {"a": 0, "b": 6, "w": 0.524002303021023}, {"a": 0, "b": 7, "w": 2.563127488031114e-11}, {"a": 0, "b": 8, "w": 0.4094723307641863}, {"a": 0, "b": 9, "w": 0.3315381409618884}, {"a": 0, "b": 10, "w": 0.2031747334637498}, {"a": 0, "b": 11, "w": 0.38482945636504073}, {"a": 0, "b": 12, "w": 0.32264037095692366}, {"a": 0, "b": 13, "w": 0.3252150547077505}, {"a": 0, "b": 14, "w": 0.24194785405575148}, {"a": 0, "b": 15, "w": 0.36231344934052423}, {"a": 0, "b": 16, "w": 0.36424320989175607}, {"a": 0, "b": 17, "w": 0.4689706915802885}, {"a": 0, "b": 18, "w": 0.2529252299190592}, {"a": 0, "b": 19, "w": 0.37075874390783736}, {"a": 0, "b": 20, "w": 0.4673065134020501}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=0.269,hiY=1.404;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
