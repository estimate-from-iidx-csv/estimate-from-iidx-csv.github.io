<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Little Star [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.796, "c": "種", "n": "Little Star [A]  n=3671 cos1.00 難0.80", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.777, "c": "近傍", "n": "encounter [A]  n=3621 cos1.00 難0.78", "s": 0.986, "f": 0}, {"x": 0.994, "y": 0.671, "c": "近傍", "n": "GHOST [A]  n=2243 cos0.99 難0.67", "s": 0.611, "f": 0}, {"x": 0.996, "y": 0.977, "c": "近傍", "n": "恋する☆宇宙戦争っ！！ [A]  n=3617 cos1.00 難0.98", "s": 0.985, "f": 0}, {"x": 0.992, "y": 0.866, "c": "近傍", "n": "Arca [A]  n=3564 cos0.99 難0.87", "s": 0.971, "f": 0}, {"x": 0.992, "y": 0.684, "c": "近傍", "n": "LAB [L]  n=856 cos0.99 難0.68", "s": 0.233, "f": 0}, {"x": 0.993, "y": 0.97, "c": "近傍", "n": "ACT0 [A]  n=1591 cos0.99 難0.97", "s": 0.433, "f": 0}, {"x": 0.996, "y": 0.524, "c": "近傍", "n": "HYENA [A]  n=3451 cos1.00 難0.52", "s": 0.94, "f": 0}, {"x": 0.994, "y": 0.565, "c": "近傍", "n": "Be a Hero! [A]  n=3193 cos0.99 難0.57", "s": 0.87, "f": 0}, {"x": 0.996, "y": 1.08, "c": "近傍", "n": "BLAZING_LAZER [A]  n=1561 cos1.00 難1.08", "s": 0.425, "f": 0}, {"x": 0.992, "y": 1.007, "c": "近傍", "n": "Feel The Beat [A]  n=3596 cos0.99 難1.01", "s": 0.98, "f": 0}, {"x": 0.991, "y": 0.605, "c": "近傍", "n": "REVOLVER [A]  n=2955 cos0.99 難0.60", "s": 0.805, "f": 0}, {"x": 0.989, "y": 0.71, "c": "近傍", "n": "STELLAR WIND [A]  n=3201 cos0.99 難0.71", "s": 0.872, "f": 0}, {"x": 0.995, "y": 1.108, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1129 cos0.99 難1.11", "s": 0.308, "f": 0}, {"x": 0.991, "y": 1.025, "c": "近傍", "n": "Fegrix [A]  n=2629 cos0.99 難1.03", "s": 0.716, "f": 0}, {"x": 0.992, "y": 1.058, "c": "近傍", "n": "即席！脳直★ミュージックシステム [A]  n=3499 cos0.99 難1.06", "s": 0.953, "f": 0}, {"x": 0.988, "y": 0.757, "c": "近傍", "n": "Carry Me Away [A]  n=3345 cos0.99 難0.76", "s": 0.911, "f": 0}, {"x": 0.991, "y": 0.537, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2667 cos0.99 難0.54", "s": 0.727, "f": 0}, {"x": 0.991, "y": 0.562, "c": "近傍", "n": "Night! Night! Night! [A]  n=2918 cos0.99 難0.56", "s": 0.795, "f": 0}, {"x": 0.989, "y": 0.963, "c": "近傍", "n": "ONE AND ONLY [A]  n=2175 cos0.99 難0.96", "s": 0.592, "f": 0}, {"x": 0.989, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos0.99 難0.59", "s": 0.923, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5090342542310939}, {"a": 0, "b": 2, "w": 0.4373720805601785}, {"a": 0, "b": 3, "w": 0.4217395664820185}, {"a": 0, "b": 4, "w": 0.3533715036217149}, {"a": 0, "b": 5, "w": 0.35660491160825414}, {"a": 0, "b": 6, "w": 0.38151956302456025}, {"a": 0, "b": 7, "w": 0.5298823164797088}, {"a": 0, "b": 8, "w": 0.4496108578130932}, {"a": 0, "b": 9, "w": 0.3218895945008269}, {"a": 0, "b": 10, "w": 0.2625237363149068}, {"a": 0, "b": 11, "w": 0.3495886565922668}, {"a": 0, "b": 12, "w": 0.20607592407630926}, {"a": 0, "b": 13, "w": 0.30929647667112925}, {"a": 0, "b": 14, "w": 0.2836371199150496}, {"a": 0, "b": 15, "w": 3.687328220536301e-11}, {"a": 0, "b": 16, "w": 0.2090879867586004}, {"a": 0, "b": 17, "w": 0.34215259899848494}, {"a": 0, "b": 18, "w": 0.33296911142965124}, {"a": 0, "b": 19, "w": 0.23441319639489233}, {"a": 0, "b": 20, "w": 0.2610634026807893}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.478,hiY=1.155;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
