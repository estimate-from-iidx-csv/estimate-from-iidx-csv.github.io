<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">rainbow flyer [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.858, "c": "種", "n": "rainbow flyer [H]  n=1906 cos1.00 難-0.86", "s": 0.606, "f": 0}, {"x": 0.994, "y": -0.875, "c": "近傍", "n": "Quickening [H]  n=1506 cos0.99 難-0.87", "s": 0.479, "f": 0}, {"x": 0.995, "y": -0.722, "c": "近傍", "n": "ALL MY TURN -このターンに、オレの全てを賭ける- [H]  n=2165 cos0.99 難-0.72", "s": 0.689, "f": 0}, {"x": 0.993, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos0.99 難-0.81", "s": 0.56, "f": 0}, {"x": 0.993, "y": -0.84, "c": "近傍", "n": "Programmed World [H]  n=2074 cos0.99 難-0.84", "s": 0.66, "f": 0}, {"x": 0.993, "y": -0.801, "c": "近傍", "n": "Gravigazer [H]  n=2392 cos0.99 難-0.80", "s": 0.761, "f": 0}, {"x": 0.992, "y": -0.781, "c": "近傍", "n": "Broken [H]  n=3144 cos0.99 難-0.78", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.702, "c": "近傍", "n": "RED ZONE [H]  n=2997 cos0.99 難-0.70", "s": 0.953, "f": 0}, {"x": 0.994, "y": -0.598, "c": "近傍", "n": "NEMESIS [H]  n=1851 cos0.99 難-0.60", "s": 0.589, "f": 0}, {"x": 0.991, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos0.99 難-0.75", "s": 0.449, "f": 0}, {"x": 0.99, "y": -0.96, "c": "近傍", "n": "NITROUS CANNON [H]  n=2158 cos0.99 難-0.96", "s": 0.686, "f": 0}, {"x": 0.989, "y": -0.809, "c": "近傍", "n": "紅牡丹 [H]  n=2663 cos0.99 難-0.81", "s": 0.847, "f": 0}, {"x": 0.989, "y": -0.849, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1692 cos0.99 難-0.85", "s": 0.538, "f": 0}, {"x": 0.993, "y": -0.576, "c": "近傍", "n": "Sphere [H]  n=1978 cos0.99 難-0.58", "s": 0.629, "f": 0}, {"x": 0.99, "y": -0.696, "c": "近傍", "n": "旅人リラン [H]  n=2553 cos0.99 難-0.70", "s": 0.812, "f": 0}, {"x": 0.993, "y": -1.163, "c": "近傍", "n": "EBONY & IVORY [H]  n=1768 cos0.99 難-1.16", "s": 0.562, "f": 0}, {"x": 0.988, "y": -0.862, "c": "近傍", "n": "Light and Cyber… [H]  n=2221 cos0.99 難-0.86", "s": 0.706, "f": 0}, {"x": 0.989, "y": -0.702, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2113 cos0.99 難-0.70", "s": 0.672, "f": 0}, {"x": 0.99, "y": -1.104, "c": "近傍", "n": "閠槞彁の願い [H]  n=1555 cos0.99 難-1.10", "s": 0.495, "f": 0}, {"x": 0.988, "y": -0.963, "c": "近傍", "n": "HYENA [H]  n=2377 cos0.99 難-0.96", "s": 0.756, "f": 0}, {"x": 0.989, "y": -0.641, "c": "近傍", "n": "switch [H]  n=1801 cos0.99 難-0.64", "s": 0.573, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5616672594798499}, {"a": 0, "b": 2, "w": 0.402621200979532}, {"a": 0, "b": 3, "w": 0.5068023756637396}, {"a": 0, "b": 4, "w": 0.4922932705460037}, {"a": 0, "b": 5, "w": 0.32882834517994286}, {"a": 0, "b": 6, "w": 0.4639526194616692}, {"a": 0, "b": 7, "w": 0.43174065520762783}, {"a": 0, "b": 8, "w": 0.5494163550724467}, {"a": 0, "b": 9, "w": 0.42221052402345305}, {"a": 0, "b": 10, "w": 0.22698302656372138}, {"a": 0, "b": 11, "w": 0.21338913360401757}, {"a": 0, "b": 12, "w": 0.3006644431105173}, {"a": 0, "b": 13, "w": 0.3699775503149336}, {"a": 0, "b": 14, "w": 0.37143375949139246}, {"a": 0, "b": 15, "w": 0.36151503118391093}, {"a": 0, "b": 16, "w": 0.2705973900710943}, {"a": 0, "b": 17, "w": 0.3613160396834735}, {"a": 0, "b": 18, "w": 4.4477976857137946e-11}, {"a": 0, "b": 19, "w": 0.16180984072260918}, {"a": 0, "b": 20, "w": 0.3848021347668735}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.211,hiY=-0.529;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
