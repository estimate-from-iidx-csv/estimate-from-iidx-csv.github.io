<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">寝起きヤシの木 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.082, "c": "種", "n": "寝起きヤシの木 [A]  n=2034 cos1.00 難0.08", "s": 0.578, "f": 0}, {"x": 0.997, "y": 0.11, "c": "近傍", "n": "Howling [L]  n=2737 cos1.00 難0.11", "s": 0.778, "f": 0}, {"x": 0.996, "y": 0.136, "c": "近傍", "n": "ハードベース・フェスタ [A]  n=3453 cos1.00 難0.14", "s": 0.982, "f": 0}, {"x": 0.996, "y": 0.179, "c": "近傍", "n": "Exhaust Hype [A]  n=3386 cos1.00 難0.18", "s": 0.962, "f": 0}, {"x": 0.995, "y": 0.182, "c": "近傍", "n": "MA・TSU・RI [A]  n=2106 cos1.00 難0.18", "s": 0.599, "f": 0}, {"x": 0.995, "y": 0.212, "c": "近傍", "n": "うさ☆かめ 大戦争！ [A]  n=3351 cos1.00 難0.21", "s": 0.953, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "R∞tAge [A]  n=3518 cos0.99 難0.14", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.115, "c": "近傍", "n": "Fashion Fruit [A]  n=1052 cos0.99 難0.12", "s": 0.299, "f": 0}, {"x": 0.993, "y": 0.073, "c": "近傍", "n": "MOCHIMOCHI DREAMIN!! [A]  n=1092 cos0.99 難0.07", "s": 0.31, "f": 0}, {"x": 0.993, "y": 0.029, "c": "近傍", "n": "ミラージュ・レジデンス [A]  n=2806 cos0.99 難0.03", "s": 0.798, "f": 0}, {"x": 0.993, "y": -0.041, "c": "近傍", "n": "Piano Samurai [A]  n=2813 cos0.99 難-0.04", "s": 0.8, "f": 0}, {"x": 0.993, "y": 0.212, "c": "近傍", "n": "Burning Flame [A]  n=2607 cos0.99 難0.21", "s": 0.741, "f": 0}, {"x": 0.992, "y": 0.118, "c": "近傍", "n": "IN BETWEEN [A]  n=1020 cos0.99 難0.12", "s": 0.29, "f": 0}, {"x": 0.994, "y": 0.313, "c": "近傍", "n": "Catch ya Getcha! [A]  n=1041 cos0.99 難0.31", "s": 0.296, "f": 0}, {"x": 0.991, "y": 0.036, "c": "近傍", "n": "RAVE SYNDROME [A]  n=1563 cos0.99 難0.04", "s": 0.444, "f": 0}, {"x": 0.991, "y": 0.116, "c": "近傍", "n": "blue anthem [A]  n=506 cos0.99 難0.12", "s": 0.144, "f": 0}, {"x": 0.991, "y": -0.038, "c": "近傍", "n": "ANAGMA [A]  n=2584 cos0.99 難-0.04", "s": 0.735, "f": 0}, {"x": 0.991, "y": 0.104, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [A]  n=3339 cos0.99 難0.10", "s": 0.949, "f": 0}, {"x": 0.991, "y": 0.148, "c": "近傍", "n": "月光 [A]  n=3163 cos0.99 難0.15", "s": 0.899, "f": 0}, {"x": 0.992, "y": -0.091, "c": "近傍", "n": "Vitamin [A]  n=1119 cos0.99 難-0.09", "s": 0.318, "f": 0}, {"x": 0.99, "y": 0.052, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [A]  n=2796 cos0.99 難0.05", "s": 0.795, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6206703542930991}, {"a": 0, "b": 2, "w": 0.5071558326719118}, {"a": 0, "b": 3, "w": 0.4479179475106949}, {"a": 0, "b": 4, "w": 0.4535347662064838}, {"a": 0, "b": 5, "w": 0.41964846987825666}, {"a": 0, "b": 6, "w": 0.4732991124489164}, {"a": 0, "b": 7, "w": 0.4595861584688581}, {"a": 0, "b": 8, "w": 0.44065182847025053}, {"a": 0, "b": 9, "w": 0.2267203603689104}, {"a": 0, "b": 10, "w": 0.3125393310229866}, {"a": 0, "b": 11, "w": 0.4330159332499287}, {"a": 0, "b": 12, "w": 0.23642228615475935}, {"a": 0, "b": 13, "w": 0.4955382886908769}, {"a": 0, "b": 14, "w": 0.33613319898234184}, {"a": 0, "b": 15, "w": 0.360405531192423}, {"a": 0, "b": 16, "w": 0.13441075336919117}, {"a": 0, "b": 17, "w": 0.33703132522210344}, {"a": 0, "b": 18, "w": 0.1687561413742149}, {"a": 0, "b": 19, "w": 0.2319722766910699}, {"a": 0, "b": 20, "w": 3.634104128735771e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.123,hiY=0.345;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
