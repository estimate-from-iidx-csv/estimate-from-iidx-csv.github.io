<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">夏色DIARY - L.E.D.-G STYLE MIX - [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.708, "c": "種", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [H]  n=2284 cos1.00 難-0.71", "s": 0.709, "f": 0}, {"x": 0.993, "y": -0.708, "c": "近傍", "n": "quasar [H]  n=3209 cos0.99 難-0.71", "s": 0.996, "f": 0}, {"x": 0.993, "y": -0.633, "c": "近傍", "n": "WONDER WALKER [H]  n=2625 cos0.99 難-0.63", "s": 0.814, "f": 0}, {"x": 0.993, "y": -0.801, "c": "近傍", "n": "Highcharge Divolt [H]  n=2464 cos0.99 難-0.80", "s": 0.765, "f": 0}, {"x": 0.991, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos0.99 難-0.74", "s": 0.637, "f": 0}, {"x": 0.991, "y": -0.702, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2113 cos0.99 難-0.70", "s": 0.656, "f": 0}, {"x": 0.994, "y": -0.858, "c": "近傍", "n": "KAMAITACHI [H]  n=2385 cos0.99 難-0.86", "s": 0.74, "f": 0}, {"x": 0.991, "y": -0.761, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2360 cos0.99 難-0.76", "s": 0.732, "f": 0}, {"x": 0.991, "y": -0.619, "c": "近傍", "n": "トリカゴノ鳳凰 [H]  n=2593 cos0.99 難-0.62", "s": 0.805, "f": 0}, {"x": 0.991, "y": -0.804, "c": "近傍", "n": "Go Ahead!! [H]  n=2503 cos0.99 難-0.80", "s": 0.777, "f": 0}, {"x": 0.99, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.99 難-0.65", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.702, "c": "近傍", "n": "RED ZONE [H]  n=2997 cos0.99 難-0.70", "s": 0.93, "f": 0}, {"x": 0.994, "y": -0.878, "c": "近傍", "n": "xenon [H]  n=2369 cos0.99 難-0.88", "s": 0.735, "f": 0}, {"x": 0.991, "y": -0.806, "c": "近傍", "n": "HYPERION [H]  n=1840 cos0.99 難-0.81", "s": 0.571, "f": 0}, {"x": 0.994, "y": -0.886, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1987 cos0.99 難-0.89", "s": 0.617, "f": 0}, {"x": 0.989, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos0.99 難-0.71", "s": 0.708, "f": 0}, {"x": 0.989, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.506, "f": 0}, {"x": 0.991, "y": -0.851, "c": "近傍", "n": "Giudecca [H]  n=1654 cos0.99 難-0.85", "s": 0.513, "f": 0}, {"x": 0.989, "y": -0.803, "c": "近傍", "n": "LAB [H]  n=1740 cos0.99 難-0.80", "s": 0.54, "f": 0}, {"x": 0.989, "y": -0.605, "c": "近傍", "n": "黒髪乱れし修羅となりて [H]  n=3129 cos0.99 難-0.61", "s": 0.971, "f": 0}, {"x": 0.988, "y": -0.714, "c": "近傍", "n": "ACT [H]  n=1828 cos0.99 難-0.71", "s": 0.567, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.09585563035649014}, {"a": 0, "b": 2, "w": 0.1983816768270017}, {"a": 0, "b": 3, "w": 0.41151604306487244}, {"a": 0, "b": 4, "w": 0.0560416974581367}, {"a": 0, "b": 5, "w": 0.24560594040690975}, {"a": 0, "b": 6, "w": 0.27197469180944034}, {"a": 0, "b": 7, "w": 0.3078635364807495}, {"a": 0, "b": 8, "w": 0.31302790411630355}, {"a": 0, "b": 9, "w": 0.22980566986512496}, {"a": 0, "b": 10, "w": 0.229672553883974}, {"a": 0, "b": 11, "w": 0.23404297158038823}, {"a": 0, "b": 12, "w": 0.13905192070857397}, {"a": 0, "b": 13, "w": 0.10469108702688068}, {"a": 0, "b": 14, "w": 0.24090055947967137}, {"a": 0, "b": 15, "w": 0.15916818460952975}, {"a": 0, "b": 16, "w": 0.1891617566723165}, {"a": 0, "b": 17, "w": 0.11831647508873944}, {"a": 0, "b": 18, "w": 0.2723220351567921}, {"a": 0, "b": 19, "w": 4.577438428299274e-11}, {"a": 0, "b": 20, "w": 0.12139694787980426}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.908,hiY=-0.583;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
