<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Catch ya Getcha! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.732, "c": "種", "n": "Catch ya Getcha! [H]  n=292 cos1.00 難-1.73", "s": 0.224, "f": 0}, {"x": 0.995, "y": -1.616, "c": "近傍", "n": "Exhaust Hype [H]  n=1305 cos0.99 難-1.62", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.853, "c": "近傍", "n": "Rosa azuL [H]  n=626 cos0.99 難-1.85", "s": 0.48, "f": 0}, {"x": 0.992, "y": -1.907, "c": "近傍", "n": "GIGA RAID [H]  n=899 cos0.99 難-1.91", "s": 0.689, "f": 0}, {"x": 0.995, "y": -1.486, "c": "近傍", "n": "Necroxis Girl [H]  n=934 cos1.00 難-1.49", "s": 0.716, "f": 0}, {"x": 0.994, "y": -1.481, "c": "近傍", "n": "Battleground [H]  n=1213 cos0.99 難-1.48", "s": 0.93, "f": 0}, {"x": 0.991, "y": -1.871, "c": "近傍", "n": "X-ray binary [H]  n=793 cos0.99 難-1.87", "s": 0.608, "f": 0}, {"x": 0.994, "y": -1.482, "c": "近傍", "n": "CoMAAAAAAA [H]  n=1224 cos0.99 難-1.48", "s": 0.938, "f": 0}, {"x": 0.99, "y": -1.601, "c": "近傍", "n": "Like+it! [H]  n=1120 cos0.99 難-1.60", "s": 0.858, "f": 0}, {"x": 0.99, "y": -1.887, "c": "近傍", "n": "Lovely Howdy Cowboy!! [H]  n=779 cos0.99 難-1.89", "s": 0.597, "f": 0}, {"x": 0.993, "y": -1.48, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=805 cos0.99 難-1.48", "s": 0.617, "f": 0}, {"x": 0.99, "y": -1.883, "c": "近傍", "n": "SOLID WYVERN [H]  n=697 cos0.99 難-1.88", "s": 0.534, "f": 0}, {"x": 0.99, "y": -1.873, "c": "近傍", "n": "Mukade [H]  n=505 cos0.99 難-1.87", "s": 0.387, "f": 0}, {"x": 0.993, "y": -1.459, "c": "近傍", "n": "夢縁 [H]  n=1038 cos0.99 難-1.46", "s": 0.795, "f": 0}, {"x": 0.99, "y": -1.907, "c": "近傍", "n": "MA・TSU・RI [H]  n=527 cos0.99 難-1.91", "s": 0.404, "f": 0}, {"x": 0.988, "y": -1.729, "c": "近傍", "n": "POLKAMANIA [H]  n=1243 cos0.99 難-1.73", "s": 0.952, "f": 0}, {"x": 0.991, "y": -1.512, "c": "近傍", "n": "Push on Beats!～音ゲの国のeX-ストリーマー～ [H]  n=779 cos0.99 難-1.51", "s": 0.597, "f": 0}, {"x": 0.988, "y": -1.685, "c": "近傍", "n": "GIGA THRASH [H]  n=1174 cos0.99 難-1.68", "s": 0.9, "f": 0}, {"x": 0.988, "y": -1.895, "c": "近傍", "n": "winkle 2 winkle [H]  n=511 cos0.99 難-1.89", "s": 0.392, "f": 0}, {"x": 0.988, "y": -1.871, "c": "近傍", "n": "無意識のフィロソフィア [H]  n=754 cos0.99 難-1.87", "s": 0.578, "f": 0}, {"x": 0.988, "y": -1.842, "c": "近傍", "n": "Neo Heritage [H]  n=803 cos0.99 難-1.84", "s": 0.615, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30077060195260696}, {"a": 0, "b": 2, "w": 0.26350932459332543}, {"a": 0, "b": 3, "w": 0.25099206092766646}, {"a": 0, "b": 4, "w": 0.40444732998363586}, {"a": 0, "b": 5, "w": 0.37580331117782984}, {"a": 0, "b": 6, "w": 0.09761540533533064}, {"a": 0, "b": 7, "w": 0.33708951912899965}, {"a": 0, "b": 8, "w": 0.17677909130219116}, {"a": 0, "b": 9, "w": 0.13230244003415503}, {"a": 0, "b": 10, "w": 0.28787097257399397}, {"a": 0, "b": 11, "w": 0.17587694947617116}, {"a": 0, "b": 12, "w": 0.14898842724739436}, {"a": 0, "b": 13, "w": 0.32104233051442144}, {"a": 0, "b": 14, "w": 0.15079062005290733}, {"a": 0, "b": 15, "w": 0.1096543074808759}, {"a": 0, "b": 16, "w": 0.11682792131720576}, {"a": 0, "b": 17, "w": 0.09800915036572422}, {"a": 0, "b": 18, "w": 0.11211762659771107}, {"a": 0, "b": 19, "w": 0.07449368695061331}, {"a": 0, "b": 20, "w": 5.985190121293726e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.943,hiY=-1.424;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
