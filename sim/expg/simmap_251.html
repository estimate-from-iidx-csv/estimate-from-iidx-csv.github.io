<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Break Stasis [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.87, "c": "種", "n": "Break Stasis [H]  n=1189 cos1.00 難-1.87", "s": 0.744, "f": 0}, {"x": 0.996, "y": -1.912, "c": "近傍", "n": "フォニイ [H]  n=783 cos1.00 難-1.91", "s": 0.49, "f": 0}, {"x": 0.995, "y": -1.907, "c": "近傍", "n": "輪廻の鴉 [H]  n=556 cos1.00 難-1.91", "s": 0.348, "f": 0}, {"x": 0.996, "y": -1.921, "c": "近傍", "n": "響花水月 [H]  n=684 cos1.00 難-1.92", "s": 0.428, "f": 0}, {"x": 0.994, "y": -1.892, "c": "近傍", "n": "ウツシミウツシ [H]  n=716 cos0.99 難-1.89", "s": 0.448, "f": 0}, {"x": 0.996, "y": -1.716, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [H]  n=1150 cos1.00 難-1.72", "s": 0.72, "f": 0}, {"x": 0.993, "y": -1.897, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=956 cos0.99 難-1.90", "s": 0.598, "f": 0}, {"x": 0.992, "y": -1.882, "c": "近傍", "n": "Speculation [H]  n=529 cos0.99 難-1.88", "s": 0.331, "f": 0}, {"x": 0.992, "y": -1.928, "c": "近傍", "n": "オールトの雲 [H]  n=825 cos0.99 難-1.93", "s": 0.516, "f": 0}, {"x": 0.993, "y": -1.746, "c": "近傍", "n": "Parvati [H]  n=731 cos0.99 難-1.75", "s": 0.457, "f": 0}, {"x": 0.992, "y": -1.833, "c": "近傍", "n": "儚き恋の華 [H]  n=970 cos0.99 難-1.83", "s": 0.607, "f": 0}, {"x": 0.991, "y": -1.872, "c": "近傍", "n": "Garuda [H]  n=879 cos0.99 難-1.87", "s": 0.55, "f": 0}, {"x": 0.991, "y": -1.871, "c": "近傍", "n": "ランカーキラーガール [H]  n=1295 cos0.99 難-1.87", "s": 0.81, "f": 0}, {"x": 0.991, "y": -1.885, "c": "近傍", "n": "Ritual of Anubis [H]  n=624 cos0.99 難-1.89", "s": 0.39, "f": 0}, {"x": 0.993, "y": -1.567, "c": "近傍", "n": "最小三倍完全数 [H]  n=1144 cos0.99 難-1.57", "s": 0.716, "f": 0}, {"x": 0.99, "y": -2.012, "c": "近傍", "n": "ラビットホール [H]  n=555 cos0.99 難-2.01", "s": 0.347, "f": 0}, {"x": 0.993, "y": -1.583, "c": "近傍", "n": "Angelic Jelly [H]  n=1598 cos0.99 難-1.58", "s": 1.0, "f": 0}, {"x": 0.989, "y": -1.891, "c": "近傍", "n": "メズマライザー [H]  n=596 cos0.99 難-1.89", "s": 0.373, "f": 0}, {"x": 0.991, "y": -1.61, "c": "近傍", "n": "Wonderland [H]  n=1089 cos0.99 難-1.61", "s": 0.681, "f": 0}, {"x": 0.993, "y": -1.558, "c": "近傍", "n": "《PL|RAYER》 [H]  n=599 cos0.99 難-1.56", "s": 0.375, "f": 0}, {"x": 0.988, "y": -1.714, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [H]  n=1099 cos0.99 難-1.71", "s": 0.688, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.37283900737749887}, {"a": 0, "b": 2, "w": 0.3785494336045562}, {"a": 0, "b": 3, "w": 0.3261951953629457}, {"a": 0, "b": 4, "w": 0.28086065050555087}, {"a": 0, "b": 5, "w": 0.2683949903520928}, {"a": 0, "b": 6, "w": 0.21803167454104522}, {"a": 0, "b": 7, "w": 0.19289423360062885}, {"a": 0, "b": 8, "w": 0.19476968267614958}, {"a": 0, "b": 9, "w": 0.17264581106609334}, {"a": 0, "b": 10, "w": 0.16555208519050357}, {"a": 0, "b": 11, "w": 0.10704606079183476}, {"a": 0, "b": 12, "w": 0.13341723826101726}, {"a": 0, "b": 13, "w": 0.10992833097696064}, {"a": 0, "b": 14, "w": 0.18385201859541866}, {"a": 0, "b": 15, "w": 0.06950525211246705}, {"a": 0, "b": 16, "w": 0.1699926027806804}, {"a": 0, "b": 17, "w": 7.362621623485666e-11}, {"a": 0, "b": 18, "w": 0.1449761689300315}, {"a": 0, "b": 19, "w": 0.14191108626521387}, {"a": 0, "b": 20, "w": 0.007103772324284385}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-2.048,hiY=-1.522;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
