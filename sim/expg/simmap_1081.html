<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Tripping Jumping [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.074, "c": "種", "n": "Tripping Jumping [A]  n=1962 cos1.00 難-0.07", "s": 0.561, "f": 0}, {"x": 0.997, "y": 0.132, "c": "近傍", "n": "Shamshir [A]  n=1506 cos1.00 難0.13", "s": 0.431, "f": 0}, {"x": 0.992, "y": -0.012, "c": "近傍", "n": "Snake Stick [H]  n=3402 cos0.99 難-0.01", "s": 0.973, "f": 0}, {"x": 0.995, "y": -0.341, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3315 cos0.99 難-0.34", "s": 0.948, "f": 0}, {"x": 0.99, "y": 0.076, "c": "近傍", "n": "A Certified Rave Moment [A]  n=1119 cos0.99 難0.08", "s": 0.32, "f": 0}, {"x": 0.987, "y": -0.071, "c": "近傍", "n": "Non Stop Rock [A]  n=2195 cos0.99 難-0.07", "s": 0.628, "f": 0}, {"x": 0.986, "y": -0.17, "c": "近傍", "n": "Vibing! Shake it! [A]  n=1364 cos0.99 難-0.17", "s": 0.39, "f": 0}, {"x": 0.985, "y": -0.065, "c": "近傍", "n": "NO LIMIT -オレ達に限界は無い- [A]  n=3117 cos0.98 難-0.07", "s": 0.892, "f": 0}, {"x": 0.984, "y": 0.048, "c": "近傍", "n": "Feedback [A]  n=2741 cos0.98 難0.05", "s": 0.784, "f": 0}, {"x": 0.983, "y": -0.075, "c": "近傍", "n": "P.O.W.E.R. [A]  n=2494 cos0.98 難-0.08", "s": 0.714, "f": 0}, {"x": 0.983, "y": -0.022, "c": "近傍", "n": "Midnight Drive [A]  n=2325 cos0.98 難-0.02", "s": 0.665, "f": 0}, {"x": 0.983, "y": -0.254, "c": "近傍", "n": "Lift Us High [A]  n=2436 cos0.98 難-0.25", "s": 0.697, "f": 0}, {"x": 0.983, "y": -0.249, "c": "近傍", "n": "MENTAL MELTDOWN [H]  n=2510 cos0.98 難-0.25", "s": 0.718, "f": 0}, {"x": 0.982, "y": -0.215, "c": "近傍", "n": "MAD ATTACK [A]  n=2731 cos0.98 難-0.21", "s": 0.781, "f": 0}, {"x": 0.981, "y": 0.026, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2162 cos0.98 難0.03", "s": 0.619, "f": 0}, {"x": 0.981, "y": -0.0, "c": "近傍", "n": "Central Station [A]  n=2872 cos0.98 難-0.00", "s": 0.822, "f": 0}, {"x": 0.994, "y": 0.459, "c": "近傍", "n": "27th style [A]  n=2977 cos0.99 難0.46", "s": 0.852, "f": 0}, {"x": 0.981, "y": -0.129, "c": "近傍", "n": "SOLID STATE SQUAD [H]  n=2670 cos0.98 難-0.13", "s": 0.764, "f": 0}, {"x": 0.981, "y": -0.177, "c": "近傍", "n": "Frisk And Squeak [A]  n=1804 cos0.98 難-0.18", "s": 0.516, "f": 0}, {"x": 0.982, "y": 0.114, "c": "近傍", "n": "Honey Trap [A]  n=3495 cos0.98 難0.11", "s": 1.0, "f": 0}, {"x": 0.98, "y": -0.063, "c": "近傍", "n": "Music is The Answer [A]  n=3019 cos0.98 難-0.06", "s": 0.864, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6806347100115016}, {"a": 0, "b": 2, "w": 0.5073743833656454}, {"a": 0, "b": 3, "w": 0.6069902983371013}, {"a": 0, "b": 4, "w": 0.21909733135869036}, {"a": 0, "b": 5, "w": 0.35314308294793983}, {"a": 0, "b": 6, "w": 0.34994920660570406}, {"a": 0, "b": 7, "w": 0.3318301242291857}, {"a": 0, "b": 8, "w": 0.1875916088395696}, {"a": 0, "b": 9, "w": 0.28739625839194816}, {"a": 0, "b": 10, "w": 0.2727886164828679}, {"a": 0, "b": 11, "w": 0.26943876549761214}, {"a": 0, "b": 12, "w": 0.23470376270778082}, {"a": 0, "b": 13, "w": 0.22701308722339197}, {"a": 0, "b": 14, "w": 0.24601548714729304}, {"a": 0, "b": 15, "w": 0.2619350210589432}, {"a": 0, "b": 16, "w": 0.5281068787016592}, {"a": 0, "b": 17, "w": 0.23440825249317754}, {"a": 0, "b": 18, "w": 0.22470458764525014}, {"a": 0, "b": 19, "w": 0.2275164086239716}, {"a": 0, "b": 20, "w": 3.254296832011505e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.405,hiY=0.523;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
