<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Midnight Drive [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.022, "c": "種", "n": "Midnight Drive [A]  n=2325 cos1.00 難-0.02", "s": 0.603, "f": 0}, {"x": 0.992, "y": 0.132, "c": "近傍", "n": "Shamshir [A]  n=1506 cos0.99 難0.13", "s": 0.39, "f": 0}, {"x": 0.987, "y": 0.043, "c": "近傍", "n": "Skratch Education Lv-1 [H]  n=713 cos0.99 難0.04", "s": 0.185, "f": 0}, {"x": 0.992, "y": -0.301, "c": "近傍", "n": "HEARTACHE [A]  n=2639 cos0.99 難-0.30", "s": 0.684, "f": 0}, {"x": 0.984, "y": -0.012, "c": "近傍", "n": "Snake Stick [H]  n=3402 cos0.98 難-0.01", "s": 0.882, "f": 0}, {"x": 0.984, "y": 0.082, "c": "近傍", "n": "BLACK.by X-Cross Fade [H]  n=3718 cos0.98 難0.08", "s": 0.964, "f": 0}, {"x": 0.983, "y": 0.003, "c": "近傍", "n": "灼熱Beach Side Bunny [H]  n=3857 cos0.98 難0.00", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.074, "c": "近傍", "n": "Tripping Jumping [A]  n=1962 cos0.98 難-0.07", "s": 0.509, "f": 0}, {"x": 0.983, "y": 0.026, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2162 cos0.98 難0.03", "s": 0.561, "f": 0}, {"x": 0.988, "y": 0.318, "c": "近傍", "n": "Watch out!! [A]  n=3269 cos0.99 難0.32", "s": 0.848, "f": 0}, {"x": 0.983, "y": -0.13, "c": "近傍", "n": "Buffalo [A]  n=2617 cos0.98 難-0.13", "s": 0.679, "f": 0}, {"x": 0.984, "y": -0.249, "c": "近傍", "n": "Somebody Like You [A]  n=1178 cos0.98 難-0.25", "s": 0.305, "f": 0}, {"x": 0.981, "y": -0.058, "c": "近傍", "n": "オレはビートマニア！お前は何マニア？ [A]  n=2864 cos0.98 難-0.06", "s": 0.743, "f": 0}, {"x": 0.986, "y": -0.321, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [H]  n=1807 cos0.99 難-0.32", "s": 0.468, "f": 0}, {"x": 0.982, "y": -0.215, "c": "近傍", "n": "Plan 8 [H]  n=3479 cos0.98 難-0.22", "s": 0.902, "f": 0}, {"x": 0.986, "y": 0.32, "c": "近傍", "n": "Halfway of promise [A]  n=3449 cos0.99 難0.32", "s": 0.894, "f": 0}, {"x": 0.98, "y": -0.041, "c": "近傍", "n": "Red. by Jack Trance [H]  n=2972 cos0.98 難-0.04", "s": 0.771, "f": 0}, {"x": 0.982, "y": 0.226, "c": "近傍", "n": "bass 2 bass [A]  n=3769 cos0.98 難0.23", "s": 0.977, "f": 0}, {"x": 0.991, "y": -0.491, "c": "近傍", "n": "灼熱 Lost Summer Dayz [H]  n=1447 cos0.99 難-0.49", "s": 0.375, "f": 0}, {"x": 0.983, "y": -0.351, "c": "近傍", "n": "Lords Of The Roundtable [H]  n=2282 cos0.98 難-0.35", "s": 0.592, "f": 0}, {"x": 0.979, "y": 0.09, "c": "近傍", "n": "Really Love [A]  n=3145 cos0.98 難0.09", "s": 0.815, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39427509292168994}, {"a": 0, "b": 2, "w": 0.194045331225414}, {"a": 0, "b": 3, "w": 0.39419978070135375}, {"a": 0, "b": 4, "w": 0.1594306351959872}, {"a": 0, "b": 5, "w": 0.059915124366779704}, {"a": 0, "b": 6, "w": 0.09973646966014038}, {"a": 0, "b": 7, "w": 0.08639001652610445}, {"a": 0, "b": 8, "w": 0.15858448471892406}, {"a": 0, "b": 9, "w": 0.3125981379874233}, {"a": 0, "b": 10, "w": 0.08318318527694402}, {"a": 0, "b": 11, "w": 0.19843495597488048}, {"a": 0, "b": 12, "w": 0.015854663453580553}, {"a": 0, "b": 13, "w": 0.21017211732548813}, {"a": 0, "b": 14, "w": 0.12861705665164114}, {"a": 0, "b": 15, "w": 0.2263495079139557}, {"a": 0, "b": 16, "w": 0.047360417221556705}, {"a": 0, "b": 17, "w": 0.08847637346190629}, {"a": 0, "b": 18, "w": 0.3839909351532812}, {"a": 0, "b": 19, "w": 0.17510110719563088}, {"a": 0, "b": 20, "w": 4.088440697103124e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.977,hiX=1.002,loY=-0.556,hiY=0.385;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
