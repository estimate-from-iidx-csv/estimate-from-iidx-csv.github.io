<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">yellow head joe [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.049, "c": "種", "n": "yellow head joe [A]  n=3285 cos1.00 難-0.05", "s": 0.879, "f": 0}, {"x": 0.996, "y": -0.058, "c": "近傍", "n": "Phoenix [A]  n=3105 cos1.00 難-0.06", "s": 0.831, "f": 0}, {"x": 0.995, "y": -0.106, "c": "近傍", "n": "As You Want [A]  n=1913 cos1.00 難-0.11", "s": 0.512, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos0.99 難0.01", "s": 0.693, "f": 0}, {"x": 0.998, "y": 0.133, "c": "近傍", "n": "Lost Souls [A]  n=2604 cos1.00 難0.13", "s": 0.697, "f": 0}, {"x": 0.996, "y": 0.116, "c": "近傍", "n": "RED ZONE [A]  n=3736 cos1.00 難0.12", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.115, "c": "近傍", "n": "GENOCIDE [H]  n=2571 cos1.00 難0.11", "s": 0.688, "f": 0}, {"x": 0.994, "y": 0.059, "c": "近傍", "n": "Sphere [A]  n=2890 cos0.99 難0.06", "s": 0.774, "f": 0}, {"x": 0.996, "y": -0.227, "c": "近傍", "n": "Xepher [H]  n=3254 cos1.00 難-0.23", "s": 0.871, "f": 0}, {"x": 0.994, "y": -0.132, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1357 cos0.99 難-0.13", "s": 0.363, "f": 0}, {"x": 0.993, "y": -0.048, "c": "近傍", "n": "Hat Surprise [A]  n=2359 cos0.99 難-0.05", "s": 0.631, "f": 0}, {"x": 0.994, "y": -0.197, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2546 cos0.99 難-0.20", "s": 0.681, "f": 0}, {"x": 0.994, "y": 0.075, "c": "近傍", "n": "Raspberry Potion (feat.あれたん & ぎゃるのしん☆) [A]  n=1546 cos0.99 難0.08", "s": 0.414, "f": 0}, {"x": 0.992, "y": -0.071, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3044 cos0.99 難-0.07", "s": 0.815, "f": 0}, {"x": 0.996, "y": 0.146, "c": "近傍", "n": "Believe In Me [A]  n=3504 cos1.00 難0.15", "s": 0.938, "f": 0}, {"x": 0.993, "y": -0.134, "c": "近傍", "n": "EXE [A]  n=3022 cos0.99 難-0.13", "s": 0.809, "f": 0}, {"x": 0.996, "y": -0.249, "c": "近傍", "n": "G59 [H]  n=2932 cos1.00 難-0.25", "s": 0.785, "f": 0}, {"x": 0.992, "y": -0.004, "c": "近傍", "n": "Praludium [A]  n=2981 cos0.99 難-0.00", "s": 0.798, "f": 0}, {"x": 0.992, "y": -0.081, "c": "近傍", "n": "Good Looking [A]  n=756 cos0.99 難-0.08", "s": 0.202, "f": 0}, {"x": 0.994, "y": -0.216, "c": "近傍", "n": "弾幕信仰 [A]  n=959 cos0.99 難-0.22", "s": 0.257, "f": 0}, {"x": 0.992, "y": -0.048, "c": "近傍", "n": "KAISER PHOENIX [H]  n=2578 cos0.99 難-0.05", "s": 0.69, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.41735633153425833}, {"a": 0, "b": 2, "w": 0.3833868672658348}, {"a": 0, "b": 3, "w": 0.27224297952661414}, {"a": 0, "b": 4, "w": 0.5858317265297387}, {"a": 0, "b": 5, "w": 0.41590143947334157}, {"a": 0, "b": 6, "w": 0.35965783132860296}, {"a": 0, "b": 7, "w": 0.3113081135364957}, {"a": 0, "b": 8, "w": 0.37192187553188816}, {"a": 0, "b": 9, "w": 0.2317849879416537}, {"a": 0, "b": 10, "w": 0.24487788296612134}, {"a": 0, "b": 11, "w": 0.33364010899918994}, {"a": 0, "b": 12, "w": 0.26609722678513703}, {"a": 0, "b": 13, "w": 0.2345286420450452}, {"a": 0, "b": 14, "w": 0.4128319156916943}, {"a": 0, "b": 15, "w": 5.340883291182763e-11}, {"a": 0, "b": 16, "w": 0.370735759208885}, {"a": 0, "b": 17, "w": 0.1337141465500502}, {"a": 0, "b": 18, "w": 0.21236998415454278}, {"a": 0, "b": 19, "w": 0.3294971936101758}, {"a": 0, "b": 20, "w": 0.20657523835065605}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.281,hiY=0.177;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
