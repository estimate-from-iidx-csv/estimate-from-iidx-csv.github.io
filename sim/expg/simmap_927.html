<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">madrugada [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.155, "c": "種", "n": "madrugada [A]  n=2176 cos1.00 難-0.15", "s": 0.622, "f": 0}, {"x": 0.996, "y": 0.003, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3097 cos1.00 難0.00", "s": 0.885, "f": 0}, {"x": 0.994, "y": -0.088, "c": "近傍", "n": "Freeway Shuffle [A]  n=2923 cos0.99 難-0.09", "s": 0.835, "f": 0}, {"x": 0.994, "y": -0.006, "c": "近傍", "n": "Votum stellarum [A]  n=2862 cos0.99 難-0.01", "s": 0.818, "f": 0}, {"x": 0.994, "y": -0.335, "c": "近傍", "n": "thunder [A]  n=2858 cos0.99 難-0.33", "s": 0.817, "f": 0}, {"x": 0.992, "y": -0.121, "c": "近傍", "n": "2hot2eat [A]  n=1063 cos0.99 難-0.12", "s": 0.304, "f": 0}, {"x": 0.992, "y": -0.007, "c": "近傍", "n": "Karma [A]  n=2666 cos0.99 難-0.01", "s": 0.762, "f": 0}, {"x": 0.992, "y": -0.25, "c": "近傍", "n": "take me higher [A]  n=2122 cos0.99 難-0.25", "s": 0.606, "f": 0}, {"x": 0.992, "y": -0.267, "c": "近傍", "n": "!Viva! [A]  n=3296 cos0.99 難-0.27", "s": 0.942, "f": 0}, {"x": 0.992, "y": -0.007, "c": "近傍", "n": "Nowhere [A]  n=2747 cos0.99 難-0.01", "s": 0.785, "f": 0}, {"x": 0.991, "y": -0.105, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2953 cos0.99 難-0.10", "s": 0.844, "f": 0}, {"x": 0.991, "y": -0.048, "c": "近傍", "n": "Scripted Connection⇒ N mix [A]  n=2798 cos0.99 難-0.05", "s": 0.8, "f": 0}, {"x": 0.99, "y": -0.123, "c": "近傍", "n": "罪と罰 [A]  n=3499 cos0.99 難-0.12", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.376, "c": "近傍", "n": "陽炎 [A]  n=2846 cos0.99 難-0.38", "s": 0.813, "f": 0}, {"x": 0.993, "y": 0.157, "c": "近傍", "n": "Real [A]  n=2334 cos0.99 難0.16", "s": 0.667, "f": 0}, {"x": 0.99, "y": -0.193, "c": "近傍", "n": "That Feeling [A]  n=2072 cos0.99 難-0.19", "s": 0.592, "f": 0}, {"x": 0.99, "y": -0.304, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2070 cos0.99 難-0.30", "s": 0.592, "f": 0}, {"x": 0.992, "y": -0.441, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1729 cos0.99 難-0.44", "s": 0.494, "f": 0}, {"x": 0.991, "y": -0.396, "c": "近傍", "n": "quell～the seventh slave～ [H]  n=2522 cos0.99 難-0.40", "s": 0.721, "f": 0}, {"x": 0.991, "y": -0.363, "c": "近傍", "n": "Mind Mapping [A]  n=3098 cos0.99 難-0.36", "s": 0.885, "f": 0}, {"x": 0.99, "y": -0.275, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2240 cos0.99 難-0.27", "s": 0.64, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48619455500636777}, {"a": 0, "b": 2, "w": 0.42109569477530495}, {"a": 0, "b": 3, "w": 0.34105670305659086}, {"a": 0, "b": 4, "w": 0.4271659431922571}, {"a": 0, "b": 5, "w": 0.3422054738379243}, {"a": 0, "b": 6, "w": 0.37800995452324326}, {"a": 0, "b": 7, "w": 0.29706975178736006}, {"a": 0, "b": 8, "w": 0.30551880713289137}, {"a": 0, "b": 9, "w": 0.24392232936019953}, {"a": 0, "b": 10, "w": 0.1537563370060835}, {"a": 0, "b": 11, "w": 5.272837722003487e-11}, {"a": 0, "b": 12, "w": 0.23355406395222555}, {"a": 0, "b": 13, "w": 0.28455223771286}, {"a": 0, "b": 14, "w": 0.40399348829709003}, {"a": 0, "b": 15, "w": 0.16900455661497693}, {"a": 0, "b": 16, "w": 0.3123449484743748}, {"a": 0, "b": 17, "w": 0.2950311838392833}, {"a": 0, "b": 18, "w": 0.3457344343448331}, {"a": 0, "b": 19, "w": 0.32510115387232963}, {"a": 0, "b": 20, "w": 0.28509710155056167}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.489,hiY=0.205;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
