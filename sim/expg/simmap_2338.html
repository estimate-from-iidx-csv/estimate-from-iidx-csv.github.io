<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">泰東ノ翠霞 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.317, "c": "種", "n": "泰東ノ翠霞 [A]  n=2900 cos1.00 難0.32", "s": 0.784, "f": 0}, {"x": 0.991, "y": 0.026, "c": "近傍", "n": "Love Magic [A]  n=2550 cos0.99 難0.03", "s": 0.689, "f": 0}, {"x": 0.989, "y": 0.492, "c": "近傍", "n": "FAKE TIME [H]  n=3043 cos0.99 難0.49", "s": 0.822, "f": 0}, {"x": 0.994, "y": -0.076, "c": "近傍", "n": "Narcissus At Oasis [H]  n=2411 cos0.99 難-0.08", "s": 0.652, "f": 0}, {"x": 0.987, "y": 0.201, "c": "近傍", "n": "TRIP MACHINE PhoeniX [A]  n=1785 cos0.99 難0.20", "s": 0.482, "f": 0}, {"x": 0.99, "y": -0.007, "c": "近傍", "n": "Karma [A]  n=2666 cos0.99 難-0.01", "s": 0.721, "f": 0}, {"x": 0.994, "y": -0.126, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [H]  n=2288 cos0.99 難-0.13", "s": 0.618, "f": 0}, {"x": 0.991, "y": -0.106, "c": "近傍", "n": "Broken My Heart [A]  n=2210 cos0.99 難-0.11", "s": 0.597, "f": 0}, {"x": 0.985, "y": 0.215, "c": "近傍", "n": "R5 [A]  n=3700 cos0.98 難0.22", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.103, "c": "近傍", "n": "STEEL NEEDLE [H]  n=2602 cos0.99 難-0.10", "s": 0.703, "f": 0}, {"x": 0.984, "y": 0.411, "c": "近傍", "n": "Engraved Mark [A]  n=3412 cos0.98 難0.41", "s": 0.922, "f": 0}, {"x": 0.991, "y": -0.133, "c": "近傍", "n": "Infinite cave [A]  n=3073 cos0.99 難-0.13", "s": 0.831, "f": 0}, {"x": 0.99, "y": -0.125, "c": "近傍", "n": "ヒマワリ [A]  n=3294 cos0.99 難-0.12", "s": 0.89, "f": 0}, {"x": 0.986, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos0.99 難0.01", "s": 0.977, "f": 0}, {"x": 0.988, "y": -0.105, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2071 cos0.99 難-0.11", "s": 0.56, "f": 0}, {"x": 0.986, "y": -0.022, "c": "近傍", "n": "QQQ [A]  n=2891 cos0.99 難-0.02", "s": 0.781, "f": 0}, {"x": 0.982, "y": 0.311, "c": "近傍", "n": "Evans [H]  n=3517 cos0.98 難0.31", "s": 0.951, "f": 0}, {"x": 0.983, "y": 0.207, "c": "近傍", "n": "THE DOOR INTO RAINBOW [A]  n=2783 cos0.98 難0.21", "s": 0.752, "f": 0}, {"x": 0.986, "y": -0.057, "c": "近傍", "n": "VIBRΛ [A]  n=2518 cos0.99 難-0.06", "s": 0.681, "f": 0}, {"x": 0.988, "y": -0.151, "c": "近傍", "n": "Under the Sky [A]  n=2610 cos0.99 難-0.15", "s": 0.705, "f": 0}, {"x": 0.985, "y": -0.071, "c": "近傍", "n": "Chemical Cookie [A]  n=3318 cos0.99 難-0.07", "s": 0.897, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3418913107078596}, {"a": 0, "b": 2, "w": 0.2916961214541508}, {"a": 0, "b": 3, "w": 0.32376407605103186}, {"a": 0, "b": 4, "w": 0.2232167088005318}, {"a": 0, "b": 5, "w": 0.3331275436236484}, {"a": 0, "b": 6, "w": 0.4366519531348474}, {"a": 0, "b": 7, "w": 0.33691096656543806}, {"a": 0, "b": 8, "w": 0.16129998789462408}, {"a": 0, "b": 9, "w": 0.3159904698640017}, {"a": 0, "b": 10, "w": 0.04092711432196772}, {"a": 0, "b": 11, "w": 0.36786988685266253}, {"a": 0, "b": 12, "w": 0.31372874945221996}, {"a": 0, "b": 13, "w": 0.21333422965127802}, {"a": 0, "b": 14, "w": 0.26605760991788874}, {"a": 0, "b": 15, "w": 0.21793294127929874}, {"a": 0, "b": 16, "w": 4.640510198328229e-11}, {"a": 0, "b": 17, "w": 0.11619150462458394}, {"a": 0, "b": 18, "w": 0.21865632504790578}, {"a": 0, "b": 19, "w": 0.19732925161476422}, {"a": 0, "b": 20, "w": 0.1746576862651229}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-0.203,hiY=0.543;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
