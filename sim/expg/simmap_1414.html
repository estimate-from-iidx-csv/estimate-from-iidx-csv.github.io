<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LIVE DRIVING!! feat. 花たん [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.112, "c": "種", "n": "LIVE DRIVING!! feat. 花たん [H]  n=1704 cos1.00 難-1.11", "s": 0.678, "f": 0}, {"x": 0.996, "y": -1.105, "c": "近傍", "n": "UNITE THE HEART [H]  n=1712 cos1.00 難-1.11", "s": 0.681, "f": 0}, {"x": 0.994, "y": -1.109, "c": "近傍", "n": "Rave Patroller [H]  n=1626 cos0.99 難-1.11", "s": 0.647, "f": 0}, {"x": 0.994, "y": -0.937, "c": "近傍", "n": "Rampage [H]  n=2513 cos0.99 難-0.94", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.298, "c": "近傍", "n": "RINNE [H]  n=1078 cos0.99 難-1.30", "s": 0.429, "f": 0}, {"x": 0.992, "y": -0.983, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [H]  n=1094 cos0.99 難-0.98", "s": 0.435, "f": 0}, {"x": 0.99, "y": -1.024, "c": "近傍", "n": "スキッテイエェエエェ!!!! [H]  n=676 cos0.99 難-1.02", "s": 0.269, "f": 0}, {"x": 0.997, "y": -0.733, "c": "近傍", "n": "恋愛観測 [A]  n=630 cos1.00 難-0.73", "s": 0.251, "f": 0}, {"x": 0.993, "y": -0.8, "c": "近傍", "n": "DARK LEGACY [H]  n=2280 cos0.99 難-0.80", "s": 0.907, "f": 0}, {"x": 0.99, "y": -1.169, "c": "近傍", "n": "Dans la nuit de l'eternite [H]  n=1505 cos0.99 難-1.17", "s": 0.599, "f": 0}, {"x": 0.99, "y": -1.11, "c": "近傍", "n": "AKASHIC BREAK [H]  n=1717 cos0.99 難-1.11", "s": 0.683, "f": 0}, {"x": 0.989, "y": -1.167, "c": "近傍", "n": "RIZING YOU UP [H]  n=1819 cos0.99 難-1.17", "s": 0.724, "f": 0}, {"x": 0.99, "y": -1.243, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1189 cos0.99 難-1.24", "s": 0.473, "f": 0}, {"x": 0.989, "y": -1.023, "c": "近傍", "n": "Smashing Wedge [H]  n=1615 cos0.99 難-1.02", "s": 0.643, "f": 0}, {"x": 0.989, "y": -0.953, "c": "近傍", "n": "Empire of Fury [H]  n=1651 cos0.99 難-0.95", "s": 0.657, "f": 0}, {"x": 0.989, "y": -0.973, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1679 cos0.99 難-0.97", "s": 0.668, "f": 0}, {"x": 0.99, "y": -0.818, "c": "近傍", "n": "レシピのリドル [A]  n=720 cos0.99 難-0.82", "s": 0.287, "f": 0}, {"x": 0.987, "y": -1.0, "c": "近傍", "n": "HYPE THE CORE [H]  n=1566 cos0.99 難-1.00", "s": 0.623, "f": 0}, {"x": 0.996, "y": -0.625, "c": "近傍", "n": "ALTERNATOR [H]  n=1701 cos1.00 難-0.63", "s": 0.677, "f": 0}, {"x": 0.988, "y": -0.867, "c": "近傍", "n": "MOON [H]  n=1887 cos0.99 難-0.87", "s": 0.751, "f": 0}, {"x": 0.989, "y": -1.409, "c": "近傍", "n": "電腦都市 [H]  n=646 cos0.99 難-1.41", "s": 0.257, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5479867201093953}, {"a": 0, "b": 2, "w": 0.2561766047479258}, {"a": 0, "b": 3, "w": 0.4724724553030917}, {"a": 0, "b": 4, "w": 0.4304597396254608}, {"a": 0, "b": 5, "w": 0.3902972166313954}, {"a": 0, "b": 6, "w": 0.2802352261477463}, {"a": 0, "b": 7, "w": 0.5428197894020881}, {"a": 0, "b": 8, "w": 0.4391647471489142}, {"a": 0, "b": 9, "w": 0.2959517059721204}, {"a": 0, "b": 10, "w": 0.24655892833311865}, {"a": 0, "b": 11, "w": 0.1901387784227675}, {"a": 0, "b": 12, "w": 0.295507050837423}, {"a": 0, "b": 13, "w": 0.27939241895894973}, {"a": 0, "b": 14, "w": 0.23392207258968167}, {"a": 0, "b": 15, "w": 0.27574616335464286}, {"a": 0, "b": 16, "w": 0.22784535811869622}, {"a": 0, "b": 17, "w": 0.1137026355871753}, {"a": 0, "b": 18, "w": 0.5122026496883945}, {"a": 0, "b": 19, "w": 4.680866805273354e-11}, {"a": 0, "b": 20, "w": 0.2600270085788624}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.471,hiY=-0.563;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
