<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vermilion [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.133, "c": "種", "n": "Vermilion [A]  n=3037 cos1.00 難-0.13", "s": 0.91, "f": 0}, {"x": 0.997, "y": -0.054, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2903 cos1.00 難-0.05", "s": 0.87, "f": 0}, {"x": 0.996, "y": -0.064, "c": "近傍", "n": "子供の落書き帳 [H]  n=2783 cos1.00 難-0.06", "s": 0.834, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "Vermillion [A]  n=2891 cos1.00 難-0.08", "s": 0.867, "f": 0}, {"x": 0.995, "y": -0.131, "c": "近傍", "n": "メイメツ、フラグメンツ [A]  n=3202 cos0.99 難-0.13", "s": 0.96, "f": 0}, {"x": 0.995, "y": -0.184, "c": "近傍", "n": "Devilz Staircase [H]  n=2862 cos0.99 難-0.18", "s": 0.858, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2845 cos0.99 難-0.08", "s": 0.853, "f": 0}, {"x": 0.996, "y": -0.342, "c": "近傍", "n": "ZZ [H]  n=3336 cos1.00 難-0.34", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos0.99 難-0.11", "s": 0.888, "f": 0}, {"x": 0.994, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos0.99 難-0.11", "s": 0.972, "f": 0}, {"x": 0.994, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos0.99 難0.01", "s": 0.776, "f": 0}, {"x": 0.994, "y": -0.278, "c": "近傍", "n": "煉獄のエルフェリア [H]  n=3105 cos0.99 難-0.28", "s": 0.931, "f": 0}, {"x": 0.994, "y": -0.007, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2765 cos0.99 難-0.01", "s": 0.829, "f": 0}, {"x": 0.994, "y": -0.004, "c": "近傍", "n": "Praludium [A]  n=2981 cos0.99 難-0.00", "s": 0.894, "f": 0}, {"x": 0.993, "y": -0.048, "c": "近傍", "n": "Back Into The Light [A]  n=3041 cos0.99 難-0.05", "s": 0.912, "f": 0}, {"x": 0.993, "y": -0.134, "c": "近傍", "n": "Hard Breaker [A]  n=1311 cos0.99 難-0.13", "s": 0.393, "f": 0}, {"x": 0.993, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3206 cos0.99 難-0.18", "s": 0.961, "f": 0}, {"x": 0.993, "y": -0.227, "c": "近傍", "n": "Xepher [H]  n=3254 cos0.99 難-0.23", "s": 0.975, "f": 0}, {"x": 0.994, "y": 0.001, "c": "近傍", "n": "Chain of pain [A]  n=2991 cos0.99 難0.00", "s": 0.897, "f": 0}, {"x": 0.993, "y": -0.183, "c": "近傍", "n": "fffff [H]  n=3217 cos0.99 難-0.18", "s": 0.964, "f": 0}, {"x": 0.993, "y": -0.048, "c": "近傍", "n": "KAISER PHOENIX [H]  n=2578 cos0.99 難-0.05", "s": 0.773, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6268071855156636}, {"a": 0, "b": 2, "w": 0.45833175094770706}, {"a": 0, "b": 3, "w": 0.4184973771004641}, {"a": 0, "b": 4, "w": 0.41117423528823716}, {"a": 0, "b": 5, "w": 0.34295428814815776}, {"a": 0, "b": 6, "w": 0.43106525801297924}, {"a": 0, "b": 7, "w": 0.5275309137555262}, {"a": 0, "b": 8, "w": 0.41637695701015554}, {"a": 0, "b": 9, "w": 0.4400408040230618}, {"a": 0, "b": 10, "w": 0.3992575960997641}, {"a": 0, "b": 11, "w": 0.2993907973196499}, {"a": 0, "b": 12, "w": 0.4494913100915916}, {"a": 0, "b": 13, "w": 0.40326334244876094}, {"a": 0, "b": 14, "w": 0.3401537141864389}, {"a": 0, "b": 15, "w": 4.957678712003144e-11}, {"a": 0, "b": 16, "w": 0.4165488259688478}, {"a": 0, "b": 17, "w": 0.32620506529911986}, {"a": 0, "b": 18, "w": 0.3737784171168088}, {"a": 0, "b": 19, "w": 0.3679079709122256}, {"a": 0, "b": 20, "w": 0.2607228913631223}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.370,hiY=0.037;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
