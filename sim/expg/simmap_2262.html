<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">とろぴかる倶楽部 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.643, "c": "種", "n": "とろぴかる倶楽部 [A]  n=3231 cos1.00 難0.64", "s": 0.937, "f": 0}, {"x": 0.99, "y": 0.681, "c": "近傍", "n": "Sense 2007 [H]  n=3332 cos0.99 難0.68", "s": 0.967, "f": 0}, {"x": 0.993, "y": 0.926, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3241 cos0.99 難0.93", "s": 0.94, "f": 0}, {"x": 0.989, "y": 0.729, "c": "近傍", "n": "EXODUS SIGN [A]  n=1738 cos0.99 難0.73", "s": 0.504, "f": 0}, {"x": 0.99, "y": 0.836, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1744 cos0.99 難0.84", "s": 0.506, "f": 0}, {"x": 0.991, "y": 0.398, "c": "近傍", "n": "Catch Me [L]  n=731 cos0.99 難0.40", "s": 0.212, "f": 0}, {"x": 0.993, "y": 0.219, "c": "近傍", "n": "rottel-da-sun [A]  n=2915 cos0.99 難0.22", "s": 0.846, "f": 0}, {"x": 0.986, "y": 0.603, "c": "近傍", "n": "Game Changers [A]  n=1981 cos0.99 難0.60", "s": 0.575, "f": 0}, {"x": 0.986, "y": 0.83, "c": "近傍", "n": "Routing [A]  n=3447 cos0.99 難0.83", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.291, "c": "近傍", "n": "MVP [A]  n=1418 cos0.99 難0.29", "s": 0.411, "f": 0}, {"x": 0.984, "y": 0.459, "c": "近傍", "n": "27th style [A]  n=2977 cos0.98 難0.46", "s": 0.864, "f": 0}, {"x": 0.985, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.98 難0.91", "s": 0.984, "f": 0}, {"x": 0.983, "y": 0.49, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2974 cos0.98 難0.49", "s": 0.863, "f": 0}, {"x": 0.983, "y": 0.784, "c": "近傍", "n": "Psycho Sheep Riddim [L]  n=1868 cos0.98 難0.78", "s": 0.542, "f": 0}, {"x": 0.988, "y": 1.106, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3283 cos0.99 難1.11", "s": 0.952, "f": 0}, {"x": 0.982, "y": 0.566, "c": "近傍", "n": "With You [A]  n=2136 cos0.98 難0.57", "s": 0.62, "f": 0}, {"x": 0.986, "y": 0.212, "c": "近傍", "n": "WAR GAME [A]  n=3042 cos0.99 難0.21", "s": 0.883, "f": 0}, {"x": 0.983, "y": 0.931, "c": "近傍", "n": "T.R.O.L.L. [A]  n=1092 cos0.98 難0.93", "s": 0.317, "f": 0}, {"x": 0.982, "y": 0.46, "c": "近傍", "n": "CODE:0 [A]  n=2877 cos0.98 難0.46", "s": 0.835, "f": 0}, {"x": 0.981, "y": 0.702, "c": "近傍", "n": "FREEDOM [A]  n=3256 cos0.98 難0.70", "s": 0.945, "f": 0}, {"x": 0.989, "y": 1.18, "c": "近傍", "n": "GAME ON [A]  n=1834 cos0.99 難1.18", "s": 0.532, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3940130807060901}, {"a": 0, "b": 2, "w": 0.4786583345318688}, {"a": 0, "b": 3, "w": 0.3019330579683477}, {"a": 0, "b": 4, "w": 0.23941713285559996}, {"a": 0, "b": 5, "w": 0.410465126092484}, {"a": 0, "b": 6, "w": 0.366464190803389}, {"a": 0, "b": 7, "w": 0.26164884222274154}, {"a": 0, "b": 8, "w": 0.18462153048329355}, {"a": 0, "b": 9, "w": 0.3009424884098161}, {"a": 0, "b": 10, "w": 0.20413290248396343}, {"a": 0, "b": 11, "w": 0.22609872653243002}, {"a": 0, "b": 12, "w": 0.10480275819550866}, {"a": 0, "b": 13, "w": 0.18581794101597204}, {"a": 0, "b": 14, "w": 0.12025429233437246}, {"a": 0, "b": 15, "w": 0.1618949235559829}, {"a": 0, "b": 16, "w": 0.19418778923627}, {"a": 0, "b": 17, "w": 0.13966971724755828}, {"a": 0, "b": 18, "w": 0.13744448137816057}, {"a": 0, "b": 19, "w": 0.05539298903795975}, {"a": 0, "b": 20, "w": 3.6189828911403765e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=0.135,hiY=1.258;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
