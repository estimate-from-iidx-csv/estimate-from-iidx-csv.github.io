<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">XENON II ～TOMOYUKIの野望～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.915, "c": "種", "n": "XENON II ～TOMOYUKIの野望～ [H]  n=1587 cos1.00 難-0.92", "s": 0.644, "f": 0}, {"x": 0.996, "y": -0.878, "c": "近傍", "n": "xenon [H]  n=2369 cos1.00 難-0.88", "s": 0.961, "f": 0}, {"x": 0.994, "y": -0.886, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1987 cos0.99 難-0.89", "s": 0.806, "f": 0}, {"x": 0.994, "y": -0.862, "c": "近傍", "n": "Votum stellarum [H]  n=1927 cos0.99 難-0.86", "s": 0.782, "f": 0}, {"x": 0.994, "y": -0.995, "c": "近傍", "n": "UMMU [H]  n=2416 cos0.99 難-0.99", "s": 0.981, "f": 0}, {"x": 0.993, "y": -0.955, "c": "近傍", "n": "君のハートにロックオン [H]  n=2143 cos0.99 難-0.95", "s": 0.87, "f": 0}, {"x": 0.993, "y": -0.851, "c": "近傍", "n": "Giudecca [H]  n=1654 cos0.99 難-0.85", "s": 0.671, "f": 0}, {"x": 0.992, "y": -0.902, "c": "近傍", "n": "Love Is Eternity [H]  n=1794 cos0.99 難-0.90", "s": 0.728, "f": 0}, {"x": 0.992, "y": -0.956, "c": "近傍", "n": "Tiempo Loco [H]  n=1739 cos0.99 難-0.96", "s": 0.706, "f": 0}, {"x": 0.992, "y": -0.858, "c": "近傍", "n": "KAMAITACHI [H]  n=2385 cos0.99 難-0.86", "s": 0.968, "f": 0}, {"x": 0.991, "y": -0.971, "c": "近傍", "n": "Fire Beat [H]  n=943 cos0.99 難-0.97", "s": 0.383, "f": 0}, {"x": 0.996, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos1.00 難-0.74", "s": 0.833, "f": 0}, {"x": 0.99, "y": -0.862, "c": "近傍", "n": "Programmed Life [H]  n=1853 cos0.99 難-0.86", "s": 0.752, "f": 0}, {"x": 0.99, "y": -0.889, "c": "近傍", "n": "BROKEN EDEN [H]  n=2057 cos0.99 難-0.89", "s": 0.835, "f": 0}, {"x": 0.991, "y": -0.806, "c": "近傍", "n": "HYPERION [H]  n=1840 cos0.99 難-0.81", "s": 0.747, "f": 0}, {"x": 0.991, "y": -0.801, "c": "近傍", "n": "Highcharge Divolt [H]  n=2464 cos0.99 難-0.80", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.902, "c": "近傍", "n": "24th Century BOY [H]  n=2430 cos0.99 難-0.90", "s": 0.986, "f": 0}, {"x": 0.99, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos0.99 難-1.02", "s": 0.819, "f": 0}, {"x": 0.99, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.905, "f": 0}, {"x": 0.988, "y": -0.912, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [H]  n=2076 cos0.99 難-0.91", "s": 0.843, "f": 0}, {"x": 0.989, "y": -1.02, "c": "近傍", "n": "Cosmic Cat [H]  n=1849 cos0.99 難-1.02", "s": 0.75, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49246796881293464}, {"a": 0, "b": 2, "w": 0.4248259114746179}, {"a": 0, "b": 3, "w": 0.3009284415258341}, {"a": 0, "b": 4, "w": 0.2661925194216981}, {"a": 0, "b": 5, "w": 0.12779331626112755}, {"a": 0, "b": 6, "w": 0.3752790057887335}, {"a": 0, "b": 7, "w": 0.22599943335129935}, {"a": 0, "b": 8, "w": 0.3535131389510747}, {"a": 0, "b": 9, "w": 0.35491373651576985}, {"a": 0, "b": 10, "w": 0.3031457497979144}, {"a": 0, "b": 11, "w": 0.44458556731484056}, {"a": 0, "b": 12, "w": 0.27909728092775954}, {"a": 0, "b": 13, "w": 0.26325127198864195}, {"a": 0, "b": 14, "w": 0.2890490305523723}, {"a": 0, "b": 15, "w": 5.283862236638015e-11}, {"a": 0, "b": 16, "w": 0.24483353903180372}, {"a": 0, "b": 17, "w": 0.27297049215888114}, {"a": 0, "b": 18, "w": 0.18660871021564873}, {"a": 0, "b": 19, "w": 0.20565251733242085}, {"a": 0, "b": 20, "w": 0.2581948495883243}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.043,hiY=-0.719;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
