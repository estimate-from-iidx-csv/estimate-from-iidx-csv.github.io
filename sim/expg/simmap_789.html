<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Breaking the ground [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.003, "c": "種", "n": "Breaking the ground [A]  n=3217 cos1.00 難0.00", "s": 0.887, "f": 0}, {"x": 0.995, "y": 0.115, "c": "近傍", "n": "罠 [A]  n=2924 cos0.99 難0.11", "s": 0.807, "f": 0}, {"x": 0.993, "y": -0.02, "c": "近傍", "n": "BABY LOVE [A]  n=2739 cos0.99 難-0.02", "s": 0.756, "f": 0}, {"x": 0.992, "y": 0.077, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1669 cos0.99 難0.08", "s": 0.46, "f": 0}, {"x": 0.991, "y": -0.016, "c": "近傍", "n": "Wing of Hearts [A]  n=3089 cos0.99 難-0.02", "s": 0.852, "f": 0}, {"x": 0.99, "y": -0.071, "c": "近傍", "n": "Slumber☆Party [A]  n=1079 cos0.99 難-0.07", "s": 0.298, "f": 0}, {"x": 0.99, "y": -0.106, "c": "近傍", "n": "TROOPERS [H]  n=2629 cos0.99 難-0.11", "s": 0.725, "f": 0}, {"x": 0.99, "y": -0.103, "c": "近傍", "n": "Believe in you [A]  n=3058 cos0.99 難-0.10", "s": 0.844, "f": 0}, {"x": 0.991, "y": 0.177, "c": "近傍", "n": "Volcanic Dragon [A]  n=3178 cos0.99 難0.18", "s": 0.877, "f": 0}, {"x": 0.99, "y": 0.132, "c": "近傍", "n": "SigSig [A]  n=3609 cos0.99 難0.13", "s": 0.996, "f": 0}, {"x": 0.99, "y": -0.121, "c": "近傍", "n": "HIGH [A]  n=2325 cos0.99 難-0.12", "s": 0.641, "f": 0}, {"x": 0.991, "y": 0.216, "c": "近傍", "n": "No Limit 2 dAnce feat. 大山愛未 [A]  n=3295 cos0.99 難0.22", "s": 0.909, "f": 0}, {"x": 0.993, "y": 0.264, "c": "近傍", "n": "Victory Of Ravers [A]  n=2466 cos0.99 難0.26", "s": 0.68, "f": 0}, {"x": 0.989, "y": -0.134, "c": "近傍", "n": "RESISTANCE [A]  n=2736 cos0.99 難-0.13", "s": 0.755, "f": 0}, {"x": 0.993, "y": -0.284, "c": "近傍", "n": "PIT A PAT [A]  n=1535 cos0.99 難-0.28", "s": 0.423, "f": 0}, {"x": 0.988, "y": -0.048, "c": "近傍", "n": "passionate fate [A]  n=3192 cos0.99 難-0.05", "s": 0.881, "f": 0}, {"x": 0.988, "y": -0.105, "c": "近傍", "n": "Geirskogul [A]  n=2368 cos0.99 難-0.11", "s": 0.653, "f": 0}, {"x": 0.991, "y": -0.257, "c": "近傍", "n": "CROSSROAD ～Left Story～ [A]  n=3625 cos0.99 難-0.26", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.119, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3404 cos0.99 難-0.12", "s": 0.939, "f": 0}, {"x": 0.991, "y": -0.269, "c": "近傍", "n": "BLUE DRAGON(雷龍RemixIIDX) [H]  n=2839 cos0.99 難-0.27", "s": 0.783, "f": 0}, {"x": 0.988, "y": -0.084, "c": "近傍", "n": "Here We Are [A]  n=2486 cos0.99 難-0.08", "s": 0.686, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42802375874710674}, {"a": 0, "b": 2, "w": 0.09654232895367165}, {"a": 0, "b": 3, "w": 0.29450944402203993}, {"a": 0, "b": 4, "w": 0.2148331955158268}, {"a": 0, "b": 5, "w": 0.21973313023606633}, {"a": 0, "b": 6, "w": 0.23546964086623712}, {"a": 0, "b": 7, "w": 0.07365287566919865}, {"a": 0, "b": 8, "w": 0.22596030229870523}, {"a": 0, "b": 9, "w": 0.17446705700268694}, {"a": 0, "b": 10, "w": 4.8224535476038e-11}, {"a": 0, "b": 11, "w": 0.15371191247995164}, {"a": 0, "b": 12, "w": 0.2457097239749665}, {"a": 0, "b": 13, "w": 0.09592815545559474}, {"a": 0, "b": 14, "w": 0.314997842230168}, {"a": 0, "b": 15, "w": 0.06768989343922338}, {"a": 0, "b": 16, "w": 0.15344585506161224}, {"a": 0, "b": 17, "w": 0.0006790915315972867}, {"a": 0, "b": 18, "w": 0.025211474539475587}, {"a": 0, "b": 19, "w": 0.2880260731788602}, {"a": 0, "b": 20, "w": 0.10580346854021339}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.327,hiY=0.308;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
