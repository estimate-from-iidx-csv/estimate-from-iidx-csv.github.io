<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Temple of Anubis [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.42, "c": "種", "n": "Temple of Anubis [A]  n=3256 cos1.00 難0.42", "s": 0.889, "f": 0}, {"x": 0.995, "y": 0.378, "c": "近傍", "n": "Insane Techniques [A]  n=3373 cos0.99 難0.38", "s": 0.921, "f": 0}, {"x": 0.994, "y": 0.491, "c": "近傍", "n": "BREAK OVER [A]  n=3006 cos0.99 難0.49", "s": 0.82, "f": 0}, {"x": 0.994, "y": 0.457, "c": "近傍", "n": "Around the Future [A]  n=3146 cos0.99 難0.46", "s": 0.859, "f": 0}, {"x": 0.992, "y": 0.462, "c": "近傍", "n": "S!ck [A]  n=3664 cos0.99 難0.46", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.114, "c": "近傍", "n": "Honey Trap [A]  n=3495 cos0.99 難0.11", "s": 0.954, "f": 0}, {"x": 0.993, "y": 0.65, "c": "近傍", "n": "diagram [A]  n=3161 cos0.99 難0.65", "s": 0.863, "f": 0}, {"x": 0.991, "y": 0.453, "c": "近傍", "n": "Neo Heritage [A]  n=2296 cos0.99 難0.45", "s": 0.627, "f": 0}, {"x": 0.992, "y": 0.566, "c": "近傍", "n": "With You [A]  n=2136 cos0.99 難0.57", "s": 0.583, "f": 0}, {"x": 0.991, "y": 0.488, "c": "近傍", "n": "Abraxas [A]  n=3301 cos0.99 難0.49", "s": 0.901, "f": 0}, {"x": 0.992, "y": 0.294, "c": "近傍", "n": "BattleRoyal [A]  n=1032 cos0.99 難0.29", "s": 0.282, "f": 0}, {"x": 0.992, "y": 0.204, "c": "近傍", "n": "OVER VOLTAGE [A]  n=1842 cos0.99 難0.20", "s": 0.503, "f": 0}, {"x": 0.994, "y": 0.095, "c": "近傍", "n": "GRADIUS 2012 [A]  n=2995 cos0.99 難0.09", "s": 0.817, "f": 0}, {"x": 0.991, "y": 0.322, "c": "近傍", "n": "GIGA THRASH [A]  n=3153 cos0.99 難0.32", "s": 0.861, "f": 0}, {"x": 0.994, "y": 0.059, "c": "近傍", "n": "Musik LoverZ [A]  n=3115 cos0.99 難0.06", "s": 0.85, "f": 0}, {"x": 0.99, "y": 0.315, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [A]  n=3417 cos0.99 難0.31", "s": 0.933, "f": 0}, {"x": 0.991, "y": 0.212, "c": "近傍", "n": "Burning Flame [A]  n=2607 cos0.99 難0.21", "s": 0.712, "f": 0}, {"x": 0.99, "y": 0.388, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1735 cos0.99 難0.39", "s": 0.474, "f": 0}, {"x": 0.989, "y": 0.441, "c": "近傍", "n": "Red Determination [A]  n=1425 cos0.99 難0.44", "s": 0.389, "f": 0}, {"x": 0.991, "y": 0.182, "c": "近傍", "n": "MA・TSU・RI [A]  n=2106 cos0.99 難0.18", "s": 0.575, "f": 0}, {"x": 0.99, "y": 0.533, "c": "近傍", "n": "Crazy Jackpot [A]  n=2696 cos0.99 難0.53", "s": 0.736, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46994735790567566}, {"a": 0, "b": 2, "w": 0.4037652461044371}, {"a": 0, "b": 3, "w": 0.4514283772842361}, {"a": 0, "b": 4, "w": 0.28873163511260036}, {"a": 0, "b": 5, "w": 0.44637860950804564}, {"a": 0, "b": 6, "w": 0.28822753568483594}, {"a": 0, "b": 7, "w": 0.22064974545115723}, {"a": 0, "b": 8, "w": 0.3336540470124095}, {"a": 0, "b": 9, "w": 0.2971607845494123}, {"a": 0, "b": 10, "w": 0.311470633391137}, {"a": 0, "b": 11, "w": 0.22803937601330393}, {"a": 0, "b": 12, "w": 0.37739287388613374}, {"a": 0, "b": 13, "w": 0.2732589506146177}, {"a": 0, "b": 14, "w": 0.3993297977772864}, {"a": 0, "b": 15, "w": 0.29015962739535806}, {"a": 0, "b": 16, "w": 0.1421222782416337}, {"a": 0, "b": 17, "w": 0.18777187530218997}, {"a": 0, "b": 18, "w": 4.249001150924414e-11}, {"a": 0, "b": 19, "w": 0.3149996903647341}, {"a": 0, "b": 20, "w": 0.24409714925393877}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.012,hiY=0.697;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
