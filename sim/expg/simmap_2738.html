<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">New Castle Legions [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.493, "c": "種", "n": "New Castle Legions [A]  n=2572 cos1.00 難1.49", "s": 0.715, "f": 0}, {"x": 0.986, "y": 1.05, "c": "近傍", "n": "禊 [A]  n=2609 cos0.99 難1.05", "s": 0.725, "f": 0}, {"x": 0.984, "y": 1.188, "c": "近傍", "n": "ハイテックトキオ [L]  n=2023 cos0.98 難1.19", "s": 0.562, "f": 0}, {"x": 0.989, "y": 0.741, "c": "近傍", "n": "Necroxis Girl [A]  n=2962 cos0.99 難0.74", "s": 0.823, "f": 0}, {"x": 0.983, "y": 1.02, "c": "近傍", "n": "D [A]  n=3224 cos0.98 難1.02", "s": 0.896, "f": 0}, {"x": 0.98, "y": 1.394, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [A]  n=2582 cos0.98 難1.39", "s": 0.717, "f": 0}, {"x": 0.981, "y": 1.262, "c": "近傍", "n": "Fire Beat [A]  n=2047 cos0.98 難1.26", "s": 0.569, "f": 0}, {"x": 0.984, "y": 0.87, "c": "近傍", "n": "STEEL NEEDLE [A]  n=3347 cos0.98 難0.87", "s": 0.93, "f": 0}, {"x": 0.981, "y": 1.092, "c": "近傍", "n": "海神 [A]  n=3532 cos0.98 難1.09", "s": 0.981, "f": 0}, {"x": 0.979, "y": 1.307, "c": "近傍", "n": "Vitrum [A]  n=2538 cos0.98 難1.31", "s": 0.705, "f": 0}, {"x": 0.979, "y": 1.092, "c": "近傍", "n": "Out of Control [A]  n=1755 cos0.98 難1.09", "s": 0.488, "f": 0}, {"x": 0.979, "y": 1.018, "c": "近傍", "n": "FUTURE is Dead [A]  n=3211 cos0.98 難1.02", "s": 0.892, "f": 0}, {"x": 0.977, "y": 1.368, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2271 cos0.98 難1.37", "s": 0.631, "f": 0}, {"x": 0.983, "y": 0.728, "c": "近傍", "n": "Star Trail [L]  n=1139 cos0.98 難0.73", "s": 0.316, "f": 0}, {"x": 0.977, "y": 1.146, "c": "近傍", "n": "Million Dollar [A]  n=1558 cos0.98 難1.15", "s": 0.433, "f": 0}, {"x": 0.981, "y": 0.759, "c": "近傍", "n": "gigadelic [A]  n=3539 cos0.98 難0.76", "s": 0.983, "f": 0}, {"x": 0.976, "y": 1.152, "c": "近傍", "n": "EVANESCENT [A]  n=3029 cos0.98 難1.15", "s": 0.842, "f": 0}, {"x": 0.981, "y": 0.728, "c": "近傍", "n": "Usual Days-remix [A]  n=3078 cos0.98 難0.73", "s": 0.855, "f": 0}, {"x": 0.988, "y": 0.46, "c": "近傍", "n": "Souhait bleu [A]  n=2364 cos0.99 難0.46", "s": 0.657, "f": 0}, {"x": 0.979, "y": 0.836, "c": "近傍", "n": "Highcharge Divolt [A]  n=3599 cos0.98 難0.84", "s": 1.0, "f": 0}, {"x": 0.975, "y": 1.501, "c": "近傍", "n": "烽火連天の刃 [A]  n=2073 cos0.97 難1.50", "s": 0.576, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30727123893938246}, {"a": 0, "b": 2, "w": 0.4120434661741915}, {"a": 0, "b": 3, "w": 0.591343375932454}, {"a": 0, "b": 4, "w": 0.5335873615037758}, {"a": 0, "b": 5, "w": 0.1406810188799793}, {"a": 0, "b": 6, "w": 0.521047722805976}, {"a": 0, "b": 7, "w": 0.563557224279026}, {"a": 0, "b": 8, "w": 0.2838928416167559}, {"a": 0, "b": 9, "w": 0.23429935165669147}, {"a": 0, "b": 10, "w": 0.3163282033430893}, {"a": 0, "b": 11, "w": 0.5020410345606698}, {"a": 0, "b": 12, "w": 0.09073389608430993}, {"a": 0, "b": 13, "w": 0.5134990185235829}, {"a": 0, "b": 14, "w": 0.16040452191419208}, {"a": 0, "b": 15, "w": 0.527006617934804}, {"a": 0, "b": 16, "w": 0.22078273380222846}, {"a": 0, "b": 17, "w": 0.5335142299122879}, {"a": 0, "b": 18, "w": 0.6094019602944952}, {"a": 0, "b": 19, "w": 0.4038674127629478}, {"a": 0, "b": 20, "w": 2.069200366605628e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=0.377,hiY=1.585;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
