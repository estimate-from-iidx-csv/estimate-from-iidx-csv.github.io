<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Don't be afraid myself [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.648, "c": "種", "n": "Don't be afraid myself [H]  n=1640 cos1.00 難-0.65", "s": 0.509, "f": 0}, {"x": 0.996, "y": -0.634, "c": "近傍", "n": "ANDROMEDA II [H]  n=1977 cos1.00 難-0.63", "s": 0.613, "f": 0}, {"x": 0.996, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos1.00 難-0.71", "s": 0.708, "f": 0}, {"x": 0.992, "y": -0.633, "c": "近傍", "n": "WONDER WALKER [H]  n=2625 cos0.99 難-0.63", "s": 0.814, "f": 0}, {"x": 0.992, "y": -0.622, "c": "近傍", "n": "Colors (radio edit) [H]  n=2374 cos0.99 難-0.62", "s": 0.737, "f": 0}, {"x": 0.99, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.99 難-0.65", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.641, "c": "近傍", "n": "switch [H]  n=1801 cos0.99 難-0.64", "s": 0.559, "f": 0}, {"x": 0.991, "y": -0.591, "c": "近傍", "n": "the shadow [H]  n=1899 cos0.99 難-0.59", "s": 0.589, "f": 0}, {"x": 0.991, "y": -0.545, "c": "近傍", "n": "WAKE UP NOW [A]  n=2293 cos0.99 難-0.55", "s": 0.711, "f": 0}, {"x": 0.995, "y": -0.434, "c": "近傍", "n": "Ristaccia [H]  n=2300 cos0.99 難-0.43", "s": 0.714, "f": 0}, {"x": 0.992, "y": -0.801, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2344 cos0.99 難-0.80", "s": 0.727, "f": 0}, {"x": 0.994, "y": -0.851, "c": "近傍", "n": "Giudecca [H]  n=1654 cos0.99 難-0.85", "s": 0.513, "f": 0}, {"x": 0.993, "y": -0.821, "c": "近傍", "n": "D.C.fish [H]  n=1811 cos0.99 難-0.82", "s": 0.562, "f": 0}, {"x": 0.99, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.506, "f": 0}, {"x": 0.994, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.574, "f": 0}, {"x": 0.99, "y": -0.64, "c": "近傍", "n": "CaptivAte～誓い～ [H]  n=2183 cos0.99 難-0.64", "s": 0.677, "f": 0}, {"x": 0.99, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos0.99 難-0.75", "s": 0.438, "f": 0}, {"x": 0.99, "y": -0.598, "c": "近傍", "n": "NEMESIS [H]  n=1851 cos0.99 難-0.60", "s": 0.574, "f": 0}, {"x": 0.99, "y": -0.708, "c": "近傍", "n": "quasar [H]  n=3209 cos0.99 難-0.71", "s": 0.996, "f": 0}, {"x": 0.989, "y": -0.654, "c": "近傍", "n": "DROP [H]  n=1809 cos0.99 難-0.65", "s": 0.561, "f": 0}, {"x": 0.993, "y": -0.851, "c": "近傍", "n": "ZERO-ONE [H]  n=1902 cos0.99 難-0.85", "s": 0.59, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3241812538569686}, {"a": 0, "b": 2, "w": 0.3996588868769355}, {"a": 0, "b": 3, "w": 0.16245921791733509}, {"a": 0, "b": 4, "w": 0.11554991349915467}, {"a": 0, "b": 5, "w": 0.11992529509377203}, {"a": 0, "b": 6, "w": 0.1123365199957933}, {"a": 0, "b": 7, "w": 0.12677508037825846}, {"a": 0, "b": 8, "w": 0.11737409006794253}, {"a": 0, "b": 9, "w": 0.31600752694300305}, {"a": 0, "b": 10, "w": 0.180698378819517}, {"a": 0, "b": 11, "w": 0.2277682938446246}, {"a": 0, "b": 12, "w": 0.21985096419151562}, {"a": 0, "b": 13, "w": 0.09730039245952793}, {"a": 0, "b": 14, "w": 0.27308080321540007}, {"a": 0, "b": 15, "w": 0.08006309128329092}, {"a": 0, "b": 16, "w": 0.11870397290143109}, {"a": 0, "b": 17, "w": 0.09051806306253218}, {"a": 0, "b": 18, "w": 6.60479448910678e-11}, {"a": 0, "b": 19, "w": 0.07578344207377696}, {"a": 0, "b": 20, "w": 0.15815560015637764}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.895,hiY=-0.400;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
