<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">24th Century BOY [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.572, "c": "種", "n": "24th Century BOY [A]  n=3347 cos1.00 難0.57", "s": 0.913, "f": 0}, {"x": 0.994, "y": 0.497, "c": "近傍", "n": "明鏡止水 [A]  n=3153 cos0.99 難0.50", "s": 0.861, "f": 0}, {"x": 0.993, "y": 0.491, "c": "近傍", "n": "DROP [A]  n=3226 cos0.99 難0.49", "s": 0.88, "f": 0}, {"x": 0.993, "y": 0.49, "c": "近傍", "n": "bloomin' feeling [A]  n=3652 cos0.99 難0.49", "s": 0.997, "f": 0}, {"x": 0.994, "y": 0.457, "c": "近傍", "n": "Light and Cyber… [A]  n=3252 cos0.99 難0.46", "s": 0.888, "f": 0}, {"x": 0.992, "y": 0.606, "c": "近傍", "n": "CUE CUE RESCUE [L]  n=1248 cos0.99 難0.61", "s": 0.341, "f": 0}, {"x": 0.992, "y": 0.656, "c": "近傍", "n": "Last Card [A]  n=824 cos0.99 難0.66", "s": 0.225, "f": 0}, {"x": 0.991, "y": 0.529, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2690 cos0.99 難0.53", "s": 0.734, "f": 0}, {"x": 0.992, "y": 0.679, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3234 cos0.99 難0.68", "s": 0.883, "f": 0}, {"x": 0.991, "y": 0.453, "c": "近傍", "n": "DESIRE [A]  n=3352 cos0.99 難0.45", "s": 0.915, "f": 0}, {"x": 0.99, "y": 0.521, "c": "近傍", "n": "Afterimage d'automne [A]  n=2743 cos0.99 難0.52", "s": 0.749, "f": 0}, {"x": 0.991, "y": 0.47, "c": "近傍", "n": "Overslept [A]  n=2558 cos0.99 難0.47", "s": 0.698, "f": 0}, {"x": 0.99, "y": 0.646, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1772 cos0.99 難0.65", "s": 0.484, "f": 0}, {"x": 0.994, "y": 0.368, "c": "近傍", "n": "SHADE [A]  n=3606 cos0.99 難0.37", "s": 0.984, "f": 0}, {"x": 0.99, "y": 0.64, "c": "近傍", "n": "THE CANNONBALLER [A]  n=3342 cos0.99 難0.64", "s": 0.912, "f": 0}, {"x": 0.989, "y": 0.602, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3369 cos0.99 難0.60", "s": 0.919, "f": 0}, {"x": 0.99, "y": 0.494, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2932 cos0.99 難0.49", "s": 0.8, "f": 0}, {"x": 0.989, "y": 0.602, "c": "近傍", "n": "OTOKOZAKA [A]  n=1616 cos0.99 難0.60", "s": 0.441, "f": 0}, {"x": 0.992, "y": 0.746, "c": "近傍", "n": "LIGHTNING STRIKES [A]  n=3319 cos0.99 難0.75", "s": 0.906, "f": 0}, {"x": 0.99, "y": 0.432, "c": "近傍", "n": "Xepher [A]  n=3664 cos0.99 難0.43", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.487, "c": "近傍", "n": "Never Fade Away [A]  n=3146 cos0.99 難0.49", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2137558921394933}, {"a": 0, "b": 2, "w": 0.12265470682505797}, {"a": 0, "b": 3, "w": 0.2645891709781869}, {"a": 0, "b": 4, "w": 0.28820708060888844}, {"a": 0, "b": 5, "w": 0.14739144871152376}, {"a": 0, "b": 6, "w": 0.1471221290787389}, {"a": 0, "b": 7, "w": 0.0731806730771889}, {"a": 0, "b": 8, "w": 0.16717141600225904}, {"a": 0, "b": 9, "w": 0.16950553598653406}, {"a": 0, "b": 10, "w": 0.09620707735377831}, {"a": 0, "b": 11, "w": 0.06464098251237105}, {"a": 0, "b": 12, "w": 0.03712016025976439}, {"a": 0, "b": 13, "w": 0.2688357409160794}, {"a": 0, "b": 14, "w": 0.07937408689537107}, {"a": 0, "b": 15, "w": 0.0972675527839797}, {"a": 0, "b": 16, "w": 0.11492259608295863}, {"a": 0, "b": 17, "w": 4.836131495267182e-11}, {"a": 0, "b": 18, "w": 0.045162436810994855}, {"a": 0, "b": 19, "w": 0.11621842651310577}, {"a": 0, "b": 20, "w": 0.05314074359611243}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.337,hiY=0.777;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
