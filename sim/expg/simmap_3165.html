<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Twelfth Style [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.567, "c": "種", "n": "Twelfth Style [L]  n=2584 cos1.00 難1.57", "s": 0.778, "f": 0}, {"x": 0.986, "y": 1.517, "c": "近傍", "n": "INSOMNIA [A]  n=3217 cos0.99 難1.52", "s": 0.969, "f": 0}, {"x": 0.984, "y": 1.725, "c": "近傍", "n": "Blue Spring Express [A]  n=2854 cos0.98 難1.73", "s": 0.859, "f": 0}, {"x": 0.982, "y": 1.52, "c": "近傍", "n": "Scripted Connection⇒ A mix [L]  n=1748 cos0.98 難1.52", "s": 0.526, "f": 0}, {"x": 0.983, "y": 1.846, "c": "近傍", "n": "Sigmund [A]  n=3030 cos0.98 難1.85", "s": 0.912, "f": 0}, {"x": 0.987, "y": 1.196, "c": "近傍", "n": "Mid-Corner (Magic Maker) [A]  n=1199 cos0.99 難1.20", "s": 0.361, "f": 0}, {"x": 0.98, "y": 1.387, "c": "近傍", "n": "1116 [A]  n=1164 cos0.98 難1.39", "s": 0.35, "f": 0}, {"x": 0.985, "y": 1.231, "c": "近傍", "n": "Here We Go Now [A]  n=1379 cos0.98 難1.23", "s": 0.415, "f": 0}, {"x": 0.988, "y": 1.955, "c": "近傍", "n": "Xerulean [A]  n=1409 cos0.99 難1.95", "s": 0.424, "f": 0}, {"x": 0.979, "y": 1.417, "c": "近傍", "n": "HADES [A]  n=3297 cos0.98 難1.42", "s": 0.993, "f": 0}, {"x": 0.978, "y": 1.544, "c": "近傍", "n": "廿 [L]  n=2717 cos0.98 難1.54", "s": 0.818, "f": 0}, {"x": 0.977, "y": 1.568, "c": "近傍", "n": "Xlo [A]  n=2971 cos0.98 難1.57", "s": 0.895, "f": 0}, {"x": 0.978, "y": 1.422, "c": "近傍", "n": "Illusionary Waterlily [A]  n=3018 cos0.98 難1.42", "s": 0.909, "f": 0}, {"x": 0.982, "y": 1.899, "c": "近傍", "n": "焔極OVERKILL [A]  n=2757 cos0.98 難1.90", "s": 0.83, "f": 0}, {"x": 0.982, "y": 1.225, "c": "近傍", "n": "Smalt #28598F [A]  n=2168 cos0.98 難1.22", "s": 0.653, "f": 0}, {"x": 0.976, "y": 1.461, "c": "近傍", "n": "LASER CRUSTER (IGNITE REMIX) [A]  n=2516 cos0.98 難1.46", "s": 0.758, "f": 0}, {"x": 0.976, "y": 1.466, "c": "近傍", "n": "Devilz Staircase [A]  n=3171 cos0.98 難1.47", "s": 0.955, "f": 0}, {"x": 0.982, "y": 1.923, "c": "近傍", "n": "Bad Encryption [A]  n=1815 cos0.98 難1.92", "s": 0.547, "f": 0}, {"x": 0.975, "y": 1.465, "c": "近傍", "n": "津軽雪 [A]  n=3212 cos0.98 難1.47", "s": 0.967, "f": 0}, {"x": 0.977, "y": 1.33, "c": "近傍", "n": "Konzert V [A]  n=3321 cos0.98 難1.33", "s": 1.0, "f": 0}, {"x": 0.979, "y": 1.258, "c": "近傍", "n": "Without Heaven [A]  n=1050 cos0.98 難1.26", "s": 0.316, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.245009356914059}, {"a": 0, "b": 2, "w": 0.1903304867678537}, {"a": 0, "b": 3, "w": 0.08544995121730392}, {"a": 0, "b": 4, "w": 0.08611042617864895}, {"a": 0, "b": 5, "w": 0.20309709357049321}, {"a": 0, "b": 6, "w": 0.12135645655983196}, {"a": 0, "b": 7, "w": 0.2192820046773103}, {"a": 0, "b": 8, "w": 0.18679172971881652}, {"a": 0, "b": 9, "w": 0.025958826432987636}, {"a": 0, "b": 10, "w": 0.07213824844246997}, {"a": 0, "b": 11, "w": 0.050002680446794456}, {"a": 0, "b": 12, "w": 0.061376869111762655}, {"a": 0, "b": 13, "w": 0.055171788165003344}, {"a": 0, "b": 14, "w": 0.05801553284502525}, {"a": 0, "b": 15, "w": 0.0527651708806085}, {"a": 0, "b": 16, "w": 2.6980973011347942e-11}, {"a": 0, "b": 17, "w": 0.113239234354086}, {"a": 0, "b": 18, "w": 0.032307906853201285}, {"a": 0, "b": 19, "w": 0.02341812898787321}, {"a": 0, "b": 20, "w": 0.09698076423039714}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=1.136,hiY=2.016;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
