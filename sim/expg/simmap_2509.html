<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Antigravity [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.658, "c": "種", "n": "Antigravity [A]  n=2887 cos1.00 難1.66", "s": 0.91, "f": 0}, {"x": 0.993, "y": 1.569, "c": "近傍", "n": "Empire of Fury [A]  n=2430 cos0.99 難1.57", "s": 0.766, "f": 0}, {"x": 0.992, "y": 1.615, "c": "近傍", "n": "Marie Antoinette [L]  n=1728 cos0.99 難1.61", "s": 0.545, "f": 0}, {"x": 0.992, "y": 1.684, "c": "近傍", "n": "金野火織の金色提言 [A]  n=2860 cos0.99 難1.68", "s": 0.902, "f": 0}, {"x": 0.992, "y": 1.569, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2749 cos0.99 難1.57", "s": 0.867, "f": 0}, {"x": 0.991, "y": 1.602, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2716 cos0.99 難1.60", "s": 0.856, "f": 0}, {"x": 0.991, "y": 1.782, "c": "近傍", "n": "voltississimo [A]  n=2579 cos0.99 難1.78", "s": 0.813, "f": 0}, {"x": 0.991, "y": 1.512, "c": "近傍", "n": "ALTERNATOR [A]  n=2278 cos0.99 難1.51", "s": 0.718, "f": 0}, {"x": 0.991, "y": 1.527, "c": "近傍", "n": "HAERETICUS [A]  n=3061 cos0.99 難1.53", "s": 0.965, "f": 0}, {"x": 0.991, "y": 1.812, "c": "近傍", "n": "Vulnerability [A]  n=1144 cos0.99 難1.81", "s": 0.361, "f": 0}, {"x": 0.992, "y": 1.439, "c": "近傍", "n": "Monopole. [A]  n=3172 cos0.99 難1.44", "s": 1.0, "f": 0}, {"x": 0.991, "y": 1.472, "c": "近傍", "n": "DEADHEAT [A]  n=3002 cos0.99 難1.47", "s": 0.946, "f": 0}, {"x": 0.994, "y": 1.368, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2271 cos0.99 難1.37", "s": 0.716, "f": 0}, {"x": 0.987, "y": 1.657, "c": "近傍", "n": "POLKAMANIA [L]  n=812 cos0.99 難1.66", "s": 0.256, "f": 0}, {"x": 0.987, "y": 1.684, "c": "近傍", "n": "255 [A]  n=3006 cos0.99 難1.68", "s": 0.948, "f": 0}, {"x": 0.987, "y": 1.578, "c": "近傍", "n": "Purple Perplex [A]  n=2231 cos0.99 難1.58", "s": 0.703, "f": 0}, {"x": 0.987, "y": 1.6, "c": "近傍", "n": "Artist [A]  n=2457 cos0.99 難1.60", "s": 0.775, "f": 0}, {"x": 0.99, "y": 1.4, "c": "近傍", "n": "Invitation from Mr.C [A]  n=3170 cos0.99 難1.40", "s": 0.999, "f": 0}, {"x": 0.988, "y": 1.81, "c": "近傍", "n": "Smashing Wedge [A]  n=2352 cos0.99 難1.81", "s": 0.741, "f": 0}, {"x": 0.992, "y": 1.368, "c": "近傍", "n": "電腦都市 [A]  n=1373 cos0.99 難1.37", "s": 0.433, "f": 0}, {"x": 0.991, "y": 1.949, "c": "近傍", "n": "カジノファイヤーことみちゃん [L]  n=1073 cos0.99 難1.95", "s": 0.338, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48338357923205866}, {"a": 0, "b": 2, "w": 0.5419060283879282}, {"a": 0, "b": 3, "w": 0.5044261293043247}, {"a": 0, "b": 4, "w": 0.25460891638655603}, {"a": 0, "b": 5, "w": 0.3559630627684983}, {"a": 0, "b": 6, "w": 0.12562101950772142}, {"a": 0, "b": 7, "w": 0.2140603669161465}, {"a": 0, "b": 8, "w": 0.43550085852348874}, {"a": 0, "b": 9, "w": 0.09971459257813586}, {"a": 0, "b": 10, "w": 0.4391109792886795}, {"a": 0, "b": 11, "w": 0.45005791481066515}, {"a": 0, "b": 12, "w": 0.409586924655835}, {"a": 0, "b": 13, "w": 0.10276368958705051}, {"a": 0, "b": 14, "w": 0.15867799806782001}, {"a": 0, "b": 15, "w": 0.31171212670775206}, {"a": 0, "b": 16, "w": 0.19755208712651084}, {"a": 0, "b": 17, "w": 0.49747607207176114}, {"a": 0, "b": 18, "w": 0.021696570241863333}, {"a": 0, "b": 19, "w": 0.4224744630917122}, {"a": 0, "b": 20, "w": 2.682820632315952e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=1.322,hiY=1.995;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
