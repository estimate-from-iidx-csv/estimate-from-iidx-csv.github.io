<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Sakura Mirage [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.386, "c": "種", "n": "Sakura Mirage [A]  n=3460 cos1.00 難0.39", "s": 0.949, "f": 0}, {"x": 0.997, "y": 0.441, "c": "近傍", "n": "Lighting Shower [A]  n=3191 cos1.00 難0.44", "s": 0.875, "f": 0}, {"x": 0.994, "y": 0.419, "c": "近傍", "n": "Scarlet Moon [A]  n=3508 cos0.99 難0.42", "s": 0.962, "f": 0}, {"x": 0.996, "y": 0.21, "c": "近傍", "n": "SUPER HEROINE!! [A]  n=1030 cos1.00 難0.21", "s": 0.282, "f": 0}, {"x": 0.994, "y": 0.312, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=836 cos0.99 難0.31", "s": 0.229, "f": 0}, {"x": 0.997, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos1.00 難0.59", "s": 0.929, "f": 0}, {"x": 0.995, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos1.00 難0.21", "s": 0.655, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "Aurora [A]  n=3647 cos0.99 難0.26", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.217, "c": "近傍", "n": "Destiny Sword [A]  n=3492 cos1.00 難0.22", "s": 0.957, "f": 0}, {"x": 0.993, "y": 0.449, "c": "近傍", "n": "Ubertreffen [A]  n=3508 cos0.99 難0.45", "s": 0.962, "f": 0}, {"x": 0.993, "y": 0.287, "c": "近傍", "n": "reunion [H]  n=3561 cos0.99 難0.29", "s": 0.976, "f": 0}, {"x": 0.993, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.865, "f": 0}, {"x": 0.993, "y": 0.308, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3376 cos0.99 難0.31", "s": 0.926, "f": 0}, {"x": 0.993, "y": 0.448, "c": "近傍", "n": "CONTRACT [A]  n=3401 cos0.99 難0.45", "s": 0.933, "f": 0}, {"x": 0.993, "y": 0.31, "c": "近傍", "n": "Rising in the Sun(original mix) [A]  n=2238 cos0.99 難0.31", "s": 0.614, "f": 0}, {"x": 0.993, "y": 0.318, "c": "近傍", "n": "LASER CRUSTER [H]  n=3202 cos0.99 難0.32", "s": 0.878, "f": 0}, {"x": 0.993, "y": 0.428, "c": "近傍", "n": "Angelic Jelly [A]  n=3396 cos0.99 難0.43", "s": 0.931, "f": 0}, {"x": 0.997, "y": 0.133, "c": "近傍", "n": "Lost Souls [A]  n=2604 cos1.00 難0.13", "s": 0.714, "f": 0}, {"x": 0.992, "y": 0.317, "c": "近傍", "n": "Quick Silver [A]  n=3372 cos0.99 難0.32", "s": 0.925, "f": 0}, {"x": 0.992, "y": 0.281, "c": "近傍", "n": "Like+it! [A]  n=3047 cos0.99 難0.28", "s": 0.835, "f": 0}, {"x": 0.996, "y": 0.146, "c": "近傍", "n": "Believe In Me [A]  n=3504 cos1.00 難0.15", "s": 0.961, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30202107332368155}, {"a": 0, "b": 2, "w": 0.23331354694219952}, {"a": 0, "b": 3, "w": 0.45637002787605796}, {"a": 0, "b": 4, "w": 0.13563477210955388}, {"a": 0, "b": 5, "w": 0.5053061283106163}, {"a": 0, "b": 6, "w": 0.11448397272093325}, {"a": 0, "b": 7, "w": 0.3384881087977957}, {"a": 0, "b": 8, "w": 0.16429879945637194}, {"a": 0, "b": 9, "w": 0.28237031197072193}, {"a": 0, "b": 10, "w": 0.2683433139046243}, {"a": 0, "b": 11, "w": 0.2579155977899139}, {"a": 0, "b": 12, "w": 0.17417407586071}, {"a": 0, "b": 13, "w": 0.013408475710883105}, {"a": 0, "b": 14, "w": 0.22807282702422826}, {"a": 0, "b": 15, "w": 5.051326024130276e-11}, {"a": 0, "b": 16, "w": 0.025118894763502486}, {"a": 0, "b": 17, "w": 0.48874533453234015}, {"a": 0, "b": 18, "w": 0.22905539088567473}, {"a": 0, "b": 19, "w": 0.24660148956452765}, {"a": 0, "b": 20, "w": 0.22359376237710904}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=0.096,hiY=0.625;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
