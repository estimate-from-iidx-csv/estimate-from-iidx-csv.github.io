<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">snow storm [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.155, "c": "種", "n": "snow storm [A]  n=3652 cos1.00 難-0.15", "s": 0.971, "f": 0}, {"x": 0.994, "y": -0.037, "c": "近傍", "n": "crew [A]  n=3598 cos0.99 難-0.04", "s": 0.956, "f": 0}, {"x": 0.992, "y": -0.185, "c": "近傍", "n": "Euphoric Lagoon [A]  n=2427 cos0.99 難-0.18", "s": 0.645, "f": 0}, {"x": 0.993, "y": 0.015, "c": "近傍", "n": "月下繚乱 [A]  n=1120 cos0.99 難0.01", "s": 0.298, "f": 0}, {"x": 0.991, "y": -0.095, "c": "近傍", "n": "Violet Pulse [A]  n=2909 cos0.99 難-0.10", "s": 0.773, "f": 0}, {"x": 0.991, "y": -0.193, "c": "近傍", "n": "ハイ*ビスカス ft. Kanae Asaba [A]  n=3283 cos0.99 難-0.19", "s": 0.872, "f": 0}, {"x": 0.991, "y": -0.134, "c": "近傍", "n": "Funky Quirky [A]  n=511 cos0.99 難-0.13", "s": 0.136, "f": 0}, {"x": 0.991, "y": -0.054, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2903 cos0.99 難-0.05", "s": 0.771, "f": 0}, {"x": 0.992, "y": -0.342, "c": "近傍", "n": "AA [H]  n=3763 cos0.99 難-0.34", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.04, "c": "近傍", "n": "Time To Empress [A]  n=3234 cos0.99 難-0.04", "s": 0.859, "f": 0}, {"x": 0.989, "y": -0.134, "c": "近傍", "n": "Hard Breaker [A]  n=1311 cos0.99 難-0.13", "s": 0.348, "f": 0}, {"x": 0.99, "y": -0.302, "c": "近傍", "n": "FLARE -炎舞- ft.Nana Takahashi [A]  n=1504 cos0.99 難-0.30", "s": 0.4, "f": 0}, {"x": 0.988, "y": -0.11, "c": "近傍", "n": "PopなEDEN [A]  n=1552 cos0.99 難-0.11", "s": 0.412, "f": 0}, {"x": 0.988, "y": -0.112, "c": "近傍", "n": "planarian [A]  n=2944 cos0.99 難-0.11", "s": 0.782, "f": 0}, {"x": 0.988, "y": -0.28, "c": "近傍", "n": "セピアの軌跡 ft. 天宮みや(少女フラクタル) [A]  n=3065 cos0.99 難-0.28", "s": 0.815, "f": 0}, {"x": 0.994, "y": 0.226, "c": "近傍", "n": "SEQUENCE CAT [A]  n=3319 cos0.99 難0.23", "s": 0.882, "f": 0}, {"x": 0.988, "y": -0.333, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2473 cos0.99 難-0.33", "s": 0.657, "f": 0}, {"x": 0.987, "y": -0.278, "c": "近傍", "n": "煉獄のエルフェリア [H]  n=3105 cos0.99 難-0.28", "s": 0.825, "f": 0}, {"x": 0.988, "y": 0.028, "c": "近傍", "n": "Danza Aestas [A]  n=2307 cos0.99 難0.03", "s": 0.613, "f": 0}, {"x": 0.987, "y": -0.184, "c": "近傍", "n": "Devilz Staircase [H]  n=2862 cos0.99 難-0.18", "s": 0.761, "f": 0}, {"x": 0.987, "y": -0.048, "c": "近傍", "n": "KAISER PHOENIX [H]  n=2578 cos0.99 難-0.05", "s": 0.685, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.12388312612002395}, {"a": 0, "b": 2, "w": 0.23538680650510213}, {"a": 0, "b": 3, "w": 5.3281046241693275e-11}, {"a": 0, "b": 4, "w": 0.14184657107132015}, {"a": 0, "b": 5, "w": 0.1680337289927416}, {"a": 0, "b": 6, "w": 0.14333859364554313}, {"a": 0, "b": 7, "w": 0.1015598944701106}, {"a": 0, "b": 8, "w": 0.2418120654706607}, {"a": 0, "b": 9, "w": 0.17341867320374726}, {"a": 0, "b": 10, "w": 0.044607953055540106}, {"a": 0, "b": 11, "w": 0.1386306456202694}, {"a": 0, "b": 12, "w": 0.09655055497701981}, {"a": 0, "b": 13, "w": 0.10624983326696757}, {"a": 0, "b": 14, "w": 0.10101046425050031}, {"a": 0, "b": 15, "w": 0.22989742319509}, {"a": 0, "b": 16, "w": 0.10600370223793942}, {"a": 0, "b": 17, "w": 0.07291794726080836}, {"a": 0, "b": 18, "w": 0.06964161031709704}, {"a": 0, "b": 19, "w": 0.05377931961178839}, {"a": 0, "b": 20, "w": 0.06177575911985422}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.388,hiY=0.272;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
