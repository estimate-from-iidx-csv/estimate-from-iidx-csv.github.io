<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">AGEHA [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.322, "c": "種", "n": "AGEHA [L]  n=2371 cos1.00 難0.32", "s": 0.674, "f": 0}, {"x": 0.99, "y": 0.411, "c": "近傍", "n": "Engraved Mark [A]  n=3412 cos0.99 難0.41", "s": 0.97, "f": 0}, {"x": 0.991, "y": 0.516, "c": "近傍", "n": "Para siempre [A]  n=2669 cos0.99 難0.52", "s": 0.759, "f": 0}, {"x": 0.989, "y": 0.345, "c": "近傍", "n": "Valgus [A]  n=3339 cos0.99 難0.34", "s": 0.949, "f": 0}, {"x": 0.99, "y": 0.119, "c": "近傍", "n": "kors k's Let's make an Image Song! [A]  n=989 cos0.99 難0.12", "s": 0.281, "f": 0}, {"x": 0.989, "y": 0.311, "c": "近傍", "n": "Evans [H]  n=3517 cos0.99 難0.31", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.315, "c": "近傍", "n": "out of disk space [A]  n=1412 cos0.99 難0.32", "s": 0.401, "f": 0}, {"x": 0.992, "y": -0.071, "c": "近傍", "n": "Chemical Cookie [A]  n=3318 cos0.99 難-0.07", "s": 0.943, "f": 0}, {"x": 0.986, "y": 0.264, "c": "近傍", "n": "Victory Of Ravers [A]  n=2466 cos0.99 難0.26", "s": 0.701, "f": 0}, {"x": 0.987, "y": 0.419, "c": "近傍", "n": "ATHER [A]  n=3419 cos0.99 難0.42", "s": 0.972, "f": 0}, {"x": 0.986, "y": 0.213, "c": "近傍", "n": "ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A]  n=3484 cos0.99 難0.21", "s": 0.991, "f": 0}, {"x": 0.986, "y": 0.459, "c": "近傍", "n": "Ritual of Anubis [A]  n=2269 cos0.99 難0.46", "s": 0.645, "f": 0}, {"x": 0.986, "y": 0.449, "c": "近傍", "n": "Xyndrome [A]  n=2507 cos0.99 難0.45", "s": 0.713, "f": 0}, {"x": 0.988, "y": -0.005, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3106 cos0.99 難-0.01", "s": 0.883, "f": 0}, {"x": 0.989, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos0.99 難-0.06", "s": 0.866, "f": 0}, {"x": 0.985, "y": 0.448, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3112 cos0.99 難0.45", "s": 0.885, "f": 0}, {"x": 0.99, "y": -0.119, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3404 cos0.99 難-0.12", "s": 0.968, "f": 0}, {"x": 0.988, "y": -0.059, "c": "近傍", "n": "Agnus Dei [A]  n=2679 cos0.99 難-0.06", "s": 0.762, "f": 0}, {"x": 0.984, "y": 0.363, "c": "近傍", "n": "Egret and Willow [A]  n=3205 cos0.98 難0.36", "s": 0.911, "f": 0}, {"x": 0.985, "y": 0.082, "c": "近傍", "n": "ミュージック・アワー [A]  n=2504 cos0.98 難0.08", "s": 0.712, "f": 0}, {"x": 0.988, "y": -0.071, "c": "近傍", "n": "Slumber☆Party [A]  n=1079 cos0.99 難-0.07", "s": 0.307, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.26890931766556236}, {"a": 0, "b": 2, "w": 0.37685176110297347}, {"a": 0, "b": 3, "w": 0.333249795046504}, {"a": 0, "b": 4, "w": 0.37042915996022485}, {"a": 0, "b": 5, "w": 0.23743935266221305}, {"a": 0, "b": 6, "w": 0.2769481627470115}, {"a": 0, "b": 7, "w": 0.17440968954790614}, {"a": 0, "b": 8, "w": 0.2675679351746927}, {"a": 0, "b": 9, "w": 0.2668339405438169}, {"a": 0, "b": 10, "w": 0.20415212299302576}, {"a": 0, "b": 11, "w": 0.2348686091858927}, {"a": 0, "b": 12, "w": 0.08860170244178323}, {"a": 0, "b": 13, "w": 0.06502130578115295}, {"a": 0, "b": 14, "w": 0.09769412651789444}, {"a": 0, "b": 15, "w": 0.23613841250469836}, {"a": 0, "b": 16, "w": 0.09183544788547726}, {"a": 0, "b": 17, "w": 3.707012474762905e-11}, {"a": 0, "b": 18, "w": 0.17180680652069835}, {"a": 0, "b": 19, "w": 0.20850940677523833}, {"a": 0, "b": 20, "w": 0.289306235218991}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-0.170,hiY=0.567;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
