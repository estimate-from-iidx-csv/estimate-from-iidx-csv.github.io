<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.213, "c": "種", "n": "ぷろぐれっしぶ時空少女！うらしまたろ子ちゃん！ [A]  n=3484 cos1.00 難0.21", "s": 0.965, "f": 0}, {"x": 0.993, "y": 0.234, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2933 cos0.99 難0.23", "s": 0.813, "f": 0}, {"x": 0.994, "y": 0.406, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3248 cos0.99 難0.41", "s": 0.9, "f": 0}, {"x": 0.991, "y": 0.149, "c": "近傍", "n": "NANAIRO [A]  n=3061 cos0.99 難0.15", "s": 0.848, "f": 0}, {"x": 0.991, "y": 0.009, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [A]  n=3187 cos0.99 難0.01", "s": 0.883, "f": 0}, {"x": 0.991, "y": 0.411, "c": "近傍", "n": "Engraved Mark [A]  n=3412 cos0.99 難0.41", "s": 0.945, "f": 0}, {"x": 0.989, "y": 0.132, "c": "近傍", "n": "SigSig [A]  n=3609 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.092, "c": "近傍", "n": "New Lights [A]  n=2834 cos0.99 難-0.09", "s": 0.785, "f": 0}, {"x": 0.988, "y": 0.162, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1930 cos0.99 難0.16", "s": 0.535, "f": 0}, {"x": 0.989, "y": 0.419, "c": "近傍", "n": "ATHER [A]  n=3419 cos0.99 難0.42", "s": 0.947, "f": 0}, {"x": 0.988, "y": 0.139, "c": "近傍", "n": "Sparkle Smilin' [A]  n=2647 cos0.99 難0.14", "s": 0.733, "f": 0}, {"x": 0.988, "y": 0.291, "c": "近傍", "n": "Blaze it UP! [A]  n=3472 cos0.99 難0.29", "s": 0.962, "f": 0}, {"x": 0.992, "y": 0.59, "c": "近傍", "n": "smile [A]  n=3299 cos0.99 難0.59", "s": 0.914, "f": 0}, {"x": 0.99, "y": -0.055, "c": "近傍", "n": "AO-∞ [A]  n=2932 cos0.99 難-0.05", "s": 0.812, "f": 0}, {"x": 0.99, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos0.99 難-0.06", "s": 0.844, "f": 0}, {"x": 0.989, "y": -0.005, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3106 cos0.99 難-0.01", "s": 0.861, "f": 0}, {"x": 0.987, "y": 0.139, "c": "近傍", "n": "Lost wing at.0 [A]  n=3151 cos0.99 難0.14", "s": 0.873, "f": 0}, {"x": 0.987, "y": 0.264, "c": "近傍", "n": "Marie Antoinette [A]  n=1917 cos0.99 難0.26", "s": 0.531, "f": 0}, {"x": 0.987, "y": 0.345, "c": "近傍", "n": "Valgus [A]  n=3339 cos0.99 難0.34", "s": 0.925, "f": 0}, {"x": 0.987, "y": 0.312, "c": "近傍", "n": "Little Little Princess [A]  n=3439 cos0.99 難0.31", "s": 0.953, "f": 0}, {"x": 0.987, "y": 0.286, "c": "近傍", "n": "Just Gimme [A]  n=1335 cos0.99 難0.29", "s": 0.37, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.38231790835550283}, {"a": 0, "b": 2, "w": 0.42301531046604346}, {"a": 0, "b": 3, "w": 0.24883298204652737}, {"a": 0, "b": 4, "w": 0.19814731992539825}, {"a": 0, "b": 5, "w": 0.3037350529848146}, {"a": 0, "b": 6, "w": 0.21248003350926703}, {"a": 0, "b": 7, "w": 0.30462822213266083}, {"a": 0, "b": 8, "w": 0.158371287674817}, {"a": 0, "b": 9, "w": 0.17269675458039668}, {"a": 0, "b": 10, "w": 0.20236788915573378}, {"a": 0, "b": 11, "w": 0.06079856876229894}, {"a": 0, "b": 12, "w": 0.11022016774731969}, {"a": 0, "b": 13, "w": 0.24646340813605694}, {"a": 0, "b": 14, "w": 0.18274394612748923}, {"a": 0, "b": 15, "w": 0.14495173970725295}, {"a": 0, "b": 16, "w": 0.1415227069138013}, {"a": 0, "b": 17, "w": 0.1659333532877738}, {"a": 0, "b": 18, "w": 0.11947531105636089}, {"a": 0, "b": 19, "w": 0.12862002620137913}, {"a": 0, "b": 20, "w": 4.701350420077688e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.147,hiY=0.645;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
