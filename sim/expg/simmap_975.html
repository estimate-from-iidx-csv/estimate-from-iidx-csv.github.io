<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PIT A PAT [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.284, "c": "種", "n": "PIT A PAT [A]  n=1535 cos1.00 難-0.28", "s": 0.412, "f": 0}, {"x": 0.995, "y": -0.106, "c": "近傍", "n": "TROOPERS [H]  n=2629 cos0.99 難-0.11", "s": 0.706, "f": 0}, {"x": 0.993, "y": -0.402, "c": "近傍", "n": "THE DETONATOR [H]  n=2218 cos0.99 難-0.40", "s": 0.596, "f": 0}, {"x": 0.992, "y": -0.341, "c": "近傍", "n": "SPLASH!!!!!!!!! [A]  n=1075 cos0.99 難-0.34", "s": 0.289, "f": 0}, {"x": 0.992, "y": -0.269, "c": "近傍", "n": "BLUE DRAGON(雷龍RemixIIDX) [H]  n=2839 cos0.99 難-0.27", "s": 0.763, "f": 0}, {"x": 0.992, "y": -0.215, "c": "近傍", "n": "Plan 8 [H]  n=3479 cos0.99 難-0.22", "s": 0.935, "f": 0}, {"x": 0.991, "y": -0.301, "c": "近傍", "n": "Drive Me Crazy [A]  n=3469 cos0.99 難-0.30", "s": 0.932, "f": 0}, {"x": 0.995, "y": -0.531, "c": "近傍", "n": "Skywalking [A]  n=615 cos0.99 難-0.53", "s": 0.165, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Fly Above (Vicissitude Remix) [A]  n=2506 cos0.99 難-0.25", "s": 0.673, "f": 0}, {"x": 0.99, "y": -0.292, "c": "近傍", "n": "零 - ZERO - [A]  n=3027 cos0.99 難-0.29", "s": 0.813, "f": 0}, {"x": 0.992, "y": -0.071, "c": "近傍", "n": "Slumber☆Party [A]  n=1079 cos0.99 難-0.07", "s": 0.29, "f": 0}, {"x": 0.99, "y": -0.413, "c": "近傍", "n": "SHINING☆DANCE [A]  n=1108 cos0.99 難-0.41", "s": 0.298, "f": 0}, {"x": 0.99, "y": -0.107, "c": "近傍", "n": "smooooch・∀・ [A]  n=3722 cos0.99 難-0.11", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.397, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2655 cos0.99 難-0.40", "s": 0.713, "f": 0}, {"x": 0.993, "y": 0.003, "c": "近傍", "n": "Breaking the ground [A]  n=3217 cos0.99 難0.00", "s": 0.864, "f": 0}, {"x": 0.991, "y": -0.055, "c": "近傍", "n": "AO-∞ [A]  n=2932 cos0.99 難-0.05", "s": 0.788, "f": 0}, {"x": 0.992, "y": 0.006, "c": "近傍", "n": "Bitter & Lucky [A]  n=1494 cos0.99 難0.01", "s": 0.401, "f": 0}, {"x": 0.989, "y": -0.336, "c": "近傍", "n": "Colorful Cookie [H]  n=3671 cos0.99 難-0.34", "s": 0.986, "f": 0}, {"x": 0.993, "y": -0.588, "c": "近傍", "n": "Xperanza [H]  n=2615 cos0.99 難-0.59", "s": 0.703, "f": 0}, {"x": 0.989, "y": -0.38, "c": "近傍", "n": "ゲシュタルト [A]  n=1492 cos0.99 難-0.38", "s": 0.401, "f": 0}, {"x": 0.989, "y": -0.187, "c": "近傍", "n": "めでてえ [A]  n=2209 cos0.99 難-0.19", "s": 0.593, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3986135077252597}, {"a": 0, "b": 2, "w": 0.21890047681512792}, {"a": 0, "b": 3, "w": 0.2636015408336516}, {"a": 0, "b": 4, "w": 0.20562092662116926}, {"a": 0, "b": 5, "w": 0.20336078499876253}, {"a": 0, "b": 6, "w": 0.08729290039038984}, {"a": 0, "b": 7, "w": 0.3648077476504613}, {"a": 0, "b": 8, "w": 0.16478794945886976}, {"a": 0, "b": 9, "w": 0.027646818477005453}, {"a": 0, "b": 10, "w": 0.11043644974326461}, {"a": 0, "b": 11, "w": 0.10331667356190555}, {"a": 0, "b": 12, "w": 0.04530789344715991}, {"a": 0, "b": 13, "w": 0.0735085347992106}, {"a": 0, "b": 14, "w": 0.2224493201565373}, {"a": 0, "b": 15, "w": 0.18565524846874237}, {"a": 0, "b": 16, "w": 0.22509869707378372}, {"a": 0, "b": 17, "w": 5.4739990318353193e-11}, {"a": 0, "b": 18, "w": 0.28581562749420986}, {"a": 0, "b": 19, "w": 0.021973521536937768}, {"a": 0, "b": 20, "w": 0.04404099769773895}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.636,hiY=0.054;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
