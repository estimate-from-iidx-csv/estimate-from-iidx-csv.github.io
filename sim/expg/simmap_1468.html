<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Quakes [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.646, "c": "種", "n": "Quakes [H]  n=1953 cos1.00 難-0.65", "s": 0.637, "f": 0}, {"x": 0.995, "y": -0.297, "c": "近傍", "n": "Aurora [H]  n=3068 cos0.99 難-0.30", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.551, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2643 cos0.99 難-0.55", "s": 0.861, "f": 0}, {"x": 0.988, "y": -0.814, "c": "近傍", "n": "Broken Sword [H]  n=2589 cos0.99 難-0.81", "s": 0.844, "f": 0}, {"x": 0.986, "y": -0.651, "c": "近傍", "n": "Sky High [H]  n=2453 cos0.99 難-0.65", "s": 0.8, "f": 0}, {"x": 0.986, "y": -0.801, "c": "近傍", "n": "Konzert V [H]  n=2416 cos0.99 難-0.80", "s": 0.787, "f": 0}, {"x": 0.989, "y": -0.322, "c": "近傍", "n": "Arabian Rave Night [H]  n=2707 cos0.99 難-0.32", "s": 0.882, "f": 0}, {"x": 0.991, "y": -0.267, "c": "近傍", "n": "Confiserie [H]  n=3058 cos0.99 難-0.27", "s": 0.997, "f": 0}, {"x": 0.985, "y": -0.576, "c": "近傍", "n": "Sphere [H]  n=1978 cos0.98 難-0.58", "s": 0.645, "f": 0}, {"x": 0.99, "y": -1.03, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1847 cos0.99 難-1.03", "s": 0.602, "f": 0}, {"x": 0.988, "y": -0.963, "c": "近傍", "n": "HYENA [H]  n=2377 cos0.99 難-0.96", "s": 0.775, "f": 0}, {"x": 0.987, "y": -0.321, "c": "近傍", "n": "キャトられ恋はモ～モク [H]  n=3044 cos0.99 難-0.32", "s": 0.992, "f": 0}, {"x": 0.985, "y": -0.84, "c": "近傍", "n": "Programmed World [H]  n=2074 cos0.98 難-0.84", "s": 0.676, "f": 0}, {"x": 0.986, "y": -0.402, "c": "近傍", "n": "デビルじゃないもん [A]  n=1758 cos0.99 難-0.40", "s": 0.573, "f": 0}, {"x": 0.989, "y": -0.249, "c": "近傍", "n": "QUANTUM TELEPORTATION [H]  n=2521 cos0.99 難-0.25", "s": 0.822, "f": 0}, {"x": 0.987, "y": -0.33, "c": "近傍", "n": "GAIA [H]  n=2875 cos0.99 難-0.33", "s": 0.937, "f": 0}, {"x": 0.983, "y": -0.579, "c": "近傍", "n": "KILL EACH OTHER [H]  n=2019 cos0.98 難-0.58", "s": 0.658, "f": 0}, {"x": 0.983, "y": -0.643, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2441 cos0.98 難-0.64", "s": 0.796, "f": 0}, {"x": 0.986, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.937, "f": 0}, {"x": 0.985, "y": -0.38, "c": "近傍", "n": "Saturn [H]  n=2297 cos0.98 難-0.38", "s": 0.749, "f": 0}, {"x": 0.984, "y": -0.384, "c": "近傍", "n": "Zirkfied [H]  n=2984 cos0.98 難-0.38", "s": 0.973, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5911803745919815}, {"a": 0, "b": 2, "w": 0.12048693132843624}, {"a": 0, "b": 3, "w": 0.18118712108013846}, {"a": 0, "b": 4, "w": 0.2544466414296418}, {"a": 0, "b": 5, "w": 0.1985436993015247}, {"a": 0, "b": 6, "w": 0.3700587560659595}, {"a": 0, "b": 7, "w": 0.44417474427695713}, {"a": 0, "b": 8, "w": 0.14806868396646877}, {"a": 0, "b": 9, "w": 0.429841242627084}, {"a": 0, "b": 10, "w": 0.2611551818980904}, {"a": 0, "b": 11, "w": 0.33864736264464335}, {"a": 0, "b": 12, "w": 3.502753642692369e-11}, {"a": 0, "b": 13, "w": 0.30753671939957083}, {"a": 0, "b": 14, "w": 0.28369750817796435}, {"a": 0, "b": 15, "w": 0.29167965091733905}, {"a": 0, "b": 16, "w": 0.23021404339880736}, {"a": 0, "b": 17, "w": 0.19504373173723255}, {"a": 0, "b": 18, "w": 0.2140945565016884}, {"a": 0, "b": 19, "w": 0.13241025409902196}, {"a": 0, "b": 20, "w": 0.11784880890726179}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.092,hiY=-0.187;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
