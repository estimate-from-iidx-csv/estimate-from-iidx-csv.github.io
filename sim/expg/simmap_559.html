<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">symbolic [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.849, "c": "種", "n": "symbolic [H]  n=1603 cos1.00 難-0.85", "s": 0.51, "f": 0}, {"x": 0.988, "y": -0.761, "c": "近傍", "n": "Rise'n Beauty [H]  n=1911 cos0.99 難-0.76", "s": 0.608, "f": 0}, {"x": 0.988, "y": -0.955, "c": "近傍", "n": "Violet Rose [H]  n=1475 cos0.99 難-0.96", "s": 0.469, "f": 0}, {"x": 0.986, "y": -0.851, "c": "近傍", "n": "ZERO-ONE [H]  n=1902 cos0.99 難-0.85", "s": 0.605, "f": 0}, {"x": 0.988, "y": -0.683, "c": "近傍", "n": "abstract [H]  n=1823 cos0.99 難-0.68", "s": 0.58, "f": 0}, {"x": 0.986, "y": -0.862, "c": "近傍", "n": "Votum stellarum [H]  n=1927 cos0.99 難-0.86", "s": 0.613, "f": 0}, {"x": 0.986, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.588, "f": 0}, {"x": 0.99, "y": -0.603, "c": "近傍", "n": "SOLITON BEAM [H]  n=1730 cos0.99 難-0.60", "s": 0.55, "f": 0}, {"x": 0.986, "y": -0.821, "c": "近傍", "n": "D.C.fish [H]  n=1811 cos0.99 難-0.82", "s": 0.576, "f": 0}, {"x": 0.986, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos0.99 難-0.71", "s": 0.726, "f": 0}, {"x": 0.986, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos0.99 難-0.74", "s": 0.653, "f": 0}, {"x": 0.988, "y": -0.616, "c": "近傍", "n": "アストライアの双皿 [H]  n=2533 cos0.99 難-0.62", "s": 0.806, "f": 0}, {"x": 0.985, "y": -0.866, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2022 cos0.98 難-0.87", "s": 0.643, "f": 0}, {"x": 0.986, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.71, "f": 0}, {"x": 0.985, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos0.98 難-0.75", "s": 0.449, "f": 0}, {"x": 0.984, "y": -0.851, "c": "近傍", "n": "Giudecca [H]  n=1654 cos0.98 難-0.85", "s": 0.526, "f": 0}, {"x": 0.984, "y": -0.964, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1963 cos0.98 難-0.96", "s": 0.624, "f": 0}, {"x": 0.985, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos0.99 難-1.02", "s": 0.642, "f": 0}, {"x": 0.986, "y": -0.64, "c": "近傍", "n": "CaptivAte～誓い～ [H]  n=2183 cos0.99 難-0.64", "s": 0.694, "f": 0}, {"x": 0.984, "y": -0.781, "c": "近傍", "n": "Broken [H]  n=3144 cos0.98 難-0.78", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.98 難-0.92", "s": 0.616, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 4.9177661942678697e-11}, {"a": 0, "b": 2, "w": 0.2518547367387469}, {"a": 0, "b": 3, "w": 0.13596995851415494}, {"a": 0, "b": 4, "w": 0.06329180270126988}, {"a": 0, "b": 5, "w": 0.04787622015348991}, {"a": 0, "b": 6, "w": 0.1683121179165703}, {"a": 0, "b": 7, "w": 0.27431128258899073}, {"a": 0, "b": 8, "w": 0.17084329641557672}, {"a": 0, "b": 9, "w": 0.18838944524657097}, {"a": 0, "b": 10, "w": 0.09855937612643129}, {"a": 0, "b": 11, "w": 0.025130099549017126}, {"a": 0, "b": 12, "w": 0.1424861597209801}, {"a": 0, "b": 13, "w": 0.05260594023438436}, {"a": 0, "b": 14, "w": 0.15511742091719338}, {"a": 0, "b": 15, "w": 0.09826098565553532}, {"a": 0, "b": 16, "w": 0.08210204835787882}, {"a": 0, "b": 17, "w": 0.16533423263570868}, {"a": 0, "b": 18, "w": 0.18125880704831743}, {"a": 0, "b": 19, "w": 0.09398568282781727}, {"a": 0, "b": 20, "w": 0.10872042669364923}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.050,hiY=-0.570;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
