<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PARADISE LOST [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.725, "c": "種", "n": "PARADISE LOST [A]  n=2875 cos1.00 難1.72", "s": 0.87, "f": 0}, {"x": 0.996, "y": 1.471, "c": "近傍", "n": "ONIGOROSHI [A]  n=2733 cos1.00 難1.47", "s": 0.827, "f": 0}, {"x": 0.993, "y": 1.433, "c": "近傍", "n": "魅惑のYUMMYスイーツ [A]  n=2587 cos0.99 難1.43", "s": 0.783, "f": 0}, {"x": 0.99, "y": 1.886, "c": "近傍", "n": "Ignis†Irae [A]  n=2005 cos0.99 難1.89", "s": 0.607, "f": 0}, {"x": 0.987, "y": 1.503, "c": "近傍", "n": "Flamingo [A]  n=792 cos0.99 難1.50", "s": 0.24, "f": 0}, {"x": 0.987, "y": 1.501, "c": "近傍", "n": "烽火連天の刃 [A]  n=2073 cos0.99 難1.50", "s": 0.627, "f": 0}, {"x": 0.989, "y": 1.326, "c": "近傍", "n": "THE DAY OF JUBILATIONS [A]  n=3054 cos0.99 難1.33", "s": 0.924, "f": 0}, {"x": 0.986, "y": 1.468, "c": "近傍", "n": "Slipstream [A]  n=2977 cos0.99 難1.47", "s": 0.901, "f": 0}, {"x": 0.986, "y": 1.407, "c": "近傍", "n": "Drop Syndicate [A]  n=1336 cos0.99 難1.41", "s": 0.404, "f": 0}, {"x": 0.992, "y": 1.188, "c": "近傍", "n": "ハイテックトキオ [L]  n=2023 cos0.99 難1.19", "s": 0.612, "f": 0}, {"x": 0.985, "y": 1.956, "c": "近傍", "n": "Everlasting Message [A]  n=2262 cos0.98 難1.96", "s": 0.684, "f": 0}, {"x": 0.984, "y": 1.81, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1603 cos0.98 難1.81", "s": 0.485, "f": 0}, {"x": 0.983, "y": 1.779, "c": "近傍", "n": "LOCUS OF THE TRAVEL [A]  n=2101 cos0.98 難1.78", "s": 0.636, "f": 0}, {"x": 0.985, "y": 1.395, "c": "近傍", "n": "Welcome [L]  n=2738 cos0.99 難1.39", "s": 0.828, "f": 0}, {"x": 0.991, "y": 1.154, "c": "近傍", "n": "DIVINE JUDGEMENT [A]  n=1308 cos0.99 難1.15", "s": 0.396, "f": 0}, {"x": 0.982, "y": 1.61, "c": "近傍", "n": "Cross Fire [A]  n=946 cos0.98 難1.61", "s": 0.286, "f": 0}, {"x": 0.983, "y": 1.982, "c": "近傍", "n": "Carmina [A]  n=2515 cos0.98 難1.98", "s": 0.761, "f": 0}, {"x": 0.983, "y": 1.394, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [A]  n=2582 cos0.98 難1.39", "s": 0.781, "f": 0}, {"x": 0.983, "y": 1.439, "c": "近傍", "n": "Flashes [A]  n=3305 cos0.98 難1.44", "s": 1.0, "f": 0}, {"x": 0.981, "y": 1.681, "c": "近傍", "n": "COSMIC RAY [A]  n=1983 cos0.98 難1.68", "s": 0.6, "f": 0}, {"x": 0.991, "y": 1.092, "c": "近傍", "n": "Out of Control [A]  n=1755 cos0.99 難1.09", "s": 0.531, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6021291030230826}, {"a": 0, "b": 2, "w": 0.5624657540142477}, {"a": 0, "b": 3, "w": 0.37320808018376384}, {"a": 0, "b": 4, "w": 0.41965355612194744}, {"a": 0, "b": 5, "w": 0.40590901904964494}, {"a": 0, "b": 6, "w": 0.453680916571929}, {"a": 0, "b": 7, "w": 0.3809535182926369}, {"a": 0, "b": 8, "w": 0.2845207833450597}, {"a": 0, "b": 9, "w": 0.36239375273425734}, {"a": 0, "b": 10, "w": 2.3839374918566136e-11}, {"a": 0, "b": 11, "w": 0.3245363464656976}, {"a": 0, "b": 12, "w": 0.19252084501999134}, {"a": 0, "b": 13, "w": 0.3668294920008094}, {"a": 0, "b": 14, "w": 0.4947630777790508}, {"a": 0, "b": 15, "w": 0.3000221335719543}, {"a": 0, "b": 16, "w": 0.05702756268542186}, {"a": 0, "b": 17, "w": 0.3313653999016667}, {"a": 0, "b": 18, "w": 0.3177086162180953}, {"a": 0, "b": 19, "w": 0.2668430073653417}, {"a": 0, "b": 20, "w": 0.3816373211070869}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=1.021,hiY=2.053;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
