<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Fiery Stallion [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.069, "c": "種", "n": "Fiery Stallion [A]  n=1574 cos1.00 難0.07", "s": 0.417, "f": 0}, {"x": 0.992, "y": 0.082, "c": "近傍", "n": "Elisha [A]  n=3765 cos0.99 難0.08", "s": 0.998, "f": 0}, {"x": 0.987, "y": -0.148, "c": "近傍", "n": "AWA AWA [A]  n=1494 cos0.99 難-0.15", "s": 0.396, "f": 0}, {"x": 0.988, "y": -0.223, "c": "近傍", "n": "Arcanos [A]  n=1239 cos0.99 難-0.22", "s": 0.328, "f": 0}, {"x": 0.985, "y": 0.091, "c": "近傍", "n": "ラストセンチュリーメランコリック [A]  n=3088 cos0.98 難0.09", "s": 0.819, "f": 0}, {"x": 0.99, "y": 0.46, "c": "近傍", "n": "Souhait bleu [A]  n=2364 cos0.99 難0.46", "s": 0.627, "f": 0}, {"x": 0.984, "y": -0.12, "c": "近傍", "n": "えだまめカレークッキング [A]  n=1606 cos0.98 難-0.12", "s": 0.426, "f": 0}, {"x": 0.984, "y": -0.213, "c": "近傍", "n": "流桜ノ門 [A]  n=1823 cos0.98 難-0.21", "s": 0.483, "f": 0}, {"x": 0.984, "y": -0.184, "c": "近傍", "n": "smooooch・∀・ (Snail's House Remix) [A]  n=2445 cos0.98 難-0.18", "s": 0.648, "f": 0}, {"x": 0.982, "y": -0.006, "c": "近傍", "n": "MIRACLE MEETS [A]  n=3772 cos0.98 難-0.01", "s": 1.0, "f": 0}, {"x": 0.983, "y": 0.31, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1760 cos0.98 難0.31", "s": 0.467, "f": 0}, {"x": 0.98, "y": 0.112, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3589 cos0.98 難0.11", "s": 0.951, "f": 0}, {"x": 0.984, "y": -0.367, "c": "近傍", "n": "VALLIS-NERIA [H]  n=2998 cos0.98 難-0.37", "s": 0.795, "f": 0}, {"x": 0.985, "y": -0.42, "c": "近傍", "n": "Forgetting Machine [A]  n=2207 cos0.99 難-0.42", "s": 0.585, "f": 0}, {"x": 0.978, "y": 0.139, "c": "近傍", "n": "Sparkle Smilin' [A]  n=2647 cos0.98 難0.14", "s": 0.702, "f": 0}, {"x": 0.978, "y": -0.093, "c": "近傍", "n": "十六夜セツナ [A]  n=3344 cos0.98 難-0.09", "s": 0.887, "f": 0}, {"x": 0.977, "y": 0.156, "c": "近傍", "n": "眠りの国のステラ [A]  n=2538 cos0.98 難0.16", "s": 0.673, "f": 0}, {"x": 0.981, "y": -0.354, "c": "近傍", "n": "Valanga [H]  n=2996 cos0.98 難-0.35", "s": 0.794, "f": 0}, {"x": 0.984, "y": -0.493, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3114 cos0.98 難-0.49", "s": 0.826, "f": 0}, {"x": 0.978, "y": -0.25, "c": "近傍", "n": "Damage Per Second [A]  n=2881 cos0.98 難-0.25", "s": 0.764, "f": 0}, {"x": 0.979, "y": -0.311, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1118 cos0.98 難-0.31", "s": 0.296, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4947488922862483}, {"a": 0, "b": 2, "w": 0.1924987982791747}, {"a": 0, "b": 3, "w": 0.2690934540275639}, {"a": 0, "b": 4, "w": 0.2939260779460211}, {"a": 0, "b": 5, "w": 0.3782839350329449}, {"a": 0, "b": 6, "w": 0.24235081572007933}, {"a": 0, "b": 7, "w": 0.2810721954431472}, {"a": 0, "b": 8, "w": 0.14179696035889988}, {"a": 0, "b": 9, "w": 0.2454662092295723}, {"a": 0, "b": 10, "w": 0.25247219863319803}, {"a": 0, "b": 11, "w": 0.21770721890290745}, {"a": 0, "b": 12, "w": 0.1781058980117174}, {"a": 0, "b": 13, "w": 0.08280333191718448}, {"a": 0, "b": 14, "w": 0.1673804720140506}, {"a": 0, "b": 15, "w": 0.15111397450813457}, {"a": 0, "b": 16, "w": 0.15699706242139222}, {"a": 0, "b": 17, "w": 0.12280482394640813}, {"a": 0, "b": 18, "w": 0.06403311564400427}, {"a": 0, "b": 19, "w": 3.427469419392537e-11}, {"a": 0, "b": 20, "w": 0.08459544267000751}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-0.569,hiY=0.536;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
