<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Inferno of Fomalhaut [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.149, "c": "種", "n": "Inferno of Fomalhaut [H]  n=1772 cos1.00 難-1.15", "s": 0.733, "f": 0}, {"x": 0.995, "y": -1.067, "c": "近傍", "n": "Illegal Function Call [H]  n=2004 cos1.00 難-1.07", "s": 0.829, "f": 0}, {"x": 0.995, "y": -1.247, "c": "近傍", "n": "Arca [H]  n=1544 cos1.00 難-1.25", "s": 0.639, "f": 0}, {"x": 0.992, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.923, "f": 0}, {"x": 0.99, "y": -1.221, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [H]  n=1436 cos0.99 難-1.22", "s": 0.594, "f": 0}, {"x": 0.989, "y": -1.203, "c": "近傍", "n": "Realize Maze [H]  n=1572 cos0.99 難-1.20", "s": 0.651, "f": 0}, {"x": 0.991, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos0.99 難-1.29", "s": 0.647, "f": 0}, {"x": 0.989, "y": -1.05, "c": "近傍", "n": "TIEFSEE [H]  n=2153 cos0.99 難-1.05", "s": 0.891, "f": 0}, {"x": 0.991, "y": -1.318, "c": "近傍", "n": "SCHWARZSCHILD FIELD [H]  n=1539 cos0.99 難-1.32", "s": 0.637, "f": 0}, {"x": 0.992, "y": -0.955, "c": "近傍", "n": "君のハートにロックオン [H]  n=2143 cos0.99 難-0.95", "s": 0.887, "f": 0}, {"x": 0.99, "y": -1.288, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1634 cos0.99 難-1.29", "s": 0.676, "f": 0}, {"x": 0.988, "y": -1.05, "c": "近傍", "n": "Angel's Ladder [H]  n=1645 cos0.99 難-1.05", "s": 0.681, "f": 0}, {"x": 0.992, "y": -1.353, "c": "近傍", "n": "セロトニン [H]  n=1489 cos0.99 難-1.35", "s": 0.616, "f": 0}, {"x": 0.991, "y": -1.344, "c": "近傍", "n": "量子の海のリントヴルム [H]  n=2282 cos0.99 難-1.34", "s": 0.945, "f": 0}, {"x": 0.988, "y": -1.067, "c": "近傍", "n": "刃図羅 [H]  n=2177 cos0.99 難-1.07", "s": 0.901, "f": 0}, {"x": 0.987, "y": -1.115, "c": "近傍", "n": "Silver Bullet [H]  n=1434 cos0.99 難-1.11", "s": 0.594, "f": 0}, {"x": 0.991, "y": -1.343, "c": "近傍", "n": "RAIN [H]  n=1516 cos0.99 難-1.34", "s": 0.627, "f": 0}, {"x": 0.989, "y": -0.995, "c": "近傍", "n": "UMMU [H]  n=2416 cos0.99 難-0.99", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.964, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1963 cos0.99 難-0.96", "s": 0.812, "f": 0}, {"x": 0.987, "y": -1.229, "c": "近傍", "n": "明鏡止水 [H]  n=1440 cos0.99 難-1.23", "s": 0.596, "f": 0}, {"x": 0.988, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos0.99 難-1.02", "s": 0.835, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1382478997065083}, {"a": 0, "b": 2, "w": 0.27641536029540736}, {"a": 0, "b": 3, "w": 0.1710207218319686}, {"a": 0, "b": 4, "w": 0.2684652260316711}, {"a": 0, "b": 5, "w": 0.204427594556281}, {"a": 0, "b": 6, "w": 0.2903859578680966}, {"a": 0, "b": 7, "w": 0.19321647198930247}, {"a": 0, "b": 8, "w": 0.2812303766783063}, {"a": 0, "b": 9, "w": 5.3296922430945415e-11}, {"a": 0, "b": 10, "w": 0.2478890374174213}, {"a": 0, "b": 11, "w": 0.1913186854736979}, {"a": 0, "b": 12, "w": 0.2981714103001323}, {"a": 0, "b": 13, "w": 0.13470381049597602}, {"a": 0, "b": 14, "w": 0.18931445929068735}, {"a": 0, "b": 15, "w": 0.1700656766050752}, {"a": 0, "b": 16, "w": 0.2747201668173611}, {"a": 0, "b": 17, "w": 0.13691889771529975}, {"a": 0, "b": 18, "w": 0.18642992006955073}, {"a": 0, "b": 19, "w": 0.0997242940863281}, {"a": 0, "b": 20, "w": 0.20475712972061633}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.384,hiY=-0.923;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
