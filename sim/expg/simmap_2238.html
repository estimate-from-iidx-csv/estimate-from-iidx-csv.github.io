<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Yellow Sketch(RX-Ver.S.P.L.) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.4, "c": "種", "n": "Yellow Sketch(RX-Ver.S.P.L.) [A]  n=3064 cos1.00 難0.40", "s": 0.836, "f": 0}, {"x": 0.997, "y": 0.432, "c": "近傍", "n": "Xepher [A]  n=3664 cos1.00 難0.43", "s": 1.0, "f": 0}, {"x": 0.997, "y": 0.318, "c": "近傍", "n": "Take My Life [A]  n=3355 cos1.00 難0.32", "s": 0.916, "f": 0}, {"x": 0.996, "y": 0.317, "c": "近傍", "n": "Arabian Rave Night [A]  n=3450 cos1.00 難0.32", "s": 0.942, "f": 0}, {"x": 0.995, "y": 0.347, "c": "近傍", "n": "20XX [A]  n=1761 cos1.00 難0.35", "s": 0.481, "f": 0}, {"x": 0.995, "y": 0.494, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2932 cos1.00 難0.49", "s": 0.8, "f": 0}, {"x": 0.995, "y": 0.311, "c": "近傍", "n": "xenon [A]  n=3544 cos0.99 難0.31", "s": 0.967, "f": 0}, {"x": 0.995, "y": 0.31, "c": "近傍", "n": "State Of The Art [A]  n=2943 cos0.99 難0.31", "s": 0.803, "f": 0}, {"x": 0.996, "y": 0.549, "c": "近傍", "n": "rumrum triplets [A]  n=3300 cos1.00 難0.55", "s": 0.901, "f": 0}, {"x": 0.995, "y": 0.253, "c": "近傍", "n": "ZED [A]  n=3484 cos1.00 難0.25", "s": 0.951, "f": 0}, {"x": 0.994, "y": 0.473, "c": "近傍", "n": "CONCEPTUAL [A]  n=3290 cos0.99 難0.47", "s": 0.898, "f": 0}, {"x": 0.994, "y": 0.287, "c": "近傍", "n": "Ypsilon [A]  n=2808 cos0.99 難0.29", "s": 0.766, "f": 0}, {"x": 0.993, "y": 0.46, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2732 cos0.99 難0.46", "s": 0.746, "f": 0}, {"x": 0.993, "y": 0.366, "c": "近傍", "n": "ZEPHYRANTHES [A]  n=3388 cos0.99 難0.37", "s": 0.925, "f": 0}, {"x": 0.992, "y": 0.378, "c": "近傍", "n": "Rock It [A]  n=3332 cos0.99 難0.38", "s": 0.909, "f": 0}, {"x": 0.992, "y": 0.407, "c": "近傍", "n": "INAZUMA [A]  n=3445 cos0.99 難0.41", "s": 0.94, "f": 0}, {"x": 0.992, "y": 0.412, "c": "近傍", "n": "I Love You [A]  n=3128 cos0.99 難0.41", "s": 0.854, "f": 0}, {"x": 0.992, "y": 0.457, "c": "近傍", "n": "Light and Cyber… [A]  n=3252 cos0.99 難0.46", "s": 0.888, "f": 0}, {"x": 0.992, "y": 0.458, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3261 cos0.99 難0.46", "s": 0.89, "f": 0}, {"x": 0.995, "y": 0.607, "c": "近傍", "n": "禍根 [A]  n=3114 cos1.00 難0.61", "s": 0.85, "f": 0}, {"x": 0.992, "y": 0.301, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2636 cos0.99 難0.30", "s": 0.719, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46562680531674205}, {"a": 0, "b": 2, "w": 0.5130134429572298}, {"a": 0, "b": 3, "w": 0.3329438487068579}, {"a": 0, "b": 4, "w": 0.44158422113420026}, {"a": 0, "b": 5, "w": 0.2515790385228316}, {"a": 0, "b": 6, "w": 0.41788014092071446}, {"a": 0, "b": 7, "w": 0.4259866038953013}, {"a": 0, "b": 8, "w": 0.31021147063403365}, {"a": 0, "b": 9, "w": 0.43116189625165857}, {"a": 0, "b": 10, "w": 0.20935835762354993}, {"a": 0, "b": 11, "w": 0.3916006429729596}, {"a": 0, "b": 12, "w": 0.3538017361873863}, {"a": 0, "b": 13, "w": 0.3426629048481704}, {"a": 0, "b": 14, "w": 0.32045613556614616}, {"a": 0, "b": 15, "w": 0.23403645857623767}, {"a": 0, "b": 16, "w": 0.28564251058567547}, {"a": 0, "b": 17, "w": 4.684663768017572e-11}, {"a": 0, "b": 18, "w": 0.28968703489506353}, {"a": 0, "b": 19, "w": 0.4592914727066254}, {"a": 0, "b": 20, "w": 0.2573244060077674}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.224,hiY=0.635;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
