<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">龍王の霊廟(Mausoleum Of The Primal Dragon) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.254, "c": "種", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [A]  n=3379 cos1.00 難0.25", "s": 0.922, "f": 0}, {"x": 0.996, "y": 0.381, "c": "近傍", "n": "Around The Galaxy [A]  n=3227 cos1.00 難0.38", "s": 0.88, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "Time To Empress [L]  n=632 cos0.99 難0.27", "s": 0.172, "f": 0}, {"x": 0.994, "y": 0.272, "c": "近傍", "n": "Ember Lights [A]  n=3412 cos0.99 難0.27", "s": 0.931, "f": 0}, {"x": 0.995, "y": 0.134, "c": "近傍", "n": "V2 [H]  n=3342 cos0.99 難0.13", "s": 0.912, "f": 0}, {"x": 0.995, "y": 0.114, "c": "近傍", "n": "無意識のフィロソフィア [A]  n=2447 cos0.99 難0.11", "s": 0.667, "f": 0}, {"x": 0.993, "y": 0.103, "c": "近傍", "n": "Ambush Ace [A]  n=1732 cos0.99 難0.10", "s": 0.472, "f": 0}, {"x": 0.991, "y": 0.195, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1814 cos0.99 難0.19", "s": 0.495, "f": 0}, {"x": 0.992, "y": 0.389, "c": "近傍", "n": "ANDROMEDA [A]  n=3487 cos0.99 難0.39", "s": 0.951, "f": 0}, {"x": 0.991, "y": 0.283, "c": "近傍", "n": "Synergy For Angels [A]  n=3484 cos0.99 難0.28", "s": 0.95, "f": 0}, {"x": 0.993, "y": 0.085, "c": "近傍", "n": "X-ray binary [A]  n=2517 cos0.99 難0.08", "s": 0.687, "f": 0}, {"x": 0.992, "y": 0.382, "c": "近傍", "n": "ウツシミウツシ [A]  n=2334 cos0.99 難0.38", "s": 0.637, "f": 0}, {"x": 0.994, "y": 0.462, "c": "近傍", "n": "量子の海のリントヴルム [A]  n=3618 cos0.99 難0.46", "s": 0.987, "f": 0}, {"x": 0.99, "y": 0.331, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3653 cos0.99 難0.33", "s": 0.996, "f": 0}, {"x": 0.994, "y": 0.028, "c": "近傍", "n": "Danza Aestas [A]  n=2307 cos0.99 難0.03", "s": 0.629, "f": 0}, {"x": 0.991, "y": 0.11, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3164 cos0.99 難0.11", "s": 0.863, "f": 0}, {"x": 0.989, "y": 0.286, "c": "近傍", "n": "XANADU OF TWO [L]  n=731 cos0.99 難0.29", "s": 0.199, "f": 0}, {"x": 0.994, "y": 0.012, "c": "近傍", "n": "PILGRIM [A]  n=1295 cos0.99 難0.01", "s": 0.353, "f": 0}, {"x": 0.99, "y": 0.158, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1759 cos0.99 難0.16", "s": 0.48, "f": 0}, {"x": 0.989, "y": 0.369, "c": "近傍", "n": "LAST DAY [A]  n=2627 cos0.99 難0.37", "s": 0.717, "f": 0}, {"x": 0.988, "y": 0.285, "c": "近傍", "n": "龍と少女とデコヒーレンス [A]  n=3666 cos0.99 難0.28", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5401302751721204}, {"a": 0, "b": 2, "w": 0.2521242981000128}, {"a": 0, "b": 3, "w": 0.4249081187099597}, {"a": 0, "b": 4, "w": 0.4506202878512774}, {"a": 0, "b": 5, "w": 0.4119980043386229}, {"a": 0, "b": 6, "w": 0.3319069632568018}, {"a": 0, "b": 7, "w": 0.31311430098471416}, {"a": 0, "b": 8, "w": 0.2903912254680656}, {"a": 0, "b": 9, "w": 0.2949887762314113}, {"a": 0, "b": 10, "w": 0.3812056465005714}, {"a": 0, "b": 11, "w": 0.2380137586258697}, {"a": 0, "b": 12, "w": 0.3192225274185}, {"a": 0, "b": 13, "w": 0.18626677124741553}, {"a": 0, "b": 14, "w": 0.40753152122106096}, {"a": 0, "b": 15, "w": 0.3089893515790144}, {"a": 0, "b": 16, "w": 4.3392622828264393e-11}, {"a": 0, "b": 17, "w": 0.3723304993496558}, {"a": 0, "b": 18, "w": 0.22294242296196953}, {"a": 0, "b": 19, "w": 0.18577929979427588}, {"a": 0, "b": 20, "w": 0.17314419387912816}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.024,hiY=0.498;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
