<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Scripted Connection⇒ A mix [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.232, "c": "種", "n": "Scripted Connection⇒ A mix [A]  n=3521 cos1.00 難1.23", "s": 0.992, "f": 0}, {"x": 0.995, "y": 1.33, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3278 cos0.99 難1.33", "s": 0.923, "f": 0}, {"x": 0.995, "y": 1.354, "c": "近傍", "n": "MAX 360 [A]  n=1537 cos1.00 難1.35", "s": 0.433, "f": 0}, {"x": 0.989, "y": 1.331, "c": "近傍", "n": "ruin of opals [A]  n=2753 cos0.99 難1.33", "s": 0.775, "f": 0}, {"x": 0.988, "y": 1.288, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=729 cos0.99 難1.29", "s": 0.205, "f": 0}, {"x": 0.989, "y": 1.071, "c": "近傍", "n": "電人、暁に斃れる。 [A]  n=3507 cos0.99 難1.07", "s": 0.988, "f": 0}, {"x": 0.987, "y": 1.214, "c": "近傍", "n": "Last Dance [A]  n=3336 cos0.99 難1.21", "s": 0.94, "f": 0}, {"x": 0.986, "y": 1.21, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1195 cos0.99 難1.21", "s": 0.337, "f": 0}, {"x": 0.987, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.99 難1.12", "s": 0.958, "f": 0}, {"x": 0.987, "y": 1.354, "c": "近傍", "n": "Godspeed [A]  n=3311 cos0.99 難1.35", "s": 0.933, "f": 0}, {"x": 0.986, "y": 1.306, "c": "近傍", "n": "2 Be Continued [A]  n=949 cos0.99 難1.31", "s": 0.267, "f": 0}, {"x": 0.99, "y": 0.948, "c": "近傍", "n": "SpaceLand☆TOYBOX [A]  n=3550 cos0.99 難0.95", "s": 1.0, "f": 0}, {"x": 0.987, "y": 1.439, "c": "近傍", "n": "Session 9 -Chronicles- [A]  n=3080 cos0.99 難1.44", "s": 0.868, "f": 0}, {"x": 0.985, "y": 1.133, "c": "近傍", "n": "Sounds Of Summer [A]  n=3413 cos0.99 難1.13", "s": 0.961, "f": 0}, {"x": 0.984, "y": 1.254, "c": "近傍", "n": "Proof of the existence [A]  n=3386 cos0.98 難1.25", "s": 0.954, "f": 0}, {"x": 0.984, "y": 1.211, "c": "近傍", "n": "innocent revolver [A]  n=2541 cos0.98 難1.21", "s": 0.716, "f": 0}, {"x": 0.985, "y": 1.103, "c": "近傍", "n": "dAuntl3ss [A]  n=3294 cos0.98 難1.10", "s": 0.928, "f": 0}, {"x": 0.984, "y": 1.181, "c": "近傍", "n": "トリカゴノ鳳凰 [A]  n=3391 cos0.98 難1.18", "s": 0.955, "f": 0}, {"x": 0.983, "y": 1.327, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3027 cos0.98 難1.33", "s": 0.853, "f": 0}, {"x": 0.983, "y": 1.163, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3269 cos0.98 難1.16", "s": 0.921, "f": 0}, {"x": 0.983, "y": 1.288, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3069 cos0.98 難1.29", "s": 0.865, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46110232328580125}, {"a": 0, "b": 2, "w": 0.4896372192305096}, {"a": 0, "b": 3, "w": 0.35684447210336223}, {"a": 0, "b": 4, "w": 0.22745046633536448}, {"a": 0, "b": 5, "w": 0.4563223686522099}, {"a": 0, "b": 6, "w": 0.35720392440697013}, {"a": 0, "b": 7, "w": 0.31002105157093174}, {"a": 0, "b": 8, "w": 0.3948464356973409}, {"a": 0, "b": 9, "w": 0.18929129012557533}, {"a": 0, "b": 10, "w": 2.7540303371154096e-11}, {"a": 0, "b": 11, "w": 0.4918852610845994}, {"a": 0, "b": 12, "w": 0.00019048398203558303}, {"a": 0, "b": 13, "w": 0.29604126342958315}, {"a": 0, "b": 14, "w": 0.2792297050061785}, {"a": 0, "b": 15, "w": 0.1268111593456227}, {"a": 0, "b": 16, "w": 0.3326418310520567}, {"a": 0, "b": 17, "w": 0.2092937871536963}, {"a": 0, "b": 18, "w": 0.19737879449518092}, {"a": 0, "b": 19, "w": 0.2599616373892214}, {"a": 0, "b": 20, "w": 0.24675346285579913}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.909,hiY=1.478;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
