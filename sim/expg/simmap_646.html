<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">パ→ピ→プ→Yeah! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.229, "c": "種", "n": "パ→ピ→プ→Yeah! [H]  n=2309 cos1.00 難-1.23", "s": 0.819, "f": 0}, {"x": 0.99, "y": -1.343, "c": "近傍", "n": "RAIN [H]  n=1516 cos0.99 難-1.34", "s": 0.538, "f": 0}, {"x": 0.99, "y": -1.437, "c": "近傍", "n": "Discloze [H]  n=1377 cos0.99 難-1.44", "s": 0.488, "f": 0}, {"x": 0.986, "y": -1.185, "c": "近傍", "n": "鬼天 [H]  n=1571 cos0.99 難-1.18", "s": 0.557, "f": 0}, {"x": 0.989, "y": -1.431, "c": "近傍", "n": "Playing With Fire [H]  n=1043 cos0.99 難-1.43", "s": 0.37, "f": 0}, {"x": 0.986, "y": -1.288, "c": "近傍", "n": "Meissa [H]  n=920 cos0.99 難-1.29", "s": 0.326, "f": 0}, {"x": 0.991, "y": -0.97, "c": "近傍", "n": "Godspeed [H]  n=2819 cos0.99 難-0.97", "s": 1.0, "f": 0}, {"x": 0.984, "y": -1.234, "c": "近傍", "n": "Slipstream [H]  n=1473 cos0.98 難-1.23", "s": 0.523, "f": 0}, {"x": 0.984, "y": -1.232, "c": "近傍", "n": "NOIXIA [H]  n=928 cos0.98 難-1.23", "s": 0.329, "f": 0}, {"x": 0.984, "y": -1.104, "c": "近傍", "n": "ruin of opals [H]  n=1544 cos0.98 難-1.10", "s": 0.548, "f": 0}, {"x": 0.984, "y": -1.353, "c": "近傍", "n": "セロトニン [H]  n=1489 cos0.98 難-1.35", "s": 0.528, "f": 0}, {"x": 0.984, "y": -1.337, "c": "近傍", "n": "Ghost Pulse [H]  n=820 cos0.98 難-1.34", "s": 0.291, "f": 0}, {"x": 0.986, "y": -1.427, "c": "近傍", "n": "Amazing Mirage [H]  n=1854 cos0.99 難-1.43", "s": 0.658, "f": 0}, {"x": 0.985, "y": -1.432, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.99 難-1.43", "s": 0.355, "f": 0}, {"x": 0.985, "y": -1.429, "c": "近傍", "n": "Ember Lights [H]  n=1574 cos0.98 難-1.43", "s": 0.558, "f": 0}, {"x": 0.982, "y": -1.229, "c": "近傍", "n": "明鏡止水 [H]  n=1440 cos0.98 難-1.23", "s": 0.511, "f": 0}, {"x": 0.984, "y": -1.373, "c": "近傍", "n": "Back Spin Sweeper [H]  n=1432 cos0.98 難-1.37", "s": 0.508, "f": 0}, {"x": 0.983, "y": -1.135, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1643 cos0.98 難-1.13", "s": 0.583, "f": 0}, {"x": 0.982, "y": -1.292, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1349 cos0.98 難-1.29", "s": 0.479, "f": 0}, {"x": 0.982, "y": -1.288, "c": "近傍", "n": "No Border [H]  n=1428 cos0.98 難-1.29", "s": 0.507, "f": 0}, {"x": 0.982, "y": -1.294, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.98 難-1.29", "s": 0.558, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3765914334219008}, {"a": 0, "b": 2, "w": 0.37192457986692495}, {"a": 0, "b": 3, "w": 0.14824003770207506}, {"a": 0, "b": 4, "w": 0.3057806630586225}, {"a": 0, "b": 5, "w": 0.26666731708607194}, {"a": 0, "b": 6, "w": 0.2717241317300054}, {"a": 0, "b": 7, "w": 0.12050073593572863}, {"a": 0, "b": 8, "w": 4.585687385372239e-11}, {"a": 0, "b": 9, "w": 0.13447135686157186}, {"a": 0, "b": 10, "w": 0.23903983853566468}, {"a": 0, "b": 11, "w": 0.15590558821564282}, {"a": 0, "b": 12, "w": 0.26421478381339236}, {"a": 0, "b": 13, "w": 0.2507385284728514}, {"a": 0, "b": 14, "w": 0.2327829148381041}, {"a": 0, "b": 15, "w": 0.18491062389453417}, {"a": 0, "b": 16, "w": 0.2192316444125597}, {"a": 0, "b": 17, "w": 0.1616962234895768}, {"a": 0, "b": 18, "w": 0.1896659262940127}, {"a": 0, "b": 19, "w": 0.18898131739762525}, {"a": 0, "b": 20, "w": 0.09621737112849904}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.474,hiY=-0.933;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
