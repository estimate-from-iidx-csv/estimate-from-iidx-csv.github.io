<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Donkey Donk [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.43, "c": "種", "n": "Donkey Donk [H]  n=1722 cos1.00 難-1.43", "s": 0.878, "f": 0}, {"x": 0.992, "y": -1.373, "c": "近傍", "n": "Back Spin Sweeper [H]  n=1432 cos0.99 難-1.37", "s": 0.73, "f": 0}, {"x": 0.991, "y": -1.477, "c": "近傍", "n": "Dawn Saga [H]  n=1268 cos0.99 難-1.48", "s": 0.646, "f": 0}, {"x": 0.988, "y": -1.409, "c": "近傍", "n": "BEAT PRISONER [H]  n=1422 cos0.99 難-1.41", "s": 0.725, "f": 0}, {"x": 0.986, "y": -1.482, "c": "近傍", "n": "Vitrum [H]  n=1210 cos0.99 難-1.48", "s": 0.617, "f": 0}, {"x": 0.993, "y": -1.638, "c": "近傍", "n": "神のシナリオ [H]  n=663 cos0.99 難-1.64", "s": 0.338, "f": 0}, {"x": 0.986, "y": -1.432, "c": "近傍", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos0.99 難-1.43", "s": 0.51, "f": 0}, {"x": 0.986, "y": -1.366, "c": "近傍", "n": "Drop Syndicate [H]  n=712 cos0.99 難-1.37", "s": 0.363, "f": 0}, {"x": 0.982, "y": -1.473, "c": "近傍", "n": "Abraxas [H]  n=1531 cos0.98 難-1.47", "s": 0.78, "f": 0}, {"x": 0.995, "y": -1.122, "c": "近傍", "n": "Reflux [H]  n=1962 cos0.99 難-1.12", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.232, "c": "近傍", "n": "NOIXIA [H]  n=928 cos0.99 難-1.23", "s": 0.473, "f": 0}, {"x": 0.982, "y": -1.603, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.98 難-1.60", "s": 0.567, "f": 0}, {"x": 0.979, "y": -1.431, "c": "近傍", "n": "Playing With Fire [H]  n=1043 cos0.98 難-1.43", "s": 0.532, "f": 0}, {"x": 0.982, "y": -1.234, "c": "近傍", "n": "Slipstream [H]  n=1473 cos0.98 難-1.23", "s": 0.751, "f": 0}, {"x": 0.978, "y": -1.419, "c": "近傍", "n": "Usual Days-remix [H]  n=1248 cos0.98 難-1.42", "s": 0.636, "f": 0}, {"x": 0.978, "y": -1.483, "c": "近傍", "n": "Sirius [H]  n=510 cos0.98 難-1.48", "s": 0.26, "f": 0}, {"x": 0.981, "y": -1.221, "c": "近傍", "n": "ASIAN VIRTUAL REALITIES (MELTING TOGETHER IN DAZZLING DARKNESS) [H]  n=1436 cos0.98 難-1.22", "s": 0.732, "f": 0}, {"x": 0.982, "y": -1.673, "c": "近傍", "n": "Zenith [H]  n=749 cos0.98 難-1.67", "s": 0.382, "f": 0}, {"x": 0.977, "y": -1.437, "c": "近傍", "n": "Discloze [H]  n=1377 cos0.98 難-1.44", "s": 0.702, "f": 0}, {"x": 0.978, "y": -1.337, "c": "近傍", "n": "Ghost Pulse [H]  n=820 cos0.98 難-1.34", "s": 0.418, "f": 0}, {"x": 0.977, "y": -1.511, "c": "近傍", "n": "Static State [H]  n=1084 cos0.98 難-1.51", "s": 0.552, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4414824966391846}, {"a": 0, "b": 2, "w": 0.33042715472339834}, {"a": 0, "b": 3, "w": 0.3641232005871564}, {"a": 0, "b": 4, "w": 0.21562454885965932}, {"a": 0, "b": 5, "w": 0.4888103312503117}, {"a": 0, "b": 6, "w": 0.2543972677965747}, {"a": 0, "b": 7, "w": 0.37691330733244255}, {"a": 0, "b": 8, "w": 0.24456641290228598}, {"a": 0, "b": 9, "w": 0.567790418310819}, {"a": 0, "b": 10, "w": 0.36772556286942626}, {"a": 0, "b": 11, "w": 0.2306351570635783}, {"a": 0, "b": 12, "w": 0.2649371130330441}, {"a": 0, "b": 13, "w": 0.32344846346623046}, {"a": 0, "b": 14, "w": 3.442834906053349e-11}, {"a": 0, "b": 15, "w": 0.214110942219352}, {"a": 0, "b": 16, "w": 0.2870310654828637}, {"a": 0, "b": 17, "w": 0.2411156999062496}, {"a": 0, "b": 18, "w": 0.13588023583252817}, {"a": 0, "b": 19, "w": 0.24756374968933903}, {"a": 0, "b": 20, "w": 0.2036421315160024}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.975,hiX=1.002,loY=-1.717,hiY=-1.078;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
