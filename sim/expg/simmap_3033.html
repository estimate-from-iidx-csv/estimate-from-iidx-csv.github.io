<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">色を喪った街 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.908, "c": "種", "n": "色を喪った街 [A]  n=615 cos1.00 難1.91", "s": 0.2, "f": 0}, {"x": 0.987, "y": 1.782, "c": "近傍", "n": "シムルグの目醒め [A]  n=2835 cos0.99 難1.78", "s": 0.923, "f": 0}, {"x": 0.984, "y": 1.916, "c": "近傍", "n": "Ambivalent Vermilia [A]  n=1149 cos0.98 難1.92", "s": 0.374, "f": 0}, {"x": 0.985, "y": 1.982, "c": "近傍", "n": "Carmina [A]  n=2515 cos0.98 難1.98", "s": 0.819, "f": 0}, {"x": 0.984, "y": 1.946, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [L]  n=1796 cos0.98 難1.95", "s": 0.585, "f": 0}, {"x": 0.983, "y": 1.919, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2214 cos0.98 難1.92", "s": 0.721, "f": 0}, {"x": 0.984, "y": 2.012, "c": "近傍", "n": "3y3s [A]  n=3071 cos0.98 難2.01", "s": 1.0, "f": 0}, {"x": 0.983, "y": 1.827, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [A]  n=2942 cos0.98 難1.83", "s": 0.958, "f": 0}, {"x": 0.984, "y": 1.741, "c": "近傍", "n": "二人ノ廃城幽踊宴 [A]  n=1944 cos0.98 難1.74", "s": 0.633, "f": 0}, {"x": 0.986, "y": 1.657, "c": "近傍", "n": "POLKAMANIA [L]  n=812 cos0.99 難1.66", "s": 0.264, "f": 0}, {"x": 0.982, "y": 1.92, "c": "近傍", "n": "Confiserie [A]  n=2899 cos0.98 難1.92", "s": 0.944, "f": 0}, {"x": 0.982, "y": 1.81, "c": "近傍", "n": "LOUDER ROLLING THUNDER [A]  n=1603 cos0.98 難1.81", "s": 0.522, "f": 0}, {"x": 0.984, "y": 1.708, "c": "近傍", "n": "KAISER PHOENIX [A]  n=2965 cos0.98 難1.71", "s": 0.965, "f": 0}, {"x": 0.982, "y": 1.98, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1161 cos0.98 難1.98", "s": 0.378, "f": 0}, {"x": 0.985, "y": 1.638, "c": "近傍", "n": "華麗なる大犬円舞曲 [A]  n=2634 cos0.99 難1.64", "s": 0.858, "f": 0}, {"x": 0.985, "y": 1.6, "c": "近傍", "n": "Artist [A]  n=2457 cos0.99 難1.60", "s": 0.8, "f": 0}, {"x": 0.983, "y": 2.167, "c": "近傍", "n": "X-DEN [A]  n=2327 cos0.98 難2.17", "s": 0.758, "f": 0}, {"x": 0.983, "y": 2.154, "c": "近傍", "n": "Beyond Evolution [A]  n=1460 cos0.98 難2.15", "s": 0.475, "f": 0}, {"x": 0.979, "y": 1.962, "c": "近傍", "n": "hard-wired [A]  n=1621 cos0.98 難1.96", "s": 0.528, "f": 0}, {"x": 0.983, "y": 1.602, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2716 cos0.98 難1.60", "s": 0.884, "f": 0}, {"x": 0.981, "y": 1.684, "c": "近傍", "n": "255 [A]  n=3006 cos0.98 難1.68", "s": 0.979, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3019300904137058}, {"a": 0, "b": 2, "w": 0.37395149660823135}, {"a": 0, "b": 3, "w": 0.3729838569388483}, {"a": 0, "b": 4, "w": 0.3413604348381516}, {"a": 0, "b": 5, "w": 0.28600220589211944}, {"a": 0, "b": 6, "w": 0.35223279371064886}, {"a": 0, "b": 7, "w": 0.3449786984026527}, {"a": 0, "b": 8, "w": 0.1965911904150699}, {"a": 0, "b": 9, "w": 0.32404098623834665}, {"a": 0, "b": 10, "w": 0.3206468969973838}, {"a": 0, "b": 11, "w": 0.2476142386317326}, {"a": 0, "b": 12, "w": 0.2501413541388795}, {"a": 0, "b": 13, "w": 0.31324313475073307}, {"a": 0, "b": 14, "w": 0.33936053707939406}, {"a": 0, "b": 15, "w": 0.2586828087768631}, {"a": 0, "b": 16, "w": 1.99461558381131e-11}, {"a": 0, "b": 17, "w": 0.1099892404835201}, {"a": 0, "b": 18, "w": 0.28334224489669135}, {"a": 0, "b": 19, "w": 0.17994842982819648}, {"a": 0, "b": 20, "w": 0.21888538433763094}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=1.555,hiY=2.212;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
