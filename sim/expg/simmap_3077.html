<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CaptivAte～浄化～ [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.225, "c": "種", "n": "CaptivAte～浄化～ [L]  n=942 cos1.00 難1.23", "s": 0.27, "f": 0}, {"x": 0.991, "y": 1.237, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [A]  n=3483 cos0.99 難1.24", "s": 1.0, "f": 0}, {"x": 0.993, "y": 1.364, "c": "近傍", "n": "THE DEEP STRIKER [L]  n=2924 cos0.99 難1.36", "s": 0.84, "f": 0}, {"x": 0.989, "y": 1.281, "c": "近傍", "n": "Cosmic Cat [L]  n=3124 cos0.99 難1.28", "s": 0.897, "f": 0}, {"x": 0.988, "y": 1.291, "c": "近傍", "n": "KILL EACH OTHER [A]  n=3051 cos0.99 難1.29", "s": 0.876, "f": 0}, {"x": 0.987, "y": 1.152, "c": "近傍", "n": "華爛漫 -Flowers- [L]  n=2166 cos0.99 難1.15", "s": 0.622, "f": 0}, {"x": 0.987, "y": 1.28, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3355 cos0.99 難1.28", "s": 0.963, "f": 0}, {"x": 0.988, "y": 1.361, "c": "近傍", "n": "NEO GENERATOR SEVEN [A]  n=3250 cos0.99 難1.36", "s": 0.933, "f": 0}, {"x": 0.986, "y": 1.181, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2193 cos0.99 難1.18", "s": 0.63, "f": 0}, {"x": 0.986, "y": 1.281, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3247 cos0.99 難1.28", "s": 0.932, "f": 0}, {"x": 0.989, "y": 1.03, "c": "近傍", "n": "GRID KNIGHT [L]  n=3176 cos0.99 難1.03", "s": 0.912, "f": 0}, {"x": 0.985, "y": 1.203, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3451 cos0.99 難1.20", "s": 0.991, "f": 0}, {"x": 0.986, "y": 1.342, "c": "近傍", "n": "GUILTY [L]  n=1224 cos0.99 難1.34", "s": 0.351, "f": 0}, {"x": 0.987, "y": 1.073, "c": "近傍", "n": "The Least 100sec [A]  n=3392 cos0.99 難1.07", "s": 0.974, "f": 0}, {"x": 0.985, "y": 1.275, "c": "近傍", "n": "Amazing Mirage [L]  n=3180 cos0.98 難1.27", "s": 0.913, "f": 0}, {"x": 0.985, "y": 1.306, "c": "近傍", "n": "EBONY & IVORY [A]  n=3385 cos0.98 難1.31", "s": 0.972, "f": 0}, {"x": 0.988, "y": 1.02, "c": "近傍", "n": "天邪鬼 [A]  n=2439 cos0.99 難1.02", "s": 0.7, "f": 0}, {"x": 0.986, "y": 1.368, "c": "近傍", "n": "電腦都市 [A]  n=1373 cos0.99 難1.37", "s": 0.394, "f": 0}, {"x": 0.984, "y": 1.209, "c": "近傍", "n": "Super Duper Racers [L]  n=727 cos0.98 難1.21", "s": 0.209, "f": 0}, {"x": 0.987, "y": 1.431, "c": "近傍", "n": "ORCA [A]  n=2527 cos0.99 難1.43", "s": 0.726, "f": 0}, {"x": 0.983, "y": 1.189, "c": "近傍", "n": "Viridian [A]  n=2628 cos0.98 難1.19", "s": 0.755, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35958655009558593}, {"a": 0, "b": 2, "w": 0.40320516924584704}, {"a": 0, "b": 3, "w": 0.23138183960101788}, {"a": 0, "b": 4, "w": 0.2612652503340013}, {"a": 0, "b": 5, "w": 0.15901043935407244}, {"a": 0, "b": 6, "w": 0.21788733850189423}, {"a": 0, "b": 7, "w": 0.2598941714300249}, {"a": 0, "b": 8, "w": 0.20092955322355766}, {"a": 0, "b": 9, "w": 3.0364377678893106e-11}, {"a": 0, "b": 10, "w": 0.13178057397906917}, {"a": 0, "b": 11, "w": 0.17604753561321596}, {"a": 0, "b": 12, "w": 0.16794266941837865}, {"a": 0, "b": 13, "w": 0.10763501899311267}, {"a": 0, "b": 14, "w": 0.14623437514497706}, {"a": 0, "b": 15, "w": 0.14380362416459502}, {"a": 0, "b": 16, "w": 0.1800851999191332}, {"a": 0, "b": 17, "w": 0.16523684435623986}, {"a": 0, "b": 18, "w": 0.1400824175738935}, {"a": 0, "b": 19, "w": 0.22825131655907893}, {"a": 0, "b": 20, "w": 0.06479678979014203}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.988,hiY=1.464;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
