<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Smashing Wedge [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.023, "c": "種", "n": "Smashing Wedge [H]  n=1615 cos1.00 難-1.02", "s": 0.643, "f": 0}, {"x": 0.996, "y": -0.953, "c": "近傍", "n": "Empire of Fury [H]  n=1651 cos1.00 難-0.95", "s": 0.657, "f": 0}, {"x": 0.996, "y": -1.112, "c": "近傍", "n": "1116 [H]  n=658 cos1.00 難-1.11", "s": 0.262, "f": 0}, {"x": 0.993, "y": -0.983, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [H]  n=1094 cos0.99 難-0.98", "s": 0.435, "f": 0}, {"x": 0.993, "y": -1.076, "c": "近傍", "n": "invoker [H]  n=1884 cos0.99 難-1.08", "s": 0.75, "f": 0}, {"x": 0.993, "y": -0.973, "c": "近傍", "n": "儚キ戀ノ幻想譚 [H]  n=1679 cos0.99 難-0.97", "s": 0.668, "f": 0}, {"x": 0.993, "y": -1.0, "c": "近傍", "n": "HYPE THE CORE [H]  n=1566 cos0.99 難-1.00", "s": 0.623, "f": 0}, {"x": 0.993, "y": -0.937, "c": "近傍", "n": "Rampage [H]  n=2513 cos0.99 難-0.94", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.955, "c": "近傍", "n": "hard-wired [H]  n=1148 cos0.99 難-0.95", "s": 0.457, "f": 0}, {"x": 0.995, "y": -1.309, "c": "近傍", "n": "MAXIMUM CHEAT GIRL [H]  n=841 cos1.00 難-1.31", "s": 0.335, "f": 0}, {"x": 0.992, "y": -1.018, "c": "近傍", "n": "Venom [H]  n=1704 cos0.99 難-1.02", "s": 0.678, "f": 0}, {"x": 0.993, "y": -1.243, "c": "近傍", "n": "kors k's How to make OTOGE CORE 「LONG」 [H]  n=1189 cos0.99 難-1.24", "s": 0.473, "f": 0}, {"x": 0.991, "y": -1.169, "c": "近傍", "n": "Dans la nuit de l'eternite [H]  n=1505 cos0.99 難-1.17", "s": 0.599, "f": 0}, {"x": 0.993, "y": -0.779, "c": "近傍", "n": "SOLAR ECLIPSE [H]  n=1473 cos0.99 難-0.78", "s": 0.586, "f": 0}, {"x": 0.993, "y": -0.784, "c": "近傍", "n": "DESIRE [H]  n=2026 cos0.99 難-0.78", "s": 0.806, "f": 0}, {"x": 0.991, "y": -0.976, "c": "近傍", "n": "Antigravity [H]  n=2031 cos0.99 難-0.98", "s": 0.808, "f": 0}, {"x": 0.992, "y": -1.249, "c": "近傍", "n": "rommmo [H]  n=1023 cos0.99 難-1.25", "s": 0.407, "f": 0}, {"x": 0.99, "y": -0.89, "c": "近傍", "n": "TOMAHAWK [H]  n=1304 cos0.99 難-0.89", "s": 0.519, "f": 0}, {"x": 0.99, "y": -1.11, "c": "近傍", "n": "AKASHIC BREAK [H]  n=1717 cos0.99 難-1.11", "s": 0.683, "f": 0}, {"x": 0.99, "y": -0.847, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1663 cos0.99 難-0.85", "s": 0.662, "f": 0}, {"x": 0.99, "y": -0.86, "c": "近傍", "n": "ONIGOROSHI [H]  n=1802 cos0.99 難-0.86", "s": 0.717, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.569432079759485}, {"a": 0, "b": 2, "w": 0.5876307437297651}, {"a": 0, "b": 3, "w": 0.46937289021894135}, {"a": 0, "b": 4, "w": 0.33279004311172855}, {"a": 0, "b": 5, "w": 0.4529861780786678}, {"a": 0, "b": 6, "w": 0.3661512939561239}, {"a": 0, "b": 7, "w": 0.44766055952085293}, {"a": 0, "b": 8, "w": 0.20803319707918477}, {"a": 0, "b": 9, "w": 0.5379959984978646}, {"a": 0, "b": 10, "w": 0.37270716286361394}, {"a": 0, "b": 11, "w": 0.4638270457934539}, {"a": 0, "b": 12, "w": 0.4063504358932879}, {"a": 0, "b": 13, "w": 0.24740593845142123}, {"a": 0, "b": 14, "w": 0.1851154972526612}, {"a": 0, "b": 15, "w": 0.33179551327339574}, {"a": 0, "b": 16, "w": 0.21910538577118488}, {"a": 0, "b": 17, "w": 4.4710901647704304e-11}, {"a": 0, "b": 18, "w": 0.2506386059164658}, {"a": 0, "b": 19, "w": 0.36336272036345607}, {"a": 0, "b": 20, "w": 0.3423170287449808}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.352,hiY=-0.736;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
