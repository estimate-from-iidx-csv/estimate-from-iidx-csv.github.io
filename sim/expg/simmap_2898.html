<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Valanga [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.23, "c": "種", "n": "Valanga [A]  n=3497 cos1.00 難1.23", "s": 0.974, "f": 0}, {"x": 0.997, "y": 1.15, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3429 cos1.00 難1.15", "s": 0.955, "f": 0}, {"x": 0.991, "y": 1.26, "c": "近傍", "n": "Aftermath [A]  n=2306 cos0.99 難1.26", "s": 0.642, "f": 0}, {"x": 0.992, "y": 1.133, "c": "近傍", "n": "Megalara Garuda [A]  n=2806 cos0.99 難1.13", "s": 0.781, "f": 0}, {"x": 0.989, "y": 1.212, "c": "近傍", "n": "Triple Cross [A]  n=2544 cos0.99 難1.21", "s": 0.708, "f": 0}, {"x": 0.988, "y": 1.307, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2995 cos0.99 難1.31", "s": 0.834, "f": 0}, {"x": 0.989, "y": 1.057, "c": "近傍", "n": "Rave Patroller [A]  n=2939 cos0.99 難1.06", "s": 0.818, "f": 0}, {"x": 0.987, "y": 1.326, "c": "近傍", "n": "cinder [A]  n=3233 cos0.99 難1.33", "s": 0.9, "f": 0}, {"x": 0.99, "y": 1.439, "c": "近傍", "n": "Monopole. [A]  n=3172 cos0.99 難1.44", "s": 0.883, "f": 0}, {"x": 0.987, "y": 1.368, "c": "近傍", "n": "Lightspeed [A]  n=1140 cos0.99 難1.37", "s": 0.317, "f": 0}, {"x": 0.985, "y": 1.226, "c": "近傍", "n": "DARK LEGACY [A]  n=3458 cos0.98 難1.23", "s": 0.963, "f": 0}, {"x": 0.985, "y": 1.368, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2271 cos0.99 難1.37", "s": 0.632, "f": 0}, {"x": 0.985, "y": 1.125, "c": "近傍", "n": "Super Rush [A]  n=3497 cos0.98 難1.12", "s": 0.974, "f": 0}, {"x": 0.987, "y": 1.043, "c": "近傍", "n": "King of Tribe [A]  n=592 cos0.99 難1.04", "s": 0.165, "f": 0}, {"x": 0.986, "y": 1.038, "c": "近傍", "n": "HYPE THE CORE [A]  n=3102 cos0.99 難1.04", "s": 0.864, "f": 0}, {"x": 0.985, "y": 1.073, "c": "近傍", "n": "Idola [A]  n=3591 cos0.98 難1.07", "s": 1.0, "f": 0}, {"x": 0.985, "y": 1.404, "c": "近傍", "n": "rommmo [A]  n=2579 cos0.99 難1.40", "s": 0.718, "f": 0}, {"x": 0.984, "y": 1.102, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3384 cos0.98 難1.10", "s": 0.942, "f": 0}, {"x": 0.983, "y": 1.117, "c": "近傍", "n": "Umbral [L]  n=2054 cos0.98 難1.12", "s": 0.572, "f": 0}, {"x": 0.984, "y": 1.03, "c": "近傍", "n": "GRID KNIGHT [L]  n=3176 cos0.98 難1.03", "s": 0.884, "f": 0}, {"x": 0.982, "y": 1.288, "c": "近傍", "n": "DOMINION [A]  n=3441 cos0.98 難1.29", "s": 0.958, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.37940587730108566}, {"a": 0, "b": 2, "w": 0.29526602780978783}, {"a": 0, "b": 3, "w": 0.09592320681105759}, {"a": 0, "b": 4, "w": 0.21914861497689309}, {"a": 0, "b": 5, "w": 0.1249988350140927}, {"a": 0, "b": 6, "w": 0.12145343897185978}, {"a": 0, "b": 7, "w": 0.15012505210010496}, {"a": 0, "b": 8, "w": 0.25462471277137544}, {"a": 0, "b": 9, "w": 0.14000475696702208}, {"a": 0, "b": 10, "w": 0.07722963010996764}, {"a": 0, "b": 11, "w": 0.06413713871447724}, {"a": 0, "b": 12, "w": 0.08338628821323113}, {"a": 0, "b": 13, "w": 0.08281605716770057}, {"a": 0, "b": 14, "w": 0.09888569365720712}, {"a": 0, "b": 15, "w": 0.07930838443370902}, {"a": 0, "b": 16, "w": 0.08450439990375358}, {"a": 0, "b": 17, "w": 0.053603401278250806}, {"a": 0, "b": 18, "w": 0.01952914515538684}, {"a": 0, "b": 19, "w": 0.05791022698162318}, {"a": 0, "b": 20, "w": 3.6237901568370035e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=0.997,hiY=1.471;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
