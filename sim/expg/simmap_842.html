<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Express Emotion [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.212, "c": "種", "n": "Express Emotion [A]  n=3441 cos1.00 難-0.21", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.128, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3181 cos1.00 難-0.13", "s": 0.924, "f": 0}, {"x": 0.998, "y": -0.112, "c": "近傍", "n": "Let me be your cure [A]  n=3101 cos1.00 難-0.11", "s": 0.901, "f": 0}, {"x": 0.997, "y": -0.172, "c": "近傍", "n": "オルタネイトβ [A]  n=3288 cos1.00 難-0.17", "s": 0.956, "f": 0}, {"x": 0.997, "y": -0.301, "c": "近傍", "n": "Tell me what you wish feat.らっぷびと [A]  n=2530 cos1.00 難-0.30", "s": 0.735, "f": 0}, {"x": 0.995, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos1.00 難-0.25", "s": 0.7, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "beatAffection [A]  n=2807 cos0.99 難-0.13", "s": 0.816, "f": 0}, {"x": 0.995, "y": -0.328, "c": "近傍", "n": "Take It Easy [H]  n=2266 cos1.00 難-0.33", "s": 0.659, "f": 0}, {"x": 0.998, "y": -0.416, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3120 cos1.00 難-0.42", "s": 0.907, "f": 0}, {"x": 0.995, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos1.00 難-0.35", "s": 0.875, "f": 0}, {"x": 0.996, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos1.00 難-0.37", "s": 0.612, "f": 0}, {"x": 0.995, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos1.00 難-0.05", "s": 0.898, "f": 0}, {"x": 0.994, "y": -0.207, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1139 cos0.99 難-0.21", "s": 0.331, "f": 0}, {"x": 0.994, "y": -0.281, "c": "近傍", "n": "NNRT [H]  n=2896 cos0.99 難-0.28", "s": 0.842, "f": 0}, {"x": 0.993, "y": -0.295, "c": "近傍", "n": "■□模様 [A]  n=1385 cos0.99 難-0.29", "s": 0.402, "f": 0}, {"x": 0.994, "y": -0.097, "c": "近傍", "n": "REMINISCENCE [A]  n=2781 cos0.99 難-0.10", "s": 0.808, "f": 0}, {"x": 0.994, "y": -0.38, "c": "近傍", "n": "get set mind [A]  n=1498 cos0.99 難-0.38", "s": 0.435, "f": 0}, {"x": 0.994, "y": -0.058, "c": "近傍", "n": "ToyCube Pf.(RX-Ver.S.P.L.) [A]  n=1924 cos0.99 難-0.06", "s": 0.559, "f": 0}, {"x": 0.996, "y": 0.037, "c": "近傍", "n": "into the battlefield [A]  n=2993 cos1.00 難0.04", "s": 0.87, "f": 0}, {"x": 0.993, "y": -0.308, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3317 cos0.99 難-0.31", "s": 0.964, "f": 0}, {"x": 0.993, "y": -0.397, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2655 cos0.99 難-0.40", "s": 0.772, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5898305212303239}, {"a": 0, "b": 2, "w": 0.5745187488092391}, {"a": 0, "b": 3, "w": 0.32326551271438386}, {"a": 0, "b": 4, "w": 0.3844427833612354}, {"a": 0, "b": 5, "w": 0.29663072458679207}, {"a": 0, "b": 6, "w": 0.325471509748136}, {"a": 0, "b": 7, "w": 0.3654104861488213}, {"a": 0, "b": 8, "w": 0.5696731620196182}, {"a": 0, "b": 9, "w": 0.34409878917170067}, {"a": 0, "b": 10, "w": 0.37070025215104707}, {"a": 0, "b": 11, "w": 0.31405940880151084}, {"a": 0, "b": 12, "w": 0.27535743521978506}, {"a": 0, "b": 13, "w": 0.08029037980390175}, {"a": 0, "b": 14, "w": 0.22936216558246703}, {"a": 0, "b": 15, "w": 0.26355399931674595}, {"a": 0, "b": 16, "w": 0.27331003847835156}, {"a": 0, "b": 17, "w": 0.21216003540348516}, {"a": 0, "b": 18, "w": 0.3789610554806133}, {"a": 0, "b": 19, "w": 6.323785939343907e-11}, {"a": 0, "b": 20, "w": 0.25957874587530927}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.452,hiY=0.073;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
