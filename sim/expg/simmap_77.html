<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LEMON MELON COOKIE [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.795, "c": "種", "n": "LEMON MELON COOKIE [A]  n=1079 cos1.00 難-0.79", "s": 0.417, "f": 0}, {"x": 0.997, "y": -0.762, "c": "近傍", "n": "イガク [A]  n=1526 cos1.00 難-0.76", "s": 0.59, "f": 0}, {"x": 0.997, "y": -0.958, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1826 cos1.00 難-0.96", "s": 0.706, "f": 0}, {"x": 0.997, "y": -0.607, "c": "近傍", "n": "Shooting Star [A]  n=1056 cos1.00 難-0.61", "s": 0.408, "f": 0}, {"x": 0.995, "y": -0.896, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2393 cos0.99 難-0.90", "s": 0.925, "f": 0}, {"x": 0.994, "y": -0.721, "c": "近傍", "n": "可愛くてごめん [A]  n=1837 cos0.99 難-0.72", "s": 0.71, "f": 0}, {"x": 0.994, "y": -0.981, "c": "近傍", "n": "VEGA [H]  n=2538 cos0.99 難-0.98", "s": 0.981, "f": 0}, {"x": 0.992, "y": -0.867, "c": "近傍", "n": "MOON [H]  n=1887 cos0.99 難-0.87", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.569, "c": "近傍", "n": "PALETTE [A]  n=1091 cos0.99 難-0.57", "s": 0.422, "f": 0}, {"x": 0.993, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2588 cos0.99 難-0.59", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.489, "c": "近傍", "n": "閉塞的フレーション [A]  n=1552 cos1.00 難-0.49", "s": 0.6, "f": 0}, {"x": 0.993, "y": -0.547, "c": "近傍", "n": "おとせサンダー [A]  n=1961 cos0.99 難-0.55", "s": 0.758, "f": 0}, {"x": 0.995, "y": -1.109, "c": "近傍", "n": "Rave Patroller [H]  n=1626 cos1.00 難-1.11", "s": 0.628, "f": 0}, {"x": 0.992, "y": -0.607, "c": "近傍", "n": "バブリン [A]  n=1138 cos0.99 難-0.61", "s": 0.44, "f": 0}, {"x": 0.993, "y": -0.531, "c": "近傍", "n": "Skywalking [A]  n=615 cos0.99 難-0.53", "s": 0.238, "f": 0}, {"x": 0.991, "y": -0.605, "c": "近傍", "n": "Riff//rain [A]  n=1283 cos0.99 難-0.60", "s": 0.496, "f": 0}, {"x": 0.991, "y": -0.937, "c": "近傍", "n": "Rampage [H]  n=2513 cos0.99 難-0.94", "s": 0.971, "f": 0}, {"x": 0.99, "y": -0.762, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2527 cos0.99 難-0.76", "s": 0.976, "f": 0}, {"x": 0.995, "y": -1.135, "c": "近傍", "n": "No Tears [H]  n=1727 cos1.00 難-1.13", "s": 0.667, "f": 0}, {"x": 0.997, "y": -1.167, "c": "近傍", "n": "RIZING YOU UP [H]  n=1819 cos1.00 難-1.17", "s": 0.703, "f": 0}, {"x": 0.99, "y": -0.761, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=989 cos0.99 難-0.76", "s": 0.382, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.546249756153842}, {"a": 0, "b": 2, "w": 0.47589271779494835}, {"a": 0, "b": 3, "w": 0.5320606340109808}, {"a": 0, "b": 4, "w": 0.34110747015121157}, {"a": 0, "b": 5, "w": 0.36051583066732407}, {"a": 0, "b": 6, "w": 0.36427768843500885}, {"a": 0, "b": 7, "w": 0.24335317159264436}, {"a": 0, "b": 8, "w": 0.3769794701892869}, {"a": 0, "b": 9, "w": 0.3284517529079789}, {"a": 0, "b": 10, "w": 0.4326429499771196}, {"a": 0, "b": 11, "w": 0.25285108725945826}, {"a": 0, "b": 12, "w": 0.44903668711041134}, {"a": 0, "b": 13, "w": 0.22987499888970042}, {"a": 0, "b": 14, "w": 0.005507540527939447}, {"a": 0, "b": 15, "w": 0.11239924502832788}, {"a": 0, "b": 16, "w": 6.216105408185513e-11}, {"a": 0, "b": 17, "w": 0.173718641239479}, {"a": 0, "b": 18, "w": 0.4077405598016004}, {"a": 0, "b": 19, "w": 0.497555747047011}, {"a": 0, "b": 20, "w": 0.13225865687223326}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.222,hiY=-0.435;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
