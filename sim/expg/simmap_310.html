<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dr. Chemical & Killing Machine [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.288, "c": "種", "n": "Dr. Chemical & Killing Machine [H]  n=1634 cos1.00 難-1.29", "s": 0.881, "f": 0}, {"x": 0.997, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos1.00 難-1.29", "s": 0.844, "f": 0}, {"x": 0.997, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos1.00 難-1.25", "s": 0.651, "f": 0}, {"x": 0.996, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos1.00 難-1.29", "s": 0.335, "f": 0}, {"x": 0.996, "y": -1.246, "c": "近傍", "n": "Out of Control [H]  n=846 cos1.00 難-1.25", "s": 0.456, "f": 0}, {"x": 0.995, "y": -1.278, "c": "近傍", "n": "Satellite Burst [H]  n=903 cos1.00 難-1.28", "s": 0.487, "f": 0}, {"x": 0.995, "y": -1.288, "c": "近傍", "n": "Meissa [H]  n=920 cos1.00 難-1.29", "s": 0.496, "f": 0}, {"x": 0.997, "y": -1.39, "c": "近傍", "n": "Roar of Chronos [H]  n=695 cos1.00 難-1.39", "s": 0.375, "f": 0}, {"x": 0.995, "y": -1.342, "c": "近傍", "n": "ιgniЯRuina [H]  n=654 cos1.00 難-1.34", "s": 0.353, "f": 0}, {"x": 0.997, "y": -1.401, "c": "近傍", "n": "Begin [H]  n=607 cos1.00 難-1.40", "s": 0.327, "f": 0}, {"x": 0.995, "y": -1.337, "c": "近傍", "n": "Space Battleship S4TO [H]  n=634 cos0.99 難-1.34", "s": 0.342, "f": 0}, {"x": 0.995, "y": -1.328, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1666 cos0.99 難-1.33", "s": 0.899, "f": 0}, {"x": 0.996, "y": -1.392, "c": "近傍", "n": "LADYBIRD [H]  n=1012 cos1.00 難-1.39", "s": 0.546, "f": 0}, {"x": 0.994, "y": -1.288, "c": "近傍", "n": "No Border [H]  n=1428 cos0.99 難-1.29", "s": 0.77, "f": 0}, {"x": 0.994, "y": -1.353, "c": "近傍", "n": "セロトニン [H]  n=1489 cos0.99 難-1.35", "s": 0.803, "f": 0}, {"x": 0.997, "y": -1.43, "c": "近傍", "n": "Disco Killer Music Lover [H]  n=551 cos1.00 難-1.43", "s": 0.297, "f": 0}, {"x": 0.994, "y": -1.306, "c": "近傍", "n": "frequent [H]  n=1101 cos0.99 難-1.31", "s": 0.594, "f": 0}, {"x": 0.996, "y": -1.427, "c": "近傍", "n": "Amazing Mirage [H]  n=1854 cos1.00 難-1.43", "s": 1.0, "f": 0}, {"x": 0.996, "y": -1.163, "c": "近傍", "n": "EBONY & IVORY [H]  n=1768 cos1.00 難-1.16", "s": 0.954, "f": 0}, {"x": 0.994, "y": -1.355, "c": "近傍", "n": "Mid-Corner (Magic Maker) [H]  n=571 cos0.99 難-1.35", "s": 0.308, "f": 0}, {"x": 0.994, "y": -1.351, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=990 cos0.99 難-1.35", "s": 0.534, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5503382300026625}, {"a": 0, "b": 2, "w": 0.313512525225209}, {"a": 0, "b": 3, "w": 0.42375194538406236}, {"a": 0, "b": 4, "w": 5.561640037399229e-11}, {"a": 0, "b": 5, "w": 0.375289352419397}, {"a": 0, "b": 6, "w": 0.473446041173766}, {"a": 0, "b": 7, "w": 0.4434557328455777}, {"a": 0, "b": 8, "w": 0.29154110605334105}, {"a": 0, "b": 9, "w": 0.5792869630319724}, {"a": 0, "b": 10, "w": 0.20548193156283145}, {"a": 0, "b": 11, "w": 0.31248222337864806}, {"a": 0, "b": 12, "w": 0.518452596386478}, {"a": 0, "b": 13, "w": 0.38366905735559653}, {"a": 0, "b": 14, "w": 0.42987601931784447}, {"a": 0, "b": 15, "w": 0.6021994927087749}, {"a": 0, "b": 16, "w": 0.27939616634155684}, {"a": 0, "b": 17, "w": 0.515925202236295}, {"a": 0, "b": 18, "w": 0.37188971844756114}, {"a": 0, "b": 19, "w": 0.221764953089844}, {"a": 0, "b": 20, "w": 0.0700986585670551}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-1.451,hiY=-1.142;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
