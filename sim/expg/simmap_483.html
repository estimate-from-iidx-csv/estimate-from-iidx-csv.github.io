<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Realize Maze [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.203, "c": "種", "n": "Realize Maze [H]  n=1572 cos1.00 難-1.20", "s": 0.632, "f": 0}, {"x": 0.997, "y": -1.229, "c": "近傍", "n": "明鏡止水 [H]  n=1440 cos1.00 難-1.23", "s": 0.579, "f": 0}, {"x": 0.996, "y": -1.247, "c": "近傍", "n": "Arca [H]  n=1544 cos1.00 難-1.25", "s": 0.62, "f": 0}, {"x": 0.995, "y": -1.067, "c": "近傍", "n": "刃図羅 [H]  n=2177 cos1.00 難-1.07", "s": 0.875, "f": 0}, {"x": 0.993, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.485, "f": 0}, {"x": 0.993, "y": -1.288, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1634 cos0.99 難-1.29", "s": 0.656, "f": 0}, {"x": 0.992, "y": -1.135, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1643 cos0.99 難-1.13", "s": 0.66, "f": 0}, {"x": 0.992, "y": -1.278, "c": "近傍", "n": "Satellite Burst [H]  n=903 cos0.99 難-1.28", "s": 0.363, "f": 0}, {"x": 0.992, "y": -1.288, "c": "近傍", "n": "No Border [H]  n=1428 cos0.99 難-1.29", "s": 0.574, "f": 0}, {"x": 0.992, "y": -1.136, "c": "近傍", "n": "Primitive Vibes [H]  n=2431 cos0.99 難-1.14", "s": 0.977, "f": 0}, {"x": 0.991, "y": -1.167, "c": "近傍", "n": "RALLY '25 [H]  n=746 cos0.99 難-1.17", "s": 0.3, "f": 0}, {"x": 0.995, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.896, "f": 0}, {"x": 0.991, "y": -1.109, "c": "近傍", "n": "Demon March [H]  n=831 cos0.99 難-1.11", "s": 0.334, "f": 0}, {"x": 0.995, "y": -1.419, "c": "近傍", "n": "Around The Galaxy [H]  n=1244 cos0.99 難-1.42", "s": 0.5, "f": 0}, {"x": 0.991, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos0.99 難-1.29", "s": 0.628, "f": 0}, {"x": 0.994, "y": -1.401, "c": "近傍", "n": "Begin [H]  n=607 cos0.99 難-1.40", "s": 0.244, "f": 0}, {"x": 0.996, "y": -0.964, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1963 cos1.00 難-0.96", "s": 0.789, "f": 0}, {"x": 0.991, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.249, "f": 0}, {"x": 0.992, "y": -1.026, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2489 cos0.99 難-1.03", "s": 1.0, "f": 0}, {"x": 0.99, "y": -1.233, "c": "近傍", "n": "Persephone [H]  n=1604 cos0.99 難-1.23", "s": 0.644, "f": 0}, {"x": 0.99, "y": -1.112, "c": "近傍", "n": "Smalt #28598F [H]  n=1299 cos0.99 難-1.11", "s": 0.522, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6536581108941141}, {"a": 0, "b": 2, "w": 0.576017279356831}, {"a": 0, "b": 3, "w": 0.5349289680788576}, {"a": 0, "b": 4, "w": 0.18241216752347034}, {"a": 0, "b": 5, "w": 0.4634224379193388}, {"a": 0, "b": 6, "w": 0.4321026636229147}, {"a": 0, "b": 7, "w": 0.30033326773697555}, {"a": 0, "b": 8, "w": 0.46501041201592996}, {"a": 0, "b": 9, "w": 0.43500760853809783}, {"a": 0, "b": 10, "w": 0.25703855388226826}, {"a": 0, "b": 11, "w": 0.5140289740507464}, {"a": 0, "b": 12, "w": 4.6924131247294554e-11}, {"a": 0, "b": 13, "w": 0.5436754755527387}, {"a": 0, "b": 14, "w": 0.33679458986116095}, {"a": 0, "b": 15, "w": 0.4779283044131123}, {"a": 0, "b": 16, "w": 0.6041589420232689}, {"a": 0, "b": 17, "w": 0.26969305248501885}, {"a": 0, "b": 18, "w": 0.3396739034017152}, {"a": 0, "b": 19, "w": 0.3485018293162686}, {"a": 0, "b": 20, "w": 0.2095846417912417}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.455,hiY=-0.928;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
