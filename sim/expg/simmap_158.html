<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">センチメンタル・サマー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.545, "c": "種", "n": "センチメンタル・サマー [A]  n=1575 cos1.00 難-0.55", "s": 0.443, "f": 0}, {"x": 0.998, "y": -0.522, "c": "近傍", "n": "Dreamship [A]  n=1389 cos1.00 難-0.52", "s": 0.39, "f": 0}, {"x": 0.997, "y": -0.572, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1725 cos1.00 難-0.57", "s": 0.485, "f": 0}, {"x": 0.995, "y": -0.592, "c": "近傍", "n": "翼 [A]  n=3049 cos0.99 難-0.59", "s": 0.857, "f": 0}, {"x": 0.995, "y": -0.427, "c": "近傍", "n": "Double Loving Heart [A]  n=2700 cos0.99 難-0.43", "s": 0.759, "f": 0}, {"x": 0.992, "y": -0.526, "c": "近傍", "n": "犬に雨傘 [A]  n=2121 cos0.99 難-0.53", "s": 0.596, "f": 0}, {"x": 0.997, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos1.00 難-0.34", "s": 0.753, "f": 0}, {"x": 0.997, "y": -0.342, "c": "近傍", "n": "未来のプリズム [A]  n=2664 cos1.00 難-0.34", "s": 0.749, "f": 0}, {"x": 0.992, "y": -0.545, "c": "近傍", "n": "Element of SPADA [A]  n=3558 cos0.99 難-0.54", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.382, "c": "近傍", "n": "セカンドピアス [A]  n=2573 cos0.99 難-0.38", "s": 0.723, "f": 0}, {"x": 0.992, "y": -0.497, "c": "近傍", "n": "Digital Radiance [A]  n=1245 cos0.99 難-0.50", "s": 0.35, "f": 0}, {"x": 0.996, "y": -0.333, "c": "近傍", "n": "Sugar Drippin' [A]  n=2159 cos1.00 難-0.33", "s": 0.607, "f": 0}, {"x": 0.995, "y": -0.761, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=989 cos0.99 難-0.76", "s": 0.278, "f": 0}, {"x": 0.991, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2588 cos0.99 難-0.59", "s": 0.727, "f": 0}, {"x": 0.996, "y": -0.299, "c": "近傍", "n": "Shining World [A]  n=3138 cos1.00 難-0.30", "s": 0.882, "f": 0}, {"x": 0.99, "y": -0.592, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2270 cos0.99 難-0.59", "s": 0.638, "f": 0}, {"x": 0.99, "y": -0.498, "c": "近傍", "n": "エクスプロウル [A]  n=1128 cos0.99 難-0.50", "s": 0.317, "f": 0}, {"x": 0.993, "y": -0.762, "c": "近傍", "n": "イガク [A]  n=1526 cos0.99 難-0.76", "s": 0.429, "f": 0}, {"x": 0.992, "y": -0.333, "c": "近傍", "n": "satfinal [A]  n=2970 cos0.99 難-0.33", "s": 0.835, "f": 0}, {"x": 0.99, "y": -0.687, "c": "近傍", "n": "鏡像都市 [A]  n=898 cos0.99 難-0.69", "s": 0.252, "f": 0}, {"x": 0.993, "y": -0.298, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2796 cos0.99 難-0.30", "s": 0.786, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6556459596357209}, {"a": 0, "b": 2, "w": 0.6067857146946727}, {"a": 0, "b": 3, "w": 0.49057043645760046}, {"a": 0, "b": 4, "w": 0.5350661867972539}, {"a": 0, "b": 5, "w": 0.3315280526666844}, {"a": 0, "b": 6, "w": 0.6405757817441705}, {"a": 0, "b": 7, "w": 0.6446059369611585}, {"a": 0, "b": 8, "w": 0.4293116996321942}, {"a": 0, "b": 9, "w": 0.47789157492481393}, {"a": 0, "b": 10, "w": 0.38922175507670165}, {"a": 0, "b": 11, "w": 0.5715140868610451}, {"a": 0, "b": 12, "w": 0.3272758484304944}, {"a": 0, "b": 13, "w": 0.271389057421757}, {"a": 0, "b": 14, "w": 0.5428092262388823}, {"a": 0, "b": 15, "w": 0.34396614171367323}, {"a": 0, "b": 16, "w": 5.19289056200023e-11}, {"a": 0, "b": 17, "w": 0.4037830477725113}, {"a": 0, "b": 18, "w": 0.44079229689552624}, {"a": 0, "b": 19, "w": 0.35097296080861007}, {"a": 0, "b": 20, "w": 0.41997874951545633}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.799,hiY=-0.261;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
