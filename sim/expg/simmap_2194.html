<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">TRIP THE DEEP [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.347, "c": "種", "n": "TRIP THE DEEP [A]  n=1452 cos1.00 難0.35", "s": 0.388, "f": 0}, {"x": 0.993, "y": 0.204, "c": "近傍", "n": "OVER VOLTAGE [A]  n=1842 cos0.99 難0.20", "s": 0.493, "f": 0}, {"x": 0.989, "y": 0.46, "c": "近傍", "n": "CODE:0 [A]  n=2877 cos0.99 難0.46", "s": 0.769, "f": 0}, {"x": 0.991, "y": 0.655, "c": "近傍", "n": "Red Soul [A]  n=1735 cos0.99 難0.66", "s": 0.464, "f": 0}, {"x": 0.987, "y": 0.367, "c": "近傍", "n": "DISPARATE [A]  n=2291 cos0.99 難0.37", "s": 0.613, "f": 0}, {"x": 0.988, "y": 0.491, "c": "近傍", "n": "BREAK OVER [A]  n=3006 cos0.99 難0.49", "s": 0.804, "f": 0}, {"x": 0.987, "y": 0.453, "c": "近傍", "n": "Neo Heritage [A]  n=2296 cos0.99 難0.45", "s": 0.614, "f": 0}, {"x": 0.986, "y": 0.378, "c": "近傍", "n": "Insane Techniques [A]  n=3373 cos0.99 難0.38", "s": 0.902, "f": 0}, {"x": 0.987, "y": 0.114, "c": "近傍", "n": "Honey Trap [A]  n=3495 cos0.99 難0.11", "s": 0.935, "f": 0}, {"x": 0.986, "y": 0.315, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [A]  n=3417 cos0.99 難0.31", "s": 0.914, "f": 0}, {"x": 0.986, "y": 0.42, "c": "近傍", "n": "Temple of Anubis [A]  n=3256 cos0.99 難0.42", "s": 0.871, "f": 0}, {"x": 0.985, "y": 0.448, "c": "近傍", "n": "SPEED DEMON [A]  n=3040 cos0.99 難0.45", "s": 0.813, "f": 0}, {"x": 0.988, "y": -0.004, "c": "近傍", "n": "Bang Bang Dance [A]  n=1181 cos0.99 難-0.00", "s": 0.316, "f": 0}, {"x": 0.988, "y": -0.065, "c": "近傍", "n": "NO LIMIT -オレ達に限界は無い- [A]  n=3117 cos0.99 難-0.07", "s": 0.834, "f": 0}, {"x": 0.984, "y": 0.457, "c": "近傍", "n": "Around the Future [A]  n=3146 cos0.98 難0.46", "s": 0.841, "f": 0}, {"x": 0.991, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.99 難0.91", "s": 0.907, "f": 0}, {"x": 0.987, "y": 0.799, "c": "近傍", "n": "Beat Juggling Mix [A]  n=3214 cos0.99 難0.80", "s": 0.86, "f": 0}, {"x": 0.986, "y": 0.753, "c": "近傍", "n": "カジノファイヤーことみちゃん [A]  n=3422 cos0.99 難0.75", "s": 0.915, "f": 0}, {"x": 0.983, "y": 0.317, "c": "近傍", "n": "X-DEN [H]  n=3023 cos0.98 難0.32", "s": 0.809, "f": 0}, {"x": 0.989, "y": -0.215, "c": "近傍", "n": "Plan 8 [H]  n=3479 cos0.99 難-0.22", "s": 0.93, "f": 0}, {"x": 0.986, "y": 0.79, "c": "近傍", "n": "The Sampling Paradise [A]  n=3739 cos0.99 難0.79", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4813104216614127}, {"a": 0, "b": 2, "w": 0.36788255062905373}, {"a": 0, "b": 3, "w": 0.3089733023052973}, {"a": 0, "b": 4, "w": 0.24480952929855104}, {"a": 0, "b": 5, "w": 0.2188039255105113}, {"a": 0, "b": 6, "w": 0.3072936163277675}, {"a": 0, "b": 7, "w": 0.24447153299735003}, {"a": 0, "b": 8, "w": 0.32522742655712755}, {"a": 0, "b": 9, "w": 0.28590347276228323}, {"a": 0, "b": 10, "w": 0.26291152031500853}, {"a": 0, "b": 11, "w": 0.2564058257940912}, {"a": 0, "b": 12, "w": 0.3274025315148317}, {"a": 0, "b": 13, "w": 0.2975716169519894}, {"a": 0, "b": 14, "w": 0.23303239321181557}, {"a": 0, "b": 15, "w": 0.41871455079022935}, {"a": 0, "b": 16, "w": 0.3145753861559374}, {"a": 0, "b": 17, "w": 0.2960746680043759}, {"a": 0, "b": 18, "w": 3.362154998853839e-11}, {"a": 0, "b": 19, "w": 0.27175010307955605}, {"a": 0, "b": 20, "w": 0.10793259631349772}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-0.305,hiY=1.000;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
