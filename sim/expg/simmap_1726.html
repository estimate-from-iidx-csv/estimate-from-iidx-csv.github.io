<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ANDROMEDA [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.389, "c": "種", "n": "ANDROMEDA [A]  n=3487 cos1.00 難0.39", "s": 0.955, "f": 0}, {"x": 0.996, "y": 0.331, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3653 cos1.00 難0.33", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.33, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3417 cos1.00 難0.33", "s": 0.935, "f": 0}, {"x": 0.996, "y": 0.283, "c": "近傍", "n": "Synergy For Angels [A]  n=3484 cos1.00 難0.28", "s": 0.954, "f": 0}, {"x": 0.995, "y": 0.312, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3521 cos0.99 難0.31", "s": 0.964, "f": 0}, {"x": 0.994, "y": 0.429, "c": "近傍", "n": "Moving on [A]  n=3011 cos0.99 難0.43", "s": 0.824, "f": 0}, {"x": 0.994, "y": 0.316, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2429 cos0.99 難0.32", "s": 0.665, "f": 0}, {"x": 0.995, "y": 0.278, "c": "近傍", "n": "Show Me All Your Love [A]  n=1150 cos0.99 難0.28", "s": 0.315, "f": 0}, {"x": 0.994, "y": 0.318, "c": "近傍", "n": "ANTHEM LANDING [A]  n=3583 cos0.99 難0.32", "s": 0.981, "f": 0}, {"x": 0.994, "y": 0.287, "c": "近傍", "n": "Ypsilon [A]  n=2808 cos0.99 難0.29", "s": 0.769, "f": 0}, {"x": 0.993, "y": 0.488, "c": "近傍", "n": "Kung-fu Empire [A]  n=3460 cos0.99 難0.49", "s": 0.947, "f": 0}, {"x": 0.993, "y": 0.317, "c": "近傍", "n": "Arabian Rave Night [A]  n=3450 cos0.99 難0.32", "s": 0.944, "f": 0}, {"x": 0.992, "y": 0.364, "c": "近傍", "n": "Bow shock!! [A]  n=2968 cos0.99 難0.36", "s": 0.812, "f": 0}, {"x": 0.993, "y": 0.497, "c": "近傍", "n": "明鏡止水 [A]  n=3153 cos0.99 難0.50", "s": 0.863, "f": 0}, {"x": 0.992, "y": 0.311, "c": "近傍", "n": "xenon [A]  n=3544 cos0.99 難0.31", "s": 0.97, "f": 0}, {"x": 0.992, "y": 0.31, "c": "近傍", "n": "Harmony and Lovely [A]  n=3537 cos0.99 難0.31", "s": 0.968, "f": 0}, {"x": 0.992, "y": 0.395, "c": "近傍", "n": "Divine Heaven [A]  n=1986 cos0.99 難0.39", "s": 0.544, "f": 0}, {"x": 0.992, "y": 0.291, "c": "近傍", "n": "Constellation [A]  n=1130 cos0.99 難0.29", "s": 0.309, "f": 0}, {"x": 0.994, "y": 0.195, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1814 cos0.99 難0.19", "s": 0.497, "f": 0}, {"x": 0.991, "y": 0.382, "c": "近傍", "n": "ウツシミウツシ [A]  n=2334 cos0.99 難0.38", "s": 0.639, "f": 0}, {"x": 0.991, "y": 0.381, "c": "近傍", "n": "Around The Galaxy [A]  n=3227 cos0.99 難0.38", "s": 0.883, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5284953531549574}, {"a": 0, "b": 2, "w": 0.3332372894305029}, {"a": 0, "b": 3, "w": 0.487532248934481}, {"a": 0, "b": 4, "w": 0.4521679877321577}, {"a": 0, "b": 5, "w": 0.3637587564176774}, {"a": 0, "b": 6, "w": 0.4203094987709213}, {"a": 0, "b": 7, "w": 0.2889215108264055}, {"a": 0, "b": 8, "w": 0.27710434892958624}, {"a": 0, "b": 9, "w": 0.30110175676025086}, {"a": 0, "b": 10, "w": 0.08476758628275605}, {"a": 0, "b": 11, "w": 0.04107070535661561}, {"a": 0, "b": 12, "w": 0.04534608027017861}, {"a": 0, "b": 13, "w": 0.2616754461618108}, {"a": 0, "b": 14, "w": 0.3657662112065855}, {"a": 0, "b": 15, "w": 0.24281988756149586}, {"a": 0, "b": 16, "w": 0.02098706148295537}, {"a": 0, "b": 17, "w": 0.2354571060418994}, {"a": 0, "b": 18, "w": 0.24981139700752852}, {"a": 0, "b": 19, "w": 4.503075690109881e-11}, {"a": 0, "b": 20, "w": 0.19513802510665867}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.171,hiY=0.522;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
