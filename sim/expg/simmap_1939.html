<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">INVISIBLE STRIX [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.403, "c": "種", "n": "INVISIBLE STRIX [A]  n=3037 cos1.00 難0.40", "s": 0.849, "f": 0}, {"x": 0.996, "y": 0.287, "c": "近傍", "n": "reunion [H]  n=3561 cos1.00 難0.29", "s": 0.996, "f": 0}, {"x": 0.995, "y": 0.314, "c": "近傍", "n": "murmur twins [A]  n=3523 cos1.00 難0.31", "s": 0.985, "f": 0}, {"x": 0.995, "y": 0.321, "c": "近傍", "n": "Battleground [A]  n=3265 cos0.99 難0.32", "s": 0.913, "f": 0}, {"x": 0.994, "y": 0.47, "c": "近傍", "n": "Overslept [A]  n=2558 cos0.99 難0.47", "s": 0.715, "f": 0}, {"x": 0.993, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.882, "f": 0}, {"x": 0.993, "y": 0.428, "c": "近傍", "n": "Sun Field [A]  n=3139 cos0.99 難0.43", "s": 0.878, "f": 0}, {"x": 0.993, "y": 0.419, "c": "近傍", "n": "Scarlet Moon [A]  n=3508 cos0.99 難0.42", "s": 0.981, "f": 0}, {"x": 0.995, "y": 0.608, "c": "近傍", "n": "GALGALIM [A]  n=3076 cos0.99 難0.61", "s": 0.86, "f": 0}, {"x": 0.994, "y": 0.179, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3577 cos0.99 難0.18", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.205, "c": "近傍", "n": "SOLID WYVERN [A]  n=2524 cos0.99 難0.20", "s": 0.706, "f": 0}, {"x": 0.992, "y": 0.537, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2667 cos0.99 難0.54", "s": 0.746, "f": 0}, {"x": 0.992, "y": 0.231, "c": "近傍", "n": "響花水月 [A]  n=2140 cos0.99 難0.23", "s": 0.598, "f": 0}, {"x": 0.99, "y": 0.461, "c": "近傍", "n": "Debtty Daddy [A]  n=3103 cos0.99 難0.46", "s": 0.867, "f": 0}, {"x": 0.991, "y": 0.292, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=850 cos0.99 難0.29", "s": 0.238, "f": 0}, {"x": 0.991, "y": 0.318, "c": "近傍", "n": "LASER CRUSTER [H]  n=3202 cos0.99 難0.32", "s": 0.895, "f": 0}, {"x": 0.99, "y": 0.524, "c": "近傍", "n": "HYENA [A]  n=3451 cos0.99 難0.52", "s": 0.965, "f": 0}, {"x": 0.989, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.967, "f": 0}, {"x": 0.989, "y": 0.36, "c": "近傍", "n": "UNITE THE HEART [A]  n=2848 cos0.99 難0.36", "s": 0.796, "f": 0}, {"x": 0.989, "y": 0.24, "c": "近傍", "n": "Butterfly Twist [A]  n=1002 cos0.99 難0.24", "s": 0.28, "f": 0}, {"x": 0.99, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos0.99 難0.59", "s": 0.947, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43610296660308445}, {"a": 0, "b": 2, "w": 0.2771799032891933}, {"a": 0, "b": 3, "w": 0.41316407276212697}, {"a": 0, "b": 4, "w": 0.3640141737661886}, {"a": 0, "b": 5, "w": 0.37779368612603703}, {"a": 0, "b": 6, "w": 0.2497355662555628}, {"a": 0, "b": 7, "w": 0.30982911077244635}, {"a": 0, "b": 8, "w": 0.2921857043760486}, {"a": 0, "b": 9, "w": 0.18395707732588118}, {"a": 0, "b": 10, "w": 0.3233644061772061}, {"a": 0, "b": 11, "w": 0.3105426630364496}, {"a": 0, "b": 12, "w": 0.29587484340035985}, {"a": 0, "b": 13, "w": 0.2415622901802732}, {"a": 0, "b": 14, "w": 0.2693157109084081}, {"a": 0, "b": 15, "w": 4.372169293276329e-11}, {"a": 0, "b": 16, "w": 0.21040516408404863}, {"a": 0, "b": 17, "w": 0.2014505622985625}, {"a": 0, "b": 18, "w": 0.06585605278232598}, {"a": 0, "b": 19, "w": 0.17316538470452703}, {"a": 0, "b": 20, "w": 0.2259063922860438}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=0.144,hiY=0.642;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
