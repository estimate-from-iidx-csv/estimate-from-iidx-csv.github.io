<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ミュージック・アワー [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.082, "c": "種", "n": "ミュージック・アワー [A]  n=2504 cos1.00 難0.08", "s": 0.694, "f": 0}, {"x": 0.994, "y": 0.177, "c": "近傍", "n": "Volcanic Dragon [A]  n=3178 cos0.99 難0.18", "s": 0.881, "f": 0}, {"x": 0.993, "y": 0.165, "c": "近傍", "n": "チェイスチェイスジョーカーズのうた (オニスタイルリミックス) [A]  n=1492 cos0.99 難0.16", "s": 0.413, "f": 0}, {"x": 0.994, "y": 0.265, "c": "近傍", "n": "See You Again [A]  n=1069 cos0.99 難0.27", "s": 0.296, "f": 0}, {"x": 0.991, "y": 0.009, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [A]  n=3187 cos0.99 難0.01", "s": 0.883, "f": 0}, {"x": 0.991, "y": 0.132, "c": "近傍", "n": "SigSig [A]  n=3609 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.092, "c": "近傍", "n": "New Lights [A]  n=2834 cos0.99 難-0.09", "s": 0.785, "f": 0}, {"x": 0.991, "y": 0.234, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2933 cos0.99 難0.23", "s": 0.813, "f": 0}, {"x": 0.989, "y": -0.005, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3106 cos0.99 難-0.01", "s": 0.861, "f": 0}, {"x": 0.989, "y": -0.055, "c": "近傍", "n": "AO-∞ [A]  n=2932 cos0.99 難-0.05", "s": 0.812, "f": 0}, {"x": 0.993, "y": 0.363, "c": "近傍", "n": "Egret and Willow [A]  n=3205 cos0.99 難0.36", "s": 0.888, "f": 0}, {"x": 0.989, "y": 0.264, "c": "近傍", "n": "Victory Of Ravers [A]  n=2466 cos0.99 難0.26", "s": 0.683, "f": 0}, {"x": 0.99, "y": 0.286, "c": "近傍", "n": "Just Gimme [A]  n=1335 cos0.99 難0.29", "s": 0.37, "f": 0}, {"x": 0.987, "y": 0.077, "c": "近傍", "n": "めうめうぺったんたん！！ (ZAQUVA Remix) [A]  n=1669 cos0.99 難0.08", "s": 0.462, "f": 0}, {"x": 0.994, "y": 0.419, "c": "近傍", "n": "ATHER [A]  n=3419 cos0.99 難0.42", "s": 0.947, "f": 0}, {"x": 0.987, "y": 0.162, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1930 cos0.99 難0.16", "s": 0.535, "f": 0}, {"x": 0.989, "y": 0.291, "c": "近傍", "n": "MVP [A]  n=1418 cos0.99 難0.29", "s": 0.393, "f": 0}, {"x": 0.988, "y": -0.093, "c": "近傍", "n": "Beat Radiance [A]  n=3352 cos0.99 難-0.09", "s": 0.929, "f": 0}, {"x": 0.988, "y": -0.119, "c": "近傍", "n": "取り残された美術(Arranged:HiZuMi) [A]  n=3404 cos0.99 難-0.12", "s": 0.943, "f": 0}, {"x": 0.987, "y": -0.082, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2977 cos0.99 難-0.08", "s": 0.825, "f": 0}, {"x": 0.987, "y": -0.099, "c": "近傍", "n": "Mighty Cutie [A]  n=946 cos0.99 難-0.10", "s": 0.262, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5045764109188129}, {"a": 0, "b": 2, "w": 0.4494330991580481}, {"a": 0, "b": 3, "w": 0.4987533039384552}, {"a": 0, "b": 4, "w": 0.39496190727126}, {"a": 0, "b": 5, "w": 0.17938327744876326}, {"a": 0, "b": 6, "w": 0.18179385207889587}, {"a": 0, "b": 7, "w": 0.2415616260291633}, {"a": 0, "b": 8, "w": 0.010063214018860345}, {"a": 0, "b": 9, "w": 0.2309094238657322}, {"a": 0, "b": 10, "w": 0.3497433480129455}, {"a": 0, "b": 11, "w": 0.35458327205210616}, {"a": 0, "b": 12, "w": 0.3668526955791169}, {"a": 0, "b": 13, "w": 0.2520798905140955}, {"a": 0, "b": 14, "w": 0.4736395023514681}, {"a": 0, "b": 15, "w": 0.24333372089065797}, {"a": 0, "b": 16, "w": 0.3244693227250862}, {"a": 0, "b": 17, "w": 0.30654751280869796}, {"a": 0, "b": 18, "w": 3.5885738824958935e-11}, {"a": 0, "b": 19, "w": 0.008637138940218447}, {"a": 0, "b": 20, "w": 0.12155911907140715}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.162,hiY=0.463;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
