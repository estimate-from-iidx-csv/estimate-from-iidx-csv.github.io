<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ou Legends [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.089, "c": "種", "n": "Ou Legends [A]  n=1996 cos1.00 難1.09", "s": 0.562, "f": 0}, {"x": 0.997, "y": 1.227, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2508 cos1.00 難1.23", "s": 0.706, "f": 0}, {"x": 0.995, "y": 1.208, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [A]  n=3289 cos0.99 難1.21", "s": 0.926, "f": 0}, {"x": 0.995, "y": 0.951, "c": "近傍", "n": "Summerlights(IIDX Edition) [A]  n=3550 cos0.99 難0.95", "s": 1.0, "f": 0}, {"x": 0.994, "y": 1.228, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [A]  n=3371 cos0.99 難1.23", "s": 0.95, "f": 0}, {"x": 0.991, "y": 1.108, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1129 cos0.99 難1.11", "s": 0.318, "f": 0}, {"x": 0.991, "y": 1.092, "c": "近傍", "n": "Out of Control [A]  n=1755 cos0.99 難1.09", "s": 0.494, "f": 0}, {"x": 0.992, "y": 1.242, "c": "近傍", "n": "Xb10r [A]  n=1444 cos0.99 難1.24", "s": 0.407, "f": 0}, {"x": 0.991, "y": 1.188, "c": "近傍", "n": "ハイテックトキオ [L]  n=2023 cos0.99 難1.19", "s": 0.57, "f": 0}, {"x": 0.992, "y": 1.26, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=942 cos0.99 難1.26", "s": 0.265, "f": 0}, {"x": 0.991, "y": 1.26, "c": "近傍", "n": "I [A]  n=2089 cos0.99 難1.26", "s": 0.588, "f": 0}, {"x": 0.989, "y": 1.082, "c": "近傍", "n": "oratio [A]  n=3445 cos0.99 難1.08", "s": 0.97, "f": 0}, {"x": 0.989, "y": 1.146, "c": "近傍", "n": "Million Dollar [A]  n=1558 cos0.99 難1.15", "s": 0.439, "f": 0}, {"x": 0.988, "y": 1.05, "c": "近傍", "n": "禊 [A]  n=2609 cos0.99 難1.05", "s": 0.735, "f": 0}, {"x": 0.99, "y": 0.892, "c": "近傍", "n": "Aqvion [A]  n=1146 cos0.99 難0.89", "s": 0.323, "f": 0}, {"x": 0.988, "y": 1.154, "c": "近傍", "n": "DIVINE JUDGEMENT [A]  n=1308 cos0.99 難1.15", "s": 0.368, "f": 0}, {"x": 0.991, "y": 1.331, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3339 cos0.99 難1.33", "s": 0.941, "f": 0}, {"x": 0.988, "y": 1.122, "c": "近傍", "n": "Bring The Fire [A]  n=1405 cos0.99 難1.12", "s": 0.396, "f": 0}, {"x": 0.988, "y": 1.147, "c": "近傍", "n": "B.O.D.Y. [A]  n=2089 cos0.99 難1.15", "s": 0.588, "f": 0}, {"x": 0.99, "y": 1.306, "c": "近傍", "n": "2 Be Continued [A]  n=949 cos0.99 難1.31", "s": 0.267, "f": 0}, {"x": 0.987, "y": 1.02, "c": "近傍", "n": "終焔のClaudia [A]  n=1703 cos0.99 難1.02", "s": 0.48, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6097447149817773}, {"a": 0, "b": 2, "w": 0.507345661349359}, {"a": 0, "b": 3, "w": 0.4392043279772716}, {"a": 0, "b": 4, "w": 0.36408775263540727}, {"a": 0, "b": 5, "w": 0.3874471028810724}, {"a": 0, "b": 6, "w": 0.3351330502904225}, {"a": 0, "b": 7, "w": 0.3755407010977485}, {"a": 0, "b": 8, "w": 0.3016507034888847}, {"a": 0, "b": 9, "w": 0.4026825156239765}, {"a": 0, "b": 10, "w": 3.237876633477299e-11}, {"a": 0, "b": 11, "w": 0.11921167174548275}, {"a": 0, "b": 12, "w": 0.2887889168960418}, {"a": 0, "b": 13, "w": 0.2891980543747993}, {"a": 0, "b": 14, "w": 0.33577078838794183}, {"a": 0, "b": 15, "w": 0.25877249141002356}, {"a": 0, "b": 16, "w": 0.3713460055088751}, {"a": 0, "b": 17, "w": 0.22643056769040937}, {"a": 0, "b": 18, "w": 0.26749151752638023}, {"a": 0, "b": 19, "w": 0.16520196830874756}, {"a": 0, "b": 20, "w": 0.22026801539366547}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=0.857,hiY=1.366;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
