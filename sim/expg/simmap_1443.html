<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">NITROUS CANNON [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.96, "c": "種", "n": "NITROUS CANNON [H]  n=2158 cos1.00 難-0.96", "s": 0.686, "f": 0}, {"x": 0.994, "y": -1.025, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1323 cos0.99 難-1.03", "s": 0.421, "f": 0}, {"x": 0.994, "y": -0.864, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1856 cos0.99 難-0.86", "s": 0.59, "f": 0}, {"x": 0.995, "y": -1.104, "c": "近傍", "n": "閠槞彁の願い [H]  n=1555 cos0.99 難-1.10", "s": 0.495, "f": 0}, {"x": 0.992, "y": -0.958, "c": "近傍", "n": "Caterpillar [H]  n=2200 cos0.99 難-0.96", "s": 0.7, "f": 0}, {"x": 0.993, "y": -0.862, "c": "近傍", "n": "Light and Cyber… [H]  n=2221 cos0.99 難-0.86", "s": 0.706, "f": 0}, {"x": 0.993, "y": -0.849, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1692 cos0.99 難-0.85", "s": 0.538, "f": 0}, {"x": 0.995, "y": -1.136, "c": "近傍", "n": "Primitive Vibes [H]  n=2431 cos0.99 難-1.14", "s": 0.773, "f": 0}, {"x": 0.992, "y": -0.996, "c": "近傍", "n": "EVANESCENT [H]  n=1485 cos0.99 難-1.00", "s": 0.472, "f": 0}, {"x": 0.992, "y": -0.985, "c": "近傍", "n": "MAX 360 [H]  n=770 cos0.99 難-0.99", "s": 0.245, "f": 0}, {"x": 0.993, "y": -0.809, "c": "近傍", "n": "紅牡丹 [H]  n=2663 cos0.99 難-0.81", "s": 0.847, "f": 0}, {"x": 0.992, "y": -0.916, "c": "近傍", "n": "∀ [H]  n=2291 cos0.99 難-0.92", "s": 0.729, "f": 0}, {"x": 0.992, "y": -0.894, "c": "近傍", "n": "n/a [H]  n=1573 cos0.99 難-0.89", "s": 0.5, "f": 0}, {"x": 0.992, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos0.99 難-0.81", "s": 0.56, "f": 0}, {"x": 0.994, "y": -1.163, "c": "近傍", "n": "EBONY & IVORY [H]  n=1768 cos0.99 難-1.16", "s": 0.562, "f": 0}, {"x": 0.993, "y": -0.781, "c": "近傍", "n": "Broken [H]  n=3144 cos0.99 難-0.78", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.588, "f": 0}, {"x": 0.991, "y": -0.889, "c": "近傍", "n": "dAuntl3ss [H]  n=1992 cos0.99 難-0.89", "s": 0.634, "f": 0}, {"x": 0.994, "y": -1.167, "c": "近傍", "n": "RALLY '25 [H]  n=746 cos0.99 難-1.17", "s": 0.237, "f": 0}, {"x": 0.99, "y": -0.962, "c": "近傍", "n": "Artist [H]  n=1573 cos0.99 難-0.96", "s": 0.5, "f": 0}, {"x": 0.99, "y": -0.988, "c": "近傍", "n": "天使のカンタータ -Cantata of Angels- [H]  n=701 cos0.99 難-0.99", "s": 0.223, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32599986795247327}, {"a": 0, "b": 2, "w": 0.30714508124948303}, {"a": 0, "b": 3, "w": 0.24639856862718434}, {"a": 0, "b": 4, "w": 0.25333717727862337}, {"a": 0, "b": 5, "w": 0.27725564471094033}, {"a": 0, "b": 6, "w": 0.27415573515781955}, {"a": 0, "b": 7, "w": 0.22872443824918742}, {"a": 0, "b": 8, "w": 0.18981183428786697}, {"a": 0, "b": 9, "w": 0.14039291937742993}, {"a": 0, "b": 10, "w": 0.3119686629324051}, {"a": 0, "b": 11, "w": 0.2232712129592621}, {"a": 0, "b": 12, "w": 0.1621900497888764}, {"a": 0, "b": 13, "w": 0.1084681604231107}, {"a": 0, "b": 14, "w": 0.3270813275564117}, {"a": 0, "b": 15, "w": 0.052997097324018694}, {"a": 0, "b": 16, "w": 0.018587714553967682}, {"a": 0, "b": 17, "w": 5.852662798844221e-11}, {"a": 0, "b": 18, "w": 0.31513768196571423}, {"a": 0, "b": 19, "w": 0.13206894476617792}, {"a": 0, "b": 20, "w": 0.15763940096719753}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.198,hiY=-0.750;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
