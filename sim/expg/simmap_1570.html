<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vermilion Carol [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.329, "c": "種", "n": "Vermilion Carol [H]  n=859 cos1.00 難-1.33", "s": 0.501, "f": 0}, {"x": 0.996, "y": -1.337, "c": "近傍", "n": "Space Battleship S4TO [H]  n=634 cos1.00 難-1.34", "s": 0.369, "f": 0}, {"x": 0.996, "y": -1.252, "c": "近傍", "n": "禊 [H]  n=1632 cos1.00 難-1.25", "s": 0.951, "f": 0}, {"x": 0.994, "y": -1.306, "c": "近傍", "n": "frequent [H]  n=1101 cos0.99 難-1.31", "s": 0.642, "f": 0}, {"x": 0.996, "y": -1.204, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1149 cos1.00 難-1.20", "s": 0.67, "f": 0}, {"x": 0.995, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.703, "f": 0}, {"x": 0.996, "y": -1.183, "c": "近傍", "n": "Cross Fire [H]  n=534 cos1.00 難-1.18", "s": 0.311, "f": 0}, {"x": 0.994, "y": -1.295, "c": "近傍", "n": "DUAL STRIKER [H]  n=1336 cos0.99 難-1.29", "s": 0.779, "f": 0}, {"x": 0.994, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.362, "f": 0}, {"x": 0.994, "y": -1.486, "c": "近傍", "n": "Necroxis Girl [H]  n=934 cos0.99 難-1.49", "s": 0.544, "f": 0}, {"x": 0.996, "y": -1.109, "c": "近傍", "n": "Demon March [H]  n=831 cos1.00 難-1.11", "s": 0.484, "f": 0}, {"x": 0.992, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos0.99 難-1.29", "s": 0.911, "f": 0}, {"x": 0.992, "y": -1.246, "c": "近傍", "n": "Out of Control [H]  n=846 cos0.99 難-1.25", "s": 0.493, "f": 0}, {"x": 0.992, "y": -1.448, "c": "近傍", "n": "ACT0 [H]  n=755 cos0.99 難-1.45", "s": 0.44, "f": 0}, {"x": 0.992, "y": -1.449, "c": "近傍", "n": "#CMFLG [H]  n=888 cos0.99 難-1.45", "s": 0.517, "f": 0}, {"x": 0.993, "y": -1.48, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=805 cos0.99 難-1.48", "s": 0.469, "f": 0}, {"x": 0.992, "y": -1.21, "c": "近傍", "n": "終焔のClaudia [H]  n=801 cos0.99 難-1.21", "s": 0.467, "f": 0}, {"x": 0.991, "y": -1.351, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=990 cos0.99 難-1.35", "s": 0.577, "f": 0}, {"x": 0.991, "y": -1.428, "c": "近傍", "n": "Stereo Beasts [H]  n=695 cos0.99 難-1.43", "s": 0.405, "f": 0}, {"x": 0.991, "y": -1.243, "c": "近傍", "n": "MARLIN [H]  n=503 cos0.99 難-1.24", "s": 0.293, "f": 0}, {"x": 0.992, "y": -1.135, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1716 cos0.99 難-1.13", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3833894502931765}, {"a": 0, "b": 2, "w": 0.44922254899110703}, {"a": 0, "b": 3, "w": 0.20633167726591406}, {"a": 0, "b": 4, "w": 0.4159288694702937}, {"a": 0, "b": 5, "w": 0.3137908199669641}, {"a": 0, "b": 6, "w": 0.47012409883951256}, {"a": 0, "b": 7, "w": 0.324013032147071}, {"a": 0, "b": 8, "w": 0.134637107412667}, {"a": 0, "b": 9, "w": 0.1054321415752617}, {"a": 0, "b": 10, "w": 0.4448997129839063}, {"a": 0, "b": 11, "w": 5.428746341351598e-11}, {"a": 0, "b": 12, "w": 0.23971116131515546}, {"a": 0, "b": 13, "w": 0.253092103171796}, {"a": 0, "b": 14, "w": 0.09354892311506247}, {"a": 0, "b": 15, "w": 0.06814303071405337}, {"a": 0, "b": 16, "w": 0.24090794341389854}, {"a": 0, "b": 17, "w": 0.19283858953744226}, {"a": 0, "b": 18, "w": 0.16587698955801988}, {"a": 0, "b": 19, "w": 0.18233296588033254}, {"a": 0, "b": 20, "w": 0.20944640142364912}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-1.516,hiY=-1.079;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
