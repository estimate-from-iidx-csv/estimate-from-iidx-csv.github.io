<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">IN THE NAME OF LOVE [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.306, "c": "種", "n": "IN THE NAME OF LOVE [A]  n=2765 cos1.00 難-0.31", "s": 0.789, "f": 0}, {"x": 0.998, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos1.00 難-0.32", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.301, "c": "近傍", "n": "MOON RACE [A]  n=2495 cos1.00 難-0.30", "s": 0.712, "f": 0}, {"x": 0.996, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos1.00 難-0.32", "s": 0.821, "f": 0}, {"x": 0.996, "y": -0.28, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2555 cos1.00 難-0.28", "s": 0.729, "f": 0}, {"x": 0.996, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos1.00 難-0.27", "s": 0.708, "f": 0}, {"x": 0.997, "y": -0.193, "c": "近傍", "n": "SPEEDY CAT [A]  n=2409 cos1.00 難-0.19", "s": 0.688, "f": 0}, {"x": 0.995, "y": -0.342, "c": "近傍", "n": "ZZ [H]  n=3336 cos1.00 難-0.34", "s": 0.952, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Monkey Dance [A]  n=2550 cos1.00 難-0.25", "s": 0.728, "f": 0}, {"x": 0.996, "y": -0.209, "c": "近傍", "n": "Star Trail [A]  n=3280 cos1.00 難-0.21", "s": 0.936, "f": 0}, {"x": 0.995, "y": -0.23, "c": "近傍", "n": "Prohibited Props [A]  n=2358 cos1.00 難-0.23", "s": 0.673, "f": 0}, {"x": 0.995, "y": -0.324, "c": "近傍", "n": "Howling [A]  n=2820 cos0.99 難-0.32", "s": 0.805, "f": 0}, {"x": 0.995, "y": -0.229, "c": "近傍", "n": "Umbral [A]  n=3238 cos1.00 難-0.23", "s": 0.924, "f": 0}, {"x": 0.995, "y": -0.395, "c": "近傍", "n": "KOTONOHA ft. Kotoha [A]  n=1505 cos1.00 難-0.40", "s": 0.43, "f": 0}, {"x": 0.995, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.931, "f": 0}, {"x": 0.994, "y": -0.326, "c": "近傍", "n": "Clione [A]  n=2772 cos0.99 難-0.33", "s": 0.791, "f": 0}, {"x": 0.995, "y": -0.258, "c": "近傍", "n": "NΦ CRIME [A]  n=2775 cos0.99 難-0.26", "s": 0.792, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Don't let it go [A]  n=1276 cos0.99 難-0.25", "s": 0.364, "f": 0}, {"x": 0.995, "y": -0.38, "c": "近傍", "n": "Saturn [H]  n=2297 cos0.99 難-0.38", "s": 0.656, "f": 0}, {"x": 0.995, "y": -0.411, "c": "近傍", "n": "In Heaven [A]  n=2962 cos1.00 難-0.41", "s": 0.846, "f": 0}, {"x": 0.994, "y": -0.252, "c": "近傍", "n": "heaven above [A]  n=2526 cos0.99 難-0.25", "s": 0.721, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5190140546266511}, {"a": 0, "b": 2, "w": 0.27601727556818234}, {"a": 0, "b": 3, "w": 0.22307747294404157}, {"a": 0, "b": 4, "w": 0.38979807710356185}, {"a": 0, "b": 5, "w": 0.3676884137277243}, {"a": 0, "b": 6, "w": 0.48396049161456456}, {"a": 0, "b": 7, "w": 0.33018825266465157}, {"a": 0, "b": 8, "w": 0.3422806619973513}, {"a": 0, "b": 9, "w": 0.39357387361932994}, {"a": 0, "b": 10, "w": 0.08000559408516983}, {"a": 0, "b": 11, "w": 0.19526815261391917}, {"a": 0, "b": 12, "w": 0.21680895464972172}, {"a": 0, "b": 13, "w": 0.28456651443523695}, {"a": 0, "b": 14, "w": 7.080491748467921e-11}, {"a": 0, "b": 15, "w": 0.11030750080798146}, {"a": 0, "b": 16, "w": 0.28291864149807733}, {"a": 0, "b": 17, "w": 0.284556312045944}, {"a": 0, "b": 18, "w": 0.23497213266661898}, {"a": 0, "b": 19, "w": 0.3206276419788804}, {"a": 0, "b": 20, "w": 0.027696452579546227}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.429,hiY=-0.176;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
