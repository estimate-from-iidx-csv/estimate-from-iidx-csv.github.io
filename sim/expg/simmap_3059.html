<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ALBA -黎明- [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.611, "c": "種", "n": "ALBA -黎明- [L]  n=1255 cos1.00 難1.61", "s": 0.388, "f": 0}, {"x": 0.994, "y": 1.569, "c": "近傍", "n": "SOLID STATE SQUAD [L]  n=2749 cos0.99 難1.57", "s": 0.85, "f": 0}, {"x": 0.995, "y": 1.732, "c": "近傍", "n": "Elektrick U-Phoria [L]  n=1402 cos1.00 難1.73", "s": 0.433, "f": 0}, {"x": 0.991, "y": 1.715, "c": "近傍", "n": "Bow shock!! [L]  n=885 cos0.99 難1.72", "s": 0.274, "f": 0}, {"x": 0.993, "y": 1.456, "c": "近傍", "n": "Demon March [A]  n=1392 cos0.99 難1.46", "s": 0.43, "f": 0}, {"x": 0.989, "y": 1.61, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2470 cos0.99 難1.61", "s": 0.764, "f": 0}, {"x": 0.989, "y": 1.686, "c": "近傍", "n": "∀ [A]  n=2448 cos0.99 難1.69", "s": 0.757, "f": 0}, {"x": 0.991, "y": 1.783, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1868 cos0.99 難1.78", "s": 0.577, "f": 0}, {"x": 0.987, "y": 1.656, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2852 cos0.99 難1.66", "s": 0.882, "f": 0}, {"x": 0.987, "y": 1.603, "c": "近傍", "n": "Satellite Burst [A]  n=1275 cos0.99 難1.60", "s": 0.394, "f": 0}, {"x": 0.987, "y": 1.538, "c": "近傍", "n": "伐折羅-vajra- [A]  n=2261 cos0.99 難1.54", "s": 0.699, "f": 0}, {"x": 0.987, "y": 1.6, "c": "近傍", "n": "Artist [A]  n=2457 cos0.99 難1.60", "s": 0.76, "f": 0}, {"x": 0.99, "y": 1.431, "c": "近傍", "n": "ORCA [A]  n=2527 cos0.99 難1.43", "s": 0.781, "f": 0}, {"x": 0.986, "y": 1.617, "c": "近傍", "n": "MENDES [A]  n=3234 cos0.99 難1.62", "s": 1.0, "f": 0}, {"x": 0.988, "y": 1.475, "c": "近傍", "n": "G59 [A]  n=3107 cos0.99 難1.48", "s": 0.96, "f": 0}, {"x": 0.989, "y": 1.43, "c": "近傍", "n": "QUANTUM TELEPORTATION [L]  n=2757 cos0.99 難1.43", "s": 0.852, "f": 0}, {"x": 0.986, "y": 1.622, "c": "近傍", "n": "ZEPHYRANTHES [L]  n=2166 cos0.99 難1.62", "s": 0.67, "f": 0}, {"x": 0.986, "y": 1.532, "c": "近傍", "n": "Bad Maniacs [A]  n=3235 cos0.99 難1.53", "s": 1.0, "f": 0}, {"x": 0.988, "y": 1.44, "c": "近傍", "n": "ANCHOR [A]  n=2990 cos0.99 難1.44", "s": 0.924, "f": 0}, {"x": 0.99, "y": 1.401, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3178 cos0.99 難1.40", "s": 0.982, "f": 0}, {"x": 0.985, "y": 1.523, "c": "近傍", "n": "Triple Counter [A]  n=3126 cos0.99 難1.52", "s": 0.966, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.32884182765823833}, {"a": 0, "b": 2, "w": 0.46956303753885265}, {"a": 0, "b": 3, "w": 0.27234243556391846}, {"a": 0, "b": 4, "w": 0.23737128706170696}, {"a": 0, "b": 5, "w": 0.1788625720069954}, {"a": 0, "b": 6, "w": 0.18407327737026058}, {"a": 0, "b": 7, "w": 0.27976224251794546}, {"a": 0, "b": 8, "w": 0.14719895584548648}, {"a": 0, "b": 9, "w": 0.13881321168809768}, {"a": 0, "b": 10, "w": 0.11868595427349704}, {"a": 0, "b": 11, "w": 0.0790861291412942}, {"a": 0, "b": 12, "w": 0.16128803344595377}, {"a": 0, "b": 13, "w": 0.12778421621352043}, {"a": 0, "b": 14, "w": 0.17079767796252754}, {"a": 0, "b": 15, "w": 3.182942798218846e-11}, {"a": 0, "b": 16, "w": 0.0463831480467386}, {"a": 0, "b": 17, "w": 0.04757221588365168}, {"a": 0, "b": 18, "w": 0.11970926327856113}, {"a": 0, "b": 19, "w": 0.1453004963681852}, {"a": 0, "b": 20, "w": 0.09908313857659967}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=1.371,hiY=1.814;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
