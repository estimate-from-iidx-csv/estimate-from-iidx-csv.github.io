<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Don't let it go [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.249, "c": "種", "n": "Don't let it go [A]  n=1276 cos1.00 難-0.25", "s": 0.364, "f": 0}, {"x": 0.995, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.789, "f": 0}, {"x": 0.994, "y": -0.177, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3105 cos0.99 難-0.18", "s": 0.886, "f": 0}, {"x": 0.993, "y": -0.326, "c": "近傍", "n": "Clione [A]  n=2772 cos0.99 難-0.33", "s": 0.791, "f": 0}, {"x": 0.995, "y": -0.074, "c": "近傍", "n": "vault of heaven [A]  n=2933 cos0.99 難-0.07", "s": 0.837, "f": 0}, {"x": 0.992, "y": -0.258, "c": "近傍", "n": "NΦ CRIME [A]  n=2775 cos0.99 難-0.26", "s": 0.792, "f": 0}, {"x": 0.992, "y": -0.327, "c": "近傍", "n": "7 Colors [A]  n=1865 cos0.99 難-0.33", "s": 0.532, "f": 0}, {"x": 0.992, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.821, "f": 0}, {"x": 0.991, "y": -0.209, "c": "近傍", "n": "Star Trail [A]  n=3280 cos0.99 難-0.21", "s": 0.936, "f": 0}, {"x": 0.991, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos0.99 難-0.32", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.172, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=985 cos0.99 難-0.17", "s": 0.281, "f": 0}, {"x": 0.991, "y": -0.229, "c": "近傍", "n": "星をこの手に [A]  n=3012 cos0.99 難-0.23", "s": 0.86, "f": 0}, {"x": 0.991, "y": -0.249, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2707 cos0.99 難-0.25", "s": 0.773, "f": 0}, {"x": 0.991, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.931, "f": 0}, {"x": 0.991, "y": -0.253, "c": "近傍", "n": "GALGALIM [H]  n=2295 cos0.99 難-0.25", "s": 0.655, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Exchange Place [A]  n=2674 cos0.99 難-0.25", "s": 0.763, "f": 0}, {"x": 0.99, "y": -0.229, "c": "近傍", "n": "Umbral [A]  n=3238 cos0.99 難-0.23", "s": 0.924, "f": 0}, {"x": 0.991, "y": -0.324, "c": "近傍", "n": "Howling [A]  n=2820 cos0.99 難-0.32", "s": 0.805, "f": 0}, {"x": 0.991, "y": -0.193, "c": "近傍", "n": "SPEEDY CAT [A]  n=2409 cos0.99 難-0.19", "s": 0.688, "f": 0}, {"x": 0.991, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos0.99 難-0.12", "s": 0.869, "f": 0}, {"x": 0.992, "y": -0.423, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1009 cos0.99 難-0.42", "s": 0.288, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4243718677501749}, {"a": 0, "b": 2, "w": 0.411849244182663}, {"a": 0, "b": 3, "w": 0.3019610334975178}, {"a": 0, "b": 4, "w": 0.3404124806144452}, {"a": 0, "b": 5, "w": 0.27703142971460115}, {"a": 0, "b": 6, "w": 0.30372889994022845}, {"a": 0, "b": 7, "w": 0.12534307127030997}, {"a": 0, "b": 8, "w": 0.2786166299344389}, {"a": 0, "b": 9, "w": 0.27384890267006967}, {"a": 0, "b": 10, "w": 0.1853122487161215}, {"a": 0, "b": 11, "w": 0.12980619929312776}, {"a": 0, "b": 12, "w": 0.23338712758274083}, {"a": 0, "b": 13, "w": 5.6967874861868495e-11}, {"a": 0, "b": 14, "w": 0.07199742651871}, {"a": 0, "b": 15, "w": 0.2087941217612217}, {"a": 0, "b": 16, "w": 0.23402843523410155}, {"a": 0, "b": 17, "w": 0.1338386893120469}, {"a": 0, "b": 18, "w": 0.20987746189878131}, {"a": 0, "b": 19, "w": 0.237859549977944}, {"a": 0, "b": 20, "w": 0.32508260889449825}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.451,hiY=-0.046;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
