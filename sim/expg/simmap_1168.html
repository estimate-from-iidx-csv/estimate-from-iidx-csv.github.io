<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">リグレット [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.175, "c": "種", "n": "リグレット [A]  n=3193 cos1.00 難-0.18", "s": 0.866, "f": 0}, {"x": 0.997, "y": -0.151, "c": "近傍", "n": "Hold My Hand [A]  n=2571 cos1.00 難-0.15", "s": 0.698, "f": 0}, {"x": 0.997, "y": -0.189, "c": "近傍", "n": "ACCELERATE [A]  n=2996 cos1.00 難-0.19", "s": 0.813, "f": 0}, {"x": 0.997, "y": -0.249, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3204 cos1.00 難-0.25", "s": 0.869, "f": 0}, {"x": 0.996, "y": -0.172, "c": "近傍", "n": "深愛のリグレット [A]  n=2673 cos1.00 難-0.17", "s": 0.725, "f": 0}, {"x": 0.998, "y": -0.324, "c": "近傍", "n": "ラブキラ☆スプラッシュ [A]  n=2331 cos1.00 難-0.32", "s": 0.633, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Fly you to the star [A]  n=3230 cos1.00 難-0.14", "s": 0.877, "f": 0}, {"x": 0.997, "y": -0.006, "c": "近傍", "n": "The Story Begins [A]  n=2765 cos1.00 難-0.01", "s": 0.75, "f": 0}, {"x": 0.995, "y": -0.215, "c": "近傍", "n": "DM STAR～関西 energy style～ [A]  n=3104 cos0.99 難-0.22", "s": 0.842, "f": 0}, {"x": 0.995, "y": -0.081, "c": "近傍", "n": "Calvados Queen [A]  n=2623 cos0.99 難-0.08", "s": 0.712, "f": 0}, {"x": 0.995, "y": -0.282, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3305 cos0.99 難-0.28", "s": 0.897, "f": 0}, {"x": 0.996, "y": -0.006, "c": "近傍", "n": "Go Faraway [A]  n=2753 cos1.00 難-0.01", "s": 0.747, "f": 0}, {"x": 0.995, "y": -0.285, "c": "近傍", "n": "アルストロメリア [A]  n=3685 cos0.99 難-0.28", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.075, "c": "近傍", "n": "First Resolution [A]  n=2080 cos0.99 難-0.07", "s": 0.564, "f": 0}, {"x": 0.994, "y": -0.299, "c": "近傍", "n": "Answer [A]  n=3209 cos0.99 難-0.30", "s": 0.871, "f": 0}, {"x": 0.994, "y": -0.071, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3044 cos0.99 難-0.07", "s": 0.826, "f": 0}, {"x": 0.994, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos0.99 難-0.11", "s": 0.847, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "SHOOTING STAR [A]  n=2340 cos0.99 難-0.25", "s": 0.635, "f": 0}, {"x": 0.993, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3206 cos0.99 難-0.18", "s": 0.87, "f": 0}, {"x": 0.993, "y": -0.13, "c": "近傍", "n": "Be OK [A]  n=2979 cos0.99 難-0.13", "s": 0.808, "f": 0}, {"x": 0.993, "y": -0.176, "c": "近傍", "n": "Last Burning [A]  n=3166 cos0.99 難-0.18", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34011678993033156}, {"a": 0, "b": 2, "w": 0.3686854912474308}, {"a": 0, "b": 3, "w": 0.37430845703169846}, {"a": 0, "b": 4, "w": 0.3307133121311673}, {"a": 0, "b": 5, "w": 0.3731021488275633}, {"a": 0, "b": 6, "w": 0.21020936067815543}, {"a": 0, "b": 7, "w": 0.38796302280894135}, {"a": 0, "b": 8, "w": 0.10161133693179025}, {"a": 0, "b": 9, "w": 0.08971367386630258}, {"a": 0, "b": 10, "w": 0.17439055579879992}, {"a": 0, "b": 11, "w": 0.26421152641843404}, {"a": 0, "b": 12, "w": 0.18637726765529816}, {"a": 0, "b": 13, "w": 0.130340654460829}, {"a": 0, "b": 14, "w": 0.17779728614574042}, {"a": 0, "b": 15, "w": 0.025740046456090182}, {"a": 0, "b": 16, "w": 0.12247183107579651}, {"a": 0, "b": 17, "w": 0.059601091625128055}, {"a": 0, "b": 18, "w": 0.0850659417798455}, {"a": 0, "b": 19, "w": 0.09214467370832868}, {"a": 0, "b": 20, "w": 7.496836484932601e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.350,hiY=0.020;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
