<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Amor De Verao [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.073, "c": "種", "n": "Amor De Verao [A]  n=3609 cos1.00 難-0.07", "s": 0.968, "f": 0}, {"x": 0.993, "y": -0.078, "c": "近傍", "n": "HAT TRICK [A]  n=3212 cos0.99 難-0.08", "s": 0.862, "f": 0}, {"x": 0.994, "y": -0.302, "c": "近傍", "n": "WaterCube Pf.(RX-Ver.S.P.L.) [A]  n=967 cos0.99 難-0.30", "s": 0.259, "f": 0}, {"x": 0.992, "y": -0.121, "c": "近傍", "n": "グラナダの風 [A]  n=2828 cos0.99 難-0.12", "s": 0.759, "f": 0}, {"x": 0.992, "y": -0.059, "c": "近傍", "n": "B4U [A]  n=3223 cos0.99 難-0.06", "s": 0.865, "f": 0}, {"x": 0.992, "y": -0.301, "c": "近傍", "n": "Voo Doo Bamboleo [A]  n=2376 cos0.99 難-0.30", "s": 0.637, "f": 0}, {"x": 0.991, "y": 0.113, "c": "近傍", "n": "Make A Difference [A]  n=2549 cos0.99 難0.11", "s": 0.684, "f": 0}, {"x": 0.991, "y": -0.282, "c": "近傍", "n": "WAKE UP NOW [L]  n=601 cos0.99 難-0.28", "s": 0.161, "f": 0}, {"x": 0.991, "y": 0.178, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2685 cos0.99 難0.18", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.022, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2693 cos0.99 難-0.02", "s": 0.722, "f": 0}, {"x": 0.988, "y": 0.027, "c": "近傍", "n": "Don't be afraid myself [A]  n=2810 cos0.99 難0.03", "s": 0.754, "f": 0}, {"x": 0.987, "y": -0.094, "c": "近傍", "n": "Make Me Your Own [A]  n=2899 cos0.99 難-0.09", "s": 0.778, "f": 0}, {"x": 0.987, "y": -0.134, "c": "近傍", "n": "Daisuke [A]  n=3728 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos0.99 難-0.18", "s": 0.75, "f": 0}, {"x": 0.986, "y": -0.064, "c": "近傍", "n": "alla turca con passione [A]  n=2816 cos0.99 難-0.06", "s": 0.755, "f": 0}, {"x": 0.992, "y": 0.428, "c": "近傍", "n": "Sun Field [A]  n=3139 cos0.99 難0.43", "s": 0.842, "f": 0}, {"x": 0.986, "y": -0.105, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2953 cos0.99 難-0.10", "s": 0.792, "f": 0}, {"x": 0.987, "y": 0.087, "c": "近傍", "n": "refractive index [A]  n=3625 cos0.99 難0.09", "s": 0.972, "f": 0}, {"x": 0.991, "y": -0.553, "c": "近傍", "n": "Don't Stop The Music feat. Kanae Asaba [A]  n=2218 cos0.99 難-0.55", "s": 0.595, "f": 0}, {"x": 0.986, "y": -0.006, "c": "近傍", "n": "Cosmic Cat [A]  n=3683 cos0.99 難-0.01", "s": 0.988, "f": 0}, {"x": 0.986, "y": 0.073, "c": "近傍", "n": "Love Is Eternity [A]  n=3528 cos0.99 難0.07", "s": 0.946, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40540506220534145}, {"a": 0, "b": 2, "w": 0.39788117737603257}, {"a": 0, "b": 3, "w": 0.12189304266982781}, {"a": 0, "b": 4, "w": 0.2620118766498222}, {"a": 0, "b": 5, "w": 0.3498275885462553}, {"a": 0, "b": 6, "w": 0.28393771609035834}, {"a": 0, "b": 7, "w": 0.27540685832478373}, {"a": 0, "b": 8, "w": 0.3029885009307044}, {"a": 0, "b": 9, "w": 0.08122479294878648}, {"a": 0, "b": 10, "w": 0.21459197225244253}, {"a": 0, "b": 11, "w": 0.17587946976208146}, {"a": 0, "b": 12, "w": 0.17501023796206072}, {"a": 0, "b": 13, "w": 0.049845364569032324}, {"a": 0, "b": 14, "w": 0.12721091732499956}, {"a": 0, "b": 15, "w": 0.32817132657847436}, {"a": 0, "b": 16, "w": 0.10609270209442101}, {"a": 0, "b": 17, "w": 0.10434755535919604}, {"a": 0, "b": 18, "w": 0.08268060725968618}, {"a": 0, "b": 19, "w": 0.14645268923484067}, {"a": 0, "b": 20, "w": 4.6030512734773765e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.631,hiY=0.506;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
