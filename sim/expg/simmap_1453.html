<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">OTENAMI Hurricane [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.41, "c": "種", "n": "OTENAMI Hurricane [H]  n=2534 cos1.00 難-0.41", "s": 0.701, "f": 0}, {"x": 0.995, "y": -0.334, "c": "近傍", "n": "華蝶風雪 [H]  n=2939 cos0.99 難-0.33", "s": 0.813, "f": 0}, {"x": 0.996, "y": -0.571, "c": "近傍", "n": "アタシ完全絶対正義ちゃん！ [A]  n=1759 cos1.00 難-0.57", "s": 0.487, "f": 0}, {"x": 0.995, "y": -0.617, "c": "近傍", "n": "金野火織の金色提言 [H]  n=2548 cos0.99 難-0.62", "s": 0.705, "f": 0}, {"x": 0.995, "y": -0.182, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3352 cos0.99 難-0.18", "s": 0.927, "f": 0}, {"x": 0.995, "y": -0.133, "c": "近傍", "n": "Infinite cave [A]  n=3073 cos0.99 難-0.13", "s": 0.85, "f": 0}, {"x": 0.995, "y": -0.125, "c": "近傍", "n": "Breakin' Chain [A]  n=2889 cos1.00 難-0.12", "s": 0.799, "f": 0}, {"x": 0.992, "y": -0.335, "c": "近傍", "n": "Time to Air [H]  n=3128 cos0.99 難-0.33", "s": 0.865, "f": 0}, {"x": 0.992, "y": -0.498, "c": "近傍", "n": "neu [H]  n=2796 cos0.99 難-0.50", "s": 0.773, "f": 0}, {"x": 0.995, "y": -0.121, "c": "近傍", "n": "Shirdal [A]  n=692 cos0.99 難-0.12", "s": 0.191, "f": 0}, {"x": 0.993, "y": -0.588, "c": "近傍", "n": "Xperanza [H]  n=2615 cos0.99 難-0.59", "s": 0.723, "f": 0}, {"x": 0.992, "y": -0.379, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3009 cos0.99 難-0.38", "s": 0.832, "f": 0}, {"x": 0.992, "y": -0.341, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [H]  n=2717 cos0.99 難-0.34", "s": 0.752, "f": 0}, {"x": 0.992, "y": -0.311, "c": "近傍", "n": "純真可憐デザイア [A]  n=3593 cos0.99 難-0.31", "s": 0.994, "f": 0}, {"x": 0.992, "y": -0.548, "c": "近傍", "n": "かわいいだけじゃだめですか？ [A]  n=1107 cos0.99 難-0.55", "s": 0.306, "f": 0}, {"x": 0.995, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos1.00 難-0.06", "s": 0.843, "f": 0}, {"x": 0.991, "y": -0.292, "c": "近傍", "n": "零 - ZERO - [A]  n=3027 cos0.99 難-0.29", "s": 0.837, "f": 0}, {"x": 0.998, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos1.00 難0.01", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.172, "c": "近傍", "n": "bag [A]  n=2861 cos0.99 難-0.17", "s": 0.791, "f": 0}, {"x": 0.991, "y": -0.531, "c": "近傍", "n": "Skywalking [A]  n=615 cos0.99 難-0.53", "s": 0.17, "f": 0}, {"x": 0.994, "y": -0.078, "c": "近傍", "n": "memories [A]  n=2208 cos0.99 難-0.08", "s": 0.611, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.30656174401656666}, {"a": 0, "b": 2, "w": 0.26563536834901913}, {"a": 0, "b": 3, "w": 0.3043402706907612}, {"a": 0, "b": 4, "w": 0.3424526256699225}, {"a": 0, "b": 5, "w": 0.36733656552457294}, {"a": 0, "b": 6, "w": 0.38798930247099306}, {"a": 0, "b": 7, "w": 0.2277228507481147}, {"a": 0, "b": 8, "w": 0.2274882071503853}, {"a": 0, "b": 9, "w": 0.25752171206646013}, {"a": 0, "b": 10, "w": 0.15302963749842602}, {"a": 0, "b": 11, "w": 6.130229657230757e-11}, {"a": 0, "b": 12, "w": 0.04810702800447897}, {"a": 0, "b": 13, "w": 0.21174005800589935}, {"a": 0, "b": 14, "w": 0.20791119137335223}, {"a": 0, "b": 15, "w": 0.38144826196315174}, {"a": 0, "b": 16, "w": 0.18596169056096212}, {"a": 0, "b": 17, "w": 0.4819840704402877}, {"a": 0, "b": 18, "w": 0.2009507212362971}, {"a": 0, "b": 19, "w": 0.12854532698239085}, {"a": 0, "b": 20, "w": 0.2911156015790223}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.667,hiY=0.060;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
