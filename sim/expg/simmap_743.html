<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ALFARSHEAR 双神威に廻る夢 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.122, "c": "種", "n": "ALFARSHEAR 双神威に廻る夢 [A]  n=3245 cos1.00 難-0.12", "s": 0.884, "f": 0}, {"x": 0.996, "y": -0.078, "c": "近傍", "n": "memories [A]  n=2208 cos1.00 難-0.08", "s": 0.601, "f": 0}, {"x": 0.995, "y": -0.088, "c": "近傍", "n": "Abyss -The Heavens Remix- [A]  n=3137 cos1.00 難-0.09", "s": 0.855, "f": 0}, {"x": 0.994, "y": -0.132, "c": "近傍", "n": "Recollection [A]  n=2275 cos0.99 難-0.13", "s": 0.62, "f": 0}, {"x": 0.993, "y": -0.182, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3352 cos0.99 難-0.18", "s": 0.913, "f": 0}, {"x": 0.997, "y": -0.355, "c": "近傍", "n": "Alpheratz [A]  n=2959 cos1.00 難-0.36", "s": 0.806, "f": 0}, {"x": 0.992, "y": -0.134, "c": "近傍", "n": "ILIAS [A]  n=3049 cos0.99 難-0.13", "s": 0.831, "f": 0}, {"x": 0.992, "y": -0.156, "c": "近傍", "n": "Surf on the Light [A]  n=2492 cos0.99 難-0.16", "s": 0.679, "f": 0}, {"x": 0.992, "y": -0.079, "c": "近傍", "n": "Best of Me [A]  n=3060 cos0.99 難-0.08", "s": 0.834, "f": 0}, {"x": 0.992, "y": -0.176, "c": "近傍", "n": "LOVE IS ORANGE [L]  n=2305 cos0.99 難-0.18", "s": 0.628, "f": 0}, {"x": 0.993, "y": 0.037, "c": "近傍", "n": "into the battlefield [A]  n=2993 cos0.99 難0.04", "s": 0.815, "f": 0}, {"x": 0.992, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos0.99 難-0.05", "s": 0.842, "f": 0}, {"x": 0.992, "y": -0.049, "c": "近傍", "n": "3y3s [H]  n=3671 cos0.99 難-0.05", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.14, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3188 cos0.99 難-0.14", "s": 0.868, "f": 0}, {"x": 0.991, "y": -0.128, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3181 cos0.99 難-0.13", "s": 0.867, "f": 0}, {"x": 0.991, "y": -0.133, "c": "近傍", "n": "Infinite cave [A]  n=3073 cos0.99 難-0.13", "s": 0.837, "f": 0}, {"x": 0.993, "y": -0.332, "c": "近傍", "n": "COLOR BURST [A]  n=798 cos0.99 難-0.33", "s": 0.217, "f": 0}, {"x": 0.991, "y": -0.172, "c": "近傍", "n": "オルタネイトβ [A]  n=3288 cos0.99 難-0.17", "s": 0.896, "f": 0}, {"x": 0.991, "y": -0.121, "c": "近傍", "n": "Shirdal [A]  n=692 cos0.99 難-0.12", "s": 0.189, "f": 0}, {"x": 0.99, "y": -0.097, "c": "近傍", "n": "REMINISCENCE [A]  n=2781 cos0.99 難-0.10", "s": 0.758, "f": 0}, {"x": 0.991, "y": -0.248, "c": "近傍", "n": "華爛漫 -Flowers- [A]  n=3637 cos0.99 難-0.25", "s": 0.991, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5162586202833628}, {"a": 0, "b": 2, "w": 0.4472742388728861}, {"a": 0, "b": 3, "w": 0.3987310212892794}, {"a": 0, "b": 4, "w": 0.3875680786443705}, {"a": 0, "b": 5, "w": 0.4784547179985441}, {"a": 0, "b": 6, "w": 0.33460662477479985}, {"a": 0, "b": 7, "w": 0.35925649225032996}, {"a": 0, "b": 8, "w": 0.3297588823398463}, {"a": 0, "b": 9, "w": 0.3461588300941254}, {"a": 0, "b": 10, "w": 0.3766919971487178}, {"a": 0, "b": 11, "w": 0.29321168760556704}, {"a": 0, "b": 12, "w": 5.112488210556876e-11}, {"a": 0, "b": 13, "w": 0.2644690089731063}, {"a": 0, "b": 14, "w": 0.3185316419532611}, {"a": 0, "b": 15, "w": 0.2930385201908009}, {"a": 0, "b": 16, "w": 0.38700870802558063}, {"a": 0, "b": 17, "w": 0.24199945797469213}, {"a": 0, "b": 18, "w": 0.23930572224082491}, {"a": 0, "b": 19, "w": 0.283814167369174}, {"a": 0, "b": 20, "w": 0.2664869617926703}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.387,hiY=0.068;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
