<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Let me be your cure [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.112, "c": "種", "n": "Let me be your cure [A]  n=3101 cos1.00 難-0.11", "s": 0.828, "f": 0}, {"x": 0.997, "y": -0.128, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3181 cos1.00 難-0.13", "s": 0.849, "f": 0}, {"x": 0.998, "y": -0.212, "c": "近傍", "n": "Express Emotion [A]  n=3441 cos1.00 難-0.21", "s": 0.918, "f": 0}, {"x": 0.997, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos1.00 難-0.25", "s": 0.642, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "beatAffection [A]  n=2807 cos0.99 難-0.13", "s": 0.749, "f": 0}, {"x": 0.995, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos0.99 難-0.05", "s": 0.825, "f": 0}, {"x": 0.997, "y": -0.301, "c": "近傍", "n": "Tell me what you wish feat.らっぷびと [A]  n=2530 cos1.00 難-0.30", "s": 0.675, "f": 0}, {"x": 0.995, "y": -0.172, "c": "近傍", "n": "オルタネイトβ [A]  n=3288 cos0.99 難-0.17", "s": 0.878, "f": 0}, {"x": 0.995, "y": -0.033, "c": "近傍", "n": "Blind Justice ～Torn souls， Hurt Faiths ～ [A]  n=3747 cos0.99 難-0.03", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.058, "c": "近傍", "n": "ToyCube Pf.(RX-Ver.S.P.L.) [A]  n=1924 cos0.99 難-0.06", "s": 0.513, "f": 0}, {"x": 0.995, "y": 0.037, "c": "近傍", "n": "into the battlefield [A]  n=2993 cos0.99 難0.04", "s": 0.799, "f": 0}, {"x": 0.993, "y": -0.146, "c": "近傍", "n": "SHION [A]  n=3334 cos0.99 難-0.15", "s": 0.89, "f": 0}, {"x": 0.997, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos1.00 難-0.35", "s": 0.803, "f": 0}, {"x": 0.995, "y": -0.295, "c": "近傍", "n": "■□模様 [A]  n=1385 cos1.00 難-0.29", "s": 0.37, "f": 0}, {"x": 0.994, "y": -0.243, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2572 cos0.99 難-0.24", "s": 0.686, "f": 0}, {"x": 0.993, "y": -0.085, "c": "近傍", "n": "Hypersonik [A]  n=3142 cos0.99 難-0.08", "s": 0.839, "f": 0}, {"x": 0.996, "y": -0.328, "c": "近傍", "n": "Take It Easy [H]  n=2266 cos1.00 難-0.33", "s": 0.605, "f": 0}, {"x": 0.993, "y": -0.134, "c": "近傍", "n": "Τeλοs [A]  n=602 cos0.99 難-0.13", "s": 0.161, "f": 0}, {"x": 0.994, "y": -0.281, "c": "近傍", "n": "NNRT [H]  n=2896 cos0.99 難-0.28", "s": 0.773, "f": 0}, {"x": 0.994, "y": 0.082, "c": "近傍", "n": "LOVELY STORM [A]  n=2975 cos0.99 難0.08", "s": 0.794, "f": 0}, {"x": 0.992, "y": -0.121, "c": "近傍", "n": "Shirdal [A]  n=692 cos0.99 難-0.12", "s": 0.185, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5099997530098364}, {"a": 0, "b": 2, "w": 0.5990207686606905}, {"a": 0, "b": 3, "w": 0.45214624991436747}, {"a": 0, "b": 4, "w": 0.35590563517624096}, {"a": 0, "b": 5, "w": 0.31945855004495394}, {"a": 0, "b": 6, "w": 0.456145016882437}, {"a": 0, "b": 7, "w": 0.27537184399612613}, {"a": 0, "b": 8, "w": 0.36611434236774165}, {"a": 0, "b": 9, "w": 0.29818335804691376}, {"a": 0, "b": 10, "w": 0.3566933627479184}, {"a": 0, "b": 11, "w": 0.10636416908952862}, {"a": 0, "b": 12, "w": 0.5108901561365898}, {"a": 0, "b": 13, "w": 0.37237123571851205}, {"a": 0, "b": 14, "w": 0.33025285568579765}, {"a": 0, "b": 15, "w": 0.2625456259488931}, {"a": 0, "b": 16, "w": 0.4204363967296444}, {"a": 0, "b": 17, "w": 5.959621685036609e-11}, {"a": 0, "b": 18, "w": 0.13288483959419373}, {"a": 0, "b": 19, "w": 0.0641562344095965}, {"a": 0, "b": 20, "w": 0.18560650911631593}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.382,hiY=0.117;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
