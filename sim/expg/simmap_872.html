<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Good Looking [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.081, "c": "種", "n": "Good Looking [A]  n=756 cos1.00 難-0.08", "s": 0.23, "f": 0}, {"x": 0.995, "y": -0.132, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1357 cos0.99 難-0.13", "s": 0.413, "f": 0}, {"x": 0.994, "y": -0.106, "c": "近傍", "n": "As You Want [A]  n=1913 cos0.99 難-0.11", "s": 0.582, "f": 0}, {"x": 0.994, "y": -0.068, "c": "近傍", "n": "Neonlights [A]  n=3010 cos0.99 難-0.07", "s": 0.916, "f": 0}, {"x": 0.993, "y": -0.087, "c": "近傍", "n": "Super Duper Racers [A]  n=2871 cos0.99 難-0.09", "s": 0.874, "f": 0}, {"x": 0.992, "y": -0.049, "c": "近傍", "n": "yellow head joe [A]  n=3285 cos0.99 難-0.05", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.134, "c": "近傍", "n": "EXE [A]  n=3022 cos0.99 難-0.13", "s": 0.92, "f": 0}, {"x": 0.992, "y": -0.119, "c": "近傍", "n": "Shiva [A]  n=3020 cos0.99 難-0.12", "s": 0.919, "f": 0}, {"x": 0.992, "y": -0.033, "c": "近傍", "n": "GREEN EYES [A]  n=1808 cos0.99 難-0.03", "s": 0.55, "f": 0}, {"x": 0.992, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos0.99 難0.01", "s": 0.788, "f": 0}, {"x": 0.992, "y": 0.059, "c": "近傍", "n": "Sphere [A]  n=2890 cos0.99 難0.06", "s": 0.88, "f": 0}, {"x": 0.991, "y": -0.058, "c": "近傍", "n": "Phoenix [A]  n=3105 cos0.99 難-0.06", "s": 0.945, "f": 0}, {"x": 0.993, "y": -0.249, "c": "近傍", "n": "G59 [H]  n=2932 cos0.99 難-0.25", "s": 0.893, "f": 0}, {"x": 0.991, "y": -0.079, "c": "近傍", "n": "Vermillion [A]  n=2891 cos0.99 難-0.08", "s": 0.88, "f": 0}, {"x": 0.994, "y": -0.34, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1724 cos0.99 難-0.34", "s": 0.525, "f": 0}, {"x": 0.991, "y": -0.17, "c": "近傍", "n": "Vibing! Shake it! [A]  n=1364 cos0.99 難-0.17", "s": 0.415, "f": 0}, {"x": 0.991, "y": -0.007, "c": "近傍", "n": "ICARUS [H]  n=3024 cos0.99 難-0.01", "s": 0.921, "f": 0}, {"x": 0.991, "y": -0.075, "c": "近傍", "n": "First Resolution [A]  n=2080 cos0.99 難-0.07", "s": 0.633, "f": 0}, {"x": 0.991, "y": -0.229, "c": "近傍", "n": "星をこの手に [A]  n=3012 cos0.99 難-0.23", "s": 0.917, "f": 0}, {"x": 0.991, "y": -0.249, "c": "近傍", "n": "MENTAL MELTDOWN [H]  n=2510 cos0.99 難-0.25", "s": 0.764, "f": 0}, {"x": 0.99, "y": -0.079, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2845 cos0.99 難-0.08", "s": 0.866, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42788212835607264}, {"a": 0, "b": 2, "w": 0.24468683354959953}, {"a": 0, "b": 3, "w": 0.36182628718309673}, {"a": 0, "b": 4, "w": 0.34897954477803683}, {"a": 0, "b": 5, "w": 0.24065786856428628}, {"a": 0, "b": 6, "w": 0.19533482393991275}, {"a": 0, "b": 7, "w": 0.29314157405596497}, {"a": 0, "b": 8, "w": 0.2590132375139663}, {"a": 0, "b": 9, "w": 0.285486965677916}, {"a": 0, "b": 10, "w": 0.30835601517045197}, {"a": 0, "b": 11, "w": 0.26713792837163797}, {"a": 0, "b": 12, "w": 0.3196512997880432}, {"a": 0, "b": 13, "w": 0.2568969841607259}, {"a": 0, "b": 14, "w": 0.4111486668825637}, {"a": 0, "b": 15, "w": 0.21447908652364234}, {"a": 0, "b": 16, "w": 0.1973081174951642}, {"a": 0, "b": 17, "w": 0.13093225531657893}, {"a": 0, "b": 18, "w": 0.2009763889750228}, {"a": 0, "b": 19, "w": 0.2613563135993522}, {"a": 0, "b": 20, "w": 5.1490589569880285e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.372,hiY=0.091;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
