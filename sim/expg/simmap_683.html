<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">明鏡止水 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.229, "c": "種", "n": "明鏡止水 [H]  n=1440 cos1.00 難-1.23", "s": 0.592, "f": 0}, {"x": 0.997, "y": -1.203, "c": "近傍", "n": "Realize Maze [H]  n=1572 cos1.00 難-1.20", "s": 0.647, "f": 0}, {"x": 0.998, "y": -1.135, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1643 cos1.00 難-1.13", "s": 0.676, "f": 0}, {"x": 0.996, "y": -1.247, "c": "近傍", "n": "Arca [H]  n=1544 cos1.00 難-1.25", "s": 0.635, "f": 0}, {"x": 0.996, "y": -1.136, "c": "近傍", "n": "Primitive Vibes [H]  n=2431 cos1.00 難-1.14", "s": 1.0, "f": 0}, {"x": 0.995, "y": -1.288, "c": "近傍", "n": "No Border [H]  n=1428 cos0.99 難-1.29", "s": 0.587, "f": 0}, {"x": 0.995, "y": -1.353, "c": "近傍", "n": "セロトニン [H]  n=1489 cos0.99 難-1.35", "s": 0.613, "f": 0}, {"x": 0.994, "y": -1.288, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1634 cos0.99 難-1.29", "s": 0.672, "f": 0}, {"x": 0.996, "y": -1.419, "c": "近傍", "n": "Around The Galaxy [H]  n=1244 cos1.00 難-1.42", "s": 0.512, "f": 0}, {"x": 0.996, "y": -1.437, "c": "近傍", "n": "Discloze [H]  n=1377 cos1.00 難-1.44", "s": 0.566, "f": 0}, {"x": 0.992, "y": -1.167, "c": "近傍", "n": "RALLY '25 [H]  n=746 cos0.99 難-1.17", "s": 0.307, "f": 0}, {"x": 0.995, "y": -1.427, "c": "近傍", "n": "Amazing Mirage [H]  n=1854 cos0.99 難-1.43", "s": 0.763, "f": 0}, {"x": 0.991, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos0.99 難-1.29", "s": 0.643, "f": 0}, {"x": 0.991, "y": -1.233, "c": "近傍", "n": "Persephone [H]  n=1604 cos0.99 難-1.23", "s": 0.66, "f": 0}, {"x": 0.993, "y": -1.401, "c": "近傍", "n": "Begin [H]  n=607 cos0.99 難-1.40", "s": 0.25, "f": 0}, {"x": 0.99, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.497, "f": 0}, {"x": 0.994, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.918, "f": 0}, {"x": 0.99, "y": -1.292, "c": "近傍", "n": "TECHNO Style Essentials [H]  n=1349 cos0.99 難-1.29", "s": 0.555, "f": 0}, {"x": 0.99, "y": -1.294, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.99 難-1.29", "s": 0.647, "f": 0}, {"x": 0.99, "y": -1.067, "c": "近傍", "n": "刃図羅 [H]  n=2177 cos0.99 難-1.07", "s": 0.896, "f": 0}, {"x": 0.989, "y": -1.302, "c": "近傍", "n": "〆 [H]  n=1726 cos0.99 難-1.30", "s": 0.71, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6352737635508051}, {"a": 0, "b": 2, "w": 0.6845918128206119}, {"a": 0, "b": 3, "w": 0.5911360438080212}, {"a": 0, "b": 4, "w": 0.5437240593007755}, {"a": 0, "b": 5, "w": 0.5464061275718965}, {"a": 0, "b": 6, "w": 0.5198898396491463}, {"a": 0, "b": 7, "w": 0.418180468103728}, {"a": 0, "b": 8, "w": 0.5898429987046734}, {"a": 0, "b": 9, "w": 0.6079569375529823}, {"a": 0, "b": 10, "w": 0.15954547839254196}, {"a": 0, "b": 11, "w": 0.5356756713325412}, {"a": 0, "b": 12, "w": 0.25711941341836386}, {"a": 0, "b": 13, "w": 0.30931525234489576}, {"a": 0, "b": 14, "w": 0.36280754394195647}, {"a": 0, "b": 15, "w": 4.941491660304109e-11}, {"a": 0, "b": 16, "w": 0.49128341363860395}, {"a": 0, "b": 17, "w": 0.3102321286145222}, {"a": 0, "b": 18, "w": 0.3239178560970004}, {"a": 0, "b": 19, "w": 0.29165136289713056}, {"a": 0, "b": 20, "w": 0.02927438523973802}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.471,hiY=-0.978;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
