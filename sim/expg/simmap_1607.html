<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">キャトられ恋はモ～モク [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.321, "c": "種", "n": "キャトられ恋はモ～モク [H]  n=3044 cos1.00 難-0.32", "s": 0.817, "f": 0}, {"x": 0.995, "y": -0.322, "c": "近傍", "n": "Arabian Rave Night [H]  n=2707 cos1.00 難-0.32", "s": 0.726, "f": 0}, {"x": 0.994, "y": -0.183, "c": "近傍", "n": "Candy Galy [H]  n=2907 cos0.99 難-0.18", "s": 0.78, "f": 0}, {"x": 0.989, "y": -0.197, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2546 cos0.99 難-0.20", "s": 0.683, "f": 0}, {"x": 0.988, "y": -0.265, "c": "近傍", "n": "oratio [H]  n=2400 cos0.99 難-0.27", "s": 0.644, "f": 0}, {"x": 0.987, "y": -0.297, "c": "近傍", "n": "Aurora [H]  n=3068 cos0.99 難-0.30", "s": 0.823, "f": 0}, {"x": 0.987, "y": -0.33, "c": "近傍", "n": "GAIA [H]  n=2875 cos0.99 難-0.33", "s": 0.771, "f": 0}, {"x": 0.992, "y": -0.034, "c": "近傍", "n": "ANDROMEDA II [A]  n=3021 cos0.99 難-0.03", "s": 0.81, "f": 0}, {"x": 0.988, "y": -0.134, "c": "近傍", "n": "Daisuke [A]  n=3728 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.459, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2540 cos0.99 難-0.46", "s": 0.681, "f": 0}, {"x": 0.987, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.771, "f": 0}, {"x": 0.986, "y": -0.333, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2473 cos0.99 難-0.33", "s": 0.663, "f": 0}, {"x": 0.99, "y": -0.048, "c": "近傍", "n": "EXUSIA [H]  n=2981 cos0.99 難-0.05", "s": 0.8, "f": 0}, {"x": 0.988, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos0.99 難-0.10", "s": 0.852, "f": 0}, {"x": 0.988, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos0.99 難-0.11", "s": 0.869, "f": 0}, {"x": 0.986, "y": -0.267, "c": "近傍", "n": "Confiserie [H]  n=3058 cos0.99 難-0.27", "s": 0.82, "f": 0}, {"x": 0.985, "y": -0.298, "c": "近傍", "n": "A [H]  n=3013 cos0.99 難-0.30", "s": 0.808, "f": 0}, {"x": 0.986, "y": -0.249, "c": "近傍", "n": "Silvia Drive [A]  n=2192 cos0.99 難-0.25", "s": 0.588, "f": 0}, {"x": 0.988, "y": -0.089, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2946 cos0.99 難-0.09", "s": 0.79, "f": 0}, {"x": 0.987, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos0.99 難-0.11", "s": 0.795, "f": 0}, {"x": 0.987, "y": -0.103, "c": "近傍", "n": "double thrash [H]  n=2119 cos0.99 難-0.10", "s": 0.568, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4531667087739186}, {"a": 0, "b": 2, "w": 0.5002078735102379}, {"a": 0, "b": 3, "w": 0.3395164591490507}, {"a": 0, "b": 4, "w": 3.678723992095456e-11}, {"a": 0, "b": 5, "w": 0.2923220955887753}, {"a": 0, "b": 6, "w": 0.1939427942315295}, {"a": 0, "b": 7, "w": 0.25601367505324013}, {"a": 0, "b": 8, "w": 0.21609524993731932}, {"a": 0, "b": 9, "w": 0.10939721717135975}, {"a": 0, "b": 10, "w": 0.10463937353475139}, {"a": 0, "b": 11, "w": 0.18698487792565133}, {"a": 0, "b": 12, "w": 0.3645065008618713}, {"a": 0, "b": 13, "w": 0.11649302064241818}, {"a": 0, "b": 14, "w": 0.08231616664332941}, {"a": 0, "b": 15, "w": 0.25759005775307}, {"a": 0, "b": 16, "w": 0.20810134807755354}, {"a": 0, "b": 17, "w": 0.17475980003146308}, {"a": 0, "b": 18, "w": 0.19586885836943235}, {"a": 0, "b": 19, "w": 0.13652412219248888}, {"a": 0, "b": 20, "w": 0.08076146460438816}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-0.493,hiY=0.000;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
