<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Real [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.157, "c": "種", "n": "Real [A]  n=2334 cos1.00 難0.16", "s": 0.631, "f": 0}, {"x": 0.993, "y": -0.155, "c": "近傍", "n": "madrugada [A]  n=2176 cos0.99 難-0.15", "s": 0.588, "f": 0}, {"x": 0.99, "y": -0.007, "c": "近傍", "n": "Karma [A]  n=2666 cos0.99 難-0.01", "s": 0.721, "f": 0}, {"x": 0.989, "y": -0.122, "c": "近傍", "n": "ALFARSHEAR 双神威に廻る夢 [A]  n=3245 cos0.99 難-0.12", "s": 0.877, "f": 0}, {"x": 0.988, "y": -0.079, "c": "近傍", "n": "Best of Me [A]  n=3060 cos0.99 難-0.08", "s": 0.827, "f": 0}, {"x": 0.986, "y": 0.215, "c": "近傍", "n": "R5 [A]  n=3700 cos0.99 難0.22", "s": 1.0, "f": 0}, {"x": 0.986, "y": 0.219, "c": "近傍", "n": "Jack [A]  n=2846 cos0.99 難0.22", "s": 0.769, "f": 0}, {"x": 0.987, "y": -0.074, "c": "近傍", "n": "大桟橋 [A]  n=2652 cos0.99 難-0.07", "s": 0.717, "f": 0}, {"x": 0.987, "y": -0.106, "c": "近傍", "n": "Broken My Heart [A]  n=2210 cos0.99 難-0.11", "s": 0.597, "f": 0}, {"x": 0.986, "y": -0.078, "c": "近傍", "n": "memories [A]  n=2208 cos0.99 難-0.08", "s": 0.597, "f": 0}, {"x": 0.986, "y": -0.041, "c": "近傍", "n": "Cradle [A]  n=2418 cos0.99 難-0.04", "s": 0.654, "f": 0}, {"x": 0.987, "y": -0.134, "c": "近傍", "n": "Luv 2 Feel Your Body [A]  n=1932 cos0.99 難-0.13", "s": 0.522, "f": 0}, {"x": 0.985, "y": 0.137, "c": "近傍", "n": "クルクル☆ラブ～Opioid Peptide MIX～ [A]  n=3036 cos0.98 難0.14", "s": 0.821, "f": 0}, {"x": 0.987, "y": -0.172, "c": "近傍", "n": "bag [A]  n=2861 cos0.99 難-0.17", "s": 0.773, "f": 0}, {"x": 0.986, "y": -0.091, "c": "近傍", "n": "Rainbow after snow [A]  n=3284 cos0.99 難-0.09", "s": 0.888, "f": 0}, {"x": 0.987, "y": -0.182, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3352 cos0.99 難-0.18", "s": 0.906, "f": 0}, {"x": 0.985, "y": 0.201, "c": "近傍", "n": "TRIP MACHINE PhoeniX [A]  n=1785 cos0.98 難0.20", "s": 0.482, "f": 0}, {"x": 0.991, "y": -0.335, "c": "近傍", "n": "FEEL IT [H]  n=1810 cos0.99 難-0.33", "s": 0.489, "f": 0}, {"x": 0.984, "y": 0.003, "c": "近傍", "n": "水上の提督(Short mix from \"幻想水滸伝V\") [A]  n=3097 cos0.98 難0.00", "s": 0.837, "f": 0}, {"x": 0.99, "y": -0.334, "c": "近傍", "n": "華蝶風雪 [H]  n=2939 cos0.99 難-0.33", "s": 0.794, "f": 0}, {"x": 0.984, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos0.98 難0.01", "s": 0.977, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.475430104505861}, {"a": 0, "b": 2, "w": 0.3410599265247988}, {"a": 0, "b": 3, "w": 0.17699448538577744}, {"a": 0, "b": 4, "w": 0.2528119652720101}, {"a": 0, "b": 5, "w": 0.0813342260340143}, {"a": 0, "b": 6, "w": 0.20110886309218268}, {"a": 0, "b": 7, "w": 0.2731646838346117}, {"a": 0, "b": 8, "w": 0.30144988507003323}, {"a": 0, "b": 9, "w": 0.10953963869518912}, {"a": 0, "b": 10, "w": 0.2897735031096589}, {"a": 0, "b": 11, "w": 0.30874116571563115}, {"a": 0, "b": 12, "w": 4.640843265235617e-11}, {"a": 0, "b": 13, "w": 0.26278290124282233}, {"a": 0, "b": 14, "w": 0.2868102429878757}, {"a": 0, "b": 15, "w": 0.23574640543472214}, {"a": 0, "b": 16, "w": 0.04100547289639489}, {"a": 0, "b": 17, "w": 0.2842530685765805}, {"a": 0, "b": 18, "w": 0.13989111359386597}, {"a": 0, "b": 19, "w": 0.35342438756286154}, {"a": 0, "b": 20, "w": 0.19392593772284783}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.379,hiY=0.263;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
