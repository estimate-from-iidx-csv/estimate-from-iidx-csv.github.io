<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Makin' It [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.867, "c": "種", "n": "Makin' It [A]  n=966 cos1.00 難1.87", "s": 0.278, "f": 0}, {"x": 0.992, "y": 2.14, "c": "近傍", "n": "SAMURAI-Scramble [L]  n=1663 cos0.99 難2.14", "s": 0.479, "f": 0}, {"x": 0.985, "y": 2.066, "c": "近傍", "n": "灼熱Beach Side Bunny [A]  n=3250 cos0.98 難2.07", "s": 0.936, "f": 0}, {"x": 0.983, "y": 2.041, "c": "近傍", "n": "Level 5 [A]  n=1095 cos0.98 難2.04", "s": 0.315, "f": 0}, {"x": 0.986, "y": 1.54, "c": "近傍", "n": "Snake Stick [A]  n=3365 cos0.99 難1.54", "s": 0.969, "f": 0}, {"x": 0.986, "y": 1.43, "c": "近傍", "n": "199024club -Re:BounceKiller- [A]  n=3341 cos0.99 難1.43", "s": 0.962, "f": 0}, {"x": 0.977, "y": 2.111, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [A]  n=2778 cos0.98 難2.11", "s": 0.8, "f": 0}, {"x": 0.975, "y": 1.948, "c": "近傍", "n": "Level 4 [A]  n=1726 cos0.97 難1.95", "s": 0.497, "f": 0}, {"x": 0.979, "y": 1.512, "c": "近傍", "n": "Peaktime Booster [A]  n=1913 cos0.98 難1.51", "s": 0.551, "f": 0}, {"x": 0.975, "y": 2.1, "c": "近傍", "n": "Skratch Education Lv-1 [A]  n=717 cos0.98 難2.10", "s": 0.206, "f": 0}, {"x": 0.972, "y": 1.97, "c": "近傍", "n": "Level One [A]  n=2920 cos0.97 難1.97", "s": 0.841, "f": 0}, {"x": 0.972, "y": 1.577, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1567 cos0.97 難1.58", "s": 0.451, "f": 0}, {"x": 0.974, "y": 1.376, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3474 cos0.97 難1.38", "s": 1.0, "f": 0}, {"x": 0.968, "y": 2.061, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [A]  n=1815 cos0.97 難2.06", "s": 0.522, "f": 0}, {"x": 0.967, "y": 1.733, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3297 cos0.97 難1.73", "s": 0.949, "f": 0}, {"x": 0.967, "y": 1.704, "c": "近傍", "n": "Level 3 [A]  n=2164 cos0.97 難1.70", "s": 0.623, "f": 0}, {"x": 0.974, "y": 1.293, "c": "近傍", "n": "火影 [A]  n=3397 cos0.97 難1.29", "s": 0.978, "f": 0}, {"x": 0.971, "y": 1.377, "c": "近傍", "n": "MAD ATTACK [L]  n=1390 cos0.97 難1.38", "s": 0.4, "f": 0}, {"x": 0.974, "y": 1.237, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2499 cos0.97 難1.24", "s": 0.719, "f": 0}, {"x": 0.963, "y": 1.868, "c": "近傍", "n": "Lords Of The Roundtable [A]  n=2508 cos0.96 難1.87", "s": 0.722, "f": 0}, {"x": 0.963, "y": 1.949, "c": "近傍", "n": "Miracle 5ympho X [L]  n=1293 cos0.96 難1.95", "s": 0.372, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48821289265282575}, {"a": 0, "b": 2, "w": 0.3120138184932568}, {"a": 0, "b": 3, "w": 0.16344658856347705}, {"a": 0, "b": 4, "w": 0.5074022159298197}, {"a": 0, "b": 5, "w": 0.4385945694633755}, {"a": 0, "b": 6, "w": 0.09176019421287773}, {"a": 0, "b": 7, "w": 0.11589029976667331}, {"a": 0, "b": 8, "w": 0.4068026565026339}, {"a": 0, "b": 9, "w": 1.8847590155246507e-11}, {"a": 0, "b": 10, "w": 0.22642184790018138}, {"a": 0, "b": 11, "w": 0.3085234305374539}, {"a": 0, "b": 12, "w": 0.3449322184097513}, {"a": 0, "b": 13, "w": 0.03503902415283133}, {"a": 0, "b": 14, "w": 0.08939087735353213}, {"a": 0, "b": 15, "w": 0.09323593772200145}, {"a": 0, "b": 16, "w": 0.32418413211280883}, {"a": 0, "b": 17, "w": 0.2971730600336372}, {"a": 0, "b": 18, "w": 0.3008583698136109}, {"a": 0, "b": 19, "w": 0.1571146966864092}, {"a": 0, "b": 20, "w": 0.20326389970271497}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.960,hiX=1.003,loY=1.165,hiY=2.212;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
