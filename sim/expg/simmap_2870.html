<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE PEERLESS UNDER HEAVEN [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.952, "c": "種", "n": "THE PEERLESS UNDER HEAVEN [A]  n=2329 cos1.00 難1.95", "s": 0.706, "f": 0}, {"x": 0.993, "y": 1.97, "c": "近傍", "n": "Level One [A]  n=2920 cos0.99 難1.97", "s": 0.886, "f": 0}, {"x": 0.992, "y": 1.964, "c": "近傍", "n": "WHA [A]  n=1875 cos0.99 難1.96", "s": 0.569, "f": 0}, {"x": 0.995, "y": 1.758, "c": "近傍", "n": "HEROES [A]  n=571 cos0.99 難1.76", "s": 0.173, "f": 0}, {"x": 0.997, "y": 1.704, "c": "近傍", "n": "Level 3 [A]  n=2164 cos1.00 難1.70", "s": 0.656, "f": 0}, {"x": 0.995, "y": 1.665, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3145 cos1.00 難1.67", "s": 0.954, "f": 0}, {"x": 0.989, "y": 1.858, "c": "近傍", "n": "SOLAR ECLIPSE [A]  n=1657 cos0.99 難1.86", "s": 0.503, "f": 0}, {"x": 0.998, "y": 1.628, "c": "近傍", "n": "Cult Invitation [A]  n=1260 cos1.00 難1.63", "s": 0.382, "f": 0}, {"x": 0.988, "y": 1.948, "c": "近傍", "n": "Level 4 [A]  n=1726 cos0.99 難1.95", "s": 0.524, "f": 0}, {"x": 0.989, "y": 1.795, "c": "近傍", "n": "CODE:0 [L]  n=1246 cos0.99 難1.80", "s": 0.378, "f": 0}, {"x": 0.984, "y": 1.917, "c": "近傍", "n": "紫陽花 -AZISAI- [L]  n=1076 cos0.98 難1.92", "s": 0.326, "f": 0}, {"x": 0.984, "y": 2.061, "c": "近傍", "n": "RAGE feat.H14 of LEONAIR [A]  n=1815 cos0.98 難2.06", "s": 0.551, "f": 0}, {"x": 0.985, "y": 1.733, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3297 cos0.99 難1.73", "s": 1.0, "f": 0}, {"x": 0.984, "y": 2.108, "c": "近傍", "n": "疾風迅雷 [L]  n=2110 cos0.98 難2.11", "s": 0.64, "f": 0}, {"x": 0.986, "y": 1.672, "c": "近傍", "n": "invoker [L]  n=2632 cos0.99 難1.67", "s": 0.798, "f": 0}, {"x": 0.983, "y": 1.899, "c": "近傍", "n": "焔極OVERKILL [A]  n=2757 cos0.98 難1.90", "s": 0.836, "f": 0}, {"x": 0.983, "y": 1.949, "c": "近傍", "n": "カジノファイヤーことみちゃん [L]  n=1073 cos0.98 難1.95", "s": 0.325, "f": 0}, {"x": 0.983, "y": 1.923, "c": "近傍", "n": "Bad Encryption [A]  n=1815 cos0.98 難1.92", "s": 0.551, "f": 0}, {"x": 0.985, "y": 1.692, "c": "近傍", "n": "Be quiet [L]  n=2107 cos0.99 難1.69", "s": 0.639, "f": 0}, {"x": 0.982, "y": 2.011, "c": "近傍", "n": "Plan 8 [A]  n=2857 cos0.98 難2.01", "s": 0.867, "f": 0}, {"x": 0.984, "y": 1.719, "c": "近傍", "n": "TOMAHAWK [A]  n=1923 cos0.98 難1.72", "s": 0.583, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4390320727111079}, {"a": 0, "b": 2, "w": 0.3262325124321337}, {"a": 0, "b": 3, "w": 0.4755186409581539}, {"a": 0, "b": 4, "w": 0.5536285125714314}, {"a": 0, "b": 5, "w": 0.3937401155010507}, {"a": 0, "b": 6, "w": 0.25882832005340584}, {"a": 0, "b": 7, "w": 0.5189042821071034}, {"a": 0, "b": 8, "w": 0.15398087972450003}, {"a": 0, "b": 9, "w": 0.24750384785904034}, {"a": 0, "b": 10, "w": 0.11365094109018059}, {"a": 0, "b": 11, "w": 0.018590587809757975}, {"a": 0, "b": 12, "w": 0.1197397660655588}, {"a": 0, "b": 13, "w": 0.09128567855830516}, {"a": 0, "b": 14, "w": 0.1547181422258267}, {"a": 0, "b": 15, "w": 0.06493166139584972}, {"a": 0, "b": 16, "w": 0.10059683646712636}, {"a": 0, "b": 17, "w": 0.08485062668597443}, {"a": 0, "b": 18, "w": 0.09155248086802947}, {"a": 0, "b": 19, "w": 2.8868574197815633e-11}, {"a": 0, "b": 20, "w": 0.11630160693080627}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=1.590,hiY=2.147;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
