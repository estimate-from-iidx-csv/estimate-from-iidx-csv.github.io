<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">バンブーソード・ガール [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.488, "c": "種", "n": "バンブーソード・ガール [A]  n=3438 cos1.00 難0.49", "s": 0.925, "f": 0}, {"x": 0.993, "y": 0.296, "c": "近傍", "n": "KHAMEN BREAK [A]  n=3461 cos0.99 難0.30", "s": 0.931, "f": 0}, {"x": 0.99, "y": 0.448, "c": "近傍", "n": "CONTRACT [A]  n=3401 cos0.99 難0.45", "s": 0.915, "f": 0}, {"x": 0.986, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.931, "f": 0}, {"x": 0.991, "y": 0.205, "c": "近傍", "n": "IX [H]  n=3474 cos0.99 難0.21", "s": 0.934, "f": 0}, {"x": 0.986, "y": 0.545, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3008 cos0.99 難0.55", "s": 0.809, "f": 0}, {"x": 0.991, "y": 0.196, "c": "近傍", "n": "GuNGNiR [H]  n=3421 cos0.99 難0.20", "s": 0.92, "f": 0}, {"x": 0.99, "y": 0.778, "c": "近傍", "n": "もっと！モット！ときめき feat. 松下 [A]  n=3257 cos0.99 難0.78", "s": 0.876, "f": 0}, {"x": 0.991, "y": 0.153, "c": "近傍", "n": "M.D.Injection [A]  n=2857 cos0.99 難0.15", "s": 0.768, "f": 0}, {"x": 0.986, "y": 0.287, "c": "近傍", "n": "reunion [H]  n=3561 cos0.99 難0.29", "s": 0.958, "f": 0}, {"x": 0.986, "y": 0.693, "c": "近傍", "n": "In the Blackest Den [A]  n=3290 cos0.99 難0.69", "s": 0.885, "f": 0}, {"x": 0.99, "y": 0.164, "c": "近傍", "n": "FINALLY BLAZE [A]  n=2532 cos0.99 難0.16", "s": 0.681, "f": 0}, {"x": 0.984, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos0.98 難0.59", "s": 0.912, "f": 0}, {"x": 0.985, "y": 0.308, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3376 cos0.99 難0.31", "s": 0.908, "f": 0}, {"x": 0.985, "y": 0.314, "c": "近傍", "n": "murmur twins [A]  n=3523 cos0.98 難0.31", "s": 0.948, "f": 0}, {"x": 0.985, "y": 0.284, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [H]  n=3617 cos0.99 難0.28", "s": 0.973, "f": 0}, {"x": 0.984, "y": 0.403, "c": "近傍", "n": "INVISIBLE STRIX [A]  n=3037 cos0.98 難0.40", "s": 0.817, "f": 0}, {"x": 0.984, "y": 0.318, "c": "近傍", "n": "LASER CRUSTER [H]  n=3202 cos0.98 難0.32", "s": 0.861, "f": 0}, {"x": 0.987, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos0.99 難0.21", "s": 0.643, "f": 0}, {"x": 0.983, "y": 0.565, "c": "近傍", "n": "Be a Hero! [A]  n=3193 cos0.98 難0.57", "s": 0.859, "f": 0}, {"x": 0.986, "y": 0.205, "c": "近傍", "n": "嘆きの樹 [H]  n=3718 cos0.99 難0.20", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3059793677782404}, {"a": 0, "b": 2, "w": 0.10100186972358638}, {"a": 0, "b": 3, "w": 0.244724085556566}, {"a": 0, "b": 4, "w": 0.30965913780077037}, {"a": 0, "b": 5, "w": 0.013069603572901767}, {"a": 0, "b": 6, "w": 0.35967321066079017}, {"a": 0, "b": 7, "w": 0.30882092240950565}, {"a": 0, "b": 8, "w": 0.3463478607036957}, {"a": 0, "b": 9, "w": 0.19548735611798884}, {"a": 0, "b": 10, "w": 0.2350587817792349}, {"a": 0, "b": 11, "w": 0.3315454892720344}, {"a": 0, "b": 12, "w": 0.18846658340436484}, {"a": 0, "b": 13, "w": 0.11745697324629867}, {"a": 0, "b": 14, "w": 0.09755244387870865}, {"a": 0, "b": 15, "w": 0.16376918690314657}, {"a": 0, "b": 16, "w": 0.17161906472103916}, {"a": 0, "b": 17, "w": 3.6472713738078255e-11}, {"a": 0, "b": 18, "w": 0.04942774965149743}, {"a": 0, "b": 19, "w": 0.1398195516486027}, {"a": 0, "b": 20, "w": 0.14858569080665118}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.104,hiY=0.828;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
