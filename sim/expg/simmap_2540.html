<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Broken Sword [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.207, "c": "種", "n": "Broken Sword [A]  n=3380 cos1.00 難1.21", "s": 0.954, "f": 0}, {"x": 0.995, "y": 1.189, "c": "近傍", "n": "Viridian [A]  n=2628 cos1.00 難1.19", "s": 0.742, "f": 0}, {"x": 0.995, "y": 1.233, "c": "近傍", "n": "refrain [A]  n=3320 cos0.99 難1.23", "s": 0.937, "f": 0}, {"x": 0.994, "y": 1.152, "c": "近傍", "n": "華爛漫 -Flowers- [L]  n=2166 cos0.99 難1.15", "s": 0.611, "f": 0}, {"x": 0.997, "y": 1.305, "c": "近傍", "n": "Sky High [A]  n=3274 cos1.00 難1.31", "s": 0.924, "f": 0}, {"x": 0.993, "y": 1.206, "c": "近傍", "n": "Vinculum stellarum [A]  n=2767 cos0.99 難1.21", "s": 0.781, "f": 0}, {"x": 0.996, "y": 1.306, "c": "近傍", "n": "SYNC-ANTHEM [A]  n=3162 cos1.00 難1.31", "s": 0.892, "f": 0}, {"x": 0.992, "y": 1.185, "c": "近傍", "n": "HARD BRAIN [A]  n=3021 cos0.99 難1.18", "s": 0.852, "f": 0}, {"x": 0.993, "y": 1.281, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3247 cos0.99 難1.28", "s": 0.916, "f": 0}, {"x": 0.991, "y": 1.249, "c": "近傍", "n": "AA -rebuild- [A]  n=3341 cos0.99 難1.25", "s": 0.943, "f": 0}, {"x": 0.995, "y": 1.093, "c": "近傍", "n": "GOLDEN CROSS [A]  n=3532 cos0.99 難1.09", "s": 0.997, "f": 0}, {"x": 0.993, "y": 1.11, "c": "近傍", "n": "spiral galaxy [L]  n=3066 cos0.99 難1.11", "s": 0.865, "f": 0}, {"x": 0.995, "y": 1.342, "c": "近傍", "n": "Shooting Fireball [A]  n=3214 cos1.00 難1.34", "s": 0.907, "f": 0}, {"x": 0.99, "y": 1.193, "c": "近傍", "n": "GENE [A]  n=3133 cos0.99 難1.19", "s": 0.884, "f": 0}, {"x": 0.991, "y": 1.163, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3269 cos0.99 難1.16", "s": 0.922, "f": 0}, {"x": 0.991, "y": 1.281, "c": "近傍", "n": "Colorful Cookie [A]  n=3544 cos0.99 難1.28", "s": 1.0, "f": 0}, {"x": 0.99, "y": 1.209, "c": "近傍", "n": "Super Duper Racers [L]  n=727 cos0.99 難1.21", "s": 0.205, "f": 0}, {"x": 0.989, "y": 1.189, "c": "近傍", "n": "不沈艦CANDY [A]  n=3413 cos0.99 難1.19", "s": 0.963, "f": 0}, {"x": 0.993, "y": 1.08, "c": "近傍", "n": "Ypsilon [L]  n=2338 cos0.99 難1.08", "s": 0.66, "f": 0}, {"x": 0.992, "y": 1.095, "c": "近傍", "n": "Space Battleship S4TO [A]  n=965 cos0.99 難1.09", "s": 0.272, "f": 0}, {"x": 0.992, "y": 1.342, "c": "近傍", "n": "GUILTY [L]  n=1224 cos0.99 難1.34", "s": 0.345, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2789915091515398}, {"a": 0, "b": 2, "w": 0.3887676929620769}, {"a": 0, "b": 3, "w": 0.2402044377484499}, {"a": 0, "b": 4, "w": 0.6051384865399775}, {"a": 0, "b": 5, "w": 0.29692456701091063}, {"a": 0, "b": 6, "w": 0.47237214084810086}, {"a": 0, "b": 7, "w": 0.26635963526407025}, {"a": 0, "b": 8, "w": 3.334699183454859e-11}, {"a": 0, "b": 9, "w": 0.22847182843420932}, {"a": 0, "b": 10, "w": 0.29636397213439325}, {"a": 0, "b": 11, "w": 0.1363567572026788}, {"a": 0, "b": 12, "w": 0.4857927330796721}, {"a": 0, "b": 13, "w": 0.25680238928036214}, {"a": 0, "b": 14, "w": 0.09406232812394177}, {"a": 0, "b": 15, "w": 0.2512356827721026}, {"a": 0, "b": 16, "w": 0.23292362416673718}, {"a": 0, "b": 17, "w": 0.13658291581132598}, {"a": 0, "b": 18, "w": 0.1973013191135442}, {"a": 0, "b": 19, "w": 0.2989825603393199}, {"a": 0, "b": 20, "w": 0.22361137729660574}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=1.059,hiY=1.363;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
