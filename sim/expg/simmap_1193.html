<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">新宝島 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.398, "c": "種", "n": "新宝島 [A]  n=2969 cos1.00 難-0.40", "s": 0.858, "f": 0}, {"x": 0.989, "y": -0.059, "c": "近傍", "n": "Donkey Donk [A]  n=3461 cos0.99 難-0.06", "s": 1.0, "f": 0}, {"x": 0.986, "y": -0.801, "c": "近傍", "n": "THE F∀UST [H]  n=1849 cos0.99 難-0.80", "s": 0.534, "f": 0}, {"x": 0.982, "y": -0.177, "c": "近傍", "n": "口カラ凸ゲキ [A]  n=2515 cos0.98 難-0.18", "s": 0.727, "f": 0}, {"x": 0.99, "y": 0.14, "c": "近傍", "n": "Rejection Girl [A]  n=2657 cos0.99 難0.14", "s": 0.768, "f": 0}, {"x": 0.979, "y": -0.362, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2474 cos0.98 難-0.36", "s": 0.715, "f": 0}, {"x": 0.986, "y": 0.075, "c": "近傍", "n": "The Best of Both Worlds [A]  n=2644 cos0.99 難0.07", "s": 0.764, "f": 0}, {"x": 0.987, "y": -0.911, "c": "近傍", "n": "Unbelief [H]  n=1472 cos0.99 難-0.91", "s": 0.425, "f": 0}, {"x": 0.979, "y": -0.501, "c": "近傍", "n": "TOGAKUSHI [H]  n=2627 cos0.98 難-0.50", "s": 0.759, "f": 0}, {"x": 0.979, "y": -0.617, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1115 cos0.98 難-0.62", "s": 0.322, "f": 0}, {"x": 0.984, "y": -0.859, "c": "近傍", "n": "Initiation [H]  n=2332 cos0.98 難-0.86", "s": 0.674, "f": 0}, {"x": 0.989, "y": -1.001, "c": "近傍", "n": "ディスコルディア [H]  n=1571 cos0.99 難-1.00", "s": 0.454, "f": 0}, {"x": 0.978, "y": -0.213, "c": "近傍", "n": "OUTER PLANETS [A]  n=2510 cos0.98 難-0.21", "s": 0.725, "f": 0}, {"x": 0.977, "y": -0.311, "c": "近傍", "n": "IDOL syndrome. [A]  n=3142 cos0.98 難-0.31", "s": 0.908, "f": 0}, {"x": 0.977, "y": -0.177, "c": "近傍", "n": "Several Words [A]  n=3035 cos0.98 難-0.18", "s": 0.877, "f": 0}, {"x": 0.977, "y": -0.588, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2439 cos0.98 難-0.59", "s": 0.705, "f": 0}, {"x": 0.976, "y": -0.379, "c": "近傍", "n": "海神 [H]  n=3059 cos0.98 難-0.38", "s": 0.884, "f": 0}, {"x": 0.981, "y": -0.883, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2206 cos0.98 難-0.88", "s": 0.637, "f": 0}, {"x": 0.976, "y": -0.172, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=985 cos0.98 難-0.17", "s": 0.285, "f": 0}, {"x": 0.979, "y": 0.04, "c": "近傍", "n": "SOMETHING WONDERFUL [A]  n=2445 cos0.98 難0.04", "s": 0.706, "f": 0}, {"x": 0.982, "y": -0.97, "c": "近傍", "n": "Godspeed [H]  n=2819 cos0.98 難-0.97", "s": 0.815, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34910623267095864}, {"a": 0, "b": 2, "w": 0.2941681299673129}, {"a": 0, "b": 3, "w": 0.18983303538939666}, {"a": 0, "b": 4, "w": 0.26547625096415095}, {"a": 0, "b": 5, "w": 0.1378058021406925}, {"a": 0, "b": 6, "w": 0.28690716080128864}, {"a": 0, "b": 7, "w": 0.29651391515268}, {"a": 0, "b": 8, "w": 0.14497671778101306}, {"a": 0, "b": 9, "w": 3.674660575825328e-11}, {"a": 0, "b": 10, "w": 0.24368708290943975}, {"a": 0, "b": 11, "w": 0.37975314316354625}, {"a": 0, "b": 12, "w": 0.1325276706470122}, {"a": 0, "b": 13, "w": 0.03488226207868328}, {"a": 0, "b": 14, "w": 0.1198952693754538}, {"a": 0, "b": 15, "w": 0.08962462845109143}, {"a": 0, "b": 16, "w": 0.024007686774869863}, {"a": 0, "b": 17, "w": 0.09349147545222258}, {"a": 0, "b": 18, "w": 0.019343261554484625}, {"a": 0, "b": 19, "w": 0.036226693971287416}, {"a": 0, "b": 20, "w": 0.15542245013093048}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=-1.093,hiY=0.231;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
