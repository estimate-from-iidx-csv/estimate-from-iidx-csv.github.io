<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Somnidiscotheque [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.126, "c": "種", "n": "Somnidiscotheque [A]  n=1471 cos1.00 難2.13", "s": 0.468, "f": 0}, {"x": 0.981, "y": 1.982, "c": "近傍", "n": "Carmina [A]  n=2515 cos0.98 難1.98", "s": 0.8, "f": 0}, {"x": 0.981, "y": 1.956, "c": "近傍", "n": "Everlasting Message [A]  n=2262 cos0.98 難1.96", "s": 0.72, "f": 0}, {"x": 0.979, "y": 2.116, "c": "近傍", "n": "Illegal Function Call [L]  n=1236 cos0.98 難2.12", "s": 0.393, "f": 0}, {"x": 0.981, "y": 1.803, "c": "近傍", "n": "Almagest [A]  n=3142 cos0.98 難1.80", "s": 1.0, "f": 0}, {"x": 0.979, "y": 1.812, "c": "近傍", "n": "共鳴遊戯の華 [A]  n=2986 cos0.98 難1.81", "s": 0.95, "f": 0}, {"x": 0.984, "y": 1.681, "c": "近傍", "n": "COSMIC RAY [A]  n=1983 cos0.98 難1.68", "s": 0.631, "f": 0}, {"x": 0.974, "y": 2.14, "c": "近傍", "n": "Mare Nectaris [A]  n=2765 cos0.97 難2.14", "s": 0.88, "f": 0}, {"x": 0.973, "y": 2.116, "c": "近傍", "n": "惑星鉄道 [A]  n=1100 cos0.97 難2.12", "s": 0.35, "f": 0}, {"x": 0.974, "y": 1.987, "c": "近傍", "n": "TRANOID [L]  n=1596 cos0.97 難1.99", "s": 0.508, "f": 0}, {"x": 0.983, "y": 1.648, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2351 cos0.98 難1.65", "s": 0.748, "f": 0}, {"x": 0.972, "y": 2.071, "c": "近傍", "n": "Go Ahead!! [A]  n=2710 cos0.97 難2.07", "s": 0.863, "f": 0}, {"x": 0.972, "y": 2.114, "c": "近傍", "n": "Sinus Iridum [A]  n=1841 cos0.97 難2.11", "s": 0.586, "f": 0}, {"x": 0.982, "y": 1.61, "c": "近傍", "n": "Cross Fire [A]  n=946 cos0.98 難1.61", "s": 0.301, "f": 0}, {"x": 0.974, "y": 1.814, "c": "近傍", "n": "Amor∞Fati [A]  n=555 cos0.97 難1.81", "s": 0.177, "f": 0}, {"x": 0.971, "y": 1.886, "c": "近傍", "n": "Ignis†Irae [A]  n=2005 cos0.97 難1.89", "s": 0.638, "f": 0}, {"x": 0.98, "y": 1.619, "c": "近傍", "n": "uen [A]  n=834 cos0.98 難1.62", "s": 0.265, "f": 0}, {"x": 0.977, "y": 1.669, "c": "近傍", "n": "Inferno of Fomalhaut [A]  n=2582 cos0.98 難1.67", "s": 0.822, "f": 0}, {"x": 0.969, "y": 1.946, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [L]  n=1796 cos0.97 難1.95", "s": 0.572, "f": 0}, {"x": 0.972, "y": 1.754, "c": "近傍", "n": "The Clown of 24stairs [A]  n=1701 cos0.97 難1.75", "s": 0.541, "f": 0}, {"x": 0.973, "y": 1.731, "c": "近傍", "n": "-65℃ [A]  n=2211 cos0.97 難1.73", "s": 0.704, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.272013563718951}, {"a": 0, "b": 2, "w": 0.2187600381321999}, {"a": 0, "b": 3, "w": 0.25910305809261114}, {"a": 0, "b": 4, "w": 0.31854321776153316}, {"a": 0, "b": 5, "w": 0.287270658727494}, {"a": 0, "b": 6, "w": 0.24338440730707178}, {"a": 0, "b": 7, "w": 0.06494611670319139}, {"a": 0, "b": 8, "w": 0.2067807484687616}, {"a": 0, "b": 9, "w": 0.20872995469807076}, {"a": 0, "b": 10, "w": 0.05121846376865802}, {"a": 0, "b": 11, "w": 0.18506750424465468}, {"a": 0, "b": 12, "w": 2.0636048425615172e-11}, {"a": 0, "b": 13, "w": 0.29668801638385855}, {"a": 0, "b": 14, "w": 0.19711570491526442}, {"a": 0, "b": 15, "w": 0.17045834048946384}, {"a": 0, "b": 16, "w": 0.16097020649617155}, {"a": 0, "b": 17, "w": 0.26345308589634897}, {"a": 0, "b": 18, "w": 0.13637135991952554}, {"a": 0, "b": 19, "w": 0.1619106446972146}, {"a": 0, "b": 20, "w": 0.1969179248119033}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.966,hiX=1.002,loY=1.567,hiY=2.182;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
