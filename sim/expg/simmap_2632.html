<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">From Human Blood [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.163, "c": "種", "n": "From Human Blood [A]  n=979 cos1.00 難1.16", "s": 0.276, "f": 0}, {"x": 0.995, "y": 1.21, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1195 cos1.00 難1.21", "s": 0.337, "f": 0}, {"x": 0.995, "y": 1.122, "c": "近傍", "n": "Bring The Fire [A]  n=1405 cos0.99 難1.12", "s": 0.396, "f": 0}, {"x": 0.994, "y": 1.172, "c": "近傍", "n": "Chaotoxin [A]  n=1942 cos0.99 難1.17", "s": 0.548, "f": 0}, {"x": 0.995, "y": 1.087, "c": "近傍", "n": "Seven Times Four [A]  n=1327 cos1.00 難1.09", "s": 0.374, "f": 0}, {"x": 0.994, "y": 1.152, "c": "近傍", "n": "EVANESCENT [A]  n=3029 cos0.99 難1.15", "s": 0.854, "f": 0}, {"x": 0.994, "y": 1.117, "c": "近傍", "n": "Roar of Chronos [A]  n=1311 cos0.99 難1.12", "s": 0.37, "f": 0}, {"x": 0.997, "y": 0.985, "c": "近傍", "n": "Ancient Scapes [A]  n=3546 cos1.00 難0.99", "s": 1.0, "f": 0}, {"x": 0.993, "y": 1.211, "c": "近傍", "n": "innocent revolver [A]  n=2541 cos0.99 難1.21", "s": 0.717, "f": 0}, {"x": 0.997, "y": 1.348, "c": "近傍", "n": "Arkadia [A]  n=2067 cos1.00 難1.35", "s": 0.583, "f": 0}, {"x": 0.992, "y": 1.183, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2235 cos0.99 難1.18", "s": 0.63, "f": 0}, {"x": 0.993, "y": 1.087, "c": "近傍", "n": "WONDER WALKER [A]  n=3497 cos0.99 難1.09", "s": 0.986, "f": 0}, {"x": 0.993, "y": 1.057, "c": "近傍", "n": "GAIA [A]  n=3546 cos0.99 難1.06", "s": 1.0, "f": 0}, {"x": 0.993, "y": 1.272, "c": "近傍", "n": "Flying Castle [A]  n=2138 cos0.99 難1.27", "s": 0.603, "f": 0}, {"x": 0.994, "y": 1.288, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3069 cos0.99 難1.29", "s": 0.865, "f": 0}, {"x": 0.992, "y": 1.103, "c": "近傍", "n": "dAuntl3ss [A]  n=3294 cos0.99 難1.10", "s": 0.929, "f": 0}, {"x": 0.992, "y": 1.163, "c": "近傍", "n": "The Last Apocalypse [A]  n=1421 cos0.99 難1.16", "s": 0.401, "f": 0}, {"x": 0.996, "y": 1.348, "c": "近傍", "n": "INHERITANCE [L]  n=586 cos1.00 難1.35", "s": 0.165, "f": 0}, {"x": 0.992, "y": 1.158, "c": "近傍", "n": "MARLIN [A]  n=1127 cos0.99 難1.16", "s": 0.318, "f": 0}, {"x": 0.994, "y": 0.988, "c": "近傍", "n": "Matt Silver [A]  n=3084 cos0.99 難0.99", "s": 0.87, "f": 0}, {"x": 0.991, "y": 1.225, "c": "近傍", "n": "Smalt #28598F [A]  n=2168 cos0.99 難1.22", "s": 0.611, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.25740265379074356}, {"a": 0, "b": 2, "w": 0.07279929247904526}, {"a": 0, "b": 3, "w": 0.21352622287576128}, {"a": 0, "b": 4, "w": 0.2409278474638512}, {"a": 0, "b": 5, "w": 0.16057282443227205}, {"a": 0, "b": 6, "w": 0.1637078945211946}, {"a": 0, "b": 7, "w": 0.34907273457815813}, {"a": 0, "b": 8, "w": 0.15471067947197692}, {"a": 0, "b": 9, "w": 0.45978366729134634}, {"a": 0, "b": 10, "w": 0.1199533496680949}, {"a": 0, "b": 11, "w": 0.15632607808302568}, {"a": 0, "b": 12, "w": 0.010373377457333466}, {"a": 0, "b": 13, "w": 0.19009236701446097}, {"a": 0, "b": 14, "w": 0.15284792730796604}, {"a": 0, "b": 15, "w": 4.635647421480371e-11}, {"a": 0, "b": 16, "w": 0.11337150266531071}, {"a": 0, "b": 17, "w": 0.35828815590518703}, {"a": 0, "b": 18, "w": 0.0958921211028162}, {"a": 0, "b": 19, "w": 0.05677030044117182}, {"a": 0, "b": 20, "w": 0.048156779583481746}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.956,hiY=1.377;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
