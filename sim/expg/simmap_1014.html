<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Set U Free feat. Kanae Asaba [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.408, "c": "種", "n": "Set U Free feat. Kanae Asaba [A]  n=2809 cos1.00 難0.41", "s": 0.752, "f": 0}, {"x": 0.996, "y": 0.291, "c": "近傍", "n": "Constellation [A]  n=1130 cos1.00 難0.29", "s": 0.303, "f": 0}, {"x": 0.993, "y": 0.316, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2429 cos0.99 難0.32", "s": 0.651, "f": 0}, {"x": 0.993, "y": 0.491, "c": "近傍", "n": "DROP [A]  n=3226 cos0.99 難0.49", "s": 0.864, "f": 0}, {"x": 0.993, "y": 0.31, "c": "近傍", "n": "Harmony and Lovely [A]  n=3537 cos0.99 難0.31", "s": 0.947, "f": 0}, {"x": 0.992, "y": 0.331, "c": "近傍", "n": "超青少年ノ為ノ超多幸ナ超古典的超舞曲 [A]  n=3653 cos0.99 難0.33", "s": 0.978, "f": 0}, {"x": 0.992, "y": 0.374, "c": "近傍", "n": "Get On Your Feet [A]  n=1756 cos0.99 難0.37", "s": 0.47, "f": 0}, {"x": 0.991, "y": 0.278, "c": "近傍", "n": "Show Me All Your Love [A]  n=1150 cos0.99 難0.28", "s": 0.308, "f": 0}, {"x": 0.99, "y": 0.296, "c": "近傍", "n": "Programmed World [A]  n=3467 cos0.99 難0.30", "s": 0.928, "f": 0}, {"x": 0.989, "y": 0.428, "c": "近傍", "n": "MINT [A]  n=3426 cos0.99 難0.43", "s": 0.918, "f": 0}, {"x": 0.989, "y": 0.461, "c": "近傍", "n": "Scripted Connection⇒ N mix [L]  n=1190 cos0.99 難0.46", "s": 0.319, "f": 0}, {"x": 0.988, "y": 0.389, "c": "近傍", "n": "ANDROMEDA [A]  n=3487 cos0.99 難0.39", "s": 0.934, "f": 0}, {"x": 0.994, "y": 0.113, "c": "近傍", "n": "Blue Rain [A]  n=3734 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.453, "c": "近傍", "n": "DESIRE [A]  n=3352 cos0.99 難0.45", "s": 0.898, "f": 0}, {"x": 0.988, "y": 0.378, "c": "近傍", "n": "2 tribe 4 K [A]  n=3256 cos0.99 難0.38", "s": 0.872, "f": 0}, {"x": 0.998, "y": 0.035, "c": "近傍", "n": "Beautiful Harmony (IIDX Mix) [A]  n=2577 cos1.00 難0.03", "s": 0.69, "f": 0}, {"x": 0.987, "y": 0.318, "c": "近傍", "n": "ANTHEM LANDING [A]  n=3583 cos0.99 難0.32", "s": 0.96, "f": 0}, {"x": 0.99, "y": 0.656, "c": "近傍", "n": "Last Card [A]  n=824 cos0.99 難0.66", "s": 0.221, "f": 0}, {"x": 0.989, "y": 0.164, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2217 cos0.99 難0.16", "s": 0.594, "f": 0}, {"x": 0.992, "y": 0.715, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3091 cos0.99 難0.72", "s": 0.828, "f": 0}, {"x": 0.992, "y": 0.085, "c": "近傍", "n": "X-ray binary [A]  n=2517 cos0.99 難0.08", "s": 0.674, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5141205161062747}, {"a": 0, "b": 2, "w": 0.5369013853789303}, {"a": 0, "b": 3, "w": 0.4750039636600788}, {"a": 0, "b": 4, "w": 0.4994863363390707}, {"a": 0, "b": 5, "w": 0.5650365222213645}, {"a": 0, "b": 6, "w": 0.29319875956267716}, {"a": 0, "b": 7, "w": 0.3649499099341258}, {"a": 0, "b": 8, "w": 0.48036544480893917}, {"a": 0, "b": 9, "w": 0.4831049493377444}, {"a": 0, "b": 10, "w": 0.3100691955904482}, {"a": 0, "b": 11, "w": 0.4590902203930345}, {"a": 0, "b": 12, "w": 0.5983581491398695}, {"a": 0, "b": 13, "w": 0.1211141730203601}, {"a": 0, "b": 14, "w": 0.34782350923849903}, {"a": 0, "b": 15, "w": 0.7678626445045897}, {"a": 0, "b": 16, "w": 0.3010990242394441}, {"a": 0, "b": 17, "w": 3.240829826722802e-11}, {"a": 0, "b": 18, "w": 0.37851325156841}, {"a": 0, "b": 19, "w": 0.3585454957330525}, {"a": 0, "b": 20, "w": 0.4788699063850038}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.020,hiY=0.770;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
