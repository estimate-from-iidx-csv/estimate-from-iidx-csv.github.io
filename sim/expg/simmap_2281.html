<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ドッキン☆サマーあばんちゅーる [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.741, "c": "種", "n": "ドッキン☆サマーあばんちゅーる [A]  n=3346 cos1.00 難0.74", "s": 0.901, "f": 0}, {"x": 0.994, "y": 0.515, "c": "近傍", "n": "smooooch・∀・ [L]  n=1439 cos0.99 難0.52", "s": 0.388, "f": 0}, {"x": 0.989, "y": 0.655, "c": "近傍", "n": "Red Soul [A]  n=1735 cos0.99 難0.66", "s": 0.467, "f": 0}, {"x": 0.989, "y": 0.603, "c": "近傍", "n": "Game Changers [A]  n=1981 cos0.99 難0.60", "s": 0.534, "f": 0}, {"x": 0.994, "y": 0.459, "c": "近傍", "n": "Ritual of Anubis [A]  n=2269 cos0.99 難0.46", "s": 0.611, "f": 0}, {"x": 0.99, "y": 0.563, "c": "近傍", "n": "Jungle Eater [A]  n=2408 cos0.99 難0.56", "s": 0.649, "f": 0}, {"x": 0.992, "y": 0.49, "c": "近傍", "n": "STARLiGHT [A]  n=3184 cos0.99 難0.49", "s": 0.858, "f": 0}, {"x": 0.99, "y": 0.959, "c": "近傍", "n": "TROOPERS [A]  n=3524 cos0.99 難0.96", "s": 0.949, "f": 0}, {"x": 0.986, "y": 0.816, "c": "近傍", "n": "On the FM [A]  n=3146 cos0.99 難0.82", "s": 0.847, "f": 0}, {"x": 0.991, "y": 0.449, "c": "近傍", "n": "Xyndrome [A]  n=2507 cos0.99 難0.45", "s": 0.675, "f": 0}, {"x": 0.986, "y": 0.647, "c": "近傍", "n": "chaos eater -IIDX edition- [A]  n=3157 cos0.99 難0.65", "s": 0.85, "f": 0}, {"x": 0.985, "y": 0.784, "c": "近傍", "n": "VOX UP [H]  n=3232 cos0.98 難0.78", "s": 0.87, "f": 0}, {"x": 0.988, "y": 0.495, "c": "近傍", "n": "in the Sky [A]  n=3435 cos0.99 難0.49", "s": 0.925, "f": 0}, {"x": 0.99, "y": 0.438, "c": "近傍", "n": "Buffalo [L]  n=1904 cos0.99 難0.44", "s": 0.513, "f": 0}, {"x": 0.985, "y": 0.603, "c": "近傍", "n": "Time to Air [A]  n=3596 cos0.98 難0.60", "s": 0.968, "f": 0}, {"x": 0.987, "y": 0.448, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3112 cos0.99 難0.45", "s": 0.838, "f": 0}, {"x": 0.983, "y": 0.698, "c": "近傍", "n": "THE FALLEN [A]  n=3130 cos0.98 難0.70", "s": 0.843, "f": 0}, {"x": 0.983, "y": 0.781, "c": "近傍", "n": "invoker [A]  n=3713 cos0.98 難0.78", "s": 1.0, "f": 0}, {"x": 0.982, "y": 0.808, "c": "近傍", "n": "Rampage [A]  n=3568 cos0.98 難0.81", "s": 0.961, "f": 0}, {"x": 0.982, "y": 0.733, "c": "近傍", "n": "ディッシュウォッシャー◎彡おいわちゃん [A]  n=3068 cos0.98 難0.73", "s": 0.826, "f": 0}, {"x": 0.984, "y": 0.516, "c": "近傍", "n": "Para siempre [A]  n=2669 cos0.98 難0.52", "s": 0.719, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4950861842882074}, {"a": 0, "b": 2, "w": 0.31570634559387356}, {"a": 0, "b": 3, "w": 0.33438402620754715}, {"a": 0, "b": 4, "w": 0.5034681456211417}, {"a": 0, "b": 5, "w": 0.3498419772479917}, {"a": 0, "b": 6, "w": 0.386493354564594}, {"a": 0, "b": 7, "w": 0.3898520907764941}, {"a": 0, "b": 8, "w": 0.2395078364958223}, {"a": 0, "b": 9, "w": 0.42063858457223124}, {"a": 0, "b": 10, "w": 0.24128722477424702}, {"a": 0, "b": 11, "w": 0.2574620651851679}, {"a": 0, "b": 12, "w": 0.2877093167563821}, {"a": 0, "b": 13, "w": 0.3792605479015738}, {"a": 0, "b": 14, "w": 0.25036040383348435}, {"a": 0, "b": 15, "w": 0.2554065600322629}, {"a": 0, "b": 16, "w": 0.21390858900923748}, {"a": 0, "b": 17, "w": 0.20936681907826493}, {"a": 0, "b": 18, "w": 3.29053451153527e-11}, {"a": 0, "b": 19, "w": 0.17839228610955304}, {"a": 0, "b": 20, "w": 0.2275245329338944}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=0.396,hiY=1.001;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
