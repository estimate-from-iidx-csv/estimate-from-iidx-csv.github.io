<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Tropical April [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.485, "c": "種", "n": "Tropical April [A]  n=3264 cos1.00 難0.49", "s": 0.897, "f": 0}, {"x": 0.989, "y": 0.498, "c": "近傍", "n": "MAGIC & LOVE [A]  n=3377 cos0.99 難0.50", "s": 0.928, "f": 0}, {"x": 0.989, "y": 0.363, "c": "近傍", "n": "Egret and Willow [A]  n=3205 cos0.99 難0.36", "s": 0.881, "f": 0}, {"x": 0.988, "y": 0.59, "c": "近傍", "n": "smile [A]  n=3299 cos0.99 難0.59", "s": 0.907, "f": 0}, {"x": 0.988, "y": 0.459, "c": "近傍", "n": "BroGamer [A]  n=3639 cos0.99 難0.46", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.286, "c": "近傍", "n": "Just Gimme [A]  n=1335 cos0.99 難0.29", "s": 0.367, "f": 0}, {"x": 0.988, "y": 0.671, "c": "近傍", "n": "創世ノート [A]  n=3278 cos0.99 難0.67", "s": 0.901, "f": 0}, {"x": 0.986, "y": 0.603, "c": "近傍", "n": "Time to Air [A]  n=3596 cos0.99 難0.60", "s": 0.988, "f": 0}, {"x": 0.987, "y": 0.315, "c": "近傍", "n": "out of disk space [A]  n=1412 cos0.99 難0.32", "s": 0.388, "f": 0}, {"x": 0.985, "y": 0.345, "c": "近傍", "n": "Valgus [A]  n=3339 cos0.99 難0.34", "s": 0.918, "f": 0}, {"x": 0.987, "y": 0.232, "c": "近傍", "n": "鴉 [A]  n=3539 cos0.99 難0.23", "s": 0.973, "f": 0}, {"x": 0.986, "y": 0.264, "c": "近傍", "n": "Victory Of Ravers [A]  n=2466 cos0.99 難0.26", "s": 0.678, "f": 0}, {"x": 0.985, "y": 0.291, "c": "近傍", "n": "MVP [A]  n=1418 cos0.99 難0.29", "s": 0.39, "f": 0}, {"x": 0.987, "y": 0.767, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [A]  n=3057 cos0.99 難0.77", "s": 0.84, "f": 0}, {"x": 0.984, "y": 0.311, "c": "近傍", "n": "Evans [H]  n=3517 cos0.98 難0.31", "s": 0.966, "f": 0}, {"x": 0.983, "y": 0.488, "c": "近傍", "n": "Cleopatrysm [A]  n=3251 cos0.98 難0.49", "s": 0.893, "f": 0}, {"x": 0.984, "y": 0.292, "c": "近傍", "n": "命の標本 [A]  n=3120 cos0.98 難0.29", "s": 0.857, "f": 0}, {"x": 0.983, "y": 0.392, "c": "近傍", "n": "ELYSIUM [A]  n=1499 cos0.98 難0.39", "s": 0.412, "f": 0}, {"x": 0.982, "y": 0.565, "c": "近傍", "n": "Swarm Of Scarabs [A]  n=2625 cos0.98 難0.57", "s": 0.721, "f": 0}, {"x": 0.982, "y": 0.311, "c": "近傍", "n": "lowercase lifetime [A]  n=1449 cos0.98 難0.31", "s": 0.398, "f": 0}, {"x": 0.984, "y": 0.784, "c": "近傍", "n": "VOX UP [H]  n=3232 cos0.98 難0.78", "s": 0.888, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3445189492806149}, {"a": 0, "b": 2, "w": 0.1470911033996315}, {"a": 0, "b": 3, "w": 0.30263468481009814}, {"a": 0, "b": 4, "w": 0.27728649379259773}, {"a": 0, "b": 5, "w": 0.28432077274961143}, {"a": 0, "b": 6, "w": 0.3051050643617286}, {"a": 0, "b": 7, "w": 0.24288334534623524}, {"a": 0, "b": 8, "w": 0.24997850222149864}, {"a": 0, "b": 9, "w": 0.1437150037374778}, {"a": 0, "b": 10, "w": 0.25520403361694033}, {"a": 0, "b": 11, "w": 0.21503863311202753}, {"a": 0, "b": 12, "w": 0.2250364782181904}, {"a": 0, "b": 13, "w": 0.06632252269374794}, {"a": 0, "b": 14, "w": 3.505662427016887e-11}, {"a": 0, "b": 15, "w": 0.0007383925630626287}, {"a": 0, "b": 16, "w": 0.09337708558520375}, {"a": 0, "b": 17, "w": 0.1635391481760824}, {"a": 0, "b": 18, "w": 0.13712454499462712}, {"a": 0, "b": 19, "w": 0.10516428890759588}, {"a": 0, "b": 20, "w": 0.20974442106071467}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=0.188,hiY=0.828;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
