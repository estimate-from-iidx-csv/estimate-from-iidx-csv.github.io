<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">STAR FIELD [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.308, "c": "種", "n": "STAR FIELD [A]  n=2387 cos1.00 難-0.31", "s": 0.672, "f": 0}, {"x": 0.996, "y": -0.342, "c": "近傍", "n": "BLUST OF WIND [A]  n=3377 cos1.00 難-0.34", "s": 0.951, "f": 0}, {"x": 0.997, "y": -0.423, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1009 cos1.00 難-0.42", "s": 0.284, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Exchange Place [A]  n=2674 cos1.00 難-0.25", "s": 0.753, "f": 0}, {"x": 0.995, "y": -0.375, "c": "近傍", "n": "WISE UP! [A]  n=2808 cos1.00 難-0.37", "s": 0.791, "f": 0}, {"x": 0.995, "y": -0.252, "c": "近傍", "n": "heaven above [A]  n=2526 cos0.99 難-0.25", "s": 0.712, "f": 0}, {"x": 0.996, "y": -0.435, "c": "近傍", "n": "When I Met U [A]  n=2644 cos1.00 難-0.44", "s": 0.745, "f": 0}, {"x": 0.994, "y": -0.335, "c": "近傍", "n": "thunder [A]  n=2858 cos0.99 難-0.33", "s": 0.805, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2707 cos0.99 難-0.25", "s": 0.763, "f": 0}, {"x": 0.994, "y": -0.267, "c": "近傍", "n": "!Viva! [A]  n=3296 cos0.99 難-0.27", "s": 0.928, "f": 0}, {"x": 0.994, "y": -0.363, "c": "近傍", "n": "Mind Mapping [A]  n=3098 cos0.99 難-0.36", "s": 0.873, "f": 0}, {"x": 0.994, "y": -0.392, "c": "近傍", "n": "OOO [A]  n=3550 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "Monkey Dance [A]  n=2550 cos0.99 難-0.25", "s": 0.718, "f": 0}, {"x": 0.994, "y": -0.25, "c": "近傍", "n": "take me higher [A]  n=2122 cos0.99 難-0.25", "s": 0.598, "f": 0}, {"x": 0.994, "y": -0.327, "c": "近傍", "n": "7 Colors [A]  n=1865 cos0.99 難-0.33", "s": 0.525, "f": 0}, {"x": 0.994, "y": -0.426, "c": "近傍", "n": "Midnight Lady [A]  n=2776 cos0.99 難-0.43", "s": 0.782, "f": 0}, {"x": 0.993, "y": -0.342, "c": "近傍", "n": "エコ爺 [A]  n=3106 cos0.99 難-0.34", "s": 0.875, "f": 0}, {"x": 0.993, "y": -0.304, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2070 cos0.99 難-0.30", "s": 0.583, "f": 0}, {"x": 0.994, "y": -0.135, "c": "近傍", "n": "月雪に舞う華のように [A]  n=2786 cos0.99 難-0.14", "s": 0.785, "f": 0}, {"x": 0.998, "y": -0.582, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2279 cos1.00 難-0.58", "s": 0.642, "f": 0}, {"x": 0.992, "y": -0.424, "c": "近傍", "n": "神様、つれない。 [A]  n=1321 cos0.99 難-0.42", "s": 0.372, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2118003829221452}, {"a": 0, "b": 2, "w": 0.43570221798535647}, {"a": 0, "b": 3, "w": 0.30013197379097056}, {"a": 0, "b": 4, "w": 0.23800687675373222}, {"a": 0, "b": 5, "w": 0.21186569730470028}, {"a": 0, "b": 6, "w": 0.2817728167663698}, {"a": 0, "b": 7, "w": 0.25254871996703177}, {"a": 0, "b": 8, "w": 0.24775121358197905}, {"a": 0, "b": 9, "w": 0.03057024999823621}, {"a": 0, "b": 10, "w": 0.18125868816510027}, {"a": 0, "b": 11, "w": 0.18404844328479086}, {"a": 0, "b": 12, "w": 0.1568732048274658}, {"a": 0, "b": 13, "w": 7.750189379152062e-11}, {"a": 0, "b": 14, "w": 0.11842527520526114}, {"a": 0, "b": 15, "w": 0.2524388847601977}, {"a": 0, "b": 16, "w": 0.0035320432234879906}, {"a": 0, "b": 17, "w": 0.13738128172096709}, {"a": 0, "b": 18, "w": 0.15509851244509298}, {"a": 0, "b": 19, "w": 0.5170154681293119}, {"a": 0, "b": 20, "w": 0.026027874516607374}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.617,hiY=-0.100;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
