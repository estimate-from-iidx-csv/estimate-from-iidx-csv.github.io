<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Damage Per Second [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.074, "c": "種", "n": "Damage Per Second [L]  n=2952 cos1.00 難-0.07", "s": 0.812, "f": 0}, {"x": 0.996, "y": -0.036, "c": "近傍", "n": "Rock Da House [A]  n=3618 cos1.00 難-0.04", "s": 0.995, "f": 0}, {"x": 0.997, "y": -0.187, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [A]  n=3440 cos1.00 難-0.19", "s": 0.946, "f": 0}, {"x": 0.995, "y": -0.084, "c": "近傍", "n": "Here We Are [A]  n=2486 cos1.00 難-0.08", "s": 0.684, "f": 0}, {"x": 0.995, "y": -0.097, "c": "近傍", "n": "REMINISCENCE [A]  n=2781 cos1.00 難-0.10", "s": 0.765, "f": 0}, {"x": 0.995, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos1.00 難-0.06", "s": 0.838, "f": 0}, {"x": 0.996, "y": -0.17, "c": "近傍", "n": "梅雪夜 [A]  n=3409 cos1.00 難-0.17", "s": 0.937, "f": 0}, {"x": 0.998, "y": -0.252, "c": "近傍", "n": "FERMI PARADOX [A]  n=1455 cos1.00 難-0.25", "s": 0.4, "f": 0}, {"x": 0.997, "y": -0.248, "c": "近傍", "n": "華爛漫 -Flowers- [A]  n=3637 cos1.00 難-0.25", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.134, "c": "近傍", "n": "RESISTANCE [A]  n=2736 cos0.99 難-0.13", "s": 0.752, "f": 0}, {"x": 0.996, "y": -0.23, "c": "近傍", "n": "Lycoris [A]  n=1029 cos1.00 難-0.23", "s": 0.283, "f": 0}, {"x": 0.994, "y": -0.081, "c": "近傍", "n": "Jumper [A]  n=1722 cos0.99 難-0.08", "s": 0.473, "f": 0}, {"x": 0.994, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos0.99 難0.01", "s": 0.994, "f": 0}, {"x": 0.994, "y": -0.125, "c": "近傍", "n": "Breakin' Chain [A]  n=2889 cos0.99 難-0.12", "s": 0.794, "f": 0}, {"x": 0.993, "y": -0.121, "c": "近傍", "n": "Shirdal [A]  n=692 cos0.99 難-0.12", "s": 0.19, "f": 0}, {"x": 0.997, "y": -0.299, "c": "近傍", "n": "Fantasia [A]  n=3530 cos1.00 難-0.30", "s": 0.971, "f": 0}, {"x": 0.993, "y": -0.085, "c": "近傍", "n": "Hypersonik [A]  n=3142 cos0.99 難-0.08", "s": 0.864, "f": 0}, {"x": 0.993, "y": -0.058, "c": "近傍", "n": "ToyCube Pf.(RX-Ver.S.P.L.) [A]  n=1924 cos0.99 難-0.06", "s": 0.529, "f": 0}, {"x": 0.993, "y": -0.156, "c": "近傍", "n": "Surf on the Light [A]  n=2492 cos0.99 難-0.16", "s": 0.685, "f": 0}, {"x": 0.993, "y": -0.059, "c": "近傍", "n": "Agnus Dei [A]  n=2679 cos0.99 難-0.06", "s": 0.737, "f": 0}, {"x": 0.993, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos0.99 難-0.05", "s": 0.85, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3892483454920824}, {"a": 0, "b": 2, "w": 0.450870666111408}, {"a": 0, "b": 3, "w": 0.35817712461220974}, {"a": 0, "b": 4, "w": 0.3619616206710069}, {"a": 0, "b": 5, "w": 0.3784417926475292}, {"a": 0, "b": 6, "w": 0.4012905605610244}, {"a": 0, "b": 7, "w": 0.4198363626470517}, {"a": 0, "b": 8, "w": 0.34649111064325}, {"a": 0, "b": 9, "w": 0.3227595588110451}, {"a": 0, "b": 10, "w": 0.06032452936368704}, {"a": 0, "b": 11, "w": 6.126588125709986e-11}, {"a": 0, "b": 12, "w": 0.1660041144147112}, {"a": 0, "b": 13, "w": 0.26893709939396104}, {"a": 0, "b": 14, "w": 0.2443994180222384}, {"a": 0, "b": 15, "w": 0.5100268720342418}, {"a": 0, "b": 16, "w": 0.25699392198393334}, {"a": 0, "b": 17, "w": 0.1623647432109646}, {"a": 0, "b": 18, "w": 0.24778169618877222}, {"a": 0, "b": 19, "w": 0.20666819017544003}, {"a": 0, "b": 20, "w": 0.20989715478611282}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.324,hiY=0.035;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
