<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE PEERLESS UNDER HEAVEN [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.609, "c": "種", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2306 cos1.00 難-0.61", "s": 0.696, "f": 0}, {"x": 0.992, "y": -0.767, "c": "近傍", "n": "Level 4 [H]  n=1520 cos0.99 難-0.77", "s": 0.459, "f": 0}, {"x": 0.99, "y": -0.8, "c": "近傍", "n": "Level 3 [H]  n=1942 cos0.99 難-0.80", "s": 0.586, "f": 0}, {"x": 0.989, "y": -0.88, "c": "近傍", "n": "LOCUS OF THE TRAVEL [H]  n=1278 cos0.99 難-0.88", "s": 0.386, "f": 0}, {"x": 0.985, "y": -0.332, "c": "近傍", "n": "Blue Spring Express [H]  n=2400 cos0.99 難-0.33", "s": 0.724, "f": 0}, {"x": 0.983, "y": -0.871, "c": "近傍", "n": "Modular Technology [H]  n=2229 cos0.98 難-0.87", "s": 0.672, "f": 0}, {"x": 0.978, "y": -0.495, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2388 cos0.98 難-0.49", "s": 0.72, "f": 0}, {"x": 0.98, "y": -0.341, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3315 cos0.98 難-0.34", "s": 1.0, "f": 0}, {"x": 0.98, "y": -0.877, "c": "近傍", "n": "The Sampling Paradise [H]  n=3028 cos0.98 難-0.88", "s": 0.913, "f": 0}, {"x": 0.976, "y": -0.62, "c": "近傍", "n": "Feel The Beat [H]  n=2621 cos0.98 難-0.62", "s": 0.791, "f": 0}, {"x": 0.981, "y": -0.254, "c": "近傍", "n": "Lift Us High [A]  n=2436 cos0.98 難-0.25", "s": 0.735, "f": 0}, {"x": 0.983, "y": -0.177, "c": "近傍", "n": "Frisk And Squeak [A]  n=1804 cos0.98 難-0.18", "s": 0.544, "f": 0}, {"x": 0.975, "y": -0.496, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1047 cos0.98 難-0.50", "s": 0.316, "f": 0}, {"x": 0.98, "y": -0.253, "c": "近傍", "n": "Round and Round [A]  n=2982 cos0.98 難-0.25", "s": 0.9, "f": 0}, {"x": 0.978, "y": -0.915, "c": "近傍", "n": "Purple Perplex [H]  n=1793 cos0.98 難-0.92", "s": 0.541, "f": 0}, {"x": 0.988, "y": -0.074, "c": "近傍", "n": "Tripping Jumping [A]  n=1962 cos0.99 難-0.07", "s": 0.592, "f": 0}, {"x": 0.987, "y": -1.139, "c": "近傍", "n": "FlyAway [H]  n=627 cos0.99 難-1.14", "s": 0.189, "f": 0}, {"x": 0.981, "y": -1.034, "c": "近傍", "n": "Papilio ulysses [H]  n=2091 cos0.98 難-1.03", "s": 0.631, "f": 0}, {"x": 0.976, "y": -0.862, "c": "近傍", "n": "Programmed Life [H]  n=1853 cos0.98 難-0.86", "s": 0.559, "f": 0}, {"x": 0.978, "y": -0.97, "c": "近傍", "n": "SμG@R RU$# [H]  n=616 cos0.98 難-0.97", "s": 0.186, "f": 0}, {"x": 0.98, "y": -1.035, "c": "近傍", "n": "255 [H]  n=1427 cos0.98 難-1.03", "s": 0.43, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5410964284448014}, {"a": 0, "b": 2, "w": 0.34611797974891356}, {"a": 0, "b": 3, "w": 0.38673837852199167}, {"a": 0, "b": 4, "w": 0.35991146333249047}, {"a": 0, "b": 5, "w": 0.25967723401815757}, {"a": 0, "b": 6, "w": 0.2471464682671658}, {"a": 0, "b": 7, "w": 0.32518482788105385}, {"a": 0, "b": 8, "w": 0.08621388377686245}, {"a": 0, "b": 9, "w": 0.230754456846203}, {"a": 0, "b": 10, "w": 0.30353732727665905}, {"a": 0, "b": 11, "w": 0.35572863525953835}, {"a": 0, "b": 12, "w": 0.151585050437969}, {"a": 0, "b": 13, "w": 0.2631288505679321}, {"a": 0, "b": 14, "w": 0.2602975307303478}, {"a": 0, "b": 15, "w": 0.467672705690957}, {"a": 0, "b": 16, "w": 0.404491929771698}, {"a": 0, "b": 17, "w": 0.33174102131767624}, {"a": 0, "b": 18, "w": 2.87250223607316e-11}, {"a": 0, "b": 19, "w": 0.28579052231759694}, {"a": 0, "b": 20, "w": 0.06448528708604395}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=-1.224,hiY=0.011;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
