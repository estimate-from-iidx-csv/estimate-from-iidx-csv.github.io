<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Programmed Life [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.048, "c": "種", "n": "Programmed Life [A]  n=2774 cos1.00 難-0.05", "s": 0.743, "f": 0}, {"x": 0.999, "y": -0.064, "c": "近傍", "n": "Hydrogen Blueback [A]  n=3085 cos1.00 難-0.06", "s": 0.826, "f": 0}, {"x": 0.996, "y": -0.006, "c": "近傍", "n": "The Story Begins [A]  n=2765 cos1.00 難-0.01", "s": 0.74, "f": 0}, {"x": 0.996, "y": -0.006, "c": "近傍", "n": "Go Faraway [A]  n=2753 cos1.00 難-0.01", "s": 0.737, "f": 0}, {"x": 0.996, "y": 0.059, "c": "近傍", "n": "Sphere [A]  n=2890 cos1.00 難0.06", "s": 0.774, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "Vermillion [A]  n=2891 cos1.00 難-0.08", "s": 0.774, "f": 0}, {"x": 0.995, "y": -0.068, "c": "近傍", "n": "Neonlights [A]  n=3010 cos0.99 難-0.07", "s": 0.806, "f": 0}, {"x": 0.995, "y": 0.019, "c": "近傍", "n": "狂水一華 [A]  n=2787 cos0.99 難0.02", "s": 0.746, "f": 0}, {"x": 0.995, "y": -0.04, "c": "近傍", "n": "Caldwell 99 [A]  n=1670 cos0.99 難-0.04", "s": 0.447, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos0.99 難0.01", "s": 0.693, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Fly you to the star [A]  n=3230 cos0.99 難-0.14", "s": 0.865, "f": 0}, {"x": 0.995, "y": 0.059, "c": "近傍", "n": "Musik LoverZ [A]  n=3115 cos0.99 難0.06", "s": 0.834, "f": 0}, {"x": 0.995, "y": 0.118, "c": "近傍", "n": "IN BETWEEN [A]  n=1020 cos1.00 難0.12", "s": 0.273, "f": 0}, {"x": 0.998, "y": 0.217, "c": "近傍", "n": "Destiny Sword [A]  n=3492 cos1.00 難0.22", "s": 0.935, "f": 0}, {"x": 0.994, "y": -0.075, "c": "近傍", "n": "First Resolution [A]  n=2080 cos0.99 難-0.07", "s": 0.557, "f": 0}, {"x": 0.996, "y": -0.287, "c": "近傍", "n": "Fading Stars [A]  n=1787 cos1.00 難-0.29", "s": 0.478, "f": 0}, {"x": 0.993, "y": -0.091, "c": "近傍", "n": "Vitamin [A]  n=1119 cos0.99 難-0.09", "s": 0.3, "f": 0}, {"x": 0.993, "y": -0.14, "c": "近傍", "n": "Glory [A]  n=2166 cos0.99 難-0.14", "s": 0.58, "f": 0}, {"x": 0.993, "y": -0.038, "c": "近傍", "n": "ANAGMA [A]  n=2584 cos0.99 難-0.04", "s": 0.692, "f": 0}, {"x": 0.993, "y": -0.176, "c": "近傍", "n": "Last Burning [A]  n=3166 cos0.99 難-0.18", "s": 0.847, "f": 0}, {"x": 0.994, "y": 0.116, "c": "近傍", "n": "RED ZONE [A]  n=3736 cos0.99 難0.12", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6282272991381337}, {"a": 0, "b": 2, "w": 0.3510650862267011}, {"a": 0, "b": 3, "w": 0.35242771766194714}, {"a": 0, "b": 4, "w": 0.3110719525692969}, {"a": 0, "b": 5, "w": 0.305202243708806}, {"a": 0, "b": 6, "w": 0.29445660985265787}, {"a": 0, "b": 7, "w": 0.11033034136844666}, {"a": 0, "b": 8, "w": 0.1516109977061929}, {"a": 0, "b": 9, "w": 0.27189035334926026}, {"a": 0, "b": 10, "w": 0.22766583568585763}, {"a": 0, "b": 11, "w": 0.11227222043765483}, {"a": 0, "b": 12, "w": 0.10602879491103467}, {"a": 0, "b": 13, "w": 0.42147618516565666}, {"a": 0, "b": 14, "w": 0.15099161186854482}, {"a": 0, "b": 15, "w": 0.26378280091085815}, {"a": 0, "b": 16, "w": 6.642220107266894e-11}, {"a": 0, "b": 17, "w": 0.17390109558762434}, {"a": 0, "b": 18, "w": 0.106763365235641}, {"a": 0, "b": 19, "w": 0.06305697841312607}, {"a": 0, "b": 20, "w": 0.17315278458436778}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.327,hiY=0.257;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
