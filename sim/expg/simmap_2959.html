<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">トリカゴノ鳳凰 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.181, "c": "種", "n": "トリカゴノ鳳凰 [A]  n=3391 cos1.00 難1.18", "s": 0.956, "f": 0}, {"x": 0.996, "y": 1.125, "c": "近傍", "n": "旋律のドグマ～Miserables～ [A]  n=3431 cos1.00 難1.12", "s": 0.968, "f": 0}, {"x": 0.996, "y": 1.288, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=729 cos1.00 難1.29", "s": 0.206, "f": 0}, {"x": 0.993, "y": 1.152, "c": "近傍", "n": "EVANESCENT [A]  n=3029 cos0.99 難1.15", "s": 0.854, "f": 0}, {"x": 0.996, "y": 1.321, "c": "近傍", "n": "HyperTwist [A]  n=671 cos1.00 難1.32", "s": 0.189, "f": 0}, {"x": 0.993, "y": 1.26, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=942 cos0.99 難1.26", "s": 0.266, "f": 0}, {"x": 0.993, "y": 1.21, "c": "近傍", "n": "EX-MASSIVE FIGHTER [A]  n=1195 cos0.99 難1.21", "s": 0.337, "f": 0}, {"x": 0.993, "y": 1.071, "c": "近傍", "n": "電人、暁に斃れる。 [A]  n=3507 cos0.99 難1.07", "s": 0.989, "f": 0}, {"x": 0.992, "y": 1.122, "c": "近傍", "n": "Bring The Fire [A]  n=1405 cos0.99 難1.12", "s": 0.396, "f": 0}, {"x": 0.992, "y": 1.115, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [A]  n=1007 cos0.99 難1.11", "s": 0.284, "f": 0}, {"x": 0.992, "y": 1.254, "c": "近傍", "n": "Proof of the existence [A]  n=3386 cos0.99 難1.25", "s": 0.955, "f": 0}, {"x": 0.992, "y": 1.082, "c": "近傍", "n": "oratio [A]  n=3445 cos0.99 難1.08", "s": 0.972, "f": 0}, {"x": 0.992, "y": 1.1, "c": "近傍", "n": "destination [A]  n=1471 cos0.99 難1.10", "s": 0.415, "f": 0}, {"x": 0.992, "y": 1.103, "c": "近傍", "n": "dAuntl3ss [A]  n=3294 cos0.99 難1.10", "s": 0.929, "f": 0}, {"x": 0.992, "y": 1.116, "c": "近傍", "n": "ラブコメトキドキシリアス [A]  n=703 cos0.99 難1.12", "s": 0.198, "f": 0}, {"x": 0.991, "y": 1.15, "c": "近傍", "n": "シュレーディンガーの猫 [A]  n=3492 cos0.99 難1.15", "s": 0.985, "f": 0}, {"x": 0.992, "y": 1.08, "c": "近傍", "n": "Ypsilon [L]  n=2338 cos0.99 難1.08", "s": 0.659, "f": 0}, {"x": 0.993, "y": 1.057, "c": "近傍", "n": "GAIA [A]  n=3546 cos0.99 難1.06", "s": 1.0, "f": 0}, {"x": 0.991, "y": 1.211, "c": "近傍", "n": "innocent revolver [A]  n=2541 cos0.99 難1.21", "s": 0.717, "f": 0}, {"x": 0.991, "y": 1.111, "c": "近傍", "n": "狂イ咲ケ焔ノ華 [A]  n=3486 cos0.99 難1.11", "s": 0.983, "f": 0}, {"x": 0.991, "y": 1.163, "c": "近傍", "n": "From Human Blood [A]  n=979 cos0.99 難1.16", "s": 0.276, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46315631360173304}, {"a": 0, "b": 2, "w": 0.48999889119164863}, {"a": 0, "b": 3, "w": 0.3367132431766726}, {"a": 0, "b": 4, "w": 0.41260633954975856}, {"a": 0, "b": 5, "w": 0.3187618549989969}, {"a": 0, "b": 6, "w": 0.29938761094435673}, {"a": 0, "b": 7, "w": 0.20389673741052872}, {"a": 0, "b": 8, "w": 0.20567041741961023}, {"a": 0, "b": 9, "w": 0.23876615177022775}, {"a": 0, "b": 10, "w": 0.2823974464115053}, {"a": 0, "b": 11, "w": 3.9060643608479495e-11}, {"a": 0, "b": 12, "w": 0.15625438869676167}, {"a": 0, "b": 13, "w": 0.22937685685695275}, {"a": 0, "b": 14, "w": 0.036649978018919005}, {"a": 0, "b": 15, "w": 0.23784926203878198}, {"a": 0, "b": 16, "w": 0.2905062147476959}, {"a": 0, "b": 17, "w": 0.2437621866130254}, {"a": 0, "b": 18, "w": 0.2002600348721586}, {"a": 0, "b": 19, "w": 0.2556997640604216}, {"a": 0, "b": 20, "w": 0.21046285391177266}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=1.036,hiY=1.342;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
