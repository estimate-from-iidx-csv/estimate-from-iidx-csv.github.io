<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">旋律のドグマ～Miserables～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.416, "c": "種", "n": "旋律のドグマ～Miserables～ [H]  n=3120 cos1.00 難-0.42", "s": 0.907, "f": 0}, {"x": 0.998, "y": -0.212, "c": "近傍", "n": "Express Emotion [A]  n=3441 cos1.00 難-0.21", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.328, "c": "近傍", "n": "Take It Easy [H]  n=2266 cos0.99 難-0.33", "s": 0.659, "f": 0}, {"x": 0.995, "y": -0.547, "c": "近傍", "n": "Idola [H]  n=3057 cos1.00 難-0.55", "s": 0.888, "f": 0}, {"x": 0.994, "y": -0.379, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3009 cos0.99 難-0.38", "s": 0.874, "f": 0}, {"x": 0.994, "y": -0.323, "c": "近傍", "n": "Little Little Princess [H]  n=2746 cos0.99 難-0.32", "s": 0.798, "f": 0}, {"x": 0.995, "y": -0.281, "c": "近傍", "n": "NNRT [H]  n=2896 cos0.99 難-0.28", "s": 0.842, "f": 0}, {"x": 0.994, "y": -0.301, "c": "近傍", "n": "Tell me what you wish feat.らっぷびと [A]  n=2530 cos0.99 難-0.30", "s": 0.735, "f": 0}, {"x": 0.994, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos0.99 難-0.35", "s": 0.875, "f": 0}, {"x": 0.993, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos0.99 難-0.37", "s": 0.612, "f": 0}, {"x": 0.993, "y": -0.394, "c": "近傍", "n": "Elemental Creation [H]  n=3337 cos0.99 難-0.39", "s": 0.97, "f": 0}, {"x": 0.997, "y": -0.128, "c": "近傍", "n": "シュッパツシンコウ・シサカンコ [A]  n=3181 cos1.00 難-0.13", "s": 0.924, "f": 0}, {"x": 0.995, "y": -0.172, "c": "近傍", "n": "オルタネイトβ [A]  n=3288 cos1.00 難-0.17", "s": 0.956, "f": 0}, {"x": 0.993, "y": -0.334, "c": "近傍", "n": "華蝶風雪 [H]  n=2939 cos0.99 難-0.33", "s": 0.854, "f": 0}, {"x": 0.993, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos0.99 難-0.25", "s": 0.7, "f": 0}, {"x": 0.994, "y": -0.207, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1139 cos0.99 難-0.21", "s": 0.331, "f": 0}, {"x": 0.992, "y": -0.429, "c": "近傍", "n": "Far east nightbird [A]  n=3195 cos0.99 難-0.43", "s": 0.929, "f": 0}, {"x": 0.992, "y": -0.498, "c": "近傍", "n": "エクスプロウル [A]  n=1128 cos0.99 難-0.50", "s": 0.328, "f": 0}, {"x": 0.993, "y": -0.308, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3317 cos0.99 難-0.31", "s": 0.964, "f": 0}, {"x": 0.996, "y": -0.112, "c": "近傍", "n": "Let me be your cure [A]  n=3101 cos1.00 難-0.11", "s": 0.901, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "beatAffection [A]  n=2807 cos1.00 難-0.13", "s": 0.816, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5561270247068562}, {"a": 0, "b": 2, "w": 0.3436072932183656}, {"a": 0, "b": 3, "w": 0.3558120036410246}, {"a": 0, "b": 4, "w": 0.03404983217051838}, {"a": 0, "b": 5, "w": 0.2148414597173841}, {"a": 0, "b": 6, "w": 0.032938207826775256}, {"a": 0, "b": 7, "w": 0.1561199817530904}, {"a": 0, "b": 8, "w": 0.25771449633906374}, {"a": 0, "b": 9, "w": 0.17214248710694002}, {"a": 0, "b": 10, "w": 0.09150648895873381}, {"a": 0, "b": 11, "w": 0.5258876963854111}, {"a": 0, "b": 12, "w": 0.3037002313392303}, {"a": 0, "b": 13, "w": 0.16986932558334822}, {"a": 0, "b": 14, "w": 0.13395035565034075}, {"a": 0, "b": 15, "w": 0.2944950058510616}, {"a": 0, "b": 16, "w": 6.522860029889443e-11}, {"a": 0, "b": 17, "w": 0.19453880569732973}, {"a": 0, "b": 18, "w": 0.05502796486279904}, {"a": 0, "b": 19, "w": 0.4371914151216212}, {"a": 0, "b": 20, "w": 0.3067578476372109}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.582,hiY=-0.077;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
