<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.292, "c": "種", "n": "Say YEEEAHH [H]  n=1812 cos1.00 難-1.29", "s": 0.773, "f": 0}, {"x": 0.995, "y": -1.455, "c": "近傍", "n": "Derelict Star feat. Ryu* [H]  n=1289 cos0.99 難-1.45", "s": 0.55, "f": 0}, {"x": 0.994, "y": -1.449, "c": "近傍", "n": "Be A Star [H]  n=1610 cos0.99 難-1.45", "s": 0.687, "f": 0}, {"x": 0.992, "y": -1.348, "c": "近傍", "n": "千年ノ理 [H]  n=2344 cos0.99 難-1.35", "s": 1.0, "f": 0}, {"x": 0.992, "y": -1.135, "c": "近傍", "n": "No Tears [H]  n=1727 cos0.99 難-1.13", "s": 0.737, "f": 0}, {"x": 0.993, "y": -1.475, "c": "近傍", "n": "From Time To Time [H]  n=867 cos0.99 難-1.48", "s": 0.37, "f": 0}, {"x": 0.989, "y": -1.288, "c": "近傍", "n": "イザナミノナゲキ [H]  n=1554 cos0.99 難-1.29", "s": 0.663, "f": 0}, {"x": 0.99, "y": -1.167, "c": "近傍", "n": "RIZING YOU UP [H]  n=1819 cos0.99 難-1.17", "s": 0.776, "f": 0}, {"x": 0.988, "y": -1.109, "c": "近傍", "n": "Rave Patroller [H]  n=1626 cos0.99 難-1.11", "s": 0.694, "f": 0}, {"x": 0.993, "y": -0.962, "c": "近傍", "n": "HEISEI [H]  n=2015 cos0.99 難-0.96", "s": 0.86, "f": 0}, {"x": 0.993, "y": -0.952, "c": "近傍", "n": "Time To Empress [H]  n=2244 cos0.99 難-0.95", "s": 0.957, "f": 0}, {"x": 0.994, "y": -0.939, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2282 cos0.99 難-0.94", "s": 0.974, "f": 0}, {"x": 0.988, "y": -1.082, "c": "近傍", "n": "Boomy and The Boost [H]  n=2207 cos0.99 難-1.08", "s": 0.942, "f": 0}, {"x": 0.986, "y": -1.288, "c": "近傍", "n": "TRIP MACHINE PhoeniX [H]  n=639 cos0.99 難-1.29", "s": 0.273, "f": 0}, {"x": 0.987, "y": -1.465, "c": "近傍", "n": "GRAVITON [H]  n=1112 cos0.99 難-1.47", "s": 0.474, "f": 0}, {"x": 0.985, "y": -1.286, "c": "近傍", "n": "Aftermath [H]  n=1337 cos0.99 難-1.29", "s": 0.57, "f": 0}, {"x": 0.984, "y": -1.312, "c": "近傍", "n": "[ ]DENTITY [H]  n=1427 cos0.98 難-1.31", "s": 0.609, "f": 0}, {"x": 0.986, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.454, "f": 0}, {"x": 0.984, "y": -1.381, "c": "近傍", "n": "glacia [H]  n=1066 cos0.98 難-1.38", "s": 0.455, "f": 0}, {"x": 0.984, "y": -1.421, "c": "近傍", "n": "FUZIN RIZIN [H]  n=1608 cos0.98 難-1.42", "s": 0.686, "f": 0}, {"x": 0.986, "y": -1.041, "c": "近傍", "n": "Super Rush [H]  n=2276 cos0.99 難-1.04", "s": 0.971, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5443114723818209}, {"a": 0, "b": 2, "w": 0.5588973269670795}, {"a": 0, "b": 3, "w": 0.4563021621949551}, {"a": 0, "b": 4, "w": 0.43297327663813023}, {"a": 0, "b": 5, "w": 0.514434634231462}, {"a": 0, "b": 6, "w": 0.33727929763800746}, {"a": 0, "b": 7, "w": 0.2345022771730494}, {"a": 0, "b": 8, "w": 0.2646469013389644}, {"a": 0, "b": 9, "w": 0.3561585603396702}, {"a": 0, "b": 10, "w": 0.5224272664366837}, {"a": 0, "b": 11, "w": 0.5469463604287043}, {"a": 0, "b": 12, "w": 0.3474866867661408}, {"a": 0, "b": 13, "w": 0.1601189061474465}, {"a": 0, "b": 14, "w": 0.3357077767803335}, {"a": 0, "b": 15, "w": 4.7387538337773094e-11}, {"a": 0, "b": 16, "w": 0.1476119996279951}, {"a": 0, "b": 17, "w": 0.3016202414642266}, {"a": 0, "b": 18, "w": 0.09625258373426337}, {"a": 0, "b": 19, "w": 0.2703304976183706}, {"a": 0, "b": 20, "w": 0.24959064972652012}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.562,hiY=-0.893;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
