<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Triple Counter [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.913, "c": "種", "n": "Triple Counter [H]  n=2857 cos1.00 難-0.91", "s": 0.795, "f": 0}, {"x": 0.992, "y": -0.973, "c": "近傍", "n": "創世ノート [H]  n=1994 cos0.99 難-0.97", "s": 0.555, "f": 0}, {"x": 0.994, "y": -0.625, "c": "近傍", "n": "smile [H]  n=1928 cos0.99 難-0.62", "s": 0.537, "f": 0}, {"x": 0.99, "y": -0.847, "c": "近傍", "n": "INVISIBLE STRIX [H]  n=1663 cos0.99 難-0.85", "s": 0.463, "f": 0}, {"x": 0.99, "y": -0.763, "c": "近傍", "n": "抱きしめてモナムール [H]  n=2131 cos0.99 難-0.76", "s": 0.593, "f": 0}, {"x": 0.989, "y": -1.0, "c": "近傍", "n": "HYPE THE CORE [H]  n=1566 cos0.99 難-1.00", "s": 0.436, "f": 0}, {"x": 0.989, "y": -0.899, "c": "近傍", "n": "ヒマワリ [H]  n=2137 cos0.99 難-0.90", "s": 0.595, "f": 0}, {"x": 0.991, "y": -0.593, "c": "近傍", "n": "Close the World feat.a☆ru [H]  n=3014 cos0.99 難-0.59", "s": 0.839, "f": 0}, {"x": 0.988, "y": -0.906, "c": "近傍", "n": "BabeL ～Grand Story～ [H]  n=2100 cos0.99 難-0.91", "s": 0.584, "f": 0}, {"x": 0.987, "y": -1.018, "c": "近傍", "n": "Venom [H]  n=1704 cos0.99 難-1.02", "s": 0.474, "f": 0}, {"x": 0.987, "y": -0.953, "c": "近傍", "n": "Empire of Fury [H]  n=1651 cos0.99 難-0.95", "s": 0.46, "f": 0}, {"x": 0.989, "y": -0.553, "c": "近傍", "n": "Don't Stop The Music feat. Kanae Asaba [A]  n=2218 cos0.99 難-0.55", "s": 0.617, "f": 0}, {"x": 0.987, "y": -0.626, "c": "近傍", "n": "不沈艦CANDY [H]  n=2924 cos0.99 難-0.63", "s": 0.814, "f": 0}, {"x": 0.991, "y": -1.424, "c": "近傍", "n": "I [H]  n=1349 cos0.99 難-1.42", "s": 0.375, "f": 0}, {"x": 0.995, "y": -0.302, "c": "近傍", "n": "WaterCube Pf.(RX-Ver.S.P.L.) [A]  n=967 cos1.00 難-0.30", "s": 0.269, "f": 0}, {"x": 0.985, "y": -1.02, "c": "近傍", "n": "New Lights [H]  n=1941 cos0.98 難-1.02", "s": 0.54, "f": 0}, {"x": 0.986, "y": -0.653, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2050 cos0.99 難-0.65", "s": 0.571, "f": 0}, {"x": 0.989, "y": -0.311, "c": "近傍", "n": "純真可憐デザイア [A]  n=3593 cos0.99 難-0.31", "s": 1.0, "f": 0}, {"x": 0.982, "y": -0.791, "c": "近傍", "n": "鴉 [H]  n=2523 cos0.98 難-0.79", "s": 0.702, "f": 0}, {"x": 0.991, "y": -0.215, "c": "近傍", "n": "Roots of my way! [A]  n=2449 cos0.99 難-0.22", "s": 0.682, "f": 0}, {"x": 0.981, "y": -0.905, "c": "近傍", "n": "Believe In Me [H]  n=1753 cos0.98 難-0.90", "s": 0.488, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3512224737192926}, {"a": 0, "b": 2, "w": 0.3519408917616944}, {"a": 0, "b": 3, "w": 0.3435520395750732}, {"a": 0, "b": 4, "w": 0.29737458771233893}, {"a": 0, "b": 5, "w": 0.23153414246710247}, {"a": 0, "b": 6, "w": 0.1168917804159273}, {"a": 0, "b": 7, "w": 0.3680021240166359}, {"a": 0, "b": 8, "w": 0.2943153644887594}, {"a": 0, "b": 9, "w": 0.22600321310276972}, {"a": 0, "b": 10, "w": 0.2391173779105915}, {"a": 0, "b": 11, "w": 0.2871209076372948}, {"a": 0, "b": 12, "w": 0.12423198238177757}, {"a": 0, "b": 13, "w": 0.3976544410145494}, {"a": 0, "b": 14, "w": 0.5727650964159559}, {"a": 0, "b": 15, "w": 0.0986144088448434}, {"a": 0, "b": 16, "w": 0.06427047371504802}, {"a": 0, "b": 17, "w": 0.3239093735522671}, {"a": 0, "b": 18, "w": 0.16001140369158162}, {"a": 0, "b": 19, "w": 0.322269323479629}, {"a": 0, "b": 20, "w": 4.150746413245088e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.521,hiY=-0.118;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
