<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Miami Sunset Drive [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.382, "c": "種", "n": "Miami Sunset Drive [A]  n=2748 cos1.00 難-0.38", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.498, "c": "近傍", "n": "真夏の花・真夏の夢 [A]  n=2778 cos0.99 難-0.50", "s": 0.736, "f": 0}, {"x": 0.986, "y": -0.389, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3064 cos0.99 難-0.39", "s": 0.812, "f": 0}, {"x": 0.979, "y": -0.33, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2943 cos0.98 難-0.33", "s": 0.78, "f": 0}, {"x": 0.978, "y": -0.223, "c": "近傍", "n": "Arcanos [A]  n=1239 cos0.98 難-0.22", "s": 0.328, "f": 0}, {"x": 0.978, "y": -0.258, "c": "近傍", "n": "Golden Palms [A]  n=3226 cos0.98 難-0.26", "s": 0.855, "f": 0}, {"x": 0.975, "y": -0.268, "c": "近傍", "n": "ATOMIC AGE [A]  n=1609 cos0.98 難-0.27", "s": 0.427, "f": 0}, {"x": 0.976, "y": -0.603, "c": "近傍", "n": "REcorrection [A]  n=686 cos0.98 難-0.60", "s": 0.182, "f": 0}, {"x": 0.972, "y": -0.342, "c": "近傍", "n": "未来のプリズム [A]  n=2664 cos0.97 難-0.34", "s": 0.706, "f": 0}, {"x": 0.995, "y": -0.939, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2820 cos0.99 難-0.94", "s": 0.748, "f": 0}, {"x": 0.969, "y": -0.493, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [H]  n=3114 cos0.97 難-0.49", "s": 0.826, "f": 0}, {"x": 0.969, "y": -0.335, "c": "近傍", "n": "GIGANT [A]  n=936 cos0.97 難-0.34", "s": 0.248, "f": 0}, {"x": 0.969, "y": -0.545, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1575 cos0.97 難-0.55", "s": 0.418, "f": 0}, {"x": 0.978, "y": -0.863, "c": "近傍", "n": "Sakura Reflection [H]  n=3033 cos0.98 難-0.86", "s": 0.804, "f": 0}, {"x": 0.973, "y": -0.006, "c": "近傍", "n": "MIRACLE MEETS [A]  n=3772 cos0.97 難-0.01", "s": 1.0, "f": 0}, {"x": 0.966, "y": -0.274, "c": "近傍", "n": "Selfish Sweet [A]  n=2780 cos0.97 難-0.27", "s": 0.737, "f": 0}, {"x": 0.965, "y": -0.42, "c": "近傍", "n": "Forgetting Machine [A]  n=2207 cos0.97 難-0.42", "s": 0.585, "f": 0}, {"x": 0.974, "y": 0.082, "c": "近傍", "n": "Elisha [A]  n=3765 cos0.97 難0.08", "s": 0.998, "f": 0}, {"x": 0.964, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos0.96 難-0.34", "s": 0.71, "f": 0}, {"x": 0.964, "y": -0.247, "c": "近傍", "n": "Frozen Ray (original mix) [A]  n=2579 cos0.96 難-0.25", "s": 0.684, "f": 0}, {"x": 0.973, "y": 0.069, "c": "近傍", "n": "Fiery Stallion [A]  n=1574 cos0.97 難0.07", "s": 0.417, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.7004240821132364}, {"a": 0, "b": 2, "w": 0.2656719003346707}, {"a": 0, "b": 3, "w": 0.4673711161181926}, {"a": 0, "b": 4, "w": 0.3326882289205455}, {"a": 0, "b": 5, "w": 0.35348043484936853}, {"a": 0, "b": 6, "w": 0.403243908470968}, {"a": 0, "b": 7, "w": 0.4190116746202772}, {"a": 0, "b": 8, "w": 0.3871336250215548}, {"a": 0, "b": 9, "w": 0.6770369758693038}, {"a": 0, "b": 10, "w": 0.32199634291515067}, {"a": 0, "b": 11, "w": 0.34034873883926686}, {"a": 0, "b": 12, "w": 0.35824414447779385}, {"a": 0, "b": 13, "w": 0.46545422679654125}, {"a": 0, "b": 14, "w": 0.014506988060565718}, {"a": 0, "b": 15, "w": 0.3197511235421462}, {"a": 0, "b": 16, "w": 0.28163600477845985}, {"a": 0, "b": 17, "w": 0.09975039236368588}, {"a": 0, "b": 18, "w": 0.30762285149570523}, {"a": 0, "b": 19, "w": 0.3095281064706161}, {"a": 0, "b": 20, "w": 2.8834268306354716e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.961,hiX=1.003,loY=-1.021,hiY=0.164;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
