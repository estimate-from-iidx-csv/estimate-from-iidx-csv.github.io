<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">きみのせかい [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.202, "c": "種", "n": "きみのせかい [A]  n=1142 cos1.00 難0.20", "s": 0.318, "f": 0}, {"x": 0.995, "y": 0.226, "c": "近傍", "n": "Pout [A]  n=2130 cos1.00 難0.23", "s": 0.593, "f": 0}, {"x": 0.995, "y": 0.219, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [A]  n=3305 cos0.99 難0.22", "s": 0.921, "f": 0}, {"x": 0.994, "y": 0.206, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1249 cos0.99 難0.21", "s": 0.348, "f": 0}, {"x": 0.995, "y": 0.288, "c": "近傍", "n": "Daily Lunch Special [A]  n=3532 cos0.99 難0.29", "s": 0.984, "f": 0}, {"x": 0.994, "y": 0.082, "c": "近傍", "n": "LOVELY STORM [A]  n=2975 cos0.99 難0.08", "s": 0.829, "f": 0}, {"x": 0.993, "y": 0.112, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3589 cos0.99 難0.11", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.291, "c": "近傍", "n": "月とミルク [A]  n=2657 cos0.99 難0.29", "s": 0.74, "f": 0}, {"x": 0.992, "y": 0.148, "c": "近傍", "n": "ランカーキラーガール [A]  n=3141 cos0.99 難0.15", "s": 0.875, "f": 0}, {"x": 0.992, "y": 0.11, "c": "近傍", "n": "輪廻の鴉 [A]  n=1949 cos0.99 難0.11", "s": 0.543, "f": 0}, {"x": 0.992, "y": 0.139, "c": "近傍", "n": "Sparkle Smilin' [A]  n=2647 cos0.99 難0.14", "s": 0.738, "f": 0}, {"x": 0.993, "y": 0.037, "c": "近傍", "n": "into the battlefield [A]  n=2993 cos0.99 難0.04", "s": 0.834, "f": 0}, {"x": 0.992, "y": 0.105, "c": "近傍", "n": "This is Love [A]  n=2478 cos0.99 難0.10", "s": 0.69, "f": 0}, {"x": 0.992, "y": 0.312, "c": "近傍", "n": "Little Little Princess [A]  n=3439 cos0.99 難0.31", "s": 0.958, "f": 0}, {"x": 0.994, "y": 0.421, "c": "近傍", "n": "Scharfrichter [A]  n=3411 cos0.99 難0.42", "s": 0.95, "f": 0}, {"x": 0.991, "y": 0.291, "c": "近傍", "n": "Blaze it UP! [A]  n=3472 cos0.99 難0.29", "s": 0.967, "f": 0}, {"x": 0.991, "y": 0.292, "c": "近傍", "n": "命の標本 [A]  n=3120 cos0.99 難0.29", "s": 0.869, "f": 0}, {"x": 0.994, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.99 難-0.01", "s": 0.661, "f": 0}, {"x": 0.991, "y": 0.227, "c": "近傍", "n": "Take It Easy [A]  n=3278 cos0.99 難0.23", "s": 0.913, "f": 0}, {"x": 0.995, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos1.00 難-0.05", "s": 0.861, "f": 0}, {"x": 0.991, "y": 0.273, "c": "近傍", "n": "オールトの雲 [A]  n=2469 cos0.99 難0.27", "s": 0.688, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45116770133045314}, {"a": 0, "b": 2, "w": 0.22338779801580044}, {"a": 0, "b": 3, "w": 0.3769409687563904}, {"a": 0, "b": 4, "w": 0.4119166421601419}, {"a": 0, "b": 5, "w": 0.33954080382196394}, {"a": 0, "b": 6, "w": 0.3283312424270488}, {"a": 0, "b": 7, "w": 0.32359658614895115}, {"a": 0, "b": 8, "w": 0.3171160265169508}, {"a": 0, "b": 9, "w": 0.3120272484635772}, {"a": 0, "b": 10, "w": 0.173508215380202}, {"a": 0, "b": 11, "w": 0.05429867902148611}, {"a": 0, "b": 12, "w": 0.2169733523756633}, {"a": 0, "b": 13, "w": 0.2667523817125921}, {"a": 0, "b": 14, "w": 0.3432220139496036}, {"a": 0, "b": 15, "w": 0.2720689588215768}, {"a": 0, "b": 16, "w": 0.25113368129555647}, {"a": 0, "b": 17, "w": 0.18298883498110086}, {"a": 0, "b": 18, "w": 4.633082806293487e-11}, {"a": 0, "b": 19, "w": 0.20587849128279068}, {"a": 0, "b": 20, "w": 0.2447099118055368}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.082,hiY=0.458;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
