<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Programmed Sun [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.813, "c": "種", "n": "Programmed Sun [H]  n=2096 cos1.00 難-0.81", "s": 0.65, "f": 0}, {"x": 0.996, "y": -0.912, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [H]  n=2076 cos1.00 難-0.91", "s": 0.644, "f": 0}, {"x": 0.993, "y": -0.862, "c": "近傍", "n": "Programmed Life [H]  n=1853 cos0.99 難-0.86", "s": 0.575, "f": 0}, {"x": 0.993, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos0.99 難-0.74", "s": 0.637, "f": 0}, {"x": 0.992, "y": -0.789, "c": "近傍", "n": "星をこの手に [H]  n=1902 cos0.99 難-0.79", "s": 0.59, "f": 0}, {"x": 0.992, "y": -0.895, "c": "近傍", "n": "Destiny Sword [H]  n=2143 cos0.99 難-0.89", "s": 0.665, "f": 0}, {"x": 0.993, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos0.99 難-0.71", "s": 0.708, "f": 0}, {"x": 0.991, "y": -0.801, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2344 cos0.99 難-0.80", "s": 0.727, "f": 0}, {"x": 0.993, "y": -0.683, "c": "近傍", "n": "abstract [H]  n=1823 cos0.99 難-0.68", "s": 0.566, "f": 0}, {"x": 0.991, "y": -0.862, "c": "近傍", "n": "Votum stellarum [H]  n=1927 cos0.99 難-0.86", "s": 0.598, "f": 0}, {"x": 0.993, "y": -0.955, "c": "近傍", "n": "君のハートにロックオン [H]  n=2143 cos0.99 難-0.95", "s": 0.665, "f": 0}, {"x": 0.991, "y": -0.897, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1600 cos0.99 難-0.90", "s": 0.496, "f": 0}, {"x": 0.991, "y": -0.917, "c": "近傍", "n": "Make Me Your Own [H]  n=1668 cos0.99 難-0.92", "s": 0.518, "f": 0}, {"x": 0.99, "y": -0.894, "c": "近傍", "n": "n/a [H]  n=1573 cos0.99 難-0.89", "s": 0.488, "f": 0}, {"x": 0.995, "y": -1.02, "c": "近傍", "n": "Cosmic Cat [H]  n=1849 cos0.99 難-1.02", "s": 0.574, "f": 0}, {"x": 0.99, "y": -0.827, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2332 cos0.99 難-0.83", "s": 0.724, "f": 0}, {"x": 0.992, "y": -0.968, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2499 cos0.99 難-0.97", "s": 0.775, "f": 0}, {"x": 0.99, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.574, "f": 0}, {"x": 0.99, "y": -0.877, "c": "近傍", "n": "The Sampling Paradise [H]  n=3028 cos0.99 難-0.88", "s": 0.939, "f": 0}, {"x": 0.992, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.99 難-0.65", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.693, "c": "近傍", "n": "Regulus [H]  n=1425 cos0.99 難-0.69", "s": 0.442, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5736356414439663}, {"a": 0, "b": 2, "w": 0.45788474482944885}, {"a": 0, "b": 3, "w": 0.43011418633115617}, {"a": 0, "b": 4, "w": 0.3829166599360925}, {"a": 0, "b": 5, "w": 0.36650783761020045}, {"a": 0, "b": 6, "w": 0.42285273323051853}, {"a": 0, "b": 7, "w": 0.3739902643141805}, {"a": 0, "b": 8, "w": 0.35847867136498246}, {"a": 0, "b": 9, "w": 0.3237513795727155}, {"a": 0, "b": 10, "w": 0.27332230457491424}, {"a": 0, "b": 11, "w": 0.3635938082797322}, {"a": 0, "b": 12, "w": 0.3759446431620055}, {"a": 0, "b": 13, "w": 4.995448499300892e-11}, {"a": 0, "b": 14, "w": 0.47704815749441476}, {"a": 0, "b": 15, "w": 0.18426069527707967}, {"a": 0, "b": 16, "w": 0.38803740203175785}, {"a": 0, "b": 17, "w": 0.3317337037138155}, {"a": 0, "b": 18, "w": 0.3240505064335779}, {"a": 0, "b": 19, "w": 0.3784551046853626}, {"a": 0, "b": 20, "w": 0.3419211924837664}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-1.050,hiY=-0.621;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
