<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Kick The Rainbow [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.168, "c": "種", "n": "Kick The Rainbow [A]  n=355 cos1.00 難-0.17", "s": 0.098, "f": 0}, {"x": 0.996, "y": -0.099, "c": "近傍", "n": "Mighty Cutie [A]  n=946 cos1.00 難-0.10", "s": 0.261, "f": 0}, {"x": 0.994, "y": -0.243, "c": "近傍", "n": "水無月の雫 ft. 小林まな [A]  n=2572 cos0.99 難-0.24", "s": 0.711, "f": 0}, {"x": 0.994, "y": -0.295, "c": "近傍", "n": "■□模様 [A]  n=1385 cos0.99 難-0.29", "s": 0.383, "f": 0}, {"x": 0.993, "y": -0.252, "c": "近傍", "n": "FERMI PARADOX [A]  n=1455 cos0.99 難-0.25", "s": 0.402, "f": 0}, {"x": 0.993, "y": -0.292, "c": "近傍", "n": "零 - ZERO - [A]  n=3027 cos0.99 難-0.29", "s": 0.837, "f": 0}, {"x": 0.992, "y": -0.109, "c": "近傍", "n": "MAX LOVE [A]  n=3135 cos0.99 難-0.11", "s": 0.867, "f": 0}, {"x": 0.994, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos0.99 難-0.37", "s": 0.582, "f": 0}, {"x": 0.993, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos0.99 難-0.35", "s": 0.832, "f": 0}, {"x": 0.992, "y": -0.036, "c": "近傍", "n": "Rock Da House [A]  n=3618 cos0.99 難-0.04", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.006, "c": "近傍", "n": "Bitter & Lucky [A]  n=1494 cos0.99 難0.01", "s": 0.413, "f": 0}, {"x": 0.991, "y": -0.297, "c": "近傍", "n": "朱と碧のランページ [A]  n=1029 cos0.99 難-0.30", "s": 0.284, "f": 0}, {"x": 0.991, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos0.99 難-0.25", "s": 0.665, "f": 0}, {"x": 0.991, "y": -0.333, "c": "近傍", "n": "GET UP AGAIN [A]  n=1998 cos0.99 難-0.33", "s": 0.552, "f": 0}, {"x": 0.99, "y": -0.2, "c": "近傍", "n": "Mel [L]  n=610 cos0.99 難-0.20", "s": 0.169, "f": 0}, {"x": 0.992, "y": -0.402, "c": "近傍", "n": "THE DETONATOR [H]  n=2218 cos0.99 難-0.40", "s": 0.613, "f": 0}, {"x": 0.991, "y": -0.341, "c": "近傍", "n": "AGETEKE ONDO [A]  n=1005 cos0.99 難-0.34", "s": 0.278, "f": 0}, {"x": 0.991, "y": -0.38, "c": "近傍", "n": "get set mind [A]  n=1498 cos0.99 難-0.38", "s": 0.414, "f": 0}, {"x": 0.989, "y": -0.121, "c": "近傍", "n": "Shirdal [A]  n=692 cos0.99 難-0.12", "s": 0.191, "f": 0}, {"x": 0.99, "y": -0.309, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2117 cos0.99 難-0.31", "s": 0.585, "f": 0}, {"x": 0.99, "y": -0.055, "c": "近傍", "n": "AO-∞ [A]  n=2932 cos0.99 難-0.05", "s": 0.81, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40133393839022}, {"a": 0, "b": 2, "w": 0.1356827306272188}, {"a": 0, "b": 3, "w": 0.22632107323389128}, {"a": 0, "b": 4, "w": 0.3477663553292647}, {"a": 0, "b": 5, "w": 0.0008733665364009102}, {"a": 0, "b": 6, "w": 0.24161683690238278}, {"a": 0, "b": 7, "w": 0.21096341529315898}, {"a": 0, "b": 8, "w": 0.008957872179231052}, {"a": 0, "b": 9, "w": 4.3628323176392314e-11}, {"a": 0, "b": 10, "w": 0.32236089601061313}, {"a": 0, "b": 11, "w": 0.11046660595466817}, {"a": 0, "b": 12, "w": 0.17904659214650132}, {"a": 0, "b": 13, "w": 0.16482112953976358}, {"a": 0, "b": 14, "w": 0.27384675312606543}, {"a": 0, "b": 15, "w": 0.047106844378640655}, {"a": 0, "b": 16, "w": 0.24001789713912614}, {"a": 0, "b": 17, "w": 0.1362179780964835}, {"a": 0, "b": 18, "w": 0.14030364981393972}, {"a": 0, "b": 19, "w": 0.0864081950434793}, {"a": 0, "b": 20, "w": 0.22843673417474752}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.435,hiY=0.039;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
