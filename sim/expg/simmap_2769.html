<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.348, "c": "種", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [A]  n=2195 cos1.00 難1.35", "s": 0.626, "f": 0}, {"x": 0.991, "y": 1.407, "c": "近傍", "n": "抱きしめてモナムール [A]  n=2914 cos0.99 難1.41", "s": 0.832, "f": 0}, {"x": 0.989, "y": 1.409, "c": "近傍", "n": "EXUSIA [A]  n=3127 cos0.99 難1.41", "s": 0.892, "f": 0}, {"x": 0.988, "y": 1.503, "c": "近傍", "n": "O/D*20 [L]  n=1300 cos0.99 難1.50", "s": 0.371, "f": 0}, {"x": 0.993, "y": 1.103, "c": "近傍", "n": "それは花火のような恋 [A]  n=3451 cos0.99 難1.10", "s": 0.985, "f": 0}, {"x": 0.986, "y": 1.316, "c": "近傍", "n": "神謳 -RESONANCE- [A]  n=3227 cos0.99 難1.32", "s": 0.921, "f": 0}, {"x": 0.986, "y": 1.28, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3355 cos0.99 難1.28", "s": 0.957, "f": 0}, {"x": 0.989, "y": 1.151, "c": "近傍", "n": "FUZIN RIZIN [A]  n=3383 cos0.99 難1.15", "s": 0.965, "f": 0}, {"x": 0.99, "y": 1.117, "c": "近傍", "n": "Roar of Chronos [A]  n=1311 cos0.99 難1.12", "s": 0.374, "f": 0}, {"x": 0.992, "y": 1.087, "c": "近傍", "n": "WONDER WALKER [A]  n=3497 cos0.99 難1.09", "s": 0.998, "f": 0}, {"x": 0.992, "y": 1.083, "c": "近傍", "n": "Catch Our Fire! [A]  n=3267 cos0.99 難1.08", "s": 0.932, "f": 0}, {"x": 0.986, "y": 1.475, "c": "近傍", "n": "G59 [A]  n=3107 cos0.99 難1.48", "s": 0.887, "f": 0}, {"x": 0.987, "y": 1.158, "c": "近傍", "n": "MARLIN [A]  n=1127 cos0.99 難1.16", "s": 0.322, "f": 0}, {"x": 0.985, "y": 1.456, "c": "近傍", "n": "Demon March [A]  n=1392 cos0.98 難1.46", "s": 0.397, "f": 0}, {"x": 0.984, "y": 1.211, "c": "近傍", "n": "innocent revolver [A]  n=2541 cos0.98 難1.21", "s": 0.725, "f": 0}, {"x": 0.982, "y": 1.348, "c": "近傍", "n": "Arkadia [A]  n=2067 cos0.98 難1.35", "s": 0.59, "f": 0}, {"x": 0.982, "y": 1.349, "c": "近傍", "n": "Burning Flame [L]  n=1624 cos0.98 難1.35", "s": 0.463, "f": 0}, {"x": 0.984, "y": 1.181, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2193 cos0.98 難1.18", "s": 0.626, "f": 0}, {"x": 0.986, "y": 1.107, "c": "近傍", "n": "PUNISHER [A]  n=3504 cos0.99 難1.11", "s": 1.0, "f": 0}, {"x": 0.984, "y": 1.154, "c": "近傍", "n": "AKASHIC BREAK [A]  n=2956 cos0.98 難1.15", "s": 0.844, "f": 0}, {"x": 0.984, "y": 1.538, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [A]  n=2322 cos0.98 難1.54", "s": 0.663, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3644860902591158}, {"a": 0, "b": 2, "w": 0.2647846442506394}, {"a": 0, "b": 3, "w": 0.28816100579774595}, {"a": 0, "b": 4, "w": 0.3530938267199568}, {"a": 0, "b": 5, "w": 0.19247601548125592}, {"a": 0, "b": 6, "w": 0.2121559774680425}, {"a": 0, "b": 7, "w": 0.25841899077358277}, {"a": 0, "b": 8, "w": 0.2997221909397825}, {"a": 0, "b": 9, "w": 0.1984882642091984}, {"a": 0, "b": 10, "w": 0.2550534102474781}, {"a": 0, "b": 11, "w": 0.22323366721070514}, {"a": 0, "b": 12, "w": 0.14331033882871835}, {"a": 0, "b": 13, "w": 0.12148082617915101}, {"a": 0, "b": 14, "w": 0.09933516393828845}, {"a": 0, "b": 15, "w": 2.67823541122425e-11}, {"a": 0, "b": 16, "w": 0.12466788433275378}, {"a": 0, "b": 17, "w": 0.13409971503475138}, {"a": 0, "b": 18, "w": 0.1747879915896039}, {"a": 0, "b": 19, "w": 0.18600781124791366}, {"a": 0, "b": 20, "w": 0.19246783033299197}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=1.046,hiY=1.574;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
