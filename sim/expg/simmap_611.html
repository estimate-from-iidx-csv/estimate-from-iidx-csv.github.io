<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Yellow Sketch(RX-Ver.S.P.L.) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.432, "c": "種", "n": "Yellow Sketch(RX-Ver.S.P.L.) [H]  n=1001 cos1.00 難-1.43", "s": 0.439, "f": 0}, {"x": 0.993, "y": -1.477, "c": "近傍", "n": "Dawn Saga [H]  n=1268 cos0.99 難-1.48", "s": 0.556, "f": 0}, {"x": 0.992, "y": -1.437, "c": "近傍", "n": "Discloze [H]  n=1377 cos0.99 難-1.44", "s": 0.603, "f": 0}, {"x": 0.992, "y": -1.427, "c": "近傍", "n": "Amazing Mirage [H]  n=1854 cos0.99 難-1.43", "s": 0.812, "f": 0}, {"x": 0.992, "y": -1.344, "c": "近傍", "n": "量子の海のリントヴルム [H]  n=2282 cos0.99 難-1.34", "s": 1.0, "f": 0}, {"x": 0.991, "y": -1.482, "c": "近傍", "n": "Vitrum [H]  n=1210 cos0.99 難-1.48", "s": 0.53, "f": 0}, {"x": 0.991, "y": -1.353, "c": "近傍", "n": "セロトニン [H]  n=1489 cos0.99 難-1.35", "s": 0.652, "f": 0}, {"x": 0.991, "y": -1.521, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [H]  n=1005 cos0.99 難-1.52", "s": 0.44, "f": 0}, {"x": 0.991, "y": -1.343, "c": "近傍", "n": "RAIN [H]  n=1516 cos0.99 難-1.34", "s": 0.664, "f": 0}, {"x": 0.989, "y": -1.429, "c": "近傍", "n": "Ember Lights [H]  n=1574 cos0.99 難-1.43", "s": 0.69, "f": 0}, {"x": 0.991, "y": -1.294, "c": "近傍", "n": "The Least 100sec [H]  n=1574 cos0.99 難-1.29", "s": 0.69, "f": 0}, {"x": 0.989, "y": -1.431, "c": "近傍", "n": "Playing With Fire [H]  n=1043 cos0.99 難-1.43", "s": 0.457, "f": 0}, {"x": 0.991, "y": -1.247, "c": "近傍", "n": "Arca [H]  n=1544 cos0.99 難-1.25", "s": 0.677, "f": 0}, {"x": 0.988, "y": -1.428, "c": "近傍", "n": "ChaserXX [H]  n=1406 cos0.99 難-1.43", "s": 0.616, "f": 0}, {"x": 0.995, "y": -1.704, "c": "近傍", "n": "SPEED ROCKER [H]  n=1118 cos1.00 難-1.70", "s": 0.49, "f": 0}, {"x": 0.988, "y": -1.515, "c": "近傍", "n": "HARD BRAIN [H]  n=1253 cos0.99 難-1.51", "s": 0.549, "f": 0}, {"x": 0.987, "y": -1.419, "c": "近傍", "n": "Usual Days-remix [H]  n=1248 cos0.99 難-1.42", "s": 0.547, "f": 0}, {"x": 0.987, "y": -1.337, "c": "近傍", "n": "Ghost Pulse [H]  n=820 cos0.99 難-1.34", "s": 0.359, "f": 0}, {"x": 0.986, "y": -1.373, "c": "近傍", "n": "Back Spin Sweeper [H]  n=1432 cos0.99 難-1.37", "s": 0.628, "f": 0}, {"x": 0.987, "y": -1.511, "c": "近傍", "n": "Static State [H]  n=1084 cos0.99 難-1.51", "s": 0.475, "f": 0}, {"x": 0.988, "y": -1.603, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.60", "s": 0.488, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4217664722585662}, {"a": 0, "b": 2, "w": 0.393279757454974}, {"a": 0, "b": 3, "w": 0.3576038062723307}, {"a": 0, "b": 4, "w": 0.3906292718416753}, {"a": 0, "b": 5, "w": 0.3581682967554337}, {"a": 0, "b": 6, "w": 0.3153217001059532}, {"a": 0, "b": 7, "w": 0.3482275872704127}, {"a": 0, "b": 8, "w": 0.293019568004216}, {"a": 0, "b": 9, "w": 0.18178605474401954}, {"a": 0, "b": 10, "w": 0.3015636811792589}, {"a": 0, "b": 11, "w": 0.06762711378838226}, {"a": 0, "b": 12, "w": 0.3569646179503082}, {"a": 0, "b": 13, "w": 0.24818083588071116}, {"a": 0, "b": 14, "w": 0.5044024779316272}, {"a": 0, "b": 15, "w": 0.22904307520976586}, {"a": 0, "b": 16, "w": 0.1432537653412561}, {"a": 0, "b": 17, "w": 5.436484595833235e-11}, {"a": 0, "b": 18, "w": 0.16007023868525105}, {"a": 0, "b": 19, "w": 0.14003159033212398}, {"a": 0, "b": 20, "w": 0.23874073231894255}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.741,hiY=-1.210;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
