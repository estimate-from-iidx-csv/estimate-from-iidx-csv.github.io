<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Eine Haube ～聖地の果てにあるもの～ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.734, "c": "種", "n": "Eine Haube ～聖地の果てにあるもの～ [A]  n=2941 cos1.00 難0.73", "s": 0.783, "f": 0}, {"x": 0.996, "y": 0.748, "c": "近傍", "n": "Let The Track Flow [A]  n=3113 cos1.00 難0.75", "s": 0.829, "f": 0}, {"x": 0.993, "y": 0.607, "c": "近傍", "n": "禍根 [A]  n=3114 cos0.99 難0.61", "s": 0.829, "f": 0}, {"x": 0.992, "y": 0.602, "c": "近傍", "n": "OTOKOZAKA [A]  n=1616 cos0.99 難0.60", "s": 0.43, "f": 0}, {"x": 0.991, "y": 0.677, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1835 cos0.99 難0.68", "s": 0.489, "f": 0}, {"x": 0.991, "y": 0.866, "c": "近傍", "n": "Arca [A]  n=3564 cos0.99 難0.87", "s": 0.949, "f": 0}, {"x": 0.992, "y": 0.572, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3321 cos0.99 難0.57", "s": 0.884, "f": 0}, {"x": 0.99, "y": 0.777, "c": "近傍", "n": "encounter [A]  n=3621 cos0.99 難0.78", "s": 0.964, "f": 0}, {"x": 0.99, "y": 0.71, "c": "近傍", "n": "STELLAR WIND [A]  n=3201 cos0.99 難0.71", "s": 0.852, "f": 0}, {"x": 0.995, "y": 0.462, "c": "近傍", "n": "rainbow guitar weeps [A]  n=3342 cos1.00 難0.46", "s": 0.89, "f": 0}, {"x": 0.99, "y": 0.641, "c": "近傍", "n": "532nm [A]  n=3523 cos0.99 難0.64", "s": 0.938, "f": 0}, {"x": 0.99, "y": 0.701, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2940 cos0.99 難0.70", "s": 0.783, "f": 0}, {"x": 0.991, "y": 0.564, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [H]  n=3690 cos0.99 難0.56", "s": 0.982, "f": 0}, {"x": 0.99, "y": 0.602, "c": "近傍", "n": "ΕΛΠΙΣ [A]  n=3756 cos0.99 難0.60", "s": 1.0, "f": 0}, {"x": 0.989, "y": 0.731, "c": "近傍", "n": "HAPPY★RUSH [A]  n=3198 cos0.99 難0.73", "s": 0.851, "f": 0}, {"x": 0.993, "y": 0.487, "c": "近傍", "n": "Never Fade Away [A]  n=3146 cos0.99 難0.49", "s": 0.838, "f": 0}, {"x": 0.993, "y": 0.473, "c": "近傍", "n": "CONCEPTUAL [A]  n=3290 cos0.99 難0.47", "s": 0.876, "f": 0}, {"x": 0.991, "y": 0.494, "c": "近傍", "n": "爆ゼニ☆がってんワーカー [A]  n=2932 cos0.99 難0.49", "s": 0.781, "f": 0}, {"x": 0.988, "y": 0.784, "c": "近傍", "n": "GENOCIDE [A]  n=3258 cos0.99 難0.78", "s": 0.867, "f": 0}, {"x": 0.988, "y": 0.646, "c": "近傍", "n": "MAXIVCORD [A]  n=2837 cos0.99 難0.65", "s": 0.755, "f": 0}, {"x": 0.989, "y": 0.549, "c": "近傍", "n": "rumrum triplets [A]  n=3300 cos0.99 難0.55", "s": 0.879, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4670698700839333}, {"a": 0, "b": 2, "w": 0.12051180760687863}, {"a": 0, "b": 3, "w": 0.20281395957231518}, {"a": 0, "b": 4, "w": 0.1433065395076677}, {"a": 0, "b": 5, "w": 0.09966492459837206}, {"a": 0, "b": 6, "w": 0.19493303218221258}, {"a": 0, "b": 7, "w": 4.6060932845648495e-11}, {"a": 0, "b": 8, "w": 0.1453373101189216}, {"a": 0, "b": 9, "w": 0.3499235833285289}, {"a": 0, "b": 10, "w": 0.16307658231366873}, {"a": 0, "b": 11, "w": 0.08653379450916487}, {"a": 0, "b": 12, "w": 0.22341089246734602}, {"a": 0, "b": 13, "w": 0.1677324080559104}, {"a": 0, "b": 14, "w": 0.033247206408601016}, {"a": 0, "b": 15, "w": 0.2191485475388567}, {"a": 0, "b": 16, "w": 0.3127032780544522}, {"a": 0, "b": 17, "w": 0.2139605653741281}, {"a": 0, "b": 18, "w": 0.014769144531649014}, {"a": 0, "b": 19, "w": 0.1087330981647141}, {"a": 0, "b": 20, "w": 0.1453984705466107}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.429,hiY=0.898;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
