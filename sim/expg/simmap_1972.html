<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lost wing at.0 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.139, "c": "種", "n": "Lost wing at.0 [A]  n=3151 cos1.00 難0.14", "s": 0.847, "f": 0}, {"x": 0.993, "y": 0.234, "c": "近傍", "n": "曼荼羅恋々 [A]  n=2933 cos0.99 難0.23", "s": 0.788, "f": 0}, {"x": 0.995, "y": -0.082, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2977 cos1.00 難-0.08", "s": 0.8, "f": 0}, {"x": 0.992, "y": 0.156, "c": "近傍", "n": "眠りの国のステラ [A]  n=2538 cos0.99 難0.16", "s": 0.682, "f": 0}, {"x": 0.993, "y": -0.005, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3106 cos0.99 難-0.01", "s": 0.834, "f": 0}, {"x": 0.993, "y": 0.264, "c": "近傍", "n": "Marie Antoinette [A]  n=1917 cos0.99 難0.26", "s": 0.515, "f": 0}, {"x": 0.994, "y": -0.092, "c": "近傍", "n": "New Lights [A]  n=2834 cos0.99 難-0.09", "s": 0.761, "f": 0}, {"x": 0.994, "y": -0.105, "c": "近傍", "n": "CARRY ON NIGHT (English version) [A]  n=2071 cos0.99 難-0.11", "s": 0.556, "f": 0}, {"x": 0.992, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos0.99 難0.01", "s": 0.971, "f": 0}, {"x": 0.994, "y": -0.097, "c": "近傍", "n": "REMINISCENCE [A]  n=2781 cos0.99 難-0.10", "s": 0.747, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "beatAffection [A]  n=2807 cos0.99 難-0.13", "s": 0.754, "f": 0}, {"x": 0.994, "y": -0.125, "c": "近傍", "n": "ヒマワリ [A]  n=3294 cos0.99 難-0.12", "s": 0.885, "f": 0}, {"x": 0.994, "y": -0.14, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3188 cos0.99 難-0.14", "s": 0.857, "f": 0}, {"x": 0.993, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos0.99 難-0.06", "s": 0.819, "f": 0}, {"x": 0.991, "y": 0.132, "c": "近傍", "n": "SigSig [A]  n=3609 cos0.99 難0.13", "s": 0.97, "f": 0}, {"x": 0.992, "y": -0.041, "c": "近傍", "n": "LUV DRIVE [A]  n=2836 cos0.99 難-0.04", "s": 0.762, "f": 0}, {"x": 0.996, "y": -0.19, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2938 cos1.00 難-0.19", "s": 0.789, "f": 0}, {"x": 0.993, "y": -0.125, "c": "近傍", "n": "Breakin' Chain [A]  n=2889 cos0.99 難-0.12", "s": 0.776, "f": 0}, {"x": 0.992, "y": -0.059, "c": "近傍", "n": "Agnus Dei [A]  n=2679 cos0.99 難-0.06", "s": 0.72, "f": 0}, {"x": 0.992, "y": -0.107, "c": "近傍", "n": "smooooch・∀・ [A]  n=3722 cos0.99 難-0.11", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.055, "c": "近傍", "n": "AO-∞ [A]  n=2932 cos0.99 難-0.05", "s": 0.788, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.17726041741964838}, {"a": 0, "b": 2, "w": 0.3773152064904567}, {"a": 0, "b": 3, "w": 0.12790419052545554}, {"a": 0, "b": 4, "w": 0.25293602793722836}, {"a": 0, "b": 5, "w": 0.1305173600332007}, {"a": 0, "b": 6, "w": 0.29310409158312345}, {"a": 0, "b": 7, "w": 0.18070761429813387}, {"a": 0, "b": 8, "w": 0.08454784206668409}, {"a": 0, "b": 9, "w": 0.25791885081459087}, {"a": 0, "b": 10, "w": 0.33863085926452197}, {"a": 0, "b": 11, "w": 0.11770173334261569}, {"a": 0, "b": 12, "w": 0.1492049865080849}, {"a": 0, "b": 13, "w": 0.22517263199432913}, {"a": 0, "b": 14, "w": 0.1252273436609891}, {"a": 0, "b": 15, "w": 0.17248903534905535}, {"a": 0, "b": 16, "w": 0.2796164221640369}, {"a": 0, "b": 17, "w": 0.2536389194843185}, {"a": 0, "b": 18, "w": 0.15106133483682793}, {"a": 0, "b": 19, "w": 0.1507385056798881}, {"a": 0, "b": 20, "w": 6.121725348862128e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.226,hiY=0.300;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
