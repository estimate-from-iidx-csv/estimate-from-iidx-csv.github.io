<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ベラ・ベ・カラベラ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.67, "c": "種", "n": "ベラ・ベ・カラベラ [H]  n=359 cos1.00 難-1.67", "s": 0.204, "f": 0}, {"x": 0.992, "y": -1.534, "c": "近傍", "n": "Jungle Eater [H]  n=1100 cos0.99 難-1.53", "s": 0.624, "f": 0}, {"x": 0.989, "y": -1.729, "c": "近傍", "n": "C-C-C-N-N-N [H]  n=729 cos0.99 難-1.73", "s": 0.414, "f": 0}, {"x": 0.993, "y": -1.901, "c": "近傍", "n": "OVER VOLTAGE [H]  n=504 cos0.99 難-1.90", "s": 0.286, "f": 0}, {"x": 0.987, "y": -1.822, "c": "近傍", "n": "Victory Of Ravers [H]  n=725 cos0.99 難-1.82", "s": 0.411, "f": 0}, {"x": 0.987, "y": -1.833, "c": "近傍", "n": "儚き恋の華 [H]  n=970 cos0.99 難-1.83", "s": 0.551, "f": 0}, {"x": 0.985, "y": -1.615, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1154 cos0.98 難-1.62", "s": 0.655, "f": 0}, {"x": 0.984, "y": -1.605, "c": "近傍", "n": "STARLiGHT [H]  n=1529 cos0.98 難-1.60", "s": 0.868, "f": 0}, {"x": 0.985, "y": -1.522, "c": "近傍", "n": "Piano Samurai [H]  n=1409 cos0.99 難-1.52", "s": 0.8, "f": 0}, {"x": 0.991, "y": -1.37, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=715 cos0.99 難-1.37", "s": 0.406, "f": 0}, {"x": 0.987, "y": -1.878, "c": "近傍", "n": "Banger Banger Banger Banger [H]  n=824 cos0.99 難-1.88", "s": 0.468, "f": 0}, {"x": 0.986, "y": -1.885, "c": "近傍", "n": "Ritual of Anubis [H]  n=624 cos0.99 難-1.89", "s": 0.354, "f": 0}, {"x": 0.986, "y": -1.43, "c": "近傍", "n": "27th style [H]  n=1334 cos0.99 難-1.43", "s": 0.757, "f": 0}, {"x": 0.982, "y": -1.731, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1296 cos0.98 難-1.73", "s": 0.736, "f": 0}, {"x": 0.982, "y": -1.61, "c": "近傍", "n": "Wonderland [H]  n=1089 cos0.98 難-1.61", "s": 0.618, "f": 0}, {"x": 0.984, "y": -1.478, "c": "近傍", "n": "encounter [H]  n=1621 cos0.98 難-1.48", "s": 0.92, "f": 0}, {"x": 0.983, "y": -1.497, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1762 cos0.98 難-1.50", "s": 1.0, "f": 0}, {"x": 0.988, "y": -1.348, "c": "近傍", "n": "Rave Cannon [H]  n=1727 cos0.99 難-1.35", "s": 0.98, "f": 0}, {"x": 0.985, "y": -1.419, "c": "近傍", "n": "水鏡の異界 [H]  n=1252 cos0.98 難-1.42", "s": 0.711, "f": 0}, {"x": 0.984, "y": -1.897, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=956 cos0.98 難-1.90", "s": 0.543, "f": 0}, {"x": 0.983, "y": -1.43, "c": "近傍", "n": "花冠 feat.Aikapin [H]  n=1108 cos0.98 難-1.43", "s": 0.629, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3686370737027981}, {"a": 0, "b": 2, "w": 0.2360249154299554}, {"a": 0, "b": 3, "w": 0.3756539659444512}, {"a": 0, "b": 4, "w": 0.20616084817568758}, {"a": 0, "b": 5, "w": 0.1705777077592705}, {"a": 0, "b": 6, "w": 0.11811486113685454}, {"a": 0, "b": 7, "w": 0.121277257153667}, {"a": 0, "b": 8, "w": 0.132147554468816}, {"a": 0, "b": 9, "w": 0.21597682056092704}, {"a": 0, "b": 10, "w": 0.18709545907555725}, {"a": 0, "b": 11, "w": 0.16027519818087244}, {"a": 0, "b": 12, "w": 0.1793595236212493}, {"a": 0, "b": 13, "w": 5.3461124416287475e-11}, {"a": 0, "b": 14, "w": 0.043375679940752976}, {"a": 0, "b": 15, "w": 0.10578702063478129}, {"a": 0, "b": 16, "w": 0.005468665591643274}, {"a": 0, "b": 17, "w": 0.23777575972417653}, {"a": 0, "b": 18, "w": 0.13558688999585566}, {"a": 0, "b": 19, "w": 0.07464672860161858}, {"a": 0, "b": 20, "w": 0.04014655943348988}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.945,hiY=-1.304;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
