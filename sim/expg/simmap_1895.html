<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Giudecca [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.637, "c": "種", "n": "Giudecca [A]  n=3153 cos1.00 難0.64", "s": 0.851, "f": 0}, {"x": 0.996, "y": 0.602, "c": "近傍", "n": "OTOKOZAKA [A]  n=1616 cos1.00 難0.60", "s": 0.436, "f": 0}, {"x": 0.997, "y": 0.71, "c": "近傍", "n": "STELLAR WIND [A]  n=3201 cos1.00 難0.71", "s": 0.864, "f": 0}, {"x": 0.998, "y": 0.47, "c": "近傍", "n": "天空脳番長危機十六連打 [A]  n=3231 cos1.00 難0.47", "s": 0.872, "f": 0}, {"x": 0.994, "y": 0.537, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2667 cos0.99 難0.54", "s": 0.72, "f": 0}, {"x": 0.995, "y": 0.491, "c": "近傍", "n": "DROP [A]  n=3226 cos0.99 難0.49", "s": 0.87, "f": 0}, {"x": 0.994, "y": 0.54, "c": "近傍", "n": "BRAVE OUT [L]  n=693 cos0.99 難0.54", "s": 0.187, "f": 0}, {"x": 0.992, "y": 0.646, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1772 cos0.99 難0.65", "s": 0.478, "f": 0}, {"x": 0.995, "y": 0.39, "c": "近傍", "n": "ChaserXX [A]  n=3334 cos0.99 難0.39", "s": 0.9, "f": 0}, {"x": 0.992, "y": 0.498, "c": "近傍", "n": "No.13 [A]  n=3460 cos0.99 難0.50", "s": 0.934, "f": 0}, {"x": 0.991, "y": 0.572, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3321 cos0.99 難0.57", "s": 0.896, "f": 0}, {"x": 0.993, "y": 0.449, "c": "近傍", "n": "Ubertreffen [A]  n=3508 cos0.99 難0.45", "s": 0.947, "f": 0}, {"x": 0.992, "y": 0.489, "c": "近傍", "n": "GLORIOUS HAMMER [A]  n=1356 cos0.99 難0.49", "s": 0.366, "f": 0}, {"x": 0.991, "y": 0.608, "c": "近傍", "n": "Scripted Connection⇒ H mix [A]  n=3244 cos0.99 難0.61", "s": 0.875, "f": 0}, {"x": 0.993, "y": 0.432, "c": "近傍", "n": "Xepher [A]  n=3664 cos0.99 難0.43", "s": 0.989, "f": 0}, {"x": 0.991, "y": 0.715, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3091 cos0.99 難0.72", "s": 0.834, "f": 0}, {"x": 0.991, "y": 0.524, "c": "近傍", "n": "HYENA [A]  n=3451 cos0.99 難0.52", "s": 0.931, "f": 0}, {"x": 0.992, "y": 0.47, "c": "近傍", "n": "Overslept [A]  n=2558 cos0.99 難0.47", "s": 0.69, "f": 0}, {"x": 0.994, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.99 難0.89", "s": 0.288, "f": 0}, {"x": 0.99, "y": 0.596, "c": "近傍", "n": "ALL MY TURN -このターンに、オレの全てを賭ける- [A]  n=3259 cos0.99 難0.60", "s": 0.879, "f": 0}, {"x": 0.992, "y": 0.82, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3706 cos0.99 難0.82", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5842301572670949}, {"a": 0, "b": 2, "w": 0.5786861033410824}, {"a": 0, "b": 3, "w": 0.6499799865015637}, {"a": 0, "b": 4, "w": 0.3760966173095437}, {"a": 0, "b": 5, "w": 0.5310644423256058}, {"a": 0, "b": 6, "w": 0.491588821597137}, {"a": 0, "b": 7, "w": 3.938738224462668e-11}, {"a": 0, "b": 8, "w": 0.5148628493298085}, {"a": 0, "b": 9, "w": 0.1255378476573097}, {"a": 0, "b": 10, "w": 0.37630956358761447}, {"a": 0, "b": 11, "w": 0.4051247307483745}, {"a": 0, "b": 12, "w": 0.141598701247029}, {"a": 0, "b": 13, "w": 0.327909902940978}, {"a": 0, "b": 14, "w": 0.37022342697944455}, {"a": 0, "b": 15, "w": 0.32773976560259355}, {"a": 0, "b": 16, "w": 0.24406438333872016}, {"a": 0, "b": 17, "w": 0.3881226913860484}, {"a": 0, "b": 18, "w": 0.04368166236857396}, {"a": 0, "b": 19, "w": 0.29945787510876287}, {"a": 0, "b": 20, "w": 0.041048695251558964}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.350,hiY=0.929;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
