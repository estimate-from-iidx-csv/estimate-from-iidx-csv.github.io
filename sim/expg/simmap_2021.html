<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">No Tears [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.149, "c": "種", "n": "No Tears [A]  n=3588 cos1.00 難0.15", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.116, "c": "近傍", "n": "RIZING YOU UP [A]  n=3102 cos1.00 難0.12", "s": 0.865, "f": 0}, {"x": 0.994, "y": 0.132, "c": "近傍", "n": "PENDUAL TALISMAN [A]  n=3416 cos0.99 難0.13", "s": 0.952, "f": 0}, {"x": 0.993, "y": 0.082, "c": "近傍", "n": "LOVELY STORM [A]  n=2975 cos0.99 難0.08", "s": 0.829, "f": 0}, {"x": 0.992, "y": 0.161, "c": "近傍", "n": "バッドエンド・シンドローム [A]  n=2752 cos0.99 難0.16", "s": 0.767, "f": 0}, {"x": 0.993, "y": 0.206, "c": "近傍", "n": "KEY [A]  n=3457 cos0.99 難0.21", "s": 0.963, "f": 0}, {"x": 0.994, "y": 0.285, "c": "近傍", "n": "Fervidex [A]  n=3422 cos0.99 難0.29", "s": 0.954, "f": 0}, {"x": 0.995, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.99 難-0.01", "s": 0.661, "f": 0}, {"x": 0.994, "y": 0.308, "c": "近傍", "n": "Linus [A]  n=3389 cos0.99 難0.31", "s": 0.945, "f": 0}, {"x": 0.992, "y": 0.226, "c": "近傍", "n": "Pout [A]  n=2130 cos0.99 難0.23", "s": 0.594, "f": 0}, {"x": 0.991, "y": 0.206, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1249 cos0.99 難0.21", "s": 0.348, "f": 0}, {"x": 0.991, "y": 0.226, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3405 cos0.99 難0.23", "s": 0.949, "f": 0}, {"x": 0.992, "y": 0.292, "c": "近傍", "n": "雫 [A]  n=1343 cos0.99 難0.29", "s": 0.374, "f": 0}, {"x": 0.991, "y": 0.227, "c": "近傍", "n": "Take It Easy [A]  n=3278 cos0.99 難0.23", "s": 0.914, "f": 0}, {"x": 0.997, "y": -0.094, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [A]  n=3188 cos1.00 難-0.09", "s": 0.889, "f": 0}, {"x": 0.995, "y": -0.076, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2764 cos0.99 難-0.08", "s": 0.77, "f": 0}, {"x": 0.993, "y": -0.04, "c": "近傍", "n": "Shadow World [A]  n=2319 cos0.99 難-0.04", "s": 0.646, "f": 0}, {"x": 0.99, "y": 0.082, "c": "近傍", "n": "PHOTONGENIC [A]  n=2862 cos0.99 難0.08", "s": 0.798, "f": 0}, {"x": 0.99, "y": 0.202, "c": "近傍", "n": "きみのせかい [A]  n=1142 cos0.99 難0.20", "s": 0.318, "f": 0}, {"x": 0.99, "y": 0.106, "c": "近傍", "n": "Warrior [A]  n=2489 cos0.99 難0.11", "s": 0.694, "f": 0}, {"x": 0.994, "y": -0.085, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3081 cos0.99 難-0.08", "s": 0.859, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39829407224838687}, {"a": 0, "b": 2, "w": 0.39134419183689195}, {"a": 0, "b": 3, "w": 0.29937539672964386}, {"a": 0, "b": 4, "w": 0.05556877267089089}, {"a": 0, "b": 5, "w": 0.22726789121435031}, {"a": 0, "b": 6, "w": 0.3736384531439849}, {"a": 0, "b": 7, "w": 0.43847240278166355}, {"a": 0, "b": 8, "w": 0.3055439584927596}, {"a": 0, "b": 9, "w": 0.1751013336093371}, {"a": 0, "b": 10, "w": 0.17881014701795073}, {"a": 0, "b": 11, "w": 0.18398144184873733}, {"a": 0, "b": 12, "w": 0.2300074918569439}, {"a": 0, "b": 13, "w": 0.2710795482223033}, {"a": 0, "b": 14, "w": 0.4657440789977608}, {"a": 0, "b": 15, "w": 0.2546916085347444}, {"a": 0, "b": 16, "w": 0.3497597282145014}, {"a": 0, "b": 17, "w": 0.0974677027841433}, {"a": 0, "b": 18, "w": 5.0117243688418966e-11}, {"a": 0, "b": 19, "w": 0.19983597268618425}, {"a": 0, "b": 20, "w": 0.40116926051820034}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.126,hiY=0.340;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
