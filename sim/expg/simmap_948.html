<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">NEW GENERATION -もう、お前しか見えない- [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.162, "c": "種", "n": "NEW GENERATION -もう、お前しか見えない- [A]  n=2926 cos1.00 難0.16", "s": 0.796, "f": 0}, {"x": 0.994, "y": 0.155, "c": "近傍", "n": "Emera [A]  n=2042 cos0.99 難0.15", "s": 0.555, "f": 0}, {"x": 0.994, "y": 0.164, "c": "近傍", "n": "THE TIME MACHINE [A]  n=2217 cos0.99 難0.16", "s": 0.603, "f": 0}, {"x": 0.995, "y": 0.31, "c": "近傍", "n": "KAMAITACHI [A]  n=3676 cos1.00 難0.31", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.344, "c": "近傍", "n": "Banger Banger Banger Banger [A]  n=2286 cos1.00 難0.34", "s": 0.622, "f": 0}, {"x": 0.993, "y": 0.221, "c": "近傍", "n": "Timepiece phase II [H]  n=2931 cos0.99 難0.22", "s": 0.797, "f": 0}, {"x": 0.994, "y": -0.007, "c": "近傍", "n": "Lawes's Parotia [A]  n=2522 cos0.99 難-0.01", "s": 0.686, "f": 0}, {"x": 0.993, "y": 0.318, "c": "近傍", "n": "Pharaoh [A]  n=3339 cos0.99 難0.32", "s": 0.908, "f": 0}, {"x": 0.994, "y": 0.361, "c": "近傍", "n": "Rosa azuL [A]  n=2234 cos0.99 難0.36", "s": 0.608, "f": 0}, {"x": 0.993, "y": 0.321, "c": "近傍", "n": "Battleground [A]  n=3265 cos0.99 難0.32", "s": 0.888, "f": 0}, {"x": 0.991, "y": 0.245, "c": "近傍", "n": "Submerge Serenade [A]  n=1916 cos0.99 難0.24", "s": 0.521, "f": 0}, {"x": 0.992, "y": 0.31, "c": "近傍", "n": "#The_Relentless [A]  n=3438 cos0.99 難0.31", "s": 0.935, "f": 0}, {"x": 0.991, "y": 0.231, "c": "近傍", "n": "Override [A]  n=3119 cos0.99 難0.23", "s": 0.848, "f": 0}, {"x": 0.991, "y": 0.036, "c": "近傍", "n": "RAVE SYNDROME [A]  n=1563 cos0.99 難0.04", "s": 0.425, "f": 0}, {"x": 0.992, "y": 0.0, "c": "近傍", "n": "AMRITA -不滅ノ花- [A]  n=2872 cos0.99 難0.00", "s": 0.781, "f": 0}, {"x": 0.991, "y": 0.311, "c": "近傍", "n": "Amazing Mirage [A]  n=3631 cos0.99 難0.31", "s": 0.988, "f": 0}, {"x": 0.99, "y": 0.109, "c": "近傍", "n": "Programmed Genom [A]  n=2252 cos0.99 難0.11", "s": 0.613, "f": 0}, {"x": 0.993, "y": 0.411, "c": "近傍", "n": "Flash Back 90's [L]  n=1984 cos0.99 難0.41", "s": 0.54, "f": 0}, {"x": 0.99, "y": 0.182, "c": "近傍", "n": "MA・TSU・RI [A]  n=2106 cos0.99 難0.18", "s": 0.573, "f": 0}, {"x": 0.99, "y": 0.265, "c": "近傍", "n": "Aurora [A]  n=3647 cos0.99 難0.26", "s": 0.992, "f": 0}, {"x": 0.991, "y": 0.322, "c": "近傍", "n": "GIGA THRASH [A]  n=3153 cos0.99 難0.32", "s": 0.858, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40630130287492905}, {"a": 0, "b": 2, "w": 0.3468768429916632}, {"a": 0, "b": 3, "w": 0.3562905313558322}, {"a": 0, "b": 4, "w": 0.3415089657013951}, {"a": 0, "b": 5, "w": 0.19760861126599572}, {"a": 0, "b": 6, "w": 0.28176331084236317}, {"a": 0, "b": 7, "w": 0.3552277888279314}, {"a": 0, "b": 8, "w": 0.38628115617276837}, {"a": 0, "b": 9, "w": 0.3018417106497019}, {"a": 0, "b": 10, "w": 0.2697976231976993}, {"a": 0, "b": 11, "w": 0.301858006814531}, {"a": 0, "b": 12, "w": 0.24059312162898883}, {"a": 0, "b": 13, "w": 0.2497627358946094}, {"a": 0, "b": 14, "w": 0.20188388814247604}, {"a": 0, "b": 15, "w": 0.2669880754602322}, {"a": 0, "b": 16, "w": 4.411937482018402e-11}, {"a": 0, "b": 17, "w": 0.36366924417156776}, {"a": 0, "b": 18, "w": 0.19767159748698027}, {"a": 0, "b": 19, "w": 0.2387690396699066}, {"a": 0, "b": 20, "w": 0.2680981278149641}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.040,hiY=0.445;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
