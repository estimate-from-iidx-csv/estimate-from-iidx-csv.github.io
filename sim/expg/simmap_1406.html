<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 3 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.8, "c": "種", "n": "Level 3 [H]  n=1942 cos1.00 難-0.80", "s": 0.571, "f": 0}, {"x": 0.99, "y": -0.609, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [H]  n=2306 cos0.99 難-0.61", "s": 0.678, "f": 0}, {"x": 0.975, "y": -0.767, "c": "近傍", "n": "Level 4 [H]  n=1520 cos0.98 難-0.77", "s": 0.447, "f": 0}, {"x": 0.985, "y": -1.292, "c": "近傍", "n": "Level 2 [H]  n=1485 cos0.98 難-1.29", "s": 0.437, "f": 0}, {"x": 0.973, "y": -0.88, "c": "近傍", "n": "LOCUS OF THE TRAVEL [H]  n=1278 cos0.97 難-0.88", "s": 0.376, "f": 0}, {"x": 0.973, "y": -0.585, "c": "近傍", "n": "Digitank System [H]  n=2773 cos0.97 難-0.58", "s": 0.815, "f": 0}, {"x": 0.968, "y": -1.139, "c": "近傍", "n": "FlyAway [H]  n=627 cos0.97 難-1.14", "s": 0.184, "f": 0}, {"x": 0.977, "y": -0.177, "c": "近傍", "n": "Frisk And Squeak [A]  n=1804 cos0.98 難-0.18", "s": 0.53, "f": 0}, {"x": 0.971, "y": -0.254, "c": "近傍", "n": "Lift Us High [A]  n=2436 cos0.97 難-0.25", "s": 0.716, "f": 0}, {"x": 0.964, "y": -1.035, "c": "近傍", "n": "255 [H]  n=1427 cos0.96 難-1.03", "s": 0.419, "f": 0}, {"x": 0.964, "y": -0.496, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1047 cos0.96 難-0.50", "s": 0.308, "f": 0}, {"x": 0.978, "y": -0.074, "c": "近傍", "n": "Tripping Jumping [A]  n=1962 cos0.98 難-0.07", "s": 0.577, "f": 0}, {"x": 0.984, "y": 0.026, "c": "近傍", "n": "Close my Eyes for Me [A]  n=2162 cos0.98 難0.03", "s": 0.636, "f": 0}, {"x": 0.961, "y": -1.034, "c": "近傍", "n": "Papilio ulysses [H]  n=2091 cos0.96 難-1.03", "s": 0.615, "f": 0}, {"x": 0.961, "y": -1.023, "c": "近傍", "n": "m1dy Deluxe [H]  n=2327 cos0.96 難-1.02", "s": 0.684, "f": 0}, {"x": 0.968, "y": -0.249, "c": "近傍", "n": "Somebody Like You [A]  n=1178 cos0.97 難-0.25", "s": 0.346, "f": 0}, {"x": 0.964, "y": -0.341, "c": "近傍", "n": "Watch Out Pt.2 [H]  n=3315 cos0.96 難-0.34", "s": 0.974, "f": 0}, {"x": 0.961, "y": -1.168, "c": "近傍", "n": "& Intelligence [H]  n=1406 cos0.96 難-1.17", "s": 0.413, "f": 0}, {"x": 0.959, "y": -0.983, "c": "近傍", "n": "Peaktime Booster [H]  n=1228 cos0.96 難-0.98", "s": 0.361, "f": 0}, {"x": 0.975, "y": -0.012, "c": "近傍", "n": "Snake Stick [H]  n=3402 cos0.98 難-0.01", "s": 1.0, "f": 0}, {"x": 0.958, "y": -0.915, "c": "近傍", "n": "Purple Perplex [H]  n=1793 cos0.96 難-0.92", "s": 0.527, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5420421476831092}, {"a": 0, "b": 2, "w": 0.39452501786058136}, {"a": 0, "b": 3, "w": 0.36389942237064954}, {"a": 0, "b": 4, "w": 0.38012217566408835}, {"a": 0, "b": 5, "w": 0.20873625589800326}, {"a": 0, "b": 6, "w": 0.21424690966101956}, {"a": 0, "b": 7, "w": 0.408671801143206}, {"a": 0, "b": 8, "w": 0.2359691565969012}, {"a": 0, "b": 9, "w": 2.0118129384627537e-11}, {"a": 0, "b": 10, "w": 0.11284340198400955}, {"a": 0, "b": 11, "w": 0.3899458208945208}, {"a": 0, "b": 12, "w": 0.35877785129347095}, {"a": 0, "b": 13, "w": 0.2007043110751361}, {"a": 0, "b": 14, "w": 0.013793428687141174}, {"a": 0, "b": 15, "w": 0.17972923058388468}, {"a": 0, "b": 16, "w": 0.2497766196914316}, {"a": 0, "b": 17, "w": 0.1212680631984886}, {"a": 0, "b": 18, "w": 0.10876688653873379}, {"a": 0, "b": 19, "w": 0.3403252491023293}, {"a": 0, "b": 20, "w": 0.14676319382591918}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.955,hiX=1.003,loY=-1.397,hiY=0.132;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
