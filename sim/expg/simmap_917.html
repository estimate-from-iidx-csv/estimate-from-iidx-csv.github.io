<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Light Shine [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.106, "c": "種", "n": "Light Shine [A]  n=3375 cos1.00 難-0.11", "s": 0.891, "f": 0}, {"x": 0.981, "y": -0.249, "c": "近傍", "n": "Sunny Day Vibes [A]  n=2161 cos0.98 難-0.25", "s": 0.571, "f": 0}, {"x": 0.975, "y": -0.12, "c": "近傍", "n": "えだまめカレークッキング [A]  n=1606 cos0.97 難-0.12", "s": 0.424, "f": 0}, {"x": 0.977, "y": 0.219, "c": "近傍", "n": "Onyx [A]  n=2502 cos0.98 難0.22", "s": 0.661, "f": 0}, {"x": 0.973, "y": -0.039, "c": "近傍", "n": "Do What You Want [A]  n=2644 cos0.97 難-0.04", "s": 0.698, "f": 0}, {"x": 0.971, "y": -0.334, "c": "近傍", "n": "Voxane [A]  n=2861 cos0.97 難-0.33", "s": 0.756, "f": 0}, {"x": 0.97, "y": 0.028, "c": "近傍", "n": "Sakura Reflection [A]  n=3786 cos0.97 難0.03", "s": 1.0, "f": 0}, {"x": 0.97, "y": -0.213, "c": "近傍", "n": "流桜ノ門 [A]  n=1823 cos0.97 難-0.21", "s": 0.482, "f": 0}, {"x": 0.969, "y": -0.223, "c": "近傍", "n": "Arcanos [A]  n=1239 cos0.97 難-0.22", "s": 0.327, "f": 0}, {"x": 0.969, "y": -0.103, "c": "近傍", "n": "Rowdy [A]  n=2457 cos0.97 難-0.10", "s": 0.649, "f": 0}, {"x": 0.969, "y": -0.329, "c": "近傍", "n": "SURVIVOR [A]  n=2824 cos0.97 難-0.33", "s": 0.746, "f": 0}, {"x": 0.967, "y": -0.059, "c": "近傍", "n": "Technicolour Dreams [A]  n=2350 cos0.97 難-0.06", "s": 0.621, "f": 0}, {"x": 0.968, "y": -0.258, "c": "近傍", "n": "Golden Palms [A]  n=3226 cos0.97 難-0.26", "s": 0.852, "f": 0}, {"x": 0.974, "y": -0.665, "c": "近傍", "n": "bloomin' feeling [H]  n=3272 cos0.97 難-0.66", "s": 0.864, "f": 0}, {"x": 0.966, "y": -0.193, "c": "近傍", "n": "おおきなこえで [L]  n=2616 cos0.97 難-0.19", "s": 0.691, "f": 0}, {"x": 0.965, "y": -0.006, "c": "近傍", "n": "MIRACLE MEETS [A]  n=3772 cos0.97 難-0.01", "s": 0.996, "f": 0}, {"x": 0.966, "y": -0.399, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2090 cos0.97 難-0.40", "s": 0.552, "f": 0}, {"x": 0.966, "y": 0.226, "c": "近傍", "n": "Pout [A]  n=2130 cos0.97 難0.23", "s": 0.563, "f": 0}, {"x": 0.964, "y": -0.311, "c": "近傍", "n": "COSMIC☆WONDER☆REVOLUTION [A]  n=2877 cos0.96 難-0.31", "s": 0.76, "f": 0}, {"x": 0.963, "y": -0.06, "c": "近傍", "n": "Mr.T.(take me higher) [A]  n=2574 cos0.96 難-0.06", "s": 0.68, "f": 0}, {"x": 0.964, "y": -0.342, "c": "近傍", "n": "未来のプリズム [A]  n=2664 cos0.96 難-0.34", "s": 0.704, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.25418982530702994}, {"a": 0, "b": 2, "w": 0.2523117757421651}, {"a": 0, "b": 3, "w": 0.269701904798765}, {"a": 0, "b": 4, "w": 0.2146778207173583}, {"a": 0, "b": 5, "w": 0.12289810243176968}, {"a": 0, "b": 6, "w": 0.0594511855523463}, {"a": 0, "b": 7, "w": 0.1674668999258695}, {"a": 0, "b": 8, "w": 0.18191097610088247}, {"a": 0, "b": 9, "w": 0.07854387586238532}, {"a": 0, "b": 10, "w": 0.09207028442294074}, {"a": 0, "b": 11, "w": 0.15063128927257186}, {"a": 0, "b": 12, "w": 0.15789782864102275}, {"a": 0, "b": 13, "w": 0.23900010754716938}, {"a": 0, "b": 14, "w": 0.11588238141724827}, {"a": 0, "b": 15, "w": 0.043346457069709854}, {"a": 0, "b": 16, "w": 0.13383925444453426}, {"a": 0, "b": 17, "w": 0.03344704195922954}, {"a": 0, "b": 18, "w": 0.09860716223265054}, {"a": 0, "b": 19, "w": 0.06879324267008158}, {"a": 0, "b": 20, "w": 3.1586289139795554e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.961,hiX=1.003,loY=-0.736,hiY=0.297;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
