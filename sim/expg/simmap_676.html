<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">夕焼け ～Fading Day～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.025, "c": "種", "n": "夕焼け ～Fading Day～ [H]  n=1323 cos1.00 難-1.03", "s": 0.493, "f": 0}, {"x": 0.998, "y": -0.981, "c": "近傍", "n": "Catch Our Fire! [H]  n=1838 cos1.00 難-0.98", "s": 0.684, "f": 0}, {"x": 0.996, "y": -1.026, "c": "近傍", "n": "THE CANNONBALLER [H]  n=2489 cos1.00 難-1.03", "s": 0.927, "f": 0}, {"x": 0.996, "y": -1.067, "c": "近傍", "n": "刃図羅 [H]  n=2177 cos1.00 難-1.07", "s": 0.81, "f": 0}, {"x": 0.996, "y": -1.106, "c": "近傍", "n": "Fegrix [H]  n=1714 cos1.00 難-1.11", "s": 0.638, "f": 0}, {"x": 0.995, "y": -0.985, "c": "近傍", "n": "MAX 360 [H]  n=770 cos0.99 難-0.99", "s": 0.287, "f": 0}, {"x": 0.996, "y": -1.123, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=607 cos1.00 難-1.12", "s": 0.226, "f": 0}, {"x": 0.995, "y": -1.104, "c": "近傍", "n": "閠槞彁の願い [H]  n=1555 cos1.00 難-1.10", "s": 0.579, "f": 0}, {"x": 0.994, "y": -0.996, "c": "近傍", "n": "COSMIC RAY [H]  n=1047 cos0.99 難-1.00", "s": 0.39, "f": 0}, {"x": 0.996, "y": -0.916, "c": "近傍", "n": "∀ [H]  n=2291 cos1.00 難-0.92", "s": 0.853, "f": 0}, {"x": 0.994, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos0.99 難-1.02", "s": 0.751, "f": 0}, {"x": 0.994, "y": -0.958, "c": "近傍", "n": "Caterpillar [H]  n=2200 cos0.99 難-0.96", "s": 0.819, "f": 0}, {"x": 0.994, "y": -1.05, "c": "近傍", "n": "Angel's Ladder [H]  n=1645 cos0.99 難-1.05", "s": 0.612, "f": 0}, {"x": 0.998, "y": -0.864, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1856 cos1.00 難-0.86", "s": 0.691, "f": 0}, {"x": 0.994, "y": -0.96, "c": "近傍", "n": "NITROUS CANNON [H]  n=2158 cos0.99 難-0.96", "s": 0.803, "f": 0}, {"x": 0.994, "y": -0.941, "c": "近傍", "n": "Grand Chariot [H]  n=2686 cos0.99 難-0.94", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.059, "c": "近傍", "n": "u gotta beat [H]  n=946 cos0.99 難-1.06", "s": 0.352, "f": 0}, {"x": 0.994, "y": -0.966, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2503 cos0.99 難-0.97", "s": 0.932, "f": 0}, {"x": 0.994, "y": -0.916, "c": "近傍", "n": "PUNISHER [H]  n=2321 cos0.99 難-0.92", "s": 0.864, "f": 0}, {"x": 0.993, "y": -0.962, "c": "近傍", "n": "Artist [H]  n=1573 cos0.99 難-0.96", "s": 0.586, "f": 0}, {"x": 0.993, "y": -1.109, "c": "近傍", "n": "Demon March [H]  n=831 cos0.99 難-1.11", "s": 0.309, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35907864880914553}, {"a": 0, "b": 2, "w": 0.46464695660298605}, {"a": 0, "b": 3, "w": 0.40439389699004924}, {"a": 0, "b": 4, "w": 0.4364188488898382}, {"a": 0, "b": 5, "w": 0.2511701897348203}, {"a": 0, "b": 6, "w": 0.1719022216921282}, {"a": 0, "b": 7, "w": 0.2170312472964041}, {"a": 0, "b": 8, "w": 5.682276871254999e-11}, {"a": 0, "b": 9, "w": 0.4423487710627596}, {"a": 0, "b": 10, "w": 0.3230545196785217}, {"a": 0, "b": 11, "w": 0.34306172752211817}, {"a": 0, "b": 12, "w": 0.34930809726172085}, {"a": 0, "b": 13, "w": 0.512430599888984}, {"a": 0, "b": 14, "w": 0.3456217109302414}, {"a": 0, "b": 15, "w": 0.35904714171999164}, {"a": 0, "b": 16, "w": 0.11787892733016736}, {"a": 0, "b": 17, "w": 0.3533464045758604}, {"a": 0, "b": 18, "w": 0.34906823548911425}, {"a": 0, "b": 19, "w": 0.2723139179979751}, {"a": 0, "b": 20, "w": 0.191453612114447}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-1.144,hiY=-0.843;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
