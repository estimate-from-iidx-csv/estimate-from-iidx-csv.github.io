<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Initiation [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.859, "c": "種", "n": "Initiation [H]  n=2332 cos1.00 難-0.86", "s": 0.768, "f": 0}, {"x": 0.99, "y": -1.001, "c": "近傍", "n": "ディスコルディア [H]  n=1571 cos0.99 難-1.00", "s": 0.518, "f": 0}, {"x": 0.988, "y": -0.801, "c": "近傍", "n": "THE F∀UST [H]  n=1849 cos0.99 難-0.80", "s": 0.609, "f": 0}, {"x": 0.985, "y": -1.043, "c": "近傍", "n": "逆月 [H]  n=1688 cos0.99 難-1.04", "s": 0.556, "f": 0}, {"x": 0.983, "y": -0.939, "c": "近傍", "n": "Macuilxochitl [H]  n=2219 cos0.98 難-0.94", "s": 0.731, "f": 0}, {"x": 0.983, "y": -0.907, "c": "近傍", "n": "Painful Fate [H]  n=1813 cos0.98 難-0.91", "s": 0.597, "f": 0}, {"x": 0.986, "y": -1.247, "c": "近傍", "n": "suspicions [H]  n=717 cos0.99 難-1.25", "s": 0.236, "f": 0}, {"x": 0.983, "y": -0.651, "c": "近傍", "n": "Sky High [H]  n=2453 cos0.98 難-0.65", "s": 0.808, "f": 0}, {"x": 0.993, "y": -0.249, "c": "近傍", "n": "Brave Spirits [A]  n=1877 cos0.99 難-0.25", "s": 0.618, "f": 0}, {"x": 0.982, "y": -0.883, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2206 cos0.98 難-0.88", "s": 0.727, "f": 0}, {"x": 0.981, "y": -0.896, "c": "近傍", "n": "Drastic Dramatic [H]  n=1830 cos0.98 難-0.90", "s": 0.603, "f": 0}, {"x": 0.99, "y": -0.265, "c": "近傍", "n": "可愛くてごめん [L]  n=1100 cos0.99 難-0.27", "s": 0.362, "f": 0}, {"x": 0.983, "y": -1.177, "c": "近傍", "n": "Vinculum stellarum [H]  n=1440 cos0.98 難-1.18", "s": 0.474, "f": 0}, {"x": 0.982, "y": -0.551, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2643 cos0.98 難-0.55", "s": 0.871, "f": 0}, {"x": 0.992, "y": -0.177, "c": "近傍", "n": "Several Words [A]  n=3035 cos0.99 難-0.18", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.398, "c": "近傍", "n": "新宝島 [A]  n=2969 cos0.98 難-0.40", "s": 0.978, "f": 0}, {"x": 0.993, "y": -0.156, "c": "近傍", "n": "Nemophila [A]  n=678 cos0.99 難-0.16", "s": 0.223, "f": 0}, {"x": 0.984, "y": -0.362, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2474 cos0.98 難-0.36", "s": 0.815, "f": 0}, {"x": 0.98, "y": -0.656, "c": "近傍", "n": "traces [H]  n=1625 cos0.98 難-0.66", "s": 0.535, "f": 0}, {"x": 0.986, "y": -0.301, "c": "近傍", "n": "L'amour et la liberte [A]  n=737 cos0.99 難-0.30", "s": 0.243, "f": 0}, {"x": 0.98, "y": -0.631, "c": "近傍", "n": "Liberation [H]  n=2359 cos0.98 難-0.63", "s": 0.777, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.453205210962334}, {"a": 0, "b": 2, "w": 0.3782401181586882}, {"a": 0, "b": 3, "w": 0.3354603847794434}, {"a": 0, "b": 4, "w": 0.16046203429721473}, {"a": 0, "b": 5, "w": 0.2913076587209793}, {"a": 0, "b": 6, "w": 0.24354092285229245}, {"a": 0, "b": 7, "w": 0.25851308552485885}, {"a": 0, "b": 8, "w": 0.5301547055147291}, {"a": 0, "b": 9, "w": 0.14663835155102833}, {"a": 0, "b": 10, "w": 0.19516965930373753}, {"a": 0, "b": 11, "w": 0.45757436435492516}, {"a": 0, "b": 12, "w": 0.24671788427194474}, {"a": 0, "b": 13, "w": 0.1132072522737475}, {"a": 0, "b": 14, "w": 0.511469230331127}, {"a": 0, "b": 15, "w": 0.3173133250721559}, {"a": 0, "b": 16, "w": 0.5252510648156128}, {"a": 0, "b": 17, "w": 0.28408365865059093}, {"a": 0, "b": 18, "w": 3.3169356150608564e-11}, {"a": 0, "b": 19, "w": 0.17184122291194526}, {"a": 0, "b": 20, "w": 0.05351652084819236}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-1.334,hiY=-0.069;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
