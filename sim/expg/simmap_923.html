<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Lucky Days [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.11, "c": "種", "n": "Lucky Days [A]  n=2963 cos1.00 難-0.11", "s": 0.863, "f": 0}, {"x": 0.999, "y": -0.007, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2765 cos1.00 難-0.01", "s": 0.805, "f": 0}, {"x": 0.997, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos1.00 難-0.11", "s": 0.944, "f": 0}, {"x": 0.997, "y": -0.133, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3104 cos1.00 難-0.13", "s": 0.904, "f": 0}, {"x": 0.997, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos1.00 難-0.18", "s": 0.814, "f": 0}, {"x": 0.996, "y": -0.103, "c": "近傍", "n": "double thrash [H]  n=2119 cos1.00 難-0.10", "s": 0.617, "f": 0}, {"x": 0.996, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos1.00 難-0.10", "s": 0.925, "f": 0}, {"x": 0.995, "y": -0.088, "c": "近傍", "n": "Freeway Shuffle [A]  n=2923 cos1.00 難-0.09", "s": 0.851, "f": 0}, {"x": 0.997, "y": -0.249, "c": "近傍", "n": "QUANTUM TELEPORTATION [H]  n=2521 cos1.00 難-0.25", "s": 0.734, "f": 0}, {"x": 0.995, "y": -0.054, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2903 cos1.00 難-0.05", "s": 0.845, "f": 0}, {"x": 0.995, "y": -0.089, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2946 cos0.99 難-0.09", "s": 0.858, "f": 0}, {"x": 0.995, "y": -0.12, "c": "近傍", "n": "moon_child [H]  n=2780 cos0.99 難-0.12", "s": 0.809, "f": 0}, {"x": 0.995, "y": -0.071, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3044 cos0.99 難-0.07", "s": 0.886, "f": 0}, {"x": 0.996, "y": 0.027, "c": "近傍", "n": "Don't be afraid myself [A]  n=2810 cos1.00 難0.03", "s": 0.818, "f": 0}, {"x": 0.995, "y": -0.054, "c": "近傍", "n": "Silly Love [A]  n=2733 cos0.99 難-0.05", "s": 0.796, "f": 0}, {"x": 0.995, "y": -0.131, "c": "近傍", "n": "メイメツ、フラグメンツ [A]  n=3202 cos0.99 難-0.13", "s": 0.932, "f": 0}, {"x": 0.994, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos0.99 難-0.11", "s": 0.909, "f": 0}, {"x": 0.994, "y": -0.142, "c": "近傍", "n": "Flash Back 90's [A]  n=3435 cos0.99 難-0.14", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos1.00 難0.01", "s": 0.754, "f": 0}, {"x": 0.996, "y": -0.281, "c": "近傍", "n": "Wonderful Escape [A]  n=2303 cos1.00 難-0.28", "s": 0.67, "f": 0}, {"x": 0.994, "y": -0.154, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1098 cos0.99 難-0.15", "s": 0.32, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.587697257638855}, {"a": 0, "b": 2, "w": 0.3168853419638644}, {"a": 0, "b": 3, "w": 0.33229801391362657}, {"a": 0, "b": 4, "w": 0.2560704289787721}, {"a": 0, "b": 5, "w": 0.2219803837612161}, {"a": 0, "b": 6, "w": 0.22671368486712262}, {"a": 0, "b": 7, "w": 0.061453091661477055}, {"a": 0, "b": 8, "w": 0.3198783130629592}, {"a": 0, "b": 9, "w": 0.14257773690322495}, {"a": 0, "b": 10, "w": 0.11758233873462076}, {"a": 0, "b": 11, "w": 0.14793618150634158}, {"a": 0, "b": 12, "w": 8.151412878021347e-11}, {"a": 0, "b": 13, "w": 0.049148335733888326}, {"a": 0, "b": 14, "w": 0.11326542470849288}, {"a": 0, "b": 15, "w": 0.09791219558353914}, {"a": 0, "b": 16, "w": 0.11366850624588731}, {"a": 0, "b": 17, "w": 0.11285738440727555}, {"a": 0, "b": 18, "w": 0.14699636391009352}, {"a": 0, "b": 19, "w": 0.26341906924445047}, {"a": 0, "b": 20, "w": 0.009469420341790324}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.305,hiY=0.051;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
