<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ruin of opals [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.104, "c": "種", "n": "ruin of opals [H]  n=1544 cos1.00 難-1.10", "s": 0.548, "f": 0}, {"x": 0.994, "y": -1.012, "c": "近傍", "n": "rainbow guitar weeps [H]  n=2231 cos0.99 難-1.01", "s": 0.791, "f": 0}, {"x": 0.991, "y": -1.115, "c": "近傍", "n": "Silver Bullet [H]  n=1434 cos0.99 難-1.11", "s": 0.509, "f": 0}, {"x": 0.992, "y": -0.968, "c": "近傍", "n": "Snakey Kung-fu [H]  n=2499 cos0.99 難-0.97", "s": 0.886, "f": 0}, {"x": 0.991, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos0.99 難-1.02", "s": 0.716, "f": 0}, {"x": 0.991, "y": -0.97, "c": "近傍", "n": "Godspeed [H]  n=2819 cos0.99 難-0.97", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.288, "c": "近傍", "n": "Dr. Chemical & Killing Machine [H]  n=1634 cos0.99 難-1.29", "s": 0.58, "f": 0}, {"x": 0.992, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.99 難-0.92", "s": 0.687, "f": 0}, {"x": 0.996, "y": -0.866, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2022 cos1.00 難-0.87", "s": 0.717, "f": 0}, {"x": 0.992, "y": -1.288, "c": "近傍", "n": "No Border [H]  n=1428 cos0.99 難-1.29", "s": 0.507, "f": 0}, {"x": 0.993, "y": -0.889, "c": "近傍", "n": "dAuntl3ss [H]  n=1992 cos0.99 難-0.89", "s": 0.707, "f": 0}, {"x": 0.992, "y": -1.288, "c": "近傍", "n": "Meissa [H]  n=920 cos0.99 難-1.29", "s": 0.326, "f": 0}, {"x": 0.989, "y": -1.169, "c": "近傍", "n": "-65℃ [H]  n=1549 cos0.99 難-1.17", "s": 0.549, "f": 0}, {"x": 0.99, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.428, "f": 0}, {"x": 0.988, "y": -1.133, "c": "近傍", "n": "destination [H]  n=819 cos0.99 難-1.13", "s": 0.291, "f": 0}, {"x": 0.994, "y": -0.862, "c": "近傍", "n": "Light and Cyber… [H]  n=2221 cos0.99 難-0.86", "s": 0.788, "f": 0}, {"x": 0.991, "y": -1.292, "c": "近傍", "n": "Viridian [H]  n=1564 cos0.99 難-1.29", "s": 0.555, "f": 0}, {"x": 0.989, "y": -0.964, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1963 cos0.99 難-0.96", "s": 0.696, "f": 0}, {"x": 0.988, "y": -1.135, "c": "近傍", "n": "CODE:1 [revision1.0.1] [H]  n=1643 cos0.99 難-1.13", "s": 0.583, "f": 0}, {"x": 0.991, "y": -0.906, "c": "近傍", "n": "Let The Track Flow [H]  n=1745 cos0.99 難-0.91", "s": 0.619, "f": 0}, {"x": 0.993, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.656, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.14173539311043004}, {"a": 0, "b": 2, "w": 0.31224611789461787}, {"a": 0, "b": 3, "w": 0.3350879006100662}, {"a": 0, "b": 4, "w": 0.3280696201778641}, {"a": 0, "b": 5, "w": 0.3659687634375748}, {"a": 0, "b": 6, "w": 0.3653231012173218}, {"a": 0, "b": 7, "w": 0.40515843669037743}, {"a": 0, "b": 8, "w": 0.4247057232440531}, {"a": 0, "b": 9, "w": 0.22067682524799181}, {"a": 0, "b": 10, "w": 0.3024272299735393}, {"a": 0, "b": 11, "w": 0.3100024888568309}, {"a": 0, "b": 12, "w": 0.13809697146600897}, {"a": 0, "b": 13, "w": 0.28611234313220457}, {"a": 0, "b": 14, "w": 0.24062601599522637}, {"a": 0, "b": 15, "w": 0.4493783434767653}, {"a": 0, "b": 16, "w": 0.33087288616624466}, {"a": 0, "b": 17, "w": 0.1281429879941236}, {"a": 0, "b": 18, "w": 4.7474468800601244e-11}, {"a": 0, "b": 19, "w": 0.26162837967183794}, {"a": 0, "b": 20, "w": 0.2894264089574796}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.326,hiY=-0.826;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
