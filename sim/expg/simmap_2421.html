<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Element of SPADA [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.076, "c": "種", "n": "Element of SPADA [L]  n=1859 cos1.00 難0.08", "s": 0.503, "f": 0}, {"x": 0.996, "y": -0.125, "c": "近傍", "n": "オドループ [L]  n=1825 cos1.00 難-0.12", "s": 0.494, "f": 0}, {"x": 0.99, "y": 0.246, "c": "近傍", "n": "怪物 [L]  n=1255 cos0.99 難0.25", "s": 0.339, "f": 0}, {"x": 0.996, "y": 0.368, "c": "近傍", "n": "the trigger of innocence [L]  n=2068 cos1.00 難0.37", "s": 0.559, "f": 0}, {"x": 0.985, "y": -0.04, "c": "近傍", "n": "Shadow World [A]  n=2319 cos0.99 難-0.04", "s": 0.627, "f": 0}, {"x": 0.99, "y": -0.186, "c": "近傍", "n": "Aeterna [A]  n=1751 cos0.99 難-0.19", "s": 0.474, "f": 0}, {"x": 0.983, "y": 0.149, "c": "近傍", "n": "No Tears [A]  n=3588 cos0.98 難0.15", "s": 0.971, "f": 0}, {"x": 0.983, "y": 0.161, "c": "近傍", "n": "バッドエンド・シンドローム [A]  n=2752 cos0.98 難0.16", "s": 0.744, "f": 0}, {"x": 0.984, "y": -0.076, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2764 cos0.98 難-0.08", "s": 0.748, "f": 0}, {"x": 0.982, "y": 0.206, "c": "近傍", "n": "KEY [A]  n=3457 cos0.98 難0.21", "s": 0.935, "f": 0}, {"x": 0.988, "y": -0.248, "c": "近傍", "n": "EDEN [A]  n=3697 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.291, "c": "近傍", "n": "オーバーライド [A]  n=841 cos0.99 難-0.29", "s": 0.227, "f": 0}, {"x": 0.979, "y": 0.079, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [A]  n=1892 cos0.98 難0.08", "s": 0.512, "f": 0}, {"x": 0.984, "y": -0.178, "c": "近傍", "n": "DAYDREAMER [A]  n=3282 cos0.98 難-0.18", "s": 0.888, "f": 0}, {"x": 0.979, "y": 0.032, "c": "近傍", "n": "ハオ [A]  n=1359 cos0.98 難0.03", "s": 0.368, "f": 0}, {"x": 0.979, "y": 0.116, "c": "近傍", "n": "RIZING YOU UP [A]  n=3102 cos0.98 難0.12", "s": 0.839, "f": 0}, {"x": 0.98, "y": -0.059, "c": "近傍", "n": "Technicolour Dreams [A]  n=2350 cos0.98 難-0.06", "s": 0.636, "f": 0}, {"x": 0.98, "y": 0.226, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3405 cos0.98 難0.23", "s": 0.921, "f": 0}, {"x": 0.988, "y": -0.3, "c": "近傍", "n": "Sugarplum [A]  n=2364 cos0.99 難-0.30", "s": 0.639, "f": 0}, {"x": 0.982, "y": 0.327, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3551 cos0.98 難0.33", "s": 0.961, "f": 0}, {"x": 0.978, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.98 難-0.01", "s": 0.642, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5976749776978794}, {"a": 0, "b": 2, "w": 0.22202777813434904}, {"a": 0, "b": 3, "w": 0.541156161160392}, {"a": 0, "b": 4, "w": 0.14981663112734867}, {"a": 0, "b": 5, "w": 0.29286477406236344}, {"a": 0, "b": 6, "w": 0.1065852818207047}, {"a": 0, "b": 7, "w": 0.21797433426539603}, {"a": 0, "b": 8, "w": 0.22838403617734593}, {"a": 0, "b": 9, "w": 0.17804817153122354}, {"a": 0, "b": 10, "w": 0.21060218608832115}, {"a": 0, "b": 11, "w": 0.41821341631246123}, {"a": 0, "b": 12, "w": 0.13014817887083252}, {"a": 0, "b": 13, "w": 0.04177454695823846}, {"a": 0, "b": 14, "w": 0.08977545888071559}, {"a": 0, "b": 15, "w": 0.0945849618452701}, {"a": 0, "b": 16, "w": 3.533262571409068e-11}, {"a": 0, "b": 17, "w": 0.11658151471643696}, {"a": 0, "b": 18, "w": 0.12722256638857476}, {"a": 0, "b": 19, "w": 0.1818046825416585}, {"a": 0, "b": 20, "w": 0.0039631906045175525}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-0.354,hiY=0.422;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
