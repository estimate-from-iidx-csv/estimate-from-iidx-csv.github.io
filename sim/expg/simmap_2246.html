<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ZETA～素数の世界と超越者～ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.892, "c": "種", "n": "ZETA～素数の世界と超越者～ [A]  n=3253 cos1.00 難0.89", "s": 0.907, "f": 0}, {"x": 0.995, "y": 1.155, "c": "近傍", "n": "Lethal Weapon [A]  n=3091 cos0.99 難1.16", "s": 0.862, "f": 0}, {"x": 0.989, "y": 0.701, "c": "近傍", "n": "追想快晴テーマパーク [A]  n=2940 cos0.99 難0.70", "s": 0.82, "f": 0}, {"x": 0.987, "y": 0.849, "c": "近傍", "n": "刃図羅 [A]  n=3585 cos0.99 難0.85", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.746, "c": "近傍", "n": "LIGHTNING STRIKES [A]  n=3319 cos0.99 難0.75", "s": 0.926, "f": 0}, {"x": 0.986, "y": 0.87, "c": "近傍", "n": "Begin [A]  n=996 cos0.99 難0.87", "s": 0.278, "f": 0}, {"x": 0.988, "y": 1.091, "c": "近傍", "n": "Silver Bullet [A]  n=2431 cos0.99 難1.09", "s": 0.678, "f": 0}, {"x": 0.988, "y": 1.102, "c": "近傍", "n": "Nightmare before oversleep [A]  n=3452 cos0.99 難1.10", "s": 0.963, "f": 0}, {"x": 0.986, "y": 0.794, "c": "近傍", "n": "青の洞窟 [A]  n=2348 cos0.99 難0.79", "s": 0.655, "f": 0}, {"x": 0.989, "y": 0.646, "c": "近傍", "n": "Tail Lights [A]  n=2426 cos0.99 難0.65", "s": 0.677, "f": 0}, {"x": 0.99, "y": 0.602, "c": "近傍", "n": "OTOKOZAKA [A]  n=1616 cos0.99 難0.60", "s": 0.451, "f": 0}, {"x": 0.985, "y": 0.875, "c": "近傍", "n": "Parvati [A]  n=2629 cos0.99 難0.87", "s": 0.733, "f": 0}, {"x": 0.988, "y": 0.671, "c": "近傍", "n": "Speculation [A]  n=1814 cos0.99 難0.67", "s": 0.506, "f": 0}, {"x": 0.985, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.99 難0.89", "s": 0.298, "f": 0}, {"x": 0.986, "y": 1.082, "c": "近傍", "n": "oratio [A]  n=3445 cos0.99 難1.08", "s": 0.961, "f": 0}, {"x": 0.986, "y": 1.02, "c": "近傍", "n": "終焔のClaudia [A]  n=1703 cos0.99 難1.02", "s": 0.475, "f": 0}, {"x": 0.991, "y": 0.549, "c": "近傍", "n": "rumrum triplets [A]  n=3300 cos0.99 難0.55", "s": 0.921, "f": 0}, {"x": 0.985, "y": 0.948, "c": "近傍", "n": "SpaceLand☆TOYBOX [A]  n=3550 cos0.98 難0.95", "s": 0.99, "f": 0}, {"x": 0.985, "y": 0.742, "c": "近傍", "n": "Battle Train -IIDX Edition- [A]  n=3102 cos0.99 難0.74", "s": 0.865, "f": 0}, {"x": 0.988, "y": 1.18, "c": "近傍", "n": "L.F.O [A]  n=3203 cos0.99 難1.18", "s": 0.893, "f": 0}, {"x": 0.984, "y": 0.985, "c": "近傍", "n": "Ancient Scapes [A]  n=3546 cos0.98 難0.99", "s": 0.989, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4033281336804463}, {"a": 0, "b": 2, "w": 0.2528111845922292}, {"a": 0, "b": 3, "w": 0.17019170342535717}, {"a": 0, "b": 4, "w": 0.15556771830067917}, {"a": 0, "b": 5, "w": 0.1524880466531061}, {"a": 0, "b": 6, "w": 0.19690442016145937}, {"a": 0, "b": 7, "w": 0.20751969079789323}, {"a": 0, "b": 8, "w": 0.1855834635707715}, {"a": 0, "b": 9, "w": 0.2367099007762622}, {"a": 0, "b": 10, "w": 0.20342298407361858}, {"a": 0, "b": 11, "w": 0.1601913400889723}, {"a": 0, "b": 12, "w": 0.14018446673798968}, {"a": 0, "b": 13, "w": 0.10942122146757771}, {"a": 0, "b": 14, "w": 0.19407439418917227}, {"a": 0, "b": 15, "w": 0.12192340668789003}, {"a": 0, "b": 16, "w": 0.330541439248801}, {"a": 0, "b": 17, "w": 0.12559148109419616}, {"a": 0, "b": 18, "w": 0.15514115754454572}, {"a": 0, "b": 19, "w": 0.1458213779447608}, {"a": 0, "b": 20, "w": 3.762090639014559e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=0.498,hiY=1.230;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
