<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Zirkfied [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.643, "c": "種", "n": "Zirkfied [A]  n=2949 cos1.00 難1.64", "s": 0.871, "f": 0}, {"x": 0.984, "y": 1.602, "c": "近傍", "n": "reunion [A]  n=3385 cos0.98 難1.60", "s": 1.0, "f": 0}, {"x": 0.982, "y": 1.466, "c": "近傍", "n": "Devilz Staircase [A]  n=3171 cos0.98 難1.47", "s": 0.937, "f": 0}, {"x": 0.979, "y": 1.619, "c": "近傍", "n": "BLACK or WHITE? [A]  n=2316 cos0.98 難1.62", "s": 0.684, "f": 0}, {"x": 0.984, "y": 1.919, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2214 cos0.98 難1.92", "s": 0.654, "f": 0}, {"x": 0.979, "y": 1.868, "c": "近傍", "n": "Binary Black Hole [A]  n=1874 cos0.98 難1.87", "s": 0.554, "f": 0}, {"x": 0.975, "y": 1.684, "c": "近傍", "n": "金野火織の金色提言 [A]  n=2860 cos0.97 難1.68", "s": 0.845, "f": 0}, {"x": 0.975, "y": 1.509, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3216 cos0.98 難1.51", "s": 0.95, "f": 0}, {"x": 0.975, "y": 1.779, "c": "近傍", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [A]  n=2591 cos0.98 難1.78", "s": 0.765, "f": 0}, {"x": 0.973, "y": 1.686, "c": "近傍", "n": "∀ [A]  n=2448 cos0.97 難1.69", "s": 0.723, "f": 0}, {"x": 0.981, "y": 1.297, "c": "近傍", "n": "Arabian Rave Night [L]  n=2499 cos0.98 難1.30", "s": 0.738, "f": 0}, {"x": 0.973, "y": 1.684, "c": "近傍", "n": "255 [A]  n=3006 cos0.97 難1.68", "s": 0.888, "f": 0}, {"x": 0.978, "y": 1.33, "c": "近傍", "n": "Konzert V [A]  n=3321 cos0.98 難1.33", "s": 0.981, "f": 0}, {"x": 0.975, "y": 1.885, "c": "近傍", "n": "煉獄のエルフェリア [A]  n=2967 cos0.97 難1.89", "s": 0.877, "f": 0}, {"x": 0.971, "y": 1.61, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2470 cos0.97 難1.61", "s": 0.73, "f": 0}, {"x": 0.971, "y": 1.724, "c": "近傍", "n": "君のハートにロックオン [L]  n=1864 cos0.97 難1.72", "s": 0.551, "f": 0}, {"x": 0.974, "y": 1.852, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [A]  n=2333 cos0.97 難1.85", "s": 0.689, "f": 0}, {"x": 0.973, "y": 1.439, "c": "近傍", "n": "Monopole. [A]  n=3172 cos0.97 難1.44", "s": 0.937, "f": 0}, {"x": 0.971, "y": 1.522, "c": "近傍", "n": "Despair of ELFERIA [A]  n=3170 cos0.97 難1.52", "s": 0.936, "f": 0}, {"x": 0.977, "y": 1.98, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1161 cos0.98 難1.98", "s": 0.343, "f": 0}, {"x": 0.97, "y": 1.783, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1868 cos0.97 難1.78", "s": 0.552, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.29759236453718807}, {"a": 0, "b": 2, "w": 0.37598779057679677}, {"a": 0, "b": 3, "w": 0.34464633342969697}, {"a": 0, "b": 4, "w": 0.3341212493016289}, {"a": 0, "b": 5, "w": 0.3414580277288016}, {"a": 0, "b": 6, "w": 0.04402994897200696}, {"a": 0, "b": 7, "w": 0.13193832840489883}, {"a": 0, "b": 8, "w": 0.2990716931690194}, {"a": 0, "b": 9, "w": 0.18788355048647898}, {"a": 0, "b": 10, "w": 0.25152341418844437}, {"a": 0, "b": 11, "w": 0.1695894962402611}, {"a": 0, "b": 12, "w": 0.1362140952827524}, {"a": 0, "b": 13, "w": 0.2608586956701501}, {"a": 0, "b": 14, "w": 0.15672659379495235}, {"a": 0, "b": 15, "w": 1.7255974427143883e-11}, {"a": 0, "b": 16, "w": 0.2656391479333333}, {"a": 0, "b": 17, "w": 0.07926782881911831}, {"a": 0, "b": 18, "w": 0.22171572151567698}, {"a": 0, "b": 19, "w": 0.3244174006948126}, {"a": 0, "b": 20, "w": 0.20562576351778183}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.967,hiX=1.002,loY=1.242,hiY=2.034;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
