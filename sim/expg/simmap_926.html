<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Macho Gang [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.233, "c": "種", "n": "Macho Gang [A]  n=3030 cos1.00 難0.23", "s": 0.943, "f": 0}, {"x": 0.988, "y": 0.048, "c": "近傍", "n": "Feedback [A]  n=2741 cos0.99 難0.05", "s": 0.853, "f": 0}, {"x": 0.989, "y": -0.063, "c": "近傍", "n": "Music is The Answer [A]  n=3019 cos0.99 難-0.06", "s": 0.94, "f": 0}, {"x": 0.989, "y": -0.066, "c": "近傍", "n": "Do it!! Do it!! [H]  n=2808 cos0.99 難-0.07", "s": 0.874, "f": 0}, {"x": 0.987, "y": -0.007, "c": "近傍", "n": "Catch Me [A]  n=2855 cos0.99 難-0.01", "s": 0.889, "f": 0}, {"x": 0.984, "y": 0.309, "c": "近傍", "n": "250bpm [A]  n=2652 cos0.98 難0.31", "s": 0.825, "f": 0}, {"x": 0.992, "y": -0.213, "c": "近傍", "n": "abstract [A]  n=2273 cos0.99 難-0.21", "s": 0.707, "f": 0}, {"x": 0.985, "y": 0.49, "c": "近傍", "n": "RISLIM -Remix- [A]  n=3211 cos0.99 難0.49", "s": 0.999, "f": 0}, {"x": 0.984, "y": 0.076, "c": "近傍", "n": "MUSIC TO YOUR HEAD [A]  n=2371 cos0.98 難0.08", "s": 0.738, "f": 0}, {"x": 0.987, "y": -0.121, "c": "近傍", "n": "グラナダの風 [A]  n=2828 cos0.99 難-0.12", "s": 0.88, "f": 0}, {"x": 0.984, "y": -0.01, "c": "近傍", "n": "Regulus [A]  n=2454 cos0.98 難-0.01", "s": 0.764, "f": 0}, {"x": 0.986, "y": -0.133, "c": "近傍", "n": "route 80s [A]  n=2371 cos0.99 難-0.13", "s": 0.738, "f": 0}, {"x": 0.983, "y": -0.007, "c": "近傍", "n": "Karma [A]  n=2666 cos0.98 難-0.01", "s": 0.83, "f": 0}, {"x": 0.99, "y": -0.275, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2240 cos0.99 難-0.27", "s": 0.697, "f": 0}, {"x": 0.984, "y": -0.13, "c": "近傍", "n": "Buffalo [A]  n=2617 cos0.98 難-0.13", "s": 0.815, "f": 0}, {"x": 0.988, "y": -0.252, "c": "近傍", "n": "Cheer Train [A]  n=2411 cos0.99 難-0.25", "s": 0.75, "f": 0}, {"x": 0.987, "y": -0.249, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2707 cos0.99 難-0.25", "s": 0.843, "f": 0}, {"x": 0.988, "y": -0.275, "c": "近傍", "n": "SCREAM SQUAD [H]  n=2625 cos0.99 難-0.27", "s": 0.817, "f": 0}, {"x": 0.983, "y": -0.12, "c": "近傍", "n": "Freezing atmosphere [A]  n=2163 cos0.98 難-0.12", "s": 0.673, "f": 0}, {"x": 0.983, "y": -0.134, "c": "近傍", "n": "In The Breeze [A]  n=2524 cos0.98 難-0.13", "s": 0.786, "f": 0}, {"x": 0.981, "y": 0.511, "c": "近傍", "n": "100％ minimoo-G [A]  n=3213 cos0.98 難0.51", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2743381734570868}, {"a": 0, "b": 2, "w": 0.35949585323215383}, {"a": 0, "b": 3, "w": 0.2380479946525632}, {"a": 0, "b": 4, "w": 0.29651926005656193}, {"a": 0, "b": 5, "w": 0.20329828896892121}, {"a": 0, "b": 6, "w": 0.41688558091803196}, {"a": 0, "b": 7, "w": 0.15199363446661962}, {"a": 0, "b": 8, "w": 0.20907787589840465}, {"a": 0, "b": 9, "w": 0.28976648293461127}, {"a": 0, "b": 10, "w": 0.2137548929979428}, {"a": 0, "b": 11, "w": 0.27297960754964967}, {"a": 0, "b": 12, "w": 0.19300959900830095}, {"a": 0, "b": 13, "w": 0.38136656040170225}, {"a": 0, "b": 14, "w": 0.21487269001281606}, {"a": 0, "b": 15, "w": 0.30089722130486063}, {"a": 0, "b": 16, "w": 0.2412624978111163}, {"a": 0, "b": 17, "w": 0.31403515887084754}, {"a": 0, "b": 18, "w": 0.17692749930537854}, {"a": 0, "b": 19, "w": 0.19997866862004154}, {"a": 0, "b": 20, "w": 4.4743209137720896e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=-0.337,hiY=0.574;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
