<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Colorful Cookie [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.336, "c": "種", "n": "Colorful Cookie [H]  n=3671 cos1.00 難-0.34", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.257, "c": "近傍", "n": "CROSSROAD ～Left Story～ [A]  n=3625 cos1.00 難-0.26", "s": 0.987, "f": 0}, {"x": 0.996, "y": -0.301, "c": "近傍", "n": "Drive Me Crazy [A]  n=3469 cos1.00 難-0.30", "s": 0.945, "f": 0}, {"x": 0.995, "y": -0.399, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2090 cos1.00 難-0.40", "s": 0.569, "f": 0}, {"x": 0.994, "y": -0.292, "c": "近傍", "n": "零 - ZERO - [A]  n=3027 cos0.99 難-0.29", "s": 0.825, "f": 0}, {"x": 0.994, "y": -0.25, "c": "近傍", "n": "Claiomh Solais [A]  n=2509 cos0.99 難-0.25", "s": 0.683, "f": 0}, {"x": 0.993, "y": -0.305, "c": "近傍", "n": "Hurry Hurry [A]  n=2875 cos0.99 難-0.31", "s": 0.783, "f": 0}, {"x": 0.994, "y": -0.447, "c": "近傍", "n": "怪物 [A]  n=2747 cos0.99 難-0.45", "s": 0.748, "f": 0}, {"x": 0.996, "y": -0.547, "c": "近傍", "n": "おとせサンダー [A]  n=1961 cos1.00 難-0.55", "s": 0.534, "f": 0}, {"x": 0.993, "y": -0.252, "c": "近傍", "n": "FERMI PARADOX [A]  n=1455 cos0.99 難-0.25", "s": 0.396, "f": 0}, {"x": 0.992, "y": -0.307, "c": "近傍", "n": "toy boxer [A]  n=2752 cos0.99 難-0.31", "s": 0.75, "f": 0}, {"x": 0.993, "y": -0.23, "c": "近傍", "n": "Lycoris [A]  n=1029 cos0.99 難-0.23", "s": 0.28, "f": 0}, {"x": 0.992, "y": -0.337, "c": "近傍", "n": "ちゅ、多様性。 [L]  n=1115 cos0.99 難-0.34", "s": 0.304, "f": 0}, {"x": 0.993, "y": -0.186, "c": "近傍", "n": "突撃!ガラスのニーソ姫! [A]  n=3523 cos0.99 難-0.19", "s": 0.96, "f": 0}, {"x": 0.994, "y": -0.531, "c": "近傍", "n": "Skywalking [A]  n=615 cos0.99 難-0.53", "s": 0.168, "f": 0}, {"x": 0.992, "y": -0.345, "c": "近傍", "n": "mosaic [H]  n=3505 cos0.99 難-0.35", "s": 0.955, "f": 0}, {"x": 0.996, "y": -0.085, "c": "近傍", "n": "The Commanders [A]  n=3337 cos1.00 難-0.09", "s": 0.909, "f": 0}, {"x": 0.992, "y": -0.333, "c": "近傍", "n": "GET UP AGAIN [A]  n=1998 cos0.99 難-0.33", "s": 0.544, "f": 0}, {"x": 0.992, "y": -0.309, "c": "近傍", "n": "月と夢の跡 ft. マナ [A]  n=2117 cos0.99 難-0.31", "s": 0.577, "f": 0}, {"x": 0.992, "y": -0.38, "c": "近傍", "n": "ゲシュタルト [A]  n=1492 cos0.99 難-0.38", "s": 0.406, "f": 0}, {"x": 0.995, "y": -0.103, "c": "近傍", "n": "Believe in you [A]  n=3058 cos0.99 難-0.10", "s": 0.833, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6592729114764262}, {"a": 0, "b": 2, "w": 0.48154184164311453}, {"a": 0, "b": 3, "w": 0.4499424681241734}, {"a": 0, "b": 4, "w": 0.415897813940987}, {"a": 0, "b": 5, "w": 0.3220684167183723}, {"a": 0, "b": 6, "w": 0.31743794813697823}, {"a": 0, "b": 7, "w": 0.3664253298990493}, {"a": 0, "b": 8, "w": 0.4868141964174667}, {"a": 0, "b": 9, "w": 5.6391558089785576e-11}, {"a": 0, "b": 10, "w": 0.3178263561515291}, {"a": 0, "b": 11, "w": 0.23769276273741824}, {"a": 0, "b": 12, "w": 0.28574607361632864}, {"a": 0, "b": 13, "w": 0.17926032078088205}, {"a": 0, "b": 14, "w": 0.303614322018934}, {"a": 0, "b": 15, "w": 0.2781858578337941}, {"a": 0, "b": 16, "w": 0.46203743545896714}, {"a": 0, "b": 17, "w": 0.17026766979772312}, {"a": 0, "b": 18, "w": 0.21684760111146506}, {"a": 0, "b": 19, "w": 0.2844773748403754}, {"a": 0, "b": 20, "w": 0.3957160225728915}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.584,hiY=-0.048;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
