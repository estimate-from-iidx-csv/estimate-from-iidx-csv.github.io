<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Queen Kaguya [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.907, "c": "種", "n": "Queen Kaguya [H]  n=924 cos1.00 難-1.91", "s": 0.623, "f": 0}, {"x": 0.993, "y": -1.894, "c": "近傍", "n": "Pout [H]  n=600 cos0.99 難-1.89", "s": 0.404, "f": 0}, {"x": 0.986, "y": -1.888, "c": "近傍", "n": "Seraph [H]  n=595 cos0.99 難-1.89", "s": 0.401, "f": 0}, {"x": 0.985, "y": -1.716, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [H]  n=1150 cos0.99 難-1.72", "s": 0.775, "f": 0}, {"x": 0.984, "y": -2.076, "c": "近傍", "n": "眠りの国のステラ [H]  n=696 cos0.98 難-2.08", "s": 0.469, "f": 0}, {"x": 0.991, "y": -1.411, "c": "近傍", "n": "DIVINE JUDGEMENT [H]  n=621 cos0.99 難-1.41", "s": 0.418, "f": 0}, {"x": 0.987, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.718, "f": 0}, {"x": 0.982, "y": -1.87, "c": "近傍", "n": "Break Stasis [H]  n=1189 cos0.98 難-1.87", "s": 0.801, "f": 0}, {"x": 0.982, "y": -1.882, "c": "近傍", "n": "Speculation [H]  n=529 cos0.98 難-1.88", "s": 0.356, "f": 0}, {"x": 0.982, "y": -1.83, "c": "近傍", "n": "Afterimage d'automne [H]  n=931 cos0.98 難-1.83", "s": 0.627, "f": 0}, {"x": 0.987, "y": -1.458, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1474 cos0.99 難-1.46", "s": 0.993, "f": 0}, {"x": 0.986, "y": -1.447, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=534 cos0.99 難-1.45", "s": 0.36, "f": 0}, {"x": 0.996, "y": -1.207, "c": "近傍", "n": "Megalara Garuda [H]  n=1484 cos1.00 難-1.21", "s": 1.0, "f": 0}, {"x": 0.979, "y": -1.747, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1156 cos0.98 難-1.75", "s": 0.779, "f": 0}, {"x": 0.978, "y": -1.928, "c": "近傍", "n": "オールトの雲 [H]  n=825 cos0.98 難-1.93", "s": 0.556, "f": 0}, {"x": 0.978, "y": -1.731, "c": "近傍", "n": "Rubrum Piano [H]  n=657 cos0.98 難-1.73", "s": 0.443, "f": 0}, {"x": 0.977, "y": -1.872, "c": "近傍", "n": "Garuda [H]  n=879 cos0.98 難-1.87", "s": 0.592, "f": 0}, {"x": 0.977, "y": -1.885, "c": "近傍", "n": "Ritual of Anubis [H]  n=624 cos0.98 難-1.89", "s": 0.42, "f": 0}, {"x": 0.976, "y": -1.897, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [H]  n=956 cos0.98 難-1.90", "s": 0.644, "f": 0}, {"x": 0.99, "y": -1.17, "c": "近傍", "n": "Binary Black Hole [H]  n=1332 cos0.99 難-1.17", "s": 0.898, "f": 0}, {"x": 0.976, "y": -1.891, "c": "近傍", "n": "メズマライザー [H]  n=596 cos0.98 難-1.89", "s": 0.402, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.42563351744505973}, {"a": 0, "b": 2, "w": 0.25041170828181647}, {"a": 0, "b": 3, "w": 0.29668999461110024}, {"a": 0, "b": 4, "w": 0.21120285195712274}, {"a": 0, "b": 5, "w": 0.37329018755368204}, {"a": 0, "b": 6, "w": 0.2785292904294637}, {"a": 0, "b": 7, "w": 0.17584058321630236}, {"a": 0, "b": 8, "w": 0.1277898564958878}, {"a": 0, "b": 9, "w": 0.1697644841449909}, {"a": 0, "b": 10, "w": 0.3605187250702948}, {"a": 0, "b": 11, "w": 0.24270837462841388}, {"a": 0, "b": 12, "w": 0.6289130534998928}, {"a": 0, "b": 13, "w": 0.17658024779213466}, {"a": 0, "b": 14, "w": 0.11483538633790846}, {"a": 0, "b": 15, "w": 0.1073041609163976}, {"a": 0, "b": 16, "w": 0.007395937163651722}, {"a": 0, "b": 17, "w": 0.10269331423700667}, {"a": 0, "b": 18, "w": 0.05765781046452434}, {"a": 0, "b": 19, "w": 0.4227947709623814}, {"a": 0, "b": 20, "w": 4.139144582637755e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=-2.149,hiY=-1.098;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
