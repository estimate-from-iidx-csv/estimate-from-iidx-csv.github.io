<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BabeL ～Grand Story～ [H] 近傍マップ</h2>
 <div id="legend"></div>

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.906, "c": "種", "n": "BabeL ～Grand Story～ [H]  n=2100 cos1.00 難-0.91", "s": 0.735, "f": 0}, {"x": 0.994, "y": -0.824, "c": "近傍", "n": "GO OVER WITH GLARE -ROOTAGE 26- [H]  n=1687 cos0.99 難-0.82", "s": 0.59, "f": 0}, {"x": 0.991, "y": -0.864, "c": "近傍", "n": "Make A Difference [H]  n=1364 cos0.99 難-0.86", "s": 0.477, "f": 0}, {"x": 0.993, "y": -1.169, "c": "近傍", "n": "Dans la nuit de l'eternite [H]  n=1505 cos0.99 難-1.17", "s": 0.527, "f": 0}, {"x": 0.99, "y": -0.976, "c": "近傍", "n": "Antigravity [H]  n=2031 cos0.99 難-0.98", "s": 0.711, "f": 0}, {"x": 0.99, "y": -0.897, "c": "近傍", "n": "Tizona d'El Cid [H]  n=1600 cos0.99 難-0.90", "s": 0.56, "f": 0}, {"x": 0.99, "y": -0.953, "c": "近傍", "n": "Empire of Fury [H]  n=1651 cos0.99 難-0.95", "s": 0.578, "f": 0}, {"x": 0.992, "y": -0.586, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1931 cos0.99 難-0.59", "s": 0.676, "f": 0}, {"x": 0.993, "y": -0.559, "c": "近傍", "n": "ギャ・ギャ・ギャ・ギャラクシー！ [A]  n=1116 cos0.99 難-0.56", "s": 0.391, "f": 0}, {"x": 0.989, "y": -1.021, "c": "近傍", "n": "XHRONOXAPSULΞ [H]  n=512 cos0.99 難-1.02", "s": 0.179, "f": 0}, {"x": 0.99, "y": -1.093, "c": "近傍", "n": "Raspberry Railgun [H]  n=1991 cos0.99 難-1.09", "s": 0.697, "f": 0}, {"x": 0.989, "y": -1.0, "c": "近傍", "n": "HYPE THE CORE [H]  n=1566 cos0.99 難-1.00", "s": 0.548, "f": 0}, {"x": 0.993, "y": -0.544, "c": "近傍", "n": "Everlasting Message [H]  n=2004 cos0.99 難-0.54", "s": 0.701, "f": 0}, {"x": 0.992, "y": -0.571, "c": "近傍", "n": "アタシ完全絶対正義ちゃん！ [A]  n=1759 cos0.99 難-0.57", "s": 0.616, "f": 0}, {"x": 0.988, "y": -0.913, "c": "近傍", "n": "Triple Counter [H]  n=2857 cos0.99 難-0.91", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.883, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2206 cos0.99 難-0.88", "s": 0.772, "f": 0}, {"x": 0.988, "y": -0.899, "c": "近傍", "n": "ヒマワリ [H]  n=2137 cos0.99 難-0.90", "s": 0.748, "f": 0}, {"x": 0.991, "y": -0.534, "c": "近傍", "n": "ミラージュ・レジデンス [H]  n=1771 cos0.99 難-0.53", "s": 0.62, "f": 0}, {"x": 0.99, "y": -1.249, "c": "近傍", "n": "rommmo [H]  n=1023 cos0.99 難-1.25", "s": 0.358, "f": 0}, {"x": 0.988, "y": -1.018, "c": "近傍", "n": "Venom [H]  n=1704 cos0.99 難-1.02", "s": 0.596, "f": 0}, {"x": 0.991, "y": -0.546, "c": "近傍", "n": "So What [A]  n=983 cos0.99 難-0.55", "s": 0.344, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35263045613257227}, {"a": 0, "b": 2, "w": 0.12865638685405056}, {"a": 0, "b": 3, "w": 0.3069406499947879}, {"a": 0, "b": 4, "w": 0.18262052780890659}, {"a": 0, "b": 5, "w": 0.1303159705291136}, {"a": 0, "b": 6, "w": 0.178975765204906}, {"a": 0, "b": 7, "w": 0.21831146899938259}, {"a": 0, "b": 8, "w": 0.28072251112236246}, {"a": 0, "b": 9, "w": 0.0034760217445221064}, {"a": 0, "b": 10, "w": 0.17096039752402614}, {"a": 0, "b": 11, "w": 0.12516992533459026}, {"a": 0, "b": 12, "w": 0.021053758762203167}, {"a": 0, "b": 13, "w": 0.2025408735027867}, {"a": 0, "b": 14, "w": 0.008167686611037728}, {"a": 0, "b": 15, "w": 0.10306065027986577}, {"a": 0, "b": 16, "w": 5.833833416346579e-11}, {"a": 0, "b": 17, "w": 0.20469604741305591}, {"a": 0, "b": 18, "w": 0.04505203102389488}, {"a": 0, "b": 19, "w": 0.09463907213190337}, {"a": 0, "b": 20, "w": 0.2165603876393647}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.306,hiY=-0.477;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
