<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">dual control [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.132, "c": "種", "n": "dual control [A]  n=2199 cos1.00 難-0.13", "s": 0.666, "f": 0}, {"x": 0.995, "y": -0.267, "c": "近傍", "n": "Bad Maniacs [H]  n=3255 cos0.99 難-0.27", "s": 0.986, "f": 0}, {"x": 0.991, "y": -0.184, "c": "近傍", "n": "TRANOID [H]  n=2310 cos0.99 難-0.18", "s": 0.7, "f": 0}, {"x": 0.989, "y": -0.133, "c": "近傍", "n": "four pieces of heaven [H]  n=2616 cos0.99 難-0.13", "s": 0.792, "f": 0}, {"x": 0.992, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.987, "f": 0}, {"x": 0.987, "y": -0.177, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3105 cos0.99 難-0.18", "s": 0.94, "f": 0}, {"x": 0.988, "y": -0.249, "c": "近傍", "n": "Silvia Drive [A]  n=2192 cos0.99 難-0.25", "s": 0.664, "f": 0}, {"x": 0.988, "y": -0.019, "c": "近傍", "n": "Tori-no-kimochi [A]  n=2829 cos0.99 難-0.02", "s": 0.857, "f": 0}, {"x": 0.988, "y": -0.239, "c": "近傍", "n": "Devil's Gear [H]  n=2603 cos0.99 難-0.24", "s": 0.788, "f": 0}, {"x": 0.986, "y": -0.135, "c": "近傍", "n": "Re:GENERATION [A]  n=3302 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.989, "y": -0.325, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3121 cos0.99 難-0.32", "s": 0.945, "f": 0}, {"x": 0.986, "y": -0.04, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3075 cos0.99 難-0.04", "s": 0.931, "f": 0}, {"x": 0.986, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos0.99 難-0.12", "s": 0.922, "f": 0}, {"x": 0.986, "y": -0.094, "c": "近傍", "n": "少年A [H]  n=2693 cos0.99 難-0.09", "s": 0.816, "f": 0}, {"x": 0.987, "y": -0.298, "c": "近傍", "n": "A [H]  n=3013 cos0.99 難-0.30", "s": 0.912, "f": 0}, {"x": 0.985, "y": -0.097, "c": "近傍", "n": "RISE [A]  n=3102 cos0.98 難-0.10", "s": 0.939, "f": 0}, {"x": 0.993, "y": -0.432, "c": "近傍", "n": "Special One [A]  n=2858 cos0.99 難-0.43", "s": 0.866, "f": 0}, {"x": 0.985, "y": -0.226, "c": "近傍", "n": "LOVE B.B.B [A]  n=3195 cos0.98 難-0.23", "s": 0.968, "f": 0}, {"x": 0.984, "y": -0.087, "c": "近傍", "n": "Golden Horn [A]  n=1922 cos0.98 難-0.09", "s": 0.582, "f": 0}, {"x": 0.985, "y": -0.251, "c": "近傍", "n": "STULTI [H]  n=2663 cos0.98 難-0.25", "s": 0.806, "f": 0}, {"x": 0.984, "y": -0.249, "c": "近傍", "n": "Don't let it go [A]  n=1276 cos0.98 難-0.25", "s": 0.386, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5431396253050628}, {"a": 0, "b": 2, "w": 0.41169301790795976}, {"a": 0, "b": 3, "w": 0.3044249083390951}, {"a": 0, "b": 4, "w": 0.43311390403547423}, {"a": 0, "b": 5, "w": 0.23880897353247188}, {"a": 0, "b": 6, "w": 0.3046941637353301}, {"a": 0, "b": 7, "w": 0.31621226825299587}, {"a": 0, "b": 8, "w": 0.2951064470376459}, {"a": 0, "b": 9, "w": 0.2715995819517215}, {"a": 0, "b": 10, "w": 0.35608287958109086}, {"a": 0, "b": 11, "w": 0.22459120681349898}, {"a": 0, "b": 12, "w": 0.223088285337524}, {"a": 0, "b": 13, "w": 0.25363262546421317}, {"a": 0, "b": 14, "w": 0.24103553114076615}, {"a": 0, "b": 15, "w": 0.22860045997242162}, {"a": 0, "b": 16, "w": 0.45928794146353913}, {"a": 0, "b": 17, "w": 0.1832752194039612}, {"a": 0, "b": 18, "w": 4.200717551583466e-11}, {"a": 0, "b": 19, "w": 0.20229306406385794}, {"a": 0, "b": 20, "w": 0.13790608338943122}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-0.465,hiY=0.015;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
