<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">無意識のフィロソフィア [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.114, "c": "種", "n": "無意識のフィロソフィア [A]  n=2447 cos1.00 難0.11", "s": 0.665, "f": 0}, {"x": 0.997, "y": 0.134, "c": "近傍", "n": "V2 [H]  n=3342 cos1.00 難0.13", "s": 0.908, "f": 0}, {"x": 0.996, "y": 0.028, "c": "近傍", "n": "Danza Aestas [A]  n=2307 cos1.00 難0.03", "s": 0.627, "f": 0}, {"x": 0.995, "y": 0.11, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3164 cos0.99 難0.11", "s": 0.86, "f": 0}, {"x": 0.995, "y": 0.158, "c": "近傍", "n": "STRAIGHT TO THE STARS [A]  n=1759 cos0.99 難0.16", "s": 0.478, "f": 0}, {"x": 0.994, "y": 0.085, "c": "近傍", "n": "X-ray binary [A]  n=2517 cos0.99 難0.08", "s": 0.684, "f": 0}, {"x": 0.994, "y": 0.195, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1814 cos0.99 難0.19", "s": 0.493, "f": 0}, {"x": 0.995, "y": 0.012, "c": "近傍", "n": "PILGRIM [A]  n=1295 cos0.99 難0.01", "s": 0.352, "f": 0}, {"x": 0.994, "y": 0.033, "c": "近傍", "n": "Nothing but Theory [A]  n=3622 cos0.99 難0.03", "s": 0.985, "f": 0}, {"x": 0.993, "y": 0.074, "c": "近傍", "n": "Plea Per Phase [A]  n=1027 cos0.99 難0.07", "s": 0.279, "f": 0}, {"x": 0.995, "y": 0.254, "c": "近傍", "n": "龍王の霊廟(Mausoleum Of The Primal Dragon) [A]  n=3379 cos0.99 難0.25", "s": 0.918, "f": 0}, {"x": 0.993, "y": 0.154, "c": "近傍", "n": "ミッドナイト堕天使 [A]  n=3395 cos0.99 難0.15", "s": 0.923, "f": 0}, {"x": 0.996, "y": 0.283, "c": "近傍", "n": "Synergy For Angels [A]  n=3484 cos1.00 難0.28", "s": 0.947, "f": 0}, {"x": 0.992, "y": 0.103, "c": "近傍", "n": "Ambush Ace [A]  n=1732 cos0.99 難0.10", "s": 0.471, "f": 0}, {"x": 0.994, "y": -0.015, "c": "近傍", "n": "アイドル [L]  n=1431 cos0.99 難-0.02", "s": 0.389, "f": 0}, {"x": 0.995, "y": 0.285, "c": "近傍", "n": "龍と少女とデコヒーレンス [A]  n=3666 cos0.99 難0.28", "s": 0.996, "f": 0}, {"x": 0.991, "y": 0.089, "c": "近傍", "n": "仮想空間の旅人たち [A]  n=3679 cos0.99 難0.09", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.286, "c": "近傍", "n": "XANADU OF TWO [L]  n=731 cos0.99 難0.29", "s": 0.199, "f": 0}, {"x": 0.993, "y": 0.265, "c": "近傍", "n": "Time To Empress [L]  n=632 cos0.99 難0.27", "s": 0.172, "f": 0}, {"x": 0.991, "y": 0.107, "c": "近傍", "n": "夢縁 [A]  n=1904 cos0.99 難0.11", "s": 0.518, "f": 0}, {"x": 0.993, "y": -0.037, "c": "近傍", "n": "crew [A]  n=3598 cos0.99 難-0.04", "s": 0.978, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48713679662632536}, {"a": 0, "b": 2, "w": 0.21952040532315364}, {"a": 0, "b": 3, "w": 0.2497651311054946}, {"a": 0, "b": 4, "w": 0.3648781189188388}, {"a": 0, "b": 5, "w": 0.23335407987215062}, {"a": 0, "b": 6, "w": 0.3377699723172394}, {"a": 0, "b": 7, "w": 0.1156299918848156}, {"a": 0, "b": 8, "w": 0.24595476689191353}, {"a": 0, "b": 9, "w": 0.16998425966424857}, {"a": 0, "b": 10, "w": 0.32311896249789607}, {"a": 0, "b": 11, "w": 0.11009276462617923}, {"a": 0, "b": 12, "w": 0.27207382304960537}, {"a": 0, "b": 13, "w": 0.21716489011380546}, {"a": 0, "b": 14, "w": 0.2758488121397903}, {"a": 0, "b": 15, "w": 0.35524801335822653}, {"a": 0, "b": 16, "w": 4.995159841314489e-11}, {"a": 0, "b": 17, "w": 0.16164129857965648}, {"a": 0, "b": 18, "w": 0.20412287283589925}, {"a": 0, "b": 19, "w": 0.14335371744148817}, {"a": 0, "b": 20, "w": 0.23770606461227028}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.063,hiY=0.312;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
