<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>

const D=[{"x": 1.0, "y": -0.177, "c": "種", "n": "SAMSARA [A]  n=3299 cos1.00 難-0.18", "s": 0.886, "f": 0}, {"x": 0.994, "y": -0.211, "c": "近傍", "n": "ACT [A]  n=2298 cos0.99 難-0.21", "s": 0.617, "f": 0}, {"x": 0.992, "y": -0.159, "c": "近傍", "n": "Magical [A]  n=3220 cos0.99 難-0.16", "s": 0.865, "f": 0}, {"x": 0.992, "y": -0.272, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2643 cos0.99 難-0.27", "s": 0.71, "f": 0}, {"x": 0.993, "y": -0.329, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [A]  n=3561 cos0.99 難-0.33", "s": 0.957, "f": 0}, {"x": 0.992, "y": -0.297, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2658 cos0.99 難-0.30", "s": 0.714, "f": 0}, {"x": 0.99, "y": -0.285, "c": "近傍", "n": "FIRE FIRE [H]  n=3342 cos0.99 難-0.29", "s": 0.898, "f": 0}, {"x": 0.991, "y": -0.302, "c": "近傍", "n": "I know You know [A]  n=2734 cos0.99 難-0.30", "s": 0.735, "f": 0}, {"x": 0.991, "y": -0.306, "c": "近傍", "n": "ナイトシティー・アヴァンチュール [A]  n=2751 cos0.99 難-0.31", "s": 0.739, "f": 0}, {"x": 0.99, "y": -0.274, "c": "近傍", "n": "Selfish Sweet [A]  n=2780 cos0.99 難-0.27", "s": 0.747, "f": 0}, {"x": 0.99, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos0.99 難-0.34", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.335, "c": "近傍", "n": "BRAINSTORM [H]  n=2553 cos0.99 難-0.33", "s": 0.686, "f": 0}, {"x": 0.993, "y": -0.464, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2859 cos0.99 難-0.46", "s": 0.768, "f": 0}, {"x": 0.987, "y": -0.19, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2938 cos0.99 難-0.19", "s": 0.789, "f": 0}, {"x": 0.987, "y": -0.29, "c": "近傍", "n": "シンデレラ [A]  n=1867 cos0.99 難-0.29", "s": 0.502, "f": 0}, {"x": 0.987, "y": -0.335, "c": "近傍", "n": "Time to Air [H]  n=3128 cos0.99 難-0.33", "s": 0.84, "f": 0}, {"x": 0.987, "y": -0.333, "c": "近傍", "n": "Sugar Drippin' [A]  n=2159 cos0.99 難-0.33", "s": 0.58, "f": 0}, {"x": 0.986, "y": -0.125, "c": "近傍", "n": "ヒマワリ [A]  n=3294 cos0.99 難-0.12", "s": 0.885, "f": 0}, {"x": 0.986, "y": -0.298, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2796 cos0.99 難-0.30", "s": 0.751, "f": 0}, {"x": 0.986, "y": -0.107, "c": "近傍", "n": "smooooch・∀・ [A]  n=3722 cos0.99 難-0.11", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.496, "c": "近傍", "n": "Fantastic Merry-Go-Round [A]  n=2071 cos0.99 難-0.50", "s": 0.556, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5136037318337946}, {"a": 0, "b": 2, "w": 0.45779809875718236}, {"a": 0, "b": 3, "w": 0.38616344491319377}, {"a": 0, "b": 4, "w": 0.36494240850555226}, {"a": 0, "b": 5, "w": 0.4290224006135317}, {"a": 0, "b": 6, "w": 0.34116109115291726}, {"a": 0, "b": 7, "w": 0.39713479242619987}, {"a": 0, "b": 8, "w": 0.39223793400616425}, {"a": 0, "b": 9, "w": 0.35821836342061264}, {"a": 0, "b": 10, "w": 0.35139911505325183}, {"a": 0, "b": 11, "w": 0.19299929712315378}, {"a": 0, "b": 12, "w": 0.3442017632487413}, {"a": 0, "b": 13, "w": 0.10248461150909927}, {"a": 0, "b": 14, "w": 0.10628800847369224}, {"a": 0, "b": 15, "w": 5.02865526996743e-11}, {"a": 0, "b": 16, "w": 0.29152508786996567}, {"a": 0, "b": 17, "w": 0.15249894331461922}, {"a": 0, "b": 18, "w": 0.23767850376362043}, {"a": 0, "b": 19, "w": 0.04175772559497293}, {"a": 0, "b": 20, "w": 0.3007168955787104}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.528,hiY=-0.076;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
