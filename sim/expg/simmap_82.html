<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.416, "c": "種", "n": "LUV CAN SAVE U [A]  n=3143 cos1.00 難-0.42", "s": 0.828, "f": 0}, {"x": 0.997, "y": -0.321, "c": "近傍", "n": "Liquid Crystal Girl feat. echo [A]  n=2464 cos1.00 難-0.32", "s": 0.649, "f": 0}, {"x": 0.993, "y": -0.435, "c": "近傍", "n": "When I Met U [A]  n=2644 cos0.99 難-0.44", "s": 0.697, "f": 0}, {"x": 0.994, "y": -0.582, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2279 cos0.99 難-0.58", "s": 0.6, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "Exchange Place [A]  n=2674 cos0.99 難-0.25", "s": 0.704, "f": 0}, {"x": 0.992, "y": -0.392, "c": "近傍", "n": "OOO [A]  n=3550 cos0.99 難-0.39", "s": 0.935, "f": 0}, {"x": 0.993, "y": -0.572, "c": "近傍", "n": "Mermaid girl-秋葉工房 MIX- [A]  n=3464 cos0.99 難-0.57", "s": 0.913, "f": 0}, {"x": 0.991, "y": -0.424, "c": "近傍", "n": "神様、つれない。 [A]  n=1321 cos0.99 難-0.42", "s": 0.348, "f": 0}, {"x": 0.991, "y": -0.338, "c": "近傍", "n": "Twilight Warp [A]  n=2516 cos0.99 難-0.34", "s": 0.663, "f": 0}, {"x": 0.99, "y": -0.332, "c": "近傍", "n": "朧 [A]  n=3796 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.175, "c": "近傍", "n": "リグレット [A]  n=3193 cos0.99 難-0.18", "s": 0.841, "f": 0}, {"x": 0.99, "y": -0.399, "c": "近傍", "n": "No Day But Today! [A]  n=2347 cos0.99 難-0.40", "s": 0.618, "f": 0}, {"x": 0.99, "y": -0.342, "c": "近傍", "n": "エコ爺 [A]  n=3106 cos0.99 難-0.34", "s": 0.818, "f": 0}, {"x": 0.991, "y": -0.215, "c": "近傍", "n": "DM STAR～関西 energy style～ [A]  n=3104 cos0.99 難-0.22", "s": 0.818, "f": 0}, {"x": 0.99, "y": -0.31, "c": "近傍", "n": "アクマフカ [A]  n=1842 cos0.99 難-0.31", "s": 0.485, "f": 0}, {"x": 0.99, "y": -0.571, "c": "近傍", "n": "不死身ごっこ [A]  n=699 cos0.99 難-0.57", "s": 0.184, "f": 0}, {"x": 0.99, "y": -0.245, "c": "近傍", "n": "Cranberry City ft. Luschel [A]  n=2950 cos0.99 難-0.25", "s": 0.777, "f": 0}, {"x": 0.989, "y": -0.39, "c": "近傍", "n": "Rewind Time [A]  n=2015 cos0.99 難-0.39", "s": 0.531, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2707 cos0.99 難-0.25", "s": 0.713, "f": 0}, {"x": 0.989, "y": -0.308, "c": "近傍", "n": "STAR FIELD [A]  n=2387 cos0.99 難-0.31", "s": 0.629, "f": 0}, {"x": 0.988, "y": -0.45, "c": "近傍", "n": "Journey [A]  n=2716 cos0.99 難-0.45", "s": 0.715, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44215641203373623}, {"a": 0, "b": 2, "w": 0.3796964869121032}, {"a": 0, "b": 3, "w": 0.3989462905619231}, {"a": 0, "b": 4, "w": 0.3715809802034129}, {"a": 0, "b": 5, "w": 0.3137173877341837}, {"a": 0, "b": 6, "w": 0.3724298692325555}, {"a": 0, "b": 7, "w": 0.26103509560874094}, {"a": 0, "b": 8, "w": 0.27393656317089465}, {"a": 0, "b": 9, "w": 0.21155119658859511}, {"a": 0, "b": 10, "w": 0.08229766078812062}, {"a": 0, "b": 11, "w": 0.043452506199603835}, {"a": 0, "b": 12, "w": 0.10390892455941858}, {"a": 0, "b": 13, "w": 0.215813190156667}, {"a": 0, "b": 14, "w": 0.05254636099580001}, {"a": 0, "b": 15, "w": 0.14910143753224658}, {"a": 0, "b": 16, "w": 5.6951998672616355e-11}, {"a": 0, "b": 17, "w": 0.20652406869888196}, {"a": 0, "b": 18, "w": 0.21840945172616144}, {"a": 0, "b": 19, "w": 0.20936953914519607}, {"a": 0, "b": 20, "w": 0.04562016955343695}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.614,hiY=-0.143;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
