<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">One More Lovely [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.685, "c": "種", "n": "One More Lovely [H]  n=2528 cos1.00 難-0.68", "s": 0.786, "f": 0}, {"x": 0.998, "y": -0.809, "c": "近傍", "n": "Karma [H]  n=1620 cos1.00 難-0.81", "s": 0.504, "f": 0}, {"x": 0.993, "y": -0.592, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2270 cos0.99 難-0.59", "s": 0.706, "f": 0}, {"x": 0.993, "y": -0.784, "c": "近傍", "n": "DESIRE [H]  n=2026 cos0.99 難-0.78", "s": 0.63, "f": 0}, {"x": 0.993, "y": -0.545, "c": "近傍", "n": "黒紅掬い [A]  n=1967 cos0.99 難-0.55", "s": 0.612, "f": 0}, {"x": 0.995, "y": -0.916, "c": "近傍", "n": "Castle on the Moon [H]  n=2273 cos1.00 難-0.92", "s": 0.707, "f": 0}, {"x": 0.994, "y": -0.896, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2393 cos0.99 難-0.90", "s": 0.744, "f": 0}, {"x": 0.992, "y": -0.592, "c": "近傍", "n": "Bloody Tears(IIDX EDITION) [H]  n=2588 cos0.99 難-0.59", "s": 0.805, "f": 0}, {"x": 0.991, "y": -0.77, "c": "近傍", "n": "唱 [A]  n=1528 cos0.99 難-0.77", "s": 0.475, "f": 0}, {"x": 0.994, "y": -0.916, "c": "近傍", "n": "GOLD RUSH [H]  n=2940 cos0.99 難-0.92", "s": 0.914, "f": 0}, {"x": 0.991, "y": -0.774, "c": "近傍", "n": "EDEN [H]  n=3024 cos0.99 難-0.77", "s": 0.94, "f": 0}, {"x": 0.992, "y": -0.906, "c": "近傍", "n": "REMINISCENCE [H]  n=1865 cos0.99 難-0.91", "s": 0.58, "f": 0}, {"x": 0.995, "y": -0.972, "c": "近傍", "n": "Rock Da House [H]  n=2243 cos0.99 難-0.97", "s": 0.697, "f": 0}, {"x": 0.99, "y": -0.528, "c": "近傍", "n": "シル・ヴ・プレジデント [A]  n=2823 cos0.99 難-0.53", "s": 0.878, "f": 0}, {"x": 0.989, "y": -0.7, "c": "近傍", "n": "Agnus Dei [H]  n=1705 cos0.99 難-0.70", "s": 0.53, "f": 0}, {"x": 0.989, "y": -0.762, "c": "近傍", "n": "イガク [A]  n=1526 cos0.99 難-0.76", "s": 0.475, "f": 0}, {"x": 0.989, "y": -0.605, "c": "近傍", "n": "Riff//rain [A]  n=1283 cos0.99 難-0.60", "s": 0.399, "f": 0}, {"x": 0.99, "y": -0.866, "c": "近傍", "n": "Linus [H]  n=1667 cos0.99 難-0.87", "s": 0.518, "f": 0}, {"x": 0.988, "y": -0.776, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1229 cos0.99 難-0.78", "s": 0.382, "f": 0}, {"x": 0.99, "y": -0.905, "c": "近傍", "n": "Believe In Me [H]  n=1753 cos0.99 難-0.90", "s": 0.545, "f": 0}, {"x": 0.991, "y": -0.917, "c": "近傍", "n": "FLOWER [H]  n=3216 cos0.99 難-0.92", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.532002415246208}, {"a": 0, "b": 2, "w": 0.24760021874105143}, {"a": 0, "b": 3, "w": 0.27320290060106023}, {"a": 0, "b": 4, "w": 0.2546827176414739}, {"a": 0, "b": 5, "w": 0.39805465310575194}, {"a": 0, "b": 6, "w": 0.33742232521671545}, {"a": 0, "b": 7, "w": 0.06092380156771682}, {"a": 0, "b": 8, "w": 0.0909002260717664}, {"a": 0, "b": 9, "w": 0.3124521929985511}, {"a": 0, "b": 10, "w": 0.14657596870328293}, {"a": 0, "b": 11, "w": 0.2439477775444009}, {"a": 0, "b": 12, "w": 0.3283664014689869}, {"a": 0, "b": 13, "w": 7.033029714165195e-11}, {"a": 0, "b": 14, "w": 0.08781031212500967}, {"a": 0, "b": 15, "w": 0.049132737147065564}, {"a": 0, "b": 16, "w": 0.07670351273604858}, {"a": 0, "b": 17, "w": 0.10497871272088077}, {"a": 0, "b": 18, "w": 0.03686328362856539}, {"a": 0, "b": 19, "w": 0.09475207443146838}, {"a": 0, "b": 20, "w": 0.14399611190662176}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.007,hiY=-0.493;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
