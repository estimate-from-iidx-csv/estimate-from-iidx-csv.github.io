<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vitamin [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.091, "c": "種", "n": "Vitamin [A]  n=1119 cos1.00 難-0.09", "s": 0.304, "f": 0}, {"x": 0.998, "y": -0.038, "c": "近傍", "n": "ANAGMA [A]  n=2584 cos1.00 難-0.04", "s": 0.702, "f": 0}, {"x": 0.998, "y": -0.189, "c": "近傍", "n": "ACCELERATE [A]  n=2996 cos1.00 難-0.19", "s": 0.813, "f": 0}, {"x": 0.996, "y": -0.131, "c": "近傍", "n": "BRAVE GLOW [A]  n=3119 cos1.00 難-0.13", "s": 0.847, "f": 0}, {"x": 0.996, "y": -0.006, "c": "近傍", "n": "Cosmic Cat [A]  n=3683 cos1.00 難-0.01", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.211, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2724 cos1.00 難-0.21", "s": 0.74, "f": 0}, {"x": 0.996, "y": -0.038, "c": "近傍", "n": "POODLE [A]  n=2921 cos1.00 難-0.04", "s": 0.793, "f": 0}, {"x": 0.997, "y": 0.052, "c": "近傍", "n": "Cyber Force -DJ Yoshitaka Remix- [A]  n=2796 cos1.00 難0.05", "s": 0.759, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "Turii ～Panta rhei～ [A]  n=3421 cos1.00 難-0.13", "s": 0.929, "f": 0}, {"x": 0.995, "y": -0.142, "c": "近傍", "n": "Flash Back 90's [A]  n=3435 cos1.00 難-0.14", "s": 0.933, "f": 0}, {"x": 0.996, "y": 0.019, "c": "近傍", "n": "狂水一華 [A]  n=2787 cos1.00 難0.02", "s": 0.757, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Fly you to the star [A]  n=3230 cos0.99 難-0.14", "s": 0.877, "f": 0}, {"x": 0.996, "y": -0.23, "c": "近傍", "n": "Prohibited Props [A]  n=2358 cos1.00 難-0.23", "s": 0.64, "f": 0}, {"x": 0.995, "y": -0.007, "c": "近傍", "n": "パーフェクトイーター [A]  n=1777 cos1.00 難-0.01", "s": 0.482, "f": 0}, {"x": 0.997, "y": 0.094, "c": "近傍", "n": "Hat Surprise (Season 3) [A]  n=1472 cos1.00 難0.09", "s": 0.4, "f": 0}, {"x": 0.995, "y": -0.132, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1357 cos0.99 難-0.13", "s": 0.368, "f": 0}, {"x": 0.995, "y": -0.106, "c": "近傍", "n": "As You Want [A]  n=1913 cos0.99 難-0.11", "s": 0.519, "f": 0}, {"x": 0.996, "y": 0.082, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2613 cos1.00 難0.08", "s": 0.709, "f": 0}, {"x": 0.995, "y": -0.042, "c": "近傍", "n": "Ventriloquist [A]  n=2646 cos0.99 難-0.04", "s": 0.718, "f": 0}, {"x": 0.994, "y": -0.041, "c": "近傍", "n": "Piano Samurai [A]  n=2813 cos0.99 難-0.04", "s": 0.764, "f": 0}, {"x": 0.994, "y": -0.1, "c": "近傍", "n": "1001 -ESCAPE- [A]  n=3065 cos0.99 難-0.10", "s": 0.832, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5575583454896855}, {"a": 0, "b": 2, "w": 0.3247418088887013}, {"a": 0, "b": 3, "w": 0.3923987819643655}, {"a": 0, "b": 4, "w": 0.37272406168424255}, {"a": 0, "b": 5, "w": 0.36159012711239413}, {"a": 0, "b": 6, "w": 0.15343626787062903}, {"a": 0, "b": 7, "w": 0.28983428421683355}, {"a": 0, "b": 8, "w": 0.280614904146284}, {"a": 0, "b": 9, "w": 0.12039980274891227}, {"a": 0, "b": 10, "w": 0.3705676650783536}, {"a": 0, "b": 11, "w": 6.012257358634088e-11}, {"a": 0, "b": 12, "w": 0.22316030551654797}, {"a": 0, "b": 13, "w": 0.14885280143936142}, {"a": 0, "b": 14, "w": 0.3290572431725093}, {"a": 0, "b": 15, "w": 0.20580980126453274}, {"a": 0, "b": 16, "w": 0.24185220609894886}, {"a": 0, "b": 17, "w": 0.21638468983069103}, {"a": 0, "b": 18, "w": 0.2823214143774375}, {"a": 0, "b": 19, "w": 0.2636768812222682}, {"a": 0, "b": 20, "w": 0.2640582261470006}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.256,hiY=0.120;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
