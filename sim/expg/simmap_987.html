<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Queen's Tragedy [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.107, "c": "種", "n": "Queen's Tragedy [A]  n=3241 cos1.00 難-0.11", "s": 0.919, "f": 0}, {"x": 0.997, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos1.00 難-0.11", "s": 0.84, "f": 0}, {"x": 0.997, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos1.00 難-0.10", "s": 0.901, "f": 0}, {"x": 0.996, "y": -0.054, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2903 cos1.00 難-0.05", "s": 0.823, "f": 0}, {"x": 0.996, "y": -0.106, "c": "近傍", "n": "BLO§OM [A]  n=2553 cos1.00 難-0.11", "s": 0.724, "f": 0}, {"x": 0.996, "y": -0.048, "c": "近傍", "n": "Back Into The Light [A]  n=3041 cos1.00 難-0.05", "s": 0.862, "f": 0}, {"x": 0.996, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos1.00 難-0.18", "s": 0.792, "f": 0}, {"x": 0.995, "y": -0.089, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2946 cos1.00 難-0.09", "s": 0.835, "f": 0}, {"x": 0.996, "y": -0.007, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2765 cos1.00 難-0.01", "s": 0.784, "f": 0}, {"x": 0.995, "y": -0.082, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2791 cos1.00 難-0.08", "s": 0.791, "f": 0}, {"x": 0.995, "y": -0.142, "c": "近傍", "n": "Flash Back 90's [A]  n=3435 cos0.99 難-0.14", "s": 0.974, "f": 0}, {"x": 0.995, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos0.99 難-0.11", "s": 0.885, "f": 0}, {"x": 0.997, "y": 0.073, "c": "近傍", "n": "Love Is Eternity [A]  n=3528 cos1.00 難0.07", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.154, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1098 cos0.99 難-0.15", "s": 0.311, "f": 0}, {"x": 0.995, "y": -0.038, "c": "近傍", "n": "Space Time [A]  n=2794 cos0.99 難-0.04", "s": 0.792, "f": 0}, {"x": 0.995, "y": -0.034, "c": "近傍", "n": "ANDROMEDA II [A]  n=3021 cos0.99 難-0.03", "s": 0.856, "f": 0}, {"x": 0.994, "y": -0.103, "c": "近傍", "n": "double thrash [H]  n=2119 cos0.99 難-0.10", "s": 0.601, "f": 0}, {"x": 0.996, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos1.00 難-0.27", "s": 0.703, "f": 0}, {"x": 0.995, "y": -0.004, "c": "近傍", "n": "Praludium [A]  n=2981 cos0.99 難-0.00", "s": 0.845, "f": 0}, {"x": 0.994, "y": -0.06, "c": "近傍", "n": "NPC World [A]  n=2848 cos0.99 難-0.06", "s": 0.807, "f": 0}, {"x": 0.996, "y": -0.301, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2372 cos1.00 難-0.30", "s": 0.672, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34559569014786684}, {"a": 0, "b": 2, "w": 0.36022836571872685}, {"a": 0, "b": 3, "w": 0.3327169468658904}, {"a": 0, "b": 4, "w": 0.09862737000341015}, {"a": 0, "b": 5, "w": 0.09959144527562058}, {"a": 0, "b": 6, "w": 0.2775733544629584}, {"a": 0, "b": 7, "w": 0.12068320068713467}, {"a": 0, "b": 8, "w": 0.2815761397044635}, {"a": 0, "b": 9, "w": 0.15667439557176}, {"a": 0, "b": 10, "w": 0.1752126509047316}, {"a": 0, "b": 11, "w": 0.18142957099980161}, {"a": 0, "b": 12, "w": 0.3975667588808669}, {"a": 0, "b": 13, "w": 7.808820257082516e-11}, {"a": 0, "b": 14, "w": 0.178056837810589}, {"a": 0, "b": 15, "w": 0.11121090244939458}, {"a": 0, "b": 16, "w": 0.15266291977191526}, {"a": 0, "b": 17, "w": 0.26069054805829817}, {"a": 0, "b": 18, "w": 0.11198609940287663}, {"a": 0, "b": 19, "w": 0.11576889437731575}, {"a": 0, "b": 20, "w": 0.33244592464782363}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.331,hiY=0.103;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
