<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">UNITE THE HEART [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.36, "c": "種", "n": "UNITE THE HEART [A]  n=2848 cos1.00 難0.36", "s": 0.777, "f": 0}, {"x": 0.997, "y": 0.312, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [L]  n=3267 cos1.00 難0.31", "s": 0.892, "f": 0}, {"x": 0.996, "y": 0.432, "c": "近傍", "n": "Xepher [A]  n=3664 cos1.00 難0.43", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.363, "c": "近傍", "n": "Elektrick U-Phoria [A]  n=3477 cos0.99 難0.36", "s": 0.949, "f": 0}, {"x": 0.997, "y": 0.231, "c": "近傍", "n": "響花水月 [A]  n=2140 cos1.00 難0.23", "s": 0.584, "f": 0}, {"x": 0.994, "y": 0.364, "c": "近傍", "n": "Bow shock!! [A]  n=2968 cos0.99 難0.36", "s": 0.81, "f": 0}, {"x": 0.994, "y": 0.321, "c": "近傍", "n": "惑星☆ロリポップ [A]  n=1789 cos0.99 難0.32", "s": 0.488, "f": 0}, {"x": 0.994, "y": 0.318, "c": "近傍", "n": "Take My Life [A]  n=3355 cos0.99 難0.32", "s": 0.916, "f": 0}, {"x": 0.994, "y": 0.31, "c": "近傍", "n": "#The_Relentless [A]  n=3438 cos0.99 難0.31", "s": 0.938, "f": 0}, {"x": 0.995, "y": 0.221, "c": "近傍", "n": "儚き恋の華 [A]  n=2554 cos1.00 難0.22", "s": 0.697, "f": 0}, {"x": 0.993, "y": 0.275, "c": "近傍", "n": "Stylus [A]  n=1628 cos0.99 難0.28", "s": 0.444, "f": 0}, {"x": 0.992, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.861, "f": 0}, {"x": 0.992, "y": 0.429, "c": "近傍", "n": "Moving on [A]  n=3011 cos0.99 難0.43", "s": 0.822, "f": 0}, {"x": 0.993, "y": 0.457, "c": "近傍", "n": "Light and Cyber… [A]  n=3252 cos0.99 難0.46", "s": 0.888, "f": 0}, {"x": 0.992, "y": 0.292, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=850 cos0.99 難0.29", "s": 0.232, "f": 0}, {"x": 0.992, "y": 0.312, "c": "近傍", "n": "QUANTUM TELEPORTATION [A]  n=3521 cos0.99 難0.31", "s": 0.961, "f": 0}, {"x": 0.992, "y": 0.345, "c": "近傍", "n": "the shadow [A]  n=3395 cos0.99 難0.34", "s": 0.927, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "SOLID WYVERN [A]  n=2524 cos0.99 難0.20", "s": 0.689, "f": 0}, {"x": 0.994, "y": 0.199, "c": "近傍", "n": "Swing My Wonderland [A]  n=1626 cos0.99 難0.20", "s": 0.444, "f": 0}, {"x": 0.992, "y": 0.287, "c": "近傍", "n": "Ypsilon [A]  n=2808 cos0.99 難0.29", "s": 0.766, "f": 0}, {"x": 0.992, "y": 0.347, "c": "近傍", "n": "20XX [A]  n=1761 cos0.99 難0.35", "s": 0.481, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3767289065267717}, {"a": 0, "b": 2, "w": 0.39649232426402437}, {"a": 0, "b": 3, "w": 0.4201001310889101}, {"a": 0, "b": 4, "w": 0.46710260452542907}, {"a": 0, "b": 5, "w": 0.35565119697469416}, {"a": 0, "b": 6, "w": 0.4055758353647487}, {"a": 0, "b": 7, "w": 0.23378346559800256}, {"a": 0, "b": 8, "w": 0.2737546316756345}, {"a": 0, "b": 9, "w": 0.4518101344974772}, {"a": 0, "b": 10, "w": 0.219210480183049}, {"a": 0, "b": 11, "w": 0.2657532764357148}, {"a": 0, "b": 12, "w": 0.09128524521792192}, {"a": 0, "b": 13, "w": 0.3639803606096229}, {"a": 0, "b": 14, "w": 0.23133366070757044}, {"a": 0, "b": 15, "w": 0.009603690440772361}, {"a": 0, "b": 16, "w": 3.99011934604232e-11}, {"a": 0, "b": 17, "w": 0.13789512971875018}, {"a": 0, "b": 18, "w": 0.3214915176530341}, {"a": 0, "b": 19, "w": 0.15066473217369336}, {"a": 0, "b": 20, "w": 0.1482917645660784}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.178,hiY=0.478;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
