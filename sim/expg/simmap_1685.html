<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">RIDE ON THE LIGHT (HI GREAT MIX) [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.285, "c": "種", "n": "RIDE ON THE LIGHT (HI GREAT MIX) [L]  n=2953 cos1.00 難0.28", "s": 0.783, "f": 0}, {"x": 0.977, "y": 0.406, "c": "近傍", "n": "Zenith [A]  n=2361 cos0.98 難0.41", "s": 0.626, "f": 0}, {"x": 0.974, "y": 0.069, "c": "近傍", "n": "Fiery Stallion [A]  n=1574 cos0.97 難0.07", "s": 0.417, "f": 0}, {"x": 0.972, "y": 0.082, "c": "近傍", "n": "Elisha [A]  n=3765 cos0.97 難0.08", "s": 0.998, "f": 0}, {"x": 0.972, "y": -0.038, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3364 cos0.97 難-0.04", "s": 0.892, "f": 0}, {"x": 0.966, "y": 0.31, "c": "近傍", "n": "《ORDERBREAKER》 [A]  n=1760 cos0.97 難0.31", "s": 0.467, "f": 0}, {"x": 0.993, "y": -0.389, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3064 cos0.99 難-0.39", "s": 0.812, "f": 0}, {"x": 0.976, "y": -0.223, "c": "近傍", "n": "Arcanos [A]  n=1239 cos0.98 難-0.22", "s": 0.328, "f": 0}, {"x": 0.987, "y": -0.382, "c": "近傍", "n": "Miami Sunset Drive [A]  n=2748 cos0.99 難-0.38", "s": 0.729, "f": 0}, {"x": 0.976, "y": -0.268, "c": "近傍", "n": "ATOMIC AGE [A]  n=1609 cos0.98 難-0.27", "s": 0.427, "f": 0}, {"x": 0.967, "y": -0.047, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2855 cos0.97 難-0.05", "s": 0.757, "f": 0}, {"x": 0.965, "y": 0.577, "c": "近傍", "n": "Acid Pumper [A]  n=3562 cos0.97 難0.58", "s": 0.944, "f": 0}, {"x": 0.969, "y": 0.741, "c": "近傍", "n": "Kailua [A]  n=3543 cos0.97 難0.74", "s": 0.939, "f": 0}, {"x": 0.965, "y": -0.059, "c": "近傍", "n": "Donkey Donk [A]  n=3461 cos0.96 難-0.06", "s": 0.918, "f": 0}, {"x": 0.97, "y": -0.213, "c": "近傍", "n": "OUTER PLANETS [A]  n=2510 cos0.97 難-0.21", "s": 0.665, "f": 0}, {"x": 0.962, "y": 0.091, "c": "近傍", "n": "ラストセンチュリーメランコリック [A]  n=3088 cos0.96 難0.09", "s": 0.819, "f": 0}, {"x": 0.973, "y": -0.33, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2943 cos0.97 難-0.33", "s": 0.78, "f": 0}, {"x": 0.972, "y": -0.335, "c": "近傍", "n": "GIGANT [A]  n=936 cos0.97 難-0.34", "s": 0.248, "f": 0}, {"x": 0.968, "y": -0.258, "c": "近傍", "n": "Golden Palms [A]  n=3226 cos0.97 難-0.26", "s": 0.855, "f": 0}, {"x": 0.966, "y": 0.819, "c": "近傍", "n": "Golden Palms [L]  n=3338 cos0.97 難0.82", "s": 0.885, "f": 0}, {"x": 0.959, "y": -0.006, "c": "近傍", "n": "MIRACLE MEETS [A]  n=3772 cos0.96 難-0.01", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44132333742742613}, {"a": 0, "b": 2, "w": 0.42236198002320213}, {"a": 0, "b": 3, "w": 0.4330562735694691}, {"a": 0, "b": 4, "w": 0.45359230386025273}, {"a": 0, "b": 5, "w": 0.3206012134445577}, {"a": 0, "b": 6, "w": 0.7173743145611866}, {"a": 0, "b": 7, "w": 0.4874042636925662}, {"a": 0, "b": 8, "w": 0.48177681909213377}, {"a": 0, "b": 9, "w": 0.42959808986678505}, {"a": 0, "b": 10, "w": 0.35343222381501405}, {"a": 0, "b": 11, "w": 0.19775738049469305}, {"a": 0, "b": 12, "w": 2.1723067789025663e-11}, {"a": 0, "b": 13, "w": 0.31336037871826605}, {"a": 0, "b": 14, "w": 0.4211889463191384}, {"a": 0, "b": 15, "w": 0.3555466854070678}, {"a": 0, "b": 16, "w": 0.33350305842583994}, {"a": 0, "b": 17, "w": 0.39157489526913414}, {"a": 0, "b": 18, "w": 0.4072233498242305}, {"a": 0, "b": 19, "w": 0.3400698674654601}, {"a": 0, "b": 20, "w": 0.29190062383791193}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.955,hiX=1.003,loY=-0.486,hiY=0.915;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
