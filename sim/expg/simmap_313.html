<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DUE TOMORROW [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.595, "c": "種", "n": "DUE TOMORROW [H]  n=1474 cos1.00 難-0.60", "s": 0.459, "f": 0}, {"x": 0.986, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.508, "f": 0}, {"x": 0.983, "y": -0.708, "c": "近傍", "n": "quasar [H]  n=3209 cos0.98 難-0.71", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.801, "c": "近傍", "n": "Highcharge Divolt [H]  n=2464 cos0.98 難-0.80", "s": 0.768, "f": 0}, {"x": 0.98, "y": -0.702, "c": "近傍", "n": "CaptivAte2～覚醒～ [H]  n=2113 cos0.98 難-0.70", "s": 0.658, "f": 0}, {"x": 0.979, "y": -0.567, "c": "近傍", "n": "She is my wife [H]  n=2406 cos0.98 難-0.57", "s": 0.75, "f": 0}, {"x": 0.979, "y": -0.634, "c": "近傍", "n": "ANDROMEDA II [H]  n=1977 cos0.98 難-0.63", "s": 0.616, "f": 0}, {"x": 0.987, "y": -0.889, "c": "近傍", "n": "BROKEN EDEN [H]  n=2057 cos0.99 難-0.89", "s": 0.641, "f": 0}, {"x": 0.986, "y": -0.886, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1987 cos0.99 難-0.89", "s": 0.619, "f": 0}, {"x": 0.979, "y": -0.633, "c": "近傍", "n": "WONDER WALKER [H]  n=2625 cos0.98 難-0.63", "s": 0.818, "f": 0}, {"x": 0.978, "y": -0.648, "c": "近傍", "n": "Don't be afraid myself [H]  n=1640 cos0.98 難-0.65", "s": 0.511, "f": 0}, {"x": 0.981, "y": -0.38, "c": "近傍", "n": "Ancient Scapes [H]  n=2486 cos0.98 難-0.38", "s": 0.775, "f": 0}, {"x": 0.977, "y": -0.598, "c": "近傍", "n": "NEMESIS [H]  n=1851 cos0.98 難-0.60", "s": 0.577, "f": 0}, {"x": 0.977, "y": -0.619, "c": "近傍", "n": "トリカゴノ鳳凰 [H]  n=2593 cos0.98 難-0.62", "s": 0.808, "f": 0}, {"x": 0.978, "y": -0.708, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [H]  n=2284 cos0.98 難-0.71", "s": 0.712, "f": 0}, {"x": 0.978, "y": -0.443, "c": "近傍", "n": "DropZ-Line- [H]  n=1721 cos0.98 難-0.44", "s": 0.536, "f": 0}, {"x": 0.982, "y": -0.878, "c": "近傍", "n": "xenon [H]  n=2369 cos0.98 難-0.88", "s": 0.738, "f": 0}, {"x": 0.979, "y": -0.804, "c": "近傍", "n": "Go Ahead!! [H]  n=2503 cos0.98 難-0.80", "s": 0.78, "f": 0}, {"x": 0.976, "y": -0.622, "c": "近傍", "n": "Colors (radio edit) [H]  n=2374 cos0.98 難-0.62", "s": 0.74, "f": 0}, {"x": 0.977, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos0.98 難-0.74", "s": 0.639, "f": 0}, {"x": 0.98, "y": -0.851, "c": "近傍", "n": "Giudecca [H]  n=1654 cos0.98 難-0.85", "s": 0.515, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.23849499319863776}, {"a": 0, "b": 2, "w": 0.07437508649256852}, {"a": 0, "b": 3, "w": 0.35170061011611653}, {"a": 0, "b": 4, "w": 0.17364322568218038}, {"a": 0, "b": 5, "w": 0.207580958750326}, {"a": 0, "b": 6, "w": 0.07525580098388418}, {"a": 0, "b": 7, "w": 0.18364323395326287}, {"a": 0, "b": 8, "w": 0.19734395988802245}, {"a": 0, "b": 9, "w": 0.07477537303527537}, {"a": 0, "b": 10, "w": 0.14969093540383327}, {"a": 0, "b": 11, "w": 0.2756419483016641}, {"a": 0, "b": 12, "w": 0.11366723403764656}, {"a": 0, "b": 13, "w": 0.16790512027809346}, {"a": 0, "b": 14, "w": 0.2294002150642418}, {"a": 0, "b": 15, "w": 0.22432127627078835}, {"a": 0, "b": 16, "w": 0.07012875373311955}, {"a": 0, "b": 17, "w": 0.23284839470702423}, {"a": 0, "b": 18, "w": 0.027281874183645693}, {"a": 0, "b": 19, "w": 3.2743141531454967e-11}, {"a": 0, "b": 20, "w": 0.07681320085196142}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.974,hiX=1.002,loY=-0.930,hiY=-0.339;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
