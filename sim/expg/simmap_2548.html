<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.135, "c": "種", "n": "chaplet -IIDX re:build- [A]  n=889 cos1.00 難1.14", "s": 0.252, "f": 0}, {"x": 0.991, "y": 1.154, "c": "近傍", "n": "DIVINE JUDGEMENT [A]  n=1308 cos0.99 難1.15", "s": 0.37, "f": 0}, {"x": 0.986, "y": 1.049, "c": "近傍", "n": "M4K3 1T B0UNC3 [A]  n=3474 cos0.99 難1.05", "s": 0.984, "f": 0}, {"x": 0.986, "y": 1.227, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2508 cos0.99 難1.23", "s": 0.71, "f": 0}, {"x": 0.987, "y": 1.331, "c": "近傍", "n": "Snakey Kung-fu [A]  n=3339 cos0.99 難1.33", "s": 0.945, "f": 0}, {"x": 0.99, "y": 0.786, "c": "近傍", "n": "蛇神 [A]  n=3433 cos0.99 難0.79", "s": 0.972, "f": 0}, {"x": 0.985, "y": 1.05, "c": "近傍", "n": "禊 [A]  n=2609 cos0.98 難1.05", "s": 0.739, "f": 0}, {"x": 0.984, "y": 1.092, "c": "近傍", "n": "海神 [A]  n=3532 cos0.98 難1.09", "s": 1.0, "f": 0}, {"x": 0.986, "y": 1.42, "c": "近傍", "n": "BEAT PRISONER [A]  n=2842 cos0.99 難1.42", "s": 0.805, "f": 0}, {"x": 0.983, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.98 難1.12", "s": 0.963, "f": 0}, {"x": 0.983, "y": 1.089, "c": "近傍", "n": "Ou Legends [A]  n=1996 cos0.98 難1.09", "s": 0.565, "f": 0}, {"x": 0.983, "y": 1.221, "c": "近傍", "n": "摩天楼 [A]  n=1775 cos0.98 難1.22", "s": 0.503, "f": 0}, {"x": 0.982, "y": 1.086, "c": "近傍", "n": "Ghost Pulse [A]  n=1918 cos0.98 難1.09", "s": 0.543, "f": 0}, {"x": 0.985, "y": 1.475, "c": "近傍", "n": "Painful Fate [A]  n=2860 cos0.99 難1.48", "s": 0.81, "f": 0}, {"x": 0.984, "y": 1.43, "c": "近傍", "n": "ミラージュ・レジデンス [L]  n=1862 cos0.98 難1.43", "s": 0.527, "f": 0}, {"x": 0.988, "y": 1.563, "c": "近傍", "n": "閠槞彁の願い [A]  n=2327 cos0.99 難1.56", "s": 0.659, "f": 0}, {"x": 0.984, "y": 1.401, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3178 cos0.98 難1.40", "s": 0.9, "f": 0}, {"x": 0.985, "y": 1.471, "c": "近傍", "n": "Hollywood Galaxy [A]  n=3151 cos0.98 難1.47", "s": 0.892, "f": 0}, {"x": 0.981, "y": 1.117, "c": "近傍", "n": "Umbral [L]  n=2054 cos0.98 難1.12", "s": 0.582, "f": 0}, {"x": 0.981, "y": 1.276, "c": "近傍", "n": "Vermilion Carol [A]  n=1649 cos0.98 難1.28", "s": 0.467, "f": 0}, {"x": 0.98, "y": 1.228, "c": "近傍", "n": "TECHNO Style Essentials [A]  n=2983 cos0.98 難1.23", "s": 0.845, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.424683277738493}, {"a": 0, "b": 2, "w": 0.38705355673904607}, {"a": 0, "b": 3, "w": 0.3508934033607042}, {"a": 0, "b": 4, "w": 0.39549289294998746}, {"a": 0, "b": 5, "w": 0.4346683684007594}, {"a": 0, "b": 6, "w": 0.35164507966560843}, {"a": 0, "b": 7, "w": 0.3493656683804187}, {"a": 0, "b": 8, "w": 2.6169844069556802e-11}, {"a": 0, "b": 9, "w": 0.3188566664189316}, {"a": 0, "b": 10, "w": 0.2903551346163573}, {"a": 0, "b": 11, "w": 0.3119752023728558}, {"a": 0, "b": 12, "w": 0.30361489565639876}, {"a": 0, "b": 13, "w": 0.3050551924234245}, {"a": 0, "b": 14, "w": 0.3073994666924764}, {"a": 0, "b": 15, "w": 0.20191757923413822}, {"a": 0, "b": 16, "w": 0.23231307953902525}, {"a": 0, "b": 17, "w": 0.35212371464805514}, {"a": 0, "b": 18, "w": 0.2835890493771356}, {"a": 0, "b": 19, "w": 0.11341513181325258}, {"a": 0, "b": 20, "w": 0.27594425489483443}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=0.724,hiY=1.626;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
