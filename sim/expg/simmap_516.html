<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">See You Again [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.621, "c": "種", "n": "See You Again [H]  n=243 cos1.00 難-1.62", "s": 0.138, "f": 0}, {"x": 0.992, "y": -1.522, "c": "近傍", "n": "Piano Samurai [H]  n=1409 cos0.99 難-1.52", "s": 0.8, "f": 0}, {"x": 0.988, "y": -1.605, "c": "近傍", "n": "STARLiGHT [H]  n=1529 cos0.99 難-1.60", "s": 0.868, "f": 0}, {"x": 0.986, "y": -1.593, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.59", "s": 0.387, "f": 0}, {"x": 0.987, "y": -1.525, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos0.99 難-1.53", "s": 0.773, "f": 0}, {"x": 0.986, "y": -1.731, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1296 cos0.99 難-1.73", "s": 0.736, "f": 0}, {"x": 0.985, "y": -1.497, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1762 cos0.98 難-1.50", "s": 1.0, "f": 0}, {"x": 0.987, "y": -1.433, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos0.99 難-1.43", "s": 0.75, "f": 0}, {"x": 0.983, "y": -1.615, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1154 cos0.98 難-1.62", "s": 0.655, "f": 0}, {"x": 0.987, "y": -1.43, "c": "近傍", "n": "27th style [H]  n=1334 cos0.99 難-1.43", "s": 0.757, "f": 0}, {"x": 0.99, "y": -1.863, "c": "近傍", "n": "rough percussionythm [H]  n=1068 cos0.99 難-1.86", "s": 0.606, "f": 0}, {"x": 0.992, "y": -1.897, "c": "近傍", "n": "開きたまえ！Next stAge！ [H]  n=1063 cos0.99 難-1.90", "s": 0.603, "f": 0}, {"x": 0.988, "y": -1.384, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1719 cos0.99 難-1.38", "s": 0.976, "f": 0}, {"x": 0.986, "y": -1.419, "c": "近傍", "n": "水鏡の異界 [H]  n=1252 cos0.99 難-1.42", "s": 0.711, "f": 0}, {"x": 0.982, "y": -1.534, "c": "近傍", "n": "Jungle Eater [H]  n=1100 cos0.98 難-1.53", "s": 0.624, "f": 0}, {"x": 0.987, "y": -1.37, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=715 cos0.99 難-1.37", "s": 0.406, "f": 0}, {"x": 0.984, "y": -1.367, "c": "近傍", "n": "BREAK OVER [H]  n=1211 cos0.98 難-1.37", "s": 0.687, "f": 0}, {"x": 0.998, "y": -1.24, "c": "近傍", "n": "か・し・ま・し☆PUMP UP！ [H]  n=1237 cos1.00 難-1.24", "s": 0.702, "f": 0}, {"x": 0.984, "y": -1.363, "c": "近傍", "n": "BLAZING_LAZER [H]  n=798 cos0.98 難-1.36", "s": 0.453, "f": 0}, {"x": 0.984, "y": -1.871, "c": "近傍", "n": "Super Freak [H]  n=716 cos0.98 難-1.87", "s": 0.406, "f": 0}, {"x": 0.978, "y": -1.679, "c": "近傍", "n": "Hat Surprise (Season 2) [H]  n=703 cos0.98 難-1.68", "s": 0.399, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4624544556695742}, {"a": 0, "b": 2, "w": 0.3288818719346117}, {"a": 0, "b": 3, "w": 0.3025649301132084}, {"a": 0, "b": 4, "w": 0.29001604944885906}, {"a": 0, "b": 5, "w": 0.3057074040762082}, {"a": 0, "b": 6, "w": 0.2727759093722568}, {"a": 0, "b": 7, "w": 0.32582575940963965}, {"a": 0, "b": 8, "w": 0.22393256699615594}, {"a": 0, "b": 9, "w": 0.25455699468531423}, {"a": 0, "b": 10, "w": 0.25953854676422294}, {"a": 0, "b": 11, "w": 0.4498109107373407}, {"a": 0, "b": 12, "w": 0.35757223707157215}, {"a": 0, "b": 13, "w": 0.21192815827435596}, {"a": 0, "b": 14, "w": 0.15462702932548889}, {"a": 0, "b": 15, "w": 4.8706705335632705e-11}, {"a": 0, "b": 16, "w": 0.2514022591500089}, {"a": 0, "b": 17, "w": 0.6932276210799997}, {"a": 0, "b": 18, "w": 0.11161762558477306}, {"a": 0, "b": 19, "w": 0.23153038322462993}, {"a": 0, "b": 20, "w": 0.12748419558416801}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.950,hiY=-1.188;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
