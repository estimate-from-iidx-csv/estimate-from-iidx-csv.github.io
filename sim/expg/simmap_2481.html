<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">24h Endurance Race [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.344, "c": "種", "n": "24h Endurance Race [A]  n=1707 cos1.00 難1.34", "s": 0.503, "f": 0}, {"x": 0.992, "y": 1.242, "c": "近傍", "n": "疾風迅雷 [A]  n=3354 cos0.99 難1.24", "s": 0.989, "f": 0}, {"x": 0.994, "y": 1.146, "c": "近傍", "n": "Million Dollar [A]  n=1558 cos0.99 難1.15", "s": 0.459, "f": 0}, {"x": 0.99, "y": 1.348, "c": "近傍", "n": "INHERITANCE [L]  n=586 cos0.99 難1.35", "s": 0.173, "f": 0}, {"x": 0.991, "y": 1.188, "c": "近傍", "n": "ハイテックトキオ [L]  n=2023 cos0.99 難1.19", "s": 0.597, "f": 0}, {"x": 0.99, "y": 1.288, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=729 cos0.99 難1.29", "s": 0.215, "f": 0}, {"x": 0.99, "y": 1.299, "c": "近傍", "n": "The Limbo [A]  n=3298 cos0.99 難1.30", "s": 0.973, "f": 0}, {"x": 0.989, "y": 1.321, "c": "近傍", "n": "HyperTwist [A]  n=671 cos0.99 難1.32", "s": 0.198, "f": 0}, {"x": 0.991, "y": 1.163, "c": "近傍", "n": "From Human Blood [A]  n=979 cos0.99 難1.16", "s": 0.289, "f": 0}, {"x": 0.989, "y": 1.26, "c": "近傍", "n": "アラビアン ハイパー ナイト [A]  n=942 cos0.99 難1.26", "s": 0.278, "f": 0}, {"x": 0.989, "y": 1.242, "c": "近傍", "n": "Xb10r [A]  n=1444 cos0.99 難1.24", "s": 0.426, "f": 0}, {"x": 0.991, "y": 1.108, "c": "近傍", "n": "COSMIC V3LOCITY [A]  n=1129 cos0.99 難1.11", "s": 0.333, "f": 0}, {"x": 0.988, "y": 1.272, "c": "近傍", "n": "Flying Castle [A]  n=2138 cos0.99 難1.27", "s": 0.63, "f": 0}, {"x": 0.988, "y": 1.208, "c": "近傍", "n": "夏色DIARY - L.E.D.-G STYLE MIX - [A]  n=3289 cos0.99 難1.21", "s": 0.97, "f": 0}, {"x": 0.989, "y": 1.163, "c": "近傍", "n": "The Last Apocalypse [A]  n=1421 cos0.99 難1.16", "s": 0.419, "f": 0}, {"x": 0.988, "y": 1.258, "c": "近傍", "n": "Sol Cosine Job 2 [A]  n=3232 cos0.99 難1.26", "s": 0.953, "f": 0}, {"x": 0.989, "y": 1.152, "c": "近傍", "n": "EVANESCENT [A]  n=3029 cos0.99 難1.15", "s": 0.893, "f": 0}, {"x": 0.991, "y": 1.61, "c": "近傍", "n": "Cross Fire [A]  n=946 cos0.99 難1.61", "s": 0.279, "f": 0}, {"x": 0.987, "y": 1.348, "c": "近傍", "n": "Arkadia [A]  n=2067 cos0.99 難1.35", "s": 0.61, "f": 0}, {"x": 0.99, "y": 1.092, "c": "近傍", "n": "Out of Control [A]  n=1755 cos0.99 難1.09", "s": 0.518, "f": 0}, {"x": 0.988, "y": 1.181, "c": "近傍", "n": "トリカゴノ鳳凰 [A]  n=3391 cos0.99 難1.18", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.22574527586476423}, {"a": 0, "b": 2, "w": 0.2864294118799179}, {"a": 0, "b": 3, "w": 3.923517066795057e-11}, {"a": 0, "b": 4, "w": 0.2863053140663111}, {"a": 0, "b": 5, "w": 0.04782126907230588}, {"a": 0, "b": 6, "w": 0.15081297894913037}, {"a": 0, "b": 7, "w": 0.20444575132500054}, {"a": 0, "b": 8, "w": 0.07000423575264392}, {"a": 0, "b": 9, "w": 0.17667758438884507}, {"a": 0, "b": 10, "w": 0.009307576923159644}, {"a": 0, "b": 11, "w": 0.21678899732818846}, {"a": 0, "b": 12, "w": 0.007812483778395496}, {"a": 0, "b": 13, "w": 0.14799418858337998}, {"a": 0, "b": 14, "w": 0.04079408473504176}, {"a": 0, "b": 15, "w": 0.11229237155362348}, {"a": 0, "b": 16, "w": 0.16201403520123803}, {"a": 0, "b": 17, "w": 0.03205503840097579}, {"a": 0, "b": 18, "w": 0.04143626677039214}, {"a": 0, "b": 19, "w": 0.24207521691448974}, {"a": 0, "b": 20, "w": 0.07551253667192803}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=1.050,hiY=1.651;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
