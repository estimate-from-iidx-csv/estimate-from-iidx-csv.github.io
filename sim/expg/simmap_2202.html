<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Unicorn tail [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.515, "c": "種", "n": "Unicorn tail [A]  n=3490 cos1.00 難0.52", "s": 0.951, "f": 0}, {"x": 0.992, "y": 0.448, "c": "近傍", "n": "SOUND OF GIALLARHORN [A]  n=3279 cos0.99 難0.45", "s": 0.893, "f": 0}, {"x": 0.992, "y": 0.423, "c": "近傍", "n": "EDEN [L]  n=1738 cos0.99 難0.42", "s": 0.473, "f": 0}, {"x": 0.992, "y": 0.411, "c": "近傍", "n": "waxing and wanding [A]  n=3671 cos0.99 難0.41", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.458, "c": "近傍", "n": "AsiaN distractive [A]  n=3181 cos0.99 難0.46", "s": 0.867, "f": 0}, {"x": 0.992, "y": 0.327, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [A]  n=3551 cos0.99 難0.33", "s": 0.967, "f": 0}, {"x": 0.99, "y": 0.652, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [L]  n=2452 cos0.99 難0.65", "s": 0.668, "f": 0}, {"x": 0.989, "y": 0.603, "c": "近傍", "n": "Time to Air [A]  n=3596 cos0.99 難0.60", "s": 0.98, "f": 0}, {"x": 0.993, "y": 0.285, "c": "近傍", "n": "Fervidex [A]  n=3422 cos0.99 難0.29", "s": 0.932, "f": 0}, {"x": 0.989, "y": 0.391, "c": "近傍", "n": "華蝶風雪 [A]  n=3529 cos0.99 難0.39", "s": 0.961, "f": 0}, {"x": 0.987, "y": 0.602, "c": "近傍", "n": "THE DETONATOR [A]  n=3234 cos0.99 難0.60", "s": 0.881, "f": 0}, {"x": 0.989, "y": 0.311, "c": "近傍", "n": "lowercase lifetime [A]  n=1449 cos0.99 難0.31", "s": 0.395, "f": 0}, {"x": 0.985, "y": 0.489, "c": "近傍", "n": "rainbow rainbow [A]  n=3312 cos0.99 難0.49", "s": 0.902, "f": 0}, {"x": 0.988, "y": 0.313, "c": "近傍", "n": "≡+≡ [A]  n=2291 cos0.99 難0.31", "s": 0.624, "f": 0}, {"x": 0.986, "y": 0.639, "c": "近傍", "n": "錬成人間トリコロイダー [A]  n=2945 cos0.99 難0.64", "s": 0.802, "f": 0}, {"x": 0.986, "y": 0.392, "c": "近傍", "n": "ELYSIUM [A]  n=1499 cos0.99 難0.39", "s": 0.408, "f": 0}, {"x": 0.992, "y": 0.226, "c": "近傍", "n": "DAWN -THE NEXT ENDEAVOUR- [A]  n=3405 cos0.99 難0.23", "s": 0.928, "f": 0}, {"x": 0.985, "y": 0.389, "c": "近傍", "n": "Cookie Bouquets [A]  n=3618 cos0.99 難0.39", "s": 0.986, "f": 0}, {"x": 0.991, "y": 0.808, "c": "近傍", "n": "Rampage [A]  n=3568 cos0.99 難0.81", "s": 0.972, "f": 0}, {"x": 0.992, "y": 0.206, "c": "近傍", "n": "KEY [A]  n=3457 cos0.99 難0.21", "s": 0.942, "f": 0}, {"x": 0.984, "y": 0.603, "c": "近傍", "n": "Garuda [A]  n=2805 cos0.98 難0.60", "s": 0.764, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.46021338028092784}, {"a": 0, "b": 2, "w": 0.34203595813659915}, {"a": 0, "b": 3, "w": 0.36293234525388485}, {"a": 0, "b": 4, "w": 0.32854373143313076}, {"a": 0, "b": 5, "w": 0.4560924097986455}, {"a": 0, "b": 6, "w": 0.38539873494074117}, {"a": 0, "b": 7, "w": 0.28562435309740297}, {"a": 0, "b": 8, "w": 0.36452137203890445}, {"a": 0, "b": 9, "w": 0.34810750504506094}, {"a": 0, "b": 10, "w": 0.2881824684183829}, {"a": 0, "b": 11, "w": 0.3381590920458778}, {"a": 0, "b": 12, "w": 0.26043477535909765}, {"a": 0, "b": 13, "w": 0.33480530932207453}, {"a": 0, "b": 14, "w": 0.1817163917258955}, {"a": 0, "b": 15, "w": 0.23440905772038623}, {"a": 0, "b": 16, "w": 0.3769828974376219}, {"a": 0, "b": 17, "w": 0.21195151855219907}, {"a": 0, "b": 18, "w": 3.507050205797668e-11}, {"a": 0, "b": 19, "w": 0.38546881258504184}, {"a": 0, "b": 20, "w": 0.22932530405249418}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=0.158,hiY=0.856;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
