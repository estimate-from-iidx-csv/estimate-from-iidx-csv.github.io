<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ristaccia [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.434, "c": "種", "n": "Ristaccia [H]  n=2300 cos1.00 難-0.43", "s": 0.71, "f": 0}, {"x": 0.993, "y": -0.507, "c": "近傍", "n": "Too Late Snow [A]  n=1376 cos0.99 難-0.51", "s": 0.425, "f": 0}, {"x": 0.993, "y": -0.324, "c": "近傍", "n": "Howling [A]  n=2820 cos0.99 難-0.32", "s": 0.871, "f": 0}, {"x": 0.992, "y": -0.336, "c": "近傍", "n": "オッド ラヴィ [A]  n=1487 cos0.99 難-0.34", "s": 0.459, "f": 0}, {"x": 0.991, "y": -0.384, "c": "近傍", "n": "Zirkfied [H]  n=2984 cos0.99 難-0.38", "s": 0.922, "f": 0}, {"x": 0.995, "y": -0.62, "c": "近傍", "n": "Feel The Beat [H]  n=2621 cos0.99 難-0.62", "s": 0.809, "f": 0}, {"x": 0.993, "y": -0.27, "c": "近傍", "n": "高高度降下低高度開傘 [A]  n=1285 cos0.99 難-0.27", "s": 0.397, "f": 0}, {"x": 0.995, "y": -0.648, "c": "近傍", "n": "Don't be afraid myself [H]  n=1640 cos0.99 難-0.65", "s": 0.506, "f": 0}, {"x": 0.99, "y": -0.331, "c": "近傍", "n": "INFERNO [A]  n=2472 cos0.99 難-0.33", "s": 0.763, "f": 0}, {"x": 0.992, "y": -0.253, "c": "近傍", "n": "GALGALIM [H]  n=2295 cos0.99 難-0.25", "s": 0.709, "f": 0}, {"x": 0.991, "y": -0.59, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1932 cos0.99 難-0.59", "s": 0.597, "f": 0}, {"x": 0.993, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.99 難-0.65", "s": 0.995, "f": 0}, {"x": 0.99, "y": -0.591, "c": "近傍", "n": "the shadow [H]  n=1899 cos0.99 難-0.59", "s": 0.586, "f": 0}, {"x": 0.988, "y": -0.388, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [H]  n=2983 cos0.99 難-0.39", "s": 0.921, "f": 0}, {"x": 0.991, "y": -0.229, "c": "近傍", "n": "Umbral [A]  n=3238 cos0.99 難-0.23", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.38, "c": "近傍", "n": "Ancient Scapes [H]  n=2486 cos0.99 難-0.38", "s": 0.768, "f": 0}, {"x": 0.993, "y": -0.177, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3105 cos0.99 難-0.18", "s": 0.959, "f": 0}, {"x": 0.991, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.504, "f": 0}, {"x": 0.992, "y": -0.193, "c": "近傍", "n": "SPEEDY CAT [A]  n=2409 cos0.99 難-0.19", "s": 0.744, "f": 0}, {"x": 0.989, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.854, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2892 cos0.99 難-0.25", "s": 0.893, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.13728285368629856}, {"a": 0, "b": 2, "w": 0.2969428722787778}, {"a": 0, "b": 3, "w": 5.991485085843351e-11}, {"a": 0, "b": 4, "w": 0.20445861485414407}, {"a": 0, "b": 5, "w": 0.17790074361946906}, {"a": 0, "b": 6, "w": 0.23154281669384735}, {"a": 0, "b": 7, "w": 0.3795225147645075}, {"a": 0, "b": 8, "w": 0.09796112481915242}, {"a": 0, "b": 9, "w": 0.20447799206448525}, {"a": 0, "b": 10, "w": 0.16957163118254448}, {"a": 0, "b": 11, "w": 0.2622315678487004}, {"a": 0, "b": 12, "w": 0.15542558500678216}, {"a": 0, "b": 13, "w": 0.08574650015800989}, {"a": 0, "b": 14, "w": 0.06692518906200373}, {"a": 0, "b": 15, "w": 0.03245829854052806}, {"a": 0, "b": 16, "w": 0.30290820065787416}, {"a": 0, "b": 17, "w": 0.16556109991708512}, {"a": 0, "b": 18, "w": 0.2611356692980723}, {"a": 0, "b": 19, "w": 0.10386306651655364}, {"a": 0, "b": 20, "w": 0.15459186369404954}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.689,hiY=-0.139;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
