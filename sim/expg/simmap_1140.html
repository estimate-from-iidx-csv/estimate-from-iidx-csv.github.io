<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">グラナダの風 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.121, "c": "種", "n": "グラナダの風 [A]  n=2828 cos1.00 難-0.12", "s": 0.784, "f": 0}, {"x": 0.993, "y": -0.078, "c": "近傍", "n": "HAT TRICK [A]  n=3212 cos0.99 難-0.08", "s": 0.89, "f": 0}, {"x": 0.993, "y": -0.022, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2693 cos0.99 難-0.02", "s": 0.746, "f": 0}, {"x": 0.993, "y": -0.257, "c": "近傍", "n": "ALL I NEED YOUR LOVE [A]  n=2483 cos0.99 難-0.26", "s": 0.688, "f": 0}, {"x": 0.994, "y": -0.304, "c": "近傍", "n": "ASTRAL VOYAGE [A]  n=2070 cos0.99 難-0.30", "s": 0.574, "f": 0}, {"x": 0.993, "y": 0.048, "c": "近傍", "n": "Feedback [A]  n=2741 cos0.99 難0.05", "s": 0.759, "f": 0}, {"x": 0.992, "y": -0.073, "c": "近傍", "n": "Amor De Verao [A]  n=3609 cos0.99 難-0.07", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.331, "c": "近傍", "n": "INFERNO [A]  n=2472 cos0.99 難-0.33", "s": 0.685, "f": 0}, {"x": 0.992, "y": -0.249, "c": "近傍", "n": "Hitch Hiker2 [L]  n=1872 cos0.99 難-0.25", "s": 0.519, "f": 0}, {"x": 0.991, "y": -0.063, "c": "近傍", "n": "Music is The Answer [A]  n=3019 cos0.99 難-0.06", "s": 0.837, "f": 0}, {"x": 0.992, "y": -0.305, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1401 cos0.99 難-0.30", "s": 0.388, "f": 0}, {"x": 0.992, "y": -0.302, "c": "近傍", "n": "WaterCube Pf.(RX-Ver.S.P.L.) [A]  n=967 cos0.99 難-0.30", "s": 0.268, "f": 0}, {"x": 0.99, "y": -0.094, "c": "近傍", "n": "Make Me Your Own [A]  n=2899 cos0.99 難-0.09", "s": 0.803, "f": 0}, {"x": 0.99, "y": -0.213, "c": "近傍", "n": "abstract [A]  n=2273 cos0.99 難-0.21", "s": 0.63, "f": 0}, {"x": 0.99, "y": -0.275, "c": "近傍", "n": "Summer Vacation(CU mix) [H]  n=2240 cos0.99 難-0.27", "s": 0.621, "f": 0}, {"x": 0.99, "y": -0.215, "c": "近傍", "n": "MAD ATTACK [A]  n=2731 cos0.99 難-0.21", "s": 0.757, "f": 0}, {"x": 0.989, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos0.99 難-0.11", "s": 0.898, "f": 0}, {"x": 0.992, "y": -0.423, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1009 cos0.99 難-0.42", "s": 0.28, "f": 0}, {"x": 0.989, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos0.99 難-0.18", "s": 0.774, "f": 0}, {"x": 0.99, "y": -0.321, "c": "近傍", "n": "Ganymede [H]  n=2741 cos0.99 難-0.32", "s": 0.759, "f": 0}, {"x": 0.989, "y": -0.266, "c": "近傍", "n": "太陽～T・A・I・Y・O～ [A]  n=2499 cos0.99 難-0.27", "s": 0.692, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 5.1068704820522726e-11}, {"a": 0, "b": 2, "w": 0.4036912244253922}, {"a": 0, "b": 3, "w": 0.3692863464174375}, {"a": 0, "b": 4, "w": 0.4332591577959536}, {"a": 0, "b": 5, "w": 0.3599332408717978}, {"a": 0, "b": 6, "w": 0.02578025661693062}, {"a": 0, "b": 7, "w": 0.40197837103002176}, {"a": 0, "b": 8, "w": 0.329788116279329}, {"a": 0, "b": 9, "w": 0.34490121867222956}, {"a": 0, "b": 10, "w": 0.15611330781658372}, {"a": 0, "b": 11, "w": 0.23502877124027077}, {"a": 0, "b": 12, "w": 0.13519954931561629}, {"a": 0, "b": 13, "w": 0.28000519284840875}, {"a": 0, "b": 14, "w": 0.3155224818399244}, {"a": 0, "b": 15, "w": 0.10953232538332269}, {"a": 0, "b": 16, "w": 0.23987240327231807}, {"a": 0, "b": 17, "w": 0.37952709586659816}, {"a": 0, "b": 18, "w": 0.251390484161357}, {"a": 0, "b": 19, "w": 0.18026019848593766}, {"a": 0, "b": 20, "w": 0.2688497726722764}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.460,hiY=0.086;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
