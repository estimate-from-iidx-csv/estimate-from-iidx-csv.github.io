<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">-65℃ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.731, "c": "種", "n": "-65℃ [A]  n=2211 cos1.00 難1.73", "s": 0.688, "f": 0}, {"x": 0.995, "y": 1.686, "c": "近傍", "n": "∀ [A]  n=2448 cos1.00 難1.69", "s": 0.761, "f": 0}, {"x": 0.994, "y": 1.757, "c": "近傍", "n": "THE F∀UST [A]  n=2478 cos0.99 難1.76", "s": 0.771, "f": 0}, {"x": 0.993, "y": 1.619, "c": "近傍", "n": "BLACK or WHITE? [A]  n=2316 cos0.99 難1.62", "s": 0.72, "f": 0}, {"x": 0.994, "y": 1.61, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2470 cos0.99 難1.61", "s": 0.768, "f": 0}, {"x": 0.992, "y": 1.648, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2351 cos0.99 難1.65", "s": 0.731, "f": 0}, {"x": 0.993, "y": 1.622, "c": "近傍", "n": "ZEPHYRANTHES [L]  n=2166 cos0.99 難1.62", "s": 0.674, "f": 0}, {"x": 0.993, "y": 1.6, "c": "近傍", "n": "Artist [A]  n=2457 cos0.99 難1.60", "s": 0.764, "f": 0}, {"x": 0.991, "y": 1.708, "c": "近傍", "n": "KAISER PHOENIX [A]  n=2965 cos0.99 難1.71", "s": 0.922, "f": 0}, {"x": 0.99, "y": 1.732, "c": "近傍", "n": "Elektrick U-Phoria [L]  n=1402 cos0.99 難1.73", "s": 0.436, "f": 0}, {"x": 0.993, "y": 1.569, "c": "近傍", "n": "VOLAQUAS [A]  n=1726 cos0.99 難1.57", "s": 0.537, "f": 0}, {"x": 0.989, "y": 1.725, "c": "近傍", "n": "Blue Spring Express [A]  n=2854 cos0.99 難1.73", "s": 0.887, "f": 0}, {"x": 0.99, "y": 1.812, "c": "近傍", "n": "共鳴遊戯の華 [A]  n=2986 cos0.99 難1.81", "s": 0.928, "f": 0}, {"x": 0.991, "y": 1.868, "c": "近傍", "n": "Binary Black Hole [A]  n=1874 cos0.99 難1.87", "s": 0.583, "f": 0}, {"x": 0.989, "y": 1.783, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1868 cos0.99 難1.78", "s": 0.581, "f": 0}, {"x": 0.989, "y": 1.656, "c": "近傍", "n": "Close the World feat.a☆ru [L]  n=2852 cos0.99 難1.66", "s": 0.887, "f": 0}, {"x": 0.988, "y": 1.741, "c": "近傍", "n": "Ancient Scapes [L]  n=2620 cos0.99 難1.74", "s": 0.815, "f": 0}, {"x": 0.991, "y": 1.552, "c": "近傍", "n": "DORNWALD ～Junge～ [A]  n=3066 cos0.99 難1.55", "s": 0.953, "f": 0}, {"x": 0.988, "y": 1.724, "c": "近傍", "n": "君のハートにロックオン [L]  n=1864 cos0.99 難1.72", "s": 0.58, "f": 0}, {"x": 0.988, "y": 1.715, "c": "近傍", "n": "Bow shock!! [L]  n=885 cos0.99 難1.72", "s": 0.275, "f": 0}, {"x": 0.993, "y": 1.509, "c": "近傍", "n": "quell～the seventh slave～ [A]  n=3216 cos0.99 難1.51", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5637496744229724}, {"a": 0, "b": 2, "w": 0.4913179628352028}, {"a": 0, "b": 3, "w": 0.3914404854704676}, {"a": 0, "b": 4, "w": 0.4787566124389283}, {"a": 0, "b": 5, "w": 2.736799675773227e-11}, {"a": 0, "b": 6, "w": 0.4152271327387117}, {"a": 0, "b": 7, "w": 0.45010965322123175}, {"a": 0, "b": 8, "w": 0.3731597993502501}, {"a": 0, "b": 9, "w": 0.358399648332563}, {"a": 0, "b": 10, "w": 0.47818224706291956}, {"a": 0, "b": 11, "w": 0.3193676460630376}, {"a": 0, "b": 12, "w": 0.3537600161080102}, {"a": 0, "b": 13, "w": 0.2893650874671686}, {"a": 0, "b": 14, "w": 0.30181396185816256}, {"a": 0, "b": 15, "w": 0.2973549340806936}, {"a": 0, "b": 16, "w": 0.2936252323383054}, {"a": 0, "b": 17, "w": 0.3193307036760119}, {"a": 0, "b": 18, "w": 0.11635118968449465}, {"a": 0, "b": 19, "w": 0.2413829427933094}, {"a": 0, "b": 20, "w": 0.38669899807562824}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=1.480,hiY=1.897;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
