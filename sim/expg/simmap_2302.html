<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ユミル [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.566, "c": "種", "n": "ユミル [A]  n=3392 cos1.00 難0.57", "s": 0.971, "f": 0}, {"x": 0.996, "y": 0.602, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3369 cos1.00 難0.60", "s": 0.965, "f": 0}, {"x": 0.995, "y": 0.545, "c": "近傍", "n": "VEGA [A]  n=3492 cos1.00 難0.55", "s": 1.0, "f": 0}, {"x": 0.996, "y": 0.488, "c": "近傍", "n": "Primitive Vibes [A]  n=3443 cos1.00 難0.49", "s": 0.986, "f": 0}, {"x": 0.997, "y": 0.429, "c": "近傍", "n": "Moving on [A]  n=3011 cos1.00 難0.43", "s": 0.862, "f": 0}, {"x": 0.994, "y": 0.597, "c": "近傍", "n": "Violet Rose [A]  n=3138 cos0.99 難0.60", "s": 0.899, "f": 0}, {"x": 0.994, "y": 0.519, "c": "近傍", "n": "Secrets [A]  n=3363 cos0.99 難0.52", "s": 0.963, "f": 0}, {"x": 0.995, "y": 0.488, "c": "近傍", "n": "Kung-fu Empire [A]  n=3460 cos0.99 難0.49", "s": 0.991, "f": 0}, {"x": 0.994, "y": 0.601, "c": "近傍", "n": "Be OK [L]  n=2611 cos0.99 難0.60", "s": 0.748, "f": 0}, {"x": 0.993, "y": 0.54, "c": "近傍", "n": "BRAVE OUT [L]  n=693 cos0.99 難0.54", "s": 0.198, "f": 0}, {"x": 0.993, "y": 0.596, "c": "近傍", "n": "ALL MY TURN -このターンに、オレの全てを賭ける- [A]  n=3259 cos0.99 難0.60", "s": 0.933, "f": 0}, {"x": 0.995, "y": 0.731, "c": "近傍", "n": "HAPPY★RUSH [A]  n=3198 cos0.99 難0.73", "s": 0.916, "f": 0}, {"x": 0.996, "y": 0.382, "c": "近傍", "n": "ウツシミウツシ [A]  n=2334 cos1.00 難0.38", "s": 0.668, "f": 0}, {"x": 0.993, "y": 0.679, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3234 cos0.99 難0.68", "s": 0.926, "f": 0}, {"x": 0.993, "y": 0.677, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1835 cos0.99 難0.68", "s": 0.525, "f": 0}, {"x": 0.995, "y": 0.728, "c": "近傍", "n": "Usual Days-remix [A]  n=3078 cos0.99 難0.73", "s": 0.881, "f": 0}, {"x": 0.996, "y": 0.369, "c": "近傍", "n": "LAST DAY [A]  n=2627 cos1.00 難0.37", "s": 0.752, "f": 0}, {"x": 0.993, "y": 0.64, "c": "近傍", "n": "THE CANNONBALLER [A]  n=3342 cos0.99 難0.64", "s": 0.957, "f": 0}, {"x": 0.992, "y": 0.603, "c": "近傍", "n": "UNDERWORLD HOLOGRAPHY [A]  n=2875 cos0.99 難0.60", "s": 0.823, "f": 0}, {"x": 0.992, "y": 0.593, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3023 cos0.99 難0.59", "s": 0.866, "f": 0}, {"x": 0.993, "y": 0.458, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3261 cos0.99 難0.46", "s": 0.934, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3531143571264419}, {"a": 0, "b": 2, "w": 0.022320518126240918}, {"a": 0, "b": 3, "w": 0.2709356846226152}, {"a": 0, "b": 4, "w": 0.35724253409801987}, {"a": 0, "b": 5, "w": 0.2631616703734445}, {"a": 0, "b": 6, "w": 0.17777835324292401}, {"a": 0, "b": 7, "w": 0.2685986148660082}, {"a": 0, "b": 8, "w": 0.15148328655888943}, {"a": 0, "b": 9, "w": 0.15004274261532102}, {"a": 0, "b": 10, "w": 0.18201836584339626}, {"a": 0, "b": 11, "w": 0.049412094572274357}, {"a": 0, "b": 12, "w": 0.33602026579405286}, {"a": 0, "b": 13, "w": 0.007452448685969726}, {"a": 0, "b": 14, "w": 0.05212055464155352}, {"a": 0, "b": 15, "w": 0.15739556798777754}, {"a": 0, "b": 16, "w": 0.36221433679318293}, {"a": 0, "b": 17, "w": 5.5744964200243885e-11}, {"a": 0, "b": 18, "w": 0.03967731237730143}, {"a": 0, "b": 19, "w": 0.14782698230249436}, {"a": 0, "b": 20, "w": 0.17838769905040208}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=0.340,hiY=0.760;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
