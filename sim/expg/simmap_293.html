<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DAWN -THE NEXT ENDEAVOUR- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.734, "c": "種", "n": "DAWN -THE NEXT ENDEAVOUR- [H]  n=1804 cos1.00 難-0.73", "s": 0.553, "f": 0}, {"x": 0.992, "y": -0.607, "c": "近傍", "n": "Shooting Star [A]  n=1056 cos0.99 難-0.61", "s": 0.324, "f": 0}, {"x": 0.994, "y": -0.489, "c": "近傍", "n": "閉塞的フレーション [A]  n=1552 cos0.99 難-0.49", "s": 0.476, "f": 0}, {"x": 0.991, "y": -0.547, "c": "近傍", "n": "Idola [H]  n=3057 cos0.99 難-0.55", "s": 0.937, "f": 0}, {"x": 0.996, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos1.00 難-0.35", "s": 0.923, "f": 0}, {"x": 0.991, "y": -0.498, "c": "近傍", "n": "エクスプロウル [A]  n=1128 cos0.99 難-0.50", "s": 0.346, "f": 0}, {"x": 0.994, "y": -0.397, "c": "近傍", "n": "ここからよろしく大作戦143 [A]  n=2655 cos0.99 難-0.40", "s": 0.814, "f": 0}, {"x": 0.993, "y": -0.416, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3120 cos0.99 難-0.42", "s": 0.957, "f": 0}, {"x": 0.989, "y": -0.795, "c": "近傍", "n": "LEMON MELON COOKIE [A]  n=1079 cos0.99 難-0.79", "s": 0.331, "f": 0}, {"x": 0.996, "y": -0.328, "c": "近傍", "n": "Take It Easy [H]  n=2266 cos1.00 難-0.33", "s": 0.695, "f": 0}, {"x": 0.99, "y": -0.958, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1826 cos0.99 難-0.96", "s": 0.56, "f": 0}, {"x": 0.989, "y": -0.947, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [H]  n=2277 cos0.99 難-0.95", "s": 0.698, "f": 0}, {"x": 0.992, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos0.99 難-0.37", "s": 0.646, "f": 0}, {"x": 0.988, "y": -0.825, "c": "近傍", "n": "LOVELY STORM [H]  n=1962 cos0.99 難-0.83", "s": 0.602, "f": 0}, {"x": 0.988, "y": -0.882, "c": "近傍", "n": "凛として咲く花の如く [H]  n=3261 cos0.99 難-0.88", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.607, "c": "近傍", "n": "バブリン [A]  n=1138 cos0.99 難-0.61", "s": 0.349, "f": 0}, {"x": 0.987, "y": -0.762, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2527 cos0.99 難-0.76", "s": 0.775, "f": 0}, {"x": 0.992, "y": -1.109, "c": "近傍", "n": "Rave Patroller [H]  n=1626 cos0.99 難-1.11", "s": 0.499, "f": 0}, {"x": 0.988, "y": -0.509, "c": "近傍", "n": "オドループ [A]  n=2802 cos0.99 難-0.51", "s": 0.859, "f": 0}, {"x": 0.99, "y": -0.43, "c": "近傍", "n": "きゅうくらりん [A]  n=1301 cos0.99 難-0.43", "s": 0.399, "f": 0}, {"x": 0.997, "y": -0.254, "c": "近傍", "n": "SOUND OF GIALLARHORN [H]  n=2407 cos1.00 難-0.25", "s": 0.738, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28232971395528506}, {"a": 0, "b": 2, "w": 0.3094389424292948}, {"a": 0, "b": 3, "w": 0.24417421071027412}, {"a": 0, "b": 4, "w": 0.5171019140617138}, {"a": 0, "b": 5, "w": 0.22481478395208598}, {"a": 0, "b": 6, "w": 0.3480101887230087}, {"a": 0, "b": 7, "w": 0.3025606749541928}, {"a": 0, "b": 8, "w": 0.11228862166081977}, {"a": 0, "b": 9, "w": 0.4884895550818972}, {"a": 0, "b": 10, "w": 0.046199828873814686}, {"a": 0, "b": 11, "w": 0.11777097419498928}, {"a": 0, "b": 12, "w": 0.21270914169050548}, {"a": 0, "b": 13, "w": 0.11066009984398706}, {"a": 0, "b": 14, "w": 0.04944748627186668}, {"a": 0, "b": 15, "w": 5.751310538926191e-11}, {"a": 0, "b": 16, "w": 0.06216312911166122}, {"a": 0, "b": 17, "w": 0.21385441930442894}, {"a": 0, "b": 18, "w": 0.11638746352825047}, {"a": 0, "b": 19, "w": 0.16754422958396764}, {"a": 0, "b": 20, "w": 0.34850816155901787}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.177,hiY=-0.186;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
