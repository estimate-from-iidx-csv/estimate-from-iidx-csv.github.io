<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Limelight [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.046, "c": "種", "n": "Limelight [A]  n=245 cos1.00 難1.05", "s": 0.067, "f": 0}, {"x": 0.995, "y": 1.082, "c": "近傍", "n": "oratio [A]  n=3445 cos0.99 難1.08", "s": 0.945, "f": 0}, {"x": 0.994, "y": 1.031, "c": "近傍", "n": "Scripted Connection⇒ H mix [L]  n=1416 cos0.99 難1.03", "s": 0.388, "f": 0}, {"x": 0.993, "y": 1.02, "c": "近傍", "n": "終焔のClaudia [A]  n=1703 cos0.99 難1.02", "s": 0.467, "f": 0}, {"x": 0.993, "y": 1.005, "c": "近傍", "n": "Persephone [A]  n=3431 cos0.99 難1.00", "s": 0.941, "f": 0}, {"x": 0.993, "y": 1.057, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [A]  n=3465 cos0.99 難1.06", "s": 0.95, "f": 0}, {"x": 0.994, "y": 0.943, "c": "近傍", "n": "V [A]  n=3647 cos0.99 難0.94", "s": 1.0, "f": 0}, {"x": 0.993, "y": 1.02, "c": "近傍", "n": "天邪鬼 [A]  n=2439 cos0.99 難1.02", "s": 0.669, "f": 0}, {"x": 0.993, "y": 1.115, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [A]  n=1007 cos0.99 難1.11", "s": 0.276, "f": 0}, {"x": 0.993, "y": 1.118, "c": "近傍", "n": "Candy Galy [A]  n=3379 cos0.99 難1.12", "s": 0.927, "f": 0}, {"x": 0.992, "y": 1.083, "c": "近傍", "n": "Dahlia [A]  n=1919 cos0.99 難1.08", "s": 0.526, "f": 0}, {"x": 0.992, "y": 1.154, "c": "近傍", "n": "Always We Trust In You [A]  n=1758 cos0.99 難1.15", "s": 0.482, "f": 0}, {"x": 0.993, "y": 1.203, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3451 cos0.99 難1.20", "s": 0.946, "f": 0}, {"x": 0.992, "y": 0.891, "c": "近傍", "n": "#CMFLG [A]  n=1949 cos0.99 難0.89", "s": 0.534, "f": 0}, {"x": 0.992, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.99 難0.89", "s": 0.293, "f": 0}, {"x": 0.991, "y": 1.172, "c": "近傍", "n": "Chaotoxin [A]  n=1942 cos0.99 難1.17", "s": 0.532, "f": 0}, {"x": 0.991, "y": 1.181, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2193 cos0.99 難1.18", "s": 0.601, "f": 0}, {"x": 0.993, "y": 0.87, "c": "近傍", "n": "Begin [A]  n=996 cos0.99 難0.87", "s": 0.273, "f": 0}, {"x": 0.99, "y": 1.102, "c": "近傍", "n": "Nightmare before oversleep [A]  n=3452 cos0.99 難1.10", "s": 0.947, "f": 0}, {"x": 0.99, "y": 0.98, "c": "近傍", "n": "moon_child [A]  n=3570 cos0.99 難0.98", "s": 0.979, "f": 0}, {"x": 0.989, "y": 1.023, "c": "近傍", "n": "Super Freak [A]  n=2088 cos0.99 難1.02", "s": 0.573, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.39351720723939565}, {"a": 0, "b": 2, "w": 0.40850047095372644}, {"a": 0, "b": 3, "w": 0.3967772933973511}, {"a": 0, "b": 4, "w": 0.40243323546887655}, {"a": 0, "b": 5, "w": 0.36538793379665147}, {"a": 0, "b": 6, "w": 0.4426478408843332}, {"a": 0, "b": 7, "w": 0.31449104418834406}, {"a": 0, "b": 8, "w": 0.12821746444795146}, {"a": 0, "b": 9, "w": 0.17632003487091552}, {"a": 0, "b": 10, "w": 0.25809976644556654}, {"a": 0, "b": 11, "w": 0.21170427876866593}, {"a": 0, "b": 12, "w": 0.1502446344527656}, {"a": 0, "b": 13, "w": 0.3436927764107758}, {"a": 0, "b": 14, "w": 0.3686826257434892}, {"a": 0, "b": 15, "w": 0.26010397981014477}, {"a": 0, "b": 16, "w": 3.746603027821038e-11}, {"a": 0, "b": 17, "w": 0.38417835305269665}, {"a": 0, "b": 18, "w": 0.27614958874631135}, {"a": 0, "b": 19, "w": 0.14136648920359862}, {"a": 0, "b": 20, "w": 0.1333763925982009}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.843,hiY=1.230;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
