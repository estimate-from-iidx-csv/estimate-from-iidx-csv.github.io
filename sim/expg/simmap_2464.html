<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">オドループ [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.125, "c": "種", "n": "オドループ [L]  n=1825 cos1.00 難-0.12", "s": 0.494, "f": 0}, {"x": 0.996, "y": 0.076, "c": "近傍", "n": "Element of SPADA [L]  n=1859 cos1.00 難0.08", "s": 0.503, "f": 0}, {"x": 0.992, "y": -0.291, "c": "近傍", "n": "オーバーライド [A]  n=841 cos0.99 難-0.29", "s": 0.227, "f": 0}, {"x": 0.989, "y": -0.04, "c": "近傍", "n": "Shadow World [A]  n=2319 cos0.99 難-0.04", "s": 0.627, "f": 0}, {"x": 0.989, "y": -0.248, "c": "近傍", "n": "EDEN [A]  n=3697 cos0.99 難-0.25", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.186, "c": "近傍", "n": "Aeterna [A]  n=1751 cos0.99 難-0.19", "s": 0.474, "f": 0}, {"x": 0.986, "y": -0.076, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [A]  n=2764 cos0.99 難-0.08", "s": 0.748, "f": 0}, {"x": 0.988, "y": -0.3, "c": "近傍", "n": "Sugarplum [A]  n=2364 cos0.99 難-0.30", "s": 0.639, "f": 0}, {"x": 0.985, "y": -0.178, "c": "近傍", "n": "DAYDREAMER [A]  n=3282 cos0.99 難-0.18", "s": 0.888, "f": 0}, {"x": 0.986, "y": -0.254, "c": "近傍", "n": "湘南ロンリーMIDNIGHT RAIN [A]  n=1877 cos0.99 難-0.25", "s": 0.508, "f": 0}, {"x": 0.985, "y": -0.191, "c": "近傍", "n": "タンポポ [A]  n=706 cos0.98 難-0.19", "s": 0.191, "f": 0}, {"x": 0.984, "y": -0.035, "c": "近傍", "n": "グッバイ宣言 [A]  n=2492 cos0.98 難-0.03", "s": 0.674, "f": 0}, {"x": 0.99, "y": -0.381, "c": "近傍", "n": "Crank It [A]  n=2604 cos0.99 難-0.38", "s": 0.704, "f": 0}, {"x": 0.985, "y": 0.032, "c": "近傍", "n": "ハオ [A]  n=1359 cos0.99 難0.03", "s": 0.368, "f": 0}, {"x": 0.985, "y": -0.301, "c": "近傍", "n": "翼 [L]  n=2115 cos0.99 難-0.30", "s": 0.572, "f": 0}, {"x": 0.982, "y": -0.2, "c": "近傍", "n": "NEEDLESS MY LOVE FOR YOU [A]  n=1165 cos0.98 難-0.20", "s": 0.315, "f": 0}, {"x": 0.981, "y": -0.085, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3081 cos0.98 難-0.08", "s": 0.833, "f": 0}, {"x": 0.993, "y": 0.246, "c": "近傍", "n": "怪物 [L]  n=1255 cos0.99 難0.25", "s": 0.339, "f": 0}, {"x": 0.987, "y": 0.161, "c": "近傍", "n": "バッドエンド・シンドローム [A]  n=2752 cos0.99 難0.16", "s": 0.744, "f": 0}, {"x": 0.981, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.98 難-0.01", "s": 0.642, "f": 0}, {"x": 0.981, "y": -0.274, "c": "近傍", "n": "ハリツヤランデヴー [A]  n=2417 cos0.98 難-0.27", "s": 0.654, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5588413209964411}, {"a": 0, "b": 2, "w": 0.3948305433825203}, {"a": 0, "b": 3, "w": 0.2713631944379661}, {"a": 0, "b": 4, "w": 0.280601100819561}, {"a": 0, "b": 5, "w": 0.2796834034911564}, {"a": 0, "b": 6, "w": 0.24804136275736233}, {"a": 0, "b": 7, "w": 0.1721840405611651}, {"a": 0, "b": 8, "w": 0.10582523929200205}, {"a": 0, "b": 9, "w": 0.23554820931233666}, {"a": 0, "b": 10, "w": 0.20719470281274954}, {"a": 0, "b": 11, "w": 0.17711854842140773}, {"a": 0, "b": 12, "w": 0.14798049600658503}, {"a": 0, "b": 13, "w": 0.20826905905361814}, {"a": 0, "b": 14, "w": 3.874300880113424e-11}, {"a": 0, "b": 15, "w": 0.0521220906884029}, {"a": 0, "b": 16, "w": 0.017262317601115407}, {"a": 0, "b": 17, "w": 0.10954360517099615}, {"a": 0, "b": 18, "w": 0.2380309258261636}, {"a": 0, "b": 19, "w": 0.0771407873078157}, {"a": 0, "b": 20, "w": 0.023712442642880305}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=-0.432,hiY=0.296;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
