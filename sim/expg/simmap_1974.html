<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Love Is Eternity [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.073, "c": "種", "n": "Love Is Eternity [A]  n=3528 cos1.00 難0.07", "s": 0.946, "f": 0}, {"x": 0.997, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos1.00 難-0.11", "s": 0.869, "f": 0}, {"x": 0.995, "y": -0.034, "c": "近傍", "n": "ANDROMEDA II [A]  n=3021 cos1.00 難-0.03", "s": 0.81, "f": 0}, {"x": 0.995, "y": 0.179, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3577 cos1.00 難0.18", "s": 0.959, "f": 0}, {"x": 0.995, "y": -0.048, "c": "近傍", "n": "Back Into The Light [A]  n=3041 cos0.99 難-0.05", "s": 0.816, "f": 0}, {"x": 0.995, "y": -0.106, "c": "近傍", "n": "BLO§OM [A]  n=2553 cos1.00 難-0.11", "s": 0.685, "f": 0}, {"x": 0.995, "y": -0.089, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2946 cos0.99 難-0.09", "s": 0.79, "f": 0}, {"x": 0.994, "y": -0.022, "c": "近傍", "n": "Get'em up to R.A.V.E [A]  n=2693 cos0.99 難-0.02", "s": 0.722, "f": 0}, {"x": 0.994, "y": -0.054, "c": "近傍", "n": "Farewell to Marrakech [A]  n=2903 cos0.99 難-0.05", "s": 0.779, "f": 0}, {"x": 0.995, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos0.99 難-0.10", "s": 0.852, "f": 0}, {"x": 0.993, "y": 0.035, "c": "近傍", "n": "ZERO-ONE [A]  n=2948 cos0.99 難0.03", "s": 0.791, "f": 0}, {"x": 0.993, "y": 0.077, "c": "近傍", "n": "Change Yourself [A]  n=3044 cos0.99 難0.08", "s": 0.817, "f": 0}, {"x": 0.993, "y": 0.14, "c": "近傍", "n": "BROKEN EDEN [A]  n=3523 cos0.99 難0.14", "s": 0.945, "f": 0}, {"x": 0.994, "y": -0.082, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2791 cos0.99 難-0.08", "s": 0.749, "f": 0}, {"x": 0.994, "y": -0.179, "c": "近傍", "n": "Rainstorm [A]  n=2795 cos0.99 難-0.18", "s": 0.75, "f": 0}, {"x": 0.992, "y": 0.082, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2613 cos0.99 難0.08", "s": 0.701, "f": 0}, {"x": 0.992, "y": 0.087, "c": "近傍", "n": "refractive index [A]  n=3625 cos0.99 難0.09", "s": 0.972, "f": 0}, {"x": 0.993, "y": -0.154, "c": "近傍", "n": "閃と雷管とロープ [A]  n=1098 cos0.99 難-0.15", "s": 0.295, "f": 0}, {"x": 0.993, "y": -0.134, "c": "近傍", "n": "Daisuke [A]  n=3728 cos0.99 難-0.13", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos0.99 難-0.11", "s": 0.838, "f": 0}, {"x": 0.991, "y": 0.005, "c": "近傍", "n": "Hallucination [A]  n=722 cos0.99 難0.01", "s": 0.194, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.7032148594229002}, {"a": 0, "b": 2, "w": 0.5314244569787873}, {"a": 0, "b": 3, "w": 0.3934599864047569}, {"a": 0, "b": 4, "w": 0.5896743422273922}, {"a": 0, "b": 5, "w": 0.46738685146970804}, {"a": 0, "b": 6, "w": 0.49295168447179827}, {"a": 0, "b": 7, "w": 0.5794522591842195}, {"a": 0, "b": 8, "w": 0.5704323837939731}, {"a": 0, "b": 9, "w": 0.5702811837981148}, {"a": 0, "b": 10, "w": 0.5253618088596979}, {"a": 0, "b": 11, "w": 0.13588349198302452}, {"a": 0, "b": 12, "w": 0.32271394258113584}, {"a": 0, "b": 13, "w": 0.5720467280120338}, {"a": 0, "b": 14, "w": 0.594167805263122}, {"a": 0, "b": 15, "w": 0.44218369689655934}, {"a": 0, "b": 16, "w": 0.11364211067403462}, {"a": 0, "b": 17, "w": 0.3949763015789045}, {"a": 0, "b": 18, "w": 0.42220466670787804}, {"a": 0, "b": 19, "w": 0.4738848746663772}, {"a": 0, "b": 20, "w": 3.8469671892471524e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.207,hiY=0.207;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
