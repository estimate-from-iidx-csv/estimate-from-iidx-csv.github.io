<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Echoes of Sunfall [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.646, "c": "種", "n": "Echoes of Sunfall [A]  n=1772 cos1.00 難0.65", "s": 0.474, "f": 0}, {"x": 0.995, "y": 0.648, "c": "近傍", "n": "FLOWER [A]  n=3679 cos0.99 難0.65", "s": 0.983, "f": 0}, {"x": 0.996, "y": 0.743, "c": "近傍", "n": "COSMIC CYBER [A]  n=2563 cos1.00 難0.74", "s": 0.685, "f": 0}, {"x": 0.995, "y": 0.715, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3091 cos0.99 難0.72", "s": 0.826, "f": 0}, {"x": 0.996, "y": 0.54, "c": "近傍", "n": "BRAVE OUT [L]  n=693 cos1.00 難0.54", "s": 0.185, "f": 0}, {"x": 0.994, "y": 0.677, "c": "近傍", "n": "《PL|RAYER》 [A]  n=1835 cos0.99 難0.68", "s": 0.491, "f": 0}, {"x": 0.995, "y": 0.529, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [A]  n=2690 cos0.99 難0.53", "s": 0.719, "f": 0}, {"x": 0.996, "y": 0.498, "c": "近傍", "n": "No.13 [A]  n=3460 cos1.00 難0.50", "s": 0.925, "f": 0}, {"x": 0.995, "y": 0.796, "c": "近傍", "n": "Pollinosis [A]  n=3352 cos0.99 難0.80", "s": 0.896, "f": 0}, {"x": 0.996, "y": 0.82, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3706 cos1.00 難0.82", "s": 0.991, "f": 0}, {"x": 0.993, "y": 0.71, "c": "近傍", "n": "STELLAR WIND [A]  n=3201 cos0.99 難0.71", "s": 0.856, "f": 0}, {"x": 0.993, "y": 0.742, "c": "近傍", "n": "紅牡丹 [A]  n=3741 cos0.99 難0.74", "s": 1.0, "f": 0}, {"x": 0.997, "y": 0.453, "c": "近傍", "n": "DESIRE [A]  n=3352 cos1.00 難0.45", "s": 0.896, "f": 0}, {"x": 0.995, "y": 0.82, "c": "近傍", "n": "RALLY '25 [A]  n=1102 cos1.00 難0.82", "s": 0.295, "f": 0}, {"x": 0.992, "y": 0.698, "c": "近傍", "n": "THE FALLEN [A]  n=3130 cos0.99 難0.70", "s": 0.837, "f": 0}, {"x": 0.992, "y": 0.679, "c": "近傍", "n": "I will be back -オレは帰ってきた- [A]  n=3234 cos0.99 難0.68", "s": 0.864, "f": 0}, {"x": 0.994, "y": 0.491, "c": "近傍", "n": "DROP [A]  n=3226 cos0.99 難0.49", "s": 0.862, "f": 0}, {"x": 0.992, "y": 0.637, "c": "近傍", "n": "Giudecca [A]  n=3153 cos0.99 難0.64", "s": 0.843, "f": 0}, {"x": 0.992, "y": 0.525, "c": "近傍", "n": "ALBA -黎明- [A]  n=3637 cos0.99 難0.53", "s": 0.972, "f": 0}, {"x": 0.997, "y": 0.411, "c": "近傍", "n": "Flash Back 90's [L]  n=1984 cos1.00 難0.41", "s": 0.53, "f": 0}, {"x": 0.991, "y": 0.64, "c": "近傍", "n": "THE CANNONBALLER [A]  n=3342 cos0.99 難0.64", "s": 0.893, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.43486452771712714}, {"a": 0, "b": 2, "w": 0.5029510575543612}, {"a": 0, "b": 3, "w": 0.25519553551277185}, {"a": 0, "b": 4, "w": 0.1480114222196416}, {"a": 0, "b": 5, "w": 0.4015873218738586}, {"a": 0, "b": 6, "w": 0.1747945829217914}, {"a": 0, "b": 7, "w": 0.4938414668164606}, {"a": 0, "b": 8, "w": 0.2148167855686498}, {"a": 0, "b": 9, "w": 0.5107734756495687}, {"a": 0, "b": 10, "w": 0.15204440257864038}, {"a": 0, "b": 11, "w": 0.36007571325154464}, {"a": 0, "b": 12, "w": 0.4922885353576829}, {"a": 0, "b": 13, "w": 0.46704218623552163}, {"a": 0, "b": 14, "w": 0.27738122177151503}, {"a": 0, "b": 15, "w": 0.32768873480677896}, {"a": 0, "b": 16, "w": 0.1001904603101571}, {"a": 0, "b": 17, "w": 3.938738224462668e-11}, {"a": 0, "b": 18, "w": 0.2671785781163478}, {"a": 0, "b": 19, "w": 0.37817970740972895}, {"a": 0, "b": 20, "w": 0.2842263858160494}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=0.379,hiY=0.853;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
