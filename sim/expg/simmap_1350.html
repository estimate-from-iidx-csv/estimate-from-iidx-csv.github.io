<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Flamingo [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.105, "c": "種", "n": "Flamingo [H]  n=336 cos1.00 難-1.10", "s": 0.134, "f": 0}, {"x": 0.998, "y": -1.183, "c": "近傍", "n": "Cross Fire [H]  n=534 cos1.00 難-1.18", "s": 0.213, "f": 0}, {"x": 0.996, "y": -1.167, "c": "近傍", "n": "RALLY '25 [H]  n=746 cos1.00 難-1.17", "s": 0.298, "f": 0}, {"x": 0.996, "y": -1.059, "c": "近傍", "n": "u gotta beat [H]  n=946 cos1.00 難-1.06", "s": 0.378, "f": 0}, {"x": 0.997, "y": -0.981, "c": "近傍", "n": "Catch Our Fire! [H]  n=1838 cos1.00 難-0.98", "s": 0.734, "f": 0}, {"x": 0.995, "y": -1.106, "c": "近傍", "n": "Fegrix [H]  n=1714 cos0.99 難-1.11", "s": 0.685, "f": 0}, {"x": 0.995, "y": -1.025, "c": "近傍", "n": "夕焼け ～Fading Day～ [H]  n=1323 cos1.00 難-1.03", "s": 0.529, "f": 0}, {"x": 0.994, "y": -1.077, "c": "近傍", "n": "Dahlia [H]  n=1107 cos0.99 難-1.08", "s": 0.442, "f": 0}, {"x": 0.994, "y": -1.129, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=606 cos0.99 難-1.13", "s": 0.242, "f": 0}, {"x": 0.995, "y": -1.204, "c": "近傍", "n": "2 Beasts Unchained [H]  n=1149 cos1.00 難-1.20", "s": 0.459, "f": 0}, {"x": 0.993, "y": -1.104, "c": "近傍", "n": "閠槞彁の願い [H]  n=1555 cos0.99 難-1.10", "s": 0.621, "f": 0}, {"x": 0.996, "y": -0.958, "c": "近傍", "n": "Caterpillar [H]  n=2200 cos1.00 難-0.96", "s": 0.879, "f": 0}, {"x": 0.993, "y": -1.123, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=607 cos0.99 難-1.12", "s": 0.243, "f": 0}, {"x": 0.995, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.482, "f": 0}, {"x": 0.994, "y": -0.996, "c": "近傍", "n": "EVANESCENT [H]  n=1485 cos0.99 難-1.00", "s": 0.593, "f": 0}, {"x": 0.994, "y": -0.966, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2503 cos0.99 難-0.97", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.916, "c": "近傍", "n": "PUNISHER [H]  n=2321 cos1.00 難-0.92", "s": 0.927, "f": 0}, {"x": 0.992, "y": -1.112, "c": "近傍", "n": "Smalt #28598F [H]  n=1299 cos0.99 難-1.11", "s": 0.519, "f": 0}, {"x": 0.992, "y": -1.163, "c": "近傍", "n": "Bad Encryption [H]  n=1499 cos0.99 難-1.16", "s": 0.599, "f": 0}, {"x": 0.993, "y": -1.243, "c": "近傍", "n": "MARLIN [H]  n=503 cos0.99 難-1.24", "s": 0.201, "f": 0}, {"x": 0.992, "y": -1.163, "c": "近傍", "n": "EBONY & IVORY [H]  n=1768 cos0.99 難-1.16", "s": 0.706, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5385785568496417}, {"a": 0, "b": 2, "w": 0.1421937067944462}, {"a": 0, "b": 3, "w": 0.40346924856050737}, {"a": 0, "b": 4, "w": 0.4942350094334438}, {"a": 0, "b": 5, "w": 0.16326144797728237}, {"a": 0, "b": 6, "w": 0.10036623248785292}, {"a": 0, "b": 7, "w": 0.36495561595786596}, {"a": 0, "b": 8, "w": 0.3513076411880942}, {"a": 0, "b": 9, "w": 0.30209203444579813}, {"a": 0, "b": 10, "w": 0.28837535877882725}, {"a": 0, "b": 11, "w": 0.23728341400995223}, {"a": 0, "b": 12, "w": 0.2821286761648878}, {"a": 0, "b": 13, "w": 0.20481581545092176}, {"a": 0, "b": 14, "w": 0.22189528866733887}, {"a": 0, "b": 15, "w": 0.023718765305056677}, {"a": 0, "b": 16, "w": 0.23820847328166772}, {"a": 0, "b": 17, "w": 5.184797036150712e-11}, {"a": 0, "b": 18, "w": 0.2330867681490041}, {"a": 0, "b": 19, "w": 0.24725563068270107}, {"a": 0, "b": 20, "w": 0.001434380370657351}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-1.273,hiY=-0.890;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
