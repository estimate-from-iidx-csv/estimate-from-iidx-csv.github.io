<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">GUILTY [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.208, "c": "種", "n": "GUILTY [A]  n=1449 cos1.00 難0.21", "s": 0.386, "f": 0}, {"x": 0.998, "y": 0.03, "c": "近傍", "n": "MAX 300 [H]  n=1581 cos1.00 難0.03", "s": 0.421, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "Programmed World [A]  n=3467 cos0.99 難0.30", "s": 0.923, "f": 0}, {"x": 0.993, "y": 0.141, "c": "近傍", "n": "牧神笛吹きて [A]  n=3417 cos0.99 難0.14", "s": 0.909, "f": 0}, {"x": 0.993, "y": 0.207, "c": "近傍", "n": "Quickening [A]  n=2766 cos0.99 難0.21", "s": 0.736, "f": 0}, {"x": 0.992, "y": 0.136, "c": "近傍", "n": "Leaving... [A]  n=2611 cos0.99 難0.14", "s": 0.695, "f": 0}, {"x": 0.994, "y": 0.001, "c": "近傍", "n": "Chain of pain [A]  n=2991 cos0.99 難0.00", "s": 0.796, "f": 0}, {"x": 0.992, "y": 0.314, "c": "近傍", "n": "rainbow flyer [A]  n=3356 cos0.99 難0.31", "s": 0.893, "f": 0}, {"x": 0.992, "y": 0.31, "c": "近傍", "n": "Harmony and Lovely [A]  n=3537 cos0.99 難0.31", "s": 0.941, "f": 0}, {"x": 0.992, "y": 0.057, "c": "近傍", "n": "THE SAFARI [H]  n=3758 cos0.99 難0.06", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.088, "c": "近傍", "n": "Freeway Shuffle [A]  n=2923 cos0.99 難-0.09", "s": 0.778, "f": 0}, {"x": 0.991, "y": 0.221, "c": "近傍", "n": "Timepiece phase II [H]  n=2931 cos0.99 難0.22", "s": 0.78, "f": 0}, {"x": 0.992, "y": 0.009, "c": "近傍", "n": "lower world [A]  n=2589 cos0.99 難0.01", "s": 0.689, "f": 0}, {"x": 0.991, "y": 0.109, "c": "近傍", "n": "Programmed Genom [A]  n=2252 cos0.99 難0.11", "s": 0.599, "f": 0}, {"x": 0.991, "y": 0.272, "c": "近傍", "n": "合体せよ！ストロングイェーガー！！ (Ryu☆ remix) [A]  n=3325 cos0.99 難0.27", "s": 0.885, "f": 0}, {"x": 0.995, "y": -0.133, "c": "近傍", "n": "NoN-Fiction Story! [A]  n=3104 cos1.00 難-0.13", "s": 0.826, "f": 0}, {"x": 0.991, "y": 0.363, "c": "近傍", "n": "Rubrum Piano [A]  n=2353 cos0.99 難0.36", "s": 0.626, "f": 0}, {"x": 0.991, "y": 0.326, "c": "近傍", "n": "SPACE FIGHT [A]  n=3368 cos0.99 難0.33", "s": 0.896, "f": 0}, {"x": 0.993, "y": -0.058, "c": "近傍", "n": "NΦ CRIME [L]  n=1723 cos0.99 難-0.06", "s": 0.458, "f": 0}, {"x": 0.99, "y": 0.234, "c": "近傍", "n": "GIGA RAID [A]  n=2788 cos0.99 難0.23", "s": 0.742, "f": 0}, {"x": 0.99, "y": 0.118, "c": "近傍", "n": "IN BETWEEN [A]  n=1020 cos0.99 難0.12", "s": 0.271, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5922399985268609}, {"a": 0, "b": 2, "w": 0.2388824286956951}, {"a": 0, "b": 3, "w": 0.4448940669551651}, {"a": 0, "b": 4, "w": 0.3526343371493279}, {"a": 0, "b": 5, "w": 0.1792402335575739}, {"a": 0, "b": 6, "w": 0.43204989286899}, {"a": 0, "b": 7, "w": 0.39338192756180246}, {"a": 0, "b": 8, "w": 0.3847557088622616}, {"a": 0, "b": 9, "w": 0.39243624407441224}, {"a": 0, "b": 10, "w": 0.4683554279105283}, {"a": 0, "b": 11, "w": 0.14652902279301094}, {"a": 0, "b": 12, "w": 0.37726538650938757}, {"a": 0, "b": 13, "w": 0.2745594642241115}, {"a": 0, "b": 14, "w": 0.24500376590228634}, {"a": 0, "b": 15, "w": 0.530725525043415}, {"a": 0, "b": 16, "w": 4.627664917933316e-11}, {"a": 0, "b": 17, "w": 0.21195313492997758}, {"a": 0, "b": 18, "w": 0.2184339441019183}, {"a": 0, "b": 19, "w": 0.15219498527200404}, {"a": 0, "b": 20, "w": 0.1355145288126468}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.172,hiY=0.403;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
