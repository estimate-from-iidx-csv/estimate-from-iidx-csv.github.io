<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">GO! [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.973, "c": "種", "n": "GO! [H]  n=122 cos1.00 難-1.97", "s": 0.08, "f": 0}, {"x": 0.988, "y": -1.918, "c": "近傍", "n": "3V0 [H]  n=766 cos0.99 難-1.92", "s": 0.501, "f": 0}, {"x": 0.989, "y": -1.871, "c": "近傍", "n": "Super Freak [H]  n=716 cos0.99 難-1.87", "s": 0.468, "f": 0}, {"x": 0.988, "y": -1.958, "c": "近傍", "n": "apo:llioth [H]  n=955 cos0.99 難-1.96", "s": 0.625, "f": 0}, {"x": 0.985, "y": -1.708, "c": "近傍", "n": "VOLCANIC BIGBEAT [H]  n=756 cos0.98 難-1.71", "s": 0.494, "f": 0}, {"x": 0.981, "y": -1.897, "c": "近傍", "n": "開きたまえ！Next stAge！ [H]  n=1063 cos0.98 難-1.90", "s": 0.695, "f": 0}, {"x": 0.979, "y": -1.878, "c": "近傍", "n": "Banger Banger Banger Banger [H]  n=824 cos0.98 難-1.88", "s": 0.539, "f": 0}, {"x": 0.978, "y": -1.996, "c": "近傍", "n": "KING [H]  n=773 cos0.98 難-2.00", "s": 0.506, "f": 0}, {"x": 0.976, "y": -1.908, "c": "近傍", "n": "Xyndrome [H]  n=860 cos0.98 難-1.91", "s": 0.562, "f": 0}, {"x": 0.975, "y": -1.979, "c": "近傍", "n": "あるビー！ feat.ころねぽち [H]  n=583 cos0.98 難-1.98", "s": 0.381, "f": 0}, {"x": 0.976, "y": -1.731, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1296 cos0.98 難-1.73", "s": 0.848, "f": 0}, {"x": 0.974, "y": -1.901, "c": "近傍", "n": "OVER VOLTAGE [H]  n=504 cos0.97 難-1.90", "s": 0.33, "f": 0}, {"x": 0.973, "y": -1.899, "c": "近傍", "n": "Burning Flame [H]  n=847 cos0.97 難-1.90", "s": 0.554, "f": 0}, {"x": 0.977, "y": -1.605, "c": "近傍", "n": "STARLiGHT [H]  n=1529 cos0.98 難-1.60", "s": 1.0, "f": 0}, {"x": 0.979, "y": -1.511, "c": "近傍", "n": "Static State [H]  n=1084 cos0.98 難-1.51", "s": 0.709, "f": 0}, {"x": 0.978, "y": -1.526, "c": "近傍", "n": "Matt Silver [H]  n=1137 cos0.98 難-1.53", "s": 0.744, "f": 0}, {"x": 0.978, "y": -1.534, "c": "近傍", "n": "Jungle Eater [H]  n=1100 cos0.98 難-1.53", "s": 0.719, "f": 0}, {"x": 0.973, "y": -1.842, "c": "近傍", "n": "Neo Heritage [H]  n=803 cos0.97 難-1.84", "s": 0.525, "f": 0}, {"x": 0.98, "y": -1.447, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1215 cos0.98 難-1.45", "s": 0.795, "f": 0}, {"x": 0.972, "y": -1.822, "c": "近傍", "n": "Victory Of Ravers [H]  n=725 cos0.97 難-1.82", "s": 0.474, "f": 0}, {"x": 0.978, "y": -1.458, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1474 cos0.98 難-1.46", "s": 0.964, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.34612660515892}, {"a": 0, "b": 2, "w": 0.2563802640542907}, {"a": 0, "b": 3, "w": 0.36198022760555704}, {"a": 0, "b": 4, "w": 0.2849393631097189}, {"a": 0, "b": 5, "w": 0.1448470607125354}, {"a": 0, "b": 6, "w": 0.1475509621759855}, {"a": 0, "b": 7, "w": 0.07770039266531392}, {"a": 0, "b": 8, "w": 0.07539854107770616}, {"a": 0, "b": 9, "w": 0.027951085910703166}, {"a": 0, "b": 10, "w": 4.019240495978238e-11}, {"a": 0, "b": 11, "w": 0.09422466835008281}, {"a": 0, "b": 12, "w": 0.0857782351496792}, {"a": 0, "b": 13, "w": 0.09936061048167011}, {"a": 0, "b": 14, "w": 0.1791597932507405}, {"a": 0, "b": 15, "w": 0.17048798634159257}, {"a": 0, "b": 16, "w": 0.12506644798838684}, {"a": 0, "b": 17, "w": 0.03488415341647644}, {"a": 0, "b": 18, "w": 0.13815289635330386}, {"a": 0, "b": 19, "w": 0.031225630602853882}, {"a": 0, "b": 20, "w": 0.16607907441275727}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=-2.040,hiY=-1.403;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
