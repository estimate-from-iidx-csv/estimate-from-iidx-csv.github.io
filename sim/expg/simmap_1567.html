<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">VALLIS-NERIA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.367, "c": "種", "n": "VALLIS-NERIA [H]  n=2998 cos1.00 難-0.37", "s": 0.897, "f": 0}, {"x": 0.997, "y": -0.213, "c": "近傍", "n": "流桜ノ門 [A]  n=1823 cos1.00 難-0.21", "s": 0.545, "f": 0}, {"x": 0.994, "y": -0.311, "c": "近傍", "n": "それが、ボクの使命～レスキュー隊長 メンキュー～ [A]  n=1118 cos0.99 難-0.31", "s": 0.334, "f": 0}, {"x": 0.994, "y": -0.301, "c": "近傍", "n": "Get Up! feat. Kanae Asaba [A]  n=2683 cos0.99 難-0.30", "s": 0.802, "f": 0}, {"x": 0.994, "y": -0.354, "c": "近傍", "n": "Valanga [H]  n=2996 cos0.99 難-0.35", "s": 0.896, "f": 0}, {"x": 0.993, "y": -0.25, "c": "近傍", "n": "Damage Per Second [A]  n=2881 cos0.99 難-0.25", "s": 0.862, "f": 0}, {"x": 0.993, "y": -0.236, "c": "近傍", "n": "Next Level [A]  n=1619 cos0.99 難-0.24", "s": 0.484, "f": 0}, {"x": 0.992, "y": -0.399, "c": "近傍", "n": "EMOTiON TRiPPER [A]  n=2090 cos0.99 難-0.40", "s": 0.625, "f": 0}, {"x": 0.992, "y": -0.29, "c": "近傍", "n": "電子になりたい [A]  n=1533 cos0.99 難-0.29", "s": 0.458, "f": 0}, {"x": 0.992, "y": -0.298, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2796 cos0.99 難-0.30", "s": 0.836, "f": 0}, {"x": 0.992, "y": -0.571, "c": "近傍", "n": "アタシ完全絶対正義ちゃん！ [A]  n=1759 cos0.99 難-0.57", "s": 0.526, "f": 0}, {"x": 0.991, "y": -0.23, "c": "近傍", "n": "Lycoris [A]  n=1029 cos0.99 難-0.23", "s": 0.308, "f": 0}, {"x": 0.99, "y": -0.269, "c": "近傍", "n": "次葉 -turn the page- [A]  n=3295 cos0.99 難-0.27", "s": 0.985, "f": 0}, {"x": 0.99, "y": -0.426, "c": "近傍", "n": "夏色のセレナーデ [A]  n=1045 cos0.99 難-0.43", "s": 0.312, "f": 0}, {"x": 0.991, "y": -0.569, "c": "近傍", "n": "PALETTE [A]  n=1091 cos0.99 難-0.57", "s": 0.326, "f": 0}, {"x": 0.99, "y": -0.223, "c": "近傍", "n": "Arcanos [A]  n=1239 cos0.99 難-0.22", "s": 0.371, "f": 0}, {"x": 0.99, "y": -0.423, "c": "近傍", "n": "ANEMONE [A]  n=2521 cos0.99 難-0.42", "s": 0.754, "f": 0}, {"x": 0.993, "y": -0.093, "c": "近傍", "n": "十六夜セツナ [A]  n=3344 cos0.99 難-0.09", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.321, "c": "近傍", "n": "タシカナモノ [A]  n=2489 cos0.99 難-0.32", "s": 0.744, "f": 0}, {"x": 0.989, "y": -0.299, "c": "近傍", "n": "Shining World [A]  n=3138 cos0.99 難-0.30", "s": 0.938, "f": 0}, {"x": 0.989, "y": -0.308, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3317 cos0.99 難-0.31", "s": 0.992, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49144647786688544}, {"a": 0, "b": 2, "w": 0.5154349097101931}, {"a": 0, "b": 3, "w": 0.2967429216424333}, {"a": 0, "b": 4, "w": 0.4813314214381921}, {"a": 0, "b": 5, "w": 0.43918689692101687}, {"a": 0, "b": 6, "w": 0.38108962154272497}, {"a": 0, "b": 7, "w": 0.42595352896663696}, {"a": 0, "b": 8, "w": 0.3865210523083905}, {"a": 0, "b": 9, "w": 0.2860852289924972}, {"a": 0, "b": 10, "w": 0.3474446377069871}, {"a": 0, "b": 11, "w": 0.266629951837533}, {"a": 0, "b": 12, "w": 0.28517831691565665}, {"a": 0, "b": 13, "w": 0.2740346540626981}, {"a": 0, "b": 14, "w": 0.3294939343222931}, {"a": 0, "b": 15, "w": 0.3581149839748906}, {"a": 0, "b": 16, "w": 0.24068730503564217}, {"a": 0, "b": 17, "w": 0.36445744218775145}, {"a": 0, "b": 18, "w": 0.24421633980823376}, {"a": 0, "b": 19, "w": 4.567235478702969e-11}, {"a": 0, "b": 20, "w": 0.23504146308692375}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.609,hiY=-0.054;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
