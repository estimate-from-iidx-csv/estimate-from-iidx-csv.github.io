<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">The Limbo [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.281, "c": "種", "n": "The Limbo [H]  n=2856 cos1.00 難-0.28", "s": 0.83, "f": 0}, {"x": 0.99, "y": -0.103, "c": "近傍", "n": "STEEL NEEDLE [H]  n=2602 cos0.99 難-0.10", "s": 0.756, "f": 0}, {"x": 0.99, "y": -0.394, "c": "近傍", "n": "Elemental Creation [H]  n=3337 cos0.99 難-0.39", "s": 0.97, "f": 0}, {"x": 0.989, "y": -0.207, "c": "近傍", "n": "Reflection Into the EDEN [A]  n=1139 cos0.99 難-0.21", "s": 0.331, "f": 0}, {"x": 0.989, "y": -0.323, "c": "近傍", "n": "Little Little Princess [H]  n=2746 cos0.99 難-0.32", "s": 0.798, "f": 0}, {"x": 0.987, "y": -0.334, "c": "近傍", "n": "華蝶風雪 [H]  n=2939 cos0.99 難-0.33", "s": 0.854, "f": 0}, {"x": 0.989, "y": -0.564, "c": "近傍", "n": "rumrum triplets [H]  n=2690 cos0.99 難-0.56", "s": 0.782, "f": 0}, {"x": 0.986, "y": -0.301, "c": "近傍", "n": "CaptivAte～裁き～ [A]  n=2976 cos0.99 難-0.30", "s": 0.865, "f": 0}, {"x": 0.986, "y": -0.286, "c": "近傍", "n": "AGEHA [A]  n=3016 cos0.99 難-0.29", "s": 0.876, "f": 0}, {"x": 0.986, "y": -0.133, "c": "近傍", "n": "Infinite cave [A]  n=3073 cos0.99 難-0.13", "s": 0.893, "f": 0}, {"x": 0.986, "y": -0.151, "c": "近傍", "n": "Under the Sky [A]  n=2610 cos0.99 難-0.15", "s": 0.759, "f": 0}, {"x": 0.986, "y": -0.497, "c": "近傍", "n": "Digital Radiance [A]  n=1245 cos0.99 難-0.50", "s": 0.362, "f": 0}, {"x": 0.993, "y": -0.795, "c": "近傍", "n": "Nightmare before oversleep [H]  n=2371 cos0.99 難-0.79", "s": 0.689, "f": 0}, {"x": 0.985, "y": -0.209, "c": "近傍", "n": "HAERETICUS [H]  n=2681 cos0.98 難-0.21", "s": 0.779, "f": 0}, {"x": 0.985, "y": -0.416, "c": "近傍", "n": "旋律のドグマ～Miserables～ [H]  n=3120 cos0.98 難-0.42", "s": 0.907, "f": 0}, {"x": 0.984, "y": -0.29, "c": "近傍", "n": "電子になりたい [A]  n=1533 cos0.98 難-0.29", "s": 0.446, "f": 0}, {"x": 0.984, "y": -0.335, "c": "近傍", "n": "Time to Air [H]  n=3128 cos0.98 難-0.33", "s": 0.909, "f": 0}, {"x": 0.984, "y": -0.379, "c": "近傍", "n": "リリーゼと炎龍レーヴァテイン [H]  n=3009 cos0.98 難-0.38", "s": 0.874, "f": 0}, {"x": 0.984, "y": -0.132, "c": "近傍", "n": "Recollection [A]  n=2275 cos0.98 難-0.13", "s": 0.661, "f": 0}, {"x": 0.983, "y": -0.212, "c": "近傍", "n": "Express Emotion [A]  n=3441 cos0.98 難-0.21", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.429, "c": "近傍", "n": "Far east nightbird [A]  n=3195 cos0.98 難-0.43", "s": 0.929, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.31675822473560766}, {"a": 0, "b": 2, "w": 0.22199055558255543}, {"a": 0, "b": 3, "w": 0.30584181131042576}, {"a": 0, "b": 4, "w": 0.30361777420258906}, {"a": 0, "b": 5, "w": 0.2734269561477751}, {"a": 0, "b": 6, "w": 0.19444695313544236}, {"a": 0, "b": 7, "w": 0.21318474158407263}, {"a": 0, "b": 8, "w": 0.24228230862049038}, {"a": 0, "b": 9, "w": 0.25532082415130397}, {"a": 0, "b": 10, "w": 0.19217092379152068}, {"a": 0, "b": 11, "w": 0.19466904026093745}, {"a": 0, "b": 12, "w": 0.4530882308853742}, {"a": 0, "b": 13, "w": 0.1682188670012107}, {"a": 0, "b": 14, "w": 0.1987861384737012}, {"a": 0, "b": 15, "w": 0.19683175219703097}, {"a": 0, "b": 16, "w": 0.18613010204580305}, {"a": 0, "b": 17, "w": 4.602906944484175e-11}, {"a": 0, "b": 18, "w": 0.11728403153097111}, {"a": 0, "b": 19, "w": 0.14047322301158927}, {"a": 0, "b": 20, "w": 0.13580661158697382}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.850,hiY=-0.047;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
