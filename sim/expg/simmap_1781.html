<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Burning Flame [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.212, "c": "種", "n": "Burning Flame [A]  n=2607 cos1.00 難0.21", "s": 0.712, "f": 0}, {"x": 0.996, "y": 0.11, "c": "近傍", "n": "Howling [L]  n=2737 cos1.00 難0.11", "s": 0.747, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "R∞tAge [A]  n=3518 cos0.99 難0.14", "s": 0.96, "f": 0}, {"x": 0.993, "y": 0.182, "c": "近傍", "n": "MA・TSU・RI [A]  n=2106 cos0.99 難0.18", "s": 0.575, "f": 0}, {"x": 0.993, "y": 0.281, "c": "近傍", "n": "Like+it! [A]  n=3047 cos0.99 難0.28", "s": 0.832, "f": 0}, {"x": 0.994, "y": 0.388, "c": "近傍", "n": "This Is Club Musik feat. 大久保紅葉 [A]  n=1735 cos0.99 難0.39", "s": 0.474, "f": 0}, {"x": 0.993, "y": 0.082, "c": "近傍", "n": "寝起きヤシの木 [A]  n=2034 cos0.99 難0.08", "s": 0.555, "f": 0}, {"x": 0.992, "y": 0.322, "c": "近傍", "n": "GIGA THRASH [A]  n=3153 cos0.99 難0.32", "s": 0.861, "f": 0}, {"x": 0.992, "y": 0.286, "c": "近傍", "n": "Substance [A]  n=1091 cos0.99 難0.29", "s": 0.298, "f": 0}, {"x": 0.993, "y": 0.355, "c": "近傍", "n": "TOKAKU=ALMiRAJ [A]  n=752 cos0.99 難0.35", "s": 0.205, "f": 0}, {"x": 0.995, "y": 0.453, "c": "近傍", "n": "Neo Heritage [A]  n=2296 cos0.99 難0.45", "s": 0.627, "f": 0}, {"x": 0.994, "y": -0.004, "c": "近傍", "n": "Bang Bang Dance [A]  n=1181 cos0.99 難-0.00", "s": 0.322, "f": 0}, {"x": 0.992, "y": 0.114, "c": "近傍", "n": "Honey Trap [A]  n=3495 cos0.99 難0.11", "s": 0.954, "f": 0}, {"x": 0.995, "y": 0.483, "c": "近傍", "n": "THE SHINING POLARIS(kors k mix) [A]  n=1522 cos1.00 難0.48", "s": 0.415, "f": 0}, {"x": 0.991, "y": 0.104, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [A]  n=3339 cos0.99 難0.10", "s": 0.911, "f": 0}, {"x": 0.994, "y": 0.457, "c": "近傍", "n": "Around the Future [A]  n=3146 cos0.99 難0.46", "s": 0.859, "f": 0}, {"x": 0.993, "y": 0.462, "c": "近傍", "n": "S!ck [A]  n=3664 cos0.99 難0.46", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.49, "c": "近傍", "n": "POLKAMANIA [A]  n=2920 cos0.99 難0.49", "s": 0.797, "f": 0}, {"x": 0.991, "y": 0.073, "c": "近傍", "n": "MOCHIMOCHI DREAMIN!! [A]  n=1092 cos0.99 難0.07", "s": 0.298, "f": 0}, {"x": 0.99, "y": 0.313, "c": "近傍", "n": "Catch ya Getcha! [A]  n=1041 cos0.99 難0.31", "s": 0.284, "f": 0}, {"x": 0.994, "y": 0.533, "c": "近傍", "n": "Crazy Jackpot [A]  n=2696 cos0.99 難0.53", "s": 0.736, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.26087616212863396}, {"a": 0, "b": 2, "w": 0.1916992494212001}, {"a": 0, "b": 3, "w": 0.010486570337071455}, {"a": 0, "b": 4, "w": 0.03583096275664843}, {"a": 0, "b": 5, "w": 0.2351251818051524}, {"a": 0, "b": 6, "w": 0.18452003383551852}, {"a": 0, "b": 7, "w": 0.0979591156088766}, {"a": 0, "b": 8, "w": 0.06992315131561344}, {"a": 0, "b": 9, "w": 0.16656241434625985}, {"a": 0, "b": 10, "w": 0.27853460468202673}, {"a": 0, "b": 11, "w": 0.1183807706385469}, {"a": 0, "b": 12, "w": 0.0762883940500213}, {"a": 0, "b": 13, "w": 0.344930110830578}, {"a": 0, "b": 14, "w": 5.226841182093267e-11}, {"a": 0, "b": 15, "w": 0.05238383018448378}, {"a": 0, "b": 16, "w": 0.18343854721193364}, {"a": 0, "b": 17, "w": 0.18536909480232855}, {"a": 0, "b": 18, "w": 0.0639532650339607}, {"a": 0, "b": 19, "w": 0.0526180664154654}, {"a": 0, "b": 20, "w": 0.17676634557419524}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.047,hiY=0.576;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
