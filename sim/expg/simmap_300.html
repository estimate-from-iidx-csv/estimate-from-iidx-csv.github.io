<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Destiny Sword [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.895, "c": "種", "n": "Destiny Sword [H]  n=2143 cos1.00 難-0.89", "s": 0.856, "f": 0}, {"x": 0.996, "y": -0.827, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2332 cos1.00 難-0.83", "s": 0.932, "f": 0}, {"x": 0.995, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.99 難-0.92", "s": 0.774, "f": 0}, {"x": 0.996, "y": -0.789, "c": "近傍", "n": "星をこの手に [H]  n=1902 cos1.00 難-0.79", "s": 0.76, "f": 0}, {"x": 0.996, "y": -1.02, "c": "近傍", "n": "Cosmic Cat [H]  n=1849 cos1.00 難-1.02", "s": 0.739, "f": 0}, {"x": 0.994, "y": -0.894, "c": "近傍", "n": "n/a [H]  n=1573 cos0.99 難-0.89", "s": 0.628, "f": 0}, {"x": 0.993, "y": -0.886, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1987 cos0.99 難-0.89", "s": 0.794, "f": 0}, {"x": 0.995, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos1.00 難-0.75", "s": 0.564, "f": 0}, {"x": 0.994, "y": -0.801, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2344 cos0.99 難-0.80", "s": 0.936, "f": 0}, {"x": 0.995, "y": -1.036, "c": "近傍", "n": "B.O.D.Y. [H]  n=1305 cos0.99 難-1.04", "s": 0.521, "f": 0}, {"x": 0.997, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos1.00 難-0.71", "s": 0.912, "f": 0}, {"x": 0.993, "y": -0.966, "c": "近傍", "n": "紫陽花 -AZISAI- [H]  n=2503 cos0.99 難-0.97", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.862, "c": "近傍", "n": "Programmed Life [H]  n=1853 cos0.99 難-0.86", "s": 0.74, "f": 0}, {"x": 0.993, "y": -0.851, "c": "近傍", "n": "ZERO-ONE [H]  n=1902 cos0.99 難-0.85", "s": 0.76, "f": 0}, {"x": 0.992, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.739, "f": 0}, {"x": 0.992, "y": -0.864, "c": "近傍", "n": "Make A Difference [H]  n=1364 cos0.99 難-0.86", "s": 0.545, "f": 0}, {"x": 0.993, "y": -0.803, "c": "近傍", "n": "LAB [H]  n=1740 cos0.99 難-0.80", "s": 0.695, "f": 0}, {"x": 0.992, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos0.99 難-0.81", "s": 0.703, "f": 0}, {"x": 0.992, "y": -0.871, "c": "近傍", "n": "Modular Technology [H]  n=2229 cos0.99 難-0.87", "s": 0.891, "f": 0}, {"x": 0.992, "y": -0.813, "c": "近傍", "n": "Programmed Sun [H]  n=2096 cos0.99 難-0.81", "s": 0.837, "f": 0}, {"x": 0.993, "y": -0.761, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2360 cos0.99 難-0.76", "s": 0.943, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.35670496604309254}, {"a": 0, "b": 2, "w": 0.3226274959367973}, {"a": 0, "b": 3, "w": 0.41090977331277334}, {"a": 0, "b": 4, "w": 0.4467230892293229}, {"a": 0, "b": 5, "w": 6.527345330908929e-11}, {"a": 0, "b": 6, "w": 0.2274325231136367}, {"a": 0, "b": 7, "w": 0.3869039274298509}, {"a": 0, "b": 8, "w": 0.27042358165817637}, {"a": 0, "b": 9, "w": 0.2808494161205368}, {"a": 0, "b": 10, "w": 0.4816952002911785}, {"a": 0, "b": 11, "w": 0.2114457225716465}, {"a": 0, "b": 12, "w": 0.18554237281599606}, {"a": 0, "b": 13, "w": 0.13589138440979043}, {"a": 0, "b": 14, "w": 0.17675082964898348}, {"a": 0, "b": 15, "w": 0.12413098467684847}, {"a": 0, "b": 16, "w": 0.1938325672385811}, {"a": 0, "b": 17, "w": 0.20478738047228084}, {"a": 0, "b": 18, "w": 0.0876779970135464}, {"a": 0, "b": 19, "w": 0.17224227418662208}, {"a": 0, "b": 20, "w": 0.20773049569272672}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-1.062,hiY=-0.686;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
