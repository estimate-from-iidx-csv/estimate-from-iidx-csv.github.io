<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">THE BLACK KNIGHT [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.64, "c": "種", "n": "THE BLACK KNIGHT [A]  n=3323 cos1.00 難0.64", "s": 0.912, "f": 0}, {"x": 0.991, "y": 0.76, "c": "近傍", "n": "Wolf 1061 [A]  n=3000 cos0.99 難0.76", "s": 0.824, "f": 0}, {"x": 0.997, "y": 0.288, "c": "近傍", "n": "XINOBIKILL [A]  n=3447 cos1.00 難0.29", "s": 0.946, "f": 0}, {"x": 0.987, "y": 0.593, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3023 cos0.99 難0.59", "s": 0.83, "f": 0}, {"x": 0.988, "y": 0.462, "c": "近傍", "n": "rainbow guitar weeps [A]  n=3342 cos0.99 難0.46", "s": 0.918, "f": 0}, {"x": 0.985, "y": 0.607, "c": "近傍", "n": "禍根 [A]  n=3114 cos0.98 難0.61", "s": 0.855, "f": 0}, {"x": 0.985, "y": 0.523, "c": "近傍", "n": "鬼天 [A]  n=3354 cos0.99 難0.52", "s": 0.921, "f": 0}, {"x": 0.986, "y": 0.46, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2732 cos0.99 難0.46", "s": 0.75, "f": 0}, {"x": 0.985, "y": 0.748, "c": "近傍", "n": "Let The Track Flow [A]  n=3113 cos0.98 難0.75", "s": 0.855, "f": 0}, {"x": 0.984, "y": 0.602, "c": "近傍", "n": "OTOKOZAKA [A]  n=1616 cos0.98 難0.60", "s": 0.444, "f": 0}, {"x": 0.983, "y": 0.602, "c": "近傍", "n": "Ergosphere [A]  n=2071 cos0.98 難0.60", "s": 0.569, "f": 0}, {"x": 0.984, "y": 0.476, "c": "近傍", "n": "ABSOLUTE [L]  n=3176 cos0.98 難0.48", "s": 0.872, "f": 0}, {"x": 0.982, "y": 0.61, "c": "近傍", "n": "Mukade [A]  n=1859 cos0.98 難0.61", "s": 0.51, "f": 0}, {"x": 0.984, "y": 0.933, "c": "近傍", "n": "Adularia [A]  n=3588 cos0.98 難0.93", "s": 0.985, "f": 0}, {"x": 0.985, "y": 0.286, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2296 cos0.99 難0.29", "s": 0.63, "f": 0}, {"x": 0.983, "y": 0.374, "c": "近傍", "n": "Get On Your Feet [A]  n=1756 cos0.98 難0.37", "s": 0.482, "f": 0}, {"x": 0.982, "y": 0.729, "c": "近傍", "n": "Apocalypse [A]  n=3642 cos0.98 難0.73", "s": 1.0, "f": 0}, {"x": 0.984, "y": 0.322, "c": "近傍", "n": "HEISEI [A]  n=3346 cos0.98 難0.32", "s": 0.919, "f": 0}, {"x": 0.985, "y": 0.249, "c": "近傍", "n": "Nasty Techniques [A]  n=2972 cos0.99 難0.25", "s": 0.816, "f": 0}, {"x": 0.981, "y": 0.734, "c": "近傍", "n": "Eine Haube ～聖地の果てにあるもの～ [A]  n=2941 cos0.98 難0.73", "s": 0.808, "f": 0}, {"x": 0.981, "y": 0.523, "c": "近傍", "n": "Dawn Saga [A]  n=2729 cos0.98 難0.52", "s": 0.749, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3259947809924315}, {"a": 0, "b": 2, "w": 0.6126433731355834}, {"a": 0, "b": 3, "w": 0.19791121988756744}, {"a": 0, "b": 4, "w": 0.16636948201412183}, {"a": 0, "b": 5, "w": 0.011130926900748461}, {"a": 0, "b": 6, "w": 0.1107889742035364}, {"a": 0, "b": 7, "w": 0.11527837438741295}, {"a": 0, "b": 8, "w": 0.11737179918526475}, {"a": 0, "b": 9, "w": 0.07385891400519107}, {"a": 0, "b": 10, "w": 0.10009427277268679}, {"a": 0, "b": 11, "w": 0.10657005908587813}, {"a": 0, "b": 12, "w": 0.06844264135999678}, {"a": 0, "b": 13, "w": 0.12069299402550226}, {"a": 0, "b": 14, "w": 0.15683290758836244}, {"a": 0, "b": 15, "w": 0.10022731597105439}, {"a": 0, "b": 16, "w": 0.016513450815600295}, {"a": 0, "b": 17, "w": 3.8237080168812554e-11}, {"a": 0, "b": 18, "w": 0.094377098790009}, {"a": 0, "b": 19, "w": 0.053447196477477754}, {"a": 0, "b": 20, "w": 0.05148026463580835}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=0.194,hiY=0.988;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
