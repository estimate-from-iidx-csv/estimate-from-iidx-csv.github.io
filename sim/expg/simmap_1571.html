<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Vinculum stellarum [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.177, "c": "種", "n": "Vinculum stellarum [H]  n=1440 cos1.00 難-1.18", "s": 0.649, "f": 0}, {"x": 0.997, "y": -1.162, "c": "近傍", "n": "ORCA [H]  n=1535 cos1.00 難-1.16", "s": 0.692, "f": 0}, {"x": 0.997, "y": -1.247, "c": "近傍", "n": "suspicions [H]  n=717 cos1.00 難-1.25", "s": 0.323, "f": 0}, {"x": 0.995, "y": -1.093, "c": "近傍", "n": "Raspberry Railgun [H]  n=1991 cos0.99 難-1.09", "s": 0.897, "f": 0}, {"x": 0.994, "y": -1.302, "c": "近傍", "n": "〆 [H]  n=1726 cos0.99 難-1.30", "s": 0.778, "f": 0}, {"x": 0.998, "y": -0.939, "c": "近傍", "n": "Macuilxochitl [H]  n=2219 cos1.00 難-0.94", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.03, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1847 cos0.99 難-1.03", "s": 0.832, "f": 0}, {"x": 0.993, "y": -1.295, "c": "近傍", "n": "DUAL STRIKER [H]  n=1336 cos0.99 難-1.29", "s": 0.602, "f": 0}, {"x": 0.995, "y": -1.428, "c": "近傍", "n": "Stereo Beasts [H]  n=695 cos1.00 難-1.43", "s": 0.313, "f": 0}, {"x": 0.992, "y": -1.288, "c": "近傍", "n": "Resonant [H]  n=555 cos0.99 難-1.29", "s": 0.25, "f": 0}, {"x": 0.997, "y": -0.896, "c": "近傍", "n": "Drastic Dramatic [H]  n=1830 cos1.00 難-0.90", "s": 0.825, "f": 0}, {"x": 0.994, "y": -0.951, "c": "近傍", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [H]  n=2002 cos0.99 難-0.95", "s": 0.902, "f": 0}, {"x": 0.993, "y": -0.974, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=737 cos0.99 難-0.97", "s": 0.332, "f": 0}, {"x": 0.991, "y": -1.135, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1716 cos0.99 難-1.13", "s": 0.773, "f": 0}, {"x": 0.992, "y": -0.985, "c": "近傍", "n": "MAX 360 [H]  n=770 cos0.99 難-0.99", "s": 0.347, "f": 0}, {"x": 0.993, "y": -0.962, "c": "近傍", "n": "Artist [H]  n=1573 cos0.99 難-0.96", "s": 0.709, "f": 0}, {"x": 0.994, "y": -1.449, "c": "近傍", "n": "#CMFLG [H]  n=888 cos0.99 難-1.45", "s": 0.4, "f": 0}, {"x": 0.99, "y": -1.04, "c": "近傍", "n": "Trill auf G [H]  n=1795 cos0.99 難-1.04", "s": 0.809, "f": 0}, {"x": 0.99, "y": -1.052, "c": "近傍", "n": "SEQUENCE CAT [H]  n=2130 cos0.99 難-1.05", "s": 0.96, "f": 0}, {"x": 0.99, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.28, "f": 0}, {"x": 0.989, "y": -1.252, "c": "近傍", "n": "禊 [H]  n=1632 cos0.99 難-1.25", "s": 0.735, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5356457168649759}, {"a": 0, "b": 2, "w": 0.545035623604711}, {"a": 0, "b": 3, "w": 0.39534929127184937}, {"a": 0, "b": 4, "w": 0.4225071962437541}, {"a": 0, "b": 5, "w": 0.523520592068198}, {"a": 0, "b": 6, "w": 0.22886552544849703}, {"a": 0, "b": 7, "w": 0.2994257155461495}, {"a": 0, "b": 8, "w": 0.4825375482505545}, {"a": 0, "b": 9, "w": 0.2804159028858998}, {"a": 0, "b": 10, "w": 0.5431619172381413}, {"a": 0, "b": 11, "w": 5.095901478568976e-11}, {"a": 0, "b": 12, "w": 0.3324268169577258}, {"a": 0, "b": 13, "w": 0.27854219114570045}, {"a": 0, "b": 14, "w": 0.3055405425893689}, {"a": 0, "b": 15, "w": 0.34562097533092195}, {"a": 0, "b": 16, "w": 0.358510760452154}, {"a": 0, "b": 17, "w": 0.2548436744222565}, {"a": 0, "b": 18, "w": 0.06333577119257106}, {"a": 0, "b": 19, "w": 0.21592677874255084}, {"a": 0, "b": 20, "w": 0.17245408142112206}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.493,hiY=-0.852;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
