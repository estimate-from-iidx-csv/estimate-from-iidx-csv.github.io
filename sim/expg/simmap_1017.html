<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Shapeshifter [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.064, "c": "種", "n": "Shapeshifter [A]  n=1776 cos1.00 難-0.06", "s": 0.49, "f": 0}, {"x": 0.995, "y": -0.043, "c": "近傍", "n": "Miracle 5ympho X [A]  n=3625 cos1.00 難-0.04", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.187, "c": "近傍", "n": "マーシャル・マキシマイザー [A]  n=1809 cos1.00 難-0.19", "s": 0.499, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "RESISTANCE [A]  n=2736 cos0.99 難-0.13", "s": 0.755, "f": 0}, {"x": 0.996, "y": -0.191, "c": "近傍", "n": "タンポポ [A]  n=706 cos1.00 難-0.19", "s": 0.195, "f": 0}, {"x": 0.994, "y": -0.093, "c": "近傍", "n": "Beat Radiance [A]  n=3352 cos0.99 難-0.09", "s": 0.925, "f": 0}, {"x": 0.994, "y": -0.054, "c": "近傍", "n": "断罪の一花 [A]  n=1491 cos0.99 難-0.05", "s": 0.411, "f": 0}, {"x": 0.994, "y": -0.016, "c": "近傍", "n": "Wing of Hearts [A]  n=3089 cos0.99 難-0.02", "s": 0.852, "f": 0}, {"x": 0.994, "y": -0.085, "c": "近傍", "n": "Hypersonik [A]  n=3142 cos0.99 難-0.08", "s": 0.867, "f": 0}, {"x": 0.994, "y": -0.026, "c": "近傍", "n": "GRID KNIGHT [A]  n=2761 cos0.99 難-0.03", "s": 0.762, "f": 0}, {"x": 0.994, "y": -0.17, "c": "近傍", "n": "梅雪夜 [A]  n=3409 cos0.99 難-0.17", "s": 0.94, "f": 0}, {"x": 0.994, "y": -0.109, "c": "近傍", "n": "Sorrows [A]  n=3296 cos0.99 難-0.11", "s": 0.909, "f": 0}, {"x": 0.993, "y": -0.081, "c": "近傍", "n": "Jumper [A]  n=1722 cos0.99 難-0.08", "s": 0.475, "f": 0}, {"x": 0.994, "y": -0.134, "c": "近傍", "n": "Τeλοs [A]  n=602 cos0.99 難-0.13", "s": 0.166, "f": 0}, {"x": 0.995, "y": -0.217, "c": "近傍", "n": "勇者 [A]  n=1805 cos1.00 難-0.22", "s": 0.498, "f": 0}, {"x": 0.993, "y": -0.074, "c": "近傍", "n": "Stargazing Trip ～星 探す旅～ ft. 小林マナ [A]  n=1142 cos0.99 難-0.07", "s": 0.315, "f": 0}, {"x": 0.993, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos0.99 難-0.05", "s": 0.853, "f": 0}, {"x": 0.993, "y": -0.063, "c": "近傍", "n": "Ascalon [A]  n=3047 cos0.99 難-0.06", "s": 0.841, "f": 0}, {"x": 0.993, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.99 難-0.01", "s": 0.654, "f": 0}, {"x": 0.992, "y": -0.088, "c": "近傍", "n": "Abyss -The Heavens Remix- [A]  n=3137 cos0.99 難-0.09", "s": 0.865, "f": 0}, {"x": 0.994, "y": 0.082, "c": "近傍", "n": "純真可憐デザイア [L]  n=797 cos0.99 難0.08", "s": 0.22, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.27452169040274654}, {"a": 0, "b": 2, "w": 0.37432954680938}, {"a": 0, "b": 3, "w": 0.13415274318874282}, {"a": 0, "b": 4, "w": 0.3549249015542968}, {"a": 0, "b": 5, "w": 0.09955399145650645}, {"a": 0, "b": 6, "w": 0.25823726613802833}, {"a": 0, "b": 7, "w": 0.1950226849997323}, {"a": 0, "b": 8, "w": 0.09601151949677134}, {"a": 0, "b": 9, "w": 0.2443092814977318}, {"a": 0, "b": 10, "w": 0.04559229664512532}, {"a": 0, "b": 11, "w": 0.21235532519761247}, {"a": 0, "b": 12, "w": 0.21900870129096284}, {"a": 0, "b": 13, "w": 0.2475322219703383}, {"a": 0, "b": 14, "w": 0.2590229125135469}, {"a": 0, "b": 15, "w": 0.2184067968594784}, {"a": 0, "b": 16, "w": 0.13862707554045695}, {"a": 0, "b": 17, "w": 5.930822499777832e-11}, {"a": 0, "b": 18, "w": 0.1416511403139613}, {"a": 0, "b": 19, "w": 0.10278903860358157}, {"a": 0, "b": 20, "w": 0.03396829220350195}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.241,hiY=0.106;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
