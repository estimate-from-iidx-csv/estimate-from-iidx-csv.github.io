<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Piano Samurai [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.522, "c": "種", "n": "Piano Samurai [H]  n=1409 cos1.00 難-1.52", "s": 0.8, "f": 0}, {"x": 0.996, "y": -1.525, "c": "近傍", "n": "Be a Hero! [H]  n=1362 cos1.00 難-1.53", "s": 0.773, "f": 0}, {"x": 0.996, "y": -1.497, "c": "近傍", "n": "ハードベース・フェスタ [H]  n=1762 cos1.00 難-1.50", "s": 1.0, "f": 0}, {"x": 0.997, "y": -1.615, "c": "近傍", "n": "バ→ビ→ブ→Bomb! [H]  n=1154 cos1.00 難-1.62", "s": 0.655, "f": 0}, {"x": 0.994, "y": -1.478, "c": "近傍", "n": "encounter [H]  n=1621 cos0.99 難-1.48", "s": 0.92, "f": 0}, {"x": 0.995, "y": -1.593, "c": "近傍", "n": "Chaotoxin [H]  n=682 cos0.99 難-1.59", "s": 0.387, "f": 0}, {"x": 0.995, "y": -1.433, "c": "近傍", "n": "SINOBUZ Fantasy [H]  n=1321 cos0.99 難-1.43", "s": 0.75, "f": 0}, {"x": 0.994, "y": -1.605, "c": "近傍", "n": "STARLiGHT [H]  n=1529 cos0.99 難-1.60", "s": 0.868, "f": 0}, {"x": 0.995, "y": -1.362, "c": "近傍", "n": "Carry Me Away [H]  n=1400 cos1.00 難-1.36", "s": 0.795, "f": 0}, {"x": 0.991, "y": -1.534, "c": "近傍", "n": "Jungle Eater [H]  n=1100 cos0.99 難-1.53", "s": 0.624, "f": 0}, {"x": 0.994, "y": -1.363, "c": "近傍", "n": "BLAZING_LAZER [H]  n=798 cos0.99 難-1.36", "s": 0.453, "f": 0}, {"x": 0.99, "y": -1.447, "c": "近傍", "n": "chaos eater -IIDX edition- [H]  n=1215 cos0.99 難-1.45", "s": 0.69, "f": 0}, {"x": 0.992, "y": -1.384, "c": "近傍", "n": "SHELTER OF THE MIND [H]  n=1719 cos0.99 難-1.38", "s": 0.976, "f": 0}, {"x": 0.99, "y": -1.434, "c": "近傍", "n": "スパークリング☆彡ハイパーチューン！！ [H]  n=1039 cos0.99 難-1.43", "s": 0.59, "f": 0}, {"x": 0.989, "y": -1.419, "c": "近傍", "n": "水鏡の異界 [H]  n=1252 cos0.99 難-1.42", "s": 0.711, "f": 0}, {"x": 0.994, "y": -1.731, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1296 cos0.99 難-1.73", "s": 0.736, "f": 0}, {"x": 0.988, "y": -1.61, "c": "近傍", "n": "Wonderland [H]  n=1089 cos0.99 難-1.61", "s": 0.618, "f": 0}, {"x": 0.988, "y": -1.465, "c": "近傍", "n": "AO-∞ [H]  n=1384 cos0.99 難-1.46", "s": 0.785, "f": 0}, {"x": 0.988, "y": -1.43, "c": "近傍", "n": "27th style [H]  n=1334 cos0.99 難-1.43", "s": 0.757, "f": 0}, {"x": 0.987, "y": -1.48, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1674 cos0.99 難-1.48", "s": 0.95, "f": 0}, {"x": 0.99, "y": -1.346, "c": "近傍", "n": "BIGWAVERS [H]  n=765 cos0.99 難-1.35", "s": 0.434, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47650998119792964}, {"a": 0, "b": 2, "w": 0.3776696840663174}, {"a": 0, "b": 3, "w": 0.5092867778846167}, {"a": 0, "b": 4, "w": 0.3487071103858451}, {"a": 0, "b": 5, "w": 0.36020640258076075}, {"a": 0, "b": 6, "w": 0.37135275407512436}, {"a": 0, "b": 7, "w": 0.3281279309144247}, {"a": 0, "b": 8, "w": 0.4046351142763387}, {"a": 0, "b": 9, "w": 0.14751399189878756}, {"a": 0, "b": 10, "w": 0.16462281339772888}, {"a": 0, "b": 11, "w": 0.15316401293676862}, {"a": 0, "b": 12, "w": 0.1974580292804814}, {"a": 0, "b": 13, "w": 0.13300423792468352}, {"a": 0, "b": 14, "w": 0.04212714692668762}, {"a": 0, "b": 15, "w": 0.2761861790367246}, {"a": 0, "b": 16, "w": 0.07677853925361022}, {"a": 0, "b": 17, "w": 0.02489388383934854}, {"a": 0, "b": 18, "w": 0.001060209430449266}, {"a": 0, "b": 19, "w": 6.883094094689568e-11}, {"a": 0, "b": 20, "w": 0.12620888397091512}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.762,hiY=-1.316;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
