<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">LASER CRUSTER [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.318, "c": "種", "n": "LASER CRUSTER [H]  n=3202 cos1.00 難0.32", "s": 0.861, "f": 0}, {"x": 0.997, "y": 0.193, "c": "近傍", "n": "BLUE STRAGGLER [A]  n=2968 cos1.00 難0.19", "s": 0.798, "f": 0}, {"x": 0.996, "y": 0.179, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3577 cos1.00 難0.18", "s": 0.962, "f": 0}, {"x": 0.995, "y": 0.253, "c": "近傍", "n": "spiral galaxy [A]  n=3269 cos1.00 難0.25", "s": 0.879, "f": 0}, {"x": 0.996, "y": 0.441, "c": "近傍", "n": "Lighting Shower [A]  n=3191 cos1.00 難0.44", "s": 0.858, "f": 0}, {"x": 0.995, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos0.99 難0.21", "s": 0.643, "f": 0}, {"x": 0.994, "y": 0.292, "c": "近傍", "n": "TECHNO RUMBLE [A]  n=850 cos0.99 難0.29", "s": 0.229, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "嘆きの樹 [H]  n=3718 cos0.99 難0.20", "s": 1.0, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "SOLID WYVERN [A]  n=2524 cos0.99 難0.20", "s": 0.679, "f": 0}, {"x": 0.994, "y": 0.419, "c": "近傍", "n": "Scarlet Moon [A]  n=3508 cos0.99 難0.42", "s": 0.944, "f": 0}, {"x": 0.993, "y": 0.321, "c": "近傍", "n": "Battleground [A]  n=3265 cos0.99 難0.32", "s": 0.878, "f": 0}, {"x": 0.993, "y": 0.217, "c": "近傍", "n": "Destiny Sword [A]  n=3492 cos0.99 難0.22", "s": 0.939, "f": 0}, {"x": 0.993, "y": 0.314, "c": "近傍", "n": "murmur twins [A]  n=3523 cos0.99 難0.31", "s": 0.948, "f": 0}, {"x": 0.996, "y": 0.082, "c": "近傍", "n": "GHOST REVIVAL [A]  n=2613 cos1.00 難0.08", "s": 0.703, "f": 0}, {"x": 0.995, "y": 0.545, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [A]  n=3008 cos1.00 難0.55", "s": 0.809, "f": 0}, {"x": 0.993, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.931, "f": 0}, {"x": 0.996, "y": 0.077, "c": "近傍", "n": "Change Yourself [A]  n=3044 cos1.00 難0.08", "s": 0.819, "f": 0}, {"x": 0.992, "y": 0.308, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3376 cos0.99 難0.31", "s": 0.908, "f": 0}, {"x": 0.992, "y": 0.311, "c": "近傍", "n": "Amazing Mirage [A]  n=3631 cos0.99 難0.31", "s": 0.977, "f": 0}, {"x": 0.993, "y": 0.14, "c": "近傍", "n": "BROKEN EDEN [A]  n=3523 cos0.99 難0.14", "s": 0.948, "f": 0}, {"x": 0.993, "y": 0.146, "c": "近傍", "n": "Believe In Me [A]  n=3504 cos0.99 難0.15", "s": 0.942, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.573591895200774}, {"a": 0, "b": 2, "w": 0.6082027439745447}, {"a": 0, "b": 3, "w": 0.557284828596385}, {"a": 0, "b": 4, "w": 0.5653324907542618}, {"a": 0, "b": 5, "w": 0.546301632541194}, {"a": 0, "b": 6, "w": 0.19869551148280706}, {"a": 0, "b": 7, "w": 0.45102342336003975}, {"a": 0, "b": 8, "w": 0.3659499164869394}, {"a": 0, "b": 9, "w": 4.0707659465510915e-11}, {"a": 0, "b": 10, "w": 0.27754103307622846}, {"a": 0, "b": 11, "w": 0.48839449596502826}, {"a": 0, "b": 12, "w": 0.4393376627844314}, {"a": 0, "b": 13, "w": 0.5926908742945074}, {"a": 0, "b": 14, "w": 0.5840240759261339}, {"a": 0, "b": 15, "w": 0.19412066696635932}, {"a": 0, "b": 16, "w": 0.436166156348227}, {"a": 0, "b": 17, "w": 0.40647457548380883}, {"a": 0, "b": 18, "w": 0.19091340840493753}, {"a": 0, "b": 19, "w": 0.4628246288811779}, {"a": 0, "b": 20, "w": 0.4402315329594395}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=0.039,hiY=0.583;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
