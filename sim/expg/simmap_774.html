<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Be OK [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.13, "c": "種", "n": "Be OK [A]  n=2979 cos1.00 難-0.13", "s": 0.808, "f": 0}, {"x": 0.998, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos1.00 難-0.11", "s": 0.847, "f": 0}, {"x": 0.997, "y": -0.153, "c": "近傍", "n": "Everlasting Last [A]  n=3195 cos1.00 難-0.15", "s": 0.867, "f": 0}, {"x": 0.998, "y": -0.038, "c": "近傍", "n": "POODLE [A]  n=2921 cos1.00 難-0.04", "s": 0.793, "f": 0}, {"x": 0.997, "y": -0.189, "c": "近傍", "n": "ACCELERATE [A]  n=2996 cos1.00 難-0.19", "s": 0.813, "f": 0}, {"x": 0.998, "y": -0.23, "c": "近傍", "n": "Prohibited Props [A]  n=2358 cos1.00 難-0.23", "s": 0.64, "f": 0}, {"x": 0.996, "y": -0.106, "c": "近傍", "n": "BLO§OM [A]  n=2553 cos1.00 難-0.11", "s": 0.693, "f": 0}, {"x": 0.997, "y": -0.06, "c": "近傍", "n": "NPC World [A]  n=2848 cos1.00 難-0.06", "s": 0.773, "f": 0}, {"x": 0.996, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos1.00 難-0.12", "s": 0.826, "f": 0}, {"x": 0.996, "y": -0.172, "c": "近傍", "n": "N.O. [A]  n=2208 cos1.00 難-0.17", "s": 0.599, "f": 0}, {"x": 0.996, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos1.00 難-0.10", "s": 0.862, "f": 0}, {"x": 0.996, "y": -0.075, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3049 cos1.00 難-0.08", "s": 0.827, "f": 0}, {"x": 0.996, "y": -0.082, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2791 cos1.00 難-0.08", "s": 0.757, "f": 0}, {"x": 0.996, "y": -0.239, "c": "近傍", "n": "Devil's Gear [H]  n=2603 cos1.00 難-0.24", "s": 0.706, "f": 0}, {"x": 0.999, "y": -0.299, "c": "近傍", "n": "Answer [A]  n=3209 cos1.00 難-0.30", "s": 0.871, "f": 0}, {"x": 0.995, "y": -0.087, "c": "近傍", "n": "Super Duper Racers [A]  n=2871 cos0.99 難-0.09", "s": 0.779, "f": 0}, {"x": 0.997, "y": -0.285, "c": "近傍", "n": "アルストロメリア [A]  n=3685 cos1.00 難-0.28", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "ハイ*ビスカス ft. Kanae Asaba [A]  n=3283 cos0.99 難-0.19", "s": 0.891, "f": 0}, {"x": 0.995, "y": -0.033, "c": "近傍", "n": "GREEN EYES [A]  n=1808 cos1.00 難-0.03", "s": 0.491, "f": 0}, {"x": 0.995, "y": -0.229, "c": "近傍", "n": "星をこの手に [A]  n=3012 cos1.00 難-0.23", "s": 0.817, "f": 0}, {"x": 0.994, "y": -0.142, "c": "近傍", "n": "Flash Back 90's [A]  n=3435 cos0.99 難-0.14", "s": 0.932, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5280886670170977}, {"a": 0, "b": 2, "w": 0.2727902629076596}, {"a": 0, "b": 3, "w": 0.5065813708889223}, {"a": 0, "b": 4, "w": 0.35842193975904524}, {"a": 0, "b": 5, "w": 0.44395561370849623}, {"a": 0, "b": 6, "w": 0.19682206562172722}, {"a": 0, "b": 7, "w": 0.37014134908130714}, {"a": 0, "b": 8, "w": 0.28162595844703975}, {"a": 0, "b": 9, "w": 0.32229789182531177}, {"a": 0, "b": 10, "w": 0.3162781958463349}, {"a": 0, "b": 11, "w": 0.2926900362304822}, {"a": 0, "b": 12, "w": 0.18135623923790123}, {"a": 0, "b": 13, "w": 0.24034239759802722}, {"a": 0, "b": 14, "w": 0.5552784163811457}, {"a": 0, "b": 15, "w": 7.65508767486267e-11}, {"a": 0, "b": 16, "w": 0.3714924775772074}, {"a": 0, "b": 17, "w": 0.1967034539241208}, {"a": 0, "b": 18, "w": 0.21620375032860562}, {"a": 0, "b": 19, "w": 0.23446106036660264}, {"a": 0, "b": 20, "w": 0.16373444164119655}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.321,hiY=-0.011;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
