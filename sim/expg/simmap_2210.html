<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">VALLIS-NERIA [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.748, "c": "種", "n": "VALLIS-NERIA [A]  n=3494 cos1.00 難0.75", "s": 0.934, "f": 0}, {"x": 0.99, "y": 0.52, "c": "近傍", "n": "ADAMANT [A]  n=1501 cos0.99 難0.52", "s": 0.401, "f": 0}, {"x": 0.986, "y": 0.753, "c": "近傍", "n": "BIGソムタム [A]  n=3088 cos0.99 難0.75", "s": 0.825, "f": 0}, {"x": 0.988, "y": 0.565, "c": "近傍", "n": "Steel Edge [A]  n=3742 cos0.99 難0.57", "s": 1.0, "f": 0}, {"x": 0.987, "y": 0.458, "c": "近傍", "n": "AsiaN distractive [A]  n=3181 cos0.99 難0.46", "s": 0.85, "f": 0}, {"x": 0.989, "y": 0.421, "c": "近傍", "n": "Scharfrichter [A]  n=3411 cos0.99 難0.42", "s": 0.912, "f": 0}, {"x": 0.984, "y": 0.836, "c": "近傍", "n": "Highcharge Divolt [A]  n=3599 cos0.98 難0.84", "s": 0.962, "f": 0}, {"x": 0.985, "y": 0.57, "c": "近傍", "n": "HIGH [L]  n=879 cos0.98 難0.57", "s": 0.235, "f": 0}, {"x": 0.984, "y": 0.603, "c": "近傍", "n": "Garuda [A]  n=2805 cos0.98 難0.60", "s": 0.75, "f": 0}, {"x": 0.993, "y": 0.288, "c": "近傍", "n": "Daily Lunch Special [A]  n=3532 cos0.99 難0.29", "s": 0.944, "f": 0}, {"x": 0.986, "y": 0.448, "c": "近傍", "n": "Derelict Star feat. Ryu* [A]  n=3112 cos0.99 難0.45", "s": 0.832, "f": 0}, {"x": 0.984, "y": 0.488, "c": "近傍", "n": "Cleopatrysm [A]  n=3251 cos0.98 難0.49", "s": 0.869, "f": 0}, {"x": 0.982, "y": 0.825, "c": "近傍", "n": "GIGANT [L]  n=1745 cos0.98 難0.82", "s": 0.466, "f": 0}, {"x": 0.987, "y": 1.133, "c": "近傍", "n": "Megalara Garuda [A]  n=2806 cos0.99 難1.13", "s": 0.75, "f": 0}, {"x": 0.982, "y": 0.603, "c": "近傍", "n": "Time to Air [A]  n=3596 cos0.98 難0.60", "s": 0.961, "f": 0}, {"x": 0.988, "y": 0.308, "c": "近傍", "n": "Linus [A]  n=3389 cos0.99 難0.31", "s": 0.906, "f": 0}, {"x": 0.981, "y": 0.885, "c": "近傍", "n": "Critical Crystal [A]  n=3613 cos0.98 難0.88", "s": 0.966, "f": 0}, {"x": 0.981, "y": 0.733, "c": "近傍", "n": "ディッシュウォッシャー◎彡おいわちゃん [A]  n=3068 cos0.98 難0.73", "s": 0.82, "f": 0}, {"x": 0.987, "y": 0.311, "c": "近傍", "n": "lowercase lifetime [A]  n=1449 cos0.99 難0.31", "s": 0.387, "f": 0}, {"x": 0.986, "y": 0.317, "c": "近傍", "n": "ROTTERDAM SHOGUN [A]  n=3427 cos0.99 難0.32", "s": 0.916, "f": 0}, {"x": 0.984, "y": 0.392, "c": "近傍", "n": "ELYSIUM [A]  n=1499 cos0.98 難0.39", "s": 0.401, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.484385520053215}, {"a": 0, "b": 2, "w": 0.4017505264027692}, {"a": 0, "b": 3, "w": 0.44731969702348173}, {"a": 0, "b": 4, "w": 0.29183885222948125}, {"a": 0, "b": 5, "w": 0.4480505721083444}, {"a": 0, "b": 6, "w": 0.3974548632696192}, {"a": 0, "b": 7, "w": 0.35478559128712317}, {"a": 0, "b": 8, "w": 0.3186439988288928}, {"a": 0, "b": 9, "w": 0.4853841252847424}, {"a": 0, "b": 10, "w": 0.3319027107241008}, {"a": 0, "b": 11, "w": 0.18159135815420668}, {"a": 0, "b": 12, "w": 0.349177361176202}, {"a": 0, "b": 13, "w": 0.44212204664489474}, {"a": 0, "b": 14, "w": 0.3598200663777278}, {"a": 0, "b": 15, "w": 2.4910851159631875e-11}, {"a": 0, "b": 16, "w": 0.33942928573908715}, {"a": 0, "b": 17, "w": 0.2985488770645459}, {"a": 0, "b": 18, "w": 0.3349660430418435}, {"a": 0, "b": 19, "w": 0.2972692907042046}, {"a": 0, "b": 20, "w": 0.38977977562642785}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=0.221,hiY=1.200;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
