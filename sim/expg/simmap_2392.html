<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">reunion [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.287, "c": "種", "n": "reunion [H]  n=3561 cos1.00 難0.29", "s": 0.958, "f": 0}, {"x": 0.996, "y": 0.314, "c": "近傍", "n": "murmur twins [A]  n=3523 cos1.00 難0.31", "s": 0.948, "f": 0}, {"x": 0.996, "y": 0.403, "c": "近傍", "n": "INVISIBLE STRIX [A]  n=3037 cos1.00 難0.40", "s": 0.817, "f": 0}, {"x": 0.997, "y": 0.146, "c": "近傍", "n": "Believe In Me [A]  n=3504 cos1.00 難0.15", "s": 0.942, "f": 0}, {"x": 0.994, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.849, "f": 0}, {"x": 0.993, "y": 0.314, "c": "近傍", "n": "Secret of Love [A]  n=3055 cos0.99 難0.31", "s": 0.822, "f": 0}, {"x": 0.993, "y": 0.253, "c": "近傍", "n": "ZED [A]  n=3484 cos0.99 難0.25", "s": 0.937, "f": 0}, {"x": 0.995, "y": 0.133, "c": "近傍", "n": "Lost Souls [A]  n=2604 cos0.99 難0.13", "s": 0.7, "f": 0}, {"x": 0.993, "y": 0.321, "c": "近傍", "n": "Battleground [A]  n=3265 cos0.99 難0.32", "s": 0.878, "f": 0}, {"x": 0.993, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.931, "f": 0}, {"x": 0.994, "y": 0.141, "c": "近傍", "n": "牧神笛吹きて [A]  n=3417 cos0.99 難0.14", "s": 0.919, "f": 0}, {"x": 0.993, "y": 0.179, "c": "近傍", "n": "麗 ～うらら～ [A]  n=3577 cos0.99 難0.18", "s": 0.962, "f": 0}, {"x": 0.993, "y": 0.205, "c": "近傍", "n": "嘆きの樹 [H]  n=3718 cos0.99 難0.20", "s": 1.0, "f": 0}, {"x": 0.992, "y": 0.265, "c": "近傍", "n": "Aurora [A]  n=3647 cos0.99 難0.26", "s": 0.981, "f": 0}, {"x": 0.994, "y": 0.47, "c": "近傍", "n": "Overslept [A]  n=2558 cos0.99 難0.47", "s": 0.688, "f": 0}, {"x": 0.992, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos0.99 難0.21", "s": 0.643, "f": 0}, {"x": 0.992, "y": 0.312, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=836 cos0.99 難0.31", "s": 0.225, "f": 0}, {"x": 0.997, "y": 0.027, "c": "近傍", "n": "Don't be afraid myself [A]  n=2810 cos1.00 難0.03", "s": 0.756, "f": 0}, {"x": 0.992, "y": 0.419, "c": "近傍", "n": "Scarlet Moon [A]  n=3508 cos0.99 難0.42", "s": 0.944, "f": 0}, {"x": 0.991, "y": 0.253, "c": "近傍", "n": "spiral galaxy [A]  n=3269 cos0.99 難0.25", "s": 0.879, "f": 0}, {"x": 0.992, "y": 0.428, "c": "近傍", "n": "Angelic Jelly [A]  n=3396 cos0.99 難0.43", "s": 0.913, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4940304813388582}, {"a": 0, "b": 2, "w": 0.43004837248884864}, {"a": 0, "b": 3, "w": 0.5074680851260895}, {"a": 0, "b": 4, "w": 0.32450371322957405}, {"a": 0, "b": 5, "w": 0.054846802184585486}, {"a": 0, "b": 6, "w": 0.3680272425862626}, {"a": 0, "b": 7, "w": 0.46648065864309307}, {"a": 0, "b": 8, "w": 0.37113107889077523}, {"a": 0, "b": 9, "w": 0.3599157527993265}, {"a": 0, "b": 10, "w": 0.2135699381698256}, {"a": 0, "b": 11, "w": 0.3410152872637352}, {"a": 0, "b": 12, "w": 0.36679449441618706}, {"a": 0, "b": 13, "w": 0.2967165739690867}, {"a": 0, "b": 14, "w": 0.4260899455631578}, {"a": 0, "b": 15, "w": 0.25878674206362406}, {"a": 0, "b": 16, "w": 0.03515677765979908}, {"a": 0, "b": 17, "w": 0.5061455901953353}, {"a": 0, "b": 18, "w": 0.16488886789853974}, {"a": 0, "b": 19, "w": 0.15280982482619143}, {"a": 0, "b": 20, "w": 4.419120624987727e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.009,hiY=0.505;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
