<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Bloom [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.507, "c": "種", "n": "Bloom [A]  n=434 cos1.00 難-0.51", "s": 0.126, "f": 0}, {"x": 0.993, "y": -0.047, "c": "近傍", "n": "Timepiece phase II (CN Ver.) [H]  n=2855 cos0.99 難-0.05", "s": 0.826, "f": 0}, {"x": 0.99, "y": 0.035, "c": "近傍", "n": "Deep Sea Mystery [A]  n=1852 cos0.99 難0.03", "s": 0.536, "f": 0}, {"x": 0.98, "y": -0.134, "c": "近傍", "n": "Infinity Mirror [A]  n=2994 cos0.98 難-0.13", "s": 0.866, "f": 0}, {"x": 0.972, "y": -0.588, "c": "近傍", "n": "fallen leaves -IIDX edition- [H]  n=2439 cos0.97 難-0.59", "s": 0.706, "f": 0}, {"x": 0.979, "y": -0.038, "c": "近傍", "n": "少女アリスと箱庭幻想コンチェルト [A]  n=3364 cos0.98 難-0.04", "s": 0.973, "f": 0}, {"x": 0.972, "y": -0.315, "c": "近傍", "n": "THE BLACK KNIGHT [H]  n=2720 cos0.97 難-0.31", "s": 0.787, "f": 0}, {"x": 0.972, "y": -0.253, "c": "近傍", "n": "Pink Rose [L]  n=1241 cos0.97 難-0.25", "s": 0.359, "f": 0}, {"x": 0.971, "y": -0.257, "c": "近傍", "n": "ないないルーティン [A]  n=1760 cos0.97 難-0.26", "s": 0.509, "f": 0}, {"x": 0.972, "y": -0.213, "c": "近傍", "n": "OUTER PLANETS [A]  n=2510 cos0.97 難-0.21", "s": 0.726, "f": 0}, {"x": 0.968, "y": -0.362, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2474 cos0.97 難-0.36", "s": 0.716, "f": 0}, {"x": 0.97, "y": -0.17, "c": "近傍", "n": "Arcana [A]  n=3093 cos0.97 難-0.17", "s": 0.895, "f": 0}, {"x": 0.97, "y": -0.082, "c": "近傍", "n": "Everlasting Resort [A]  n=2852 cos0.97 難-0.08", "s": 0.825, "f": 0}, {"x": 0.965, "y": -0.379, "c": "近傍", "n": "海神 [H]  n=3059 cos0.96 難-0.38", "s": 0.885, "f": 0}, {"x": 0.964, "y": -0.617, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1115 cos0.96 難-0.62", "s": 0.323, "f": 0}, {"x": 0.968, "y": -0.97, "c": "近傍", "n": "Godspeed [H]  n=2819 cos0.97 難-0.97", "s": 0.816, "f": 0}, {"x": 0.965, "y": -0.108, "c": "近傍", "n": "Almace [A]  n=3117 cos0.97 難-0.11", "s": 0.902, "f": 0}, {"x": 0.961, "y": -0.569, "c": "近傍", "n": "真夜中のバベル [A]  n=1940 cos0.96 難-0.57", "s": 0.561, "f": 0}, {"x": 0.974, "y": 0.21, "c": "近傍", "n": "Energy Drive [A]  n=3456 cos0.97 難0.21", "s": 1.0, "f": 0}, {"x": 0.96, "y": -0.528, "c": "近傍", "n": "Hollywood Galaxy [H]  n=2636 cos0.96 難-0.53", "s": 0.763, "f": 0}, {"x": 0.98, "y": 0.307, "c": "近傍", "n": "Urban Constellations [A]  n=3168 cos0.98 難0.31", "s": 0.917, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6337253180152536}, {"a": 0, "b": 2, "w": 0.5700479507451437}, {"a": 0, "b": 3, "w": 0.3154361516835854}, {"a": 0, "b": 4, "w": 0.25219124986345365}, {"a": 0, "b": 5, "w": 0.3056461610093756}, {"a": 0, "b": 6, "w": 0.20183877713521536}, {"a": 0, "b": 7, "w": 0.2557119915202827}, {"a": 0, "b": 8, "w": 0.2889218054140751}, {"a": 0, "b": 9, "w": 0.2723116773490848}, {"a": 0, "b": 10, "w": 0.21731067382585323}, {"a": 0, "b": 11, "w": 0.19180904262679943}, {"a": 0, "b": 12, "w": 0.19596882132900983}, {"a": 0, "b": 13, "w": 0.13979403996557727}, {"a": 0, "b": 14, "w": 0.07683151203906946}, {"a": 0, "b": 15, "w": 0.1841001475065791}, {"a": 0, "b": 16, "w": 0.21057676842375028}, {"a": 0, "b": 17, "w": 2.517008823588185e-11}, {"a": 0, "b": 18, "w": 0.3266118404833209}, {"a": 0, "b": 19, "w": 0.15999637021688495}, {"a": 0, "b": 20, "w": 0.3961668579272132}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.957,hiX=1.003,loY=-1.072,hiY=0.410;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
