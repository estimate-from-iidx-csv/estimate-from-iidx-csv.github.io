<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Giudecca [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.851, "c": "種", "n": "Giudecca [H]  n=1654 cos1.00 難-0.85", "s": 0.515, "f": 0}, {"x": 0.997, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos1.00 難-0.86", "s": 0.576, "f": 0}, {"x": 0.997, "y": -0.902, "c": "近傍", "n": "Love Is Eternity [H]  n=1794 cos1.00 難-0.90", "s": 0.559, "f": 0}, {"x": 0.997, "y": -0.902, "c": "近傍", "n": "24th Century BOY [H]  n=2430 cos1.00 難-0.90", "s": 0.757, "f": 0}, {"x": 0.996, "y": -0.886, "c": "近傍", "n": "Keep it-秋葉工房mix- [H]  n=1987 cos1.00 難-0.89", "s": 0.619, "f": 0}, {"x": 0.996, "y": -0.858, "c": "近傍", "n": "KAMAITACHI [H]  n=2385 cos1.00 難-0.86", "s": 0.743, "f": 0}, {"x": 0.997, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos1.00 難-0.74", "s": 0.639, "f": 0}, {"x": 0.994, "y": -0.851, "c": "近傍", "n": "ZERO-ONE [H]  n=1902 cos0.99 難-0.85", "s": 0.593, "f": 0}, {"x": 0.994, "y": -0.889, "c": "近傍", "n": "BROKEN EDEN [H]  n=2057 cos0.99 難-0.89", "s": 0.641, "f": 0}, {"x": 0.997, "y": -0.708, "c": "近傍", "n": "quasar [H]  n=3209 cos1.00 難-0.71", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.964, "c": "近傍", "n": "Colors -Y&Co. Eurobeat Remix- [H]  n=1963 cos1.00 難-0.96", "s": 0.612, "f": 0}, {"x": 0.993, "y": -0.862, "c": "近傍", "n": "Votum stellarum [H]  n=1927 cos0.99 難-0.86", "s": 0.6, "f": 0}, {"x": 0.993, "y": -0.878, "c": "近傍", "n": "xenon [H]  n=2369 cos0.99 難-0.88", "s": 0.738, "f": 0}, {"x": 0.996, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos1.00 難-0.71", "s": 0.711, "f": 0}, {"x": 0.994, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos0.99 難-0.75", "s": 0.44, "f": 0}, {"x": 0.993, "y": -0.806, "c": "近傍", "n": "HYPERION [H]  n=1840 cos0.99 難-0.81", "s": 0.573, "f": 0}, {"x": 0.993, "y": -0.919, "c": "近傍", "n": "仮想空間の旅人たち [H]  n=2266 cos0.99 難-0.92", "s": 0.706, "f": 0}, {"x": 0.993, "y": -0.781, "c": "近傍", "n": "Broken [H]  n=3144 cos0.99 難-0.78", "s": 0.98, "f": 0}, {"x": 0.995, "y": -0.995, "c": "近傍", "n": "UMMU [H]  n=2416 cos1.00 難-0.99", "s": 0.753, "f": 0}, {"x": 0.993, "y": -0.915, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [H]  n=1587 cos0.99 難-0.92", "s": 0.495, "f": 0}, {"x": 0.996, "y": -1.017, "c": "近傍", "n": "#The_Relentless [H]  n=2018 cos1.00 難-1.02", "s": 0.629, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5415270197954435}, {"a": 0, "b": 2, "w": 0.44964160103399275}, {"a": 0, "b": 3, "w": 0.4644278125989926}, {"a": 0, "b": 4, "w": 0.46186085717929837}, {"a": 0, "b": 5, "w": 0.43213877287121194}, {"a": 0, "b": 6, "w": 0.5669855313965506}, {"a": 0, "b": 7, "w": 0.37633693115027955}, {"a": 0, "b": 8, "w": 0.3813523975574906}, {"a": 0, "b": 9, "w": 0.5499510986942739}, {"a": 0, "b": 10, "w": 0.44172949923869886}, {"a": 0, "b": 11, "w": 0.2859401301989315}, {"a": 0, "b": 12, "w": 0.3310014678838248}, {"a": 0, "b": 13, "w": 0.4269685274450544}, {"a": 0, "b": 14, "w": 0.3301270322336223}, {"a": 0, "b": 15, "w": 0.3222983091584827}, {"a": 0, "b": 16, "w": 0.3070766995926497}, {"a": 0, "b": 17, "w": 0.33252954838292315}, {"a": 0, "b": 18, "w": 6.310396649666927e-11}, {"a": 0, "b": 19, "w": 0.253910093162518}, {"a": 0, "b": 20, "w": 0.3762353175503236}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-1.041,hiY=-0.684;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
