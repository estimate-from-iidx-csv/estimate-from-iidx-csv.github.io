<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Feel The Beat [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.62, "c": "種", "n": "Feel The Beat [H]  n=2621 cos1.00 難-0.62", "s": 0.813, "f": 0}, {"x": 0.992, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.99 難-0.65", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.827, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2332 cos1.00 難-0.83", "s": 0.724, "f": 0}, {"x": 0.995, "y": -0.434, "c": "近傍", "n": "Ristaccia [H]  n=2300 cos0.99 難-0.43", "s": 0.714, "f": 0}, {"x": 0.99, "y": -0.495, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2388 cos0.99 難-0.49", "s": 0.741, "f": 0}, {"x": 0.991, "y": -0.761, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2360 cos0.99 難-0.76", "s": 0.732, "f": 0}, {"x": 0.989, "y": -0.591, "c": "近傍", "n": "the shadow [H]  n=1899 cos0.99 難-0.59", "s": 0.589, "f": 0}, {"x": 0.991, "y": -0.801, "c": "近傍", "n": "Turii ～Panta rhei～ [H]  n=2344 cos0.99 難-0.80", "s": 0.727, "f": 0}, {"x": 0.988, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos0.99 難-0.71", "s": 0.708, "f": 0}, {"x": 0.992, "y": -0.388, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [H]  n=2983 cos0.99 難-0.39", "s": 0.926, "f": 0}, {"x": 0.99, "y": -0.789, "c": "近傍", "n": "星をこの手に [H]  n=1902 cos0.99 難-0.79", "s": 0.59, "f": 0}, {"x": 0.995, "y": -0.336, "c": "近傍", "n": "オッド ラヴィ [A]  n=1487 cos0.99 難-0.34", "s": 0.461, "f": 0}, {"x": 0.987, "y": -0.599, "c": "近傍", "n": "GHOST REVIVAL [H]  n=1609 cos0.99 難-0.60", "s": 0.499, "f": 0}, {"x": 0.987, "y": -0.633, "c": "近傍", "n": "WONDER WALKER [H]  n=2625 cos0.99 難-0.63", "s": 0.814, "f": 0}, {"x": 0.992, "y": -0.871, "c": "近傍", "n": "Modular Technology [H]  n=2229 cos0.99 難-0.87", "s": 0.692, "f": 0}, {"x": 0.987, "y": -0.59, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1932 cos0.99 難-0.59", "s": 0.599, "f": 0}, {"x": 0.987, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.506, "f": 0}, {"x": 0.987, "y": -0.507, "c": "近傍", "n": "Too Late Snow [A]  n=1376 cos0.99 難-0.51", "s": 0.427, "f": 0}, {"x": 0.993, "y": -0.332, "c": "近傍", "n": "Blue Spring Express [H]  n=2400 cos0.99 難-0.33", "s": 0.745, "f": 0}, {"x": 0.986, "y": -0.582, "c": "近傍", "n": "それは花火のような恋 [H]  n=2647 cos0.99 難-0.58", "s": 0.821, "f": 0}, {"x": 0.987, "y": -0.741, "c": "近傍", "n": "INAZUMA [H]  n=2052 cos0.99 難-0.74", "s": 0.637, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2937113396984874}, {"a": 0, "b": 2, "w": 0.6132992039157945}, {"a": 0, "b": 3, "w": 0.4425293324999918}, {"a": 0, "b": 4, "w": 0.38942807214137853}, {"a": 0, "b": 5, "w": 0.3337824547277072}, {"a": 0, "b": 6, "w": 0.20810617097863515}, {"a": 0, "b": 7, "w": 0.2012358207700864}, {"a": 0, "b": 8, "w": 0.17137955841679464}, {"a": 0, "b": 9, "w": 0.38940729906155425}, {"a": 0, "b": 10, "w": 0.22433068817801238}, {"a": 0, "b": 11, "w": 0.5438681363280935}, {"a": 0, "b": 12, "w": 0.0763103673544081}, {"a": 0, "b": 13, "w": 0.07473833906268412}, {"a": 0, "b": 14, "w": 0.4105278906605083}, {"a": 0, "b": 15, "w": 0.2633740626884139}, {"a": 0, "b": 16, "w": 0.15303625424774814}, {"a": 0, "b": 17, "w": 0.04682123677488925}, {"a": 0, "b": 18, "w": 0.4684509490466193}, {"a": 0, "b": 19, "w": 0.1501333349288695}, {"a": 0, "b": 20, "w": 4.0628611586157604e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-0.914,hiY=-0.289;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
