<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CODE:2 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.635, "c": "種", "n": "CODE:2 [H]  n=314 cos1.00 難-1.64", "s": 0.169, "f": 0}, {"x": 0.995, "y": -1.616, "c": "近傍", "n": "Exhaust Hype [H]  n=1305 cos0.99 難-1.62", "s": 0.704, "f": 0}, {"x": 0.994, "y": -1.59, "c": "近傍", "n": "天邪鬼 [H]  n=1286 cos0.99 難-1.59", "s": 0.694, "f": 0}, {"x": 0.994, "y": -1.704, "c": "近傍", "n": "SPEED ROCKER [H]  n=1118 cos0.99 難-1.70", "s": 0.603, "f": 0}, {"x": 0.994, "y": -1.521, "c": "近傍", "n": "50th Memorial Songs -The BEMANI History- [H]  n=1005 cos0.99 難-1.52", "s": 0.542, "f": 0}, {"x": 0.992, "y": -1.707, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [H]  n=830 cos0.99 難-1.71", "s": 0.448, "f": 0}, {"x": 0.995, "y": -1.483, "c": "近傍", "n": "Sirius [H]  n=510 cos0.99 難-1.48", "s": 0.275, "f": 0}, {"x": 0.992, "y": -1.723, "c": "近傍", "n": "VJ ARMY [H]  n=597 cos0.99 難-1.72", "s": 0.322, "f": 0}, {"x": 0.994, "y": -1.482, "c": "近傍", "n": "Vitrum [H]  n=1210 cos0.99 難-1.48", "s": 0.653, "f": 0}, {"x": 0.994, "y": -1.481, "c": "近傍", "n": "Battleground [H]  n=1213 cos0.99 難-1.48", "s": 0.654, "f": 0}, {"x": 0.991, "y": -1.685, "c": "近傍", "n": "GIGA THRASH [H]  n=1174 cos0.99 難-1.68", "s": 0.633, "f": 0}, {"x": 0.991, "y": -1.747, "c": "近傍", "n": "Nocturnal 2097 [H]  n=718 cos0.99 難-1.75", "s": 0.387, "f": 0}, {"x": 0.993, "y": -1.476, "c": "近傍", "n": "XINOBIKILL [H]  n=1493 cos0.99 難-1.48", "s": 0.805, "f": 0}, {"x": 0.99, "y": -1.603, "c": "近傍", "n": "Friction[!]Function [H]  n=1113 cos0.99 難-1.60", "s": 0.6, "f": 0}, {"x": 0.995, "y": -1.427, "c": "近傍", "n": "Amazing Mirage [H]  n=1854 cos0.99 難-1.43", "s": 1.0, "f": 0}, {"x": 0.993, "y": -1.459, "c": "近傍", "n": "夢縁 [H]  n=1038 cos0.99 難-1.46", "s": 0.56, "f": 0}, {"x": 0.99, "y": -1.731, "c": "近傍", "n": "Change Yourself [H]  n=857 cos0.99 難-1.73", "s": 0.462, "f": 0}, {"x": 0.99, "y": -1.758, "c": "近傍", "n": "Submerge Serenade [H]  n=601 cos0.99 難-1.76", "s": 0.324, "f": 0}, {"x": 0.99, "y": -1.554, "c": "近傍", "n": "ZENDEGI DANCE [H]  n=1081 cos0.99 難-1.55", "s": 0.583, "f": 0}, {"x": 0.994, "y": -1.842, "c": "近傍", "n": "Neo Heritage [H]  n=803 cos0.99 難-1.84", "s": 0.433, "f": 0}, {"x": 0.988, "y": -1.601, "c": "近傍", "n": "Like+it! [H]  n=1120 cos0.99 難-1.60", "s": 0.604, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5397928984718472}, {"a": 0, "b": 2, "w": 0.5594471768200061}, {"a": 0, "b": 3, "w": 0.5755958329279313}, {"a": 0, "b": 4, "w": 0.542803270361986}, {"a": 0, "b": 5, "w": 4.622580096480533e-11}, {"a": 0, "b": 6, "w": 0.4513746433272462}, {"a": 0, "b": 7, "w": 0.4775182538809488}, {"a": 0, "b": 8, "w": 0.5712470518766974}, {"a": 0, "b": 9, "w": 0.3175813074961352}, {"a": 0, "b": 10, "w": 0.32176806674585867}, {"a": 0, "b": 11, "w": 0.29461907478238014}, {"a": 0, "b": 12, "w": 0.3876704140394923}, {"a": 0, "b": 13, "w": 0.3919769864215187}, {"a": 0, "b": 14, "w": 0.5536021342884907}, {"a": 0, "b": 15, "w": 0.3093473467444453}, {"a": 0, "b": 16, "w": 0.3541428770983909}, {"a": 0, "b": 17, "w": 0.3813910431512053}, {"a": 0, "b": 18, "w": 0.3710129259371847}, {"a": 0, "b": 19, "w": 0.524492751289237}, {"a": 0, "b": 20, "w": 0.19475042866563652}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.875,hiY=-1.394;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
