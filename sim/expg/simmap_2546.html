<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Caterpillar [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.187, "c": "種", "n": "Caterpillar [A]  n=3426 cos1.00 難1.19", "s": 0.916, "f": 0}, {"x": 0.994, "y": 1.16, "c": "近傍", "n": "SAY BAY [A]  n=3492 cos0.99 難1.16", "s": 0.934, "f": 0}, {"x": 0.994, "y": 0.962, "c": "近傍", "n": "BRAINSTORM [A]  n=3414 cos0.99 難0.96", "s": 0.913, "f": 0}, {"x": 0.991, "y": 1.271, "c": "近傍", "n": "FANTASTIC THREE [A]  n=3320 cos0.99 難1.27", "s": 0.888, "f": 0}, {"x": 0.994, "y": 0.817, "c": "近傍", "n": "VOLCANIC BIGBEAT [A]  n=2166 cos0.99 難0.82", "s": 0.579, "f": 0}, {"x": 0.989, "y": 1.363, "c": "近傍", "n": "Level 2 [A]  n=2879 cos0.99 難1.36", "s": 0.77, "f": 0}, {"x": 0.988, "y": 1.106, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3283 cos0.99 難1.11", "s": 0.878, "f": 0}, {"x": 0.991, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.99 難0.91", "s": 0.907, "f": 0}, {"x": 0.989, "y": 1.417, "c": "近傍", "n": "HADES [A]  n=3297 cos0.99 難1.42", "s": 0.882, "f": 0}, {"x": 0.989, "y": 1.461, "c": "近傍", "n": "LASER CRUSTER (IGNITE REMIX) [A]  n=2516 cos0.99 難1.46", "s": 0.673, "f": 0}, {"x": 0.987, "y": 1.046, "c": "近傍", "n": "FlyAway [A]  n=1229 cos0.99 難1.05", "s": 0.329, "f": 0}, {"x": 0.986, "y": 1.395, "c": "近傍", "n": "STARLIGHT DANCEHALL [L]  n=2921 cos0.99 難1.39", "s": 0.781, "f": 0}, {"x": 0.989, "y": 1.568, "c": "近傍", "n": "2 Beasts Unchained [A]  n=1870 cos0.99 難1.57", "s": 0.5, "f": 0}, {"x": 0.986, "y": 0.96, "c": "近傍", "n": "Funny shuffle [A]  n=3259 cos0.99 難0.96", "s": 0.872, "f": 0}, {"x": 0.988, "y": 0.79, "c": "近傍", "n": "The Sampling Paradise [A]  n=3739 cos0.99 難0.79", "s": 1.0, "f": 0}, {"x": 0.986, "y": 0.901, "c": "近傍", "n": "dica dica [A]  n=2099 cos0.99 難0.90", "s": 0.561, "f": 0}, {"x": 0.984, "y": 1.035, "c": "近傍", "n": "Theory [A]  n=2919 cos0.98 難1.04", "s": 0.781, "f": 0}, {"x": 0.987, "y": 1.577, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1567 cos0.99 難1.58", "s": 0.419, "f": 0}, {"x": 0.986, "y": 1.544, "c": "近傍", "n": "廿 [L]  n=2717 cos0.99 難1.54", "s": 0.727, "f": 0}, {"x": 0.985, "y": 1.506, "c": "近傍", "n": "Boomy and The Boost [A]  n=3143 cos0.99 難1.51", "s": 0.841, "f": 0}, {"x": 0.983, "y": 1.293, "c": "近傍", "n": "火影 [A]  n=3397 cos0.98 難1.29", "s": 0.909, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4770483817011054}, {"a": 0, "b": 2, "w": 0.3534434599168601}, {"a": 0, "b": 3, "w": 0.3404794264334162}, {"a": 0, "b": 4, "w": 0.3198916433587603}, {"a": 0, "b": 5, "w": 0.3123552294867653}, {"a": 0, "b": 6, "w": 0.18530222688241182}, {"a": 0, "b": 7, "w": 3.1562086277858725e-11}, {"a": 0, "b": 8, "w": 0.3226518852097694}, {"a": 0, "b": 9, "w": 0.1981272857573836}, {"a": 0, "b": 10, "w": 0.24344365160217685}, {"a": 0, "b": 11, "w": 0.1522811827247944}, {"a": 0, "b": 12, "w": 0.16583813050707785}, {"a": 0, "b": 13, "w": 0.06231703576989933}, {"a": 0, "b": 14, "w": 0.26829133261472315}, {"a": 0, "b": 15, "w": 0.1936121871405697}, {"a": 0, "b": 16, "w": 0.04317743345737224}, {"a": 0, "b": 17, "w": 0.18966101911883448}, {"a": 0, "b": 18, "w": 0.05122421800473165}, {"a": 0, "b": 19, "w": 0.15659490137672205}, {"a": 0, "b": 20, "w": 0.12310092186972521}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=0.727,hiY=1.640;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
