<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Shooting Fireball [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.335, "c": "種", "n": "Shooting Fireball [H]  n=2562 cos1.00 難-0.33", "s": 0.731, "f": 0}, {"x": 0.996, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos1.00 難-0.32", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.342, "c": "近傍", "n": "ZZ [H]  n=3336 cos1.00 難-0.34", "s": 0.952, "f": 0}, {"x": 0.996, "y": -0.376, "c": "近傍", "n": "True Blue [H]  n=3054 cos1.00 難-0.38", "s": 0.872, "f": 0}, {"x": 0.996, "y": -0.28, "c": "近傍", "n": "PLASMA [A]  n=2450 cos1.00 難-0.28", "s": 0.699, "f": 0}, {"x": 0.995, "y": -0.332, "c": "近傍", "n": "refrain [H]  n=2583 cos1.00 難-0.33", "s": 0.737, "f": 0}, {"x": 0.995, "y": -0.38, "c": "近傍", "n": "Saturn [H]  n=2297 cos1.00 難-0.38", "s": 0.656, "f": 0}, {"x": 0.995, "y": -0.309, "c": "近傍", "n": "Summerblue [A]  n=2188 cos1.00 難-0.31", "s": 0.625, "f": 0}, {"x": 0.995, "y": -0.301, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2372 cos0.99 難-0.30", "s": 0.677, "f": 0}, {"x": 0.997, "y": -0.191, "c": "近傍", "n": "stoic [H]  n=2578 cos1.00 難-0.19", "s": 0.736, "f": 0}, {"x": 0.995, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.821, "f": 0}, {"x": 0.996, "y": -0.459, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2540 cos1.00 難-0.46", "s": 0.725, "f": 0}, {"x": 0.995, "y": -0.249, "c": "近傍", "n": "Monkey Dance [A]  n=2550 cos0.99 難-0.25", "s": 0.728, "f": 0}, {"x": 0.994, "y": -0.333, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2473 cos0.99 難-0.33", "s": 0.706, "f": 0}, {"x": 0.994, "y": -0.282, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3305 cos0.99 難-0.28", "s": 0.943, "f": 0}, {"x": 0.994, "y": -0.32, "c": "近傍", "n": "HYPER BOUNDARY GATE [A]  n=1597 cos0.99 難-0.32", "s": 0.456, "f": 0}, {"x": 0.994, "y": -0.312, "c": "近傍", "n": "楽園追放 [A]  n=1688 cos0.99 難-0.31", "s": 0.482, "f": 0}, {"x": 0.994, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.789, "f": 0}, {"x": 0.994, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos0.99 難-0.27", "s": 0.708, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "ハイ*ビスカス ft. Kanae Asaba [A]  n=3283 cos0.99 難-0.19", "s": 0.937, "f": 0}, {"x": 0.993, "y": -0.28, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2555 cos0.99 難-0.28", "s": 0.729, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.33883506448595113}, {"a": 0, "b": 2, "w": 0.32604025658716584}, {"a": 0, "b": 3, "w": 0.3728827363224948}, {"a": 0, "b": 4, "w": 0.2825323187160105}, {"a": 0, "b": 5, "w": 0.30541644814977464}, {"a": 0, "b": 6, "w": 0.31964183630583176}, {"a": 0, "b": 7, "w": 0.2995929032700938}, {"a": 0, "b": 8, "w": 0.2890912934440283}, {"a": 0, "b": 9, "w": 0.40244878135319617}, {"a": 0, "b": 10, "w": 0.2528565746650375}, {"a": 0, "b": 11, "w": 0.3672442587266518}, {"a": 0, "b": 12, "w": 0.2163709359310757}, {"a": 0, "b": 13, "w": 0.06244130213349053}, {"a": 0, "b": 14, "w": 0.2240291429391168}, {"a": 0, "b": 15, "w": 6.997302737232758e-11}, {"a": 0, "b": 16, "w": 0.013051290656303172}, {"a": 0, "b": 17, "w": 0.17945901419029808}, {"a": 0, "b": 18, "w": 0.20477870149130295}, {"a": 0, "b": 19, "w": 0.25466175541807545}, {"a": 0, "b": 20, "w": 0.17169445937899375}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.480,hiY=-0.170;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
