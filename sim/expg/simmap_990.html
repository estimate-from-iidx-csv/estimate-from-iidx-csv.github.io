<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Rainstorm [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.179, "c": "種", "n": "Rainstorm [A]  n=2795 cos1.00 難-0.18", "s": 0.75, "f": 0}, {"x": 0.998, "y": -0.249, "c": "近傍", "n": "SHOOTING STAR [A]  n=2340 cos1.00 難-0.25", "s": 0.628, "f": 0}, {"x": 0.998, "y": -0.105, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2953 cos1.00 難-0.10", "s": 0.792, "f": 0}, {"x": 0.997, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos1.00 難-0.11", "s": 0.795, "f": 0}, {"x": 0.998, "y": -0.309, "c": "近傍", "n": "Summerblue [A]  n=2188 cos1.00 難-0.31", "s": 0.587, "f": 0}, {"x": 0.996, "y": -0.166, "c": "近傍", "n": "Power of Love [A]  n=2903 cos1.00 難-0.17", "s": 0.779, "f": 0}, {"x": 0.997, "y": -0.301, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2372 cos1.00 難-0.30", "s": 0.636, "f": 0}, {"x": 0.996, "y": -0.089, "c": "近傍", "n": "バスルーム ロマンス [A]  n=2946 cos1.00 難-0.09", "s": 0.79, "f": 0}, {"x": 0.996, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos1.00 難-0.11", "s": 0.869, "f": 0}, {"x": 0.996, "y": -0.249, "c": "近傍", "n": "QUANTUM TELEPORTATION [H]  n=2521 cos1.00 難-0.25", "s": 0.676, "f": 0}, {"x": 0.996, "y": -0.134, "c": "近傍", "n": "Daisuke [A]  n=3728 cos1.00 難-0.13", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.176, "c": "近傍", "n": "Last Burning [A]  n=3166 cos1.00 難-0.18", "s": 0.849, "f": 0}, {"x": 0.997, "y": -0.342, "c": "近傍", "n": "BLUST OF WIND [A]  n=3377 cos1.00 難-0.34", "s": 0.906, "f": 0}, {"x": 0.997, "y": -0.007, "c": "近傍", "n": "Monkey Dance '09 [A]  n=2765 cos1.00 難-0.01", "s": 0.742, "f": 0}, {"x": 0.995, "y": -0.135, "c": "近傍", "n": "衰色小町メランコリア [A]  n=3173 cos1.00 難-0.13", "s": 0.851, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Fly you to the star [A]  n=3230 cos1.00 難-0.14", "s": 0.866, "f": 0}, {"x": 0.995, "y": -0.195, "c": "近傍", "n": "LESSON 5 [A]  n=2302 cos0.99 難-0.20", "s": 0.617, "f": 0}, {"x": 0.995, "y": -0.282, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3305 cos1.00 難-0.28", "s": 0.887, "f": 0}, {"x": 0.995, "y": -0.177, "c": "近傍", "n": "ABSOLUTE [A]  n=3206 cos0.99 難-0.18", "s": 0.86, "f": 0}, {"x": 0.995, "y": -0.078, "c": "近傍", "n": "HAT TRICK [A]  n=3212 cos0.99 難-0.08", "s": 0.862, "f": 0}, {"x": 0.994, "y": -0.172, "c": "近傍", "n": "深愛のリグレット [A]  n=2673 cos0.99 難-0.17", "s": 0.717, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6588733805069507}, {"a": 0, "b": 2, "w": 0.5699377228185663}, {"a": 0, "b": 3, "w": 0.4595565146512889}, {"a": 0, "b": 4, "w": 0.5985587290820586}, {"a": 0, "b": 5, "w": 0.31126781399166803}, {"a": 0, "b": 6, "w": 0.5179007284143133}, {"a": 0, "b": 7, "w": 0.34335648579712696}, {"a": 0, "b": 8, "w": 0.4521525137359438}, {"a": 0, "b": 9, "w": 0.3913532586010746}, {"a": 0, "b": 10, "w": 0.28076043719411914}, {"a": 0, "b": 11, "w": 0.435005022546589}, {"a": 0, "b": 12, "w": 0.5290719328977204}, {"a": 0, "b": 13, "w": 0.5153971163499976}, {"a": 0, "b": 14, "w": 0.2471118578612982}, {"a": 0, "b": 15, "w": 0.4103554121438847}, {"a": 0, "b": 16, "w": 0.17033417985040478}, {"a": 0, "b": 17, "w": 0.4397986253863414}, {"a": 0, "b": 18, "w": 0.39658227977038996}, {"a": 0, "b": 19, "w": 5.921774182127137e-11}, {"a": 0, "b": 20, "w": 0.31099897925648834}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.994,hiX=1.000,loY=-0.369,hiY=0.020;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
