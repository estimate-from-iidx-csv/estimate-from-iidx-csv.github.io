<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ganymede [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.664, "c": "種", "n": "Ganymede [L]  n=1988 cos1.00 難1.66", "s": 0.568, "f": 0}, {"x": 0.987, "y": 1.387, "c": "近傍", "n": "StrayedCatz [A]  n=3201 cos0.99 難1.39", "s": 0.914, "f": 0}, {"x": 0.976, "y": 1.619, "c": "近傍", "n": "uen [A]  n=834 cos0.98 難1.62", "s": 0.238, "f": 0}, {"x": 0.976, "y": 2.116, "c": "近傍", "n": "惑星鉄道 [A]  n=1100 cos0.98 難2.12", "s": 0.314, "f": 0}, {"x": 0.975, "y": 2.126, "c": "近傍", "n": "Somnidiscotheque [A]  n=1471 cos0.98 難2.13", "s": 0.42, "f": 0}, {"x": 0.972, "y": 1.238, "c": "近傍", "n": "未完成ノ蒸氣驅動乙女 [A]  n=1409 cos0.97 難1.24", "s": 0.402, "f": 0}, {"x": 0.972, "y": 1.242, "c": "近傍", "n": "疾風迅雷 [A]  n=3354 cos0.97 難1.24", "s": 0.958, "f": 0}, {"x": 0.971, "y": 1.215, "c": "近傍", "n": "One More Lovely [A]  n=3338 cos0.97 難1.21", "s": 0.953, "f": 0}, {"x": 0.97, "y": 2.116, "c": "近傍", "n": "Illegal Function Call [L]  n=1236 cos0.97 難2.12", "s": 0.353, "f": 0}, {"x": 0.971, "y": 1.138, "c": "近傍", "n": "少年A [A]  n=3502 cos0.97 難1.14", "s": 1.0, "f": 0}, {"x": 0.971, "y": 1.102, "c": "近傍", "n": "Nightmare before oversleep [A]  n=3452 cos0.97 難1.10", "s": 0.986, "f": 0}, {"x": 0.967, "y": 2.14, "c": "近傍", "n": "Mare Nectaris [A]  n=2765 cos0.97 難2.14", "s": 0.79, "f": 0}, {"x": 0.962, "y": 1.378, "c": "近傍", "n": "DUE TOMORROW [A]  n=3245 cos0.96 難1.38", "s": 0.927, "f": 0}, {"x": 0.96, "y": 1.421, "c": "近傍", "n": "Trill auf G [A]  n=3030 cos0.96 難1.42", "s": 0.865, "f": 0}, {"x": 0.982, "y": 0.875, "c": "近傍", "n": "Parvati [A]  n=2629 cos0.98 難0.87", "s": 0.751, "f": 0}, {"x": 0.958, "y": 1.648, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [L]  n=2351 cos0.96 難1.65", "s": 0.671, "f": 0}, {"x": 0.974, "y": 0.952, "c": "近傍", "n": "Beastie Starter [A]  n=3260 cos0.97 難0.95", "s": 0.931, "f": 0}, {"x": 0.974, "y": 0.943, "c": "近傍", "n": "TRANOID [A]  n=3070 cos0.97 難0.94", "s": 0.877, "f": 0}, {"x": 0.96, "y": 1.299, "c": "近傍", "n": "The Limbo [A]  n=3298 cos0.96 難1.30", "s": 0.942, "f": 0}, {"x": 0.955, "y": 1.669, "c": "近傍", "n": "Inferno of Fomalhaut [A]  n=2582 cos0.96 難1.67", "s": 0.737, "f": 0}, {"x": 0.958, "y": 1.288, "c": "近傍", "n": "Pinky Happy Crazy [A]  n=729 cos0.96 難1.29", "s": 0.208, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6456605958112479}, {"a": 0, "b": 2, "w": 0.5357698253474296}, {"a": 0, "b": 3, "w": 0.3422980769449039}, {"a": 0, "b": 4, "w": 0.2967098993953533}, {"a": 0, "b": 5, "w": 0.5115064155944822}, {"a": 0, "b": 6, "w": 0.5040810782399339}, {"a": 0, "b": 7, "w": 0.4978642043869199}, {"a": 0, "b": 8, "w": 0.17164450752789762}, {"a": 0, "b": 9, "w": 0.49820250333651217}, {"a": 0, "b": 10, "w": 0.507072214937006}, {"a": 0, "b": 11, "w": 1.5157430865997412e-11}, {"a": 0, "b": 12, "w": 0.4366943068556295}, {"a": 0, "b": 13, "w": 0.3766844297018881}, {"a": 0, "b": 14, "w": 0.6014231408104233}, {"a": 0, "b": 15, "w": 0.40578997463339095}, {"a": 0, "b": 16, "w": 0.48702332876231824}, {"a": 0, "b": 17, "w": 0.525139240542051}, {"a": 0, "b": 18, "w": 0.3863798796573831}, {"a": 0, "b": 19, "w": 0.16964700924692389}, {"a": 0, "b": 20, "w": 0.34300680819650997}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.951,hiX=1.004,loY=0.773,hiY=2.241;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
