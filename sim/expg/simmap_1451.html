<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">oratio [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.265, "c": "種", "n": "oratio [H]  n=2400 cos1.00 難-0.27", "s": 0.741, "f": 0}, {"x": 0.997, "y": -0.322, "c": "近傍", "n": "Arabian Rave Night [H]  n=2707 cos1.00 難-0.32", "s": 0.835, "f": 0}, {"x": 0.998, "y": -0.384, "c": "近傍", "n": "Zirkfied [H]  n=2984 cos1.00 難-0.38", "s": 0.921, "f": 0}, {"x": 0.995, "y": -0.193, "c": "近傍", "n": "SPEEDY CAT [A]  n=2409 cos1.00 難-0.19", "s": 0.743, "f": 0}, {"x": 0.994, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.887, "f": 0}, {"x": 0.993, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.853, "f": 0}, {"x": 0.994, "y": -0.177, "c": "近傍", "n": "Keep it-秋葉工房mix- [A]  n=3105 cos0.99 難-0.18", "s": 0.958, "f": 0}, {"x": 0.996, "y": -0.103, "c": "近傍", "n": "double thrash [H]  n=2119 cos1.00 難-0.10", "s": 0.654, "f": 0}, {"x": 0.994, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos0.99 難-0.12", "s": 0.94, "f": 0}, {"x": 0.993, "y": -0.156, "c": "近傍", "n": "1st Samurai [H]  n=2306 cos0.99 難-0.16", "s": 0.712, "f": 0}, {"x": 0.992, "y": -0.248, "c": "近傍", "n": "Change the World [A]  n=2740 cos0.99 難-0.25", "s": 0.845, "f": 0}, {"x": 0.994, "y": -0.12, "c": "近傍", "n": "moon_child [H]  n=2780 cos0.99 難-0.12", "s": 0.858, "f": 0}, {"x": 0.992, "y": -0.23, "c": "近傍", "n": "Scripted Connection⇒ H mix [H]  n=2491 cos0.99 難-0.23", "s": 0.769, "f": 0}, {"x": 0.994, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos0.99 難-0.11", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos0.99 難-0.27", "s": 0.766, "f": 0}, {"x": 0.991, "y": -0.301, "c": "近傍", "n": "MOON RACE [A]  n=2495 cos0.99 難-0.30", "s": 0.77, "f": 0}, {"x": 0.991, "y": -0.325, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3121 cos0.99 難-0.32", "s": 0.963, "f": 0}, {"x": 0.991, "y": -0.267, "c": "近傍", "n": "Confiserie [H]  n=3058 cos0.99 難-0.27", "s": 0.944, "f": 0}, {"x": 0.993, "y": -0.105, "c": "近傍", "n": "電人、暁に斃れる。 [H]  n=2679 cos0.99 難-0.10", "s": 0.827, "f": 0}, {"x": 0.993, "y": -0.079, "c": "近傍", "n": "e-motion 2003  -romantic extra- [A]  n=2821 cos0.99 難-0.08", "s": 0.87, "f": 0}, {"x": 0.993, "y": -0.082, "c": "近傍", "n": "BOOM BOOM DISCO NIGHT [A]  n=2791 cos0.99 難-0.08", "s": 0.861, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3914841892775841}, {"a": 0, "b": 2, "w": 0.7390583009837601}, {"a": 0, "b": 3, "w": 0.6003077320338767}, {"a": 0, "b": 4, "w": 0.4866891438922115}, {"a": 0, "b": 5, "w": 0.5248795636064473}, {"a": 0, "b": 6, "w": 0.5387359417368727}, {"a": 0, "b": 7, "w": 0.5761066699901443}, {"a": 0, "b": 8, "w": 0.5559550512680275}, {"a": 0, "b": 9, "w": 0.44097805454617467}, {"a": 0, "b": 10, "w": 0.45801349515567635}, {"a": 0, "b": 11, "w": 0.4689680299745822}, {"a": 0, "b": 12, "w": 0.4641682950945688}, {"a": 0, "b": 13, "w": 0.5126056171078194}, {"a": 0, "b": 14, "w": 0.460268935453902}, {"a": 0, "b": 15, "w": 0.37812951932731875}, {"a": 0, "b": 16, "w": 0.37033106557506124}, {"a": 0, "b": 17, "w": 4.2487902085497353e-11}, {"a": 0, "b": 18, "w": 0.4058471740951429}, {"a": 0, "b": 19, "w": 0.4613415555674454}, {"a": 0, "b": 20, "w": 0.5067610967404184}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.408,hiY=-0.054;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
