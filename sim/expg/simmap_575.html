<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Time To Empress [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.952, "c": "種", "n": "Time To Empress [H]  n=2244 cos1.00 難-0.95", "s": 0.698, "f": 0}, {"x": 0.997, "y": -0.939, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [H]  n=2282 cos1.00 難-0.94", "s": 0.71, "f": 0}, {"x": 0.998, "y": -0.867, "c": "近傍", "n": "MOON [H]  n=1887 cos1.00 難-0.87", "s": 0.587, "f": 0}, {"x": 0.996, "y": -0.866, "c": "近傍", "n": "DM STAR～関西 energy style～ [H]  n=1848 cos1.00 難-0.87", "s": 0.575, "f": 0}, {"x": 0.995, "y": -0.906, "c": "近傍", "n": "REMINISCENCE [H]  n=1865 cos1.00 難-0.91", "s": 0.58, "f": 0}, {"x": 0.996, "y": -1.017, "c": "近傍", "n": "Elektrick U-Phoria [H]  n=2153 cos1.00 難-1.02", "s": 0.669, "f": 0}, {"x": 0.995, "y": -0.905, "c": "近傍", "n": "Believe In Me [H]  n=1753 cos1.00 難-0.90", "s": 0.545, "f": 0}, {"x": 0.996, "y": -1.082, "c": "近傍", "n": "Boomy and The Boost [H]  n=2207 cos1.00 難-1.08", "s": 0.686, "f": 0}, {"x": 0.993, "y": -1.024, "c": "近傍", "n": "Line 4 Ruin [H]  n=2371 cos0.99 難-1.02", "s": 0.737, "f": 0}, {"x": 0.995, "y": -0.762, "c": "近傍", "n": "イガク [A]  n=1526 cos1.00 難-0.76", "s": 0.475, "f": 0}, {"x": 0.992, "y": -0.958, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1997 cos0.99 難-0.96", "s": 0.621, "f": 0}, {"x": 0.994, "y": -0.784, "c": "近傍", "n": "DESIRE [H]  n=2026 cos0.99 難-0.78", "s": 0.63, "f": 0}, {"x": 0.991, "y": -0.958, "c": "近傍", "n": "LAX5 feat.Ryota Yoshinari [H]  n=1826 cos0.99 難-0.96", "s": 0.568, "f": 0}, {"x": 0.994, "y": -0.762, "c": "近傍", "n": "追想快晴テーマパーク [H]  n=2527 cos0.99 難-0.76", "s": 0.786, "f": 0}, {"x": 0.991, "y": -0.956, "c": "近傍", "n": "Welcome [H]  n=2118 cos0.99 難-0.96", "s": 0.659, "f": 0}, {"x": 0.991, "y": -0.896, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2393 cos0.99 難-0.90", "s": 0.744, "f": 0}, {"x": 0.991, "y": -0.917, "c": "近傍", "n": "FLOWER [H]  n=3216 cos0.99 難-0.92", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.962, "c": "近傍", "n": "HEISEI [H]  n=2015 cos0.99 難-0.96", "s": 0.627, "f": 0}, {"x": 0.989, "y": -0.972, "c": "近傍", "n": "Rock Da House [H]  n=2243 cos0.99 難-0.97", "s": 0.697, "f": 0}, {"x": 0.989, "y": -0.916, "c": "近傍", "n": "Castle on the Moon [H]  n=2273 cos0.99 難-0.92", "s": 0.707, "f": 0}, {"x": 0.991, "y": -1.135, "c": "近傍", "n": "No Tears [H]  n=1727 cos0.99 難-1.13", "s": 0.537, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5124417074417109}, {"a": 0, "b": 2, "w": 0.5706503642317868}, {"a": 0, "b": 3, "w": 0.42935237187396424}, {"a": 0, "b": 4, "w": 0.45609112184886313}, {"a": 0, "b": 5, "w": 0.4572624645167924}, {"a": 0, "b": 6, "w": 0.3386509295600659}, {"a": 0, "b": 7, "w": 0.44880267480305625}, {"a": 0, "b": 8, "w": 0.24151972628585372}, {"a": 0, "b": 9, "w": 0.35479856622675887}, {"a": 0, "b": 10, "w": 0.16733247639417026}, {"a": 0, "b": 11, "w": 0.3635405778640889}, {"a": 0, "b": 12, "w": 0.21495419820143102}, {"a": 0, "b": 13, "w": 0.20066137084671742}, {"a": 0, "b": 14, "w": 0.20324684545580174}, {"a": 0, "b": 15, "w": 0.21786415522753655}, {"a": 0, "b": 16, "w": 0.22175205675718324}, {"a": 0, "b": 17, "w": 6.637923544161595e-11}, {"a": 0, "b": 18, "w": 0.16235073108659837}, {"a": 0, "b": 19, "w": 0.162271062910456}, {"a": 0, "b": 20, "w": 0.171660867381482}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.164,hiY=-0.732;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
