<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Arabian Rave Night [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.322, "c": "種", "n": "Arabian Rave Night [H]  n=2707 cos1.00 難-0.32", "s": 0.811, "f": 0}, {"x": 0.997, "y": -0.265, "c": "近傍", "n": "oratio [H]  n=2400 cos1.00 難-0.27", "s": 0.719, "f": 0}, {"x": 0.995, "y": -0.321, "c": "近傍", "n": "キャトられ恋はモ～モク [H]  n=3044 cos1.00 難-0.32", "s": 0.912, "f": 0}, {"x": 0.995, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos1.00 難-0.32", "s": 0.862, "f": 0}, {"x": 0.994, "y": -0.384, "c": "近傍", "n": "Zirkfied [H]  n=2984 cos0.99 難-0.38", "s": 0.894, "f": 0}, {"x": 0.995, "y": -0.183, "c": "近傍", "n": "Candy Galy [H]  n=2907 cos0.99 難-0.18", "s": 0.871, "f": 0}, {"x": 0.993, "y": -0.335, "c": "近傍", "n": "Shooting Fireball [H]  n=2562 cos0.99 難-0.33", "s": 0.768, "f": 0}, {"x": 0.994, "y": -0.197, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2546 cos0.99 難-0.20", "s": 0.763, "f": 0}, {"x": 0.994, "y": -0.459, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2540 cos0.99 難-0.46", "s": 0.761, "f": 0}, {"x": 0.992, "y": -0.342, "c": "近傍", "n": "ZZ [H]  n=3336 cos0.99 難-0.34", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.38, "c": "近傍", "n": "Saturn [H]  n=2297 cos0.99 難-0.38", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.33, "c": "近傍", "n": "GAIA [H]  n=2875 cos0.99 難-0.33", "s": 0.862, "f": 0}, {"x": 0.992, "y": -0.298, "c": "近傍", "n": "A [H]  n=3013 cos0.99 難-0.30", "s": 0.903, "f": 0}, {"x": 0.995, "y": -0.103, "c": "近傍", "n": "double thrash [H]  n=2119 cos1.00 難-0.10", "s": 0.635, "f": 0}, {"x": 0.991, "y": -0.325, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3121 cos0.99 難-0.32", "s": 0.936, "f": 0}, {"x": 0.995, "y": -0.107, "c": "近傍", "n": "Queen's Tragedy [A]  n=3241 cos0.99 難-0.11", "s": 0.972, "f": 0}, {"x": 0.991, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.977, "f": 0}, {"x": 0.993, "y": -0.12, "c": "近傍", "n": "moon_child [H]  n=2780 cos0.99 難-0.12", "s": 0.833, "f": 0}, {"x": 0.991, "y": -0.28, "c": "近傍", "n": "PLASMA [A]  n=2450 cos0.99 難-0.28", "s": 0.734, "f": 0}, {"x": 0.994, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos0.99 難-0.10", "s": 0.952, "f": 0}, {"x": 0.99, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.829, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28303381670074146}, {"a": 0, "b": 2, "w": 0.2558674153059136}, {"a": 0, "b": 3, "w": 0.38163361404909824}, {"a": 0, "b": 4, "w": 0.26083321335531007}, {"a": 0, "b": 5, "w": 0.33762851412950035}, {"a": 0, "b": 6, "w": 0.23707871698929317}, {"a": 0, "b": 7, "w": 0.3178549583818501}, {"a": 0, "b": 8, "w": 0.3289968754693168}, {"a": 0, "b": 9, "w": 0.08426981433043756}, {"a": 0, "b": 10, "w": 0.19706203269641986}, {"a": 0, "b": 11, "w": 0.2906127949948183}, {"a": 0, "b": 12, "w": 0.28731373298938745}, {"a": 0, "b": 13, "w": 0.3561918717248357}, {"a": 0, "b": 14, "w": 0.2526689683391331}, {"a": 0, "b": 15, "w": 0.31841647395432904}, {"a": 0, "b": 16, "w": 0.2482780379181746}, {"a": 0, "b": 17, "w": 0.3196343232118125}, {"a": 0, "b": 18, "w": 5.0060178224953233e-11}, {"a": 0, "b": 19, "w": 0.31566040052993727}, {"a": 0, "b": 20, "w": 0.042758768829482485}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.488,hiY=-0.066;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
