<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Anisakis -somatic mutation type"Forza"- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.325, "c": "種", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3121 cos1.00 難-0.32", "s": 0.891, "f": 0}, {"x": 0.995, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.931, "f": 0}, {"x": 0.995, "y": -0.281, "c": "近傍", "n": "Wonderful Escape [A]  n=2303 cos0.99 難-0.28", "s": 0.657, "f": 0}, {"x": 0.995, "y": -0.4, "c": "近傍", "n": "疾風迅雷 [H]  n=2794 cos1.00 難-0.40", "s": 0.798, "f": 0}, {"x": 0.994, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos0.99 難-0.32", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.267, "c": "近傍", "n": "Bad Maniacs [H]  n=3255 cos0.99 難-0.27", "s": 0.929, "f": 0}, {"x": 0.994, "y": -0.33, "c": "近傍", "n": "GAIA [H]  n=2875 cos0.99 難-0.33", "s": 0.821, "f": 0}, {"x": 0.993, "y": -0.249, "c": "近傍", "n": "Silvia Drive [A]  n=2192 cos0.99 難-0.25", "s": 0.626, "f": 0}, {"x": 0.993, "y": -0.34, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1724 cos0.99 難-0.34", "s": 0.492, "f": 0}, {"x": 0.993, "y": -0.298, "c": "近傍", "n": "A [H]  n=3013 cos0.99 難-0.30", "s": 0.86, "f": 0}, {"x": 0.994, "y": -0.184, "c": "近傍", "n": "TRANOID [H]  n=2310 cos0.99 難-0.18", "s": 0.659, "f": 0}, {"x": 0.992, "y": -0.38, "c": "近傍", "n": "Ancient Scapes [H]  n=2486 cos0.99 難-0.38", "s": 0.71, "f": 0}, {"x": 0.992, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.821, "f": 0}, {"x": 0.993, "y": -0.197, "c": "近傍", "n": "Session 9 -Chronicles- [H]  n=2546 cos0.99 難-0.20", "s": 0.727, "f": 0}, {"x": 0.992, "y": -0.381, "c": "近傍", "n": "F [H]  n=3310 cos0.99 難-0.38", "s": 0.945, "f": 0}, {"x": 0.992, "y": -0.28, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2555 cos0.99 難-0.28", "s": 0.729, "f": 0}, {"x": 0.994, "y": -0.478, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3247 cos0.99 難-0.48", "s": 0.927, "f": 0}, {"x": 0.992, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos0.99 難-0.31", "s": 0.789, "f": 0}, {"x": 0.992, "y": -0.301, "c": "近傍", "n": "MOON RACE [A]  n=2495 cos0.99 難-0.30", "s": 0.712, "f": 0}, {"x": 0.993, "y": -0.443, "c": "近傍", "n": "DropZ-Line- [H]  n=1721 cos0.99 難-0.44", "s": 0.491, "f": 0}, {"x": 0.991, "y": -0.322, "c": "近傍", "n": "Arabian Rave Night [H]  n=2707 cos0.99 難-0.32", "s": 0.773, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44632912294468297}, {"a": 0, "b": 2, "w": 0.43568377852743034}, {"a": 0, "b": 3, "w": 0.45826965869515146}, {"a": 0, "b": 4, "w": 0.2905441732409051}, {"a": 0, "b": 5, "w": 0.39948734245976625}, {"a": 0, "b": 6, "w": 0.3633980288150407}, {"a": 0, "b": 7, "w": 0.34624099178124856}, {"a": 0, "b": 8, "w": 0.2918406581348477}, {"a": 0, "b": 9, "w": 0.25698620460727506}, {"a": 0, "b": 10, "w": 0.3938995200888272}, {"a": 0, "b": 11, "w": 0.33089670137284466}, {"a": 0, "b": 12, "w": 0.31863233692203274}, {"a": 0, "b": 13, "w": 0.1255586478575007}, {"a": 0, "b": 14, "w": 0.16597906841460375}, {"a": 0, "b": 15, "w": 0.2226346267894982}, {"a": 0, "b": 16, "w": 0.36000020256204857}, {"a": 0, "b": 17, "w": 0.2093149212555112}, {"a": 0, "b": 18, "w": 5.197842156690058e-11}, {"a": 0, "b": 19, "w": 0.19675630349643536}, {"a": 0, "b": 20, "w": 0.22403219958253384}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-0.502,hiY=-0.160;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
