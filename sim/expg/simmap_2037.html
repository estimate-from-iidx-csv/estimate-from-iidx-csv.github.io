<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">PENDUAL TALISMAN [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.132, "c": "種", "n": "PENDUAL TALISMAN [A]  n=3416 cos1.00 難0.13", "s": 0.947, "f": 0}, {"x": 0.996, "y": 0.206, "c": "近傍", "n": "Bang-Boo Bumble [A]  n=1249 cos1.00 難0.21", "s": 0.346, "f": 0}, {"x": 0.994, "y": 0.149, "c": "近傍", "n": "No Tears [A]  n=3588 cos0.99 難0.15", "s": 0.994, "f": 0}, {"x": 0.994, "y": 0.079, "c": "近傍", "n": "果たせぬ約束 ft. 小林マナ [A]  n=1892 cos0.99 難0.08", "s": 0.524, "f": 0}, {"x": 0.993, "y": 0.116, "c": "近傍", "n": "RIZING YOU UP [A]  n=3102 cos0.99 難0.12", "s": 0.86, "f": 0}, {"x": 0.993, "y": 0.162, "c": "近傍", "n": "DAZZLE ATTACK [A]  n=1930 cos0.99 難0.16", "s": 0.535, "f": 0}, {"x": 0.993, "y": 0.226, "c": "近傍", "n": "Pout [A]  n=2130 cos0.99 難0.23", "s": 0.59, "f": 0}, {"x": 0.994, "y": -0.007, "c": "近傍", "n": "50th Memorial Songs -二人の時 ～under the cherry blossoms～- [A]  n=2372 cos0.99 難-0.01", "s": 0.657, "f": 0}, {"x": 0.994, "y": -0.016, "c": "近傍", "n": "Wing of Hearts [A]  n=3089 cos0.99 難-0.02", "s": 0.856, "f": 0}, {"x": 0.993, "y": 0.321, "c": "近傍", "n": "Wonderland [A]  n=3126 cos0.99 難0.32", "s": 0.866, "f": 0}, {"x": 0.992, "y": 0.292, "c": "近傍", "n": "雫 [A]  n=1343 cos0.99 難0.29", "s": 0.372, "f": 0}, {"x": 0.992, "y": 0.291, "c": "近傍", "n": "Blaze it UP! [A]  n=3472 cos0.99 難0.29", "s": 0.962, "f": 0}, {"x": 0.991, "y": 0.032, "c": "近傍", "n": "ハオ [A]  n=1359 cos0.99 難0.03", "s": 0.377, "f": 0}, {"x": 0.993, "y": -0.064, "c": "近傍", "n": "Shapeshifter [A]  n=1776 cos0.99 難-0.06", "s": 0.492, "f": 0}, {"x": 0.994, "y": -0.085, "c": "近傍", "n": "Hypersonik [A]  n=3142 cos0.99 難-0.08", "s": 0.871, "f": 0}, {"x": 0.99, "y": 0.132, "c": "近傍", "n": "SigSig [A]  n=3609 cos0.99 難0.13", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.085, "c": "近傍", "n": "草原の王女-軌跡を辿って- [A]  n=3081 cos0.99 難-0.08", "s": 0.854, "f": 0}, {"x": 0.992, "y": -0.059, "c": "近傍", "n": "Technicolour Dreams [A]  n=2350 cos0.99 難-0.06", "s": 0.651, "f": 0}, {"x": 0.989, "y": 0.086, "c": "近傍", "n": "あるビー！ feat.ころねぽち [A]  n=1926 cos0.99 難0.09", "s": 0.534, "f": 0}, {"x": 0.989, "y": 0.082, "c": "近傍", "n": "LOVELY STORM [A]  n=2975 cos0.99 難0.08", "s": 0.824, "f": 0}, {"x": 0.994, "y": -0.109, "c": "近傍", "n": "Sorrows [A]  n=3296 cos0.99 難-0.11", "s": 0.913, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4375730726038509}, {"a": 0, "b": 2, "w": 0.3874161800253111}, {"a": 0, "b": 3, "w": 0.2967782286461388}, {"a": 0, "b": 4, "w": 0.32983854672175084}, {"a": 0, "b": 5, "w": 0.2992680815963987}, {"a": 0, "b": 6, "w": 0.29780198897000043}, {"a": 0, "b": 7, "w": 0.3851706264811111}, {"a": 0, "b": 8, "w": 0.2848645781350875}, {"a": 0, "b": 9, "w": 0.35096342430099003}, {"a": 0, "b": 10, "w": 0.26655791313185206}, {"a": 0, "b": 11, "w": 0.14737981519181764}, {"a": 0, "b": 12, "w": 0.2301560579031584}, {"a": 0, "b": 13, "w": 0.31294500594069097}, {"a": 0, "b": 14, "w": 0.30640424458388393}, {"a": 0, "b": 15, "w": 0.19086836914946603}, {"a": 0, "b": 16, "w": 0.2777211926533071}, {"a": 0, "b": 17, "w": 0.26807567708687474}, {"a": 0, "b": 18, "w": 5.0440651655492275e-11}, {"a": 0, "b": 19, "w": 0.17080466682883433}, {"a": 0, "b": 20, "w": 0.3684456138629305}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.144,hiY=0.356;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
