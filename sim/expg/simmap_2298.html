<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ミッドナイト堕天使 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.154, "c": "種", "n": "ミッドナイト堕天使 [A]  n=3395 cos1.00 難0.15", "s": 0.907, "f": 0}, {"x": 0.998, "y": 0.074, "c": "近傍", "n": "Plea Per Phase [A]  n=1027 cos1.00 難0.07", "s": 0.274, "f": 0}, {"x": 0.998, "y": 0.236, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1129 cos1.00 難0.24", "s": 0.302, "f": 0}, {"x": 0.997, "y": 0.14, "c": "近傍", "n": "PAPAYAPA BASS [A]  n=3506 cos1.00 難0.14", "s": 0.937, "f": 0}, {"x": 0.996, "y": 0.089, "c": "近傍", "n": "仮想空間の旅人たち [A]  n=3679 cos1.00 難0.09", "s": 0.983, "f": 0}, {"x": 0.996, "y": 0.11, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3164 cos1.00 難0.11", "s": 0.845, "f": 0}, {"x": 0.997, "y": 0.033, "c": "近傍", "n": "Nothing but Theory [A]  n=3622 cos1.00 難0.03", "s": 0.968, "f": 0}, {"x": 0.997, "y": 0.025, "c": "近傍", "n": "DEEP ROAR [A]  n=1655 cos1.00 難0.02", "s": 0.442, "f": 0}, {"x": 0.998, "y": -0.028, "c": "近傍", "n": "Line 4 Ruin [A]  n=3743 cos1.00 難-0.03", "s": 1.0, "f": 0}, {"x": 0.995, "y": 0.092, "c": "近傍", "n": "Explorer feat. ぷにぷに電機 [L]  n=1401 cos0.99 難0.09", "s": 0.374, "f": 0}, {"x": 0.994, "y": 0.138, "c": "近傍", "n": "R∞tAge [A]  n=3518 cos0.99 難0.14", "s": 0.94, "f": 0}, {"x": 0.995, "y": 0.283, "c": "近傍", "n": "Synergy For Angels [A]  n=3484 cos1.00 難0.28", "s": 0.931, "f": 0}, {"x": 0.995, "y": 0.275, "c": "近傍", "n": "Stylus [A]  n=1628 cos0.99 難0.28", "s": 0.435, "f": 0}, {"x": 0.995, "y": 0.291, "c": "近傍", "n": "Countdown to Heaven or Hell [A]  n=1120 cos0.99 難0.29", "s": 0.299, "f": 0}, {"x": 0.995, "y": 0.028, "c": "近傍", "n": "Danza Aestas [A]  n=2307 cos0.99 難0.03", "s": 0.616, "f": 0}, {"x": 0.993, "y": 0.115, "c": "近傍", "n": "朧 [L]  n=3657 cos0.99 難0.11", "s": 0.977, "f": 0}, {"x": 0.993, "y": 0.107, "c": "近傍", "n": "夢縁 [A]  n=1904 cos0.99 難0.11", "s": 0.509, "f": 0}, {"x": 0.996, "y": -0.04, "c": "近傍", "n": "Time To Empress [A]  n=3234 cos1.00 難-0.04", "s": 0.864, "f": 0}, {"x": 0.993, "y": 0.195, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1814 cos0.99 難0.19", "s": 0.485, "f": 0}, {"x": 0.993, "y": 0.207, "c": "近傍", "n": "winkle 2 winkle [A]  n=1667 cos0.99 難0.21", "s": 0.445, "f": 0}, {"x": 0.995, "y": -0.015, "c": "近傍", "n": "アイドル [L]  n=1431 cos0.99 難-0.02", "s": 0.382, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5961944498045264}, {"a": 0, "b": 2, "w": 0.4227600236013159}, {"a": 0, "b": 3, "w": 0.5162371727048158}, {"a": 0, "b": 4, "w": 0.5054316670187706}, {"a": 0, "b": 5, "w": 0.44609611034266794}, {"a": 0, "b": 6, "w": 0.4903915787770198}, {"a": 0, "b": 7, "w": 0.43409734182522686}, {"a": 0, "b": 8, "w": 0.6207025767351935}, {"a": 0, "b": 9, "w": 0.39290229008341315}, {"a": 0, "b": 10, "w": 0.18406867681075434}, {"a": 0, "b": 11, "w": 0.43175629388647974}, {"a": 0, "b": 12, "w": 0.2998287777552069}, {"a": 0, "b": 13, "w": 5.094757948853612e-11}, {"a": 0, "b": 14, "w": 0.39794349275568197}, {"a": 0, "b": 15, "w": 0.32251827304071234}, {"a": 0, "b": 16, "w": 0.241908286411033}, {"a": 0, "b": 17, "w": 0.47254624457274086}, {"a": 0, "b": 18, "w": 0.2144504849172939}, {"a": 0, "b": 19, "w": 0.27434781029686883}, {"a": 0, "b": 20, "w": 0.060072493836684004}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.067,hiY=0.318;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
