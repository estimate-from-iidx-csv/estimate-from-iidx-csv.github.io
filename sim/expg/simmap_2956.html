<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">スーパー戦湯ババンバーン [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.183, "c": "種", "n": "スーパー戦湯ババンバーン [A]  n=2235 cos1.00 難1.18", "s": 0.638, "f": 0}, {"x": 0.997, "y": 1.172, "c": "近傍", "n": "Chaotoxin [A]  n=1942 cos1.00 難1.17", "s": 0.554, "f": 0}, {"x": 0.997, "y": 1.158, "c": "近傍", "n": "MARLIN [A]  n=1127 cos1.00 難1.16", "s": 0.322, "f": 0}, {"x": 0.997, "y": 1.163, "c": "近傍", "n": "The Last Apocalypse [A]  n=1421 cos1.00 難1.16", "s": 0.406, "f": 0}, {"x": 0.996, "y": 1.181, "c": "近傍", "n": "儚キ戀ノ幻想譚 [A]  n=2193 cos1.00 難1.18", "s": 0.626, "f": 0}, {"x": 0.998, "y": 1.08, "c": "近傍", "n": "BLAZING_LAZER [A]  n=1561 cos1.00 難1.08", "s": 0.445, "f": 0}, {"x": 0.996, "y": 1.233, "c": "近傍", "n": "Regina vespaE [A]  n=937 cos1.00 難1.23", "s": 0.267, "f": 0}, {"x": 0.995, "y": 1.203, "c": "近傍", "n": "Close the World feat.a☆ru [A]  n=3451 cos1.00 難1.20", "s": 0.985, "f": 0}, {"x": 0.997, "y": 1.083, "c": "近傍", "n": "Dahlia [A]  n=1919 cos1.00 難1.08", "s": 0.548, "f": 0}, {"x": 0.997, "y": 1.087, "c": "近傍", "n": "Seven Times Four [A]  n=1327 cos1.00 難1.09", "s": 0.379, "f": 0}, {"x": 0.996, "y": 1.107, "c": "近傍", "n": "PUNISHER [A]  n=3504 cos1.00 難1.11", "s": 1.0, "f": 0}, {"x": 0.996, "y": 1.242, "c": "近傍", "n": "Xb10r [A]  n=1444 cos1.00 難1.24", "s": 0.412, "f": 0}, {"x": 0.995, "y": 1.206, "c": "近傍", "n": "u gotta beat [A]  n=1433 cos0.99 難1.21", "s": 0.409, "f": 0}, {"x": 0.997, "y": 1.299, "c": "近傍", "n": "The Limbo [A]  n=3298 cos1.00 難1.30", "s": 0.941, "f": 0}, {"x": 0.996, "y": 1.083, "c": "近傍", "n": "Catch Our Fire! [A]  n=3267 cos1.00 難1.08", "s": 0.932, "f": 0}, {"x": 0.994, "y": 1.154, "c": "近傍", "n": "Always We Trust In You [A]  n=1758 cos0.99 難1.15", "s": 0.502, "f": 0}, {"x": 0.995, "y": 1.28, "c": "近傍", "n": "We're so Happy (P*Light Remix) IIDX ver. [A]  n=3355 cos1.00 難1.28", "s": 0.957, "f": 0}, {"x": 0.994, "y": 1.117, "c": "近傍", "n": "Roar of Chronos [A]  n=1311 cos0.99 難1.12", "s": 0.374, "f": 0}, {"x": 0.994, "y": 1.103, "c": "近傍", "n": "それは花火のような恋 [A]  n=3451 cos0.99 難1.10", "s": 0.985, "f": 0}, {"x": 0.994, "y": 1.259, "c": "近傍", "n": "BIGWAVERS [A]  n=1778 cos0.99 難1.26", "s": 0.507, "f": 0}, {"x": 0.994, "y": 1.118, "c": "近傍", "n": "Candy Galy [A]  n=3379 cos0.99 難1.12", "s": 0.964, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.48519542145558103}, {"a": 0, "b": 2, "w": 0.4400950443500242}, {"a": 0, "b": 3, "w": 0.40461870011486123}, {"a": 0, "b": 4, "w": 0.2082147390374267}, {"a": 0, "b": 5, "w": 0.5304957174030978}, {"a": 0, "b": 6, "w": 0.1535998443102069}, {"a": 0, "b": 7, "w": 0.24544772087599187}, {"a": 0, "b": 8, "w": 0.44888061626261866}, {"a": 0, "b": 9, "w": 0.4140110834438341}, {"a": 0, "b": 10, "w": 0.2422792117792011}, {"a": 0, "b": 11, "w": 0.27989184615232476}, {"a": 0, "b": 12, "w": 0.057305389796977524}, {"a": 0, "b": 13, "w": 0.41639402052484886}, {"a": 0, "b": 14, "w": 0.3101449518481364}, {"a": 0, "b": 15, "w": 0.23456659696080195}, {"a": 0, "b": 16, "w": 4.887379390083879e-11}, {"a": 0, "b": 17, "w": 0.06060072456559795}, {"a": 0, "b": 18, "w": 0.09416500871795219}, {"a": 0, "b": 19, "w": 0.0006237448364586617}, {"a": 0, "b": 20, "w": 0.17695887848011338}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.000,loY=1.062,hiY=1.317;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
