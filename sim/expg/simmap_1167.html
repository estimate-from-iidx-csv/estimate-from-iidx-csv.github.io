<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ラブキラ☆スプラッシュ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.324, "c": "種", "n": "ラブキラ☆スプラッシュ [A]  n=2331 cos1.00 難-0.32", "s": 0.661, "f": 0}, {"x": 0.999, "y": -0.249, "c": "近傍", "n": "CoMAAAAAAA [A]  n=3204 cos1.00 難-0.25", "s": 0.909, "f": 0}, {"x": 0.997, "y": -0.288, "c": "近傍", "n": "Get Wicked [A]  n=1309 cos1.00 難-0.29", "s": 0.371, "f": 0}, {"x": 0.996, "y": -0.309, "c": "近傍", "n": "Dreaming Dream [A]  n=1431 cos1.00 難-0.31", "s": 0.406, "f": 0}, {"x": 0.998, "y": -0.175, "c": "近傍", "n": "リグレット [A]  n=3193 cos1.00 難-0.18", "s": 0.906, "f": 0}, {"x": 0.998, "y": -0.151, "c": "近傍", "n": "Hold My Hand [A]  n=2571 cos1.00 難-0.15", "s": 0.729, "f": 0}, {"x": 0.996, "y": -0.269, "c": "近傍", "n": "Follow Tomorrow [A]  n=3525 cos1.00 難-0.27", "s": 1.0, "f": 0}, {"x": 0.997, "y": -0.172, "c": "近傍", "n": "深愛のリグレット [A]  n=2673 cos1.00 難-0.17", "s": 0.758, "f": 0}, {"x": 0.994, "y": -0.322, "c": "近傍", "n": "Secret Rouge [A]  n=1557 cos0.99 難-0.32", "s": 0.442, "f": 0}, {"x": 0.994, "y": -0.282, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3305 cos0.99 難-0.28", "s": 0.938, "f": 0}, {"x": 0.994, "y": -0.309, "c": "近傍", "n": "Psychedelic Intelligence [A]  n=871 cos0.99 難-0.31", "s": 0.247, "f": 0}, {"x": 0.995, "y": -0.176, "c": "近傍", "n": "Last Burning [A]  n=3166 cos1.00 難-0.18", "s": 0.898, "f": 0}, {"x": 0.994, "y": -0.34, "c": "近傍", "n": "Nyan Nyan University [A]  n=1114 cos0.99 難-0.34", "s": 0.316, "f": 0}, {"x": 0.995, "y": -0.189, "c": "近傍", "n": "ACCELERATE [A]  n=2996 cos0.99 難-0.19", "s": 0.85, "f": 0}, {"x": 0.995, "y": -0.481, "c": "近傍", "n": "キスキツネ [A]  n=1141 cos1.00 難-0.48", "s": 0.324, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "SHOOTING STAR [A]  n=2340 cos0.99 難-0.25", "s": 0.664, "f": 0}, {"x": 0.994, "y": -0.211, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2724 cos0.99 難-0.21", "s": 0.773, "f": 0}, {"x": 0.994, "y": -0.282, "c": "近傍", "n": "夏風邪デスコ [A]  n=1812 cos0.99 難-0.28", "s": 0.514, "f": 0}, {"x": 0.994, "y": -0.424, "c": "近傍", "n": "神様、つれない。 [A]  n=1321 cos0.99 難-0.42", "s": 0.375, "f": 0}, {"x": 0.995, "y": -0.136, "c": "近傍", "n": "Fly you to the star [A]  n=3230 cos0.99 難-0.14", "s": 0.916, "f": 0}, {"x": 0.994, "y": -0.186, "c": "近傍", "n": "8bit Princess [A]  n=3425 cos0.99 難-0.19", "s": 0.972, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5985222732653852}, {"a": 0, "b": 2, "w": 0.4403474399099534}, {"a": 0, "b": 3, "w": 0.4359393004683103}, {"a": 0, "b": 4, "w": 0.487200871481722}, {"a": 0, "b": 5, "w": 0.5916564757633711}, {"a": 0, "b": 6, "w": 0.3509929123083426}, {"a": 0, "b": 7, "w": 0.41336761270689604}, {"a": 0, "b": 8, "w": 0.26733809771223394}, {"a": 0, "b": 9, "w": 0.15307941889717436}, {"a": 0, "b": 10, "w": 0.28422410850492075}, {"a": 0, "b": 11, "w": 0.11593698720968537}, {"a": 0, "b": 12, "w": 0.26769092468539424}, {"a": 0, "b": 13, "w": 0.31617842240040983}, {"a": 0, "b": 14, "w": 0.3233472131305062}, {"a": 0, "b": 15, "w": 0.10710814265430668}, {"a": 0, "b": 16, "w": 0.28757896973316854}, {"a": 0, "b": 17, "w": 0.04639668725331747}, {"a": 0, "b": 18, "w": 6.132372387668283e-11}, {"a": 0, "b": 19, "w": 0.2286870617378013}, {"a": 0, "b": 20, "w": 0.27704376734831015}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.509,hiY=-0.109;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
