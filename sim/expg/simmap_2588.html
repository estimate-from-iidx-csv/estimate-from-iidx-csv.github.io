<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dr. Chemical & Killing Machine [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.163, "c": "種", "n": "Dr. Chemical & Killing Machine [A]  n=3269 cos1.00 難1.16", "s": 0.922, "f": 0}, {"x": 0.995, "y": 1.189, "c": "近傍", "n": "Viridian [A]  n=2628 cos1.00 難1.19", "s": 0.742, "f": 0}, {"x": 0.993, "y": 1.103, "c": "近傍", "n": "dAuntl3ss [A]  n=3294 cos0.99 難1.10", "s": 0.929, "f": 0}, {"x": 0.993, "y": 1.214, "c": "近傍", "n": "Last Dance [A]  n=3336 cos0.99 難1.21", "s": 0.941, "f": 0}, {"x": 0.992, "y": 1.162, "c": "近傍", "n": "Meissa [A]  n=2087 cos0.99 難1.16", "s": 0.589, "f": 0}, {"x": 0.994, "y": 1.281, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3247 cos0.99 難1.28", "s": 0.916, "f": 0}, {"x": 0.992, "y": 1.095, "c": "近傍", "n": "Space Battleship S4TO [A]  n=965 cos0.99 難1.09", "s": 0.272, "f": 0}, {"x": 0.991, "y": 1.133, "c": "近傍", "n": "Sounds Of Summer [A]  n=3413 cos0.99 難1.13", "s": 0.963, "f": 0}, {"x": 0.992, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.99 難1.12", "s": 0.96, "f": 0}, {"x": 0.991, "y": 1.185, "c": "近傍", "n": "HARD BRAIN [A]  n=3021 cos0.99 難1.18", "s": 0.852, "f": 0}, {"x": 0.991, "y": 1.11, "c": "近傍", "n": "spiral galaxy [L]  n=3066 cos0.99 難1.11", "s": 0.865, "f": 0}, {"x": 0.991, "y": 1.209, "c": "近傍", "n": "Super Duper Racers [L]  n=727 cos0.99 難1.21", "s": 0.205, "f": 0}, {"x": 0.991, "y": 1.207, "c": "近傍", "n": "Broken Sword [A]  n=3380 cos0.99 難1.21", "s": 0.954, "f": 0}, {"x": 0.991, "y": 1.08, "c": "近傍", "n": "Ypsilon [L]  n=2338 cos0.99 難1.08", "s": 0.66, "f": 0}, {"x": 0.992, "y": 1.281, "c": "近傍", "n": "Colorful Cookie [A]  n=3544 cos0.99 難1.28", "s": 1.0, "f": 0}, {"x": 0.989, "y": 1.18, "c": "近傍", "n": "L.F.O [A]  n=3203 cos0.99 難1.18", "s": 0.904, "f": 0}, {"x": 0.99, "y": 1.093, "c": "近傍", "n": "GOLDEN CROSS [A]  n=3532 cos0.99 難1.09", "s": 0.997, "f": 0}, {"x": 0.991, "y": 1.288, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3069 cos0.99 難1.29", "s": 0.866, "f": 0}, {"x": 0.989, "y": 1.189, "c": "近傍", "n": "fffff [A]  n=3495 cos0.99 難1.19", "s": 0.986, "f": 0}, {"x": 0.989, "y": 1.15, "c": "近傍", "n": "シュレーディンガーの猫 [A]  n=3492 cos0.99 難1.15", "s": 0.985, "f": 0}, {"x": 0.989, "y": 1.086, "c": "近傍", "n": "Ghost Pulse [A]  n=1918 cos0.99 難1.09", "s": 0.541, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.47733776935693906}, {"a": 0, "b": 2, "w": 0.39757259281667057}, {"a": 0, "b": 3, "w": 0.39190324647934316}, {"a": 0, "b": 4, "w": 0.27133828996117604}, {"a": 0, "b": 5, "w": 0.39133883210745357}, {"a": 0, "b": 6, "w": 0.17473587896718457}, {"a": 0, "b": 7, "w": 0.3181266003771267}, {"a": 0, "b": 8, "w": 0.30755532954174614}, {"a": 0, "b": 9, "w": 0.22612900481228582}, {"a": 0, "b": 10, "w": 0.2923197743409086}, {"a": 0, "b": 11, "w": 0.12150195319444135}, {"a": 0, "b": 12, "w": 3.6809444381447065e-11}, {"a": 0, "b": 13, "w": 0.2863316096486135}, {"a": 0, "b": 14, "w": 0.2412637471342789}, {"a": 0, "b": 15, "w": 0.231700434085092}, {"a": 0, "b": 16, "w": 0.22824560600452937}, {"a": 0, "b": 17, "w": 0.29773995443574186}, {"a": 0, "b": 18, "w": 0.20048692162732573}, {"a": 0, "b": 19, "w": 0.15870026152024963}, {"a": 0, "b": 20, "w": 0.21517127646833012}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=1.063,hiY=1.305;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
