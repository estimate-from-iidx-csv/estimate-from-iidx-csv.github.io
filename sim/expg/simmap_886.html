<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HIGH VOLTAGE [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.233, "c": "種", "n": "HIGH VOLTAGE [A]  n=2735 cos1.00 難-0.23", "s": 0.809, "f": 0}, {"x": 0.994, "y": -0.253, "c": "近傍", "n": "Round and Round [A]  n=2982 cos0.99 難-0.25", "s": 0.882, "f": 0}, {"x": 0.994, "y": -0.301, "c": "近傍", "n": "MOVE! (We Keep It Movin') [A]  n=1627 cos0.99 難-0.30", "s": 0.481, "f": 0}, {"x": 0.992, "y": -0.194, "c": "近傍", "n": "Virus Funk [A]  n=3042 cos0.99 難-0.19", "s": 0.9, "f": 0}, {"x": 0.993, "y": -0.401, "c": "近傍", "n": "Explorer feat. ぷにぷに電機 [A]  n=2439 cos0.99 難-0.40", "s": 0.722, "f": 0}, {"x": 0.991, "y": -0.254, "c": "近傍", "n": "Lift Us High [A]  n=2436 cos0.99 難-0.25", "s": 0.721, "f": 0}, {"x": 0.992, "y": -0.119, "c": "近傍", "n": "Shiva [A]  n=3020 cos0.99 難-0.12", "s": 0.893, "f": 0}, {"x": 0.995, "y": -0.496, "c": "近傍", "n": "デラむぅのでらっくす☆どり～むぅ [A]  n=1047 cos0.99 難-0.50", "s": 0.31, "f": 0}, {"x": 0.992, "y": -0.411, "c": "近傍", "n": "In Heaven [A]  n=2962 cos0.99 難-0.41", "s": 0.876, "f": 0}, {"x": 0.991, "y": -0.04, "c": "近傍", "n": "Caldwell 99 [A]  n=1670 cos0.99 難-0.04", "s": 0.494, "f": 0}, {"x": 0.99, "y": -0.122, "c": "近傍", "n": "BLACK JACKAL [A]  n=2466 cos0.99 難-0.12", "s": 0.73, "f": 0}, {"x": 0.99, "y": -0.213, "c": "近傍", "n": "STAR BEAT [A]  n=1420 cos0.99 難-0.21", "s": 0.42, "f": 0}, {"x": 0.99, "y": -0.187, "c": "近傍", "n": "Release The Music [A]  n=3066 cos0.99 難-0.19", "s": 0.907, "f": 0}, {"x": 0.994, "y": 0.095, "c": "近傍", "n": "GRADIUS 2012 [A]  n=2995 cos0.99 難0.09", "s": 0.886, "f": 0}, {"x": 0.991, "y": -0.438, "c": "近傍", "n": "神っぽいな [A]  n=2136 cos0.99 難-0.44", "s": 0.632, "f": 0}, {"x": 0.99, "y": -0.068, "c": "近傍", "n": "Neonlights [A]  n=3010 cos0.99 難-0.07", "s": 0.891, "f": 0}, {"x": 0.989, "y": -0.063, "c": "近傍", "n": "Music is The Answer [A]  n=3019 cos0.99 難-0.06", "s": 0.893, "f": 0}, {"x": 0.988, "y": -0.153, "c": "近傍", "n": "Galaxy Collapse [A]  n=789 cos0.99 難-0.15", "s": 0.233, "f": 0}, {"x": 0.988, "y": -0.215, "c": "近傍", "n": "MAD ATTACK [A]  n=2731 cos0.99 難-0.21", "s": 0.808, "f": 0}, {"x": 0.988, "y": -0.333, "c": "近傍", "n": "O/D*20 [A]  n=3380 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.988, "y": -0.125, "c": "近傍", "n": "VOID [H]  n=876 cos0.99 難-0.12", "s": 0.259, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3952137583046421}, {"a": 0, "b": 2, "w": 0.40052515689501256}, {"a": 0, "b": 3, "w": 0.363881698504963}, {"a": 0, "b": 4, "w": 0.1923473337901762}, {"a": 0, "b": 5, "w": 0.3244725550097508}, {"a": 0, "b": 6, "w": 0.34195402712073486}, {"a": 0, "b": 7, "w": 0.3436681242318109}, {"a": 0, "b": 8, "w": 0.1531207117996941}, {"a": 0, "b": 9, "w": 0.3381394164518863}, {"a": 0, "b": 10, "w": 0.25087515636114843}, {"a": 0, "b": 11, "w": 0.2118797308851489}, {"a": 0, "b": 12, "w": 0.0959380060644146}, {"a": 0, "b": 13, "w": 0.16602807316214752}, {"a": 0, "b": 14, "w": 0.2890055239465109}, {"a": 0, "b": 15, "w": 0.23638908500106348}, {"a": 0, "b": 16, "w": 4.549061127789855e-11}, {"a": 0, "b": 17, "w": 0.23011241515891212}, {"a": 0, "b": 18, "w": 0.21098357156864}, {"a": 0, "b": 19, "w": 0.21619907103140934}, {"a": 0, "b": 20, "w": 0.1997226202354715}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.544,hiY=0.142;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
