<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">MEGAERA [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.938, "c": "種", "n": "MEGAERA [A]  n=2099 cos1.00 難1.94", "s": 0.708, "f": 0}, {"x": 0.994, "y": 1.917, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1787 cos0.99 難1.92", "s": 0.603, "f": 0}, {"x": 0.992, "y": 1.857, "c": "近傍", "n": "four pieces of heaven [L]  n=1299 cos0.99 難1.86", "s": 0.438, "f": 0}, {"x": 0.991, "y": 1.977, "c": "近傍", "n": "Phoenix [L]  n=1431 cos0.99 難1.98", "s": 0.483, "f": 0}, {"x": 0.989, "y": 1.957, "c": "近傍", "n": "Lost Souls [L]  n=919 cos0.99 難1.96", "s": 0.31, "f": 0}, {"x": 0.993, "y": 2.106, "c": "近傍", "n": "The Limbo [L]  n=1288 cos0.99 難2.11", "s": 0.434, "f": 0}, {"x": 0.988, "y": 1.923, "c": "近傍", "n": "IX [A]  n=2725 cos0.99 難1.92", "s": 0.919, "f": 0}, {"x": 0.989, "y": 1.868, "c": "近傍", "n": "Binary Black Hole [A]  n=1874 cos0.99 難1.87", "s": 0.632, "f": 0}, {"x": 0.987, "y": 1.986, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [A]  n=2906 cos0.99 難1.99", "s": 0.98, "f": 0}, {"x": 0.987, "y": 1.962, "c": "近傍", "n": "Elemental Creation [A]  n=2830 cos0.99 難1.96", "s": 0.954, "f": 0}, {"x": 0.989, "y": 1.783, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [L]  n=1868 cos0.99 難1.78", "s": 0.63, "f": 0}, {"x": 0.995, "y": 1.686, "c": "近傍", "n": "∀ [A]  n=2448 cos1.00 難1.69", "s": 0.826, "f": 0}, {"x": 0.99, "y": 1.731, "c": "近傍", "n": "-65℃ [A]  n=2211 cos0.99 難1.73", "s": 0.746, "f": 0}, {"x": 0.985, "y": 1.946, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [L]  n=1796 cos0.98 難1.95", "s": 0.606, "f": 0}, {"x": 0.985, "y": 1.92, "c": "近傍", "n": "Confiserie [A]  n=2899 cos0.98 難1.92", "s": 0.978, "f": 0}, {"x": 0.988, "y": 1.725, "c": "近傍", "n": "Blue Spring Express [A]  n=2854 cos0.99 難1.73", "s": 0.963, "f": 0}, {"x": 0.982, "y": 1.98, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1161 cos0.98 難1.98", "s": 0.392, "f": 0}, {"x": 0.982, "y": 1.94, "c": "近傍", "n": "EBONY & IVORY [L]  n=2289 cos0.98 難1.94", "s": 0.772, "f": 0}, {"x": 0.984, "y": 1.757, "c": "近傍", "n": "THE F∀UST [A]  n=2478 cos0.98 難1.76", "s": 0.836, "f": 0}, {"x": 0.986, "y": 1.708, "c": "近傍", "n": "KAISER PHOENIX [A]  n=2965 cos0.99 難1.71", "s": 1.0, "f": 0}, {"x": 0.992, "y": 1.619, "c": "近傍", "n": "BLACK or WHITE? [A]  n=2316 cos0.99 難1.62", "s": 0.781, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45956498039475724}, {"a": 0, "b": 2, "w": 0.28375825328439386}, {"a": 0, "b": 3, "w": 0.3694962967323079}, {"a": 0, "b": 4, "w": 0.2542445295621727}, {"a": 0, "b": 5, "w": 0.0024215091895454233}, {"a": 0, "b": 6, "w": 0.31502297417028935}, {"a": 0, "b": 7, "w": 0.298630233366881}, {"a": 0, "b": 8, "w": 0.15757514949958729}, {"a": 0, "b": 9, "w": 2.6362911853539117e-11}, {"a": 0, "b": 10, "w": 0.3364345236443642}, {"a": 0, "b": 11, "w": 0.5121252548976146}, {"a": 0, "b": 12, "w": 0.36550757155699154}, {"a": 0, "b": 13, "w": 0.23228228779489835}, {"a": 0, "b": 14, "w": 0.2157422000281325}, {"a": 0, "b": 15, "w": 0.2409755023084743}, {"a": 0, "b": 16, "w": 0.0873717373759989}, {"a": 0, "b": 17, "w": 0.1358258412889526}, {"a": 0, "b": 18, "w": 0.2189387335588493}, {"a": 0, "b": 19, "w": 0.2102787999986565}, {"a": 0, "b": 20, "w": 0.41286612557736013}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=1.580,hiY=2.145;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
