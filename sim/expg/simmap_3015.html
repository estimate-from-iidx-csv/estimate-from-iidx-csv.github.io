<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">灼熱Beach Side Bunny (かめりあ's "Summertime D'n'B" Remix) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.577, "c": "種", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1567 cos1.00 難1.58", "s": 0.451, "f": 0}, {"x": 0.992, "y": 1.512, "c": "近傍", "n": "Peaktime Booster [A]  n=1913 cos0.99 難1.51", "s": 0.551, "f": 0}, {"x": 0.989, "y": 1.628, "c": "近傍", "n": "Cult Invitation [A]  n=1260 cos0.99 難1.63", "s": 0.363, "f": 0}, {"x": 0.988, "y": 1.704, "c": "近傍", "n": "Level 3 [A]  n=2164 cos0.99 難1.70", "s": 0.623, "f": 0}, {"x": 0.99, "y": 1.293, "c": "近傍", "n": "火影 [A]  n=3397 cos0.99 難1.29", "s": 0.978, "f": 0}, {"x": 0.989, "y": 1.363, "c": "近傍", "n": "Level 2 [A]  n=2879 cos0.99 難1.36", "s": 0.829, "f": 0}, {"x": 0.987, "y": 1.54, "c": "近傍", "n": "Snake Stick [A]  n=3365 cos0.99 難1.54", "s": 0.969, "f": 0}, {"x": 0.989, "y": 1.858, "c": "近傍", "n": "SOLAR ECLIPSE [A]  n=1657 cos0.99 難1.86", "s": 0.477, "f": 0}, {"x": 0.99, "y": 1.97, "c": "近傍", "n": "Level One [A]  n=2920 cos0.99 難1.97", "s": 0.841, "f": 0}, {"x": 0.984, "y": 1.692, "c": "近傍", "n": "Be quiet [L]  n=2107 cos0.98 難1.69", "s": 0.607, "f": 0}, {"x": 0.987, "y": 1.187, "c": "近傍", "n": "Caterpillar [A]  n=3426 cos0.99 難1.19", "s": 0.986, "f": 0}, {"x": 0.986, "y": 1.237, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2499 cos0.99 難1.24", "s": 0.719, "f": 0}, {"x": 0.984, "y": 1.758, "c": "近傍", "n": "HEROES [A]  n=571 cos0.98 難1.76", "s": 0.164, "f": 0}, {"x": 0.983, "y": 1.665, "c": "近傍", "n": "BLUE MIRAGE [A]  n=3145 cos0.98 難1.67", "s": 0.905, "f": 0}, {"x": 0.984, "y": 1.948, "c": "近傍", "n": "Level 4 [A]  n=1726 cos0.98 難1.95", "s": 0.497, "f": 0}, {"x": 0.984, "y": 1.952, "c": "近傍", "n": "THE PEERLESS UNDER HEAVEN [A]  n=2329 cos0.98 難1.95", "s": 0.67, "f": 0}, {"x": 0.981, "y": 1.376, "c": "近傍", "n": "Watch Out Pt.2 [A]  n=3474 cos0.98 難1.38", "s": 1.0, "f": 0}, {"x": 0.985, "y": 1.106, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3283 cos0.99 難1.11", "s": 0.945, "f": 0}, {"x": 0.99, "y": 0.91, "c": "近傍", "n": "Just a Little Smile [A]  n=3391 cos0.99 難0.91", "s": 0.976, "f": 0}, {"x": 0.983, "y": 2.041, "c": "近傍", "n": "Level 5 [A]  n=1095 cos0.98 難2.04", "s": 0.315, "f": 0}, {"x": 0.981, "y": 1.964, "c": "近傍", "n": "WHA [A]  n=1875 cos0.98 難1.96", "s": 0.54, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5419866854910529}, {"a": 0, "b": 2, "w": 0.4597314573031318}, {"a": 0, "b": 3, "w": 0.24412602344080359}, {"a": 0, "b": 4, "w": 0.3983614906703361}, {"a": 0, "b": 5, "w": 0.4307900297086562}, {"a": 0, "b": 6, "w": 0.38109753063131635}, {"a": 0, "b": 7, "w": 0.27416166193538694}, {"a": 0, "b": 8, "w": 0.3991166135972327}, {"a": 0, "b": 9, "w": 0.3538280822250678}, {"a": 0, "b": 10, "w": 0.40477931120143884}, {"a": 0, "b": 11, "w": 0.27283527161924703}, {"a": 0, "b": 12, "w": 0.29113820986253003}, {"a": 0, "b": 13, "w": 0.33097276595076897}, {"a": 0, "b": 14, "w": 0.07250216496842898}, {"a": 0, "b": 15, "w": 0.24243506531993064}, {"a": 0, "b": 16, "w": 0.3032070256900109}, {"a": 0, "b": 17, "w": 0.224920599196484}, {"a": 0, "b": 18, "w": 0.09633257328016565}, {"a": 0, "b": 19, "w": 2.318334413331513e-11}, {"a": 0, "b": 20, "w": 0.12161848814827814}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.002,loY=0.820,hiY=2.132;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
