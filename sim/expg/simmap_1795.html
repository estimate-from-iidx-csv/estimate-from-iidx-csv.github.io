<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">

 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.831, "c": "種", "n": "CHECKING YOU OUT [A]  n=3261 cos1.00 難0.83", "s": 0.861, "f": 0}, {"x": 0.967, "y": 0.807, "c": "近傍", "n": "ラクエン [A]  n=2994 cos0.97 難0.81", "s": 0.79, "f": 0}, {"x": 0.983, "y": 0.318, "c": "近傍", "n": "Watch out!! [A]  n=3269 cos0.98 難0.32", "s": 0.863, "f": 0}, {"x": 0.964, "y": 0.603, "c": "近傍", "n": "Wonder Bullfighter [A]  n=3343 cos0.96 難0.60", "s": 0.883, "f": 0}, {"x": 0.963, "y": 0.569, "c": "近傍", "n": "Digitank System [A]  n=3619 cos0.96 難0.57", "s": 0.955, "f": 0}, {"x": 0.968, "y": 0.32, "c": "近傍", "n": "Halfway of promise [A]  n=3449 cos0.97 難0.32", "s": 0.911, "f": 0}, {"x": 0.958, "y": 0.652, "c": "近傍", "n": "灼熱 Pt.2 Long Train Running [H]  n=3788 cos0.96 難0.65", "s": 1.0, "f": 0}, {"x": 0.957, "y": 0.49, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2974 cos0.96 難0.49", "s": 0.785, "f": 0}, {"x": 0.963, "y": 0.318, "c": "近傍", "n": "Hella Deep [A]  n=2810 cos0.96 難0.32", "s": 0.742, "f": 0}, {"x": 0.952, "y": 0.741, "c": "近傍", "n": "rough percussionythm [A]  n=2829 cos0.95 難0.74", "s": 0.747, "f": 0}, {"x": 0.953, "y": 0.568, "c": "近傍", "n": "naughty girl@Queen's Palace [A]  n=3736 cos0.95 難0.57", "s": 0.986, "f": 0}, {"x": 0.977, "y": 0.043, "c": "近傍", "n": "Skratch Education Lv-1 [H]  n=713 cos0.98 難0.04", "s": 0.188, "f": 0}, {"x": 0.97, "y": 0.09, "c": "近傍", "n": "Really Love [A]  n=3145 cos0.97 難0.09", "s": 0.83, "f": 0}, {"x": 0.966, "y": 0.132, "c": "近傍", "n": "Shamshir [A]  n=1506 cos0.97 難0.13", "s": 0.398, "f": 0}, {"x": 0.946, "y": 0.926, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3241 cos0.95 難0.93", "s": 0.856, "f": 0}, {"x": 0.965, "y": 0.111, "c": "近傍", "n": "SWEET LAB [A]  n=2476 cos0.96 難0.11", "s": 0.654, "f": 0}, {"x": 0.975, "y": -0.022, "c": "近傍", "n": "Midnight Drive [A]  n=2325 cos0.97 難-0.02", "s": 0.614, "f": 0}, {"x": 0.951, "y": 0.398, "c": "近傍", "n": "Catch Me [L]  n=731 cos0.95 難0.40", "s": 0.193, "f": 0}, {"x": 0.944, "y": 0.752, "c": "近傍", "n": "Bling-Bang-Bang-Born [L]  n=877 cos0.94 難0.75", "s": 0.232, "f": 0}, {"x": 0.945, "y": 1.035, "c": "近傍", "n": "Theory [A]  n=2919 cos0.94 難1.04", "s": 0.771, "f": 0}, {"x": 0.952, "y": 0.32, "c": "近傍", "n": "灼熱Beach Side Bunny (Masayoshi Iimori Remix) [A]  n=2953 cos0.95 難0.32", "s": 0.78, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4901048962894574}, {"a": 0, "b": 2, "w": 0.6364248427288894}, {"a": 0, "b": 3, "w": 0.45824850226147995}, {"a": 0, "b": 4, "w": 0.41151225588042795}, {"a": 0, "b": 5, "w": 0.5026135085255052}, {"a": 0, "b": 6, "w": 0.24707154663294228}, {"a": 0, "b": 7, "w": 0.4268848362142196}, {"a": 0, "b": 8, "w": 0.46769927040827597}, {"a": 0, "b": 9, "w": 0.27921614862205457}, {"a": 0, "b": 10, "w": 0.34266548573327116}, {"a": 0, "b": 11, "w": 0.5209396101596204}, {"a": 0, "b": 12, "w": 0.511837445591536}, {"a": 0, "b": 13, "w": 0.4519068825273588}, {"a": 0, "b": 14, "w": 0.2692998073748517}, {"a": 0, "b": 15, "w": 0.47687272953563575}, {"a": 0, "b": 16, "w": 0.5483584706395469}, {"a": 0, "b": 17, "w": 0.3187716711348755}, {"a": 0, "b": 18, "w": 1.8407608770587558e-11}, {"a": 0, "b": 19, "w": 0.1594971591256542}, {"a": 0, "b": 20, "w": 0.35762009074949586}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.940,hiX=1.004,loY=-0.106,hiY=1.120;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
