<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ubertreffen [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.282, "c": "種", "n": "Ubertreffen [H]  n=3084 cos1.00 難-0.28", "s": 0.88, "f": 0}, {"x": 0.994, "y": -0.318, "c": "近傍", "n": "CONTRACT [H]  n=2802 cos0.99 難-0.32", "s": 0.8, "f": 0}, {"x": 0.993, "y": -0.333, "c": "近傍", "n": "Last Dance [H]  n=2699 cos0.99 難-0.33", "s": 0.77, "f": 0}, {"x": 0.993, "y": -0.381, "c": "近傍", "n": "F [H]  n=3310 cos0.99 難-0.38", "s": 0.945, "f": 0}, {"x": 0.992, "y": -0.336, "c": "近傍", "n": "ALBIDA [H]  n=3260 cos0.99 難-0.34", "s": 0.931, "f": 0}, {"x": 0.996, "y": -0.478, "c": "近傍", "n": "ΕΛΠΙΣ [H]  n=3247 cos1.00 難-0.48", "s": 0.927, "f": 0}, {"x": 0.993, "y": -0.4, "c": "近傍", "n": "疾風迅雷 [H]  n=2794 cos0.99 難-0.40", "s": 0.798, "f": 0}, {"x": 0.993, "y": -0.135, "c": "近傍", "n": "Re:GENERATION [A]  n=3302 cos0.99 難-0.13", "s": 0.943, "f": 0}, {"x": 0.991, "y": -0.184, "c": "近傍", "n": "TRANOID [H]  n=2310 cos0.99 難-0.18", "s": 0.659, "f": 0}, {"x": 0.99, "y": -0.33, "c": "近傍", "n": "GAIA [H]  n=2875 cos0.99 難-0.33", "s": 0.821, "f": 0}, {"x": 0.993, "y": -0.495, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2388 cos0.99 難-0.49", "s": 0.682, "f": 0}, {"x": 0.989, "y": -0.38, "c": "近傍", "n": "Ancient Scapes [H]  n=2486 cos0.99 難-0.38", "s": 0.71, "f": 0}, {"x": 0.991, "y": -0.081, "c": "近傍", "n": "Good Looking [A]  n=756 cos0.99 難-0.08", "s": 0.216, "f": 0}, {"x": 0.988, "y": -0.28, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [H]  n=2460 cos0.99 難-0.28", "s": 0.702, "f": 0}, {"x": 0.988, "y": -0.325, "c": "近傍", "n": "Anisakis -somatic mutation type\"Forza\"- [H]  n=3121 cos0.99 難-0.32", "s": 0.891, "f": 0}, {"x": 0.988, "y": -0.249, "c": "近傍", "n": "G59 [H]  n=2932 cos0.99 難-0.25", "s": 0.837, "f": 0}, {"x": 0.988, "y": -0.34, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1724 cos0.99 難-0.34", "s": 0.492, "f": 0}, {"x": 0.988, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos0.99 難-0.32", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.267, "c": "近傍", "n": "Bad Maniacs [H]  n=3255 cos0.99 難-0.27", "s": 0.929, "f": 0}, {"x": 0.988, "y": -0.132, "c": "近傍", "n": "SPARK IN THE NIGHT [A]  n=1357 cos0.99 難-0.13", "s": 0.387, "f": 0}, {"x": 0.987, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos0.99 難-0.27", "s": 0.708, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3214658435917046}, {"a": 0, "b": 2, "w": 0.20158063413748384}, {"a": 0, "b": 3, "w": 0.16401860824881154}, {"a": 0, "b": 4, "w": 0.22154657203960926}, {"a": 0, "b": 5, "w": 0.43143745078567486}, {"a": 0, "b": 6, "w": 0.28922926006117033}, {"a": 0, "b": 7, "w": 0.2866563577865612}, {"a": 0, "b": 8, "w": 0.17100765183836486}, {"a": 0, "b": 9, "w": 0.12536764081757157}, {"a": 0, "b": 10, "w": 0.25530852428534945}, {"a": 0, "b": 11, "w": 0.13693405636887301}, {"a": 0, "b": 12, "w": 0.11641067378097625}, {"a": 0, "b": 13, "w": 0.09798376279104459}, {"a": 0, "b": 14, "w": 0.07993113579474975}, {"a": 0, "b": 15, "w": 0.005440325223687981}, {"a": 0, "b": 16, "w": 5.7458260371845427e-11}, {"a": 0, "b": 17, "w": 0.040561369941751746}, {"a": 0, "b": 18, "w": 0.02648856561817947}, {"a": 0, "b": 19, "w": 0.04984010238494141}, {"a": 0, "b": 20, "w": 0.027840030454082787}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.528,hiY=-0.048;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
