<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">fallen leaves -IIDX edition- [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.588, "c": "種", "n": "fallen leaves -IIDX edition- [H]  n=2439 cos1.00 難-0.59", "s": 0.737, "f": 0}, {"x": 0.995, "y": -0.528, "c": "近傍", "n": "Hollywood Galaxy [H]  n=2636 cos0.99 難-0.53", "s": 0.796, "f": 0}, {"x": 0.993, "y": -0.588, "c": "近傍", "n": "津軽雪 [H]  n=2594 cos0.99 難-0.59", "s": 0.784, "f": 0}, {"x": 0.992, "y": -0.654, "c": "近傍", "n": "DROP [H]  n=1809 cos0.99 難-0.65", "s": 0.547, "f": 0}, {"x": 0.995, "y": -0.379, "c": "近傍", "n": "海神 [H]  n=3059 cos1.00 難-0.38", "s": 0.924, "f": 0}, {"x": 0.992, "y": -0.696, "c": "近傍", "n": "旅人リラン [H]  n=2553 cos0.99 難-0.70", "s": 0.771, "f": 0}, {"x": 0.991, "y": -0.528, "c": "近傍", "n": "Carmina [H]  n=2217 cos0.99 難-0.53", "s": 0.67, "f": 0}, {"x": 0.993, "y": -0.781, "c": "近傍", "n": "Broken [H]  n=3144 cos0.99 難-0.78", "s": 0.95, "f": 0}, {"x": 0.991, "y": -0.555, "c": "近傍", "n": "SHADE [H]  n=2549 cos0.99 難-0.56", "s": 0.77, "f": 0}, {"x": 0.991, "y": -0.642, "c": "近傍", "n": "ANTHEM LANDING [H]  n=2377 cos0.99 難-0.64", "s": 0.718, "f": 0}, {"x": 0.998, "y": -0.315, "c": "近傍", "n": "THE BLACK KNIGHT [H]  n=2720 cos1.00 難-0.31", "s": 0.822, "f": 0}, {"x": 0.99, "y": -0.598, "c": "近傍", "n": "NEMESIS [H]  n=1851 cos0.99 難-0.60", "s": 0.559, "f": 0}, {"x": 0.99, "y": -0.622, "c": "近傍", "n": "Colors (radio edit) [H]  n=2374 cos0.99 難-0.62", "s": 0.717, "f": 0}, {"x": 0.99, "y": -0.576, "c": "近傍", "n": "Sphere [H]  n=1978 cos0.99 難-0.58", "s": 0.598, "f": 0}, {"x": 0.99, "y": -0.702, "c": "近傍", "n": "RED ZONE [H]  n=2997 cos0.99 難-0.70", "s": 0.905, "f": 0}, {"x": 0.993, "y": -0.821, "c": "近傍", "n": "D.C.fish [H]  n=1811 cos0.99 難-0.82", "s": 0.547, "f": 0}, {"x": 0.989, "y": -0.551, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2643 cos0.99 難-0.55", "s": 0.798, "f": 0}, {"x": 0.993, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos0.99 難-0.81", "s": 0.532, "f": 0}, {"x": 0.993, "y": -0.362, "c": "近傍", "n": "IIDX RED Ending (Ryu☆Remix) [A]  n=2474 cos0.99 難-0.36", "s": 0.747, "f": 0}, {"x": 0.99, "y": -0.712, "c": "近傍", "n": "STELLAR WIND [H]  n=2282 cos0.99 難-0.71", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.381, "c": "近傍", "n": "F [H]  n=3310 cos0.99 難-0.38", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4237439291005388}, {"a": 0, "b": 2, "w": 0.33475386231437376}, {"a": 0, "b": 3, "w": 0.2376173538792664}, {"a": 0, "b": 4, "w": 0.46001868734823925}, {"a": 0, "b": 5, "w": 0.23844458832482784}, {"a": 0, "b": 6, "w": 0.009696934570787685}, {"a": 0, "b": 7, "w": 0.1381854298679963}, {"a": 0, "b": 8, "w": 4.801226083372967e-11}, {"a": 0, "b": 9, "w": 0.13613692562717528}, {"a": 0, "b": 10, "w": 0.590324754109671}, {"a": 0, "b": 11, "w": 0.14874276629623118}, {"a": 0, "b": 12, "w": 0.036202944507554013}, {"a": 0, "b": 13, "w": 0.26264474867152643}, {"a": 0, "b": 14, "w": 0.1994981650601355}, {"a": 0, "b": 15, "w": 0.2248506364186088}, {"a": 0, "b": 16, "w": 0.18922244801030008}, {"a": 0, "b": 17, "w": 0.19281820905145597}, {"a": 0, "b": 18, "w": 0.38437336344094064}, {"a": 0, "b": 19, "w": 0.1336265958394014}, {"a": 0, "b": 20, "w": 0.1786678486750083}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.862,hiY=-0.274;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
