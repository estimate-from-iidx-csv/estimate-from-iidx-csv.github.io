<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">New Decade IIDX Edition [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.06, "c": "種", "n": "New Decade IIDX Edition [H]  n=2184 cos1.00 難-1.06", "s": 0.961, "f": 0}, {"x": 0.995, "y": -1.133, "c": "近傍", "n": "L.F.O [H]  n=1702 cos0.99 難-1.13", "s": 0.749, "f": 0}, {"x": 0.995, "y": -0.958, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [H]  n=1997 cos0.99 難-0.96", "s": 0.879, "f": 0}, {"x": 0.995, "y": -0.953, "c": "近傍", "n": "MAGIC & LOVE [H]  n=2053 cos0.99 難-0.95", "s": 0.903, "f": 0}, {"x": 0.994, "y": -0.976, "c": "近傍", "n": "Antigravity [H]  n=2031 cos0.99 難-0.98", "s": 0.894, "f": 0}, {"x": 0.993, "y": -1.076, "c": "近傍", "n": "invoker [H]  n=1884 cos0.99 難-1.08", "s": 0.829, "f": 0}, {"x": 0.992, "y": -1.018, "c": "近傍", "n": "Venom [H]  n=1704 cos0.99 難-1.02", "s": 0.75, "f": 0}, {"x": 0.992, "y": -1.048, "c": "近傍", "n": "もっと！モット！ときめき feat. 松下 [H]  n=2031 cos0.99 難-1.05", "s": 0.894, "f": 0}, {"x": 0.997, "y": -1.298, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [H]  n=1579 cos1.00 難-1.30", "s": 0.695, "f": 0}, {"x": 0.991, "y": -0.953, "c": "近傍", "n": "Empire of Fury [H]  n=1651 cos0.99 難-0.95", "s": 0.726, "f": 0}, {"x": 0.992, "y": -0.916, "c": "近傍", "n": "Castle on the Moon [H]  n=2273 cos0.99 難-0.92", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.905, "c": "近傍", "n": "Believe In Me [H]  n=1753 cos0.99 難-0.90", "s": 0.771, "f": 0}, {"x": 0.99, "y": -1.0, "c": "近傍", "n": "HYPE THE CORE [H]  n=1566 cos0.99 難-1.00", "s": 0.689, "f": 0}, {"x": 0.992, "y": -0.906, "c": "近傍", "n": "REMINISCENCE [H]  n=1865 cos0.99 難-0.91", "s": 0.821, "f": 0}, {"x": 0.996, "y": -0.772, "c": "近傍", "n": "Sol Cosine Job 2 [H]  n=2270 cos1.00 難-0.77", "s": 0.999, "f": 0}, {"x": 0.992, "y": -0.86, "c": "近傍", "n": "ONIGOROSHI [H]  n=1802 cos0.99 難-0.86", "s": 0.793, "f": 0}, {"x": 0.997, "y": -1.376, "c": "近傍", "n": "NANAIRO [H]  n=1414 cos1.00 難-1.38", "s": 0.622, "f": 0}, {"x": 0.991, "y": -0.878, "c": "近傍", "n": "お菓子の王国 [H]  n=1891 cos0.99 難-0.88", "s": 0.832, "f": 0}, {"x": 0.989, "y": -1.017, "c": "近傍", "n": "Elektrick U-Phoria [H]  n=2153 cos0.99 難-1.02", "s": 0.947, "f": 0}, {"x": 0.994, "y": -1.354, "c": "近傍", "n": "スーパー戦湯ババンバーン [H]  n=1255 cos0.99 難-1.35", "s": 0.552, "f": 0}, {"x": 0.989, "y": -1.023, "c": "近傍", "n": "Smashing Wedge [H]  n=1615 cos0.99 難-1.02", "s": 0.711, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3119339816248343}, {"a": 0, "b": 2, "w": 0.39992442160424124}, {"a": 0, "b": 3, "w": 0.29005498197837554}, {"a": 0, "b": 4, "w": 0.3618664849788217}, {"a": 0, "b": 5, "w": 0.32562820733014886}, {"a": 0, "b": 6, "w": 0.2600698109609033}, {"a": 0, "b": 7, "w": 0.21316173854457132}, {"a": 0, "b": 8, "w": 0.36881462250261476}, {"a": 0, "b": 9, "w": 0.2060843279277239}, {"a": 0, "b": 10, "w": 0.14155476532647226}, {"a": 0, "b": 11, "w": 0.23580381131672778}, {"a": 0, "b": 12, "w": 0.19691870426027036}, {"a": 0, "b": 13, "w": 0.12086269886990975}, {"a": 0, "b": 14, "w": 0.4451577403346739}, {"a": 0, "b": 15, "w": 0.016203911729958387}, {"a": 0, "b": 16, "w": 0.556093498873313}, {"a": 0, "b": 17, "w": 0.1888562800883079}, {"a": 0, "b": 18, "w": 0.0553699066154707}, {"a": 0, "b": 19, "w": 0.35260368167970924}, {"a": 0, "b": 20, "w": 6.108058503428992e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-1.424,hiY=-0.724;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
