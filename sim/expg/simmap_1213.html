<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">異心前進♪ぴょんぴょんぴょん [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.424, "c": "種", "n": "異心前進♪ぴょんぴょんぴょん [A]  n=1532 cos1.00 難-0.42", "s": 0.437, "f": 0}, {"x": 0.998, "y": -0.312, "c": "近傍", "n": "楽園追放 [A]  n=1688 cos1.00 難-0.31", "s": 0.482, "f": 0}, {"x": 0.997, "y": -0.34, "c": "近傍", "n": "Nyan Nyan University [A]  n=1114 cos1.00 難-0.34", "s": 0.318, "f": 0}, {"x": 0.996, "y": -0.459, "c": "近傍", "n": "めいさいアイドル☆あいむちゃん♪ [H]  n=2540 cos1.00 難-0.46", "s": 0.725, "f": 0}, {"x": 0.996, "y": -0.333, "c": "近傍", "n": "SYNC-ANTHEM [H]  n=2473 cos1.00 難-0.33", "s": 0.706, "f": 0}, {"x": 0.996, "y": -0.301, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2372 cos1.00 難-0.30", "s": 0.677, "f": 0}, {"x": 0.995, "y": -0.332, "c": "近傍", "n": "ZEROIN ON THE LIGHT [A]  n=1584 cos1.00 難-0.33", "s": 0.452, "f": 0}, {"x": 0.995, "y": -0.299, "c": "近傍", "n": "Answer [A]  n=3209 cos1.00 難-0.30", "s": 0.916, "f": 0}, {"x": 0.995, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos0.99 難-0.32", "s": 1.0, "f": 0}, {"x": 0.994, "y": -0.309, "c": "近傍", "n": "Summerblue [A]  n=2188 cos0.99 難-0.31", "s": 0.625, "f": 0}, {"x": 0.994, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos0.99 難-0.32", "s": 0.821, "f": 0}, {"x": 0.997, "y": -0.216, "c": "近傍", "n": "弾幕信仰 [A]  n=959 cos1.00 難-0.22", "s": 0.274, "f": 0}, {"x": 0.996, "y": -0.249, "c": "近傍", "n": "G59 [H]  n=2932 cos1.00 難-0.25", "s": 0.837, "f": 0}, {"x": 0.996, "y": -0.239, "c": "近傍", "n": "Devil's Gear [H]  n=2603 cos1.00 難-0.24", "s": 0.743, "f": 0}, {"x": 0.994, "y": -0.282, "c": "近傍", "n": "GENERATE feat.綾倉盟 [A]  n=3305 cos0.99 難-0.28", "s": 0.943, "f": 0}, {"x": 0.994, "y": -0.552, "c": "近傍", "n": "もんめためたもん [A]  n=1101 cos0.99 難-0.55", "s": 0.314, "f": 0}, {"x": 0.994, "y": -0.335, "c": "近傍", "n": "Shooting Fireball [H]  n=2562 cos0.99 難-0.33", "s": 0.731, "f": 0}, {"x": 0.993, "y": -0.376, "c": "近傍", "n": "True Blue [H]  n=3054 cos0.99 難-0.38", "s": 0.872, "f": 0}, {"x": 0.994, "y": -0.309, "c": "近傍", "n": "Psychedelic Intelligence [A]  n=871 cos0.99 難-0.31", "s": 0.249, "f": 0}, {"x": 0.993, "y": -0.342, "c": "近傍", "n": "ZZ [H]  n=3336 cos0.99 難-0.34", "s": 0.952, "f": 0}, {"x": 0.994, "y": -0.571, "c": "近傍", "n": "不死身ごっこ [A]  n=699 cos0.99 難-0.57", "s": 0.2, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5532326099293154}, {"a": 0, "b": 2, "w": 0.4230074717330897}, {"a": 0, "b": 3, "w": 0.31640544443505736}, {"a": 0, "b": 4, "w": 0.39626278580485086}, {"a": 0, "b": 5, "w": 0.34578897624319227}, {"a": 0, "b": 6, "w": 0.32631349149720423}, {"a": 0, "b": 7, "w": 0.33038573814004835}, {"a": 0, "b": 8, "w": 0.07475989471676359}, {"a": 0, "b": 9, "w": 0.2283902300443159}, {"a": 0, "b": 10, "w": 0.250317715012892}, {"a": 0, "b": 11, "w": 0.38819099822631364}, {"a": 0, "b": 12, "w": 0.3460110133409773}, {"a": 0, "b": 13, "w": 0.38638973491754924}, {"a": 0, "b": 14, "w": 0.17255042127417897}, {"a": 0, "b": 15, "w": 0.23393581790412854}, {"a": 0, "b": 16, "w": 0.15228820708041213}, {"a": 0, "b": 17, "w": 0.15051669726727346}, {"a": 0, "b": 18, "w": 0.22207355489893255}, {"a": 0, "b": 19, "w": 6.34776675667581e-11}, {"a": 0, "b": 20, "w": 0.14615434306676378}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.599,hiY=-0.187;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
