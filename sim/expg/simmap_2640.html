<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ghost Pulse [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.086, "c": "種", "n": "Ghost Pulse [A]  n=1918 cos1.00 難1.09", "s": 0.517, "f": 0}, {"x": 0.994, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.99 難1.12", "s": 0.917, "f": 0}, {"x": 0.994, "y": 1.162, "c": "近傍", "n": "Meissa [A]  n=2087 cos0.99 難1.16", "s": 0.563, "f": 0}, {"x": 0.992, "y": 0.972, "c": "近傍", "n": "ZZ [A]  n=3590 cos0.99 難0.97", "s": 0.968, "f": 0}, {"x": 0.989, "y": 1.133, "c": "近傍", "n": "Sounds Of Summer [A]  n=3413 cos0.99 難1.13", "s": 0.92, "f": 0}, {"x": 0.989, "y": 1.163, "c": "近傍", "n": "Dr. Chemical & Killing Machine [A]  n=3269 cos0.99 難1.16", "s": 0.881, "f": 0}, {"x": 0.988, "y": 1.065, "c": "近傍", "n": "RAIN [A]  n=3404 cos0.99 難1.07", "s": 0.918, "f": 0}, {"x": 0.99, "y": 1.288, "c": "近傍", "n": "龍と少女とデコヒーレンス [L]  n=3069 cos0.99 難1.29", "s": 0.827, "f": 0}, {"x": 0.989, "y": 0.889, "c": "近傍", "n": "Broken [A]  n=3710 cos0.99 難0.89", "s": 1.0, "f": 0}, {"x": 0.988, "y": 0.89, "c": "近傍", "n": "VANESSA [A]  n=3647 cos0.99 難0.89", "s": 0.983, "f": 0}, {"x": 0.986, "y": 1.227, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [A]  n=2508 cos0.99 難1.23", "s": 0.676, "f": 0}, {"x": 0.992, "y": 1.401, "c": "近傍", "n": "fallen leaves -IIDX edition- [A]  n=3178 cos0.99 難1.40", "s": 0.857, "f": 0}, {"x": 0.987, "y": 0.903, "c": "近傍", "n": "Plazma [L]  n=962 cos0.99 難0.90", "s": 0.259, "f": 0}, {"x": 0.986, "y": 1.214, "c": "近傍", "n": "Last Dance [A]  n=3336 cos0.99 難1.21", "s": 0.899, "f": 0}, {"x": 0.987, "y": 1.306, "c": "近傍", "n": "2 Be Continued [A]  n=949 cos0.99 難1.31", "s": 0.256, "f": 0}, {"x": 0.985, "y": 1.189, "c": "近傍", "n": "Viridian [A]  n=2628 cos0.98 難1.19", "s": 0.708, "f": 0}, {"x": 0.987, "y": 0.87, "c": "近傍", "n": "Begin [A]  n=996 cos0.99 難0.87", "s": 0.268, "f": 0}, {"x": 0.986, "y": 1.281, "c": "近傍", "n": "CODE:1 [revision1.0.1] [A]  n=3247 cos0.99 難1.28", "s": 0.875, "f": 0}, {"x": 0.985, "y": 0.909, "c": "近傍", "n": "TIEFSEE [A]  n=3620 cos0.99 難0.91", "s": 0.976, "f": 0}, {"x": 0.989, "y": 0.786, "c": "近傍", "n": "蛇神 [A]  n=3433 cos0.99 難0.79", "s": 0.925, "f": 0}, {"x": 0.985, "y": 1.276, "c": "近傍", "n": "Vermilion Carol [A]  n=1649 cos0.99 難1.28", "s": 0.444, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.44939000191805634}, {"a": 0, "b": 2, "w": 0.4050371096684692}, {"a": 0, "b": 3, "w": 0.3534012497538874}, {"a": 0, "b": 4, "w": 0.28875270698882194}, {"a": 0, "b": 5, "w": 0.27836601736566013}, {"a": 0, "b": 6, "w": 0.2520285442500658}, {"a": 0, "b": 7, "w": 0.30787158532536285}, {"a": 0, "b": 8, "w": 0.2829820632533786}, {"a": 0, "b": 9, "w": 0.1600481140275507}, {"a": 0, "b": 10, "w": 0.18495306751654106}, {"a": 0, "b": 11, "w": 0.29378656511654644}, {"a": 0, "b": 12, "w": 0.21100650436763257}, {"a": 0, "b": 13, "w": 0.19072206666437375}, {"a": 0, "b": 14, "w": 0.01091288616298658}, {"a": 0, "b": 15, "w": 0.15798299094283963}, {"a": 0, "b": 16, "w": 0.19702705832576584}, {"a": 0, "b": 17, "w": 0.1778334673289227}, {"a": 0, "b": 18, "w": 0.17100364128866785}, {"a": 0, "b": 19, "w": 0.20896045809299646}, {"a": 0, "b": 20, "w": 3.3845481972605285e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=0.737,hiY=1.451;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
