<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Seraph [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.888, "c": "種", "n": "Seraph [H]  n=595 cos1.00 難-1.89", "s": 0.37, "f": 0}, {"x": 0.99, "y": -1.716, "c": "近傍", "n": "世界の果てに約束の凱歌を -ReUnion- [H]  n=1150 cos0.99 難-1.72", "s": 0.714, "f": 0}, {"x": 0.987, "y": -1.928, "c": "近傍", "n": "オールトの雲 [H]  n=825 cos0.99 難-1.93", "s": 0.512, "f": 0}, {"x": 0.987, "y": -1.731, "c": "近傍", "n": "Rubrum Piano [H]  n=657 cos0.99 難-1.73", "s": 0.408, "f": 0}, {"x": 0.986, "y": -1.885, "c": "近傍", "n": "Ritual of Anubis [H]  n=624 cos0.99 難-1.89", "s": 0.388, "f": 0}, {"x": 0.986, "y": -1.87, "c": "近傍", "n": "Break Stasis [H]  n=1189 cos0.99 難-1.87", "s": 0.739, "f": 0}, {"x": 0.986, "y": -1.907, "c": "近傍", "n": "Queen Kaguya [H]  n=924 cos0.99 難-1.91", "s": 0.574, "f": 0}, {"x": 0.991, "y": -1.449, "c": "近傍", "n": "Be A Star [H]  n=1610 cos0.99 難-1.45", "s": 1.0, "f": 0}, {"x": 0.985, "y": -1.894, "c": "近傍", "n": "Pout [H]  n=600 cos0.99 難-1.89", "s": 0.373, "f": 0}, {"x": 0.988, "y": -1.567, "c": "近傍", "n": "最小三倍完全数 [H]  n=1144 cos0.99 難-1.57", "s": 0.711, "f": 0}, {"x": 0.995, "y": -1.288, "c": "近傍", "n": "イザナミノナゲキ [H]  n=1554 cos1.00 難-1.29", "s": 0.965, "f": 0}, {"x": 0.984, "y": -1.882, "c": "近傍", "n": "Speculation [H]  n=529 cos0.98 難-1.88", "s": 0.329, "f": 0}, {"x": 0.988, "y": -1.465, "c": "近傍", "n": "GRAVITON [H]  n=1112 cos0.99 難-1.47", "s": 0.691, "f": 0}, {"x": 0.984, "y": -1.747, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1156 cos0.98 難-1.75", "s": 0.718, "f": 0}, {"x": 0.987, "y": -1.455, "c": "近傍", "n": "Derelict Star feat. Ryu* [H]  n=1289 cos0.99 難-1.45", "s": 0.801, "f": 0}, {"x": 0.992, "y": -1.286, "c": "近傍", "n": "Aftermath [H]  n=1337 cos0.99 難-1.29", "s": 0.83, "f": 0}, {"x": 0.985, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.661, "f": 0}, {"x": 0.993, "y": -1.249, "c": "近傍", "n": "rommmo [H]  n=1023 cos0.99 難-1.25", "s": 0.635, "f": 0}, {"x": 0.987, "y": -1.379, "c": "近傍", "n": "Fervidex [H]  n=1547 cos0.99 難-1.38", "s": 0.961, "f": 0}, {"x": 0.986, "y": -1.447, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=534 cos0.99 難-1.45", "s": 0.332, "f": 0}, {"x": 0.985, "y": -1.458, "c": "近傍", "n": "バッド・スイーツ、バッド・ドリーム [H]  n=1474 cos0.98 難-1.46", "s": 0.916, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2331124126941393}, {"a": 0, "b": 2, "w": 0.22597890172915225}, {"a": 0, "b": 3, "w": 0.2226716631370942}, {"a": 0, "b": 4, "w": 0.1755104110856368}, {"a": 0, "b": 5, "w": 0.18266632442253583}, {"a": 0, "b": 6, "w": 5.5218940531176486e-11}, {"a": 0, "b": 7, "w": 0.3104587588485658}, {"a": 0, "b": 8, "w": 0.16265061147860027}, {"a": 0, "b": 9, "w": 0.1922959727251935}, {"a": 0, "b": 10, "w": 0.5079659076329888}, {"a": 0, "b": 11, "w": 0.12142638285873109}, {"a": 0, "b": 12, "w": 0.23092283370825084}, {"a": 0, "b": 13, "w": 0.02514465875997174}, {"a": 0, "b": 14, "w": 0.2046644117978692}, {"a": 0, "b": 15, "w": 0.10018156601623374}, {"a": 0, "b": 16, "w": 0.15489622764136757}, {"a": 0, "b": 17, "w": 0.40607071615469514}, {"a": 0, "b": 18, "w": 0.140094700764957}, {"a": 0, "b": 19, "w": 0.18026702328720234}, {"a": 0, "b": 20, "w": 0.044375633325533737}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-1.983,hiY=-1.195;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
