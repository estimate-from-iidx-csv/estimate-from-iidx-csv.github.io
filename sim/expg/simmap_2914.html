<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Watch Out Pt.2 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.376, "c": "種", "n": "Watch Out Pt.2 [A]  n=3474 cos1.00 難1.38", "s": 0.973, "f": 0}, {"x": 0.992, "y": 1.377, "c": "近傍", "n": "MAD ATTACK [L]  n=1390 cos0.99 難1.38", "s": 0.389, "f": 0}, {"x": 0.995, "y": 1.692, "c": "近傍", "n": "Be quiet [L]  n=2107 cos1.00 難1.69", "s": 0.59, "f": 0}, {"x": 0.996, "y": 1.733, "c": "近傍", "n": "BLACK.by X-Cross Fade [A]  n=3297 cos1.00 難1.73", "s": 0.923, "f": 0}, {"x": 0.984, "y": 1.237, "c": "近傍", "n": "ベィスドロップ・フリークス [L]  n=2499 cos0.98 難1.24", "s": 0.7, "f": 0}, {"x": 0.984, "y": 1.18, "c": "近傍", "n": "GAME ON [A]  n=1834 cos0.98 難1.18", "s": 0.513, "f": 0}, {"x": 0.985, "y": 1.628, "c": "近傍", "n": "Cult Invitation [A]  n=1260 cos0.98 難1.63", "s": 0.353, "f": 0}, {"x": 0.984, "y": 1.106, "c": "近傍", "n": "naughty girl@Queen's Palace [L]  n=3283 cos0.98 難1.11", "s": 0.919, "f": 0}, {"x": 0.982, "y": 1.363, "c": "近傍", "n": "Level 2 [A]  n=2879 cos0.98 難1.36", "s": 0.806, "f": 0}, {"x": 0.982, "y": 1.354, "c": "近傍", "n": "雪上断火 [A]  n=2095 cos0.98 難1.35", "s": 0.587, "f": 0}, {"x": 0.981, "y": 1.434, "c": "近傍", "n": "Red. by Full Metal Jacket [A]  n=3572 cos0.98 難1.43", "s": 1.0, "f": 0}, {"x": 0.984, "y": 1.704, "c": "近傍", "n": "Level 3 [A]  n=2164 cos0.98 難1.70", "s": 0.606, "f": 0}, {"x": 0.98, "y": 1.293, "c": "近傍", "n": "火影 [A]  n=3397 cos0.98 難1.29", "s": 0.951, "f": 0}, {"x": 0.981, "y": 1.577, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [A]  n=1567 cos0.98 難1.58", "s": 0.439, "f": 0}, {"x": 0.994, "y": 1.951, "c": "近傍", "n": "Red. by Jack Trance [A]  n=2725 cos0.99 難1.95", "s": 0.763, "f": 0}, {"x": 0.986, "y": 0.926, "c": "近傍", "n": "IDC feat.REVERBEE (Mo'Cuts Ver) [A]  n=3241 cos0.99 難0.93", "s": 0.907, "f": 0}, {"x": 0.99, "y": 0.836, "c": "近傍", "n": "Hydrogen Blueback [L]  n=1744 cos0.99 難0.84", "s": 0.488, "f": 0}, {"x": 0.991, "y": 1.948, "c": "近傍", "n": "Level 4 [A]  n=1726 cos0.99 難1.95", "s": 0.483, "f": 0}, {"x": 0.98, "y": 1.556, "c": "近傍", "n": "SCREW // owo // SCREW [A]  n=2755 cos0.98 難1.56", "s": 0.771, "f": 0}, {"x": 0.979, "y": 1.512, "c": "近傍", "n": "Peaktime Booster [A]  n=1913 cos0.98 難1.51", "s": 0.536, "f": 0}, {"x": 0.978, "y": 1.54, "c": "近傍", "n": "Snake Stick [A]  n=3365 cos0.98 難1.54", "s": 0.942, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4892448143914825}, {"a": 0, "b": 2, "w": 0.6045284895891387}, {"a": 0, "b": 3, "w": 0.2866322460224967}, {"a": 0, "b": 4, "w": 0.21983528918041206}, {"a": 0, "b": 5, "w": 0.2531057460747772}, {"a": 0, "b": 6, "w": 0.2933867642448539}, {"a": 0, "b": 7, "w": 0.19089359646053394}, {"a": 0, "b": 8, "w": 0.2499058573514672}, {"a": 0, "b": 9, "w": 0.21699808688380418}, {"a": 0, "b": 10, "w": 0.23368625533563814}, {"a": 0, "b": 11, "w": 0.02998002932855459}, {"a": 0, "b": 12, "w": 0.18999693207504909}, {"a": 0, "b": 13, "w": 0.228176872483156}, {"a": 0, "b": 14, "w": 0.04472957508792841}, {"a": 0, "b": 15, "w": 2.5679680604184796e-11}, {"a": 0, "b": 16, "w": 0.24312197743241548}, {"a": 0, "b": 17, "w": 0.058767591863530866}, {"a": 0, "b": 18, "w": 0.20811008197868097}, {"a": 0, "b": 19, "w": 0.19556008985710882}, {"a": 0, "b": 20, "w": 0.18052935150663652}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=0.747,hiY=2.040;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
