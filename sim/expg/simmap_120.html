<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Signs and Wonders [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.825, "c": "種", "n": "Signs and Wonders [A]  n=599 cos1.00 難-0.82", "s": 0.186, "f": 0}, {"x": 0.987, "y": -0.605, "c": "近傍", "n": "Riff//rain [A]  n=1283 cos0.99 難-0.60", "s": 0.399, "f": 0}, {"x": 0.984, "y": -0.863, "c": "近傍", "n": "Sakura Reflection [H]  n=3033 cos0.98 難-0.86", "s": 0.943, "f": 0}, {"x": 0.984, "y": -0.962, "c": "近傍", "n": "HEISEI [H]  n=2015 cos0.98 難-0.96", "s": 0.627, "f": 0}, {"x": 0.982, "y": -0.866, "c": "近傍", "n": "Linus [H]  n=1667 cos0.98 難-0.87", "s": 0.518, "f": 0}, {"x": 0.982, "y": -0.766, "c": "近傍", "n": "AO-1 [H]  n=2823 cos0.98 難-0.77", "s": 0.878, "f": 0}, {"x": 0.985, "y": -1.207, "c": "近傍", "n": "Megalara Garuda [H]  n=1484 cos0.98 難-1.21", "s": 0.461, "f": 0}, {"x": 0.983, "y": -0.426, "c": "近傍", "n": "夏色のセレナーデ [A]  n=1045 cos0.98 難-0.43", "s": 0.325, "f": 0}, {"x": 0.98, "y": -0.685, "c": "近傍", "n": "One More Lovely [H]  n=2528 cos0.98 難-0.68", "s": 0.786, "f": 0}, {"x": 0.98, "y": -0.617, "c": "近傍", "n": "ロマンシングエスケープ [A]  n=1115 cos0.98 難-0.62", "s": 0.347, "f": 0}, {"x": 0.985, "y": -0.367, "c": "近傍", "n": "VALLIS-NERIA [H]  n=2998 cos0.98 難-0.37", "s": 0.932, "f": 0}, {"x": 0.986, "y": -0.33, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2943 cos0.99 難-0.33", "s": 0.915, "f": 0}, {"x": 0.979, "y": -0.917, "c": "近傍", "n": "FLOWER [H]  n=3216 cos0.98 難-0.92", "s": 1.0, "f": 0}, {"x": 0.983, "y": -0.423, "c": "近傍", "n": "ANEMONE [A]  n=2521 cos0.98 難-0.42", "s": 0.784, "f": 0}, {"x": 0.979, "y": -0.896, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2393 cos0.98 難-0.90", "s": 0.744, "f": 0}, {"x": 0.978, "y": -0.809, "c": "近傍", "n": "Karma [H]  n=1620 cos0.98 難-0.81", "s": 0.504, "f": 0}, {"x": 0.983, "y": -1.257, "c": "近傍", "n": "cinder [H]  n=1446 cos0.98 難-1.26", "s": 0.45, "f": 0}, {"x": 0.978, "y": -0.866, "c": "近傍", "n": "Todestrieb [H]  n=3117 cos0.98 難-0.87", "s": 0.969, "f": 0}, {"x": 0.979, "y": -0.607, "c": "近傍", "n": "gentle stress [A]  n=1885 cos0.98 難-0.61", "s": 0.586, "f": 0}, {"x": 0.978, "y": -0.761, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=989 cos0.98 難-0.76", "s": 0.308, "f": 0}, {"x": 0.981, "y": -0.42, "c": "近傍", "n": "Forgetting Machine [A]  n=2207 cos0.98 難-0.42", "s": 0.686, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.28865511134742783}, {"a": 0, "b": 2, "w": 0.24946836677613216}, {"a": 0, "b": 3, "w": 0.253182523823978}, {"a": 0, "b": 4, "w": 0.1636904709374878}, {"a": 0, "b": 5, "w": 0.09252526662679361}, {"a": 0, "b": 6, "w": 0.2812137755387131}, {"a": 0, "b": 7, "w": 4.409961285034569e-11}, {"a": 0, "b": 8, "w": 0.16740707487711215}, {"a": 0, "b": 9, "w": 0.1538098416429884}, {"a": 0, "b": 10, "w": 0.1792269680080617}, {"a": 0, "b": 11, "w": 0.2830675133390925}, {"a": 0, "b": 12, "w": 0.116785199648334}, {"a": 0, "b": 13, "w": 0.2407534067382625}, {"a": 0, "b": 14, "w": 0.1548051089552045}, {"a": 0, "b": 15, "w": 0.10891464555082131}, {"a": 0, "b": 16, "w": 0.21346161863906987}, {"a": 0, "b": 17, "w": 0.13774986633061348}, {"a": 0, "b": 18, "w": 0.109333577232407}, {"a": 0, "b": 19, "w": 0.10576343526066756}, {"a": 0, "b": 20, "w": 0.18939615517635222}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.976,hiX=1.002,loY=-1.331,hiY=-0.256;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
