<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Level 2 [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.292, "c": "種", "n": "Level 2 [H]  n=1485 cos1.00 難-1.29", "s": 0.617, "f": 0}, {"x": 0.987, "y": -1.035, "c": "近傍", "n": "255 [H]  n=1427 cos0.99 難-1.03", "s": 0.593, "f": 0}, {"x": 0.981, "y": -1.161, "c": "近傍", "n": "電光 [H]  n=854 cos0.98 難-1.16", "s": 0.355, "f": 0}, {"x": 0.98, "y": -1.139, "c": "近傍", "n": "FlyAway [H]  n=627 cos0.98 難-1.14", "s": 0.26, "f": 0}, {"x": 0.978, "y": -1.378, "c": "近傍", "n": "Inner Spirit [H]  n=1472 cos0.98 難-1.38", "s": 0.611, "f": 0}, {"x": 0.993, "y": -1.708, "c": "近傍", "n": "VOLCANIC BIGBEAT [H]  n=756 cos0.99 難-1.71", "s": 0.314, "f": 0}, {"x": 0.977, "y": -1.435, "c": "近傍", "n": "Routing [H]  n=1895 cos0.98 難-1.44", "s": 0.787, "f": 0}, {"x": 0.981, "y": -1.012, "c": "近傍", "n": "火影 [H]  n=2102 cos0.98 難-1.01", "s": 0.873, "f": 0}, {"x": 0.977, "y": -1.023, "c": "近傍", "n": "m1dy Deluxe [H]  n=2327 cos0.98 難-1.02", "s": 0.966, "f": 0}, {"x": 0.973, "y": -1.213, "c": "近傍", "n": "Vulnerability [H]  n=661 cos0.97 難-1.21", "s": 0.275, "f": 0}, {"x": 0.98, "y": -0.915, "c": "近傍", "n": "Purple Perplex [H]  n=1793 cos0.98 難-0.92", "s": 0.745, "f": 0}, {"x": 0.973, "y": -1.168, "c": "近傍", "n": "& Intelligence [H]  n=1406 cos0.97 難-1.17", "s": 0.584, "f": 0}, {"x": 0.972, "y": -1.374, "c": "近傍", "n": "Around the Future [H]  n=1287 cos0.97 難-1.37", "s": 0.534, "f": 0}, {"x": 0.972, "y": -1.161, "c": "近傍", "n": "HADES [H]  n=2408 cos0.97 難-1.16", "s": 1.0, "f": 0}, {"x": 0.985, "y": -0.8, "c": "近傍", "n": "Level 3 [H]  n=1942 cos0.98 難-0.80", "s": 0.806, "f": 0}, {"x": 0.975, "y": -0.983, "c": "近傍", "n": "Peaktime Booster [H]  n=1228 cos0.97 難-0.98", "s": 0.51, "f": 0}, {"x": 0.979, "y": -0.874, "c": "近傍", "n": "Bounce Bounce Bounce [H]  n=2277 cos0.98 難-0.87", "s": 0.946, "f": 0}, {"x": 0.968, "y": -1.283, "c": "近傍", "n": "東京神話 [H]  n=1946 cos0.97 難-1.28", "s": 0.808, "f": 0}, {"x": 0.983, "y": -0.767, "c": "近傍", "n": "Level 4 [H]  n=1520 cos0.98 難-0.77", "s": 0.631, "f": 0}, {"x": 0.968, "y": -1.37, "c": "近傍", "n": "灼熱Beach Side Bunny (かめりあ's \"Summertime D'n'B\" Remix) [H]  n=715 cos0.97 難-1.37", "s": 0.297, "f": 0}, {"x": 0.974, "y": -0.917, "c": "近傍", "n": "Make Me Your Own [H]  n=1668 cos0.97 難-0.92", "s": 0.693, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.272062754900973}, {"a": 0, "b": 2, "w": 0.33533576626274975}, {"a": 0, "b": 3, "w": 0.30359884066276643}, {"a": 0, "b": 4, "w": 0.21053301749757303}, {"a": 0, "b": 5, "w": 0.5277481529356879}, {"a": 0, "b": 6, "w": 0.19881807045563038}, {"a": 0, "b": 7, "w": 0.1901696559651963}, {"a": 0, "b": 8, "w": 0.17608364354095074}, {"a": 0, "b": 9, "w": 0.18228633230285662}, {"a": 0, "b": 10, "w": 0.3075826387434597}, {"a": 0, "b": 11, "w": 0.1917073617855014}, {"a": 0, "b": 12, "w": 0.12124044024601133}, {"a": 0, "b": 13, "w": 0.12558699998214173}, {"a": 0, "b": 14, "w": 3.1627367391706684e-11}, {"a": 0, "b": 15, "w": 0.2226242169053474}, {"a": 0, "b": 16, "w": 0.10807514403925833}, {"a": 0, "b": 17, "w": 0.03040730353293053}, {"a": 0, "b": 18, "w": 0.1887129853060009}, {"a": 0, "b": 19, "w": 0.11273494558465547}, {"a": 0, "b": 20, "w": 0.09370966309164763}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.965,hiX=1.003,loY=-1.783,hiY=-0.692;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
