<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ベィスドロップ・フリークス [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.105, "c": "種", "n": "ベィスドロップ・フリークス [A]  n=3496 cos1.00 難-0.10", "s": 1.0, "f": 0}, {"x": 0.998, "y": -0.033, "c": "近傍", "n": "GREEN EYES [A]  n=1808 cos1.00 難-0.03", "s": 0.517, "f": 0}, {"x": 0.996, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos1.00 難-0.11", "s": 0.893, "f": 0}, {"x": 0.997, "y": -0.006, "c": "近傍", "n": "ラキラキ [A]  n=3099 cos1.00 難-0.01", "s": 0.886, "f": 0}, {"x": 0.996, "y": -0.229, "c": "近傍", "n": "星をこの手に [A]  n=3012 cos1.00 難-0.23", "s": 0.862, "f": 0}, {"x": 0.995, "y": -0.071, "c": "近傍", "n": "BEAUTIFUL ANGEL [A]  n=3044 cos0.99 難-0.07", "s": 0.871, "f": 0}, {"x": 0.994, "y": -0.074, "c": "近傍", "n": "vault of heaven [A]  n=2933 cos0.99 難-0.07", "s": 0.839, "f": 0}, {"x": 0.996, "y": -0.239, "c": "近傍", "n": "Devil's Gear [H]  n=2603 cos1.00 難-0.24", "s": 0.745, "f": 0}, {"x": 0.994, "y": -0.075, "c": "近傍", "n": "First Resolution [A]  n=2080 cos0.99 難-0.07", "s": 0.595, "f": 0}, {"x": 0.994, "y": -0.038, "c": "近傍", "n": "POODLE [A]  n=2921 cos0.99 難-0.04", "s": 0.836, "f": 0}, {"x": 0.994, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos0.99 難-0.12", "s": 0.871, "f": 0}, {"x": 0.995, "y": -0.23, "c": "近傍", "n": "Prohibited Props [A]  n=2358 cos0.99 難-0.23", "s": 0.674, "f": 0}, {"x": 0.994, "y": -0.075, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3049 cos0.99 難-0.08", "s": 0.872, "f": 0}, {"x": 0.996, "y": 0.095, "c": "近傍", "n": "Roulette [A]  n=2593 cos1.00 難0.10", "s": 0.742, "f": 0}, {"x": 0.993, "y": -0.06, "c": "近傍", "n": "NPC World [A]  n=2848 cos0.99 難-0.06", "s": 0.815, "f": 0}, {"x": 0.993, "y": -0.058, "c": "近傍", "n": "Phoenix [A]  n=3105 cos0.99 難-0.06", "s": 0.888, "f": 0}, {"x": 0.993, "y": -0.095, "c": "近傍", "n": "Zenius -I- vanisher [A]  n=3177 cos0.99 難-0.10", "s": 0.909, "f": 0}, {"x": 0.993, "y": -0.172, "c": "近傍", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=985 cos0.99 難-0.17", "s": 0.282, "f": 0}, {"x": 0.996, "y": -0.322, "c": "近傍", "n": "Proof of the existence [H]  n=2876 cos1.00 難-0.32", "s": 0.823, "f": 0}, {"x": 0.992, "y": -0.11, "c": "近傍", "n": "Lucky Days [A]  n=2963 cos0.99 難-0.11", "s": 0.848, "f": 0}, {"x": 0.992, "y": -0.13, "c": "近傍", "n": "Be OK [A]  n=2979 cos0.99 難-0.13", "s": 0.852, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4417857216643586}, {"a": 0, "b": 2, "w": 0.26420909366320955}, {"a": 0, "b": 3, "w": 0.2842218826294537}, {"a": 0, "b": 4, "w": 0.28942799736035174}, {"a": 0, "b": 5, "w": 0.26604948469520595}, {"a": 0, "b": 6, "w": 0.1079749091919654}, {"a": 0, "b": 7, "w": 0.33435741698102917}, {"a": 0, "b": 8, "w": 0.08330370351688798}, {"a": 0, "b": 9, "w": 0.1953586397451409}, {"a": 0, "b": 10, "w": 6.5948135841154e-11}, {"a": 0, "b": 11, "w": 0.2590795762752808}, {"a": 0, "b": 12, "w": 0.166123747682967}, {"a": 0, "b": 13, "w": 0.06368409173618317}, {"a": 0, "b": 14, "w": 0.1269106741210777}, {"a": 0, "b": 15, "w": 0.14270802886057976}, {"a": 0, "b": 16, "w": 0.05888409471693434}, {"a": 0, "b": 17, "w": 0.03632823896580317}, {"a": 0, "b": 18, "w": 0.27381964740118026}, {"a": 0, "b": 19, "w": 0.09076950775280035}, {"a": 0, "b": 20, "w": 0.03972810140222982}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=-0.356,hiY=0.129;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
