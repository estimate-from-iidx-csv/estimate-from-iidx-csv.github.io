<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">BLUST OF WIND [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.063, "c": "種", "n": "BLUST OF WIND [L]  n=1623 cos1.00 難0.06", "s": 0.441, "f": 0}, {"x": 0.994, "y": 0.137, "c": "近傍", "n": "Beyond The Seven [A]  n=3550 cos0.99 難0.14", "s": 0.965, "f": 0}, {"x": 0.995, "y": -0.095, "c": "近傍", "n": "LUV CAN SAVE U [L]  n=2983 cos0.99 難-0.10", "s": 0.811, "f": 0}, {"x": 0.992, "y": 0.103, "c": "近傍", "n": "Ambush Ace [A]  n=1732 cos0.99 難0.10", "s": 0.471, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "The Sky of Sadness [A]  n=2247 cos0.99 難-0.13", "s": 0.611, "f": 0}, {"x": 0.993, "y": 0.152, "c": "近傍", "n": "n'pa pa BBQ [A]  n=3520 cos0.99 難0.15", "s": 0.957, "f": 0}, {"x": 0.996, "y": 0.322, "c": "近傍", "n": "HEISEI [A]  n=3346 cos1.00 難0.32", "s": 0.909, "f": 0}, {"x": 0.992, "y": -0.007, "c": "近傍", "n": "Cyber Force [A]  n=2761 cos0.99 難-0.01", "s": 0.75, "f": 0}, {"x": 0.994, "y": 0.286, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2296 cos0.99 難0.29", "s": 0.624, "f": 0}, {"x": 0.991, "y": -0.008, "c": "近傍", "n": "超!!遠距離らぶメ～ル [A]  n=2975 cos0.99 難-0.01", "s": 0.809, "f": 0}, {"x": 0.994, "y": -0.195, "c": "近傍", "n": "LESSON 5 [A]  n=2302 cos0.99 難-0.20", "s": 0.626, "f": 0}, {"x": 0.992, "y": 0.254, "c": "近傍", "n": "パ→ピ→プ→Yeah! [A]  n=3679 cos0.99 難0.25", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.31, "c": "近傍", "n": "Harmony and Lovely [A]  n=3537 cos0.99 難0.31", "s": 0.961, "f": 0}, {"x": 0.99, "y": 0.156, "c": "近傍", "n": "D.C.fish [A]  n=3536 cos0.99 難0.16", "s": 0.961, "f": 0}, {"x": 0.99, "y": 0.01, "c": "近傍", "n": "50th Memorial Songs -Beginning Story- [A]  n=2379 cos0.99 難0.01", "s": 0.647, "f": 0}, {"x": 0.99, "y": 0.11, "c": "近傍", "n": "ZENDEGI DANCE [A]  n=3164 cos0.99 難0.11", "s": 0.86, "f": 0}, {"x": 0.991, "y": 0.272, "c": "近傍", "n": "Ember Lights [A]  n=3412 cos0.99 難0.27", "s": 0.927, "f": 0}, {"x": 0.989, "y": 0.074, "c": "近傍", "n": "Plea Per Phase [A]  n=1027 cos0.99 難0.07", "s": 0.279, "f": 0}, {"x": 0.989, "y": 0.033, "c": "近傍", "n": "shuriken [A]  n=3143 cos0.99 難0.03", "s": 0.854, "f": 0}, {"x": 0.99, "y": -0.04, "c": "近傍", "n": "Time To Empress [A]  n=3234 cos0.99 難-0.04", "s": 0.879, "f": 0}, {"x": 0.995, "y": 0.395, "c": "近傍", "n": "Divine Heaven [A]  n=1986 cos0.99 難0.39", "s": 0.54, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3982474872518419}, {"a": 0, "b": 2, "w": 0.43589832105659176}, {"a": 0, "b": 3, "w": 0.2169588012915733}, {"a": 0, "b": 4, "w": 0.3317227554920459}, {"a": 0, "b": 5, "w": 0.29608195784834235}, {"a": 0, "b": 6, "w": 0.5333359985584589}, {"a": 0, "b": 7, "w": 0.07207791911057371}, {"a": 0, "b": 8, "w": 0.1841771512673428}, {"a": 0, "b": 9, "w": 0.15952448646066353}, {"a": 0, "b": 10, "w": 0.3019941145488002}, {"a": 0, "b": 11, "w": 0.2470458573743718}, {"a": 0, "b": 12, "w": 4.647826568060509e-11}, {"a": 0, "b": 13, "w": 0.07902225405906105}, {"a": 0, "b": 14, "w": 0.22402882025763615}, {"a": 0, "b": 15, "w": 0.22110395057551802}, {"a": 0, "b": 16, "w": 0.2902635510162035}, {"a": 0, "b": 17, "w": 0.21607299918054235}, {"a": 0, "b": 18, "w": 0.21300370822528503}, {"a": 0, "b": 19, "w": 0.2042261231105411}, {"a": 0, "b": 20, "w": 0.27698021644631543}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.242,hiY=0.442;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
