<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}

<div id="wrap">

</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.419, "c": "種", "n": "Amor∞Fati [H]  n=346 cos1.00 難-1.42", "s": 0.208, "f": 0}, {"x": 0.992, "y": -1.448, "c": "近傍", "n": "ACT0 [H]  n=755 cos0.99 難-1.45", "s": 0.453, "f": 0}, {"x": 0.992, "y": -1.308, "c": "近傍", "n": "Regina vespaE [H]  n=648 cos0.99 難-1.31", "s": 0.389, "f": 0}, {"x": 0.992, "y": -1.29, "c": "近傍", "n": "The Last Apocalypse [H]  n=623 cos0.99 難-1.29", "s": 0.374, "f": 0}, {"x": 0.989, "y": -1.295, "c": "近傍", "n": "DUAL STRIKER [H]  n=1336 cos0.99 難-1.29", "s": 0.802, "f": 0}, {"x": 0.989, "y": -1.329, "c": "近傍", "n": "Vermilion Carol [H]  n=859 cos0.99 難-1.33", "s": 0.516, "f": 0}, {"x": 0.988, "y": -1.428, "c": "近傍", "n": "Stereo Beasts [H]  n=695 cos0.99 難-1.43", "s": 0.417, "f": 0}, {"x": 0.989, "y": -1.243, "c": "近傍", "n": "MARLIN [H]  n=503 cos0.99 難-1.24", "s": 0.302, "f": 0}, {"x": 0.987, "y": -1.337, "c": "近傍", "n": "Space Battleship S4TO [H]  n=634 cos0.99 難-1.34", "s": 0.381, "f": 0}, {"x": 0.987, "y": -1.459, "c": "近傍", "n": "夢縁 [H]  n=1038 cos0.99 難-1.46", "s": 0.623, "f": 0}, {"x": 0.989, "y": -1.201, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1065 cos0.99 難-1.20", "s": 0.639, "f": 0}, {"x": 0.987, "y": -1.35, "c": "近傍", "n": "dica dica [H]  n=1127 cos0.99 難-1.35", "s": 0.676, "f": 0}, {"x": 0.987, "y": -1.252, "c": "近傍", "n": "禊 [H]  n=1632 cos0.99 難-1.25", "s": 0.98, "f": 0}, {"x": 0.986, "y": -1.328, "c": "近傍", "n": "伐折羅-vajra- [H]  n=1666 cos0.99 難-1.33", "s": 1.0, "f": 0}, {"x": 0.986, "y": -1.449, "c": "近傍", "n": "#CMFLG [H]  n=888 cos0.99 難-1.45", "s": 0.533, "f": 0}, {"x": 0.987, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.373, "f": 0}, {"x": 0.989, "y": -1.112, "c": "近傍", "n": "Smalt #28598F [H]  n=1299 cos0.99 難-1.11", "s": 0.78, "f": 0}, {"x": 0.997, "y": -0.964, "c": "近傍", "n": "God Mind [H]  n=715 cos1.00 難-0.96", "s": 0.429, "f": 0}, {"x": 0.986, "y": -1.278, "c": "近傍", "n": "Satellite Burst [H]  n=903 cos0.99 難-1.28", "s": 0.542, "f": 0}, {"x": 0.985, "y": -1.306, "c": "近傍", "n": "frequent [H]  n=1101 cos0.99 難-1.31", "s": 0.661, "f": 0}, {"x": 0.994, "y": -0.97, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [H]  n=1246 cos0.99 難-0.97", "s": 0.748, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3572849465240935}, {"a": 0, "b": 2, "w": 0.39718071614579675}, {"a": 0, "b": 3, "w": 0.34066647727961674}, {"a": 0, "b": 4, "w": 0.2891215108948503}, {"a": 0, "b": 5, "w": 0.27423718881538117}, {"a": 0, "b": 6, "w": 0.1987168090797543}, {"a": 0, "b": 7, "w": 0.2705066447048441}, {"a": 0, "b": 8, "w": 0.16643066126689565}, {"a": 0, "b": 9, "w": 4.2429282309797145e-11}, {"a": 0, "b": 10, "w": 0.21903628667648756}, {"a": 0, "b": 11, "w": 0.09029447825261205}, {"a": 0, "b": 12, "w": 0.22666758605452242}, {"a": 0, "b": 13, "w": 0.09213302758017683}, {"a": 0, "b": 14, "w": 0.05395909992087666}, {"a": 0, "b": 15, "w": 0.06468042445882105}, {"a": 0, "b": 16, "w": 0.15255403157993397}, {"a": 0, "b": 17, "w": 0.5335442865662036}, {"a": 0, "b": 18, "w": 0.05302255824795332}, {"a": 0, "b": 19, "w": 0.061077180463410596}, {"a": 0, "b": 20, "w": 0.4849839342049036}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.984,hiX=1.001,loY=-1.499,hiY=-0.924;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
