<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">the trigger of innocence [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.088, "c": "種", "n": "the trigger of innocence [A]  n=2641 cos1.00 難-0.09", "s": 0.796, "f": 0}, {"x": 0.994, "y": -0.299, "c": "近傍", "n": "Shining World [A]  n=3138 cos0.99 難-0.30", "s": 0.946, "f": 0}, {"x": 0.988, "y": -0.091, "c": "近傍", "n": "Rainbow after snow [A]  n=3284 cos0.99 難-0.09", "s": 0.99, "f": 0}, {"x": 0.991, "y": -0.325, "c": "近傍", "n": "ヨシダさん [A]  n=2886 cos0.99 難-0.32", "s": 0.87, "f": 0}, {"x": 0.99, "y": -0.333, "c": "近傍", "n": "satfinal [A]  n=2970 cos0.99 難-0.33", "s": 0.895, "f": 0}, {"x": 0.988, "y": -0.342, "c": "近傍", "n": "未来のプリズム [A]  n=2664 cos0.99 難-0.34", "s": 0.803, "f": 0}, {"x": 0.987, "y": -0.329, "c": "近傍", "n": "SURVIVOR [A]  n=2824 cos0.99 難-0.33", "s": 0.851, "f": 0}, {"x": 0.985, "y": -0.193, "c": "近傍", "n": "おおきなこえで [L]  n=2616 cos0.99 難-0.19", "s": 0.789, "f": 0}, {"x": 0.987, "y": -0.31, "c": "近傍", "n": "Kick Out 仮面 [A]  n=2486 cos0.99 難-0.31", "s": 0.749, "f": 0}, {"x": 0.986, "y": -0.295, "c": "近傍", "n": "エディブルフラワーの独白 [A]  n=3302 cos0.99 難-0.29", "s": 0.995, "f": 0}, {"x": 0.983, "y": -0.133, "c": "近傍", "n": "CaptivAte～誓い～ [A]  n=3148 cos0.98 難-0.13", "s": 0.949, "f": 0}, {"x": 0.983, "y": -0.205, "c": "近傍", "n": "beatonic nation [A]  n=2332 cos0.98 難-0.20", "s": 0.703, "f": 0}, {"x": 0.984, "y": -0.247, "c": "近傍", "n": "Frozen Ray (original mix) [A]  n=2579 cos0.98 難-0.25", "s": 0.778, "f": 0}, {"x": 0.994, "y": -0.522, "c": "近傍", "n": "Dreamship [A]  n=1389 cos0.99 難-0.52", "s": 0.419, "f": 0}, {"x": 0.985, "y": -0.33, "c": "近傍", "n": "獅子霞麗ノ舞 [A]  n=2943 cos0.98 難-0.33", "s": 0.887, "f": 0}, {"x": 0.985, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos0.98 難-0.34", "s": 0.807, "f": 0}, {"x": 0.982, "y": -0.033, "c": "近傍", "n": "SCORE [A]  n=1435 cos0.98 難-0.03", "s": 0.433, "f": 0}, {"x": 0.984, "y": -0.308, "c": "近傍", "n": "LETHEBOLG ～双神威に斬り咲けり～ [A]  n=3317 cos0.98 難-0.31", "s": 1.0, "f": 0}, {"x": 0.984, "y": -0.33, "c": "近傍", "n": "虹色 [A]  n=3048 cos0.98 難-0.33", "s": 0.919, "f": 0}, {"x": 0.984, "y": -0.328, "c": "近傍", "n": "S-Bahn [A]  n=2152 cos0.98 難-0.33", "s": 0.649, "f": 0}, {"x": 0.982, "y": -0.25, "c": "近傍", "n": "Claiomh Solais [A]  n=2509 cos0.98 難-0.25", "s": 0.756, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5733757025662249}, {"a": 0, "b": 2, "w": 0.28728440497020324}, {"a": 0, "b": 3, "w": 0.5158508555369288}, {"a": 0, "b": 4, "w": 0.41879152805682596}, {"a": 0, "b": 5, "w": 0.3471902193066815}, {"a": 0, "b": 6, "w": 0.23737082035431745}, {"a": 0, "b": 7, "w": 4.44079217842841e-11}, {"a": 0, "b": 8, "w": 0.2153748890473982}, {"a": 0, "b": 9, "w": 0.1993651750617439}, {"a": 0, "b": 10, "w": 0.1537532538626032}, {"a": 0, "b": 11, "w": 0.10384064396325043}, {"a": 0, "b": 12, "w": 0.32761691017832617}, {"a": 0, "b": 13, "w": 0.5468088687271468}, {"a": 0, "b": 14, "w": 0.2800554304768663}, {"a": 0, "b": 15, "w": 0.2194744843496219}, {"a": 0, "b": 16, "w": 0.01823778615251037}, {"a": 0, "b": 17, "w": 0.13112936289592858}, {"a": 0, "b": 18, "w": 0.2198579334602614}, {"a": 0, "b": 19, "w": 0.2244462692652126}, {"a": 0, "b": 20, "w": 0.07471281651937023}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.981,hiX=1.001,loY=-0.561,hiY=0.006;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
