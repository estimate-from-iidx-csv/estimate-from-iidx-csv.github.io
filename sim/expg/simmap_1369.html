<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">God Mind [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.964, "c": "種", "n": "God Mind [H]  n=715 cos1.00 難-0.96", "s": 0.307, "f": 0}, {"x": 0.997, "y": -0.97, "c": "近傍", "n": "PLASMA SOUL NIGHT feat. Nana Takahashi / 709sec. [H]  n=1246 cos1.00 難-0.97", "s": 0.534, "f": 0}, {"x": 0.993, "y": -1.059, "c": "近傍", "n": "u gotta beat [H]  n=946 cos0.99 難-1.06", "s": 0.406, "f": 0}, {"x": 0.992, "y": -0.951, "c": "近傍", "n": "がっつり陰キャ!? 怪盗いいんちょの億劫^^; [H]  n=2002 cos0.99 難-0.95", "s": 0.858, "f": 0}, {"x": 0.993, "y": -0.822, "c": "近傍", "n": "ANCHOR [H]  n=2037 cos0.99 難-0.82", "s": 0.873, "f": 0}, {"x": 0.991, "y": -0.981, "c": "近傍", "n": "Catch Our Fire! [H]  n=1838 cos0.99 難-0.98", "s": 0.788, "f": 0}, {"x": 0.992, "y": -1.112, "c": "近傍", "n": "Smalt #28598F [H]  n=1299 cos0.99 難-1.11", "s": 0.557, "f": 0}, {"x": 0.991, "y": -0.962, "c": "近傍", "n": "Artist [H]  n=1573 cos0.99 難-0.96", "s": 0.675, "f": 0}, {"x": 0.99, "y": -0.996, "c": "近傍", "n": "EVANESCENT [H]  n=1485 cos0.99 難-1.00", "s": 0.637, "f": 0}, {"x": 0.99, "y": -0.958, "c": "近傍", "n": "Caterpillar [H]  n=2200 cos0.99 難-0.96", "s": 0.943, "f": 0}, {"x": 0.993, "y": -1.201, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1065 cos0.99 難-1.20", "s": 0.457, "f": 0}, {"x": 0.99, "y": -0.864, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1856 cos0.99 難-0.86", "s": 0.796, "f": 0}, {"x": 0.994, "y": -1.243, "c": "近傍", "n": "MARLIN [H]  n=503 cos0.99 難-1.24", "s": 0.216, "f": 0}, {"x": 0.992, "y": -1.183, "c": "近傍", "n": "Cross Fire [H]  n=534 cos0.99 難-1.18", "s": 0.229, "f": 0}, {"x": 0.991, "y": -1.129, "c": "近傍", "n": "今宵、ロマンス横丁。 [H]  n=606 cos0.99 難-1.13", "s": 0.26, "f": 0}, {"x": 0.989, "y": -1.077, "c": "近傍", "n": "Dahlia [H]  n=1107 cos0.99 難-1.08", "s": 0.475, "f": 0}, {"x": 0.995, "y": -1.308, "c": "近傍", "n": "Regina vespaE [H]  n=648 cos1.00 難-1.31", "s": 0.278, "f": 0}, {"x": 0.988, "y": -1.036, "c": "近傍", "n": "B.O.D.Y. [H]  n=1305 cos0.99 難-1.04", "s": 0.56, "f": 0}, {"x": 0.989, "y": -1.123, "c": "近傍", "n": "COSMIC V3LOCITY [H]  n=607 cos0.99 難-1.12", "s": 0.26, "f": 0}, {"x": 0.988, "y": -0.827, "c": "近傍", "n": "NEW GENERATION -もう、お前しか見えない- [H]  n=2332 cos0.99 難-0.83", "s": 1.0, "f": 0}, {"x": 0.992, "y": -1.29, "c": "近傍", "n": "The Last Apocalypse [H]  n=623 cos0.99 難-1.29", "s": 0.267, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5551544939805391}, {"a": 0, "b": 2, "w": 0.337027855278091}, {"a": 0, "b": 3, "w": 0.4117277311909242}, {"a": 0, "b": 4, "w": 0.41087341383255416}, {"a": 0, "b": 5, "w": 0.2658151021312172}, {"a": 0, "b": 6, "w": 0.0880697961607193}, {"a": 0, "b": 7, "w": 0.17101514565266296}, {"a": 0, "b": 8, "w": 0.18118644201249456}, {"a": 0, "b": 9, "w": 0.11068820373055}, {"a": 0, "b": 10, "w": 0.43038853546569944}, {"a": 0, "b": 11, "w": 0.1792161870581318}, {"a": 0, "b": 12, "w": 0.32336311261711415}, {"a": 0, "b": 13, "w": 0.2881738642939612}, {"a": 0, "b": 14, "w": 0.33258253327294895}, {"a": 0, "b": 15, "w": 0.2803833472507463}, {"a": 0, "b": 16, "w": 0.48254827769953745}, {"a": 0, "b": 17, "w": 0.010519692295772543}, {"a": 0, "b": 18, "w": 0.25055056362306494}, {"a": 0, "b": 19, "w": 3.9120706674111716e-11}, {"a": 0, "b": 20, "w": 0.41723145377130033}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-1.347,hiY=-0.784;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
