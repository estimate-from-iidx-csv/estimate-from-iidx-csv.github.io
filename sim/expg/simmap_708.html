<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">覚悟せよ！エンタンメ～ン ～より身の切り売り自暴自棄版～ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.731, "c": "種", "n": "覚悟せよ！エンタンメ～ン ～より身の切り売り自暴自棄版～ [H]  n=260 cos1.00 難-1.73", "s": 0.147, "f": 0}, {"x": 0.992, "y": -1.844, "c": "近傍", "n": "10000 MILES AWAY [H]  n=727 cos0.99 難-1.84", "s": 0.411, "f": 0}, {"x": 0.993, "y": -1.882, "c": "近傍", "n": "Speculation [H]  n=529 cos0.99 難-1.88", "s": 0.299, "f": 0}, {"x": 0.993, "y": -1.891, "c": "近傍", "n": "メズマライザー [H]  n=596 cos0.99 難-1.89", "s": 0.337, "f": 0}, {"x": 0.989, "y": -1.794, "c": "近傍", "n": "of the first magnitude [H]  n=845 cos0.99 難-1.79", "s": 0.477, "f": 0}, {"x": 0.99, "y": -1.575, "c": "近傍", "n": "Yum Yum Jelly [H]  n=1771 cos0.99 難-1.58", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.973, "c": "近傍", "n": "Rejection Girl [H]  n=822 cos0.99 難-1.97", "s": 0.464, "f": 0}, {"x": 0.986, "y": -1.782, "c": "近傍", "n": "Chemical Colours [H]  n=503 cos0.99 難-1.78", "s": 0.284, "f": 0}, {"x": 0.986, "y": -1.679, "c": "近傍", "n": "Hat Surprise (Season 2) [H]  n=703 cos0.99 難-1.68", "s": 0.397, "f": 0}, {"x": 0.988, "y": -1.908, "c": "近傍", "n": "Xyndrome [H]  n=860 cos0.99 難-1.91", "s": 0.486, "f": 0}, {"x": 0.987, "y": -1.872, "c": "近傍", "n": "Garuda [H]  n=879 cos0.99 難-1.87", "s": 0.496, "f": 0}, {"x": 0.985, "y": -1.746, "c": "近傍", "n": "Parvati [H]  n=731 cos0.98 難-1.75", "s": 0.413, "f": 0}, {"x": 0.988, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.601, "f": 0}, {"x": 0.985, "y": -1.822, "c": "近傍", "n": "Victory Of Ravers [H]  n=725 cos0.98 難-1.82", "s": 0.409, "f": 0}, {"x": 0.984, "y": -1.747, "c": "近傍", "n": "魅惑のYUMMYスイーツ [H]  n=1156 cos0.98 難-1.75", "s": 0.653, "f": 0}, {"x": 0.988, "y": -1.488, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1529 cos0.99 難-1.49", "s": 0.863, "f": 0}, {"x": 0.983, "y": -1.731, "c": "近傍", "n": "VALKYRIAS -英雄誕生- [H]  n=1296 cos0.98 難-1.73", "s": 0.732, "f": 0}, {"x": 0.993, "y": -2.076, "c": "近傍", "n": "眠りの国のステラ [H]  n=696 cos0.99 難-2.08", "s": 0.393, "f": 0}, {"x": 0.984, "y": -1.921, "c": "近傍", "n": "響花水月 [H]  n=684 cos0.98 難-1.92", "s": 0.386, "f": 0}, {"x": 0.983, "y": -1.61, "c": "近傍", "n": "Wonderland [H]  n=1089 cos0.98 難-1.61", "s": 0.615, "f": 0}, {"x": 0.984, "y": -1.894, "c": "近傍", "n": "Pout [H]  n=600 cos0.98 難-1.89", "s": 0.339, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.36638384805512036}, {"a": 0, "b": 2, "w": 0.43165715513128344}, {"a": 0, "b": 3, "w": 0.43073555437301814}, {"a": 0, "b": 4, "w": 0.247236385630215}, {"a": 0, "b": 5, "w": 0.3131975211689192}, {"a": 0, "b": 6, "w": 0.3921134040104781}, {"a": 0, "b": 7, "w": 0.04430415455427961}, {"a": 0, "b": 8, "w": 0.19148111793501332}, {"a": 0, "b": 9, "w": 0.22988580326670738}, {"a": 0, "b": 10, "w": 0.20745656381950894}, {"a": 0, "b": 11, "w": 0.14812867225789295}, {"a": 0, "b": 12, "w": 0.2383432317432298}, {"a": 0, "b": 13, "w": 0.1217085245981917}, {"a": 0, "b": 14, "w": 5.5681459443235326e-11}, {"a": 0, "b": 15, "w": 0.2057512732290926}, {"a": 0, "b": 16, "w": 0.10635458879582249}, {"a": 0, "b": 17, "w": 0.4155775575474331}, {"a": 0, "b": 18, "w": 0.1404860497250192}, {"a": 0, "b": 19, "w": 0.09708805957875766}, {"a": 0, "b": 20, "w": 0.10910320712084953}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-2.123,hiY=-1.441;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
