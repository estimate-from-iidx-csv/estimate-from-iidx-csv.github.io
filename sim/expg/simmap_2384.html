<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">IX [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.205, "c": "種", "n": "IX [H]  n=3474 cos1.00 難0.21", "s": 0.96, "f": 0}, {"x": 0.995, "y": 0.153, "c": "近傍", "n": "M.D.Injection [A]  n=2857 cos0.99 難0.15", "s": 0.79, "f": 0}, {"x": 0.994, "y": 0.164, "c": "近傍", "n": "FINALLY BLAZE [A]  n=2532 cos0.99 難0.16", "s": 0.7, "f": 0}, {"x": 0.994, "y": 0.115, "c": "近傍", "n": "GENOCIDE [H]  n=2571 cos0.99 難0.11", "s": 0.711, "f": 0}, {"x": 0.994, "y": 0.296, "c": "近傍", "n": "KHAMEN BREAK [A]  n=3461 cos0.99 難0.30", "s": 0.957, "f": 0}, {"x": 0.992, "y": 0.308, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3376 cos0.99 難0.31", "s": 0.933, "f": 0}, {"x": 0.991, "y": 0.21, "c": "近傍", "n": "SUPER HEROINE!! [A]  n=1030 cos0.99 難0.21", "s": 0.285, "f": 0}, {"x": 0.991, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos0.99 難0.21", "s": 0.661, "f": 0}, {"x": 0.993, "y": 0.386, "c": "近傍", "n": "Sakura Mirage [A]  n=3460 cos0.99 難0.39", "s": 0.957, "f": 0}, {"x": 0.991, "y": 0.301, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [A]  n=2636 cos0.99 難0.30", "s": 0.729, "f": 0}, {"x": 0.99, "y": 0.287, "c": "近傍", "n": "reunion [H]  n=3561 cos0.99 難0.29", "s": 0.985, "f": 0}, {"x": 0.99, "y": 0.133, "c": "近傍", "n": "Lost Souls [A]  n=2604 cos0.99 難0.13", "s": 0.72, "f": 0}, {"x": 0.99, "y": 0.095, "c": "近傍", "n": "Roulette [A]  n=2593 cos0.99 難0.10", "s": 0.717, "f": 0}, {"x": 0.994, "y": -0.033, "c": "近傍", "n": "GREEN EYES [A]  n=1808 cos0.99 難-0.03", "s": 0.5, "f": 0}, {"x": 0.99, "y": 0.284, "c": "近傍", "n": "ピアノ協奏曲第１番”蠍火” [H]  n=3617 cos0.99 難0.28", "s": 1.0, "f": 0}, {"x": 0.995, "y": -0.06, "c": "近傍", "n": "NPC World [A]  n=2848 cos1.00 難-0.06", "s": 0.787, "f": 0}, {"x": 0.99, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.873, "f": 0}, {"x": 0.99, "y": 0.101, "c": "近傍", "n": "voice of echo. [A]  n=807 cos0.99 難0.10", "s": 0.223, "f": 0}, {"x": 0.994, "y": -0.04, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3075 cos0.99 難-0.04", "s": 0.85, "f": 0}, {"x": 0.989, "y": 0.245, "c": "近傍", "n": "LAB [A]  n=3092 cos0.99 難0.24", "s": 0.855, "f": 0}, {"x": 0.989, "y": 0.132, "c": "近傍", "n": "Globe Glitter [A]  n=2077 cos0.99 難0.13", "s": 0.574, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49024477281031}, {"a": 0, "b": 2, "w": 0.4427119231564526}, {"a": 0, "b": 3, "w": 0.38773016765940116}, {"a": 0, "b": 4, "w": 0.48158589868872737}, {"a": 0, "b": 5, "w": 0.3874054069204611}, {"a": 0, "b": 6, "w": 0.27667235392899225}, {"a": 0, "b": 7, "w": 0.2760365006421098}, {"a": 0, "b": 8, "w": 0.37827567150925734}, {"a": 0, "b": 9, "w": 0.28065835114933946}, {"a": 0, "b": 10, "w": 0.3320800758512853}, {"a": 0, "b": 11, "w": 0.31007001648817045}, {"a": 0, "b": 12, "w": 4.145817023015752e-11}, {"a": 0, "b": 13, "w": 0.27539074242834316}, {"a": 0, "b": 14, "w": 0.31521794989800933}, {"a": 0, "b": 15, "w": 0.3059161652189958}, {"a": 0, "b": 16, "w": 0.21587757386425555}, {"a": 0, "b": 17, "w": 0.25074759180170403}, {"a": 0, "b": 18, "w": 0.4122591940466195}, {"a": 0, "b": 19, "w": 0.1907904755955372}, {"a": 0, "b": 20, "w": 0.1919185801466542}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.096,hiY=0.422;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
