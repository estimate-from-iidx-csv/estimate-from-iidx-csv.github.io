<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Karma [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.007, "c": "種", "n": "Karma [A]  n=2666 cos1.00 難-0.01", "s": 0.737, "f": 0}, {"x": 0.994, "y": -0.133, "c": "近傍", "n": "Infinite cave [A]  n=3073 cos0.99 難-0.13", "s": 0.85, "f": 0}, {"x": 0.993, "y": 0.01, "c": "近傍", "n": "Erosion Mark [A]  n=3615 cos0.99 難0.01", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.126, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [H]  n=2288 cos0.99 難-0.13", "s": 0.633, "f": 0}, {"x": 0.992, "y": -0.155, "c": "近傍", "n": "madrugada [A]  n=2176 cos0.99 難-0.15", "s": 0.602, "f": 0}, {"x": 0.992, "y": -0.125, "c": "近傍", "n": "ヒマワリ [A]  n=3294 cos0.99 難-0.12", "s": 0.911, "f": 0}, {"x": 0.992, "y": -0.182, "c": "近傍", "n": "HAPPY☆ANGEL [A]  n=3352 cos0.99 難-0.18", "s": 0.927, "f": 0}, {"x": 0.994, "y": -0.334, "c": "近傍", "n": "華蝶風雪 [H]  n=2939 cos0.99 難-0.33", "s": 0.813, "f": 0}, {"x": 0.991, "y": -0.213, "c": "近傍", "n": "abstract [A]  n=2273 cos0.99 難-0.21", "s": 0.629, "f": 0}, {"x": 0.991, "y": -0.172, "c": "近傍", "n": "bag [A]  n=2861 cos0.99 難-0.17", "s": 0.791, "f": 0}, {"x": 0.99, "y": -0.125, "c": "近傍", "n": "Breakin' Chain [A]  n=2889 cos0.99 難-0.12", "s": 0.799, "f": 0}, {"x": 0.99, "y": 0.026, "c": "近傍", "n": "Love Magic [A]  n=2550 cos0.99 難0.03", "s": 0.705, "f": 0}, {"x": 0.99, "y": -0.106, "c": "近傍", "n": "Broken My Heart [A]  n=2210 cos0.99 難-0.11", "s": 0.611, "f": 0}, {"x": 0.99, "y": -0.088, "c": "近傍", "n": "Freeway Shuffle [A]  n=2923 cos0.99 難-0.09", "s": 0.809, "f": 0}, {"x": 0.995, "y": -0.41, "c": "近傍", "n": "OTENAMI Hurricane [H]  n=2534 cos0.99 難-0.41", "s": 0.701, "f": 0}, {"x": 0.99, "y": -0.105, "c": "近傍", "n": "Tizona d'El Cid [A]  n=2953 cos0.99 難-0.10", "s": 0.817, "f": 0}, {"x": 0.989, "y": -0.041, "c": "近傍", "n": "LUV DRIVE [A]  n=2836 cos0.99 難-0.04", "s": 0.785, "f": 0}, {"x": 0.99, "y": 0.157, "c": "近傍", "n": "Real [A]  n=2334 cos0.99 難0.16", "s": 0.646, "f": 0}, {"x": 0.989, "y": -0.103, "c": "近傍", "n": "STEEL NEEDLE [H]  n=2602 cos0.99 難-0.10", "s": 0.72, "f": 0}, {"x": 0.989, "y": -0.078, "c": "近傍", "n": "memories [A]  n=2208 cos0.99 難-0.08", "s": 0.611, "f": 0}, {"x": 0.989, "y": -0.007, "c": "近傍", "n": "ビューティフルレシート [A]  n=3312 cos0.99 難-0.01", "s": 0.916, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3382587550881939}, {"a": 0, "b": 2, "w": 0.3053451833990388}, {"a": 0, "b": 3, "w": 0.2878228773544861}, {"a": 0, "b": 4, "w": 0.281344974860005}, {"a": 0, "b": 5, "w": 0.26383090027475264}, {"a": 0, "b": 6, "w": 0.2428661799350934}, {"a": 0, "b": 7, "w": 0.3546105521623224}, {"a": 0, "b": 8, "w": 0.21601314939079297}, {"a": 0, "b": 9, "w": 0.2106382551140451}, {"a": 0, "b": 10, "w": 0.10817816131604241}, {"a": 0, "b": 11, "w": 0.15983206344376832}, {"a": 0, "b": 12, "w": 0.1635327352974384}, {"a": 0, "b": 13, "w": 0.15320355130336605}, {"a": 0, "b": 14, "w": 0.3359352933389892}, {"a": 0, "b": 15, "w": 0.022315414979420578}, {"a": 0, "b": 16, "w": 0.10550755134265344}, {"a": 0, "b": 17, "w": 0.13497114630721374}, {"a": 0, "b": 18, "w": 6.092304438709562e-11}, {"a": 0, "b": 19, "w": 0.02463532855800421}, {"a": 0, "b": 20, "w": 0.031896833603508035}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.455,hiY=0.203;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
