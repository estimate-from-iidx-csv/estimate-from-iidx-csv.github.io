<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Journey [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.45, "c": "種", "n": "Journey [A]  n=2716 cos1.00 難-0.45", "s": 0.765, "f": 0}, {"x": 0.993, "y": -0.528, "c": "近傍", "n": "Hyper Drive feat. ぷにぷに電機 [A]  n=2534 cos0.99 難-0.53", "s": 0.714, "f": 0}, {"x": 0.993, "y": -0.342, "c": "近傍", "n": "エコ爺 [A]  n=3106 cos0.99 難-0.34", "s": 0.875, "f": 0}, {"x": 0.994, "y": -0.252, "c": "近傍", "n": "heaven above [A]  n=2526 cos0.99 難-0.25", "s": 0.712, "f": 0}, {"x": 0.991, "y": -0.582, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2279 cos0.99 難-0.58", "s": 0.642, "f": 0}, {"x": 0.991, "y": -0.321, "c": "近傍", "n": "Liquid Crystal Girl feat. echo [A]  n=2464 cos0.99 難-0.32", "s": 0.694, "f": 0}, {"x": 0.991, "y": -0.592, "c": "近傍", "n": "AIR RAID FROM THA UNDAGROUND [H]  n=2270 cos0.99 難-0.59", "s": 0.639, "f": 0}, {"x": 0.991, "y": -0.592, "c": "近傍", "n": "New Castle Legions [H]  n=1400 cos0.99 難-0.59", "s": 0.394, "f": 0}, {"x": 0.992, "y": -0.249, "c": "近傍", "n": "Seaside Labyrinth [A]  n=2707 cos0.99 難-0.25", "s": 0.763, "f": 0}, {"x": 0.99, "y": -0.333, "c": "近傍", "n": "satfinal [A]  n=2970 cos0.99 難-0.33", "s": 0.837, "f": 0}, {"x": 0.99, "y": -0.31, "c": "近傍", "n": "アクマフカ [A]  n=1842 cos0.99 難-0.31", "s": 0.519, "f": 0}, {"x": 0.989, "y": -0.426, "c": "近傍", "n": "Midnight Lady [A]  n=2776 cos0.99 難-0.43", "s": 0.782, "f": 0}, {"x": 0.996, "y": -0.774, "c": "近傍", "n": "EDEN [H]  n=3024 cos1.00 難-0.77", "s": 0.852, "f": 0}, {"x": 0.991, "y": -0.213, "c": "近傍", "n": "abstract [A]  n=2273 cos0.99 難-0.21", "s": 0.64, "f": 0}, {"x": 0.988, "y": -0.416, "c": "近傍", "n": "LUV CAN SAVE U [A]  n=3143 cos0.99 難-0.42", "s": 0.885, "f": 0}, {"x": 0.988, "y": -0.375, "c": "近傍", "n": "WISE UP! [A]  n=2808 cos0.99 難-0.37", "s": 0.791, "f": 0}, {"x": 0.99, "y": -0.249, "c": "近傍", "n": "Exchange Place [A]  n=2674 cos0.99 難-0.25", "s": 0.753, "f": 0}, {"x": 0.988, "y": -0.545, "c": "近傍", "n": "黒紅掬い [A]  n=1967 cos0.99 難-0.55", "s": 0.554, "f": 0}, {"x": 0.988, "y": -0.308, "c": "近傍", "n": "STAR FIELD [A]  n=2387 cos0.99 難-0.31", "s": 0.672, "f": 0}, {"x": 0.987, "y": -0.392, "c": "近傍", "n": "OOO [A]  n=3550 cos0.99 難-0.39", "s": 1.0, "f": 0}, {"x": 0.987, "y": -0.435, "c": "近傍", "n": "When I Met U [A]  n=2644 cos0.99 難-0.44", "s": 0.745, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.544067286165529}, {"a": 0, "b": 2, "w": 0.5645161803362376}, {"a": 0, "b": 3, "w": 0.5601081875502758}, {"a": 0, "b": 4, "w": 0.4209340338957942}, {"a": 0, "b": 5, "w": 0.48249718982646805}, {"a": 0, "b": 6, "w": 0.5080773901441624}, {"a": 0, "b": 7, "w": 0.2254163222979163}, {"a": 0, "b": 8, "w": 0.4544400701229345}, {"a": 0, "b": 9, "w": 0.47090192523827934}, {"a": 0, "b": 10, "w": 4.390654506636338e-11}, {"a": 0, "b": 11, "w": 0.35026310024524165}, {"a": 0, "b": 12, "w": 0.6560181692334812}, {"a": 0, "b": 13, "w": 0.34739931828541126}, {"a": 0, "b": 14, "w": 0.26423204620123986}, {"a": 0, "b": 15, "w": 0.40304525708089156}, {"a": 0, "b": 16, "w": 0.4097175747865144}, {"a": 0, "b": 17, "w": 0.3953028030347101}, {"a": 0, "b": 18, "w": 0.3075835316179333}, {"a": 0, "b": 19, "w": 0.19099063553420792}, {"a": 0, "b": 20, "w": 0.1925890740109324}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-0.819,hiY=-0.168;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
