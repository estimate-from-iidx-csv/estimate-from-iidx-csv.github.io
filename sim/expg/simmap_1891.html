<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">GHOST [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.671, "c": "種", "n": "GHOST [A]  n=2243 cos1.00 難0.67", "s": 0.611, "f": 0}, {"x": 0.997, "y": 0.733, "c": "近傍", "n": "LADYBIRD [A]  n=2804 cos1.00 難0.73", "s": 0.764, "f": 0}, {"x": 0.996, "y": 0.684, "c": "近傍", "n": "LAB [L]  n=856 cos1.00 難0.68", "s": 0.233, "f": 0}, {"x": 0.997, "y": 0.524, "c": "近傍", "n": "HYENA [A]  n=3451 cos1.00 難0.52", "s": 0.94, "f": 0}, {"x": 0.996, "y": 0.537, "c": "近傍", "n": "Next Tales 2 Oath (IIDX 20th Anniv \"Ring\" Theme) [A]  n=2667 cos1.00 難0.54", "s": 0.727, "f": 0}, {"x": 0.995, "y": 0.572, "c": "近傍", "n": "CaptivAte2～覚醒～ [A]  n=3321 cos1.00 難0.57", "s": 0.905, "f": 0}, {"x": 0.994, "y": 0.71, "c": "近傍", "n": "STELLAR WIND [A]  n=3201 cos0.99 難0.71", "s": 0.872, "f": 0}, {"x": 0.995, "y": 0.784, "c": "近傍", "n": "GENOCIDE [A]  n=3258 cos1.00 難0.78", "s": 0.887, "f": 0}, {"x": 0.995, "y": 0.588, "c": "近傍", "n": "Castle on the Moon [A]  n=3389 cos0.99 難0.59", "s": 0.923, "f": 0}, {"x": 0.995, "y": 0.533, "c": "近傍", "n": "Crazy Jackpot [A]  n=2696 cos1.00 難0.53", "s": 0.734, "f": 0}, {"x": 0.994, "y": 0.602, "c": "近傍", "n": "Ｘ↑Ｘ↓ [A]  n=3369 cos0.99 難0.60", "s": 0.918, "f": 0}, {"x": 0.994, "y": 0.731, "c": "近傍", "n": "HAPPY★RUSH [A]  n=3198 cos0.99 難0.73", "s": 0.871, "f": 0}, {"x": 0.994, "y": 0.757, "c": "近傍", "n": "Carry Me Away [A]  n=3345 cos0.99 難0.76", "s": 0.911, "f": 0}, {"x": 0.994, "y": 0.777, "c": "近傍", "n": "encounter [A]  n=3621 cos0.99 難0.78", "s": 0.986, "f": 0}, {"x": 0.997, "y": 0.458, "c": "近傍", "n": "夕焼け ～Fading Day～ [A]  n=3261 cos1.00 難0.46", "s": 0.888, "f": 0}, {"x": 0.994, "y": 0.796, "c": "近傍", "n": "Little Star [A]  n=3671 cos0.99 難0.80", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.652, "c": "近傍", "n": "3V0 [A]  n=2197 cos0.99 難0.65", "s": 0.598, "f": 0}, {"x": 0.998, "y": 0.441, "c": "近傍", "n": "Lighting Shower [A]  n=3191 cos1.00 難0.44", "s": 0.869, "f": 0}, {"x": 0.993, "y": 0.733, "c": "近傍", "n": "デッドボヲルdeホームラン [A]  n=3238 cos0.99 難0.73", "s": 0.882, "f": 0}, {"x": 0.993, "y": 0.72, "c": "近傍", "n": "TITANS RETURN [A]  n=3176 cos0.99 難0.72", "s": 0.865, "f": 0}, {"x": 0.993, "y": 0.562, "c": "近傍", "n": "Night! Night! Night! [A]  n=2918 cos0.99 難0.56", "s": 0.795, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.45139795811386396}, {"a": 0, "b": 2, "w": 0.5139724960590404}, {"a": 0, "b": 3, "w": 0.5744653212092543}, {"a": 0, "b": 4, "w": 0.5337412510874873}, {"a": 0, "b": 5, "w": 0.4151671178545787}, {"a": 0, "b": 6, "w": 0.40589007311467207}, {"a": 0, "b": 7, "w": 0.36194304541252775}, {"a": 0, "b": 8, "w": 0.43714026856645816}, {"a": 0, "b": 9, "w": 0.4767825338684001}, {"a": 0, "b": 10, "w": 0.37631485561322364}, {"a": 0, "b": 11, "w": 0.2373315812004253}, {"a": 0, "b": 12, "w": 0.183671010339177}, {"a": 0, "b": 13, "w": 0.1620033647516027}, {"a": 0, "b": 14, "w": 0.5469710824601349}, {"a": 0, "b": 15, "w": 0.33591281266972084}, {"a": 0, "b": 16, "w": 4.352274096675046e-11}, {"a": 0, "b": 17, "w": 0.307310008170372}, {"a": 0, "b": 18, "w": 0.2390417215851095}, {"a": 0, "b": 19, "w": 0.28592605496744095}, {"a": 0, "b": 20, "w": 0.3368513685846559}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.992,hiX=1.001,loY=0.412,hiY=0.824;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
