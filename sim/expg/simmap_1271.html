<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Binary Black Hole [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.17, "c": "種", "n": "Binary Black Hole [H]  n=1332 cos1.00 難-1.17", "s": 0.604, "f": 0}, {"x": 0.997, "y": -1.17, "c": "近傍", "n": "Visterhv [H]  n=2062 cos1.00 難-1.17", "s": 0.934, "f": 0}, {"x": 0.994, "y": -1.207, "c": "近傍", "n": "Megalara Garuda [H]  n=1484 cos0.99 難-1.21", "s": 0.672, "f": 0}, {"x": 0.994, "y": -1.116, "c": "近傍", "n": "Lightspeed [H]  n=629 cos0.99 難-1.12", "s": 0.285, "f": 0}, {"x": 0.993, "y": -1.247, "c": "近傍", "n": "Triple Cross [H]  n=1731 cos0.99 難-1.25", "s": 0.784, "f": 0}, {"x": 0.992, "y": -1.286, "c": "近傍", "n": "Aftermath [H]  n=1337 cos0.99 難-1.29", "s": 0.606, "f": 0}, {"x": 0.992, "y": -1.04, "c": "近傍", "n": "SOLID STATE SQUAD -RISEN RELIC REMIX- [H]  n=1346 cos0.99 難-1.04", "s": 0.61, "f": 0}, {"x": 0.994, "y": -1.411, "c": "近傍", "n": "DIVINE JUDGEMENT [H]  n=621 cos0.99 難-1.41", "s": 0.281, "f": 0}, {"x": 0.993, "y": -1.381, "c": "近傍", "n": "glacia [H]  n=1066 cos0.99 難-1.38", "s": 0.483, "f": 0}, {"x": 0.993, "y": -0.962, "c": "近傍", "n": "HEISEI [H]  n=2015 cos0.99 難-0.96", "s": 0.913, "f": 0}, {"x": 0.991, "y": -1.257, "c": "近傍", "n": "cinder [H]  n=1446 cos0.99 難-1.26", "s": 0.655, "f": 0}, {"x": 0.994, "y": -0.905, "c": "近傍", "n": "ABSOLUTE EVIL [H]  n=1791 cos0.99 難-0.91", "s": 0.812, "f": 0}, {"x": 0.991, "y": -1.082, "c": "近傍", "n": "Boomy and The Boost [H]  n=2207 cos0.99 難-1.08", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.447, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=534 cos0.99 難-1.45", "s": 0.242, "f": 0}, {"x": 0.991, "y": -1.383, "c": "近傍", "n": "Daily Lunch Special [H]  n=1711 cos0.99 難-1.38", "s": 0.775, "f": 0}, {"x": 0.994, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.483, "f": 0}, {"x": 0.989, "y": -1.193, "c": "近傍", "n": "烽火連天の刃 [H]  n=1238 cos0.99 難-1.19", "s": 0.561, "f": 0}, {"x": 0.989, "y": -1.312, "c": "近傍", "n": "[ ]DENTITY [H]  n=1427 cos0.99 難-1.31", "s": 0.647, "f": 0}, {"x": 0.989, "y": -1.015, "c": "近傍", "n": "voltississimo [H]  n=1810 cos0.99 難-1.01", "s": 0.82, "f": 0}, {"x": 0.989, "y": -1.371, "c": "近傍", "n": "Sword of Vengeance [H]  n=735 cos0.99 難-1.37", "s": 0.333, "f": 0}, {"x": 0.987, "y": -1.288, "c": "近傍", "n": "イザナミノナゲキ [H]  n=1554 cos0.99 難-1.29", "s": 0.704, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5768234521709092}, {"a": 0, "b": 2, "w": 0.3841806052199188}, {"a": 0, "b": 3, "w": 0.3843812883367679}, {"a": 0, "b": 4, "w": 0.4267227964710535}, {"a": 0, "b": 5, "w": 0.38213386225412915}, {"a": 0, "b": 6, "w": 0.2297759672981693}, {"a": 0, "b": 7, "w": 0.4009489276489312}, {"a": 0, "b": 8, "w": 0.3674260844896089}, {"a": 0, "b": 9, "w": 0.3358979282755602}, {"a": 0, "b": 10, "w": 0.31117621950373153}, {"a": 0, "b": 11, "w": 0.34364455205676314}, {"a": 0, "b": 12, "w": 0.11330738452497957}, {"a": 0, "b": 13, "w": 0.19078292645975892}, {"a": 0, "b": 14, "w": 0.2800196730289858}, {"a": 0, "b": 15, "w": 0.21818959158495332}, {"a": 0, "b": 16, "w": 0.07750593656759885}, {"a": 0, "b": 17, "w": 0.2262609313310835}, {"a": 0, "b": 18, "w": 5.000622138595645e-11}, {"a": 0, "b": 19, "w": 0.22086829341001735}, {"a": 0, "b": 20, "w": 0.10358282229051907}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.986,hiX=1.001,loY=-1.565,hiY=-0.856;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
