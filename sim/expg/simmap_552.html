<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Summerlights(IIDX Edition) [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.293, "c": "種", "n": "Summerlights(IIDX Edition) [H]  n=1468 cos1.00 難-1.29", "s": 0.659, "f": 0}, {"x": 0.994, "y": -1.12, "c": "近傍", "n": "魔法のかくれんぼ [H]  n=1208 cos0.99 難-1.12", "s": 0.543, "f": 0}, {"x": 0.99, "y": -1.383, "c": "近傍", "n": "Daily Lunch Special [H]  n=1711 cos0.99 難-1.38", "s": 0.769, "f": 0}, {"x": 0.993, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.99 難-1.52", "s": 0.478, "f": 0}, {"x": 0.988, "y": -1.346, "c": "近傍", "n": "BIGWAVERS [H]  n=765 cos0.99 難-1.35", "s": 0.344, "f": 0}, {"x": 0.988, "y": -1.353, "c": "近傍", "n": "TRIUMPH [H]  n=1660 cos0.99 難-1.35", "s": 0.746, "f": 0}, {"x": 0.989, "y": -1.447, "c": "近傍", "n": "ビビッド ☆+*。キラキライム [H]  n=534 cos0.99 難-1.45", "s": 0.24, "f": 0}, {"x": 0.988, "y": -1.379, "c": "近傍", "n": "Fervidex [H]  n=1547 cos0.99 難-1.38", "s": 0.695, "f": 0}, {"x": 0.987, "y": -1.262, "c": "近傍", "n": "麗 ～うらら～ [H]  n=1858 cos0.99 難-1.26", "s": 0.835, "f": 0}, {"x": 0.99, "y": -1.082, "c": "近傍", "n": "Boomy and The Boost [H]  n=2207 cos0.99 難-1.08", "s": 0.991, "f": 0}, {"x": 0.988, "y": -1.133, "c": "近傍", "n": "L.F.O [H]  n=1702 cos0.99 難-1.13", "s": 0.765, "f": 0}, {"x": 0.988, "y": -1.452, "c": "近傍", "n": "Lisa-RICCIA [H]  n=664 cos0.99 難-1.45", "s": 0.298, "f": 0}, {"x": 0.988, "y": -1.48, "c": "近傍", "n": "LIGHTNING STRIKES [H]  n=1674 cos0.99 難-1.48", "s": 0.752, "f": 0}, {"x": 0.986, "y": -1.272, "c": "近傍", "n": "妖隠し -あやかしかくし- [H]  n=2226 cos0.99 難-1.27", "s": 1.0, "f": 0}, {"x": 0.986, "y": -1.193, "c": "近傍", "n": "烽火連天の刃 [H]  n=1238 cos0.99 難-1.19", "s": 0.556, "f": 0}, {"x": 0.985, "y": -1.247, "c": "近傍", "n": "Triple Cross [H]  n=1731 cos0.99 難-1.25", "s": 0.778, "f": 0}, {"x": 0.987, "y": -1.116, "c": "近傍", "n": "Lightspeed [H]  n=629 cos0.99 難-1.12", "s": 0.283, "f": 0}, {"x": 0.985, "y": -1.257, "c": "近傍", "n": "cinder [H]  n=1446 cos0.98 難-1.26", "s": 0.65, "f": 0}, {"x": 0.986, "y": -1.488, "c": "近傍", "n": "ROTTERDAM SHOGUN [H]  n=1529 cos0.99 難-1.49", "s": 0.687, "f": 0}, {"x": 0.984, "y": -1.362, "c": "近傍", "n": "Carry Me Away [H]  n=1400 cos0.98 難-1.36", "s": 0.629, "f": 0}, {"x": 0.984, "y": -1.207, "c": "近傍", "n": "Megalara Garuda [H]  n=1484 cos0.98 難-1.21", "s": 0.667, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5969971735898818}, {"a": 0, "b": 2, "w": 0.4752473988056213}, {"a": 0, "b": 3, "w": 0.5794742649345992}, {"a": 0, "b": 4, "w": 0.4611905401251215}, {"a": 0, "b": 5, "w": 0.24102923071018112}, {"a": 0, "b": 6, "w": 0.4841218197922974}, {"a": 0, "b": 7, "w": 0.36333110488619813}, {"a": 0, "b": 8, "w": 0.3843314942215169}, {"a": 0, "b": 9, "w": 0.5006826837843203}, {"a": 0, "b": 10, "w": 0.4613537555682067}, {"a": 0, "b": 11, "w": 0.3521518384433172}, {"a": 0, "b": 12, "w": 0.42930301280797634}, {"a": 0, "b": 13, "w": 0.2487495600937889}, {"a": 0, "b": 14, "w": 3.8479441855088226e-11}, {"a": 0, "b": 15, "w": 0.27148287967775064}, {"a": 0, "b": 16, "w": 0.1736575218869273}, {"a": 0, "b": 17, "w": 0.3399782896998792}, {"a": 0, "b": 18, "w": 0.41979589097093006}, {"a": 0, "b": 19, "w": 0.37914881304672976}, {"a": 0, "b": 20, "w": 0.34848484019260384}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-1.551,hiY=-1.047;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
