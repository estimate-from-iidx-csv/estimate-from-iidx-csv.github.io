<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Linus [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.866, "c": "種", "n": "Linus [H]  n=1667 cos1.00 難-0.87", "s": 0.461, "f": 0}, {"x": 0.994, "y": -0.916, "c": "近傍", "n": "GOLD RUSH [H]  n=2940 cos0.99 難-0.92", "s": 0.813, "f": 0}, {"x": 0.993, "y": -0.863, "c": "近傍", "n": "Sakura Reflection [H]  n=3033 cos0.99 難-0.86", "s": 0.838, "f": 0}, {"x": 0.996, "y": -0.607, "c": "近傍", "n": "gentle stress [A]  n=1885 cos1.00 難-0.61", "s": 0.521, "f": 0}, {"x": 0.991, "y": -0.809, "c": "近傍", "n": "Karma [H]  n=1620 cos0.99 難-0.81", "s": 0.448, "f": 0}, {"x": 0.992, "y": -1.041, "c": "近傍", "n": "Super Rush [H]  n=2276 cos0.99 難-1.04", "s": 0.629, "f": 0}, {"x": 0.991, "y": -0.745, "c": "近傍", "n": "HIGH [H]  n=1618 cos0.99 難-0.75", "s": 0.447, "f": 0}, {"x": 0.99, "y": -0.89, "c": "近傍", "n": "LOVE SHINE [H]  n=2271 cos0.99 難-0.89", "s": 0.628, "f": 0}, {"x": 0.99, "y": -0.775, "c": "近傍", "n": "rottel-the-Mercury [H]  n=1964 cos0.99 難-0.77", "s": 0.543, "f": 0}, {"x": 0.989, "y": -0.962, "c": "近傍", "n": "HEISEI [H]  n=2015 cos0.99 難-0.96", "s": 0.557, "f": 0}, {"x": 0.993, "y": -0.571, "c": "近傍", "n": "chrono diver -fragment- [A]  n=3618 cos0.99 難-0.57", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.685, "c": "近傍", "n": "One More Lovely [H]  n=2528 cos0.99 難-0.68", "s": 0.699, "f": 0}, {"x": 0.988, "y": -0.766, "c": "近傍", "n": "AO-1 [H]  n=2823 cos0.99 難-0.77", "s": 0.78, "f": 0}, {"x": 0.988, "y": -0.761, "c": "近傍", "n": "JUST SYNC ft.Kanae Asaba [A]  n=989 cos0.99 難-0.76", "s": 0.273, "f": 0}, {"x": 0.987, "y": -0.896, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [H]  n=2393 cos0.99 難-0.90", "s": 0.661, "f": 0}, {"x": 0.987, "y": -0.881, "c": "近傍", "n": "memories [H]  n=1666 cos0.99 難-0.88", "s": 0.46, "f": 0}, {"x": 0.99, "y": -0.605, "c": "近傍", "n": "Riff//rain [A]  n=1283 cos0.99 難-0.60", "s": 0.355, "f": 0}, {"x": 0.987, "y": -0.916, "c": "近傍", "n": "Castle on the Moon [H]  n=2273 cos0.99 難-0.92", "s": 0.628, "f": 0}, {"x": 0.988, "y": -1.032, "c": "近傍", "n": "NEO GENERATOR SEVEN [H]  n=1626 cos0.99 難-1.03", "s": 0.449, "f": 0}, {"x": 0.988, "y": -0.665, "c": "近傍", "n": "bloomin' feeling [H]  n=3272 cos0.99 難-0.66", "s": 0.904, "f": 0}, {"x": 0.986, "y": -0.776, "c": "近傍", "n": "リメンバーリメンバー [A]  n=1229 cos0.99 難-0.78", "s": 0.34, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5670102077378791}, {"a": 0, "b": 2, "w": 0.5507581215820296}, {"a": 0, "b": 3, "w": 0.683395429269875}, {"a": 0, "b": 4, "w": 0.49841057152654866}, {"a": 0, "b": 5, "w": 0.4145561520444093}, {"a": 0, "b": 6, "w": 0.2949059835177542}, {"a": 0, "b": 7, "w": 0.38868544847953834}, {"a": 0, "b": 8, "w": 0.24293587510821235}, {"a": 0, "b": 9, "w": 0.2658872420155153}, {"a": 0, "b": 10, "w": 0.5619242422336628}, {"a": 0, "b": 11, "w": 0.43056714080405756}, {"a": 0, "b": 12, "w": 4.4745762650677534e-11}, {"a": 0, "b": 13, "w": 0.17796941139236433}, {"a": 0, "b": 14, "w": 0.35596635081335215}, {"a": 0, "b": 15, "w": 0.23780501696066703}, {"a": 0, "b": 16, "w": 0.4580035631763054}, {"a": 0, "b": 17, "w": 0.3696362516362618}, {"a": 0, "b": 18, "w": 0.30040782492711815}, {"a": 0, "b": 19, "w": 0.07975670058540751}, {"a": 0, "b": 20, "w": 0.31053740624442017}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.985,hiX=1.001,loY=-1.079,hiY=-0.533;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
