<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Fantastic Merry-Go-Round [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.496, "c": "種", "n": "Fantastic Merry-Go-Round [A]  n=2071 cos1.00 難-0.50", "s": 0.582, "f": 0}, {"x": 0.995, "y": -0.653, "c": "近傍", "n": "CaptivAte～浄化～ [H]  n=2050 cos0.99 難-0.65", "s": 0.576, "f": 0}, {"x": 0.992, "y": -0.427, "c": "近傍", "n": "Double Loving Heart [A]  n=2700 cos0.99 難-0.43", "s": 0.758, "f": 0}, {"x": 0.995, "y": -0.272, "c": "近傍", "n": "ＵＬＴｉＭΛＴＥ [A]  n=2643 cos1.00 難-0.27", "s": 0.742, "f": 0}, {"x": 0.994, "y": -0.687, "c": "近傍", "n": "鏡像都市 [A]  n=898 cos0.99 難-0.69", "s": 0.252, "f": 0}, {"x": 0.992, "y": -0.329, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [A]  n=3561 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.572, "c": "近傍", "n": "ちゅ、多様性。 [A]  n=1725 cos0.99 難-0.57", "s": 0.484, "f": 0}, {"x": 0.991, "y": -0.342, "c": "近傍", "n": "かげぬい ～ Ver.BENIBOTAN ～ [A]  n=2678 cos0.99 難-0.34", "s": 0.752, "f": 0}, {"x": 0.99, "y": -0.363, "c": "近傍", "n": "Medicine of love [A]  n=2930 cos0.99 難-0.36", "s": 0.823, "f": 0}, {"x": 0.989, "y": -0.464, "c": "近傍", "n": "即席！脳直★ミュージックシステム [H]  n=2859 cos0.99 難-0.46", "s": 0.803, "f": 0}, {"x": 0.989, "y": -0.625, "c": "近傍", "n": "smile [H]  n=1928 cos0.99 難-0.62", "s": 0.541, "f": 0}, {"x": 0.992, "y": -0.25, "c": "近傍", "n": "Damage Per Second [A]  n=2881 cos0.99 難-0.25", "s": 0.809, "f": 0}, {"x": 0.988, "y": -0.545, "c": "近傍", "n": "センチメンタル・サマー [A]  n=1575 cos0.99 難-0.55", "s": 0.442, "f": 0}, {"x": 0.989, "y": -0.333, "c": "近傍", "n": "Sugar Drippin' [A]  n=2159 cos0.99 難-0.33", "s": 0.606, "f": 0}, {"x": 0.991, "y": -0.253, "c": "近傍", "n": "MOON [A]  n=3200 cos0.99 難-0.25", "s": 0.899, "f": 0}, {"x": 0.989, "y": -0.324, "c": "近傍", "n": "白露の風 [A]  n=3053 cos0.99 難-0.32", "s": 0.857, "f": 0}, {"x": 0.99, "y": -0.298, "c": "近傍", "n": "恋は白帯、サンシロー [A]  n=2796 cos0.99 難-0.30", "s": 0.785, "f": 0}, {"x": 0.988, "y": -0.379, "c": "近傍", "n": "My Sweet Bird? [A]  n=1522 cos0.99 難-0.38", "s": 0.427, "f": 0}, {"x": 0.99, "y": -0.297, "c": "近傍", "n": "beatchic☆仮面～好き、でいさせて～ [A]  n=2658 cos0.99 難-0.30", "s": 0.746, "f": 0}, {"x": 0.989, "y": -0.302, "c": "近傍", "n": "I know You know [A]  n=2734 cos0.99 難-0.30", "s": 0.768, "f": 0}, {"x": 0.99, "y": -0.27, "c": "近傍", "n": "Sweet Radar [A]  n=3510 cos0.99 難-0.27", "s": 0.986, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3673894696460014}, {"a": 0, "b": 2, "w": 0.13363303999908127}, {"a": 0, "b": 3, "w": 0.41572107950228876}, {"a": 0, "b": 4, "w": 0.304684155039481}, {"a": 0, "b": 5, "w": 0.2879543391178213}, {"a": 0, "b": 6, "w": 5.930744784166109e-11}, {"a": 0, "b": 7, "w": 0.20323711164451164}, {"a": 0, "b": 8, "w": 0.1970368622818458}, {"a": 0, "b": 9, "w": 0.15821544366274343}, {"a": 0, "b": 10, "w": 0.17101407324066054}, {"a": 0, "b": 11, "w": 0.26073146146739234}, {"a": 0, "b": 12, "w": 0.042945755021407295}, {"a": 0, "b": 13, "w": 0.09850090657893162}, {"a": 0, "b": 14, "w": 0.2391281380992213}, {"a": 0, "b": 15, "w": 0.1569790823358883}, {"a": 0, "b": 16, "w": 0.17407377307669847}, {"a": 0, "b": 17, "w": 0.11236348861903311}, {"a": 0, "b": 18, "w": 0.11661930062131276}, {"a": 0, "b": 19, "w": 0.09507179513761743}, {"a": 0, "b": 20, "w": 0.19379584655943383}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=-0.722,hiY=-0.215;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
