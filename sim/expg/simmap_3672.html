<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Dolphin Kick [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.344, "c": "種", "n": "Dolphin Kick [A]  n=234 cos1.00 難1.34", "s": 0.072, "f": 0}, {"x": 0.996, "y": 1.272, "c": "近傍", "n": "Flying Castle [A]  n=2138 cos1.00 難1.27", "s": 0.662, "f": 0}, {"x": 0.995, "y": 1.43, "c": "近傍", "n": "今宵、ロマンス横丁。 [A]  n=1354 cos0.99 難1.43", "s": 0.419, "f": 0}, {"x": 0.993, "y": 1.482, "c": "近傍", "n": "NITROUS CANNON [A]  n=3125 cos0.99 難1.48", "s": 0.967, "f": 0}, {"x": 0.992, "y": 1.258, "c": "近傍", "n": "Sol Cosine Job 2 [A]  n=3232 cos0.99 難1.26", "s": 1.0, "f": 0}, {"x": 0.993, "y": 1.18, "c": "近傍", "n": "L.F.O [A]  n=3203 cos0.99 難1.18", "s": 0.991, "f": 0}, {"x": 0.991, "y": 1.348, "c": "近傍", "n": "Arkadia [A]  n=2067 cos0.99 難1.35", "s": 0.64, "f": 0}, {"x": 0.992, "y": 1.163, "c": "近傍", "n": "From Human Blood [A]  n=979 cos0.99 難1.16", "s": 0.303, "f": 0}, {"x": 0.995, "y": 1.61, "c": "近傍", "n": "Cross Fire [A]  n=946 cos1.00 難1.61", "s": 0.293, "f": 0}, {"x": 0.991, "y": 1.183, "c": "近傍", "n": "スーパー戦湯ババンバーン [A]  n=2235 cos0.99 難1.18", "s": 0.692, "f": 0}, {"x": 0.991, "y": 1.172, "c": "近傍", "n": "Chaotoxin [A]  n=1942 cos0.99 難1.17", "s": 0.601, "f": 0}, {"x": 0.989, "y": 1.348, "c": "近傍", "n": "INHERITANCE [L]  n=586 cos0.99 難1.35", "s": 0.181, "f": 0}, {"x": 0.989, "y": 1.422, "c": "近傍", "n": "Illusionary Waterlily [A]  n=3018 cos0.99 難1.42", "s": 0.934, "f": 0}, {"x": 0.989, "y": 1.327, "c": "近傍", "n": "LOST TECHNOLOGIE [A]  n=3027 cos0.99 難1.33", "s": 0.937, "f": 0}, {"x": 0.988, "y": 1.344, "c": "近傍", "n": "24h Endurance Race [A]  n=1707 cos0.99 難1.34", "s": 0.528, "f": 0}, {"x": 0.992, "y": 1.087, "c": "近傍", "n": "Seven Times Four [A]  n=1327 cos0.99 難1.09", "s": 0.411, "f": 0}, {"x": 0.99, "y": 1.146, "c": "近傍", "n": "Million Dollar [A]  n=1558 cos0.99 難1.15", "s": 0.482, "f": 0}, {"x": 0.988, "y": 1.242, "c": "近傍", "n": "Xb10r [A]  n=1444 cos0.99 難1.24", "s": 0.447, "f": 0}, {"x": 0.988, "y": 1.307, "c": "近傍", "n": "Vitrum [A]  n=2538 cos0.99 難1.31", "s": 0.785, "f": 0}, {"x": 0.988, "y": 1.468, "c": "近傍", "n": "Slipstream [A]  n=2977 cos0.99 難1.47", "s": 0.921, "f": 0}, {"x": 0.991, "y": 1.603, "c": "近傍", "n": "Satellite Burst [A]  n=1275 cos0.99 難1.60", "s": 0.394, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5079541722007079}, {"a": 0, "b": 2, "w": 0.44816279975259066}, {"a": 0, "b": 3, "w": 0.38294927940209533}, {"a": 0, "b": 4, "w": 0.20569320495671362}, {"a": 0, "b": 5, "w": 0.18491764580529824}, {"a": 0, "b": 6, "w": 0.2274800709790965}, {"a": 0, "b": 7, "w": 0.32492099333731594}, {"a": 0, "b": 8, "w": 0.4731898428294343}, {"a": 0, "b": 9, "w": 0.21808186754853298}, {"a": 0, "b": 10, "w": 0.19074713369286778}, {"a": 0, "b": 11, "w": 0.2182761248654309}, {"a": 0, "b": 12, "w": 0.2257255733639577}, {"a": 0, "b": 13, "w": 0.17063196288308657}, {"a": 0, "b": 14, "w": 3.338629372962032e-11}, {"a": 0, "b": 15, "w": 0.22587327802904922}, {"a": 0, "b": 16, "w": 0.21241434920290936}, {"a": 0, "b": 17, "w": 0.1867363627193147}, {"a": 0, "b": 18, "w": 0.09140966868466427}, {"a": 0, "b": 19, "w": 0.19779146297033268}, {"a": 0, "b": 20, "w": 0.29407245036081986}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=1.046,hiY=1.651;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
