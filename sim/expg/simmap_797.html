<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Central Station [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.0, "c": "種", "n": "Central Station [A]  n=2872 cos1.00 難-0.00", "s": 0.822, "f": 0}, {"x": 0.996, "y": 0.114, "c": "近傍", "n": "Honey Trap [A]  n=3495 cos1.00 難0.11", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.254, "c": "近傍", "n": "Lift Us High [A]  n=2436 cos1.00 難-0.25", "s": 0.697, "f": 0}, {"x": 0.993, "y": -0.253, "c": "近傍", "n": "Round and Round [A]  n=2982 cos0.99 難-0.25", "s": 0.853, "f": 0}, {"x": 0.991, "y": -0.177, "c": "近傍", "n": "Frisk And Squeak [A]  n=1804 cos0.99 難-0.18", "s": 0.516, "f": 0}, {"x": 0.989, "y": 0.07, "c": "近傍", "n": "illuminate [A]  n=2896 cos0.99 難0.07", "s": 0.829, "f": 0}, {"x": 0.988, "y": 0.076, "c": "近傍", "n": "A Certified Rave Moment [A]  n=1119 cos0.99 難0.08", "s": 0.32, "f": 0}, {"x": 0.988, "y": 0.095, "c": "近傍", "n": "GRADIUS 2012 [A]  n=2995 cos0.99 難0.09", "s": 0.857, "f": 0}, {"x": 0.987, "y": 0.027, "c": "近傍", "n": "eRAseRmOToRpHAntOM [H]  n=2393 cos0.99 難0.03", "s": 0.685, "f": 0}, {"x": 0.987, "y": 0.059, "c": "近傍", "n": "Musik LoverZ [A]  n=3115 cos0.99 難0.06", "s": 0.891, "f": 0}, {"x": 0.987, "y": -0.233, "c": "近傍", "n": "HIGH VOLTAGE [A]  n=2735 cos0.99 難-0.23", "s": 0.783, "f": 0}, {"x": 0.991, "y": 0.42, "c": "近傍", "n": "Temple of Anubis [A]  n=3256 cos0.99 難0.42", "s": 0.932, "f": 0}, {"x": 0.991, "y": 0.457, "c": "近傍", "n": "Around the Future [A]  n=3146 cos0.99 難0.46", "s": 0.9, "f": 0}, {"x": 0.989, "y": -0.401, "c": "近傍", "n": "Explorer feat. ぷにぷに電機 [A]  n=2439 cos0.99 難-0.40", "s": 0.698, "f": 0}, {"x": 0.992, "y": 0.488, "c": "近傍", "n": "Abraxas [A]  n=3301 cos0.99 難0.49", "s": 0.944, "f": 0}, {"x": 0.985, "y": -0.122, "c": "近傍", "n": "BLACK JACKAL [A]  n=2466 cos0.99 難-0.12", "s": 0.706, "f": 0}, {"x": 0.985, "y": 0.212, "c": "近傍", "n": "Burning Flame [A]  n=2607 cos0.99 難0.21", "s": 0.746, "f": 0}, {"x": 0.985, "y": 0.204, "c": "近傍", "n": "OVER VOLTAGE [A]  n=1842 cos0.99 難0.20", "s": 0.527, "f": 0}, {"x": 0.984, "y": -0.129, "c": "近傍", "n": "SOLID STATE SQUAD [H]  n=2670 cos0.98 難-0.13", "s": 0.764, "f": 0}, {"x": 0.986, "y": -0.301, "c": "近傍", "n": "MOVE! (We Keep It Movin') [A]  n=1627 cos0.99 難-0.30", "s": 0.466, "f": 0}, {"x": 0.989, "y": -0.438, "c": "近傍", "n": "神っぽいな [A]  n=2136 cos0.99 難-0.44", "s": 0.611, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5254228258519157}, {"a": 0, "b": 2, "w": 0.4908006530156469}, {"a": 0, "b": 3, "w": 0.31412662514319123}, {"a": 0, "b": 4, "w": 0.3481017794739091}, {"a": 0, "b": 5, "w": 0.10364489799826004}, {"a": 0, "b": 6, "w": 3.957423277967109e-11}, {"a": 0, "b": 7, "w": 0.2046472795648665}, {"a": 0, "b": 8, "w": 0.20992679824175886}, {"a": 0, "b": 9, "w": 0.23662831528520933}, {"a": 0, "b": 10, "w": 0.23071837422094443}, {"a": 0, "b": 11, "w": 0.3541228207552116}, {"a": 0, "b": 12, "w": 0.3762243375504446}, {"a": 0, "b": 13, "w": 0.02793046969249946}, {"a": 0, "b": 14, "w": 0.34372535545077043}, {"a": 0, "b": 15, "w": 0.2013987545265088}, {"a": 0, "b": 16, "w": 0.010098999110729645}, {"a": 0, "b": 17, "w": 0.04711930075640536}, {"a": 0, "b": 18, "w": 0.14993842826850778}, {"a": 0, "b": 19, "w": 0.1424612157068884}, {"a": 0, "b": 20, "w": 0.20338050220457526}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.983,hiX=1.001,loY=-0.512,hiY=0.562;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
