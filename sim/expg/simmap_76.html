<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Last Message [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.154, "c": "種", "n": "Last Message [A]  n=2333 cos1.00 難-0.15", "s": 0.708, "f": 0}, {"x": 0.986, "y": -0.188, "c": "近傍", "n": "starmine [A]  n=3070 cos0.99 難-0.19", "s": 0.932, "f": 0}, {"x": 0.984, "y": -0.335, "c": "近傍", "n": "FEEL IT [H]  n=1810 cos0.98 難-0.33", "s": 0.549, "f": 0}, {"x": 0.982, "y": -0.108, "c": "近傍", "n": "METALLIC MIND [A]  n=2572 cos0.98 難-0.11", "s": 0.781, "f": 0}, {"x": 0.981, "y": -0.209, "c": "近傍", "n": "Raspberry Heart(English version) [A]  n=2295 cos0.98 難-0.21", "s": 0.697, "f": 0}, {"x": 0.98, "y": -0.215, "c": "近傍", "n": "Roots of my way! [A]  n=2449 cos0.98 難-0.22", "s": 0.743, "f": 0}, {"x": 0.979, "y": -0.246, "c": "近傍", "n": "MARIA (I believe... ) [A]  n=2083 cos0.98 難-0.25", "s": 0.632, "f": 0}, {"x": 0.979, "y": -0.314, "c": "近傍", "n": "Attitude [A]  n=2381 cos0.98 難-0.31", "s": 0.723, "f": 0}, {"x": 0.978, "y": -0.106, "c": "近傍", "n": "Broken My Heart [A]  n=2210 cos0.98 難-0.11", "s": 0.671, "f": 0}, {"x": 0.978, "y": -0.074, "c": "近傍", "n": "大桟橋 [A]  n=2652 cos0.98 難-0.07", "s": 0.805, "f": 0}, {"x": 0.979, "y": 0.085, "c": "近傍", "n": "I am [A]  n=2764 cos0.98 難0.08", "s": 0.839, "f": 0}, {"x": 0.977, "y": -0.133, "c": "近傍", "n": "BRIGHTNESS DARKNESS [A]  n=2245 cos0.98 難-0.13", "s": 0.682, "f": 0}, {"x": 0.977, "y": 0.026, "c": "近傍", "n": "Love Magic [A]  n=2550 cos0.98 難0.03", "s": 0.774, "f": 0}, {"x": 0.98, "y": -0.524, "c": "近傍", "n": "飴玉 [A]  n=1172 cos0.98 難-0.52", "s": 0.356, "f": 0}, {"x": 0.976, "y": -0.076, "c": "近傍", "n": "Narcissus At Oasis [H]  n=2411 cos0.98 難-0.08", "s": 0.732, "f": 0}, {"x": 0.975, "y": -0.134, "c": "近傍", "n": "Luv 2 Feel Your Body [A]  n=1932 cos0.98 難-0.13", "s": 0.587, "f": 0}, {"x": 0.975, "y": -0.126, "c": "近傍", "n": "tripping contact(teranoid&MC Natsack Remix) [H]  n=2288 cos0.97 難-0.13", "s": 0.695, "f": 0}, {"x": 0.975, "y": -0.14, "c": "近傍", "n": "EURO-ROMANCE [A]  n=3188 cos0.97 難-0.14", "s": 0.968, "f": 0}, {"x": 0.977, "y": -0.427, "c": "近傍", "n": "Double Loving Heart [A]  n=2700 cos0.98 難-0.43", "s": 0.82, "f": 0}, {"x": 0.975, "y": -0.125, "c": "近傍", "n": "ヒマワリ [A]  n=3294 cos0.97 難-0.12", "s": 1.0, "f": 0}, {"x": 0.975, "y": -0.041, "c": "近傍", "n": "Cradle [A]  n=2418 cos0.97 難-0.04", "s": 0.734, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2641581580793262}, {"a": 0, "b": 2, "w": 0.23748934499392527}, {"a": 0, "b": 3, "w": 0.19585870326653898}, {"a": 0, "b": 4, "w": 0.13561280478916649}, {"a": 0, "b": 5, "w": 0.15186096199701593}, {"a": 0, "b": 6, "w": 0.14462160789469425}, {"a": 0, "b": 7, "w": 0.017997329642862603}, {"a": 0, "b": 8, "w": 0.11330482984046408}, {"a": 0, "b": 9, "w": 0.1199887672102794}, {"a": 0, "b": 10, "w": 0.09552657726044944}, {"a": 0, "b": 11, "w": 0.09870612913852106}, {"a": 0, "b": 12, "w": 0.10471509016512914}, {"a": 0, "b": 13, "w": 0.09812801902659019}, {"a": 0, "b": 14, "w": 0.041207685220479795}, {"a": 0, "b": 15, "w": 0.05349328661060859}, {"a": 0, "b": 16, "w": 0.05468433986730359}, {"a": 0, "b": 17, "w": 0.05587508649651918}, {"a": 0, "b": 18, "w": 4.3084202872023525e-11}, {"a": 0, "b": 19, "w": 0.05171403748085723}, {"a": 0, "b": 20, "w": 0.016675498234278385}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=-0.573,hiY=0.133;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
