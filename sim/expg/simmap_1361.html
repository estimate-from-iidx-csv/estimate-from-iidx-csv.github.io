<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">GENE [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.734, "c": "種", "n": "GENE [H]  n=2177 cos1.00 難-0.73", "s": 0.892, "f": 0}, {"x": 0.995, "y": -0.849, "c": "近傍", "n": "satellite020712 from \"CODED ARMS\" [H]  n=1692 cos1.00 難-0.85", "s": 0.693, "f": 0}, {"x": 0.993, "y": -0.64, "c": "近傍", "n": "CaptivAte～誓い～ [H]  n=2183 cos0.99 難-0.64", "s": 0.894, "f": 0}, {"x": 0.993, "y": -0.607, "c": "近傍", "n": "Show Time [A]  n=651 cos0.99 難-0.61", "s": 0.267, "f": 0}, {"x": 0.993, "y": -0.883, "c": "近傍", "n": "M4K3 1T B0UNC3 [H]  n=2206 cos0.99 難-0.88", "s": 0.904, "f": 0}, {"x": 0.992, "y": -0.746, "c": "近傍", "n": "lower world [H]  n=1412 cos0.99 難-0.75", "s": 0.578, "f": 0}, {"x": 0.993, "y": -0.576, "c": "近傍", "n": "Sphere [H]  n=1978 cos0.99 難-0.58", "s": 0.81, "f": 0}, {"x": 0.991, "y": -0.77, "c": "近傍", "n": "唱 [A]  n=1528 cos0.99 難-0.77", "s": 0.626, "f": 0}, {"x": 0.992, "y": -0.875, "c": "近傍", "n": "Quickening [H]  n=1506 cos0.99 難-0.87", "s": 0.617, "f": 0}, {"x": 0.993, "y": -0.552, "c": "近傍", "n": "もんめためたもん [A]  n=1101 cos0.99 難-0.55", "s": 0.451, "f": 0}, {"x": 0.993, "y": -0.958, "c": "近傍", "n": "Caterpillar [H]  n=2200 cos0.99 難-0.96", "s": 0.901, "f": 0}, {"x": 0.991, "y": -0.803, "c": "近傍", "n": "LAB [H]  n=1740 cos0.99 難-0.80", "s": 0.713, "f": 0}, {"x": 0.991, "y": -0.643, "c": "近傍", "n": "B4U(BEMANI FOR YOU MIX) [H]  n=2441 cos0.99 難-0.64", "s": 1.0, "f": 0}, {"x": 0.992, "y": -0.559, "c": "近傍", "n": "ギャ・ギャ・ギャ・ギャラクシー！ [A]  n=1116 cos0.99 難-0.56", "s": 0.457, "f": 0}, {"x": 0.991, "y": -0.84, "c": "近傍", "n": "Programmed World [H]  n=2074 cos0.99 難-0.84", "s": 0.85, "f": 0}, {"x": 0.991, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos0.99 難-0.81", "s": 0.721, "f": 0}, {"x": 0.991, "y": -0.861, "c": "近傍", "n": "DRUNK MONKY [H]  n=1661 cos0.99 難-0.86", "s": 0.68, "f": 0}, {"x": 0.99, "y": -0.693, "c": "近傍", "n": "THE DAY OF JUBILATIONS [H]  n=2127 cos0.99 難-0.69", "s": 0.871, "f": 0}, {"x": 0.991, "y": -0.916, "c": "近傍", "n": "PUNISHER [H]  n=2321 cos0.99 難-0.92", "s": 0.951, "f": 0}, {"x": 0.991, "y": -0.582, "c": "近傍", "n": "BEMANI PRO LEAGUE Theme [A]  n=2279 cos0.99 難-0.58", "s": 0.934, "f": 0}, {"x": 0.991, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.99 難-0.92", "s": 0.794, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4178759804058373}, {"a": 0, "b": 2, "w": 0.30797818467104}, {"a": 0, "b": 3, "w": 0.3542777174379813}, {"a": 0, "b": 4, "w": 0.3484717940011507}, {"a": 0, "b": 5, "w": 0.2001229135385204}, {"a": 0, "b": 6, "w": 0.33200571646760824}, {"a": 0, "b": 7, "w": 0.0750360908682478}, {"a": 0, "b": 8, "w": 0.11547505512435707}, {"a": 0, "b": 9, "w": 0.34196802297716866}, {"a": 0, "b": 10, "w": 0.36165344192901283}, {"a": 0, "b": 11, "w": 0.25386883724806375}, {"a": 0, "b": 12, "w": 0.25837232602473104}, {"a": 0, "b": 13, "w": 0.29776219539223003}, {"a": 0, "b": 14, "w": 0.13584367537356612}, {"a": 0, "b": 15, "w": 0.12165062123802262}, {"a": 0, "b": 16, "w": 0.1722592676606639}, {"a": 0, "b": 17, "w": 0.1332010476275195}, {"a": 0, "b": 18, "w": 0.2829410004381103}, {"a": 0, "b": 19, "w": 5.242428713359004e-11}, {"a": 0, "b": 20, "w": 0.2658889664695848}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.991,hiY=-0.520;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
