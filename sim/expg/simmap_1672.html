<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">駅猫のワルツ [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.243, "c": "種", "n": "駅猫のワルツ [H]  n=2701 cos1.00 難-0.24", "s": 0.726, "f": 0}, {"x": 0.986, "y": -0.283, "c": "近傍", "n": "rage against usual [H]  n=2635 cos0.99 難-0.28", "s": 0.709, "f": 0}, {"x": 0.985, "y": -0.183, "c": "近傍", "n": "fffff [H]  n=3217 cos0.99 難-0.18", "s": 0.865, "f": 0}, {"x": 0.983, "y": -0.279, "c": "近傍", "n": "天空の夜明け [H]  n=3602 cos0.98 難-0.28", "s": 0.969, "f": 0}, {"x": 0.986, "y": -0.545, "c": "近傍", "n": "Thor's Hammer [H]  n=3181 cos0.99 難-0.55", "s": 0.856, "f": 0}, {"x": 0.986, "y": -0.659, "c": "近傍", "n": "少年は空を辿る [H]  n=2729 cos0.99 難-0.66", "s": 0.734, "f": 0}, {"x": 0.979, "y": -0.082, "c": "近傍", "n": "Sephirot [A]  n=3051 cos0.98 難-0.08", "s": 0.821, "f": 0}, {"x": 0.986, "y": -0.732, "c": "近傍", "n": "snow storm [H]  n=2998 cos0.99 難-0.73", "s": 0.806, "f": 0}, {"x": 0.977, "y": -0.206, "c": "近傍", "n": "Somnidiscotheque [H]  n=1643 cos0.98 難-0.21", "s": 0.442, "f": 0}, {"x": 0.975, "y": -0.156, "c": "近傍", "n": "1st Samurai [H]  n=2306 cos0.97 難-0.16", "s": 0.62, "f": 0}, {"x": 0.979, "y": 0.193, "c": "近傍", "n": "BLUE STRAGGLER [A]  n=2968 cos0.98 難0.19", "s": 0.798, "f": 0}, {"x": 0.981, "y": 0.291, "c": "近傍", "n": "Cyber True Color [A]  n=3039 cos0.98 難0.29", "s": 0.817, "f": 0}, {"x": 0.975, "y": -0.04, "c": "近傍", "n": "お米の美味しい炊き方、そしてお米を食べることによるその効果。 [A]  n=3075 cos0.97 難-0.04", "s": 0.827, "f": 0}, {"x": 0.973, "y": -0.249, "c": "近傍", "n": "Dances with Snow Fairies [H]  n=2892 cos0.97 難-0.25", "s": 0.778, "f": 0}, {"x": 0.977, "y": 0.205, "c": "近傍", "n": "嘆きの樹 [H]  n=3718 cos0.98 難0.20", "s": 1.0, "f": 0}, {"x": 0.975, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.98 難-0.63", "s": 0.439, "f": 0}, {"x": 0.973, "y": 0.032, "c": "近傍", "n": "廿 [A]  n=3164 cos0.97 難0.03", "s": 0.851, "f": 0}, {"x": 0.974, "y": 0.077, "c": "近傍", "n": "Change Yourself [A]  n=3044 cos0.97 難0.08", "s": 0.819, "f": 0}, {"x": 0.972, "y": -0.324, "c": "近傍", "n": "Howling [A]  n=2820 cos0.97 難-0.32", "s": 0.758, "f": 0}, {"x": 0.975, "y": -0.654, "c": "近傍", "n": "DROP [H]  n=1809 cos0.98 難-0.65", "s": 0.487, "f": 0}, {"x": 0.974, "y": -0.622, "c": "近傍", "n": "Colors (radio edit) [H]  n=2374 cos0.97 難-0.62", "s": 0.639, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.326137237329469}, {"a": 0, "b": 2, "w": 0.35512566681768165}, {"a": 0, "b": 3, "w": 0.2793261970658959}, {"a": 0, "b": 4, "w": 0.34099588249399604}, {"a": 0, "b": 5, "w": 0.3164667005174394}, {"a": 0, "b": 6, "w": 0.22453056744765088}, {"a": 0, "b": 7, "w": 0.24676860831381864}, {"a": 0, "b": 8, "w": 0.19464193920579398}, {"a": 0, "b": 9, "w": 0.17424123155865978}, {"a": 0, "b": 10, "w": 0.25046224011221097}, {"a": 0, "b": 11, "w": 0.30134024947523363}, {"a": 0, "b": 12, "w": 0.18834686884477359}, {"a": 0, "b": 13, "w": 0.07557098390122152}, {"a": 0, "b": 14, "w": 0.2189470708610527}, {"a": 0, "b": 15, "w": 0.08350167846742385}, {"a": 0, "b": 16, "w": 0.13785026807469292}, {"a": 0, "b": 17, "w": 0.148318871692248}, {"a": 0, "b": 18, "w": 0.11827118537433534}, {"a": 0, "b": 19, "w": 0.0929825696201031}, {"a": 0, "b": 20, "w": 3.226663380928585e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.970,hiX=1.002,loY=-0.813,hiY=0.373;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
