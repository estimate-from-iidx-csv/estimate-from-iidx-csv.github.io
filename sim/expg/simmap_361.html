<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">HYENA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.963, "c": "種", "n": "HYENA [H]  n=2377 cos1.00 難-0.96", "s": 0.918, "f": 0}, {"x": 0.999, "y": -1.04, "c": "近傍", "n": "Trill auf G [H]  n=1795 cos1.00 難-1.04", "s": 0.693, "f": 0}, {"x": 0.996, "y": -0.985, "c": "近傍", "n": "MAX 360 [H]  n=770 cos1.00 難-0.99", "s": 0.297, "f": 0}, {"x": 0.996, "y": -0.974, "c": "近傍", "n": "Ambivalent Vermilia [H]  n=737 cos1.00 難-0.97", "s": 0.285, "f": 0}, {"x": 0.996, "y": -0.862, "c": "近傍", "n": "Light and Cyber… [H]  n=2221 cos1.00 難-0.86", "s": 0.858, "f": 0}, {"x": 0.996, "y": -0.814, "c": "近傍", "n": "Broken Sword [H]  n=2589 cos1.00 難-0.81", "s": 1.0, "f": 0}, {"x": 0.994, "y": -1.03, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1847 cos0.99 難-1.03", "s": 0.713, "f": 0}, {"x": 0.995, "y": -0.866, "c": "近傍", "n": "SpaceLand☆TOYBOX [H]  n=2022 cos0.99 難-0.87", "s": 0.781, "f": 0}, {"x": 0.997, "y": -1.135, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1716 cos1.00 難-1.13", "s": 0.663, "f": 0}, {"x": 0.995, "y": -0.813, "c": "近傍", "n": "end of world [H]  n=1760 cos1.00 難-0.81", "s": 0.68, "f": 0}, {"x": 0.993, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.99 難-0.92", "s": 0.749, "f": 0}, {"x": 0.993, "y": -0.962, "c": "近傍", "n": "Artist [H]  n=1573 cos0.99 難-0.96", "s": 0.608, "f": 0}, {"x": 0.994, "y": -0.821, "c": "近傍", "n": "D.C.fish [H]  n=1811 cos0.99 難-0.82", "s": 0.699, "f": 0}, {"x": 0.992, "y": -0.907, "c": "近傍", "n": "Painful Fate [H]  n=1813 cos0.99 難-0.91", "s": 0.7, "f": 0}, {"x": 0.994, "y": -0.801, "c": "近傍", "n": "Konzert V [H]  n=2416 cos0.99 難-0.80", "s": 0.933, "f": 0}, {"x": 0.993, "y": -0.84, "c": "近傍", "n": "Programmed World [H]  n=2074 cos0.99 難-0.84", "s": 0.801, "f": 0}, {"x": 0.992, "y": -0.916, "c": "近傍", "n": "∀ [H]  n=2291 cos0.99 難-0.92", "s": 0.885, "f": 0}, {"x": 0.992, "y": -0.957, "c": "近傍", "n": "MEGAERA [H]  n=1639 cos0.99 難-0.96", "s": 0.633, "f": 0}, {"x": 0.992, "y": -0.864, "c": "近傍", "n": "Illusionary Waterlily [H]  n=1856 cos0.99 難-0.86", "s": 0.717, "f": 0}, {"x": 0.992, "y": -0.861, "c": "近傍", "n": "spiral galaxy [H]  n=1849 cos0.99 難-0.86", "s": 0.714, "f": 0}, {"x": 0.993, "y": -1.104, "c": "近傍", "n": "閠槞彁の願い [H]  n=1555 cos0.99 難-1.10", "s": 0.601, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6647011287573958}, {"a": 0, "b": 2, "w": 0.3524670856294341}, {"a": 0, "b": 3, "w": 0.3384300774381651}, {"a": 0, "b": 4, "w": 0.4150094162508382}, {"a": 0, "b": 5, "w": 0.4325197830027089}, {"a": 0, "b": 6, "w": 0.024363671088715733}, {"a": 0, "b": 7, "w": 0.15080469532610496}, {"a": 0, "b": 8, "w": 0.492386098693232}, {"a": 0, "b": 9, "w": 0.17936583126688133}, {"a": 0, "b": 10, "w": 0.2376747540155908}, {"a": 0, "b": 11, "w": 0.2302544823939905}, {"a": 0, "b": 12, "w": 0.13490772546267282}, {"a": 0, "b": 13, "w": 0.02039737644552342}, {"a": 0, "b": 14, "w": 0.3339716272565475}, {"a": 0, "b": 15, "w": 0.0984337252838049}, {"a": 0, "b": 16, "w": 0.21545071720327125}, {"a": 0, "b": 17, "w": 5.952827120125903e-11}, {"a": 0, "b": 18, "w": 0.19608826539240531}, {"a": 0, "b": 19, "w": 0.0061531913858132725}, {"a": 0, "b": 20, "w": 0.14155271112725754}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.991,hiX=1.001,loY=-1.161,hiY=-0.774;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
