<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Divine Heaven [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.395, "c": "種", "n": "Divine Heaven [A]  n=1986 cos1.00 難0.39", "s": 0.564, "f": 0}, {"x": 0.994, "y": 0.378, "c": "近傍", "n": "2 tribe 4 K [A]  n=3256 cos0.99 難0.38", "s": 0.925, "f": 0}, {"x": 0.994, "y": 0.322, "c": "近傍", "n": "HEISEI [A]  n=3346 cos0.99 難0.32", "s": 0.951, "f": 0}, {"x": 0.994, "y": 0.291, "c": "近傍", "n": "Constellation [A]  n=1130 cos0.99 難0.29", "s": 0.321, "f": 0}, {"x": 0.994, "y": 0.272, "c": "近傍", "n": "Ember Lights [A]  n=3412 cos0.99 難0.27", "s": 0.969, "f": 0}, {"x": 0.994, "y": 0.286, "c": "近傍", "n": "Nocturnal 2097 [A]  n=2296 cos0.99 難0.29", "s": 0.652, "f": 0}, {"x": 0.993, "y": 0.33, "c": "近傍", "n": "Wonder Girl feat. Kanae Asaba [A]  n=3417 cos0.99 難0.33", "s": 0.971, "f": 0}, {"x": 0.993, "y": 0.482, "c": "近傍", "n": "Advent Infamous [A]  n=2552 cos0.99 難0.48", "s": 0.725, "f": 0}, {"x": 0.992, "y": 0.374, "c": "近傍", "n": "Get On Your Feet [A]  n=1756 cos0.99 難0.37", "s": 0.499, "f": 0}, {"x": 0.992, "y": 0.316, "c": "近傍", "n": "DREAM OF SPACE UFO ABDUCTION [A]  n=2429 cos0.99 難0.32", "s": 0.69, "f": 0}, {"x": 0.992, "y": 0.389, "c": "近傍", "n": "ANDROMEDA [A]  n=3487 cos0.99 難0.39", "s": 0.991, "f": 0}, {"x": 0.992, "y": 0.488, "c": "近傍", "n": "Primitive Vibes [A]  n=3443 cos0.99 難0.49", "s": 0.978, "f": 0}, {"x": 0.992, "y": 0.429, "c": "近傍", "n": "Moving on [A]  n=3011 cos0.99 難0.43", "s": 0.855, "f": 0}, {"x": 0.992, "y": 0.317, "c": "近傍", "n": "GIGA VIOLATE [A]  n=2878 cos0.99 難0.32", "s": 0.818, "f": 0}, {"x": 0.992, "y": 0.283, "c": "近傍", "n": "Synergy For Angels [A]  n=3484 cos0.99 難0.28", "s": 0.99, "f": 0}, {"x": 0.993, "y": 0.195, "c": "近傍", "n": "Time Distortion pt.2(IIDX Edit) [A]  n=1814 cos0.99 難0.19", "s": 0.515, "f": 0}, {"x": 0.992, "y": 0.236, "c": "近傍", "n": "STARLIGHT JUNCTION [L]  n=1129 cos0.99 難0.24", "s": 0.321, "f": 0}, {"x": 0.99, "y": 0.411, "c": "近傍", "n": "Flash Back 90's [L]  n=1984 cos0.99 難0.41", "s": 0.564, "f": 0}, {"x": 0.992, "y": 0.593, "c": "近傍", "n": "XENON II ～TOMOYUKIの野望～ [A]  n=3023 cos0.99 難0.59", "s": 0.859, "f": 0}, {"x": 0.993, "y": 0.152, "c": "近傍", "n": "n'pa pa BBQ [A]  n=3520 cos0.99 難0.15", "s": 1.0, "f": 0}, {"x": 0.99, "y": 0.46, "c": "近傍", "n": "PHASE SHIFT MANEUVER [A]  n=2732 cos0.99 難0.46", "s": 0.776, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2764494264615802}, {"a": 0, "b": 2, "w": 0.19943167337191914}, {"a": 0, "b": 3, "w": 0.3011559464949296}, {"a": 0, "b": 4, "w": 0.23852584561366796}, {"a": 0, "b": 5, "w": 0.32799770752116675}, {"a": 0, "b": 6, "w": 0.26547372468813113}, {"a": 0, "b": 7, "w": 0.3082677486646199}, {"a": 0, "b": 8, "w": 0.2849495196038787}, {"a": 0, "b": 9, "w": 0.1384204068662639}, {"a": 0, "b": 10, "w": 4.5996095821010385e-11}, {"a": 0, "b": 11, "w": 0.2414196837215089}, {"a": 0, "b": 12, "w": 0.16304325419380916}, {"a": 0, "b": 13, "w": 0.220406761598964}, {"a": 0, "b": 14, "w": 0.14031748429880586}, {"a": 0, "b": 15, "w": 0.28675117108887715}, {"a": 0, "b": 16, "w": 0.24640506040327148}, {"a": 0, "b": 17, "w": 0.18799366192558042}, {"a": 0, "b": 18, "w": 0.2602513974868239}, {"a": 0, "b": 19, "w": 0.298161745494256}, {"a": 0, "b": 20, "w": 0.14993122589042673}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=0.116,hiY=0.629;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
