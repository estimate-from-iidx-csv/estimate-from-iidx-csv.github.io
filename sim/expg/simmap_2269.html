<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">オールトの雲 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.273, "c": "種", "n": "オールトの雲 [A]  n=2469 cos1.00 難0.27", "s": 0.673, "f": 0}, {"x": 0.994, "y": 0.357, "c": "近傍", "n": "Yum Yum Jelly [A]  n=3329 cos0.99 難0.36", "s": 0.907, "f": 0}, {"x": 0.992, "y": 0.292, "c": "近傍", "n": "命の標本 [A]  n=3120 cos0.99 難0.29", "s": 0.85, "f": 0}, {"x": 0.993, "y": 0.406, "c": "近傍", "n": "Devilz Sacrifice -贖罪の羊- [A]  n=3248 cos0.99 難0.41", "s": 0.885, "f": 0}, {"x": 0.993, "y": 0.4, "c": "近傍", "n": "忍恋花 [A]  n=3296 cos0.99 難0.40", "s": 0.898, "f": 0}, {"x": 0.992, "y": 0.264, "c": "近傍", "n": "Marie Antoinette [A]  n=1917 cos0.99 難0.26", "s": 0.522, "f": 0}, {"x": 0.992, "y": 0.376, "c": "近傍", "n": "Queen Kaguya [A]  n=2896 cos0.99 難0.38", "s": 0.789, "f": 0}, {"x": 0.992, "y": 0.313, "c": "近傍", "n": "squall [A]  n=1403 cos0.99 難0.31", "s": 0.382, "f": 0}, {"x": 0.991, "y": 0.219, "c": "近傍", "n": "覚悟せよ！エンタンメ～ン ～より身の切り売り自暴自棄版～ [A]  n=1129 cos0.99 難0.22", "s": 0.308, "f": 0}, {"x": 0.993, "y": 0.037, "c": "近傍", "n": "into the battlefield [A]  n=2993 cos0.99 難0.04", "s": 0.815, "f": 0}, {"x": 0.991, "y": 0.312, "c": "近傍", "n": "Little Little Princess [A]  n=3439 cos0.99 難0.31", "s": 0.937, "f": 0}, {"x": 0.991, "y": 0.202, "c": "近傍", "n": "きみのせかい [A]  n=1142 cos0.99 難0.20", "s": 0.311, "f": 0}, {"x": 0.995, "y": -0.049, "c": "近傍", "n": "3y3s [H]  n=3671 cos0.99 難-0.05", "s": 1.0, "f": 0}, {"x": 0.991, "y": 0.231, "c": "近傍", "n": "ファイナルレター [A]  n=1374 cos0.99 難0.23", "s": 0.374, "f": 0}, {"x": 0.991, "y": 0.112, "c": "近傍", "n": "NEW SENSATION -もう、あなたしか見えない- [A]  n=3589 cos0.99 難0.11", "s": 0.978, "f": 0}, {"x": 0.991, "y": 0.488, "c": "近傍", "n": "Cleopatrysm [A]  n=3251 cos0.99 難0.49", "s": 0.886, "f": 0}, {"x": 0.993, "y": -0.045, "c": "近傍", "n": "Break Stasis [A]  n=3091 cos0.99 難-0.05", "s": 0.842, "f": 0}, {"x": 0.99, "y": 0.391, "c": "近傍", "n": "華蝶風雪 [A]  n=3529 cos0.99 難0.39", "s": 0.961, "f": 0}, {"x": 0.99, "y": 0.105, "c": "近傍", "n": "This is Love [A]  n=2478 cos0.99 難0.10", "s": 0.675, "f": 0}, {"x": 0.989, "y": 0.311, "c": "近傍", "n": "lowercase lifetime [A]  n=1449 cos0.99 難0.31", "s": 0.395, "f": 0}, {"x": 0.991, "y": -0.043, "c": "近傍", "n": "Miracle 5ympho X [A]  n=3625 cos0.99 難-0.04", "s": 0.987, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3540722123979657}, {"a": 0, "b": 2, "w": 0.26197307277211335}, {"a": 0, "b": 3, "w": 0.21807551775851586}, {"a": 0, "b": 4, "w": 0.1699406457743401}, {"a": 0, "b": 5, "w": 0.13823669974424269}, {"a": 0, "b": 6, "w": 0.2711315536705844}, {"a": 0, "b": 7, "w": 0.13858724217766694}, {"a": 0, "b": 8, "w": 0.22740875109386105}, {"a": 0, "b": 9, "w": 4.771261163938334e-11}, {"a": 0, "b": 10, "w": 0.20890516003610715}, {"a": 0, "b": 11, "w": 0.22218411768480917}, {"a": 0, "b": 12, "w": 0.38706446373053816}, {"a": 0, "b": 13, "w": 0.09616073496104194}, {"a": 0, "b": 14, "w": 0.20425080907421556}, {"a": 0, "b": 15, "w": 0.12692189758261152}, {"a": 0, "b": 16, "w": 0.07065829123966527}, {"a": 0, "b": 17, "w": 0.15840375582396493}, {"a": 0, "b": 18, "w": 0.1125934492029469}, {"a": 0, "b": 19, "w": 0.1503073202292966}, {"a": 0, "b": 20, "w": 0.2307387708541746}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.988,hiX=1.001,loY=-0.092,hiY=0.531;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
