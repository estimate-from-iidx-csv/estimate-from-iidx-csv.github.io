<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">金野火織の金色提言 [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.684, "c": "種", "n": "金野火織の金色提言 [A]  n=2860 cos1.00 難1.68", "s": 0.831, "f": 0}, {"x": 0.992, "y": 1.658, "c": "近傍", "n": "Antigravity [A]  n=2887 cos0.99 難1.66", "s": 0.839, "f": 0}, {"x": 0.989, "y": 1.684, "c": "近傍", "n": "255 [A]  n=3006 cos0.99 難1.68", "s": 0.874, "f": 0}, {"x": 0.992, "y": 1.439, "c": "近傍", "n": "Monopole. [A]  n=3172 cos0.99 難1.44", "s": 0.922, "f": 0}, {"x": 0.988, "y": 1.782, "c": "近傍", "n": "voltississimo [A]  n=2579 cos0.99 難1.78", "s": 0.749, "f": 0}, {"x": 0.986, "y": 1.638, "c": "近傍", "n": "東京神話 [A]  n=3125 cos0.99 難1.64", "s": 0.908, "f": 0}, {"x": 0.989, "y": 1.919, "c": "近傍", "n": "Dans la nuit de l'eternite [A]  n=2214 cos0.99 難1.92", "s": 0.643, "f": 0}, {"x": 0.986, "y": 1.615, "c": "近傍", "n": "Marie Antoinette [L]  n=1728 cos0.99 難1.61", "s": 0.502, "f": 0}, {"x": 0.984, "y": 1.724, "c": "近傍", "n": "君のハートにロックオン [L]  n=1864 cos0.98 難1.72", "s": 0.542, "f": 0}, {"x": 0.984, "y": 1.61, "c": "近傍", "n": "ピアノ協奏曲第1番”蠍火” (BlackY Remix) [A]  n=2470 cos0.98 難1.61", "s": 0.718, "f": 0}, {"x": 0.983, "y": 1.602, "c": "近傍", "n": "The Rebellion of Sequencer [A]  n=2716 cos0.98 難1.60", "s": 0.789, "f": 0}, {"x": 0.983, "y": 1.569, "c": "近傍", "n": "Empire of Fury [A]  n=2430 cos0.98 難1.57", "s": 0.706, "f": 0}, {"x": 0.987, "y": 1.377, "c": "近傍", "n": "One for All [A]  n=2201 cos0.99 難1.38", "s": 0.64, "f": 0}, {"x": 0.99, "y": 1.307, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2995 cos0.99 難1.31", "s": 0.87, "f": 0}, {"x": 0.986, "y": 1.404, "c": "近傍", "n": "rommmo [A]  n=2579 cos0.99 難1.40", "s": 0.749, "f": 0}, {"x": 0.984, "y": 1.512, "c": "近傍", "n": "ALTERNATOR [A]  n=2278 cos0.98 難1.51", "s": 0.662, "f": 0}, {"x": 0.982, "y": 1.523, "c": "近傍", "n": "Triple Counter [A]  n=3126 cos0.98 難1.52", "s": 0.908, "f": 0}, {"x": 0.981, "y": 1.725, "c": "近傍", "n": "Blue Spring Express [A]  n=2854 cos0.98 難1.73", "s": 0.829, "f": 0}, {"x": 0.988, "y": 1.288, "c": "近傍", "n": "DOMINION [A]  n=3441 cos0.99 難1.29", "s": 1.0, "f": 0}, {"x": 0.981, "y": 1.812, "c": "近傍", "n": "Vulnerability [A]  n=1144 cos0.98 難1.81", "s": 0.332, "f": 0}, {"x": 0.984, "y": 1.368, "c": "近傍", "n": "Lightspeed [A]  n=1140 cos0.98 難1.37", "s": 0.331, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.49131221848439965}, {"a": 0, "b": 2, "w": 0.27070756277591357}, {"a": 0, "b": 3, "w": 0.4911005254878944}, {"a": 0, "b": 4, "w": 0.16301167732259503}, {"a": 0, "b": 5, "w": 0.3581493486535956}, {"a": 0, "b": 6, "w": 0.20726459688726784}, {"a": 0, "b": 7, "w": 0.3351617092655358}, {"a": 0, "b": 8, "w": 0.3053998244814147}, {"a": 0, "b": 9, "w": 0.15695042510724555}, {"a": 0, "b": 10, "w": 0.23350774509878913}, {"a": 0, "b": 11, "w": 0.2673994208619238}, {"a": 0, "b": 12, "w": 0.29847659310306285}, {"a": 0, "b": 13, "w": 0.42711083977418207}, {"a": 0, "b": 14, "w": 0.32563263023616973}, {"a": 0, "b": 15, "w": 0.14274874783660152}, {"a": 0, "b": 16, "w": 2.7538082925104845e-11}, {"a": 0, "b": 17, "w": 0.1475879455543475}, {"a": 0, "b": 18, "w": 0.40326187083685194}, {"a": 0, "b": 19, "w": 0.0076849390553442865}, {"a": 0, "b": 20, "w": 0.3047813388724564}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=1.237,hiY=1.969;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
