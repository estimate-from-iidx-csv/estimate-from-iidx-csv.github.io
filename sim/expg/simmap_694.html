<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">深淵に捧ぐレクイエム [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.428, "c": "種", "n": "深淵に捧ぐレクイエム [H]  n=1516 cos1.00 難-1.43", "s": 0.446, "f": 0}, {"x": 0.959, "y": -1.193, "c": "近傍", "n": "烽火連天の刃 [H]  n=1238 cos0.96 難-1.19", "s": 0.364, "f": 0}, {"x": 0.962, "y": -1.015, "c": "近傍", "n": "EROICA [H]  n=2233 cos0.96 難-1.01", "s": 0.657, "f": 0}, {"x": 0.961, "y": -0.966, "c": "近傍", "n": "栄冠のカンパネラ [H]  n=1241 cos0.96 難-0.97", "s": 0.365, "f": 0}, {"x": 0.959, "y": -0.89, "c": "近傍", "n": "Kailua [H]  n=2458 cos0.96 難-0.89", "s": 0.723, "f": 0}, {"x": 0.954, "y": -1.794, "c": "近傍", "n": "of the first magnitude [H]  n=845 cos0.95 難-1.79", "s": 0.248, "f": 0}, {"x": 0.95, "y": -1.249, "c": "近傍", "n": "NZM [H]  n=1595 cos0.95 難-1.25", "s": 0.469, "f": 0}, {"x": 0.949, "y": -1.638, "c": "近傍", "n": "神のシナリオ [H]  n=663 cos0.95 難-1.64", "s": 0.195, "f": 0}, {"x": 0.952, "y": -1.034, "c": "近傍", "n": "Acid Pumper [H]  n=2059 cos0.95 難-1.03", "s": 0.605, "f": 0}, {"x": 0.964, "y": -0.538, "c": "近傍", "n": "Elisha [H]  n=3401 cos0.96 難-0.54", "s": 1.0, "f": 0}, {"x": 0.946, "y": -0.939, "c": "近傍", "n": "MIRACLE MEETS [H]  n=2820 cos0.95 難-0.94", "s": 0.829, "f": 0}, {"x": 0.938, "y": -1.293, "c": "近傍", "n": "Summerlights(IIDX Edition) [H]  n=1468 cos0.94 難-1.29", "s": 0.432, "f": 0}, {"x": 0.938, "y": -1.207, "c": "近傍", "n": "Megalara Garuda [H]  n=1484 cos0.94 難-1.21", "s": 0.436, "f": 0}, {"x": 0.938, "y": -1.673, "c": "近傍", "n": "Zenith [H]  n=749 cos0.94 難-1.67", "s": 0.22, "f": 0}, {"x": 0.939, "y": -1.894, "c": "近傍", "n": "Pout [H]  n=600 cos0.94 難-1.89", "s": 0.176, "f": 0}, {"x": 0.963, "y": -0.389, "c": "近傍", "n": "DIAMOND CROSSING [H]  n=3064 cos0.96 難-0.39", "s": 0.901, "f": 0}, {"x": 0.931, "y": -1.516, "c": "近傍", "n": "City Never Sleeps (IIDX Edition) [H]  n=1065 cos0.93 難-1.52", "s": 0.313, "f": 0}, {"x": 0.93, "y": -1.353, "c": "近傍", "n": "TRIUMPH [H]  n=1660 cos0.93 難-1.35", "s": 0.488, "f": 0}, {"x": 0.933, "y": -1.83, "c": "近傍", "n": "Afterimage d'automne [H]  n=931 cos0.93 難-1.83", "s": 0.274, "f": 0}, {"x": 0.935, "y": -1.994, "c": "近傍", "n": "Souhait bleu [H]  n=721 cos0.94 難-1.99", "s": 0.212, "f": 0}, {"x": 0.933, "y": -1.907, "c": "近傍", "n": "Queen Kaguya [H]  n=924 cos0.93 難-1.91", "s": 0.272, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2845286046877453}, {"a": 0, "b": 2, "w": 0.3119039749518726}, {"a": 0, "b": 3, "w": 0.2972226731762553}, {"a": 0, "b": 4, "w": 0.2870520675940911}, {"a": 0, "b": 5, "w": 0.132896954915943}, {"a": 0, "b": 6, "w": 0.11804175058110455}, {"a": 0, "b": 7, "w": 0.15383692109058555}, {"a": 0, "b": 8, "w": 0.21992534427180543}, {"a": 0, "b": 9, "w": 0.24713580890937004}, {"a": 0, "b": 10, "w": 0.1348609281445282}, {"a": 0, "b": 11, "w": 0.050972280949812876}, {"a": 0, "b": 12, "w": 0.07754574813353676}, {"a": 0, "b": 13, "w": 0.06511426357511452}, {"a": 0, "b": 14, "w": 0.04316488769641336}, {"a": 0, "b": 15, "w": 0.31660800452858096}, {"a": 0, "b": 16, "w": 2.210553962100903e-11}, {"a": 0, "b": 17, "w": 0.07129830423871653}, {"a": 0, "b": 18, "w": 0.004790122868099211}, {"a": 0, "b": 19, "w": 0.054877869119288714}, {"a": 0, "b": 20, "w": 0.07018407169176011}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.925,hiX=1.006,loY=-2.123,hiY=-0.261;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
