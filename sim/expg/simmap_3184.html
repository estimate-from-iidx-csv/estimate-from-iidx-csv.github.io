<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">グッバイ宣言 [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.853, "c": "種", "n": "グッバイ宣言 [L]  n=1310 cos1.00 難0.85", "s": 0.35, "f": 0}, {"x": 0.994, "y": 0.946, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [A]  n=1967 cos0.99 難0.95", "s": 0.525, "f": 0}, {"x": 0.992, "y": 0.808, "c": "近傍", "n": "Rampage [A]  n=3568 cos0.99 難0.81", "s": 0.952, "f": 0}, {"x": 0.989, "y": 0.753, "c": "近傍", "n": "BIGソムタム [A]  n=3088 cos0.99 難0.75", "s": 0.824, "f": 0}, {"x": 0.994, "y": 0.639, "c": "近傍", "n": "錬成人間トリコロイダー [A]  n=2945 cos0.99 難0.64", "s": 0.786, "f": 0}, {"x": 0.992, "y": 0.652, "c": "近傍", "n": "Bahram Attack-猫叉Master Remix- [L]  n=2452 cos0.99 難0.65", "s": 0.655, "f": 0}, {"x": 0.995, "y": 1.125, "c": "近傍", "n": "Super Rush [A]  n=3497 cos1.00 難1.12", "s": 0.934, "f": 0}, {"x": 0.987, "y": 0.943, "c": "近傍", "n": "Sword of Vengeance [A]  n=1652 cos0.99 難0.94", "s": 0.441, "f": 0}, {"x": 0.989, "y": 1.03, "c": "近傍", "n": "GRID KNIGHT [L]  n=3176 cos0.99 難1.03", "s": 0.848, "f": 0}, {"x": 0.989, "y": 1.057, "c": "近傍", "n": "Rave Patroller [A]  n=2939 cos0.99 難1.06", "s": 0.785, "f": 0}, {"x": 0.985, "y": 0.809, "c": "近傍", "n": "Venom [A]  n=3548 cos0.99 難0.81", "s": 0.947, "f": 0}, {"x": 0.993, "y": 0.57, "c": "近傍", "n": "HIGH [L]  n=879 cos0.99 難0.57", "s": 0.235, "f": 0}, {"x": 0.987, "y": 1.043, "c": "近傍", "n": "King of Tribe [A]  n=592 cos0.99 難1.04", "s": 0.158, "f": 0}, {"x": 0.989, "y": 0.602, "c": "近傍", "n": "THE DETONATOR [A]  n=3234 cos0.99 難0.60", "s": 0.863, "f": 0}, {"x": 0.985, "y": 1.028, "c": "近傍", "n": "Beat Radiance [L]  n=3481 cos0.99 難1.03", "s": 0.929, "f": 0}, {"x": 0.983, "y": 0.796, "c": "近傍", "n": "mosaic [A]  n=3746 cos0.98 難0.80", "s": 1.0, "f": 0}, {"x": 0.986, "y": 1.102, "c": "近傍", "n": "#MAGiCVLGiRL_TRVP_B3VTZ [A]  n=3384 cos0.99 難1.10", "s": 0.903, "f": 0}, {"x": 0.988, "y": 1.15, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3429 cos0.99 難1.15", "s": 0.915, "f": 0}, {"x": 0.987, "y": 0.563, "c": "近傍", "n": "Jungle Eater [A]  n=2408 cos0.99 難0.56", "s": 0.643, "f": 0}, {"x": 0.983, "y": 1.039, "c": "近傍", "n": "NNRT [A]  n=3514 cos0.98 難1.04", "s": 0.938, "f": 0}, {"x": 0.981, "y": 0.781, "c": "近傍", "n": "invoker [A]  n=3713 cos0.98 難0.78", "s": 0.991, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5131896816935329}, {"a": 0, "b": 2, "w": 0.4079379189666562}, {"a": 0, "b": 3, "w": 0.3242744237748686}, {"a": 0, "b": 4, "w": 0.36536346155244004}, {"a": 0, "b": 5, "w": 0.17076208293064787}, {"a": 0, "b": 6, "w": 0.551253393640345}, {"a": 0, "b": 7, "w": 0.15948586280514965}, {"a": 0, "b": 8, "w": 0.29469220919730243}, {"a": 0, "b": 9, "w": 0.23960200723367764}, {"a": 0, "b": 10, "w": 0.117679551144662}, {"a": 0, "b": 11, "w": 0.12742759845804708}, {"a": 0, "b": 12, "w": 0.2146938343774032}, {"a": 0, "b": 13, "w": 0.09928434779415884}, {"a": 0, "b": 14, "w": 0.08467085081435066}, {"a": 0, "b": 15, "w": 0.16057088372229877}, {"a": 0, "b": 16, "w": 0.22316356297816853}, {"a": 0, "b": 17, "w": 0.2039435447312573}, {"a": 0, "b": 18, "w": 3.171540807755946e-11}, {"a": 0, "b": 19, "w": 0.15695626972265642}, {"a": 0, "b": 20, "w": 0.01173269856184278}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.979,hiX=1.002,loY=0.516,hiY=1.197;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
