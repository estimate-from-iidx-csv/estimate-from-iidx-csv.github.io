<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">CoMAAAAAAA [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.482, "c": "種", "n": "CoMAAAAAAA [H]  n=1224 cos1.00 難-1.48", "s": 0.709, "f": 0}, {"x": 0.998, "y": -1.48, "c": "近傍", "n": "残像ニ繋ガレタ追憶ノHIDEAWAY [H]  n=805 cos1.00 難-1.48", "s": 0.466, "f": 0}, {"x": 0.994, "y": -1.459, "c": "近傍", "n": "夢縁 [H]  n=1038 cos0.99 難-1.46", "s": 0.601, "f": 0}, {"x": 0.995, "y": -1.616, "c": "近傍", "n": "Exhaust Hype [H]  n=1305 cos0.99 難-1.62", "s": 0.756, "f": 0}, {"x": 0.993, "y": -1.401, "c": "近傍", "n": "Begin [H]  n=607 cos0.99 難-1.40", "s": 0.352, "f": 0}, {"x": 0.998, "y": -1.233, "c": "近傍", "n": "Persephone [H]  n=1604 cos1.00 難-1.23", "s": 0.929, "f": 0}, {"x": 0.993, "y": -1.419, "c": "近傍", "n": "Around The Galaxy [H]  n=1244 cos0.99 難-1.42", "s": 0.721, "f": 0}, {"x": 0.992, "y": -1.486, "c": "近傍", "n": "Necroxis Girl [H]  n=934 cos0.99 難-1.49", "s": 0.541, "f": 0}, {"x": 0.992, "y": -1.481, "c": "近傍", "n": "Battleground [H]  n=1213 cos0.99 難-1.48", "s": 0.703, "f": 0}, {"x": 0.992, "y": -1.428, "c": "近傍", "n": "Stereo Beasts [H]  n=695 cos0.99 難-1.43", "s": 0.403, "f": 0}, {"x": 0.993, "y": -1.302, "c": "近傍", "n": "〆 [H]  n=1726 cos0.99 難-1.30", "s": 1.0, "f": 0}, {"x": 0.992, "y": -1.313, "c": "近傍", "n": "innocent revolver [H]  n=1329 cos0.99 難-1.31", "s": 0.77, "f": 0}, {"x": 0.992, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.36, "f": 0}, {"x": 0.991, "y": -1.449, "c": "近傍", "n": "#CMFLG [H]  n=888 cos0.99 難-1.45", "s": 0.514, "f": 0}, {"x": 0.993, "y": -1.229, "c": "近傍", "n": "明鏡止水 [H]  n=1440 cos0.99 難-1.23", "s": 0.834, "f": 0}, {"x": 0.992, "y": -1.252, "c": "近傍", "n": "Without Heaven [H]  n=511 cos0.99 難-1.25", "s": 0.296, "f": 0}, {"x": 0.99, "y": -1.351, "c": "近傍", "n": "LOUDER ROLLING THUNDER [H]  n=990 cos0.99 難-1.35", "s": 0.574, "f": 0}, {"x": 0.99, "y": -1.337, "c": "近傍", "n": "Space Battleship S4TO [H]  n=634 cos0.99 難-1.34", "s": 0.367, "f": 0}, {"x": 0.993, "y": -1.203, "c": "近傍", "n": "Realize Maze [H]  n=1572 cos0.99 難-1.20", "s": 0.911, "f": 0}, {"x": 0.992, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.99 難-1.25", "s": 0.699, "f": 0}, {"x": 0.997, "y": -1.871, "c": "近傍", "n": "X-ray binary [H]  n=793 cos1.00 難-1.87", "s": 0.459, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.5952115372186726}, {"a": 0, "b": 2, "w": 0.40949225807844325}, {"a": 0, "b": 3, "w": 0.4330031869015435}, {"a": 0, "b": 4, "w": 0.40049598635086536}, {"a": 0, "b": 5, "w": 0.6497452048305283}, {"a": 0, "b": 6, "w": 0.3009740089914652}, {"a": 0, "b": 7, "w": 0.3103527686947426}, {"a": 0, "b": 8, "w": 0.31766525695425973}, {"a": 0, "b": 9, "w": 0.1273886615405848}, {"a": 0, "b": 10, "w": 0.2413773848045505}, {"a": 0, "b": 11, "w": 0.1906292927507528}, {"a": 0, "b": 12, "w": 0.28915241678338954}, {"a": 0, "b": 13, "w": 0.22235061988029214}, {"a": 0, "b": 14, "w": 0.33602853223233586}, {"a": 0, "b": 15, "w": 0.24384647560968475}, {"a": 0, "b": 16, "w": 5.394074076292554e-11}, {"a": 0, "b": 17, "w": 0.08571909272510769}, {"a": 0, "b": 18, "w": 0.3818334528689533}, {"a": 0, "b": 19, "w": 0.13444714858872153}, {"a": 0, "b": 20, "w": 0.4984356964594826}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-1.925,hiY=-1.149;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
