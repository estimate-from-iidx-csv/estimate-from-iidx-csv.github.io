<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">100％ minimoo-G [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.511, "c": "種", "n": "100％ minimoo-G [A]  n=3213 cos1.00 難0.51", "s": 0.89, "f": 0}, {"x": 0.981, "y": 0.233, "c": "近傍", "n": "Macho Gang [A]  n=3030 cos0.98 難0.23", "s": 0.84, "f": 0}, {"x": 0.973, "y": 0.49, "c": "近傍", "n": "RISLIM -Remix- [A]  n=3211 cos0.97 難0.49", "s": 0.89, "f": 0}, {"x": 0.98, "y": -0.133, "c": "近傍", "n": "route 80s [A]  n=2371 cos0.98 難-0.13", "s": 0.657, "f": 0}, {"x": 0.98, "y": -0.121, "c": "近傍", "n": "グラナダの風 [A]  n=2828 cos0.98 難-0.12", "s": 0.784, "f": 0}, {"x": 0.98, "y": -0.154, "c": "近傍", "n": "Last Message [A]  n=2333 cos0.98 難-0.15", "s": 0.646, "f": 0}, {"x": 0.969, "y": 0.49, "c": "近傍", "n": "SWEETEST SAVAGE [A]  n=2974 cos0.97 難0.49", "s": 0.824, "f": 0}, {"x": 0.974, "y": 0.048, "c": "近傍", "n": "Feedback [A]  n=2741 cos0.97 難0.05", "s": 0.759, "f": 0}, {"x": 0.975, "y": -0.01, "c": "近傍", "n": "Regulus [A]  n=2454 cos0.97 難-0.01", "s": 0.68, "f": 0}, {"x": 0.979, "y": -0.188, "c": "近傍", "n": "starmine [A]  n=3070 cos0.98 難-0.19", "s": 0.851, "f": 0}, {"x": 0.982, "y": -0.263, "c": "近傍", "n": "AVE DE RAPINA [A]  n=2059 cos0.98 難-0.26", "s": 0.571, "f": 0}, {"x": 0.968, "y": 0.309, "c": "近傍", "n": "250bpm [A]  n=2652 cos0.97 難0.31", "s": 0.735, "f": 0}, {"x": 0.969, "y": 0.178, "c": "近傍", "n": "DIVE ～INTO YOUR HEART～ [A]  n=2685 cos0.97 難0.18", "s": 0.744, "f": 0}, {"x": 0.968, "y": 0.317, "c": "近傍", "n": "泰東ノ翠霞 [A]  n=2900 cos0.97 難0.32", "s": 0.804, "f": 0}, {"x": 0.973, "y": -0.059, "c": "近傍", "n": "B4U [A]  n=3223 cos0.97 難-0.06", "s": 0.893, "f": 0}, {"x": 0.972, "y": -0.066, "c": "近傍", "n": "Do it!! Do it!! [H]  n=2808 cos0.97 難-0.07", "s": 0.778, "f": 0}, {"x": 0.977, "y": -0.257, "c": "近傍", "n": "ALL I NEED YOUR LOVE [A]  n=2483 cos0.98 難-0.26", "s": 0.688, "f": 0}, {"x": 0.971, "y": -0.063, "c": "近傍", "n": "Music is The Answer [A]  n=3019 cos0.97 難-0.06", "s": 0.837, "f": 0}, {"x": 0.972, "y": -0.141, "c": "近傍", "n": "Concertino in Blue [H]  n=2827 cos0.97 難-0.14", "s": 0.783, "f": 0}, {"x": 0.97, "y": -0.073, "c": "近傍", "n": "Amor De Verao [A]  n=3609 cos0.97 難-0.07", "s": 1.0, "f": 0}, {"x": 0.974, "y": -0.23, "c": "近傍", "n": "Scripted Connection⇒ H mix [H]  n=2491 cos0.97 難-0.23", "s": 0.69, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.2027031005158414}, {"a": 0, "b": 2, "w": 0.11962270458513313}, {"a": 0, "b": 3, "w": 0.2082022691863571}, {"a": 0, "b": 4, "w": 0.17689874882328116}, {"a": 0, "b": 5, "w": 0.1957951030113243}, {"a": 0, "b": 6, "w": 0.05490073578410659}, {"a": 0, "b": 7, "w": 0.12054148721638491}, {"a": 0, "b": 8, "w": 0.10927884224801121}, {"a": 0, "b": 9, "w": 0.06933397055266699}, {"a": 0, "b": 10, "w": 0.16517057177962102}, {"a": 0, "b": 11, "w": 0.03020553918519453}, {"a": 0, "b": 12, "w": 0.04268562253457542}, {"a": 0, "b": 13, "w": 0.02032994680623368}, {"a": 0, "b": 14, "w": 3.567357520495307e-11}, {"a": 0, "b": 15, "w": 0.09344266624754549}, {"a": 0, "b": 16, "w": 0.17043219996313463}, {"a": 0, "b": 17, "w": 0.022319720375193253}, {"a": 0, "b": 18, "w": 0.09069715582262206}, {"a": 0, "b": 19, "w": 0.044319963735454326}, {"a": 0, "b": 20, "w": 0.118001046363718}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.965,hiX=1.003,loY=-0.325,hiY=0.573;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
