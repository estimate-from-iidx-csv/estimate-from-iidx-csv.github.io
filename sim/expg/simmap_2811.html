<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Say YEEEAHH [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.129, "c": "種", "n": "Say YEEEAHH [A]  n=3509 cos1.00 難1.13", "s": 0.977, "f": 0}, {"x": 0.991, "y": 1.226, "c": "近傍", "n": "DARK LEGACY [A]  n=3458 cos0.99 難1.23", "s": 0.963, "f": 0}, {"x": 0.985, "y": 1.057, "c": "近傍", "n": "Rave Patroller [A]  n=2939 cos0.99 難1.06", "s": 0.818, "f": 0}, {"x": 0.984, "y": 1.073, "c": "近傍", "n": "Idola [A]  n=3591 cos0.98 難1.07", "s": 1.0, "f": 0}, {"x": 0.984, "y": 1.228, "c": "近傍", "n": "A MINSTREL ～ ver. short-scape ～ [L]  n=1124 cos0.98 難1.23", "s": 0.313, "f": 0}, {"x": 0.984, "y": 1.028, "c": "近傍", "n": "Beat Radiance [L]  n=3481 cos0.98 難1.03", "s": 0.969, "f": 0}, {"x": 0.983, "y": 1.125, "c": "近傍", "n": "Super Rush [A]  n=3497 cos0.98 難1.12", "s": 0.974, "f": 0}, {"x": 0.984, "y": 1.03, "c": "近傍", "n": "GRID KNIGHT [L]  n=3176 cos0.98 難1.03", "s": 0.884, "f": 0}, {"x": 0.982, "y": 1.15, "c": "近傍", "n": "イザナミノナゲキ [A]  n=3429 cos0.98 難1.15", "s": 0.955, "f": 0}, {"x": 0.982, "y": 1.237, "c": "近傍", "n": "BITTER CHOCOLATE STRIKER [A]  n=3483 cos0.98 難1.24", "s": 0.97, "f": 0}, {"x": 0.982, "y": 1.23, "c": "近傍", "n": "Valanga [A]  n=3497 cos0.98 難1.23", "s": 0.974, "f": 0}, {"x": 0.981, "y": 1.092, "c": "近傍", "n": "thunder HOUSE NATION Remix [L]  n=2567 cos0.98 難1.09", "s": 0.715, "f": 0}, {"x": 0.98, "y": 1.038, "c": "近傍", "n": "華蝶風雪 [L]  n=1462 cos0.98 難1.04", "s": 0.407, "f": 0}, {"x": 0.982, "y": 1.294, "c": "近傍", "n": "Little Little Princess [L]  n=2884 cos0.98 難1.29", "s": 0.803, "f": 0}, {"x": 0.978, "y": 0.946, "c": "近傍", "n": "JUSTICE/GUILTY feat. Nana Takahashi & 709sec. [A]  n=1967 cos0.98 難0.95", "s": 0.548, "f": 0}, {"x": 0.981, "y": 1.404, "c": "近傍", "n": "rommmo [A]  n=2579 cos0.98 難1.40", "s": 0.718, "f": 0}, {"x": 0.981, "y": 0.853, "c": "近傍", "n": "グッバイ宣言 [L]  n=1310 cos0.98 難0.85", "s": 0.365, "f": 0}, {"x": 0.974, "y": 1.038, "c": "近傍", "n": "HYPE THE CORE [A]  n=3102 cos0.97 難1.04", "s": 0.864, "f": 0}, {"x": 0.976, "y": 1.307, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2995 cos0.98 難1.31", "s": 0.834, "f": 0}, {"x": 0.974, "y": 1.043, "c": "近傍", "n": "King of Tribe [A]  n=592 cos0.97 難1.04", "s": 0.165, "f": 0}, {"x": 0.985, "y": 0.773, "c": "近傍", "n": "examination leave [A]  n=3358 cos0.98 難0.77", "s": 0.935, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4345884970637951}, {"a": 0, "b": 2, "w": 0.3014467271532393}, {"a": 0, "b": 3, "w": 0.2671769502525939}, {"a": 0, "b": 4, "w": 0.03192946176538225}, {"a": 0, "b": 5, "w": 0.14084316325529866}, {"a": 0, "b": 6, "w": 0.2533028204668769}, {"a": 0, "b": 7, "w": 0.2922327662938934}, {"a": 0, "b": 8, "w": 0.23192065834869657}, {"a": 0, "b": 9, "w": 0.11252671248914103}, {"a": 0, "b": 10, "w": 0.23791969936587742}, {"a": 0, "b": 11, "w": 0.10544483894971324}, {"a": 0, "b": 12, "w": 2.7608582087168543e-11}, {"a": 0, "b": 13, "w": 0.10357335540188706}, {"a": 0, "b": 14, "w": 0.16800344495665642}, {"a": 0, "b": 15, "w": 0.21994249929733845}, {"a": 0, "b": 16, "w": 0.21968596258357442}, {"a": 0, "b": 17, "w": 0.12044192659589992}, {"a": 0, "b": 18, "w": 0.1502737505425935}, {"a": 0, "b": 19, "w": 0.10377166411662575}, {"a": 0, "b": 20, "w": 0.30817296132303773}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.972,hiX=1.002,loY=0.722,hiY=1.454;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
