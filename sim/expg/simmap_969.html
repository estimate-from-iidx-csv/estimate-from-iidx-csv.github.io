<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ＰＡＳＴＥＬＩＳＭ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.172, "c": "種", "n": "ＰＡＳＴＥＬＩＳＭ [A]  n=985 cos1.00 難-0.17", "s": 0.281, "f": 0}, {"x": 0.997, "y": -0.076, "c": "近傍", "n": "If [A]  n=2168 cos1.00 難-0.08", "s": 0.619, "f": 0}, {"x": 0.995, "y": -0.134, "c": "近傍", "n": "EXE [A]  n=3022 cos1.00 難-0.13", "s": 0.863, "f": 0}, {"x": 0.996, "y": -0.258, "c": "近傍", "n": "NΦ CRIME [A]  n=2775 cos1.00 難-0.26", "s": 0.792, "f": 0}, {"x": 0.998, "y": -0.318, "c": "近傍", "n": "Dazzlin' Darlin-秋葉工房mix- [A]  n=3503 cos1.00 難-0.32", "s": 1.0, "f": 0}, {"x": 0.996, "y": -0.28, "c": "近傍", "n": "WISH(EUROBEAT MIX) [A]  n=2555 cos1.00 難-0.28", "s": 0.729, "f": 0}, {"x": 0.995, "y": -0.229, "c": "近傍", "n": "星をこの手に [A]  n=3012 cos0.99 難-0.23", "s": 0.86, "f": 0}, {"x": 0.995, "y": -0.079, "c": "近傍", "n": "山岡晃の「クイズ！家事都合！」 [A]  n=2845 cos1.00 難-0.08", "s": 0.812, "f": 0}, {"x": 0.996, "y": -0.311, "c": "近傍", "n": "IDOL syndrome. [A]  n=3142 cos1.00 難-0.31", "s": 0.897, "f": 0}, {"x": 0.995, "y": -0.105, "c": "近傍", "n": "Why did you go away [A]  n=3123 cos0.99 難-0.11", "s": 0.892, "f": 0}, {"x": 0.994, "y": -0.123, "c": "近傍", "n": "Remedy feat. Kanae Asaba [A]  n=3045 cos0.99 難-0.12", "s": 0.869, "f": 0}, {"x": 0.994, "y": -0.239, "c": "近傍", "n": "Devil's Gear [H]  n=2603 cos0.99 難-0.24", "s": 0.743, "f": 0}, {"x": 0.994, "y": -0.249, "c": "近傍", "n": "Monkey Dance [A]  n=2550 cos0.99 難-0.25", "s": 0.728, "f": 0}, {"x": 0.994, "y": -0.108, "c": "近傍", "n": "Almace [A]  n=3117 cos0.99 難-0.11", "s": 0.89, "f": 0}, {"x": 0.995, "y": -0.306, "c": "近傍", "n": "IN THE NAME OF LOVE [A]  n=2765 cos1.00 難-0.31", "s": 0.789, "f": 0}, {"x": 0.994, "y": -0.074, "c": "近傍", "n": "vault of heaven [A]  n=2933 cos0.99 難-0.07", "s": 0.837, "f": 0}, {"x": 0.995, "y": -0.327, "c": "近傍", "n": "7 Colors [A]  n=1865 cos1.00 難-0.33", "s": 0.532, "f": 0}, {"x": 0.994, "y": -0.075, "c": "近傍", "n": "星屑ディスタンシア [A]  n=3049 cos0.99 難-0.08", "s": 0.87, "f": 0}, {"x": 0.998, "y": -0.379, "c": "近傍", "n": "海神 [H]  n=3059 cos1.00 難-0.38", "s": 0.873, "f": 0}, {"x": 0.994, "y": -0.281, "c": "近傍", "n": "Wonderful Escape [A]  n=2303 cos0.99 難-0.28", "s": 0.657, "f": 0}, {"x": 0.994, "y": -0.271, "c": "近傍", "n": "天空脳番長危機十六連打 [H]  n=2481 cos0.99 難-0.27", "s": 0.708, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4193734543745865}, {"a": 0, "b": 2, "w": 0.3719642892787973}, {"a": 0, "b": 3, "w": 0.37751903917663443}, {"a": 0, "b": 4, "w": 0.5056859483079871}, {"a": 0, "b": 5, "w": 0.367158399644554}, {"a": 0, "b": 6, "w": 0.3377477274466958}, {"a": 0, "b": 7, "w": 0.3059039885460684}, {"a": 0, "b": 8, "w": 0.42970871265270294}, {"a": 0, "b": 9, "w": 0.309296134437929}, {"a": 0, "b": 10, "w": 0.3037635318911085}, {"a": 0, "b": 11, "w": 0.20676404644626745}, {"a": 0, "b": 12, "w": 0.24738730185043234}, {"a": 0, "b": 13, "w": 6.41846575888394e-11}, {"a": 0, "b": 14, "w": 0.31554299992840007}, {"a": 0, "b": 15, "w": 0.30695354106886874}, {"a": 0, "b": 16, "w": 0.3093319335514819}, {"a": 0, "b": 17, "w": 0.24802752063411648}, {"a": 0, "b": 18, "w": 0.554786120361211}, {"a": 0, "b": 19, "w": 0.2737662653129709}, {"a": 0, "b": 20, "w": 0.2530320377873999}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.993,hiX=1.001,loY=-0.404,hiY=-0.050;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
