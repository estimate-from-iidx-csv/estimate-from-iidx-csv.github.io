<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Colors (radio edit) [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.057, "c": "種", "n": "Colors (radio edit) [A]  n=3588 cos1.00 難1.06", "s": 0.978, "f": 0}, {"x": 0.992, "y": 1.031, "c": "近傍", "n": "Scripted Connection⇒ H mix [L]  n=1416 cos0.99 難1.03", "s": 0.386, "f": 0}, {"x": 0.989, "y": 0.943, "c": "近傍", "n": "V [A]  n=3647 cos0.99 難0.94", "s": 0.994, "f": 0}, {"x": 0.99, "y": 1.327, "c": "近傍", "n": "ICARUS [A]  n=3570 cos0.99 難1.33", "s": 0.973, "f": 0}, {"x": 0.986, "y": 1.215, "c": "近傍", "n": "One More Lovely [A]  n=3338 cos0.99 難1.21", "s": 0.91, "f": 0}, {"x": 0.989, "y": 0.744, "c": "近傍", "n": "BLOCKS [A]  n=3323 cos0.99 難0.74", "s": 0.905, "f": 0}, {"x": 0.985, "y": 1.162, "c": "近傍", "n": "Meissa [A]  n=2087 cos0.98 難1.16", "s": 0.569, "f": 0}, {"x": 0.984, "y": 0.98, "c": "近傍", "n": "moon_child [A]  n=3570 cos0.98 難0.98", "s": 0.973, "f": 0}, {"x": 0.986, "y": 0.773, "c": "近傍", "n": "カゴノトリ～弐式～ [A]  n=3630 cos0.99 難0.77", "s": 0.989, "f": 0}, {"x": 0.982, "y": 1.082, "c": "近傍", "n": "oratio [A]  n=3445 cos0.98 難1.08", "s": 0.939, "f": 0}, {"x": 0.982, "y": 1.046, "c": "近傍", "n": "卑弥呼 [H]  n=3670 cos0.98 難1.05", "s": 1.0, "f": 0}, {"x": 0.984, "y": 1.33, "c": "近傍", "n": "Dances with Snow Fairies [A]  n=3278 cos0.98 難1.33", "s": 0.893, "f": 0}, {"x": 0.981, "y": 0.943, "c": "近傍", "n": "TRANOID [A]  n=3070 cos0.98 難0.94", "s": 0.837, "f": 0}, {"x": 0.985, "y": 0.715, "c": "近傍", "n": "You'll say \"Now!\" [A]  n=3091 cos0.98 難0.72", "s": 0.842, "f": 0}, {"x": 0.987, "y": 0.637, "c": "近傍", "n": "Giudecca [A]  n=3153 cos0.99 難0.64", "s": 0.859, "f": 0}, {"x": 0.98, "y": 1.117, "c": "近傍", "n": "Gravigazer [A]  n=3401 cos0.98 難1.12", "s": 0.927, "f": 0}, {"x": 0.982, "y": 1.33, "c": "近傍", "n": "Konzert V [A]  n=3321 cos0.98 難1.33", "s": 0.905, "f": 0}, {"x": 0.98, "y": 1.02, "c": "近傍", "n": "終焔のClaudia [A]  n=1703 cos0.98 難1.02", "s": 0.464, "f": 0}, {"x": 0.981, "y": 1.228, "c": "近傍", "n": "TECHNO Style Essentials [A]  n=2983 cos0.98 難1.23", "s": 0.813, "f": 0}, {"x": 0.981, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.98 難0.89", "s": 0.291, "f": 0}, {"x": 0.982, "y": 0.759, "c": "近傍", "n": "gigadelic [A]  n=3539 cos0.98 難0.76", "s": 0.964, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4862715625875388}, {"a": 0, "b": 2, "w": 0.38881390539205163}, {"a": 0, "b": 3, "w": 0.21778956858062337}, {"a": 0, "b": 4, "w": 0.2546828038304636}, {"a": 0, "b": 5, "w": 0.3733247964372445}, {"a": 0, "b": 6, "w": 0.31400905282356206}, {"a": 0, "b": 7, "w": 0.3892838971539213}, {"a": 0, "b": 8, "w": 0.4269297781386612}, {"a": 0, "b": 9, "w": 0.3366012433934892}, {"a": 0, "b": 10, "w": 0.18320305470784426}, {"a": 0, "b": 11, "w": 0.07730254109674672}, {"a": 0, "b": 12, "w": 0.32527115613371826}, {"a": 0, "b": 13, "w": 0.4058040963957993}, {"a": 0, "b": 14, "w": 0.43675391700673827}, {"a": 0, "b": 15, "w": 0.1884172254794464}, {"a": 0, "b": 16, "w": 2.789879438580556e-11}, {"a": 0, "b": 17, "w": 0.18034900813963195}, {"a": 0, "b": 18, "w": 0.18416320527016405}, {"a": 0, "b": 19, "w": 0.19416741548188388}, {"a": 0, "b": 20, "w": 0.360986262526484}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.978,hiX=1.002,loY=0.581,hiY=1.386;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
