<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">DOMINION [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 1.288, "c": "種", "n": "DOMINION [A]  n=3441 cos1.00 難1.29", "s": 0.984, "f": 0}, {"x": 0.995, "y": 1.307, "c": "近傍", "n": "T-REX vs Velociraptor (In the Far east euphoria) [A]  n=2995 cos0.99 難1.31", "s": 0.856, "f": 0}, {"x": 0.995, "y": 1.368, "c": "近傍", "n": "電腦都市 [A]  n=1373 cos0.99 難1.37", "s": 0.393, "f": 0}, {"x": 0.994, "y": 1.439, "c": "近傍", "n": "Monopole. [A]  n=3172 cos0.99 難1.44", "s": 0.907, "f": 0}, {"x": 0.993, "y": 1.404, "c": "近傍", "n": "rommmo [A]  n=2579 cos0.99 難1.40", "s": 0.737, "f": 0}, {"x": 0.992, "y": 1.364, "c": "近傍", "n": "THE DEEP STRIKER [L]  n=2924 cos0.99 難1.36", "s": 0.836, "f": 0}, {"x": 0.991, "y": 1.231, "c": "近傍", "n": "RINNE [A]  n=2031 cos0.99 難1.23", "s": 0.581, "f": 0}, {"x": 0.99, "y": 1.368, "c": "近傍", "n": "ABSOLUTE EVIL [A]  n=2271 cos0.99 難1.37", "s": 0.649, "f": 0}, {"x": 0.993, "y": 1.472, "c": "近傍", "n": "DEADHEAT [A]  n=3002 cos0.99 難1.47", "s": 0.858, "f": 0}, {"x": 0.997, "y": 1.043, "c": "近傍", "n": "King of Tribe [A]  n=592 cos1.00 難1.04", "s": 0.169, "f": 0}, {"x": 0.989, "y": 1.306, "c": "近傍", "n": "OTENAMI Hurricane [A]  n=3185 cos0.99 難1.31", "s": 0.911, "f": 0}, {"x": 0.995, "y": 1.057, "c": "近傍", "n": "Rave Patroller [A]  n=2939 cos1.00 難1.06", "s": 0.84, "f": 0}, {"x": 0.991, "y": 1.125, "c": "近傍", "n": "Super Rush [A]  n=3497 cos0.99 難1.12", "s": 1.0, "f": 0}, {"x": 0.994, "y": 1.512, "c": "近傍", "n": "ALTERNATOR [A]  n=2278 cos0.99 難1.51", "s": 0.651, "f": 0}, {"x": 0.988, "y": 1.275, "c": "近傍", "n": "Amazing Mirage [L]  n=3180 cos0.99 難1.27", "s": 0.909, "f": 0}, {"x": 0.989, "y": 1.377, "c": "近傍", "n": "One for All [A]  n=2201 cos0.99 難1.38", "s": 0.629, "f": 0}, {"x": 0.988, "y": 1.326, "c": "近傍", "n": "cinder [A]  n=3233 cos0.99 難1.33", "s": 0.925, "f": 0}, {"x": 0.989, "y": 1.431, "c": "近傍", "n": "ORCA [A]  n=2527 cos0.99 難1.43", "s": 0.723, "f": 0}, {"x": 0.998, "y": 1.569, "c": "近傍", "n": "Empire of Fury [A]  n=2430 cos1.00 難1.57", "s": 0.695, "f": 0}, {"x": 0.991, "y": 1.073, "c": "近傍", "n": "The Least 100sec [A]  n=3392 cos0.99 難1.07", "s": 0.97, "f": 0}, {"x": 0.992, "y": 1.527, "c": "近傍", "n": "HAERETICUS [A]  n=3061 cos0.99 難1.53", "s": 0.875, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4204623040503478}, {"a": 0, "b": 2, "w": 0.3522225844394635}, {"a": 0, "b": 3, "w": 0.3355681147538304}, {"a": 0, "b": 4, "w": 0.27561021925106055}, {"a": 0, "b": 5, "w": 0.17781528411084258}, {"a": 0, "b": 6, "w": 0.24101378709608035}, {"a": 0, "b": 7, "w": 0.09392710085502409}, {"a": 0, "b": 8, "w": 0.3353108159894378}, {"a": 0, "b": 9, "w": 0.5490161699188059}, {"a": 0, "b": 10, "w": 0.17772467362883937}, {"a": 0, "b": 11, "w": 0.4225083204356689}, {"a": 0, "b": 12, "w": 0.22407109691875704}, {"a": 0, "b": 13, "w": 0.045703504965930786}, {"a": 0, "b": 14, "w": 0.07493166229298609}, {"a": 0, "b": 15, "w": 0.012923533292606426}, {"a": 0, "b": 16, "w": 0.15517906309855467}, {"a": 0, "b": 17, "w": 3.8908098964896e-11}, {"a": 0, "b": 18, "w": 0.5328406599185029}, {"a": 0, "b": 19, "w": 0.2621241366386574}, {"a": 0, "b": 20, "w": 0.2622910285335627}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=1.001,hiY=1.611;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
