<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Globe Glitter [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.132, "c": "種", "n": "Globe Glitter [A]  n=2077 cos1.00 難0.13", "s": 0.556, "f": 0}, {"x": 0.995, "y": 0.075, "c": "近傍", "n": "Raspberry Potion (feat.あれたん & ぎゃるのしん☆) [A]  n=1546 cos0.99 難0.08", "s": 0.414, "f": 0}, {"x": 0.994, "y": 0.153, "c": "近傍", "n": "M.D.Injection [A]  n=2857 cos0.99 難0.15", "s": 0.765, "f": 0}, {"x": 0.993, "y": 0.094, "c": "近傍", "n": "Hat Surprise (Season 3) [A]  n=1472 cos0.99 難0.09", "s": 0.394, "f": 0}, {"x": 0.994, "y": 0.205, "c": "近傍", "n": "嘆きの樹 [H]  n=3718 cos0.99 難0.20", "s": 0.995, "f": 0}, {"x": 0.995, "y": 0.312, "c": "近傍", "n": "GOLD RUSH 2025 [A]  n=836 cos1.00 難0.31", "s": 0.224, "f": 0}, {"x": 0.992, "y": 0.133, "c": "近傍", "n": "Lost Souls [A]  n=2604 cos0.99 難0.13", "s": 0.697, "f": 0}, {"x": 0.994, "y": 0.308, "c": "近傍", "n": "Raison d'etre～交差する宿命～ [A]  n=3376 cos0.99 難0.31", "s": 0.904, "f": 0}, {"x": 0.993, "y": 0.021, "c": "近傍", "n": "爆ぜりゃんせ [A]  n=1347 cos0.99 難0.02", "s": 0.361, "f": 0}, {"x": 0.992, "y": 0.193, "c": "近傍", "n": "BLUE STRAGGLER [A]  n=2968 cos0.99 難0.19", "s": 0.794, "f": 0}, {"x": 0.991, "y": 0.207, "c": "近傍", "n": "winkle 2 winkle [A]  n=1667 cos0.99 難0.21", "s": 0.446, "f": 0}, {"x": 0.992, "y": 0.015, "c": "近傍", "n": "月下繚乱 [A]  n=1120 cos0.99 難0.01", "s": 0.3, "f": 0}, {"x": 0.993, "y": -0.048, "c": "近傍", "n": "EXUSIA [H]  n=2981 cos0.99 難-0.05", "s": 0.798, "f": 0}, {"x": 0.991, "y": 0.146, "c": "近傍", "n": "Believe In Me [A]  n=3504 cos0.99 難0.15", "s": 0.938, "f": 0}, {"x": 0.991, "y": 0.231, "c": "近傍", "n": "Override [A]  n=3119 cos0.99 難0.23", "s": 0.835, "f": 0}, {"x": 0.993, "y": 0.314, "c": "近傍", "n": "パラドキシカル・タイムリープトライアル(Short Ver.) [A]  n=3156 cos0.99 難0.31", "s": 0.845, "f": 0}, {"x": 0.991, "y": 0.171, "c": "近傍", "n": "おーまい！らぶりー！すうぃーてぃ！だーりん！ [A]  n=2934 cos0.99 難0.17", "s": 0.785, "f": 0}, {"x": 0.991, "y": 0.215, "c": "近傍", "n": "double thrash [A]  n=2390 cos0.99 難0.21", "s": 0.64, "f": 0}, {"x": 0.99, "y": 0.164, "c": "近傍", "n": "FINALLY BLAZE [A]  n=2532 cos0.99 難0.16", "s": 0.678, "f": 0}, {"x": 0.99, "y": 0.112, "c": "近傍", "n": "STOIC HYPOTHESIS [A]  n=2820 cos0.99 難0.11", "s": 0.755, "f": 0}, {"x": 0.99, "y": 0.116, "c": "近傍", "n": "RED ZONE [A]  n=3736 cos0.99 難0.12", "s": 1.0, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.385972053707196}, {"a": 0, "b": 2, "w": 0.35901986331734415}, {"a": 0, "b": 3, "w": 0.3560121133671823}, {"a": 0, "b": 4, "w": 0.24678584690478755}, {"a": 0, "b": 5, "w": 0.3684655996964459}, {"a": 0, "b": 6, "w": 0.2666564868345159}, {"a": 0, "b": 7, "w": 0.23419364036541168}, {"a": 0, "b": 8, "w": 0.2825173758151971}, {"a": 0, "b": 9, "w": 0.16799738811048592}, {"a": 0, "b": 10, "w": 0.25824799165411894}, {"a": 0, "b": 11, "w": 0.30771112192867733}, {"a": 0, "b": 12, "w": 0.3578270412046274}, {"a": 0, "b": 13, "w": 0.08236827234454014}, {"a": 0, "b": 14, "w": 0.2790167904067884}, {"a": 0, "b": 15, "w": 0.33777293475841474}, {"a": 0, "b": 16, "w": 0.2229659222079884}, {"a": 0, "b": 17, "w": 4.354772098480453e-11}, {"a": 0, "b": 18, "w": 0.2380775959934689}, {"a": 0, "b": 19, "w": 0.19556262493020915}, {"a": 0, "b": 20, "w": 0.004216794846260807}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.989,hiX=1.001,loY=-0.077,hiY=0.343;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
