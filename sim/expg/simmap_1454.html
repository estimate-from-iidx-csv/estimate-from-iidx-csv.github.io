<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Ou Legends [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -1.277, "c": "種", "n": "Ou Legends [H]  n=920 cos1.00 難-1.28", "s": 0.387, "f": 0}, {"x": 0.99, "y": -1.252, "c": "近傍", "n": "Without Heaven [H]  n=511 cos0.99 難-1.25", "s": 0.215, "f": 0}, {"x": 0.989, "y": -1.21, "c": "近傍", "n": "終焔のClaudia [H]  n=801 cos0.99 難-1.21", "s": 0.337, "f": 0}, {"x": 0.989, "y": -1.169, "c": "近傍", "n": "-65℃ [H]  n=1549 cos0.99 難-1.17", "s": 0.652, "f": 0}, {"x": 0.989, "y": -1.135, "c": "近傍", "n": "I will be back -オレは帰ってきた- [H]  n=1716 cos0.99 難-1.13", "s": 0.722, "f": 0}, {"x": 0.987, "y": -1.295, "c": "近傍", "n": "DUAL STRIKER [H]  n=1336 cos0.99 難-1.29", "s": 0.562, "f": 0}, {"x": 0.987, "y": -1.29, "c": "近傍", "n": "The Last Apocalypse [H]  n=623 cos0.99 難-1.29", "s": 0.262, "f": 0}, {"x": 0.986, "y": -1.288, "c": "近傍", "n": "EX-MASSIVE FIGHTER [H]  n=621 cos0.99 難-1.29", "s": 0.261, "f": 0}, {"x": 0.989, "y": -1.04, "c": "近傍", "n": "Trill auf G [H]  n=1795 cos0.99 難-1.04", "s": 0.755, "f": 0}, {"x": 0.989, "y": -1.03, "c": "近傍", "n": "BLACK or WHITE? [H]  n=1847 cos0.99 難-1.03", "s": 0.777, "f": 0}, {"x": 0.986, "y": -1.288, "c": "近傍", "n": "Resonant [H]  n=555 cos0.99 難-1.29", "s": 0.233, "f": 0}, {"x": 0.986, "y": -1.163, "c": "近傍", "n": "Bad Encryption [H]  n=1499 cos0.99 難-1.16", "s": 0.631, "f": 0}, {"x": 0.987, "y": -1.449, "c": "近傍", "n": "#CMFLG [H]  n=888 cos0.99 難-1.45", "s": 0.374, "f": 0}, {"x": 0.989, "y": -0.963, "c": "近傍", "n": "HYENA [H]  n=2377 cos0.99 難-0.96", "s": 1.0, "f": 0}, {"x": 0.99, "y": -0.915, "c": "近傍", "n": "Quick Silver [H]  n=1938 cos0.99 難-0.92", "s": 0.815, "f": 0}, {"x": 0.984, "y": -1.308, "c": "近傍", "n": "Regina vespaE [H]  n=648 cos0.98 難-1.31", "s": 0.273, "f": 0}, {"x": 0.984, "y": -1.201, "c": "近傍", "n": "The Clown of 24stairs [H]  n=1065 cos0.98 難-1.20", "s": 0.448, "f": 0}, {"x": 0.983, "y": -1.329, "c": "近傍", "n": "Vermilion Carol [H]  n=859 cos0.98 難-1.33", "s": 0.361, "f": 0}, {"x": 0.982, "y": -1.246, "c": "近傍", "n": "Flying Castle [H]  n=1207 cos0.98 難-1.25", "s": 0.508, "f": 0}, {"x": 0.986, "y": -0.907, "c": "近傍", "n": "Painful Fate [H]  n=1813 cos0.99 難-0.91", "s": 0.763, "f": 0}, {"x": 0.988, "y": -1.707, "c": "近傍", "n": "涙のテ・エストラーニョ・ムーチョ [H]  n=830 cos0.99 難-1.71", "s": 0.349, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.1888937194150494}, {"a": 0, "b": 2, "w": 0.2523580717847297}, {"a": 0, "b": 3, "w": 0.24188494504587155}, {"a": 0, "b": 4, "w": 0.2149418274588708}, {"a": 0, "b": 5, "w": 0.1923994754645374}, {"a": 0, "b": 6, "w": 0.10440262804068223}, {"a": 0, "b": 7, "w": 0.0616306213462291}, {"a": 0, "b": 8, "w": 0.2228832996681499}, {"a": 0, "b": 9, "w": 0.21115011641166026}, {"a": 0, "b": 10, "w": 0.15099067591618442}, {"a": 0, "b": 11, "w": 0.16070024370871205}, {"a": 0, "b": 12, "w": 0.07549632690126373}, {"a": 0, "b": 13, "w": 0.20025457191032414}, {"a": 0, "b": 14, "w": 0.1571334941909951}, {"a": 0, "b": 15, "w": 0.07646880043448467}, {"a": 0, "b": 16, "w": 4.503986072990074e-11}, {"a": 0, "b": 17, "w": 0.08316984071105527}, {"a": 0, "b": 18, "w": 0.015155835989977828}, {"a": 0, "b": 19, "w": 0.16262754670107227}, {"a": 0, "b": 20, "w": 0.20719918732278753}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.980,hiX=1.001,loY=-1.770,hiY=-0.843;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
