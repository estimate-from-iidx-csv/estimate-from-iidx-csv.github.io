<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">ミラージュ・レジデンス [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.534, "c": "種", "n": "ミラージュ・レジデンス [H]  n=1771 cos1.00 難-0.53", "s": 0.502, "f": 0}, {"x": 0.999, "y": -0.441, "c": "近傍", "n": "Get set, Go! feat.Kanae Asaba [A]  n=1729 cos1.00 難-0.44", "s": 0.49, "f": 0}, {"x": 0.996, "y": -0.361, "c": "近傍", "n": "まほろば [A]  n=2887 cos1.00 難-0.36", "s": 0.819, "f": 0}, {"x": 0.993, "y": -0.559, "c": "近傍", "n": "ギャ・ギャ・ギャ・ギャラクシー！ [A]  n=1116 cos0.99 難-0.56", "s": 0.317, "f": 0}, {"x": 0.993, "y": -0.547, "c": "近傍", "n": "オブソミート [A]  n=1251 cos0.99 難-0.55", "s": 0.355, "f": 0}, {"x": 0.996, "y": -0.305, "c": "近傍", "n": "PERFECT HUMAN [A]  n=1401 cos1.00 難-0.30", "s": 0.397, "f": 0}, {"x": 0.997, "y": -0.269, "c": "近傍", "n": "Follow Tomorrow [A]  n=3525 cos1.00 難-0.27", "s": 1.0, "f": 0}, {"x": 0.993, "y": -0.376, "c": "近傍", "n": "陽炎 [A]  n=2846 cos0.99 難-0.38", "s": 0.807, "f": 0}, {"x": 0.992, "y": -0.586, "c": "近傍", "n": "wanna be a \"BAD GIRL\" feat. Nana Takahashi [A]  n=1931 cos0.99 難-0.59", "s": 0.548, "f": 0}, {"x": 0.992, "y": -0.402, "c": "近傍", "n": "デビルじゃないもん [A]  n=1758 cos0.99 難-0.40", "s": 0.499, "f": 0}, {"x": 0.993, "y": -0.338, "c": "近傍", "n": "Twilight Warp [A]  n=2516 cos0.99 難-0.34", "s": 0.714, "f": 0}, {"x": 0.993, "y": -0.34, "c": "近傍", "n": "TITANIUM RIDERS [A]  n=1724 cos0.99 難-0.34", "s": 0.489, "f": 0}, {"x": 0.991, "y": -0.551, "c": "近傍", "n": "GOLDEN CROSS [H]  n=2643 cos0.99 難-0.55", "s": 0.75, "f": 0}, {"x": 0.993, "y": -0.301, "c": "近傍", "n": "愛しくてラヴィンユー ft. マナ [A]  n=2372 cos0.99 難-0.30", "s": 0.673, "f": 0}, {"x": 0.991, "y": -0.604, "c": "近傍", "n": "愛包ダンスホール [A]  n=1609 cos0.99 難-0.60", "s": 0.456, "f": 0}, {"x": 0.995, "y": -0.211, "c": "近傍", "n": "Ocean Blue feat. Luschel [A]  n=2724 cos1.00 難-0.21", "s": 0.773, "f": 0}, {"x": 0.994, "y": -0.267, "c": "近傍", "n": "!Viva! [A]  n=3296 cos0.99 難-0.27", "s": 0.935, "f": 0}, {"x": 0.991, "y": -0.59, "c": "近傍", "n": "The Rebellion of Sequencer [H]  n=1932 cos0.99 難-0.59", "s": 0.548, "f": 0}, {"x": 0.991, "y": -0.423, "c": "近傍", "n": "好吃来世deエレクトリック [A]  n=1009 cos0.99 難-0.42", "s": 0.286, "f": 0}, {"x": 0.991, "y": -0.411, "c": "近傍", "n": "In Heaven [A]  n=2962 cos0.99 難-0.41", "s": 0.84, "f": 0}, {"x": 0.994, "y": -0.25, "c": "近傍", "n": "take me higher [A]  n=2122 cos0.99 難-0.25", "s": 0.602, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.6448075058424311}, {"a": 0, "b": 2, "w": 0.43086668516368565}, {"a": 0, "b": 3, "w": 0.3026162756377496}, {"a": 0, "b": 4, "w": 0.26101149703927784}, {"a": 0, "b": 5, "w": 0.3722962962378079}, {"a": 0, "b": 6, "w": 0.5216462725044237}, {"a": 0, "b": 7, "w": 0.26125311021647446}, {"a": 0, "b": 8, "w": 0.08406064444512906}, {"a": 0, "b": 9, "w": 5.947753400903366e-11}, {"a": 0, "b": 10, "w": 0.14674300317196187}, {"a": 0, "b": 11, "w": 0.16031233149453472}, {"a": 0, "b": 12, "w": 0.16754794529294914}, {"a": 0, "b": 13, "w": 0.2872260625911338}, {"a": 0, "b": 14, "w": 0.1853313684584711}, {"a": 0, "b": 15, "w": 0.30639382373607893}, {"a": 0, "b": 16, "w": 0.288402922553176}, {"a": 0, "b": 17, "w": 0.19294238851094092}, {"a": 0, "b": 18, "w": 0.08514859468616698}, {"a": 0, "b": 19, "w": 0.17066510668201806}, {"a": 0, "b": 20, "w": 0.2963188517542793}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.635,hiY=-0.180;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
