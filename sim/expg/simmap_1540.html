<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Thor's Hammer [H] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.545, "c": "種", "n": "Thor's Hammer [H]  n=3181 cos1.00 難-0.55", "s": 0.883, "f": 0}, {"x": 0.991, "y": -0.659, "c": "近傍", "n": "少年は空を辿る [H]  n=2729 cos0.99 難-0.66", "s": 0.758, "f": 0}, {"x": 0.988, "y": -0.634, "c": "近傍", "n": "ANDROMEDA II [H]  n=1977 cos0.99 難-0.63", "s": 0.549, "f": 0}, {"x": 0.992, "y": -0.279, "c": "近傍", "n": "天空の夜明け [H]  n=3602 cos0.99 難-0.28", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.283, "c": "近傍", "n": "rage against usual [H]  n=2635 cos0.99 難-0.28", "s": 0.732, "f": 0}, {"x": 0.986, "y": -0.648, "c": "近傍", "n": "Don't be afraid myself [H]  n=1640 cos0.99 難-0.65", "s": 0.455, "f": 0}, {"x": 0.986, "y": -0.634, "c": "近傍", "n": "TYPE MARS(G-Style Mix) [H]  n=1631 cos0.99 難-0.63", "s": 0.453, "f": 0}, {"x": 0.985, "y": -0.641, "c": "近傍", "n": "switch [H]  n=1801 cos0.99 難-0.64", "s": 0.5, "f": 0}, {"x": 0.985, "y": -0.622, "c": "近傍", "n": "Colors (radio edit) [H]  n=2374 cos0.98 難-0.62", "s": 0.659, "f": 0}, {"x": 0.986, "y": -0.384, "c": "近傍", "n": "Zirkfied [H]  n=2984 cos0.99 難-0.38", "s": 0.828, "f": 0}, {"x": 0.985, "y": -0.495, "c": "近傍", "n": "BLUE MIRAGE [H]  n=2388 cos0.98 難-0.49", "s": 0.663, "f": 0}, {"x": 0.984, "y": -0.654, "c": "近傍", "n": "DROP [H]  n=1809 cos0.98 難-0.65", "s": 0.502, "f": 0}, {"x": 0.984, "y": -0.651, "c": "近傍", "n": "DIAVOLO [H]  n=3223 cos0.98 難-0.65", "s": 0.895, "f": 0}, {"x": 0.984, "y": -0.732, "c": "近傍", "n": "snow storm [H]  n=2998 cos0.98 難-0.73", "s": 0.832, "f": 0}, {"x": 0.984, "y": -0.396, "c": "近傍", "n": "quell～the seventh slave～ [H]  n=2522 cos0.98 難-0.40", "s": 0.7, "f": 0}, {"x": 0.983, "y": -0.598, "c": "近傍", "n": "NEMESIS [H]  n=1851 cos0.98 難-0.60", "s": 0.514, "f": 0}, {"x": 0.983, "y": -0.434, "c": "近傍", "n": "Ristaccia [H]  n=2300 cos0.98 難-0.43", "s": 0.639, "f": 0}, {"x": 0.984, "y": -0.761, "c": "近傍", "n": "Apocalypse ～dirge of swans～ [H]  n=2360 cos0.98 難-0.76", "s": 0.655, "f": 0}, {"x": 0.983, "y": -0.381, "c": "近傍", "n": "F [H]  n=3310 cos0.98 難-0.38", "s": 0.919, "f": 0}, {"x": 0.985, "y": -0.265, "c": "近傍", "n": "oratio [H]  n=2400 cos0.99 難-0.27", "s": 0.666, "f": 0}, {"x": 0.986, "y": -0.243, "c": "近傍", "n": "駅猫のワルツ [H]  n=2701 cos0.99 難-0.24", "s": 0.75, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.3338329552911483}, {"a": 0, "b": 2, "w": 0.07961213079234908}, {"a": 0, "b": 3, "w": 0.3531869244708741}, {"a": 0, "b": 4, "w": 0.3267898785383424}, {"a": 0, "b": 5, "w": 0.1467504422202176}, {"a": 0, "b": 6, "w": 0.11569691031564366}, {"a": 0, "b": 7, "w": 0.08731146013091051}, {"a": 0, "b": 8, "w": 0.00728721447378089}, {"a": 0, "b": 9, "w": 0.15185204596364998}, {"a": 0, "b": 10, "w": 0.07231104549840373}, {"a": 0, "b": 11, "w": 0.07328421431833132}, {"a": 0, "b": 12, "w": 0.06505959493787616}, {"a": 0, "b": 13, "w": 0.09541880705443351}, {"a": 0, "b": 14, "w": 0.05001190288309665}, {"a": 0, "b": 15, "w": 0.04069835439799241}, {"a": 0, "b": 16, "w": 0.0772149640640214}, {"a": 0, "b": 17, "w": 0.11343249754692053}, {"a": 0, "b": 18, "w": 0.035636444773576414}, {"a": 0, "b": 19, "w": 0.13099705251362825}, {"a": 0, "b": 20, "w": 4.8962722765111266e-11}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.982,hiX=1.001,loY=-0.802,hiY=-0.201;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
