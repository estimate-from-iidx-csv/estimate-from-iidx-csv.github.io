<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Verflucht [L] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 2.094, "c": "種", "n": "Verflucht [L]  n=2404 cos1.00 難2.09", "s": 0.827, "f": 0}, {"x": 0.992, "y": 1.957, "c": "近傍", "n": "Lost Souls [L]  n=919 cos0.99 難1.96", "s": 0.316, "f": 0}, {"x": 0.988, "y": 1.977, "c": "近傍", "n": "Phoenix [L]  n=1431 cos0.99 難1.98", "s": 0.492, "f": 0}, {"x": 0.982, "y": 2.106, "c": "近傍", "n": "The Limbo [L]  n=1288 cos0.98 難2.11", "s": 0.443, "f": 0}, {"x": 0.983, "y": 2.001, "c": "近傍", "n": "KAISER PHOENIX [L]  n=2029 cos0.98 難2.00", "s": 0.698, "f": 0}, {"x": 0.983, "y": 1.986, "c": "近傍", "n": "Chrono Diver -PENDULUMs- [A]  n=2906 cos0.98 難1.99", "s": 1.0, "f": 0}, {"x": 0.991, "y": 1.847, "c": "近傍", "n": "LIGHTNING STRIKES [L]  n=1107 cos0.99 難1.85", "s": 0.381, "f": 0}, {"x": 0.981, "y": 1.962, "c": "近傍", "n": "Elemental Creation [A]  n=2830 cos0.98 難1.96", "s": 0.974, "f": 0}, {"x": 0.979, "y": 1.953, "c": "近傍", "n": "#The_Relentless [L]  n=680 cos0.98 難1.95", "s": 0.234, "f": 0}, {"x": 0.976, "y": 2.126, "c": "近傍", "n": "DEATH†ZIGOQ ～怒りの高速爆走野郎～ [L]  n=775 cos0.98 難2.13", "s": 0.267, "f": 0}, {"x": 0.978, "y": 1.94, "c": "近傍", "n": "EBONY & IVORY [L]  n=2289 cos0.98 難1.94", "s": 0.788, "f": 0}, {"x": 0.976, "y": 2.023, "c": "近傍", "n": "Sigmund [L]  n=2040 cos0.98 難2.02", "s": 0.702, "f": 0}, {"x": 0.982, "y": 1.87, "c": "近傍", "n": "≡+≡ [L]  n=739 cos0.98 難1.87", "s": 0.254, "f": 0}, {"x": 0.975, "y": 1.98, "c": "近傍", "n": "Dances with Snow Fairies [L]  n=1161 cos0.98 難1.98", "s": 0.4, "f": 0}, {"x": 0.989, "y": 1.78, "c": "近傍", "n": "CHRONO DIVER -NORNIR- [L]  n=2617 cos0.99 難1.78", "s": 0.901, "f": 0}, {"x": 0.977, "y": 1.922, "c": "近傍", "n": "スキッテイエェエエェ!!!! [A]  n=1001 cos0.98 難1.92", "s": 0.344, "f": 0}, {"x": 0.975, "y": 1.946, "c": "近傍", "n": "VANESSA [L]  n=2318 cos0.98 難1.95", "s": 0.798, "f": 0}, {"x": 0.984, "y": 1.795, "c": "近傍", "n": "千年ノ理 [L]  n=2363 cos0.98 難1.79", "s": 0.813, "f": 0}, {"x": 0.975, "y": 1.938, "c": "近傍", "n": "MEGAERA [A]  n=2099 cos0.97 難1.94", "s": 0.722, "f": 0}, {"x": 0.975, "y": 1.917, "c": "近傍", "n": "STEEL NEEDLE [L]  n=1787 cos0.98 難1.92", "s": 0.615, "f": 0}, {"x": 0.978, "y": 1.849, "c": "近傍", "n": "Override [L]  n=1610 cos0.98 難1.85", "s": 0.554, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.4533386707313951}, {"a": 0, "b": 2, "w": 0.32805021709036497}, {"a": 0, "b": 3, "w": 0.36250605267564395}, {"a": 0, "b": 4, "w": 0.31253474199686015}, {"a": 0, "b": 5, "w": 0.3218815091102317}, {"a": 0, "b": 6, "w": 0.3865197993542173}, {"a": 0, "b": 7, "w": 0.3410058474623652}, {"a": 0, "b": 8, "w": 0.26516083048235917}, {"a": 0, "b": 9, "w": 0.22659545174172013}, {"a": 0, "b": 10, "w": 0.1979133233867103}, {"a": 0, "b": 11, "w": 0.2530729606625449}, {"a": 0, "b": 12, "w": 0.3534956676364386}, {"a": 0, "b": 13, "w": 0.19951777939326032}, {"a": 0, "b": 14, "w": 0.3799603538903712}, {"a": 0, "b": 15, "w": 0.21655146571470063}, {"a": 0, "b": 16, "w": 0.17053592870511214}, {"a": 0, "b": 17, "w": 0.3372389716027474}, {"a": 0, "b": 18, "w": 0.10451682207421642}, {"a": 0, "b": 19, "w": 1.6826318116613947e-11}, {"a": 0, "b": 20, "w": 0.18564252805732384}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.973,hiX=1.002,loY=1.752,hiY=2.154;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
