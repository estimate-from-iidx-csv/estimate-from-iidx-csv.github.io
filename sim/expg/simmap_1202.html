<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">朱と碧のランページ [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": -0.297, "c": "種", "n": "朱と碧のランページ [A]  n=1029 cos1.00 難-0.30", "s": 0.289, "f": 0}, {"x": 0.996, "y": -0.358, "c": "近傍", "n": "我ら完全無敵のアイドル!! [A]  n=1363 cos1.00 難-0.36", "s": 0.383, "f": 0}, {"x": 0.996, "y": -0.413, "c": "近傍", "n": "SHINING☆DANCE [A]  n=1108 cos1.00 難-0.41", "s": 0.311, "f": 0}, {"x": 0.995, "y": -0.295, "c": "近傍", "n": "■□模様 [A]  n=1385 cos0.99 難-0.29", "s": 0.389, "f": 0}, {"x": 0.995, "y": -0.371, "c": "近傍", "n": "アイドル [A]  n=2105 cos0.99 難-0.37", "s": 0.591, "f": 0}, {"x": 0.994, "y": -0.402, "c": "近傍", "n": "THE DETONATOR [H]  n=2218 cos0.99 難-0.40", "s": 0.623, "f": 0}, {"x": 0.996, "y": -0.092, "c": "近傍", "n": "New Lights [A]  n=2834 cos1.00 難-0.09", "s": 0.796, "f": 0}, {"x": 0.994, "y": -0.379, "c": "近傍", "n": "My Sweet Bird? [A]  n=1522 cos0.99 難-0.38", "s": 0.427, "f": 0}, {"x": 0.993, "y": -0.299, "c": "近傍", "n": "Fantasia [A]  n=3530 cos0.99 難-0.30", "s": 0.991, "f": 0}, {"x": 0.993, "y": -0.38, "c": "近傍", "n": "get set mind [A]  n=1498 cos0.99 難-0.38", "s": 0.421, "f": 0}, {"x": 0.993, "y": -0.328, "c": "近傍", "n": "Tropical April [H]  n=2578 cos0.99 難-0.33", "s": 0.724, "f": 0}, {"x": 0.995, "y": -0.109, "c": "近傍", "n": "MAX LOVE [A]  n=3135 cos0.99 難-0.11", "s": 0.88, "f": 0}, {"x": 0.995, "y": -0.099, "c": "近傍", "n": "Mighty Cutie [A]  n=946 cos1.00 難-0.10", "s": 0.266, "f": 0}, {"x": 0.995, "y": -0.082, "c": "近傍", "n": "SINOBUZ Fantasy [A]  n=2977 cos0.99 難-0.08", "s": 0.836, "f": 0}, {"x": 0.993, "y": -0.19, "c": "近傍", "n": "Ska-sh All Neurons!! [A]  n=2938 cos0.99 難-0.19", "s": 0.825, "f": 0}, {"x": 0.993, "y": -0.363, "c": "近傍", "n": "LADS [A]  n=1939 cos0.99 難-0.36", "s": 0.545, "f": 0}, {"x": 0.992, "y": -0.347, "c": "近傍", "n": "Kung-fu Empire [H]  n=3010 cos0.99 難-0.35", "s": 0.845, "f": 0}, {"x": 0.997, "y": -0.005, "c": "近傍", "n": "CaptivAte～裁き～(SUBLIME TECHNO MIX) [A]  n=3106 cos1.00 難-0.01", "s": 0.872, "f": 0}, {"x": 0.992, "y": -0.334, "c": "近傍", "n": "ポラリスノウタ [A]  n=1792 cos0.99 難-0.33", "s": 0.503, "f": 0}, {"x": 0.991, "y": -0.329, "c": "近傍", "n": "冬椿 ft. Kanae Asaba [A]  n=3561 cos0.99 難-0.33", "s": 1.0, "f": 0}, {"x": 0.991, "y": -0.341, "c": "近傍", "n": "AGETEKE ONDO [A]  n=1005 cos0.99 難-0.34", "s": 0.282, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.40223958787271863}, {"a": 0, "b": 2, "w": 0.45539279760968976}, {"a": 0, "b": 3, "w": 0.3324289192130694}, {"a": 0, "b": 4, "w": 0.33924753121213247}, {"a": 0, "b": 5, "w": 0.3134400321214593}, {"a": 0, "b": 6, "w": 0.43700677187125603}, {"a": 0, "b": 7, "w": 0.24258130147107393}, {"a": 0, "b": 8, "w": 0.2654341687527644}, {"a": 0, "b": 9, "w": 0.2656023395467251}, {"a": 0, "b": 10, "w": 0.24922785610216913}, {"a": 0, "b": 11, "w": 0.2839486278439005}, {"a": 0, "b": 12, "w": 0.30632606143361796}, {"a": 0, "b": 13, "w": 0.356995563184322}, {"a": 0, "b": 14, "w": 0.16088655041523736}, {"a": 0, "b": 15, "w": 0.18459355492737095}, {"a": 0, "b": 16, "w": 0.17903938980267764}, {"a": 0, "b": 17, "w": 0.526276114545751}, {"a": 0, "b": 18, "w": 0.1796518144380731}, {"a": 0, "b": 19, "w": 6.1823768326974e-11}, {"a": 0, "b": 20, "w": 0.04887726199531228}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.990,hiX=1.001,loY=-0.445,hiY=0.027;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
