<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#222}
 #wrap{max-width:1040px;margin:0 auto;padding:12px}
 #tip{position:fixed;pointer-events:none;background:#111;color:#fff;padding:4px 7px;
   border-radius:4px;font-size:12px;opacity:0;transition:opacity .05s;white-space:nowrap;z-index:9}
 .lg{display:inline-block;margin-right:14px;font-size:13px;cursor:pointer;user-select:none}
 .lg.off{opacity:.3}
 .sw{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
</style>
<div id="wrap">
 <h2 style="margin:.2em 0;font-size:16px">Rave Cannon [A] 近傍マップ</h2>
 <div id="legend"></div>
 <div id="plot"></div>
 <p style="color:#666;font-size:12px">選抜=総合類似度√(cos²+β3.0·難²) / 横=cos(右=型近) 縦=HC難易度(s50(実測・必要☆12地力),上=難) / エッジ太=特徴euclid近 / 径=プレー人数(≥500)</p>
</div>
<div id="tip"></div>
<script>
const D=[{"x": 1.0, "y": 0.893, "c": "種", "n": "Rave Cannon [A]  n=3622 cos1.00 難0.89", "s": 0.969, "f": 0}, {"x": 0.996, "y": 0.832, "c": "近傍", "n": "Sirius [A]  n=1785 cos1.00 難0.83", "s": 0.477, "f": 0}, {"x": 0.995, "y": 0.82, "c": "近傍", "n": "RALLY '25 [A]  n=1102 cos0.99 難0.82", "s": 0.295, "f": 0}, {"x": 0.993, "y": 0.943, "c": "近傍", "n": "THUNDERSTRIKE [A]  n=542 cos0.99 難0.94", "s": 0.145, "f": 0}, {"x": 0.994, "y": 1.092, "c": "近傍", "n": "海神 [A]  n=3532 cos0.99 難1.09", "s": 0.945, "f": 0}, {"x": 0.992, "y": 0.82, "c": "近傍", "n": "紫陽花 -AZISAI- [A]  n=3706 cos0.99 難0.82", "s": 0.991, "f": 0}, {"x": 0.995, "y": 1.122, "c": "近傍", "n": "Bring The Fire [A]  n=1405 cos1.00 難1.12", "s": 0.376, "f": 0}, {"x": 0.992, "y": 1.021, "c": "近傍", "n": "電光 [A]  n=1707 cos0.99 難1.02", "s": 0.457, "f": 0}, {"x": 0.992, "y": 1.087, "c": "近傍", "n": "Seven Times Four [A]  n=1327 cos0.99 難1.09", "s": 0.355, "f": 0}, {"x": 0.99, "y": 0.892, "c": "近傍", "n": "Aqvion [A]  n=1146 cos0.99 難0.89", "s": 0.306, "f": 0}, {"x": 0.991, "y": 0.757, "c": "近傍", "n": "Carry Me Away [A]  n=3345 cos0.99 難0.76", "s": 0.895, "f": 0}, {"x": 0.99, "y": 0.79, "c": "近傍", "n": "The Sampling Paradise [A]  n=3739 cos0.99 難0.79", "s": 1.0, "f": 0}, {"x": 0.993, "y": 0.646, "c": "近傍", "n": "Echoes of Sunfall [A]  n=1772 cos0.99 難0.65", "s": 0.474, "f": 0}, {"x": 0.991, "y": 1.057, "c": "近傍", "n": "Friction[!]Function [A]  n=2918 cos0.99 難1.06", "s": 0.78, "f": 0}, {"x": 0.99, "y": 1.046, "c": "近傍", "n": "SOLID STATE SQUAD [A]  n=3576 cos0.99 難1.05", "s": 0.956, "f": 0}, {"x": 0.988, "y": 0.904, "c": "近傍", "n": "表裏一体！？怪盗いいんちょの悩み [A]  n=3622 cos0.99 難0.90", "s": 0.969, "f": 0}, {"x": 0.989, "y": 0.963, "c": "近傍", "n": "ONE AND ONLY [A]  n=2175 cos0.99 難0.96", "s": 0.582, "f": 0}, {"x": 0.988, "y": 0.889, "c": "近傍", "n": "Disco Killer Music Lover [A]  n=1069 cos0.99 難0.89", "s": 0.286, "f": 0}, {"x": 0.991, "y": 0.65, "c": "近傍", "n": "diagram [A]  n=3161 cos0.99 難0.65", "s": 0.845, "f": 0}, {"x": 0.988, "y": 0.823, "c": "近傍", "n": "RED ZONE [L]  n=3556 cos0.99 難0.82", "s": 0.951, "f": 0}, {"x": 0.989, "y": 0.743, "c": "近傍", "n": "COSMIC CYBER [A]  n=2563 cos0.99 難0.74", "s": 0.685, "f": 0}], C={"種": "#e33", "近傍": "#5a9bd4"}, LG=[{"c": "種", "label": "種", "n": 1}, {"c": "近傍", "label": "近傍", "n": 20}], E=[{"a": 0, "b": 1, "w": 0.41055679450901117}, {"a": 0, "b": 2, "w": 0.35564000184370004}, {"a": 0, "b": 3, "w": 0.17085199792991734}, {"a": 0, "b": 4, "w": 0.32470134165512454}, {"a": 0, "b": 5, "w": 0.15021423989457627}, {"a": 0, "b": 6, "w": 0.34450744242783493}, {"a": 0, "b": 7, "w": 0.1652466728960843}, {"a": 0, "b": 8, "w": 0.20703421723135185}, {"a": 0, "b": 9, "w": 0.03574884258953559}, {"a": 0, "b": 10, "w": 0.13507069226715518}, {"a": 0, "b": 11, "w": 0.10301989900120545}, {"a": 0, "b": 12, "w": 0.20965922530369796}, {"a": 0, "b": 13, "w": 0.1151374472621205}, {"a": 0, "b": 14, "w": 0.031671569468749716}, {"a": 0, "b": 15, "w": 0.03462666950787163}, {"a": 0, "b": 16, "w": 0.03246443458969228}, {"a": 0, "b": 17, "w": 0.020503957326634237}, {"a": 0, "b": 18, "w": 4.518474483461432e-11}, {"a": 0, "b": 19, "w": 0.03035090691282849}, {"a": 0, "b": 20, "w": 0.02500579913715928}], DIAG=false;
const svg=document.getElementById("plot"),tip=document.getElementById("tip");
const W=1000,H=720,M=56;
const loX=0.987,hiX=1.001,loY=0.608,hiY=1.160;
const X=v=>M+(v-loX)/(hiX-loX)*(W-2*M), Y=v=>H-M-(v-loY)/(hiY-loY)*(H-2*M);
const d0=Math.max(loX,loY),d1=Math.min(hiX,hiY);
const hasSize=D.some(d=>d.s>0);
const off={};
function draw(){
 let g=`<line x1=${M} y1=${H-M} x2=${W-M} y2=${H-M} stroke="#999"/>`+
  `<line x1=${M} y1=${M} x2=${M} y2=${H-M} stroke="#999"/>`+
  (DIAG?`<line x1=${X(d0)} y1=${Y(d0)} x2=${X(d1)} y2=${Y(d1)} stroke="#ccc" stroke-dasharray="4 4"/>`:``)+
  `<text x=${W/2} y=${H-16} text-anchor="middle" font-size=13>コサイン類似度(右=型が近い)</text>`+
  `<text transform="translate(16,${H/2}) rotate(-90)" text-anchor="middle" font-size=13>HC難易度 s50(必要☆12地力,上=難)</text>`;
 for(const e of E){const a=D[e.a],b=D[e.b]; if(off[a.c]||off[b.c])continue;
   g+=`<line x1=${X(a.x).toFixed(1)} y1=${Y(a.y).toFixed(1)} x2=${X(b.x).toFixed(1)} y2=${Y(b.y).toFixed(1)} stroke="#5a6" stroke-opacity="0.45" stroke-width="${(0.5+e.w*6).toFixed(1)}"/>`;}
 for(let i=0;i<D.length;i++){const d=D[i]; if(off[d.c])continue;
   const col=C[d.c]||"#888", cx=X(d.x).toFixed(1), cy=Y(d.y).toFixed(1);
   const r=(hasSize?2+Math.sqrt(d.s)*9:3.4).toFixed(1);
   g+=`<circle cx=${cx} cy=${cy} r=${r} fill="${col}" fill-opacity=${d.f?0.15:0.5} stroke="none" data-i="${i}"/>`;}
 // div に <svg> ラッパごと innerHTML する(svg要素へ直接 innerHTML は namespace 未適用で描画されない環境がある)
 svg.innerHTML=`<svg width="${W}" height="${H}" style="max-width:100%">${g}</svg>`;
}
draw();
document.getElementById("legend").innerHTML=LG.map(l=>
  `<span class=lg data-c="${l.c}"><span class=sw style="background:${C[l.c]||'#888'}"></span>${l.label} (${l.n})</span>`).join("")+
  `<span class=lg style="cursor:default">計${D.length}</span>`;
document.getElementById("legend").addEventListener("click",e=>{
  const s=e.target.closest(".lg"); if(!s||!s.dataset.c)return;
  off[s.dataset.c]=!off[s.dataset.c]; s.classList.toggle("off"); draw();});
svg.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i){const d=D[+t.dataset.i];
    tip.style.opacity=1;tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";
    tip.textContent=`${d.n}  (${d.x}, ${d.y})`;}
  else tip.style.opacity=0;});
svg.addEventListener("mouseleave",()=>tip.style.opacity=0);
</script>
